<style>
:root{
  --navy:#0F1F3D;--navy-l:#1E3A6E;--steel:#1E4080;
  --gold:#F5A623;--gold-l:#FBBF45;
  --white:#fff;--off:#F7F9FC;
  --g50:#F0F4FA;--g100:#E8ECF2;--g200:#CDD5E0;--g400:#8494AA;--g600:#4A5568;--g800:#1A2535;
  --ok:#22C55E;--err:#EF4444;
  --shadow:0 4px 16px rgba(15,31,61,.12);--r:10px;--rl:16px;
  font-family:'Inter',-apple-system,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--off);color:var(--g800);font-size:14px;line-height:1.6;min-height:100vh}
#app{min-height:100vh}

/* Layout */
.layout{display:flex;min-height:100vh}
.sidebar{width:230px;height:100vh;background:var(--navy);display:flex;flex-direction:column;position:fixed;top:0;left:0;z-index:100;overflow:hidden}
.main{margin-left:230px;flex:1;display:flex;flex-direction:column;min-height:100vh}
.topbar{height:60px;background:var(--white);border-bottom:1px solid var(--g100);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:50;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.page{padding:24px;flex:1}

/* Sidebar */
.s-logo{padding:18px 18px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.s-logo h1{color:#fff;font-size:17px;font-weight:800;line-height:1.2}
.s-logo span{color:var(--gold)}
.s-logo p{color:rgba(255,255,255,.35);font-size:11px;margin-top:2px}
.s-logo-img{width:auto;max-width:100%;max-height:48px;object-fit:contain;display:block;}
.s-logo-img-wrap{background:#ffffff;border-radius:10px;padding:8px 10px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:10px;box-shadow:0 1px 6px rgba(0,0,0,.18);max-width:100%;}
.logo-upload-area{border:2px dashed rgba(255,255,255,.2);border-radius:10px;padding:14px;text-align:center;cursor:pointer;transition:all .15s;background:rgba(255,255,255,.04);margin-top:10px}
.logo-upload-area:hover{border-color:var(--gold);background:rgba(245,166,35,.06)}
.s-nav{padding:14px 10px;flex:1;overflow-y:auto}
.s-nav::-webkit-scrollbar{width:3px}
.s-nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:2px}
.s-sec{color:rgba(255,255,255,.3);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;padding:14px 10px 5px}
.nav-btn{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:8px;color:rgba(255,255,255,.6);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;border:none;background:none;width:100%;text-align:left;margin-bottom:2px;font-family:inherit}
.nav-btn:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-btn.active{background:var(--gold);color:var(--navy);font-weight:700}
.s-foot{padding:14px 10px;border-top:1px solid rgba(255,255,255,.08)}
.u-pill{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:8px;background:rgba(255,255,255,.06)}
.u-av{width:30px;height:30px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:var(--navy);flex-shrink:0}
.u-nm{color:#fff;font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.u-rl{color:rgba(255,255,255,.35);font-size:11px}
.lo-btn{display:flex;align-items:center;gap:8px;padding:8px 11px;border-radius:8px;color:rgba(255,255,255,.4);font-size:12px;cursor:pointer;border:none;background:none;width:100%;margin-top:6px;transition:all .15s;font-family:inherit}
.lo-btn:hover{background:rgba(239,68,68,.15);color:var(--err)}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border:none;border-radius:var(--r);font-size:13px;font-weight:600;cursor:pointer;transition:all .17s;white-space:nowrap;font-family:inherit}
.bp{background:var(--gold);color:var(--navy)}.bp:hover{background:var(--gold-l);transform:translateY(-1px);box-shadow:var(--shadow)}
.bs{background:var(--navy);color:#fff}.bs:hover{background:var(--navy-l);transform:translateY(-1px)}
.bo{background:transparent;border:1.5px solid var(--g200);color:var(--g600)}.bo:hover{border-color:var(--steel);color:var(--steel);background:var(--g50)}
.bd{background:var(--err);color:#fff}.bd:hover{background:#dc2626}
.bsm{padding:5px 11px;font-size:12px}.bic{padding:6px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}

/* Forms */
.fg{margin-bottom:14px}
.lbl{display:block;font-size:11px;font-weight:700;color:var(--g600);margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em}
.inp{width:100%;padding:9px 13px;border:1.5px solid var(--g200);border-radius:var(--r);font-size:14px;color:var(--g800);background:#fff;transition:border-color .15s;font-family:inherit;outline:none}
.inp:focus{border-color:var(--steel);box-shadow:0 0 0 3px rgba(30,64,128,.08)}
.inp::placeholder{color:var(--g400)}
select.inp{cursor:pointer}
textarea.inp{resize:vertical;min-height:70px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* Cards/stats */
.card{background:#fff;border-radius:var(--rl);border:1px solid var(--g100);box-shadow:0 1px 3px rgba(15,31,61,.07)}
.card-h{padding:16px 20px;border-bottom:1px solid var(--g100);display:flex;align-items:center;justify-content:space-between}
.card-h h3{font-size:14px;font-weight:700;color:var(--navy)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:24px}
.stat{background:#fff;border-radius:var(--rl);padding:18px;border:1px solid var(--g100);box-shadow:0 1px 3px rgba(15,31,61,.07)}
.sv{font-size:30px;font-weight:800;color:var(--navy);line-height:1}
.sl{font-size:12px;color:var(--g400);margin-top:3px;font-weight:500}
.si{font-size:22px;margin-bottom:8px}

/* Table */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{background:var(--g50);color:var(--g600);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:11px 14px;text-align:left}
td{padding:12px 14px;border-bottom:1px solid var(--g100);font-size:13px}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--g50)}
/* Compact table variant */
.table-compact th{padding:6px 8px;font-size:10px}
.table-compact td{padding:4px 8px;border-bottom:1px solid var(--g100);font-size:12px}
.table-compact tr:hover td{background:var(--g50)}

/* Badge */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
.bg{background:rgba(245,166,35,.12);color:#B7791F}
.bb{background:rgba(30,64,128,.1);color:var(--steel)}
.bk{background:rgba(34,197,94,.1);color:#16a34a}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(10,20,40,.55);display:flex;align-items:center;justify-content:center;z-index:999;backdrop-filter:blur(4px);padding:20px}
.modal{background:#fff;border-radius:var(--rl);width:100%;max-width:500px;max-height:90vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.25);animation:su .2s ease}
.mh{padding:20px 22px 16px;border-bottom:1px solid var(--g100);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:1}
.mh h3{font-size:16px;font-weight:800;color:var(--navy)}
.mb{padding:22px}
.mf{padding:14px 22px;border-top:1px solid var(--g100);display:flex;gap:10px;justify-content:flex-end}
@keyframes su{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

/* Toasts */
#toasts{position:fixed;bottom:22px;right:22px;z-index:9999;display:flex;flex-direction:column;gap:7px}
.toast{display:flex;align-items:center;gap:9px;padding:11px 16px;border-radius:var(--r);background:var(--navy);color:#fff;font-size:13px;font-weight:500;box-shadow:var(--shadow);animation:si .2s ease;min-width:220px}
.tok{border-left:4px solid var(--ok)}.ter{border-left:4px solid var(--err)}.tin{border-left:4px solid var(--gold)}
@keyframes si{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}

/* Login */
.login-page{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--navy) 0%,var(--steel) 60%,#1a4d8f 100%);padding:24px}
.lp-brand{text-align:center;margin-bottom:40px}
.lp-brand h1{font-size:32px;font-weight:900;color:#fff;line-height:1.2;letter-spacing:-.5px}
.lp-brand span{color:var(--gold)}
.lp-brand p{color:rgba(255,255,255,.45);font-size:13px;margin-top:6px}
.lp-cards{display:flex;gap:20px;width:100%;max-width:620px;align-items:stretch}
/* View card — full opacity, prominent */
.lp-card{border-radius:20px;padding:36px 28px;display:flex;flex-direction:column;align-items:center;text-align:center;cursor:pointer;transition:all .2s;text-decoration:none;flex:1}
.lp-card-view{background:rgba(255,255,255,1);box-shadow:0 12px 40px rgba(0,0,0,.25)}
.lp-card-view:hover{transform:translateY(-4px);box-shadow:0 20px 50px rgba(0,0,0,.3)}
/* Login card — faded/muted */
.lp-card-login{background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.18);opacity:.7}
.lp-card-login:hover{opacity:1;background:rgba(255,255,255,.18);transform:translateY(-2px)}
.lp-icon{width:18px;height:18px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;margin-bottom:8px}
.lp-icon-view{background:linear-gradient(135deg,#e8f5e9,#c8e6c9)}
.lp-icon-login{background:rgba(255,255,255,.15)}
.lp-card-title{font-size:16px;font-weight:800;margin-bottom:6px}
.lp-card-view .lp-card-title{color:var(--navy)}
.lp-card-login .lp-card-title{color:#fff}
.lp-card-desc{font-size:12px;line-height:1.6;margin-bottom:20px}
.lp-card-view .lp-card-desc{color:var(--g400)}
.lp-card-login .lp-card-desc{color:rgba(255,255,255,.55)}
.lp-badge{display:inline-block;font-size:11px;font-weight:700;padding:4px 12px;border-radius:20px;letter-spacing:.03em}
.lp-badge-view{background:rgba(34,197,94,.12);color:#16a34a}
.lp-badge-login{background:rgba(255,255,255,.15);color:rgba(255,255,255,.7)}
/* Login form — slides in below the cards */
.lp-form-wrap{width:100%;max-width:380px;background:rgba(255,255,255,1);border-radius:20px;padding:28px 32px;box-shadow:0 12px 40px rgba(0,0,0,.2);display:none;animation:su .25s ease}
.lp-form-wrap.show{display:block}
.lp-cards.hidden{display:none}
.lp-back{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--g400);cursor:pointer;border:none;background:none;font-family:inherit;margin-bottom:16px;padding:0}
.lp-back:hover{color:var(--navy)}
@media(max-width:580px){.lp-cards{flex-direction:column;max-width:340px}.lp-card{padding:28px 20px}.sidebar{width:190px}.main{margin-left:190px}}

/* Org chart */
.org-wrap{overflow:auto;background:#fff;border-radius:var(--rl);border:1px solid var(--g100);min-height:380px}
.org-canvas{display:inline-flex;min-width:100%;justify-content:center;padding:44px 36px;transform-origin:top center;transition:transform .2s}
.org-tb{display:flex;align-items:center;gap:8px;padding:11px 14px;background:#fff;border-radius:var(--rl);border:1px solid var(--g100);margin-bottom:14px;flex-wrap:wrap}
.org-t{font-size:13px;font-weight:700;color:var(--navy);flex:1}
.onode{display:flex;flex-direction:column;align-items:center;position:relative}
.ocard{background:#fff;border:2px solid var(--g200);border-radius:12px;padding:13px 14px;width:168px;cursor:pointer;transition:all .2s;text-align:center;box-shadow:0 1px 4px rgba(15,31,61,.08);position:relative}
.ocard:hover{border-color:var(--steel);box-shadow:var(--shadow);transform:translateY(-2px)}
.ocard.root-card{border-color:var(--gold);background:var(--navy)}
.ocard.root-card .oname{color:#fff}
.ocard.root-card .odesig{color:rgba(255,255,255,.55)}
.oav{width:50px;height:50px;border-radius:50%;object-fit:cover;margin:0 auto 7px;display:block;border:2px solid var(--g100)}
.oavph{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,var(--steel),var(--navy));margin:0 auto 7px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:700}
.oname{font-size:11px;font-weight:700;color:var(--navy);line-height:1.3}
.odesig{font-size:10px;color:var(--g400);margin-top:2px;font-weight:500}
.oplant{font-size:9px;color:var(--gold);margin-top:3px;font-weight:600}
.odept{font-size:9px;color:var(--steel);margin-top:2px;font-weight:600}
.ocode{font-size:9px;color:var(--g400);margin-top:1px}
.ocol{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);width:16px;height:16px;border-radius:50%;border:1.5px solid var(--g200);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:8px;color:var(--g400);transition:all .15s;z-index:5;font-family:inherit}
.ocol:hover{border-color:var(--steel);color:var(--steel)}
/* Connector lines */
.conn-v{width:2px;background:var(--g200);margin:0 auto}
.ochildren{display:flex;gap:0;position:relative;align-items:flex-start}

/*
  Each child column wrapper:
  - Has a top border (horizontal segment of the T)
  - Contains a vertical drop line + the child node
  The trick: the horizontal line sits at top:0 of each ochild-wrap.
  The vertical conn-v inside it must start RIGHT at that horizontal line.
  We remove the inner conn-v and use ::after on ochild-wrap instead.
*/
.ochild-wrap{
  display:flex;
  flex-direction:column;
  align-items:center;
  position:relative;
  padding:0 5px; /* replaces gap on ochildren */
}
/* Horizontal segment across full width of each child slot */
.ochild-wrap::before{
  content:'';
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:2px;
  background:var(--g200);
}
/* First child: horizontal line starts at its own center → right */
.ochild-wrap[data-first="true"]::before{ left:50%; }
/* Last child: horizontal line runs left → its own center */
.ochild-wrap[data-last="true"]::before{ right:50%; }
/* Single child: no horizontal line */
.ochild-wrap[data-only="true"]::before{ display:none; }

/* Vertical drop from the horizontal bar down to the card */
.ochild-wrap::after{
  content:'';
  position:absolute;
  top:0;
  left:50%;
  transform:translateX(-50%);
  width:2px;
  height:16px; /* matches conn-drop height */
  background:var(--g200);
}
/* Single child vertical still needed */
.ochild-wrap[data-only="true"]::after{ height:16px; }

/* Progress bar — bottom toast style, no background dim */
.progress-overlay{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:9998;width:380px;max-width:calc(100vw - 32px)}
.progress-box{background:var(--navy);border-radius:var(--rl);padding:16px 20px;box-shadow:0 8px 32px rgba(0,0,0,.35);animation:si .2s ease}
.progress-title{font-size:13px;font-weight:700;color:#fff;margin-bottom:2px}
.progress-sub{font-size:11px;color:rgba(255,255,255,.5);margin-bottom:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progress-track{height:6px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden;margin-bottom:6px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--steel),var(--gold));border-radius:3px;transition:width .2s ease;width:0%}
.progress-label{font-size:11px;color:rgba(255,255,255,.45);text-align:right;font-weight:600}

/* Photo upload */
.photo-area{border:2px dashed var(--g200);border-radius:var(--r);padding:18px;text-align:center;cursor:pointer;transition:all .15s;background:var(--g50);margin-bottom:14px}
.photo-area:hover{border-color:var(--steel);background:rgba(30,64,128,.03)}
.photo-prev{width:72px;height:72px;border-radius:50%;object-fit:cover;margin:0 auto 6px;display:block}

/* Empty */
.empty{text-align:center;padding:50px 20px;color:var(--g400)}
.ei{font-size:42px;margin-bottom:10px}
.empty h3{font-size:15px;font-weight:600;color:var(--g600);margin-bottom:5px}

/* Detail popup */
.detail-pop{background:#fff;border-radius:var(--rl);max-width:360px;width:100%;padding:28px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.25);animation:su .2s ease}
.dp-av{width:76px;height:76px;border-radius:50%;object-fit:cover;margin:0 auto 12px;display:block;border:3px solid var(--g100)}
.dp-avph{width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,var(--steel),var(--navy));margin:0 auto 12px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px;font-weight:700}
.dp-name{font-size:18px;font-weight:800;color:var(--navy);margin-bottom:3px}
.dp-des{font-size:13px;color:var(--g400);margin-bottom:14px}
.dp-row{display:flex;align-items:center;gap:10px;padding:9px 13px;background:var(--g50);border-radius:8px;margin-bottom:8px;text-decoration:none;color:var(--g800);font-size:13px}

/* Config banner */
.cfg-banner{background:#fff3cd;border:1px solid #ffc107;border-radius:var(--r);padding:16px 20px;margin-bottom:20px;font-size:13px;line-height:1.7}
.cfg-banner strong{color:#856404}
.cfg-banner code{background:rgba(0,0,0,.07);padding:1px 5px;border-radius:4px;font-family:monospace;font-size:12px}

/* Helpers */
.fl{display:flex}.ac{align-items:center}.jb{justify-content:space-between}.g2h{gap:8px}.g3h{gap:12px}.mb16{margin-bottom:16px}.mt8{margin-top:8px}
.ocard.highlight-card{border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,166,35,.2);}
</style>

function toast(msg, type='in'){

function buildTree(emps){
  if(!emps||!emps.length) return null;
  const map={};
  emps.forEach(e=>{ map[e.id]={...e,children:[]} });
  const roots=[];
  emps.forEach(e=>{
    if(!e.parentId||!map[e.parentId]) roots.push(map[e.id]);
    else map[e.parentId].children.push(map[e.id]);
  });
  if(roots.length===0) return null;
  if(roots.length===1) return roots[0];
  // Multiple roots — wrap in a virtual group node
  return {id:'__virtual_root__',name:'Organisation',designation:'',_isVirtualRoot:true,children:roots};
}

// Fetch user profile with retry + multiple lookup strategies
async function fetchUserProfile(user, attempt=1){
  const MAX=3;
  try{
    // Strategy 1: query by email (most common — works when Firestore index exists)
    const byEmail=await db.collection('mompro_users').where('email','==',user.email).get();
    if(!byEmail.empty){
      const rolePriority=r=>{ const rr=(r||'').trim().toLowerCase(); if(rr.includes('super')) return 3; if(rr.includes('plant')||rr.includes('admin')) return 2; return 1; };
      const docs=byEmail.docs.map(d=>({...d.data(),_docId:d.id})).sort((a,b)=>rolePriority(b.role)-rolePriority(a.role));
      console.log('[OrgChart] Found',docs.length,'doc(s) by email. Role:',docs[0].role);
      return docs[0];
    }

    // Strategy 2: query by uid field (some setups store uid separately)
    const byUid=await db.collection('mompro_users').where('uid','==',user.uid).get();
    if(!byUid.empty){
      console.log('[OrgChart] Found by uid field');
      return byUid.docs[0].data();
    }

    // Strategy 3: direct doc lookup by UID as doc ID (Firebase Auth UID = doc ID pattern)
    const byDocId=await db.collection('mompro_users').doc(user.uid).get();
    if(byDocId.exists){
      console.log('[OrgChart] Found by doc ID = UID');
      return byDocId.data();
    }

    // Strategy 4: case-insensitive email scan (handles email casing mismatch)
    const emailLower=user.email.toLowerCase();
    const allDocs=await db.collection('mompro_users').limit(200).get();
    const match=allDocs.docs.find(d=>(d.data().email||'').toLowerCase()===emailLower);
    if(match){
      console.log('[OrgChart] Found by case-insensitive email scan');
      return match.data();
    }

    console.warn('[OrgChart] No profile found for',user.email,'after all strategies');
    return null;

  }catch(e){
    console.error('[OrgChart] Profile fetch error (attempt '+attempt+'):',e.message);
    if(attempt<MAX){
      // Wait with exponential backoff and retry
      await new Promise(r=>setTimeout(r, attempt*1500));
      return fetchUserProfile(user, attempt+1);
    }
    return null;
  }
}

function bindLogin(){
  // View structure card — activate public view in-page (no redirect needed)
  $('lp-view-card')?.addEventListener('click',()=>{
    S.publicView=true;
    S.loading=false;
    startPublicListeners();
    render();
  });

  // Show form when login card clicked
  $('lp-login-card')?.addEventListener('click',()=>{
    $('lp-cards')?.classList.add('hidden');
    $('lp-brand')?.style.setProperty('margin-bottom','24px');
    $('lp-form-wrap')?.classList.add('show');
    setTimeout(()=>$('li-email')?.focus(),200);
  });
  // Back button — hide form, show cards again
  $('lp-back-btn')?.addEventListener('click',()=>{
    $('lp-form-wrap')?.classList.remove('show');
    $('lp-cards')?.classList.remove('hidden');
    $('li-err') && ($('li-err').style.display='none');
  });
  const doLogin=async()=>{
    const email=$('li-email')?.value.trim(), pass=$('li-pass')?.value;
    if(!email||!pass) return;
    $('li-btn').textContent='Signing in…'; $('li-btn').disabled=true;
    try{ await auth.signInWithEmailAndPassword(email,pass); }
    catch(e){
      $('li-err').style.display='block';
      $('li-err').textContent='Invalid email or password. Please try again.';
      $('li-btn').textContent='Sign In'; $('li-btn').disabled=false;
    }
  };
  $('li-btn')?.addEventListener('click', doLogin);
  $('li-pass')?.addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
}

// Build a tree for a subset of employees (plantEmps or deptEmps)
// but include their full ancestor chain up to the root (from allEmps).
// Ancestors outside the subset are flagged _isContext=true (greyed in card).
function buildTreeWithAncestors(subEmps, allEmps){
  if(!subEmps||!subEmps.length) return null;
  const allMap={};
  allEmps.forEach(e=>{ allMap[e.id]=e; });

  // Collect all ancestors of each sub-employee
  const needed=new Set(subEmps.map(e=>e.id));
  subEmps.forEach(e=>{
    let cur=e;
    while(cur&&cur.parentId&&allMap[cur.parentId]){
      needed.add(cur.parentId);
      cur=allMap[cur.parentId];
    }
  });

  // Build tree from the needed set
  const subIds=new Set(subEmps.map(e=>e.id));
  const map={};
  needed.forEach(id=>{
    const e=allMap[id];
    if(e) map[id]={...e, children:[], _isContext:!subIds.has(id)};
  });

  const roots=[];
  needed.forEach(id=>{
    const node=map[id];
    if(!node) return;
    if(node.parentId&&map[node.parentId]){
      map[node.parentId].children.push(node);
    } else {
      roots.push(node);
    }
  });

  if(roots.length===0) return null;
  if(roots.length===1) return roots[0];
  return {id:'__virtual_root__',name:'Organisation',designation:'',_isVirtualRoot:true,children:roots};
}

// ── Department Chart ─────────────────────────────────────────────
// Builds a virtual tree where the root is the dept header node
// and children are employees in that dept (preserving parent→child links within dept)
function buildDeptTree(deptEmps, allEmps){
  if(!deptEmps||!deptEmps.length) return null;

  // Map by id for quick lookup (only within dept)
  const deptIds=new Set(deptEmps.map(e=>e.id));
  const map={};
  deptEmps.forEach(e=>{ map[e.id]={...e,children:[]}; });

  // Link parent→child only if parent is also in this dept
  deptEmps.forEach(e=>{
    if(e.parentId&&deptIds.has(e.parentId)){
      map[e.parentId].children.push(map[e.id]);
    }
  });

  // Nodes whose parent is outside this dept (or has no parent) are dept-level roots
  const roots=deptEmps
    .filter(e=>!e.parentId||!deptIds.has(e.parentId))
    .map(e=>map[e.id]);

  // Synthesise a virtual dept header node
  const deptName=deptEmps[0]?.dept||'Unknown';
  return {
    id:'__dept__'+deptName,
    name:deptName,
    designation:'Department',
    dept:'',
    _isDeptHeader:true,
    children:roots
  };
}

function getAllNodeIds(node){
  if(!node) return [];
  const ids=[node.id];
  (node.children||[]).forEach(c=>getAllNodeIds(c).forEach(id=>ids.push(id)));
  return ids;
}

function orgNodeHTML(node,isRoot=false){
  const children=node.children||[];
  const has=children.length>0;
  const col=S.collapsed.has(node.id);
  const showPh=S.showPhoto;

  // Virtual root — just render children side by side without a node box
  if(node._isVirtualRoot){
    return `<div style="display:flex;flex-direction:column;align-items:center">
  <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
    ${children.map(c=>`<div style="display:flex;flex-direction:column;align-items:center">${orgNodeHTML(c,true)}</div>`).join('')}
  </div>
</div>`;
  }

  // Dept header node
  if(node._isDeptHeader){
    const childrenHTML=has&&!col?`
    <div class="conn-v" style="height:12px"></div>
    <div class="ochildren">
      ${children.map((c,ci)=>`<div class="ochild-wrap" data-first="${ci===0}" data-last="${ci===children.length-1}" data-only="${children.length===1}">
        <div style="height:16px"></div>${orgNodeHTML(c)}
      </div>`).join('')}
    </div>`:'';
    return `<div class="onode">
  <div style="background:linear-gradient(135deg,var(--steel),var(--navy));border-radius:10px;padding:8px 12px;min-width:100px;text-align:center;box-shadow:var(--shadow);border:2px solid var(--gold);position:relative">
    <div style="font-size:16px;margin-bottom:3px">🏢</div>
    <div style="color:var(--gold);font-size:11px;font-weight:800;line-height:1.3">${node.name}</div>
    <div style="color:rgba(255,255,255,.5);font-size:9px;font-weight:600;margin-top:2px;text-transform:uppercase;letter-spacing:.08em">Department</div>
    <div style="color:rgba(255,255,255,.35);font-size:9px;margin-top:2px">${children.length} member${children.length!==1?'s':''}</div>
    ${has?`<button class="ocol" data-colid="${node.id}" style="border-color:rgba(255,255,255,.2);color:rgba(255,255,255,.6)">${col?'▾':'▴'}</button>`:''}
  </div>
  ${childrenHTML}
</div>`;
  }

  const avSize=isRoot?(showPh?'30px':'0'):(showPh?'26px':'0');
  const avFontSize=isRoot?'12px':'10px';

  // Context nodes = ancestors outside the current plant/dept — shown greyed, no photo
  if(node._isContext){
    const childrenHTML=has&&!col?`
    <div class="conn-v" style="height:12px"></div>
    <div class="ochildren">
      ${children.map((c,ci)=>`<div class="ochild-wrap" data-first="${ci===0}" data-last="${ci===children.length-1}" data-only="${children.length===1}">
        <div style="height:16px"></div>${orgNodeHTML(c)}
      </div>`).join('')}
    </div>`:'';
    return `<div class="onode">
  <div class="ocard" data-pid="${node.id}" style="width:86px;padding:5px 6px 7px;border-style:dashed;opacity:0.6;cursor:default">
    <div style="font-size:8.5px;font-weight:700;color:var(--navy);line-height:1.3;text-align:center;word-break:break-word">${node.name}</div>
    <div style="font-size:7.5px;color:var(--g400);margin-top:1px;text-align:center;font-weight:500">${node.designation}</div>
    ${has?`<button class="ocol" data-colid="${node.id}" style="bottom:-8px;width:15px;height:15px;font-size:7px">${col?'▾':'▴'}</button>`:''}
  </div>
  ${childrenHTML}
</div>`;
  }

  const av=showPh
    ?(node.photoURL
      ?`<img src="${node.photoURL}" style="width:${avSize};height:${avSize};border-radius:50%;object-fit:cover;margin:0 auto 4px;display:block;border:1.5px solid ${genderBorderColor(node.gender)}" onerror="this.style.display='none'">`
      :`<div style="width:${avSize};height:${avSize};border-radius:50%;background:${genderAvBg(node.gender)};margin:0 auto 4px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:${avFontSize};font-weight:700">${ini(node.name)}</div>`)
    :'';

  const childrenHTML=has&&!col?`
    <div class="conn-v" style="height:12px"></div>
    <div class="ochildren">
      ${children.map((c,ci)=>`<div class="ochild-wrap" data-first="${ci===0}" data-last="${ci===children.length-1}" data-only="${children.length===1}">
        <div style="height:16px"></div>${orgNodeHTML(c)}
      </div>`).join('')}
    </div>`:'';

  return `<div class="onode">
  <div class="ocard ${isRoot?'root-card':node._highlight?'highlight-card':''}" data-pid="${node.id}" style="width:${isRoot?'100px':'86px'};padding:${showPh?'7px 6px 9px':'5px 6px 7px'}">
    ${av}
    <div style="font-size:${isRoot?'9px':'8.5px'};font-weight:700;color:${isRoot?'#fff':'var(--navy)'};line-height:1.3;text-align:center;word-break:break-word">${node.name}</div>
    <div style="font-size:7.5px;color:${isRoot?'rgba(255,255,255,.6)':'var(--g400)'};margin-top:1px;text-align:center;font-weight:500;line-height:1.2">${node.designation}</div>
    ${has?`<button class="ocol" data-colid="${node.id}" style="bottom:-8px;width:15px;height:15px;font-size:7px">${col?'▾':'▴'}</button>`:''}
  </div>
  ${childrenHTML}
</div>`;
}

// Plant admin — 3-tab chart view (Group / Plant-wise / Dept-wise)
// Edit permitted only for own plant's employees
function paChartTabsHTML(myPid, myPlant){
  const {plants,employees}=S;
  const paTab=S._paTab||'grp';
  const pid=S._paPltId||(paTab==='plt'?myPid:'');   // plant filter for plt tab
  const did=S._paDept||'';
  const sc=S.chartScale;
  const allDepts=[...new Set(employees.map(e=>e.dept||'').filter(Boolean))].sort();

  // Build tree based on active tab — always with full ancestor chain
  let tree=null, chartTitle='Group Organisation Chart', activeEmps=[];
  if(paTab==='grp'){
    tree=buildTree(employees);
    chartTitle='Group Organisation Chart';
    activeEmps=employees;
  } else if(paTab==='plt'){
    const usePid=pid||myPid||'';
    if(usePid){
      activeEmps=employees.filter(e=>e.plantId===usePid);
      tree=buildTreeWithAncestors(activeEmps,employees);
      const p=plants.find(x=>x.id===usePid);
      chartTitle=(p?.name||'Plant')+' Organisation Chart';
    }
  } else if(paTab==='dpt'){
    if(did){
      activeEmps=employees.filter(e=>(e.dept||'').toLowerCase()===did.toLowerCase());
      tree=buildTreeWithAncestors(activeEmps,employees);
      chartTitle=did+' — Department Chart';
    }
  }

  const search=(S._paSearch||'').toLowerCase().trim();
  if(search&&tree) highlightSearch(tree,search);

  const tabBtn=(id,icon,label)=>`<button id="pa-tab-${id}" style="
    display:inline-flex;align-items:center;gap:6px;padding:9px 18px;
    border:none;border-bottom:3px solid ${paTab===id?'var(--gold)':'transparent'};
    background:none;font-size:13px;font-weight:${paTab===id?'700':'500'};

    transition:all .15s;font-family:inherit;white-space:nowrap"

  >${icon} ${label}</button>`;

  // Pill helpers for PA tab filters
  const paPillsPlant=plants.map(p=>{
    const active=(pid||myPid)===p.id;
    const cnt=employees.filter(e=>e.plantId===p.id).length;
    return `<button id="pa-plant-pill-${p.id}" onclick="S._paPltId='${p.id.replace(/'/g,"\'")}';render()" style="
      display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;
      border:1.5px solid ${active?'var(--steel)':'var(--g200)'};

      🏭 ${p.name}${p.id===myPid?' ★':''} <span style="background:${active?'rgba(255,255,255,.2)':'var(--g100)'};border-radius:10px;padding:1px 5px;font-size:10px;font-weight:700">${cnt}</span>
    </button>`;
  }).join('');
  const paPillsDept=allDepts.map(d=>{
    const cnt=employees.filter(e=>(e.dept||'').toLowerCase()===d.toLowerCase()).length;
    const active=(did||'').toLowerCase()===d.toLowerCase();
    return `<button id="pa-dept-pill-${d}" onclick="S._paDept='${d.replace(/'/g,"\'")}';render()" style="
      display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;
      border:1.5px solid ${active?'var(--gold)':'var(--g200)'};
      background:${active?'var(--navy)':'#fff'};color:${active?'#fff':'var(--g600)'};
      font-size:11px;font-weight:${active?'700':'500'};cursor:pointer;transition:all .15s;white-space:nowrap;font-family:inherit">
      🏢 ${d} <span style="background:${active?'rgba(255,255,255,.2)':'var(--g100)'};border-radius:10px;padding:1px 5px;font-size:10px;font-weight:700">${cnt}</span>
    </button>`;
  }).join('');
  const filterBar=paTab==='plt'
    ?`<div style="display:flex;gap:5px;flex-wrap:wrap;align-items:center"><span style="font-size:10px;font-weight:700;color:var(--g400);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap">Plant:</span>${paPillsPlant||'<span style="font-size:12px;color:var(--g400)">None</span>'}</div>`
    :paTab==='dpt'
    ?`<div style="display:flex;gap:5px;flex-wrap:wrap;align-items:center"><span style="font-size:10px;font-weight:700;color:var(--g400);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap">Dept:</span>${paPillsDept||'<span style="font-size:12px;color:var(--g400)">None</span>'}</div>`
    :'';

  const contextNote=(paTab==='plt'&&(pid||myPid))||(paTab==='dpt'&&did)
    ?`<div style="background:rgba(245,166,35,.08);border:1px solid rgba(245,166,35,.25);border-radius:8px;padding:8px 14px;font-size:11px;color:#92610a;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <span>🔗</span>
        <span>Greyed cards = ancestor chain outside this ${paTab==='plt'?'plant':'department'} (context-only, up to MD level).</span>

    <button class="btn bo bsm bic" id="pa-zr">↺</button>
    <div style="width:1px;height:28px;background:var(--g200);margin:0 2px"></div>
    <button class="btn ${S.showPhoto?'bs':'bo'} bsm" id="pa-toggle-photo">${S.showPhoto?'🖼 Photo: On':'👤 Photo: Off'}</button>
    <button class="btn bo bsm" id="pa-expand-all">⊞ Expand All</button>
    <button class="btn bo bsm" id="pa-collapse-all">⊟ Collapse All</button>
    <div style="width:1px;height:28px;background:var(--g200);margin:0 2px"></div>
    <button class="btn bp bsm" id="pa-pdf">⬇ PDF</button>
    <button class="btn bs bsm" id="pa-xlsx-btn">⬇ Excel</button>
  </div>
</div>

${contextNote?contextNote+'<div style="height:10px"></div>':''}

<!-- Chart area -->
${employees.length===0
  ?`<div class="empty" style="margin-top:40px"><div class="ei">🌳</div><h3>No employees yet</h3></div>`
  : paTab==='plt'&&!(pid||myPid)
    ?`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px">
        ${plants.map(p=>{
          const cnt=employees.filter(e=>e.plantId===p.id).length;
          const isOwn=p.id===myPid;
          return `<div class="card" style="padding:16px 18px;cursor:pointer;transition:all .2s;${isOwn?'border-color:var(--gold);':''}" onmouseover="this.style.boxShadow='var(--shadow)';this.style.transform='translateY(-2px)'" onmouseout="this.style.boxShadow='';this.style.transform=''" onclick="S._paPltId='${p.id}';render()">
            <div style="font-size:20px;margin-bottom:6px">🏭</div>
            <div style="font-size:13px;font-weight:800;color:var(--navy);margin-bottom:3px">${p.name}${isOwn?` <span style="font-size:9px;background:rgba(245,166,35,.15);color:#B7791F;padding:1px 6px;border-radius:10px;font-weight:700">MY PLANT</span>`:''}</div>
            ${p.location?`<div style="font-size:11px;color:var(--g400);margin-bottom:5px">📍 ${p.location}</div>`:''}
            <span class="badge bb">${cnt} employee${cnt!==1?'s':''}</span>
          </div>`;
        }).join('')}
      </div>`
    : paTab==='dpt'&&!did
      ?`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px">
          ${allDepts.length===0
            ?`<div class="empty" style="grid-column:1/-1"><div class="ei">🏢</div><h3>No departments found</h3></div>`
            :allDepts.map(d=>{
                const cnt=employees.filter(e=>(e.dept||'').toLowerCase()===d.toLowerCase()).length;
                const dplants=[...new Set(employees.filter(e=>(e.dept||'').toLowerCase()===d.toLowerCase()).map(e=>e.plant).filter(Boolean))];
                return `<div class="card" style="padding:16px 18px;cursor:pointer;transition:all .2s" onmouseover="this.style.boxShadow='var(--shadow)';this.style.transform='translateY(-2px)'" onmouseout="this.style.boxShadow='';this.style.transform=''" onclick="S._paDept='${d.replace(/'/g,"\'")}';render()">

function highlightSearch(node, search){
  // mark nodes matching search
  const matches=name=>name&&name.toLowerCase().includes(search);
  node._highlight=matches(node.name)||matches(node.designation)||matches(node.dept)||matches(node.empCode);
  (node.children||[]).forEach(c=>highlightSearch(c,search));
}

function bindPublicView(){
  // detail overlay close
  $('det-overlay')?.addEventListener('click',e=>{ if(e.target.id==='det-overlay'){ S.detailPerson=null; render(); }});
  $('det-close')?.addEventListener('click',()=>{ S.detailPerson=null; render(); });
  $('det-close-btn')?.addEventListener('click',()=>{ S.detailPerson=null; render(); });

  // Tab switching
  ['grp','plt','dpt'].forEach(id=>{
    document.getElementById(`pub-tab-${id}`)?.addEventListener('click',()=>{
      S._pubTab=id;
      // reset sub-filters on tab change
      if(id==='grp'){ S.plantChartId=''; S._pubDept=''; }
      else if(id==='plt'){ S._pubDept=''; }
      else if(id==='dpt'){ S.plantChartId=''; }
      S._pubSearch='';
      S.collapsed=new Set();
      render();
    });
  });

  // org card clicks
  document.querySelectorAll('[data-pid]').forEach(card=>{
    card.addEventListener('click',e=>{
      if(e.target.classList.contains('ocol')||e.target.closest?.('.ocol')) return;
      S.detailPerson=S.employees.find(x=>x.id===card.dataset.pid)||null;
      render();
    });
  });
  // collapse individual
  document.querySelectorAll('[data-colid]').forEach(btn=>{
    btn.addEventListener('click',e=>{
      e.stopPropagation();
      const id=btn.dataset.colid;
      S.collapsed.has(id)?S.collapsed.delete(id):S.collapsed.add(id);
      render();
    });
  });

  // pub-plant-filter / pub-dept-filter removed — now pill buttons

  // search — update state immediately on every keystroke, restore focus after render
  $('pub-search')?.addEventListener('input',e=>{
    const val=e.target.value;
    const pos=e.target.selectionStart;
    S._pubSearch=val;
    render();
    // restore focus + cursor position after render rebuilds the DOM
    const inp=$('pub-search');
    if(inp){ inp.focus(); try{ inp.setSelectionRange(pos,pos); }catch(_){} }
  });

  // zoom
  $('pub-zi')?.addEventListener('click',()=>{ S.chartScale=Math.min(S.chartScale+0.1,2.5); render(); });
  $('pub-zo')?.addEventListener('click',()=>{ S.chartScale=Math.max(S.chartScale-0.1,0.3); render(); });
  $('pub-zr')?.addEventListener('click',()=>{ S.chartScale=1; render(); });
  $('pub-expand-all')?.addEventListener('click',()=>{ S.collapsed.clear(); render(); });
  $('pub-collapse-all')?.addEventListener('click',()=>{ document.querySelectorAll('[data-colid]').forEach(btn=>S.collapsed.add(btn.dataset.colid)); render(); });
  $('pub-toggle-photo')?.addEventListener('click',()=>{ S.showPhoto=!S.showPhoto; render(); });

  // PDF export
  $('pub-pdf')?.addEventListener('click',async()=>{
    const canvas=$('pub-canvas'); if(!canvas) return;
    const btn=$('pub-pdf'); btn.textContent='Exporting…'; btn.disabled=true;
    try{
      const pubTab=S._pubTab||'grp';
      let subtitle='Group Organisation Chart';
      if(pubTab==='plt'&&S.plantChartId){
        const plant=S.plants.find(p=>p.id===S.plantChartId);
        subtitle=(plant?.name||'Plant')+' — Organisation Chart';
      } else if(pubTab==='dpt'&&S._pubDept){
        subtitle=S._pubDept+' — Department Chart';
      }
      const companyName=S.companyName||'OrgChart';
      const fname=`${companyName.replace(/\s+/g,'_')}_${subtitle.replace(/[^a-zA-Z0-9]/g,'_')}_${new Date().toLocaleDateString('en-IN').replace(/\//g,'-')}.pdf`;
      await buildPDF(canvas, fname, subtitle);
      toast('PDF exported','ok');
    } catch(e){ toast('Export failed','er'); }
    btn.textContent='⬇ PDF'; btn.disabled=false;
  });

  // Excel export — routes to correct export key based on active tab
  $('pub-xlsx')?.addEventListener('click',()=>{
    const pubTab=S._pubTab||'grp';
    if(pubTab==='plt') exportXLSX('plt');
    else if(pubTab==='dpt') exportXLSX('dpt');
    else exportXLSX('grp');
  });
}

function detailOverlayHTML(){
  const p=S.detailPerson;

             : p.gender==='other'  ? 'linear-gradient(135deg,#4C1D95,#7C3AED)'
             : p.gender==='male'   ? 'linear-gradient(135deg,#0F1F3D,#1E4080)'
             :                       'linear-gradient(135deg,var(--navy),var(--steel))';
  const gAvBg = p.gender==='female' ? 'linear-gradient(135deg,#BE185D,#9D174D)'
              : p.gender==='other'  ? 'linear-gradient(135deg,#7C3AED,#4C1D95)'
              : p.gender==='male'   ? 'linear-gradient(135deg,#1E4080,#0F1F3D)'
              :                       'linear-gradient(135deg,var(--steel),var(--navy))';
  const av=p.photoURL
    ?`<img src="${p.photoURL}" style="width:64px;height:64px;border-radius:50%;object-fit:cover;border:3px solid rgba(255,255,255,.3);display:block;margin:0 auto 10px">`
    :`<div style="width:64px;height:64px;border-radius:50%;background:${gAvBg};display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;font-weight:800;margin:0 auto 10px;border:3px solid rgba(255,255,255,.25)">${ini(p.name)}</div>`;

  const reportsTo=S.employees.find(e=>e.id===p.parentId);
  // Find direct reports
  const reports=S.employees.filter(e=>e.parentId===p.id);

  const canEdit=S.profile&&(
    S.profile.role==='super-admin'||
    (S.profile.role==='plant-admin'&&p.plantId===S.profile.plantId)

  const canView=S.profile&&(S.profile.role==='super-admin'||S.profile.role==='plant-admin');
  return `<div class="overlay" id="det-overlay">

      <div style="color:#fff;font-size:15px;font-weight:800;line-height:1.2">${p.name}</div>
      <div style="color:rgba(255,255,255,.65);font-size:12px;margin-top:3px">${p.designation}</div>
      ${p.dept?`<div style="margin-top:6px"><span style="background:rgba(245,166,35,.25);color:var(--gold);font-size:10px;font-weight:700;padding:2px 10px;border-radius:20px">${p.dept}</span></div>`:''}
      ${p.gender?`<div style="margin-top:6px"><span style="background:rgba(255,255,255,.22);border:1.5px solid rgba(255,255,255,.4);color:#fff;font-size:11px;font-weight:700;padding:3px 14px;border-radius:20px;display:inline-flex;align-items:center;gap:5px;letter-spacing:.02em">${p.gender==='female'?'♀ Female':p.gender==='other'?'⚧ Other':'♂ Male'}</span></div>`:''}
    </div>

    <!-- Info rows -->
    <div style="padding:14px 16px">
      ${p.empCode?`<div style="display:flex;align-items:center;gap:10px;padding:7px 10px;background:var(--g50);border-radius:8px;margin-bottom:6px;font-size:12px">
        <span style="font-size:14px">🪪</span>
        <span style="color:var(--g400);flex:1">Employee Code</span>
        <span style="font-weight:700;color:var(--navy)">${p.empCode}</span>
      </div>`:''}
      ${p.plant?`<div style="display:flex;align-items:center;gap:10px;padding:7px 10px;background:var(--g50);border-radius:8px;margin-bottom:6px;font-size:12px">
        <span style="font-size:14px">🏭</span>
        <span style="color:var(--g400);flex:1">Plant</span>
        <span class="badge bg" style="font-size:10px">${p.plant}</span>

        <span style="color:var(--g400);flex:1">Reports To</span>

          ${reportsTo.gender?`<span style="display:inline-block;margin-left:5px;background:${reportsTo.gender==='female'?'#BE185D':reportsTo.gender==='other'?'#7C3AED':'#2563EB'};color:#fff;font-size:9px;font-weight:700;padding:1px 7px;border-radius:20px">${reportsTo.gender==='female'?'♀':reportsTo.gender==='other'?'⚧':'♂'} ${reportsTo.gender.charAt(0).toUpperCase()+reportsTo.gender.slice(1)}</span>`:''}

      ${reports.length?`<div style="display:flex;align-items:center;gap:10px;padding:7px 10px;background:var(--g50);border-radius:8px;margin-bottom:6px;font-size:12px">
        <span style="font-size:14px">👥</span>
        <span style="color:var(--g400);flex:1">Direct Reports</span>
        <span style="font-weight:700;color:var(--navy)">${reports.length}</span>
      </div>`:''}
      ${p.email?`<a href="mailto:${p.email}" style="display:flex;align-items:center;gap:10px;padding:7px 10px;background:var(--g50);border-radius:8px;margin-bottom:6px;font-size:12px;text-decoration:none;color:var(--g800)">

        <span style="color:var(--steel);font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.email}</span>

      ${p.contact?`<a href="tel:${p.contact}" style="display:flex;align-items:center;gap:10px;padding:7px 10px;background:var(--g50);border-radius:8px;margin-bottom:6px;font-size:12px;text-decoration:none;color:var(--g800)">

        <span style="color:var(--steel);font-weight:500;flex:1">${p.contact}</span>

          <button class="btn bo bsm" id="det-close-btn" style="flex:1;justify-content:center">Close</button>
        </div>`
      :canView
      ?`<div style="padding:0 16px 16px;display:flex;flex-direction:column;gap:6px">
          <div style="font-size:11px;color:var(--g400);text-align:center;padding:4px 0">👁 View only — this employee belongs to another plant</div>
          <button class="btn bo bsm" id="det-close-btn" style="width:100%;justify-content:center">Close</button>
        </div>`
      :`<div style="padding:0 16px 16px">
          <button class="btn bo bsm" id="det-close-btn" style="width:100%;justify-content:center">Close</button>
        </div>`
    }

  </div>
</div>`;
}

// Male: navy/steel blue  Female: rose/pink  Other/unset: slate purple
function genderAvBg(gender){
  if(gender==='female') return 'linear-gradient(135deg,#BE185D,#9D174D)';
  if(gender==='male')   return 'linear-gradient(135deg,#1E4080,#0F1F3D)';
  if(gender==='other')  return 'linear-gradient(135deg,#6D28D9,#4C1D95)';
  return 'linear-gradient(135deg,#475569,#1E293B)'; // no gender set
}
function genderBorderColor(gender){
  if(gender==='female') return '#FBCFE8'; // pink-200
  if(gender==='male')   return '#BFDBFE'; // blue-200
  if(gender==='other')  return '#DDD6FE'; // violet-200
  return 'var(--g100)';
}

function avatarThumb(e){
  return e.photoURL
    ?`<img src="${e.photoURL}" style="width:30px;height:30px;border-radius:50%;object-fit:cover;flex-shrink:0;border:2px solid ${genderBorderColor(e.gender)}">`
    :`<div style="width:30px;height:30px;border-radius:50%;background:${genderAvBg(e.gender)};display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;flex-shrink:0">${ini(e.name)}</div>`;
}
function avatarThumbSm(e){
  return e.photoURL
    ?`<img src="${e.photoURL}" style="width:22px;height:22px;border-radius:50%;object-fit:cover;flex-shrink:0;border:1.5px solid ${genderBorderColor(e.gender)}">`
    :`<div style="width:22px;height:22px;border-radius:50%;background:${genderAvBg(e.gender)};display:flex;align-items:center;justify-content:center;color:#fff;font-size:9px;font-weight:700;flex-shrink:0">${ini(e.name)}</div>`;
}
function noData(cols,icon='',h='',p=''){
  return `<tr><td colspan="${cols}"><div class="empty">${icon?`<div class="ei">${icon}</div>`:''}${h?`<h3>${h}</h3>`:''}${p?`<p style="font-size:12px">${p}</p>`:''}</div></td></tr>`;
}

// ════════════════════════════════════════════════════════════════
//  EVENT BINDING
// ════════════════════════════════════════════════════════════════
function bindAll(){
  // nav
  document.querySelectorAll('[data-tab]').forEach(btn=>{
    btn.addEventListener('click',()=>{ S.tab=btn.dataset.tab; S._saSearch=''; render(); });
  });
  // logout — both sidebar and topbar buttons
  $('lo-btn')?.addEventListener('click',()=>auth.signOut());
  $('topbar-signout-btn')?.addEventListener('click',()=>auth.signOut());
  // change password
  $('chpw-btn')?.addEventListener('click',()=>{ S.modal={type:'changePassword'}; render(); bindChangePassword(); });

  // org card click → detail
  document.querySelectorAll('[data-pid]').forEach(card=>{
    card.addEventListener('click',e=>{
      if(e.target.classList.contains('ocol')||e.target.closest?.('.ocol')) return;
      S.detailPerson=S.employees.find(x=>x.id===card.dataset.pid)||null;
      render();
    });
  });
  // collapse/expand individual
  document.querySelectorAll('[data-colid]').forEach(btn=>{
    btn.addEventListener('click',e=>{
      e.stopPropagation();
      const id=btn.dataset.colid;
      S.collapsed.has(id)?S.collapsed.delete(id):S.collapsed.add(id);
      render();
    });
  });
  // expand all / collapse all buttons
  ['grp','plt','dpt','pa'].forEach(key=>{
    document.getElementById(`expand-all-${key}`)?.addEventListener('click',()=>{
      S.collapsed.clear();
      render();
    });
    document.getElementById(`collapse-all-${key}`)?.addEventListener('click',()=>{
      document.querySelectorAll('[data-colid]').forEach(btn=>S.collapsed.add(btn.dataset.colid));
      render();
    });
    document.getElementById(`toggle-photo-${key}`)?.addEventListener('click',()=>{
      S.showPhoto=!S.showPhoto;
      render();
    });
  });
  // ── Plant Admin chart tabs ────────────────────────────────────────
  ['grp','plt','dpt'].forEach(id=>{
    document.getElementById(`pa-tab-${id}`)?.addEventListener('click',()=>{
      S._paTab=id;
      if(id==='grp'){ S._paPltId=''; S._paDept=''; }
      else if(id==='plt'){ S._paDept=''; if(!S._paPltId) S._paPltId=S.profile?.plantId||''; }
      else if(id==='dpt'){ S._paPltId=''; }
      S._paSearch='';
      S.collapsed=new Set();
      render();
    });
  });
  // pa-plant-filter / pa-dept-filter removed — now pill buttons
  let paSearchTimer;
  // pa-search now handled inline in orgPanelHTML via oninput attribute
  $('pa-zi')?.addEventListener('click',()=>{ S.chartScale=Math.min(S.chartScale+0.1,2.5); render(); });
  $('pa-zo')?.addEventListener('click',()=>{ S.chartScale=Math.max(S.chartScale-0.1,0.3); render(); });
  $('pa-zr')?.addEventListener('click',()=>{ S.chartScale=1; render(); });
  $('pa-expand-all')?.addEventListener('click',()=>{ S.collapsed.clear(); render(); });
  $('pa-collapse-all')?.addEventListener('click',()=>{ document.querySelectorAll('[data-colid]').forEach(btn=>S.collapsed.add(btn.dataset.colid)); render(); });
  $('pa-toggle-photo')?.addEventListener('click',()=>{ S.showPhoto=!S.showPhoto; render(); });
  $('pa-pdf')?.addEventListener('click',async()=>{
    const canvas=$('oc-pa'); if(!canvas) return;
    const btn=$('pa-pdf'); btn.textContent='Exporting…'; btn.disabled=true;
    try{
      const paTab=S._paTab||'grp';
      let subtitle='Group Organisation Chart';
      if(paTab==='plt'&&(S._paPltId||S.profile?.plantId)){
        const pid=S._paPltId||S.profile?.plantId;
        const plant=S.plants.find(p=>p.id===pid);
        subtitle=(plant?.name||'Plant')+' — Organisation Chart';
      } else if(paTab==='dpt'&&S._paDept){
        subtitle=S._paDept+' — Department Chart';
      }
      const companyName=S.companyName||'OrgChart';
      await buildPDF(canvas,`${companyName.replace(/\s+/g,'_')}_${subtitle.replace(/[^a-zA-Z0-9]/g,'_')}_${new Date().toLocaleDateString('en-IN').replace(/\//g,'-')}.pdf`,subtitle);
      toast('PDF exported','ok');
    } catch(e){ toast('Export failed: '+e.message,'er'); }
    btn.textContent='⬇ PDF'; btn.disabled=false;
  });
  $('pa-xlsx-btn')?.addEventListener('click',()=>{
    const paTab=S._paTab||'grp';
    if(paTab==='plt'){ S.plantChartId=S._paPltId||S.profile?.plantId||''; exportXLSX('plt'); }
    else if(paTab==='dpt'){ S.deptChartId=S._paDept; exportXLSX('dpt'); }
    else exportXLSX('grp');
  });

  // detail close
  $('det-overlay')?.addEventListener('click',e=>{ if(e.target.id==='det-overlay'){ S.detailPerson=null; render(); }});
  $('det-close')?.addEventListener('click',()=>{ S.detailPerson=null; render(); });
  $('det-close-btn')?.addEventListener('click',()=>{ S.detailPerson=null; render(); });
  $('det-edit-btn')?.addEventListener('click',()=>{
    const id=$('det-edit-btn')?.dataset.id;
    const emp=S.employees.find(e=>e.id===id);
    if(emp){ S.detailPerson=null; openModal('employee',emp); }
  });

  // ── Bulk delete (super admin only) ───────────────────────────────
  const bulkDelBtn=$('bulk-del-btn');
  const selAllChk=$('sel-all');
  const empChks=()=>document.querySelectorAll('.emp-chk');
  const updateBulkBar=()=>{
    const checked=[...empChks()].filter(c=>c.checked);
    const count=checked.length;
    if(bulkDelBtn){
      bulkDelBtn.style.display=count>0?'inline-flex':'none';
      const span=$('bulk-del-count'); if(span) span.textContent=count;
    }
    if(selAllChk) selAllChk.indeterminate=count>0&&count<empChks().length;
  };
  selAllChk?.addEventListener('change',()=>{
    empChks().forEach(c=>c.checked=selAllChk.checked);
    updateBulkBar();
  });
  empChks().forEach(c=>c.addEventListener('change',()=>{
    if(selAllChk) selAllChk.checked=[...empChks()].every(x=>x.checked);
    updateBulkBar();
  }));
  bulkDelBtn?.addEventListener('click',async()=>{
    const ids=[...empChks()].filter(c=>c.checked).map(c=>c.dataset.id);
    if(!ids.length) return;
    const names=ids.map(id=>S.employees.find(e=>e.id===id)?.name||id);
    if(!confirm(`Delete ${ids.length} employee${ids.length!==1?'s':''}?\n\n${names.slice(0,10).join(', ')}${names.length>10?`\n…and ${names.length-10} more`:''}\n\nThis cannot be undone.`)) return;
    bulkDelBtn.disabled=true;
    showProgress('Deleting Employees', `Removing 0 of ${ids.length}…`);
    let done=0,failed=0;
    for(let i=0;i<ids.length;i++){
      const id=ids[i];
      const empName=names[i]||id;
      try{
        await col('employees').doc(id).delete();
        done++;
        updateProgress(done, ids.length, `Deleted: ${empName}`);
      }
      catch(e){ failed++; console.error('Bulk delete error:',e); }
    }
    hideProgress();
    toast(`🗑 Deleted ${done} employee${done!==1?'s':''}${failed?', '+failed+' failed':''}`, done>0?'ok':'er');
    // render will reset the button state
  });

  // ── Public View Toggle ────────────────────────────────────────────
  const pvTrack=$('pv-track');
  const pvThumb=$('pv-thumb');
  const pvLabel=$('pv-label');
  const pvStatus=$('pv-status');
  if(pvTrack){
    $('pv-toggle-label')?.addEventListener('click',async()=>{
      const newVal=!S.publicViewEnabled;
      // Optimistic UI update
      pvTrack.style.background=newVal?'var(--ok)':'var(--g200)';
      pvThumb.style.left=newVal?'27px':'3px';
      pvLabel.textContent=newVal?'🟢 Active':'⚪ Inactive';
      pvLabel.style.color=newVal?'var(--ok)':'var(--g400)';
      pvStatus.textContent='Saving…'; pvStatus.style.color='var(--g400)';
      try{
        await db.collection('settings').doc('company').set({publicViewEnabled:newVal,updatedAt:new Date().toISOString()},{merge:true});
        pvStatus.style.color='var(--ok)';
        pvStatus.textContent=newVal?'✓ Public view is now active':'✓ Public view is now disabled';
        toast(newVal?'Public view enabled — visitors can now browse without login':'Public view disabled — login required for all access','ok');
        setTimeout(()=>{pvStatus.textContent='';},3000);
      } catch(e){
        pvStatus.style.color='var(--err)'; pvStatus.textContent='Failed: '+e.message;
        toast('Failed to update setting: '+e.message,'er');
      }
    });
  }

  // ── Company Logo upload ─────────────────────────────────────────
  let _logoFile=null;
  const logoDrop=$('logo-drop');
  const logoInput=$('logo-file-input');
  if(logoDrop){
    logoDrop.addEventListener('click',()=>logoInput?.click());
    logoDrop.addEventListener('dragover',e=>{e.preventDefault();logoDrop.style.borderColor='var(--steel)';});
    logoDrop.addEventListener('dragleave',()=>logoDrop.style.borderColor='var(--g200)');
    logoDrop.addEventListener('drop',e=>{
      e.preventDefault(); logoDrop.style.borderColor='var(--g200)';
      const f=e.dataTransfer.files[0]; if(f&&f.type.startsWith('image/')) handleLogoFile(f);
    });
  }
  logoInput?.addEventListener('change',e=>{const f=e.target.files[0];if(f) handleLogoFile(f);});

  function handleLogoFile(file){
    _logoFile=file;
    const reader=new FileReader();
    reader.onload=ev=>{
      // Show preview
      const wrap=$('logo-preview-wrap');
      if(wrap) wrap.innerHTML=`<img src="${ev.target.result}" id="logo-preview-img" style="max-width:150px;max-height:70px;object-fit:contain" alt="Logo"/>`;
      const status=$('logo-status'); if(status) status.textContent=`Selected: ${file.name}`;
      const saveBtn=$('logo-save-btn'); if(saveBtn) saveBtn.disabled=false;
    };
    reader.readAsDataURL(file);
  }

  $('logo-save-btn')?.addEventListener('click',async()=>{
    if(!_logoFile) return;
    const btn=$('logo-save-btn'); btn.disabled=true; btn.textContent='Saving…';
    const status=$('logo-status'); if(status){ status.style.color='var(--g400)'; status.textContent='Saving…'; }
    try{
      // Convert logo to a base64 data URL preserving transparency.
      // We NEVER use JPEG for logos — JPEG kills transparency (turns it black).
      // We resize to fit 400×160 max, then export as PNG to keep alpha channel.
      const dataURL=await compressLogoPNG(_logoFile, 400, 160);
      if(dataURL.length>900000) throw new Error('Logo file is too large. Please use a smaller or simpler image (under ~200KB original).');
      await db.collection('settings').doc('company').set({logoURL:dataURL,updatedAt:new Date().toISOString()},{merge:true});
      _logoFile=null;
      if(status){ status.style.color='var(--ok)'; status.textContent='✓ Logo saved successfully!'; }
      toast('Company logo updated','ok');
      btn.textContent='⬆ Save Logo';
    } catch(e){
      if(status){ status.style.color='var(--err)'; status.textContent='Save failed: '+e.message; }
      toast('Save failed: '+e.message,'er');
      btn.disabled=false; btn.textContent='⬆ Save Logo';
    }
  });

  $('logo-remove-btn')?.addEventListener('click',async()=>{
    if(!confirm('Remove the company logo?')) return;
    try{
      await db.collection('settings').doc('company').set({logoURL:null,updatedAt:new Date().toISOString()},{merge:true});
      toast('Logo removed','ok');
    } catch(e){ toast('Error: '+e.message,'er'); }
  });

  // ── department CRUD ───────────────────────────────────────────────
  const deptForm=$('dept-form-wrap');
  const deptNameInp=$('dept-name-inp');
  const deptDescInp=$('dept-desc-inp');
  const deptEditId=$('dept-edit-id');
  const deptErr=$('dept-form-err');

  function openDeptForm(dept){
    if(!deptForm) return;
    deptForm.style.display='block';
    if(deptNameInp) deptNameInp.value=dept?dept.name:'';
    if(deptDescInp) deptDescInp.value=dept?dept.description||'':'';
    if(deptEditId) deptEditId.value=dept?dept.id:'';
    if(deptErr){ deptErr.style.display='none'; deptErr.textContent=''; }
    deptNameInp?.focus();
  }
  function closeDeptForm(){
    if(deptForm) deptForm.style.display='none';
  }

  $('add-dept-btn')?.addEventListener('click',()=>openDeptForm(null));
  $('dept-cancel-btn')?.addEventListener('click',()=>closeDeptForm());

  // Edit buttons
  document.querySelectorAll('.ed-btn').forEach(b=>{
    b.addEventListener('click',()=>{
      const dept=S.departments.find(d=>d.id===b.dataset.deptId);
      if(dept) openDeptForm(dept);
    });
  });

  // Delete buttons
  document.querySelectorAll('.dd-btn').forEach(b=>{
    b.addEventListener('click',async()=>{
      const name=b.dataset.deptName;
      const id=b.dataset.deptId;
      const inUse=S.employees.filter(e=>(e.dept||'').toLowerCase()===name.toLowerCase()).length;
      const warn=inUse>0?`\n\n⚠ ${inUse} employee(s) currently belong to this department.`:'';
      if(!confirm(`Delete department "${name}"?${warn}\n\nThis cannot be undone.`)) return;
      try{
        const newList=S.departments.filter(d=>d.id!==id);
        await structSettingsDoc('departments').set({list:newList,updatedAt:new Date().toISOString()});
        toast(`Department "${name}" deleted`,'ok');
      } catch(e){ toast('Error: '+e.message,'er'); }
    });
  });

  // Save department
  $('dept-save-btn')?.addEventListener('click',async()=>{
    const name=deptNameInp?.value.trim();
    const desc=deptDescInp?.value.trim();
    const editId=deptEditId?.value;
    if(!name){
      if(deptErr){ deptErr.style.display='block'; deptErr.textContent='Department name is required.'; }
      deptNameInp?.focus(); return;
    }
    // Duplicate check
    const duplicate=S.departments.find(d=>d.name.toLowerCase()===name.toLowerCase()&&d.id!==editId);
    if(duplicate){
      if(deptErr){ deptErr.style.display='block'; deptErr.textContent=`A department named "${name}" already exists.`; }
      deptNameInp?.focus(); return;
    }
    const saveBtn=$('dept-save-btn');
    saveBtn.disabled=true; saveBtn.textContent='Saving…';
    try{
      let newList;
      if(editId){
        newList=S.departments.map(d=>d.id===editId?{...d,name,description:desc||''}:d);
        toast(`Department "${name}" updated`,'ok');
      } else {
        const newDept={id:uid(),name,description:desc||'',createdAt:new Date().toISOString()};
        newList=[...S.departments,newDept];
        toast(`Department "${name}" added`,'ok');
      }
      await structSettingsDoc('departments').set({list:newList,updatedAt:new Date().toISOString()});
      closeDeptForm();
    } catch(e){ toast('Error: '+e.message,'er'); }
    saveBtn.disabled=false; saveBtn.textContent='Save';
  });

  // ── plant CRUD ────────────────────────────────────────────────────
  $('add-plant-btn')?.addEventListener('click',()=>openModal('plant',null));
  document.querySelectorAll('.ep-btn').forEach(b=>b.addEventListener('click',()=>{ const p=S.plants.find(x=>x.id===b.dataset.id); openModal('plant',p); }));
  document.querySelectorAll('.dp-btn').forEach(b=>b.addEventListener('click',()=>deletePlant(b.dataset.id,b.dataset.name)));

  // employee CRUD
  $('add-emp-btn')?.addEventListener('click',()=>openModal('employee',null));
  $('bulk-emp-btn')?.addEventListener('click',()=>openModal('bulk',null));
  document.querySelectorAll('.ee-btn').forEach(b=>b.addEventListener('click',()=>{ const e=S.employees.find(x=>x.id===b.dataset.id); openModal('employee',e); }));
  document.querySelectorAll('.de-btn').forEach(b=>b.addEventListener('click',()=>deleteEmployee(b.dataset.id,b.dataset.name)));

  // admin CRUD
  $('add-admin-btn')?.addEventListener('click',()=>openModal('admin',null));
  document.querySelectorAll('.da-btn').forEach(b=>b.addEventListener('click',()=>deleteAdmin(b.dataset.id,b.dataset.name)));

  // filters (pcs-sel, dcs-plant, dcs-dept removed — now pill buttons render inline)
  $('fp-sel')?.addEventListener('change',e=>{ S.filterPlant=e.target.value; render(); });

  // structures tab
  if(S.tab==='structures') bindStructures();

  // zoom & PDF & Excel for all chart keys
  ['grp','plt','pa','dpt'].forEach(key=>{
    $(`zi-${key}`)?.addEventListener('click',()=>{ S.chartScale=Math.min(S.chartScale+0.1,2.5); render(); });
    $(`zo-${key}`)?.addEventListener('click',()=>{ S.chartScale=Math.max(S.chartScale-0.1,0.3); render(); });
    $(`zr-${key}`)?.addEventListener('click',()=>{ S.chartScale=1; render(); });
    $(`pdf-${key}`)?.addEventListener('click',()=>exportPDF(key));
    $(`xlsx-${key}`)?.addEventListener('click',()=>exportXLSX(key));
    // expand/collapse per chart key
    $(`expand-all-${key}`)?.addEventListener('click',()=>{ S.collapsed.clear(); render(); });
    $(`collapse-all-${key}`)?.addEventListener('click',()=>{ document.querySelectorAll('[data-colid]').forEach(b=>S.collapsed.add(b.dataset.colid)); render(); });
    $(`toggle-photo-${key}`)?.addEventListener('click',()=>{ S.showPhoto=!S.showPhoto; render(); });
    // SA search field (grp/plt/dpt keys only — pa handled separately)
    const sInp=$(`search-${key}`);
    if(sInp && key!=='pa'){
      sInp.addEventListener('input',e=>{
        const val=e.target.value, pos=e.target.selectionStart;
        S._saSearch=val;
        render();
        const el=$(`search-${key}`);
        if(el){ el.focus(); try{ el.setSelectionRange(pos,pos); }catch(_){} }
      });
    }
  });

  // ── Company Name save ─────────────────────────────────────────────
  $('company-name-save-btn')?.addEventListener('click',async()=>{
    const val=$('company-name-inp')?.value.trim();
    const statusEl=$('company-name-status');
    const btn=$('company-name-save-btn');
    btn.disabled=true; btn.textContent='Saving…';
    try{
      await db.collection('settings').doc('company').set({companyName:val,updatedAt:new Date().toISOString()},{merge:true});
      if(statusEl){ statusEl.textContent='✓ Saved'; statusEl.style.color='var(--ok)'; setTimeout(()=>{ statusEl.textContent=''; },3000); }
      toast('Company name updated','ok');
    } catch(e){ toast('Error: '+e.message,'er'); }
    btn.disabled=false; btn.textContent='💾 Save';
  });
}

// ── Open / bind modal ────────────────────────────────────────────
function openModal(type,data){
  S.modal={type,data};
  S._photoFile=null;
  S._photoPreview=data?.photoURL||null;
  render();
  bindModal();
}
function bindModal(){
  $('m-close')?.addEventListener('click',closeModal);
  $('m-cancel')?.addEventListener('click',closeModal);
  $('m-overlay')?.addEventListener('click',e=>{ if(e.target.id==='m-overlay') closeModal(); });
  // photo
  $('photo-area')?.addEventListener('click',()=>$('photo-file')?.click());
  $('photo-file')?.addEventListener('change',e=>{
    const f=e.target.files[0]; if(!f) return;
    S._photoFile=f;
    const r=new FileReader();
    r.onload=ev=>{
      S._photoPreview=ev.target.result;
      const img=$('photo-img');
      if(img){ img.src=ev.target.result; }
      else{
        $('photo-area').innerHTML=`<img src="${ev.target.result}" class="photo-prev" id="photo-img"/><div style="font-size:11px;color:var(--g400);margin-top:4px">Click to change</div>`;
        $('photo-area').onclick=()=>$('photo-file')?.click();
      }
    };
    r.readAsDataURL(f);
  });
  // Gender radio — live highlight selected option
  const genderColors={male:'#1E4080',female:'#BE185D',other:'#6D28D9'};
  document.querySelectorAll('input[name="m-gender"]').forEach(r=>{
    r.addEventListener('change',()=>{
      ['male','female','other'].forEach(v=>{
        const lbl=$(`gender-lbl-${v}`);
        const c=genderColors[v];
        if(lbl){
          const active=r.value===v;
          lbl.style.borderColor=active?c:'var(--g200)';
          lbl.style.background=active?c+'18':'#fff';
          lbl.querySelector('span').style.color=active?c:'var(--g600)';
        }
      });
    });
  });
  // Reports To live search filter
  const parentSearch=$('m-parent-search');
  const parentSel=$('m-parent');
  if(parentSearch&&parentSel){
    // Store all options for filtering
    const allParentOptions=[...parentSel.options];
    parentSearch.addEventListener('input',()=>{
      const q=parentSearch.value.trim().toLowerCase();
      parentSel.innerHTML='';
      const none=document.createElement('option');
      none.value=''; none.textContent='— None (Top Level) —';
      parentSel.appendChild(none);
      allParentOptions.filter(o=>o.value===''||o.textContent.toLowerCase().includes(q)).forEach(o=>{
        if(o.value!=='') parentSel.appendChild(o.cloneNode(true));
      });
    });
  }
  // XLSX template download — includes gender column
  $('dl-template-btn')?.addEventListener('click',()=>{
    const ws=XLSX.utils.aoa_to_sheet([
      ['name','designation','emp_code','dept','email','contact','gender','plant_name','reports_to_name (name or emp_code)'],
      ['John Smith','Plant Manager','EMP-001','QMS','john@company.com','+91 98765 43210','male','Plant Alpha',''],
      ['Jane Doe','Shift Supervisor','EMP-002','Production','jane@company.com','+91 98765 43211','female','Plant Alpha','John Smith'],
      ['Ravi Kumar','QA Engineer','EMP-003','Quality','ravi@company.com','+91 98765 43212','male','Plant Beta','EMP-001'],
    ]);
    ws['!cols']=[{wch:22},{wch:22},{wch:12},{wch:16},{wch:30},{wch:18},{wch:10},{wch:18},{wch:22}];
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'Employees');
    XLSX.writeFile(wb,'employees_template.xlsx');
  });

  // XLSX file input — fetch target structure's employees before parsing
  let _lastFile=null; // remember last file so we can re-parse when structure changes
  const csvInput=$('csv-file-input');
  const csvDrop=$('csv-drop-area');
  csvDrop?.addEventListener('click',()=>csvInput?.click());
  csvDrop?.addEventListener('dragover',e=>{e.preventDefault();csvDrop.style.borderColor='var(--steel)';});
  csvDrop?.addEventListener('dragleave',()=>{csvDrop.style.borderColor='var(--g200)';});
  csvDrop?.addEventListener('drop',async e=>{
    e.preventDefault();csvDrop.style.borderColor='var(--g200)';
    const f=e.dataTransfer.files[0];
    if(f){ _lastFile=f; await refreshBulkTargetAndParse(f); }
  });
  csvInput?.addEventListener('change',async e=>{
    const f=e.target.files[0];
    if(f){ _lastFile=f; await refreshBulkTargetAndParse(f); }
  });

  async function refreshBulkTargetAndParse(file){
    const targetId=getSelectedBulkStructId();
    $('bulk-err')&&($('bulk-err').style.display='none');
    const dropLabel=csvDrop?.querySelector('div[style*="font-size:13px"]');
    const plantsList=$('bulk-plants-list');
    if(dropLabel) dropLabel.textContent='Loading target structure…';
    if(plantsList) plantsList.textContent='loading…';
    // fetch both plants and employees for the target structure
    [_bulkTargetPlants, _bulkTargetEmployees] = await Promise.all([
      fetchTargetPlants(targetId==='__new__'?'__none__':targetId),
      fetchTargetEmployees(targetId==='__new__'?'__none__':targetId)
    ]);
    if(dropLabel) dropLabel.textContent='Click to choose Excel file (.xlsx)';
    if(plantsList){
      plantsList.textContent = _bulkTargetPlants.length
        ? _bulkTargetPlants.map(p=>p.name).join(', ')
        : '(none — add plants to this structure first)';
      plantsList.style.color = _bulkTargetPlants.length ? 'var(--steel)' : 'var(--err)';
    }
    if(file) parseBulkXLSX(file);
  }

  function getSelectedBulkStructId(){
    const choice=(document.querySelector('input[name="bulk-struct-choice"]:checked')?.value)||'current';
    if(choice==='current') return S.activeStructId;
    if(choice==='existing'){
      const sel=$('bulk-struct-existing-sel')?.value||'';
      return sel==='__default__'?'':sel;
    }
    return '__new__'; // new structure has no existing employees
  }

  // Structure choice radio buttons — enable/disable fields + re-parse if file already loaded
  document.querySelectorAll('input[name="bulk-struct-choice"]').forEach(radio=>{
    radio.addEventListener('change',async()=>{
      const v=radio.value;
      // highlight active option
      document.querySelectorAll('[id^="bulk-struct-opt-"]').forEach(el=>{
        el.style.borderColor='var(--g200)';el.style.background='#fff';
      });
      const active=document.getElementById('bulk-struct-opt-'+v);
      if(active){active.style.borderColor='var(--steel)';active.style.background='rgba(30,64,128,.04)';}
      // enable/disable controls
      const existSel=$('bulk-struct-existing-sel');
      const newName=$('bulk-new-struct-name');
      const newDesc=$('bulk-new-struct-desc');
      if(existSel) existSel.disabled=(v!=='existing');
      if(newName)  newName.disabled=(v!=='new');
      if(newDesc)  newDesc.disabled=(v!=='new');
      if(v==='existing'&&existSel) existSel.focus();
      if(v==='new'&&newName) newName.focus();
      // Re-run parse with new target's employees if a file was already chosen
      if(_lastFile && v!=='new') await refreshBulkTargetAndParse(_lastFile);
      else if(_lastFile && v==='new'){ _bulkTargetEmployees=[]; _bulkTargetPlants=[]; parseBulkXLSX(_lastFile); }
    });
  });

  // Also re-parse when existing structure dropdown changes
  $('bulk-struct-existing-sel')?.addEventListener('change',async()=>{
    if(_lastFile) await refreshBulkTargetAndParse(_lastFile);
  });

  // Initialise _bulkTargetPlants and _bulkTargetEmployees for current structure on modal open
  (async()=>{
    [_bulkTargetPlants, _bulkTargetEmployees] = await Promise.all([
      fetchTargetPlants(S.activeStructId),
      fetchTargetEmployees(S.activeStructId)
    ]);
    const plantsList=$('bulk-plants-list');
    if(plantsList){
      plantsList.textContent = _bulkTargetPlants.length
        ? _bulkTargetPlants.map(p=>p.name).join(', ')
        : '(none — add plants to this structure first)';
      plantsList.style.color = _bulkTargetPlants.length ? 'var(--steel)' : 'var(--err)';
    }
  })();

  // Highlight default selected on open
  const defOpt=document.getElementById('bulk-struct-opt-current');
  if(defOpt){defOpt.style.borderColor='var(--steel)';defOpt.style.background='rgba(30,64,128,.04)';}

  // Bulk import button
  $('bulk-import-btn')?.addEventListener('click',()=>doBulkImport());

  // save
  $('m-save')?.addEventListener('click',async()=>{
    const sb=$('m-save'); sb.disabled=true; sb.textContent='Saving…';
    try{
      const type=S.modal?.type;
      if(type==='plant') await savePlant();
      else if(type==='employee') await saveEmployee();
      else if(type==='admin') await saveAdmin();
      closeModal();
    } catch(e){
      const errEl=$('m-err');
      if(errEl){ errEl.style.display='block'; errEl.textContent=e.message; }
      else toast(e.message,'er');
      sb.disabled=false; sb.textContent='Save';
    }
  });
}
function closeModal(){ S.modal=null; render(); }

function bindChangePassword(){
  $('m-close')?.addEventListener('click',closeModal);
  $('m-cancel')?.addEventListener('click',closeModal);
  $('m-overlay')?.addEventListener('click',e=>{ if(e.target.id==='m-overlay') closeModal(); });

  // Allow Enter key on last field to submit
  $('cp-confirm')?.addEventListener('keydown',e=>{ if(e.key==='Enter') $('cp-save')?.click(); });

  $('cp-save')?.addEventListener('click',async()=>{
    const current=$('cp-current')?.value;
    const newPass=$('cp-new')?.value;
    const confirm=$('cp-confirm')?.value;
    const errEl=$('cp-err');

    const showErr=msg=>{ errEl.style.display='block'; errEl.textContent=msg; };
    errEl.style.display='none';

    if(!current) return showErr('Please enter your current password.');
    if(!newPass) return showErr('Please enter a new password.');
    if(newPass.length<6) return showErr('New password must be at least 6 characters.');
    if(newPass!==confirm) return showErr('New passwords do not match.');
    if(current===newPass) return showErr('New password must be different from current password.');

    const btn=$('cp-save');
    btn.disabled=true; btn.textContent='Updating…';

    try{
      // Re-authenticate with current password before changing
      const credential=firebase.auth.EmailAuthProvider.credential(S.user.email, current);
      await S.user.reauthenticateWithCredential(credential);
      // Now update to new password
      await S.user.updatePassword(newPass);
      closeModal();
      toast('✓ Password updated successfully','ok');
    } catch(e){
      btn.disabled=false; btn.textContent='Update Password';
      if(e.code==='auth/wrong-password'||e.code==='auth/invalid-credential'){
        showErr('Current password is incorrect. Please try again.');
      } else if(e.code==='auth/weak-password'){
        showErr('New password is too weak. Please choose a stronger password.');
      } else if(e.code==='auth/requires-recent-login'){
        showErr('Session expired. Please sign out and sign back in, then change your password.');
      } else {
        showErr('Error: '+(e.message||'Unknown error. Please try again.'));
      }
    }
  });
}
