<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>OrgChart Pro – Plant Management System</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<!-- Firebase v9 compat CDN - no npm needed -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<!-- PDF export CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --navy:#0F1F3D;--navy-l:#1E3A6E;--steel:#1E4080;
  --gold:#F5A623;--gold-l:#FBBF45;
  --white:#fff;--off:#F7F9FC;
  --g50:#F0F4FA;--g100:#E8ECF2;--g200:#CDD5E0;--g400:#8494AA;--g600:#4A5568;--g800:#1A2535;
  --ok:#22C55E;--err:#EF4444;
  --shadow:0 4px 16px rgba(15,31,61,.12);--r:10px;--rl:16px;
  font-family:'Inter',-apple-system,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--off);color:var(--g800);font-size:14px;line-height:1.6;min-height:100vh}
#app{min-height:100vh}

/* Layout */
.layout{display:flex;min-height:100vh}
.sidebar{width:230px;min-height:100vh;background:var(--navy);display:flex;flex-direction:column;position:fixed;top:0;left:0;z-index:100;overflow-y:auto}
.main{margin-left:230px;flex:1;display:flex;flex-direction:column;min-height:100vh}
.topbar{height:60px;background:var(--white);border-bottom:1px solid var(--g100);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:50;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.page{padding:24px;flex:1}

/* Sidebar */
.s-logo{padding:22px 18px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
.s-logo h1{color:#fff;font-size:17px;font-weight:800;line-height:1.2}
.s-logo span{color:var(--gold)}
.s-logo p{color:rgba(255,255,255,.35);font-size:11px;margin-top:2px}
.s-nav{padding:14px 10px;flex:1}
.s-sec{color:rgba(255,255,255,.3);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;padding:14px 10px 5px}
.nav-btn{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:8px;color:rgba(255,255,255,.6);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;border:none;background:none;width:100%;text-align:left;margin-bottom:2px;font-family:inherit}
.nav-btn:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-btn.active{background:var(--gold);color:var(--navy);font-weight:700}
.s-foot{padding:14px 10px;border-top:1px solid rgba(255,255,255,.08)}
.u-pill{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:8px;background:rgba(255,255,255,.06)}
.u-av{width:30px;height:30px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:var(--navy);flex-shrink:0}
.u-nm{color:#fff;font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.u-rl{color:rgba(255,255,255,.35);font-size:11px}
.lo-btn{display:flex;align-items:center;gap:8px;padding:8px 11px;border-radius:8px;color:rgba(255,255,255,.4);font-size:12px;cursor:pointer;border:none;background:none;width:100%;margin-top:6px;transition:all .15s;font-family:inherit}
.lo-btn:hover{background:rgba(239,68,68,.15);color:var(--err)}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border:none;border-radius:var(--r);font-size:13px;font-weight:600;cursor:pointer;transition:all .17s;white-space:nowrap;font-family:inherit}
.bp{background:var(--gold);color:var(--navy)}.bp:hover{background:var(--gold-l);transform:translateY(-1px);box-shadow:var(--shadow)}
.bs{background:var(--navy);color:#fff}.bs:hover{background:var(--navy-l);transform:translateY(-1px)}
.bo{background:transparent;border:1.5px solid var(--g200);color:var(--g600)}.bo:hover{border-color:var(--steel);color:var(--steel);background:var(--g50)}
.bd{background:var(--err);color:#fff}.bd:hover{background:#dc2626}
.bsm{padding:5px 11px;font-size:12px}.bic{padding:6px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}

/* Forms */
.fg{margin-bottom:14px}
.lbl{display:block;font-size:11px;font-weight:700;color:var(--g600);margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em}
.inp{width:100%;padding:9px 13px;border:1.5px solid var(--g200);border-radius:var(--r);font-size:14px;color:var(--g800);background:#fff;transition:border-color .15s;font-family:inherit;outline:none}
.inp:focus{border-color:var(--steel);box-shadow:0 0 0 3px rgba(30,64,128,.08)}
.inp::placeholder{color:var(--g400)}
select.inp{cursor:pointer}
textarea.inp{resize:vertical;min-height:70px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* Cards/stats */
.card{background:#fff;border-radius:var(--rl);border:1px solid var(--g100);box-shadow:0 1px 3px rgba(15,31,61,.07)}
.card-h{padding:16px 20px;border-bottom:1px solid var(--g100);display:flex;align-items:center;justify-content:space-between}
.card-h h3{font-size:14px;font-weight:700;color:var(--navy)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:24px}
.stat{background:#fff;border-radius:var(--rl);padding:18px;border:1px solid var(--g100);box-shadow:0 1px 3px rgba(15,31,61,.07)}
.sv{font-size:30px;font-weight:800;color:var(--navy);line-height:1}
.sl{font-size:12px;color:var(--g400);margin-top:3px;font-weight:500}
.si{font-size:22px;margin-bottom:8px}

/* Table */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{background:var(--g50);color:var(--g600);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:11px 14px;text-align:left}
td{padding:12px 14px;border-bottom:1px solid var(--g100);font-size:13px}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--g50)}

/* Badge */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
.bg{background:rgba(245,166,35,.12);color:#B7791F}
.bb{background:rgba(30,64,128,.1);color:var(--steel)}
.bk{background:rgba(34,197,94,.1);color:#16a34a}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(10,20,40,.55);display:flex;align-items:center;justify-content:center;z-index:999;backdrop-filter:blur(4px);padding:20px}
.modal{background:#fff;border-radius:var(--rl);width:100%;max-width:500px;max-height:90vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.25);animation:su .2s ease}
.mh{padding:20px 22px 16px;border-bottom:1px solid var(--g100);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:1}
.mh h3{font-size:16px;font-weight:800;color:var(--navy)}
.mb{padding:22px}
.mf{padding:14px 22px;border-top:1px solid var(--g100);display:flex;gap:10px;justify-content:flex-end}
@keyframes su{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

/* Toasts */
#toasts{position:fixed;bottom:22px;right:22px;z-index:9999;display:flex;flex-direction:column;gap:7px}
.toast{display:flex;align-items:center;gap:9px;padding:11px 16px;border-radius:var(--r);background:var(--navy);color:#fff;font-size:13px;font-weight:500;box-shadow:var(--shadow);animation:si .2s ease;min-width:220px}
.tok{border-left:4px solid var(--ok)}.ter{border-left:4px solid var(--err)}.tin{border-left:4px solid var(--gold)}
@keyframes si{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}

/* Login */
.login-page{min-height:100vh;display:flex;background:linear-gradient(135deg,var(--navy) 0%,var(--steel) 60%,#1a4d8f 100%)}
.ll{flex:1;display:flex;align-items:center;justify-content:center;padding:60px}
.lr{width:420px;background:#fff;display:flex;align-items:center;justify-content:center;padding:44px}
.lb h1{font-size:40px;font-weight:900;color:#fff;line-height:1.1}
.lb span{color:var(--gold)}
.lb p{color:rgba(255,255,255,.5);font-size:15px;margin-top:10px;max-width:320px;line-height:1.7}
@media(max-width:700px){.ll{display:none}.lr{width:100%}.sidebar{width:190px}.main{margin-left:190px}}

/* Org chart */
.org-wrap{overflow:auto;background:#fff;border-radius:var(--rl);border:1px solid var(--g100);min-height:380px}
.org-canvas{display:inline-flex;min-width:100%;justify-content:center;padding:44px 36px;transform-origin:top center;transition:transform .2s}
.org-tb{display:flex;align-items:center;gap:8px;padding:11px 14px;background:#fff;border-radius:var(--rl);border:1px solid var(--g100);margin-bottom:14px}
.org-t{font-size:13px;font-weight:700;color:var(--navy);flex:1}
.onode{display:flex;flex-direction:column;align-items:center;position:relative}
.ocard{background:#fff;border:1.5px solid var(--g200);border-radius:12px;padding:13px 14px;width:168px;cursor:pointer;transition:all .2s;text-align:center;box-shadow:0 1px 4px rgba(15,31,61,.08);position:relative}
.ocard:hover{border-color:var(--steel);box-shadow:var(--shadow);transform:translateY(-2px)}
.ocard.root-card{border-color:var(--gold);background:var(--navy)}
.ocard.root-card .oname{color:#fff}
.ocard.root-card .odesig{color:rgba(255,255,255,.55)}
.oav{width:50px;height:50px;border-radius:50%;object-fit:cover;margin:0 auto 7px;display:block;border:2px solid var(--g100)}
.oavph{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,var(--steel),var(--navy));margin:0 auto 7px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:700}
.oname{font-size:11px;font-weight:700;color:var(--navy);line-height:1.3}
.odesig{font-size:10px;color:var(--g400);margin-top:2px;font-weight:500}
.oplant{font-size:9px;color:var(--gold);margin-top:3px;font-weight:600}
.ocol{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);width:20px;height:20px;border-radius:50%;border:1.5px solid var(--g200);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--g400);transition:all .15s;z-index:5;font-family:inherit}
.ocol:hover{border-color:var(--steel);color:var(--steel)}
.conn-v{width:1px;background:var(--g200);margin:0 auto}
.ochildren{display:flex;gap:16px;position:relative}

/* Photo upload */
.photo-area{border:2px dashed var(--g200);border-radius:var(--r);padding:18px;text-align:center;cursor:pointer;transition:all .15s;background:var(--g50);margin-bottom:14px}
.photo-area:hover{border-color:var(--steel);background:rgba(30,64,128,.03)}
.photo-prev{width:72px;height:72px;border-radius:50%;object-fit:cover;margin:0 auto 6px;display:block}

/* Empty */
.empty{text-align:center;padding:50px 20px;color:var(--g400)}
.ei{font-size:42px;margin-bottom:10px}
.empty h3{font-size:15px;font-weight:600;color:var(--g600);margin-bottom:5px}

/* Detail popup */
.detail-pop{background:#fff;border-radius:var(--rl);max-width:360px;width:100%;padding:28px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.25);animation:su .2s ease}
.dp-av{width:76px;height:76px;border-radius:50%;object-fit:cover;margin:0 auto 12px;display:block;border:3px solid var(--g100)}
.dp-avph{width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,var(--steel),var(--navy));margin:0 auto 12px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px;font-weight:700}
.dp-name{font-size:18px;font-weight:800;color:var(--navy);margin-bottom:3px}
.dp-des{font-size:13px;color:var(--g400);margin-bottom:14px}
.dp-row{display:flex;align-items:center;gap:10px;padding:9px 13px;background:var(--g50);border-radius:8px;margin-bottom:8px;text-decoration:none;color:var(--g800);font-size:13px}

/* Config banner */
.cfg-banner{background:#fff3cd;border:1px solid #ffc107;border-radius:var(--r);padding:16px 20px;margin-bottom:20px;font-size:13px;line-height:1.7}
.cfg-banner strong{color:#856404}
.cfg-banner code{background:rgba(0,0,0,.07);padding:1px 5px;border-radius:4px;font-family:monospace;font-size:12px}

/* Helpers */
.fl{display:flex}.ac{align-items:center}.jb{justify-content:space-between}.g2h{gap:8px}.g3h{gap:12px}.mb16{margin-bottom:16px}.mt8{margin-top:8px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toasts"></div>

<script>
// ╔══════════════════════════════════════════════════════════════╗
// ║  🔥 FIREBASE CONFIG — replace with YOUR values              ║
// ║  Get from: Firebase Console → Project Settings → Your Apps  ║
// ╚══════════════════════════════════════════════════════════════╝
const FIREBASE_CONFIG = {
  apiKey:            "AIzaSyCsd_IOB8DPRNbT8TrBsltQksZ6yD7nlqQ",
  authDomain:        "skr-mom.firebaseapp.com",
  databaseURL:       "https://skr-mom-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:         "skr-mom",
  storageBucket:     "skr-mom.firebasestorage.app",
  messagingSenderId: "993069516449",
  appId:             "1:993069516449:web:a0329628740748a913d2e0",
  measurementId:     "G-2ZL4JR2V9R"
};

// ── Init Firebase ───────────────────────────────────────────────
const app    = firebase.initializeApp(FIREBASE_CONFIG);
const auth   = firebase.auth();
const db     = firebase.firestore();
const stor   = firebase.storage();

// ── App State ──────────────────────────────────────────────────
const S = {
  user:null, profile:null,
  plants:[], employees:[], users:[],
  tab:'dashboard',
  modal:null, detailPerson:null,
  filterPlant:'', chartScale:1, plantChartId:'',
  collapsed:new Set(),
  loading:true,
  _photoFile:null, _photoPreview:null,
};
let _unsubs=[];

// ── Utilities ───────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const ini = n => (n||'?').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2);
const isConfigured = () => true;

function toast(msg, type='in'){
  const t=document.createElement('div');
  t.className=`toast t${type}`;
  const icons={tok:'✓',ter:'✕',tin:'ℹ'};
  t.innerHTML=`<span>${icons['t'+type]||'ℹ'}</span><span style="flex:1">${msg}</span>`;
  $('toasts').appendChild(t);
  setTimeout(()=>t.remove(),3500);
}

function buildTree(emps){
  if(!emps||!emps.length) return null;
  const map={};
  emps.forEach(e=>{ map[e.id]={...e,children:[]} });
  let root=null;
  emps.forEach(e=>{
    if(!e.parentId||!map[e.parentId]){ if(!root) root=map[e.id]; }
    else map[e.parentId].children.push(map[e.id]);
  });
  return root;
}

// ── Listeners ───────────────────────────────────────────────────
function startListeners(){
  _unsubs.forEach(u=>u()); _unsubs=[];
  _unsubs.push(db.collection('plants').onSnapshot(s=>{
    S.plants=s.docs.map(d=>({id:d.id,...d.data()})); render();
  }));
  _unsubs.push(db.collection('employees').onSnapshot(s=>{
    S.employees=s.docs.map(d=>({id:d.id,...d.data()})); render();
  }));
  if(S.profile?.role==='super-admin'){
    _unsubs.push(db.collection('mompro_users').onSnapshot(s=>{
      // Store Firestore doc id (d.id) as _docId to avoid clash with numeric 'id' field
      S.users=s.docs.map(d=>({_docId:d.id,...d.data(),id:d.id})); render();
    }));
  }
}

auth.onAuthStateChanged(async user=>{
  S.user=user;
  if(user){
    // mompro_users uses numeric doc IDs — must query by email
    let profileData=null;
    try{
      // Get ALL docs matching this email (role field may differ across docs)
      const q=await db.collection('mompro_users').where('email','==',user.email).get();
      if(!q.empty){
        // Prefer the doc with a privileged role (super-admin > plant-admin > others)
        const rolePriority=r=>{
          const rr=(r||'').trim().toLowerCase();
          if(rr==='super-admin'||rr==='superadmin'||rr==='super_admin') return 3;
          if(rr==='plant-admin'||rr==='plantadmin'||rr==='plant_admin') return 2;
          return 1;
        };
        const sorted=q.docs.map(d=>d.data()).sort((a,b)=>rolePriority(b.role)-rolePriority(a.role));
        profileData=sorted[0];
        console.log('[OrgChart] Found',q.docs.length,'doc(s) for email. Using role:',profileData.role);
      }
    }catch(e){ console.error('[OrgChart] Query error:',e); }
    if(profileData){
      // Normalize role value (trim, lowercase, map variants)
      const raw=(profileData.role||'').toString().trim().toLowerCase();
      const roleMap={
        'super-admin':'super-admin','superadmin':'super-admin','super_admin':'super-admin',
        'plant-admin':'plant-admin','plantadmin':'plant-admin','plant_admin':'plant-admin',
        'viewer':'viewer','view':'viewer',
        // Non-admin roles from mompro — treat as viewer in orgchart
        'assignee':'viewer','member':'viewer','user':'viewer','employee':'viewer'
      };
      profileData.role=roleMap[raw]||raw;
      S.profile=profileData;
    } else { S.profile=null; }
    console.log('[OrgChart] Profile:',S.profile?.email,'| Normalized role:',S.profile?.role);
    if(!S.tab||S.tab==='dashboard') S.tab=S.profile?.role==='plant-admin'?'pa-chart':'dashboard';
    startListeners();
  } else {
    S.profile=null; S.plants=[]; S.employees=[]; S.users=[];
    _unsubs.forEach(u=>u()); _unsubs=[];
  }
  S.loading=false; render();
});

// ════════════════════════════════════════════════════════════════
//  HTML BUILDERS
// ════════════════════════════════════════════════════════════════
function render(){
  const app=$('app');
  if(S.loading){ app.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:var(--g400);font-size:15px">Loading…</div>'; return; }
  if(!S.user){ app.innerHTML=loginHTML(); bindLogin(); return; }
  if(!S.profile){
    app.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:12px"><div style="color:var(--err);font-size:15px;font-weight:600">Account not found in mompro_users</div><div style="color:var(--g400);font-size:13px">Make sure your email exists in the mompro_users collection.</div></div>';
    return;
  }
  const role=S.profile.role;
  console.log('[OrgChart] Rendering for role:',role);
  if(role==='super-admin') app.innerHTML=superAdminHTML();
  else if(role==='plant-admin') app.innerHTML=plantAdminHTML();
  else app.innerHTML=viewerHTML();
  bindAll();
}

// ── Login ───────────────────────────────────────────────────────
function loginHTML(){
  return `<div class="login-page">
  <div class="ll"><div class="lb">
    <h1>Org<span>Chart</span><br>Pro</h1>
    <p>Visualize and manage your organization's structure across all plant locations.</p>
    <div style="display:flex;gap:20px;margin-top:36px">
      ${['🏭 Multi-Plant','📊 Collapsible Chart','📄 PDF Export'].map(f=>`<span style="color:rgba(255,255,255,.6);font-size:12px;font-weight:500">${f}</span>`).join('')}
    </div>
  </div></div>
  <div class="lr"><div style="width:100%">
    <h2 style="font-size:22px;font-weight:800;color:var(--navy);margin-bottom:5px">Welcome back</h2>
    <p style="color:var(--g400);font-size:13px;margin-bottom:26px">Sign in to your organization dashboard.</p>
    ${!isConfigured()?`<div class="cfg-banner"><strong>⚙️ Firebase not configured yet.</strong><br>Open this HTML file, find <code>FIREBASE_CONFIG</code> near the top of the &lt;script&gt; tag, and replace the placeholder values with your actual Firebase project credentials.</div>`:''}
    <div id="li-err" style="display:none;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);color:#dc2626;border-radius:8px;padding:9px 13px;font-size:13px;margin-bottom:14px"></div>
    <div class="fg"><label class="lbl">Email</label><input class="inp" id="li-email" type="email" placeholder="you@company.com" autocomplete="username"/></div>
    <div class="fg"><label class="lbl">Password</label><input class="inp" id="li-pass" type="password" placeholder="Password" autocomplete="current-password"/></div>
    <button class="btn bs" id="li-btn" style="width:100%;justify-content:center;padding:11px;font-size:14px">Sign In</button>
    <p style="margin-top:20px;font-size:11px;color:var(--g400);text-align:center">Contact your Super Admin for account setup.</p>
  </div></div>
</div>`;
}
function bindLogin(){
  const doLogin=async()=>{
    const email=$('li-email')?.value.trim(), pass=$('li-pass')?.value;
    if(!email||!pass) return;
    $('li-btn').textContent='Signing in…'; $('li-btn').disabled=true;
    try{ await auth.signInWithEmailAndPassword(email,pass); }
    catch(e){
      $('li-err').style.display='block';
      $('li-err').textContent='Invalid email or password.';
      $('li-btn').textContent='Sign In'; $('li-btn').disabled=false;
    }
  };
  $('li-btn')?.addEventListener('click', doLogin);
  $('li-pass')?.addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
}

function orgNodeHTML(node,isRoot=false){
  const children=node.children||[];
  const has=children.length>0;
  const col=S.collapsed.has(node.id);
  const av=node.photoURL
    ?`<img src="${node.photoURL}" class="oav" style="${isRoot?'width:56px;height:56px':''}" onerror="this.style.display='none'">`
    :`<div class="oavph" style="${isRoot?'width:56px;height:56px;font-size:19px':''}">${ini(node.name)}</div>`;
  return `<div class="onode">
  <div class="ocard ${isRoot?'root-card':''}" data-pid="${node.id}">
    ${av}
    <div class="oname">${node.name}</div>
    <div class="odesig">${node.designation}</div>
    ${node.plant&&!isRoot?`<div class="oplant">🏭 ${node.plant}</div>`:''}
    ${has?`<button class="ocol" data-colid="${node.id}">${col?'▾':'▴'}</button>`:''}
  </div>
  ${has&&!col?`
    <div class="conn-v" style="height:20px"></div>
    <div style="position:relative">
      ${children.length>1?`<div style="position:absolute;top:0;left:10%;right:10%;height:1px;background:var(--g200)"></div>`:''}
      <div class="ochildren">
        ${children.map(c=>`<div style="display:flex;flex-direction:column;align-items:center">
          <div class="conn-v" style="height:20px"></div>${orgNodeHTML(c)}
        </div>`).join('')}
      </div>
    </div>`:''}
</div>`;
}

      ${p.email?`<a href="mailto:${p.email}" class="dp-row">✉ ${p.email}</a>`:''}
      ${p.contact?`<a href="tel:${p.contact}" class="dp-row">📞 ${p.contact}</a>`:''}
    </div>
  </div>
</div>`;
}

// ── Helpers ─────────────────────────────────────────────────────
function avatarThumb(e){
  return e.photoURL
    ?`<img src="${e.photoURL}" style="width:30px;height:30px;border-radius:50%;object-fit:cover;flex-shrink:0">`
    :`<div style="width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#1E4080,#0F1F3D);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;flex-shrink:0">${ini(e.name)}</div>`;
}
function noData(cols,icon='',h='',p=''){
  return `<tr><td colspan="${cols}"><div class="empty">${icon?`<div class="ei">${icon}</div>`:''}${h?`<h3>${h}</h3>`:''}${p?`<p style="font-size:12px">${p}</p>`:''}</div></td></tr>`;
}

// ════════════════════════════════════════════════════════════════
//  EVENT BINDING
// ════════════════════════════════════════════════════════════════
function bindAll(){
  // nav
  document.querySelectorAll('[data-tab]').forEach(btn=>{
    btn.addEventListener('click',()=>{ S.tab=btn.dataset.tab; render(); });
  });
  // logout
  $('lo-btn')?.addEventListener('click',()=>auth.signOut());

  // org card click → detail
  document.querySelectorAll('[data-pid]').forEach(card=>{
    card.addEventListener('click',e=>{
      if(e.target.classList.contains('ocol')||e.target.closest?.('.ocol')) return;
      S.detailPerson=S.employees.find(x=>x.id===card.dataset.pid)||null;
      render();
    });
  });
  // collapse/expand
  document.querySelectorAll('[data-colid]').forEach(btn=>{
    btn.addEventListener('click',e=>{
      e.stopPropagation();
      const id=btn.dataset.colid;
      S.collapsed.has(id)?S.collapsed.delete(id):S.collapsed.add(id);
      render();
    });
  });
  // detail close
  $('det-overlay')?.addEventListener('click',e=>{ if(e.target.id==='det-overlay'){ S.detailPerson=null; render(); }});
  $('det-close')?.addEventListener('click',()=>{ S.detailPerson=null; render(); });

  // plant CRUD
  $('add-plant-btn')?.addEventListener('click',()=>openModal('plant',null));
  document.querySelectorAll('.ep-btn').forEach(b=>b.addEventListener('click',()=>{ const p=S.plants.find(x=>x.id===b.dataset.id); openModal('plant',p); }));
  document.querySelectorAll('.dp-btn').forEach(b=>b.addEventListener('click',()=>deletePlant(b.dataset.id,b.dataset.name)));

  // employee CRUD
  $('add-emp-btn')?.addEventListener('click',()=>openModal('employee',null));
  document.querySelectorAll('.ee-btn').forEach(b=>b.addEventListener('click',()=>{ const e=S.employees.find(x=>x.id===b.dataset.id); openModal('employee',e); }));
  document.querySelectorAll('.de-btn').forEach(b=>b.addEventListener('click',()=>deleteEmployee(b.dataset.id,b.dataset.name)));

  // admin CRUD
  $('add-admin-btn')?.addEventListener('click',()=>openModal('admin',null));
  document.querySelectorAll('.da-btn').forEach(b=>b.addEventListener('click',()=>deleteAdmin(b.dataset.id,b.dataset.name)));

  // filters
  $('fp-sel')?.addEventListener('change',e=>{ S.filterPlant=e.target.value; render(); });
  $('pcs-sel')?.addEventListener('change',e=>{ S.plantChartId=e.target.value; render(); });

  // zoom & PDF for all chart keys
  ['grp','plt','pa'].forEach(key=>{
    $(`zi-${key}`)?.addEventListener('click',()=>{ S.chartScale=Math.min(S.chartScale+0.1,2.5); render(); });
    $(`zo-${key}`)?.addEventListener('click',()=>{ S.chartScale=Math.max(S.chartScale-0.1,0.3); render(); });
    $(`zr-${key}`)?.addEventListener('click',()=>{ S.chartScale=1; render(); });
    $(`pdf-${key}`)?.addEventListener('click',()=>exportPDF(key));
  });
}

// ── Open / bind modal ────────────────────────────────────────────
function openModal(type,data){
  S.modal={type,data};
  S._photoFile=null;
  S._photoPreview=data?.photoURL||null;
  render();
  bindModal();
}
function bindModal(){
  $('m-close')?.addEventListener('click',closeModal);
  $('m-cancel')?.addEventListener('click',closeModal);
  $('m-overlay')?.addEventListener('click',e=>{ if(e.target.id==='m-overlay') closeModal(); });
  // photo
  $('photo-area')?.addEventListener('click',()=>$('photo-file')?.click());
  $('photo-file')?.addEventListener('change',e=>{
    const f=e.target.files[0]; if(!f) return;
    S._photoFile=f;
    const r=new FileReader();
    r.onload=ev=>{
      S._photoPreview=ev.target.result;
      const img=$('photo-img');
      if(img){ img.src=ev.target.result; }
      else{
        $('photo-area').innerHTML=`<img src="${ev.target.result}" class="photo-prev" id="photo-img"/><div style="font-size:11px;color:var(--g400);margin-top:4px">Click to change</div>`;
        $('photo-area').onclick=()=>$('photo-file')?.click();
      }
    };
    r.readAsDataURL(f);
  });
  // save
  $('m-save')?.addEventListener('click',async()=>{
    const sb=$('m-save'); sb.disabled=true; sb.textContent='Saving…';
    try{
      const type=S.modal?.type;
      if(type==='plant') await savePlant();
      else if(type==='employee') await saveEmployee();
      else if(type==='admin') await saveAdmin();
      closeModal();
    } catch(e){
      const errEl=$('m-err');
      if(errEl){ errEl.style.display='block'; errEl.textContent=e.message; }
      else toast(e.message,'er');
      sb.disabled=false; sb.textContent='Save';
    }
  });
}
function closeModal(){ S.modal=null; render(); }

// ── CRUD ops ─────────────────────────────────────────────────────
async function savePlant(){
  const name=$('m-name')?.value.trim();
  const location=$('m-loc')?.value.trim();
  const description=$('m-desc')?.value.trim();
  if(!name) throw new Error('Plant name is required');
  const data={name,location:location||'',description:description||''};
  const existing=S.modal?.data;
  if(existing?.id){ await db.collection('plants').doc(existing.id).update(data); toast('Plant updated','ok'); }
  else{ await db.collection('plants').add({...data,createdAt:new Date().toISOString()}); toast('Plant added','ok'); }
}

async function saveEmployee(){
  const name=$('m-name')?.value.trim();
  const designation=$('m-desig')?.value.trim();
  const email=$('m-email')?.value.trim();
  const contact=$('m-contact')?.value.trim();
  const myPid=S.profile?.role==='plant-admin'?S.profile.plantId:null;
  const plantId=myPid||$('m-plant')?.value;
  const parentId=$('m-parent')?.value||null;
  if(!name||!designation) throw new Error('Name and designation are required');
  if(!plantId) throw new Error('Please select a plant');
  const plant=S.plants.find(p=>p.id===plantId)?.name||'';
  let photoURL=S.modal?.data?.photoURL||null;
  if(S._photoFile){
    const ext=S._photoFile.name.split('.').pop();
    const id=S.modal?.data?.id||uid();
    const ref=stor.ref(`photos/${id}.${ext}`);
    await ref.put(S._photoFile);
    photoURL=await ref.getDownloadURL();
  }
  const data={name,designation,email:email||'',contact:contact||'',plantId,plant,parentId,photoURL};
  const existing=S.modal?.data;
  if(existing?.id){ await db.collection('employees').doc(existing.id).update(data); toast('Employee updated','ok'); }
  else{ await db.collection('employees').doc(uid()).set({...data,createdAt:new Date().toISOString()}); toast('Employee added','ok'); }
}

async function saveAdmin(){
  const name=$('m-name')?.value.trim();
  const email=$('m-email')?.value.trim();
  const pass=$('m-pass')?.value;
  const plantId=$('m-plant')?.value;
  if(!name||!email||!pass||!plantId) throw new Error('All fields are required');
  if(pass.length<8) throw new Error('Password must be at least 8 characters');
  const plant=S.plants.find(p=>p.id===plantId)?.name||'';
  // Use secondary app to avoid signing out current superadmin
  const sec=firebase.initializeApp(firebase.app().options,'sec_'+Date.now());
  const secAuth=firebase.auth(sec);
  try{
    const cred=await secAuth.createUserWithEmailAndPassword(email,pass);
    await db.collection('mompro_users').doc(cred.user.uid).set({
      uid:cred.user.uid,email,name,role:'plant-admin',plantId,plant,ini:ini(name),createdAt:new Date().toISOString()
    });
    toast('Plant Admin created successfully','ok');
  } finally{
    await secAuth.signOut().catch(()=>{});
    await sec.delete().catch(()=>{});
  }
}

async function deletePlant(id,name){
  if(!confirm(`Delete plant "${name}"? Employees in this plant will NOT be deleted.`)) return;
  try{ await db.collection('plants').doc(id).delete(); toast('Plant deleted','ok'); }
  catch(e){ toast('Error: '+e.message,'er'); }
}
async function deleteEmployee(id,name){
  if(!confirm(`Delete employee "${name}"?`)) return;
  try{ await db.collection('employees').doc(id).delete(); toast('Employee deleted','ok'); }
  catch(e){ toast('Error: '+e.message,'er'); }
}
async function deleteAdmin(id,name){
  if(!confirm(`Remove admin "${name}" from the system? (Their Firebase Auth account remains)`)) return;
  try{
    // id here is the Firestore document id stored in S.users
    await db.collection('mompro_users').doc(id).delete();
    toast('Admin removed','ok');
  }
  catch(e){ toast('Error: '+e.message,'er'); }
}

// ── PDF Export ───────────────────────────────────────────────────
async function exportPDF(key){
  const canvas=$(`oc-${key}`);
  if(!canvas){ toast('No chart to export','er'); return; }
  const btn=$(`pdf-${key}`);
  btn.textContent='Exporting…'; btn.disabled=true;
  const prev=canvas.style.transform;
  canvas.style.transform='scale(1)';
  try{
    const c=await html2canvas(canvas,{scale:2,backgroundColor:'#F7F9FC',useCORS:true,logging:false});
    canvas.style.transform=prev;
    const {jsPDF}=window.jspdf;
    const W=c.width/2, H=c.height/2;
    const pdf=new jsPDF({orientation:W>H?'landscape':'portrait',unit:'px',format:[W,H+40]});
    pdf.setFillColor(15,31,61); pdf.rect(0,0,W,36,'F');
    pdf.setFontSize(13); pdf.setFont(undefined,'bold');
    pdf.setTextColor(245,166,35); pdf.text('OrgChart Pro',12,22);
    pdf.setTextColor(255,255,255); pdf.setFontSize(11); pdf.setFont(undefined,'normal');
    pdf.text(new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}),W-12,22,{align:'right'});
    pdf.addImage(c.toDataURL('image/png'),'PNG',0,38,W,H);
    pdf.save(`OrgChart_${new Date().toLocaleDateString('en-IN').replace(/\//g,'-')}.pdf`);
    toast('PDF exported successfully','ok');
  } catch(e){
    canvas.style.transform=prev;
    toast('Export failed: '+e.message,'er');
  }
  btn.textContent='⬇ Export PDF'; btn.disabled=false;
}

// ── Start ────────────────────────────────────────────────────────
render();
