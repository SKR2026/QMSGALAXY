// Resize logo and export as PNG — preserves transparency (alpha channel).
// Never use JPEG for logos: JPEG has no alpha channel and turns transparent
// pixels black. PNG is lossless for transparency.
function compressLogoPNG(file, maxW=400, maxH=160){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      URL.revokeObjectURL(url);
      let {width:w,height:h}=img;
      const scale=Math.min(1,maxW/w,maxH/h);
      w=Math.round(w*scale); h=Math.round(h*scale);
      const canvas=document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      // Do NOT fill with any background colour — keep canvas fully transparent
      // so the logo's own alpha channel is preserved exactly.
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      const dataURL=canvas.toDataURL('image/png'); // PNG supports alpha
      resolve(dataURL);
    };
    img.onerror=()=>reject(new Error('Failed to load logo image'));
    img.src=url;
  });
}

// Compress an image File to a Blob (JPEG) at max dimensions & quality
function compressImage(file, maxW=400, maxH=400, quality=0.75){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      URL.revokeObjectURL(url);
      let {width:w,height:h}=img;
      const scale=Math.min(1,maxW/w,maxH/h);
      w=Math.round(w*scale); h=Math.round(h*scale);
      const canvas=document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      canvas.toBlob(blob=>blob?resolve(blob):reject(new Error('Compression failed')),'image/jpeg',quality);
    };
    img.onerror=()=>reject(new Error('Failed to load image'));
    img.src=url;
  });
}

async function savePlant(){
  const name=$('m-name')?.value.trim();
  const location=$('m-loc')?.value.trim();
  const description=$('m-desc')?.value.trim();
  if(!name) throw new Error('Plant name is required');
  const data={name,location:location||'',description:description||''};
  const existing=S.modal?.data;
  if(existing?.id){ await col('plants').doc(existing.id).update(data); toast('Plant updated','ok'); }
  else{ await col('plants').add({...data,createdAt:new Date().toISOString()}); toast('Plant added','ok'); }
}

async function saveEmployee(){
  const name=$('m-name')?.value.trim();
  const designation=$('m-desig')?.value.trim();
  const empCode=$('m-empcode')?.value.trim();
  const dept=$('m-dept')?.value.trim();
  const email=$('m-email')?.value.trim();
  const contact=$('m-contact')?.value.trim();
  const myPid=S.profile?.role==='plant-admin'?S.profile.plantId:null;
  const plantId=myPid||$('m-plant')?.value;
  const parentId=$('m-parent')?.value||null;
  if(!name||!designation) throw new Error('Name and designation are required');
  if(!plantId) throw new Error('Please select a plant');

  // Duplicate emp code check — exclude self when editing
  if(empCode){
    const existing=S.modal?.data;
    const duplicate=S.employees.find(e=>
      e.empCode&&e.empCode.trim().toLowerCase()===empCode.toLowerCase()&&
      e.id!==(existing?.id||'__new__')
    );
    if(duplicate) throw new Error(`Employee ID "${empCode}" is already used by ${duplicate.name}. Please use a unique Employee Code.`);
  }

  const plant=S.plants.find(p=>p.id===plantId)?.name||'';
  let photoURL=S.modal?.data?.photoURL||null;
  if(S._photoFile){
    const sb=$('m-save');
    // Compress image before uploading
    const compressed=await compressImage(S._photoFile, 400, 400, 0.75);
    const ext='jpg'; // compressImage always outputs JPEG
    const id=S.modal?.data?.id||uid();
    const ref=stor.ref(`photos/${id}.${ext}`);
    if(sb) sb.textContent='Uploading photo…';
    const uploadTask=ref.put(compressed);
    // Track upload progress
    await new Promise((resolve,reject)=>{
      uploadTask.on('state_changed',
        snap=>{
          const pct=Math.round(snap.bytesTransferred/snap.totalBytes*100);
          if(sb) sb.textContent=`Uploading… ${pct}%`;
        },
        err=>reject(err),
        ()=>resolve()
      );
    });
    if(sb) sb.textContent='Saving…';
    photoURL=await ref.getDownloadURL();
  }
  const gender=document.querySelector('input[name="m-gender"]:checked')?.value||'';
  const data={name,designation,empCode:empCode||'',dept:dept||'',email:email||'',contact:contact||'',gender,plantId,plant,parentId,photoURL};
  const existing=S.modal?.data;
  if(existing?.id){ await col('employees').doc(existing.id).update(data); toast('Employee updated','ok'); }
  else{ await col('employees').doc(uid()).set({...data,createdAt:new Date().toISOString()}); toast('Employee added','ok'); }
}

async function saveAdmin(){
  const name=$('m-name')?.value.trim();
  const email=$('m-email')?.value.trim();
  const pass=$('m-pass')?.value;
  const plantId=$('m-plant')?.value;
  if(!name||!email||!pass||!plantId) throw new Error('All fields are required');
  if(pass.length<6) throw new Error('Password must be at least 6 characters');
  const plant=S.plants.find(p=>p.id===plantId)?.name||'';
  // Use secondary app to avoid signing out current superadmin
  const sec=firebase.initializeApp(firebase.app().options,'sec_'+Date.now());
  const secAuth=firebase.auth(sec);
  try{
    const cred=await secAuth.createUserWithEmailAndPassword(email,pass);
    await db.collection('mompro_users').doc(cred.user.uid).set({
      uid:cred.user.uid,email,name,role:'plant-admin',plantId,plant,ini:ini(name),createdAt:new Date().toISOString()
    });
    toast('Plant Admin created successfully','ok');
  } finally{
    await secAuth.signOut().catch(()=>{});
    await sec.delete().catch(()=>{});
  }
}

async function deletePlant(id,name){
  if(!confirm(`Delete plant "${name}"? Employees in this plant will NOT be deleted.`)) return;
  try{ await col('plants').doc(id).delete(); toast('Plant deleted','ok'); }
  catch(e){ toast('Error: '+e.message,'er'); }
}
async function deleteEmployee(id,name){
  if(!confirm(`Delete employee "${name}"?`)) return;
  showProgress('Deleting Employee', name);
  updateProgress(0,1,'Removing from database…');
  try{
    await col('employees').doc(id).delete();
    // Unlink any children that reported to this employee
    const children=S.employees.filter(e=>e.parentId===id);
    if(children.length){
      updateProgress(0, children.length+1, 'Unlinking subordinates…');
      for(let i=0;i<children.length;i++){
        await col('employees').doc(children[i].id).update({parentId:null});
        updateProgress(i+1, children.length+1, `Unlinked: ${children[i].name}`);
      }
    }
    hideProgress();
    toast('Employee deleted','ok');
  }
  catch(e){ hideProgress(); toast('Error: '+e.message,'er'); }
}
async function deleteAdmin(id,name){
  if(!confirm(`Remove admin "${name}" from the system? (Their Firebase Auth account remains)`)) return;
  try{
    // id here is the Firestore document id stored in S.users
    await db.collection('mompro_users').doc(id).delete();
    toast('Admin removed','ok');
  }
  catch(e){ toast('Error: '+e.message,'er'); }
}

    <div class="progress-title">${title}</div>

function updateProgress(done, total, sub=''){
  const pct=total>0?Math.round((done/total)*100):0;
  const fill=$('progress-fill');
  const label=$('progress-label');
  const subEl=$('progress-sub');
  if(fill) fill.style.width=pct+'%';
  if(label) label.textContent=`${done} / ${total} (${pct}%)`;
  if(subEl&&sub) subEl.textContent=sub;
}

let _bulkRows=[];
let _bulkTargetEmployees=[]; // employees of the target structure (may differ from S.employees)
let _bulkTargetPlants=[];    // plants of the target structure (may differ from S.plants)

// Fetch employees from any structure for duplicate checking
async function fetchTargetEmployees(targetStructId){
  if(targetStructId==='__none__') return [];
  try{
    const snap = targetStructId
      ? await db.collection('structures').doc(targetStructId).collection('employees').get()
      : await db.collection('employees').get();
    return snap.docs.map(d=>({id:d.id,...d.data()}));
  } catch(e){ console.warn('Could not fetch target employees:',e); return []; }
}

// Fetch plants from any structure for plant name resolution
async function fetchTargetPlants(targetStructId){
  if(targetStructId==='__none__') return [];
  try{
    const snap = targetStructId
      ? await db.collection('structures').doc(targetStructId).collection('plants').get()
      : await db.collection('plants').get();
    return snap.docs.map(d=>({id:d.id,...d.data()}));
  } catch(e){ console.warn('Could not fetch target plants:',e); return []; }
}

function parseBulkXLSX(file){
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const data=new Uint8Array(ev.target.result);
      const wb=XLSX.read(data,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});

      if(rows.length<2){ showBulkErr('Excel file is empty or has no data rows.'); return; }

      // Normalise headers — strip parenthetical notes like "(name or emp_code)" before normalising
      const headers=rows[0].map(h=>String(h).trim().replace(/\s*\(.*?\)/g,'').trim().toLowerCase().replace(/\s+/g,'_').replace(/[^a-z_]/g,''));
      const required=['name','designation'];
      const missing=required.filter(r=>!headers.includes(r));
      if(missing.length){ showBulkErr('Missing required columns: '+missing.join(', ')+'. Check your Excel header row.'); return; }

      const col=k=>headers.indexOf(k);
      // reports_to_name column accepts multiple aliases
      const reportsToCol=()=>{
        for(const alias of ['reports_to_name','reports_to','reportsto','reportstoname','parent','reports_to_emp_code']){
          const i=col(alias); if(i>=0) return i;
        }
        return -1;
      };

      _bulkRows=[];
      for(let i=1;i<rows.length;i++){
        const cells=rows[i];
        const name=String(cells[col('name')]||'').trim();
        const designation=String(cells[col('designation')]||'').trim();
        const empCode=String(cells[col('emp_code')]||'').trim();
        const dept=String(cells[col('dept')]||'').trim();
        const email=String(cells[col('email')]||'').trim();
        const contact=String(cells[col('contact')]||'').trim();
        const genderRaw=String(cells[col('gender')]||'').trim().toLowerCase();
        const gender=['male','female','other'].includes(genderRaw)?genderRaw:'';
        const plantName=String(cells[col('plant_name')]||'').trim();
        const rtCol=reportsToCol();
        const reportsTo=rtCol>=0?String(cells[rtCol]||'').trim():'';

        // Skip completely empty rows
        if(!name&&!designation&&!email) continue;

        const rowErrs=[];
        if(!name) rowErrs.push('Name required');
        if(!designation) rowErrs.push('Designation required');

        // Resolve plant — against target structure's plants, not current
        let plantId='', resolvedPlant='';
        if(plantName){
          const found=_bulkTargetPlants.find(p=>p.name.toLowerCase()===plantName.toLowerCase());
          if(found){ plantId=found.id; resolvedPlant=found.name; }
          else rowErrs.push('Plant "'+plantName+'" not found in target structure');
        } else if(S.profile?.role==='plant-admin'){
          plantId=S.profile.plantId;
          resolvedPlant=_bulkTargetPlants.find(p=>p.id===plantId)?.name||'';
        }

        // Resolve reportsTo: try name match, then emp code match against existing employees
        let resolvedReportsTo=reportsTo; // display value (keep original input)
        if(reportsTo){
          const byName=_bulkTargetEmployees.find(e=>e.name.toLowerCase()===reportsTo.toLowerCase());
          const byCode=_bulkTargetEmployees.find(e=>e.empCode&&e.empCode.toLowerCase()===reportsTo.toLowerCase());
          const match=byName||byCode;
          if(match) resolvedReportsTo=match.name; // normalize to name for display
        }

        // Duplicate check — employee code only (against target structure, not current)
        if(empCode){
          const dbDup=_bulkTargetEmployees.find(e=>e.empCode&&e.empCode.trim().toLowerCase()===empCode.toLowerCase());
          if(dbDup) rowErrs.push(`Employee code "${empCode}" already exists in target structure (${dbDup.name})`);
          const fileDup=_bulkRows.find(r=>r.empCode&&r.empCode.toLowerCase()===empCode.toLowerCase());
          if(fileDup) rowErrs.push(`Employee code "${empCode}" duplicated in this file (row: ${fileDup.name})`);
        }

        _bulkRows.push({name,designation,empCode,dept,email,contact,gender,plantId,plant:resolvedPlant,reportsToName:reportsTo,reportsToDisplay:resolvedReportsTo,valid:rowErrs.length===0,errors:rowErrs});
      }

      if(_bulkRows.length===0){ showBulkErr('No valid data rows found in the Excel file.'); return; }
      renderBulkPreview();

    } catch(e){
      showBulkErr('Failed to read Excel file: '+e.message+'. Make sure it is a valid .xlsx file.');
    }
  };
  reader.readAsArrayBuffer(file);
}

function renderBulkPreview(){
  const sec=$('bulk-preview-section');
  const tbody=$('bulk-preview-body');
  const importBtn=$('bulk-import-btn');
  const summary=$('bulk-summary');
  if(!sec||!tbody) return;

  const valid=_bulkRows.filter(r=>r.valid).length;
  const invalid=_bulkRows.length-valid;
  sec.style.display='block';
  summary.innerHTML=`<div style="display:flex;gap:10px;flex-wrap:wrap">
    <span class="badge bk">✓ ${valid} valid row${valid!==1?'s':''}</span>
    ${invalid?`<span class="badge" style="background:rgba(239,68,68,.1);color:#dc2626">✕ ${invalid} row${invalid!==1?'s':''} with errors</span>`:''}
    <span class="badge bb">${_bulkRows.length} total rows</span>
  </div>`;

  tbody.innerHTML=_bulkRows.map((r,i)=>`<tr style="background:${r.valid?'':'rgba(239,68,68,.03)'}">
    <td style="padding:8px 12px">${r.valid
      ?'<span style="color:var(--ok);font-size:13px">✓</span>'
      :`<span title="${r.errors.join(', ')}" style="color:var(--err);font-size:13px;cursor:help">✕</span>`}</td>
    <td style="padding:8px 12px;font-size:12px;font-weight:600">${r.name||'—'}</td>
    <td style="padding:8px 12px;font-size:12px;color:var(--steel);font-weight:600">${r.empCode||'—'}</td>
    <td style="padding:8px 12px;font-size:12px;color:var(--g400)">${r.dept||'—'}</td>
    <td style="padding:8px 12px;font-size:12px;color:var(--g400)">${r.designation||'—'}</td>
    <td style="padding:8px 12px;font-size:12px;color:var(--g400)">${r.email||'—'}</td>
    <td style="padding:8px 12px;font-size:12px;color:var(--g400)">${r.contact||'—'}</td>
    <td style="padding:8px 12px;font-size:12px"><span class="badge bg">${r.plant||'—'}</span></td>
    <td style="padding:8px 12px;font-size:12px;color:var(--g400)">${r.reportsToDisplay||r.reportsToName||'—'}${r.reportsToName&&r.reportsToDisplay&&r.reportsToDisplay!==r.reportsToName?'<div style="font-size:10px;color:var(--g400)">via code: '+r.reportsToName+'</div>':''}</td>
  </tr>${!r.valid?'<tr style="background:rgba(239,68,68,.04)"><td colspan="7" style="padding:4px 12px 8px;font-size:11px;color:var(--err)">'+r.errors.join(' · ')+'</td></tr>':''}`).join('');

  importBtn.style.display=valid>0?'inline-flex':'none';
  importBtn.textContent=`⬆ Import ${valid} Valid Row${valid!==1?'s':''}`;
}

function showBulkErr(msg){
  const el=$('bulk-err'); if(!el) return;
  el.style.display='block'; el.textContent=msg;
}

async function doBulkImport(){
  const validRows=_bulkRows.filter(r=>r.valid);
  if(!validRows.length) return;

  // ── Resolve target structure ─────────────────────────────────
  const choice=(document.querySelector('input[name="bulk-struct-choice"]:checked')?.value)||'current';
  const structErrEl=$('bulk-struct-err');
  if(structErrEl) structErrEl.style.display='none';

  let targetStructId=S.activeStructId; // default = current

  if(choice==='existing'){
    const sel=$('bulk-struct-existing-sel')?.value;
    if(!sel){ if(structErrEl){structErrEl.textContent='Please select a structure.';structErrEl.style.display='block';} return; }
    targetStructId=(sel==='__default__')?'':sel;
  } else if(choice==='new'){
    const newName=$('bulk-new-struct-name')?.value.trim();
    if(!newName){ if(structErrEl){structErrEl.textContent='Please enter a name for the new structure.';structErrEl.style.display='block';} $('bulk-new-struct-name')?.focus(); return; }
    const docRef=await db.collection('structures').add({name:newName, description:$('bulk-new-struct-desc')?.value.trim()||'', createdAt:new Date().toISOString()});
    targetStructId=docRef.id;
    toast(`Structure "${newName}" created`,'ok');
  }

  // Helper to write to the right collection
  const targetCol=(name)=>{
    if(targetStructId) return db.collection('structures').doc(targetStructId).collection(name);
    return db.collection(name);
  };

  const btn=$('bulk-import-btn');
  btn.disabled=true; btn.textContent='Importing…';

  _importing=true; // suppress render() during import — prevents page flash
  const total=validRows.length;
  showProgress('Uploading Employees', `Inserting 0 of ${total}…`);

  // Build name→id AND empCode→id maps from TARGET structure's employees
  const nameMap={};
  const codeMap={};
  _bulkTargetEmployees.forEach(e=>{
    nameMap[e.name.toLowerCase()]=e.id;
    if(e.empCode) codeMap[e.empCode.toLowerCase()]=e.id;
  });

  const resolveParent=(val)=>{
    if(!val) return null;
    const v=val.trim().toLowerCase();
    return nameMap[v]||codeMap[v]||null;
  };

  let done=0, failed=0;

  // First pass: insert all employees
  for(const row of validRows){
    try{
      if(row.empCode){
        const alreadyInDB=_bulkTargetEmployees.find(e=>e.empCode&&e.empCode.trim().toLowerCase()===row.empCode.toLowerCase());
        const alreadyInserted=codeMap[row.empCode.toLowerCase()];
        if(alreadyInDB||alreadyInserted){ failed++; console.warn('Skipped duplicate emp code:',row.empCode); continue; }
      }
      const id=uid();
      const data={
        name:row.name, designation:row.designation,
        empCode:row.empCode||'', dept:row.dept||'',
        email:row.email||'', contact:row.contact||'',
        gender:row.gender||'',
        plantId:row.plantId||'', plant:row.plant||'',
        parentId:null, photoURL:null,
        createdAt:new Date().toISOString()
      };
      await targetCol('employees').doc(id).set(data);
      nameMap[row.name.toLowerCase()]=id;
      if(row.empCode) codeMap[row.empCode.toLowerCase()]=id;
      row._newId=id;
      done++;
      updateProgress(done, total, `Inserted: ${row.name}`);
    } catch(e){ failed++; console.error('Bulk insert error:',e); }
  }

  // Second pass: resolve parentIds
  updateProgress(done, total, 'Linking hierarchy…');
  for(const row of validRows){
    if(row._newId){
      const parentId=resolveParent(row.reportsToName);
      if(parentId){
        try{ await targetCol('employees').doc(row._newId).update({parentId}); }
        catch(e){ console.warn('Could not set parentId for',row.name,e); }
      }
    }
  }

  hideProgress();
  _importing=false; // re-enable render() — do one final render now
  closeModal();
  _bulkRows=[];

  const targetName = targetStructId
    ? (S.structures.find(s=>s.id===targetStructId)?.name || $('bulk-new-struct-name')?.value || targetStructId)
    : 'Default';
  const isNewStruct = choice==='new';
  const isDifferentStruct = targetStructId !== S.activeStructId;

  toast(`✓ Imported ${done} employee${done!==1?'s':''} into "${targetName}"${failed?', '+failed+' failed':''}`, done>0?'ok':'er');

  // Offer to switch to the target if it's different from current
  if(done>0 && isDifferentStruct && targetStructId!==undefined){
    setTimeout(()=>{
      if(confirm(`${done} employees uploaded to "${targetName}".\n\nSwitch to that structure now to view them?`)){
        switchStructure(targetStructId);
      }
    }, 400);
  }
}

// The company logo is stored as a base64 data URL directly in Firestore
// (see logo-save-btn handler), so no network fetch or CORS handling is
// ever needed here — it's already in memory as a data: URI.
async function captureLogoPNG(targetH=52){
  if(!S.companyLogo) return null;
  return new Promise(resolve=>{
    const img=new Image();
    img.onload=()=>drawLogoWithBg(img, targetH, resolve);
    img.onerror=()=>resolve(null);
    img.src=S.companyLogo;
    setTimeout(()=>resolve(null),4000);
  });
}

function drawLogoWithBg(img, targetH, cb){
  const PAD=Math.round(targetH*0.10);
  const R=Math.round(targetH*0.14);
  const ratio=(img.naturalWidth||img.width)/(img.naturalHeight||img.height)||1;
  const drawH=targetH-(PAD*2);
  const drawW=Math.round(drawH*ratio);
  const canW=drawW+(PAD*2);
  const canH=targetH;
  const cv=document.createElement('canvas');
  cv.width=canW; cv.height=canH;
  const ctx=cv.getContext('2d');
  // White rounded background
  ctx.fillStyle='#ffffff';
  ctx.beginPath();
  ctx.moveTo(R,0);ctx.lineTo(canW-R,0);ctx.quadraticCurveTo(canW,0,canW,R);
  ctx.lineTo(canW,canH-R);ctx.quadraticCurveTo(canW,canH,canW-R,canH);
  ctx.lineTo(R,canH);ctx.quadraticCurveTo(0,canH,0,canH-R);
  ctx.lineTo(0,R);ctx.quadraticCurveTo(0,0,R,0);
  ctx.closePath();ctx.fill();
  try{
    ctx.drawImage(img,PAD,PAD,drawW,drawH);
    cb(cv.toDataURL('image/png'));
  }catch(e){ cb(null); }
}

// Build header canvas (navy bar with logo + company name + date)
async function buildHeaderCanvas(width, title){
  const SCALE=1.5;
  const H=(S.companyLogo?68:44)*SCALE;
  const W=width;
  const cv=document.createElement('canvas');
  cv.width=W; cv.height=H;
  const ctx=cv.getContext('2d');

  // Navy background
  ctx.fillStyle='#0F1F3D';
  ctx.fillRect(0,0,W,H);

  // Gold bottom stripe
  ctx.fillStyle='#F5A623';
  ctx.fillRect(0,H-3,W,3);

  let textX=20*SCALE;

  // Logo — rendered at 75% of header height for better proportion
  const logoPNG=await captureLogoPNG(Math.round((H-16*SCALE)*0.75));
  if(logoPNG){
    const logoImg=new Image();
    await new Promise(res=>{ logoImg.onload=res; logoImg.onerror=res; logoImg.src=logoPNG; });
    if(logoImg.naturalWidth>0){
      const lH=Math.round((H-10*SCALE)*0.75);
      const lW=logoImg.naturalWidth*(lH/logoImg.naturalHeight);
      const lY=Math.round((H-lH)/2); // vertically centered
      ctx.drawImage(logoImg,6*SCALE,lY,lW,lH);
      textX=6*SCALE+lW+14*SCALE;
    }
  }

  // Title text — company name only if defined, otherwise blank
  const companyLabel=S.companyName||'';
  if(companyLabel){
    const fs1=Math.round(H*0.24);
    ctx.font=`bold ${fs1}px Inter,Arial,sans-serif`;
    ctx.fillStyle='#F5A623';
    ctx.fillText(companyLabel, textX, H*0.42);
  }

  // Subtitle — specific chart title, 50% larger font for better visibility
  if(title){
    const fs2=Math.round(H*0.255); // was 0.17 → increased by 50%
    ctx.font=`600 ${fs2}px Inter,Arial,sans-serif`;
    ctx.fillStyle='rgba(255,255,255,0.95)';
    const subtitleY=companyLabel?H*0.72:H*0.58;
    ctx.fillText(title, textX, subtitleY);
  }

  // Date right
  const dateStr=new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
  ctx.font=`${Math.round(H*0.16)}px Inter,Arial,sans-serif`;
  ctx.fillStyle='rgba(255,255,255,0.65)';
  ctx.textAlign='right';
  ctx.fillText(dateStr, W-12*SCALE, H*0.55);

  return cv;
}

// ── PDF Export ────────────────────────────────────────────────────
async function buildPDF(canvasEl, filename, title=''){
  const {jsPDF}=window.jspdf;

  // SCALE=1.5: clean integer-friendly ratio, good quality, much smaller than scale=2
  const SCALE=1.5;

  const prev=canvasEl.style.transform;
  canvasEl.style.transform='scale(1)';
  const c=await html2canvas(canvasEl,{
    scale:SCALE,
    backgroundColor:'#F7F9FC',
    useCORS:true,
    allowTaint:false,
    logging:false,
    ignoreElements:el=>el.tagName==='IMG'&&el.src&&!el.src.startsWith('data:')
  });
  canvasEl.style.transform=prev;

  // Divide by SCALE to get logical CSS px dimensions — exact with 1.5
  const W=Math.round(c.width/SCALE);
  const H=Math.round(c.height/SCALE);
  const HPDF=S.companyLogo?68:44;

  const pdf=new jsPDF({orientation:W>H?'landscape':'portrait',unit:'px',format:[W,H+HPDF],hotfixes:['px_scaling']});

  // Header: pass exact canvas pixel width for crisp 1:1 mapping
  const hdrCv=await buildHeaderCanvas(c.width, title||'');
  const hdrJPG=hdrCv.toDataURL('image/jpeg',0.88);
  pdf.addImage(hdrJPG,'JPEG',0,0,W,HPDF);

  // Chart: JPEG 0.82 — visually sharp, significantly smaller than PNG
  pdf.addImage(c.toDataURL('image/jpeg',0.82),'JPEG',0,HPDF,W,H);

  pdf.save(filename);
}

async function exportPDF(key){

// ── Excel Export — hierarchical structure matching the on-screen tree ──
// Produces exactly ONE .xlsx file that mirrors the visible org chart via
// indentation (depth-based prefixes). If any step fails, nothing is
// downloaded — no broken or partial files are left behind.
function flattenTreeForExport(node, depth, rows){
  if(!node) return;
  if(node._isVirtualRoot){
    (node.children||[]).forEach(c=>flattenTreeForExport(c, depth, rows));
    return;
  }
  const indent='    '.repeat(depth) + (depth>0?'└─ ':'');
  const contextTag=node._isContext?' (context)':'';
  const isDeptHeader=!!node._isDeptHeader;
  rows.push([
    indent+node.name+contextTag,
    isDeptHeader?'':node.designation,
    isDeptHeader?'':(node.empCode||''),
    isDeptHeader?'':(node.dept||''),
    isDeptHeader?'':(node.plant||''),
    isDeptHeader?'':(node.email||''),
    isDeptHeader?'':(node.contact||'')
  ]);
  (node.children||[]).forEach(c=>flattenTreeForExport(c, depth+1, rows));
}

async function exportXLSX(key){
  const isPublic=key==='pub';
  const btn=isPublic?$('pub-xlsx'):$(`xlsx-${key}`);
  if(btn){ btn.textContent='Exporting…'; btn.disabled=true; }

  try{
    const companyName=S.companyName||'Organisation';
    const dateStr=new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});

    // Build the same tree structure shown on screen for this chart key
    let tree=null, sheetTitle='Group Organisation Chart';
    if(key==='plt'||isPublic&&S.plantChartId){
      const pid=S.plantChartId;
      if(!pid) throw new Error('Select a plant first');
      const plant=S.plants.find(p=>p.id===pid);
      const emps=S.employees.filter(e=>e.plantId===pid);
      if(!emps.length) throw new Error('No employees in this plant to export');
      tree=buildTreeWithAncestors(emps, S.employees);
      sheetTitle=(plant?.name||'Plant')+' Organisation Chart';
    } else if(key==='dpt'){
      // Support both admin dept chart (deptChartId) and public dept tab (_pubDept)
      const deptId=S.deptChartId||S._pubDept;
      if(!deptId) throw new Error('Select a department first');
      const scope=S.deptChartPlant?S.employees.filter(e=>e.plantId===S.deptChartPlant):S.employees;
      const emps=scope.filter(e=>(e.dept||'').toLowerCase()===deptId.toLowerCase());
      if(!emps.length) throw new Error('No employees in this department to export');
      tree=buildTreeWithAncestors(emps, S.employees);
      sheetTitle=deptId+' Department Chart';
    } else if(key==='pa'){
      if(!S.profile?.plantId) throw new Error('No plant assigned');
      const plant=S.plants.find(p=>p.id===S.profile.plantId);
      const emps=S.employees.filter(e=>e.plantId===S.profile.plantId);
      if(!emps.length) throw new Error('No employees to export');
      tree=buildTree(emps);
      sheetTitle=(plant?.name||'My Plant')+' Organisation Chart';
    } else if(isPublic){
      // Public view: group or plant depending on current filter
      if(S.plantChartId){
        const pid=S.plantChartId;
        const plant=S.plants.find(p=>p.id===pid);
        const emps=S.employees.filter(e=>e.plantId===pid);
        if(!emps.length) throw new Error('No employees in this plant to export');
        tree=buildTreeWithAncestors(emps, S.employees);
        sheetTitle=(plant?.name||'Plant')+' Organisation Chart';
      } else {
        if(!S.employees.length) throw new Error('No employees to export');
        tree=buildTree(S.employees);
        sheetTitle='Group Organisation Chart';
      }
    } else {
      // 'grp' — full group chart
      if(!S.employees.length) throw new Error('No employees to export');
      tree=buildTree(S.employees);
      sheetTitle='Group Organisation Chart';
    }

    if(!tree) throw new Error('No chart data available to export');

    // Flatten tree into indented rows (mirrors on-screen hierarchy)
    const treeRows=[];
    flattenTreeForExport(tree, 0, treeRows);
    if(!treeRows.length) throw new Error('Chart is empty — nothing to export');

    const headerRows=[
      [companyName],
      [sheetTitle],
      ['Exported: '+dateStr],
      [],
      ['Name (indented by level)','Designation','Emp Code','Department','Plant','Email','Contact'],
    ];

    const allRows=[...headerRows, ...treeRows];
    const ws=XLSX.utils.aoa_to_sheet(allRows);
    ws['!cols']=[{wch:38},{wch:20},{wch:12},{wch:16},{wch:16},{wch:28},{wch:16}];
    ws['!merges']=[
      {s:{r:0,c:0},e:{r:0,c:6}},
      {s:{r:1,c:0},e:{r:1,c:6}},
      {s:{r:2,c:0},e:{r:2,c:6}},
    ];

    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, sheetTitle.substring(0,31).replace(/[\\/?*[\]:]/g,''));

    // Only write the file if everything above succeeded — no partial output.
    const fileSuffix=`${sheetTitle.replace(/\s+/g,'_')}_${new Date().toLocaleDateString('en-IN').replace(/\//g,'-')}`;
    XLSX.writeFile(wb, `${companyName.replace(/\s+/g,'_')}_${fileSuffix}.xlsx`);

    toast('Excel exported successfully','ok');
  } catch(e){
    console.error('Excel export error:',e);
    toast('Excel export failed: '+e.message,'er');
    // No file is written on failure — nothing to clean up.
  }

  if(btn){ btn.textContent='⬇ Excel'; btn.disabled=false; }
}

    <div class="fg"><label class="lbl">Description</label><input class="inp" id="struct-desc-inp" placeholder="Optional note"/></div>
  </div>
  <div id="struct-form-err" style="display:none;color:var(--err);font-size:12px;margin-bottom:8px"></div>
  <div style="display:flex;gap:8px">
    <button class="btn bp bsm" id="struct-form-save-btn">💾 Save</button>
    <button class="btn bo bsm" id="struct-form-cancel-btn">Cancel</button>
  </div>
</div>`;
}

function bindStructures(){
  // Add new
  $('struct-add-btn')?.addEventListener('click',()=>{
    $('struct-edit-id').value='';
    $('struct-name-inp').value='';
    $('struct-desc-inp').value='';
    $('struct-form-title').textContent='New Structure';
    $('struct-form-err').style.display='none';
    const w=$('struct-form-wrap'); w.style.display='block'; w.scrollIntoView({behavior:'smooth'});
    $('struct-name-inp').focus();
  });

  // Cancel
  $('struct-form-cancel-btn')?.addEventListener('click',()=>{ $('struct-form-wrap').style.display='none'; });

  // Save (create or rename)
  $('struct-form-save-btn')?.addEventListener('click',async()=>{
    const name=$('struct-name-inp').value.trim();
    const desc=$('struct-desc-inp').value.trim();
    const editId=$('struct-edit-id').value;
    const errEl=$('struct-form-err');
    errEl.style.display='none';
    if(!name){ errEl.textContent='Structure name is required.'; errEl.style.display='block'; return; }
    const btn=$('struct-form-save-btn'); btn.disabled=true; btn.textContent='Saving…';
    try{
      if(editId){
        await db.collection('structures').doc(editId).update({name, description:desc, updatedAt:new Date().toISOString()});
        toast(`"${name}" renamed`,'ok');
      } else {
        const docRef=await db.collection('structures').add({name, description:desc||'', createdAt:new Date().toISOString()});
        toast(`Structure "${name}" created`,'ok');
        // Optionally switch to the new structure
        if(confirm(`Switch to "${name}" now?`)){ await switchStructure(docRef.id); return; }
      }
      $('struct-form-wrap').style.display='none';
    } catch(e){ errEl.textContent='Error: '+e.message; errEl.style.display='block'; }
    btn.disabled=false; btn.textContent='💾 Save';
  });

  // Rename buttons
  document.querySelectorAll('.struct-rename-btn').forEach(b=>{
    b.addEventListener('click',()=>{
      $('struct-edit-id').value=b.dataset.id;
      $('struct-name-inp').value=b.dataset.name||'';
      $('struct-desc-inp').value=b.dataset.desc||'';
      $('struct-form-title').textContent='Rename Structure';
      $('struct-form-err').style.display='none';
      const w=$('struct-form-wrap'); w.style.display='block'; w.scrollIntoView({behavior:'smooth'});
      $('struct-name-inp').focus();
    });
  });

  // Switch buttons
  document.querySelectorAll('.struct-switch-btn').forEach(b=>{
    b.addEventListener('click',()=>switchStructure(b.dataset.id));
  });

  // Back to default
  $('struct-go-default-btn')?.addEventListener('click',()=>switchStructure(''));

  // Delete
  document.querySelectorAll('.struct-delete-btn').forEach(b=>{
    b.addEventListener('click',async()=>{
      const name=b.dataset.name;
      if(!confirm(`Delete structure "${name}"?\n\nThis will permanently delete ALL plants and employees stored in this structure. This cannot be undone.`)) return;
      const id=b.dataset.id;
      try{
        // Delete sub-collections first
        await deleteStructureData(id);
        await db.collection('structures').doc(id).delete();
        if(S.activeStructId===id){ await switchStructure(''); return; }
        toast(`Structure "${name}" deleted`,'ok');
      } catch(e){ toast('Delete failed: '+e.message,'er'); }
    });
  });

  // Export named structures
  document.querySelectorAll('.struct-export-btn').forEach(b=>{
    b.addEventListener('click',()=>exportStructure(b.dataset.id, b.dataset.name));
  });

  // Export default
  $('struct-export-default-btn')?.addEventListener('click',()=>exportStructure('','Default'));

  // Import
  $('struct-import-btn')?.addEventListener('click',()=>$('struct-import-file')?.click());
  $('struct-import-file')?.addEventListener('change',e=>{
    const f=e.target.files[0]; if(!f) return;
    importStructure(f);
    e.target.value=''; // reset so same file can be re-picked
  });
}

async function switchStructure(id){
  S.activeStructId=id;
  S.plants=[]; S.employees=[]; S.departments=[];
  S.tab='dashboard';
  S.filterPlant=''; S.plantChartId=''; S.deptChartId=''; S.deptChartPlant='';
  S.collapsed=new Set();
  // Restart listeners with new scope
  startListeners();
  render();
  const name=id?(S.structures.find(s=>s.id===id)?.name||id):'Default';
  toast(`Switched to "${name}"`,'ok');
}

async function deleteStructureData(structId){
  // Delete all plants and employees in this structure
  const plantsSnap=await db.collection('structures').doc(structId).collection('plants').get();
  const empsSnap=await db.collection('structures').doc(structId).collection('employees').get();
  const batch=db.batch();
  plantsSnap.docs.forEach(d=>batch.delete(d.ref));
  empsSnap.docs.forEach(d=>batch.delete(d.ref));
  await batch.commit();
}

async function exportStructure(structId, structName){
  try{
    let plants, employees;
    if(structId){
      const ps=await db.collection('structures').doc(structId).collection('plants').get();
      const es=await db.collection('structures').doc(structId).collection('employees').get();
      plants=ps.docs.map(d=>({id:d.id,...d.data()}));
      employees=es.docs.map(d=>({id:d.id,...d.data()}));
    } else {
      // Export root/default
      plants=S.plants;
      employees=S.employees;
    }
    const data={
      exportVersion:1,
      structureName:structName||'Default',
      exportedAt:new Date().toISOString(),
      plants,
      employees
    };
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`OrgStructure_${(structName||'Default').replace(/\s+/g,'_')}_${new Date().toLocaleDateString('en-IN').replace(/\//g,'-')}.json`;
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    toast(`"${structName}" exported (${plants.length} plants, ${employees.length} employees)`,'ok');
  } catch(e){ toast('Export failed: '+e.message,'er'); }
}

async function importStructure(file){
  const reader=new FileReader();
  reader.onload=async ev=>{
    try{
      const data=JSON.parse(ev.target.result);
      if(!data.exportVersion||!Array.isArray(data.plants)||!Array.isArray(data.employees)){
        toast('Invalid structure file — must be exported from this tool.','er'); return;
      }
      const suggestedName=data.structureName||file.name.replace(/\.json$/,'').replace(/_/g,' ');
      const name=prompt(`Import as structure:\n\nPlants: ${data.plants.length}, Employees: ${data.employees.length}\n\nEnter a name for this structure:`, suggestedName);
      if(!name) return;

      // Create the structure document
      const docRef=await db.collection('structures').add({
        name, description:`Imported from ${file.name}`, createdAt:new Date().toISOString()
      });
      const sid=docRef.id;

      // Build plant ID mapping (old id → new id)
      const plantIdMap={};
      showProgress('Importing Structure', 'Creating plants…');
      for(let i=0;i<data.plants.length;i++){
        const p=data.plants[i];
        const {id:oldId,...pData}=p;
        const newRef=await db.collection('structures').doc(sid).collection('plants').add(pData);
        if(oldId) plantIdMap[oldId]=newRef.id;
        updateProgress(i+1, data.plants.length+data.employees.length, `Plant: ${p.name}`);
      }

      // Import employees, remapping plantId
      const empIdMap={};
      for(let i=0;i<data.employees.length;i++){
        const e=data.employees[i];
        const {id:oldId,...eData}=e;
        if(eData.plantId&&plantIdMap[eData.plantId]) eData.plantId=plantIdMap[eData.plantId];
        const newRef=await db.collection('structures').doc(sid).collection('employees').doc(uid()).set(eData);
        updateProgress(data.plants.length+i+1, data.plants.length+data.employees.length, `Employee: ${e.name}`);
      }

      hideProgress();
      toast(`"${name}" imported: ${data.plants.length} plants, ${data.employees.length} employees`,'ok');
      if(confirm(`Import complete!\n\nSwitch to "${name}" now?`)){ await switchStructure(sid); }
    } catch(e){ hideProgress(); toast('Import failed: '+e.message,'er'); console.error(e); }
  };
  reader.readAsText(file);
}

// ── Start ────────────────────────────────────────────────────────
render();
</script>
</body>
</html>
