<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>OrgChart Pro – Plant Management System</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<!-- Firebase v9 compat CDN - no npm needed -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<!-- PDF export CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<!-- SheetJS for XLSX read/write -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --navy:#0F1F3D;--navy-l:#1E3A6E;--steel:#1E4080;
  --gold:#F5A623;--gold-l:#FBBF45;
  --white:#fff;--off:#F7F9FC;
  --g50:#F0F4FA;--g100:#E8ECF2;--g200:#CDD5E0;--g400:#8494AA;--g600:#4A5568;--g800:#1A2535;
  --ok:#22C55E;--err:#EF4444;
  --shadow:0 4px 16px rgba(15,31,61,.12);--r:10px;--rl:16px;
  font-family:'Inter',-apple-system,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--off);color:var(--g800);font-size:14px;line-height:1.6;min-height:100vh}
#app{min-height:100vh}

/* Layout */
.layout{display:flex;min-height:100vh}
.sidebar{width:230px;height:100vh;background:var(--navy);display:flex;flex-direction:column;position:fixed;top:0;left:0;z-index:100;overflow:hidden}
.main{margin-left:230px;flex:1;display:flex;flex-direction:column;min-height:100vh}
.topbar{height:60px;background:var(--white);border-bottom:1px solid var(--g100);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:50;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.page{padding:24px;flex:1}

/* Sidebar */
.s-logo{padding:18px 18px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.s-logo h1{color:#fff;font-size:17px;font-weight:800;line-height:1.2}
.s-logo span{color:var(--gold)}
.s-logo p{color:rgba(255,255,255,.35);font-size:11px;margin-top:2px}
.s-logo-img{width:auto;max-width:100%;max-height:48px;object-fit:contain;display:block;}
.s-logo-img-wrap{background:#ffffff;border-radius:10px;padding:8px 10px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:10px;box-shadow:0 1px 6px rgba(0,0,0,.18);max-width:100%;}
.logo-upload-area{border:2px dashed rgba(255,255,255,.2);border-radius:10px;padding:14px;text-align:center;cursor:pointer;transition:all .15s;background:rgba(255,255,255,.04);margin-top:10px}
.logo-upload-area:hover{border-color:var(--gold);background:rgba(245,166,35,.06)}
.s-nav{padding:14px 10px;flex:1;overflow-y:auto}
.s-nav::-webkit-scrollbar{width:3px}
.s-nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:2px}
.s-sec{color:rgba(255,255,255,.3);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;padding:14px 10px 5px}
.nav-btn{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:8px;color:rgba(255,255,255,.6);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;border:none;background:none;width:100%;text-align:left;margin-bottom:2px;font-family:inherit}
.nav-btn:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-btn.active{background:var(--gold);color:var(--navy);font-weight:700}
.s-foot{padding:14px 10px;border-top:1px solid rgba(255,255,255,.08)}
.u-pill{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:8px;background:rgba(255,255,255,.06)}
.u-av{width:30px;height:30px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:var(--navy);flex-shrink:0}
.u-nm{color:#fff;font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.u-rl{color:rgba(255,255,255,.35);font-size:11px}
.lo-btn{display:flex;align-items:center;gap:8px;padding:8px 11px;border-radius:8px;color:rgba(255,255,255,.4);font-size:12px;cursor:pointer;border:none;background:none;width:100%;margin-top:6px;transition:all .15s;font-family:inherit}
.lo-btn:hover{background:rgba(239,68,68,.15);color:var(--err)}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border:none;border-radius:var(--r);font-size:13px;font-weight:600;cursor:pointer;transition:all .17s;white-space:nowrap;font-family:inherit}
.bp{background:var(--gold);color:var(--navy)}.bp:hover{background:var(--gold-l);transform:translateY(-1px);box-shadow:var(--shadow)}
.bs{background:var(--navy);color:#fff}.bs:hover{background:var(--navy-l);transform:translateY(-1px)}
.bo{background:transparent;border:1.5px solid var(--g200);color:var(--g600)}.bo:hover{border-color:var(--steel);color:var(--steel);background:var(--g50)}
.bd{background:var(--err);color:#fff}.bd:hover{background:#dc2626}
.bsm{padding:5px 11px;font-size:12px}.bic{padding:6px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}

/* Forms */
.fg{margin-bottom:14px}
.lbl{display:block;font-size:11px;font-weight:700;color:var(--g600);margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em}
.inp{width:100%;padding:9px 13px;border:1.5px solid var(--g200);border-radius:var(--r);font-size:14px;color:var(--g800);background:#fff;transition:border-color .15s;font-family:inherit;outline:none}
.inp:focus{border-color:var(--steel);box-shadow:0 0 0 3px rgba(30,64,128,.08)}
.inp::placeholder{color:var(--g400)}
select.inp{cursor:pointer}
textarea.inp{resize:vertical;min-height:70px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* Cards/stats */
.card{background:#fff;border-radius:var(--rl);border:1px solid var(--g100);box-shadow:0 1px 3px rgba(15,31,61,.07)}
.card-h{padding:16px 20px;border-bottom:1px solid var(--g100);display:flex;align-items:center;justify-content:space-between}
.card-h h3{font-size:14px;font-weight:700;color:var(--navy)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:24px}
.stat{background:#fff;border-radius:var(--rl);padding:18px;border:1px solid var(--g100);box-shadow:0 1px 3px rgba(15,31,61,.07)}
.sv{font-size:30px;font-weight:800;color:var(--navy);line-height:1}
.sl{font-size:12px;color:var(--g400);margin-top:3px;font-weight:500}
.si{font-size:22px;margin-bottom:8px}

/* Table */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{background:var(--g50);color:var(--g600);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:11px 14px;text-align:left}
td{padding:12px 14px;border-bottom:1px solid var(--g100);font-size:13px}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--g50)}
/* Compact table variant */
.table-compact th{padding:6px 8px;font-size:10px}
.table-compact td{padding:4px 8px;border-bottom:1px solid var(--g100);font-size:12px}
.table-compact tr:hover td{background:var(--g50)}

/* Badge */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
.bg{background:rgba(245,166,35,.12);color:#B7791F}
.bb{background:rgba(30,64,128,.1);color:var(--steel)}
.bk{background:rgba(34,197,94,.1);color:#16a34a}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(10,20,40,.55);display:flex;align-items:center;justify-content:center;z-index:999;backdrop-filter:blur(4px);padding:20px}
.modal{background:#fff;border-radius:var(--rl);width:100%;max-width:500px;max-height:90vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.25);animation:su .2s ease}
.mh{padding:20px 22px 16px;border-bottom:1px solid var(--g100);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:1}
.mh h3{font-size:16px;font-weight:800;color:var(--navy)}
.mb{padding:22px}
.mf{padding:14px 22px;border-top:1px solid var(--g100);display:flex;gap:10px;justify-content:flex-end}
@keyframes su{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

/* Toasts */
#toasts{position:fixed;bottom:22px;right:22px;z-index:9999;display:flex;flex-direction:column;gap:7px}
.toast{display:flex;align-items:center;gap:9px;padding:11px 16px;border-radius:var(--r);background:var(--navy);color:#fff;font-size:13px;font-weight:500;box-shadow:var(--shadow);animation:si .2s ease;min-width:220px}
.tok{border-left:4px solid var(--ok)}.ter{border-left:4px solid var(--err)}.tin{border-left:4px solid var(--gold)}
@keyframes si{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}

/* Login */
.login-page{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--navy) 0%,var(--steel) 60%,#1a4d8f 100%);padding:24px}
.lp-brand{text-align:center;margin-bottom:40px}
.lp-brand h1{font-size:32px;font-weight:900;color:#fff;line-height:1.2;letter-spacing:-.5px}
.lp-brand span{color:var(--gold)}
.lp-brand p{color:rgba(255,255,255,.45);font-size:13px;margin-top:6px}
.lp-cards{display:flex;gap:20px;width:100%;max-width:620px;align-items:stretch}
/* View card — full opacity, prominent */
.lp-card{border-radius:20px;padding:36px 28px;display:flex;flex-direction:column;align-items:center;text-align:center;cursor:pointer;transition:all .2s;text-decoration:none;flex:1}
.lp-card-view{background:rgba(255,255,255,1);box-shadow:0 12px 40px rgba(0,0,0,.25)}
.lp-card-view:hover{transform:translateY(-4px);box-shadow:0 20px 50px rgba(0,0,0,.3)}
/* Login card — faded/muted */
.lp-card-login{background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.18);opacity:.7}
.lp-card-login:hover{opacity:1;background:rgba(255,255,255,.18);transform:translateY(-2px)}
.lp-icon{width:18px;height:18px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;margin-bottom:8px}
.lp-icon-view{background:linear-gradient(135deg,#e8f5e9,#c8e6c9)}
.lp-icon-login{background:rgba(255,255,255,.15)}
.lp-card-title{font-size:16px;font-weight:800;margin-bottom:6px}
.lp-card-view .lp-card-title{color:var(--navy)}
.lp-card-login .lp-card-title{color:#fff}
.lp-card-desc{font-size:12px;line-height:1.6;margin-bottom:20px}
.lp-card-view .lp-card-desc{color:var(--g400)}
.lp-card-login .lp-card-desc{color:rgba(255,255,255,.55)}
.lp-badge{display:inline-block;font-size:11px;font-weight:700;padding:4px 12px;border-radius:20px;letter-spacing:.03em}
.lp-badge-view{background:rgba(34,197,94,.12);color:#16a34a}
.lp-badge-login{background:rgba(255,255,255,.15);color:rgba(255,255,255,.7)}
/* Login form — slides in below the cards */
.lp-form-wrap{width:100%;max-width:380px;background:rgba(255,255,255,1);border-radius:20px;padding:28px 32px;box-shadow:0 12px 40px rgba(0,0,0,.2);display:none;animation:su .25s ease}
.lp-form-wrap.show{display:block}
.lp-cards.hidden{display:none}
.lp-back{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--g400);cursor:pointer;border:none;background:none;font-family:inherit;margin-bottom:16px;padding:0}
.lp-back:hover{color:var(--navy)}
/* ── RESPONSIVE HAMBURGER BUTTON ── */
.hamburger{display:none;position:fixed;top:14px;left:14px;z-index:200;width:36px;height:36px;border-radius:8px;background:var(--navy);border:none;cursor:pointer;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:0;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.hamburger span{display:block;width:18px;height:2px;background:#fff;border-radius:2px;transition:all .2s}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:99;backdrop-filter:blur(2px)}

/* ── TABLET (≤900px) ── */
@media(max-width:900px){
  .sidebar{width:200px}
  .main{margin-left:200px}
  .stats{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
  .g2{grid-template-columns:1fr}
  /* Dashboard 2-col grid → single col */
  .page > div[style*="grid-template-columns:1fr 1fr"]{display:block!important}
  .page > div[style*="grid-template-columns:1fr 1fr"] > *{margin-bottom:16px}
}

/* ── MOBILE (≤680px) ── */
@media(max-width:680px){
  .hamburger{display:flex}
  .sidebar{left:-240px;width:240px;transition:left .25s ease;z-index:150;box-shadow:none}
  .sidebar.open{left:0;box-shadow:0 0 40px rgba(0,0,0,.35)}
  .sidebar-overlay{display:none}
  .sidebar-overlay.show{display:block}
  .main{margin-left:0!important}
  .topbar{padding:0 14px 0 58px;height:56px}
  .topbar > div:first-child > div:first-child{font-size:13px}
  .topbar > div:first-child > div:last-child{font-size:11px}
  /* Hide struct badge and sign-out in topbar on mobile */
  #topbar-signout-btn{display:none!important}
  .page{padding:14px}
  /* Stats */
  .stats{grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
  .sv{font-size:24px}
  .stat{padding:13px}
  /* Dashboard cards stacked */
  .page > div[style*="grid-template-columns"]{display:block!important}
  .page > div[style*="grid-template-columns"] > .card{margin-bottom:14px}
  /* Forms */
  .g2{grid-template-columns:1fr}
  /* Employee/plant top bar */
  .fl.ac.jb.mb16{flex-direction:column!important;align-items:flex-start!important;gap:10px}
  .fl.ac.jb.mb16 .fl.g2h{flex-wrap:wrap;gap:6px}
  /* Org toolbar wrap */
  .org-tb{flex-wrap:wrap;gap:6px;padding:8px 10px}
  .org-t{width:100%}
  /* Hide some toolbar elements on mobile to reduce clutter */
  #expand-all-grp,#expand-all-plt,#expand-all-dpt,
  #collapse-all-grp,#collapse-all-plt,#collapse-all-dpt,
  #expand-all-pa,#collapse-all-pa{display:none}
  /* Zoom buttons compact */
  .org-tb > span[style*="min-width:38px"]{min-width:30px!important;font-size:11px!important}
  /* Table: make scrollable with frozen name column */
  .tw{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
  table{min-width:520px}
  /* LP cards vertical */
  .lp-cards{flex-direction:column;max-width:320px}
  .lp-card{padding:24px 18px}
  /* Modal full width */
  .modal{max-width:100%;border-radius:16px 16px 0 0;position:fixed;bottom:0;left:0;right:0;max-height:92vh}
  .overlay{align-items:flex-end;padding:0}
  /* Login form */
  .lp-form-wrap{padding:22px 18px;border-radius:16px}
}

/* ── SMALL MOBILE (≤400px) ── */
@media(max-width:400px){
  .stats{grid-template-columns:1fr 1fr}
  .sv{font-size:22px}
  .si{font-size:18px}
  .lp-cards{max-width:100%}
  .page{padding:10px}
}

/* Org chart */
.org-wrap{overflow:auto;background:#fff;border-radius:var(--rl);border:1px solid var(--g100);min-height:380px}
.org-canvas{display:inline-flex;min-width:100%;justify-content:center;padding:44px 36px;transform-origin:top center;transition:transform .2s;will-change:transform}
/* GPU-promote individual nodes for large trees so CSS transforms are cheap */
.ocard{contain:layout style;}
.org-tb{display:flex;align-items:center;gap:8px;padding:11px 14px;background:#fff;border-radius:var(--rl);border:1px solid var(--g100);margin-bottom:14px;flex-wrap:wrap}
.org-t{font-size:13px;font-weight:700;color:var(--navy);flex:1}
.onode{display:flex;flex-direction:column;align-items:center;position:relative}
.ocard{background:#fff;border:2px solid var(--g200);border-radius:12px;padding:13px 14px;width:168px;cursor:pointer;transition:all .2s;text-align:center;box-shadow:0 1px 4px rgba(15,31,61,.08);position:relative}
.ocard:hover{border-color:var(--steel);box-shadow:var(--shadow);transform:translateY(-2px)}
.ocard.root-card{border-color:var(--gold);background:var(--navy)}
.ocard.root-card .oname{color:#fff}
.ocard.root-card .odesig{color:rgba(255,255,255,.55)}
.oav{width:50px;height:50px;border-radius:50%;object-fit:cover;margin:0 auto 7px;display:block;border:2px solid var(--g100)}
.oavph{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,var(--steel),var(--navy));margin:0 auto 7px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:700}
.oname{font-size:11px;font-weight:700;color:var(--navy);line-height:1.3}
.odesig{font-size:10px;color:var(--g400);margin-top:2px;font-weight:500}
.oplant{font-size:9px;color:var(--gold);margin-top:3px;font-weight:600}
.odept{font-size:9px;color:var(--steel);margin-top:2px;font-weight:600}
.ocode{font-size:9px;color:var(--g400);margin-top:1px}
.ocol{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);width:16px;height:16px;border-radius:50%;border:1.5px solid var(--g200);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:8px;color:var(--g400);transition:all .15s;z-index:5;font-family:inherit}
.ocol:hover{border-color:var(--steel);color:var(--steel)}
/* Connector lines */
.conn-v{width:2px;background:var(--g200);margin:0 auto}
.ochildren{display:flex;gap:0;position:relative;align-items:flex-start}

/* ── Administrative Reporting Lines ────────────────────────────── */
#admin-lines-svg{position:absolute;top:0;left:0;pointer-events:none;overflow:visible;z-index:10;width:100%;height:100%}
.admin-badge{position:absolute;top:3px;right:3px;background:var(--gold);color:var(--navy);border-radius:4px;padding:1px 4px;font-size:7px;font-weight:800;letter-spacing:.04em;line-height:1.3;white-space:nowrap;cursor:help;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.adm-row{display:flex;align-items:center;gap:10px;padding:9px 13px;background:rgba(245,166,35,.08);border:1px solid rgba(245,166,35,.25);border-radius:8px;margin-bottom:8px;font-size:13px;color:var(--g800)}

/*
  Each child column wrapper:
  - Has a top border (horizontal segment of the T)
  - Contains a vertical drop line + the child node
  The trick: the horizontal line sits at top:0 of each ochild-wrap.
  The vertical conn-v inside it must start RIGHT at that horizontal line.
  We remove the inner conn-v and use ::after on ochild-wrap instead.
*/
.ochild-wrap{
  display:flex;
  flex-direction:column;
  align-items:center;
  position:relative;
  padding:0 5px; /* replaces gap on ochildren */
}
/* Horizontal segment across full width of each child slot */
.ochild-wrap::before{
  content:'';
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:2px;
  background:var(--g200);
}
/* First child: horizontal line starts at its own center → right */
.ochild-wrap[data-first="true"]::before{ left:50%; }
/* Last child: horizontal line runs left → its own center */
.ochild-wrap[data-last="true"]::before{ right:50%; }
/* Single child: no horizontal line */
.ochild-wrap[data-only="true"]::before{ display:none; }

/* Vertical drop from the horizontal bar down to the card */
.ochild-wrap::after{
  content:'';
  position:absolute;
  top:0;
  left:50%;
  transform:translateX(-50%);
  width:2px;
  height:16px; /* matches conn-drop height */
  background:var(--g200);
}
/* Single child vertical still needed */
.ochild-wrap[data-only="true"]::after{ height:16px; }

/* Progress bar — bottom toast style, no background dim */
.progress-overlay{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:9998;width:380px;max-width:calc(100vw - 32px)}
.progress-box{background:var(--navy);border-radius:var(--rl);padding:16px 20px;box-shadow:0 8px 32px rgba(0,0,0,.35);animation:si .2s ease}
.progress-title{font-size:13px;font-weight:700;color:#fff;margin-bottom:2px}
.progress-sub{font-size:11px;color:rgba(255,255,255,.5);margin-bottom:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progress-track{height:6px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden;margin-bottom:6px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--steel),var(--gold));border-radius:3px;transition:width .2s ease;width:0%}
.progress-label{font-size:11px;color:rgba(255,255,255,.45);text-align:right;font-weight:600}

/* Photo upload */
.photo-area{border:2px dashed var(--g200);border-radius:var(--r);padding:18px;text-align:center;cursor:pointer;transition:all .15s;background:var(--g50);margin-bottom:14px}

// ── Debounced render for chart interactions ──────────────────────
// Collapses/search on 250-node charts can fire render() many times per second.
// This batches rapid calls into one rAF so the browser never drops frames.
let _renderPending = false;
function renderDeferred(){
  if(_renderPending) return;
  _renderPending = true;
  requestAnimationFrame(()=>{ _renderPending=false; render(); });
}

function toast(msg, type='in'){
  const t=document.createElement('div');
  t.className=`toast t${type}`;
  const icons={tok:'✓',ter:'✕',tin:'ℹ'};
  t.innerHTML=`<span>${icons['t'+type]||'ℹ'}</span><span style="flex:1">${msg}</span>`;
  $('toasts').appendChild(t);
  setTimeout(()=>t.remove(),3500);
}

// Count total nodes in a tree (iterative, safe for 250+)
function countNodes(node){
  if(!node) return 0;
  let count=0;
  const stack=[node];
  while(stack.length){ const n=stack.pop(); count++; (n.children||[]).forEach(c=>stack.push(c)); }
  return count;
}

function buildTree(emps){
  if(!emps||!emps.length) return null;
  const map={};
  emps.forEach(e=>{ map[e.id]={...e,children:[]} });
  const roots=[];
  emps.forEach(e=>{
    if(!e.parentId||!map[e.parentId]) roots.push(map[e.id]);
    else map[e.parentId].children.push(map[e.id]);
  });
  if(roots.length===0) return null;
  if(roots.length===1) return roots[0];
  // Multiple roots — wrap in a virtual group node
  return {id:'__virtual_root__',name:'Organisation',designation:'',_isVirtualRoot:true,children:roots};
}

// Fetch user profile with retry + multiple lookup strategies
async function fetchUserProfile(user, attempt=1){
  const MAX=3;
  try{
    // Strategy 1: query by email (most common — works when Firestore index exists)
    const byEmail=await db.collection('mompro_users').where('email','==',user.email).get();
    if(!byEmail.empty){
      const rolePriority=r=>{ const rr=(r||'').trim().toLowerCase(); if(rr.includes('super')) return 3; if(rr.includes('plant')||rr.includes('admin')) return 2; return 1; };
      const docs=byEmail.docs.map(d=>({...d.data(),_docId:d.id})).sort((a,b)=>rolePriority(b.role)-rolePriority(a.role));
      console.log('[OrgChart] Found',docs.length,'doc(s) by email. Role:',docs[0].role);
      return docs[0];
    }

    // Strategy 2: query by uid field (some setups store uid separately)
    const byUid=await db.collection('mompro_users').where('uid','==',user.uid).get();
    if(!byUid.empty){
      console.log('[OrgChart] Found by uid field');
      return byUid.docs[0].data();
    }

    // Strategy 3: direct doc lookup by UID as doc ID (Firebase Auth UID = doc ID pattern)
    const byDocId=await db.collection('mompro_users').doc(user.uid).get();
    if(byDocId.exists){
      console.log('[OrgChart] Found by doc ID = UID');
      return byDocId.data();
    }

    // Strategy 4: case-insensitive email scan (handles email casing mismatch)
    const emailLower=user.email.toLowerCase();
    const allDocs=await db.collection('mompro_users').limit(500).get();
    const match=allDocs.docs.find(d=>(d.data().email||'').toLowerCase()===emailLower);
    if(match){
      console.log('[OrgChart] Found by case-insensitive email scan');
      return match.data();
    }

    console.warn('[OrgChart] No profile found for',user.email,'after all strategies');
    return null;

  }catch(e){
    console.error('[OrgChart] Profile fetch error (attempt '+attempt+'):',e.message);
    if(attempt<MAX){
      // Wait with exponential backoff and retry
      await new Promise(r=>setTimeout(r, attempt*1500));
      return fetchUserProfile(user, attempt+1);
    }
    return null;
  }
}

// Scroll the first highlighted card into view after a search
function scrollToHighlighted(){
  requestAnimationFrame(()=>{
    const el=document.querySelector('.highlight-card');
    if(!el) return;

    // Find the nearest scrollable container (org-wrap for admin, pub-chart-wrapper for public)
    let container=el.closest('.org-wrap')||$('pub-chart-wrapper');
    if(!container){ el.scrollIntoView({behavior:'smooth',block:'center',inline:'center'}); return; }

    // The canvas inside may be CSS-scaled — get the true scale factor
    const canvas=container.querySelector('.org-canvas, #pub-canvas');
    const scale=canvas ? (parseFloat(canvas.style.transform.replace('scale(',''))||1) : 1;

    // Card position relative to the canvas (unscaled)
    const cardRect=el.getBoundingClientRect();
    const canvasRect=canvas ? canvas.getBoundingClientRect() : container.getBoundingClientRect();
    const contRect=container.getBoundingClientRect();

    // Target scroll position so the card is centered in the container
    const cardCenterX=(cardRect.left+cardRect.width/2 - canvasRect.left)/scale;
    const cardCenterY=(cardRect.top+cardRect.height/2 - canvasRect.top)/scale;

    const targetLeft=cardCenterX*scale - contRect.width/2;
    const targetTop =cardCenterY*scale - contRect.height/2;

    container.scrollTo({left:targetLeft, top:targetTop, behavior:'smooth'});
  });
}

      </div>
      <div style="font-size:11px;color:var(--g400);margin-top:4px">If the problem persists, contact your Super Admin to verify your account.</div>

    return;
  }
  const role=S.profile.role;
  console.log('[OrgChart] Rendering for role:',role);

  else if(role==='plant-admin') app.innerHTML=plantAdminHTML();

  scrollToHighlighted();
}

function bindLogin(){
  updateHamburger(); // login page has no layout, hide hamburger
  // View structure card — activate public view in-page (no redirect needed)
  $('lp-view-card')?.addEventListener('click',()=>{
    S.publicView=true;
    S.loading=false;
    startPublicListeners();
    render();
  });

  // Show form when login card clicked
  $('lp-login-card')?.addEventListener('click',()=>{
    $('lp-cards')?.classList.add('hidden');
    $('lp-brand')?.style.setProperty('margin-bottom','24px');
    $('lp-form-wrap')?.classList.add('show');
    setTimeout(()=>$('li-email')?.focus(),200);
  });
  // Back button — hide form, show cards again
  $('lp-back-btn')?.addEventListener('click',()=>{
    $('lp-form-wrap')?.classList.remove('show');
    $('lp-cards')?.classList.remove('hidden');
    $('li-err') && ($('li-err').style.display='none');
  });
  const doLogin=async()=>{
    const email=$('li-email')?.value.trim(), pass=$('li-pass')?.value;
    if(!email||!pass) return;
    $('li-btn').textContent='Signing in…'; $('li-btn').disabled=true;
    try{ await auth.signInWithEmailAndPassword(email,pass); }
    catch(e){
      $('li-err').style.display='block';
      $('li-err').textContent='Invalid email or password. Please try again.';
      $('li-btn').textContent='Sign In'; $('li-btn').disabled=false;
    }
  };
  $('li-btn')?.addEventListener('click', doLogin);
  $('li-pass')?.addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
}

// Returns dept names sorted by S.departments order; unregistered depts appended after
function sortedDepts(empSubset){
  const empArr=empSubset||S.employees;
  const present=new Set(empArr.map(e=>e.dept||'').filter(Boolean));
  // Registered depts in defined order (only those that exist in employees)
  const ordered=S.departments.map(d=>d.name).filter(n=>present.has(n));

  const unregistered=[...present].filter(n=>!S.departments.some(d=>d.name===n)).sort();
  return [...ordered,...unregistered];
}

// ── Cached allMap ────────────────────────────────────────────────
// Rebuilt only when S.employees reference changes (avoids O(n) rebuild per render).
let _cachedAllMap = null;
let _cachedEmpsRef = null;
function getAllMap(){
  if(_cachedEmpsRef !== S.employees){
    _cachedAllMap = {};
    S.employees.forEach(e=>{ _cachedAllMap[e.id]=e; });
    _cachedEmpsRef = S.employees;
  }
  return _cachedAllMap;
}

// Build a tree for a subset of employees (plantEmps or deptEmps)
// but include their full ancestor chain up to the root (from allEmps).
// Ancestors outside the subset are flagged _isContext=true (greyed in card).
function buildTreeWithAncestors(subEmps, allEmps){
  if(!subEmps||!subEmps.length) return null;
  // Use cached map when allEmps is the global S.employees array (common case)
  const allMap = (allEmps === S.employees) ? getAllMap() : (() => {
    const m={}; allEmps.forEach(e=>{ m[e.id]=e; }); return m;
  })();

  // Collect all ancestors of each sub-employee (iterative, not recursive)
  const needed=new Set(subEmps.map(e=>e.id));
  subEmps.forEach(e=>{
    let cur=e;
    while(cur&&cur.parentId&&allMap[cur.parentId]&&!needed.has(cur.parentId)){
      needed.add(cur.parentId);
      cur=allMap[cur.parentId];
    }
  });

  // Build tree from the needed set
  const subIds=new Set(subEmps.map(e=>e.id));
  const map={};
  needed.forEach(id=>{
    const e=allMap[id];
    if(e) map[id]={...e, children:[], _isContext:!subIds.has(id)};
  });

  const roots=[];
  needed.forEach(id=>{
    const node=map[id];
    if(!node) return;
    if(node.parentId&&map[node.parentId]){
      map[node.parentId].children.push(node);
    } else {
      roots.push(node);
    }
  });

  if(roots.length===0) return null;
  if(roots.length===1) return roots[0];
  return {id:'__virtual_root__',name:'Organisation',designation:'',_isVirtualRoot:true,children:roots};
}

// ── Department Chart ─────────────────────────────────────────────
// Builds a virtual tree where the root is the dept header node
// and children are employees in that dept (preserving parent→child links within dept)
function buildDeptTree(deptEmps, allEmps){
  if(!deptEmps||!deptEmps.length) return null;

  // Map by id for quick lookup (only within dept)
  const deptIds=new Set(deptEmps.map(e=>e.id));
  const map={};
  deptEmps.forEach(e=>{ map[e.id]={...e,children:[]}; });

  // Link parent→child only if parent is also in this dept
  deptEmps.forEach(e=>{
    if(e.parentId&&deptIds.has(e.parentId)){
      map[e.parentId].children.push(map[e.id]);
    }
  });

  // Nodes whose parent is outside this dept (or has no parent) are dept-level roots
  const roots=deptEmps
    .filter(e=>!e.parentId||!deptIds.has(e.parentId))
    .map(e=>map[e.id]);

  // Synthesise a virtual dept header node
  const deptName=deptEmps[0]?.dept||'Unknown';
  return {
    id:'__dept__'+deptName,
    name:deptName,
    designation:'Department',
    dept:'',
    _isDeptHeader:true,
    children:roots
  };
}

function getAllNodeIds(node){
  if(!node) return [];
  const ids=[node.id];
  (node.children||[]).forEach(c=>getAllNodeIds(c).forEach(id=>ids.push(id)));

// ── Optimised org-node renderer ──────────────────────────────────
// Uses an iterative stack instead of deep recursion so 250-node trees
// don't blow the call stack or produce one giant synchronous frame.
// Collapsed subtrees generate ZERO inner HTML — only the card itself.
// Annotate tree nodes with _plantLabel and _deptLabel before rendering
// Called from orgNodeHTML for group-level charts
// annotateTreeLabels: walks the tree and stamps _plantBranchLabel on nodes.
// isDeptChart=true: show plant label on a node when:
//   (a) its plantId differs from its parent's plantId  (plant changes mid-tree)
//   (b) it is the very first node of a subtree (isBranchTop=true) AND has a plantId
//       → this ensures the top of every branch always shows its plant name
function annotateTreeLabels(node, parentPlantId, parentDept, isDeptChart, isBranchTop){
  if(!node||node._isVirtualRoot) {
    if(node) (node.children||[]).forEach(c=>annotateTreeLabels(c,'','',isDeptChart,true)); 
    return;
  }
  const myPlant = node.plantId||'';
  const myDept  = node.dept||'';
  node._deptBranchLabel = (myDept && myDept !== parentDept) ? myDept : '';
  if(isDeptChart && myPlant){
    // Show label if plant changes from parent, OR this is the top of its branch
    const plantChanged = myPlant !== parentPlantId;
    node._plantBranchLabel = (plantChanged || isBranchTop) ? myPlant : '';
  } else {
    node._plantBranchLabel = '';
  }
  // Children: only the first child of a new-plant group is a branch top
  // Pass isBranchTop=false for children — they get label only if plant changes
  (node.children||[]).forEach(c=>annotateTreeLabels(c, myPlant, myDept, isDeptChart, false));
}

function orgNodeHTML(node, isRoot=false, isDeptChart=false){
  if(node&&node._isVirtualRoot){
    // Each direct child of virtual root IS the top of its own branch
    (node.children||[]).forEach(c=>annotateTreeLabels(c, '', '', isDeptChart, true));
  } else if(node){
    // Single root: it IS the branch top
    annotateTreeLabels(node, '', '', isDeptChart, true);
  }
  return _renderNode(node, isRoot);
}

function _renderNode(node, isRoot){
  const showPh = S.showPhoto;

  // ── Virtual root wrapper ──────────────────────────────────────
  // Plant labels are now self-rendered by each node via _plantBranchLabel annotation.
  // Virtual root just lays out branches side by side.
  if(node._isVirtualRoot){
    const parts = (node.children||[]).map(c=>`<div style="display:flex;flex-direction:column;align-items:center">${_renderNode(c,true)}</div>`);
    return `<div style="display:flex;flex-direction:column;align-items:center">
  <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">${parts.join('')}</div>
</div>`;
  }

  // Iterative DFS to build HTML bottom-up.
  // Stack entries: { node, isRoot, phase }
  //   phase=0  → push children first, then come back with phase=1 to build HTML
  //   phase=1  → children already resolved; build this node's HTML
  const stack = [{ node, isRoot, phase: 0 }];
  const results = new Map(); // nodeId → rendered HTML string

  while(stack.length){
    const top = stack[stack.length-1];
    const n = top.node;
    const col = S.collapsed.has(n.id);
    const children = n.children||[];
    const has = children.length > 0;

    if(top.phase === 0){
      top.phase = 1;
      // If not collapsed, push children so they resolve before we come back
      if(has && !col){
        for(let i = children.length-1; i >= 0; i--){
          stack.push({ node: children[i], isRoot: false, phase: 0 });
        }
      }
      continue;
    }

    // phase === 1: all children (if any) are now in results
    stack.pop();
    const html = _buildNodeHTML(n, top.isRoot, showPh, results, col);
    results.set(n.id, html);
  }

  return results.get(node.id) || '';
}

function _buildNodeHTML(node, isRoot, showPh, results, col){
  const children = node.children||[];
  const has = children.length > 0;

  // ── Plant label pill (shared across all node types) ───────────
  const _plantPill = node._plantBranchLabel
    ? (() => {
        const plantObj = S.plants.find(p=>p.id===node._plantBranchLabel);
        const pname = plantObj?.name || 'Plant';
        return `<div style="background:linear-gradient(135deg,var(--navy),var(--steel));color:#fff;font-size:9px;font-weight:800;padding:3px 10px;border-radius:20px;margin-bottom:6px;display:inline-flex;align-items:center;gap:4px;box-shadow:0 2px 6px rgba(15,31,61,.2);letter-spacing:.03em;white-space:nowrap">🏭 ${pname}</div>`;
      })()
    : '';

  // ── Dept header ───────────────────────────────────────────────
  if(node._isDeptHeader){
    let childrenHTML = '';
    if(has && !col){
      const inner = children.map((c,ci)=>{
        const dropH = c._plantBranchLabel ? '28px' : '16px';
        return `<div class="ochild-wrap" data-first="${ci===0}" data-last="${ci===children.length-1}" data-only="${children.length===1}">
          <div style="height:${dropH}"></div>${results.get(c.id)||''}
        </div>`;
      }).join('');
      childrenHTML = `<div class="conn-v" style="height:12px"></div><div class="ochildren">${inner}</div>`;
    }
    return `<div class="onode" style="align-items:center">
  ${_plantPill}
  <div style="background:linear-gradient(135deg,var(--steel),var(--navy));border-radius:10px;padding:8px 12px;min-width:100px;text-align:center;box-shadow:var(--shadow);border:2px solid var(--gold);position:relative">
    <div style="font-size:16px;margin-bottom:3px">🏢</div>
    <div style="color:var(--gold);font-size:11px;font-weight:800;line-height:1.3">${node.name}</div>
    <div style="color:rgba(255,255,255,.5);font-size:9px;font-weight:600;margin-top:2px;text-transform:uppercase;letter-spacing:.08em">Department</div>
    <div style="color:rgba(255,255,255,.35);font-size:9px;margin-top:2px">${children.length} member${children.length!==1?'s':''}</div>
    ${has?`<button class="ocol" data-colid="${node.id}" style="border-color:rgba(255,255,255,.2);color:rgba(255,255,255,.6)">${col?'▾':'▴'}</button>`:''}
  </div>
  ${childrenHTML}
</div>`;
  }

  // ── Context (greyed ancestor) node ────────────────────────────
  if(node._isContext){
    let childrenHTML = '';
    if(has && !col){
      const inner = children.map((c,ci)=>{
        const dropH = c._plantBranchLabel ? '28px' : '16px';
        return `<div class="ochild-wrap" data-first="${ci===0}" data-last="${ci===children.length-1}" data-only="${children.length===1}">
          <div style="height:${dropH}"></div>${results.get(c.id)||''}
        </div>`;
      }).join('');
      childrenHTML = `<div class="conn-v" style="height:12px"></div><div class="ochildren">${inner}</div>`;
    }
    return `<div class="onode" style="align-items:center">
  ${_plantPill}
  <div class="ocard" data-pid="${node.id}" style="width:86px;padding:5px 6px 7px;border-style:dashed;opacity:0.6;cursor:default">
    <div style="font-size:8.5px;font-weight:700;color:var(--navy);line-height:1.3;text-align:center;word-break:break-word">${node.name}</div>
    <div style="font-size:7.5px;color:var(--g400);margin-top:1px;text-align:center;font-weight:500">${node.designation}</div>
    ${node.dept?`<div style="font-size:7px;color:var(--steel);margin-top:2px;text-align:center;font-weight:600;opacity:.8">${node.dept}</div>`:''}
    ${has?`<button class="ocol" data-colid="${node.id}" style="bottom:-8px;width:15px;height:15px;font-size:7px">${col?'▾':'▴'}</button>`:''}
  </div>
  ${childrenHTML}
</div>`;
  }

  // ── Regular employee node ─────────────────────────────────────
  const avSize = isRoot?(showPh?'36px':'0'):(showPh?'26px':'0');
  const avFontSize = isRoot?'13px':'10px';
  const av = showPh
    ?(node.photoURL
      // loading="lazy" defers off-screen image decoding — critical for 250-node charts
      ?`<img src="${node.photoURL}" loading="lazy" style="width:${avSize};height:${avSize};border-radius:50%;object-fit:cover;margin:0 auto 4px;display:block;border:1.5px solid ${genderBorderColor(node.gender)}" onerror="this.style.display='none'">`
      :`<div style="width:${avSize};height:${avSize};border-radius:50%;background:${genderAvBg(node.gender)};margin:0 auto 4px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:${avFontSize};font-weight:700">${ini(node.name)}</div>`)
    :'';

  // Children rendering — uniform; plant labels are now self-rendered by each node
  // via _plantBranchLabel annotation (annotateTreeLabels), not by the parent
  let childrenHTML = '';
  if(has && !col){
    const inner = children.map((c,ci)=>{
      // Give extra vertical space when child will render a plant label above its card
      const dropH = c._plantBranchLabel ? '28px' : '16px';
      return `<div class="ochild-wrap" data-first="${ci===0}" data-last="${ci===children.length-1}" data-only="${children.length===1}">
        <div style="height:${dropH}"></div>${results.get(c.id)||''}
      </div>`;
    }).join('');
    childrenHTML = `<div class="conn-v" style="height:12px"></div><div class="ochildren">${inner}</div>`;
  }

  // Dept branch label — shown above the card when this node starts a new dept
  const deptLabel = (!isRoot && node._deptBranchLabel)
    ? `<div style="background:linear-gradient(135deg,var(--steel),#1a5ca8);color:#fff;font-size:9px;font-weight:800;padding:3px 9px;border-radius:20px;margin-bottom:6px;display:inline-flex;align-items:center;gap:4px;box-shadow:0 1px 4px rgba(30,64,128,.22);letter-spacing:.03em;white-space:nowrap">🏢 ${node._deptBranchLabel}</div>`
    : '';

  // Admin reporting badge
  const adminTypeLabel = node.adminReportingType ? {administrative:'ADM',functional:'FNC','dotted-line':'DL',matrix:'MTX'}[node.adminReportingType]||'ADM' : 'ADM';
  const adminBadge = node.adminParentId
    ? `<span class="admin-badge" title="Also reports administratively to another manager (${node.adminReportingType||'administrative'})">${adminTypeLabel}</span>`
    : '';

  return `<div class="onode" style="align-items:center">
  ${_plantPill}
  ${deptLabel}
  <div class="ocard ${isRoot?'root-card':node._highlight?'highlight-card':''}" data-pid="${node.id}" style="width:${isRoot?'100px':'86px'};padding:${showPh?'7px 6px 9px':'5px 6px 7px'};position:relative">
    ${adminBadge}
    ${av}
    <div style="font-size:${isRoot?'9px':'8.5px'};font-weight:700;color:${isRoot?'#fff':'var(--navy)'};line-height:1.3;text-align:center;word-break:break-word">${node.name}</div>
    <div style="font-size:7.5px;color:${isRoot?'rgba(255,255,255,.6)':'var(--g400)'};margin-top:1px;text-align:center;font-weight:500;line-height:1.2">${node.designation}</div>
    ${has?`<button class="ocol" data-colid="${node.id}" style="bottom:-8px;width:15px;height:15px;font-size:7px">${col?'▾':'▴'}</button>`:''}
  </div>
  ${childrenHTML}
</div>`;
}

// Plant admin — 3-tab chart view (Group / Plant-wise / Dept-wise)
// Default: Plant-wise with own plant pre-selected
// Dept tab: toggle between Plant-level and Group-level
function paChartTabsHTML(myPid, myPlant){
  const {plants,employees}=S;
  // Default tab is 'plt' (plant view); auto-set own plant if not set
  const paTab=S._paTab||'plt';
  if(!S._paPltId && (paTab==='plt')) S._paPltId=myPid||'';
  const pid=S._paPltId||myPid||'';
  const did=S._paDept||'';
  const deptScope=S._paDeptScope||'plant'; // 'plant' | 'group'
  const sc=S.chartScale;
  const allDepts=sortedDepts(employees);
  // Depts visible in own plant (for dept tab pill counts)
  const myPlantEmps=employees.filter(e=>e.plantId===myPid);
  const myPlantDepts=sortedDepts(myPlantEmps);

  // Build tree based on active tab
  let tree=null, chartTitle='My Plant', activeEmps=[];
  if(paTab==='grp'){
    // Group view: show ALL employees (full org)
    tree=buildTree(employees);
    chartTitle='Group';
    activeEmps=employees;
  } else if(paTab==='plt'){
    // Plant view: own plant pre-selected, can switch to others
    if(pid){
      activeEmps=employees.filter(e=>e.plantId===pid);
      tree=buildTreeWithAncestors(activeEmps,employees);
      const p=plants.find(x=>x.id===pid);
      chartTitle=p?.name||(pid===myPid?myPlant?.name:'Plant');
    }
  } else if(paTab==='dpt'){
    if(did){
      if(deptScope==='plant'){
        activeEmps=myPlantEmps.filter(e=>(e.dept||'').toLowerCase()===did.toLowerCase());
        tree=activeEmps.length?buildTreeWithAncestors(activeEmps,employees):null;
        chartTitle=did+' · '+( myPlant?.name||'My Plant');
      } else {
        activeEmps=employees.filter(e=>(e.dept||'').toLowerCase()===did.toLowerCase());
        tree=buildTreeWithAncestors(activeEmps,employees);
        chartTitle=did+' · All Plants';
      }
    }
  }

  // (no per-plant split — plant labels injected inline in the tree renderer)

  const search=(S._paSearch||'').toLowerCase().trim();
  if(search&&tree) highlightSearch(tree,search);

  const tabBtn=(id,icon,label)=>`<button id="pa-tab-${id}" style="
    display:inline-flex;align-items:center;gap:6px;padding:9px 18px;
    border:none;border-bottom:3px solid ${paTab===id?'var(--gold)':'transparent'};
    background:none;font-size:13px;font-weight:${paTab===id?'700':'500'};
    color:${paTab===id?'var(--navy)':'var(--g400)'};cursor:pointer;
    transition:all .15s;font-family:inherit;white-space:nowrap"
    onmouseover="if('${id}'!=='${paTab}')this.style.color='var(--navy)'"
    onmouseout="if('${id}'!=='${paTab}')this.style.color='var(--g400)'"
  >${icon} ${label}</button>`;

  // Pill helpers for PA tab filters
  const paPillsPlant=plants.map(p=>{
    const active=(pid||myPid)===p.id;
    const pEmps=employees.filter(e=>e.plantId===p.id);
    const cnt=pEmps.length;
    const pFemale=pEmps.filter(e=>e.gender==='female').length;
    const pDepts=[...new Set(pEmps.map(e=>e.dept).filter(Boolean))].length;
    const pAway=pEmps.filter(e=>e.workingLocation&&e.workingLocation.trim()!=='').length;
    return `<div style="display:inline-flex;flex-direction:column;gap:3px;cursor:pointer" id="pa-plant-pill-${p.id}" onclick="S._paPltId='${p.id.replace(/'/g,"\'")}';render()">
      <button style="
        display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;
        border:1.5px solid ${active?'var(--steel)':'var(--g200)'};
        background:${active?'var(--navy)':'#fff'};color:${active?'#fff':'var(--g600)'};
        font-size:11px;font-weight:${active?'700':'500'};cursor:pointer;transition:all .15s;white-space:nowrap;font-family:inherit;width:100%">
        🏭 ${p.name}${p.id===myPid?' ★':''} <span style="background:${active?'rgba(255,255,255,.2)':'var(--g100)'};border-radius:10px;padding:1px 5px;font-size:10px;font-weight:700">${cnt}</span>
      </button>
      <div style="display:flex;flex-wrap:wrap;gap:3px;padding:0 4px">
        <span style="display:inline-flex;align-items:center;gap:2px;background:rgba(30,64,128,.07);border:1px solid rgba(30,64,128,.12);border-radius:20px;padding:1px 6px;font-size:9px;font-weight:700;white-space:nowrap">
          🏢 <span style="color:var(--steel)">${pDepts}</span><span style="color:var(--g400);font-weight:500"> dept${pDepts!==1?'s':''}</span>
        </span>
        ${pFemale>0?`<span style="display:inline-flex;align-items:center;gap:2px;background:rgba(190,24,93,.07);border:1px solid rgba(190,24,93,.15);border-radius:20px;padding:1px 6px;font-size:9px;font-weight:700;white-space:nowrap">
          ♀ <span style="color:#BE185D">${pFemale}</span><span style="color:var(--g400);font-weight:500"> ♀</span>
        </span>`:''}
        ${pAway>0?`<span style="display:inline-flex;align-items:center;gap:2px;background:rgba(245,166,35,.1);border:1px solid rgba(245,166,35,.2);border-radius:20px;padding:1px 6px;font-size:9px;font-weight:700;white-space:nowrap">
          📍 <span style="color:#B7791F">${pAway}</span><span style="color:var(--g400);font-weight:500"> away</span>
        </span>`:''}
      </div>
    </div>`;
  }).join('');
  const paPillsDept=allDepts.map(d=>{
    const grpCnt=employees.filter(e=>(e.dept||'').toLowerCase()===d.toLowerCase()).length;
    const pltCnt=myPlantEmps.filter(e=>(e.dept||'').toLowerCase()===d.toLowerCase()).length;
    const active=(did||'').toLowerCase()===d.toLowerCase();
    return `<button onclick="S._paDept='${d.replace(/'/g,"\'")}';render()" style="
      display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;
      border:1.5px solid ${active?'var(--gold)':pltCnt>0?'var(--g200)':'var(--g100)'};
      background:${active?'var(--navy)':'#fff'};color:${active?'#fff':pltCnt>0?'var(--g600)':'var(--g400)'};
      font-size:11px;font-weight:${active?'700':pltCnt>0?'500':'400'};cursor:pointer;transition:all .15s;white-space:nowrap;font-family:inherit">
      🏢 ${d}
      <span style="background:${active?'rgba(255,255,255,.25)':'rgba(30,64,128,.1)'};color:${active?'#fff':'var(--steel)'};border-radius:10px;padding:1px 6px;font-size:10px;font-weight:700" title="${pltCnt} in your plant">${pltCnt}</span>
      ${grpCnt!==pltCnt?`<span style="background:${active?'rgba(255,255,255,.12)':'var(--g100)'};color:${active?'rgba(255,255,255,.7)':'var(--g400)'};border-radius:10px;padding:1px 5px;font-size:9px;font-weight:600" title="Total: ${grpCnt}">/${grpCnt}</span>`:''}
    </button>`;

  // Toggle switch HTML for dept scope
  const deptScopeToggle=`<label style="display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none;flex-shrink:0">
    <span style="font-size:10px;font-weight:700;color:${deptScope==='plant'?'var(--steel)':'var(--g400)'};text-transform:uppercase;letter-spacing:.05em;transition:color .15s">🏭 Plant</span>
    <div id="dept-scope-track" style="position:relative;width:42px;height:22px;border-radius:11px;background:${deptScope==='group'?'var(--navy)':'var(--steel)'};cursor:pointer;transition:background .2s;flex-shrink:0;box-shadow:inset 0 1px 3px rgba(0,0,0,.2)" onclick="S._paDeptScope=S._paDeptScope==='plant'?'group':'plant';render()">
      <div style="position:absolute;top:3px;left:${deptScope==='group'?'23px':'3px'};width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:left .2s"></div>

    <span style="font-size:10px;font-weight:700;color:${deptScope==='group'?'var(--navy)':'var(--g400)'};text-transform:uppercase;letter-spacing:.05em;transition:color .15s">🌐 Group</span>
  </label>`;

  const filterBar=paTab==='plt'
    ?`<div style="display:flex;gap:5px;flex-wrap:wrap;align-items:center"><span style="font-size:10px;font-weight:700;color:var(--g400);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap">Plant:</span>${paPillsPlant||'<span style="font-size:12px;color:var(--g400)">None</span>'}</div>`
    :paTab==='dpt'
    ?`<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;width:100%">
        <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
          <span style="font-size:10px;font-weight:700;color:var(--g400);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap">Dept:</span>
          ${deptScopeToggle}
          <span style="font-size:10px;color:var(--g400);white-space:nowrap">${deptScope==='plant'?`Showing <strong style="color:var(--steel)">${myPlant?.name||'your plant'}</strong> employees only`:'Showing <strong style="color:var(--navy)">all plants</strong> employees'}</span>
        </div>
        <div style="width:100%;display:flex;gap:5px;flex-wrap:wrap;align-items:flex-start;margin-top:2px">${paPillsDept||'<span style="font-size:12px;color:var(--g400)">No departments found</span>'}</div>
      </div>`
    :'';

  const contextNote=(paTab==='plt'&&pid)||(paTab==='dpt'&&did)
    ?`<div style="background:rgba(245,166,35,.08);border:1px solid rgba(245,166,35,.25);border-radius:8px;padding:8px 14px;font-size:11px;color:#92610a;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <span>🔗</span>
        <span>Greyed cards = ancestor chain shown for reporting context only (not in this ${paTab==='plt'?'plant':deptScope==='plant'?'plant dept':'department'}).</span>
        <span style="margin-left:auto;background:rgba(34,197,94,.1);color:#16a34a;padding:2px 8px;border-radius:12px;font-weight:700">✏ Edit: <strong>${myPlant?.name||'your plant'}</strong> employees only</span>
      </div>`:'';

  // PA inline stats — contextual
  const paInlineStatsBar=[
    ...(paTab==='plt'?[{icon:'🏭',value:plants.length,label:'Plants'},{icon:'👥',value:employees.length,label:'Total'},{icon:'🧑',value:activeEmps.length,label:'In Plant'}]:[]),
    ...(paTab==='grp'?[{icon:'🏭',value:plants.length,label:'Plants'},{icon:'👥',value:employees.length,label:'Employees'},{icon:'🏢',value:allDepts.length,label:'Depts'}]:[]),
    ...(paTab==='dpt'&&did?[
      {icon:'👤',value:activeEmps.length,label:deptScope==='plant'?'In Plant Dept':'In Group Dept'},
      {icon:'🏢',value:allDepts.length,label:'Depts'},

    ...(paTab==='dpt'&&!did?[{icon:'🏢',value:allDepts.length,label:'Depts'},{icon:'🏭',value:myPlantDepts.length,label:'In My Plant'}]:[]),
  ];

  // PA stat pills rendered inside orgPanelHTML via role check — skip separate bar
  return `<!-- PA Toolbar: tabs + search + inline context stats + zoom/controls ALL LEFT -->

  ${tabBtn('grp','⬡','Group View')}
  ${tabBtn('plt','🏭','Plant-wise')}
  ${tabBtn('dpt','🏢','Dept-wise')}
  <div style="width:1px;height:20px;background:var(--g200);flex-shrink:0"></div>
  <input id="search-pa" placeholder="🔍 Search name or designation…" value="${S._paSearch||''}" style="width:180px;min-width:120px;padding:4px 10px;border:1.5px solid var(--g200);border-radius:8px;font-size:12px;font-family:inherit;outline:none;height:30px;flex-shrink:0" onfocus="this.style.borderColor='var(--steel)'" onblur="this.style.borderColor='var(--g200)'"/>
  <div style="width:1px;height:20px;background:var(--g200);flex-shrink:0"></div>
  ${paInlineStatsBar.map(s=>`<div style="display:inline-flex;align-items:center;gap:3px;background:var(--g50);border:1px solid var(--g100);border-radius:6px;padding:2px 7px;font-size:10.5px;white-space:nowrap">
    <span>${s.icon}</span><span style="font-weight:800;color:var(--navy)">${s.value}</span><span style="color:var(--g400)">${s.label}</span>
  </div>`).join('')}
  <div style="width:1px;height:20px;background:var(--g200);flex-shrink:0"></div>
  <button class="btn bo bsm bic" id="pa-zo">−</button>
  <span style="font-size:11px;font-weight:600;color:var(--g600);min-width:34px;text-align:center">${Math.round(sc*100)}%</span>
  <button class="btn bo bsm bic" id="pa-zi">+</button>
  <button class="btn bo bsm bic" id="pa-zr">↺</button>
  <div style="width:1px;height:20px;background:var(--g200);flex-shrink:0"></div>
  <button class="btn ${S.showPhoto?'bs':'bo'} bsm" id="pa-toggle-photo" style="font-size:11px;padding:4px 8px">${S.showPhoto?'🖼 On':'👤 Off'}</button>
  <button class="btn bo bsm" id="pa-expand-all" style="font-size:11px;padding:4px 8px">⊞</button>
  <button class="btn bo bsm" id="pa-collapse-all" style="font-size:11px;padding:4px 8px">⊟</button>
  <div style="width:1px;height:20px;background:var(--g200);flex-shrink:0"></div>
  <button class="btn bp bsm" id="pa-pdf" style="font-size:11px;padding:4px 10px">⬇ PDF</button>
  <button class="btn bs bsm" id="pa-xlsx-btn" style="font-size:11px;padding:4px 10px">⬇ XLS</button>
</div>

<!-- Row 2: Plant/Dept pill filter strip -->
${filterBar?`<div style="background:#fff;border:1px solid var(--g100);border-top:none;padding:6px 14px;display:flex;align-items:flex-start;gap:5px;flex-wrap:wrap;min-height:36px">${filterBar}</div>`:''}

${contextNote?contextNote+'<div style="height:10px"></div>':''}

<!-- Chart area -->
${employees.length===0
  ?`<div class="empty" style="margin-top:40px"><div class="ei">🌳</div><h3>No employees yet</h3></div>`

    ?`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px">
        ${plants.map(p=>{
          const cnt=employees.filter(e=>e.plantId===p.id).length;
          const isOwn=p.id===myPid;
          return `<div class="card" style="padding:8px 10px;cursor:pointer;transition:all .2s;${isOwn?'border-color:var(--gold);':''}" onmouseover="this.style.boxShadow='var(--shadow)';this.style.transform='translateY(-2px)'" onmouseout="this.style.boxShadow='';this.style.transform=''" onclick="S._paPltId='${p.id}';render()">
            <div style="display:flex;align-items:center;gap:5px;margin-bottom:3px">
              <span style="font-size:13px">🏭</span>
              <div style="font-size:11px;font-weight:800;color:var(--navy);line-height:1.2">${p.name}${isOwn?` <span style="font-size:8px;background:rgba(245,166,35,.15);color:#B7791F;padding:1px 4px;border-radius:8px;font-weight:700">MY</span>`:''}</div>
            </div>
            ${p.location?`<div style="font-size:9px;color:var(--g400);margin-bottom:3px">📍 ${p.location}</div>`:''}

          </div>`;
        }).join('')}
      </div>`
    : paTab==='dpt'&&!did
      ?`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px">
          ${allDepts.length===0
            ?`<div class="empty" style="grid-column:1/-1"><div class="ei">🏢</div><h3>No departments found</h3></div>`
            :allDepts.map(d=>{
                const grpCnt=employees.filter(e=>(e.dept||'').toLowerCase()===d.toLowerCase()).length;
                const pltCnt=myPlantEmps.filter(e=>(e.dept||'').toLowerCase()===d.toLowerCase()).length;
                const dplants=[...new Set(employees.filter(e=>(e.dept||'').toLowerCase()===d.toLowerCase()).map(e=>e.plant).filter(Boolean))];

                  <div style="display:flex;align-items:center;gap:5px;margin-bottom:5px">

                    ${isInMyPlant?`<span class="badge" style="background:rgba(30,64,128,.1);color:var(--steel);font-size:8px;padding:1px 5px">MY</span>`:''}
                  </div>
                  <div style="display:flex;align-items:center;gap:3px;flex-wrap:wrap">
                    <span style="display:inline-flex;align-items:center;gap:2px;background:rgba(30,64,128,.08);border:1px solid rgba(30,64,128,.15);border-radius:20px;padding:1px 6px;font-size:9px;font-weight:700" title="In your plant">🏭 <span style="color:var(--steel)">${pltCnt}</span></span>
                    ${grpCnt!==pltCnt?`<span style="display:inline-flex;align-items:center;gap:2px;background:var(--g50);border:1px solid var(--g100);border-radius:20px;padding:1px 6px;font-size:9px;font-weight:600;color:var(--g400)" title="Total all plants">🌐 ${grpCnt}</span>`:''}
                  </div>
                  ${dplants.length>1?`<div style="display:flex;flex-wrap:wrap;gap:2px;margin-top:4px">${dplants.slice(0,3).map(pl=>`<span class="badge bg" style="font-size:8px;padding:1px 5px">${pl}</span>`).join('')}${dplants.length>3?`<span class="badge bb" style="font-size:8px;padding:1px 5px">+${dplants.length-3}</span>`:''}</div>`:''}

              {icon:'🏢',value:allDepts.length,label:'Depts'},

            return orgPanelHTML(tree,chartTitle,'pa',paInlineStats,paTab==='dpt');

        :`<div class="empty" style="margin-top:40px"><div class="ei">${paTab==='plt'?'🏭':'🏢'}</div><h3>Select a ${paTab==='plt'?'plant':'department'} to view its chart</h3></div>`
}`;
}

function renderNoChart(){
  return `<div class="empty" style="margin-top:60px"><div class="ei">🏭</div><h3>Select a plant to view its chart</h3></div>`;

function highlightSearch(node, search){
  // mark nodes matching search
  const matches=name=>name&&name.toLowerCase().includes(search);
  node._highlight=matches(node.name)||matches(node.designation)||matches(node.dept)||matches(node.empCode);
  (node.children||[]).forEach(c=>highlightSearch(c,search));
}

function bindPublicView(){
  updateHamburger(); // public view has no sidebar, hide hamburger
  // Draw admin reporting lines on public canvas
  requestAnimationFrame(()=>{ drawAdminLines('pub'); });
  // detail overlay close
  $('det-overlay')?.addEventListener('click',e=>{ if(e.target.id==='det-overlay'){ S.detailPerson=null; render(); }});
  $('det-close')?.addEventListener('click',()=>{ S.detailPerson=null; render(); });
  $('det-close-btn')?.addEventListener('click',()=>{ S.detailPerson=null; render(); });

  // Tab switching
  ['grp','plt','dpt'].forEach(id=>{
    document.getElementById(`pub-tab-${id}`)?.addEventListener('click',()=>{
      S._pubTab=id;
      // reset sub-filters on tab change
      if(id==='grp'){ S.plantChartId=''; S._pubDept=''; }
      else if(id==='plt'){ S._pubDept=''; }
      else if(id==='dpt'){ S.plantChartId=''; }
      S._pubSearch='';
      S.collapsed=new Set();
      render();
    });
  });

  // org card clicks
  document.querySelectorAll('[data-pid]').forEach(card=>{
    card.addEventListener('click',e=>{
      if(e.target.classList.contains('ocol')||e.target.closest?.('.ocol')) return;
      S.detailPerson=S.employees.find(x=>x.id===card.dataset.pid)||null;
      render();
    });
  });
  // collapse individual
  document.querySelectorAll('[data-colid]').forEach(btn=>{
    btn.addEventListener('click',e=>{
      e.stopPropagation();
      const id=btn.dataset.colid;
      S.collapsed.has(id)?S.collapsed.delete(id):S.collapsed.add(id);
      renderDeferred();
    });
  });

  // pub-plant-filter / pub-dept-filter removed — now pill buttons

  // search — update state immediately on every keystroke, restore focus after render
  let _pubTimer;
  $('pub-search')?.addEventListener('input',e=>{
    const val=e.target.value, pos=e.target.selectionStart;
    S._pubSearch=val;
    clearTimeout(_pubTimer);
    _pubTimer=setTimeout(()=>{
      render();
      requestAnimationFrame(()=>{
        const inp=$('pub-search');
        if(inp){ inp.focus(); try{ inp.setSelectionRange(pos,pos); }catch(_){} }
      });
    }, val.length===0 ? 0 : 120);
  });

  // zoom
  $('pub-zi')?.addEventListener('click',()=>{ S.chartScale=Math.min(S.chartScale+0.1,2.5); render(); });
  $('pub-zo')?.addEventListener('click',()=>{ S.chartScale=Math.max(S.chartScale-0.1,0.3); render(); });
  $('pub-zr')?.addEventListener('click',()=>{ S.chartScale=1; render(); });
  $('pub-expand-all')?.addEventListener('click',()=>{ S.collapsed.clear(); render(); });
  $('pub-collapse-all')?.addEventListener('click',()=>{ document.querySelectorAll('[data-colid]').forEach(btn=>S.collapsed.add(btn.dataset.colid)); render(); });
  $('pub-toggle-photo')?.addEventListener('click',()=>{ S.showPhoto=!S.showPhoto; render(); });

  // PDF export
  $('pub-pdf')?.addEventListener('click',async()=>{
    const canvas=$('pub-canvas'); if(!canvas) return;
    const btn=$('pub-pdf'); btn.textContent='Exporting…'; btn.disabled=true;
    try{
      const pubTab=S._pubTab||'grp';
      let subtitle='Group Organisation Chart';
      if(pubTab==='plt'&&S.plantChartId){
        const plant=S.plants.find(p=>p.id===S.plantChartId);
        subtitle=(plant?.name||'Plant')+' — Organisation Chart';
      } else if(pubTab==='dpt'&&S._pubDept){
        subtitle=S._pubDept+' — Department Chart';
      }
      const companyName=S.companyName||'OrgChart';
      const fname=`${companyName.replace(/\s+/g,'_')}_${subtitle.replace(/[^a-zA-Z0-9]/g,'_')}_${new Date().toLocaleDateString('en-IN').replace(/\//g,'-')}.pdf`;
      await buildPDF(canvas, fname, subtitle);
      toast('PDF exported','ok');
    } catch(e){ toast('Export failed','er'); }
    btn.textContent='⬇ PDF'; btn.disabled=false;
  });

  // Excel export — routes to correct export key based on active tab
  $('pub-xlsx')?.addEventListener('click',()=>{
    const pubTab=S._pubTab||'grp';
    if(pubTab==='plt') exportXLSX('plt');
    else if(pubTab==='dpt') exportXLSX('dpt');
    else exportXLSX('grp');
  });
}

function _paModalShell(title,subtitle,body){

function _empTableRows(emps,extraCol=''){

  return `<table style="width:100%;border-collapse:collapse">
    <thead><tr>
      <th style="background:var(--g50);font-size:10px;font-weight:700;color:var(--g600);text-transform:uppercase;letter-spacing:.06em;padding:7px 12px;text-align:left">Employee</th>
      <th style="background:var(--g50);font-size:10px;font-weight:700;color:var(--g600);text-transform:uppercase;letter-spacing:.06em;padding:7px 12px;text-align:left">Designation</th>
      <th style="background:var(--g50);font-size:10px;font-weight:700;color:var(--g600);text-transform:uppercase;letter-spacing:.06em;padding:7px 12px;text-align:left">Dept</th>
      ${extraCol?`<th style="background:var(--g50);font-size:10px;font-weight:700;color:var(--g600);text-transform:uppercase;letter-spacing:.06em;padding:7px 12px;text-align:left">${extraCol}</th>`:''}
    </tr></thead>
    <tbody>${emps.map(e=>`<tr style="cursor:pointer" class="pa-stat-emp-row" data-id="${e.id}">
      <td style="padding:8px 12px;border-bottom:1px solid var(--g100)">
        <div style="display:flex;align-items:center;gap:8px">
          ${avatarThumb(e)}
          <div><div style="font-weight:600;font-size:13px;color:var(--navy)">${e.name}</div>${e.empCode?`<div style="font-size:10px;color:var(--g400)">${e.empCode}</div>`:''}</div>
        </div>
      </td>
      <td style="padding:8px 12px;border-bottom:1px solid var(--g100);font-size:12px;color:var(--g600)">${e.designation||'—'}</td>
      <td style="padding:8px 12px;border-bottom:1px solid var(--g100);font-size:12px;color:var(--g400)">${e.dept||'—'}</td>
      ${extraCol?`<td style="padding:8px 12px;border-bottom:1px solid var(--g100);font-size:12px;color:var(--g400)">${e[extraCol==='Working At'?'workingLocation':extraCol==='Contact'?'contact':'']||'—'}</td>`:''}
    </tr>`).join('')}</tbody>
  </table>`;
}
function paStaffListModalHTML(pid){
  const emps=S.employees.filter(e=>e.plantId===pid).sort((a,b)=>a.name.localeCompare(b.name));
  const plant=S.plants.find(p=>p.id===pid);
  return _paModalShell(`👥 Staff — ${plant?.name||'Plant'}`,`${emps.length} employee${emps.length!==1?'s':''} in this plant`,_empTableRows(emps));
}
function paDeptListModalHTML(pid){
  const emps=S.employees.filter(e=>e.plantId===pid);
  const depts=[...new Set(emps.map(e=>e.dept).filter(Boolean))].sort();
  const plant=S.plants.find(p=>p.id===pid);
  const body=depts.length===0
    ?`<div class="empty" style="padding:30px"><div class="ei">🏢</div><h3>No departments found</h3></div>`
    :depts.map(d=>{
        const grp=emps.filter(e=>(e.dept||'').toLowerCase()===d.toLowerCase());
        return `<div style="margin-bottom:16px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--g100)">
          <span style="font-size:15px">🏢</span>
          <span style="font-size:13px;font-weight:800;color:var(--navy)">${d}</span>
          <span class="badge bb" style="font-size:10px">${grp.length} emp${grp.length!==1?'s':''}</span>
        </div>${_empTableRows(grp)}</div>`;
      }).join('');
  return _paModalShell(`🏢 Departments — ${plant?.name||'Plant'}`,`${depts.length} department${depts.length!==1?'s':''} · ${emps.length} employees total`,body);
}
function paOtherLocModalHTML(pid){
  const emps=S.employees.filter(e=>e.plantId===pid&&e.workingLocation&&e.workingLocation.trim()!=='');
  const plant=S.plants.find(p=>p.id===pid);
  const groups={};
  emps.forEach(e=>{ const l=(e.workingLocation||'').trim(); if(!groups[l]) groups[l]=[]; groups[l].push(e); });
  const body=emps.length===0
    ?`<div class="empty" style="padding:30px"><div class="ei">📍</div><h3>No employees at other locations</h3></div>`
    :Object.keys(groups).sort().map(loc=>`<div style="margin-bottom:16px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--g100)">
        <span style="font-size:15px">📍</span>
        <span style="font-size:13px;font-weight:800;color:var(--navy)">${loc}</span>
        <span class="badge" style="background:rgba(245,166,35,.12);color:#B7791F;font-size:10px">${groups[loc].length} emp</span>
      </div>${_empTableRows(groups[loc],'Working At')}</div>`).join('');
  return _paModalShell(`📍 At Other Locations — ${plant?.name||'Plant'}`,`${emps.length} employee${emps.length!==1?'s':''} working outside home plant`,body);
}
function paFemaleModalHTML(pid){
  const emps=S.employees.filter(e=>e.plantId===pid&&e.gender==='female').sort((a,b)=>a.name.localeCompare(b.name));
  const plant=S.plants.find(p=>p.id===pid);

function paTopLevelModalHTML(pid){
  const emps=S.employees.filter(e=>e.plantId===pid&&!e.parentId).sort((a,b)=>a.name.localeCompare(b.name));

function paPhotosModalHTML(pid){

// ── Administrative Reporting Lines (SVG dashed overlay) ──────────
// Draws dashed orange lines from each employee card to their admin boss card.
// Called after every render so coordinates are always fresh.
function drawAdminLines(chartKey){
  const svg = document.getElementById('admin-lines-svg-'+chartKey);
  if(!svg) return;
  svg.innerHTML = '';

  const dualReporters = S.employees.filter(e=>e.adminParentId);
  if(!dualReporters.length) return;

  const canvas = document.getElementById('oc-'+chartKey);
  if(!canvas) return;
  const canvasRect = canvas.getBoundingClientRect();
  const scale = parseFloat(((canvas.style.transform||'scale(1)').replace('scale(','').replace(')','')))||1;
  const PAD = 5; // padding around node boxes for collision

  // ── Collect all node bounding boxes in canvas-space ──────────────
  const allCards = Array.from(canvas.querySelectorAll('.ocard'));
  const boxes = allCards.map(el=>{
    const r = el.getBoundingClientRect();
    return {
      l:(r.left  -canvasRect.left)/scale - PAD,
      r:(r.right -canvasRect.left)/scale + PAD,
      t:(r.top   -canvasRect.top )/scale - PAD,
      b:(r.bottom-canvasRect.top )/scale + PAD,
    };
  });

  // ── Segment collision helpers ─────────────────────────────────────
  // Horizontal segment at Y from xa to xb — blocked by any non-excluded box?
  function hBlocked(y, xa, xb, excl){
    const x0=Math.min(xa,xb), x1=Math.max(xa,xb);
    return boxes.some((b,i)=> !excl.has(i) && y>b.t && y<b.b && x1>b.l && x0<b.r);
  }
  // Vertical segment at X from ya to yb
  function vBlocked(x, ya, yb, excl){
    const y0=Math.min(ya,yb), y1=Math.max(ya,yb);
    return boxes.some((b,i)=> !excl.has(i) && x>b.l && x<b.r && y1>b.t && y0<b.b);
  }

  // ── Find a clear horizontal Y lane, scanning from seedY outward ──
  // xa→xb is the X-range the horizontal segment must span.
  // dir: -1 = prefer above, +1 = prefer below
  function findHLane(seedY, xa, xb, excl, dir){
    const STEP=5, MAX=400;
    for(let d=0; d<=MAX; d+=STEP){
      const y1=seedY+dir*d, y2=seedY-dir*d;
      if(!hBlocked(y1,xa,xb,excl)) return y1;
      if(d>0 && !hBlocked(y2,xa,xb,excl)) return y2;
    }
    return seedY;
  }

  // ── Route a single FROM→TO connection ────────────────────────────
  //
  // The line exits the FROM-node from its LEFT or RIGHT edge,
  // travels to a vertical "highway" column (vx) that is clear,
  // then enters the TO-node from its LEFT or RIGHT edge.
  //
  // To avoid cutting through node rows, the horizontal stubs
  // travel at a Y that is in a GAP between rows (above/below node boxes),
  // not at the node mid-Y.
  //
  // Path shape (up to 6 points = 5 segments):
  //   A(x1,fY) → B(x1,hy1) → C(vx,hy1) → D(vx,hy2) → E(x2,hy2) → F(x2,tY)
  //   where hy1 is a clear lane near the FROM-node row
  //         hy2 is a clear lane near the TO-node row
  //         vx  is a clear vertical column outside both nodes
  //
  // The arrow (marker-end) is at F = entry into TO-node. ✓
  // The dot   (origin)     is at A = exit from FROM-node. ✓

  function route(fL, fR, fTop, fBot, fY, tL, tR, tTop, tBot, tY, excl, laneIdx){
    const nudge = laneIdx * 12;

    // ── Step 1: decide which side (left/right) to place vx ──────────
    // We try BOTH sides and pick the one that produces a valid path.
    // Left side: vx < min(fL,tL).  Right side: vx > max(fR,tR).
    const outerLeft  = Math.min(fL, tL);
    const outerRight = Math.max(fR, tR);

    // ── Step 2: for each side, scan for a valid (vx, hy1, hy2) triple
    function tryRoute(useLeft){
      const startVx = useLeft
        ? outerLeft  - 20 - nudge   // start just left of both nodes
        : outerRight + 20 + nudge;  // start just right of both nodes
      const vxStep = useLeft ? -1 : 1;
      const VSTEP=8, VMAX=600;

      for(let vd=0; vd<=VMAX; vd+=VSTEP){
        const vx = startVx + vxStep*vd;

        // From-node exit side: whichever edge faces vx
        const x1 = useLeft ? fL : fR;
        // To-node entry side: whichever edge faces vx
        const x2 = useLeft ? tL : tR;

        // hy1: clear H-lane for the segment x1↔vx, seeded outside the from-node row
        // Prefer the gap BETWEEN the two nodes vertically (if from is above to, go below from)
        const hy1_dir  = fTop < tTop ? 1 : -1; // prefer toward the other node
        const hy1_seed = hy1_dir > 0 ? fBot + 3 : fTop - 3;
        const xSpan1   = [Math.min(x1,vx), Math.max(x1,vx)];
        const hy1 = findHLane(hy1_seed, xSpan1[0], xSpan1[1], excl, hy1_dir);

        // hy2: clear H-lane for the segment vx↔x2, seeded outside the to-node row
        const hy2_dir  = tTop < fTop ? 1 : -1;
        const hy2_seed = hy2_dir > 0 ? tBot + 3 : tTop - 3;
        const xSpan2   = [Math.min(x2,vx), Math.max(x2,vx)];
        const hy2 = findHLane(hy2_seed, xSpan2[0], xSpan2[1], excl, hy2_dir);

        // Validate all segments:
        // Seg A→B: vertical at x1 from fY to hy1  (excluded nodes skip source)
        if(vBlocked(x1, fY, hy1, excl)) continue;
        // Seg B→C: horizontal at hy1 from x1 to vx (already clear by findHLane)
        // Seg C→D: vertical at vx from hy1 to hy2
        if(vBlocked(vx, hy1, hy2, excl)) continue;
        // Seg D→E: horizontal at hy2 from vx to x2 (already clear by findHLane)
        // Seg E→F: vertical at x2 from hy2 to tY
        if(vBlocked(x2, hy2, tY, excl)) continue;

        // All clear — build path
        const pts = [[x1,fY],[x1,hy1],[vx,hy1],[vx,hy2],[x2,hy2],[x2,tY]];
        // Collapse zero-length segments
        const clean = pts.filter((p,i)=> i===0 || p[0]!==pts[i-1][0] || p[1]!==pts[i-1][1]);
        return 'M'+clean.map(p=>p[0]+','+p[1]).join(' L');
      }
      return null;
    }

    // Try left side first, then right; swap preference if left gap is smaller
    const preferLeft = outerLeft < outerRight; // try side with more visual space
    let d = tryRoute(!preferLeft) || tryRoute(preferLeft);

    if(!d){
      // Hard fallback: go well outside everything
      const allL = Math.min(...boxes.map(b=>b.l));
      const allR = Math.max(...boxes.map(b=>b.r));
      const vx = (outerLeft > 0 ? allL-40-nudge : allR+40+nudge);
      const x1 = vx < fL ? fL : fR;
      const x2 = vx < tL ? tL : tR;
      d = `M${x1},${fY} L${vx},${fY} L${vx},${tY} L${x2},${tY}`;
    }

    // Origin dot coords = first M point
    const m = d.match(/M([^,]+),([^ L]+)/);
    return {d, ox:parseFloat(m[1]), oy:parseFloat(m[2])};
  }

  // ── Arrow marker defs ─────────────────────────────────────────────
  const typeColors = {administrative:'#F5A623',functional:'#1E4080','dotted-line':'#F5A623',matrix:'#EF4444'};
  const typeDashes = {administrative:'8 5',functional:'12 4','dotted-line':'4 6',matrix:'6 3 2 3'};
  const defs = document.createElementNS('http://www.w3.org/2000/svg','defs');
  Object.entries(typeColors).forEach(([type,color])=>{
    const st=type.replace(/[^a-z]/g,'-');
    defs.innerHTML+=`<marker id="admin-arrow-${chartKey}-${st}" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 z" fill="${color}" opacity="0.9"/>
    </marker>`;
  });
  svg.appendChild(defs);

  dualReporters.forEach((emp, idx)=>{
    // FROM = the employee (has adminParentId badge, dot here)
    // TO   = the admin parent (arrow points here)
    const fromCard = canvas.querySelector(`[data-pid="${emp.id}"]`);
    const toCard   = canvas.querySelector(`[data-pid="${emp.adminParentId}"]`);
    if(!fromCard||!toCard) return;

    const fi = allCards.indexOf(fromCard);
    const ti = allCards.indexOf(toCard);
    const excl = new Set([fi, ti]);

    const fRect = fromCard.getBoundingClientRect();
    const tRect = toCard.getBoundingClientRect();

    const fL  =(fRect.left  -canvasRect.left)/scale;
    const fR  =(fRect.right -canvasRect.left)/scale;
    const fTop=(fRect.top   -canvasRect.top )/scale;
    const fBot=(fRect.bottom-canvasRect.top )/scale;
    const fY  =(fRect.top+fRect.height/2-canvasRect.top)/scale;

    const tL  =(tRect.left  -canvasRect.left)/scale;
    const tR  =(tRect.right -canvasRect.left)/scale;
    const tTop=(tRect.top   -canvasRect.top )/scale;
    const tBot=(tRect.bottom-canvasRect.top )/scale;
    const tY  =(tRect.top+tRect.height/2-canvasRect.top)/scale;

    const {d, ox, oy} = route(fL, fR, fTop, fBot, fY, tL, tR, tTop, tBot, tY, excl, idx);

    const color=(typeColors[emp.adminReportingType]||'#F5A623');
    const dash =(typeDashes[emp.adminReportingType]||'8 5');
    const st   =(emp.adminReportingType||'administrative').replace(/[^a-z]/g,'-');

    // Path: starts at FROM-node (dot), ends at TO-node (arrowhead)
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d',d);
    path.setAttribute('stroke',color);
    path.setAttribute('stroke-width','1.8');
    path.setAttribute('stroke-dasharray',dash);
    path.setAttribute('fill','none');
    path.setAttribute('opacity','0.85');
    path.setAttribute('stroke-linejoin','miter');
    path.setAttribute('stroke-linecap','square');
    path.setAttribute('marker-end',`url(#admin-arrow-${chartKey}-${st})`);
    svg.appendChild(path);

    // Dot at origin (FROM-node edge)
    const dot=document.createElementNS('http://www.w3.org/2000/svg','circle');
    dot.setAttribute('cx',ox); dot.setAttribute('cy',oy);
    dot.setAttribute('r','3.5'); dot.setAttribute('fill',color);
    dot.setAttribute('opacity','0.9');
    svg.appendChild(dot);
  });
}

// ── Reorder Plants ───────────────────────────────────────────────
async function reorderPlants(id, dir){
  const arr=[...S.plants];
  const idx=arr.findIndex(p=>p.id===id);
  if(idx<0) return;
  const swapIdx=idx+dir;
  if(swapIdx<0||swapIdx>=arr.length) return;
  // Normalise all sortOrders first (0,1,2,…) then swap the two
  const updates=arr.map((p,i)=>({id:p.id, order:i}));
  updates[idx].order=swapIdx;
  updates[swapIdx].order=idx;
  try{
    await Promise.all(updates.map(u=>col('plants').doc(u.id).set({sortOrder:u.order},{merge:true})));
    toast('Order saved','ok');
  } catch(e){ toast('Reorder failed: '+e.message,'er'); }
}

// ── Reorder Departments ───────────────────────────────────────────
async function reorderDepts(id, dir){
  const arr=[...S.departments];
  const idx=arr.findIndex(d=>d.id===id);
  if(idx<0) return;
  const swapIdx=idx+dir;
  if(swapIdx<0||swapIdx>=arr.length) return;
  // Normalise sortOrders 0,1,2,… then swap the two positions
  const newArr=arr.map((d,i)=>({...d, sortOrder:i}));
  const tmpOrd=newArr[idx].sortOrder;
  newArr[idx].sortOrder=newArr[swapIdx].sortOrder;
  newArr[swapIdx].sortOrder=tmpOrd;
  newArr.sort((a,b)=>a.sortOrder-b.sortOrder);
  try{
    await structSettingsDoc('departments').set({list:newArr},{merge:true});
    toast('Order saved','ok');
  } catch(e){ toast('Reorder failed: '+e.message,'er'); }
}
