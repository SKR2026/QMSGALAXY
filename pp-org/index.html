<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>OrgChart Pro – Plant Management System</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<!-- Firebase v9 compat CDN - no npm needed -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<!-- PDF export CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<!-- SheetJS for XLSX read/write -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --navy:#0F1F3D;--navy-l:#1E3A6E;--steel:#1E4080;
  --gold:#F5A623;--gold-l:#FBBF45;
  --white:#fff;--off:#F7F9FC;
  --g50:#F0F4FA;--g100:#E8ECF2;--g200:#CDD5E0;--g400:#8494AA;--g600:#4A5568;--g800:#1A2535;
  --ok:#22C55E;--err:#EF4444;
  --shadow:0 4px 16px rgba(15,31,61,.12);--r:10px;--rl:16px;
  font-family:'Inter',-apple-system,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--off);color:var(--g800);font-size:14px;line-height:1.6;min-height:100vh}
#app{min-height:100vh}

/* Layout */
.layout{display:flex;min-height:100vh}
.sidebar{width:230px;min-height:100vh;background:var(--navy);display:flex;flex-direction:column;position:fixed;top:0;left:0;z-index:100;overflow-y:auto}
.main{margin-left:230px;flex:1;display:flex;flex-direction:column;min-height:100vh}
.topbar{height:60px;background:var(--white);border-bottom:1px solid var(--g100);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:50;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.page{padding:24px;flex:1}

/* Sidebar */
.s-logo{padding:18px 18px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.s-logo h1{color:#fff;font-size:17px;font-weight:800;line-height:1.2}
.s-logo span{color:var(--gold)}
.s-logo p{color:rgba(255,255,255,.35);font-size:11px;margin-top:2px}
.s-logo-img{width:100%;max-height:56px;object-fit:contain;margin-bottom:10px;border-radius:8px;background:rgba(255,255,255,.05);padding:6px;}
.logo-upload-area{border:2px dashed rgba(255,255,255,.2);border-radius:10px;padding:14px;text-align:center;cursor:pointer;transition:all .15s;background:rgba(255,255,255,.04);margin-top:10px}
.logo-upload-area:hover{border-color:var(--gold);background:rgba(245,166,35,.06)}
.s-nav{padding:14px 10px;flex:1}
.s-sec{color:rgba(255,255,255,.3);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;padding:14px 10px 5px}
.nav-btn{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:8px;color:rgba(255,255,255,.6);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;border:none;background:none;width:100%;text-align:left;margin-bottom:2px;font-family:inherit}
.nav-btn:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-btn.active{background:var(--gold);color:var(--navy);font-weight:700}
.s-foot{padding:14px 10px;border-top:1px solid rgba(255,255,255,.08)}
.u-pill{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:8px;background:rgba(255,255,255,.06)}
.u-av{width:30px;height:30px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:var(--navy);flex-shrink:0}
.u-nm{color:#fff;font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.u-rl{color:rgba(255,255,255,.35);font-size:11px}
.lo-btn{display:flex;align-items:center;gap:8px;padding:8px 11px;border-radius:8px;color:rgba(255,255,255,.4);font-size:12px;cursor:pointer;border:none;background:none;width:100%;margin-top:6px;transition:all .15s;font-family:inherit}
.lo-btn:hover{background:rgba(239,68,68,.15);color:var(--err)}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border:none;border-radius:var(--r);font-size:13px;font-weight:600;cursor:pointer;transition:all .17s;white-space:nowrap;font-family:inherit}
.bp{background:var(--gold);color:var(--navy)}.bp:hover{background:var(--gold-l);transform:translateY(-1px);box-shadow:var(--shadow)}
.bs{background:var(--navy);color:#fff}.bs:hover{background:var(--navy-l);transform:translateY(-1px)}
.bo{background:transparent;border:1.5px solid var(--g200);color:var(--g600)}.bo:hover{border-color:var(--steel);color:var(--steel);background:var(--g50)}
.bd{background:var(--err);color:#fff}.bd:hover{background:#dc2626}
.bsm{padding:5px 11px;font-size:12px}.bic{padding:6px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}

/* Forms */
.fg{margin-bottom:14px}
.lbl{display:block;font-size:11px;font-weight:700;color:var(--g600);margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em}
.inp{width:100%;padding:9px 13px;border:1.5px solid var(--g200);border-radius:var(--r);font-size:14px;color:var(--g800);background:#fff;transition:border-color .15s;font-family:inherit;outline:none}
.inp:focus{border-color:var(--steel);box-shadow:0 0 0 3px rgba(30,64,128,.08)}
.inp::placeholder{color:var(--g400)}
select.inp{cursor:pointer}
textarea.inp{resize:vertical;min-height:70px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* Cards/stats */
.card{background:#fff;border-radius:var(--rl);border:1px solid var(--g100);box-shadow:0 1px 3px rgba(15,31,61,.07)}
.card-h{padding:16px 20px;border-bottom:1px solid var(--g100);display:flex;align-items:center;justify-content:space-between}
.card-h h3{font-size:14px;font-weight:700;color:var(--navy)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:24px}
.stat{background:#fff;border-radius:var(--rl);padding:18px;border:1px solid var(--g100);box-shadow:0 1px 3px rgba(15,31,61,.07)}
.sv{font-size:30px;font-weight:800;color:var(--navy);line-height:1}
.sl{font-size:12px;color:var(--g400);margin-top:3px;font-weight:500}
.si{font-size:22px;margin-bottom:8px}

/* Table */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{background:var(--g50);color:var(--g600);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:11px 14px;text-align:left}
td{padding:12px 14px;border-bottom:1px solid var(--g100);font-size:13px}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--g50)}

/* Badge */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
.bg{background:rgba(245,166,35,.12);color:#B7791F}
.bb{background:rgba(30,64,128,.1);color:var(--steel)}
.bk{background:rgba(34,197,94,.1);color:#16a34a}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(10,20,40,.55);display:flex;align-items:center;justify-content:center;z-index:999;backdrop-filter:blur(4px);padding:20px}
.modal{background:#fff;border-radius:var(--rl);width:100%;max-width:500px;max-height:90vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.25);animation:su .2s ease}
.mh{padding:20px 22px 16px;border-bottom:1px solid var(--g100);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:1}
.mh h3{font-size:16px;font-weight:800;color:var(--navy)}
.mb{padding:22px}
.mf{padding:14px 22px;border-top:1px solid var(--g100);display:flex;gap:10px;justify-content:flex-end}
@keyframes su{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

/* Toasts */
#toasts{position:fixed;bottom:22px;right:22px;z-index:9999;display:flex;flex-direction:column;gap:7px}
.toast{display:flex;align-items:center;gap:9px;padding:11px 16px;border-radius:var(--r);background:var(--navy);color:#fff;font-size:13px;font-weight:500;box-shadow:var(--shadow);animation:si .2s ease;min-width:220px}
.tok{border-left:4px solid var(--ok)}.ter{border-left:4px solid var(--err)}.tin{border-left:4px solid var(--gold)}
@keyframes si{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}

/* Login */
.login-page{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--navy) 0%,var(--steel) 60%,#1a4d8f 100%);padding:24px}
.lp-brand{text-align:center;margin-bottom:40px}
.lp-brand h1{font-size:32px;font-weight:900;color:#fff;line-height:1.2;letter-spacing:-.5px}
.lp-brand span{color:var(--gold)}
.lp-brand p{color:rgba(255,255,255,.45);font-size:13px;margin-top:6px}
.lp-cards{display:flex;gap:20px;width:100%;max-width:620px;align-items:stretch}
/* View card — full opacity, prominent */
.lp-card{border-radius:20px;padding:36px 28px;display:flex;flex-direction:column;align-items:center;text-align:center;cursor:pointer;transition:all .2s;text-decoration:none;flex:1}
.lp-card-view{background:rgba(255,255,255,1);box-shadow:0 12px 40px rgba(0,0,0,.25)}
.lp-card-view:hover{transform:translateY(-4px);box-shadow:0 20px 50px rgba(0,0,0,.3)}
/* Login card — faded/muted */
.lp-card-login{background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.18);opacity:.7}
.lp-card-login:hover{opacity:1;background:rgba(255,255,255,.18);transform:translateY(-2px)}
.lp-icon{width:18px;height:18px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;margin-bottom:8px}
.lp-icon-view{background:linear-gradient(135deg,#e8f5e9,#c8e6c9)}
.lp-icon-login{background:rgba(255,255,255,.15)}
.lp-card-title{font-size:16px;font-weight:800;margin-bottom:6px}
.lp-card-view .lp-card-title{color:var(--navy)}
.lp-card-login .lp-card-title{color:#fff}
.lp-card-desc{font-size:12px;line-height:1.6;margin-bottom:20px}
.lp-card-view .lp-card-desc{color:var(--g400)}
.lp-card-login .lp-card-desc{color:rgba(255,255,255,.55)}
.lp-badge{display:inline-block;font-size:11px;font-weight:700;padding:4px 12px;border-radius:20px;letter-spacing:.03em}
.lp-badge-view{background:rgba(34,197,94,.12);color:#16a34a}
.lp-badge-login{background:rgba(255,255,255,.15);color:rgba(255,255,255,.7)}
/* Login form — slides in below the cards */
.lp-form-wrap{width:100%;max-width:380px;background:rgba(255,255,255,1);border-radius:20px;padding:28px 32px;box-shadow:0 12px 40px rgba(0,0,0,.2);display:none;animation:su .25s ease}
.lp-form-wrap.show{display:block}
.lp-cards.hidden{display:none}
.lp-back{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--g400);cursor:pointer;border:none;background:none;font-family:inherit;margin-bottom:16px;padding:0}
.lp-back:hover{color:var(--navy)}
@media(max-width:580px){.lp-cards{flex-direction:column;max-width:340px}.lp-card{padding:28px 20px}.sidebar{width:190px}.main{margin-left:190px}}

/* Org chart */
.org-wrap{overflow:auto;background:#fff;border-radius:var(--rl);border:1px solid var(--g100);min-height:380px}
.org-canvas{display:inline-flex;min-width:100%;justify-content:center;padding:44px 36px;transform-origin:top center;transition:transform .2s}
.org-tb{display:flex;align-items:center;gap:8px;padding:11px 14px;background:#fff;border-radius:var(--rl);border:1px solid var(--g100);margin-bottom:14px}
.org-t{font-size:13px;font-weight:700;color:var(--navy);flex:1}
.onode{display:flex;flex-direction:column;align-items:center;position:relative}
.ocard{background:#fff;border:1.5px solid var(--g200);border-radius:12px;padding:13px 14px;width:168px;cursor:pointer;transition:all .2s;text-align:center;box-shadow:0 1px 4px rgba(15,31,61,.08);position:relative}
.ocard:hover{border-color:var(--steel);box-shadow:var(--shadow);transform:translateY(-2px)}
.ocard.root-card{border-color:var(--gold);background:var(--navy)}
.ocard.root-card .oname{color:#fff}
.ocard.root-card .odesig{color:rgba(255,255,255,.55)}
.oav{width:50px;height:50px;border-radius:50%;object-fit:cover;margin:0 auto 7px;display:block;border:2px solid var(--g100)}
.oavph{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,var(--steel),var(--navy));margin:0 auto 7px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:700}
.oname{font-size:11px;font-weight:700;color:var(--navy);line-height:1.3}
.odesig{font-size:10px;color:var(--g400);margin-top:2px;font-weight:500}
.oplant{font-size:9px;color:var(--gold);margin-top:3px;font-weight:600}
.odept{font-size:9px;color:var(--steel);margin-top:2px;font-weight:600}
.ocode{font-size:9px;color:var(--g400);margin-top:1px}
.ocol{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);width:20px;height:20px;border-radius:50%;border:1.5px solid var(--g200);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--g400);transition:all .15s;z-index:5;font-family:inherit}
.ocol:hover{border-color:var(--steel);color:var(--steel)}
.conn-v{width:1px;background:var(--g200);margin:0 auto}
.ochildren{display:flex;gap:16px;position:relative}

/* Photo upload */
.photo-area{border:2px dashed var(--g200);border-radius:var(--r);padding:18px;text-align:center;cursor:pointer;transition:all .15s;background:var(--g50);margin-bottom:14px}
.photo-area:hover{border-color:var(--steel);background:rgba(30,64,128,.03)}
.photo-prev{width:72px;height:72px;border-radius:50%;object-fit:cover;margin:0 auto 6px;display:block}

/* Empty */
.empty{text-align:center;padding:50px 20px;color:var(--g400)}
.ei{font-size:42px;margin-bottom:10px}
.empty h3{font-size:15px;font-weight:600;color:var(--g600);margin-bottom:5px}

/* Detail popup */
.detail-pop{background:#fff;border-radius:var(--rl);max-width:360px;width:100%;padding:28px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.25);animation:su .2s ease}
.dp-av{width:76px;height:76px;border-radius:50%;object-fit:cover;margin:0 auto 12px;display:block;border:3px solid var(--g100)}
.dp-avph{width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,var(--steel),var(--navy));margin:0 auto 12px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px;font-weight:700}
.dp-name{font-size:18px;font-weight:800;color:var(--navy);margin-bottom:3px}
.dp-des{font-size:13px;color:var(--g400);margin-bottom:14px}
.dp-row{display:flex;align-items:center;gap:10px;padding:9px 13px;background:var(--g50);border-radius:8px;margin-bottom:8px;text-decoration:none;color:var(--g800);font-size:13px}

/* Config banner */
.cfg-banner{background:#fff3cd;border:1px solid #ffc107;border-radius:var(--r);padding:16px 20px;margin-bottom:20px;font-size:13px;line-height:1.7}
.cfg-banner strong{color:#856404}
.cfg-banner code{background:rgba(0,0,0,.07);padding:1px 5px;border-radius:4px;font-family:monospace;font-size:12px}

/* Helpers */
.fl{display:flex}.ac{align-items:center}.jb{justify-content:space-between}.g2h{gap:8px}.g3h{gap:12px}.mb16{margin-bottom:16px}.mt8{margin-top:8px}
.ocard.highlight-card{border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,166,35,.2);}
</style>

<body>
<div id="app"></div>
<div id="toasts"></div>

<script>
// ╔══════════════════════════════════════════════════════════════╗
// ║  🔥 FIREBASE CONFIG — replace with YOUR values              ║
// ║  Get from: Firebase Console → Project Settings → Your Apps  ║
// ╚══════════════════════════════════════════════════════════════╝
const FIREBASE_CONFIG = {
  apiKey:            "AIzaSyCsd_IOB8DPRNbT8TrBsltQksZ6yD7nlqQ",
  authDomain:        "skr-mom.firebaseapp.com",
  databaseURL:       "https://skr-mom-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:         "skr-mom",
  storageBucket:     "skr-mom.firebasestorage.app",
  messagingSenderId: "993069516449",
  appId:             "1:993069516449:web:a0329628740748a913d2e0",
  measurementId:     "G-2ZL4JR2V9R"
};

// ── Init Firebase ───────────────────────────────────────────────
const app    = firebase.initializeApp(FIREBASE_CONFIG);
const auth   = firebase.auth();
const db     = firebase.firestore();
const stor   = firebase.storage();

// ── App State ──────────────────────────────────────────────────
const S = {
  user:null, profile:null,
  plants:[], employees:[], users:[],
  departments:[], // list of {id, name, description} stored in Firestore settings/departments
  tab:'dashboard',
  modal:null, detailPerson:null,
  filterPlant:'', chartScale:1, plantChartId:'', deptChartId:'', deptChartPlant:'',
  collapsed:new Set(),
  loading:true,
  publicView:false,   // true = no-login public chart view
  publicViewEnabled:true, // controlled by superadmin setting in Firestore
  companyLogo:null,   // URL of shared company logo from Firestore settings
  _photoFile:null, _photoPreview:null,
};
// Detect public view: ?view=public OR #public OR path ends with /public
if(
  location.search.includes('view=public') ||
  location.hash==='#public' ||
  location.pathname.endsWith('/public') ||
  location.pathname.endsWith('/public/')
) S.publicView=true;
let _unsubs=[];

// ── Utilities ───────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const ini = n => (n||'?').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2);
const isConfigured = () => true;

function toast(msg, type='in'){
  const t=document.createElement('div');
  t.className=`toast t${type}`;
  const icons={tok:'✓',ter:'✕',tin:'ℹ'};
  t.innerHTML=`<span>${icons['t'+type]||'ℹ'}</span><span style="flex:1">${msg}</span>`;
  $('toasts').appendChild(t);
  setTimeout(()=>t.remove(),3500);
}

function buildTree(emps){
  if(!emps||!emps.length) return null;
  const map={};
  emps.forEach(e=>{ map[e.id]={...e,children:[]} });
  let root=null;
  emps.forEach(e=>{
    if(!e.parentId||!map[e.parentId]){ if(!root) root=map[e.id]; }
    else map[e.parentId].children.push(map[e.id]);
  });
  return root;
}

// ── Listeners ───────────────────────────────────────────────────
function startListeners(){
  _unsubs.forEach(u=>u()); _unsubs=[];
  // Load shared company settings (logo, etc.)
  _unsubs.push(db.collection('settings').doc('company').onSnapshot(snap=>{
    const d=snap.exists?snap.data():{};
    S.companyLogo=d.logoURL||null;
    S.publicViewEnabled=d.publicViewEnabled!==false; // default true if not set
    render();
  }));
  _unsubs.push(db.collection('plants').onSnapshot(s=>{
    S.plants=s.docs.map(d=>({id:d.id,...d.data()})); render();
  }));
  _unsubs.push(db.collection('employees').onSnapshot(s=>{
    S.employees=s.docs.map(d=>({id:d.id,...d.data()})); render();
  }));
  _unsubs.push(db.collection('settings').doc('departments').onSnapshot(snap=>{
    const d=snap.exists?snap.data():{};
    S.departments=(d.list||[]).sort((a,b)=>a.name.localeCompare(b.name));
    render();
  }));
  if(S.profile?.role==='super-admin'){
    _unsubs.push(db.collection('mompro_users').onSnapshot(s=>{
      S.users=s.docs.map(d=>({_docId:d.id,...d.data(),id:d.id})); render();
    }));
  }
}

function startPublicListeners(){
  _unsubs.forEach(u=>u()); _unsubs=[];
  _unsubs.push(db.collection('settings').doc('company').onSnapshot(snap=>{
    const d=snap.exists?snap.data():{};
    S.companyLogo=d.logoURL||null;
    S.publicViewEnabled=d.publicViewEnabled!==false;
    render();
  }));
  _unsubs.push(db.collection('plants').onSnapshot(s=>{
    S.plants=s.docs.map(d=>({id:d.id,...d.data()})); render();
  }));
  _unsubs.push(db.collection('employees').onSnapshot(s=>{
    S.employees=s.docs.map(d=>({id:d.id,...d.data()})); render();
  }));
}

// Safety timeout — if auth never fires (unauthorized domain), show login after 5s
const _authTimeout=setTimeout(()=>{
  if(S.loading){ S.loading=false; render(); }
},5000);

auth.onAuthStateChanged(async user=>{
  clearTimeout(_authTimeout);
  // If public view mode — skip auth entirely, just load data
  if(S.publicView){
    S.loading=false;
    startPublicListeners();
    return;
  }
  S.user=user;
  if(user){
    // mompro_users uses numeric doc IDs — must query by email
    let profileData=null;
    try{
      // Get ALL docs matching this email (role field may differ across docs)
      const q=await db.collection('mompro_users').where('email','==',user.email).get();
      if(!q.empty){
        // Prefer the doc with a privileged role (super-admin > plant-admin > others)
        const rolePriority=r=>{
          const rr=(r||'').trim().toLowerCase();
          if(rr==='super-admin'||rr==='superadmin'||rr==='super_admin') return 3;
          if(rr==='plant-admin'||rr==='plantadmin'||rr==='plant_admin') return 2;
          return 1;
        };
        const sorted=q.docs.map(d=>d.data()).sort((a,b)=>rolePriority(b.role)-rolePriority(a.role));
        profileData=sorted[0];
        console.log('[OrgChart] Found',q.docs.length,'doc(s) for email. Using role:',profileData.role);
      }
    }catch(e){ console.error('[OrgChart] Query error:',e); }
    if(profileData){
      // Normalize role value (trim, lowercase, map variants)
      const raw=(profileData.role||'').toString().trim().toLowerCase();
      const roleMap={
        'super-admin':'super-admin','superadmin':'super-admin','super_admin':'super-admin',
        'plant-admin':'plant-admin','plantadmin':'plant-admin','plant_admin':'plant-admin',
        'viewer':'viewer','view':'viewer',
        // Non-admin roles from mompro — treat as viewer in orgchart
        'assignee':'viewer','member':'viewer','user':'viewer','employee':'viewer'
      };
      profileData.role=roleMap[raw]||raw;
      S.profile=profileData;
    } else { S.profile=null; }
    console.log('[OrgChart] Profile:',S.profile?.email,'| Normalized role:',S.profile?.role);
    if(!S.tab||S.tab==='dashboard') S.tab=S.profile?.role==='plant-admin'?'pa-chart':'dashboard';
    startListeners();
  } else {
    S.profile=null; S.plants=[]; S.employees=[]; S.users=[];
    _unsubs.forEach(u=>u()); _unsubs=[];
  }
  S.loading=false; render();
});

function render(){
  const app=$('app');
  if(S.loading){ app.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:var(--g400);font-size:15px">Loading…</div>'; return; }
  if(S.publicView){
    if(!S.publicViewEnabled){
      // Public view disabled by superadmin — redirect to login
      S.publicView=false;
      app.innerHTML=loginHTML(); bindLogin(); return;
    }
    app.innerHTML=publicViewHTML(); bindPublicView(); return;
  }
  if(!S.user){ app.innerHTML=loginHTML(); bindLogin(); return; }
  if(!S.profile){
    app.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:12px"><div style="color:var(--err);font-size:15px;font-weight:600">Account not found in mompro_users</div><div style="color:var(--g400);font-size:13px">Make sure your email exists in the mompro_users collection.</div></div>';
    return;
  }
  const role=S.profile.role;
  console.log('[OrgChart] Rendering for role:',role);
  if(role==='super-admin') app.innerHTML=superAdminHTML();
  else if(role==='plant-admin') app.innerHTML=plantAdminHTML();
  else app.innerHTML=viewerHTML();
  bindAll();
}

function bindLogin(){
  // View structure card — activate public view in-page (no redirect needed)
  $('lp-view-card')?.addEventListener('click',()=>{
    S.publicView=true;
    S.loading=false;
    startPublicListeners();
    render();
  });

  // Show form when login card clicked
  $('lp-login-card')?.addEventListener('click',()=>{
    $('lp-cards')?.classList.add('hidden');
    $('lp-brand')?.style.setProperty('margin-bottom','24px');
    $('lp-form-wrap')?.classList.add('show');
    setTimeout(()=>$('li-email')?.focus(),200);
  });
  // Back button — hide form, show cards again
  $('lp-back-btn')?.addEventListener('click',()=>{
    $('lp-form-wrap')?.classList.remove('show');
    $('lp-cards')?.classList.remove('hidden');
    $('li-err') && ($('li-err').style.display='none');
  });
  const doLogin=async()=>{
    const email=$('li-email')?.value.trim(), pass=$('li-pass')?.value;
    if(!email||!pass) return;
    $('li-btn').textContent='Signing in…'; $('li-btn').disabled=true;
    try{ await auth.signInWithEmailAndPassword(email,pass); }
    catch(e){
      $('li-err').style.display='block';
      $('li-err').textContent='Invalid email or password. Please try again.';
      $('li-btn').textContent='Sign In'; $('li-btn').disabled=false;
    }
  };
  $('li-btn')?.addEventListener('click', doLogin);
  $('li-pass')?.addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
}

// Builds a virtual tree where the root is the dept header node
// and children are employees in that dept (preserving parent→child links within dept)
function buildDeptTree(deptEmps, allEmps){
  if(!deptEmps||!deptEmps.length) return null;

  // Map by id for quick lookup (only within dept)
  const deptIds=new Set(deptEmps.map(e=>e.id));
  const map={};
  deptEmps.forEach(e=>{ map[e.id]={...e,children:[]}; });

  // Link parent→child only if parent is also in this dept
  deptEmps.forEach(e=>{
    if(e.parentId&&deptIds.has(e.parentId)){
      map[e.parentId].children.push(map[e.id]);
    }
  });

  // Nodes whose parent is outside this dept (or has no parent) are dept-level roots
  const roots=deptEmps
    .filter(e=>!e.parentId||!deptIds.has(e.parentId))
    .map(e=>map[e.id]);

  // Synthesise a virtual dept header node
  const deptName=deptEmps[0]?.dept||'Unknown';
  return {
    id:'__dept__'+deptName,
    name:deptName,
    designation:'Department',
    dept:'',
    _isDeptHeader:true,
    children:roots
  };
}

          return tree?`<div style="background:#fff;border-radius:var(--rl);border:1px solid var(--g100);overflow:auto;min-height:400px;box-shadow:0 1px 3px rgba(15,31,61,.07)">

    <div style="background:var(--navy);padding:14px 28px;text-align:center">

function highlightSearch(node, search){
  // mark nodes matching search
  const matches=name=>name&&name.toLowerCase().includes(search);
  node._highlight=matches(node.name)||matches(node.designation)||matches(node.dept)||matches(node.empCode);
  (node.children||[]).forEach(c=>highlightSearch(c,search));
}

function bindPublicView(){
  // detail overlay close
  $('det-overlay')?.addEventListener('click',e=>{ if(e.target.id==='det-overlay'){ S.detailPerson=null; render(); }});
  $('det-close')?.addEventListener('click',()=>{ S.detailPerson=null; render(); });

  // org card clicks
  document.querySelectorAll('[data-pid]').forEach(card=>{
    card.addEventListener('click',e=>{
      if(e.target.classList.contains('ocol')||e.target.closest?.('.ocol')) return;
      S.detailPerson=S.employees.find(x=>x.id===card.dataset.pid)||null;
      render();
    });
  });
  // collapse individual
  document.querySelectorAll('[data-colid]').forEach(btn=>{
    btn.addEventListener('click',e=>{
      e.stopPropagation();
      const id=btn.dataset.colid;
      S.collapsed.has(id)?S.collapsed.delete(id):S.collapsed.add(id);
      render();
    });
  });
  // expand all / collapse all (public view keys)
  ['pub-grp','pub-plt'].forEach(key=>{
    document.getElementById(`expand-all-${key}`)?.addEventListener('click',()=>{
      S.collapsed.clear(); render();
    });
    document.getElementById(`collapse-all-${key}`)?.addEventListener('click',()=>{
      document.querySelectorAll('[data-colid]').forEach(btn=>S.collapsed.add(btn.dataset.colid));
      render();
    });
  });

  // plant filter
  $('pub-plant-filter')?.addEventListener('change',e=>{ S.plantChartId=e.target.value; render(); });

  // search
  let searchTimer;
  $('pub-search')?.addEventListener('input',e=>{
    clearTimeout(searchTimer);
    searchTimer=setTimeout(()=>{ S._pubSearch=e.target.value; render(); },300);
  });

  // zoom
  $('pub-zi')?.addEventListener('click',()=>{ S.chartScale=Math.min(S.chartScale+0.1,2.5); render(); });
  $('pub-zo')?.addEventListener('click',()=>{ S.chartScale=Math.max(S.chartScale-0.1,0.3); render(); });
  $('pub-zr')?.addEventListener('click',()=>{ S.chartScale=1; render(); });
  $('pub-expand-all')?.addEventListener('click',()=>{ S.collapsed.clear(); render(); });
  $('pub-collapse-all')?.addEventListener('click',()=>{ document.querySelectorAll('[data-colid]').forEach(btn=>S.collapsed.add(btn.dataset.colid)); render(); });

  // PDF export
  $('pub-pdf')?.addEventListener('click',async()=>{
    const canvas=$('pub-canvas'); if(!canvas) return;
    const btn=$('pub-pdf'); btn.textContent='Exporting…'; btn.disabled=true;
    try{
      await buildPDF(canvas,'Organisation_Structure_'+Date.now()+'.pdf');
      toast('PDF exported','ok');
    } catch(e){ toast('Export failed','er'); }
    btn.textContent='⬇ Export PDF'; btn.disabled=false;
  });
}

//  EVENT BINDING
// ════════════════════════════════════════════════════════════════
function bindAll(){
  // nav
  document.querySelectorAll('[data-tab]').forEach(btn=>{
    btn.addEventListener('click',()=>{ S.tab=btn.dataset.tab; render(); });
  });
  // logout
  $('lo-btn')?.addEventListener('click',()=>auth.signOut());

  // org card click → detail
  document.querySelectorAll('[data-pid]').forEach(card=>{
    card.addEventListener('click',e=>{
      if(e.target.classList.contains('ocol')||e.target.closest?.('.ocol')) return;
      S.detailPerson=S.employees.find(x=>x.id===card.dataset.pid)||null;
      render();
    });
  });
  // collapse/expand individual
  document.querySelectorAll('[data-colid]').forEach(btn=>{
    btn.addEventListener('click',e=>{
      e.stopPropagation();
      const id=btn.dataset.colid;
      S.collapsed.has(id)?S.collapsed.delete(id):S.collapsed.add(id);
      render();
    });
  });
  // expand all / collapse all buttons
  ['grp','plt','dpt','pa'].forEach(key=>{
    document.getElementById(`expand-all-${key}`)?.addEventListener('click',()=>{
      S.collapsed.clear();
      render();
    });
    document.getElementById(`collapse-all-${key}`)?.addEventListener('click',()=>{
      document.querySelectorAll('[data-colid]').forEach(btn=>S.collapsed.add(btn.dataset.colid));
      render();
    });
  });
  // detail close
  $('det-overlay')?.addEventListener('click',e=>{ if(e.target.id==='det-overlay'){ S.detailPerson=null; render(); }});
  $('det-close')?.addEventListener('click',()=>{ S.detailPerson=null; render(); });

  // ── Bulk delete (super admin only) ───────────────────────────────
  const bulkDelBtn=$('bulk-del-btn');
  const selAllChk=$('sel-all');
  const empChks=()=>document.querySelectorAll('.emp-chk');
  const updateBulkBar=()=>{
    const checked=[...empChks()].filter(c=>c.checked);
    const count=checked.length;
    if(bulkDelBtn){
      bulkDelBtn.style.display=count>0?'inline-flex':'none';
      const span=$('bulk-del-count'); if(span) span.textContent=count;
    }
    if(selAllChk) selAllChk.indeterminate=count>0&&count<empChks().length;
  };
  selAllChk?.addEventListener('change',()=>{
    empChks().forEach(c=>c.checked=selAllChk.checked);
    updateBulkBar();
  });
  empChks().forEach(c=>c.addEventListener('change',()=>{
    if(selAllChk) selAllChk.checked=[...empChks()].every(x=>x.checked);
    updateBulkBar();
  }));
  bulkDelBtn?.addEventListener('click',async()=>{
    const ids=[...empChks()].filter(c=>c.checked).map(c=>c.dataset.id);
    if(!ids.length) return;
    const names=ids.map(id=>S.employees.find(e=>e.id===id)?.name||id);
    if(!confirm(`Delete ${ids.length} employee${ids.length!==1?'s':''}?\n\n${names.slice(0,10).join(', ')}${names.length>10?`\n…and ${names.length-10} more`:''}\n\nThis cannot be undone.`)) return;
    bulkDelBtn.disabled=true; bulkDelBtn.textContent='Deleting…';
    let done=0,failed=0;
    for(const id of ids){
      try{ await db.collection('employees').doc(id).delete(); done++; }
      catch(e){ failed++; console.error('Bulk delete error:',e); }
    }
    toast(`🗑 Deleted ${done} employee${done!==1?'s':''}${failed?', '+failed+' failed':''}`, done>0?'ok':'er');
    // render will reset the button state
  });

  // ── Public View Toggle ────────────────────────────────────────────
  const pvTrack=$('pv-track');
  const pvThumb=$('pv-thumb');
  const pvLabel=$('pv-label');
  const pvStatus=$('pv-status');
  if(pvTrack){
    $('pv-toggle-label')?.addEventListener('click',async()=>{
      const newVal=!S.publicViewEnabled;
      // Optimistic UI update
      pvTrack.style.background=newVal?'var(--ok)':'var(--g200)';
      pvThumb.style.left=newVal?'27px':'3px';
      pvLabel.textContent=newVal?'🟢 Active':'⚪ Inactive';
      pvLabel.style.color=newVal?'var(--ok)':'var(--g400)';
      pvStatus.textContent='Saving…'; pvStatus.style.color='var(--g400)';
      try{
        await db.collection('settings').doc('company').set({publicViewEnabled:newVal,updatedAt:new Date().toISOString()},{merge:true});
        pvStatus.style.color='var(--ok)';
        pvStatus.textContent=newVal?'✓ Public view is now active':'✓ Public view is now disabled';
        toast(newVal?'Public view enabled — visitors can now browse without login':'Public view disabled — login required for all access','ok');
        setTimeout(()=>{pvStatus.textContent='';},3000);
      } catch(e){
        pvStatus.style.color='var(--err)'; pvStatus.textContent='Failed: '+e.message;
        toast('Failed to update setting: '+e.message,'er');
      }
    });
  }

  // ── Company Logo upload ─────────────────────────────────────────
  let _logoFile=null;
  const logoDrop=$('logo-drop');
  const logoInput=$('logo-file-input');
  if(logoDrop){
    logoDrop.addEventListener('click',()=>logoInput?.click());
    logoDrop.addEventListener('dragover',e=>{e.preventDefault();logoDrop.style.borderColor='var(--steel)';});
    logoDrop.addEventListener('dragleave',()=>logoDrop.style.borderColor='var(--g200)');
    logoDrop.addEventListener('drop',e=>{
      e.preventDefault(); logoDrop.style.borderColor='var(--g200)';
      const f=e.dataTransfer.files[0]; if(f&&f.type.startsWith('image/')) handleLogoFile(f);
    });
  }
  logoInput?.addEventListener('change',e=>{const f=e.target.files[0];if(f) handleLogoFile(f);});

  function handleLogoFile(file){
    _logoFile=file;
    const reader=new FileReader();

      btn.textContent='⬆ Save Logo';
    } catch(e){

      btn.disabled=false; btn.textContent='⬆ Save Logo';

    if(!confirm('Remove the company logo?')) return;
    try{

      toast('Logo removed','ok');
    } catch(e){ toast('Error: '+e.message,'er'); }

  const deptDescInp=$('dept-desc-inp');
  const deptEditId=$('dept-edit-id');

  function openDeptForm(dept){
    if(!deptForm) return;
    deptForm.style.display='block';

    if(deptDescInp) deptDescInp.value=dept?dept.description||'':'';
    if(deptEditId) deptEditId.value=dept?dept.id:'';
    if(deptErr){ deptErr.style.display='none'; deptErr.textContent=''; }

  document.querySelectorAll('.dd-btn').forEach(b=>{
    b.addEventListener('click',async()=>{
      const name=b.dataset.deptName;
      const id=b.dataset.deptId;
      const inUse=S.employees.filter(e=>(e.dept||'').toLowerCase()===name.toLowerCase()).length;
      const warn=inUse>0?`\n\n⚠ ${inUse} employee(s) currently belong to this department.`:'';
      if(!confirm(`Delete department "${name}"?${warn}\n\nThis cannot be undone.`)) return;
      try{
        const newList=S.departments.filter(d=>d.id!==id);

      } catch(e){ toast('Error: '+e.message,'er'); }

  document.querySelectorAll('.de-btn').forEach(b=>b.addEventListener('click',()=>deleteEmployee(b.dataset.id,b.dataset.name)));

  $('add-admin-btn')?.addEventListener('click',()=>openModal('admin',null));
  document.querySelectorAll('.da-btn').forEach(b=>b.addEventListener('click',()=>deleteAdmin(b.dataset.id,b.dataset.name)));

  $('fp-sel')?.addEventListener('change',e=>{ S.filterPlant=e.target.value; render(); });
  $('pcs-sel')?.addEventListener('change',e=>{ S.plantChartId=e.target.value; render(); });
  $('dcs-plant')?.addEventListener('change',e=>{ S.deptChartPlant=e.target.value; S.deptChartId=''; render(); });
  $('dcs-dept')?.addEventListener('change',e=>{ S.deptChartId=e.target.value; render(); });

  // zoom & PDF for all chart keys
  ['grp','plt','pa','dpt'].forEach(key=>{
    $(`zi-${key}`)?.addEventListener('click',()=>{ S.chartScale=Math.min(S.chartScale+0.1,2.5); render(); });
    $(`zo-${key}`)?.addEventListener('click',()=>{ S.chartScale=Math.max(S.chartScale-0.1,0.3); render(); });

    $(`pdf-${key}`)?.addEventListener('click',()=>exportPDF(key));
  });

  csvInput?.addEventListener('change',e=>{const f=e.target.files[0];if(f) parseBulkXLSX(f);});

// ── CRUD ops ─────────────────────────────────────────────────────
async function savePlant(){
  const name=$('m-name')?.value.trim();
  const location=$('m-loc')?.value.trim();
  const description=$('m-desc')?.value.trim();
  if(!name) throw new Error('Plant name is required');
  const data={name,location:location||'',description:description||''};
  const existing=S.modal?.data;
  if(existing?.id){ await db.collection('plants').doc(existing.id).update(data); toast('Plant updated','ok'); }
  else{ await db.collection('plants').add({...data,createdAt:new Date().toISOString()}); toast('Plant added','ok'); }
}

async function saveEmployee(){
  const name=$('m-name')?.value.trim();
  const designation=$('m-desig')?.value.trim();
  const empCode=$('m-empcode')?.value.trim();
  const dept=$('m-dept')?.value.trim();
  const email=$('m-email')?.value.trim();
  const contact=$('m-contact')?.value.trim();
  const myPid=S.profile?.role==='plant-admin'?S.profile.plantId:null;
  const plantId=myPid||$('m-plant')?.value;
  const parentId=$('m-parent')?.value||null;
  if(!name||!designation) throw new Error('Name and designation are required');
  if(!plantId) throw new Error('Please select a plant');

  // Duplicate emp code check — exclude self when editing
  if(empCode){
    const existing=S.modal?.data;
    const duplicate=S.employees.find(e=>
      e.empCode&&e.empCode.trim().toLowerCase()===empCode.toLowerCase()&&
      e.id!==(existing?.id||'__new__')
    );
    if(duplicate) throw new Error(`Employee ID "${empCode}" is already used by ${duplicate.name}. Please use a unique Employee Code.`);
  }

  const plant=S.plants.find(p=>p.id===plantId)?.name||'';
  let photoURL=S.modal?.data?.photoURL||null;
  if(S._photoFile){
    const ext=S._photoFile.name.split('.').pop();
    const id=S.modal?.data?.id||uid();
    const ref=stor.ref(`photos/${id}.${ext}`);
    await ref.put(S._photoFile);
    photoURL=await ref.getDownloadURL();
  }
  const data={name,designation,empCode:empCode||'',dept:dept||'',email:email||'',contact:contact||'',plantId,plant,parentId,photoURL};
  const existing=S.modal?.data;
  if(existing?.id){ await db.collection('employees').doc(existing.id).update(data); toast('Employee updated','ok'); }
  else{ await db.collection('employees').doc(uid()).set({...data,createdAt:new Date().toISOString()}); toast('Employee added','ok'); }
}

async function saveAdmin(){
  const name=$('m-name')?.value.trim();
  const email=$('m-email')?.value.trim();
  const pass=$('m-pass')?.value;
  const plantId=$('m-plant')?.value;
  if(!name||!email||!pass||!plantId) throw new Error('All fields are required');
  if(pass.length<8) throw new Error('Password must be at least 8 characters');
  const plant=S.plants.find(p=>p.id===plantId)?.name||'';
  // Use secondary app to avoid signing out current superadmin
  const sec=firebase.initializeApp(firebase.app().options,'sec_'+Date.now());
  const secAuth=firebase.auth(sec);
  try{
    const cred=await secAuth.createUserWithEmailAndPassword(email,pass);
    await db.collection('mompro_users').doc(cred.user.uid).set({
      uid:cred.user.uid,email,name,role:'plant-admin',plantId,plant,ini:ini(name),createdAt:new Date().toISOString()
    });
    toast('Plant Admin created successfully','ok');
  } finally{
    await secAuth.signOut().catch(()=>{});
    await sec.delete().catch(()=>{});
  }
}

  try{ await db.collection('plants').doc(id).delete(); toast('Plant deleted','ok'); }

// ── Bulk XLSX Upload ─────────────────────────────────────────────
let _bulkRows=[];

function parseBulkXLSX(file){
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const data=new Uint8Array(ev.target.result);
      const wb=XLSX.read(data,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});

      if(rows.length<2){ showBulkErr('Excel file is empty or has no data rows.'); return; }

      // Normalise headers — strip parenthetical notes like "(name or emp_code)" before normalising
      const headers=rows[0].map(h=>String(h).trim().replace(/\s*\(.*?\)/g,'').trim().toLowerCase().replace(/\s+/g,'_').replace(/[^a-z_]/g,''));
      const required=['name','designation'];
      const missing=required.filter(r=>!headers.includes(r));
      if(missing.length){ showBulkErr('Missing required columns: '+missing.join(', ')+'. Check your Excel header row.'); return; }

      const col=k=>headers.indexOf(k);
      // reports_to_name column accepts multiple aliases
      const reportsToCol=()=>{
        for(const alias of ['reports_to_name','reports_to','reportsto','reportstoname','parent','reports_to_emp_code']){
          const i=col(alias); if(i>=0) return i;
        }
        return -1;
      };

      _bulkRows=[];
      for(let i=1;i<rows.length;i++){
        const cells=rows[i];
        const name=String(cells[col('name')]||'').trim();
        const designation=String(cells[col('designation')]||'').trim();
        const empCode=String(cells[col('emp_code')]||'').trim();
        const dept=String(cells[col('dept')]||'').trim();
        const email=String(cells[col('email')]||'').trim();
        const contact=String(cells[col('contact')]||'').trim();
        const plantName=String(cells[col('plant_name')]||'').trim();
        const rtCol=reportsToCol();
        const reportsTo=rtCol>=0?String(cells[rtCol]||'').trim():'';

        // Skip completely empty rows
        if(!name&&!designation&&!email) continue;

        const rowErrs=[];
        if(!name) rowErrs.push('Name required');
        if(!designation) rowErrs.push('Designation required');

        // Resolve plant
        let plantId='', resolvedPlant='';
        if(plantName){
          const found=S.plants.find(p=>p.name.toLowerCase()===plantName.toLowerCase());
          if(found){ plantId=found.id; resolvedPlant=found.name; }
          else rowErrs.push('Plant "'+plantName+'" not found');
        } else if(S.profile?.role==='plant-admin'){
          plantId=S.profile.plantId;
          resolvedPlant=S.plants.find(p=>p.id===plantId)?.name||'';
        }

        // Resolve reportsTo: try name match, then emp code match against existing employees
        let resolvedReportsTo=reportsTo; // display value (keep original input)
        if(reportsTo){
          const byName=S.employees.find(e=>e.name.toLowerCase()===reportsTo.toLowerCase());
          const byCode=S.employees.find(e=>e.empCode&&e.empCode.toLowerCase()===reportsTo.toLowerCase());
          const match=byName||byCode;
          if(match) resolvedReportsTo=match.name; // normalize to name for display
        }

        // Duplicate emp code check — against existing DB records
        if(empCode){
          const dbDup=S.employees.find(e=>e.empCode&&e.empCode.trim().toLowerCase()===empCode.toLowerCase());
          if(dbDup) rowErrs.push(`Employee ID "${empCode}" already exists (${dbDup.name})`);
          // Also check for duplicates within this file (rows already pushed)
          const fileDup=_bulkRows.find(r=>r.empCode&&r.empCode.toLowerCase()===empCode.toLowerCase());
          if(fileDup) rowErrs.push(`Employee ID "${empCode}" duplicated in this file (row: ${fileDup.name})`);
        }

        _bulkRows.push({name,designation,empCode,dept,email,contact,plantId,plant:resolvedPlant,reportsToName:reportsTo,reportsToDisplay:resolvedReportsTo,valid:rowErrs.length===0,errors:rowErrs});
      }

      if(_bulkRows.length===0){ showBulkErr('No valid data rows found in the Excel file.'); return; }
      renderBulkPreview();

    } catch(e){
      showBulkErr('Failed to read Excel file: '+e.message+'. Make sure it is a valid .xlsx file.');
    }
  };
  reader.readAsArrayBuffer(file);
}

function renderBulkPreview(){
  const sec=$('bulk-preview-section');
  const tbody=$('bulk-preview-body');
  const importBtn=$('bulk-import-btn');
  const summary=$('bulk-summary');
  if(!sec||!tbody) return;

  const valid=_bulkRows.filter(r=>r.valid).length;
  const invalid=_bulkRows.length-valid;
  sec.style.display='block';
  summary.innerHTML=`<div style="display:flex;gap:10px;flex-wrap:wrap">
    <span class="badge bk">✓ ${valid} valid row${valid!==1?'s':''}</span>
    ${invalid?`<span class="badge" style="background:rgba(239,68,68,.1);color:#dc2626">✕ ${invalid} row${invalid!==1?'s':''} with errors</span>`:''}
    <span class="badge bb">${_bulkRows.length} total rows</span>
  </div>`;

  tbody.innerHTML=_bulkRows.map((r,i)=>`<tr style="background:${r.valid?'':'rgba(239,68,68,.03)'}">
    <td style="padding:8px 12px">${r.valid
      ?'<span style="color:var(--ok);font-size:13px">✓</span>'
      :`<span title="${r.errors.join(', ')}" style="color:var(--err);font-size:13px;cursor:help">✕</span>`}</td>
    <td style="padding:8px 12px;font-size:12px;font-weight:600">${r.name||'—'}</td>
    <td style="padding:8px 12px;font-size:12px;color:var(--steel);font-weight:600">${r.empCode||'—'}</td>
    <td style="padding:8px 12px;font-size:12px;color:var(--g400)">${r.dept||'—'}</td>
    <td style="padding:8px 12px;font-size:12px;color:var(--g400)">${r.designation||'—'}</td>
    <td style="padding:8px 12px;font-size:12px;color:var(--g400)">${r.email||'—'}</td>
    <td style="padding:8px 12px;font-size:12px;color:var(--g400)">${r.contact||'—'}</td>
    <td style="padding:8px 12px;font-size:12px"><span class="badge bg">${r.plant||'—'}</span></td>
    <td style="padding:8px 12px;font-size:12px;color:var(--g400)">${r.reportsToDisplay||r.reportsToName||'—'}${r.reportsToName&&r.reportsToDisplay&&r.reportsToDisplay!==r.reportsToName?`<div style="font-size:10px;color:var(--g400)">via code: ${r.reportsToName}</div>`:''}</td>
  </tr>${!r.valid?`<tr style="background:rgba(239,68,68,.04)"><td colspan="7" style="padding:4px 12px 8px;font-size:11px;color:var(--err)">${r.errors.join(' · ')}</td></tr>`:''}`).join('');

  importBtn.style.display=valid>0?'inline-flex':'none';
  importBtn.textContent=`⬆ Import ${valid} Valid Row${valid!==1?'s':''}`;
}

function showBulkErr(msg){
  const el=$('bulk-err'); if(!el) return;
  el.style.display='block'; el.textContent=msg;
}

async function doBulkImport(){
  const validRows=_bulkRows.filter(r=>r.valid);
  if(!validRows.length) return;
  const btn=$('bulk-import-btn');
  btn.disabled=true; btn.textContent='Importing…';

  // Build name→id AND empCode→id maps from existing employees for "reports to" resolution
  const nameMap={};   // lowercase name → id
  const codeMap={};   // lowercase empCode → id
  S.employees.forEach(e=>{
    nameMap[e.name.toLowerCase()]=e.id;
    if(e.empCode) codeMap[e.empCode.toLowerCase()]=e.id;
  });

  // Helper: resolve a "reports to" value (name or emp code) to an employee id
  const resolveParent=(val)=>{
    if(!val) return null;
    const v=val.trim().toLowerCase();
    return nameMap[v]||codeMap[v]||null;
  };

  let done=0, failed=0;

  for(const row of validRows){
    try{
      // Runtime duplicate guard — in case state changed between preview and import
      if(row.empCode){
        const alreadyInDB=S.employees.find(e=>e.empCode&&e.empCode.trim().toLowerCase()===row.empCode.toLowerCase());
        const alreadyInserted=codeMap[row.empCode.toLowerCase()];
        if(alreadyInDB||alreadyInserted){
          failed++;
          console.warn('Skipped duplicate emp code:',row.empCode);
          continue;
        }
      }
      const id=uid();
      const data={
        name:row.name, designation:row.designation,
        empCode:row.empCode||'', dept:row.dept||'',
        email:row.email||'', contact:row.contact||'',
        plantId:row.plantId||'', plant:row.plant||'',
        parentId:null, // resolve after
        photoURL:null,
        createdAt:new Date().toISOString()
      };
      await db.collection('employees').doc(id).set(data);
      // Register newly inserted row in both maps so later rows can report to it
      nameMap[row.name.toLowerCase()]=id;
      if(row.empCode) codeMap[row.empCode.toLowerCase()]=id;
      row._newId=id;
      done++;
    } catch(e){ failed++; console.error('Bulk insert error:',e); }
  }

  // Second pass: resolve parentId by name OR emp code
  for(const row of validRows){
    if(row.reportsToName&&row._newId){
      const parentId=resolveParent(row.reportsToName);
      if(parentId){
        try{ await db.collection('employees').doc(row._newId).update({parentId}); }
        catch(e){}
      }
    }
  }

  closeModal();
  _bulkRows=[];
  toast(`✓ Imported ${done} employee${done!==1?'s':''}${failed?', '+failed+' failed':''}`, done>0?'ok':'er');
}

// ── PDF Export ───────────────────────────────────────────────────

// Fetch any URL as a base64 data-URL (handles cross-origin Firebase Storage links)
async function fetchLogoBase64(url){
  try{
    const res=await fetch(url);
    const blob=await res.blob();
    return await new Promise((resolve,reject)=>{
      const r=new FileReader();
      r.onload=()=>resolve(r.result);
      r.onerror=()=>reject();
      r.readAsDataURL(blob);
    });
  } catch(e){ return null; }
}

// Detect image format from data-URL for jsPDF
function imgFormat(dataUrl){
  if(dataUrl.includes('image/png')) return 'PNG';
  if(dataUrl.includes('image/jpeg')||dataUrl.includes('image/jpg')) return 'JPEG';
  if(dataUrl.includes('image/webp')) return 'WEBP';
  return 'PNG';
}

// Shared PDF builder used by both admin and public exports
async function buildPDF(canvasEl, filename){
  const {jsPDF}=window.jspdf;

  // Capture chart at scale:1
  const prev=canvasEl.style.transform;
  canvasEl.style.transform='scale(1)';
  const c=await html2canvas(canvasEl,{scale:2,backgroundColor:'#F7F9FC',useCORS:true,logging:false});
  canvasEl.style.transform=prev;

  const W=c.width/2, H=c.height/2;
  const HEADER=S.companyLogo?64:40; // taller header when logo present

  const pdf=new jsPDF({orientation:W>H?'landscape':'portrait',unit:'px',format:[W,H+HEADER]});

  // Navy header bar
  pdf.setFillColor(15,31,61);
  pdf.rect(0,0,W,HEADER,'F');

  // Company logo (fetch as base64 to avoid CORS issues)
  let logoX=12; // text X offset — shifts right if logo is drawn
  if(S.companyLogo){
    const logoData=await fetchLogoBase64(S.companyLogo);
    if(logoData){
      const fmt=imgFormat(logoData);
      const logoH=HEADER-12; // 52px tall when header=64
      const logoW=logoH*(16/9); // rough wide aspect; jsPDF will scale proportionally
      try{
        pdf.addImage(logoData,fmt,8,6,logoW,logoH);
        logoX=8+logoW+12;
      } catch(e){ /* logo draw failed — fall through without it */ }
    }
  }

  // Title
  pdf.setFont(undefined,'bold'); pdf.setFontSize(14);
  pdf.setTextColor(245,166,35);
  pdf.text('Organisation Structure',logoX,HEADER*0.52);

  // Subtitle — company name
  pdf.setFont(undefined,'normal'); pdf.setFontSize(10);
  pdf.setTextColor(180,200,230);
  pdf.text('Poly Plastics India',logoX,HEADER*0.78);

  // Date — right-aligned
  pdf.setFont(undefined,'normal'); pdf.setFontSize(10);
  pdf.setTextColor(255,255,255);
  const dateStr=new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
  pdf.text(dateStr,W-10,HEADER*0.6,{align:'right'});

  // Thin gold divider line
  pdf.setDrawColor(245,166,35); pdf.setLineWidth(0.8);
  pdf.line(0,HEADER,W,HEADER);

  // Chart image
  pdf.addImage(c.toDataURL('image/png'),'PNG',0,HEADER,W,H);

  pdf.save(filename);
}

async function exportPDF(key){
  const canvas=$(`oc-${key}`);
  if(!canvas){ toast('No chart to export','er'); return; }
  const btn=$(`pdf-${key}`);
  btn.textContent='Exporting…'; btn.disabled=true;
  try{
    const filename=`Organisation_Structure_${new Date().toLocaleDateString('en-IN').replace(/\//g,'-')}.pdf`;
    await buildPDF(canvas,filename);
    toast('PDF exported successfully','ok');
  } catch(e){
    toast('Export failed: '+e.message,'er');
  }
  btn.textContent='⬇ Export PDF'; btn.disabled=false;
}
