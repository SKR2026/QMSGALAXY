<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KPI Dashboard — Polyplastics India</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #f5f5f3;
    --surface:   #ffffff;
    --border:    #e4e4e0;
    --text:      #1a1a18;
    --muted:     #888780;
    --accent:    #185FA5;
    --accent-dk: #134d8a;
    --danger:    #c0392b;
    --radius:    10px;
    --shadow:    0 2px 16px rgba(0,0,0,0.08);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    width: 100%;
    max-width: 380px;
    padding: 36px 32px 32px;
  }

  /* ── Header ── */
  .logo-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
  }
  .logo-icon {
    width: 34px; height: 34px;
    background: var(--accent);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .logo-icon svg { width: 18px; height: 18px; fill: #fff; }
  .brand-name {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.2px;
  }
  .brand-sub {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-bottom: 28px;
    padding-left: 44px;
  }

  /* ── Form ── */
  .field { margin-bottom: 16px; }
  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 6px;
    letter-spacing: 0.1px;
  }
  input[type="email"],
  input[type="password"] {
    width: 100%;
    height: 40px;
    padding: 0 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
    color: var(--text);
    background: var(--bg);
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(24,95,165,0.12);
    background: #fff;
  }

  /* password wrapper */
  .pw-wrap { position: relative; }
  .pw-wrap input { padding-right: 38px; }
  .pw-toggle {
    position: absolute; right: 10px; top: 50%;
    transform: translateY(-50%);
    background: none; border: none; cursor: pointer;
    color: var(--muted); padding: 4px;
    display: flex; align-items: center;
  }
  .pw-toggle:hover { color: var(--text); }
  .pw-toggle svg { width: 16px; height: 16px; }

  /* ── Error banner ── */
  .error-msg {
    display: none;
    background: #fdf2f2;
    border: 1px solid #f5c6c6;
    border-radius: 6px;
    color: var(--danger);
    font-size: 13px;
    padding: 10px 12px;
    margin-bottom: 16px;
    line-height: 1.4;
  }
  .error-msg.visible { display: block; }

  /* ── Forgot ── */
  .forgot-row {
    text-align: right;
    margin-top: -8px;
    margin-bottom: 20px;
  }
  .forgot-row a {
    font-size: 12px;
    color: var(--accent);
    text-decoration: none;
  }
  .forgot-row a:hover { text-decoration: underline; }

  /* ── Submit btn ── */
  .btn-primary {
    width: 100%;
    height: 42px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, opacity 0.15s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-primary:hover:not(:disabled) { background: var(--accent-dk); }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

  /* spinner */
  .spinner {
    display: none;
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  .spinner.visible { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Footer ── */
  .card-footer {
    margin-top: 24px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
    text-align: center;
    font-size: 11px;
    color: var(--muted);
  }

  /* ── Reset password modal ── */
  .overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.35);
    backdrop-filter: blur(2px);
    z-index: 100;
    align-items: center; justify-content: center;
    padding: 24px;
  }
  .overlay.visible { display: flex; }
  .modal {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    width: 100%; max-width: 340px;
    padding: 28px 28px 24px;
  }
  .modal h3 {
    font-size: 15px; font-weight: 700;
    color: var(--text); margin-bottom: 6px;
  }
  .modal p {
    font-size: 13px; color: var(--muted);
    margin-bottom: 18px; line-height: 1.5;
  }
  .modal-actions {
    display: flex; gap: 10px; margin-top: 16px;
  }
  .btn-secondary {
    flex: 1; height: 38px;
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: 6px;
    font-size: 13px; font-weight: 500;
    color: var(--text); cursor: pointer;
    transition: background 0.15s;
  }
  .btn-secondary:hover { background: var(--bg); }
  .reset-ok {
    display: none;
    font-size: 13px; color: #1a7a4a;
    background: #f0faf4; border: 1px solid #b6e8cc;
    border-radius: 6px; padding: 10px 12px;
    margin-top: 10px;
  }
  .reset-ok.visible { display: block; }
</style>
</head>
<body>

<div class="card">
  <div class="logo-row">
    <div class="logo-icon">
      <!-- bar-chart icon -->
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <rect x="3" y="12" width="4" height="9" rx="1"/>
        <rect x="10" y="7" width="4" height="14" rx="1"/>
        <rect x="17" y="3" width="4" height="18" rx="1"/>
      </svg>
    </div>
    <div class="brand-name">Polyplastics India</div>
  </div>
  <div class="brand-sub">KPI Dashboard</div>

  <div class="error-msg" id="errorMsg"></div>

  <div class="field">
    <label for="email">Email address</label>
    <input type="email" id="email" placeholder="you@polyplastics.in" autocomplete="username">
  </div>

  <div class="field">
    <label for="password">Password</label>
    <div class="pw-wrap">
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
      <button class="pw-toggle" id="pwToggle" type="button" aria-label="Show password">
        <!-- eye icon -->
        <svg id="eyeShow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        <svg id="eyeHide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
          <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
          <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
          <line x1="1" y1="1" x2="23" y2="23"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="forgot-row">
    <a href="#" id="forgotLink">Forgot password?</a>
  </div>

  <button class="btn-primary" id="loginBtn" type="button">
    <div class="spinner" id="spinner"></div>
    <span id="btnLabel">Sign in</span>
  </button>

  <div class="card-footer">
    Access restricted to authorised personnel only
  </div>
</div>

<!-- Reset password modal -->
<div class="overlay" id="resetOverlay">
  <div class="modal">
    <h3>Reset password</h3>
    <p>Enter your email address and we'll send you a reset link.</p>
    <div class="field">
      <label for="resetEmail">Email address</label>
      <input type="email" id="resetEmail" placeholder="you@polyplastics.in">
    </div>
    <div class="reset-ok" id="resetOk">Reset link sent — check your inbox.</div>
    <div class="modal-actions">
      <button class="btn-secondary" id="resetCancel">Cancel</button>
      <button class="btn-primary" id="resetSend" style="flex:1">Send link</button>
    </div>
  </div>
</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp }              from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword,
           sendPasswordResetEmail }     from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  // ── PASTE YOUR FIREBASE CONFIG HERE ──────────────────────────────────────
  const firebaseConfig = {
    apiKey:            "AIzaSyD1Ey-yqHEqLB0NFOAfPND0N0TmwA4a6pE",
    authDomain:        "skr-msa.firebaseapp.com",
    databaseURL:       "https://skr-msa-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId:         "skr-msa",
    storageBucket:     "skr-msa.firebasestorage.app",
    messagingSenderId: "957782831083",
    appId:             "1:957782831083:web:04afe89e5a994b3898b3ae"
  };
  // ─────────────────────────────────────────────────────────────────────────

  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db   = getFirestore(app);

  // ── DOM refs ──
  const emailEl    = document.getElementById('email');
  const passEl     = document.getElementById('password');
  const loginBtn   = document.getElementById('loginBtn');
  const btnLabel   = document.getElementById('btnLabel');
  const spinner    = document.getElementById('spinner');
  const errorMsg   = document.getElementById('errorMsg');
  const pwToggle   = document.getElementById('pwToggle');
  const eyeShow    = document.getElementById('eyeShow');
  const eyeHide    = document.getElementById('eyeHide');
  const forgotLink = document.getElementById('forgotLink');
  const overlay    = document.getElementById('resetOverlay');
  const resetEmail = document.getElementById('resetEmail');
  const resetSend  = document.getElementById('resetSend');
  const resetCancel= document.getElementById('resetCancel');
  const resetOk    = document.getElementById('resetOk');

  // ── Helpers ──
  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.classList.add('visible');
  }
  function clearError() {
    errorMsg.classList.remove('visible');
  }
  function setLoading(on) {
    loginBtn.disabled = on;
    spinner.classList.toggle('visible', on);
    btnLabel.textContent = on ? 'Signing in…' : 'Sign in';
  }

  // ── Password visibility toggle ──
  pwToggle.addEventListener('click', () => {
    const show = passEl.type === 'password';
    passEl.type = show ? 'text' : 'password';
    eyeShow.style.display = show ? 'none'  : '';
    eyeHide.style.display = show ? ''      : 'none';
  });

  // ── Allow Enter key to submit ──
  [emailEl, passEl].forEach(el =>
    el.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); })
  );
  loginBtn.addEventListener('click', doLogin);

  // ── Sign-in flow ──
  async function doLogin() {
    clearError();
    const email    = emailEl.value.trim();
    const password = passEl.value;

    if (!email)    { showError('Enter your email address.'); emailEl.focus(); return; }
    if (!password) { showError('Enter your password.');      passEl.focus();  return; }

    setLoading(true);
    try {
      const cred = await signInWithEmailAndPassword(auth, email, password);
      const uid  = cred.user.uid;

      // Fetch role from /users/{uid}
      const snap = await getDoc(doc(db, 'users', uid));

      if (!snap.exists()) {
        await auth.signOut();
        showError('Your account has no dashboard access. Contact your administrator.');
        setLoading(false);
        return;
      }

      const role = snap.data().role;

      // Allow: 'Super Admin', 'admin', 'super_admin'
      const allowed = ['Super Admin', 'admin', 'super_admin'];
      if (!allowed.includes(role)) {
        await auth.signOut();
        showError('Access denied — your role (' + role + ') is not permitted here.');
        setLoading(false);
        return;
      }

      // All good — go to the dashboard
      window.location.href = 'kpi-dashboard.html';

    } catch (err) {
      setLoading(false);
      showError(friendlyError(err.code));
    }
  }

  // ── Map Firebase error codes to plain English ──
  function friendlyError(code) {
    const map = {
      'auth/invalid-email':              'That doesn\'t look like a valid email address.',
      'auth/user-not-found':             'No account found with this email.',
      'auth/wrong-password':             'Incorrect password. Try again.',
      'auth/invalid-credential':         'Incorrect email or password.',
      'auth/too-many-requests':          'Too many failed attempts. Wait a moment and try again.',
      'auth/user-disabled':              'This account has been disabled. Contact your administrator.',
      'auth/network-request-failed':     'Network error — check your connection.',
    };
    return map[code] || 'Sign-in failed (' + code + '). Try again.';
  }

  // ── Forgot password ──
  forgotLink.addEventListener('click', e => {
    e.preventDefault();
    resetEmail.value = emailEl.value.trim();
    resetOk.classList.remove('visible');
    overlay.classList.add('visible');
    setTimeout(() => resetEmail.focus(), 50);
  });

  resetCancel.addEventListener('click', () => overlay.classList.remove('visible'));
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('visible'); });

  resetSend.addEventListener('click', async () => {
    const addr = resetEmail.value.trim();
    if (!addr) { resetEmail.focus(); return; }
    resetSend.disabled = true;
    resetSend.querySelector('span') && (resetSend.querySelector('span').textContent = 'Sending…');
    try {
      await sendPasswordResetEmail(auth, addr);
      resetOk.classList.add('visible');
      resetSend.textContent = 'Sent ✓';
    } catch (err) {
      resetOk.textContent = friendlyError(err.code);
      resetOk.style.background = '#fdf2f2';
      resetOk.style.borderColor = '#f5c6c6';
      resetOk.style.color = '#c0392b';
      resetOk.classList.add('visible');
      resetSend.disabled = false;
    }
  });
</script>
</body>
</html>
