        {logoUrl && <img src={logoUrl} alt="logo" className="qr-page-logo" onError={e=>e.target.style.display="none"}/>}
        <h2 className="qr-page-title">{companyName||"Customer Satisfaction Survey"}</h2>
        <p className="qr-page-sub">Scan the QR code or visit the link below to share your feedback</p>

        <div className="qr-page-code">
          <QRWidget url={url} size={240}/>
        </div>

        <div className="qr-page-link-box">
          <div className="qr-page-link-label">🔗 Survey Portal Link</div>
          <a href={url} target="_blank" rel="noreferrer" className="qr-page-link">{url}</a>
          <button className="btn-copy" onClick={()=>navigator.clipboard.writeText(url).then(()=>alert("Link copied!"))}>Copy Link</button>
        </div>

        {!surveyUrl && (
          <p className="muted" style={{marginTop:12,textAlign:"center",color:"#E65100"}}>
            ⚠ Set the survey URL in Admin → Settings to generate the correct QR code.
          </p>
        )}

        <button className="btn-print no-print" onClick={handlePrint}>🖨 Print / Save as PDF</button>
      </div>
    </div>
  );
}

/* ── Survey Form (single scroll) ── */
function SurveyForm({ plants, questions, logoUrl, companyName, surveyNote, onAckMail }) {
  const [page, setPage]             = useState(1);
  const [repName, setRepName]       = useState("");
  const [orgName, setOrgName]       = useState("");
  const [email, setEmail]           = useState("");
  const [contact, setContact]       = useState("");
  const [plant, setPlant]           = useState("");
  const [ratings, setRatings]       = useState({});
  const [qComments, setQComments]   = useState({});
  const [recommend, setRecommend]   = useState("");
  const [overallCmt, setOverallCmt] = useState("");
  const [error, setError]           = useState("");
  const [submitting, setSubmitting] = useState(false);
  const [done, setDone]             = useState(false);

  const setRating = (id,v) => setRatings(r=>({...r,[id]:v}));
  const setQCmt   = (id,v) => setQComments(c=>({...c,[id]:v}));

  const validatePage1 = () => {
    if (!repName.trim()) { setError("Representative name is required."); return false; }
    if (!orgName.trim()) { setError("Organization name is required."); return false; }
    if (!email.trim())   { setError("Email ID is required."); return false; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim())) { setError("Please enter a valid email address."); return false; }
    if (!plant)          { setError("Please select a plant."); return false; }
    setError(""); return true;
  };

  const validatePage2 = () => {
    const miss = questions.filter(q=>!ratings[q.id]);
    if (miss.length) { setError("Please rate all questions."); window.scrollTo({top:0,behavior:"smooth"}); return false; }
    if (!recommend)  { setError("Please select a recommendation option."); window.scrollTo({top:0,behavior:"smooth"}); return false; }
    setError(""); return true;
  };

  const goNext = () => {
    if (!validatePage1()) return;
    setPage(2);
    window.scrollTo({top:0,behavior:"smooth"});
  };

  const goBack = () => {
    setError("");
    setPage(1);
    window.scrollTo({top:0,behavior:"smooth"});
  };

  const submit = async () => {
    if (!validatePage2()) return;
    setSubmitting(true);
    try {
      const overall = questions.length
        ? +(questions.reduce((s,q)=>s+(ratings[q.id]||0),0)/questions.length).toFixed(2)
        : 0;
      const ref = firebase.database().ref(DB.responses).push();
      await ref.set({id:ref.key, repName, orgName, email, contact, plant,
                     ratings, qComments, recommend, overallComment:overallCmt, overall, ts:Date.now()});
      setDone(true);
      // Send acknowledgement mail
      if (onAckMail && email) onAckMail(email);
      window.scrollTo({top:0,behavior:"smooth"});
    } catch(e) { setError("Submission failed. Please try again."); }
    setSubmitting(false);
  };

  const reset = () => {
    setPage(1); setRepName(""); setOrgName(""); setEmail(""); setContact(""); setPlant("");
    setRatings({}); setQComments({}); setRecommend(""); setOverallCmt(""); setError(""); setDone(false);
    window.scrollTo({top:0,behavior:"smooth"});
  };

  /* Header – shown on both pages */
  const Header = () => (
    <>
      {logoUrl && <img src={logoUrl} className="s-logo" alt="logo" onError={e=>e.target.style.display="none"}/>}
      <h1 className="s-title">Customer Satisfaction Survey</h1>
      {companyName && <p className="s-company">{companyName}</p>}
      {surveyNote && page===1 && <div className="survey-note">{surveyNote}</div>}
      <div className="page-pills">
        <div className={"page-pill"+(page===1?" active":"")}>1. Your Details</div>
        <div className="page-pill-sep">›</div>
        <div className={"page-pill"+(page===2?" active":"")}>2. Feedback</div>
      </div>
      {error && <div className="error-box">{error}</div>}
    </>
  );

  if (done) return (
    <div className="survey-wrap">
      <div className="paper">
        {logoUrl && <img src={logoUrl} className="s-logo" alt="logo" onError={e=>e.target.style.display="none"}/>}
        <div className="done-icon">✓</div>
        <h2 className="done-h2">Thank you for your feedback!</h2>
        <p className="done-sub">Your response helps us improve our products and services.</p>
        <button className="btn-primary" style={{margin:"0 auto",display:"block"}} onClick={reset}>Submit Another Response</button>
      </div>
    </div>
  );

  /* ── Page 1: Basic Info ── */
  if (page===1) return (
    <div className="survey-wrap">
      <div className="paper">
        <Header/>
        <div className="form-section">
          <div className="section-title">Your Details</div>
          <div className="field-lbl">Representative Name *</div>
          <input className="inp" value={repName} onChange={e=>setRepName(e.target.value)} placeholder="Your full name"/>
          <div className="field-lbl">Organization Name *</div>
          <input className="inp" value={orgName} onChange={e=>setOrgName(e.target.value)} placeholder="Your company / organization"/>
          <div className="field-lbl">Email ID *</div>
          <input className="inp" type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="your@email.com"/>
          <div className="field-lbl">Contact No. (optional)</div>
          <input className="inp" type="tel" value={contact} onChange={e=>setContact(e.target.value)} placeholder="+91 00000 00000"/>
          <div className="field-lbl">Select Plant *</div>
          <div className="plant-pills">
            {plants.length===0 && <p className="muted">No plants configured. Contact the admin.</p>}
            {plants.map(p=>(
              <button key={p.id} type="button"
                className={"plant-pill"+(plant===p.name?" sel":"")}
                onClick={()=>setPlant(p.name)}>{p.name}</button>
            ))}
          </div>
        </div>
        <button className="btn-primary btn-submit" onClick={goNext}>Next → Feedback</button>
      </div>
    </div>
  );

  /* ── Page 2: Questions + Recommend + Submit (scrollable) ── */
  return (
    <div className="survey-wrap">
      <div className="paper">
        <Header/>

        {/* Questions */}
        {questions.length>0 && (
          <div className="form-section">
            <div className="section-title">Rate Your Experience</div>
            {questions.map(q=>(
              <StarRating key={q.id} label={q.text}
                value={ratings[q.id]||0} onChange={v=>setRating(q.id,v)}
                comment={qComments[q.id]} onCommentChange={v=>setQCmt(q.id,v)}/>
            ))}
          </div>
        )}

        {/* Recommend + comments */}
        <div className="form-section">
          <div className="section-title">Overall Feedback</div>
          <div className="field-lbl">Would you recommend us to others? *</div>
          <div className="rec-row">
            {[["yes","👍","Yes"],["maybe","🤔","Maybe"],["no","👎","No"]].map(([v,icon,lbl])=>(
              <button key={v} type="button"
                className={"rec-btn"+(recommend===v?" active":"")}
                onClick={()=>setRecommend(v)}>
                <span className="rec-icon">{icon}</span>{lbl}
              </button>
            ))}
          </div>
          <div className="field-lbl" style={{marginTop:22}}>Additional Comments (optional)</div>
          <textarea className="inp" rows={4} value={overallCmt}
            onChange={e=>setOverallCmt(e.target.value)}
            placeholder="Share your overall experience, suggestions or concerns…"/>
        </div>

        <div className="form-nav">
          <button className="btn-back" onClick={goBack}>← Back</button>
          <button className="btn-primary btn-submit-right" onClick={submit} disabled={submitting}>
            {submitting ? "Submitting…" : "Submit Feedback"}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ── Login ── */
function LoginForm() {
  const [email,setEmail]     = useState("");
  const [pw,setPw]           = useState("");
  const [err,setErr]         = useState("");
  const [loading,setLoading] = useState(false);
  const login = async () => {
    setLoading(true); setErr("");
    try { await firebase.auth().signInWithEmailAndPassword(email,pw); }
    catch { setErr("Invalid credentials."); }
    setLoading(false);
  };
  return (
    <div className="login-wrap">
      <div className="login-card">
        <h2>Admin Login</h2>
        {err && <div className="error-box">{err}</div>}
        <input className="inp" type="email" placeholder="Email" value={email} onChange={e=>setEmail(e.target.value)}/>
        <input className="inp" type="password" placeholder="Password" value={pw}
          onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==="Enter"&&login()}/>
        <button className="btn-primary" onClick={login} disabled={loading}>{loading?"…":"Login"}</button>
      </div>
    </div>
  );
}

/* ── Settings ── */
function Settings({ plants, questions, logoUrl, companyName, surveyUrl, surveyNote, onLogoUpload, uploading, notifEmail, ackText, infoText, onSaveNotifEmail, onSaveAckText, onSaveInfoText, msTenantId, msClientId, msSenderEmail, msSignedIn, onMsSignIn, onSaveMsTenantId, onSaveMsClientId, onSaveMsSenderEmail }) {
  const [newPlant,  setNewPlant]  = useState("");
  const [editPlant, setEditPlant] = useState(null);
  const [draftEmail,  setDraftEmail]  = useState(notifEmail||"");
  const [draftAck,    setDraftAck]    = useState(ackText||"");
  const [emailSaved,  setEmailSaved]  = useState(false);
  const [ackSaved,    setAckSaved]    = useState(false);
  const [draftTenant, setDraftTenant] = useState(msTenantId||"");
  const [draftClient, setDraftClient] = useState(msClientId||"");
  const [draftSender, setDraftSender] = useState(msSenderEmail||"");
  const [draftInfo,   setDraftInfo]   = useState(infoText||"");
  const [infoSaved,   setInfoSaved]   = useState(false);
  const [msSaved,     setMsSaved]     = useState(false);
  useEffect(()=>setDraftEmail(notifEmail||""),[notifEmail]);
  useEffect(()=>setDraftAck(ackText||""),[ackText]);
  useEffect(()=>setDraftTenant(msTenantId||""),[msTenantId]);
  useEffect(()=>setDraftInfo(infoText||""),[infoText]);
  useEffect(()=>setDraftClient(msClientId||""),[msClientId]);
  useEffect(()=>setDraftSender(msSenderEmail||""),[msSenderEmail]);

  const saveMsConfig = async () => {
    await onSaveMsTenantId(draftTenant);
    await onSaveMsClientId(draftClient);
    await onSaveMsSenderEmail(draftSender);
    setMsSaved(true);
    setTimeout(()=>setMsSaved(false), 2500);
  };
  const [ePlantTxt, setEPlantTxt] = useState("");
  const [newQ,      setNewQ]      = useState("");
  const [editQ,     setEditQ]     = useState(null);
  const [eQTxt,     setEQTxt]     = useState("");
  const [company,   setCompany]   = useState(companyName||"");
  const [sUrl,      setSUrl]      = useState(surveyUrl||"");
  const [note,      setNote]      = useState(surveyNote||"");
  const fileRef = useRef();

  useEffect(()=>setCompany(companyName||""),[companyName]);
  useEffect(()=>setSUrl(surveyUrl||""),[surveyUrl]);
  useEffect(()=>setNote(surveyNote||""),[surveyNote]);

  const addPlant    = async () => { const t=newPlant.trim(); if(!t)return; const k="p_"+Date.now(); await firebase.database().ref(DB.plants+"/"+k).set({id:k,name:t}); setNewPlant(""); };
  const delPlant    = async id => firebase.database().ref(DB.plants+"/"+id).remove();
  const saveEPlant  = async id => { await firebase.database().ref(DB.plants+"/"+id+"/name").set(ePlantTxt.trim()); setEditPlant(null); };
  const addQ        = async () => { const t=newQ.trim(); if(!t)return; const k="q_"+Date.now(); await firebase.database().ref(DB.questions+"/"+k).set({id:k,text:t,order:Date.now()}); setNewQ(""); };
  const delQ        = async id => firebase.database().ref(DB.questions+"/"+id).remove();
  const saveEQ      = async id => { await firebase.database().ref(DB.questions+"/"+id+"/text").set(eQTxt.trim()); setEditQ(null); };
  const saveCompany = ()        => firebase.database().ref(DB.companyName).set(company.trim());
  const saveUrl     = ()        => firebase.database().ref(DB.surveyUrl).set(sUrl.trim());
  const saveNote    = ()        => firebase.database().ref(DB.surveyNote).set(note);

  return (
    <div className="settings-wrap">
      <h2>Settings</h2>

      <div className="s-card">
        <div className="settings-card-title">Company Name</div>
        <div className="inp-row">
          <input className="inp" value={company} onChange={e=>setCompany(e.target.value)} placeholder="Your company name"/>
          <button className="btn-sm" onClick={saveCompany}>Save</button>
        </div>
      </div>

      <div className="s-card">
        <div className="settings-card-title">Survey Introduction Note</div>
        <p className="muted" style={{marginBottom:10}}>This note appears below the survey title on the feedback form.</p>
        <textarea className="inp" rows={7} value={note} onChange={e=>setNote(e.target.value)}
          placeholder="e.g. Dear Sir/Madam, Please take a moment to help us improve our performance…"/>
        <button className="btn-sm" style={{marginTop:10}} onClick={saveNote}>Save Note</button>
      </div>

      <div className="s-card">
        <div className="settings-card-title">Company Logo</div>
        {logoUrl && <img src={logoUrl} alt="logo" className="logo-prev" onError={e=>e.target.style.display="none"}/>}
        <input ref={fileRef} type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" style={{display:"none"}}
          onChange={e=>{ if(e.target.files[0]) onLogoUpload(e.target.files[0]); }}/>
        <div style={{display:"flex",gap:8,marginTop:8,alignItems:"center"}}>
          <button className="btn-sm" onClick={()=>fileRef.current.click()} disabled={uploading}>
            {uploading ? "⏳ Uploading…" : "📁 Upload Logo"}
          </button>
          {logoUrl && <button className="btn-sm danger" onClick={()=>firebase.database().ref(DB.logo).set("")}>Remove</button>}
        </div>
        <p className="muted" style={{marginTop:8}}>PNG, JPG or SVG. Max 500KB recommended.</p>
      </div>

      <div className="s-card">
        <div className="settings-card-title">Survey Link &amp; QR Code</div>
        <p className="muted" style={{marginBottom:10}}>Paste your hosted survey URL — the QR code will be generated automatically.</p>
        <div className="inp-row">
          <input className="inp" value={sUrl} onChange={e=>setSUrl(e.target.value)} placeholder="https://www.qmsgalaxy.com/pp-cs/"/>
          <button className="btn-sm" onClick={saveUrl}>Save</button>
        </div>
        {sUrl && (
          <div className="qr-center">
            <QRWidget url={sUrl} size={200}/>
            <p className="qr-url">{sUrl}</p>
          </div>
        )}
      </div>

      <div className="s-card">
        <div className="settings-card-title">Plants</div>
        <div className="inp-row" style={{marginBottom:12}}>
          <input className="inp" value={newPlant} onChange={e=>setNewPlant(e.target.value)}
            placeholder="Plant name" onKeyDown={e=>e.key==="Enter"&&addPlant()}/>
          <button className="btn-sm" onClick={addPlant}>Add</button>
        </div>
        {plants.length===0 && <p className="muted">No plants added yet.</p>}
        {plants.map(p=>(
          <div key={p.id} className="list-item">
            {editPlant===p.id
              ? <><input className="inp" style={{flex:1}} value={ePlantTxt} onChange={e=>setEPlantTxt(e.target.value)}/><button className="btn-sm" onClick={()=>saveEPlant(p.id)}>Save</button><button className="btn-sm" onClick={()=>setEditPlant(null)}>Cancel</button></>
              : <><span className="list-text">{p.name}</span><button className="btn-sm" onClick={()=>{setEditPlant(p.id);setEPlantTxt(p.name);}}>Edit</button><button className="btn-sm danger" onClick={()=>delPlant(p.id)}>Delete</button></>
            }
          </div>
        ))}
      </div>

      <div className="s-card">
        <div className="settings-card-title">📧 Microsoft 365 Mail Configuration</div>
        <div style={{background:"#EBF2FA",borderRadius:10,padding:"12px 16px",marginBottom:16,fontSize:13,color:"#1B3A6B",lineHeight:1.7}}>
          <strong>How it works:</strong> Uses Microsoft MSAL (same as Task Planner). Sign in once with your Microsoft 365 account — tokens are cached and mail sends silently on every subsequent survey submission.<br/><br/>
          <strong>Azure App Registration requirements:</strong><br/>
          • API permissions → Microsoft Graph → <strong>Delegated</strong> → <code>Mail.Send</code> ✓ (already configured)<br/>
          • Authentication → Add platform → <strong>Single Page Application</strong> → Redirect URI: <code>{window.location.href.split("?")[0].split("#")[0]}</code>
        </div>

        <div style={{display:"grid",gap:10,marginBottom:16}}>
          <div>
            <div style={{fontSize:12,fontWeight:600,color:"#555",marginBottom:4}}>Tenant ID</div>
            <input className="inp" value={draftTenant} onChange={e=>setDraftTenant(e.target.value)} placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"/>
          </div>
          <div>
            <div style={{fontSize:12,fontWeight:600,color:"#555",marginBottom:4}}>Client (Application) ID</div>
            <input className="inp" value={draftClient} onChange={e=>setDraftClient(e.target.value)} placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"/>
          </div>
          <div>
            <div style={{fontSize:12,fontWeight:600,color:"#555",marginBottom:4}}>Sender Display Name / Email (optional label)</div>
            <input className="inp" type="email" value={draftSender} onChange={e=>setDraftSender(e.target.value)} placeholder="noreply@yourcompany.com"/>
          </div>
        </div>

        <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap",marginBottom:16}}>
          <button className="btn-sm" style={{background:"#1B3A6B",color:"#fff",borderColor:"#1B3A6B"}} onClick={saveMsConfig}>
            {msSaved ? "✓ Saved" : "💾 Save Configuration"}
          </button>
          <button className="btn-sm" style={{background: msSignedIn ? "#2E7D32" : "#E65100", color:"#fff", borderColor: msSignedIn ? "#2E7D32" : "#E65100"}}
            onClick={onMsSignIn}>
            {msSignedIn ? "✅ Signed In to Microsoft 365" : "🔑 Sign In with Microsoft 365"}
          </button>
        </div>
        {!msSignedIn && (
          <p className="muted" style={{fontSize:12,color:"#E65100",marginBottom:12}}>
            ⚠ Sign in once before submitting survey — after that mail sends silently in background.
          </p>
        )}

        <div style={{fontSize:13,fontWeight:600,color:"#333",marginTop:20,marginBottom:6}}>📝 Main Message (shown in highlighted block)</div>
        <p className="muted" style={{marginBottom:8}}>This is the primary acknowledgement text shown prominently in the email.</p>
        <textarea className="inp" rows={3} value={draftAck} onChange={e=>setDraftAck(e.target.value)} placeholder="Thank you for your valuable feedback!"/>
        <button className="btn-sm" style={{marginTop:6}} onClick={async()=>{await onSaveAckText(draftAck);setAckSaved(true);setTimeout(()=>setAckSaved(false),2000);}}>
          {ackSaved ? "✓ Saved" : "Save"}
        </button>

        <div style={{fontSize:13,fontWeight:600,color:"#333",marginTop:18,marginBottom:6}}>📋 Info Box Text (lines below "Dear [Name]")</div>
        <p className="muted" style={{marginBottom:8}}>Each line appears as a separate paragraph. Edit or remove any line. "Dear [name]," is added automatically.</p>
        <textarea className="inp" rows={4} value={draftInfo} onChange={e=>setDraftInfo(e.target.value)}
          placeholder={"Your response has been successfully recorded.\nYour feedback helps us improve.\nIf you have questions, feel free to contact us."}/>
        <button className="btn-sm" style={{marginTop:6}} onClick={async()=>{await onSaveInfoText(draftInfo);setInfoSaved(true);setTimeout(()=>setInfoSaved(false),2000);}}>
          {infoSaved ? "✓ Saved" : "Save"}
        </button>
      </div>

      <div className="s-card">
        <div className="settings-card-title">Survey Questions</div>
        <div className="inp-row" style={{marginBottom:12}}>
          <input className="inp" value={newQ} onChange={e=>setNewQ(e.target.value)}
            placeholder="Enter question text" onKeyDown={e=>e.key==="Enter"&&addQ()}/>
          <button className="btn-sm" onClick={addQ}>Add</button>
        </div>
        {questions.length===0 && <p className="muted">No questions added yet.</p>}
        {questions.map((q,i)=>(
          <div key={q.id} className="list-item">
            {editQ===q.id
              ? <><input className="inp" style={{flex:1}} value={eQTxt} onChange={e=>setEQTxt(e.target.value)}/><button className="btn-sm" onClick={()=>saveEQ(q.id)}>Save</button><button className="btn-sm" onClick={()=>setEditQ(null)}>Cancel</button></>
              : <><span className="list-num">{i+1}.</span><span className="list-text">{q.text}</span><button className="btn-sm" onClick={()=>{setEditQ(q.id);setEQTxt(q.text);}}>Edit</button><button className="btn-sm danger" onClick={()=>delQ(q.id)}>Delete</button></>
            }
          </div>
        ))}
      </div>
    </div>
  );
}

/* ── Mail Log ── */
function MailLog({ logs }) {
  const clearLog = async () => {
    if (!window.confirm("Clear all mail logs?")) return;
    await firebase.database().ref(DB.mailLog).remove();
  };
  return (
    <div className="settings-wrap">
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
        <h2 style={{margin:0}}>📧 Mail Log</h2>
        {logs.length > 0 && <button className="btn-sm danger" onClick={clearLog}>Clear All</button>}
      </div>
      {logs.length === 0 ? (
        <div className="s-card"><p className="muted">No mails logged yet. Acknowledgement mails will appear here after survey submissions.</p></div>
      ) : (
        <div className="s-card" style={{padding:0,overflow:"hidden"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
            <thead>
              <tr style={{background:"#1B3A6B",color:"#fff"}}>
                <th style={{padding:"10px 14px",textAlign:"left",fontWeight:600}}>Date &amp; Time</th>
                <th style={{padding:"10px 14px",textAlign:"left",fontWeight:600}}>To</th>
                <th style={{padding:"10px 14px",textAlign:"left",fontWeight:600}}>Subject</th>
                <th style={{padding:"10px 14px",textAlign:"left",fontWeight:600}}>Status</th>
              </tr>
            </thead>
            <tbody>
              {logs.map((l,i) => (
                <tr key={l.id||i} style={{background:i%2===0?"#fff":"#F5F3EE",borderBottom:"1px solid #eee"}}>
                  <td style={{padding:"8px 14px",color:"#555",whiteSpace:"nowrap"}}>{new Date(l.ts).toLocaleString()}</td>
                  <td style={{padding:"8px 14px",color:"#1B3A6B",fontWeight:500}}>{l.to}</td>
                  <td style={{padding:"8px 14px",color:"#333"}}>{l.subject}</td>
                  <td style={{padding:"8px 14px"}}>
                    <span style={{
                      background: l.status==="sent" ? "#E8F5E9" : l.status==="failed" ? "#FFEBEE" : "#FFF8E1",
                      color:      l.status==="sent" ? "#2E7D32" : l.status==="failed" ? "#C62828" : "#E65100",
                      borderRadius:20, padding:"2px 10px", fontSize:12, fontWeight:600
                    }}>
                      {l.status||"pending"}
                    </span>
                    {l.error && <div style={{fontSize:11,color:"#C62828",marginTop:3}}>{l.error}</div>}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

/* ── PDF Export Helpers ── */
function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return [r,g,b];
}

// Rasterizes the logo (whatever its source format — PNG/JPEG/WEBP/SVG) onto a
// canvas so it can always be embedded as a clean PNG. This avoids jsPDF
// mis-decoding non-PNG sources (which was causing the "disturbed"/glitched
// logo in exports) and gives us the true natural width/height so the logo's
// aspect ratio can be preserved instead of being stretched into a fixed box.
function loadLogoForPdf(logoUrl) {
  return new Promise(resolve => {
    if (!logoUrl) { resolve(null); return; }
    try {
      const img = new Image();
      img.onload = () => {
        try {
          const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
          if (!w || !h) { resolve(null); return; }
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          resolve({ dataUrl: canvas.toDataURL("image/png"), w, h });
        } catch(e) { resolve(null); }
      };
      img.onerror = () => resolve(null);
      img.src = logoUrl;
    } catch(e) { resolve(null); }
  });
}

// Fits (contains) a natW x natH image inside a maxW x maxH box, preserving
// aspect ratio, and returns the offset needed to center it in that box.
function fitContain(natW, natH, maxW, maxH) {
  const scale = Math.min(maxW/natW, maxH/natH);
  const w = natW*scale, h = natH*scale;
  return { w, h, offX:(maxW-w)/2, offY:(maxH-h)/2 };
}

// Draws the logo (already rasterized to PNG by loadLogoForPdf) into a white
// rounded box at (boxX,boxY), sized to the logo's own aspect ratio (capped to
// maxContentW x maxContentH so an unusually wide/tall logo can't dominate the
// header) plus exactly `pad` mm of whitespace on every side — no letterboxing
// gaps like a fixed-size contain-fit box would introduce. Returns the box's
// actual width/height so the caller can position content after it.
function drawLogoBoxPDF(doc, logo, boxX, headerH, pad, maxContentW, maxContentH) {
  if (!logo) return { boxW:0, boxH:0 };
  const fit = fitContain(logo.w, logo.h, maxContentW, maxContentH);
  const boxW = fit.w + pad*2, boxH = fit.h + pad*2;
  const boxY = (headerH - boxH)/2;
  doc.setFillColor(255,255,255);
  doc.roundedRect(boxX, boxY, boxW, boxH, 2, 2, "F");
  try { doc.addImage(logo.dataUrl, "PNG", boxX+pad, boxY+pad, fit.w, fit.h); } catch(e) {}
  return { boxW, boxH };
}

// Draws a 5-point star polygon (filled) centered at (cx,cy).
function starPoints(cx, cy, outerR, innerR) {
  const pts = [];
  for (let i=0;i<10;i++) {
    const ang = -Math.PI/2 + i*Math.PI/5;
    const rad = i%2===0 ? outerR : innerR;
    pts.push([cx+rad*Math.cos(ang), cy+rad*Math.sin(ang)]);
  }
  return pts;
}
function drawStarPDF(doc, cx, cy, outerR, rgb) {
  const pts = starPoints(cx, cy, outerR, outerR*0.4);
  const lineArr = [];
  for (let i=1;i<pts.length;i++) lineArr.push([pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]]);
  lineArr.push([pts[0][0]-pts[pts.length-1][0], pts[0][1]-pts[pts.length-1][1]]);
  doc.setFillColor(...rgb);
  doc.setDrawColor(...rgb);
  doc.lines(lineArr, pts[0][0], pts[0][1], [1,1], "F", true);
}

// Vector-draws the speedometer/gauge dial into the PDF (mirrors the on-screen
// SVG <Gauge> component) — previously the gauge only existed as an SVG in the
// React UI and was never drawn into the exported PDF at all.
function drawGaugePDF(doc, cx, cy, r, value) {
  const bands = [
    [-180,-144,"#C62828"], [-141,-108,"#E65100"],
    [-105,-76, "#F9A825"], [-73,-40,  "#7CB342"], [-37,0,"#2E7D32"],
  ];
  doc.setLineCap("round");
  doc.setLineWidth(r*0.22);
  bands.forEach(([sa,ea,col]) => {
    const [cr,cg,cb] = hexToRgb(col);
    doc.setDrawColor(cr,cg,cb);
    const steps=24;
    let px=null, py=null;
    for (let i=0;i<=steps;i++) {
      const a = sa + (ea-sa)*(i/steps), rad = a*Math.PI/180;
      const x = cx + r*Math.cos(rad), y = cy + r*Math.sin(rad);
      if (px!==null) doc.line(px,py,x,y);
      px=x; py=y;
    }
  });
  doc.setLineCap("butt");

  doc.setFontSize(7); doc.setFont("helvetica","normal"); doc.setTextColor(170,170,170);
  doc.text("1", cx-r*0.87, cy+5, {align:"center"});
  doc.text("3", cx, cy-r-2, {align:"center"});
  doc.text("5", cx+r*0.87, cy+5, {align:"center"});

  if (value>0) {
    const pct = clamp((value-1)/4,0,1);
    const ang = -180 + pct*180, rad = ang*Math.PI/180, perp = rad+Math.PI/2;
    const nLen=r*0.8, bi=r*0.06, bhw=r*0.05, tl=r*0.13, thw=r*0.037;
    const nx=cx+nLen*Math.cos(rad), ny=cy+nLen*Math.sin(rad);
    const bx1=cx+bi*Math.cos(rad)+bhw*Math.cos(perp), by1=cy+bi*Math.sin(rad)+bhw*Math.sin(perp);
    const bx2=cx+bi*Math.cos(rad)-bhw*Math.cos(perp), by2=cy+bi*Math.sin(rad)-bhw*Math.sin(perp);
    const tx1=cx-tl*Math.cos(rad)+thw*Math.cos(perp), ty1=cy-tl*Math.sin(rad)+thw*Math.sin(perp);
    const tx2=cx-tl*Math.cos(rad)-thw*Math.cos(perp), ty2=cy-tl*Math.sin(rad)-thw*Math.sin(perp);
    doc.setFillColor(27,58,107); doc.setDrawColor(27,58,107);
    doc.triangle(nx,ny,bx1,by1,tx1,ty1,"F");
    doc.triangle(nx,ny,tx1,ty1,tx2,ty2,"F");
    doc.triangle(nx,ny,tx2,ty2,bx2,by2,"F");
    doc.triangle(bx1,by1,tx1,ty1,tx2,ty2,"F");
    doc.triangle(bx1,by1,tx2,ty2,bx2,by2,"F");
  }
  doc.setFillColor(255,255,255); doc.setDrawColor(200,200,200); doc.setLineWidth(0.5);
  doc.circle(cx,cy,r*0.13,"FD");
  doc.setFillColor(46,125,50); doc.setDrawColor(46,125,50);
  doc.circle(cx,cy,r*0.055,"F");

  doc.setFontSize(11); doc.setFont("helvetica","bold"); doc.setTextColor(34,34,34);
  doc.text(value>0?fmt1(value):"—", cx, cy+r*0.42, {align:"center"});
  doc.setFontSize(6); doc.setFont("helvetica","normal"); doc.setTextColor(170,170,170);
  doc.text("OUT OF 5.0", cx, cy+r*0.42+4.2, {align:"center"});
}

async function exportDashboardPDF(filtered, questions, plants, plantFilter, overallAvg, recPct, recYes, qAvgFn, companyName, logoUrl, surveyUrl) {
  if (!filtered.length) { alert("No responses to export."); return; }
  const logo = await loadLogoForPdf(logoUrl);
  let qrDataUrl = null;
  if (surveyUrl && window.QRCode && window.QRCode.toDataURL) {
    try { qrDataUrl = await window.QRCode.toDataURL(surveyUrl, { width:240, margin:1, color:{dark:"#1B3A6B",light:"#ffffff"} }); }
    catch(e) { qrDataUrl = null; }
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation:"portrait", unit:"mm", format:"a4" });
  const W=210, margin=14, cW=W-margin*2;
  let y=0;

  // ── Header ──
  doc.setFillColor(27,58,107);
  doc.rect(0,0,W,40,"F");
  // Logo box: exactly 4mm of whitespace around the logo on every side, sized
  // to the logo's own aspect ratio (no stretching, no letterboxing gaps).
  const logoPad=4;
  const logoBox = logo ? drawLogoBoxPDF(doc, logo, margin, 40, logoPad, 44, 22) : {boxW:0};
  const textX = logo ? margin+logoBox.boxW+6 : W/2;
  const textAlign = logo ? "left" : "center";
  doc.setTextColor(255,255,255);
  doc.setFontSize(15); doc.setFont("helvetica","bold");
  doc.text(companyName||"Customer Satisfaction Survey", textX, 18, {align:textAlign});
  doc.setFontSize(8.5); doc.setFont("helvetica","normal");
  const filterLabel = plantFilter==="__all__" ? "All Plants" : plantFilter;
  doc.text(`Customer Satisfaction Report  |  ${filterLabel}  |  ${new Date().toLocaleDateString()}`, textX, 27, {align:textAlign});
  doc.text(`Total: ${filtered.length} responses`, textX, 34, {align:textAlign});
  y=48;

  // ── KPI cards + QR code (mirrors the live dashboard's kpi-qr-row) ──
  const qrColW = qrDataUrl ? 32 : 0;
  const qrGap = qrDataUrl ? 6 : 0;
  const kpiAreaW = cW - qrColW - qrGap;
  const kW=(kpiAreaW-9)/4, kH=24;
  const kpis=[
    {label:"Total Responses", value:String(filtered.length)},
    {label:"Avg Satisfaction", value:overallAvg>0?fmt1(overallAvg)+" / 5":"—", accent:overallAvg>0?hexToRgb(scoreColor(overallAvg)):null},
    {label:"Would Recommend",  value:filtered.length?recPct+"%":"—", accent:recPct>=70?[46,125,50]:recPct>=50?[230,81,0]:[198,40,40]},
    {label:"Plants Covered",   value:String(new Set(filtered.map(r=>r.plant).filter(Boolean)).size)},
  ];
  kpis.forEach((k,i)=>{
    const kx=margin+i*(kW+3), ky=y;
    doc.setFillColor(255,255,255); doc.setDrawColor(208,203,189); doc.setLineWidth(0.3);
    doc.roundedRect(kx,ky,kW,kH,2,2,"FD");
    doc.setFontSize(6.5); doc.setFont("helvetica","normal"); doc.setTextColor(150,150,140);
    doc.text(k.label.toUpperCase(), kx+3, ky+7);
    const vSize = k.value.length>10?9:13;
    doc.setFontSize(vSize); doc.setFont("helvetica","bold");
    if(k.accent) doc.setTextColor(...k.accent); else doc.setTextColor(30,34,41);
    doc.text(k.value, kx+3, ky+18);
  });
  if (qrDataUrl) {
    const qx = margin+kpiAreaW+qrGap;
    try { doc.addImage(qrDataUrl, "PNG", qx, y, qrColW, qrColW); } catch(e) {}
    doc.setFontSize(6); doc.setFont("helvetica","normal"); doc.setTextColor(27,58,107);
    const urlLines = doc.splitTextToSize(surveyUrl, qrColW);
    urlLines.slice(0,2).forEach((l,i)=> doc.text(l, qx+qrColW/2, y+qrColW+4+i*3.4, {align:"center"}));
  }
  y += kH + 10;

  // ── Gauge + Question Averages side-by-side (mirrors the live gauge-row) ──
  const gaugePanelW = 60, panelGap = 6;
  const catPanelW = cW - gaugePanelW - panelGap;
  const panelH = Math.max(52, 16 + questions.length*9 + 6);
  if (y+panelH > 270) { doc.addPage(); y=20; }

  // Gauge panel
  doc.setFillColor(255,255,255); doc.setDrawColor(208,203,189); doc.setLineWidth(0.3);
  doc.roundedRect(margin, y, gaugePanelW, panelH, 3,3,"FD");
  doc.setFontSize(8); doc.setFont("helvetica","bold"); doc.setTextColor(27,58,107);
  doc.text("Overall Satisfaction", margin+4, y+7);
  drawGaugePDF(doc, margin+gaugePanelW/2, y+panelH/2+6, 15, overallAvg);

  // Question averages panel
  const cpX = margin+gaugePanelW+panelGap;
  // Explicitly reset fill/border color here — drawGaugePDF() leaves the PDF's
  // internal fill/draw color set to the gauge's center-dot green, and without
  // resetting it this box would inherit that color instead of being white.
  doc.setFillColor(255,255,255); doc.setDrawColor(208,203,189); doc.setLineWidth(0.3);
  doc.roundedRect(cpX, y, catPanelW, panelH, 3,3,"FD");
  doc.setFontSize(8); doc.setFont("helvetica","bold"); doc.setTextColor(27,58,107);
  doc.text("Question Averages", cpX+4, y+7);
  if (questions.length===0) {
    doc.setFontSize(7.5); doc.setFont("helvetica","normal"); doc.setTextColor(170,170,170);
    doc.text("No questions configured.", cpX+4, y+16);
  }
  const qLabelW=42, qScoreW=12, barMaxW=catPanelW-4-qLabelW-2-qScoreW-3-4;
  questions.forEach((q,i)=>{
    const avg=qAvgFn(q.id);
    const qy=y+15+i*9;
    const qx=cpX+4;
    doc.setFontSize(6.2); doc.setFont("helvetica","normal"); doc.setTextColor(60,60,60);
    const label=q.text.length>34?q.text.slice(0,32)+"…":q.text;
    doc.text(label, qx, qy);
    const barX=qx+qLabelW;
    doc.setFillColor(220,215,200);
    doc.roundedRect(barX, qy+1.3, barMaxW, 3.2, 0.5,0.5,"F");
    if(avg>0){
      const [br,bg,bb]=hexToRgb(scoreColor(avg));
      doc.setFillColor(br,bg,bb);
      doc.roundedRect(barX, qy+1.3, barMaxW*(avg/5), 3.2, 0.5,0.5,"F");
    }
    doc.setFontSize(7); doc.setFont("helvetica","bold");
    const [cr,cg,cb]=hexToRgb(scoreColor(avg>0?avg:3));
    doc.setTextColor(cr,cg,cb);
    doc.text(avg>0?fmt1(avg):"—", barX+barMaxW+3, qy+3.3);
  });
  y += panelH + 8;

  // ── Response table ──
  if(y+20 > 270){ doc.addPage(); y=20; }
  doc.setFontSize(9); doc.setFont("helvetica","bold"); doc.setTextColor(27,58,107);
  doc.text("Individual Responses", margin, y+5);
  y+=10;

  // Table header
  const cols=[22,34,40,26,18,20,22], hdrs=["Date","Representative","Organization","Plant","Score","Rec.","Email"];
  doc.setFillColor(27,58,107);
  doc.rect(margin, y, cW, 8, "F");
  let rx=margin;
  doc.setFontSize(6.5); doc.setFont("helvetica","bold"); doc.setTextColor(255,255,255);
  hdrs.forEach((h,i)=>{ doc.text(h.toUpperCase(), rx+2, y+5.5); rx+=cols[i]; });
  y+=9;

  filtered.forEach((r,ri)=>{
    if(y+8 > 282){ 
      doc.addPage(); 
      y=20;
      // Repeat table header on new page
      doc.setFillColor(27,58,107);
      doc.rect(margin, y, cW, 8, "F");
      let rx0=margin;
      doc.setFontSize(6.5); doc.setFont("helvetica","bold"); doc.setTextColor(255,255,255);
      hdrs.forEach((h,i)=>{ doc.text(h.toUpperCase(), rx0+2, y+5.5); rx0+=cols[i]; });
      y+=9;
    }
    if(ri%2===0){ doc.setFillColor(248,247,244); doc.rect(margin,y,cW,8,"F"); }
    else { doc.setFillColor(255,255,255); doc.rect(margin,y,cW,8,"F"); }
    doc.setFontSize(6.5); doc.setFont("helvetica","normal");
    let rx2=margin;
    const rec=r.recommend==="yes"?"Yes":r.recommend==="no"?"No":"Maybe";
    const row=[
      r.ts?new Date(r.ts).toLocaleDateString():"—",
      (r.repName||"—").slice(0,20),
      (r.orgName||"—").slice(0,24),
      (r.plant||"—").slice(0,14),
      r.overall?fmt1(r.overall):"—",
      rec,
      (r.email||"—").slice(0,20),
    ];
    row.forEach((v,i)=>{
      if(i===4&&r.overall){ const [cr,cg,cb]=hexToRgb(scoreColor(r.overall)); doc.setTextColor(cr,cg,cb); }
      else doc.setTextColor(30,34,41);
      doc.text(v, rx2+2, y+5.5); rx2+=cols[i];
    });
    // thin row border
    doc.setDrawColor(230,228,220); doc.setLineWidth(0.1);
    doc.line(margin, y+8, margin+cW, y+8);
    y+=8;
  });

  // Footer on each page
  const pageCount = doc.internal.getNumberOfPages();
  for(let p=1;p<=pageCount;p++){
    doc.setPage(p);
    doc.setFontSize(7); doc.setFont("helvetica","normal"); doc.setTextColor(180,178,170);
    doc.text(`Page ${p} of ${pageCount}  |  Generated ${new Date().toLocaleString()}`, W/2, 292, {align:"center"});
  }

  const fname=`CSAT_${filterLabel.replace(/\s+/g,"_")}_${new Date().toISOString().slice(0,10)}.pdf`;
  doc.save(fname);
}

  const recText=r.recommend==="yes"?"Yes":r.recommend==="no"?"No":"Maybe";
  const recColor=r.recommend==="yes"?[46,125,50]:r.recommend==="no"?[198,40,40]:[230,81,0];
  doc.setFillColor(...recColor); doc.setDrawColor(...recColor); doc.setLineWidth(0.3);
  doc.roundedRect(margin+cW/2+4,y,cW/2-4,22,3,3,"FD");

  y+=10;

  questions.forEach((q,i)=>{

    const blockH=cmt?28:18;
    doc.setFillColor(i%2===0?255:250,i%2===0?255:249,i%2===0?255:248);
    doc.setDrawColor(225,220,210); doc.setLineWidth(0.2);
    doc.rect(margin,y,cW,blockH,"FD");

    // Q label
    doc.setFontSize(7.5); doc.setFont("helvetica","bold"); doc.setTextColor(40,40,40);
    doc.text(`${i+1}. ${q.text.slice(0,70)}`, margin+3, y+6);

    // Stars — drawn as real vector star shapes (previously a tiny "*" glyph)
    // so they read clearly in the individual-response PDF export.
    const starR = 3.2, starGap = 8.5;
    for(let s=1;s<=5;s++){
      const rgb = rating>=s?[249,168,37]:[222,218,208];
      drawStarPDF(doc, margin+6+(s-1)*starGap, y+11.5, starR, rgb);
    }
    if(rating){
      const [lr,lg,lb]=hexToRgb(scoreColor(rating));
      doc.setTextColor(lr,lg,lb); doc.setFontSize(7.5); doc.setFont("helvetica","bold");
      doc.text(RATING_LABELS[rating-1], margin+6+5*starGap+4, y+13);

    // Comment
    if(cmt){
      doc.setFontSize(7); doc.setFont("helvetica","italic"); doc.setTextColor(80,80,80);
      const cmtLines=doc.splitTextToSize(`"${cmt}"`, cW-8);
      doc.text(cmtLines[0]||"", margin+3, y+21);
    }
    y+=blockH+2;
  });

  // Overall comment
  if(r.overallComment){
    if(y>255){ doc.addPage(); y=20; }
    doc.setFontSize(9); doc.setFont("helvetica","bold"); doc.setTextColor(27,58,107);
    doc.text("Additional Comments", margin, y+5);
    y+=10;
    doc.setFillColor(240,244,250); doc.setDrawColor(195,212,238); doc.setLineWidth(0.3);
    const cmtLines=doc.splitTextToSize(r.overallComment, cW-10);
    doc.roundedRect(margin,y,cW,10+cmtLines.length*5,3,3,"FD");
    doc.setFontSize(8); doc.setFont("helvetica","italic"); doc.setTextColor(50,50,80);
    cmtLines.forEach((l,i)=>doc.text(l, margin+5, y+8+i*5));
  }

  const fname=`Response_${r.repName||"Unknown"}_${new Date(r.ts||Date.now()).toISOString().slice(0,10)}.pdf`.replace(/\s+/g,"_");
  doc.save(fname);
}

/* ── Dashboard ── */
function Dashboard({ responses, plants, questions, surveyUrl, companyName, logoUrl }) {
  const [plantFilter, setPlantFilter] = useState("__all__");
  const [search,      setSearch]      = useState("");
  const [selected,    setSelected]    = useState(new Set());
  const [confirmDel,  setConfirmDel]  = useState(false);
  const [detailRow,   setDetailRow]   = useState(null);
  const [exporting,   setExporting]   = useState(false);

  const filtered = useMemo(()=>{
    return responses.filter(r=>{
      if (plantFilter!=="__all__" && r.plant!==plantFilter) return false;
      if (search) {
        const q=search.toLowerCase();
        return [r.repName,r.orgName,r.email,r.plant,r.contact].some(v=>(v||"").toLowerCase().includes(q));
      }
      return true;
    });
  },[responses,plantFilter,search]);

  const overallAvg  = filtered.length ? filtered.reduce((s,r)=>s+(r.overall||0),0)/filtered.length : 0;
  const recYes      = filtered.filter(r=>r.recommend==="yes").length;
  const recPct      = filtered.length ? Math.round(recYes/filtered.length*100) : 0;
  const plantsCount = new Set(filtered.map(r=>r.plant).filter(Boolean)).size;
  const qAvg        = qid => { const v=filtered.map(r=>r.ratings?.[qid]).filter(Boolean); return v.length?v.reduce((a,b)=>a+b,0)/v.length:0; };

  const toggle    = id => setSelected(s=>{const n=new Set(s);n.has(id)?n.delete(id):n.add(id);return n;});
  const selectAll = ()  => setSelected(new Set(filtered.map(r=>r.id)));
  const clearSel  = ()  => setSelected(new Set());
  const doDelete  = async () => {
    const u={}; [...selected].forEach(id=>{u[id]=null;});
    await firebase.database().ref(DB.responses).update(u);
    setSelected(new Set()); setConfirmDel(false);
  };

  const handleExport = () => {
    setExporting(true);
    setTimeout(()=>{
      // Export selected rows if any, otherwise export all filtered
      const toExport = selected.size>0 ? filtered.filter(r=>selected.has(r.id)) : filtered;
      exportDashboardPDF(toExport, questions, plants, plantFilter, overallAvg, recPct, recYes, qAvg, companyName, logoUrl, surveyUrl);
      setExporting(false);
    }, 100);
  };

  return (
    <div className="dash-wrap">
      <div className="dash-toprow">
        <div className="pill-bar">
          <button className={"pill"+(plantFilter==="__all__"?" active":"")} onClick={()=>setPlantFilter("__all__")}>All Plants</button>
          {plants.map(p=>(
            <button key={p.name} className={"pill"+(plantFilter===p.name?" active":"")} onClick={()=>setPlantFilter(p.name)}>{p.name}</button>
          ))}
        </div>
        <button className="btn-export" onClick={handleExport} disabled={exporting||!filtered.length}>
          {exporting?"Exporting...":selected.size>0?`Export Selected (${selected.size})`:`Export PDF${plantFilter!=="__all__"?" - "+plantFilter:""}`}
        </button>
      </div>

      <div className="kpi-qr-row">
        <div className="kpi-grid">
          <StatCard label="Total Responses" value={filtered.length}/>
          <StatCard label="Avg. Satisfaction" value={overallAvg>0?fmt1(overallAvg)+" / 5":"—"} accent={overallAvg>0?scoreColor(overallAvg):undefined} sub="OUT OF 5.0"/>
          <StatCard label="Would Recommend" value={filtered.length?recPct+"%":"—"} accent={recPct>=70?"#2E7D32":recPct>=50?"#E65100":"#C62828"} sub={`${recYes} of ${filtered.length}`}/>
          <StatCard label="Plants Covered" value={plantsCount}/>
        </div>
        {surveyUrl && (
          <div className="qr-corner">
            <QRWidget url={surveyUrl} size={90}/>
            <a href={surveyUrl} target="_blank" rel="noreferrer" className="survey-link">{surveyUrl}</a>
          </div>
        )}
      </div>

      {filtered.length>0 && (
        <div className="gauge-row">
          <div className="gauge-panel"><Gauge value={overallAvg}/><div className="gauge-lbl">Overall Satisfaction</div></div>
          <div className="cat-panel">
            <div className="panel-title">Question Averages</div>
            {questions.length===0 && <p className="muted">No questions configured.</p>}
            {questions.map(q=>{
              const avg=qAvg(q.id);
              return (
                <div key={q.id} className="cat-row">
                  <div className="cat-name" title={q.text}>{q.text.length>34?q.text.slice(0,32)+"…":q.text}</div>
                  <div className="cat-bar-wrap"><div className="cat-bar" style={{width:avg>0?`${avg/5*100}%`:"0%",background:scoreColor(avg)}}/></div>
                  <div className="cat-score" style={{color:scoreColor(avg)}}>{avg>0?fmt1(avg):"—"}</div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      <div className="panel">
        <div className="panel-topbar">
          <span className="panel-title" style={{marginBottom:0}}>Responses ({filtered.length})</span>
          <input className="search-inp" placeholder="Search name, org, plant…" value={search} onChange={e=>setSearch(e.target.value)}/>
          <div className="panel-acts">
            <button className="btn-sm" onClick={selectAll}>Select All</button>
            <button className="btn-sm" onClick={clearSel}>Clear</button>
            {selected.size>0 && <button className="btn-sm" onClick={handleExport}>Export ({selected.size})</button>}
            {selected.size>0 && <button className="btn-sm danger" onClick={()=>setConfirmDel(true)}>Delete ({selected.size})</button>}
          </div>
        </div>
        {filtered.length===0
          ? <p className="muted" style={{textAlign:"center",padding:"2rem"}}>No responses yet.</p>
          : (
            <div className="table-wrap">
              <table className="resp-table">
                <thead>
                  <tr><th style={{width:32}}></th><th>Date</th><th>Representative</th><th>Organization</th><th>Plant</th><th>Overall</th><th>Recommend</th></tr>
                </thead>
                <tbody>
                  {filtered.map(r=>(
                    <tr key={r.id} className={"resp-row"+(selected.has(r.id)?" sel":"")} onClick={()=>setDetailRow(r)}>
                      <td onClick={e=>e.stopPropagation()}><input type="checkbox" checked={selected.has(r.id)} onChange={()=>toggle(r.id)}/></td>
                      <td style={{whiteSpace:"nowrap"}}>{r.ts?new Date(r.ts).toLocaleDateString():"—"}</td>
                      <td><div style={{fontWeight:500}}>{r.repName||"—"}</div><div style={{fontSize:11,color:"#aaa"}}>{r.email||""}</div></td>
                      <td>{r.orgName||"—"}</td>
                      <td>{r.plant||"—"}</td>
                      <td style={{fontWeight:700,color:r.overall?scoreColor(r.overall):"#333"}}>{fmt1(r.overall)}</td>
                      <td>{r.recommend==="yes"?"👍":r.recommend==="no"?"👎":"🤔"}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )
        }
        <p className="click-hint">Click any row to view full response details</p>
      </div>

      {confirmDel && (
        <div className="modal-overlay" onClick={()=>setConfirmDel(false)}>
          <div className="modal-box" onClick={e=>e.stopPropagation()}>
            <p style={{marginBottom:16}}>Delete {selected.size} response{selected.size>1?"s":""}? This cannot be undone.</p>
            <div className="modal-acts"><button className="btn-sm" onClick={()=>setConfirmDel(false)}>Cancel</button><button className="btn-sm danger" onClick={doDelete}>Delete</button></div>
          </div>
        </div>
      )}
      {detailRow && <DetailModal r={detailRow} questions={questions} onClose={()=>setDetailRow(null)} companyName={companyName} logoUrl={logoUrl}/>}
    </div>
  );
}

/* ── App ── */
function App() {
  const [user,        setUser]        = useState(null);
  const [authLoading, setAuthLoading] = useState(true);
  const [tab,         setTab]         = useState("survey");
  const [notifEmail,  setNotifEmail]  = useState("");
  const [ackText,     setAckText]     = useState("Thank you for your valuable feedback! Your response has been recorded.");
  const [infoText,    setInfoText]    = useState("Your response has been successfully recorded.\nYour feedback helps us continuously improve our products and services.\nIf you have any questions, feel free to contact us.");
  const [mailLogs,    setMailLogs]    = useState([]);
  const [msTenantId,  setMsTenantId]  = useState("");
  const [msClientId,  setMsClientId]  = useState("");
  const [msSenderEmail,setMsSenderEmail]=useState("");
  const [msSignedIn,  setMsSignedIn]  = useState(false);
  const [responses,   setResponses]   = useState([]);
  const [plants,      setPlants]      = useState([]);
  const [questions,   setQuestions]   = useState([]);
  const [logoUrl,     setLogoUrl]     = useState("");
  const [surveyUrl,   setSurveyUrl]   = useState("");
  const [companyName, setCompanyName] = useState("");
  const [surveyNote,  setSurveyNote]  = useState("");
  const [uploading,   setUploading]   = useState(false);

  useEffect(()=>{
    const unsubAuth = firebase.auth().onAuthStateChanged(u=>{
      setUser(u);
      setAuthLoading(false);
      if (u) setTab("dashboard");
      else setTab("login");
    });
    return unsubAuth;
  },[]);

  useEffect(()=>{
    // Attach DB listeners only when user is authenticated
    if (!user) return;

    const refResp = firebase.database().ref(DB.responses);
    const hResp = refResp.on("value",snap=>{
      const d=snap.val()||{};
      setResponses(Object.values(d).sort((a,b)=>(b.ts||0)-(a.ts||0)));
    });

    const refPlants = firebase.database().ref(DB.plants);
    refPlants.on("value",snap=>{
      const d=snap.val()||{};
      setPlants(Object.values(d).sort((a,b)=>(a.name||"").localeCompare(b.name||"")));
    });

    const refQuestions = firebase.database().ref(DB.questions);
    refQuestions.on("value",snap=>{
      const d=snap.val()||{};
      setQuestions(Object.values(d).sort((a,b)=>(a.order||0)-(b.order||0)));
    });

    const refLogo = firebase.database().ref(DB.logo);
    refLogo.on("value", s=>setLogoUrl(s.val()||""));

    const refSUrl = firebase.database().ref(DB.surveyUrl);
    refSUrl.on("value", s=>setSurveyUrl(s.val()||""));

    const refCo = firebase.database().ref(DB.companyName);
    refCo.on("value", s=>setCompanyName(s.val()||""));

    const refNote = firebase.database().ref(DB.surveyNote);
    refNote.on("value", s=>setSurveyNote(s.val()||""));

    const refNE = firebase.database().ref(DB.notifEmail);
    refNE.on("value", s=>setNotifEmail(s.val()||""));

    const refAT = firebase.database().ref(DB.ackText);
    refAT.on("value", s=>setAckText(s.val()||"Thank you for your valuable feedback! Your response has been recorded."));
    const refIT = firebase.database().ref(DB.infoText);
    refIT.on("value", s=>setInfoText(s.val()||"Your response has been successfully recorded.\nYour feedback helps us continuously improve our products and services.\nIf you have any questions, feel free to contact us."));

    const refML = firebase.database().ref(DB.mailLog);
    refML.on("value", snap=>{
      const d=snap.val()||{};
      setMailLogs(Object.values(d).sort((a,b)=>(b.ts||0)-(a.ts||0)));
    });

    const refTn = firebase.database().ref(DB.msTenantId);
    refTn.on("value", s=>setMsTenantId(s.val()||""));
    const refCi = firebase.database().ref(DB.msClientId);
    refCi.on("value", s=>setMsClientId(s.val()||""));
    const refSe = firebase.database().ref(DB.msSenderEmail);
    refSe.on("value", s=>setMsSenderEmail(s.val()||""));

    return ()=>{
      refResp.off("value", hResp);
      refPlants.off("value");
      refQuestions.off("value");
      refLogo.off("value");
      refSUrl.off("value");
      refCo.off("value");
      refNote.off("value");
      refNE.off("value");
      refAT.off("value");
      refML.off("value");
      refTn.off("value");
      refCi.off("value");
      refSe.off("value");
      refIT.off("value");
    };
  },[user]);

  /* ── Email helpers ── */
  const saveNotifEmail   = async v => firebase.database().ref(DB.notifEmail).set(v.trim());
  const saveAckText      = async v => firebase.database().ref(DB.ackText).set(v.trim());
  const saveInfoText     = async v => firebase.database().ref(DB.infoText).set(v.trim());
  const saveMsTenantId   = async v => firebase.database().ref(DB.msTenantId).set(v.trim());
  const saveMsClientId   = async v => firebase.database().ref(DB.msClientId).set(v.trim());
  const saveMsSenderEmail= async v => firebase.database().ref(DB.msSenderEmail).set(v.trim());

  /* ── Microsoft Graph: get OAuth2 token then send mail silently ── */
  /* ── MSAL singleton (same pattern as Task Planner) ── */
  const _msalInstances = {};
  let   _msalSignedIn  = false;

  const getMSGraphToken = async (clientId, tenantId) => {
    if (typeof msal === "undefined") throw new Error("MSAL library failed to load. Check internet connection and refresh.");
    if (!clientId || !tenantId) throw new Error("Microsoft credentials not configured. Go to Settings > Mail Configuration.");
    const redirectUri = window.location.href.split("?")[0].split("#")[0];
    const cacheKey    = clientId + "::" + tenantId;
    if (!_msalInstances[cacheKey]) {
      const inst = new msal.PublicClientApplication({
        auth: { clientId, authority: "https://login.microsoftonline.com/" + tenantId, redirectUri },
        cache: { cacheLocation: "localStorage", storeAuthStateInCookie: false },
      });
      await inst.initialize();
      _msalInstances[cacheKey] = inst;
    }
    const inst     = _msalInstances[cacheKey];
    const request  = { scopes: ["Mail.Send", "User.Read"] };
    const accounts = inst.getAllAccounts();
    if (accounts.length > 0) {
      try {
        const silent = await inst.acquireTokenSilent({ ...request, account: accounts[0] });
        _msalSignedIn = true;
        setMsSignedIn(true);
        return silent.accessToken;
      } catch(_) { /* fall through to popup */ }
    }
    // Interactive popup — user signs in once, tokens cached for future submissions
    const popup = await inst.loginPopup(request);
    _msalSignedIn = true;
    setMsSignedIn(true);
    return popup.accessToken;
  };

  const msalSignIn = async () => {
    try { await getMSGraphToken(msClientId, msTenantId); } catch(e) { console.error("MSAL sign-in:", e); }
  };

  const buildAckHtml = (toEmail, compName, bodyText, logo, info) => {
    const yr   = new Date().getFullYear();
    const dt   = new Date().toLocaleDateString("en-IN", {day:"2-digit", month:"long", year:"numeric"});
    const name = toEmail.split("@")[0];
    const infoLines = (info||"").split("\n").filter(l=>l.trim());
    const infoRows  = infoLines.map(function(l){ return "<tr><td style=\"padding:3px 0;font-family:Arial,sans-serif;font-size:13px;color:#444;line-height:1.6;\">" + l.trim() + "</td></tr>"; }).join("");
    // Logo: white bg, rounded corners, 8px padding (≈2mm) — VML for Outlook, CSS for others
    const logoHtml = logo ? [
      "<!--[if mso]>",
      "<v:roundrect xmlns:v=\"urn:schemas-microsoft-com:vml\" xmlns:w=\"urn:schemas-microsoft-com:office:word\"",
      " arcsize=\"15%\" strokecolor=\"#dddddd\" fillcolor=\"#ffffff\"",
      " style=\"width:192px;height:68px;v-text-anchor:middle;\">",
      "<w:anchorlock/><center>",
      "<img src=\"" + logo + "\" width=\"160\" height=\"52\" style=\"border:0;display:block;margin:8px;\" />",
      "</center></v:roundrect><![endif]-->",
      "<!--[if !mso]><!-->",
      "<div style=\"display:inline-block;background:#ffffff;border-radius:12px;border:1px solid #dddddd;padding:8px;line-height:0;\">",
      "<img src=\"" + logo + "\" alt=\"logo\" style=\"display:block;max-height:52px;width:auto;max-width:160px;border:0;\" />",
      "</div>",
      "<!--<![endif]-->"
    ].join("") : "";
    return [
      "<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.0 Transitional//EN\" \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\">",
      "<html xmlns=\"http://www.w3.org/1999/xhtml\" xmlns:v=\"urn:schemas-microsoft-com:vml\" xmlns:o=\"urn:schemas-microsoft-com:office:office\"><head>",
      "<meta http-equiv=\"Content-Type\" content=\"text/html; charset=UTF-8\"/>",
      "<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"/>",
      "<!--[if mso]><xml><o:OfficeDocumentSettings><o:AllowPNG/><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml><![endif]-->",
      "<title>Thank You</title>",
      "</head>",
      "<body style=\"margin:0;padding:0;background-color:#f4f6f8;\">",
      // Outer wrapper table
      "<table border=\"0\" cellpadding=\"0\" cellspacing=\"0\" width=\"100%\" style=\"background-color:#f4f6f8;\">",
      "<tr><td align=\"center\" style=\"padding:24px 0;\">",
      // Card table
      "<table border=\"0\" cellpadding=\"0\" cellspacing=\"0\" width=\"600\" style=\"max-width:600px;background-color:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e0e0e0;\">",

      // ── HEADER ──
      "<tr><td style=\"background-color:#1B3A6B;padding:22px 28px;\">",
      (logoHtml ? "<table border=\"0\" cellpadding=\"0\" cellspacing=\"0\"><tr><td style=\"padding-bottom:10px;\">" + logoHtml + "</td></tr></table>" : ""),
      "<p style=\"margin:10px 0 0;font-family:Arial,sans-serif;font-size:13px;color:#b8cde4;\">Customer Satisfaction Survey</p>",
      "</td></tr>",

      // ── CHECKMARK ──
      "<tr><td align=\"center\" style=\"padding:28px 28px 8px;background-color:#ffffff;\">",
      "<table border=\"0\" cellpadding=\"0\" cellspacing=\"0\"><tr><td align=\"center\" style=\"width:56px;height:56px;background-color:#E8F5E9;border-radius:50%;font-size:26px;color:#2E7D32;font-family:Arial,sans-serif;font-weight:bold;\">&#10003;</td></tr></table>",
      "</td></tr>",

      // ── TITLE ──
      "<tr><td align=\"center\" style=\"padding:12px 28px 4px;\">",
      "<p style=\"margin:0;font-family:Arial,sans-serif;font-size:20px;font-weight:bold;color:#1B3A6B;\">Thank You for Your Feedback!</p>",
      "</td></tr>",
      "<tr><td align=\"center\" style=\"padding:4px 28px 20px;\">",
      "<p style=\"margin:0;font-family:Arial,sans-serif;font-size:12px;color:#999;\">" + dt + "</p>",
      "</td></tr>",

      // ── MAIN MESSAGE ──
      "<tr><td style=\"padding:0 28px 20px;\">",
      "<table border=\"0\" cellpadding=\"0\" cellspacing=\"0\" width=\"100%\"><tr>",
      "<td width=\"4\" style=\"background-color:#1B3A6B;\"></td>",
      "<td style=\"padding:14px 16px;background-color:#F5F3EE;font-family:Arial,sans-serif;font-size:14px;color:#333;line-height:1.7;\">" + bodyText + "</td>",
      "</tr></table>",
      "</td></tr>",

      // ── INFO BOX ──
      "<tr><td style=\"padding:0 28px 24px;\">",
      "<table border=\"0\" cellpadding=\"0\" cellspacing=\"0\" width=\"100%\" style=\"background-color:#EBF2FA;\"><tr><td style=\"padding:16px 18px;\">",
      "<table border=\"0\" cellpadding=\"0\" cellspacing=\"0\" width=\"100%\">",
      "<tr><td style=\"font-family:Arial,sans-serif;font-size:13px;color:#1B3A6B;font-weight:bold;padding-bottom:8px;\">Dear " + name + ",</td></tr>",
      infoRows,
      "</table>",
      "</td></tr></table>",
      "</td></tr>",

      // ── DIVIDER ──
      "<tr><td style=\"padding:0 28px;\"><table border=\"0\" cellpadding=\"0\" cellspacing=\"0\" width=\"100%\"><tr><td style=\"border-top:1px solid #eeeeee;font-size:0;line-height:0;\">&nbsp;</td></tr></table></td></tr>",

      // ── NOTE ──
      "<tr><td align=\"center\" style=\"padding:12px 28px;\">",
      "<p style=\"margin:0;font-family:Arial,sans-serif;font-size:11px;color:#aaaaaa;\">This is an automated acknowledgement from " + compName + ". Please do not reply to this email.</p>",
      "</td></tr>",

      // ── FOOTER ──
      "<tr><td style=\"background-color:#F5F3EE;padding:14px 28px;\">",
      "<p style=\"margin:0;font-family:Arial,sans-serif;font-size:11px;color:#aaaaaa;text-align:center;\">&copy; " + yr + " " + compName + " &bull; All rights reserved</p>",
      "</td></tr>",

      "</table>",   // end card
      "</td></tr></table>",  // end outer
      "</body></html>"
    ].join("");
  };;

  const sendAckMail = async (toEmail, compName) => {
    if (!toEmail) return;
    const logId   = "ml_" + Date.now();
    const subject = "Thank you for your feedback - " + compName;
    const htmlBody = buildAckHtml(toEmail, compName, ackText, logoUrl, infoText);
    let status = "pending", error = "";
    try {
      if (!msTenantId || !msClientId) throw new Error("Microsoft credentials not configured in Settings.");
      // Acquire token via MSAL (silent if already signed in, popup on first use)
      const token = await getMSGraphToken(msClientId, msTenantId);
      // Use /me/sendMail with delegated Mail.Send — same as Task Planner
      const res = await fetch("https://graph.microsoft.com/v1.0/me/sendMail", {
        method: "POST",
        headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
        body: JSON.stringify({
          message: {
            subject,
            body: { contentType: "HTML", content: htmlBody },
            toRecipients: [{ emailAddress: { address: toEmail } }],
          },
          saveToSentItems: true,
        }),
      });
      if (!res.ok) { const e = await res.text(); throw new Error("Graph " + res.status + ": " + e); }
      status = "sent";
    } catch(e) {
      status = "failed";
      error  = e.message || String(e);
      console.error("sendAckMail:", e);
    }
    try {
      await firebase.database().ref(DB.mailLog + "/" + logId).set({
        id:logId, ts:Date.now(), to:toEmail, from:msSenderEmail||"",
        subject, status, error,
      });
    } catch(e) { console.error("mailLog write:", e); }
  };

  /* Logo upload: convert to base64 and store in Realtime DB (avoids Storage CORS issues) */
  const handleLogoUpload = file => {
    if (!file) return;
    if (file.size > 600*1024) { alert("File too large. Please use an image under 600 KB."); return; }
    setUploading(true);
    const reader = new FileReader();
    reader.onload = async e => {
      try {
        await firebase.database().ref(DB.logo).set(e.target.result);
      } catch(err) { alert("Logo save failed: "+err.message); }
      setUploading(false);
    };
    reader.onerror = () => { alert("Could not read file."); setUploading(false); };
    reader.readAsDataURL(file);
  };

  if (authLoading) return <div className="loading">Loading…</div>;
  const isAdmin = !!user;

  return (
    <div className="app">
      <header className="topbar">
        <div className="topbar-left" onDoubleClick={()=>!isAdmin&&setTab("login")} style={{cursor:"default"}}>
          {logoUrl && <img src={logoUrl} className="topbar-logo" alt="logo" onError={e=>e.target.style.display="none"}/>}
          <span className="topbar-title">{companyName||"Customer Satisfaction Survey"}</span>
        </div>
        <nav className="topbar-nav">
          {isAdmin && <button className={"nav-btn"+(tab==="survey"?" active":"")} onClick={()=>setTab("survey")}>Survey</button>}
          {isAdmin && <button className={"nav-btn"+(tab==="qr"?" active":"")} onClick={()=>setTab("qr")}>QR / Link</button>}
          {isAdmin && <button className={"nav-btn"+(tab==="dashboard"?" active":"")} onClick={()=>setTab("dashboard")}>Dashboard</button>}
          {isAdmin && <button className={"nav-btn"+(tab==="settings"?" active":"")} onClick={()=>setTab("settings")}>Settings</button>}
          {isAdmin && <button className={"nav-btn"+(tab==="maillog"?" active":"")} onClick={()=>setTab("maillog")}>📧 Mail Log</button>}
          {isAdmin && <button className="nav-btn logout" onClick={()=>firebase.auth().signOut()}>Logout</button>}
          {!isAdmin && <button className="nav-btn admin-ghost" onClick={()=>setTab("login")}>⚙</button>}
        </nav>
      </header>

      <div className="page-note">Responses are stored securely and power the shared admin dashboard.</div>

      <main>
        {tab==="survey"    && <SurveyForm plants={plants} questions={questions} logoUrl={logoUrl} companyName={companyName} surveyNote={surveyNote} onAckMail={email=>sendAckMail(email,companyName)}/>}
        {tab==="qr"        && isAdmin && <QRPortalPage surveyUrl={surveyUrl} logoUrl={logoUrl} companyName={companyName}/>}
        {tab==="qr"        && !isAdmin && <SurveyForm plants={plants} questions={questions} logoUrl={logoUrl} companyName={companyName} surveyNote={surveyNote} onAckMail={email=>sendAckMail(email,companyName)}/>}
        {tab==="login"     && !isAdmin && <LoginForm/>}
        {tab==="dashboard" && isAdmin  && <Dashboard responses={responses} plants={plants} questions={questions} surveyUrl={surveyUrl} companyName={companyName} logoUrl={logoUrl}/>}
        {tab==="settings"  && isAdmin  && <Settings plants={plants} questions={questions} logoUrl={logoUrl} companyName={companyName} surveyUrl={surveyUrl} surveyNote={surveyNote} onLogoUpload={handleLogoUpload} uploading={uploading} notifEmail={notifEmail} ackText={ackText} infoText={infoText} onSaveNotifEmail={saveNotifEmail} onSaveAckText={saveAckText} onSaveInfoText={saveInfoText} msTenantId={msTenantId} msClientId={msClientId} msSenderEmail={msSenderEmail} msSignedIn={msSignedIn} onMsSignIn={msalSignIn} onSaveMsTenantId={saveMsTenantId} onSaveMsClientId={saveMsClientId} onSaveMsSenderEmail={saveMsSenderEmail}/>}
        {tab==="maillog"   && isAdmin  && <MailLog logs={mailLogs}/>}
      </main>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);

</script>
