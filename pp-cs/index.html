<body>

<script type="text/jsx-source" id="app-source">
const { useState, useEffect, useMemo, useRef } = React;

const DB = {
  responses: "csat_responses",
  plants:    "csat_config/plants",
  questions: "csat_config/questions",
  logo:      "csat_settings/logoUrl",
  surveyUrl: "csat_settings/surveyUrl",
  companyName: "csat_settings/companyName",
};

const RATING_LABELS = ["Very Poor","Poor","Average","Good","Excellent"];
const scoreColor = s => s >= 4 ? "#2E7D32" : s >= 3 ? "#E65100" : "#C62828";
const fmt1 = n => (typeof n==="number"&&!isNaN(n)&&n>0) ? n.toFixed(1) : "—";
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));

function QRCodeWidget({ url, size=200 }) {
  const ref = useRef(null);
  useEffect(()=>{
    if (!url||!ref.current||!window.QRCode) return;
    window.QRCode.toCanvas(ref.current, url, {width:size,margin:2}, ()=>{});
  },[url,size]);
  if (!url) return null;
  return <canvas ref={ref} style={{borderRadius:8,border:"1px solid #D0CBBD",display:"block"}}/>;
}

function StarRating({ label, value, onChange, qComment, onCommentChange }) {
  return (
    <div className="q-block">
      <div className="q-label">{label}</div>
      <div className="stars-row">
        {[1,2,3,4,5].map(s=>(
          <button key={s} type="button" className={"star"+(value>=s?" on":"")} onClick={()=>onChange(s)}>★</button>
        ))}
        {value>0 && <span className="rating-hint">{RATING_LABELS[value-1]}</span>}
      </div>
      <textarea className="q-comment" rows={2} placeholder="Comment on this question (optional)…"
        value={qComment||""} onChange={e=>onCommentChange(e.target.value)}/>
    </div>
  );
}

function Gauge({ value }) {
  const cx=130,cy=130,r=95,sw=22,nLen=75;
  const pct=clamp((value-1)/4,0,1);
  const ang=-180+pct*180;
  const rad=ang*Math.PI/180;
  const perp=rad+Math.PI/2;
  const bi=6,bhw=5,tl=12,thw=3.5;
  const nx=cx+nLen*Math.cos(rad),ny=cy+nLen*Math.sin(rad);
  const bx1=cx+bi*Math.cos(rad)+bhw*Math.cos(perp),by1=cy+bi*Math.sin(rad)+bhw*Math.sin(perp);
  const bx2=cx+bi*Math.cos(rad)-bhw*Math.cos(perp),by2=cy+bi*Math.sin(rad)-bhw*Math.sin(perp);
  const tx1=cx-tl*Math.cos(rad)+thw*Math.cos(perp),ty1=cy-tl*Math.sin(rad)+thw*Math.sin(perp);
  const tx2=cx-tl*Math.cos(rad)-thw*Math.cos(perp),ty2=cy-tl*Math.sin(rad)-thw*Math.sin(perp);
  const pts=`${nx},${ny} ${bx1},${by1} ${tx1},${ty1} ${tx2},${ty2} ${bx2},${by2}`;
  const arc=(sa,ea,col)=>{
    const s1=cx+r*Math.cos(sa*Math.PI/180),s2=cy+r*Math.sin(sa*Math.PI/180);
    const e1=cx+r*Math.cos(ea*Math.PI/180),e2=cy+r*Math.sin(ea*Math.PI/180);
    return <path d={`M${s1} ${s2} A${r} ${r} 0 0 1 ${e1} ${e2}`} fill="none" stroke={col} strokeWidth={sw} strokeLinecap="butt"/>;
  };
  return (
    <svg viewBox="0 0 260 175" style={{width:"100%",maxWidth:280}}>
      {arc(-180,-144,"#C62828")}{arc(-141,-108,"#E65100")}{arc(-105,-76,"#F9A825")}
      {arc(-73,-40,"#7CB342")}{arc(-37,0,"#2E7D32")}
      <text x="22" y="148" fontSize="12" fill="#999" textAnchor="middle">1</text>
      <text x="130" y="30" fontSize="12" fill="#999" textAnchor="middle">3</text>
      <text x="238" y="148" fontSize="12" fill="#999" textAnchor="middle">5</text>
      {value>0 && <polygon points={pts} fill="#1B3A6B" strokeWidth="0.5"/>}
      <circle cx={cx} cy={cy} r={12} fill="#fff" stroke="#ccc" strokeWidth={2}/>
      <circle cx={cx} cy={cy} r={5} fill="#2E7D32"/>
      <text x={cx} y={cy+40} fontSize="26" fontWeight="700" textAnchor="middle" fill="#222" fontFamily="'IBM Plex Mono',monospace">{value>0?fmt1(value):"—"}</text>
      <text x={cx} y={cy+57} fontSize="10" textAnchor="middle" fill="#888">OUT OF 5.0</text>
    </svg>
  );
}

function StatCard({ label, value, sub, accent }) {
  const vs=String(value);
  const fs=vs.length>12?18:vs.length>8?22:30;
  return (
    <div className="stat-card">
      <div className="stat-label">{label}</div>
      <div className="stat-value" style={{fontSize:fs,...(accent?{color:accent}:{})}}>{value}</div>
      {sub&&<div className="stat-sub">{sub}</div>}
    </div>
  );
}

function ResponseModal({ r, questions, onClose }) {
  if (!r) return null;
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-box large" onClick={e=>e.stopPropagation()}>
        <div className="modal-hdr">
          <h3>Response Detail</h3>
          <button className="modal-close" onClick={onClose}>✕</button>
        </div>
        <div className="modal-body">
          <div className="detail-meta">
            {[["Date", r.ts?new Date(r.ts).toLocaleString():"—"],
              ["Rep Name", r.repName||"—"],
              ["Email", r.email||"—"],
              ["Contact", r.contact||"—"],
              ["Plant", r.plant||"—"],
              ["Overall", r.overall?(fmt1(r.overall)+" / 5.0"):"—"],
              ["Recommend", r.recommend==="yes"?"👍 Yes":r.recommend==="no"?"👎 No":"🤔 Maybe"]
            ].map(([k,v])=>(
              <div key={k} className="detail-row">
                <span className="detail-key">{k}</span>
                <span style={k==="Overall"&&r.overall?{fontWeight:700,color:scoreColor(r.overall)}:{}}>{v}</span>
              </div>
            ))}
          </div>
          <div className="detail-sec">Question Ratings</div>
          {questions.map(q=>{
            const rating=r.ratings?.[q.id];
            const comment=r.qComments?.[q.id];
            return (
              <div key={q.id} className="detail-q">
                <div className="detail-q-lbl">{q.text}</div>
                <div className="detail-q-stars">
                  {[1,2,3,4,5].map(s=>(
                    <span key={s} style={{color:rating>=s?"#F9A825":"#E0DBCF",fontSize:20}}>★</span>
                  ))}
                  {rating&&<span style={{fontSize:12,color:"#888",marginLeft:8}}>{RATING_LABELS[rating-1]}</span>}
                </div>
                {comment&&<div className="detail-q-cmt">"{comment}"</div>}
              </div>
            );
          })}
          {r.overallComment&&(
            <>
              <div className="detail-sec">Additional Comments</div>
              <div className="detail-cmt-box">"{r.overallComment}"</div>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

function SurveyForm({ plants, questions, logoUrl, companyName }) {
  const [step, setStep] = useState(0);
  const [repName, setRepName] = useState("");
  const [email, setEmail] = useState("");
  const [contact, setContact] = useState("");
  const [plant, setPlant] = useState("");
  const [ratings, setRatings] = useState({});
  const [qComments, setQComments] = useState({});
  const [recommend, setRecommend] = useState("");
  const [overallComment, setOverallComment] = useState("");
  const [error, setError] = useState("");
  const [submitting, setSubmitting] = useState(false);
  const [done, setDone] = useState(false);

  const setRating=(id,v)=>setRatings(r=>({...r,[id]:v}));
  const setQCmt=(id,v)=>setQComments(c=>({...c,[id]:v}));

  const validate=()=>{
    if (step===0){
      if(!plant){setError("Please select a plant.");return false;}
      if(!repName.trim()){setError("Please enter your name.");return false;}
    }
    if (step===1){
      const miss=questions.filter(q=>!ratings[q.id]);
      if(miss.length){setError("Please rate all questions.");return false;}
    }
    if (step===2&&!recommend){setError("Please select a recommendation.");return false;}
    setError("");return true;
  };

  const next=()=>{ if(validate()) setStep(s=>s+1); };
  const back=()=>{ setError(""); setStep(s=>s-1); };

  const submit=async()=>{
    if(!validate()) return;
    setSubmitting(true);
    try{
      const overall=questions.length
        ? +(questions.reduce((s,q)=>s+(ratings[q.id]||0),0)/questions.length).toFixed(2)
        : 0;
      const ref=firebase.database().ref(DB.responses).push();
      await ref.set({id:ref.key,repName,email,contact,plant,ratings,qComments,recommend,overallComment,overall,ts:Date.now()});
      setDone(true);
    } catch(e){setError("Submission failed. Please try again.");}
    setSubmitting(false);
  };

  const reset=()=>{
    setStep(0);setRepName("");setEmail("");setContact("");setPlant("");
    setRatings({});setQComments({});setRecommend("");setOverallComment("");setError("");setDone(false);
  };

  if (done) return (
    <div className="survey-wrap">
      <div className="paper">
        {logoUrl&&<img src={logoUrl} className="survey-logo" alt="logo" onError={e=>e.target.style.display="none"}/>}
        <div className="done-icon">✓</div>
        <h2 className="done-h2">Thank you for your feedback!</h2>
        <p className="done-sub">Your response helps us improve our products and services.</p>
        <button className="btn-primary" style={{margin:"0 auto",display:"block"}} onClick={reset}>Submit Another Response</button>
      </div>
    </div>
  );

  return (
    <div className="survey-wrap">
      <div className="paper">
        {logoUrl&&<img src={logoUrl} className="survey-logo" alt="logo" onError={e=>e.target.style.display="none"}/>}
        <h1 className="survey-title">Customer Satisfaction Survey</h1>
        {companyName&&<p className="survey-company">{companyName}</p>}
        <div className="progress-bar">
          {[0,1,2].map(i=>(
            <div key={i} className={"prog-step"+(i<step?" done":i===step?" active":"")}/>
          ))}
        </div>
        <div className="step-lbl">Step {step+1} of 3</div>
        {error&&<div className="error-box">{error}</div>}

        {step===0&&(
          <div>
            <div className="field-lbl">Representative Name *</div>
            <input className="inp" value={repName} onChange={e=>setRepName(e.target.value)} placeholder="Your full name"/>
            <div className="field-lbl">Email ID (optional)</div>
            <input className="inp" type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="your@email.com"/>
            <div className="field-lbl">Contact No. (optional)</div>
            <input className="inp" type="tel" value={contact} onChange={e=>setContact(e.target.value)} placeholder="+91 00000 00000"/>
            <div className="field-lbl">Select Plant *</div>
            <div className="plant-pills">
              {plants.length===0&&<p className="muted">No plants configured. Ask admin to add plants.</p>}
              {plants.map(p=>(
                <button key={p.id} type="button"
                  className={"plant-pill"+(plant===p.name?" sel":"")}
                  onClick={()=>setPlant(p.name)}>{p.name}</button>
              ))}
            </div>
          </div>
        )}

        {step===1&&(
          <div>
            {questions.length===0&&<p className="muted">No questions configured yet.</p>}
            {questions.map(q=>(
              <StarRating key={q.id} label={q.text}
                value={ratings[q.id]||0} onChange={v=>setRating(q.id,v)}
                qComment={qComments[q.id]} onCommentChange={v=>setQCmt(q.id,v)}/>
            ))}
          </div>
        )}

        {step===2&&(
          <div>
            <div className="field-lbl">Would you recommend us to others? *</div>
            <div className="rec-row">
              {[["yes","👍","Yes"],["maybe","🤔","Maybe"],["no","👎","No"]].map(([v,icon,lbl])=>(
                <button key={v} type="button" className={"rec-btn"+(recommend===v?" active":"")} onClick={()=>setRecommend(v)}>
                  <span className="rec-icon">{icon}</span>{lbl}
                </button>
              ))}
            </div>
            <div className="field-lbl" style={{marginTop:22}}>Additional Comments</div>
            <textarea className="inp" rows={4} value={overallComment}
              onChange={e=>setOverallComment(e.target.value)}
              placeholder="Share your overall experience, suggestions, or concerns…"/>
          </div>
        )}

        <div className="form-actions">
          {step>0&&<button className="btn-back" onClick={back}>← Back</button>}
          {step<2
            ? <button className="btn-primary" onClick={next}>Next →</button>
            : <button className="btn-primary" onClick={submit} disabled={submitting}>{submitting?"Submitting…":"Submit Feedback"}</button>
          }
        </div>
      </div>
    </div>
  );
}

function LoginForm() {
  const [email,setEmail]=useState("");
  const [pw,setPw]=useState("");
  const [err,setErr]=useState("");
  const [loading,setLoading]=useState(false);
  const login=async()=>{
    setLoading(true);setErr("");
    try{await firebase.auth().signInWithEmailAndPassword(email,pw);}
    catch{setErr("Invalid credentials.");}
    setLoading(false);
  };
  return (
    <div className="login-wrap">
      <div className="login-card">
        <h2>Admin Login</h2>
        {err&&<div className="error-box">{err}</div>}
        <input className="inp" type="email" placeholder="Email" value={email} onChange={e=>setEmail(e.target.value)}/>
        <input className="inp" type="password" placeholder="Password" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==="Enter"&&login()}/>
        <button className="btn-primary" onClick={login} disabled={loading}>{loading?"…":"Login"}</button>
      </div>
    </div>
  );
}

function Settings({ plants, questions, logoUrl, companyName, surveyUrl, onLogoUpload, uploading }) {
  const [newPlant,setNewPlant]=useState("");
  const [editPlant,setEditPlant]=useState(null);
  const [editPlantTxt,setEditPlantTxt]=useState("");
  const [newQ,setNewQ]=useState("");
  const [editQ,setEditQ]=useState(null);
  const [editQTxt,setEditQTxt]=useState("");
  const [company,setCompany]=useState(companyName||"");
  const [sUrl,setSUrl]=useState(surveyUrl||"");
  const fileRef=useRef();

  useEffect(()=>{ setCompany(companyName||""); },[companyName]);
  useEffect(()=>{ setSUrl(surveyUrl||""); },[surveyUrl]);

  const addPlant=async()=>{
    const t=newPlant.trim();if(!t)return;
    const key="p_"+Date.now();
    await firebase.database().ref(DB.plants+"/"+key).set({id:key,name:t});
    setNewPlant("");
  };
  const delPlant=async id=>{ await firebase.database().ref(DB.plants+"/"+id).remove(); };
  const saveEditPlant=async id=>{
    await firebase.database().ref(DB.plants+"/"+id+"/name").set(editPlantTxt.trim());
    setEditPlant(null);
  };
  const addQ=async()=>{
    const t=newQ.trim();if(!t)return;
    const key="q_"+Date.now();
    await firebase.database().ref(DB.questions+"/"+key).set({id:key,text:t,order:Date.now()});
    setNewQ("");
  };
  const delQ=async id=>{ await firebase.database().ref(DB.questions+"/"+id).remove(); };
  const saveEditQ=async id=>{
    await firebase.database().ref(DB.questions+"/"+id+"/text").set(editQTxt.trim());
    setEditQ(null);
  };
  const saveCompany=async()=>{ await firebase.database().ref(DB.companyName).set(company.trim()); };
  const saveUrl=async()=>{ await firebase.database().ref(DB.surveyUrl).set(sUrl.trim()); };

  return (
    <div className="settings-wrap">
      <h2>Settings</h2>

      <div className="s-card">
        <div className="s-title">Company Name</div>
        <div className="inp-row">
          <input className="inp" value={company} onChange={e=>setCompany(e.target.value)} placeholder="Your company name"/>
          <button className="btn-sm" onClick={saveCompany}>Save</button>
        </div>
      </div>

      <div className="s-card">
        <div className="s-title">Company Logo</div>
        {logoUrl&&<img src={logoUrl} alt="logo" className="logo-prev" onError={e=>e.target.style.display="none"}/>}
        <input ref={fileRef} type="file" accept="image/*" style={{display:"none"}} onChange={e=>e.target.files[0]&&onLogoUpload(e.target.files[0])}/>
        <div style={{display:"flex",gap:8,marginTop:8}}>
          <button className="btn-sm" onClick={()=>fileRef.current.click()} disabled={uploading}>{uploading?"Uploading…":"Upload Logo"}</button>
          {logoUrl&&<button className="btn-sm danger" onClick={()=>firebase.database().ref(DB.logo).remove()}>Remove</button>}
        </div>
      </div>

      <div className="s-card">
        <div className="s-title">Survey Link & QR Code</div>
        <div className="inp-row">
          <input className="inp" value={sUrl} onChange={e=>setSUrl(e.target.value)} placeholder="https://yoursite.com/pp-cs/"/>
          <button className="btn-sm" onClick={saveUrl}>Save</button>
        </div>
        {sUrl&&(
          <div style={{marginTop:18,display:"flex",flexDirection:"column",alignItems:"center",gap:10}}>
            <QRCodeWidget url={sUrl} size={200}/>
            <p style={{fontSize:12,color:"#666",wordBreak:"break-all",textAlign:"center"}}>{sUrl}</p>
            <p style={{fontSize:12,color:"#999"}}>Share this QR code or link with customers</p>
          </div>
        )}
      </div>

      <div className="s-card">
        <div className="s-title">Plants</div>
        <div className="inp-row" style={{marginBottom:12}}>
          <input className="inp" value={newPlant} onChange={e=>setNewPlant(e.target.value)}
            placeholder="Plant name" onKeyDown={e=>e.key==="Enter"&&addPlant()}/>
          <button className="btn-sm" onClick={addPlant}>Add</button>
        </div>
        {plants.length===0&&<p className="muted">No plants added yet.</p>}
        {plants.map(p=>(
          <div key={p.id} className="list-item">
            {editPlant===p.id
              ? <>
                  <input className="inp" style={{flex:1}} value={editPlantTxt} onChange={e=>setEditPlantTxt(e.target.value)}/>
                  <button className="btn-sm" onClick={()=>saveEditPlant(p.id)}>Save</button>
                  <button className="btn-sm" onClick={()=>setEditPlant(null)}>Cancel</button>
                </>
              : <>
                  <span className="list-text">{p.name}</span>
                  <button className="btn-sm" onClick={()=>{setEditPlant(p.id);setEditPlantTxt(p.name);}}>Edit</button>
                  <button className="btn-sm danger" onClick={()=>delPlant(p.id)}>Delete</button>
                </>
            }
          </div>
        ))}
      </div>

      <div className="s-card">
        <div className="s-title">Survey Questions</div>
        <div className="inp-row" style={{marginBottom:12}}>
          <input className="inp" value={newQ} onChange={e=>setNewQ(e.target.value)}
            placeholder="Enter question text" onKeyDown={e=>e.key==="Enter"&&addQ()}/>
          <button className="btn-sm" onClick={addQ}>Add</button>
        </div>
        {questions.length===0&&<p className="muted">No questions added yet.</p>}
        {questions.map((q,i)=>(
          <div key={q.id} className="list-item">
            {editQ===q.id
              ? <>
                  <input className="inp" style={{flex:1}} value={editQTxt} onChange={e=>setEditQTxt(e.target.value)}/>
                  <button className="btn-sm" onClick={()=>saveEditQ(q.id)}>Save</button>
                  <button className="btn-sm" onClick={()=>setEditQ(null)}>Cancel</button>
                </>
              : <>
                  <span className="list-num">{i+1}.</span>
                  <span className="list-text">{q.text}</span>
                  <button className="btn-sm" onClick={()=>{setEditQ(q.id);setEditQTxt(q.text);}}>Edit</button>
                  <button className="btn-sm danger" onClick={()=>delQ(q.id)}>Delete</button>
                </>
            }
          </div>
        ))}
      </div>
    </div>
  );
}

function Dashboard({ responses, plants, questions, surveyUrl }) {
  const [plantFilter,setPlantFilter]=useState("__all__");
  const [search,setSearch]=useState("");
  const [selected,setSelected]=useState(new Set());
  const [confirmDel,setConfirmDel]=useState(false);
  const [detailRow,setDetailRow]=useState(null);

  const filtered=useMemo(()=>{
    return responses.filter(r=>{
      if(plantFilter!=="__all__"&&r.plant!==plantFilter) return false;
      if(search){
        const q=search.toLowerCase();
        return [r.repName,r.email,r.plant,r.contact].some(v=>(v||"").toLowerCase().includes(q));
      }
      return true;
    });
  },[responses,plantFilter,search]);

  const overallAvg=filtered.length?filtered.reduce((s,r)=>s+(r.overall||0),0)/filtered.length:0;
  const recYes=filtered.filter(r=>r.recommend==="yes").length;
  const recPct=filtered.length?Math.round(recYes/filtered.length*100):0;
  const plantsCount=new Set(filtered.map(r=>r.plant).filter(Boolean)).size;

  const qAvg=qid=>{
    const vals=filtered.map(r=>r.ratings?.[qid]).filter(Boolean);
    return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0;
  };

  const toggle=id=>setSelected(s=>{const n=new Set(s);n.has(id)?n.delete(id):n.add(id);return n;});
  const selectAll=()=>setSelected(new Set(filtered.map(r=>r.id)));
  const clearSel=()=>setSelected(new Set());

  const doDelete=async()=>{
    const upd={};
    [...selected].forEach(id=>{upd[id]=null;});
    await firebase.database().ref(DB.responses).update(upd);
    setSelected(new Set());setConfirmDel(false);
  };

  const fmtDate=ts=>ts?new Date(ts).toLocaleDateString():"—";
  const plantNames=plants.map(p=>p.name);

  return (
    <div className="dash-wrap">
      <div className="dash-toprow">
        <div className="pill-bar">
          <button className={"pill"+(plantFilter==="__all__"?" active":"")} onClick={()=>setPlantFilter("__all__")}>All Plants</button>
          {plantNames.map(p=>(
            <button key={p} className={"pill"+(plantFilter===p?" active":"")} onClick={()=>setPlantFilter(p)}>{p}</button>
          ))}
        </div>
        {surveyUrl&&(
          <div className="qr-corner">
            <QRCodeWidget url={surveyUrl} size={80}/>
            <a href={surveyUrl} target="_blank" rel="noreferrer" className="survey-link">{surveyUrl}</a>
          </div>
        )}
      </div>

      <div className="kpi-grid">
        <StatCard label="Total Responses" value={filtered.length}/>
        <StatCard label="Avg. Satisfaction" value={overallAvg>0?fmt1(overallAvg)+" / 5":"—"}
          accent={overallAvg>0?scoreColor(overallAvg):undefined} sub="OUT OF 5.0"/>
        <StatCard label="Would Recommend" value={filtered.length?recPct+"%":"—"}
          accent={recPct>=70?"#2E7D32":recPct>=50?"#E65100":"#C62828"}
          sub={`${recYes} of ${filtered.length}`}/>
        <StatCard label="Plants Covered" value={plantsCount}/>
      </div>

      {filtered.length>0&&(
        <div className="gauge-row">
          <div className="gauge-panel">
            <Gauge value={overallAvg}/>
            <div className="gauge-lbl">Overall Satisfaction</div>
          </div>
          <div className="cat-panel">
            <div className="panel-title">Question Averages</div>
            {questions.length===0&&<p className="muted">No questions configured.</p>}
            {questions.map(q=>{
              const avg=qAvg(q.id);
              return (
                <div key={q.id} className="cat-row">
                  <div className="cat-name" title={q.text}>{q.text.length>34?q.text.slice(0,32)+"…":q.text}</div>
                  <div className="cat-bar-wrap">
                    <div className="cat-bar" style={{width:avg>0?`${avg/5*100}%`:"0%",background:scoreColor(avg)}}/>
                  </div>
                  <div className="cat-score" style={{color:scoreColor(avg)}}>{avg>0?fmt1(avg):"—"}</div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      <div className="panel">
        <div className="panel-topbar">
          <span className="panel-title" style={{marginBottom:0}}>Responses ({filtered.length})</span>
          <input className="search-inp" placeholder="Search name, email, plant…" value={search} onChange={e=>setSearch(e.target.value)}/>
          <div className="panel-acts">
            <button className="btn-sm" onClick={selectAll}>Select All</button>
            <button className="btn-sm" onClick={clearSel}>Clear</button>
            {selected.size>0&&<button className="btn-sm danger" onClick={()=>setConfirmDel(true)}>Delete ({selected.size})</button>}
          </div>
        </div>
        {filtered.length===0
          ? <p className="muted" style={{textAlign:"center",padding:"2rem"}}>No responses yet.</p>
          : (
            <div className="table-wrap">
              <table className="resp-table">
                <thead>
                  <tr>
                    <th style={{width:32}}></th>
                    <th>Date</th>
                    <th>Representative</th>
                    <th>Plant</th>
                    <th>Overall</th>
                    <th>Recommend</th>
                    <th>Contact</th>
                  </tr>
                </thead>
                <tbody>
                  {filtered.map(r=>(
                    <tr key={r.id} className={"resp-row"+(selected.has(r.id)?" sel":"")} onClick={()=>setDetailRow(r)}>
                      <td onClick={e=>e.stopPropagation()}>
                        <input type="checkbox" checked={selected.has(r.id)} onChange={()=>toggle(r.id)}/>
                      </td>
                      <td style={{whiteSpace:"nowrap"}}>{fmtDate(r.ts)}</td>
                      <td>
                        <div style={{fontWeight:500}}>{r.repName||"—"}</div>
                        <div style={{fontSize:11,color:"#999"}}>{r.email||""}</div>
                      </td>
                      <td>{r.plant||"—"}</td>
                      <td style={{fontWeight:700,color:r.overall?scoreColor(r.overall):"#333"}}>{fmt1(r.overall)}</td>
                      <td>{r.recommend==="yes"?"👍":r.recommend==="no"?"👎":"🤔"}</td>
                      <td style={{fontSize:12,color:"#777"}}>{r.contact||"—"}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )
        }
        <div style={{fontSize:11,color:"#bbb",marginTop:8,textAlign:"right"}}>Click any row to view full response</div>
      </div>

      {confirmDel&&(
        <div className="modal-overlay" onClick={()=>setConfirmDel(false)}>
          <div className="modal-box" onClick={e=>e.stopPropagation()}>
            <p style={{marginBottom:16}}>Delete {selected.size} selected response{selected.size>1?"s":""}? This cannot be undone.</p>
            <div className="modal-acts">
              <button className="btn-sm" onClick={()=>setConfirmDel(false)}>Cancel</button>
              <button className="btn-sm danger" onClick={doDelete}>Delete</button>
            </div>
          </div>
        </div>
      )}

      {detailRow&&<ResponseModal r={detailRow} questions={questions} onClose={()=>setDetailRow(null)}/>}
    </div>
  );
}

function App() {
  const [user,setUser]=useState(null);
  const [authLoading,setAuthLoading]=useState(true);
  const [tab,setTab]=useState("survey");
  const [responses,setResponses]=useState([]);
  const [plants,setPlants]=useState([]);
  const [questions,setQuestions]=useState([]);
  const [logoUrl,setLogoUrl]=useState("");
  const [surveyUrl,setSurveyUrl]=useState("");
  const [companyName,setCompanyName]=useState("");
  const [uploading,setUploading]=useState(false);

  useEffect(()=>{
    const unsub=firebase.auth().onAuthStateChanged(u=>{setUser(u);setAuthLoading(false);});
    return unsub;
  },[]);

  useEffect(()=>{
    const ref=firebase.database().ref(DB.responses);
    const h=ref.on("value",snap=>{
      const data=snap.val()||{};
      setResponses(Object.values(data).sort((a,b)=>(b.ts||0)-(a.ts||0)));
    });
    return ()=>ref.off("value",h);
  },[]);

  useEffect(()=>{
    const rp=firebase.database().ref(DB.plants);
    const hp=rp.on("value",snap=>{
      const d=snap.val()||{};
      setPlants(Object.values(d).sort((a,b)=>(a.name||"").localeCompare(b.name||"")));
    });
    const rq=firebase.database().ref(DB.questions);
    const hq=rq.on("value",snap=>{
      const d=snap.val()||{};
      setQuestions(Object.values(d).sort((a,b)=>(a.order||0)-(b.order||0)));
    });
    firebase.database().ref(DB.logo).on("value",s=>setLogoUrl(s.val()||""));
    firebase.database().ref(DB.surveyUrl).on("value",s=>setSurveyUrl(s.val()||""));
    firebase.database().ref(DB.companyName).on("value",s=>setCompanyName(s.val()||""));
  },[]);

  const handleLogoUpload=async file=>{
    if(!file) return;
    setUploading(true);
    try{
      const ref=firebase.storage().ref("csat_logo/logo");
      await ref.put(file);
      const url=await ref.getDownloadURL();
      await firebase.database().ref(DB.logo).set(url);
    }catch(e){alert("Logo upload failed: "+e.message);}
    setUploading(false);
  };

  if(authLoading) return <div className="loading">Loading…</div>;
  const isAdmin=!!user;

  return (
    <div className="app">
      <header className="topbar">
        <div className="topbar-left">
          {logoUrl&&<img src={logoUrl} className="topbar-logo" alt="logo" onError={e=>e.target.style.display="none"}/>}
          <span className="topbar-title">{companyName||"Customer Satisfaction Survey"}</span>
        </div>
        <nav className="topbar-nav">
          <button className={"nav-btn"+(tab==="survey"?" active":"")} onClick={()=>setTab("survey")}>Survey</button>
          {isAdmin&&<button className={"nav-btn"+(tab==="dashboard"?" active":"")} onClick={()=>setTab("dashboard")}>Dashboard</button>}
          {isAdmin&&<button className={"nav-btn"+(tab==="settings"?" active":"")} onClick={()=>setTab("settings")}>Settings</button>}
          {!isAdmin&&<button className="nav-btn" onClick={()=>setTab("login")}>Admin</button>}
          {isAdmin&&<button className="nav-btn logout" onClick={()=>firebase.auth().signOut()}>Logout</button>}
        </nav>
      </header>
      <div className="page-note">Responses are stored securely and power the shared admin dashboard.</div>
      <main>
        {tab==="survey"&&<SurveyForm plants={plants} questions={questions} logoUrl={logoUrl} companyName={companyName}/>}
        {tab==="login"&&!isAdmin&&<LoginForm/>}
        {tab==="dashboard"&&isAdmin&&<Dashboard responses={responses} plants={plants} questions={questions} surveyUrl={surveyUrl}/>}
        {tab==="settings"&&isAdmin&&<Settings plants={plants} questions={questions} logoUrl={logoUrl} companyName={companyName} surveyUrl={surveyUrl} onLogoUpload={handleLogoUpload} uploading={uploading}/>}
      </main>
    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);

</script>
