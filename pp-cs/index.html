// ── Helpers ───────────────────────────────────────────────────────────────────
const fmt1 = (n) => (typeof n === "number" && !isNaN(n)) ? n.toFixed(1) : "—";
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const scoreColor = (s) => s >= 4 ? "#3D8F5F" : s >= 3 ? "#D17B1A" : "#C94040";
const ts = () => Date.now();

// ── Star / number rating component ───────────────────────────────────────────
function StarRating({ value, onChange, label, ratingLabels }) {
  return (
    <div className="star-row">
      <div className="star-label">{label}</div>
      <div className="stars">
        {[1,2,3,4,5].map(s => (
          <button
            key={s} type="button"
            className={"star-btn" + (value >= s ? " active" : "")}
            onClick={() => onChange(s)}
            aria-label={ratingLabels[s-1]}
          >★</button>
        ))}
      </div>
      {value > 0 && (
        <span className="star-hint">{ratingLabels[value-1]}</span>
      )}
    </div>
  );
}

// ── Gauge ─────────────────────────────────────────────────────────────────────
function Gauge({ value, theme }) {
  const cx = 130, cy = 130, r = 95, sw = 22;
  const needleLen = 75;
  const pct = clamp((value - 1) / 4, 0, 1);
  const angle = -180 + pct * 180;
  const needleRad = (angle * Math.PI) / 180;
  const perpRad = needleRad + Math.PI / 2;
  const baseInset = 6, baseHW = 5, tailLen = 12, tailHW = 3.5;
  const nx = cx + needleLen * Math.cos(needleRad), ny = cy + needleLen * Math.sin(needleRad);
  const bx1 = cx + baseInset * Math.cos(needleRad) + baseHW * Math.cos(perpRad), by1 = cy + baseInset * Math.sin(needleRad) + baseHW * Math.sin(perpRad);
  const bx2 = cx + baseInset * Math.cos(needleRad) - baseHW * Math.cos(perpRad), by2 = cy + baseInset * Math.sin(needleRad) - baseHW * Math.sin(perpRad);
  const tx1 = cx - tailLen * Math.cos(needleRad) + tailHW * Math.cos(perpRad), ty1 = cy - tailLen * Math.sin(needleRad) + tailHW * Math.sin(perpRad);
  const tx2 = cx - tailLen * Math.cos(needleRad) - tailHW * Math.cos(perpRad), ty2 = cy - tailLen * Math.sin(needleRad) - tailHW * Math.sin(perpRad);
  const needlePoints = `${nx},${ny} ${bx1},${by1} ${tx1},${ty1} ${tx2},${ty2} ${bx2},${by2}`;
  const needleColor = theme === "light" ? "#1B3A6B" : "#7FA8E0";
  const arcColor = (s, e, col) => {
    const startA = (s * Math.PI) / 180, endA = (e * Math.PI) / 180;
    const x1 = cx + r * Math.cos(startA), y1 = cy + r * Math.sin(startA);
    const x2 = cx + r * Math.cos(endA), y2 = cy + r * Math.sin(endA);
    return <path d={`M ${x1} ${y1} A ${r} ${r} 0 0 1 ${x2} ${y2}`} fill="none" stroke={col} strokeWidth={sw} strokeLinecap="butt" />;
  };
  const displayVal = value > 0 ? fmt1(value) : "—";
  return (
    <svg viewBox="0 0 260 175" style={{ width: "100%", maxWidth: 300 }}>
      {arcColor(-180, -144, "#C94040")}
      {arcColor(-141, -108, "#E07830")}
      {arcColor(-105, -76,  "#D4AE20")}
      {arcColor(-73,  -40,  "#7FB348")}
      {arcColor(-37,  0,    "#3D8F5F")}
      <text x="22"  y="148" fontSize="12" fill={theme==="dark"?"#C8C2B4":"#6B6A62"} textAnchor="middle">1</text>
      <text x="130" y="30"  fontSize="12" fill={theme==="dark"?"#C8C2B4":"#6B6A62"} textAnchor="middle">3</text>
      <text x="238" y="148" fontSize="12" fill={theme==="dark"?"#C8C2B4":"#6B6A62"} textAnchor="middle">5</text>
      <line x1={cx-8} y1={cy - r + 12} x2={cx-8} y2={cy - r + 24} stroke={theme==="dark"?"#C8C2B4":"#6B6A62"} strokeWidth="1.5" />
      <line x1={cx+8} y1={cy - r + 12} x2={cx+8} y2={cy - r + 24} stroke={theme==="dark"?"#C8C2B4":"#6B6A62"} strokeWidth="1.5" />
      <polygon points={needlePoints} fill={needleColor} stroke={needleColor} strokeWidth="0.5" strokeLinejoin="round" />
      <circle cx={cx} cy={cy} r={12} fill={theme==="dark"?"#2E2C28":"#F5F3EE"} stroke={theme==="dark"?"#5A5650":"#D0CBBD"} strokeWidth={2} />
      <circle cx={cx} cy={cy} r={5} fill="#3D8F5F" />
      <text x={cx} y={cy + 40} fontSize="28" fontWeight="700" textAnchor="middle" fill={theme==="dark"?"#EDEAE2":"#201F1B"} fontFamily="'IBM Plex Mono', monospace">{displayVal}</text>
      <text x={cx} y={cy + 58} fontSize="11" textAnchor="middle" fill={theme==="dark"?"#9E9A90":"#6B6A62"}>OUT OF 5.0</text>
    </svg>
  );
}

// ── Stat card ─────────────────────────────────────────────────────────────────
function StatCard({ label, value, sub, accent }) {
  const vs = String(value);
  const fontSize = vs.length > 12 ? 18 : vs.length > 8 ? 24 : 32;
  return (
    <div className="stat-card">
      <div className="stat-label">{label}</div>
      <div className="stat-value" style={{ ...(accent ? { color: accent } : {}), fontSize, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
        {value}
      </div>
      {sub && <div className="stat-sub">{sub}</div>}
    </div>
  );
}

// ── Survey form ───────────────────────────────────────────────────────────────
function SurveyForm({ t, lang, onChangeLang, products, onSubmit }) {
  const [step, setStep] = useState(0);
  const [ratings, setRatings] = useState({});
  const [recommend, setRecommend] = useState(null);
  const [name, setName] = useState("");
  const [company, setCompany] = useState("");
  const [product, setProduct] = useState("");
  const [comments, setComments] = useState("");
  const [error, setError] = useState("");
  const [submitting, setSubmitting] = useState(false);
  const [done, setDone] = useState(false);

  const setRating = (cat, val) => setRatings(r => ({ ...r, [cat]: val }));

  const validateStep = () => {
    if (step === 0) {
      if (!product) { setError("Please select a product."); return false; }
    }
    if (step === 1) {
      const missing = CATEGORIES.filter(c => !ratings[c.id]);
      if (missing.length) { setError(t.required); return false; }
    }
    if (step === 2) {
      if (!recommend) { setError(t.required); return false; }
    }
    setError("");
    return true;
  };

  const handleNext = () => { if (validateStep()) setStep(s => s + 1); };
  const handleBack = () => { setError(""); setStep(s => s - 1); };

  const handleSubmit = async () => {
    if (!validateStep()) return;
    setSubmitting(true);
    try {
      const overall = +(CATEGORIES.reduce((sum, c) => sum + (ratings[c.id] || 0), 0) / CATEGORIES.length).toFixed(2);
      await onSubmit({ name, company, product, ratings, recommend, comments, overall, lang, ts: ts() });
      setDone(true);
    } catch (e) {
      setError("Submission failed. Please try again.");
    }
    setSubmitting(false);
  };

  const reset = () => {
    setStep(0); setRatings({}); setRecommend(null);
    setName(""); setCompany(""); setProduct(""); setComments(""); setError(""); setDone(false);
  };

  if (done) return (
    <div className="paper-card">
      <div className="lang-strip">
        {LANGUAGES.map(l => (
          <button key={l.code} className={"lang-btn" + (lang === l.code ? " active" : "")} onClick={() => onChangeLang(l.code)}>{l.label}</button>
        ))}
      </div>
      <div className="done-screen">
        <div className="done-icon">✓</div>
        <h2>{t.thankYou}</h2>
        <p>{t.thankYouSub}</p>
        <button className="submit-btn" onClick={reset}>{t.anotherResponse}</button>
      </div>
    </div>
  );

  const steps = [
    // Step 0: info
    <div key="s0">
      <p className="step-heading">{t.name}</p>
      <input className="text-input" value={name} onChange={e => setName(e.target.value)} placeholder={t.name} />
      <p className="step-heading">{t.company} *</p>
      <input className="text-input" value={company} onChange={e => setCompany(e.target.value)} placeholder={t.company} />
      <p className="step-heading">{t.product} *</p>
      {products && products.length ? (
        <select className="text-input" value={product} onChange={e => setProduct(e.target.value)}>
          <option value="">{t.selectProduct}</option>
          {products.map(p => <option key={p} value={p}>{p}</option>)}
        </select>
      ) : (
        <input className="text-input" value={product} onChange={e => setProduct(e.target.value)} placeholder={t.product} />
      )}
    </div>,

    // Step 1: ratings
    <div key="s1">
      {CATEGORIES.map(c => (
        <StarRating key={c.id} label={t[c.key]} value={ratings[c.id] || 0} onChange={v => setRating(c.id, v)} ratingLabels={t.ratingLabels} />
      ))}
    </div>,

    // Step 2: recommend + comments
    <div key="s2">
      <p className="step-heading">{t.wouldRecommend} *</p>
      <div className="recommend-btns">
        {[["yes", t.yes, "👍"], ["maybe", t.maybe, "🤔"], ["no", t.no, "👎"]].map(([val, label, icon]) => (
          <button key={val} type="button" className={"rec-btn" + (recommend === val ? " active" : "")} onClick={() => setRecommend(val)}>
            <span>{icon}</span>{label}
          </button>
        ))}
      </div>
      <p className="step-heading" style={{ marginTop: 24 }}>{t.comments}</p>
      <textarea className="text-input" rows={4} value={comments} onChange={e => setComments(e.target.value)} placeholder={t.commentsPlaceholder} />
    </div>,
  ];

  const stepTitles = [t.name + " & " + t.product, t.categoryScores, t.wouldRecommend];

  return (
    <div className="paper-card">
      <div className="lang-strip">
        {LANGUAGES.map(l => (
          <button key={l.code} className={"lang-btn" + (lang === l.code ? " active" : "")} onClick={() => onChangeLang(l.code)}>{l.label}</button>
        ))}
      </div>
      <div className="survey-inner">
        <div className="progress-bar">
          {[0,1,2].map(i => (
            <div key={i} className={"progress-step" + (i <= step ? " done" : "") + (i === step ? " active" : "")} />
          ))}
        </div>
        <div className="step-num">Step {step + 1} of 3</div>
        {error && <div className="error-msg">{error}</div>}
        {steps[step]}
        <div className="form-actions">
          {step > 0 && <button className="back-btn" onClick={handleBack}>{t.back}</button>}
          {step < 2
            ? <button className="submit-btn" onClick={handleNext}>{t.next} →</button>
            : <button className="submit-btn" onClick={handleSubmit} disabled={submitting}>{submitting ? t.submitting : t.submit}</button>
          }
        </div>
      </div>
    </div>
  );
}

// ── Login form ────────────────────────────────────────────────────────────────
function LoginForm({ t }) {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);

  const handleLogin = async () => {
    setLoading(true); setError("");
    try {
      await firebase.auth().signInWithEmailAndPassword(email, password);
    } catch {
      setError(t.loginError);
    }
    setLoading(false);
  };

  return (
    <div className="login-wrap">
      <div className="login-card">
        <h2>{t.adminLogin}</h2>
        {error && <div className="error-msg">{error}</div>}
        <input className="text-input" type="email" placeholder={t.email} value={email} onChange={e => setEmail(e.target.value)} />
        <input className="text-input" type="password" placeholder={t.password} value={password} onChange={e => setPassword(e.target.value)} onKeyDown={e => e.key === "Enter" && handleLogin()} />

}

// ── Dashboard ─────────────────────────────────────────────────────────────────
function Dashboard({ t, theme, responses, products, onDelete, onExportPdf }) {
  const [search, setSearch] = useState("");
  const [productFilter, setProductFilter] = useState("__all__");
  const [selected, setSelected] = useState(new Set());
  const [confirmOpen, setConfirmOpen] = useState(false);
  const [exportBusy, setExportBusy] = useState(false);

  const filtered = useMemo(() => {
    return responses.filter(r => {
      if (productFilter !== "__all__" && r.product !== productFilter) return false;
      if (search) {
        const q = search.toLowerCase();
        return (r.name||"").toLowerCase().includes(q) || (r.company||"").toLowerCase().includes(q) || (r.product||"").toLowerCase().includes(q);
      }
      return true;
    });
  }, [responses, productFilter, search]);

  const avg = (key) => {
    const vals = filtered.map(r => r.ratings?.[key]).filter(Boolean);
    return vals.length ? vals.reduce((a,b) => a+b, 0) / vals.length : 0;
  };

  const overallAvg = filtered.length ? filtered.reduce((a,r) => a + (r.overall||0), 0) / filtered.length : 0;
  const recommendYes = filtered.filter(r => r.recommend === "yes").length;
  const recommendPct = filtered.length ? Math.round(recommendYes / filtered.length * 100) : 0;
  const belowAvgCount = CATEGORIES.filter(c => avg(c.id) > 0 && avg(c.id) < 3).length;

  const categoryData = CATEGORIES.map(c => ({ name: t[c.key], score: +avg(c.id).toFixed(2) }));
  const strongest = [...categoryData].filter(c => c.score > 0).sort((a,b) => b.score - a.score)[0];
  const weakest   = [...categoryData].filter(c => c.score > 0).sort((a,b) => a.score - b.score)[0];

  const toggleSelect = (id) => setSelected(s => { const n = new Set(s); n.has(id) ? n.delete(id) : n.add(id); return n; });
  const selectAll = () => setSelected(new Set(filtered.map(r => r.id)));
  const deselectAll = () => setSelected(new Set());

  const handleDelete = async () => {
    setConfirmOpen(false);
    await onDelete([...selected]);
    setSelected(new Set());
  };

  const handleExport = async () => {
    setExportBusy(true);
    try { await onExportPdf(filtered, categoryData, overallAvg, recommendPct, strongest, weakest, belowAvgCount); } catch {}
    setExportBusy(false);
  };

  const fmtDate = (ts) => {
    if (!ts) return "—";
    return new Date(ts).toLocaleDateString();
  };

  return (
    <div className="dashboard">
      {/* Top row: product filter + export */}
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 10, marginBottom: 16 }}>
        <div className="pill-bar">
          <button className={"pill" + (productFilter === "__all__" ? " active" : "")} onClick={() => setProductFilter("__all__")}>{t.filterAll}</button>
          {products.map(p => (
            <button key={p} className={"pill" + (productFilter === p ? " active" : "")} onClick={() => setProductFilter(p)}>{p}</button>
          ))}
        </div>
        <button className="export-btn" onClick={handleExport} disabled={exportBusy || !filtered.length}>
          {exportBusy ? "…" : t.exportPdf}
        </button>
      </div>

      {/* KPI cards */}
      <div className="kpi-grid">
        <StatCard label={t.totalResponses} value={filtered.length} />
        <StatCard label={t.avgSatisfaction} value={overallAvg > 0 ? fmt1(overallAvg) + " / 5" : "—"} accent={overallAvg > 0 ? scoreColor(overallAvg) : undefined} sub={t.outOf5} />
        <StatCard label={t.recommendRate} value={filtered.length ? recommendPct + "%" : "—"} accent={recommendPct >= 70 ? "#3D8F5F" : recommendPct >= 50 ? "#D17B1A" : "#C94040"} sub={`${recommendYes} of ${filtered.length}`} />
        <StatCard label={t.belowAvg} value={belowAvgCount} accent={belowAvgCount > 0 ? "#C94040" : undefined} sub={belowAvgCount === 0 ? t.noneBelow : undefined} />
      </div>

      {/* Gauge + category bars */}
      <div className="gauge-row">
        <div className="gauge-panel">
          <Gauge value={overallAvg} theme={theme} />
          <div className="gauge-label">{t.avgSatisfaction}</div>
        </div>
        <div className="category-panel">
          {categoryData.map(c => (
            <div key={c.name} className="cat-row">
              <div className="cat-name">{c.name}</div>
              <div className="cat-bar-wrap">
                <div className="cat-bar" style={{ width: c.score > 0 ? `${(c.score/5)*100}%` : "0%", background: scoreColor(c.score) }} />
              </div>
              <div className="cat-score" style={{ color: scoreColor(c.score) }}>{c.score > 0 ? fmt1(c.score) : "—"}</div>
            </div>
          ))}
        </div>
      </div>

      {/* Recommend breakdown */}
      {filtered.length > 0 && (
        <div className="panel" style={{ marginBottom: 20 }}>
          <div className="panel-title">{t.wouldRecommend}</div>
          <div className="recommend-summary">
            {[["yes","👍",t.yes],["maybe","🤔",t.maybe],["no","👎",t.no]].map(([val, icon, label]) => {
              const count = filtered.filter(r => r.recommend === val).length;
              const pct = filtered.length ? Math.round(count / filtered.length * 100) : 0;
              return (
                <div key={val} className="rec-summary-item">
                  <div className="rec-summary-icon">{icon}</div>
                  <div className="rec-summary-label">{label}</div>
                  <div className="rec-summary-count">{count}</div>
                  <div className="rec-summary-pct">{pct}%</div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* Responses table */}
      <div className="panel">
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14, flexWrap: "wrap" }}>
          <div className="panel-title" style={{ marginBottom: 0 }}>{t.responses} ({filtered.length})</div>
          <input className="search-input" placeholder={t.search} value={search} onChange={e => setSearch(e.target.value)} />
          <div style={{ marginLeft: "auto", display: "flex", gap: 8 }}>
            <button className="sm-btn" onClick={selectAll}>{t.selectAll}</button>
            <button className="sm-btn" onClick={deselectAll}>{t.deselectAll}</button>
            {selected.size > 0 && (
              <button className="sm-btn danger" onClick={() => setConfirmOpen(true)}>
                {t.deleteSelected} ({selected.size})
              </button>
            )}
          </div>
        </div>
        {filtered.length === 0 ? (
          <p style={{ color: "var(--text-muted, #9E9A90)", textAlign: "center", padding: "2rem 0" }}>{t.noResponses}</p>
        ) : (
          <div className="table-wrap">
            <table className="resp-table">
              <thead>
                <tr>
                  <th></th>
                  <th>{t.date}</th>
                  <th>{t.customer}</th>
                  <th>{t.product}</th>
                  <th>{t.overall}</th>
                  <th>{t.recommend}</th>
                </tr>
              </thead>
              <tbody>
                {filtered.map(r => (
                  <tr key={r.id} className={selected.has(r.id) ? "selected" : ""}>
                    <td><input type="checkbox" checked={selected.has(r.id)} onChange={() => toggleSelect(r.id)} /></td>
                    <td>{fmtDate(r.ts)}</td>
                    <td>{r.name || r.company || "—"}</td>
                    <td>{r.product || "—"}</td>
                    <td style={{ color: scoreColor(r.overall), fontWeight: 700 }}>{fmt1(r.overall)}</td>
                    <td>{r.recommend === "yes" ? "👍" : r.recommend === "no" ? "👎" : "🤔"}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>

      {/* Confirm delete dialog */}
      {confirmOpen && (
        <div className="modal-overlay">
          <div className="modal-box">
            <p>{t.confirmDelete}</p>
            <div style={{ display: "flex", gap: 12, justifyContent: "flex-end", marginTop: 16 }}>
              <button className="sm-btn" onClick={() => setConfirmOpen(false)}>{t.cancel}</button>
              <button className="sm-btn danger" onClick={handleDelete}>{t.confirm}</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── PDF export ────────────────────────────────────────────────────────────────
async function generatePdf({ t, responses, categoryData, overallAvg, recommendPct, strongest, weakest, belowAvgCount, logoUrl }) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });
  const W = 210, H = 297, margin = 14, contentW = W - margin * 2;

  const hex2rgb = h => { h = h.replace("#",""); return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)]; };
  const setRgb = (h, mode="fill") => { const [r,g,b] = hex2rgb(h); mode === "fill" ? doc.setFillColor(r,g,b) : doc.setDrawColor(r,g,b); };

  // ── Header ──────────────────────────────────────────────────────────────────
  setRgb("#1B3A6B", "fill"); doc.rect(0, 0, W, 36, "F");
  if (logoUrl) {
    try { doc.addImage(logoUrl, "PNG", margin, 6, 24, 24); } catch {}
  }
  doc.setTextColor(255,255,255);
  doc.setFontSize(16); doc.setFont("helvetica", "bold");
  doc.text(t.title, W/2, 17, { align: "center" });
  doc.setFontSize(9); doc.setFont("helvetica", "normal");
  doc.text(new Date().toLocaleDateString(), W/2, 27, { align: "center" });
  doc.setFontSize(8);
  doc.text(`${responses.length} responses`, W - margin, 27, { align: "right" });

  let y = 44;

  // ── KPI row ─────────────────────────────────────────────────────────────────
  const kpiW = (contentW - 9) / 4, kpiH = 28;
  const kpis = [
    { label: t.totalResponses, value: String(responses.length) },
    { label: t.avgSatisfaction, value: overallAvg > 0 ? fmt1(overallAvg) + " / 5.0" : "—", accent: overallAvg > 0 ? hex2rgb(scoreColor(overallAvg)) : null },
    { label: t.recommendRate, value: responses.length ? recommendPct + "%" : "—", accent: recommendPct >= 70 ? [61,143,95] : recommendPct >= 50 ? [209,123,26] : [201,64,64] },
    { label: t.belowAvg, value: String(belowAvgCount), accent: belowAvgCount > 0 ? [201,64,64] : null },
  ];
  kpis.forEach((k, i) => {
    const kx = margin + i * (kpiW + 3), ky = y;
    doc.setFillColor(255,255,255); doc.setDrawColor(208,203,189); doc.setLineWidth(0.3);
    doc.roundedRect(kx, ky, kpiW, kpiH, 2, 2, "FD");
    doc.setFontSize(7.5); doc.setFont("helvetica","normal"); doc.setTextColor(107,106,98);
    doc.text(k.label.toUpperCase(), kx+3, ky+7);
    const vSize = k.value.length > 12 ? 10 : 14;
    doc.setFontSize(vSize); doc.setFont("helvetica","bold");
    if (k.accent) doc.setTextColor(...k.accent); else doc.setTextColor(30,34,41);
    const vLines = doc.splitTextToSize(k.value, kpiW - 6);
    vLines.forEach((ln, li) => doc.text(ln, kx+3, ky+16+li*7));
  });
  y += kpiH + 8;

  // ── Gauge + categories ───────────────────────────────────────────────────────
  const gCardW = contentW * 0.42, catCardW = contentW - gCardW - 4, rowH = 70;
  doc.setFillColor(255,255,255); doc.setDrawColor(208,203,189); doc.setLineWidth(0.3);
  doc.roundedRect(margin, y, gCardW, rowH, 3, 3, "FD");
  doc.roundedRect(margin + gCardW + 4, y, catCardW, rowH, 3, 3, "FD");

  // Draw gauge arc
  const gCx = margin + gCardW/2, gCy = y + rowH - 14, gR = 20, gSW = 4.5;
  const arcSeg = (sa, ea, col) => {
    const steps = 30;
    const pts = [];
    for (let i=0; i<=steps; i++) { const a = sa + (ea-sa)*(i/steps); pts.push([gCx+gR*Math.cos(a), gCy-gR*Math.sin(a)]); }
    setRgb(col, "draw"); doc.setLineWidth(gSW); doc.setLineCap("butt");
    doc.lines(pts.slice(1).map((p,i)=>[p[0]-pts[i][0], p[1]-pts[i][1]]), pts[0][0], pts[0][1], [1,1], "S");
  };
  arcSeg(Math.PI, Math.PI*0.8, "#C94040"); arcSeg(Math.PI*0.78, Math.PI*0.6, "#E07830");
  arcSeg(Math.PI*0.58, Math.PI*0.42, "#D4AE20"); arcSeg(Math.PI*0.40, Math.PI*0.22, "#7FB348");
  arcSeg(Math.PI*0.20, 0, "#3D8F5F");

  // Needle
  if (overallAvg > 0) {
    const pct = clamp((overallAvg-1)/4, 0, 1);
    const na = Math.PI - pct * Math.PI;
    const nLen = gR - 3;
    const ndx = Math.cos(na), ndy = -Math.sin(na);
    const pdx = Math.sin(na), pdy = Math.cos(na);
    const baseInset = 1.6, baseHW = 1.1, tailLen = 2.6, tailHW = 0.8;
    const tipX = gCx+nLen*ndx, tipY = gCy+nLen*ndy;
    const b1X = gCx+baseInset*ndx+baseHW*pdx, b1Y = gCy+baseInset*ndy+baseHW*pdy;
    const b2X = gCx+baseInset*ndx-baseHW*pdx, b2Y = gCy+baseInset*ndy-baseHW*pdy;
    const t1X = gCx-tailLen*ndx+tailHW*pdx, t1Y = gCy-tailLen*ndy+tailHW*pdy;
    const t2X = gCx-tailLen*ndx-tailHW*pdx, t2Y = gCy-tailLen*ndy-tailHW*pdy;
    doc.setFillColor(27,58,107); doc.setDrawColor(27,58,107); doc.setLineWidth(0.1);
    doc.lines([[b1X-tipX,b1Y-tipY],[t1X-b1X,t1Y-b1Y],[t2X-t1X,t2Y-t1Y],[b2X-t2X,b2Y-t2Y]], tipX, tipY, [1,1], "FD", true);
  }
  // Pivot
  doc.setFillColor(245,243,238); doc.setDrawColor(208,203,189); doc.setLineWidth(0.5);
  doc.circle(gCx, gCy, 3, "FD");
  doc.setFillColor(61,143,95); doc.circle(gCx, gCy, 1.5, "F");
  // Score text
  doc.setFontSize(14); doc.setFont("helvetica","bold"); doc.setTextColor(30,34,41);
  doc.text(overallAvg > 0 ? fmt1(overallAvg) : "—", gCx, gCy - gR - 3, { align: "center" });
  doc.setFontSize(7); doc.setFont("helvetica","normal"); doc.setTextColor(107,106,98);
  doc.text("OUT OF 5.0", gCx, gCy - gR + 4, { align: "center" });
  doc.text("1", margin + 2, gCy + 3); doc.text("5", margin + gCardW - 6, gCy + 3);

  // Category bars
  const catX = margin + gCardW + 7, catY = y + 6, barMaxW = catCardW - 30;
  doc.setFontSize(7.5); doc.setFont("helvetica","bold"); doc.setTextColor(30,34,41);
  doc.text(t.categoryScores, catX, catY);
  categoryData.forEach((c, i) => {
    const cy2 = catY + 8 + i * 10;
    doc.setFontSize(6.5); doc.setFont("helvetica","normal"); doc.setTextColor(60,59,55);
    doc.text(c.name, catX, cy2 + 2.5);
    const barW = c.score > 0 ? (c.score/5) * barMaxW : 0;
    const [br,bg,bb] = hex2rgb(scoreColor(c.score));
    doc.setFillColor(220,215,200); doc.roundedRect(catX, cy2+3.5, barMaxW, 3, 0.5, 0.5, "F");
    if (barW > 0) { doc.setFillColor(br,bg,bb); doc.roundedRect(catX, cy2+3.5, barW, 3, 0.5, 0.5, "F"); }
    doc.setFontSize(6.5); doc.setFont("helvetica","bold"); doc.setTextColor(br,bg,bb);
    doc.text(c.score > 0 ? fmt1(c.score) : "—", catX + barMaxW + 3, cy2 + 6);
  });
  y += rowH + 8;

  // ── Recommend bar ────────────────────────────────────────────────────────────
  doc.setFillColor(255,255,255); doc.setDrawColor(208,203,189); doc.setLineWidth(0.3);
  doc.roundedRect(margin, y, contentW, 22, 3, 3, "FD");
  doc.setFontSize(8); doc.setFont("helvetica","bold"); doc.setTextColor(30,34,41);
  doc.text(t.wouldRecommend, margin+4, y+7);
  const recData = [["yes","👍",t.yes,[61,143,95]],["maybe","🤔",t.maybe,[209,123,26]],["no","👎",t.no,[201,64,64]]];
  recData.forEach(([val,,label,rgb],i) => {
    const cnt = responses.filter(r=>r.recommend===val).length;
    const pct = responses.length ? Math.round(cnt/responses.length*100) : 0;
    const rx = margin+4 + i*(contentW/3);
    doc.setFillColor(...rgb); doc.setFontSize(10); doc.setFont("helvetica","bold");
    doc.setTextColor(...rgb); doc.text(`${pct}%`, rx, y+17);
    doc.setFontSize(7); doc.setFont("helvetica","normal"); doc.setTextColor(107,106,98);
    doc.text(`${label} (${cnt})`, rx + 12, y+17);
  });
  y += 30;

  // ── Response table ───────────────────────────────────────────────────────────
  doc.setFontSize(8); doc.setFont("helvetica","bold"); doc.setTextColor(30,34,41);
  doc.text(t.responses, margin, y+4);
  y += 8;
  const cols = [22, 38, 50, 22, 22];
  const headers = [t.date, t.customer, t.product, t.overall, t.recommend];
  let rx2 = margin;
  doc.setFontSize(6.5); doc.setFont("helvetica","bold"); doc.setTextColor(107,106,98);
  headers.forEach((h,i) => { doc.text(h.toUpperCase(), rx2+2, y+3.5); rx2 += cols[i]; });
  doc.setDrawColor(208,203,189); doc.setLineWidth(0.2);
  doc.line(margin, y+5, margin+contentW, y+5);
  y += 7;

  responses.slice(0, 50).forEach((r, ri) => {
    if (y > H - 20) { doc.addPage(); y = 20; }
    if (ri % 2 === 0) { doc.setFillColor(248,247,244); doc.rect(margin, y-1, contentW, 7, "F"); }
    doc.setFontSize(6.5); doc.setFont("helvetica","normal"); doc.setTextColor(30,34,41);
    let rx3 = margin;
    const row = [
      new Date(r.ts||Date.now()).toLocaleDateString(),
      (r.name || r.company || "—").slice(0,22),
      (r.product||"—").slice(0,28),
      r.overall ? fmt1(r.overall) : "—",
      r.recommend === "yes" ? "Yes" : r.recommend === "no" ? "No" : "Maybe",
    ];
    row.forEach((v,i) => {
      if (i === 3 && r.overall) { const [cr,cg,cb] = hex2rgb(scoreColor(r.overall)); doc.setTextColor(cr,cg,cb); }
      else doc.setTextColor(30,34,41);
      doc.text(v, rx3+2, y+4);
      rx3 += cols[i];
    });
    y += 7;
  });

  doc.save("csat-report.pdf");
}

// ── App ───────────────────────────────────────────────────────────────────────
function App() {
  const [user, setUser] = useState(null);
  const [lang, setLang] = useState("en");
  const [tab, setTab] = useState("survey");
  const [responses, setResponses] = useState([]);
  const [products, setProducts] = useState([]);
  const [logoUrl, setLogoUrl] = useState("");
  const [theme, setTheme] = useState("light");

  const t = T[lang] || T.en;

  useEffect(() => {
    const unsub = firebase.auth().onAuthStateChanged(u => setUser(u));
    return unsub;
  }, []);

  useEffect(() => {
    const ref = firebase.database().ref(CSAT_RESPONSES_PATH);
    const handler = ref.on("value", snap => {
      const data = snap.val() || {};
      setResponses(Object.entries(data).map(([id, v]) => ({ id, ...v })).sort((a,b) => (b.ts||0)-(a.ts||0)));
    });
    return () => ref.off("value", handler);
  }, []);

  useEffect(() => {
    firebase.database().ref(CSAT_CONFIG_PATH + "/products").on("value", snap => {
      const data = snap.val() || {};
      setProducts(Object.values(data));
    });
    firebase.database().ref(CSAT_SETTINGS_PATH + "/logoUrl").on("value", snap => {
      setLogoUrl(snap.val() || "");
    });
    firebase.database().ref(CSAT_SETTINGS_PATH + "/theme").on("value", snap => {
      if (snap.val()) setTheme(snap.val());
    });
  }, []);

  const submitResponse = async (data) => {
    const ref = firebase.database().ref(CSAT_RESPONSES_PATH).push();
    await ref.set({ ...data, id: ref.key });
  };

  const deleteResponses = async (ids) => {
    const updates = {};
    ids.forEach(id => { updates[id] = null; });
    await firebase.database().ref(CSAT_RESPONSES_PATH).update(updates);
  };

  const saveProduct = async (name) => {
    const key = name.replace(/\s+/g, "_").toLowerCase();
    await firebase.database().ref(CSAT_CONFIG_PATH + "/products/" + key).set(name);
  };

  const deleteProduct = async (name) => {
    const key = name.replace(/\s+/g, "_").toLowerCase();
    await firebase.database().ref(CSAT_CONFIG_PATH + "/products/" + key).remove();
  };

  const saveLogo = async (url) => {
    await firebase.database().ref(CSAT_SETTINGS_PATH + "/logoUrl").set(url);
    setLogoUrl(url);
  };

  const handleExportPdf = async (filteredResp, categoryData, overallAvg, recommendPct, strongest, weakest, belowAvgCount) => {
    await generatePdf({ t, responses: filteredResp, categoryData, overallAvg, recommendPct, strongest, weakest, belowAvgCount, logoUrl });
  };

  const isAdmin = !!user;

  return (
    <div className={"app-root " + theme} data-theme={theme}>
      {/* Top bar */}
      <header className="top-bar">
        {logoUrl
          ? <img src={logoUrl} alt="logo" className="top-logo" onError={e => e.target.style.display="none"} />
          : <div className="top-logo-text">◆ CSAT</div>
        }
        <div className="top-title">{t.title}</div>
        <div className="top-actions">
          <button className={"tab-btn" + (tab==="survey"?" active":"")} onClick={() => setTab("survey")}>{t.survey}</button>
          {isAdmin && <button className={"tab-btn" + (tab==="dashboard"?" active":"")} onClick={() => setTab("dashboard")}>{t.dashboard}</button>}
          {isAdmin && <button className={"tab-btn" + (tab==="settings"?" active":"")} onClick={() => setTab("settings")}>{t.settings}</button>}
          {!isAdmin && <button className={"tab-btn"} onClick={() => setTab("login")}>Admin</button>}
          {isAdmin && <button className="tab-btn logout" onClick={() => firebase.auth().signOut()}>{t.logout}</button>}
          <button className="theme-toggle" onClick={() => { const n = theme==="light"?"dark":"light"; setTheme(n); firebase.database().ref(CSAT_SETTINGS_PATH+"/theme").set(n); }}>{theme==="light"?"🌙":"☀️"}</button>
        </div>
      </header>

      {/* Storage note */}
      <div className="storage-note">{t.storageNote}</div>

      {/* Body */}
      <main className="main-body">
        {tab === "survey" && (
          <SurveyForm t={t} lang={lang} onChangeLang={setLang} products={products} onSubmit={submitResponse} />
        )}
        {tab === "login" && !isAdmin && <LoginForm t={t} />}
        {tab === "dashboard" && isAdmin && (
          <Dashboard t={t} theme={theme} responses={responses} products={products} onDelete={deleteResponses} onExportPdf={handleExportPdf} />
        )}
        {tab === "settings" && isAdmin && (
          <SettingsPanel t={t} products={products} onSaveProduct={saveProduct} onDeleteProduct={deleteProduct} logoUrl={logoUrl} onSaveLogo={saveLogo} />
        )}
        {tab === "login" && isAdmin && (() => { setTab("dashboard"); return null; })()}
      </main>
    </div>
  );
}

// ── Mount ─────────────────────────────────────────────────────────────────────
const rootEl = document.getElementById("root");
const root = ReactDOM.createRoot(rootEl);
root.render(<App />);
</script>

<style>

body { font-family: 'Inter', sans-serif; font-size: 14px; line-height: 1.5; }

.top-logo-text { font-size: 20px; font-weight: 700; color: var(--accent3); letter-spacing: 1px; }

.top-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tab-btn { padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--text-sec); cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.15s; }
.tab-btn:hover { background: var(--border); color: var(--text); }
.tab-btn.active { background: var(--accent3); color: #fff; border-color: var(--accent3); }

.theme-toggle { background: none; border: none; cursor: pointer; font-size: 18px; padding: 4px; }

/* ── Storage note ── */
.storage-note { font-size: 11px; color: var(--text-sec); text-align: center; padding: 5px; background: var(--bg-panel); border-bottom: 1px solid var(--border); }

/* ── Main ── */
.main-body { max-width: 900px; margin: 0 auto; padding: 24px 16px 48px; }

/* ── Paper card (survey) ── */
.paper-card { background: var(--bg-panel); border-radius: 14px; border: 1px solid var(--border); overflow: hidden; max-width: 560px; margin: 0 auto; }
.lang-strip { display: flex; border-bottom: 1px solid var(--border); }
.lang-btn { flex: 1; padding: 10px 8px; background: transparent; border: none; border-right: 1px solid var(--border); color: var(--text-sec); cursor: pointer; font-size: 13px; font-weight: 500; }
.lang-btn:last-child { border-right: none; }
.lang-btn:hover { background: var(--bg); }
.lang-btn.active { background: var(--accent3); color: #fff; }

/* ── Progress ── */
.progress-bar { display: flex; gap: 6px; margin-bottom: 8px; }
.progress-step { flex: 1; height: 4px; border-radius: 2px; background: var(--border); transition: background 0.3s; }
.progress-step.done { background: var(--accent3); }
.step-num { font-size: 11px; color: var(--text-sec); margin-bottom: 20px; }

/* ── Form elements ── */
.step-heading { font-size: 13px; font-weight: 600; color: var(--text-sec); margin: 16px 0 6px; text-transform: uppercase; letter-spacing: 0.5px; }
.text-input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font-size: 14px; font-family: inherit; outline: none; }
.text-input:focus { border-color: var(--accent3); }
select.text-input { cursor: pointer; }
textarea.text-input { resize: vertical; }
.error-msg { background: #FEE; color: #C94040; border: 1px solid #F9C; border-radius: 6px; padding: 8px 12px; font-size: 13px; margin-bottom: 14px; }

/* ── Stars ── */
.star-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.star-row:last-child { border-bottom: none; }
.star-label { flex: 1; font-size: 13px; font-weight: 500; min-width: 140px; }
.stars { display: flex; gap: 2px; }
.star-btn { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--border); padding: 2px; transition: color 0.12s, transform 0.1s; }
.star-btn:hover { transform: scale(1.15); }
.star-btn.active { color: #F5A623; }
.star-hint { font-size: 11px; color: var(--text-sec); min-width: 60px; }

/* ── Recommend buttons ── */
.recommend-btns { display: flex; gap: 12px; margin-top: 10px; }
.rec-btn { flex: 1; padding: 12px 8px; border: 2px solid var(--border); border-radius: 10px; background: transparent; color: var(--text); cursor: pointer; font-size: 14px; font-weight: 500; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: all 0.15s; }
.rec-btn span { font-size: 22px; }
.rec-btn:hover { border-color: var(--accent3); color: var(--accent3); }
.rec-btn.active { border-color: var(--accent3); background: var(--accent3); color: #fff; }

/* ── Form actions ── */
.form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; }
.submit-btn { padding: 11px 26px; background: var(--accent3); color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity 0.15s; }
.submit-btn:hover:not(:disabled) { opacity: 0.88; }
.submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.back-btn { padding: 11px 18px; background: transparent; border: 1px solid var(--border); border-radius: 8px; color: var(--text-sec); font-size: 14px; cursor: pointer; }
.back-btn:hover { background: var(--bg); }

/* ── Done screen ── */
.done-screen { padding: 40px 24px; text-align: center; }
.done-icon { font-size: 52px; color: var(--accent2); margin-bottom: 16px; }
.done-screen h2 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
.done-screen p { color: var(--text-sec); margin-bottom: 28px; }

/* ── Login ── */
.login-wrap { display: flex; justify-content: center; padding: 40px 0; }
.login-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 14px; padding: 32px 28px; width: 340px; display: flex; flex-direction: column; gap: 14px; }
.login-card h2 { text-align: center; font-size: 18px; font-weight: 700; margin-bottom: 4px; }

/* ── Dashboard ── */
.dashboard {}
.pill-bar { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--text-sec); cursor: pointer; font-size: 12px; font-weight: 500; }
.pill:hover { background: var(--border); }
.pill.active { background: var(--accent3); color: #fff; border-color: var(--accent3); }
.export-btn { padding: 7px 16px; background: var(--accent3); color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
.export-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
@media(max-width:680px){ .kpi-grid { grid-template-columns: repeat(2,1fr); } }
.stat-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; }
.stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-sec); margin-bottom: 8px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat-value { font-family: 'IBM Plex Mono', monospace; font-weight: 700; color: var(--text); line-height: 1.2; }
.stat-sub { font-size: 12px; color: var(--text-sec); margin-top: 5px; }

/* ── Gauge row ── */
.gauge-row { display: flex; gap: 14px; margin-bottom: 16px; }
.gauge-panel { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; flex: 0 0 220px; text-align: center; }
.gauge-label { font-size: 12px; color: var(--text-sec); margin-top: 4px; }
.category-panel { flex: 1; background: var(--bg-panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
.cat-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.cat-row:last-child { margin-bottom: 0; }
.cat-name { font-size: 12px; color: var(--text); min-width: 130px; font-weight: 500; }
.cat-bar-wrap { flex: 1; background: var(--border); border-radius: 4px; height: 8px; overflow: hidden; }
.cat-bar { height: 100%; border-radius: 4px; transition: width 0.5s; }
.cat-score { font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 700; min-width: 28px; text-align: right; }

/* ── Recommend summary ── */
.panel { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
.panel-title { font-size: 14px; font-weight: 700; margin-bottom: 12px; }
.recommend-summary { display: flex; gap: 24px; }
.rec-summary-item { text-align: center; }
.rec-summary-icon { font-size: 24px; }
.rec-summary-label { font-size: 12px; color: var(--text-sec); margin-top: 2px; }
.rec-summary-count { font-size: 22px; font-weight: 700; margin-top: 2px; }
.rec-summary-pct { font-size: 12px; color: var(--text-sec); }

/* ── Table ── */
.table-wrap { overflow-x: auto; }
.resp-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.resp-table th { text-align: left; padding: 8px 10px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-sec); border-bottom: 1px solid var(--border); }
.resp-table td { padding: 9px 10px; border-bottom: 1px solid var(--border); }
.resp-table tr:last-child td { border-bottom: none; }
.resp-table tr:hover td { background: var(--bg); }
.resp-table tr.selected td { background: rgba(27,58,107,0.08); }
.search-input { padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); font-size: 13px; outline: none; }
.sm-btn { padding: 5px 12px; border: 1px solid var(--border); border-radius: 6px; background: transparent; color: var(--text-sec); font-size: 12px; cursor: pointer; }
.sm-btn:hover { background: var(--bg); }
.sm-btn.danger { color: #C94040; border-color: #C94040; }
.sm-btn.danger:hover { background: #FEE; }

/* ── Modal ── */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; z-index: 100; }
.modal-box { background: var(--bg-panel); border-radius: 12px; padding: 24px; width: 340px; border: 1px solid var(--border); }

/* ── Settings ── */
.settings-panel { max-width: 560px; }
.settings-panel h2 { font-size: 18px; font-weight: 700; margin-bottom: 24px; }
.settings-section { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 16px; }
.settings-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-sec); margin-bottom: 12px; }
.settings-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); }
.settings-item:last-child { border-bottom: none; }
</style>
