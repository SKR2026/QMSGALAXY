<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PTMS – Management View</title>
<link rel="stylesheet" href="css/style.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',sans-serif;background:#f0f2f8;display:flex;min-height:100vh}
  /* Sidebar */
  .mgmt-sidebar{width:220px;background:#0d2137;color:#fff;display:flex;flex-direction:column;padding:1.5rem 0;flex-shrink:0;transition:width .22s ease;overflow:hidden}
  .mgmt-sidebar.collapsed{width:60px}
  .mgmt-sidebar .brand{padding:0 1.2rem 1.5rem;border-bottom:1px solid rgba(255,255,255,.1);white-space:nowrap}
  .mgmt-sidebar.collapsed .brand{padding:0 .6rem 1.2rem}
  .mgmt-sidebar .brand h2{font-size:1.05rem;color:#fff}
  .mgmt-sidebar .brand p{font-size:.8rem;color:#aaa;margin-top:.2rem}
  .mgmt-sidebar.collapsed .brand h2,.mgmt-sidebar.collapsed .brand p,.mgmt-sidebar.collapsed .sidebar-company-logo{display:none}
  .mgmt-nav{margin-top:1rem;flex:1}
  .mgmt-nav a{display:flex;align-items:center;gap:.7rem;padding:.7rem 1.2rem;color:#ccc;text-decoration:none;font-size:.95rem;cursor:pointer;transition:all .2s;white-space:nowrap;border-left:3px solid transparent}
  .mgmt-nav a:hover,.mgmt-nav a.active{background:rgba(30,136,229,.18);color:#fff;border-left-color:#1e88e5}
  .mgmt-sidebar.collapsed .mgmt-nav a{justify-content:center;padding:.75rem;gap:0}
  .mgmt-sidebar.collapsed .mgmt-nav a .nav-label{display:none}
  .mgmt-sidebar.collapsed .clock{display:none}
  .mgmt-sidebar .clock{padding:1rem 1.2rem;font-size:.75rem;color:#888;border-top:1px solid rgba(255,255,255,.1);margin-top:auto}
  .sidebar-toggle{background:none;border:none;cursor:pointer;font-size:1.2rem;color:#fff;padding:.3rem .5rem;border-radius:6px;transition:background .2s;line-height:1}
  .sidebar-toggle:hover{background:rgba(255,255,255,.1)}
  .brand-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:.6rem}
  /* Main */
  .mgmt-main{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .mgmt-header{background:#fff;padding:1rem 1.5rem;border-bottom:1px solid #e0e0e8;display:flex;align-items:center;justify-content:space-between}
  .mgmt-header h1{font-size:1.05rem;color:#1a1a2e}
  .mgmt-header .badge-ro{background:#e8f5e9;color:#2e7d32;padding:.3rem .8rem;border-radius:999px;font-size:.78rem;font-weight:600}
  .mgmt-content{flex:1;overflow-y:auto;padding:1.5rem}
  /* Cards */
  .card{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.07);margin-bottom:1.5rem}
  .card-header{padding:.9rem 1.2rem;border-bottom:1px solid #f0f0f8;font-weight:700;font-size:.95rem;color:#1a1a2e;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem}
  .card-body{padding:1rem}
  /* Stats */
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem;margin-bottom:1.5rem}
  .stat-tile{background:#fff;border-radius:12px;padding:1.2rem;box-shadow:0 2px 8px rgba(0,0,0,.07);border-top:4px solid #4f8ef7}
  .stat-tile.green{border-top-color:#2e7d32}.stat-tile.orange{border-top-color:#e65100}.stat-tile.red{border-top-color:#c62828}
  .stat-label{font-size:.72rem;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.05em}
  .stat-value{font-size:2rem;font-weight:800;color:#1a1a2e;margin:.3rem 0}
  .stat-sub{font-size:.78rem;color:#aaa}
  /* Table */
  .table-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:.85rem}
  th{background:#f8f8fc;padding:.6rem .8rem;text-align:left;font-weight:700;color:#4a4a6a;white-space:nowrap}
  td{padding:.6rem .8rem;border-bottom:1px solid #f0f0f8;color:#333}
  tr:hover td{background:#fafafe}
  .dispatch-id{font-family:monospace;background:#f0f2f8;padding:.2rem .5rem;border-radius:4px;font-size:.82rem}
  .badge{padding:.25rem .6rem;border-radius:999px;font-size:.75rem;font-weight:700;display:inline-block}
  .status-dispatched{background:#e3f2fd;color:#1565c0}
  .status-in-transit{background:#fff3e0;color:#e65100}
  .status-received{background:#e8f5e9;color:#2e7d32}
  .status-discrepancy{background:#ffebee;color:#c62828}
  .badge-red{background:#ffebee;color:#c62828}
  /* Filter */
  .filter-row{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap}
  .filter-row input[type=date]{padding:.4rem .7rem;border:1.5px solid #d0d0e8;border-radius:8px;font-size:.85rem}
  .btn{padding:.5rem 1.1rem;border-radius:8px;border:none;cursor:pointer;font-weight:600;font-size:.85rem}
  .btn-primary{background:#4f8ef7;color:#fff}.btn-outline{background:#fff;border:1.5px solid #4f8ef7;color:#4f8ef7}
  /* Sections */
  .section{display:none}.section.active{display:block}
  .spinner{text-align:center;padding:2rem;color:#888}
  .empty-state{text-align:center;padding:2.5rem;color:#aaa}
  .empty-icon{font-size:2rem;margin-bottom:.5rem}
  @media(max-width:640px){.mgmt-sidebar{width:60px!important}.mgmt-sidebar .brand p,.mgmt-nav a .nav-label,.mgmt-sidebar .brand h2,.mgmt-sidebar .clock{display:none!important}.mgmt-sidebar .brand-row{justify-content:center}.mgmt-nav a{justify-content:center;padding:.75rem;gap:0}.sidebar-toggle{display:none}}
</style>
</head>
<body>
<!-- Sidebar -->
<aside class="mgmt-sidebar" id="mgmtSidebar">
  <div class="brand">
    <div class="sidebar-company-logo" style="background:rgba(255,255,255,.97);border-radius:8px;padding:.4rem .5rem;margin-bottom:.7rem;display:flex;align-items:center;justify-content:center;">
      <img src="images/company-logo.png" alt="Company Logo" style="max-width:160px;max-height:38px;width:auto;height:auto;object-fit:contain;">
    </div>
    <div class="brand-row">
      <div>
        <h2>🏭 PTMS</h2>
        <p>Management View</p>
      </div>
      <button class="sidebar-toggle" id="sidebarToggle" title="Toggle sidebar">☰</button>
    </div>
  </div>
  <nav class="mgmt-nav">
    <a class="active" data-sec="overview"><span class="icon">📊</span> <span class="nav-label"> Overview</span></a>
    <a data-sec="shipments"><span class="icon">🚚</span> <span class="nav-label"> All Shipments</span></a>
    <a data-sec="discrepancies"><span class="icon">⚠️</span> <span class="nav-label"> Discrepancies</span></a>
    <a data-sec="plants"><span class="icon">🏭</span> <span class="nav-label"> Plant Summary</span></a>
  </nav>
  <div class="clock" id="mgmtClock"></div>
</aside>

<!-- Main -->
<div class="mgmt-main">
  <header class="mgmt-header">
    <h1 id="mgmtPageTitle">📊 Overview</h1>
    <span class="badge-ro">🔒 Read-Only View</span>
  </header>
  <div class="mgmt-content">

    <!-- Overview -->
    <div class="section active" id="sec-overview">
      <div class="stat-grid" id="kpiGrid"><div class="spinner">Loading…</div></div>
      <div class="card">
        <div class="card-header">Recent Activity (Last 10)</div>
        <div class="card-body table-wrap" id="recentTable"><div class="spinner">Loading…</div></div>
      </div>
    </div>

    <!-- All Shipments -->
    <div class="section" id="sec-shipments">
      <div class="card">
        <div id="shipSection" class="card-header">
          All Shipments
          <div class="filter-row">
            <input type="date" id="shipFrom">
            <input type="date" id="shipTo">
            <select id="shipStatus" style="padding:.4rem .7rem;border:1.5px solid #d0d0e8;border-radius:8px;font-size:.85rem">
              <option value="">All Statuses</option>
              <option value="dispatched">Dispatched</option>
              <option value="in-transit">In Transit</option>
              <option value="received">Received</option>
              <option value="discrepancy">Discrepancy</option>
            </select>
            <button class="btn btn-primary" id="shipFilter">Filter</button>
          </div>
        </div>
        <div class="card-body table-wrap" id="shipTable"><div class="spinner">Loading…</div></div>
      </div>
    </div>

    <!-- Discrepancies -->
    <div class="section" id="sec-discrepancies">
      <div class="card">
        <div id="discSection" class="card-header">Discrepancy Report</div>
        <div class="card-body table-wrap" id="discTable"><div class="spinner">Loading…</div></div>
      </div>
    </div>

    <!-- Plant Summary -->
    <div class="section" id="sec-plants">
      <div class="card">
        <div class="card-header">Plant-wise Performance</div>
        <div class="card-body">
          <div id="plantPills" style="display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1rem"></div>
          <div class="table-wrap" id="plantTable"><div class="spinner">Loading…</div></div>
        </div>
      </div>
    </div>

  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs, doc, getDoc, query, where, orderBy, limit }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyC0vOWt3PBDu5DzgF37keVvFzll4nriYv0",
  authDomain:"skr-tm.firebaseapp.com",
  projectId:"skr-tm",
  storageBucket:"skr-tm.appspot.com",
  messagingSenderId:"703644096773",
  appId:"1:703644096773:web:2e156592690f23e4547f6c"
});
const db = getFirestore(app);

// ── Clock ─────────────────────────────────────────────────────
function tick() {
  document.getElementById("mgmtClock").textContent =
    new Date().toLocaleString("en-IN",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
}
tick(); setInterval(tick,1000);

// ── Sidebar toggle ────────────────────────────────────────────
document.getElementById("sidebarToggle").addEventListener("click", () => {
  document.getElementById("mgmtSidebar").classList.toggle("collapsed");
});

// ── Nav ───────────────────────────────────────────────────────
const titles = {overview:"📊 Overview",shipments:"🚚 All Shipments",discrepancies:"⚠️ Discrepancies",plants:"🏭 Plant Summary"};
document.querySelectorAll(".mgmt-nav a").forEach(a => {
  a.addEventListener("click", () => {
    document.querySelectorAll(".mgmt-nav a").forEach(x=>x.classList.remove("active"));
    document.querySelectorAll(".section").forEach(x=>x.classList.remove("active"));
    a.classList.add("active");
    const sec = a.dataset.sec;
    document.getElementById("sec-"+sec).classList.add("active");
    document.getElementById("mgmtPageTitle").textContent = titles[sec];
    if (sec==="shipments") loadShipments();
    if (sec==="discrepancies") loadDiscrepancies();
    if (sec==="plants") loadPlants();
  });
});

function statusLabel(s){return{dispatched:"Dispatched","in-transit":"In Transit",received:"Received",discrepancy:"Discrepancy"}[s]||s;}

// ── Overview ──────────────────────────────────────────────────
async function loadOverview() {
  const snap = await getDocs(collection(db,"dispatches"));
  let total=0,dispatched=0,received=0,discrepancy=0,inTransit=0;
  snap.forEach(d=>{
    const s=d.data().status; total++;
    if(s==="dispatched")dispatched++;
    else if(s==="in-transit")inTransit++;
    else if(s==="received")received++;
    else if(s==="discrepancy")discrepancy++;
  });
  document.getElementById("kpiGrid").innerHTML=`
    <div class="stat-tile" style="cursor:pointer" onclick="document.getElementById('shipSection').scrollIntoView({behavior:'smooth'});loadShipments()"><div class="stat-label">Total Shipments</div><div class="stat-value">${total}</div><div class="stat-sub">Click to view all</div></div>
    <div class="stat-tile orange" style="cursor:pointer" onclick="document.getElementById('shipSection').scrollIntoView({behavior:'smooth'});document.getElementById('shipStatus').value='dispatched';loadShipments()"><div class="stat-label">In Transit</div><div class="stat-value">${dispatched+inTransit}</div><div class="stat-sub">Click to filter</div></div>
    <div class="stat-tile green" style="cursor:pointer" onclick="document.getElementById('shipSection').scrollIntoView({behavior:'smooth'});document.getElementById('shipStatus').value='received';loadShipments()"><div class="stat-label">Received OK</div><div class="stat-value">${received}</div><div class="stat-sub">Click to filter</div></div>
    <div class="stat-tile red" style="cursor:pointer" onclick="document.getElementById('discSection').scrollIntoView({behavior:'smooth'});loadDiscrepancies()"><div class="stat-label">Discrepancies</div><div class="stat-value">${discrepancy}</div><div class="stat-sub">Click to view</div></div>`;

  // Recent 10
  const all = snap.docs.sort((a,b)=>(b.data().createdAt?.seconds||0)-(a.data().createdAt?.seconds||0)).slice(0,10);
  let rows="";
  all.forEach(d=>{
    const dp=d.data();
    rows+=`<tr><td><span class="dispatch-id">${dp.dispatchId}</span></td><td>${dp.createdAt?.toDate?dp.createdAt.toDate().toLocaleString("en-IN"):(dp.date||"—")}</td><td>${dp.fromPlantName}</td><td>${dp.toPlantName}</td><td>${dp.material}</td><td>${dp.qtyDispatched} ${dp.unit}</td><td><span class="badge status-${dp.status}">${statusLabel(dp.status)}</span></td></tr>`;
  });
  document.getElementById("recentTable").innerHTML=rows?`<table><thead><tr><th>ID</th><th>Date</th><th>From</th><th>To</th><th>Material</th><th>Qty</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table>`:`<div class="empty-state"><div class="empty-icon">📦</div><p>No data yet.</p></div>`;
}

// ── All Shipments ─────────────────────────────────────────────
async function loadShipments() {
  const from=document.getElementById("shipFrom").value;
  const to=document.getElementById("shipTo").value;
  const status=document.getElementById("shipStatus").value;
  document.getElementById("shipTable").innerHTML=`<div class="spinner">Loading…</div>`;
  const snap=await getDocs(collection(db,"dispatches"));
  let rows="";
  snap.docs
    .filter(d=>{
      const dp=d.data();
      if(status && dp.status!==status) return false;
      if(from && dp.date && dp.date<from) return false;
      if(to && dp.date && dp.date>to) return false;
      return true;
    })
    .sort((a,b)=>(b.data().createdAt?.seconds||0)-(a.data().createdAt?.seconds||0))
    .forEach(d=>{
      const dp=d.data();
      const dispDT=dp.createdAt?.toDate?dp.createdAt.toDate().toLocaleString("en-IN"):(dp.date||"—");
      const recvDT=(dp.arrivalDate&&dp.arrivalTime)?dp.arrivalDate+" "+dp.arrivalTime:(dp.arrivalDate||"—");
      rows+=`<tr><td><span class="dispatch-id">${dp.dispatchId}</span></td><td>${dispDT}</td><td>${recvDT}</td><td>${dp.fromPlantName}</td><td>${dp.toPlantName}</td><td>${dp.material}</td><td>${dp.qtyDispatched} ${dp.unit}</td><td>${dp.vehicleNo||"—"}</td><td>${dp.driverName||"—"}</td><td><span class="badge status-${dp.status}">${statusLabel(dp.status)}</span></td></tr>`;
    });
  document.getElementById("shipTable").innerHTML=rows?`<table><thead><tr><th>ID</th><th>Dispatch Date/Time</th><th>Receipt Date/Time</th><th>From</th><th>To</th><th>Material</th><th>Qty</th><th>Vehicle</th><th>Driver</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table>`:`<div class="empty-state"><div class="empty-icon">📦</div><p>No records found.</p></div>`;
}
document.getElementById("shipFilter").addEventListener("click",loadShipments);

// ── Discrepancies ─────────────────────────────────────────────
async function loadDiscrepancies() {
  document.getElementById("discTable").innerHTML=`<div class="spinner">Loading…</div>`;
  const snap=await getDocs(collection(db,"dispatches"));
  let rows="";
  snap.docs
    .filter(d=>d.data().status==="discrepancy")
    .sort((a,b)=>(b.data().updatedAt?.seconds||0)-(a.data().updatedAt?.seconds||0))
    .forEach(d=>{
      const dp=d.data();
      const diff=(dp.qtyReceived??0)-dp.qtyDispatched;
      const dispDT2=dp.createdAt?.toDate?dp.createdAt.toDate().toLocaleString("en-IN"):(dp.date||"—");
      const recvDT=(dp.arrivalDate&&dp.arrivalTime)?dp.arrivalDate+" "+dp.arrivalTime:(dp.arrivalDate||"—");
      rows+=`<tr data-doc-id="${d.id}"><td><span class="dispatch-id">${dp.dispatchId}</span></td><td>${dispDT2}</td><td>${recvDT}</td><td>${dp.fromPlantName}</td><td>${dp.toPlantName}</td><td>${dp.material}</td><td>${dp.qtyDispatched} ${dp.unit}</td><td>${dp.qtyReceived??'—'} ${dp.unit}</td><td style="color:#c62828;font-weight:700">${diff>0?'+':''}${diff.toFixed?diff.toFixed(2):diff}</td><td style="text-align:center"><button onclick="showDispatchDetail('${d.id}')" style="background:#1565c0;color:#fff;border:none;border-radius:7px;padding:.35rem .85rem;font-size:.82rem;font-weight:700;cursor:pointer">🔍 View</button></td></tr>`;
    });
  document.getElementById("discTable").innerHTML=rows?`<table><thead><tr><th>ID</th><th>Dispatch Date/Time</th><th>Receipt Date/Time</th><th>From</th><th>To</th><th>Material</th><th>Dispatched</th><th>Received</th><th>Difference</th><th>Details</th></tr></thead><tbody>${rows}</tbody></table>`:`<div class="empty-state"><div class="empty-icon">✅</div><p>No discrepancies recorded.</p></div>`;
}

// ── Plant Summary ─────────────────────────────────────────────
let allPlantRows = []; // cache for filtering

async function loadPlants() {
  document.getElementById("plantTable").innerHTML=`<div class="spinner">Loading…</div>`;
  const [pSnap,dSnap]=await Promise.all([getDocs(collection(db,"plants")),getDocs(collection(db,"dispatches"))]);
  const stats={};
  pSnap.forEach(d=>{stats[d.id]={id:d.id,name:d.data().name,code:d.data().code,out:0,inc:0,ok:0,disc:0};});
  dSnap.forEach(d=>{
    const dp=d.data();
    if(stats[dp.fromPlantId])stats[dp.fromPlantId].out++;
    if(stats[dp.toPlantId]){
      stats[dp.toPlantId].inc++;
      if(dp.status==="received")stats[dp.toPlantId].ok++;
      if(dp.status==="discrepancy")stats[dp.toPlantId].disc++;
    }
  });

  allPlantRows = Object.values(stats);

  // Build pills
  const pillBox = document.getElementById("plantPills");
  pillBox.innerHTML = "";

  // "All" pill
  const allPill = document.createElement("button");
  allPill.textContent = "🏭 All Plants";
  allPill.dataset.plantId = "all";
  allPill.className = "plant-pill active";
  Object.assign(allPill.style, {padding:".35rem .9rem",borderRadius:"999px",border:"1.5px solid #4f8ef7",background:"#4f8ef7",color:"#fff",fontWeight:"700",fontSize:".8rem",cursor:"pointer"});
  pillBox.appendChild(allPill);

  // One pill per plant
  const colors = ["#1565c0","#2e7d32","#6a1b9a","#e65100","#00695c","#c62828","#4527a0","#558b2f"];
  allPlantRows.forEach((p,i) => {
    const pill = document.createElement("button");
    pill.textContent = p.code || p.name;
    pill.dataset.plantId = p.id;
    pill.dataset.color = colors[i % colors.length];
    pill.className = "plant-pill";
    Object.assign(pill.style, {padding:".35rem .9rem",borderRadius:"999px",border:`1.5px solid ${colors[i%colors.length]}`,background:"#fff",color:colors[i%colors.length],fontWeight:"700",fontSize:".8rem",cursor:"pointer"});
    pillBox.appendChild(pill);
  });

  // Pill click handler
  pillBox.querySelectorAll(".plant-pill").forEach(pill => {
    pill.addEventListener("click", () => {
      pillBox.querySelectorAll(".plant-pill").forEach(p => {
        const c = p.dataset.color || "#4f8ef7";
        p.style.background = "#fff";
        p.style.color = c;
        p.style.borderColor = c;
        p.classList.remove("active");
      });
      const c = pill.dataset.color || "#4f8ef7";
      pill.style.background = c;
      pill.style.color = "#fff";
      pill.classList.add("active");
      renderPlantTable(pill.dataset.plantId);
    });
  });

  renderPlantTable("all");
}

function renderPlantTable(plantId) {
  const rows = plantId === "all" ? allPlantRows : allPlantRows.filter(p => p.id === plantId);
  let html = "";
  rows.forEach(p => {
    html += `<tr><td><strong>${p.code||"—"}</strong></td><td>${p.name}</td><td>${p.out}</td><td>${p.inc}</td><td>${p.ok}</td><td>${p.disc>0?`<span class="badge badge-red">${p.disc}</span>`:"0"}</td></tr>`;
  });
  document.getElementById("plantTable").innerHTML = html
    ? `<table><thead><tr><th>Code</th><th>Plant</th><th>Outgoing</th><th>Incoming</th><th>Received OK</th><th>Discrepancies</th></tr></thead><tbody>${html}</tbody></table>`
    : `<div class="empty-state"><p>No data for this plant.</p></div>`;
}

loadOverview();

// ── Dispatch Detail Modal ──────────────────────────────────────
const SC = { received:"#2e7d32", discrepancy:"#c62828", dispatched:"#1565c0", "in-transit":"#e65100" };
const SL = { dispatched:"Dispatched", "in-transit":"In Transit", received:"Received", discrepancy:"Discrepancy" };

window.showDispatchDetail = async (docId) => {
  const snap = await getDoc(doc(db, "dispatches", docId));
  if (!snap.exists()) return;
  const dp = snap.data();

  const dispItems = dp.items && dp.items.length
    ? dp.items
    : [{ partNo:"—", partName: dp.material||"—", qty: dp.qtyDispatched, unit: dp.unit||"", boxes: dp.boxes||0 }];
  const recvItems = dp.itemsReceived && dp.itemsReceived.length ? dp.itemsReceived : null;

  const itemRows = dispItems.map((it, i) => {
    const rv      = recvItems ? (recvItems[i] || {}) : null;
    const dispQty = parseFloat(it.qty) || 0;
    const recvQty = rv ? (parseFloat(rv.qtyReceived) ?? "—") : "—";
    const diff    = rv ? (parseFloat(rv.qtyReceived) - dispQty) : null;
    const diffStr = diff == null ? "—"
      : Math.abs(diff) < 0.001
        ? `<span style="color:#2e7d32;font-weight:700">✅ Match</span>`
        : `<span style="color:${diff<0?"#c62828":"#1565c0"};font-weight:700">${diff>0?"+":""}${diff}</span>`;
    const bg = diff != null && Math.abs(diff) > 0.001
      ? (diff < 0 ? "#fff5f5" : "#f0f4ff") : (i%2 ? "#f8fbff" : "#fff");
    return `<tr style="background:${bg}">
      <td style="padding:.4rem .5rem;border:1px solid #d0dff0;text-align:center;color:#666">${i+1}</td>
      <td style="padding:.4rem .5rem;border:1px solid #d0dff0;font-weight:600;color:#1565c0">${it.partNo||"—"}</td>
      <td style="padding:.4rem .5rem;border:1px solid #d0dff0">${it.partName||it.description||"—"}</td>
      <td style="padding:.4rem .5rem;border:1px solid #d0dff0;text-align:center">${it.unit||dp.unit||""}</td>
      <td style="padding:.4rem .5rem;border:1px solid #d0dff0;text-align:center;font-weight:700">${dispQty}</td>
      <td style="padding:.4rem .5rem;border:1px solid #d0dff0;text-align:center">${it.boxes||0}</td>
      <td style="padding:.4rem .5rem;border:1px solid #d0dff0;text-align:center;font-weight:700">${recvQty !== "—" ? recvQty : "—"}</td>
      <td style="padding:.4rem .5rem;border:1px solid #d0dff0;text-align:center">${rv ? (rv.boxesReceived||0) : "—"}</td>
      <td style="padding:.4rem .5rem;border:1px solid #d0dff0;text-align:center">${diffStr}</td>
    </tr>`;
  }).join("");

  const totalDisp    = dispItems.reduce((s,it) => s + (parseFloat(it.qty)||0), 0);
  const totalRecv    = recvItems ? recvItems.reduce((s,it) => s + (parseFloat(it.qtyReceived)||0), 0) : null;
  const totalDiff    = totalRecv != null ? totalRecv - totalDisp : null;
  const totalDiffStr = totalDiff == null ? "—"
    : Math.abs(totalDiff) < 0.001
      ? `<span style="color:#2e7d32;font-weight:700">✅ Match</span>`
      : `<span style="color:${totalDiff<0?"#c62828":"#1565c0"};font-weight:700">${totalDiff>0?"+":""}${totalDiff}</span>`;

  const photoHtml = dp.photoEvidence?.length
    ? dp.photoEvidence.map((u,i) => `
        <div style="display:inline-block;margin:3px;text-align:center">
          <img src="${u}"
            onclick="window.open('${u}','_blank')"
            onerror="this.style.display='none';this.nextElementSibling.style.display='inline-block'"
            style="width:88px;height:88px;object-fit:cover;border-radius:8px;border:2px solid #c62828;cursor:pointer;display:block">
          <a href="${u}" target="_blank"
            style="display:none;font-size:.75rem;color:#1565c0;word-break:break-all;max-width:88px">
            📎 Photo ${i+1}</a>
        </div>`).join("")
    : "";

  document.querySelector(".vd-bd")?.remove();
  const bd = document.createElement("div");
  bd.className = "vd-bd";
  bd.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:1rem";
  bd.innerHTML = `
    <div style="background:#fff;border-radius:14px;width:96vw;max-width:860px;max-height:90vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.25)">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:.85rem 1.25rem;border-bottom:1px solid #e0e0e0">
        <span style="font-weight:700;font-size:1rem">📋 Dispatch Details —
          <span style="font-family:monospace;background:#f0f2f8;padding:.2rem .5rem;border-radius:4px;font-size:.82rem">${dp.dispatchId}</span>
        </span>
        <button class="vd-close" style="background:none;border:none;font-size:1.3rem;cursor:pointer;color:#666">✕</button>
      </div>
      <div style="padding:1rem 1.25rem">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:.45rem 1.5rem;font-size:.87rem;background:#f4f6fb;border-radius:10px;padding:.85rem 1rem;margin-bottom:1rem">
          <div><span style="color:#666">From Plant</span><br><strong>${dp.fromPlantName||"—"}</strong></div>
          <div><span style="color:#666">To Plant</span><br><strong>${dp.toPlantName||"—"}</strong></div>
          <div><span style="color:#666">Vehicle No</span><br><strong>${dp.vehicleNo||"—"}</strong></div>
          <div><span style="color:#666">Driver</span><br><strong>${dp.driverName||"—"}${dp.driverContact||dp.driverPhone?" · "+(dp.driverContact||dp.driverPhone):""}</strong></div>
          <div><span style="color:#666">Dispatch Date</span><br><strong>${dp.date||"—"}</strong></div>
          <div><span style="color:#666">Departure Time</span><br><strong>${dp.departureTime||"—"}</strong></div>
          <div><span style="color:#666">Status</span><br><strong style="color:${SC[dp.status]||"#555"}">${SL[dp.status]||dp.status}</strong></div>
          <div><span style="color:#666">E-Way Bill</span><br><strong>${dp.ewayBill||"—"}</strong></div>
          ${dp.remarks?`<div style="grid-column:1/-1"><span style="color:#666">Remarks</span><br><strong>${dp.remarks}</strong></div>`:""}
        </div>
        <div style="font-weight:700;color:#1565c0;margin-bottom:.5rem">📋 Item-wise Details</div>
        <div style="overflow-x:auto;margin-bottom:1rem">
          <table style="width:100%;border-collapse:collapse;font-size:.86rem;table-layout:fixed">
            <thead><tr style="background:#1a2b4a;color:#fff">
              <th style="padding:.4rem .5rem;border:1px solid #2d4070;width:36px;text-align:center">#</th>
              <th style="padding:.4rem .5rem;border:1px solid #2d4070;width:90px;text-align:left">Part No.</th>
              <th style="padding:.4rem .5rem;border:1px solid #2d4070;text-align:left">Part Name</th>
              <th style="padding:.4rem .5rem;border:1px solid #2d4070;width:50px;text-align:center">Unit</th>
              <th style="padding:.4rem .5rem;border:1px solid #2d4070;width:78px;text-align:center">Dispatched</th>
              <th style="padding:.4rem .5rem;border:1px solid #2d4070;width:68px;text-align:center">Boxes Sent</th>
              <th style="padding:.4rem .5rem;border:1px solid #2d4070;width:78px;text-align:center">Received</th>
              <th style="padding:.4rem .5rem;border:1px solid #2d4070;width:68px;text-align:center">Boxes Recd</th>
              <th style="padding:.4rem .5rem;border:1px solid #2d4070;width:88px;text-align:center">Difference</th>
            </tr></thead>
            <tbody>${itemRows}</tbody>
            <tfoot><tr style="background:#e8f5e9;font-weight:700">
              <td colspan="4" style="padding:.5rem .6rem;border:1px solid #90caf9;text-align:right;color:#1b5e20">Total</td>
              <td style="padding:.5rem .6rem;border:1px solid #90caf9;text-align:center">${totalDisp}</td>
              <td style="padding:.5rem .6rem;border:1px solid #90caf9"></td>
              <td style="padding:.5rem .6rem;border:1px solid #90caf9;text-align:center">${totalRecv??'—'}</td>
              <td style="padding:.5rem .6rem;border:1px solid #90caf9"></td>
              <td style="padding:.5rem .6rem;border:1px solid #90caf9;text-align:center">${totalDiffStr}</td>
            </tr></tfoot>
          </table>
        </div>
        ${dp.arrivalDate?`
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:.45rem 1.5rem;font-size:.87rem;
          background:${dp.status==="discrepancy"?"#fff5f5":"#f1f8e9"};border-radius:10px;padding:.85rem 1rem;margin-bottom:1rem;
          border:1px solid ${dp.status==="discrepancy"?"#ffcdd2":"#c5e1a5"}">
          <div style="grid-column:1/-1;font-weight:700;color:${SC[dp.status]||"#555"};margin-bottom:.3rem">
            ${dp.status==="discrepancy"?"⚠️ Discrepancy Recorded":"✅ Receipt Confirmed"}
          </div>
          <div><span style="color:#666">Arrival Date</span><br><strong>${dp.arrivalDate}</strong></div>
          <div><span style="color:#666">Arrival Time</span><br><strong>${dp.arrivalTime||"—"}</strong></div>
          <div><span style="color:#666">Received By</span><br><strong>${dp.receivedByName||"—"}</strong></div>
          <div><span style="color:#666">Total Received</span><br><strong>${dp.qtyReceived??'—'} ${dp.unit||""}</strong></div>
          ${dp.receiptRemarks?`<div style="grid-column:1/-1"><span style="color:#666">Receipt Remarks</span><br><strong>${dp.receiptRemarks}</strong></div>`:""}
        </div>`:""}
        <div style="margin-top:.5rem">
          <div style="font-weight:700;color:#c62828;margin-bottom:.5rem;font-size:.88rem">📷 Photo Evidence</div>
          ${photoHtml
            ? `<div style="display:flex;flex-wrap:wrap;gap:6px">${photoHtml}</div>`
            : `<div style="color:#aaa;font-size:.85rem;padding:.5rem;background:#fafafa;border-radius:6px;border:1px dashed #ddd">No photos uploaded for this dispatch.</div>`
          }
        </div>
      </div>
      <div style="padding:.75rem 1.25rem;border-top:1px solid #e0e0e0;text-align:right">
        <button class="vd-close" style="padding:.45rem 1.4rem;border:1.5px solid #ccc;border-radius:8px;background:#fff;cursor:pointer;font-weight:600">Close</button>
      </div>
    </div>`;
  document.body.appendChild(bd);
  bd.querySelectorAll(".vd-close").forEach(b => b.addEventListener("click", () => bd.remove()));
  bd.addEventListener("click", e => { if (e.target === bd) bd.remove(); });
};
</script>
</body>
</html>
