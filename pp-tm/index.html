<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PTMS – Plant Transport & Material Tracking System</title>
<link rel="stylesheet" href="css/style.css">
<style>
  /* Inline overrides only for login page centering */
  body { margin: 0; }
</style>
</head>
<body>

<!-- ───────────────────── LOGIN PAGE ───────────────────────── -->
<div id="loginPage">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-company-logo" id="loginCompanyLogo">
        <img src="images/logo.png" alt="Company Logo" id="loginLogoImg"
             onerror="this.closest('.login-company-logo').style.display='none'">
      </div>
      <div class="logo-icon">🏭</div>
      <h1>PTMS</h1>
      <p>Plant Transport & Material Tracking System</p>
    </div>
    <form id="loginForm" autocomplete="off">
      <div class="form-group">
        <label for="loginEmail">Email Address</label>
        <input type="email" id="loginEmail" placeholder="you@company.com" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <div id="loginError" class="error-msg hidden"></div>
      <button type="submit" class="btn btn-dark btn-lg btn-block" id="loginBtn">
        <span id="loginBtnText">Sign In</span>
      </button>
    </form>
    <div class="login-divider"><span>or</span></div>
    <a href="management.html" target="_blank" class="btn btn-public-dashboard btn-lg btn-block">
      📊 Management Public Dashboard
    </a>
  </div>
</div>

<!-- ───────────────────── APP SHELL ────────────────────────── -->
<div id="appShell" class="hidden">

  <!-- Sidebar -->
  <aside id="sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-company-logo" id="sidebarCompanyLogo">
        <img src="images/logo.png" alt="Company Logo" id="sidebarLogoImg"
             onerror="this.closest('.sidebar-company-logo').style.display='none'">
      </div>
      <div class="sidebar-brand-row">
        <div class="brand-icon">🏭</div>
        <div class="brand-text">
          <h2>PTMS</h2>
          <p>Transport Tracking</p>
        </div>
      </div>
    </div>

    <div class="sidebar-user">
      <div class="user-name"  id="sidebarUserName">—</div>
      <div class="user-plant" id="sidebarPlantName"></div>
      <span class="role-badge" id="sidebarRoleBadge"></span>
    </div>

    <nav class="sidebar-nav" id="sidebarNav">
      <!-- Injected by app.js based on role -->
    </nav>

    <div class="sidebar-footer">
      <button class="btn btn-outline btn-sm btn-block" id="logoutBtn">🚪 Sign Out</button>
    </div>
  </aside>

  <!-- Top Header -->
  <header id="appHeader">
    <h1 id="pageTitle">Dashboard</h1>
    <div class="header-right">
      <span class="header-time" id="headerClock"></span>
    </div>
  </header>

  <!-- Page Content -->
  <main id="pageContent">
    <div class="spinner" id="pageSpinner"></div>
  </main>

</div>

<!-- ───────────────────── TOAST CONTAINER ──────────────────── -->
<div id="toastContainer"></div>

<!-- ───────────────────── SCRIPTS ──────────────────────────── -->
<script type="module" src="js/app.v2.js"></script>

</body>
</html>
