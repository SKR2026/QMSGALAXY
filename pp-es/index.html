      "Warehouse & Logistics": "கிடங்கு மற்றும் லாஜிஸ்டிக்ஸ்", Maintenance: "பராமரிப்பு", Packaging: "பேக்கேஜிங்",

  },
};

function mulberry32(seed) {
  return function () {
    seed |= 0;
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const DEPT_BIAS = {
  "Assembly Line": { worklife: -0.8, safety: -0.2, teamwork: 0.1 },
  Machining: { equipment: -0.3, safety: -0.1 },
  "Quality Control": { management: 0.3, growth: 0.2 },
  "Warehouse & Logistics": { worklife: -0.4, pay: -0.2 },
  Maintenance: { equipment: -0.9, growth: -0.3 },
  Packaging: { worklife: -0.5, pay: -0.1 },
  Administration: { safety: 0.4, pay: 0.3, growth: 0.3 },
};

const SHIFT_BIAS = {
  Day: {},
  Evening: { worklife: -0.2 },
  Night: { worklife: -0.5, management: -0.3 },
};

function clamp(n, lo, hi) {
  return Math.max(lo, Math.min(hi, n));
}

function generateSeedData() {
  const rng = mulberry32(20260709);
  const responses = [];
  const now = Date.now();
  const totalDays = 90;
  const count = 46;
  for (let i = 0; i < count; i++) {
    const dept = DEFAULT_DEPARTMENTS[Math.floor(rng() * DEFAULT_DEPARTMENTS.length)];
    const shift = DEFAULT_SHIFTS[Math.floor(rng() * DEFAULT_SHIFTS.length)];
    const dayOffset = Math.floor(rng() * rng() * totalDays);
    const ts = new Date(now - dayOffset * 86400000).toISOString();
    const dBias = DEPT_BIAS[dept] || {};
    const sBias = SHIFT_BIAS[shift] || {};
    const answers = {};
    QUESTIONS.forEach((q) => {
      const bias = (dBias[q.cat] || 0) + (sBias[q.cat] || 0);
      const base = 3.6 + bias + (rng() - 0.5) * 2.2;
      answers[q.id] = clamp(Math.round(base), 1, 5);
    });
    const hasComment = rng() < 0.35;
    responses.push({
      id: `seed-${i}`,
      ts,
      department: dept,
      shift,
      tenure: TENURE_OPTIONS[Math.floor(rng() * TENURE_OPTIONS.length)],
      anonymous: rng() < 0.8,
      name: "",
      answers,
      comment: hasComment ? COMMENT_POOL[Math.floor(rng() * COMMENT_POOL.length)] : "",
    });
  }
  return responses;
}

function categoryAverage(response, catKey) {
  const qs = QUESTIONS.filter((q) => q.cat === catKey);
  const sum = qs.reduce((s, q) => s + (response.answers[q.id] || 0), 0);
  return sum / qs.length;
}

function overallAverage(response) {
  const vals = QUESTIONS.map((q) => response.answers[q.id] || 0);
  return vals.reduce((s, v) => s + v, 0) / vals.length;
}

function fmt1(n) {
  return Number.isFinite(n) ? n.toFixed(1) : "—";
}

const CHART_THEME = {
  dark: { grid: "#333A42", axis: "#9AA1A8", tooltipBg: "#1B1F24", tooltipBorder: "#333A42", tooltipLabel: "#EDEAE2" },
  light: { grid: "#E3DFD2", axis: "#6B6A62", tooltipBg: "#FFFFFF", tooltipBorder: "#DCD7C9", tooltipLabel: "#201F1B" },

function Gauge({ value, theme, outOf5Label }) {
  const pct = clamp((value - 1) / 4, 0, 1);
  const angle = -90 + pct * 180;
  const cx = 110, cy = 110, r = 88;
  const needleColor = theme === "light" ? "#201F1B" : "#EDEAE2";
  const knobStroke = theme === "light" ? "#FFFFFF" : "#15181C";
  const subtitleColor = theme === "light" ? "#6B6A62" : "#9AA1A8";
  const arc = (startDeg, endDeg, color) => {
    const toRad = (d) => ((d - 180) * Math.PI) / 180;
    const x1 = cx + r * Math.cos(toRad(startDeg));
    const y1 = cy + r * Math.sin(toRad(startDeg));
    const x2 = cx + r * Math.cos(toRad(endDeg));
    const y2 = cy + r * Math.sin(toRad(endDeg));
    const large = endDeg - startDeg > 180 ? 1 : 0;
    return (
      <path
        d={`M ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2}`}
        stroke={color}
        strokeWidth="18"
        fill="none"
        strokeLinecap="butt"
      />
    );
  };
  return (
    <svg viewBox="0 0 220 140" style={{ width: "100%", maxWidth: 260, display: "block", margin: "0 auto" }}>
      {arc(0, 60, "#E8552D")}
      {arc(60, 120, "#F5B400")}
      {arc(120, 180, "#4C9A6A")}
      <line
        x1={cx}
        y1={cy}
        x2={cx + 68 * Math.cos((angle * Math.PI) / 180)}
        y2={cy + 68 * Math.sin((angle * Math.PI) / 180)}
        stroke={needleColor}
        strokeWidth="4"
        strokeLinecap="round"
      />
      <circle cx={cx} cy={cy} r="8" fill={needleColor} stroke={knobStroke} strokeWidth="2" />
      <text x={cx} y={cy + 34} textAnchor="middle" fontFamily="'IBM Plex Mono', monospace" fontSize="26" fontWeight="600" fill={needleColor}>
        {fmt1(value)}
      </text>
      <text x={cx} y={cy + 52} textAnchor="middle" fontFamily="'Inter', sans-serif" fontSize="10" letterSpacing="1.5" fill={subtitleColor}>
        {outOf5Label}
      </text>
    </svg>
  );
}

    if (!department || !shift || !tenure) {

                <option key={s} value={s}>{t.shifts[s] || s}</option>
              ))}
            </select>
          </div>
          <div className="field">
            <label>{t.fieldTenure}</label>
            <select value={tenure} onChange={(e) => setTenure(e.target.value)}>

function Dashboard({ responses, theme, t, departments, shifts }) {
  const [deptFilter, setDeptFilter] = useState("All");
  const [shiftFilter, setShiftFilter] = useState("All");
  const ct = CHART_THEME[theme] || CHART_THEME.dark;

  const filterDeptOptions = useMemo(() => {
    return Array.from(new Set([...departments, ...responses.map((r) => r.department)]));
  }, [departments, responses]);

  const filterShiftOptions = useMemo(() => {
    return Array.from(new Set([...shifts, ...responses.map((r) => r.shift)]));
  }, [shifts, responses]);

  const filtered = useMemo(() => {
    return responses.filter(
      (r) =>
        (deptFilter === "All" || r.department === deptFilter) &&
        (shiftFilter === "All" || r.shift === shiftFilter)
    );
  }, [responses, deptFilter, shiftFilter]);

  const overall = useMemo(() => {
    if (!filtered.length) return 0;
    return filtered.reduce((s, r) => s + overallAverage(r), 0) / filtered.length;
  }, [filtered]);

  const categoryData = useMemo(() => {
    return CATEGORY_ORDER.map((key) => {
      const avg = filtered.length
        ? filtered.reduce((s, r) => s + categoryAverage(r, key), 0) / filtered.length
        : 0;
      return { key, name: t.categories[key], score: Number(avg.toFixed(2)), color: CATEGORY_COLORS[key] };
    });
  }, [filtered, t]);

  const sortedCats = useMemo(
    () => [...categoryData].sort((a, b) => b.score - a.score),
    [categoryData]
  );
  const topCat = sortedCats[0];
  const lowCat = sortedCats[sortedCats.length - 1];

  const deptData = useMemo(() => {
    const names = Array.from(new Set(filtered.map((r) => r.department)));
    return names
      .map((d) => {
        const rs = filtered.filter((r) => r.department === d);
        const avg = rs.length ? rs.reduce((s, r) => s + overallAverage(r), 0) / rs.length : 0;
        return { name: t.departments[d] || d, score: Number(avg.toFixed(2)), count: rs.length };
      })
      .filter((d) => d.count > 0);
  }, [filtered, t]);

  const trendData = useMemo(() => {
    const byWeek = {};
    filtered.forEach((r) => {
      const d = new Date(r.ts);
      const weekStart = new Date(d);
      weekStart.setDate(d.getDate() - d.getDay());
      const key = weekStart.toISOString().slice(0, 10);
      if (!byWeek[key]) byWeek[key] = [];
      byWeek[key].push(overallAverage(r));
    });
    return Object.entries(byWeek)
      .sort((a, b) => (a[0] < b[0] ? -1 : 1))
      .slice(-12)
      .map(([week, vals]) => ({
        week: new Date(week).toLocaleDateString(undefined, { month: "short", day: "numeric" }),
        score: Number((vals.reduce((s, v) => s + v, 0) / vals.length).toFixed(2)),
        count: vals.length,
      }));
  }, [filtered]);

  const comments = useMemo(
    () =>
      filtered
        .filter((r) => r.comment)
        .sort((a, b) => (a.ts < b.ts ? 1 : -1))
        .slice(0, 12),
    [filtered]
  );

  const flagged = categoryData.filter((c) => c.score > 0 && c.score < 3).length;

  return (
    <div>
      <div className="filter-bar">
        <div className="filter-field">
          <label>{t.filterDepartmentLabel}</label>
          <select value={deptFilter} onChange={(e) => setDeptFilter(e.target.value)}>
            <option value="All">{t.allDepartments}</option>
            {filterDeptOptions.map((d) => (
              <option key={d} value={d}>{t.departments[d] || d}</option>
            ))}
          </select>
        </div>
        <div className="filter-field">
          <label>{t.filterShiftLabel}</label>
          <select value={shiftFilter} onChange={(e) => setShiftFilter(e.target.value)}>
            <option value="All">{t.allShifts}</option>
            {filterShiftOptions.map((s) => (
              <option key={s} value={s}>{t.shifts[s] || s}</option>
            ))}
          </select>
        </div>
        <div className="filter-count">{t.responseCount(filtered.length)}</div>
      </div>

      <div className="panel-row top-row">
        <div className="gauge-panel">
          <div className="panel-title">{t.overallSatisfaction}</div>
          <Gauge value={overall} theme={theme} outOf5Label={t.outOf5} />
        </div>
        <div className="kpi-grid">
          <StatCard label={t.totalResponses} value={filtered.length} />
          <StatCard
            label={t.strongestArea}
            value={topCat ? topCat.name : "—"}
            sub={topCat ? `${fmt1(topCat.score)} / 5.0` : ""}
            accent="#4C9A6A"
          />
          <StatCard
            label={t.needsAttention}
            value={lowCat ? lowCat.name : "—"}
            sub={lowCat ? `${fmt1(lowCat.score)} / 5.0` : ""}
            accent="#E8552D"
          />
          <StatCard
            label={t.categoriesBelow3}
            value={flagged}
            sub={flagged > 0 ? t.outOf7Categories : t.noneFlagged}
            accent={flagged > 0 ? "#F5B400" : undefined}
          />
        </div>
      </div>

      <div className="panel">
        <div className="panel-title">{t.categoryScores}</div>
        <ResponsiveContainer width="100%" height={280}>
          <BarChart data={categoryData} layout="vertical" margin={{ left: 10, right: 20, top: 5, bottom: 5 }}>
            <CartesianGrid strokeDasharray="3 3" stroke={ct.grid} horizontal={false} />
            <XAxis type="number" domain={[0, 5]} stroke={ct.axis} fontSize={11} />
            <YAxis type="category" dataKey="name" stroke={ct.axis} fontSize={11} width={150} />
            <Tooltip
              contentStyle={{ background: ct.tooltipBg, border: `1px solid ${ct.tooltipBorder}`, borderRadius: 4 }}
              labelStyle={{ color: ct.tooltipLabel }}
              formatter={(v) => [v, t.avgScoreTooltip]}
            />
            <Bar dataKey="score" radius={[0, 3, 3, 0]}>
              {categoryData.map((entry, idx) => (
                <Cell key={idx} fill={entry.color} />
              ))}
            </Bar>
          </BarChart>
        </ResponsiveContainer>
      </div>

      <div className="panel">
        <div className="panel-title">{t.trendTitle}</div>
        {trendData.length > 1 ? (
          <ResponsiveContainer width="100%" height={240}>
            <LineChart data={trendData} margin={{ left: 0, right: 20, top: 10, bottom: 5 }}>
              <CartesianGrid strokeDasharray="3 3" stroke={ct.grid} />
              <XAxis dataKey="week" stroke={ct.axis} fontSize={11} />
              <YAxis domain={[1, 5]} stroke={ct.axis} fontSize={11} />
              <Tooltip
                contentStyle={{ background: ct.tooltipBg, border: `1px solid ${ct.tooltipBorder}`, borderRadius: 4 }}
                labelStyle={{ color: ct.tooltipLabel }}
              />
              <Line type="monotone" dataKey="score" stroke="#F5B400" strokeWidth={2} dot={{ r: 3 }} />
            </LineChart>
          </ResponsiveContainer>
        ) : (
          <div className="empty-note">{t.trendEmpty}</div>
        )}
      </div>

      <div className="panel">
        <div className="panel-title">{t.deptAvgTitle}</div>
        {deptData.length ? (
          <ResponsiveContainer width="100%" height={Math.max(180, deptData.length * 40)}>
            <BarChart data={deptData} layout="vertical" margin={{ left: 10, right: 30, top: 5, bottom: 5 }}>
              <CartesianGrid strokeDasharray="3 3" stroke={ct.grid} horizontal={false} />
              <XAxis type="number" domain={[0, 5]} stroke={ct.axis} fontSize={11} />
              <YAxis type="category" dataKey="name" stroke={ct.axis} fontSize={11} width={150} />
              <Tooltip
                contentStyle={{ background: ct.tooltipBg, border: `1px solid ${ct.tooltipBorder}`, borderRadius: 4 }}
                labelStyle={{ color: ct.tooltipLabel }}
                formatter={(v, n, p) => [`${v} (n=${p.payload.count})`, t.avgScoreTooltip]}
              />
              <Bar dataKey="score" radius={[0, 3, 3, 0]} fill="#3E8FB0" />
            </BarChart>
          </ResponsiveContainer>
        ) : (
          <div className="empty-note">{t.deptAvgEmpty}</div>
        )}
      </div>

      <div className="panel">
        <div className="panel-title">{t.recentComments}</div>
        {comments.length ? (
          <div className="comment-feed">
            {comments.map((r) => (
              <div className="comment-item" key={r.id}>
                <div className="comment-meta">
                  <span>{t.departments[r.department] || r.department}</span>
                  <span>·</span>
                  <span>{t.shifts[r.shift] || r.shift}</span>
                  <span>·</span>
                  <span>{new Date(r.ts).toLocaleDateString()}</span>
                </div>
                <p className="comment-text">{r.comment}</p>
              </div>
            ))}
          </div>
        ) : (
          <div className="empty-note">{t.commentsEmpty}</div>
        )}
      </div>
    </div>
  );
}

function ListManager({ title, desc, items, onAdd, onDelete, placeholder, addLabel, deleteLabel }) {

  const [error, setError] = useState("");
  const [busyId, setBusyId] = useState("");

  const handleAdd = async () => {
    const name = draft.trim();
    if (!name) return;
    setError("");
    try {
      await onAdd(name);
      setDraft("");
    } catch (e) {
      setError((e && (e.message || e.code)) || String(e));
    }

    setBusyId(item.id);

    setBusyId("");

  return (
    <div className="panel">

      <p className="empty-note" style={{ padding: "0 0 12px", textAlign: "left" }}>{desc}</p>
      <div className="list-manager-items">

          <span className="list-chip" key={item.id}>
            {item.name}
            <button
              type="button"
              className="list-chip-remove"
              onClick={() => handleDelete(item)}
              disabled={busyId === item.id}
              aria-label={`${deleteLabel}: ${item.name}`}
            >

          </span>
        ))}
      </div>
      {error && <div className="error-msg" style={{ marginTop: 12 }}>{error}</div>}
      <div className="field-row" style={{ marginTop: 12, marginBottom: 0 }}>

          {addLabel}
        </button>
      </div>
    </div>
  );
}

function SettingsPanel({
  surveyUrl, onSaveUrl, logoUrl, onSaveLogo, onRemoveLogo,
  departments, onAddDepartment, onDeleteDepartment,
  shifts, onAddShift, onDeleteShift,
  t,
}) {
  const [draft, setDraft] = useState(surveyUrl);
  const [saved, setSaved] = useState(false);
  const [logoBusy, setLogoBusy] = useState(false);
  const [linkError, setLinkError] = useState("");
  const [logoError, setLogoError] = useState("");

  useEffect(() => {
    setDraft(surveyUrl);
  }, [surveyUrl]);

  const handleSave = async () => {
    setLinkError("");
    try {
      await onSaveUrl(draft.trim());
      setSaved(true);
      setTimeout(() => setSaved(false), 2000);
    } catch (e) {
      setLinkError((e && (e.message || e.code)) || String(e));
    }
  };

  const handleLogoFile = (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setLogoError("");
    setLogoBusy(true);
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const maxDim = 200;
        let { width, height } = img;
        if (width > height) {
          if (width > maxDim) {
            height = Math.round((height * maxDim) / width);
            width = maxDim;
          }
        } else {
          if (height > maxDim) {
            width = Math.round((width * maxDim) / height);
            height = maxDim;
          }
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        const dataUrl = canvas.toDataURL("image/png");
        onSaveLogo(dataUrl)
          .catch((err) => setLogoError((err && (err.message || err.code)) || String(err)))
          .finally(() => setLogoBusy(false));
      };
      img.onerror = () => setLogoBusy(false);
      img.src = reader.result;
    };
    reader.onerror = () => setLogoBusy(false);
    reader.readAsDataURL(file);
  };

  const handleRemoveLogo = async () => {
    setLogoError("");
    try {
      await onRemoveLogo();
    } catch (e) {
      setLogoError((e && (e.message || e.code)) || String(e));
    }
  };

  return (
    <div>
      <div className="panel">
        <div className="panel-title">{t.logoSectionTitle}</div>
        <p className="empty-note" style={{ padding: "0 0 12px", textAlign: "left" }}>{t.logoDesc}</p>
        <div style={{ display: "flex", alignItems: "center", gap: 16, flexWrap: "wrap" }}>
          <div className="logo-preview-box">
            {logoUrl ? (
              <img src={logoUrl} alt={t.logoAlt} className="logo-preview-img" />
            ) : (
              <span className="logo-preview-empty">{t.logoAlt}</span>
            )}
          </div>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            <label className="submit-btn small-btn" style={{ background: "#3E8FB0", cursor: "pointer" }}>
              {logoBusy ? "..." : t.uploadLogoBtn}
              <input type="file" accept="image/*" onChange={handleLogoFile} style={{ display: "none" }} disabled={logoBusy} />
            </label>
            {logoUrl && (
              <button className="submit-btn small-btn" style={{ background: "#6C7A89" }} onClick={handleRemoveLogo}>
                {t.removeLogoBtn}
              </button>
            )}
          </div>
        </div>
        {logoError && <div className="error-msg" style={{ marginTop: 12 }}>{logoError}</div>}
      </div>

      <div className="panel">
        <div className="panel-title">{t.surveyLinkTitle}</div>
        <p className="empty-note" style={{ padding: "0 0 12px", textAlign: "left" }}>{t.surveyLinkDesc}</p>
        <div className="field-row" style={{ marginBottom: 4, alignItems: "center" }}>
          <input
            className="name-input"
            style={{ flex: 1 }}
            placeholder={t.linkPlaceholder}
            value={draft}
            onChange={(e) => setDraft(e.target.value)}
          />
          <button className="submit-btn small-btn" onClick={handleSave}>
            {saved ? t.saved : t.saveLink}
          </button>
        </div>
        {linkError && <div className="error-msg">{linkError}</div>}
      </div>

      <ListManager
        title={t.departmentsSectionTitle}
        desc={t.departmentsDesc}
        items={departments}
        onAdd={onAddDepartment}
        onDelete={onDeleteDepartment}
        placeholder={t.addDepartmentPlaceholder}
        addLabel={t.addBtn}
        deleteLabel={t.deleteBtn}
      />

      <ListManager
        title={t.shiftsSectionTitle}
        desc={t.shiftsDesc}
        items={shifts}
        onAdd={onAddShift}
        onDelete={onDeleteShift}
        placeholder={t.addShiftPlaceholder}
        addLabel={t.addBtn}
        deleteLabel={t.deleteBtn}
      />
    </div>
  );
}

    DEFAULT_DEPARTMENTS.map((name) => ({ id: name, name }))
  );
  const [shifts, setShifts] = useState(DEFAULT_SHIFTS.map((name) => ({ id: name, name })));
  const [user, setUser] = useState(null);
  const [showLogin, setShowLogin] = useState(false);
  const [storageOk, setStorageOk] = useState(true);

  const isAdmin = !!user;
  const t = T[lang] || T.en;

  useEffect(() => {
    const unsub = firebase.auth().onAuthStateChanged((u) => {
      setUser(u);
      if (u) setShowLogin(false);
      if (!u) setTab("survey");
    });
    return unsub;
  }, []);

  useEffect(() => {
    const ref = firebase.database().ref(CONFIG_DEPARTMENTS_PATH);
    const handler = (snap) => {
      const val = snap.val();
      if (val) {
        setDepartments(Object.entries(val).map(([id, v]) => ({ id, name: v.name })));
      }
    };
    ref.on("value", handler);
    return () => ref.off("value", handler);
  }, []);

  useEffect(() => {
    const ref = firebase.database().ref(CONFIG_SHIFTS_PATH);
    const handler = (snap) => {
      const val = snap.val();
      if (val) {
        setShifts(Object.entries(val).map(([id, v]) => ({ id, name: v.name })));
      }
    };
    ref.on("value", handler);
    return () => ref.off("value", handler);
  }, []);

  useEffect(() => {
    if (!user) return;
    const deptRef = firebase.database().ref(CONFIG_DEPARTMENTS_PATH);
    deptRef.once("value").then((snap) => {
      if (!snap.exists()) {
        const updates = {};
        DEFAULT_DEPARTMENTS.forEach((name) => {
          updates[deptRef.push().key] = { name };
        });
        deptRef.update(updates).catch(() => {});
      }
    });
    const shiftRef = firebase.database().ref(CONFIG_SHIFTS_PATH);
    shiftRef.once("value").then((snap) => {
      if (!snap.exists()) {
        const updates = {};
        DEFAULT_SHIFTS.forEach((name) => {
          updates[shiftRef.push().key] = { name };
        });
        shiftRef.update(updates).catch(() => {});
      }
    });
  }, [user]);

  useEffect(() => {
    if (!user) {
      setResponses([]);
      return;
    }
    const ref = firebase.database().ref(RESPONSES_PATH);
    const handler = (snapshot) => {
      const val = snapshot.val();
      if (val) {
        setResponses(Object.values(val));
      } else {
        const seed = generateSeedData();
        const seedObj = {};
        seed.forEach((r) => {
          seedObj[r.id] = r;
        });
        ref.set(seedObj).catch(() => setStorageOk(false));
        setResponses(seed);
      }
    };
    const errHandler = () => setStorageOk(false);
    ref.on("value", handler, errHandler);
    return () => ref.off("value", handler);
  }, [user]);

  useEffect(() => {

        .gauge-panel { flex: 1; min-width: 260px; background: var(--bg-panel); border: 1px solid var(--panel-border); border-radius: 4px; padding: 18px; text-align: center; }
        .kpi-grid { flex: 2; min-width: 280px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .stat-card { background: var(--bg-panel); border: 1px solid var(--panel-border); border-radius: 4px; padding: 14px; }
        .stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-secondary); margin-bottom: 6px; }
        .stat-value { font-family: 'IBM Plex Mono', 'Noto Sans Devanagari', 'Noto Sans Gujarati', 'Noto Sans Tamil', monospace; font-size: 16px; font-weight: 600; color: var(--text-primary); }
        .stat-sub { font-size: 11px; color: var(--text-tertiary); margin-top: 4px; }

        .empty-note { color: var(--text-tertiary); font-size: 13px; padding: 20px 0; text-align: center; }

        .comment-feed { display: flex; flex-direction: column; gap: 12px; max-height: 380px; overflow-y: auto; }
        .comment-item { border-left: 3px solid #F5B400; padding: 6px 12px; background: var(--comment-bg); border-radius: 0 3px 3px 0; }
        .comment-meta { font-family: 'IBM Plex Mono', 'Noto Sans Devanagari', 'Noto Sans Gujarati', 'Noto Sans Tamil', monospace; font-size: 10px; color: var(--text-tertiary); display: flex; gap: 6px; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
        .comment-text { font-size: 13px; margin: 0; color: var(--text-primary); }

        .storage-note { font-size: 11px; color: var(--text-tertiary); text-align: center; margin-top: -8px; margin-bottom: 16px; }

        .header-logo { height: 40px; width: auto; border-radius: 3px; }
        .poster-logo { height: 56px; width: auto; margin: 0 auto 14px; display: block; border-radius: 3px; }
        .form-logo { height: 44px; width: auto; margin: 0 0 14px; border-radius: 3px; }
        .logo-preview-box {
          width: 96px; height: 96px; border: 1px dashed var(--panel-border); border-radius: 4px;
          display: flex; align-items: center; justify-content: center; overflow: hidden; background: var(--bg-tab);
        }
        .logo-preview-img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .logo-preview-empty { font-size: 10px; color: var(--text-tertiary); text-align: center; padding: 4px; }
        .list-manager-items { display: flex; flex-wrap: wrap; gap: 8px; }
        .list-chip {
          display: inline-flex; align-items: center; gap: 6px;
          background: var(--bg-tab); border: 1px solid var(--tab-border); border-radius: 999px;
          padding: 6px 8px 6px 14px; font-size: 13px; color: var(--text-primary);
        }
        .list-chip-remove {
          background: transparent; border: none; color: var(--text-tertiary); cursor: pointer;
          font-size: 15px; line-height: 1; width: 20px; height: 20px; border-radius: 50%;
        }
        .list-chip-remove:hover { background: var(--panel-border); color: var(--text-primary); }
        .poster-card { text-align: center; padding: 2.5rem 1.5rem; }
        .poster-brand { display: none; }
        .poster-title {
          font-family: 'Oswald', 'Noto Sans Devanagari', 'Noto Sans Gujarati', 'Noto Sans Tamil', sans-serif;
          text-transform: uppercase;
          letter-spacing: 1px;
          font-size: 22px;
          margin: 0 0 6px;
          color: var(--text-primary);
        }
        .poster-sub { color: var(--text-secondary); font-size: 13px; margin: 0 0 24px; }
        .qr-box { display: flex; align-items: center; justify-content: center; min-height: 260px; margin-bottom: 18px; }
        .qr-box img { border-radius: 4px; background: #fff; padding: 12px; }
        .qr-placeholder {
          width: 260px; min-height: 236px; border: 2px dashed var(--panel-border);
          display: flex; align-items: center; justify-content: center; text-align: center;
          color: var(--text-tertiary); font-size: 13px; padding: 20px; border-radius: 4px;
        }
        .poster-hint { color: var(--text-tertiary); font-size: 12px; margin: 0; }

        .print-only { display: none; }
        @media print {
          .no-print { display: none !important; }
          .print-only { display: block; }
          .app-root { background: #fff !important; color: #000 !important; }
          .poster-card { border: 2px solid #000 !important; box-shadow: none !important; }
          .poster-title, .poster-sub, .poster-hint { color: #000 !important; }
          .poster-brand {
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            letter-spacing: 2px;
            font-size: 14px;
            text-transform: uppercase;
            margin-bottom: 10px;
          }
        }

        @media (max-width: 600px) {
          .field-row { flex-direction: column; }
          .likert-scale { gap: 6px; }
          .likert-btn { width: 34px; height: 34px; font-size: 12px; }
          .kpi-grid { grid-template-columns: 1fr 1fr; }
        }
        @media (prefers-reduced-motion: reduce) {
          * { transition: none !important; }
        }
      `}</style>

      <div className="no-print">
        <HazardBar />
        <div className="header-bar">
          <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
            {logoUrl && <img src={logoUrl} alt={t.logoAlt} className="header-logo" />}
            <div>
              <div className="brand">Ironbridge Manufacturing Co.</div>
              <div className="brand-sub">{t.brandSub}</div>
            </div>
          </div>
          <div className="tabs">
            <button className={"tab-btn" + (tab === "survey" ? " active" : "")} onClick={() => setTab("survey")}>
              {t.tabSurvey}
            </button>
            {isAdmin && (
              <>
                <button className={"tab-btn" + (tab === "dashboard" ? " active" : "")} onClick={() => setTab("dashboard")}>
                  {t.tabDashboard}
                </button>
                <button className={"tab-btn" + (tab === "poster" ? " active" : "")} onClick={() => setTab("poster")}>
                  {t.tabPoster}
                </button>
                <button className={"tab-btn" + (tab === "settings" ? " active" : "")} onClick={() => setTab("settings")}>
                  {t.tabSettings}
                </button>
              </>
            )}
            <select
              className="lang-select"
              value={lang}
              onChange={(e) => changeLang(e.target.value)}
              aria-label={t.langLabel}
            >
              {LANGUAGES.map((l) => (
                <option key={l.code} value={l.code}>{l.label}</option>
              ))}
            </select>
            <button className="theme-toggle" onClick={toggleTheme}>
              {theme === "dark" ? t.themeLight : t.themeDark}
            </button>
            {isAdmin ? (
              <button className="theme-toggle" onClick={handleLogout}>
                {t.logoutBtn}
              </button>
            ) : (
              <button className="theme-toggle" onClick={() => setShowLogin((v) => !v)}>
                {t.adminLoginBtn}
              </button>
            )}
          </div>
        </div>
        {!isAdmin && showLogin && (
          <div style={{ padding: "0 1.5rem 1rem" }}>
            <AdminLogin onCancel={() => setShowLogin(false)} t={t} />
          </div>
        )}
        <HazardBar />
      </div>

      <div className="content">
        {tab === "survey" || !isAdmin ? (
          <>
            <p className="storage-note">
              {t.storageNote}
              {!storageOk && t.storageNoteOffline}
            </p>
            <SurveyForm
              onSubmit={handleSubmit}
              t={t}
              logoUrl={logoUrl}
              departments={departments.map((d) => d.name)}
              shifts={shifts.map((s) => s.name)}
            />
          </>
        ) : tab === "dashboard" ? (
          <Dashboard
            responses={responses}
            theme={theme}
            t={t}
            departments={departments.map((d) => d.name)}
            shifts={shifts.map((s) => s.name)}
          />
        ) : tab === "poster" ? (
          <QRPoster surveyUrl={surveyUrl} logoUrl={logoUrl} onGoSettings={() => setTab("settings")} t={t} />
        ) : (
          <SettingsPanel
            surveyUrl={surveyUrl}
            onSaveUrl={saveSurveyUrl}
            logoUrl={logoUrl}
            onSaveLogo={saveLogo}
            onRemoveLogo={removeLogo}
            departments={departments}
            onAddDepartment={addDepartment}
            onDeleteDepartment={deleteDepartment}
            shifts={shifts}
            onAddShift={addShift}
            onDeleteShift={deleteShift}
            t={t}
          />
        )}
      </div>
    </div>
  );
}

const rootEl = document.getElementById("root");
const root = ReactDOM.createRoot(rootEl);
root.render(<App />);
</script>

    var s = document.createElement("script");
    s.text = out;
    document.body.appendChild(s);

</script>
</body>
