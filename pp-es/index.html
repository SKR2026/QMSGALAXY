          --text-primary: #EDEAE2;
          --text-secondary: #9AA1A8;
          --text-tertiary: #6C7A89;
          --comment-bg: #15181C;
        }
        .app-root[data-theme="light"] {
          --bg-page: #EAE7DD;
          --bg-header: #FFFFFF;
          --bg-tab: #F2EFE6;
          --tab-border: #D9D4C6;
          --bg-panel: #FFFFFF;
          --panel-border: #DCD7C9;
          --text-primary: #201F1B;
          --text-secondary: #6B6A62;
          --text-tertiary: #8B8979;
          --comment-bg: #F5F3EA;
        }

        .app-root {
          background: var(--bg-page);
          color: var(--text-primary);
          font-family: 'Inter', 'Noto Sans Devanagari', 'Noto Sans Gujarati', 'Noto Sans Tamil', sans-serif;
          min-height: 100%;
          padding-bottom: 2rem;
        }
        .app-root * { box-sizing: border-box; }
        .header-bar {
          background: var(--bg-header);
          padding: 1.1rem 1.5rem;
          display: flex;
          align-items: center;
          justify-content: space-between;
          flex-wrap: wrap;
          gap: 12px;
        }
        .brand {
          font-family: 'Oswald', sans-serif;
          font-weight: 700;
          letter-spacing: 2px;
          font-size: 13px;
          color: #F5B400;
          text-transform: uppercase;
        }
        .brand-sub {
          font-family: 'Oswald', 'Noto Sans Devanagari', 'Noto Sans Gujarati', 'Noto Sans Tamil', sans-serif;
          font-size: 22px;
          font-weight: 600;
          color: var(--text-primary);
          text-transform: uppercase;
          letter-spacing: 0.5px;
          margin-top: 2px;
        }
        .tabs { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .tab-btn {
          font-family: 'Oswald', 'Noto Sans Devanagari', 'Noto Sans Gujarati', 'Noto Sans Tamil', sans-serif;
          background: var(--bg-tab);
          color: var(--text-secondary);
          border: 1px solid var(--tab-border);
          padding: 10px 18px;
          font-size: 13px;
          letter-spacing: 1px;
          text-transform: uppercase;
          cursor: pointer;
        }
        .tab-btn.active {
          background: #F5B400;
          color: #15181C;
          border-color: #F5B400;
        }
        .theme-toggle, .lang-select {
          font-family: 'Inter', 'Noto Sans Devanagari', 'Noto Sans Gujarati', 'Noto Sans Tamil', sans-serif;
          background: transparent;
          color: var(--text-secondary);
          border: 1px solid var(--tab-border);
          padding: 9px 14px;
          font-size: 12px;
          border-radius: 3px;
          cursor: pointer;
        }
        .theme-toggle:hover { color: var(--text-primary); border-color: var(--text-secondary); }
        .content { max-width: 900px; margin: 0 auto; padding: 1.5rem; }

        .paper-card {
          background: #EFEAE0;
          color: #24231F;
          border-radius: 4px;
          position: relative;
          box-shadow: 0 12px 30px rgba(0,0,0,0.35);
        }
        .form-lang-strip {
          display: flex; gap: 0; border-bottom: 2px solid #C9C4B6;
          background: #E4DFD5; border-radius: 4px 4px 0 0;
          overflow: hidden; flex-wrap: nowrap;
        }
        .form-lang-btn {
          flex: 1; padding: 9px 4px; border: none; background: transparent;
          font-family: 'Noto Sans Devanagari','Noto Sans Gujarati','Noto Sans Tamil','Inter',sans-serif;
          font-size: 13px; font-weight: 500; color: #6B6560; cursor: pointer;
          border-right: 1px solid #C9C4B6; transition: background 0.15s;
          white-space: nowrap;
        }
        .form-lang-btn:last-child { border-right: none; }
        .form-lang-btn:hover { background: #D9D4CA; color: #24231F; }
        .form-lang-btn.active {
          background: #F5B400; color: #24231F; font-weight: 700;
        }
        .clip {
          position: absolute;
          top: -14px;
          left: 50%;
          transform: translateX(-50%);
          width: 70px;
          height: 26px;
          background: #6C7A89;
          border-radius: 4px;
          box-shadow: 0 3px 6px rgba(0,0,0,0.4);
        }
        .paper-inner { padding: 2rem 1.75rem 2.25rem; }
        .form-title {
          font-family: 'Oswald', 'Noto Sans Devanagari', 'Noto Sans Gujarati', 'Noto Sans Tamil', sans-serif;
          font-size: 24px;
          font-weight: 600;
          margin: 0 0 4px;
          text-transform: uppercase;
          letter-spacing: 0.5px;
        }
        .form-sub { color: #5B5A52; font-size: 14px; margin: 0 0 20px; }

        .field-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
        .field { flex: 1; min-width: 160px; display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; }
        .field label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: #5B5A52; }
        select, textarea, .name-input {
          font-family: 'Inter', 'Noto Sans Devanagari', 'Noto Sans Gujarati', 'Noto Sans Tamil', sans-serif;
          background: #FFFDF8;
          border: 1px solid #C9C4B6;
          border-radius: 3px;
          padding: 9px 10px;
          font-size: 14px;
          color: #24231F;
        }
        textarea { resize: vertical; width: 100%; }
        select:focus, textarea:focus, .name-input:focus { outline: 2px solid #F5B400; outline-offset: 1px; }

        .anon-row { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
        .check-label { display: flex; align-items: center; gap: 8px; font-size: 14px; }
        .name-input { flex: 1; min-width: 180px; }

        .cat-block { margin-top: 22px; }
        .cat-heading {
          font-family: 'Oswald', 'Noto Sans Devanagari', 'Noto Sans Gujarati', 'Noto Sans Tamil', sans-serif;
          font-size: 15px;
          text-transform: uppercase;
          letter-spacing: 1px;
          border-left: 4px solid;
          padding-left: 10px;
          margin-bottom: 10px;
        }
        .likert-row { margin-bottom: 16px; }
        .likert-text { font-size: 14px; margin: 0 0 8px; }
        .likert-scale { display: flex; gap: 8px; }
        .likert-btn {
          width: 40px; height: 40px;
          border-radius: 50%;
          border: 2px solid #C9C4B6;
          background: #FFFDF8;
          font-family: 'IBM Plex Mono', monospace;
          font-weight: 600;
          font-size: 14px;
          color: #5B5A52;
          cursor: pointer;
        }
        .likert-btn.selected { background: #F5B400; border-color: #F5B400; color: #24231F; }
        .likert-caps { display: flex; justify-content: space-between; font-size: 10px; color: #8A8577; margin-top: 4px; max-width: 260px; }

        .error-msg { background: #FBE3DA; color: #A3411E; border: 1px solid #E8552D; padding: 10px 12px; border-radius: 3px; font-size: 13px; margin: 16px 0; }

        .submit-btn {
          font-family: 'Oswald', 'Noto Sans Devanagari', 'Noto Sans Gujarati', 'Noto Sans Tamil', sans-serif;
          text-transform: uppercase;
          letter-spacing: 1px;
          background: #E8552D;
          color: #FFFDF8;
          border: none;
          padding: 13px 28px;
          font-size: 14px;
          font-weight: 600;
          border-radius: 3px;
          cursor: pointer;
          margin-top: 12px;
        }
        .submit-btn.small-btn { padding: 10px 20px; font-size: 13px; margin-top: 0; }
        .submit-btn:disabled { opacity: 0.6; cursor: default; }
        .submit-btn:hover:not(:disabled) { background: #D14A26; }

        .plant-pill-bar {
          display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
          padding: 0 0 16px;
        }
        .plant-pill {
          display: inline-flex; align-items: center;
          padding: 7px 18px; border-radius: 999px;
          border: 1.5px solid var(--tab-border);
          background: var(--bg-tab); color: var(--text-secondary);
          font-size: 13px; font-weight: 500; cursor: pointer;
          transition: all 0.15s ease; white-space: nowrap;
          font-family: inherit;
        }
        .plant-pill:hover { border-color: #E8552D; color: #E8552D; }
        .plant-pill.active {
          background: #E8552D; border-color: #E8552D;
          color: #fff; font-weight: 600;
        }

        .filter-bar {
          display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap;
          background: var(--bg-panel); border: 1px solid var(--panel-border); padding: 14px 16px; border-radius: 4px; margin-bottom: 18px;
        }
        .filter-field { display: flex; flex-direction: column; gap: 4px; }
        .filter-field label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-secondary); }
        .filter-field select { background: var(--bg-tab); color: var(--text-primary); border: 1px solid var(--tab-border); border-radius: 3px; padding: 8px 10px; font-size: 13px; }
        .filter-count { margin-left: auto; font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--text-secondary); }

        .panel { background: var(--bg-panel); border: 1px solid var(--panel-border); border-radius: 4px; padding: 18px; margin-bottom: 18px; }
        .panel-title { font-family: 'Oswald', 'Noto Sans Devanagari', 'Noto Sans Gujarati', 'Noto Sans Tamil', sans-serif; text-transform: uppercase; letter-spacing: 1px; font-size: 13px; color: var(--text-secondary); margin-bottom: 14px; }
        .panel-row.top-row { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 18px; }
        .gauge-panel { flex: 1; min-width: 260px; background: var(--bg-panel); border: 1px solid var(--panel-border); border-radius: 4px; padding: 18px; text-align: center; }
        .kpi-grid { flex: 2; min-width: 280px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .stat-card { background: var(--bg-panel); border: 1px solid var(--panel-border); border-radius: 4px; padding: 14px; }
        .stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-secondary); margin-bottom: 6px; }
        .stat-value { font-family: 'IBM Plex Mono', 'Noto Sans Devanagari', 'Noto Sans Gujarati', 'Noto Sans Tamil', monospace; font-size: 16px; font-weight: 600; color: var(--text-primary); }
        .stat-sub { font-size: 11px; color: var(--text-tertiary); margin-top: 4px; }

        .empty-note { color: var(--text-tertiary); font-size: 13px; padding: 20px 0; text-align: center; }

        .comment-feed { display: flex; flex-direction: column; gap: 12px; max-height: 380px; overflow-y: auto; }
        .comment-item { border-left: 3px solid #F5B400; padding: 6px 12px; background: var(--comment-bg); border-radius: 0 3px 3px 0; }
        .comment-meta { font-family: 'IBM Plex Mono', 'Noto Sans Devanagari', 'Noto Sans Gujarati', 'Noto Sans Tamil', monospace; font-size: 10px; color: var(--text-tertiary); display: flex; gap: 6px; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
        .comment-text { font-size: 13px; margin: 0; color: var(--text-primary); }

        .storage-note { font-size: 11px; color: var(--text-tertiary); text-align: center; margin-top: -8px; margin-bottom: 16px; }

        .header-logo { height: 40px; width: auto; border-radius: 3px; }
        .poster-logo { height: 56px; width: auto; margin: 0 auto 14px; display: block; border-radius: 3px; }
        .form-logo { height: 44px; width: auto; margin: 0 0 14px; border-radius: 3px; }
        .logo-preview-box {
          width: 96px; height: 96px; border: 1px dashed var(--panel-border); border-radius: 4px;
          display: flex; align-items: center; justify-content: center; overflow: hidden; background: var(--bg-tab);
        }
        .logo-preview-img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .logo-preview-empty { font-size: 10px; color: var(--text-tertiary); text-align: center; padding: 4px; }
        .list-manager-items { display: flex; flex-wrap: wrap; gap: 8px; }
        .list-chip {
          display: inline-flex; align-items: center; gap: 6px;
          background: var(--bg-tab); border: 1px solid var(--tab-border); border-radius: 999px;
          padding: 6px 8px 6px 14px; font-size: 13px; color: var(--text-primary);
        }
        .list-chip-remove {
          background: transparent; border: none; color: var(--text-tertiary); cursor: pointer;
          font-size: 15px; line-height: 1; width: 20px; height: 20px; border-radius: 50%;
        }
        .list-chip-remove:hover { background: var(--panel-border); color: var(--text-primary); }
        .question-edit-row {
          display: flex; gap: 8px; align-items: flex-start; margin-bottom: 10px;
        }
        .question-edit-row textarea {
          flex: 1; resize: vertical; font-size: 13px;
        }
        .question-edit-actions { display: flex; flex-direction: column; gap: 6px; }
        .cat-manager-block {
          border-radius: 3px; padding: 10px 14px 14px; margin-bottom: 14px;
          background: var(--bg-tab);
        }
        .cat-edit-row {
          display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap;
        }
        .cat-color-dot {
          width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; border: 1px solid rgba(0,0,0,0.15);
        }
        .cat-heading-inline {
          flex: 1; font-family: 'Oswald','Noto Sans Devanagari','Noto Sans Gujarati','Noto Sans Tamil',sans-serif;
          font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;
          color: var(--text-primary); margin: 0;
        }
        .cat-action-btn {
          background: transparent; border: none; cursor: pointer; font-size: 14px;
          padding: 2px 4px; border-radius: 3px; line-height: 1;
        }
        .cat-action-btn:hover { background: var(--panel-border); }
        .cat-action-btn-delete:hover { background: #FBE3DA; }
        .cat-color-picker {
          width: 32px; height: 32px; padding: 2px; border: 1px solid var(--tab-border);
          border-radius: 4px; cursor: pointer; background: var(--bg-tab); flex-shrink: 0;
        }
        .cat-label-input { flex: 1; padding: 7px 10px; font-size: 13px; }
        .section-divider {
          font-family: 'Oswald',sans-serif; font-size: 11px; text-transform: uppercase;
          letter-spacing: 1px; color: var(--text-tertiary); margin: 18px 0 0;
          padding-bottom: 6px; border-bottom: 1px solid var(--panel-border);
        }
        .responses-table-wrap { overflow-x: auto; max-height: 420px; overflow-y: auto; }
        .responses-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .responses-table th {
          text-align: left; position: sticky; top: 0; background: var(--bg-panel);
          color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px;
          font-size: 10px; padding: 8px 10px; border-bottom: 1px solid var(--panel-border);
        }
        .responses-table td {
          padding: 8px 10px; border-bottom: 1px solid var(--panel-border); color: var(--text-primary);
          vertical-align: top;
        }
        .responses-table-comment { max-width: 320px; color: var(--text-secondary); }
        .poster-card { text-align: center; padding: 2.5rem 1.5rem; }
        .poster-brand { display: none; }
        .poster-company {
          font-family: 'Oswald','Noto Sans Devanagari','Noto Sans Gujarati','Noto Sans Tamil',sans-serif;
          font-weight: 700;
          letter-spacing: 2px;
          font-size: 13px;
          text-transform: uppercase;
          color: var(--text-secondary);
          margin-bottom: 10px;
        }
        .poster-title {
          font-family: 'Oswald', 'Noto Sans Devanagari', 'Noto Sans Gujarati', 'Noto Sans Tamil', sans-serif;
          text-transform: uppercase;
          letter-spacing: 1px;
          font-size: 22px;
          margin: 0 0 6px;
          color: var(--text-primary);
        }
        .poster-sub { color: var(--text-secondary); font-size: 13px; margin: 0 0 24px; }
        .qr-box { display: flex; align-items: center; justify-content: center; min-height: 260px; margin-bottom: 18px; }
        .qr-box img { border-radius: 4px; background: #fff; padding: 12px; }
        .qr-placeholder {
          width: 260px; min-height: 236px; border: 2px dashed var(--panel-border);
          display: flex; align-items: center; justify-content: center; text-align: center;
          color: var(--text-tertiary); font-size: 13px; padding: 20px; border-radius: 4px;
        }
        .poster-hint { color: var(--text-tertiary); font-size: 12px; margin: 0; }

        .print-only { display: none; }
        @media print {
          /* Zero top/bottom margins removes browser-added date, URL, title */
          @page {
            size: A4 portrait;
            margin: 12mm;
            margin-top: 0mm;
            margin-bottom: 0mm;
          }

          /* Hide everything */
          * { visibility: hidden !important; }
          /* Show only the poster card and its children */
          .poster-card, .poster-card * { visibility: visible !important; }
          /* Force white background everywhere */
          html, body, .app-root, .content, .panel, .poster-card {
            background: #fff !important;
            color: #000 !important;
          }
          /* Position poster card to fill the page */
          .poster-card {
            position: fixed !important;
            top: 0 !important; left: 0 !important;
            width: 100% !important;
            border: none !important;
            box-shadow: none !important;
            margin: 0 !important;
            padding: 2rem !important;
          }
          .no-print { display: none !important; }
          .print-only { display: block !important; }
          .poster-title, .poster-sub, .poster-hint { color: #000 !important; }
          .poster-company { color: #000 !important; font-size: 14px; letter-spacing: 2px; }
        }

        @media (max-width: 600px) {
          .field-row { flex-direction: column; }
          .likert-scale { gap: 6px; }
          .likert-btn { width: 34px; height: 34px; font-size: 12px; }
          .kpi-grid { grid-template-columns: 1fr 1fr; }
        }
        @media (prefers-reduced-motion: reduce) {
          * { transition: none !important; }
        }
      `}</style>

      <div className="no-print">
        <HazardBar />
        <div className="header-bar">
          <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
            {logoUrl && <img src={logoUrl} alt={t.logoAlt} className="header-logo" />}
            <div>
              <div className="brand">{companyName}</div>
              <div className="brand-sub">{t.brandSub}</div>
            </div>
          </div>
          <div className="tabs">
            <button className={"tab-btn" + (tab === "survey" ? " active" : "")} onClick={() => setTab("survey")}>
              {t.tabSurvey}
            </button>
            {isAdmin && (
              <>
                <button className={"tab-btn" + (tab === "dashboard" ? " active" : "")} onClick={() => setTab("dashboard")}>
                  {t.tabDashboard}
                </button>
                <button className={"tab-btn" + (tab === "poster" ? " active" : "")} onClick={() => setTab("poster")}>
                  {t.tabPoster}
                </button>
                <button className={"tab-btn" + (tab === "settings" ? " active" : "")} onClick={() => setTab("settings")}>
                  {t.tabSettings}
                </button>
              </>
            )}
            {!isAdmin && (
              <select
                className="lang-select"
                value={lang}
                onChange={(e) => changeLang(e.target.value)}
                aria-label={t.langLabel}
              >
                {LANGUAGES.map((l) => (
                  <option key={l.code} value={l.code}>{l.label}</option>
                ))}
              </select>
            )}
            <button className="theme-toggle" onClick={toggleTheme}>
              {theme === "dark" ? t.themeLight : t.themeDark}
            </button>
            {isAdmin ? (
              <button className="theme-toggle" onClick={handleLogout}>
                {t.logoutBtn}
              </button>
            ) : (
              <button className="theme-toggle" onClick={() => setShowLogin((v) => !v)}>
                {t.adminLoginBtn}
              </button>
            )}
          </div>
        </div>
        {!isAdmin && showLogin && (
          <div style={{ padding: "0 1.5rem 1rem" }}>
            <AdminLogin onCancel={() => setShowLogin(false)} t={t} />
          </div>
        )}
        <HazardBar />
      </div>

      <div className="content">
        {tab === "survey" || !isAdmin ? (
          <>
            <p className="storage-note">
              {t.storageNote}
              {!storageOk && t.storageNoteOffline}
            </p>
            <SurveyForm
              onSubmit={handleSubmit}
              t={t}
              logoUrl={logoUrl}
              plants={plants.map((p) => p.name)}
              departments={departments.map((d) => d.name)}
              shifts={shifts.map((s) => s.name)}
              questions={questions}
              categories={categories}
              lang={lang}
              onChangeLang={changeLang}
            />
          </>
        ) : tab === "dashboard" ? (
          <Dashboard
            responses={responses}
            theme={theme}
            t={t}
            plants={plants.map((p) => p.name)}
            departments={departments.map((d) => d.name)}
            shifts={shifts.map((s) => s.name)}
            questions={questions}
            categories={categories}
            companyName={companyName}
            onDeleteResponses={deleteResponses}
          />
        ) : tab === "poster" ? (
          <QRPoster
            surveyUrl={surveyUrl}
            logoUrl={logoUrl}
            companyName={companyName}
            onGoSettings={() => setTab("settings")}
            t={t}
          />
        ) : (
          <SettingsPanel
            surveyUrl={surveyUrl}
            onSaveUrl={saveSurveyUrl}
            logoUrl={logoUrl}
            onSaveLogo={saveLogo}
            onRemoveLogo={removeLogo}
            companyName={companyName}
            onSaveCompanyName={saveCompanyName}
            plants={plants}
            onAddPlant={addPlant}
            onDeletePlant={deletePlant}
            departments={departments}
            onAddDepartment={addDepartment}
            onDeleteDepartment={deleteDepartment}
            shifts={shifts}
            onAddShift={addShift}
            onDeleteShift={deleteShift}
            questions={questions}
            onAddQuestion={addQuestion}
            onEditQuestion={editQuestion}
            onDeleteQuestion={deleteQuestion}
            categories={categories}
            onAddCategory={addCategory}
            onEditCategory={editCategory}
            onDeleteCategory={deleteCategory}
            t={t}
          />
        )}
      </div>
    </div>
  );
}

const rootEl = document.getElementById("root");
const root = ReactDOM.createRoot(rootEl);
root.render(<App />);
</script>
