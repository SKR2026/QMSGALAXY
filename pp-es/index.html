function clamp(n, lo, hi) {
  return Math.max(lo, Math.min(hi, n));
}

function categoryAverage(response, catKey, questions) {
  const qs = questions.filter((q) => q.category === catKey && typeof response.answers[q.id] === "number");
  if (!qs.length) return 0;
  const sum = qs.reduce((s, q) => s + response.answers[q.id], 0);
  return sum / qs.length;
}

function overallAverage(response) {
  const vals = Object.values(response.answers || {}).filter((v) => typeof v === "number");
  if (!vals.length) return 0;
  return vals.reduce((s, v) => s + v, 0) / vals.length;
}

function fmt1(n) {
  return Number.isFinite(n) ? n.toFixed(1) : "—";
}

function hexToRgb(hex) {
  const h = hex.replace("#", "");
  const n = parseInt(h.length === 3
    ? h.split("").map((c) => c + c).join("")
    : h, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

function codeToKey(code) {
  return code.trim().toUpperCase().replace(/[.#$\[\]\/]/g, "_");
}

const CHART_THEME = {
  dark: { grid: "#333A42", axis: "#9AA1A8", tooltipBg: "#1B1F24", tooltipBorder: "#333A42", tooltipLabel: "#EDEAE2" },
  light: { grid: "#E3DFD2", axis: "#6B6A62", tooltipBg: "#FFFFFF", tooltipBorder: "#DCD7C9", tooltipLabel: "#201F1B" },
};

function Gauge({ value, theme, outOf5Label }) {
  const pct = clamp((value - 1) / 4, 0, 1);
  const angle = -180 + pct * 180;           // -180° (left) → 0° (right)
  const cx = 130, cy = 120, r = 100;
  const trackWidth = 22;
  const needleLen = 82;

  const needleColor    = theme === "light" ? "#201F1B" : "#EDEAE2";
  const knobStroke     = theme === "light" ? "#FFFFFF" : "#15181C";
  const knobFill       = theme === "light" ? "#201F1B" : "#EDEAE2";
  const bgColor        = theme === "light" ? "#F0EDE4" : "#1E2229";
  const subtitleColor  = theme === "light" ? "#6B6A62" : "#9AA1A8";
  const scoreColor     = theme === "light" ? "#201F1B" : "#EDEAE2";

  // Arc helper — angles measured from positive-x axis; arc runs left-to-right along the top half
  const arc = (startPct, endPct, color) => {
    const a1 = Math.PI - startPct * Math.PI;   // left → right
    const a2 = Math.PI - endPct   * Math.PI;
    const x1 = cx + r * Math.cos(a1);
    const y1 = cy + r * Math.sin(a1);          // sin is positive → below cx,cy; we flip in viewBox
    const x2 = cx + r * Math.cos(a2);
    const y2 = cy + r * Math.sin(a2);
    return (
      <path
        d={`M ${x1} ${-y1 + 2 * cy} A ${r} ${r} 0 0 1 ${x2} ${-y2 + 2 * cy}`}
        stroke={color}
        strokeWidth={trackWidth}
        fill="none"
        strokeLinecap="butt"
      />
    );
  };

  // Needle tip coords
  const needleRad = (angle * Math.PI) / 180;
  const nx = cx + needleLen * Math.cos(needleRad);
  const ny = cy + needleLen * Math.sin(needleRad);

  // Score label — positioned in the space below the arc
  const scoreY = cy + 28;
  const labelY = cy + 46;

  return (
    <svg
      viewBox={`0 0 260 ${cy + 62}`}
      style={{ width: "100%", maxWidth: 300, display: "block", margin: "0 auto" }}
    >
      {/* Background pill for score area */}
      <rect x={cx - 52} y={scoreY - 22} width={104} height={52} rx={8}
        fill={bgColor} opacity="0.6" />

      {/* Coloured arc tracks */}
      {arc(0,     0.333, "#E8552D")}
      {arc(0.333, 0.667, "#F5B400")}
      {arc(0.667, 1,     "#4C9A6A")}

      {/* Scale tick marks */}
      {[1, 2, 3, 4, 5].map((v) => {
        const p = (v - 1) / 4;
        const a = Math.PI - p * Math.PI;
        const inner = r - trackWidth / 2 - 6;
        const outer = r + trackWidth / 2 + 4;
        const x1t = cx + inner * Math.cos(a);
        const y1t = cy - inner * Math.sin(a);
        const x2t = cx + outer * Math.cos(a);
        const y2t = cy - outer * Math.sin(a);
        const lx = cx + (outer + 13) * Math.cos(a);
        const ly = cy - (outer + 13) * Math.sin(a);
        return (
          <g key={v}>
            <line x1={x1t} y1={y1t} x2={x2t} y2={y2t}
              stroke={subtitleColor} strokeWidth="1.5" />
            <text x={lx} y={ly + 4} textAnchor="middle"
              fontFamily="'IBM Plex Mono',monospace" fontSize="9" fill={subtitleColor}>
              {v}
            </text>
          </g>
        );
      })}

      {/* Needle */}
      <line
        x1={cx} y1={cy}
        x2={nx} y2={ny}
        stroke={needleColor}
        strokeWidth="3.5"
        strokeLinecap="round"
      />
      {/* Knob */}
      <circle cx={cx} cy={cy} r="9" fill={knobFill} stroke={knobStroke} strokeWidth="2.5" />

      {/* Score */}
      <text x={cx} y={scoreY} textAnchor="middle"
        fontFamily="'IBM Plex Mono',monospace" fontSize="28" fontWeight="700"
        fill={scoreColor}>
        {fmt1(value)}
      </text>
      <text x={cx} y={labelY} textAnchor="middle"
        fontFamily="'Inter',sans-serif" fontSize="9" letterSpacing="1.5"
        fill={subtitleColor}>
        {outOf5Label}
      </text>
    </svg>
  );
}

      <div className="likert-scale">

function SurveyForm({ onSubmit, t, logoUrl, plants, departments, shifts, questions, categories, lang, onChangeLang }) {
  const [plant, setPlant] = useState(plants && plants.length === 1 ? plants[0] : "");
  const [department, setDepartment] = useState("");
  const [shift, setShift] = useState("");
  const [tenure, setTenure] = useState("");
  const [anonymous, setAnonymous] = useState(true);
  const [employeeName, setEmployeeName] = useState("");
  const [employeeCode, setEmployeeCode] = useState("");
  const [answers, setAnswers] = useState({});
  const [comment, setComment] = useState("");
  const [error, setError] = useState("");
  const [done, setDone] = useState(false);
  const [saving, setSaving] = useState(false);

  const visibleQuestions = useMemo(
    () => questions.filter((q) => categories.some((c) => c.id === q.category)),
    [questions, categories]
  );

  const setAnswer = useCallback((id, v) => {
    setAnswers((prev) => ({ ...prev, [id]: v }));
  }, []);

  const handleSubmit = async () => {
    if (!plant || !department || !shift || !tenure) {
      setError(t.errorFields);
      return;
    }
    if (Object.keys(answers).length < visibleQuestions.length) {
      setError(t.errorAnswers(Object.keys(answers).length, visibleQuestions.length));
      return;
    }
    setError("");
    setSaving(true);
    const response = {
      id: `r-${Date.now()}-${Math.floor(Math.random() * 10000)}`,
      ts: new Date().toISOString(),
      plant,
      department,
      shift,
      tenure,
      anonymous,
      employeeCode: employeeCode.trim(),
      employeeName: anonymous ? "" : employeeName.trim(),
      answers,
      comment: comment.trim(),
    };
    try {
      await onSubmit(response);
    } catch (e) {
      setError((e && (e.message || e.code)) || String(e));
      setSaving(false);
      return;
    }
    setSaving(false);
    setDone(true);
    setPlant(plants && plants.length === 1 ? plants[0] : "");
    setDepartment("");
    setShift("");
    setTenure("");
    setAnswers({});
    setComment("");
    setEmployeeCode("");
    setEmployeeName("");
  };

  if (done) {
    return (
      <div className="paper-card">
        <div className="clip" />
        <div className="form-lang-strip">
          {LANGUAGES.map((l) => (
            <button key={l.code} type="button"
              className={"form-lang-btn" + (lang === l.code ? " active" : "")}
              onClick={() => onChangeLang(l.code)}>
              {l.label}
            </button>
          ))}
        </div>
        <div className="paper-inner" style={{ textAlign: "center", padding: "3rem 1.5rem" }}>
          <div style={{ fontSize: 40, marginBottom: 8 }}>✓</div>
          <h2 className="form-title" style={{ marginBottom: 8 }}>{t.submittedTitle}</h2>
          <p style={{ color: "#5B5A52", marginBottom: 24 }}>{t.submittedBody}</p>
          <button className="submit-btn" onClick={() => setDone(false)}>
            {t.submitAnother}
          </button>
        </div>
      </div>
    );
  }

  return (
    <div className="paper-card">
      <div className="clip" />
      {/* ── Language strip ── */}
      <div className="form-lang-strip">
        {LANGUAGES.map((l) => (
          <button
            key={l.code}
            type="button"
            className={"form-lang-btn" + (lang === l.code ? " active" : "")}
            onClick={() => onChangeLang(l.code)}
          >
            {l.label}
          </button>
        ))}
      </div>
      <div className="paper-inner">
        {logoUrl && <img src={logoUrl} alt={t.logoAlt} className="form-logo" />}
        <h2 className="form-title">{t.formTitle}</h2>
        <p className="form-sub">{t.formSub}</p>

        <div className="field-row">
          <div className="field">
            <label>{t.employeeCodeLabel}</label>
            <input
              className="name-input"
              placeholder={t.employeeCodePlaceholder}
              value={employeeCode}
              onChange={(e) => setEmployeeCode(e.target.value)}
            />
          </div>
          <div className="field">
            <label>{t.employeeNameLabel}</label>
            <input
              className="name-input"
              placeholder={t.employeeNamePlaceholder}
              value={employeeName}
              onChange={(e) => setEmployeeName(e.target.value)}
            />
          </div>
        </div>

        <div className="field-row">
          {plants && plants.length > 1 && (
            <div className="field">
              <label>{t.fieldPlant}</label>
              <select value={plant} onChange={(e) => setPlant(e.target.value)}>
                <option value="">{t.selectPlant}</option>
                {plants.map((p) => (
                  <option key={p} value={p}>{p}</option>
                ))}
              </select>
            </div>
          )}
          <div className="field">
            <label>{t.fieldDepartment}</label>
            <select value={department} onChange={(e) => setDepartment(e.target.value)}>
              <option value="">{t.selectDepartment}</option>
              {departments.map((d) => (
                <option key={d} value={d}>{t.departments[d] || d}</option>
              ))}
            </select>
          </div>
          <div className="field">
            <label>{t.fieldShift}</label>
            <select value={shift} onChange={(e) => setShift(e.target.value)}>
              <option value="">{t.selectShift}</option>
              {shifts.map((s) => (
                <option key={s} value={s}>{t.shifts[s] || s}</option>
              ))}
            </select>
          </div>
          <div className="field">
            <label>{t.fieldTenure}</label>
            <select value={tenure} onChange={(e) => setTenure(e.target.value)}>
              <option value="">{t.selectTenure}</option>
              {TENURE_OPTIONS.map((tn) => (
                <option key={tn} value={tn}>{t.tenure[tn]}</option>
              ))}
            </select>
          </div>
        </div>

        <div className="anon-row">
          <label className="check-label">
            <input type="checkbox" checked={anonymous} onChange={(e) => setAnonymous(e.target.checked)} />
            {t.anonLabel}
          </label>
        </div>

        <HazardBar height={4} />

        {categories.map((cat) => {
          const catQs = visibleQuestions.filter((q) => q.category === cat.id);
          if (!catQs.length) return null;
          return (
            <div key={cat.id} className="cat-block">
              <h3 className="cat-heading" style={{ borderColor: cat.color }}>{cat.label}</h3>
              {catQs.map((q) => (
                <LikertRow key={q.id} question={q} value={answers[q.id]} onChange={setAnswer} t={t} />
              ))}
            </div>
          );
        })}

        <div className="field" style={{ marginTop: 8 }}>
          <label>{t.commentLabel}</label>
          <textarea
            rows={3}
            placeholder={t.commentPlaceholder}
            value={comment}
            onChange={(e) => setComment(e.target.value)}
          />
        </div>

        {error && <div className="error-msg">{error}</div>}

        <button className="submit-btn" onClick={handleSubmit} disabled={saving}>
          {saving ? t.submitting : t.submitBtn}
        </button>
      </div>
    </div>
  );
}

function Dashboard({ responses, theme, t, plants, departments, shifts, questions, categories, companyName, onDeleteResponses }) {
  const [plantFilter, setPlantFilter] = useState(ALL_PLANTS_ID);
  const [deptFilter, setDeptFilter] = useState("All");
  const [shiftFilter, setShiftFilter] = useState("All");
  const [selectedIds, setSelectedIds] = useState({});
  const [bulkBusy, setBulkBusy] = useState(false);
  const [bulkError, setBulkError] = useState("");
  const [exportBusy, setExportBusy] = useState(false);
  const ct = CHART_THEME[theme] || CHART_THEME.dark;

  const filterDeptOptions = useMemo(() => {
    return Array.from(new Set([...departments, ...responses.map((r) => r.department)]));
  }, [departments, responses]);

  const filterShiftOptions = useMemo(() => {
    return Array.from(new Set([...shifts, ...responses.map((r) => r.shift)]));
  }, [shifts, responses]);

  const filtered = useMemo(() => {
    return responses.filter(
      (r) =>
        (plantFilter === ALL_PLANTS_ID || r.plant === plantFilter) &&
        (deptFilter === "All" || r.department === deptFilter) &&
        (shiftFilter === "All" || r.shift === shiftFilter)
    );
  }, [responses, plantFilter, deptFilter, shiftFilter]);

  const overall = useMemo(() => {
    if (!filtered.length) return 0;
    return filtered.reduce((s, r) => s + overallAverage(r), 0) / filtered.length;
  }, [filtered]);

  const categoryData = useMemo(() => {
    return categories
      .filter((cat) => questions.some((q) => q.category === cat.id))
      .map((cat) => {
        const avg = filtered.length
          ? filtered.reduce((s, r) => s + categoryAverage(r, cat.id, questions), 0) / filtered.length
          : 0;
        return { key: cat.id, name: cat.label, score: Number(avg.toFixed(2)), color: cat.color };
      });
  }, [filtered, categories, questions]);

  const sortedCats = useMemo(
    () => [...categoryData].sort((a, b) => b.score - a.score),
    [categoryData]
  );
  const topCat = sortedCats[0];
  const lowCat = sortedCats[sortedCats.length - 1];

  const deptData = useMemo(() => {
    const names = Array.from(new Set(filtered.map((r) => r.department)));
    return names
      .map((d) => {
        const rs = filtered.filter((r) => r.department === d);
        const avg = rs.length ? rs.reduce((s, r) => s + overallAverage(r), 0) / rs.length : 0;
        return { name: t.departments[d] || d, score: Number(avg.toFixed(2)), count: rs.length };
      })
      .filter((d) => d.count > 0);
  }, [filtered, t]);

  const trendData = useMemo(() => {
    const byWeek = {};
    filtered.forEach((r) => {
      const d = new Date(r.ts);
      const weekStart = new Date(d);
      weekStart.setDate(d.getDate() - d.getDay());
      const key = weekStart.toISOString().slice(0, 10);
      if (!byWeek[key]) byWeek[key] = [];
      byWeek[key].push(overallAverage(r));
    });
    return Object.entries(byWeek)
      .sort((a, b) => (a[0] < b[0] ? -1 : 1))
      .slice(-12)
      .map(([week, vals]) => ({
        week: new Date(week).toLocaleDateString(undefined, { month: "short", day: "numeric" }),
        score: Number((vals.reduce((s, v) => s + v, 0) / vals.length).toFixed(2)),
        count: vals.length,
      }));
  }, [filtered]);

  const comments = useMemo(
    () =>
      filtered
        .filter((r) => r.comment)
        .sort((a, b) => (a.ts < b.ts ? 1 : -1))
        .slice(0, 12),
    [filtered]
  );

  const flagged = categoryData.filter((c) => c.score > 0 && c.score < 3).length;

  const allRows = useMemo(
    () => [...filtered].sort((a, b) => (a.ts < b.ts ? 1 : -1)),
    [filtered]
  );

  const selectedCount = Object.values(selectedIds).filter(Boolean).length;
  const allSelected = allRows.length > 0 && allRows.every((r) => selectedIds[r.id]);

  const toggleSelect = (id) => {
    setSelectedIds((prev) => ({ ...prev, [id]: !prev[id] }));
  };

  const toggleSelectAll = () => {
    if (allSelected) {
      setSelectedIds({});
    } else {
      const next = {};
      allRows.forEach((r) => {
        next[r.id] = true;
      });
      setSelectedIds(next);
    }
  };

  const handleDeleteSelected = async () => {
    const ids = Object.keys(selectedIds).filter((id) => selectedIds[id]);
    if (!ids.length) return;
    if (!window.confirm(t.confirmDeleteSelected(ids.length))) return;
    setBulkError("");
    setBulkBusy(true);
    try {
      await onDeleteResponses(ids);
      setSelectedIds({});
    } catch (e) {
      setBulkError((e && (e.message || e.code)) || String(e));
    }
    setBulkBusy(false);
  };

  const handleExportPdf = () => {
    setExportBusy(true);
    try {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });
      const W = doc.internal.pageSize.getWidth();
      const pageH = doc.internal.pageSize.getHeight();
      const margin = 14;
      const contentW = W - margin * 2;
      let y = margin;

      // ── Helper: section heading ────────────────────────────────
      const sectionHead = (title) => {
        if (y > pageH - 40) { doc.addPage(); y = margin; }
        doc.setFillColor(62, 143, 176);
        doc.rect(margin, y, contentW, 7, "F");
        doc.setTextColor(255, 255, 255);
        doc.setFontSize(9);
        doc.setFont("helvetica", "bold");
        doc.text(title.toUpperCase(), margin + 3, y + 5);
        doc.setTextColor(30, 30, 30);
        doc.setFont("helvetica", "normal");
        y += 10;
      };

      // ── Cover header ───────────────────────────────────────────
      doc.setFillColor(30, 34, 41);
      doc.rect(0, 0, W, 38, "F");
      // hazard stripe
      const stripeW = 14, stripeH = 4;
      for (let sx = 0; sx < W; sx += stripeW * 2) {
        doc.setFillColor(245, 180, 0);
        doc.rect(sx, 34, stripeW, stripeH, "F");
      }
      doc.setTextColor(245, 180, 0);
      doc.setFontSize(8);
      doc.setFont("helvetica", "bold");
      doc.text(companyName.toUpperCase(), margin, 12, { charSpace: 1.5 });
      doc.setTextColor(237, 234, 226);
      doc.setFontSize(16);
      doc.text(t.pdfTitle, margin, 24);
      doc.setFontSize(8);
      doc.setFont("helvetica", "normal");
      doc.setTextColor(154, 161, 168);
      doc.text(`${t.pdfGenerated}: ${new Date().toLocaleString()}`, margin, 31);
      if (plantFilter !== ALL_PLANTS_ID || deptFilter !== "All" || shiftFilter !== "All") {
        const filterText = [
          plantFilter !== ALL_PLANTS_ID ? plantFilter : null,
          deptFilter !== "All" ? deptFilter : null,
          shiftFilter !== "All" ? shiftFilter : null,
        ].filter(Boolean).join(" · ");
        doc.text(`Filter: ${filterText}`, W - margin, 31, { align: "right" });
      }
      doc.setTextColor(30, 30, 30);
      y = 46;

      // ── Overall score row ──────────────────────────────────────
      sectionHead(t.overallSatisfaction);
      // Gauge drawn as SVG-like arcs using jsPDF elliptic arcs
      const gCx = margin + 38, gCy = y + 22, gR = 20;
      // track arcs (simulate with polyline segments)
      const drawArc = (startPct, endPct, r, col) => {
        doc.setDrawColor(...col);
        doc.setLineWidth(4);
        const steps = 30;
        const points = [];
        for (let i = 0; i <= steps; i++) {
          const p = startPct + (endPct - startPct) * (i / steps);
          const a = Math.PI - p * Math.PI;
          points.push([gCx + r * Math.cos(a), gCy - r * Math.sin(a)]);
        }
        for (let i = 0; i < points.length - 1; i++) {
          doc.line(points[i][0], points[i][1], points[i + 1][0], points[i + 1][1]);
        }
      };
      drawArc(0, 0.333, gR, [232, 85, 45]);
      drawArc(0.333, 0.667, gR, [245, 180, 0]);
      drawArc(0.667, 1, gR, [76, 154, 106]);
      // needle
      const pct = clamp((overall - 1) / 4, 0, 1);
      const na = Math.PI - pct * Math.PI;
      const nLen = gR - 3;
      doc.setDrawColor(30, 34, 41);
      doc.setLineWidth(1);
      doc.line(gCx, gCy, gCx + nLen * Math.cos(na), gCy - nLen * Math.sin(na));
      doc.setFillColor(30, 34, 41);
      doc.circle(gCx, gCy, 2, "F");
      // score text
      doc.setFontSize(22);
      doc.setFont("helvetica", "bold");
      doc.setTextColor(30, 34, 41);
      doc.text(fmt1(overall), gCx, gCy + 10, { align: "center" });
      doc.setFontSize(7);
      doc.setFont("helvetica", "normal");
      doc.setTextColor(107, 106, 98);
      doc.text(t.outOf5, gCx, gCy + 15, { align: "center" });
      // KPI boxes
      const kpis = [
        { label: t.totalResponses, value: String(filtered.length) },
        { label: t.strongestArea, value: sortedCats[0] ? `${sortedCats[0].name}\n${fmt1(sortedCats[0].score)}/5` : "—" },
        { label: t.needsAttention, value: sortedCats[sortedCats.length - 1] ? `${sortedCats[sortedCats.length - 1].name}\n${fmt1(sortedCats[sortedCats.length - 1].score)}/5` : "—" },
      ];
      const kpiX = margin + 82, kpiW = (contentW - 82) / kpis.length, kpiH = 22;
      kpis.forEach((k, i) => {
        const kx = kpiX + i * kpiW;
        doc.setDrawColor(220, 215, 201);
        doc.setLineWidth(0.3);
        doc.roundedRect(kx, y, kpiW - 3, kpiH, 2, 2, "S");
        doc.setFontSize(7);
        doc.setFont("helvetica", "normal");
        doc.setTextColor(107, 106, 98);
        doc.text(k.label.toUpperCase(), kx + 4, y + 6);
        doc.setFontSize(9);
        doc.setFont("helvetica", "bold");
        doc.setTextColor(30, 34, 41);
        const lines = k.value.split("\n");
        lines.forEach((ln, li) => doc.text(ln, kx + 4, y + 13 + li * 6));
      });
      y += 30;

      // ── Category scores ────────────────────────────────────────
      sectionHead(t.categoryScores);
      const barRowH = 8, barMaxW = contentW - 55, barX = margin + 55;
      categoryData.forEach((c) => {
        if (y > pageH - 20) { doc.addPage(); y = margin; }
        // label
        doc.setFontSize(8);
        doc.setFont("helvetica", "normal");
        doc.setTextColor(30, 34, 41);
        doc.text(c.name, margin, y + 5.5);
        // bar bg
        doc.setFillColor(230, 227, 220);
        doc.roundedRect(barX, y + 1, barMaxW, barRowH - 2, 1, 1, "F");
        // bar fill
        const rgb = hexToRgb(c.color);
        doc.setFillColor(...rgb);
        const filled = (c.score / 5) * barMaxW;
        if (filled > 0) doc.roundedRect(barX, y + 1, filled, barRowH - 2, 1, 1, "F");
        // score label
        doc.setFontSize(8);
        doc.setFont("helvetica", "bold");
        doc.setTextColor(...rgb);
        doc.text(fmt1(c.score), barX + barMaxW + 3, y + 5.5);
        y += barRowH + 1;
      });
      y += 4;

      // ── Department breakdown ───────────────────────────────────
      if (deptData.length) {
        sectionHead(t.deptAvgTitle);
        doc.autoTable({
          startY: y,
          head: [[t.filterDepartmentLabel, t.avgScoreTooltip, "n"]],
          body: deptData.map((d) => [d.name, fmt1(d.score), d.count]),
          styles: { fontSize: 8, cellPadding: 3 },
          headStyles: { fillColor: [62, 143, 176], textColor: 255, fontStyle: "bold", fontSize: 8 },
          alternateRowStyles: { fillColor: [245, 243, 238] },
          margin: { left: margin, right: margin },
        });
        y = doc.lastAutoTable.finalY + 6;
      }

      // ── Trend ─────────────────────────────────────────────────
      if (trendData.length > 1) {
        sectionHead(t.trendTitle);
        const tw = contentW, th = 30, tx0 = margin, ty0 = y + th;
        const tMin = 1, tMax = 5;
        const tScaleX = (i) => tx0 + (i / (trendData.length - 1)) * tw;
        const tScaleY = (v) => ty0 - ((v - tMin) / (tMax - tMin)) * th;
        // grid lines
        [2, 3, 4, 5].forEach((v) => {
          doc.setDrawColor(210, 207, 200);
          doc.setLineWidth(0.2);
          doc.line(tx0, tScaleY(v), tx0 + tw, tScaleY(v));
          doc.setFontSize(6);
          doc.setTextColor(154, 161, 168);
          doc.text(String(v), tx0 - 4, tScaleY(v) + 2, { align: "right" });
        });
        // trend line
        doc.setDrawColor(245, 180, 0);
        doc.setLineWidth(1.2);
        trendData.forEach((d, i) => {
          if (i === 0) return;
          doc.line(tScaleX(i - 1), tScaleY(trendData[i - 1].score), tScaleX(i), tScaleY(d.score));
        });
        // dots + labels
        trendData.forEach((d, i) => {
          doc.setFillColor(245, 180, 0);
          doc.circle(tScaleX(i), tScaleY(d.score), 1.2, "F");
          if (i % Math.max(1, Math.floor(trendData.length / 6)) === 0) {
            doc.setFontSize(6);
            doc.setTextColor(107, 106, 98);
            doc.text(d.week, tScaleX(i), ty0 + 5, { align: "center" });
          }
        });
        y = ty0 + 10;
      }

      // ── Responses table ────────────────────────────────────────
      doc.addPage();
      y = margin;
      sectionHead(t.allResponsesTitle);
      doc.autoTable({
        startY: y,
        head: [[t.tableDate, "Code", t.filterDepartmentLabel, t.filterShiftLabel, t.avgScoreTooltip, t.tableComment]],
        body: allRows.map((r) => [
          new Date(r.ts).toLocaleDateString(),
          r.employeeCode || "—",
          t.departments[r.department] || r.department,
          t.shifts[r.shift] || r.shift,
          fmt1(overallAverage(r)),
          r.comment || "",
        ]),
        styles: { fontSize: 7, cellPadding: 2, overflow: "linebreak" },
        headStyles: { fillColor: [62, 143, 176], textColor: 255, fontStyle: "bold", fontSize: 7 },
        alternateRowStyles: { fillColor: [245, 243, 238] },
        columnStyles: { 5: { cellWidth: 55 } },
        margin: { left: margin, right: margin },
      });

      // ── Footer on every page ───────────────────────────────────
      const totalPages = doc.internal.getNumberOfPages();
      for (let p = 1; p <= totalPages; p++) {
        doc.setPage(p);
        doc.setFontSize(7);
        doc.setTextColor(154, 161, 168);
        doc.text(companyName, margin, pageH - 6);
        doc.text(`${p} / ${totalPages}`, W - margin, pageH - 6, { align: "right" });
      }

      doc.save(`employee-pulse-survey-${new Date().toISOString().slice(0, 10)}.pdf`);
    } catch (e) {
      console.error("PDF export failed:", e);
      setBulkError((e && e.message) || String(e));
    }
    setExportBusy(false);
  };

  return (
    <div>
      {plants && plants.length > 1 && (
        <div className="plant-pill-bar">
          <button
            className={"plant-pill" + (plantFilter === ALL_PLANTS_ID ? " active" : "")}
            onClick={() => setPlantFilter(ALL_PLANTS_ID)}
          >
            {t.allPlants || "All plants"}
          </button>
          {plants.map((p) => (
            <button
              key={p}
              className={"plant-pill" + (plantFilter === p ? " active" : "")}
              onClick={() => setPlantFilter(p)}
            >
              {p}
            </button>
          ))}
        </div>
      )}
      <div className="filter-bar">
        <div className="filter-field">
          <label>{t.filterDepartmentLabel}</label>
          <select value={deptFilter} onChange={(e) => setDeptFilter(e.target.value)}>
            <option value="All">{t.allDepartments}</option>
            {filterDeptOptions.map((d) => (
              <option key={d} value={d}>{t.departments[d] || d}</option>
            ))}
          </select>
        </div>
        <div className="filter-field">
          <label>{t.filterShiftLabel}</label>
          <select value={shiftFilter} onChange={(e) => setShiftFilter(e.target.value)}>
            <option value="All">{t.allShifts}</option>
            {filterShiftOptions.map((s) => (
              <option key={s} value={s}>{t.shifts[s] || s}</option>
            ))}
          </select>
        </div>
        <div className="filter-count">{t.responseCount(filtered.length)}</div>
      </div>

      <div className="panel-row top-row">
        <div className="gauge-panel">
          <div className="panel-title">{t.overallSatisfaction}</div>
          <Gauge value={overall} theme={theme} outOf5Label={t.outOf5} />
        </div>
        <div className="kpi-grid">
          <StatCard label={t.totalResponses} value={filtered.length} />
          <StatCard
            label={t.strongestArea}
            value={topCat ? topCat.name : "—"}
            sub={topCat ? `${fmt1(topCat.score)} / 5.0` : ""}
            accent="#4C9A6A"
          />
          <StatCard
            label={t.needsAttention}
            value={lowCat ? lowCat.name : "—"}
            sub={lowCat ? `${fmt1(lowCat.score)} / 5.0` : ""}
            accent="#E8552D"
          />
          <StatCard
            label={t.categoriesBelow3}
            value={flagged}
            sub={flagged > 0 ? t.outOf7Categories : t.noneFlagged}
            accent={flagged > 0 ? "#F5B400" : undefined}
          />
        </div>
      </div>

      <div className="panel">
        <div className="panel-title">{t.categoryScores}</div>
        <ResponsiveContainer width="100%" height={280}>
          <BarChart data={categoryData} layout="vertical" margin={{ left: 10, right: 20, top: 5, bottom: 5 }}>
            <CartesianGrid strokeDasharray="3 3" stroke={ct.grid} horizontal={false} />
            <XAxis type="number" domain={[0, 5]} stroke={ct.axis} fontSize={11} />
            <YAxis type="category" dataKey="name" stroke={ct.axis} fontSize={11} width={150} />
            <Tooltip
              contentStyle={{ background: ct.tooltipBg, border: `1px solid ${ct.tooltipBorder}`, borderRadius: 4 }}
              labelStyle={{ color: ct.tooltipLabel }}
              formatter={(v) => [v, t.avgScoreTooltip]}
            />
            <Bar dataKey="score" radius={[0, 3, 3, 0]}>
              {categoryData.map((entry, idx) => (
                <Cell key={idx} fill={entry.color} />
              ))}
            </Bar>
          </BarChart>
        </ResponsiveContainer>
      </div>

      <div className="panel">
        <div className="panel-title">{t.trendTitle}</div>
        {trendData.length > 1 ? (
          <ResponsiveContainer width="100%" height={240}>
            <LineChart data={trendData} margin={{ left: 0, right: 20, top: 10, bottom: 5 }}>
              <CartesianGrid strokeDasharray="3 3" stroke={ct.grid} />
              <XAxis dataKey="week" stroke={ct.axis} fontSize={11} />
              <YAxis domain={[1, 5]} stroke={ct.axis} fontSize={11} />
              <Tooltip
                contentStyle={{ background: ct.tooltipBg, border: `1px solid ${ct.tooltipBorder}`, borderRadius: 4 }}
                labelStyle={{ color: ct.tooltipLabel }}
              />
              <Line type="monotone" dataKey="score" stroke="#F5B400" strokeWidth={2} dot={{ r: 3 }} />
            </LineChart>
          </ResponsiveContainer>

          <div className="empty-note">{t.trendEmpty}</div>
        )}
      </div>

      <div className="panel">
        <div className="panel-title">{t.deptAvgTitle}</div>
        {deptData.length ? (
          <ResponsiveContainer width="100%" height={Math.max(180, deptData.length * 40)}>
            <BarChart data={deptData} layout="vertical" margin={{ left: 10, right: 30, top: 5, bottom: 5 }}>
              <CartesianGrid strokeDasharray="3 3" stroke={ct.grid} horizontal={false} />
              <XAxis type="number" domain={[0, 5]} stroke={ct.axis} fontSize={11} />
              <YAxis type="category" dataKey="name" stroke={ct.axis} fontSize={11} width={150} />
              <Tooltip
                contentStyle={{ background: ct.tooltipBg, border: `1px solid ${ct.tooltipBorder}`, borderRadius: 4 }}
                labelStyle={{ color: ct.tooltipLabel }}
                formatter={(v, n, p) => [`${v} (n=${p.payload.count})`, t.avgScoreTooltip]}
              />
              <Bar dataKey="score" radius={[0, 3, 3, 0]} fill="#3E8FB0" />
            </BarChart>
          </ResponsiveContainer>
        ) : (
          <div className="empty-note">{t.deptAvgEmpty}</div>
        )}
      </div>

      <div className="panel">
        <div className="panel-title">{t.recentComments}</div>
        {comments.length ? (
          <div className="comment-feed">
            {comments.map((r) => (
              <div className="comment-item" key={r.id}>
                <div className="comment-meta">
                  <span>{t.departments[r.department] || r.department}</span>
                  <span>·</span>
                  <span>{t.shifts[r.shift] || r.shift}</span>
                  <span>·</span>
                  <span>{new Date(r.ts).toLocaleDateString()}</span>
                </div>
                <p className="comment-text">{r.comment}</p>
              </div>

          </div>

      <div className="panel">
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 12, marginBottom: 14 }}>
          <div className="panel-title" style={{ marginBottom: 0 }}>{t.allResponsesTitle}</div>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            <button className="submit-btn small-btn" style={{ background: "#3E8FB0" }} onClick={handleExportPdf} disabled={exportBusy || !allRows.length}>

            <button

              style={{ background: "#E8552D" }}
              onClick={handleDeleteSelected}
              disabled={bulkBusy || !selectedCount}
            >
              {bulkBusy ? "…" : `${t.deleteSelectedBtn} (${selectedCount})`}
            </button>
          </div>
        </div>
        {bulkError && <div className="error-msg" style={{ marginBottom: 12 }}>{bulkError}</div>}
        {allRows.length ? (
          <div className="responses-table-wrap">
            <table className="responses-table">
              <thead>
                <tr>
                  <th>
                    <input type="checkbox" checked={allSelected} onChange={toggleSelectAll} />
                  </th>
                  <th>{t.tableDate}</th>
                  <th>{t.filterDepartmentLabel}</th>
                  <th>{t.filterShiftLabel}</th>
                  <th>{t.tableScore}</th>
                  <th>{t.tableComment}</th>
                </tr>
              </thead>
              <tbody>
                {allRows.map((r) => (
                  <tr key={r.id}>
                    <td>
                      <input type="checkbox" checked={!!selectedIds[r.id]} onChange={() => toggleSelect(r.id)} />
                    </td>
                    <td>{new Date(r.ts).toLocaleDateString()}</td>
                    <td>{t.departments[r.department] || r.department}</td>
                    <td>{t.shifts[r.shift] || r.shift}</td>
                    <td>{fmt1(overallAverage(r))}</td>
                    <td className="responses-table-comment">{r.comment || "—"}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        ) : (
          <div className="empty-note">{t.deptAvgEmpty}</div>
        )}
      </div>
    </div>
  );
}

function ListManager({ title, desc, items, onAdd, onDelete, placeholder, addLabel, deleteLabel }) {
  const [draft, setDraft] = useState("");
  const [error, setError] = useState("");
  const [busyId, setBusyId] = useState("");

  const handleAdd = async () => {
    const name = draft.trim();
    if (!name) return;
    setError("");
    try {
      await onAdd(name);
      setDraft("");
    } catch (e) {
      setError((e && (e.message || e.code)) || String(e));
    }
  };

  const handleDelete = async (item) => {
    setError("");
    setBusyId(item.id);
    try {
      await onDelete(item.id);
    } catch (e) {
      setError((e && (e.message || e.code)) || String(e));
    }
    setBusyId("");
  };

  return (
    <div className="panel">
      <div className="panel-title">{title}</div>
      <p className="empty-note" style={{ padding: "0 0 12px", textAlign: "left" }}>{desc}</p>
      <div className="list-manager-items">
        {items.map((item) => (
          <span className="list-chip" key={item.id}>
            {item.name}
            <button
              type="button"
              className="list-chip-remove"
              onClick={() => handleDelete(item)}
              disabled={busyId === item.id}
              aria-label={`${deleteLabel}: ${item.name}`}
            >
              ×
            </button>
          </span>
        ))}
      </div>
      {error && <div className="error-msg" style={{ marginTop: 12 }}>{error}</div>}
      <div className="field-row" style={{ marginTop: 12, marginBottom: 0 }}>
        <input
          className="name-input"
          style={{ flex: 1 }}
          placeholder={placeholder}
          value={draft}
          onChange={(e) => setDraft(e.target.value)}
          onKeyDown={(e) => {
            if (e.key === "Enter") handleAdd();
          }}
        />
        <button className="submit-btn small-btn" onClick={handleAdd}>
          {addLabel}
        </button>
      </div>
    </div>
  );
}

function SettingsPanel({
  surveyUrl, onSaveUrl, logoUrl, onSaveLogo, onRemoveLogo,
  companyName, onSaveCompanyName,
  plants, onAddPlant, onDeletePlant,
  departments, onAddDepartment, onDeleteDepartment,
  shifts, onAddShift, onDeleteShift,
  questions, onAddQuestion, onEditQuestion, onDeleteQuestion,
  categories, onAddCategory, onEditCategory, onDeleteCategory,
  t,
}) {
  const [draft, setDraft] = useState(surveyUrl);
  const [saved, setSaved] = useState(false);
  const [logoBusy, setLogoBusy] = useState(false);
  const [linkError, setLinkError] = useState("");
  const [logoError, setLogoError] = useState("");
  const [nameDraft, setNameDraft] = useState(companyName);
  const [nameSaved, setNameSaved] = useState(false);
  const [nameError, setNameError] = useState("");

  useEffect(() => {
    setDraft(surveyUrl);
  }, [surveyUrl]);

  useEffect(() => {
    setNameDraft(companyName);
  }, [companyName]);

  const handleSaveName = async () => {
    setNameError("");
    try {
      await onSaveCompanyName(nameDraft.trim() || DEFAULT_COMPANY_NAME);
      setNameSaved(true);
      setTimeout(() => setNameSaved(false), 2000);
    } catch (e) {
      setNameError((e && (e.message || e.code)) || String(e));
    }
  };

  const handleSave = async () => {
    setLinkError("");
    try {
      await onSaveUrl(draft.trim());
      setSaved(true);
      setTimeout(() => setSaved(false), 2000);
    } catch (e) {
      setLinkError((e && (e.message || e.code)) || String(e));
    }
  };

  const handleLogoFile = (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setLogoError("");
    setLogoBusy(true);
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const maxDim = 200;
        let { width, height } = img;
        if (width > height) {
          if (width > maxDim) {
            height = Math.round((height * maxDim) / width);
            width = maxDim;
          }
        } else {
          if (height > maxDim) {
            width = Math.round((width * maxDim) / height);
            height = maxDim;
          }
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        const dataUrl = canvas.toDataURL("image/png");
        onSaveLogo(dataUrl)
          .catch((err) => setLogoError((err && (err.message || err.code)) || String(err)))
          .finally(() => setLogoBusy(false));
      };
      img.onerror = () => setLogoBusy(false);
      img.src = reader.result;
    };
    reader.onerror = () => setLogoBusy(false);
    reader.readAsDataURL(file);
  };

  const handleRemoveLogo = async () => {
    setLogoError("");
    try {
      await onRemoveLogo();
    } catch (e) {
      setLogoError((e && (e.message || e.code)) || String(e));
    }
  };

  return (
    <div>
      <div className="panel">
        <div className="panel-title">{t.companyNameSectionTitle}</div>
        <p className="empty-note" style={{ padding: "0 0 12px", textAlign: "left" }}>{t.companyNameDesc}</p>
        <div className="field-row" style={{ marginBottom: 4, alignItems: "center" }}>
          <input
            className="name-input"
            style={{ flex: 1 }}
            placeholder={DEFAULT_COMPANY_NAME}
            value={nameDraft}
            onChange={(e) => setNameDraft(e.target.value)}
          />
          <button className="submit-btn small-btn" onClick={handleSaveName}>
            {nameSaved ? t.saved : t.saveLink}
          </button>
        </div>
        {nameError && <div className="error-msg">{nameError}</div>}
      </div>

      <div className="panel">
        <div className="panel-title">{t.logoSectionTitle}</div>
        <p className="empty-note" style={{ padding: "0 0 12px", textAlign: "left" }}>{t.logoDesc}</p>
        <div style={{ display: "flex", alignItems: "center", gap: 16, flexWrap: "wrap" }}>
          <div className="logo-preview-box">
            {logoUrl ? (
              <img src={logoUrl} alt={t.logoAlt} className="logo-preview-img" />
            ) : (
              <span className="logo-preview-empty">{t.logoAlt}</span>
            )}
          </div>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            <label className="submit-btn small-btn" style={{ background: "#3E8FB0", cursor: "pointer" }}>
              {logoBusy ? "..." : t.uploadLogoBtn}
              <input type="file" accept="image/*" onChange={handleLogoFile} style={{ display: "none" }} disabled={logoBusy} />
            </label>
            {logoUrl && (
              <button className="submit-btn small-btn" style={{ background: "#6C7A89" }} onClick={handleRemoveLogo}>
                {t.removeLogoBtn}
              </button>
            )}
          </div>
        </div>
        {logoError && <div className="error-msg" style={{ marginTop: 12 }}>{logoError}</div>}
      </div>

      <div className="panel">
        <div className="panel-title">{t.surveyLinkTitle}</div>
        <p className="empty-note" style={{ padding: "0 0 12px", textAlign: "left" }}>{t.surveyLinkDesc}</p>
        <div className="field-row" style={{ marginBottom: 4, alignItems: "center" }}>
          <input
            className="name-input"
            style={{ flex: 1 }}
            placeholder={t.linkPlaceholder}
            value={draft}
            onChange={(e) => setDraft(e.target.value)}
          />
          <button className="submit-btn small-btn" onClick={handleSave}>
            {saved ? t.saved : t.saveLink}
          </button>
        </div>
        {linkError && <div className="error-msg">{linkError}</div>}
      </div>

      <ListManager
        title={t.plantsSectionTitle || "Plants"}
        desc={t.plantsDesc || "Manage plant locations available in this app."}
        items={plants}
        onAdd={onAddPlant}
        onDelete={onDeletePlant}
        placeholder={t.addPlantPlaceholder || "Add a plant"}
        addLabel={t.addBtn}
        deleteLabel={t.deleteBtn}
      />

      <ListManager
        title={t.departmentsSectionTitle}
        desc={t.departmentsDesc}
        items={departments}
        onAdd={onAddDepartment}
        onDelete={onDeleteDepartment}
        placeholder={t.addDepartmentPlaceholder}
        addLabel={t.addBtn}
        deleteLabel={t.deleteBtn}
      />

      <ListManager
        title={t.shiftsSectionTitle}
        desc={t.shiftsDesc}
        items={shifts}
        onAdd={onAddShift}
        onDelete={onDeleteShift}
        placeholder={t.addShiftPlaceholder}
        addLabel={t.addBtn}
        deleteLabel={t.deleteBtn}
      />

      <QuestionsManager
        questions={questions}
        onAdd={onAddQuestion}
        onEdit={onEditQuestion}
        onDelete={onDeleteQuestion}
        categories={categories}
        onAddCategory={onAddCategory}
        onEditCategory={onEditCategory}
        onDeleteCategory={onDeleteCategory}
        t={t}
      />
    </div>
  );
}

function QuestionsManager({
  questions, onAdd, onEdit, onDelete,
  categories, onAddCategory, onEditCategory, onDeleteCategory,
  t,
}) {
  // Question draft state
  const [qDrafts, setQDrafts]   = useState({});
  const [newCatId, setNewCatId] = useState("");
  const [newQText, setNewQText] = useState("");

  // Category draft state
  const [catDrafts, setCatDrafts]       = useState({});        // { [id]: label }
  const [catColorDrafts, setCatColorDrafts] = useState({});    // { [id]: color }
  const [editingCatId, setEditingCatId] = useState(null);      // which heading is in edit mode
  const [newCatLabel, setNewCatLabel]   = useState("");
  const [newCatColor, setNewCatColor]   = useState(CATEGORY_PALETTE[0]);

  const [busy, setBusy]   = useState("");   // id of currently-saving item
  const [error, setError] = useState("");

  // initialise newCatId when categories first load
  useEffect(() => {
    if (!newCatId && categories.length) setNewCatId(categories[0].id);
  }, [categories, newCatId]);

  const qTextFor = (q) => (q.id in qDrafts ? qDrafts[q.id] : questionText(q, t));

  /* ── Question handlers ────────────────────────────────────────── */
  const handleEditQuestion = async (q) => {
    const val = (qDrafts[q.id] || "").trim();
    if (!val || val === questionText(q, t)) return;
    setError(""); setBusy(q.id);
    try { await onEdit(q.id, val); }
    catch (e) { setError((e && (e.message || e.code)) || String(e)); }
    setBusy("");
  };

  const handleDeleteQuestion = async (q) => {
    setError(""); setBusy(q.id);
    try { await onDelete(q.id); }
    catch (e) { setError((e && (e.message || e.code)) || String(e)); }
    setBusy("");
  };

  const handleAddQuestion = async () => {
    const text = newQText.trim();
    if (!text || !newCatId) return;
    setError("");
    try { await onAdd(newCatId, text); setNewQText(""); }
    catch (e) { setError((e && (e.message || e.code)) || String(e)); }
  };

  /* ── Category handlers ────────────────────────────────────────── */
  const startEditCat = (cat) => {
    setEditingCatId(cat.id);
    setCatDrafts((p) => ({ ...p, [cat.id]: cat.label }));
    setCatColorDrafts((p) => ({ ...p, [cat.id]: cat.color }));
  };

  const handleEditCategory = async (cat) => {
    const label = (catDrafts[cat.id] || "").trim();
    const color = catColorDrafts[cat.id] || cat.color;
    if (!label) return;
    setError(""); setBusy("cat_" + cat.id);
    try {
      await onEditCategory(cat.id, label, color);
      setEditingCatId(null);
    }
    catch (e) { setError((e && (e.message || e.code)) || String(e)); }
    setBusy("");
  };

  const handleDeleteCategory = async (cat) => {
    if (!window.confirm(t.confirmDeleteCategory(cat.label))) return;
    setError(""); setBusy("cat_" + cat.id);
    try {
      // delete all questions in category first
      const qs = questions.filter((q) => q.category === cat.id);
      await Promise.all(qs.map((q) => onDelete(q.id)));
      await onDeleteCategory(cat.id);
      if (editingCatId === cat.id) setEditingCatId(null);
    }
    catch (e) { setError((e && (e.message || e.code)) || String(e)); }
    setBusy("");
  };

  const handleAddCategory = async () => {
    const label = newCatLabel.trim();
    if (!label) return;
    setError("");
    try {
      await onAddCategory(label, newCatColor);
      setNewCatLabel("");
      setNewCatColor(CATEGORY_PALETTE[0]);
    }
    catch (e) { setError((e && (e.message || e.code)) || String(e)); }
  };

  return (
    <div className="panel">
      <div className="panel-title">{t.questionsSectionTitle}</div>
      <p className="empty-note" style={{ padding: "0 0 12px", textAlign: "left" }}>{t.questionsDesc}</p>

      {categories.map((cat) => {
        const catQs = questions.filter((q) => q.category === cat.id);
        const isBusyCat = busy === "cat_" + cat.id;
        const isEditing = editingCatId === cat.id;

        return (
          <div key={cat.id} className="cat-manager-block" style={{ borderLeft: `4px solid ${cat.color}` }}>

            {/* ── Category heading row ── */}
            {isEditing ? (
              <div className="cat-edit-row">
                <input
                  type="color"
                  className="cat-color-picker"
                  value={catColorDrafts[cat.id] || cat.color}
                  onChange={(e) => setCatColorDrafts((p) => ({ ...p, [cat.id]: e.target.value }))}
                />
                <input
                  className="name-input cat-label-input"
                  value={catDrafts[cat.id] ?? cat.label}
                  onChange={(e) => setCatDrafts((p) => ({ ...p, [cat.id]: e.target.value }))}
                  onKeyDown={(e) => { if (e.key === "Enter") handleEditCategory(cat); }}
                  autoFocus
                />
                <button className="submit-btn small-btn" style={{ background: "#3E8FB0" }}
                  onClick={() => handleEditCategory(cat)} disabled={isBusyCat}>
                  {t.saveBtn}
                </button>
                <button className="submit-btn small-btn" style={{ background: "#6C7A89" }}
                  onClick={() => setEditingCatId(null)} disabled={isBusyCat}>
                  ✕
                </button>
              </div>
            ) : (
              <div className="cat-edit-row">
                <span className="cat-color-dot" style={{ background: cat.color }} />
                <h3 className="cat-heading-inline">{cat.label}</h3>
                <button className="cat-action-btn" onClick={() => startEditCat(cat)} title={t.editCategoryTip}>✏️</button>
                <button className="cat-action-btn cat-action-btn-delete" onClick={() => handleDeleteCategory(cat)}
                  disabled={isBusyCat} title={t.deleteCategoryTip}>🗑</button>
              </div>
            )}

            {/* ── Questions in this category ── */}
            {catQs.map((q) => (
              <div key={q.id} className="question-edit-row">
                <textarea
                  rows={2}
                  value={qTextFor(q)}
                  onChange={(e) => setQDrafts((p) => ({ ...p, [q.id]: e.target.value }))}
                />
                <div className="question-edit-actions">
                  <button className="submit-btn small-btn" style={{ background: "#3E8FB0" }}
                    onClick={() => handleEditQuestion(q)} disabled={busy === q.id}>
                    {t.saveBtn}
                  </button>
                  <button className="submit-btn small-btn" style={{ background: "#E8552D" }}
                    onClick={() => handleDeleteQuestion(q)} disabled={busy === q.id}>
                    {t.deleteBtn}
                  </button>
                </div>
              </div>
            ))}

            {catQs.length === 0 && (
              <p className="empty-note" style={{ padding: "8px 0", margin: 0 }}>{t.noCategoryQuestions}</p>
            )}
          </div>
        );
      })}

      {error && <div className="error-msg" style={{ marginTop: 12 }}>{error}</div>}

      {/* ── Add new question ── */}
      <div className="section-divider">{t.addQuestionTitle}</div>
      <div className="field-row" style={{ marginTop: 8, marginBottom: 0, alignItems: "flex-start" }}>
        <div className="field" style={{ maxWidth: 220, marginBottom: 0 }}>
          <select value={newCatId} onChange={(e) => setNewCatId(e.target.value)}>
            {categories.map((cat) => (
              <option key={cat.id} value={cat.id}>{cat.label}</option>
            ))}
          </select>
        </div>
        <input className="name-input" style={{ flex: 1 }} placeholder={t.addQuestionPlaceholder}
          value={newQText} onChange={(e) => setNewQText(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") handleAddQuestion(); }}
        />
        <button className="submit-btn small-btn" onClick={handleAddQuestion}>{t.addBtn}</button>
      </div>

      {/* ── Add new category ── */}
      <div className="section-divider">{t.addCategoryTitle}</div>
      <div className="field-row" style={{ marginTop: 8, marginBottom: 0, alignItems: "center" }}>
        <input
          type="color"
          className="cat-color-picker"
          value={newCatColor}
          onChange={(e) => setNewCatColor(e.target.value)}
          title={t.pickColorTip}
        />
        <input className="name-input" style={{ flex: 1 }} placeholder={t.addCategoryPlaceholder}
          value={newCatLabel} onChange={(e) => setNewCatLabel(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") handleAddCategory(); }}
        />
        <button className="submit-btn small-btn" style={{ background: "#4C9A6A" }}
          onClick={handleAddCategory}>{t.addBtn}</button>
      </div>
    </div>
  );
}

function AdminLogin({ onLogin, onCancel, t }) {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);

  const handleSubmit = async () => {
    setError("");
    setBusy(true);
    try {
      await firebase.auth().signInWithEmailAndPassword(email, password);
    } catch (e) {
      setError(t.loginError);
    }
    setBusy(false);
  };

  return (
    <div className="panel" style={{ maxWidth: 340, marginLeft: "auto" }}>
      <div className="field-row" style={{ marginBottom: 8 }}>
        <input
          className="name-input"
          style={{ flex: 1 }}
          type="email"
          placeholder={t.loginEmailPlaceholder}
          value={email}
          onChange={(e) => setEmail(e.target.value)}
        />
      </div>
      <div className="field-row" style={{ marginBottom: 8 }}>
        <input
          className="name-input"
          style={{ flex: 1 }}
          type="password"
          placeholder={t.loginPasswordPlaceholder}
          value={password}
          onChange={(e) => setPassword(e.target.value)}
          onKeyDown={(e) => {
            if (e.key === "Enter") handleSubmit();
          }}
        />
      </div>
      {error && <div className="error-msg">{error}</div>}
      <div style={{ display: "flex", gap: 8 }}>
        <button className="submit-btn small-btn" onClick={handleSubmit} disabled={busy}>
          {t.loginSubmitBtn}
        </button>
        <button className="submit-btn small-btn" style={{ background: "#6C7A89" }} onClick={onCancel}>
          ×
        </button>
      </div>
    </div>
  );
}

function App() {
  const [tab, setTab] = useState("survey");
  const [theme, setTheme] = useState("dark");
  const [lang, setLang] = useState("en");
  const [responses, setResponses] = useState([]);
  const [surveyUrl, setSurveyUrl] = useState("");
  const [logoUrl, setLogoUrl] = useState("");
  const [companyName, setCompanyName] = useState(DEFAULT_COMPANY_NAME);
  const [departments, setDepartments] = useState(
    DEFAULT_DEPARTMENTS.map((name) => ({ id: name, name }))
  );
  const [shifts, setShifts] = useState(DEFAULT_SHIFTS.map((name) => ({ id: name, name })));
  const [plants, setPlants] = useState(DEFAULT_PLANTS.map((name) => ({ id: name, name })));
  const [plantFilter, setPlantFilter] = useState(ALL_PLANTS_ID);
  const [questions, setQuestions] = useState(
    DEFAULT_QUESTIONS.map((q) => ({ id: q.id, category: q.cat, text: T.en.questions[q.id], customized: false }))
  );
  const [categories, setCategories] = useState([...DEFAULT_CATEGORIES]);
  const [user, setUser] = useState(null);
  const [showLogin, setShowLogin] = useState(false);
  const [storageOk, setStorageOk] = useState(true);

  const isAdmin = !!user;
  const t = T[lang] || T.en;

  useEffect(() => {
    const unsub = firebase.auth().onAuthStateChanged((u) => {
      setUser(u);
      if (u) {
        setShowLogin(false);
        setLang("en");
      } else {
        setTab("survey");
        try {
          const saved = localStorage.getItem(LANG_KEY);
          setLang(saved && T[saved] ? saved : "en");
        } catch (e) {
          setLang("en");
        }
      }
    });
    return unsub;
  }, []);

  useEffect(() => {
    const ref = firebase.database().ref(CONFIG_QUESTIONS_PATH);
    const handler = (snap) => {
      const val = snap.val();
      if (val) {
        setQuestions(
          Object.entries(val).map(([id, v]) => ({
            id,
            category: v.category,
            text: v.text,
            customized: !!v.customized,
          }))
        );
      }
    };
    ref.on("value", handler);
    return () => ref.off("value", handler);
  }, []);

  useEffect(() => {
    if (!user) return;
    const qRef = firebase.database().ref(CONFIG_QUESTIONS_PATH);
    qRef.once("value").then((snap) => {
      if (!snap.exists()) {
        const updates = {};
        DEFAULT_QUESTIONS.forEach((q) => {
          updates[q.id] = { category: q.cat, text: T.en.questions[q.id], customized: false };
        });
        qRef.update(updates).catch(() => {});
      }
    });
  }, [user]);

  useEffect(() => {
    const ref = firebase.database().ref(CONFIG_CATEGORIES_PATH);
    const handler = (snap) => {
      const val = snap.val();
      if (val) {
        const loaded = Object.entries(val).map(([id, v]) => ({
          id,
          label: v.label,
          color: v.color || "#6C7A89",
          order: v.order != null ? v.order : 999,
        }));
        loaded.sort((a, b) => a.order - b.order);
        setCategories(loaded);
      }
    };
    ref.on("value", handler);
    return () => ref.off("value", handler);
  }, []);

  useEffect(() => {
    if (!user) return;
    const catRef = firebase.database().ref(CONFIG_CATEGORIES_PATH);
    catRef.once("value").then((snap) => {
      if (!snap.exists()) {
        const updates = {};
        DEFAULT_CATEGORIES.forEach((cat, i) => {
          updates[cat.id] = { label: cat.label, color: cat.color, order: i };
        });
        catRef.update(updates).catch(() => {});
      }
    });
  }, [user]);

  useEffect(() => {
    const ref = firebase.database().ref(CONFIG_DEPARTMENTS_PATH);
    const handler = (snap) => {
      const val = snap.val();
      if (val) {
        setDepartments(Object.entries(val).map(([id, v]) => ({ id, name: v.name })));
      }
    };
    ref.on("value", handler);
    return () => ref.off("value", handler);
  }, []);

  useEffect(() => {
    const ref = firebase.database().ref(CONFIG_SHIFTS_PATH);

      const val = snap.val();
      if (val) {
        setShifts(Object.entries(val).map(([id, v]) => ({ id, name: v.name })));

    ref.on("value", handler);
    return () => ref.off("value", handler);
