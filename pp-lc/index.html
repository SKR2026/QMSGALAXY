<script>
// Safe localStorage polyfill - falls back to in-memory if blocked
(function() {
  var _mem = {};
  var _real = null;
  try {
    localStorage.setItem('__test__', '1');
    localStorage.removeItem('__test__');
    _real = localStorage;
  } catch(e) {
    console.warn('localStorage blocked, using in-memory fallback');
  }
  if (!_real) {
    Object.defineProperty(window, 'localStorage', {
      value: {
        getItem: function(k) { return Object.prototype.hasOwnProperty.call(_mem, k) ? _mem[k] : null; },
        setItem: function(k, v) { _mem[k] = String(v); },
        removeItem: function(k) { delete _mem[k]; },
        clear: function() { _mem = {}; },
        key: function(i) { return Object.keys(_mem)[i] || null; },
        get length() { return Object.keys(_mem).length; }
      },
      writable: false, configurable: true
    });
  }
})();
</script>

#loginOverlay .kpi-login-left{
  position:relative;overflow:hidden;min-height:0;
  background:linear-gradient(180deg,#eaf5ff 0%,#dcefff 40%,#d0e9fc 70%);
}
#loginOverlay .kpi-left-brand{position:relative;z-index:3;padding:32px 30px 0;}
#loginOverlay .kpi-logo-img{display:block;width:clamp(190px,82%,300px);height:auto;}
#loginOverlay .kpi-left-rule{width:38px;height:3px;border-radius:2px;background:#1a76c2;margin:18px 0 14px;}
#loginOverlay .kpi-left-title{
  font-size:clamp(22px,1.8vw,30px);line-height:1.08;font-weight:700;
  letter-spacing:-.02em;color:#123a63;margin:0;
}
#loginOverlay .kpi-left-subtitle{font-size:clamp(12px,.85vw,14px);color:#4f6680;margin-top:8px;}

#loginOverlay .kpi-scene{position:absolute;left:0;right:0;bottom:0;width:100%;height:66%;display:block;z-index:1;}

#loginOverlay .kpi-benefits{
  position:absolute;z-index:3;left:0;right:0;bottom:0;height:23%;
  display:grid;grid-template-columns:repeat(3,1fr);align-items:center;
  padding:0 18px 6px;color:#fff;
}
#loginOverlay .kpi-benefits>div{
  display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;position:relative;
}
#loginOverlay .kpi-benefits>div+div:before{
  content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);
  height:52px;border-left:1px solid rgba(255,255,255,.3);
}
#loginOverlay .kpi-benefits svg{width:22px;height:22px;}
#loginOverlay .kpi-benefits span{font-size:11px;line-height:1.3;font-weight:500;color:#eaf4ff;}

/* ================= RIGHT: form column ================= */
#loginOverlay .kpi-login-right{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:20px clamp(24px,3vw,48px);overflow:auto;min-height:0;
  background:linear-gradient(180deg,#fbfdff 0%,#f5f9fd 100%);
  scrollbar-width:none;
}
#loginOverlay .kpi-login-right::-webkit-scrollbar{display:none}

#loginOverlay .bio-brand{
  position:static;display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:0;margin-bottom:18px;width:100%;
}
#loginOverlay .bio-brand-logo{
  width:44px;height:44px;border-radius:12px;background:#eef5fc;
  border:1px solid #d3e3f2;box-shadow:0 6px 18px rgba(26,118,194,.10);
  margin:0 0 10px;display:flex;align-items:center;justify-content:center;
}
#loginOverlay .bio-brand-logo svg{width:22px;height:22px;stroke:#1a76c2;stroke-width:1.8}
#loginOverlay .bio-brand-name{font-size:clamp(19px,1.4vw,23px);font-weight:700;color:#123a63;letter-spacing:-.02em}
#loginOverlay .bio-brand-sub{font-size:13px!important;color:#5f7890!important;margin-top:4px!important}
#loginOverlay .bio-brand:after{display:none}

#loginOverlay .bio-sheet{
  position:static;width:100%;max-width:380px;margin:0;padding:0;
  background:transparent;border:0;border-radius:0;box-shadow:none;backdrop-filter:none;
}
#loginOverlay .bio-sheet:before,#loginOverlay .bio-sheet:after{display:none}

/* Tabs */
#loginOverlay .bio-sheet>div:first-child{
  background:#eef3f8!important;border:1px solid #d6e2ed;border-radius:10px!important;
  padding:0!important;margin-bottom:14px!important;overflow:hidden;
}
#loginOverlay .kpi-tab{
  display:flex;align-items:center;justify-content:center;gap:10px;
  height:40px;padding:0!important;border-radius:9px!important;
  font-size:13px!important;font-weight:600!important;
}
#loginOverlay .kpi-tab svg{width:16px;height:16px;}
#loginOverlay .kpi-tab:focus-visible{outline:2px solid #1a76c2;outline-offset:2px}

/* Status + Face ID */
#loginOverlay .bio-status{
  font-size:11.5px;color:#5f7890;text-align:center;min-height:16px;margin-bottom:8px;
}
#loginOverlay .bio-alts{margin-bottom:14px!important;display:flex;justify-content:center}
#loginOverlay .bio-faceid-btn{
  width:72px;height:68px;padding:0;margin:0 auto;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
  background:#eef5fc;border:1px solid #c9dcee;border-radius:12px;
  color:#1a76c2;cursor:pointer;font-family:inherit;
  box-shadow:0 4px 12px rgba(26,118,194,.08);transition:background .15s,border-color .15s;
}
#loginOverlay .bio-faceid-btn:hover{background:#e3effa;border-color:#a9c9e6}
#loginOverlay .bio-faceid-btn:focus-visible{outline:2px solid #1a76c2;outline-offset:2px}
#loginOverlay .bio-faceid-btn svg{width:28px;height:28px;stroke:#1a76c2;stroke-width:1.5}
#loginOverlay .bio-faceid-btn span{font-size:11.5px;font-weight:500;color:#1a6fb5;letter-spacing:0;text-transform:none}

/* Divider */
#loginOverlay .bio-divider{margin:0 0 14px;gap:14px}
#loginOverlay .bio-divider-line{height:1px!important;background:#d6e1eb!important}
#loginOverlay .bio-divider-text{font-size:10.5px!important;font-weight:600!important;color:#5b6f84!important;letter-spacing:.08em!important}

/* Fields */
#loginOverlay .bio-fields{gap:12px!important;margin-bottom:4px}
#loginOverlay .bio-field-icon{left:15px;width:17px;height:17px;stroke:#50657b;stroke-width:1.6}
#loginOverlay .bio-input{
  height:44px;padding:0 44px 0 46px;box-sizing:border-box;
  background:#f6f9fc;border:1px solid #cfdbe7;border-radius:10px;
  font-size:13.5px;color:#16324f;font-family:inherit;
}
#loginOverlay .bio-input::placeholder{color:#6f8296}
#loginOverlay .bio-input:focus{border-color:#1a76c2;background:#fff;box-shadow:0 0 0 3px rgba(26,118,194,.14)}
#loginOverlay .bio-pw-toggle{right:14px;color:#50657b}
#loginOverlay .bio-pw-toggle svg{width:18px;height:18px}
#loginOverlay .bio-pw-section.open{max-height:380px;padding:2px 2px 14px;margin:0 -2px}

/* Button */
#loginOverlay .bio-signin-btn{
  height:44px;padding:0;margin-top:2px;border-radius:10px;
  font-size:14.5px;font-weight:600;letter-spacing:0;gap:12px;
  background:linear-gradient(180deg,#1f7bc9,#1467ad);
  box-shadow:0 4px 10px rgba(20,103,173,.22);
}
#loginOverlay .bio-signin-btn:hover{filter:brightness(1.05)}
#loginOverlay .bio-signin-btn:focus-visible{outline:2px solid #123a63;outline-offset:2px}
#loginOverlay .bio-signin-btn svg{width:18px!important;height:18px!important}

#loginOverlay .bio-toggle-form{margin-top:6px;font-size:12px;font-weight:500;color:#1a6fb5}
#loginOverlay .bio-toggle-form span{color:#1a6fb5!important}
#loginOverlay .bio-home-bar{display:none}
#loginOverlay #loginPanelGuest{padding:8px 0 2px!important}

/* ================= Responsive ================= */
@media(max-width:900px){
  #loginOverlay .bio-screen{align-items:flex-start;padding:12px}
  #loginOverlay .login-window{
    width:100%;height:auto;min-height:0;display:flex;flex-direction:column;border-radius:18px;
  }
  #loginOverlay .kpi-login-left{height:auto;flex:0 0 auto}
  #loginOverlay .kpi-left-brand{padding:28px 28px 0}
  #loginOverlay .kpi-left-rule{margin:16px 0 14px}
  #loginOverlay .kpi-scene{position:relative;height:auto;aspect-ratio:420/520;max-height:560px;margin-top:-90px}
  #loginOverlay .kpi-benefits{height:clamp(96px,24vw,130px)}
  #loginOverlay .kpi-login-right{flex:0 0 auto;justify-content:flex-start;padding:32px 22px 36px;overflow:visible}
}
@media(max-width:480px){
  #loginOverlay .bio-screen{padding:0}
  #loginOverlay .login-window{border-radius:0;border:0}
  #loginOverlay .kpi-left-brand{padding:22px 22px 0}
  #loginOverlay .kpi-benefits span{font-size:11px}
  #loginOverlay .kpi-benefits svg{width:22px;height:22px}
}
@media(min-width:901px) and (max-height:700px){
  #loginOverlay .login-window{min-height:600px}
  #loginOverlay .kpi-left-brand{padding-top:32px}
  #loginOverlay .bio-brand{margin-bottom:18px}
  #loginOverlay .bio-brand-logo{margin-bottom:10px}
}

#loginOverlay .bio-info{font-size:12px;color:#1e40af;background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:10px 12px;line-height:1.55;margin-top:-4px}
#loginOverlay .bio-info code{background:#dbeafe;padding:1px 5px;border-radius:4px;font-size:10.5px;word-break:break-all}
#loginOverlay .bio-signin-btn{display:flex;align-items:center;justify-content:center;width:100%;color:#fff;border:none;cursor:pointer;font-family:inherit}
</style>

async function _pbkdf2(password, salt) {
  const enc = new TextEncoder();
  const keyMat = await crypto.subtle.importKey('raw', enc.encode(password), { name:'PBKDF2' }, false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name:'PBKDF2', salt:enc.encode(salt), iterations:100000, hash:'SHA-256' }, keyMat, 256);
  return Array.from(new Uint8Array(bits)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function _hmac(data, key) {
  const enc = new TextEncoder();
  const k = await crypto.subtle.importKey('raw', enc.encode(key), { name:'HMAC', hash:'SHA-256' }, false, ['sign']);
  const sig = await crypto.subtle.sign('HMAC', k, enc.encode(data));
  return Array.from(new Uint8Array(sig)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function _ctEq(a, b) {

/* Inject CSS vars so all indigo-overriding styles work automatically */
function applyThemeCSSVars(colourKey) {
  const t = COLOUR_THEMES[colourKey] || COLOUR_THEMES.indigo;
  const root = document.documentElement;
  root.style.setProperty('--p50',  t.p50);
  root.style.setProperty('--p100', t.p100);
  root.style.setProperty('--p200', t.p200);
  root.style.setProperty('--p300', t.p300 || t.p200);
  root.style.setProperty('--p400', t.p400);
  root.style.setProperty('--p500', t.p500);
  root.style.setProperty('--p600', t.p600);
  root.style.setProperty('--p700', t.p700);
  root.style.setProperty('--p800', t.p800);
  root.style.setProperty('--pshadow', t.shadow);
}

// ── Compliance (recurrence) frequencies ──────────────────────────────────────
// Governs how often a requirement repeats after it is marked Completed.
// When a requirement is completed, nextDueDate is auto-computed and the
// status rolls back to 'Pending' so the cycle restarts automatically.
const COMPLIANCE_FREQS = [
  { value:'one_time',    label:'One-Time (No Repeat)' },
  { value:'monthly',     label:'Monthly'              },
  { value:'quarterly',   label:'Quarterly (3 months)' },
  { value:'half_yearly', label:'Half-Yearly (6 months)'},
  { value:'annual',      label:'Annual (Yearly)'       },
  { value:'2_yearly',   label:'Every 2 Years'         },
  { value:'5_yearly',   label:'Every 5 Years'         },
];

/**
 * Given a due date string (YYYY-MM-DD) and a compliance frequency value,
 * return the next due date string (YYYY-MM-DD) for the next cycle.
 * Returns null for 'one_time' (no recurrence).
 */
function computeNextDueDate(fromDate, freq) {
  if (!fromDate || !freq || freq === 'one_time') return null;
  const d = new Date(fromDate);
  switch (freq) {
    case 'monthly':     d.setMonth(d.getMonth() + 1);     break;
    case 'quarterly':   d.setMonth(d.getMonth() + 3);     break;
    case 'half_yearly': d.setMonth(d.getMonth() + 6);     break;
    case 'annual':      d.setFullYear(d.getFullYear() + 1); break;
    case '2_yearly':   d.setFullYear(d.getFullYear() + 2); break;
    case '5_yearly':   d.setFullYear(d.getFullYear() + 5); break;
    default:            return null;
  }
  return d.toISOString().split('T')[0];
}

/* ─── FIREBASE STATUS BADGE ─── */
function FirebaseStatusBadge() {
  const [status, setStatus] = React.useState('checking'); // 'checking' | 'connected' | 'error'

  React.useEffect(() => {
    let cancelled = false;
    async function check() {
      try {
        await window.db.collection('_ping').limit(1).get();
        if (!cancelled) setStatus('connected');
      } catch (e) {
        if (!cancelled) setStatus('error');
      }
    }
    check();
    // Re-check every 60s
    const interval = setInterval(check, 60000);
    return () => { cancelled = true; clearInterval(interval); };
  }, []);

  const cfg = {
    checking:  { dot: 'bg-yellow-400 animate-pulse', text: 'text-yellow-600 dark:text-yellow-300', label: 'Firebase…',   title: 'Connecting to Firebase…' },
    connected: { dot: 'bg-green-500',                text: 'text-green-600 dark:text-green-400',   label: 'Firebase ✓',  title: 'Firebase connected — skr-task' },
    error:     { dot: 'bg-red-500',                  text: 'text-red-600 dark:text-red-400',        label: 'Firebase ✗',  title: 'Firebase connection failed — check Firestore rules' },
  }[status];

  return (
    <div className="flex items-center gap-1.5 text-xs font-semibold select-none cursor-default" title={cfg.title}>
      <span className={`w-2 h-2 rounded-full flex-shrink-0 ${cfg.dot}`} />
      <span className={cfg.text}>{cfg.label}</span>
    </div>
  );
}

/* ─── DOWNLOAD EVIDENCE HELPER ─── */
function downloadEvidence(ev) {
  const url = ev.storageUrl || ev.url || ev.dataUrl;
  if (!url) {
    alert('File not available. Please re-upload.');
    return;
  }
  // storageUrl / external URL: open in new tab
  if (ev.storageUrl || ev.url) {
    window.open(url, '_blank');
    return;
  }
  // base64 fallback
  const a = document.createElement('a');
  a.href = url;
  a.download = ev.name || 'evidence';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

/* ─── NOTIFICATION BELL ─── */
function NotificationBell({ dk, requirements, role, onNotifClick }) {
  const [open, setOpen] = React.useState(false);
  const [seen, setSeen] = React.useState(() => {
    try { return JSON.parse(localStorage.getItem('notif_seen') || '[]'); } catch { return []; }
  });
  const ref = React.useRef(null);

  // Build notifications: overdue + newly uploaded evidence
  const notifications = React.useMemo(() => {
    const list = [];
    requirements.forEach(r => {
      if (r.status === 'Overdue' || isEffectivelyOverdue(r)) {
        list.push({ id: `overdue-${r.id}`, type: 'overdue', reqId: r.id, title: r.title, plant: r.plantId, ts: r.dueDate, msg: `Overdue since ${(()=>{const _d=new Date(r.dueDate);const _p=n=>String(n).padStart(2,'0');return _p(_d.getDate())+'-'+_p(_d.getMonth()+1)+'-'+_d.getFullYear();})()}` });
      }
      (r.evidence || []).forEach(ev => {
        list.push({ id: `ev-${ev.id}`, type: 'evidence', reqId: r.id, title: r.title, plant: r.plantId, ts: ev.uploadedAt, msg: `📎 Evidence uploaded: ${ev.name}` });
      });
    });
    // Sort newest first
    list.sort((a, b) => new Date(b.ts) - new Date(a.ts));
    return list.slice(0, 30);
  }, [requirements]);

  const unreadIds = notifications.filter(n => !seen.includes(n.id)).map(n => n.id);
  const unreadCount = unreadIds.length;

  const markAllRead = () => {
    const allIds = notifications.map(n => n.id);
    localStorage.setItem('notif_seen', JSON.stringify(allIds));
    setSeen(allIds);
  };

  // Close on outside click
  React.useEffect(() => {
    const handler = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, []);

  const typeIcon = { overdue: '🚨', evidence: '📎' };
  const typeColor = { overdue: dk ? 'text-red-400' : 'text-red-600', evidence: dk ? 'text-[color:var(--p400)]' : 'text-[color:var(--p600)]' };

  return (
    <div ref={ref} className="relative">
      <button
        onClick={() => { setOpen(o => !o); }}
        className={`relative p-2 rounded-lg transition-colors ${dk ? 'text-gray-300 hover:bg-gray-700' : 'text-slate-600 hover:bg-gray-100'}`}
        title="Notifications"
      >
        <span className="text-lg">🔔</span>
        {unreadCount > 0 && (
          <span className="absolute -top-0.5 -right-0.5 min-w-[18px] h-[18px] bg-red-500 text-white text-[10px] font-bold rounded-full flex items-center justify-center px-1 shadow">
            {unreadCount > 99 ? '99+' : unreadCount}
          </span>
        )}
      </button>

      {open && (
        <div className={`absolute right-0 top-full mt-2 w-80 rounded-2xl shadow-2xl border z-50 ${dk ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-200'}`}
          style={{ maxHeight: '420px', overflowY: 'auto' }}>
          {/* Header */}
          <div className={`flex items-center justify-between px-4 py-3 border-b sticky top-0 ${dk ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-100'}`}>
            <p className={`font-semibold text-sm ${dk ? 'text-white' : 'text-gray-900'}`}>Notifications {unreadCount > 0 && <span className="ml-1 text-xs bg-red-500 text-white rounded-full px-1.5 py-0.5">{unreadCount}</span>}</p>
            {unreadCount > 0 && (
              <button onClick={markAllRead} className="text-xs text-[color:var(--p500)] hover:underline font-medium">Mark all read</button>
            )}
          </div>

          {/* List */}
          {notifications.length === 0 ? (
            <div className="px-4 py-8 text-center">
              <p className="text-2xl mb-2">🎉</p>
              <p className={`text-sm ${dk ? 'text-gray-400' : 'text-gray-500'}`}>No notifications yet</p>
            </div>
          ) : (
            <div className="divide-y divide-gray-100 dark:divide-gray-700">
              {notifications.map(n => {
                const isUnread = !seen.includes(n.id);
                return (
                  <div key={n.id}
                    onClick={() => {
                      // Mark this notification as read
                      if (isUnread) {
                        const updated = [...seen, n.id];
                        localStorage.setItem('notif_seen', JSON.stringify(updated));
                        setSeen(updated);
                      }
                      // Navigate to the requirement
                      if (onNotifClick && n.reqId) {
                        onNotifClick(n.reqId);
                        setOpen(false);
                      }
                    }}
                    className={`px-4 py-3 transition-colors ${onNotifClick ? 'cursor-pointer' : 'cursor-default'} ${isUnread ? (dk ? 'bg-gray-700/50' : 'bg-gray-50') : ''} ${dk ? 'hover:bg-gray-700/50' : 'hover:bg-gray-50'}`}>
                    <div className="flex items-start gap-2">
                      <span className="text-base mt-0.5 flex-shrink-0">{typeIcon[n.type]}</span>
                      <div className="flex-1 min-w-0">
                        <p className={`text-xs font-semibold truncate ${typeColor[n.type]}`}>{n.title}</p>
                        <p className={`text-xs mt-0.5 ${dk ? 'text-gray-300' : 'text-gray-600'}`}>{n.msg}</p>
                        <p className={`text-[10px] mt-0.5 ${dk ? 'text-gray-500' : 'text-gray-400'}`}>{n.ts ? new Date(n.ts).toLocaleString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : ''}</p>
                      </div>
                      <div className="flex items-center gap-1 flex-shrink-0 mt-0.5">
                        {isUnread && <span className="w-2 h-2 rounded-full t-notif-dot"></span>}
                        {onNotifClick && <span className="text-gray-300 dark:text-gray-600 text-xs">›</span>}
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function ThemePicker({ dk, colourKey, changeColour, cycleColour }) {
  const [open, setOpen] = useState(false);
  const t = COLOUR_THEMES[colourKey] || COLOUR_THEMES.indigo;
  return (

        onClick={() => setOpen(o => !o)}
        className={`flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-semibold transition-colors select-none ${dk?'hover:bg-gray-700 text-gray-300':'hover:bg-gray-100 text-gray-600'}`}

        >
          <p className={`text-[10px] font-bold uppercase tracking-widest mb-2.5 px-1 ${dk?'text-gray-400':'text-gray-400'}`}>Colour Theme</p>
          <div className="grid grid-cols-4 gap-2">

              return (
                <button
                  key={key}

                  title={th.label}

function AppShell({ dk, toggleTheme, colourKey, cycleColour, changeColour, currentUser, nav, activePage, setActivePage, children, role, logout, requirements, onNotifClick, logoUrl, plants }) {
  const [collapsed,    setCollapsed]    = useState(() => { try { return localStorage.getItem('sidebarCollapsed') === '1'; } catch(_) { return false; } });
  const [drawerOpen,   setDrawerOpen]   = useState(false); // mobile slide-out drawer
  // Remember sidebar state between sessions
  useEffect(() => { try { localStorage.setItem('sidebarCollapsed', collapsed ? '1' : '0'); } catch(_) {} }, [collapsed]);
  // Ctrl/Cmd + B toggles the sidebar (ignored while typing in a field)
  useEffect(() => {
    const onKey = (e) => {
      if ((e.ctrlKey || e.metaKey) && (e.key === 'b' || e.key === 'B')) {
        const t = e.target; const tag = (t && t.tagName) || '';
        if (tag === 'INPUT' || tag === 'TEXTAREA' || (t && t.isContentEditable)) return;
        e.preventDefault(); setCollapsed(c => !c);
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);
  const [isMobileView, setIsMobileView] = useState(window.innerWidth < 768);

  useEffect(() => {
    const onResize = () => setIsMobileView(window.innerWidth < 768);
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);

  // Close drawer when page changes on mobile
  useEffect(() => { if (isMobileView) setDrawerOpen(false); }, [activePage]);

  const roleTag = { admin:'Super Admin', top_management:'Top Management', plant_admin:'Plant Admin', plant_head:'Plant Head', user:'Team Member' }[role];
  const roleBg  = { admin:'t-badge-admin', top_management:'bg-purple-100 text-purple-700', plant_admin:'bg-orange-100 text-orange-700', plant_head:'bg-teal-100 text-teal-700', user:'bg-green-100 text-green-700' }[role];
  const userPlant = (plants && currentUser?.plantId) ? plants.find(p => p.id === currentUser.plantId) : null;

  // Bottom nav shows first 4 items on mobile; rest accessible via drawer
  const bottomNavItems = nav.slice(0, 4);
  const drawerExtraItems = nav.slice(4);

  // ── Shared sidebar nav items renderer ──
  const SidebarNavItems = ({ onItemClick }) => (
    <>
      {nav.map(item => (
        <button key={item.id} onClick={() => { setActivePage(item.id); if(onItemClick) onItemClick(); }}
          className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm transition-all duration-150 ${
            activePage===item.id ? 't-nav-active' : 'text-slate-400 hover:text-white hover:bg-white/10'
          }`}>
          <span className="text-base flex-shrink-0">{item.icon}</span>
          <span className="font-medium truncate">{item.label}</span>
          {item.badge > 0 && (
            <span className="ml-auto bg-red-500 text-white text-xs rounded-full px-1.5 py-0.5 min-w-[18px] text-center">{item.badge}</span>

        </button>
      ))}
    </>
  );

  // ── License expiry badge ──
  const LicenseBadge = () => {
    if (role !== 'admin') return null;
    try {
      const cs = JSON.parse(localStorage.getItem('adminSettings')||'{}');
      if (!cs.licenseExpiry) return null;
      let exp; try { exp = new Date(cs.licenseExpiry); } catch(_) { return null; }
      if (!exp || isNaN(exp.getTime())) return null;
      const now = new Date(); const dl = Math.ceil((exp-now)/(1000*60*60*24));
      const expStr = exp.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
      let bg,border,color,dot,emoji;
      if(dl<=0){bg='#fee2e2';border='rgba(239,68,68,.4)';color='#dc2626';dot='🔴';emoji='⚠️';}
      else if(dl<=30){bg='rgba(245,158,11,0.12)';border='rgba(245,158,11,0.4)';color='#d97706';dot='🟡';emoji='⏰';}
      else{bg='rgba(22,163,74,.12)';border='rgba(22,163,74,.25)';color='#16a34a';dot='🟢';emoji='✅';}
      return(
        <span style={{display:'inline-flex',alignItems:'center',gap:4,background:bg,border:`1px solid ${border}`,borderRadius:10,padding:'2px 9px',fontSize:10,color,fontWeight:600,whiteSpace:'nowrap',cursor:'default',flexShrink:0}}>
          {dot} {emoji} {expStr} {dl<=30&&dl>0?` (${dl}d)`:dl<=0?' (Expired)':''}

/* ═══════════════════════════════════════════
   BIOMETRIC AUTH — WebAuthn helpers (mobile-only)
═══════════════════════════════════════════ */
const _BIO_CRED_KEY  = 'legal_bio_credId';
const _BIO_EMAIL_KEY = 'legal_bio_email';
const _BIO_RP_ID     = location.hostname || 'localhost';
const _BIO_RP_NAME   = 'Polyplastics Legal Compliance';

function _bioIsMobile() {
  const ua = navigator.userAgent.toLowerCase();
  if (/android|iphone|ipad|ipod|mobile|tablet/.test(ua)) return true;
  if (navigator.maxTouchPoints > 1 && !/macintosh/.test(ua)) return true;
  return window.innerWidth < 768;
}
async function _bioGetType() {
  if (!window.PublicKeyCredential) return null;
  try {
    const avail = await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
    if (!avail) return null;
    const ua = navigator.userAgent.toLowerCase();
    if (/iphone|ipad/.test(ua))  return { icon:'🔒', label:'Sign in with Face ID / Touch ID' };
    if (/android/.test(ua))      return { icon:'🫆', label:'Sign in with Fingerprint / Face' };
    return { icon:'🔒', label:'Sign in with Biometrics' };
  } catch { return null; }
}
function _bioBuf2b64(buf) {
  const bytes = new Uint8Array(buf); let bin = '';
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
}
function _bioB642buf(b64) {
  const s = atob(b64.replace(/-/g,'+').replace(/_/g,'/'));
  return Uint8Array.from(s, c=>c.charCodeAt(0)).buffer;
}
function _bioGetCred(email) {
  try {
    const raw = localStorage.getItem(_BIO_CRED_KEY); if(!raw) return null;
    const map = JSON.parse(raw);
    return email ? (map[email.toLowerCase()]||null) : map;
  } catch { return null; }
}
function _bioSetCred(email, credId64) {
  try {
    const raw = localStorage.getItem(_BIO_CRED_KEY);
    const map = raw ? JSON.parse(raw) : {};
    map[email.toLowerCase()] = credId64;
    localStorage.setItem(_BIO_CRED_KEY, JSON.stringify(map));
    localStorage.setItem(_BIO_EMAIL_KEY, email.toLowerCase());
  } catch {}
}

/* ═══════════════════════════════════════════
   BIOMETRIC SETTINGS PANEL
   Shown in Settings page. Handles registration,
   sign-in test, and removal — all from one place.
   Works on any device that has WebAuthn platform
   authenticator (Face ID, fingerprint, etc.)
═══════════════════════════════════════════ */
function BiometricSettings({ dk, currentUser }) {
  const [bioType,    setBioType]    = useState(null);   // {icon, label} or null
  const [creds,      setCreds]      = useState({});     // email→credId map
  const [status,     setStatus]     = useState('');     // feedback message
  const [statusOk,   setStatusOk]   = useState(true);
  const [busy,       setBusy]       = useState(false);
  const [supported,  setSupported]  = useState(null);   // null=checking, true/false

  const email = currentUser?.email?.toLowerCase() || '';

  // Load state on mount
  useEffect(() => {
    let cancelled = false;
    (async () => {
      if (!window.PublicKeyCredential) {
        if (!cancelled) setSupported(false);
        return;
      }
      try {
        const avail = await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
        if (cancelled) return;
        setSupported(avail);
        if (!avail) return;
        const ua = navigator.userAgent.toLowerCase();
        if (/iphone|ipad/.test(ua))       setBioType({ icon:'🔒', label:'Face ID / Touch ID' });
        else if (/android/.test(ua))       setBioType({ icon:'🫆', label:'Fingerprint / Face Unlock' });
        else if (/windows/.test(ua))       setBioType({ icon:'🪪', label:'Windows Hello' });
        else if (/mac/.test(ua))           setBioType({ icon:'👆', label:'Touch ID' });
        else                               setBioType({ icon:'🔒', label:'Biometrics' });
      } catch { if (!cancelled) setSupported(false); }
      // Load stored credentials
      try {
        const raw = localStorage.getItem(_BIO_CRED_KEY);
        if (!cancelled) setCreds(raw ? JSON.parse(raw) : {});
      } catch { if (!cancelled) setCreds({}); }
    })();
    return () => { cancelled = true; };
  }, []);

  const refreshCreds = () => {
    try { const raw = localStorage.getItem(_BIO_CRED_KEY); setCreds(raw ? JSON.parse(raw) : {}); }
    catch { setCreds({}); }
  };

  const showMsg = (msg, ok = true) => { setStatus(msg); setStatusOk(ok); };

  const hasCred = !!creds[email];

  const handleRegister = async () => {
    if (!email) { showMsg('No email found for your account.', false); return; }
    setBusy(true); showMsg('Follow your device prompt to register biometric…');
    try {
      const challenge = crypto.getRandomValues(new Uint8Array(32));
      const uid = new TextEncoder().encode(email);
      const cred = await navigator.credentials.create({
        publicKey: {
          rp: { id: _BIO_RP_ID, name: _BIO_RP_NAME },
          user: { id: uid, name: email, displayName: currentUser?.name || email },
          challenge,
          pubKeyCredParams: [{ type:'public-key', alg:-7 }, { type:'public-key', alg:-257 }],
          authenticatorSelection: { authenticatorAttachment:'platform', userVerification:'required', residentKey:'preferred' },
          timeout: 60000, attestation: 'none',
        }
      });
      _bioSetCred(email, _bioBuf2b64(cred.rawId));
      refreshCreds();
      showMsg('✅ Biometric login enabled! You can now sign in using ' + (bioType?.label || 'biometrics') + '.', true);
    } catch(e) {
      const msg = e.name === 'NotAllowedError'   ? 'Registration cancelled or timed out.'
                : e.name === 'InvalidStateError' ? 'A passkey already exists for this device.'
                : 'Registration failed: ' + e.message;
      showMsg('❌ ' + msg, false);
    }
    setBusy(false);
  };

  const handleTest = async () => {
    if (!hasCred) { showMsg('Register biometric first.', false); return; }
    setBusy(true); showMsg('Waiting for biometric verification…');
    try {
      const challenge = crypto.getRandomValues(new Uint8Array(32));
      const credId = creds[email];
      await navigator.credentials.get({
        publicKey: {
          rpId: _BIO_RP_ID, challenge,
          allowCredentials: [{ type:'public-key', id: _bioB642buf(credId), transports: ['internal','hybrid'] }],
          userVerification: 'required', timeout: 60000,
        }
      });
      showMsg('✅ Biometric verified successfully! Login is ready to use.', true);
    } catch(e) {
      const msg = e.name === 'NotAllowedError' ? 'Verification cancelled or timed out.'
                : e.name === 'SecurityError'   ? 'Requires HTTPS.'
                : 'Verification failed: ' + e.message;
      showMsg('❌ ' + msg, false);
    }
    setBusy(false);
  };

  const handleRemove = () => {
    try {
      const raw = localStorage.getItem(_BIO_CRED_KEY);
      const map = raw ? JSON.parse(raw) : {};
      delete map[email];
      localStorage.setItem(_BIO_CRED_KEY, JSON.stringify(map));
      if (localStorage.getItem(_BIO_EMAIL_KEY) === email) localStorage.removeItem(_BIO_EMAIL_KEY);
    } catch {}
    refreshCreds();
    showMsg('Biometric credential removed from this device.', true);
  };

  const card    = `rounded-2xl border shadow-sm p-6 ${dk?'bg-gray-800 border-gray-700':'bg-white border-gray-200'}`;
  const sub     = dk?'text-gray-400':'text-gray-500';
  const inp     = `w-full border rounded-xl px-3 py-2.5 text-sm outline-none transition-colors ${dk?'bg-gray-700 border-gray-600 text-white':'bg-white border-gray-300 text-gray-900'} focus:border-[color:var(--p400)]`;
  const btnBase = {display:'flex',alignItems:'center',justifyContent:'center',gap:8,padding:'10px 18px',borderRadius:10,border:'none',fontSize:13,fontWeight:700,cursor:'pointer',transition:'all .2s',fontFamily:"'DM Sans',sans-serif"};

  return (
    <div className={card}>
      <h3 className="font-semibold mb-1 flex items-center gap-2" style={{fontFamily:"'Outfit',sans-serif"}}>
        <span>🔐</span> Biometric Login
      </h3>
      <p className={`text-xs mb-5 ${sub}`}>
        Enable Face ID, fingerprint, or Windows Hello to sign in without a password on this device.
        Each device must be registered separately.
      </p>

      {/* Hardware check */}
      {supported === false && (
        <div className={`rounded-xl px-4 py-3 text-sm border ${dk?'bg-gray-700 border-gray-600 text-gray-300':'bg-amber-50 border-amber-200 text-amber-800'}`}>
          ⚠️ This device or browser does not support biometric authentication (WebAuthn). Try Chrome or Safari on a mobile device.
        </div>
      )}

      {supported === null && (
        <div className={`text-sm ${sub}`}>Checking device capabilities…</div>
      )}

      {supported === true && (
        <div className="space-y-4">
          {/* Current account */}
          <div className={`rounded-xl px-4 py-3 flex items-center gap-3 ${dk?'bg-gray-700/60':'bg-slate-50'} border ${dk?'border-gray-600':'border-gray-200'}`}>
            <span style={{fontSize:22}}>{bioType?.icon || '🔒'}</span>
            <div className="flex-1 min-w-0">
              <p className="text-sm font-semibold truncate">{bioType?.label || 'Biometrics'}</p>
              <p className={`text-xs truncate ${sub}`}>{email || 'No account'}</p>
            </div>
            <span style={{
              display:'inline-flex',alignItems:'center',gap:4,padding:'3px 10px',borderRadius:20,
              fontSize:11,fontWeight:700,
              background: hasCred ? 'rgba(16,185,129,.12)' : 'rgba(239,68,68,.10)',
              color: hasCred ? '#059669' : '#dc2626',
              border: `1px solid ${hasCred ? 'rgba(16,185,129,.3)' : 'rgba(239,68,68,.25)'}`,
            }}>
              {hasCred ? '✅ Registered' : '○ Not registered'}
            </span>
          </div>

          {/* Actions */}
          <div className="flex flex-wrap gap-3">
            {!hasCred ? (
              <button onClick={handleRegister} disabled={busy || !email}
                style={{...btnBase, background:'var(--p600)', color:'#fff', opacity:(busy||!email)?0.6:1, flex:1, minWidth:160}}>
                {busy ? '⏳ Registering…' : `＋ Enable ${bioType?.label || 'Biometric'} Login`}
              </button>
            ) : (
              <>
                <button onClick={handleTest} disabled={busy}
                  style={{...btnBase, background:'rgba(99,102,241,.1)', color:'var(--p600)', border:'1.5px solid var(--p300)', flex:1, minWidth:140, opacity:busy?0.6:1}}>
                  {busy ? '⏳ Testing…' : '🧪 Test Biometric'}
                </button>
                <button onClick={handleRemove} disabled={busy}
                  style={{...btnBase, background:'rgba(239,68,68,.08)', color:'#dc2626', border:'1.5px solid rgba(239,68,68,.25)', flex:1, minWidth:140, opacity:busy?0.6:1}}>
                  🗑️ Remove
                </button>
              </>
            )}
          </div>

          {/* Status message */}
          {status && (
            <div className={`rounded-xl px-4 py-3 text-sm font-medium border ${
              statusOk
                ? (dk?'bg-green-900/30 border-green-700 text-green-300':'bg-green-50 border-green-200 text-green-800')
                : (dk?'bg-red-900/30 border-red-700 text-red-300':'bg-red-50 border-red-200 text-red-700')
            }`}>
              {status}
            </div>
          )}

          {/* How it works */}
          <div className={`rounded-xl px-4 py-3 text-xs space-y-1 ${dk?'bg-gray-700/50 text-gray-400':'bg-slate-50 text-gray-500'} border ${dk?'border-gray-600':'border-gray-200'}`}>
            <p className="font-semibold uppercase tracking-wide mb-1.5">How it works</p>
            <p>• Tap <strong>Enable</strong> — your device will prompt for Face ID / fingerprint to register</p>
            <p>• Next time you log in, tap <strong>Sign in with Biometrics</strong> on the login screen</p>
            <p>• Each device (phone, tablet, laptop) must be registered separately</p>
            <p>• Your biometric data never leaves your device — only a secure key ID is stored locally</p>
          </div>
        </div>
      )}
    </div>
  );
}

function AdminOverview({ dk, plants, users, requirements, categories: catsProp, openReqId, onNotifReqOpened, onGoToEdit, extraCharts, compact }) {
  const wide = compact === 'wide';
  const cats = catsProp || CATEGORIES;

  const [drillModal, setDrillModal] = useState(null);
  const [exportLoading, setExportLoading] = useState('');

  const getExportData = () => {
    const scopeReqs = selPlant ? requirements.filter(r=>r.plantId===selPlant) : requirements;
    return scopeReqs.map(r => {
      const plant = plants.find(p=>p.id===r.plantId);
      const assignedIds = Array.isArray(r.assignedTo) ? r.assignedTo : (r.assignedTo ? [r.assignedTo] : []);
      const assignees = assignedIds.map(id=>users.find(u=>u.id===id)).filter(Boolean).map(u=>u.name).join('; ');
      return {
        'ID': r.id,
        'Title': r.title,
        'Category': r.category,
        'Priority': r.priority,
        'Status': r.status,
        'Plant': plant?.name || '—',
        'State': plant?.state || '—',
        'Assigned To': assignees || 'Unassigned',
        'Due Date': r.dueDate || '—',
        'Reminder Frequency': r.reminderFrequency || '—',
        'Escalation Level': r.escalationLevel ? `Level ${r.escalationLevel}` : '—',
        'Applicable Rule': r.applicableRule || '—',
        'Completion Date': r.completionDate || '—',
        'Created At': r.createdAt ? new Date(r.createdAt).toLocaleDateString('en-IN') : '—',
        'Description': r.description || '',
      };
    });
  };

  const exportCSV = () => {
    setExportLoading('csv');
    try {
      const rows = getExportData();
      if (!rows.length) { alert('No data to export.'); setExportLoading(''); return; }
      const headers = Object.keys(rows[0]);
      const escape = v => '"' + String(v).replace(/"/g, '""') + '"';
      const csv = [headers.map(escape).join(','), ...rows.map(r => headers.map(h=>escape(r[h]||'')).join(','))].join('\r\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const scopeLabel = selPlant ? plants.find(p=>p.id===selPlant)?.name?.replace(/\s+/g,'_') : 'All_Plants';
      a.href = url;
      a.download = `Legal_Compliance_${scopeLabel}_${new Date().toISOString().split('T')[0]}.csv`;
      document.body.appendChild(a); a.click();
      document.body.removeChild(a); URL.revokeObjectURL(url);
    } catch(e) { console.error(e); }
    setTimeout(() => setExportLoading(''), 800);
  };

  const exportPDF = () => {
    setExportLoading('pdf');

        <table>

      const blob = new Blob([html], { type: 'text/html;charset=utf-8;' });

    setTimeout(() => { setExportLoading(''); setExportProgress(0); }, 700);

      I:pr.filter(r=>r.status==='In Progress').length, O:pr.filter(r=>r.status==='Overdue'||isEffectivelyOverdue(r)).length };

  // ── Compliance Trend: real data from last 6 months ──────────────────────
  // Strategy: for each month bucket, count requirements whose dueDate falls
  // in that month, then compute % completed (status==='Completed') among them.
  // If a month has no due requirements, fall back to cumulative snapshot so
  // the line never gaps.
  const trendData = (() => {
    const now = new Date();
    const buckets = [];
    for (let i = 5; i >= 0; i--) {
      const d   = new Date(now.getFullYear(), now.getMonth() - i, 1);
      const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      const lbl = d.toLocaleString('default', { month: 'short' });
      buckets.push({ key, m: lbl, total: 0, done: 0 });
    }
    // Bucket by dueDate month
    requirements.forEach(r => {
      if (!r.dueDate) return;
      const mk = r.dueDate.slice(0, 7);
      const b  = buckets.find(x => x.key === mk);
      if (!b) return;
      b.total++;
      if (r.status === 'Completed') b.done++;
    });
    // For months with no due reqs, carry forward the latest known % (or use
    // cumulative up-to-that-month snapshot so the trend is always meaningful)
    let lastPct = compliance; // fallback = current overall rate

      let pct;
      if (b.total > 0) {
        pct = Math.round((b.done / b.total) * 100);
        lastPct = pct;
      } else {
        // No requirements due this month → leave a gap (null) instead of inventing a value

      }
      return { m: b.m, Compliance: pct, Target: 90 };

                      </div>
                    );

                </div>
              )}
            </div>
          </div>
        </div>

      <div className={`rounded-2xl border p-4 shadow-sm ${dk?'bg-gray-800 border-gray-700':'bg-white border-gray-200'}`}>

            className={`px-3 py-1.5 rounded-xl text-xs font-semibold border transition-all ${!selPlant?'t-tag-active shadow-md':dk?'border-gray-600 text-gray-300 hover:bg-gray-700':'border-gray-200 text-gray-600 hover:bg-gray-50'}`}>

          {plants.map(p=>(
            <button key={p.id} onClick={()=>setSelPlant(p.id)}

            <div className={`mb-3 px-4 py-3 rounded-xl border ${dk?'bg-gray-800 border-gray-700':'bg-gray-50 border-gray-200'}`}>

                    <p className={`text-xs ${sub}`}>{plant?.name} · {r.category} · Due {formatDate(r.dueDate)}</p>

                </div>

            })}
            {scopedReqs.filter(r=>r.status==='Overdue'||isEffectivelyOverdue(r)).length > 5 && (
              <button className="w-full py-2 text-xs text-red-500 font-medium hover:underline"
                onClick={()=>openDrill(`Overdue – ${scopeLabel}`, scopedReqs.filter(r=>r.status==='Overdue'||isEffectivelyOverdue(r)))}>
                View all {scopedReqs.filter(r=>r.status==='Overdue'||isEffectivelyOverdue(r)).length} overdue →
              </button>
            )}
          </div>
        </div>
      )}
    </div>
  );

/* ═══════════════════════════════════════════
   MICROSOFT GRAPH API HELPER
   – replaces EmailJS; uses Azure AD (MSAL)
     + Microsoft Graph /sendMail endpoint
═══════════════════════════════════════════ */

// ── MSAL singleton cache (one instance per clientId+tenantId) ──────────
// BUG FIX: creating new PublicClientApplication() on every call caused token-cache
// conflicts and "interaction_in_progress" errors because MSAL writes auth state to
// localStorage and multiple instances step on each other.
const _msalInstances = {};

/**
 * getMSGraphToken()
 * Acquires a delegated access token from Azure AD using MSAL popup/silent flow.
 * Requires adminSettings: { msClientId, msTenantId }
 */
async function getMSGraphToken(cfg) {
  if (typeof msal === 'undefined') {
    throw new Error(
      'MSAL library failed to load. Please check your internet connection and try refreshing the page. ' +
      'If the problem persists, ensure your network allows access to unpkg.com or cdn.jsdelivr.net.'
    );
  }
  if (!cfg.msClientId || !cfg.msTenantId) {
    throw new Error('Azure App (Client) ID and Tenant ID are required.');
  }

  // BUG FIX: redirectUri was window.location.origin which equals the string "null"
  // for file:// URLs, and may not match Azure AD registration for hosted pages.
  // Use the full page URL (no hash/query). Register THIS exact URL in Azure AD under:
  //   App registrations → Authentication → Redirect URIs (type: Single-page application)
  const redirectUri = window.location.href.split('?')[0].split('#')[0];

  const cacheKey = `${cfg.msClientId}::${cfg.msTenantId}`;
  if (!_msalInstances[cacheKey]) {
    const msalConfig = {
      auth: {
        clientId:    cfg.msClientId,
        authority:   `https://login.microsoftonline.com/${cfg.msTenantId}`,
        redirectUri,
      },
      cache: { cacheLocation: 'localStorage', storeAuthStateInCookie: false },
    };
    const inst = new msal.PublicClientApplication(msalConfig);
    await inst.initialize();
    _msalInstances[cacheKey] = inst;
    console.log(`🔑 MSAL instance created — redirectUri: ${redirectUri}`);
  }
  const msalInstance = _msalInstances[cacheKey];

  const request = { scopes: ['Mail.Send', 'User.Read'] };

  // Try silent first (uses cached token)
  const accounts = msalInstance.getAllAccounts();
  if (accounts.length > 0) {
    try {
      const silentResult = await msalInstance.acquireTokenSilent({ ...request, account: accounts[0] });
      return silentResult.accessToken;
    } catch (_) { /* fall through to popup */ }
  }
  // Interactive popup login
  const popupResult = await msalInstance.loginPopup(request);
  return popupResult.accessToken;
}

/**
 * sendGraphMail(accessToken, { toEmail, subject, htmlBody })
 * POST to Microsoft Graph /me/sendMail
 */
async function sendGraphMail(accessToken, { toEmail, subject, htmlBody }) {
  const body = {
    message: {
      subject,
      body: { contentType: 'HTML', content: htmlBody },
      toRecipients: [{ emailAddress: { address: toEmail } }],
    },
    saveToSentItems: true,
  };
  const res = await fetch('https://graph.microsoft.com/v1.0/me/sendMail', {
    method: 'POST',
    headers: {
      Authorization: `Bearer ${accessToken}`,
      'Content-Type': 'application/json',
    },
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    const errText = await res.text().catch(() => res.statusText);
    throw new Error(`Graph API error ${res.status}: ${errText}`);
  }

/**
 * buildComplianceHtml({ subject, greeting, openingLine, sectionTitle, triggerLabel,
 *                        rows, closingRemark, portalLink, sentDate })
 * Returns a styled HTML string for the email body.
 */
function buildComplianceHtml({ subject, greeting, openingLine, sectionTitle, triggerLabel,
                                rows, closingRemark, portalLink, sentDate }) {

  // ── Status badge colour map ───────────────────────────────────────────────
  const STATUS_STYLE = {
    'Pending':     { bg:'#e9ecef', border:'#adb5bd', text:'#495057', dot:'#868e96' },
    'In Progress': { bg:'#dbeafe', border:'#93c5fd', text:'#1e40af', dot:'#3b82f6' },
    'Completed':   { bg:'#dcfce7', border:'#86efac', text:'#166534', dot:'#22c55e' },
    'Overdue':     { bg:'#fee2e2', border:'#fca5a5', text:'#991b1b', dot:'#ef4444' },
  };

  // ── Row renderer: detects Status row and renders a colour badge ───────────
  const rowsHtml = rows.map(([icon, label, value]) => {
    if (!value) return '';
    if (label === 'Status') {
      const s = STATUS_STYLE[value] || STATUS_STYLE['Pending'];
      return `<tr>
        <td style="padding:10px 0;font-family:'Times New Roman',Times,serif;font-size:14px;color:#374151;line-height:1.8;border-bottom:1px solid #e8eaf0;">
          &nbsp;&nbsp;${icon} <span style="color:#374151;">${label}:</span>&nbsp;
          <span style="display:inline-flex;align-items:center;gap:6px;background:${s.bg};border:1.5px solid ${s.border};color:${s.text};padding:5px 18px 5px 14px;border-radius:50px;font-size:13px;font-weight:700;font-family:'Times New Roman',Times,serif;letter-spacing:0.3px;vertical-align:middle;">
            <span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${s.dot};flex-shrink:0;"></span>${value}
          </span>
        </td>
      </tr>`;
    }
    return `<tr>
      <td style="padding:8px 0;font-family:'Times New Roman',Times,serif;font-size:14px;color:#1a1a2e;line-height:1.8;border-bottom:1px solid #e8eaf0;">
        &nbsp;&nbsp;${icon} <span style="color:#374151;">${label}:</span> <strong style="color:#1d3557;">${value}</strong>
      </td>
    </tr>`;
  }).join('');

  // ── Header accent bar colour driven by status found in rows ──────────────
  const statusRow = rows.find(([, label]) => label === 'Status');
  const statusVal = statusRow ? statusRow[2] : null;
  const accentClr = { Pending:'#868e96', 'In Progress':'#3b82f6', Completed:'#22c55e', Overdue:'#ef4444' };
  const accentLeft  = accentClr[statusVal] || '#457b9d';
  const accentRight = { Pending:'#ced4da', 'In Progress':'#93c5fd', Completed:'#86efac', Overdue:'#fca5a5' }[statusVal] || '#a8dadc';

  return `
<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"/></head>
<body style="margin:0;padding:0;background:#f0f2f5;font-family:'Times New Roman',Times,serif;font-size:14px;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f0f2f5;padding:40px 0;">
    <tr><td align="center">
      <table width="640" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:24px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,0.12);border:1px solid #dde1e7;">
        <!-- Header -->
        <tr>
          <td style="background:#1d3557;padding:28px 36px;border-radius:24px 24px 0 0;">
            <table width="100%"><tr>
              <td>
                <table cellpadding="0" cellspacing="0" border="0"><tr>
                  <td style="background:#ffffff;border-radius:10px;padding:8px 16px;">
                    <img src="data:image/png;base64,${POLYPLASTICS_LOGO_B64}" alt="Polyplastics" height="26" style="display:block;border:0;height:26px;width:auto;" />
                  </td>
                </tr></table>
                <p style="margin:8px 0 0;font-size:14px;color:#a8c4dc;font-family:'Times New Roman',Times,serif;">Legal Compliance Portal</p>
              </td>
              <td align="right">
                <span style="background:#457b9d;color:#ffffff;padding:6px 18px;border-radius:20px;font-size:13px;font-weight:600;font-family:'Times New Roman',Times,serif;letter-spacing:0.4px;">${triggerLabel}</span>
              </td>
            </tr></table>
          </td>
        </tr>
        <!-- Status accent bar -->
        <tr><td style="height:5px;background:linear-gradient(90deg,${accentLeft},${accentRight});"></td></tr>
        <!-- Body -->
        <tr>
          <td style="padding:32px 36px;background:#ffffff;">
            <p style="margin:0 0 8px;font-size:16px;font-weight:700;color:#1d3557;font-family:'Times New Roman',Times,serif;">${greeting}</p>
            <p style="margin:0 0 24px;font-size:14px;color:#4a4a6a;line-height:1.9;font-family:'Times New Roman',Times,serif;">${openingLine}</p>
            <!-- Detail block -->
            <div style="background:#f7f9fc;border:1px solid #dde1e7;border-left:5px solid ${accentLeft};border-radius:18px;padding:20px 24px;margin-bottom:24px;">
              <p style="margin:0 0 14px;font-size:12px;font-weight:700;color:#457b9d;letter-spacing:1.6px;text-transform:uppercase;font-family:'Times New Roman',Times,serif;">${sectionTitle}</p>
              <table width="100%" cellpadding="0" cellspacing="0">${rowsHtml}</table>
            </div>
            <!-- Closing -->
            <p style="margin:0 0 28px;font-size:14px;color:#4a4a6a;line-height:1.9;font-family:'Times New Roman',Times,serif;">${closingRemark}</p>
            <!-- CTA -->
            <a href="${portalLink}" style="display:inline-block;background:#1d3557;color:#ffffff;text-decoration:none;padding:13px 32px;border-radius:25px;font-size:14px;font-weight:700;font-family:'Times New Roman',Times,serif;letter-spacing:0.4px;">
              Open Compliance Portal →
            </a>
          </td>
        </tr>
        <!-- Footer -->
        <tr>
          <td style="background:#f7f9fc;padding:16px 36px;border-top:1px solid #dde1e7;border-radius:0 0 24px 24px;">
            <p style="margin:0;font-size:13px;color:#6b7280;font-family:'Times New Roman',Times,serif;">Sent on ${sentDate} &nbsp;·&nbsp; POLYPLASTICS Compliance System</p>
          </td>
        </tr>
      </table>
    </td></tr>
  </table>
</body>
</html>`;
}

/* ═══════════════════════════════════════════
   EMAILJS HELPER
   – Alternative email provider using EmailJS
     No backend required; uses EmailJS SDK
═══════════════════════════════════════════ */

/**
 * sendEmailJsMail(cfg, { toEmail, subject, htmlBody, templateParams })
 * Sends an email via EmailJS using a template or raw params.
 * cfg: { ejsServiceId, ejsTemplateId, ejsPublicKey, msToEmail }
 */
async function sendEmailJsMail(cfg, { toEmail, subject, plainText, templateParams }) {
  if (typeof emailjs === 'undefined') {
    throw new Error('EmailJS library failed to load. Check your internet connection or ad-blockers.');
  }
  if (!cfg.ejsServiceId || !cfg.ejsTemplateId || !cfg.ejsPublicKey) {
    throw new Error('EmailJS Service ID, Template ID, and Public Key are all required.');
  }

  // Initialize EmailJS (idempotent)
  emailjs.init({ publicKey: cfg.ejsPublicKey });

  // Merge caller params with standard params
  const params = {
    to_email:    toEmail,
    to_name:     templateParams?.to_name     || 'Compliance Team',
    from_name:   templateParams?.from_name   || 'Polyplastics',
    subject:     subject,
    message:     plainText || templateParams?.message || subject,
    reply_to:    cfg.fromEmail || cfg.msToEmail || '',
    // extra fields callers may supply
    ...(templateParams || {}),
  };

  // BUG FIX: EmailJS v4 rejects (throws) on hard errors, but resolves with non-200
  // for soft failures (e.g. bad template variable). We must check both cases.
  // Also: the `to_email` param only reaches the recipient if your EmailJS template's
  // "To Email" field is set to {{to_email}} in the EmailJS dashboard. If it's
  // hardcoded in the template, every email goes to that address regardless of toEmail.
  let response;
  try {
    response = await emailjs.send(cfg.ejsServiceId, cfg.ejsTemplateId, params);
  } catch (sendErr) {
    // EmailJS throws an object {status, text} — normalise to Error
    const msg = sendErr?.text || sendErr?.message || String(sendErr);
    const code = sendErr?.status ? ` (status ${sendErr.status})` : '';
    throw new Error(`EmailJS send rejected${code}: ${msg}`);
  }
  if (!response || response.status !== 200) {
    throw new Error(`EmailJS responded with status ${response?.status}: ${response?.text}`);
  }
  return response;
}

/**
 * buildEmailJsPlainText({ greeting, openingLine, rows, closingRemark, portalLink, sentDate })
 * Returns a plain-text fallback string for EmailJS templates.
 */
function buildEmailJsPlainText({ greeting, openingLine, rows, closingRemark, portalLink, sentDate }) {
  const rowLines = rows
    .filter(([, , value]) => value)
    .map(([icon, label, value]) => `  ${icon} ${label}: ${value}`)
    .join('\n');
  return `${greeting}

${openingLine}

${rowLines}

${closingRemark}

Open Compliance Portal: ${portalLink}

Sent on ${sentDate} · Polyplastics`;
}

/**
 * sendComplianceMail({ trigger, req, plant, assignee, oldAssignee, oldStatus, changedBy })
 *
 * trigger: 'new_requirement' | 'status_change' | 'new_assignment' | 'reassignment'
 *          | 'plant_added' | 'plant_deleted' | 'plant_updated'
 *
 * Reads email provider settings from localStorage.
 * emailProvider: 'graph' (Microsoft Graph API) | 'emailjs' | 'both'
 */
async function sendComplianceMail({ trigger, req, plant, assignee, oldAssignee, oldStatus, changedBy, users }) {
  // Log every notification event for the daily digest
  logDigestActivity({ trigger, req, plant, assignee, oldStatus, changedBy });
  try {
    const raw = localStorage.getItem('adminSettings');
    if (!raw) return;
    const cfg = JSON.parse(raw);

    const provider = cfg.emailProvider || 'graph'; // 'graph' | 'emailjs' | 'both'
    // BUG FIX: previously `|| cfg.msEnabled` caused Graph to run even when provider='emailjs',
    // which triggered a popup that browsers block in automated flows, silently killing everything.
    const useGraph  = provider === 'graph'  || provider === 'both';
    const useEjs    = provider === 'emailjs' || provider === 'both';

    // Quick-exit if neither provider is configured
    const graphReady = useGraph  && cfg.msClientId && cfg.msTenantId && cfg.msToEmail;
    const ejsReady   = (useEjs || cfg.ejsEnabled) && cfg.ejsServiceId && cfg.ejsTemplateId && cfg.ejsPublicKey && cfg.msToEmail;
    if (!graphReady && !ejsReady) return;

    // ── Shared helpers ──────────────────────────────────────────────────
    const fmtDate  = d => d ? new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}) : '—';
    const calcDays = d => { const diff = Math.ceil((new Date(d) - Date.now()) / 86400000); return diff > 0 ? diff : 0; };
    const sentDate = new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
    const portalLink    = window.location.href.split('?')[0];
    const magicLink     = `${portalLink}?view=top_management&token=TM_OVERVIEW_2026`;
    const byLabel       = changedBy ? changedBy.name : 'System';

    // ── Per-trigger subject, greeting, openingLine, rows, closing ───────
    let subject = '', greeting = 'Dear Compliance Team,', openingLine = '';
    let sectionTitle = 'REQUIREMENT DETAILS', triggerLabel = 'Notification', closingRemark = '';
    let baseRows = [];
    let extrasByRecipient = {};

    const reqRows = () => {
      const escEmails = req?.escalationEmails && typeof req.escalationEmails === 'object'
        ? req.escalationEmails
        : (req?.escalationEmail ? { 1:[req.escalationEmail], 2:[], 3:[] } : {});
      const currentLevel = req?.escalationLevel || 1;
      const escEmailList = [];
      for (let lv = 1; lv <= 3; lv++) {
        const emails = escEmails[lv] || [];
        if (emails.length) escEmailList.push(`L${lv}: ${emails.join(', ')}`);
      }
      return [
        ['📋','Title',        req?.title],
        ['🏷️','Category',    req?.category],
        ['⚡','Priority',     req?.priority],
        ['⏳','Status',       req?.status],
        ['📅','Due Date',     fmtDate(req?.dueDate)],
        ['✅','Completion Date', req?.completionDate ? fmtDate(req.completionDate) : null],
        ['⌛','Days Left',    req?.dueDate ? `${calcDays(req.dueDate)} days` : null],
        ['🔔','Reminder',     req?.reminderFrequency],
        ['🔁','Compliance Cycle', req?.complianceFrequency ? (COMPLIANCE_FREQS.find(f=>f.value===req.complianceFrequency)||{label:req.complianceFrequency}).label : null],
        ['📅','Next Due Date',
          req?.nextDueDate && req?.complianceFrequency!=='one_time'
            ? `${fmtDate(req.nextDueDate)} · ${(COMPLIANCE_FREQS.find(f=>f.value===req?.complianceFrequency)||{label:req?.complianceFrequency||'Annual'}).label}`
            : null
        ],
        ['🏭','Plant',        plant ? `${plant.name} (${plant.state})` : null],
        ['⬆️','Escalation',   req?.escalationLevel ? `Level ${req.escalationLevel}` : null],
        ['📧','Escalation Emails', escEmailList.length ? escEmailList.join(' | ') : null],
      ];
    };

    if (trigger === 'new_requirement') {
      subject       = `[LegalComp] New Requirement Added: ${req?.title}`;
      triggerLabel  = 'New Requirement';
      openingLine   = 'A new compliance requirement has been created in the system and is ready for action.';
      closingRemark = 'Please ensure the requirement is reviewed and assigned promptly.';
      baseRows = [
        ...reqRows(),
        ['👤','Assigned To', assignee ? `${assignee.name} (${assignee.dept || '—'})` : null],
        ['📝','Description', req?.description],
      ];

    } else if (trigger === 'new_assignment') {
      subject       = `[LegalComp] New Compliance Task Assigned to You: ${req?.title}`;
      sectionTitle  = 'ASSIGNED REQUIREMENT DETAILS';
      triggerLabel  = 'New Assignment';
      openingLine   = 'A compliance requirement has been assigned. Please review the details below and take the necessary action before the due date.';
      closingRemark = 'Please log in to the compliance portal to review the requirement, upload evidence and update the status once completed.';
      extrasByRecipient[cfg.msToEmail] = {
        greeting:    'Dear Compliance Team,',
        extraRows:   [['👤','Assigned To', assignee ? `${assignee.name} (${assignee.email})` : null]],
      };
      if (assignee?.email && assignee.email !== cfg.msToEmail) {
        extrasByRecipient[assignee.email] = {
          greeting:  `Dear ${assignee.name},`,
          extraRows: [],
        };
      }
      baseRows = [...reqRows(), ['📝','Description', req?.description]];

    } else if (trigger === 'status_change') {
      subject       = `[LegalComp] Status Updated → ${req?.status}: ${req?.title}`;
      sectionTitle  = 'UPDATED REQUIREMENT DETAILS';
      triggerLabel  = 'Status Updated';
      greeting      = assignee ? `Dear ${assignee.name},` : 'Dear Compliance Team,';
      openingLine   = `The status of a compliance requirement has been updated from "${oldStatus}" to "${req?.status}".`;
      closingRemark = 'Please review the updated status and ensure all compliance actions are on track.';
      baseRows = reqRows();

    } else if (trigger === 'reassignment') {
      const oldLabel = oldAssignee ? `${oldAssignee.name} (${oldAssignee.email})` : 'Unassigned';
      subject       = `[LegalComp] Requirement Reassigned: ${req?.title}`;
      sectionTitle  = 'REASSIGNMENT DETAILS';
      triggerLabel  = 'Reassigned';
      closingRemark = 'Please log in to the compliance portal to review and begin work on this requirement.';
      extrasByRecipient[cfg.msToEmail] = {
        greeting:    'Dear Compliance Team,',
        openingLine: `A compliance requirement has been reassigned from ${oldLabel} to ${assignee?.name || 'a new team member'}.`,
        extraRows:   [['👤','New Assignee', assignee ? `${assignee.name} (${assignee.email})` : null]],
      };
      if (assignee?.email && assignee.email !== cfg.msToEmail) {
        extrasByRecipient[assignee.email] = {
          greeting:    `Dear ${assignee.name},`,
          openingLine: 'A compliance requirement has been reassigned to you. Please review the details and take ownership immediately.',
          extraRows:   [],
        };
      }
      baseRows = reqRows();

    } else if (['plant_added','plant_deleted','plant_updated'].includes(trigger)) {
      const labels  = { plant_added:'Plant Added', plant_deleted:'Plant Removed', plant_updated:'Plant Updated' };
      const openings = {
        plant_added:   `A new plant location has been added to the LegalComp system by ${byLabel}.`,
        plant_deleted: `A plant location has been removed from the LegalComp system by ${byLabel}.`,
        plant_updated: `A plant location has been updated in the LegalComp system by ${byLabel}.`,
      };
      const closings = {
        plant_added:   'Please ensure compliance requirements are set up for this new plant.',
        plant_deleted: 'Please archive all related compliance records for this plant.',
        plant_updated: 'Please verify the updated plant details in the compliance portal.',
      };
      subject       = `[LegalComp] ${labels[trigger]}: ${plant?.name}`;
      sectionTitle  = 'PLANT DETAILS';
      triggerLabel  = labels[trigger];
      openingLine   = openings[trigger];
      closingRemark = closings[trigger];
      baseRows = [
        ['🏭','Plant Name',  plant?.name],
        ['📍','State',       plant?.state],
        ['👤','Changed By',  byLabel],
      ];
    } else {
      return;
    }

    // ── Acquire Graph token once (if needed) ────────────────────────────
    let accessToken = null;
    if (graphReady) {
      try {
        accessToken = await getMSGraphToken(cfg);
      } catch(e) {
        console.warn('⚠️ MS Graph token acquisition failed:', e?.message || e);
        if (!ejsReady) return; // nothing else to fall back to
      }
    }

    // ── Collect recipients ──────────────────────────────────────────────
    const recipients = new Set([cfg.msToEmail]);
    if (assignee?.email) recipients.add(assignee.email);
    if (oldAssignee?.email && trigger === 'reassignment') recipients.add(oldAssignee.email);
    // ── Add plant admins for the relevant plant ───────────────────────────
    if (plant?.id && Array.isArray(users)) {
      users
        .filter(u => u.role === 'plant_admin' && u.plantId === plant.id && u.email)
        .forEach(u => recipients.add(u.email));
    }
    // ── Add per-level escalation emails ──────────────────────────────────
    if (req) {
      // Per-requirement emails take precedence; fall back to global adminSettings map
      const perReqEmails = req.escalationEmails && typeof req.escalationEmails === 'object'
        ? req.escalationEmails
        : (req.escalationEmail ? { 1:[req.escalationEmail], 2:[], 3:[] } : null);
      const globalMap = cfg.escalationEmailsMap && typeof cfg.escalationEmailsMap === 'object'
        ? cfg.escalationEmailsMap
        : { 1: cfg.escalation1?[cfg.escalation1]:[], 2: cfg.escalation2?[cfg.escalation2]:[], 3: cfg.escalation3?[cfg.escalation3]:[] };
      const escEmails = perReqEmails || globalMap;
      const currentLevel = req.escalationLevel || 1;
      // Send to all levels up to and including current escalation level
      for (let lv = 1; lv <= currentLevel; lv++) {
        const lvEmails = escEmails[lv] || [];
        lvEmails.forEach(e => { if(e) recipients.add(e); });
      }
    }

    // ── Fire one send per recipient ─────────────────────────────────────
    for (const toEmail of recipients) {
      const overrides  = extrasByRecipient[toEmail] || {};
      const finalRows  = [...baseRows, ...(overrides.extraRows || [])];
      const finalGreeting    = overrides.greeting    || greeting;
      const finalOpeningLine = overrides.openingLine || openingLine;

      // Level 3 Top Management recipients get the magic link for direct no-login access
      const escEmails3 = req?.escalationEmails?.[3] || [];
      const isL3Recipient = escEmails3.includes(toEmail);
      const effectivePortalLink = isL3Recipient ? magicLink : portalLink;

      // ── Microsoft Graph send ──────────────────────────────────────────
      if (graphReady && accessToken) {
        try {
          const htmlBody = buildComplianceHtml({
            subject,
            greeting:    finalGreeting,
            openingLine: finalOpeningLine,
            sectionTitle,
            triggerLabel,
            rows:        finalRows,
            closingRemark: isL3Recipient ? closingRemark + ' Use the secure link below to open the dashboard without logging in.' : closingRemark,
            portalLink:  effectivePortalLink,
            sentDate,
          });
          await sendGraphMail(accessToken, { toEmail, subject, htmlBody });
          console.log(`✅ [MS Graph] ${trigger} → ${toEmail}`);
        } catch(e) {
          console.warn(`⚠️ MS Graph send failed for ${toEmail}:`, e?.message || e);
        }
      }

      // ── EmailJS send ──────────────────────────────────────────────────
      if (ejsReady) {
        try {
          const plainText = buildEmailJsPlainText({
            greeting:    finalGreeting,
            openingLine: finalOpeningLine,
            rows:        finalRows,
            closingRemark,
            portalLink:  effectivePortalLink,
            sentDate,
          });
          // Build a rich templateParams map for flexible EmailJS templates
          const reqObj = req || {};
          const plantObj = plant || {};
          await sendEmailJsMail(cfg, {
            toEmail,
            subject,
            plainText,
            templateParams: {
              to_name:         overrides.greeting ? overrides.greeting.replace(/^Dear\s+/i,'').replace(/,$/,'') : 'Compliance Team',
              from_name:       'Polyplastics',
              trigger_label:   triggerLabel,
              opening_line:    finalOpeningLine,
              closing_remark:  closingRemark,
              portal_link:     effectivePortalLink,
              sent_date:       sentDate,
              req_title:       reqObj.title        || '',
              req_category:    reqObj.category      || '',
              req_priority:    reqObj.priority      || '',
              req_status:      reqObj.status        || '',
              req_due_date:    reqObj.dueDate        ? new Date(reqObj.dueDate).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}) : '',
              req_description: reqObj.description   || '',
              plant_name:      plantObj.name         || '',
              plant_state:     plantObj.state        || '',
              assignee_name:   assignee?.name        || '',
              assignee_email:  assignee?.email       || '',
              changed_by:      changedBy?.name       || 'System',
              old_status:      oldStatus             || '',
            },
          });
          console.log(`✅ [EmailJS] ${trigger} → ${toEmail}`);
        } catch(e) {
          console.warn(`⚠️ EmailJS send failed for ${toEmail}:`, e?.message || e);
        }
      }
    }

  } catch (e) {
    console.warn('⚠️ sendComplianceMail error:', e?.message || e);
  }
}

/* ═══════════════════════════════════════════
   DAILY DIGEST — 24-HOUR CONSOLIDATED EMAIL
═══════════════════════════════════════════ */

/**
 * Appends an activity entry to the in-memory digest log (window.__digestLog).
 * Called from sendComplianceMail so every real notification is captured.
 */
function logDigestActivity({ trigger, req, plant, assignee, oldStatus, changedBy }) {
  if (!window.__digestLog) window.__digestLog = [];
  window.__digestLog.push({
    ts: new Date().toISOString(),
    trigger,
    title:       req?.title       || '',
    category:    req?.category    || '',
    priority:    req?.priority    || '',
    status:      req?.status      || '',
    oldStatus:   oldStatus        || '',
    dueDate:     req?.dueDate     || '',
    plant:       plant?.name      || '',
    state:       plant?.state     || '',
    assignee:    assignee?.name   || '',
    changedBy:   changedBy?.name  || 'System',
  });
}

/**
 * Sends a single consolidated "last 24 hours" digest email.
 * Clears the digest log after sending.
 */
async function sendDailyDigestMail(requirements, plants, users) {
  try {
    const raw = localStorage.getItem('adminSettings');
    if (!raw) return;
    const cfg = JSON.parse(raw);
    if (!cfg.dailyDigestEnabled) return;

    const provider  = cfg.emailProvider || 'graph';
    const useGraph  = provider === 'graph'  || provider === 'both';
    const useEjs    = provider === 'emailjs' || provider === 'both';
    const graphReady = useGraph  && cfg.msClientId && cfg.msTenantId && cfg.msToEmail;
    const ejsReady   = (useEjs || cfg.ejsEnabled) && cfg.ejsServiceId && cfg.ejsTemplateId && cfg.ejsPublicKey && cfg.msToEmail;
    if (!graphReady && !ejsReady) { console.warn('⚠️ Daily digest: no email provider configured.'); return; }

    const portalLink = window.location.href.split('?')[0];
    const sentDate   = new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
    const fmtDate    = d => d ? new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}) : '—';
    const daysLeft   = d => { const diff = Math.ceil((new Date(d) - Date.now()) / 86400000); return diff; };

    // ── Snapshot current state for the digest sections ───────────────────
    const now        = Date.now();
    const cutoff     = now - 24 * 60 * 60 * 1000;
    const overdue    = requirements.filter(r => r.status === 'Overdue');
    const dueSoon    = requirements.filter(r => r.status !== 'Completed' && r.status !== 'Overdue' && r.dueDate && daysLeft(r.dueDate) >= 0 && daysLeft(r.dueDate) <= 7);
    const due30      = requirements.filter(r => r.status !== 'Completed' && r.status !== 'Overdue' && r.dueDate && daysLeft(r.dueDate) > 7  && daysLeft(r.dueDate) <= 30);
    const due30plus  = requirements.filter(r => r.status !== 'Completed' && r.status !== 'Overdue' && r.dueDate && daysLeft(r.dueDate) > 30);
    const completed24= requirements.filter(r => r.status === 'Completed' && r.completionDate && new Date(r.completionDate).getTime() >= cutoff);
    const created24  = requirements.filter(r => r.createdAt && new Date(r.createdAt).getTime() >= cutoff);
    // Activity log captured during the last 24h
    const actLog     = (window.__digestLog || []).filter(e => new Date(e.ts).getTime() >= cutoff);

    const total      = requirements.length;
    const completedAll = requirements.filter(r=>r.status==='Completed' || !isEffectivelyOverdue(r)).length;
    const compliance = total ? Math.round(completedAll/total*100) : 0;

    const subject = `[LegalComp] Daily Digest — ${new Date().toLocaleDateString('en-IN',{weekday:'long',day:'2-digit',month:'short',year:'numeric'})}`;

    // ── Build rich HTML body ─────────────────────────────────────────────
    const buildDigestHtml = () => {
      const brandGreen = '#22c55e'; const brandRed = '#ef4444'; const brandAmber = '#f59e0b';
      const brandIndigo = '#6366f1'; const brandGray = '#6b7280';

      const statBox = (color, emoji, count, label) =>
        `<td style="width:25%;text-align:center;padding:12px 6px;">
           <div style="background:${color}18;border:1px solid ${color}44;border-radius:12px;padding:14px 8px;">
             <div style="font-size:22px;margin-bottom:4px;">${emoji}</div>
             <div style="font-size:24px;font-weight:800;color:${color};line-height:1;">${count}</div>
             <div style="font-size:11px;color:#6b7280;margin-top:3px;font-weight:600;">${label}</div>
           </div>
         </td>`;

      const sectionHdr = (emoji, title, color) =>
        `<tr><td style="padding:22px 0 10px;">
           <div style="display:flex;align-items:center;gap:8px;border-left:4px solid ${color};padding-left:12px;">
             <span style="font-size:16px;">${emoji}</span>
             <span style="font-size:14px;font-weight:700;color:#111827;text-transform:uppercase;letter-spacing:.05em;">${title}</span>
           </div>
         </td></tr>`;

      const emptyRow = (msg) =>
        `<tr><td style="padding:10px 16px;background:#f9fafb;border-radius:10px;color:#9ca3af;font-size:13px;text-align:center;">${msg}</td></tr>`;

      const priorityColor = p => ({Critical:'#ef4444',High:'#f97316',Medium:'#f59e0b',Low:'#22c55e'}[p]||'#6b7280');
      const statusColor   = s => ({Completed:'#22c55e','In Progress':'#6366f1',Pending:'#f59e0b',Overdue:'#ef4444'}[s]||'#6b7280');
      const badge = (text, color) => `<span style="display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;background:${color}22;color:${color};">${text}</span>`;

      const reqRow = (r) => {
        const p = plants.find(pl=>pl.id===r.plantId);
        const dl = daysLeft(r.dueDate);
        const assignedIds = Array.isArray(r.assignedTo)?r.assignedTo:(r.assignedTo?[r.assignedTo]:[]);
        const assigneeNames = assignedIds.map(id=>users.find(u=>u.id===id)?.name).filter(Boolean).join(', ') || 'Unassigned';
        return `<tr>
          <td style="padding:10px 12px;border-bottom:1px solid #f1f5f9;font-size:13px;font-weight:500;color:#111827;">${r.title}</td>
          <td style="padding:10px 8px;border-bottom:1px solid #f1f5f9;font-size:12px;color:#6b7280;">${p?.name||'—'}</td>
          <td style="padding:10px 8px;border-bottom:1px solid #f1f5f9;">${badge(r.priority, priorityColor(r.priority))}</td>
          <td style="padding:10px 8px;border-bottom:1px solid #f1f5f9;">${badge(r.status, statusColor(r.status))}</td>
          <td style="padding:10px 8px;border-bottom:1px solid #f1f5f9;font-size:12px;color:${dl<0?'#ef4444':dl<7?'#f59e0b':'#6b7280'};">${fmtDate(r.dueDate)}${dl<0?` <span style="color:#ef4444;font-size:11px;">(${Math.abs(dl)}d overdue)</span>`:dl<7?` <span style="color:#f59e0b;font-size:11px;">(${dl}d left)</span>`:''}</td>
          <td style="padding:10px 8px;border-bottom:1px solid #f1f5f9;font-size:12px;color:#6b7280;">${assigneeNames}</td>
        </tr>`;
      };

      const triggerLabel = t => ({
        new_requirement:'➕ New Requirement', status_change:'🔄 Status Changed',
        new_assignment:'👤 Assigned', reassignment:'🔀 Reassigned',
        plant_added:'🏭 Plant Added', plant_deleted:'🏚️ Plant Deleted', plant_updated:'✏️ Plant Updated'
      }[t] || t);

      const activityRows = actLog.length
        ? actLog.map(e => `<tr>
            <td style="padding:9px 12px;border-bottom:1px solid #f1f5f9;font-size:12px;color:#9ca3af;">${new Date(e.ts).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}</td>
            <td style="padding:9px 12px;border-bottom:1px solid #f1f5f9;font-size:12px;font-weight:600;">${triggerLabel(e.trigger)}</td>
            <td style="padding:9px 12px;border-bottom:1px solid #f1f5f9;font-size:12px;color:#111827;">${e.title||'—'}</td>
            <td style="padding:9px 12px;border-bottom:1px solid #f1f5f9;font-size:12px;color:#6b7280;">${e.plant||'—'}</td>
            <td style="padding:9px 12px;border-bottom:1px solid #f1f5f9;">${e.status ? badge(e.status, statusColor(e.status)) : '—'}</td>
            <td style="padding:9px 12px;border-bottom:1px solid #f1f5f9;font-size:12px;color:#6b7280;">${e.changedBy||'System'}</td>
          </tr>`).join('')
        : `<tr><td colspan="6" style="padding:14px;text-align:center;color:#9ca3af;font-size:13px;">No activity recorded in the last 24 hours.</td></tr>`;

      return `<!DOCTYPE html><html><head><meta charset="UTF-8"/></head><body style="margin:0;padding:0;background:#f8fafc;font-family:'Segoe UI',Arial,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#f8fafc;padding:32px 16px;">
  <tr><td align="center">
    <table width="680" cellpadding="0" cellspacing="0" style="max-width:680px;width:100%;background:#ffffff;border-radius:20px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,0.08);">

      <!-- Header -->
      <tr><td style="background:linear-gradient(135deg,#eff6ff 0%,#dbeafe 50%,#bfdbfe 100%);padding:32px 36px;border-bottom:3px solid #3b82f6;">
        <table width="100%" cellpadding="0" cellspacing="0">
          <tr>
            <td>
              <div style="font-size:13px;font-weight:700;color:#1d4ed8;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;">POLYPLASTICS — LEGALCOMP</div>
              <div style="font-size:26px;font-weight:800;color:#1e3a8a;line-height:1.2;">Daily Compliance Digest</div>
              <div style="font-size:13px;color:#2563eb;margin-top:6px;">📅 Last 24-Hour Summary · ${sentDate}</div>
            </td>
            <td align="right" style="vertical-align:top;">
              <div style="background:rgba(37,99,235,0.12);border:1px solid rgba(37,99,235,0.3);border-radius:14px;padding:12px 18px;text-align:center;">
                <div style="font-size:28px;font-weight:800;color:#1e3a8a;">${compliance}%</div>
                <div style="font-size:11px;color:#2563eb;font-weight:600;margin-top:2px;">COMPLIANCE</div>
              </div>
            </td>
          </tr>
        </table>
      </td></tr>

      <!-- Summary Stats -->
      <tr><td style="padding:24px 28px 10px;">
        <table width="100%" cellpadding="0" cellspacing="0">
          <tr>
            ${statBox(brandGray,   '📋', total,             'Total')}
            ${statBox(brandGreen,  '✅', completedAll,      'Complied')}
