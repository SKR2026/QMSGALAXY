function buildComplianceHtml({
  subject,
  greeting,
  openingLine,
  sectionTitle,
  triggerLabel,
  rows,
  closingRemark,
  portalLink,
  sentDate
}) {
  const STATUS_STYLE = {
    'Pending': {
      bg: '#e9ecef',
      border: '#adb5bd',
      text: '#495057',
      dot: '#868e96'
    },
    'In Progress': {
      bg: '#dbeafe',
      border: '#93c5fd',
      text: '#1e40af',
      dot: '#3b82f6'
    },
    'Completed': {
      bg: '#dcfce7',
      border: '#86efac',
      text: '#166534',
      dot: '#22c55e'
    },
    'Overdue': {
      bg: '#fee2e2',
      border: '#fca5a5',
      text: '#991b1b',
      dot: '#ef4444'
    }
  };
  const rowsHtml = rows.map(([icon, label, value]) => {
    if (!value) return '';
    if (label === 'Status') {
      const s = STATUS_STYLE[value] || STATUS_STYLE['Pending'];
      return `<tr>
        <td style="padding:10px 0;font-family:'Times New Roman',Times,serif;font-size:14px;color:#374151;line-height:1.8;border-bottom:1px solid #e8eaf0;">
          &nbsp;&nbsp;${icon} <span style="color:#374151;">${label}:</span>&nbsp;
          <span style="display:inline-flex;align-items:center;gap:6px;background:${s.bg};border:1.5px solid ${s.border};color:${s.text};padding:5px 18px 5px 14px;border-radius:50px;font-size:13px;font-weight:700;font-family:'Times New Roman',Times,serif;letter-spacing:0.3px;vertical-align:middle;">
            <span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${s.dot};flex-shrink:0;"></span>${value}
          </span>
        </td>
      </tr>`;
    }
    return `<tr>
      <td style="padding:8px 0;font-family:'Times New Roman',Times,serif;font-size:14px;color:#1a1a2e;line-height:1.8;border-bottom:1px solid #e8eaf0;">
        &nbsp;&nbsp;${icon} <span style="color:#374151;">${label}:</span> <strong style="color:#1d3557;">${value}</strong>
      </td>
    </tr>`;
  }).join('');
  const statusRow = rows.find(([, label]) => label === 'Status');
  const statusVal = statusRow ? statusRow[2] : null;
  const accentClr = {
    Pending: '#868e96',
    'In Progress': '#3b82f6',
    Completed: '#22c55e',
    Overdue: '#ef4444'
  };
  const accentLeft = accentClr[statusVal] || '#457b9d';
  const accentRight = {
    Pending: '#ced4da',
    'In Progress': '#93c5fd',
    Completed: '#86efac',
    Overdue: '#fca5a5'
  }[statusVal] || '#a8dadc';
  return `
<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"/></head>
<body style="margin:0;padding:0;background:#f0f2f5;font-family:'Times New Roman',Times,serif;font-size:14px;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f0f2f5;padding:40px 0;">
    <tr><td align="center">
      <table width="640" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:24px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,0.12);border:1px solid #dde1e7;">
        <!-- Header -->
        <tr>
          <td style="background:#1d3557;padding:28px 36px;border-radius:24px 24px 0 0;">
            <table width="100%"><tr>
              <td>
                <table cellpadding="0" cellspacing="0" border="0"><tr>
                  <td style="background:#ffffff;border-radius:10px;padding:8px 16px;">
                    <img src="data:image/png;base64,${POLYPLASTICS_LOGO_B64}" alt="Polyplastics" height="26" style="display:block;border:0;height:26px;width:auto;" />
                  </td>
                </tr></table>
                <p style="margin:8px 0 0;font-size:14px;color:#a8c4dc;font-family:'Times New Roman',Times,serif;">Legal Compliance Portal</p>
              </td>
              <td align="right">
                <span style="background:#457b9d;color:#ffffff;padding:6px 18px;border-radius:20px;font-size:13px;font-weight:600;font-family:'Times New Roman',Times,serif;letter-spacing:0.4px;">${triggerLabel}</span>
              </td>
            </tr></table>
          </td>
        </tr>
        <!-- Status accent bar -->
        <tr><td style="height:5px;background:linear-gradient(90deg,${accentLeft},${accentRight});"></td></tr>
        <!-- Body -->
        <tr>
          <td style="padding:32px 36px;background:#ffffff;">
            <p style="margin:0 0 8px;font-size:16px;font-weight:700;color:#1d3557;font-family:'Times New Roman',Times,serif;">${greeting}</p>
            <p style="margin:0 0 24px;font-size:14px;color:#4a4a6a;line-height:1.9;font-family:'Times New Roman',Times,serif;">${openingLine}</p>
            <!-- Detail block -->
            <div style="background:#f7f9fc;border:1px solid #dde1e7;border-left:5px solid ${accentLeft};border-radius:18px;padding:20px 24px;margin-bottom:24px;">
              <p style="margin:0 0 14px;font-size:12px;font-weight:700;color:#457b9d;letter-spacing:1.6px;text-transform:uppercase;font-family:'Times New Roman',Times,serif;">${sectionTitle}</p>
              <table width="100%" cellpadding="0" cellspacing="0">${rowsHtml}</table>
            </div>
            <!-- Closing -->
            <p style="margin:0 0 28px;font-size:14px;color:#4a4a6a;line-height:1.9;font-family:'Times New Roman',Times,serif;">${closingRemark}</p>
            <!-- CTA -->
            <a href="${portalLink}" style="display:inline-block;background:#1d3557;color:#ffffff;text-decoration:none;padding:13px 32px;border-radius:25px;font-size:14px;font-weight:700;font-family:'Times New Roman',Times,serif;letter-spacing:0.4px;">
              Open Compliance Portal →
            </a>
          </td>
        </tr>
        <!-- Footer -->
        <tr>
          <td style="background:#f7f9fc;padding:16px 36px;border-top:1px solid #dde1e7;border-radius:0 0 24px 24px;">
            <p style="margin:0;font-size:13px;color:#6b7280;font-family:'Times New Roman',Times,serif;">Sent on ${sentDate} &nbsp;·&nbsp; POLYPLASTICS Compliance System</p>
          </td>
        </tr>
      </table>
    </td></tr>
  </table>
</body>
</html>`;
}
async function sendEmailJsMail(cfg, {
  toEmail,
  subject,
  plainText,
  templateParams
}) {
  if (typeof emailjs === 'undefined') {
    throw new Error('EmailJS library failed to load. Check your internet connection or ad-blockers.');
  }
  if (!cfg.ejsServiceId || !cfg.ejsTemplateId || !cfg.ejsPublicKey) {
    throw new Error('EmailJS Service ID, Template ID, and Public Key are all required.');
  }
  emailjs.init({
    publicKey: cfg.ejsPublicKey
  });
  const params = {
    to_email: toEmail,
    to_name: templateParams?.to_name || 'Compliance Team',
    from_name: templateParams?.from_name || 'Polyplastics',
    subject: subject,
    message: plainText || templateParams?.message || subject,
    reply_to: cfg.fromEmail || cfg.msToEmail || '',
    ...(templateParams || {})
  };
  let response;
  try {
    response = await emailjs.send(cfg.ejsServiceId, cfg.ejsTemplateId, params);
  } catch (sendErr) {
    const msg = sendErr?.text || sendErr?.message || String(sendErr);
    const code = sendErr?.status ? ` (status ${sendErr.status})` : '';
    throw new Error(`EmailJS send rejected${code}: ${msg}`);
  }
  if (!response || response.status !== 200) {
    throw new Error(`EmailJS responded with status ${response?.status}: ${response?.text}`);
  }
  return response;
}
function buildEmailJsPlainText({
  greeting,
  openingLine,
  rows,
  closingRemark,
  portalLink,
  sentDate
}) {
  const rowLines = rows.filter(([,, value]) => value).map(([icon, label, value]) => `  ${icon} ${label}: ${value}`).join('\n');
  return `${greeting}

${openingLine}

${rowLines}

${closingRemark}

Open Compliance Portal: ${portalLink}

Sent on ${sentDate} · Polyplastics`;
}
async function sendComplianceMail({
  trigger,
  req,
  plant,
  assignee,
  oldAssignee,
  oldStatus,
  changedBy,
  users
}) {
  logDigestActivity({
    trigger,
    req,
    plant,
    assignee,
    oldStatus,
    changedBy
  });
  try {
    const raw = localStorage.getItem('adminSettings');
    if (!raw) return;
    const cfg = JSON.parse(raw);
    const provider = cfg.emailProvider || 'graph';
    const useGraph = provider === 'graph' || provider === 'both';
    const useEjs = provider === 'emailjs' || provider === 'both';
    const graphReady = useGraph && cfg.msClientId && cfg.msTenantId && cfg.msToEmail;
    const ejsReady = (useEjs || cfg.ejsEnabled) && cfg.ejsServiceId && cfg.ejsTemplateId && cfg.ejsPublicKey && cfg.msToEmail;
    if (!graphReady && !ejsReady) return;
    const fmtDate = d => d ? new Date(d).toLocaleDateString('en-IN', {

async function triggerCloudReminder(type) {
  try {
    const raw = localStorage.getItem('adminSettings');
    if (!raw) return {
      ok: false,
      reason: 'no settings'
    };
    const cfg = JSON.parse(raw);
    const url = (cfg.cloudFnUrl || '').trim();
    const secret = (cfg.cloudFnSecret || '').trim();
    if (!url) return {
      ok: false,
      reason: 'cloudFnUrl not configured'
    };
    const cfg2 = JSON.parse(raw);
    const res = await fetch(url, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-internal-secret': secret
      },
      body: JSON.stringify({
        type,
        smtpProvider: cfg2.smtpProvider || 'gmail'
      })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    console.log(`✅ Cloud reminder triggered [${type}]:`, data);
    return {
      ok: true,
      data
    };
  } catch (e) {
    console.warn(`⚠️ Cloud reminder trigger failed [${type}]:`, e?.message || e);
    return {
      ok: false,
      reason: e?.message || String(e)
    };
  }
}
