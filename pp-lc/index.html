/* ═══════════════════════════════════════════
   FIREBASE SYNC HELPERS
   All collections: legalcomp_plants, legalcomp_users, legalcomp_requirements
   Single-document array pattern — one doc per collection named "data"
   so the whole array is atomic and cheap on Firestore reads.
═══════════════════════════════════════════ */
const FB_PLANTS    = 'legalcomp_plants';
const FB_USERS     = 'legalcomp_users';
const FB_REQS      = 'legalcomp_requirements';
const FB_SETTINGS  = 'legalcomp_settings';

/* ── Ensure Firebase has an auth token before any Firestore read ──
   Uses Anonymous Auth so Firestore rules (request.auth != null) always pass.
   If anonymous auth is disabled in Firebase console, this is a no-op and
   you must set Firestore rules to: allow read, write: if true;            ── */
async function fbEnsureAuth() {
  try {
    if (!window.fbAuth.currentUser) {
      await window.fbAuth.signInAnonymously();
    }
  } catch(e) {
    console.warn('Anonymous auth failed (may be disabled in Firebase console):', e.message);
  }
}

async function fbLoad(col) {
  await fbEnsureAuth();
  try {
    const snap = await window.db.collection(col).doc('data').get();
    if (snap.exists) return snap.data().items || null;
  } catch(e) { console.warn('fbLoad failed', col, e); }
  return null;
}

async function fbSave(col, items) {
  await fbEnsureAuth();
  try {
    await window.db.collection(col).doc('data').set({ items, updatedAt: new Date().toISOString() });
  } catch(e) { console.warn('fbSave failed', col, e); }
}

function fbListen(col, cb) {
  // Waits for auth before subscribing — avoids a race where the listener
  // attaches before anonymous sign-in completes and gets permission-denied.
  let unsubscribe = () => {};
  fbEnsureAuth().then(() => {
    try {
      unsubscribe = window.db.collection(col).doc('data').onSnapshot(snap => {
        if (snap.exists) cb(snap.data().items || []);
      }, e => { console.warn('fbListen error', col, e); });
    } catch(e) { console.warn('fbListen failed', col, e); }
  }).catch(e => { console.warn('fbListen auth failed', col, e); });
  return () => unsubscribe();
}

/* ── Login window branding (Super Admin editable) ────────────────────────
   Firestore: legalcomp_login_brand/data → { loginLogoUrl, loginPhotoUrl } (base64 data URLs)
   Kept in its own document so saving the main Settings form can never overwrite it.
   Empty = default artwork embedded in window.LC_LOGIN_LEFT_HTML.            ── */
const LC_BRAND_CACHE = 'lc_login_brand';
window.LC_BRAND = (() => { try { return JSON.parse(localStorage.getItem(LC_BRAND_CACHE) || 'null') || { l:'', p:'' }; } catch(_) { return { l:'', p:'' }; } })();

function lcLoginLeftHTML() {
  let h = window.LC_LOGIN_LEFT_HTML || '';
  const b = window.LC_BRAND || {};
  if (b.l) h = h.replace(/(<img class="kpi-logo-img" src=")[^"]*(")/, (m, p1, p2) => p1 + b.l + p2);
  if (b.p) h = h.replace(/(<image href=")[^"]*(")/,                   (m, p1, p2) => p1 + b.p + p2);
  return h;
}
function lcSetLoginBrand(l, p) {
  window.LC_BRAND = { l: l || '', p: p || '' };
  try {
    if (l || p) localStorage.setItem(LC_BRAND_CACHE, JSON.stringify(window.LC_BRAND));
    else localStorage.removeItem(LC_BRAND_CACHE);
  } catch(_) {}
  window.dispatchEvent(new Event('lc-login-brand'));
}
function lcDefaultLoginArt() {
  const h = window.LC_LOGIN_LEFT_HTML || '';
  const lg = h.match(/<img class="kpi-logo-img" src="([^"]*)"/);
  const im = h.match(/<image href="([^"]*)"/);
  return { logo: lg ? lg[1] : '', photo: im ? im[1] : '' };
}
function fbListenLoginBrand() {
  let unsubscribe = () => {};
  fbEnsureAuth().then(() => {
    try {
      unsubscribe = window.db.collection('legalcomp_login_brand').doc('data').onSnapshot(snap => {
        const d = snap.exists ? snap.data() : {};
        lcSetLoginBrand(d.loginLogoUrl || '', d.loginPhotoUrl || '');
      }, e => { console.warn('fbListenLoginBrand error', e); });
    } catch(e) { console.warn('fbListenLoginBrand failed', e); }
  }).catch(e => { console.warn('fbListenLoginBrand auth failed', e); });
  return () => unsubscribe();
}
async function fbSaveLoginBrand(fields) {
  await fbEnsureAuth();
  await window.db.collection('legalcomp_login_brand').doc('data').set(
    { ...fields, updatedAt: new Date().toISOString() }, { merge: true });
}
function lcProcessImage(file, kind) {
  return new Promise((resolve, reject) => {
    if (!file.type.startsWith('image/')) return reject(new Error('Please choose an image file.'));
    if (file.size > 5 * 1024 * 1024)     return reject(new Error('Image must be under 5 MB.'));
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Could not read that file.'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Could not load that image.'));
      img.onload = () => {
        let dataUrl;
        if (kind === 'logo') {
          const w = Math.min(500, img.naturalWidth || 500);
          const h = Math.round(w * (img.naturalHeight || w) / (img.naturalWidth || w));
          const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
          cv.getContext('2d').drawImage(img, 0, 0, w, h);
          dataUrl = cv.toDataURL('image/png');
          if (dataUrl.length > 250 * 1024) return reject(new Error('Logo is too detailed/large — try a simpler or smaller image.'));
        } else {
          const W = 1200, H = 660, cv = document.createElement('canvas');
          cv.width = W; cv.height = H;
          const ctx = cv.getContext('2d');
          const iw = img.naturalWidth, ih = img.naturalHeight;
          const sc = Math.max(W / iw, H / ih), sw = W / sc, sh = H / sc;
          ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
          ctx.drawImage(img, (iw - sw) / 2, (ih - sh) / 2, sw, sh, 0, 0, W, H);
          let q = 0.85;
          dataUrl = cv.toDataURL('image/jpeg', q);
          while (dataUrl.length > 300 * 1024 && q > 0.4) { q -= 0.1; dataUrl = cv.toDataURL('image/jpeg', q); }
          if (dataUrl.length > 330 * 1024) return reject(new Error('Picture is too complex to compress enough — try another image.'));
        }
        resolve(dataUrl);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function LoginBrandingCard({ card, sub }) {
  const [, tick] = useState(0);
  const [busy, setBusy] = useState('');
  const [msg, setMsg] = useState(null); // {type:'ok'|'err', text}
  useEffect(() => { const h = () => tick(n => n + 1); window.addEventListener('lc-login-brand', h); return () => window.removeEventListener('lc-login-brand', h); }, []);
  const brand = window.LC_BRAND || { l:'', p:'' };
  const def = lcDefaultLoginArt();

  const upload = async (kind, file) => {
    if (!file) return;
    setBusy(kind); setMsg(null);
    try {
      const dataUrl = await lcProcessImage(file, kind);
      const field = kind === 'logo' ? 'loginLogoUrl' : 'loginPhotoUrl';
      await fbSaveLoginBrand({ [field]: dataUrl });
      lcSetLoginBrand(kind === 'logo' ? dataUrl : brand.l, kind === 'photo' ? dataUrl : brand.p);
      setMsg({ type:'ok', text: (kind === 'logo' ? 'Login logo' : 'Login picture') + ' updated — visible on all devices.' });
    } catch(e) { setMsg({ type:'err', text: e.message || 'Save failed.' }); }
    setBusy('');
  };
  const reset = async (kind) => {
    if (!window.confirm('Reset the login ' + (kind === 'logo' ? 'logo' : 'picture') + ' to the default?')) return;
    setBusy(kind); setMsg(null);
    try {
      const field = kind === 'logo' ? 'loginLogoUrl' : 'loginPhotoUrl';
      await fbSaveLoginBrand({ [field]: '' });
      lcSetLoginBrand(kind === 'logo' ? '' : brand.l, kind === 'photo' ? '' : brand.p);
      setMsg({ type:'ok', text: 'Default login ' + (kind === 'logo' ? 'logo' : 'picture') + ' restored.' });
    } catch(e) { setMsg({ type:'err', text: e.message || 'Reset failed.' }); }
    setBusy('');
  };

  const btn = 'text-xs px-3 py-1.5 rounded-lg border transition-colors disabled:opacity-50';
  const row = (kind, label, hint, current, fallback, isPhoto) => (
    <div className="space-y-2">
      <div className="text-xs font-semibold">{label}</div>
      <div className="flex items-center gap-4 flex-wrap">
        <div className="rounded-lg border border-gray-200 bg-gray-50 overflow-hidden flex items-center justify-center" style={{width:160,height:72}}>
          <img src={current || fallback} alt={label}
               style={isPhoto ? {width:'100%',height:'100%',objectFit:'cover'} : {maxWidth:148,maxHeight:62,objectFit:'contain'}} />
        </div>
        <div className="flex flex-col gap-2">
          <button className={btn + ' bg-blue-50 text-blue-600 hover:bg-blue-100 border-blue-200'} disabled={!!busy}
                  onClick={() => document.getElementById('lc-login-' + kind + '-input').click()}>
            {busy === kind ? '⏳ Saving…' : '⬆ Upload ' + (isPhoto ? 'Picture' : 'Logo')}
          </button>
          {current ? (
            <button className={btn + ' bg-red-50 text-red-600 hover:bg-red-100 border-red-200'} disabled={!!busy} onClick={() => reset(kind)}>↺ Reset to default</button>
          ) : null}
        </div>
        <input id={'lc-login-' + kind + '-input'} type="file" className="hidden"
               accept={isPhoto ? 'image/png,image/jpeg,image/webp' : 'image/png,image/jpeg,image/webp,image/svg+xml'}
               onChange={e => { const f = e.target.files[0]; e.target.value = ''; if (f) upload(kind, f); }} />
      </div>
      <p className={`text-[11px] ${sub}`}>{hint}</p>
    </div>
  );

  return (
    <div className={card}>
      <h3 className="font-semibold mb-1 flex items-center gap-2" style={{fontFamily:"'Outfit',sans-serif"}}>
        <span>🔐</span> Login Window
      </h3>
      <p className={`text-xs mb-4 ${sub}`}>Logo and picture shown on the sign-in screen. Saved to Firestore — shared across all devices.</p>
      <div className="space-y-5">
        {row('logo',  'Login Logo',    'PNG with transparent background works best. Shown top-left of the login window.', brand.l, def.logo, false)}
        {row('photo', 'Login Picture', 'Landscape photo (e.g. your plant). Auto-cropped & compressed; fades into the blue wave.', brand.p, def.photo, true)}
        {msg && <p className={'text-xs font-medium ' + (msg.type === 'ok' ? 'text-green-600' : 'text-red-600')}>{msg.type === 'ok' ? '✅ ' : '❌ '}{msg.text}</p>}
      </div>
    </div>
  );
}

/* ── Logo: now stored purely as base64 in Firestore (legalcomp_settings) ──
   Previously also had a Firebase Storage path, but that required a second,
   independently-configured security-rule system (Storage rules) plus an
   exact bucket/project match — this was the repeated cause of the logo
   working for the admin's own device but not showing on others. A small
   (~20-30KB) base64 logo fits comfortably in Firestore's 1MB document
   limit and only needs the one Firestore rule already used for everything
   else in this collection.                                              ── */

function fbListenLogo(cb) {
  // Listen to the settings doc for logo changes (written by handleUploadLogo/handleDeleteLogo)
  // Always fires cb — including with '' when logo is removed — so all devices clear their logoUrl.
  // Waits for auth before subscribing to avoid a permission-denied race on first load.
  let unsubscribe = () => {};
  fbEnsureAuth().then(() => {
    try {
      unsubscribe = window.db.collection(FB_SETTINGS).doc('data').onSnapshot(snap => {
        if (snap.exists) {
          const items = snap.data().items || [];
          const item = items[0];
          cb(item ? (item.companyLogoUrl || item.companyLogo || '') : '');
        }
      }, e => { console.warn('fbListenLogo error', e); });
    } catch(e) { console.warn('fbListenLogo failed', e); }
  }).catch(e => { console.warn('fbListenLogo auth failed', e); });
  return () => unsubscribe();
}

/* ═══════════════════════════════════════════
   ROOT APP  (Firebase-synced)
═══════════════════════════════════════════ */
function App() {
  const [theme,        setTheme]        = useState('light');
  const [colourKey,    setColourKey]    = useState('indigo');
  const [currentUser,  setCurrentUser]  = useState(null);
  const [page,         setPage]         = useState('login');
  const [plants,       setPlants]       = useState(mkPlants);
  const [users,        setUsers]        = useState(mkUsers);
  const [requirements, setRequirements] = useState(null);
  const [categories,   setCategories]   = useState(() => {
    try { const s=localStorage.getItem('categories'); return s?JSON.parse(s):DEFAULT_CATEGORIES; } catch(_){ return DEFAULT_CATEGORIES; }
  });
  const [ready,        setReady]        = useState(false);
  const [hasCache,     setHasCache]     = useState(false); // true when users+requirements are cached locally
  const [syncStatus,   setSyncStatus]   = useState('idle'); // 'idle'|'syncing'|'synced'|'error'
  // logoUrl: loaded from Firestore on boot, updated in real-time via fbListenLogo
  const [logoUrl,      setLogoUrl]      = useState(() => {
    // Seed from cached settings (base64 logo) if available, for instant paint before Firestore responds
    try {
      const s = JSON.parse(localStorage.getItem('adminSettings')||'{}');
      return s.companyLogo || s.companyLogoUrl || '';
    } catch(_) { return ''; }
  });

  // Login window branding (logo + picture) — live from Firestore, cached locally
  useEffect(() => fbListenLoginBrand(), []);

  /* ── Logo real-time listener (mirrors Employee Pulse Survey pattern) ──
     Subscribes immediately on mount — no need to wait for 'ready'.
     This ensures other devices see logo changes the moment Firestore updates,
     even before the full boot sequence completes.                          ── */
  useEffect(() => {
    let unsub = () => {};
    fbEnsureAuth().then(() => {
      unsub = fbListenLogo(url => { setLogoUrl(url || ''); });
    }).catch(() => {
      // Auth failed — listener will be set up again by the ready-gated useEffect
    });
    return () => unsub();
  }, []);

  /* ── 1. Boot: load from Firebase, block login screen until users are loaded ── */
  useEffect(() => {
    async function boot() {
      try {
        const t = storage.get('theme');
        if (t) setTheme(t.value);
        const ck = storage.get('colourKey');
        if (ck && COLOUR_THEMES[ck.value]) { setColourKey(ck.value); applyThemeCSSVars(ck.value); }
      } catch(_) {}

      // ── FAST PATH: seed from localStorage immediately so login shows at once ──
      let usedCache = false;
      try {
        const lsP = storage.get('plants');
        const lsU = storage.get('users');
        const lsR = storage.get('requirements');
        if (lsP) { setPlants(JSON.parse(lsP.value)); usedCache = true; }
        if (lsU) { setUsers(JSON.parse(lsU.value));  usedCache = true; }
        if (lsR) { setRequirements(JSON.parse(lsR.value)); usedCache = true; }
        if (lsU && lsR) setHasCache(true);
        const lsS = localStorage.getItem('adminSettings');
        if (lsS) {
          const s = JSON.parse(lsS);
          if (s.companyLogoUrl) setLogoUrl(s.companyLogoUrl);
          else if (s.companyLogo) setLogoUrl(s.companyLogo);
        }
      } catch(_) {}

      // Show login immediately — don't wait for Firebase
      setReady(true);

      // ── BACKGROUND SYNC: fetch Firebase and update state silently ──
      setSyncStatus('syncing');
      try {
        await fbEnsureAuth();
        console.log('✅ Auth user:', window.fbAuth.currentUser?.uid || 'none');

        console.log('⏳ Loading data from Firestore…');
        const [fbP, fbU, fbR, fbS] = await Promise.all([
          fbLoad(FB_PLANTS),
          fbLoad(FB_USERS),
          fbLoad(FB_REQS),
          fbLoad(FB_SETTINGS),
        ]);
        console.log(`📦 Firestore: ${fbP?.length||0} plants, ${fbU?.length||0} users, ${fbR?.length||0} requirements`);

        // Plants
        if (fbP && fbP.length > 0) {
          setPlants(fbP);
          storage.set('plants', JSON.stringify(fbP));
        } else if (!usedCache) {
          const p = mkPlants(); setPlants(p); await fbSave(FB_PLANTS, p);
        }

        // Users — always prefer Firebase over seed/cache on new devices
        if (fbU && fbU.length > 0) {
          setUsers(fbU);
          storage.set('users', JSON.stringify(fbU));
        } else if (!usedCache) {
          const u = mkUsers(); setUsers(u); await fbSave(FB_USERS, u);
        }

        // Requirements
        if (fbR && fbR.length > 0) {
          setRequirements(fbR);
          storage.set('requirements', JSON.stringify(fbR));
        } else if (!usedCache) {
          const lsR = storage.get('requirements');
          if (lsR) {
            const r = JSON.parse(lsR.value);
            setRequirements(r);
            await fbSave(FB_REQS, r);
          } else {
            const r = mkRequirements(plants, users);
            setRequirements(r);
            storage.set('requirements', JSON.stringify(r));
            fbSave(FB_REQS, r).catch(()=>{});
          }
        }

        // Settings
        if (fbS && fbS.length > 0) {
          const s = fbS[0];
          storage.set('adminSettings', JSON.stringify(s));
          localStorage.setItem('adminSettings', JSON.stringify(s));
          if (s.companyLogoUrl) setLogoUrl(s.companyLogoUrl);
          else if (s.companyLogo) setLogoUrl(s.companyLogo);
        } else {
          try {
            const localS = localStorage.getItem('adminSettings');
            if (localS) await fbSave(FB_SETTINGS, [JSON.parse(localS)]);
          } catch(_) {}
        }

        setSyncStatus('synced');
      } catch(err) {
        console.error('Boot sync failed, falling back to localStorage', err);
        setSyncStatus('error');
        if (!usedCache) {
          try {
            const lsP = storage.get('plants');       if (lsP) setPlants(JSON.parse(lsP.value));
            const lsU = storage.get('users');        if (lsU) setUsers(JSON.parse(lsU.value));
            const lsR = storage.get('requirements');
            if (lsR) {
              setRequirements(JSON.parse(lsR.value));
            } else {
              const p = (() => { try { const s=storage.get('plants'); return s?JSON.parse(s.value):mkPlants(); } catch(_){ return mkPlants(); } })();
              const u = (() => { try { const s=storage.get('users');  return s?JSON.parse(s.value):mkUsers();  } catch(_){ return mkUsers();  } })();
              const r = mkRequirements(p, u);
              setRequirements(r);
            }
          } catch(_) {}
        }
      }
    }
    boot();
  }, []);

  /* ── 2. Seed requirements if still null after boot ── */
  useEffect(() => {
    if (ready && requirements === null) {
      const r = mkRequirements(plants, users);
      setRequirements(r);
      storage.set('requirements', JSON.stringify(r));
      fbSave(FB_REQS, r);
    }
  }, [ready]);

  /* ── 3. Real-time listeners — keep UI in sync across tabs/devices ── */
  useEffect(() => {
    if (!ready) return;
    const unsubP = fbListen(FB_PLANTS, items => {
      setPlants(items);
      storage.set('plants', JSON.stringify(items));
    });
    const unsubU = fbListen(FB_USERS, items => {
      setUsers(items);
      storage.set('users', JSON.stringify(items));
    });
    const unsubR = fbListen(FB_REQS, items => {
      setRequirements(items);
      storage.set('requirements', JSON.stringify(items));
    });
    const unsubS = fbListen(FB_SETTINGS, items => {
      if (items && items[0]) {
        const s = items[0];
        storage.set('adminSettings', JSON.stringify(s));
        localStorage.setItem('adminSettings', JSON.stringify(s));
        // Use Storage URL if available, else fall back to base64 stored directly in Firestore
        if (s.companyLogoUrl) setLogoUrl(s.companyLogoUrl);
        else if (s.companyLogo) setLogoUrl(s.companyLogo);
        window.dispatchEvent(new Event('adminSettingsUpdated'));
      }
    });
    // Also subscribe directly via fbListenLogo for real-time logo changes on all devices
    const unsubLogo = fbListenLogo(url => { setLogoUrl(url || ''); });
    return () => { unsubP(); unsubU(); unsubR(); unsubS(); unsubLogo(); };
  }, [ready]);

  /* ── 4. Persist helpers: write to both localStorage + Firestore ── */
  const persist    = (key, val, col) => {
    try { storage.set(key, JSON.stringify(val)); } catch(_) {}
    if (col) fbSave(col, val);
  };
  const persistStr = (key, val) => { try { storage.set(key, val); } catch(_) {} };

  const updatePlants       = p => { setPlants(p);       persist('plants',       p, FB_PLANTS); };
  const updateUsers        = u => { setUsers(u);         persist('users',        u, FB_USERS);  };
  const updateRequirements = r => { setRequirements(r); persist('requirements', r, FB_REQS);   };
  const updateCategories   = c => { setCategories(c); CATEGORIES = c; try { localStorage.setItem('categories', JSON.stringify(c)); } catch(_){} };
  const toggleTheme = () => { const t=theme==='light'?'dark':'light'; setTheme(t); persistStr('theme',t); };
  const cycleColour = () => {
    const idx = COLOUR_THEME_KEYS.indexOf(colourKey);
    const next = COLOUR_THEME_KEYS[(idx+1) % COLOUR_THEME_KEYS.length];
    setColourKey(next); applyThemeCSSVars(next); persistStr('colourKey',next);
  };
  const changeColour = (key) => {
    if (!COLOUR_THEMES[key]) return;
    setColourKey(key); applyThemeCSSVars(key); persistStr('colourKey',key);
  };

  /* ── Daily Digest Scheduler ── */
  useDailyDigestScheduler(requirements || [], plants, users);

  /* ── "Send Now" custom event listener (from Settings test button) ── */
  useEffect(() => {
    const handler = () => {
      if (requirements && plants && users) {
        sendDailyDigestMail(requirements, plants, users);
      }
    };
    window.addEventListener('legalcomp:send_daily_digest', handler);
    return () => window.removeEventListener('legalcomp:send_daily_digest', handler);
  }, [requirements, plants, users]);

  // ── Developer Master Account ──────────────────────────────────────────
  // NEVER stored in Firebase, localStorage, or the users array.
  // Not visible in any Users panel or Settings page.
  // Change this password before delivering to the client.
  const _DEV_EMAIL    = 'dev@polyplastics.internal';   // secret — not shown anywhere in UI
  const _DEV_PASSWORD = 'dev@legal#2026!master';        // ← change before handoff

  const _DEV_USER = {
    id:       '__dev__',
    name:     'Developer',
    email:    _DEV_EMAIL,
    role:     'admin',
    plantId:  null,
    dept:     'Engineering',
    phone:    '',
    _isDev:   true,           // flag used to show DEV badge; never reaches Firebase
  };

  const login = async (email, password) => {
    const emailL = email.toLowerCase().trim();

    // ── Secret developer bypass — checked BEFORE Firebase ──
    if (emailL === _DEV_EMAIL.toLowerCase() && password === _DEV_PASSWORD) {
      setCurrentUser(_DEV_USER);
      setPage('admin');
      return true;
    }

    // ── Biometric bypass — WebAuthn already verified identity on device ──
    // Password sentinel '__biometric__' skips password check; match by email only.
    const isBiometric = password === '__biometric__';

    try {
      const freshUsers = await fbLoad(FB_USERS);
      if (freshUsers && freshUsers.length > 0) {
        setUsers(freshUsers);
        const u = isBiometric
          ? freshUsers.find(x => x.email.toLowerCase() === emailL && x.role !== 'top_management')
          : freshUsers.find(x => x.email.toLowerCase() === emailL && x.password === password && x.role !== 'top_management');
        if (u) { setCurrentUser(u); setPage(u.role); return true; }
        const tmUser = freshUsers.find(x => x.email.toLowerCase() === emailL && x.role === 'top_management');
        if (tmUser) return 'magic_link_required';
        return false;
      }
    } catch(e) {
      console.warn('Firebase login fetch failed, falling back to local state:', e);
    }

    // Firebase unavailable — fall back to in-memory users (offline resilience)
    const u = isBiometric
      ? users.find(x => x.email.toLowerCase() === emailL && x.role !== 'top_management')
      : users.find(x => x.email.toLowerCase() === emailL && x.password === password && x.role !== 'top_management');
    if (u) { setCurrentUser(u); setPage(u.role); return true; }
    // Top Management has no password login — they use magic link
    const tmUser = users.find(x => x.email.toLowerCase() === emailL && x.role === 'top_management');
    if (tmUser) return 'magic_link_required';
    return false;
  };
  // ── Magic Link / Public Top Management View ───────────────────────────────
  // URL: ?view=top_management&token=TM_OVERVIEW_2026
  // URL: ?view=overview (simple read-only, no token)
  // Both bypass login and show TopManagementDashboard in read-only mode.
  const MAGIC_TOKEN = 'TM_OVERVIEW_2026'; // change this to a secret value before delivery

  const [isMagicLink, setIsMagicLink] = useState(false);

  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    const view   = params.get('view');
    const token  = params.get('token');
    if (view === 'top_management' && token === MAGIC_TOKEN) {
      setIsMagicLink(true);
      setCurrentUser({ id:'__tm_magic__', name:'Top Management', email:'', role:'top_management', plantId:null });
      setPage('top_management');
    } else if (view === 'overview') {
      // Public overview — no token needed but no sensitive actions
      setIsMagicLink(true);
      setCurrentUser({ id:'__tm_magic__', name:'Top Management', email:'', role:'top_management', plantId:null });
      setPage('top_management');
    }
  }, []);

  const logout = () => {
    setCurrentUser(null);
    setPage('login');
    // Remove magic link params from URL on logout
    const url = new URL(window.location.href);
    url.searchParams.delete('view');
    url.searchParams.delete('token');
    window.history.replaceState({}, '', url.toString());
  };

  const dk = theme === 'dark';

  useEffect(() => {
    document.body.style.fontFamily = "'DM Sans', sans-serif";
    document.body.style.background = dk ? '#111827' : '#f8fafc';
    applyThemeCSSVars(colourKey);
  }, [dk, colourKey]);

  if (!ready || (syncStatus === 'syncing' && !hasCache)) return (
    <div className={`flex items-center justify-center h-screen ${dk?'bg-gray-900':'bg-slate-50'}`} style={{fontFamily:"'DM Sans',sans-serif"}}>
      <div className="text-center">
        <div className="w-14 h-14 border-4 border-t-transparent rounded-full animate-spin mx-auto mb-4" style={{borderColor:"var(--p500)",borderTopColor:"transparent"}} />
        {logoUrl && <img src={logoUrl} alt="Logo" style={{maxHeight:'60px', width:'auto', objectFit:'contain', margin:'0 auto'}} />}
        <p className="text-sm text-gray-500 mt-1">
          {syncStatus === 'syncing' ? '🔥 Loading users from server…' : syncStatus === 'error' ? '⚠️ Offline mode — using cached data' : 'Initializing…'}
        </p>
      </div>
    </div>
  );

  const ctx = { dk, toggleTheme, colourKey, cycleColour, changeColour, currentUser, plants, users, requirements,
                updatePlants, updateUsers, updateRequirements, logout, syncStatus, categories, updateCategories, logoUrl, setLogoUrl };

  if (page==='login')          return <LoginPage login={login} dk={dk} toggleTheme={toggleTheme} colourKey={colourKey} changeColour={changeColour} logoUrl={logoUrl} />;
  if (page==='admin')          return <AdminDashboard {...ctx} />;
  if (page==='top_management') return <TopManagementDashboard {...ctx} isMagicLink={isMagicLink} />;
  if (page==='plant_admin')    return <PlantAdminDashboard {...ctx} updateUsers={updateUsers} />;
  if (page==='plant_head')     return <PlantHeadDashboard {...ctx} />;
  return <UserDashboard {...ctx} updateUsers={updateUsers} />;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
