/* ═══════════════════════════════════════════
   CHANGE PASSWORD — shared by User & PlantHead
═══════════════════════════════════════════ */
function ChangePasswordPage({ dk, currentUser, users, updateUsers }) {
  const [cur,    setCur]    = useState('');
  const [np,     setNp]     = useState('');
  const [cp,     setCp]     = useState('');
  const [status, setStatus] = useState(null); // { type:'success'|'error', msg }
  const [saving, setSaving] = useState(false);
  const [showCur, setShowCur] = useState(false);
  const [showNp,  setShowNp]  = useState(false);

  const card   = `rounded-2xl border shadow-sm ${dk?'bg-gray-800 border-gray-700':'bg-white border-gray-200'}`;
  const inp    = `w-full border rounded-xl px-3 py-2.5 text-sm outline-none transition-colors ${dk?'bg-gray-700 border-gray-600 text-white placeholder-gray-400 focus:border-[color:var(--p400)]':'bg-white border-gray-300 text-gray-900 placeholder-gray-400 focus:border-[color:var(--p500)]'}`;
  const sub    = dk?'text-gray-400':'text-gray-500';

  const handleSave = async () => {
    setStatus(null);
    if (!cur)      { setStatus({type:'error', msg:'Enter your current password.'}); return; }
    if (np.length < 6) { setStatus({type:'error', msg:'New password must be at least 6 characters.'}); return; }
    if (np !== cp) { setStatus({type:'error', msg:'New passwords do not match.'}); return; }

    setSaving(true);
    try {
      // Verify current password
      const ok = await _verifyPw(currentUser.password, cur, currentUser.id);
      if (!ok) { setStatus({type:'error', msg:'Current password is incorrect.'}); setSaving(false); return; }

      // Hash new password
      const hashed = await _hashPw(np, currentUser.id);
      const updatedUser = { ...currentUser, password: hashed };
      const newUsers = users.map(u => u.id === currentUser.id ? updatedUser : u);
      updateUsers(newUsers);
      setCur(''); setNp(''); setCp('');
      setStatus({type:'success', msg:'✅ Password changed successfully!'});
    } catch(e) {
      setStatus({type:'error', msg:'Error: ' + e.message});
    }
    setSaving(false);
  };

  return (
    <div className="max-w-md space-y-5">
      <div>
        <h2 className="text-xl font-bold mb-1" style={{fontFamily:"'Outfit',sans-serif"}}>🔑 Change Password</h2>
        <p className={`text-sm ${sub}`}>Update your account password. Must be at least 6 characters.</p>
      </div>
      <div className={`${card} p-6 space-y-4`}>
        <div>
          <label className={`block text-xs font-semibold uppercase tracking-wide mb-1.5 ${sub}`}>Current Password</label>
          <div className="relative">
            <input type={showCur?'text':'password'} value={cur} onChange={e=>setCur(e.target.value)}
              placeholder="••••••••" className={inp} onKeyDown={e=>e.key==='Enter'&&document.getElementById('np-inp')?.focus()} />
            <button type="button" onClick={()=>setShowCur(s=>!s)}
              className={`absolute right-3 top-1/2 -translate-y-1/2 text-xs ${sub} hover:text-gray-700`}>{showCur?'Hide':'Show'}</button>
          </div>
        </div>
        <div>
          <label className={`block text-xs font-semibold uppercase tracking-wide mb-1.5 ${sub}`}>New Password</label>
          <div className="relative">
            <input id="np-inp" type={showNp?'text':'password'} value={np} onChange={e=>setNp(e.target.value)}
              placeholder="Min 6 characters" className={inp} onKeyDown={e=>e.key==='Enter'&&document.getElementById('cp-inp')?.focus()} />
            <button type="button" onClick={()=>setShowNp(s=>!s)}
              className={`absolute right-3 top-1/2 -translate-y-1/2 text-xs ${sub} hover:text-gray-700`}>{showNp?'Hide':'Show'}</button>
          </div>
        </div>
        <div>
          <label className={`block text-xs font-semibold uppercase tracking-wide mb-1.5 ${sub}`}>Confirm New Password</label>
          <input id="cp-inp" type="password" value={cp} onChange={e=>setCp(e.target.value)}
            placeholder="Repeat new password" className={inp} onKeyDown={e=>e.key==='Enter'&&handleSave()} />
        </div>
        {status && (
          <div className={`rounded-xl px-4 py-3 text-sm font-medium ${status.type==='success'?'bg-green-50 text-green-700 border border-green-200':'bg-red-50 text-red-700 border border-red-200'}`}>
            {status.msg}
          </div>
        )}
        <button onClick={handleSave} disabled={saving}
          className="w-full py-2.5 rounded-xl text-sm font-semibold text-white t-btn transition-all"
          style={{opacity:saving?0.6:1}}>
          {saving ? '⏳ Saving…' : '🔑 Update Password'}
        </button>
      </div>
      <div className={`rounded-xl border px-4 py-3 ${dk?'border-gray-700 bg-gray-800/50':'border-gray-200 bg-gray-50'}`}>
        <p className={`text-xs font-semibold uppercase tracking-wide mb-2 ${sub}`}>🔒 Security Tips</p>
        <ul className={`text-xs space-y-1 ${sub}`}>
          <li>• Use at least 8 characters with a mix of letters, numbers and symbols</li>
          <li>• Do not share your password with anyone</li>
          <li>• Change your password periodically for security</li>
        </ul>
      </div>
    </div>
  );
}

      <div className="grid grid-cols-2 xl:grid-cols-4 gap-4">

        <StatCard dk={dk} label="Team Members"       value={teamUsers.length} icon="👥" color="bg-purple-100 text-purple-600" accent="#8b5cf6" sub="Assigned users" />
      </div>
      <div className="grid grid-cols-1 xl:grid-cols-2 gap-4">

              const assignees = assignedIds.map(id=>users.find(u=>u.id===id)).filter(Boolean);
              return (
                <div key={r.id} className={`flex items-center justify-between p-3 rounded-xl ${dk?'bg-red-900/20 border border-red-800/30':'bg-red-50 border border-red-100'}`}>
                  <div>
                    <p className="text-sm font-medium text-red-600">{r.title}</p>
                    <p className={`text-xs ${sub}`}>Assigned: {assignees.length>0?assignees.map(a=>a.name).join(', '):'Unassigned'} · Due: {formatDate(r.dueDate)}</p>
                  </div>
                  <Badge label={`L${r.escalationLevel}`} color="#8b5cf6" />
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );

  const PHRequirements = () => {
    const [filter, setFilter] = useState('');
    const filtered = myReqs.filter(r=>!filter||r.status===filter);
    return (
      <div className="space-y-4">
        <div className={`${card} p-4 flex gap-3`}>
          <select value={filter} onChange={e=>setFilter(e.target.value)} className={`${selectCls} w-40`}>
            <option value="">All Status</option>
            {STATUSES.map(s=><option key={s}>{s}</option>)}
          </select>
          <p className={`text-xs self-center ${sub}`}>{filtered.length} requirements</p>
        </div>
        <div className={`${card} overflow-hidden`}>
          <table className="w-full text-sm">
            <thead className={`text-xs uppercase tracking-wide font-semibold ${dk?'bg-gray-700/60 text-gray-400':'bg-gray-50 text-gray-500'}`}>
              <tr>{['Title','Category','Assigned To','Priority','Status','Due Date'].map(h=><th key={h} className="text-left px-4 py-3">{h}</th>)}</tr>
            </thead>
            <tbody className={`divide-y ${dk?'divide-gray-700':'divide-gray-100'}`}>
              {filtered.map(r=>{
                const assignedIds = Array.isArray(r.assignedTo) ? r.assignedTo : (r.assignedTo ? [r.assignedTo] : []);
                const assignees = assignedIds.map(id=>users.find(u=>u.id===id)).filter(Boolean);
                const dl=daysLeft(r.dueDate);
                return (
                  <tr key={r.id} onClick={()=>setSelPHReq(r)}
                    className={`cursor-pointer ${dk?'hover:bg-gray-700/40':'hover:bg-gray-50/80'} transition-colors`}>
                    <td className="px-4 py-3 font-medium max-w-[220px] truncate">{r.title}</td>
                    <td className={`px-4 py-3 text-xs ${sub}`}>{r.category}</td>
                    <td className="px-4 py-3 text-xs">{assignees.length>0?<div className="flex items-center gap-1 flex-wrap">{assignees.slice(0,3).map(a=><div key={a.id} className="flex items-center gap-1" title={a.name}><div className="w-5 h-5 rounded-full flex items-center justify-center text-white text-xs" style={{background:"var(--p600)"}}>{initials(a.name)}</div>{assignees.length===1&&<span>{a.name}</span>}</div>)}{assignees.length>3&&<span className={sub}>+{assignees.length-3}</span>}{assignees.length>1&&<span className={sub}>{assignees.length} users</span>}</div>:<span className="text-red-400">Unassigned</span>}</td>
                    <td className="px-4 py-3"><Badge label={r.priority} color={PRIORITY_CLR[r.priority]} /></td>
                    <td className="px-4 py-3"><Badge label={r.status}   color={STATUS_CLR[r.status]}   /></td>
                    <td className={`px-4 py-3 text-xs ${dl<0?'text-red-500':dl<7?'text-amber-500':sub}`}>{formatDate(r.dueDate)}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
    );
  };

  const Team = () => (
    <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
      {teamUsers.map(u=>{
        const assigned  = myReqs.filter(r=>(Array.isArray(r.assignedTo)?r.assignedTo:(r.assignedTo?[r.assignedTo]:[])).includes(u.id)).length;
        const done      = myReqs.filter(r=>(Array.isArray(r.assignedTo)?r.assignedTo:(r.assignedTo?[r.assignedTo]:[])).includes(u.id)&&r.status==='Completed').length;
        return (
          <div key={u.id} className={`${card} p-5`}>
            <div className="flex items-center gap-3 mb-4">
              <div className="w-11 h-11 rounded-xl flex items-center justify-center text-white font-bold" style={{background:"var(--p600)"}}>{initials(u.name)}</div>
              <div><p className="font-semibold text-sm">{u.name}</p><p className={`text-xs ${sub}`}>{u.dept}</p></div>
            </div>
            <div className="space-y-2 text-xs">
              <div className="flex justify-between"><span className={sub}>Assigned</span><span className="font-semibold">{assigned}</span></div>
              <div className="flex justify-between"><span className={sub}>Completed</span><span className="font-semibold text-green-500">{done}</span></div>
              <div className="flex justify-between"><span className={sub}>Compliance</span><span className="font-semibold">{assigned?Math.round(done/assigned*100):0}%</span></div>
              <div className={`h-1.5 rounded-full ${dk?'bg-gray-700':'bg-gray-100'} mt-2`}>
                <div className="h-full rounded-full transition-all" style={{background:"var(--p500)"}} style={{width:`${assigned?Math.round(done/assigned*100):0}%`}} />
              </div>
            </div>
            <p className={`text-xs mt-3 ${sub}`}>📧 {u.email}</p>
          </div>
        );
      })}
    </div>
  );

  const pages = { overview:<Overview/>, requirements:<PHRequirements/>, team:<Team/>, changepassword:<ChangePasswordPage dk={dk} currentUser={currentUser} users={users} updateUsers={updateUsers}/> };

  // Requirement detail modal for Plant Head (view only)
  const PHModal = () => {
    if (!selPHReq) return null;
    const plant = plants.find(p=>p.id===selPHReq.plantId);
    const assignedIds = Array.isArray(selPHReq.assignedTo) ? selPHReq.assignedTo : (selPHReq.assignedTo ? [selPHReq.assignedTo] : []);
    const assignees = assignedIds.map(id=>users.find(u=>u.id===id)).filter(Boolean);
    const dl = daysLeft(selPHReq.dueDate);
    const sub2 = dk?'text-gray-400':'text-gray-500';
    return (
      <Modal open={!!selPHReq} onClose={()=>setSelPHReq(null)} title={selPHReq.title} wide dk={dk}>
        <div className="space-y-4 text-sm">
          <div className="flex flex-wrap gap-2">
            <Badge label={selPHReq.status}   color={STATUS_CLR[selPHReq.status]} />
            <Badge label={selPHReq.priority} color={PRIORITY_CLR[selPHReq.priority]} />
            <Badge label={selPHReq.category} color="#6366f1" />
            <Badge label={`L${selPHReq.escalationLevel} Escalation`} color="#8b5cf6" />
          </div>
          <p className={`leading-relaxed ${dk?'text-gray-200':'text-gray-700'}`}>{selPHReq.description}</p>
          <div className="grid grid-cols-2 gap-3">
            {[['📅 Due Date',formatDate(selPHReq.dueDate)],['⌛ Days Left',dl<0?`${Math.abs(dl)}d overdue`:dl===0?'Today':`${dl}d`],['🔔 Reminder',selPHReq.reminderFrequency],['🏭 Plant',plant?.name||'—'],['📍 State',plant?.state||'—'],['👤 Assigned To',assignees.length>0?assignees.map(a=>a.name).join(', '):'Unassigned']].map(([l,v])=>(
              <div key={l} className={`p-3 rounded-xl ${dk?'bg-gray-700':'bg-gray-50'}`}>
                <p className={`text-xs mb-0.5 ${sub2}`}>{l}</p>
                <p className={`font-medium text-xs ${dk?'text-gray-100':'text-gray-800'}`}>{v}</p>
              </div>
            ))}
          </div>
          {(selPHReq.applicableRule||selPHReq.legalClause) && (
            <div className={`rounded-xl border p-4 space-y-2 ${dk?'border-gray-700':'border-gray-200'}`}>
              <p className="text-xs font-bold uppercase tracking-widest text-[color:var(--p500)]">⚖️ Legal &amp; Regulatory</p>
              {selPHReq.applicableRule && <><p className={`text-xs font-semibold ${dk?'text-[color:var(--p300)]':'text-[color:var(--p600)]'}`}>Applicable Rule</p><p className={`text-sm ${dk?'text-white':'text-gray-800'}`}>{selPHReq.applicableRule}</p></>}
              {selPHReq.legalClause && <><p className={`text-xs font-semibold ${dk?'text-[color:var(--p300)]':'text-[color:var(--p600)]'}`}>Legal Clause</p><p className={`text-sm leading-relaxed ${dk?'text-gray-200':'text-gray-700'}`}>{selPHReq.legalClause}</p></>}
            </div>
          )}
          {selPHReq.evidence?.length > 0 && (
            <div>
              <p className={`font-semibold mb-2 text-xs uppercase tracking-wide ${sub2}`}>📎 Evidence ({selPHReq.evidence.length})</p>
              {selPHReq.evidence.map(e=>(
                <div key={e.id} className={`flex items-center gap-3 p-3 rounded-xl mb-2 ${dk?'bg-gray-700':'bg-gray-50'}`}>
                  <span className="text-xl">{(e.mimeType||'').startsWith('image/')?'🖼️':e.name?.toLowerCase().endsWith('.pdf')?'📑':'📄'}</span>
                  <div className="flex-1 min-w-0"><p className={`text-sm font-medium truncate ${dk?'text-gray-100':'text-gray-800'}`}>{e.name}</p><p className={`text-xs ${sub2}`}>{e.size} · {formatDate(e.uploadedAt)}</p></div>
                  <button onClick={()=>{ const url=e.storageUrl||e.dataUrl; if(url) window.open(url,'_blank'); }}
                    className="px-3 py-1.5 rounded-lg text-xs font-semibold text-white transition-colors flex-shrink-0" style={{background:"var(--p600)"}}>⬇️</button>
                </div>
              ))}
            </div>
          )}
          {selPHReq.comments?.length > 0 && (
            <div>
              <p className={`font-semibold mb-2 text-xs uppercase tracking-wide ${sub2}`}>💬 Comments ({selPHReq.comments.length})</p>
              {selPHReq.comments.map(c=>{ const u=users.find(x=>x.id===c.userId); return (
                <div key={c.id} className={`p-3 rounded-xl mb-2 ${dk?'bg-gray-700':'bg-gray-50'}`}>
                  <div className="flex items-center gap-2 mb-1">
                    <div className="w-5 h-5 rounded-full flex items-center justify-center text-white text-xs" style={{background:"var(--p600)"}}>{initials(u?.name||'?')}</div>
                    <span className="text-xs font-medium">{u?.name||'Unknown'}</span>
                    <span className={`text-xs ${sub2}`}>{formatDate(c.createdAt)}</span>
                  </div>
                  <p className={`text-xs ${sub2}`}>{c.text}</p>
                </div>
              );})}
            </div>
          )}
        </div>
      </Modal>
    );
  };

  return (
    <AppShell dk={dk} toggleTheme={toggleTheme} colourKey={colourKey} cycleColour={cycleColour} changeColour={changeColour} currentUser={currentUser} nav={nav}
      activePage={activePage} setActivePage={setActivePage} role="plant_head" logout={logout}
      requirements={requirements} onNotifClick={handleNotifClick} logoUrl={logoUrl} plants={plants}>
      <PHModal />
      {pages[activePage]}
    </AppShell>
  );
}

/* ─── UserTaskModal: defined at module level so React never remounts it ─── */
function UserTaskModal({ selReq, setSelReq, dk, users, requirements, updateRequirements,
    currentUser, myPlant, uploading, evidenceSent, fileRef, uploadEvidence, deleteEvidence,
    downloadEvidence, updateStatus, sub, setPendingComment,
    setSendConfirmReqId, setShowSendModal }) {
  const [comment, setComment] = useState('');
  const commentRef = useRef();
  const addComment = (reqId) => {
    if (!comment.trim()) return;
    const c = { id:`c${Date.now()}`, text:comment, userId:currentUser.id, createdAt:new Date().toISOString() };
    const updated = requirements.map(r=>r.id===reqId?{...r,comments:[...(r.comments||[]),c]}:r);
    updateRequirements(updated);
    setSelReq(sr=>({...sr,comments:[...(sr.comments||[]),c]}));
    setComment('');
  };
  return (
    <Modal open={!!selReq} onClose={()=>setSelReq(null)} title={selReq?.title} wide dk={dk}>
      {selReq && (
        <div className="space-y-4 text-sm">
          <div className="flex flex-wrap gap-2">
            <Badge label={selReq.status}   color={STATUS_CLR[selReq.status]}  />
            <Badge label={selReq.priority}  color={PRIORITY_CLR[selReq.priority]} />
            <Badge label={selReq.category}  color="#6366f1" />
            <Badge label={`L${selReq.escalationLevel} Escalation`} color="#8b5cf6" />
          </div>
          <p className={`leading-relaxed ${dk?'text-gray-200':'text-gray-700'}`}>{selReq.description}</p>
          <div className="grid grid-cols-2 gap-3">
            {[['📅 Due Date',formatDate(selReq.dueDate)],['🔔 Reminder',selReq.reminderFrequency],['🏭 Plant',myPlant?.name||'—'],['📧 Escalation',selReq.escalationEmail||'—']].map(([l,v])=>(
              <div key={l} className={`p-3 rounded-xl ${dk?'bg-gray-700':'bg-gray-50'}`}>
                <p className={`text-xs mb-0.5 ${dk?'text-gray-400':'text-gray-500'}`}>{l}</p>
                <p className={`font-medium text-xs ${dk?'text-gray-100':'text-gray-800'}`}>{v}</p>
              </div>
            ))}
          </div>

          <div>
            <p className={`font-semibold mb-2 text-xs uppercase tracking-wide ${dk?'text-gray-300':'text-gray-500'}`}>Update Status</p>
            <div className="flex flex-wrap gap-2">
              {STATUSES.map(s=>(
                <button key={s} onClick={()=>updateStatus(selReq.id,s)}
                  className={`px-3 py-1.5 rounded-xl text-xs font-medium border-2 transition-all ${selReq.status===s?'border-transparent text-white':dk?'border-gray-600':'border-gray-200'}`}
                  style={selReq.status===s?{background:STATUS_CLR[s]}:{color:STATUS_CLR[s]}}>
                  {s}
                </button>
              ))}
            </div>
            {(selReq.status==='In Progress'||selReq.status==='Completed') && (
              <div className={`mt-3 flex items-start gap-2.5 p-3 rounded-xl border ${dk?'bg-gray-700/30 border-gray-600/50':'bg-gray-50 border-gray-100'}`}>
                <span className="text-lg mt-0.5">📎</span>
                <div className="flex-1">
                  <p className={`text-xs font-semibold mb-0.5 ${dk?'text-[color:var(--p300)]':'text-[color:var(--p700)]'}`}>
                    {selReq.status==='Completed' ? 'Completion evidence required' : 'Progress evidence recommended'}
                  </p>
                  <p className={`text-xs ${dk?'text-[color:var(--p400)]':'text-[color:var(--p500)]'}`}>
                    {selReq.status==='Completed'
                      ? 'Please attach supporting documents (certificates, reports, approvals) to confirm completion.'
                      : 'Attach any interim documents, work orders, or proof of progress below.'}
                  </p>
                  <button onClick={()=>fileRef.current.click()} disabled={uploading}
                    className={`mt-2 px-4 py-1.5 rounded-lg text-xs font-semibold transition-colors text-white disabled:opacity-50`} style={{background:'var(--p600)'}}>
                    {uploading ? '⏳ Uploading…' : '📂 Attach Evidence'}
                  </button>
                </div>
              </div>
            )}
          </div>

          <div>
            <p className={`font-semibold mb-2 text-xs uppercase tracking-wide ${dk?'text-gray-300':'text-gray-500'}`}>📎 Evidence / Documents</p>
            {(selReq.evidence||[]).length === 0 && (
              <p className={`text-xs mb-2 ${dk?'text-gray-500':'text-gray-400'}`}>No evidence attached yet.</p>
            )}
            {(selReq.evidence||[]).map(e=>{
              const fileUrl = e.storageUrl || e.dataUrl;
              const isImage = fileUrl && (e.mimeType||'').startsWith('image/');
              const isPdf   = fileUrl && (e.mimeType==='application/pdf' || e.name.toLowerCase().endsWith('.pdf'));
              const canPreview = isImage || isPdf;
              const fileIcon = isImage ? '🖼️' : isPdf ? '📑' : '📄';
              return (
                <div key={e.id} className={`mb-2 rounded-xl overflow-hidden border ${dk?'border-gray-600 bg-gray-700':'border-gray-200 bg-gray-50'}`}>
                  <div className="flex items-center gap-3 p-3">
                    <span className="text-xl flex-shrink-0">{fileIcon}</span>
                    <div className="flex-1 min-w-0">
                      <p className={`text-sm font-medium truncate ${dk?'text-gray-100':'text-gray-800'}`}>{e.name}</p>
                      <p className={`text-xs ${dk?'text-gray-400':'text-gray-500'}`}>{e.size} · {formatDate(e.uploadedAt)}</p>
                    </div>
                    <div className="flex items-center gap-1.5 flex-shrink-0">
                      {canPreview && (
                        <button onClick={()=>{ window.open(fileUrl, '_blank'); }}
                          className={`flex items-center gap-1 px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors ${dk?'bg-gray-600 hover:bg-gray-500 text-gray-100':'bg-gray-200 hover:bg-gray-300 text-gray-700'}`}
                          title={`View ${e.name}`}>
                          👁️ View
                        </button>
                      )}
                      <button onClick={()=>downloadEvidence(e)}
                        className="flex items-center gap-1 px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors text-white" style={{background:"var(--p600)"}}
                        title={`Download ${e.name}`}>
                        ⬇️ Download
                      </button>
                      <button onClick={()=>deleteEvidence(selReq.id, e.id)}
                        className={`flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-semibold transition-colors ${dk?'bg-red-900/40 hover:bg-red-800/60 text-red-400':'bg-red-50 hover:bg-red-100 text-red-500'}`}
                        title={`Delete ${e.name}`}>
                        🗑️
                      </button>
                    </div>
                  </div>
                  {isImage && fileUrl && (
                    <div className={`px-3 pb-3`}>
                      <img src={fileUrl} alt={e.name} className="w-full max-h-48 object-contain rounded-lg border" style={{background: dk?'#111827':'#f9fafb'}} />
                    </div>
                  )}
                </div>
              );
            })}
            <input type="file" ref={fileRef} className="hidden" onChange={e=>{ if(e.target.files[0]) uploadEvidence(selReq.id,e.target.files[0]); e.target.value=''; }} />
            {evidenceSent ? (
              <div className="w-full py-3 rounded-xl flex items-center justify-center gap-2 bg-green-500 text-white text-sm font-semibold">
                ✅ File attached! Click Send to submit.
              </div>
            ) : (
              <button onClick={()=>fileRef.current.click()} disabled={uploading}
                className={`w-full py-2.5 rounded-xl border-2 border-dashed text-xs font-medium transition-colors ${dk?'border-gray-600 text-gray-300 hover:border-[color:var(--p400)] hover:text-[color:var(--p400)]':'border-gray-200 text-gray-500 hover:border-[color:var(--p400)] hover:text-[color:var(--p600)]'}`}>
                {uploading?'Uploading…':'📎 Click to Attach Evidence'}
              </button>
            )}
          </div>

          <div>
            <p className={`font-semibold mb-2 text-xs uppercase tracking-wide ${dk?'text-gray-300':'text-gray-500'}`}>💬 Comments</p>
            {(selReq.comments||[]).map(c=>{
              const u=users.find(x=>x.id===c.userId);
              return (
                <div key={c.id} className={`p-3 rounded-xl mb-2 ${dk?'bg-gray-700':'bg-gray-50'}`}>
                  <div className="flex items-center gap-2 mb-1">
                    <div className="w-5 h-5 rounded-full flex items-center justify-center text-white text-xs" style={{background:"var(--p600)"}}>{initials(u?.name||'?')}</div>
                    <span className="text-xs font-medium">{u?.name||'Unknown'}</span>
                    <span className={`text-xs ${sub}`}>{formatDate(c.createdAt)}</span>
                  </div>
                  <p className={`text-xs ${sub}`}>{c.text}</p>
                </div>
              );
            })}
            <div className="flex gap-2">
              <textarea ref={commentRef} value={comment} onChange={e=>setComment(e.target.value)} placeholder="Add a comment…" rows={1}
                onKeyDown={e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); if((selReq.evidence||[]).length>0){setPendingComment(comment);setSendConfirmReqId(selReq.id);setShowSendModal(true);}else{addComment(selReq.id);} }}}
                className={`${inputCls} flex-1 text-xs resize-none`} />
              <button onClick={()=>{ if((selReq.evidence||[]).length>0){setPendingComment(comment);setSendConfirmReqId(selReq.id);setShowSendModal(true);}else{addComment(selReq.id); setSelReq(null);} }} className="px-4 py-2 text-white rounded-xl text-xs font-medium transition-colors" style={{background:"var(--p600)"}}>Send</button>
            </div>
          </div>
        </div>
      )}
    </Modal>
  );
}

/* ─── UserSendConfirmModal: defined at module level ─── */
function UserSendConfirmModal({ showSendModal, sendConfirmReqId, requirements, dk, currentUser,
    updateRequirements, setSelReq, setPendingComment, setShowSendModal, setSendConfirmReqId,
    deleteEvidence, pendingComment, sub }) {
  // Hook must come BEFORE any early return (Rules of Hooks)
  const [delConfirmId, setDelConfirmId] = useState(null);
  const req = requirements ? requirements.find(r => r.id === sendConfirmReqId) : null;
  if (!showSendModal || !req) return null;
  const evList = req.evidence || [];
  const confirmSend = () => {
    if (pendingComment && pendingComment.trim()) {
      const c = { id:`c${Date.now()}`, text:pendingComment, userId:currentUser.id, createdAt:new Date().toISOString() };
      const updated = requirements.map(r=>r.id===sendConfirmReqId?{...r,comments:[...(r.comments||[]),c]}:r);
      updateRequirements(updated);
      setSelReq(sr=>sr?{...sr,comments:[...(sr.comments||[]),c]}:sr);
      setPendingComment('');
    }
    setShowSendModal(false);
    setSendConfirmReqId(null);
    setSelReq(null);
  };
  const cancelSend = () => { setShowSendModal(false); setSendConfirmReqId(null); };
  return (
      <div className="fixed inset-0 z-[70] flex items-center justify-center p-4" style={{backdropFilter:'blur(6px)',background:'rgba(0,0,0,0.6)'}}>
        <div className={`rounded-2xl shadow-2xl w-full max-w-md flex flex-col ${dk?'bg-gray-800':'bg-white'}`}>
          {/* Header */}
          <div className={`flex items-center justify-between px-6 py-4 border-b ${dk?'border-gray-700':'border-gray-100'}`}>
            <div className="flex items-center gap-2">
              <span className="text-xl">📤</span>
              <h2 className={`font-semibold text-base ${dk?'text-white':'text-gray-900'}`}>Confirm Submission</h2>
            </div>
            <button onClick={cancelSend} className={`w-8 h-8 flex items-center justify-center rounded-full transition-colors ${dk?'hover:bg-gray-700 text-gray-400':'hover:bg-gray-100 text-gray-400'}`}>✕</button>
          </div>

          <div className="px-6 py-5 space-y-4">
            {/* Evidence preview */}
            <div>
              <p className={`text-xs font-semibold uppercase tracking-wide mb-2 ${dk?'text-gray-400':'text-gray-500'}`}>📎 Attached Evidence ({evList.length})</p>
              {evList.length === 0 ? (
                <p className={`text-xs ${dk?'text-gray-500':'text-gray-400'}`}>No evidence attached.</p>
              ) : (
                <div className="space-y-2">
                  {evList.map(ev => {
                    const fileIcon = (ev.mimeType||'').startsWith('image/') ? '🖼️' : ev.name?.toLowerCase().endsWith('.pdf') ? '📑' : '📄';
                    return (
                      <div key={ev.id} className={`flex items-center gap-3 p-3 rounded-xl ${dk?'bg-gray-700':'bg-gray-50'}`}>
                        <span className="text-xl flex-shrink-0">{fileIcon}</span>
                        <div className="flex-1 min-w-0">
                          <p className={`text-sm font-medium truncate ${dk?'text-gray-100':'text-gray-800'}`}>{ev.name}</p>
                          <p className={`text-xs ${dk?'text-gray-400':'text-gray-500'}`}>{ev.size} · {formatDate(ev.uploadedAt)}</p>
                        </div>
                        {delConfirmId === ev.id ? (
                          <div className="flex items-center gap-1 flex-shrink-0">
                            <span className={`text-xs mr-1 ${dk?'text-gray-300':'text-gray-600'}`}>Remove?</span>
                            <button onClick={()=>{ deleteEvidence(sendConfirmReqId, ev.id); setDelConfirmId(null); }}
                              className="px-2 py-1 rounded-lg text-xs font-semibold bg-red-500 hover:bg-red-600 text-white transition-colors">Yes</button>
                            <button onClick={()=>setDelConfirmId(null)}
                              className={`px-2 py-1 rounded-lg text-xs font-medium border transition-colors ${dk?'border-gray-600 text-gray-300 hover:bg-gray-600':'border-gray-200 text-gray-600 hover:bg-gray-100'}`}>No</button>
                          </div>
                        ) : (
                          <button onClick={()=>setDelConfirmId(ev.id)}
                            className={`flex-shrink-0 px-2.5 py-1.5 rounded-lg text-xs font-semibold transition-colors ${dk?'bg-red-900/40 hover:bg-red-800/60 text-red-400':'bg-red-50 hover:bg-red-100 text-red-500'}`}
                            title="Remove this evidence">
                            🗑️ Remove
                          </button>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}
            </div>

            {/* Comment preview */}
            {pendingComment.trim() && (
              <div>
                <p className={`text-xs font-semibold uppercase tracking-wide mb-1.5 ${dk?'text-gray-400':'text-gray-500'}`}>💬 Comment</p>
                <div className={`p-3 rounded-xl text-sm ${dk?'bg-gray-700 text-gray-200':'bg-gray-50 text-gray-700'}`}>{pendingComment}</div>
              </div>
            )}

            <div className={`p-3 rounded-xl text-xs flex items-center gap-2 ${dk?'bg-gray-700/30 border border-gray-600/40 text-gray-300':'bg-gray-50 border border-gray-100 text-gray-600'}`}>
              <span>ℹ️</span>
              <span>Review your evidence above. Remove any wrong files before confirming.</span>
            </div>
          </div>

          {/* Footer */}
          <div className={`px-6 pb-5 flex gap-3`}>
            <button onClick={cancelSend}
              className={`flex-1 py-2.5 rounded-xl border text-sm font-medium transition-colors ${dk?'border-gray-600 text-gray-300 hover:bg-gray-700':'border-gray-200 text-gray-700 hover:bg-gray-50'}`}>
              ← Go Back
            </button>
            <button onClick={confirmSend}
              className="flex-1 py-2.5 rounded-xl text-white text-sm font-semibold transition-colors" style={{background:"var(--p600)"}}>
              ✅ Confirm & Send
            </button>
          </div>
        </div>
      </div>
    );
}

function UserDashboard({ dk, toggleTheme, colourKey, cycleColour, changeColour, currentUser, plants, users, requirements, updateRequirements, logout, logoUrl, updateUsers }) {
  const [activePage, setActivePage] = useState('tasks');
  const [notifReqId, setNotifReqId] = React.useState(null);
  const myReqs    = requirements.filter(r=>(Array.isArray(r.assignedTo)?r.assignedTo:(r.assignedTo?[r.assignedTo]:[])).includes(currentUser.id));
  const myPlant   = plants.find(p=>p.id===currentUser.plantId);
  const overdueCount = myReqs.filter(r=>r.status==='Overdue').length;

  // Notification click: switch to tasks tab and open the requirement modal
  const handleNotifClick = (reqId) => {
    setActivePage('tasks');
    setNotifReqId(reqId);
  };

  const nav = [
    { id:'tasks',          icon:'📋', label:'My Tasks', badge:overdueCount },
    { id:'profile',        icon:'👤', label:'Profile' },

  const card = `rounded-2xl border shadow-sm ${dk?'bg-gray-800 border-gray-700':'bg-white border-gray-200'}`;

  const updateStatus = (id, status) => {
    const req = requirements.find(r => r.id === id);

    if (selReq?.id===id) setSelReq(sr=>({...sr,status}));
    // ── Email: status change ──
    if (req && req.status !== status) {
      const plant    = plants.find(p => p.id === req.plantId);
      const assignedIds = Array.isArray(req.assignedTo) ? req.assignedTo : (req.assignedTo ? [req.assignedTo] : []);
      const assignee = users.find(u => assignedIds.includes(u.id) && u.id === currentUser.id) || users.find(u=>assignedIds.includes(u.id));
      sendComplianceMail({ trigger:'status_change', req:{...req,status}, plant, assignee, oldStatus:req.status, changedBy:currentUser });
    }
  };



  const uploadEvidence = async (reqId, file) => {
    setUploading(true);
    try {
      const evId = `ev${Date.now()}`;
      let storageUrl = null;
      let dataUrl = null;

      // Try Firebase Storage first (cross-device visibility)
      if (window.fbStorage) {
        try {
          await fbEnsureAuth();
          const path = `evidence/${reqId}/${evId}_${file.name}`;
          const ref = window.fbStorage.ref(path);
          await ref.put(file);
          storageUrl = await ref.getDownloadURL();
          console.log('✅ Uploaded to Firebase Storage:', storageUrl);
        } catch(storageErr) {
          console.warn('Firebase Storage upload failed, falling back to base64:', storageErr.message);
        }
      }

      // Fallback: base64 dataUrl (same-device only)
      if (!storageUrl) {
        dataUrl = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = e => resolve(e.target.result);
          reader.onerror = () => reject(new Error('Read failed'));
          reader.readAsDataURL(file);
        });
      }

      const ev = {
        id: evId,
        name: file.name,
        size: `${(file.size/1024).toFixed(1)} KB`,
        uploadedAt: new Date().toISOString(),
        uploadedBy: currentUser.id,
        mimeType: file.type,
        storageUrl,   // cross-device URL from Firebase Storage
        dataUrl,      // fallback base64 (null if storageUrl succeeded)
      };

      const updated = requirements.map(r => r.id===reqId ? {...r, evidence:[...(r.evidence||[]), ev]} : r);
      updateRequirements(updated);
      setSelReq(sr => ({...sr, evidence:[...(sr.evidence||[]), ev]}));
      // ── Show brief "attached" banner but keep modal open ──
      // Modal only closes when the user clicks Send
      setEvidenceSent(true);
      setTimeout(() => setEvidenceSent(false), 2200);
    } catch(err) {
      console.error('uploadEvidence failed:', err);
      alert('Upload failed: ' + err.message);
    }
    setUploading(false);
  };

  const deleteEvidence = async (reqId, evId) => {
    const req = requirements.find(r => r.id === reqId);
    const ev  = req?.evidence?.find(e => e.id === evId);
    if (!ev) return;

    // 1. Delete file from Firebase Storage (cross-device files)
    if (ev.storageUrl && window.fbStorage) {
      try {
        await fbEnsureAuth();
        const path = `evidence/${reqId}/${evId}_${ev.name}`;
        await window.fbStorage.ref(path).delete();
        console.log('🗑️ Deleted from Firebase Storage:', path);
      } catch(e) {
        // File may already be gone or path mismatch — log but continue
        console.warn('Storage delete failed (may already be removed):', e.message);
        // Try alternate path in case name was sanitised differently
        try {
          const altPath = `evidence/${reqId}/${evId}`;
          await window.fbStorage.ref(altPath).delete();
          console.log('🗑️ Deleted from Firebase Storage (alt path):', altPath);
        } catch(_) {}
      }
    } else if (!ev.storageUrl) {
      // base64-only file — lives only in Firestore document, no Storage entry to delete
      console.log('ℹ️ Evidence was base64-only, no Firebase Storage entry to delete.');
    }

    // 2. Remove evidence entry from Firestore (via updateRequirements → fbSave)
    const updated = requirements.map(r =>
      r.id === reqId ? { ...r, evidence: (r.evidence || []).filter(e => e.id !== evId) } : r
    );
    updateRequirements(updated);  // persists to localStorage + Firestore document
    setSelReq(sr => sr ? { ...sr, evidence: (sr.evidence || []).filter(e => e.id !== evId) } : sr);
    console.log('✅ Evidence entry removed from Firestore document (reqId:', reqId, ', evId:', evId, ')');
  };

  const downloadEvidence = (ev) => {
    const url = ev.storageUrl || ev.dataUrl;
    if (!url) {
      alert('File not available. Please re-upload.');
      return;
    }
    // storageUrl: open in new tab (cross-origin download)
    if (ev.storageUrl) {
      window.open(ev.storageUrl, '_blank');
      return;
    }
    // dataUrl fallback: direct download
    const a = document.createElement('a');
    a.href = ev.dataUrl;
    a.download = ev.name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  };

  const Tasks = () => {
    const statusPie = STATUSES.map(s=>({ name:s, value:myReqs.filter(r=>r.status===s).length }));
    const total=myReqs.length, done=myReqs.filter(r=>r.status==='Completed').length;
    return (
      <div className="space-y-5">

          <StatCard dk={dk} label="Completed"   value={done}  icon="✅" color="bg-green-100 text-green-600" accent="#22c55e" sub={`${total?Math.round(done/total*100):0}% done`} />
          <StatCard dk={dk} label="Pending"     value={myReqs.filter(r=>r.status==='Pending').length}     icon="⏳" color="bg-amber-100 text-amber-600" accent="#f59e0b" />
          <StatCard dk={dk} label="Overdue"     value={myReqs.filter(r=>r.status==='Overdue').length}     icon="🚨" color="bg-red-100 text-red-600" accent="#ef4444" sub="Action needed" />
        </div>

        <div className="grid grid-cols-1 gap-3">
          {myReqs.length === 0 && (
            <div className={`${card} p-10 text-center`}>
              <p className="text-4xl mb-3">🎉</p>
              <p className="font-semibold text-gray-500">No tasks assigned to you yet</p>
            </div>
          )}
          {myReqs.map(req => {
            const dl = daysLeft(req.dueDate);
            return (
              <div key={req.id} className={`${card} p-4 cursor-pointer hover:shadow-md transition-shadow`} onClick={()=>setSelReq(req)}>
                <div className="flex items-start gap-4">
                  <div className="w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0 text-lg" style={{background:STATUS_CLR[req.status]+'22'}}>
                    {req.status==='Completed'?'✅':req.status==='Overdue'?'🚨':req.status==='In Progress'?'⏳':'📋'}
                  </div>
                  <div className="flex-1 min-w-0">
                    <div className="flex items-start justify-between gap-2">
                      <p className="font-semibold text-sm truncate">{req.title}</p>
                      <Badge label={req.status} color={STATUS_CLR[req.status]} />
                    </div>
                    <p className={`text-xs ${sub} mt-0.5 truncate`}>{req.description}</p>
                    <div className="flex flex-wrap items-center gap-2 mt-2">
                      <Badge label={req.priority} color={PRIORITY_CLR[req.priority]} />
                      <Badge label={req.category}  color="#6366f1" />
                      <span className={`text-xs ${dl<0?'text-red-500':dl<7?'text-amber-500':sub}`}>📅 {formatDate(req.dueDate)} {dl<0?`(${Math.abs(dl)}d overdue)`:dl<7?`(${dl}d left)`:''}</span>
                      {(req.evidence||[]).length>0 && <span className={`text-xs ${sub}`}>📎 {req.evidence.length}</span>}
                      {(req.comments||[]).length>0 && <span className={`text-xs ${sub}`}>💬 {req.comments.length}</span>}
                    </div>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      </div>
    );
  };


  const Profile = () => (
    <div className="max-w-lg space-y-4">
      <div className={`${card} p-6 text-center`}>
        <div className="w-20 h-20 rounded-2xl flex items-center justify-center text-white text-2xl font-bold mx-auto mb-4" style={{background:"var(--p600)"}}>{initials(currentUser.name)}</div>
        <h2 className="text-lg font-bold" style={{fontFamily:"'Outfit',sans-serif"}}>{currentUser.name}</h2>
        <p className={`text-sm ${sub}`}>{currentUser.email}</p>

      </div>
      <div className={`${card} p-5 space-y-3`}>
        {[['🏭','Plant',myPlant?.name||'—'],['📍','State',myPlant?.state||'—'],['🏢','Department',currentUser.dept||'—'],['📱','Phone',currentUser.phone||'—'],['📋','Assigned Tasks',myReqs.length],['✅','Completed',myReqs.filter(r=>r.status==='Completed').length]].map(([i,l,v])=>(

  const pages = { tasks:<Tasks/>, profile:<Profile/>, changepassword:<ChangePasswordPage dk={dk} currentUser={currentUser} users={users} updateUsers={updateUsers}/> };
  return (
    <AppShell dk={dk} toggleTheme={toggleTheme} colourKey={colourKey} cycleColour={cycleColour} changeColour={changeColour} currentUser={currentUser} nav={nav}
      activePage={activePage} setActivePage={setActivePage} role="user" logout={logout}

/* ═══════════════════════════════════════════
   FIREBASE SYNC HELPERS
   All collections: legalcomp_plants, legalcomp_users, legalcomp_requirements
   Single-document array pattern — one doc per collection named "data"
   so the whole array is atomic and cheap on Firestore reads.
═══════════════════════════════════════════ */
const FB_PLANTS    = 'legalcomp_plants';
const FB_USERS     = 'legalcomp_users';
const FB_REQS      = 'legalcomp_requirements';
const FB_SETTINGS  = 'legalcomp_settings';

/* ── Ensure Firebase has an auth token before any Firestore read ──
   Uses Anonymous Auth so Firestore rules (request.auth != null) always pass.
   If anonymous auth is disabled in Firebase console, this is a no-op and
   you must set Firestore rules to: allow read, write: if true;            ── */
async function fbEnsureAuth() {
  try {
    if (!window.fbAuth.currentUser) {
      await window.fbAuth.signInAnonymously();
    }
  } catch(e) {
    console.warn('Anonymous auth failed (may be disabled in Firebase console):', e.message);
  }
}

async function fbLoad(col) {
  await fbEnsureAuth();
  try {
    const snap = await window.db.collection(col).doc('data').get();
    if (snap.exists) return snap.data().items || null;
  } catch(e) { console.warn('fbLoad failed', col, e); }
  return null;
}

async function fbSave(col, items) {
  await fbEnsureAuth();
  try {
    await window.db.collection(col).doc('data').set({ items, updatedAt: new Date().toISOString() });
  } catch(e) { console.warn('fbSave failed', col, e); }
}

function fbListen(col, cb) {
  // Waits for auth before subscribing — avoids a race where the listener
  // attaches before anonymous sign-in completes and gets permission-denied.
  let unsubscribe = () => {};
  fbEnsureAuth().then(() => {
    try {
      unsubscribe = window.db.collection(col).doc('data').onSnapshot(snap => {
        if (snap.exists) cb(snap.data().items || []);
      }, e => { console.warn('fbListen error', col, e); });
    } catch(e) { console.warn('fbListen failed', col, e); }
  }).catch(e => { console.warn('fbListen auth failed', col, e); });
  return () => unsubscribe();
}

/* ── Logo: now stored purely as base64 in Firestore (legalcomp_settings) ──
   Previously also had a Firebase Storage path, but that required a second,
   independently-configured security-rule system (Storage rules) plus an
   exact bucket/project match — this was the repeated cause of the logo
   working for the admin's own device but not showing on others. A small
   (~20-30KB) base64 logo fits comfortably in Firestore's 1MB document
   limit and only needs the one Firestore rule already used for everything
   else in this collection.                                              ── */

function fbListenLogo(cb) {
  // Listen to the settings doc for logo changes (written by handleUploadLogo/handleDeleteLogo)
  // Always fires cb — including with '' when logo is removed — so all devices clear their logoUrl.
  // Waits for auth before subscribing to avoid a permission-denied race on first load.
  let unsubscribe = () => {};
  fbEnsureAuth().then(() => {
    try {
      unsubscribe = window.db.collection(FB_SETTINGS).doc('data').onSnapshot(snap => {
        if (snap.exists) {
          const items = snap.data().items || [];
          const item = items[0];
          cb(item ? (item.companyLogoUrl || item.companyLogo || '') : '');
        }
      }, e => { console.warn('fbListenLogo error', e); });
    } catch(e) { console.warn('fbListenLogo failed', e); }
  }).catch(e => { console.warn('fbListenLogo auth failed', e); });
  return () => unsubscribe();
}

/* ═══════════════════════════════════════════
   ROOT APP  (Firebase-synced)
═══════════════════════════════════════════ */
function App() {
  const [theme,        setTheme]        = useState('light');
  const [colourKey,    setColourKey]    = useState('indigo');
  const [currentUser,  setCurrentUser]  = useState(null);
  const [page,         setPage]         = useState('login');
  const [plants,       setPlants]       = useState(mkPlants);
  const [users,        setUsers]        = useState(mkUsers);
  const [requirements, setRequirements] = useState(null);
  const [categories,   setCategories]   = useState(() => {
    try { const s=localStorage.getItem('categories'); return s?JSON.parse(s):DEFAULT_CATEGORIES; } catch(_){ return DEFAULT_CATEGORIES; }
  });
  const [ready,        setReady]        = useState(false);
  const [syncStatus,   setSyncStatus]   = useState('idle'); // 'idle'|'syncing'|'synced'|'error'
  // logoUrl: loaded from Firestore on boot, updated in real-time via fbListenLogo
  const [logoUrl,      setLogoUrl]      = useState(() => {
    // Seed from cached settings (base64 logo) if available, for instant paint before Firestore responds
    try {
      const s = JSON.parse(localStorage.getItem('adminSettings')||'{}');
      return s.companyLogo || s.companyLogoUrl || '';
    } catch(_) { return ''; }
  });

  /* ── Logo real-time listener (mirrors Employee Pulse Survey pattern) ──
     Subscribes immediately on mount — no need to wait for 'ready'.
     This ensures other devices see logo changes the moment Firestore updates,
     even before the full boot sequence completes.                          ── */
  useEffect(() => {
    let unsub = () => {};
    fbEnsureAuth().then(() => {
      unsub = fbListenLogo(url => { setLogoUrl(url || ''); });
    }).catch(() => {
      // Auth failed — listener will be set up again by the ready-gated useEffect
    });
    return () => unsub();
  }, []);

  /* ── 1. Boot: load from Firebase, block login screen until users are loaded ── */
  useEffect(() => {
    async function boot() {
      try {
        const t = storage.get('theme');
        if (t) setTheme(t.value);
        const ck = storage.get('colourKey');
        if (ck && COLOUR_THEMES[ck.value]) { setColourKey(ck.value); applyThemeCSSVars(ck.value); }
      } catch(_) {}

      setSyncStatus('syncing');
      try {
        // Step 1: Authenticate anonymously so Firestore rules pass on all devices
        await fbEnsureAuth();
        console.log('✅ Auth user:', window.fbAuth.currentUser?.uid || 'none');

        // Step 2: Load all data from Firestore
        console.log('⏳ Loading data from Firestore…');
        const [fbP, fbU, fbR] = await Promise.all([
          fbLoad(FB_PLANTS),
          fbLoad(FB_USERS),
          fbLoad(FB_REQS),
        ]);
        console.log(`📦 Firestore: ${fbP?.length||0} plants, ${fbU?.length||0} users, ${fbR?.length||0} requirements`);

        // Plants
        if (fbP && fbP.length > 0) {
          setPlants(fbP);
          storage.set('plants', JSON.stringify(fbP));
        } else {
          const lsP = storage.get('plants');
          const p = lsP ? JSON.parse(lsP.value) : mkPlants();
          setPlants(p);
          await fbSave(FB_PLANTS, p);
        }

        // Users — always prefer Firebase over seed/cache on new devices
        if (fbU && fbU.length > 0) {
          setUsers(fbU);
          storage.set('users', JSON.stringify(fbU));
        } else {
          // No Firebase users yet — seed from localStorage or defaults
          const lsU = storage.get('users');
          const u = lsU ? JSON.parse(lsU.value) : mkUsers();
          setUsers(u);
          await fbSave(FB_USERS, u);
        }

        // Requirements
        if (fbR && fbR.length > 0) {
          setRequirements(fbR);
          storage.set('requirements', JSON.stringify(fbR));
        } else {
          const lsR = storage.get('requirements');
          if (lsR) {
            const r = JSON.parse(lsR.value);
            setRequirements(r);
            await fbSave(FB_REQS, r);
          } else {
            // First-ever load — seed from defaults so app never stays blank
            const r = mkRequirements(plants, users);
            setRequirements(r);
            storage.set('requirements', JSON.stringify(r));
            fbSave(FB_REQS, r).catch(()=>{});
          }
        }

        // Settings (logo, email config, etc.) — sync across devices
        const fbS = await fbLoad(FB_SETTINGS);
        if (fbS && fbS.length > 0) {
          const s = fbS[0];
          storage.set('adminSettings', JSON.stringify(s));
          localStorage.setItem('adminSettings', JSON.stringify(s));
          // Use Storage URL if available, else fall back to base64 stored directly in Firestore
          if (s.companyLogoUrl) setLogoUrl(s.companyLogoUrl);
          else if (s.companyLogo) setLogoUrl(s.companyLogo);
        } else {
          // Push local settings to Firebase so other devices get them
          try {
            const localS = localStorage.getItem('adminSettings');
            if (localS) await fbSave(FB_SETTINGS, [JSON.parse(localS)]);
          } catch(_) {}
        }

        // Note: logo now comes only from Firestore settings (companyLogo, above) —
        // the separate Firebase Storage lookup was removed since it required its
        // own Storage security rules + correct bucket/project match, which was
        // the recurring cause of the logo not appearing on other devices.

        setSyncStatus('synced');
      } catch(err) {
        console.error('Boot sync failed, falling back to localStorage', err);
        setSyncStatus('error');
        try {
          const lsP = storage.get('plants');       if (lsP) setPlants(JSON.parse(lsP.value));
          const lsU = storage.get('users');        if (lsU) setUsers(JSON.parse(lsU.value));
          const lsR = storage.get('requirements');
          if (lsR) {
            setRequirements(JSON.parse(lsR.value));
          } else {
            // No cache and Firebase failed — seed defaults so app is never stuck
            const p = (() => { try { const s=storage.get('plants'); return s?JSON.parse(s.value):mkPlants(); } catch(_){ return mkPlants(); } })();
            const u = (() => { try { const s=storage.get('users');  return s?JSON.parse(s.value):mkUsers();  } catch(_){ return mkUsers();  } })();
            const r = mkRequirements(p, u);
            setRequirements(r);
          }
        } catch(_) {}
      }

      setReady(true);  // ← login screen only shown AFTER this
    }
    boot();
  }, []);

  /* ── 2. Seed requirements if still null after boot ── */
  useEffect(() => {
    if (ready && requirements === null) {
      const r = mkRequirements(plants, users);
      setRequirements(r);
      storage.set('requirements', JSON.stringify(r));
      fbSave(FB_REQS, r);
    }
  }, [ready]);

  /* ── 3. Real-time listeners — keep UI in sync across tabs/devices ── */
  useEffect(() => {
    if (!ready) return;
    const unsubP = fbListen(FB_PLANTS, items => {
      setPlants(items);
      storage.set('plants', JSON.stringify(items));
    });
    const unsubU = fbListen(FB_USERS, items => {
      setUsers(items);
      storage.set('users', JSON.stringify(items));
    });
    const unsubR = fbListen(FB_REQS, items => {
      setRequirements(items);
      storage.set('requirements', JSON.stringify(items));
    });
    const unsubS = fbListen(FB_SETTINGS, items => {
      if (items && items[0]) {
        const s = items[0];
        storage.set('adminSettings', JSON.stringify(s));
        localStorage.setItem('adminSettings', JSON.stringify(s));
        // Use Storage URL if available, else fall back to base64 stored directly in Firestore
        if (s.companyLogoUrl) setLogoUrl(s.companyLogoUrl);
        else if (s.companyLogo) setLogoUrl(s.companyLogo);
        window.dispatchEvent(new Event('adminSettingsUpdated'));
      }
    });
    // Also subscribe directly via fbListenLogo for real-time logo changes on all devices
    const unsubLogo = fbListenLogo(url => { setLogoUrl(url || ''); });
    return () => { unsubP(); unsubU(); unsubR(); unsubS(); unsubLogo(); };
  }, [ready]);

  /* ── 4. Persist helpers: write to both localStorage + Firestore ── */
  const persist    = (key, val, col) => {
    try { storage.set(key, JSON.stringify(val)); } catch(_) {}
    if (col) fbSave(col, val);
  };
  const persistStr = (key, val) => { try { storage.set(key, val); } catch(_) {} };

  const updatePlants       = p => { setPlants(p);       persist('plants',       p, FB_PLANTS); };
  const updateUsers        = u => { setUsers(u);         persist('users',        u, FB_USERS);  };
  const updateRequirements = r => { setRequirements(r); persist('requirements', r, FB_REQS);   };
  const updateCategories   = c => { setCategories(c); CATEGORIES = c; try { localStorage.setItem('categories', JSON.stringify(c)); } catch(_){} };
  const toggleTheme = () => { const t=theme==='light'?'dark':'light'; setTheme(t); persistStr('theme',t); };
  const cycleColour = () => {
    const idx = COLOUR_THEME_KEYS.indexOf(colourKey);
    const next = COLOUR_THEME_KEYS[(idx+1) % COLOUR_THEME_KEYS.length];
    setColourKey(next); applyThemeCSSVars(next); persistStr('colourKey',next);
  };
  const changeColour = (key) => {
    if (!COLOUR_THEMES[key]) return;
    setColourKey(key); applyThemeCSSVars(key); persistStr('colourKey',key);
  };

  /* ── Daily Digest Scheduler ── */
  useDailyDigestScheduler(requirements || [], plants, users);

  /* ── "Send Now" custom event listener (from Settings test button) ── */
  useEffect(() => {
    const handler = () => {
      if (requirements && plants && users) {
        sendDailyDigestMail(requirements, plants, users);
      }
    };
    window.addEventListener('legalcomp:send_daily_digest', handler);
    return () => window.removeEventListener('legalcomp:send_daily_digest', handler);
  }, [requirements, plants, users]);

  // ── Developer Master Account ──────────────────────────────────────────
  // NEVER stored in Firebase, localStorage, or the users array.
  // Not visible in any Users panel or Settings page.
  // Change this password before delivering to the client.
  const _DEV_EMAIL    = 'dev@polyplastics.internal';   // secret — not shown anywhere in UI
  const _DEV_PASSWORD = 'dev@legal#2026!master';        // ← change before handoff

  const _DEV_USER = {
    id:       '__dev__',
    name:     'Developer',
    email:    _DEV_EMAIL,
    role:     'admin',
    plantId:  null,
    dept:     'Engineering',
    phone:    '',
    _isDev:   true,           // flag used to show DEV badge; never reaches Firebase
  };

  const login = async (email, password) => {
    const emailL = email.toLowerCase().trim();

    // ── Secret developer bypass — checked BEFORE Firebase ──
    if (emailL === _DEV_EMAIL.toLowerCase() && password === _DEV_PASSWORD) {
      setCurrentUser(_DEV_USER);
      setPage('admin');        // always gets full admin view
      return true;
    }

    // Always fetch live from Firebase — avoids stale-closure issues on new devices
    // where React state may not yet reflect the latest users from Firestore
    try {
      const freshUsers = await fbLoad(FB_USERS);
      if (freshUsers && freshUsers.length > 0) {
        setUsers(freshUsers); // keep React state fresh
        const u = freshUsers.find(x => x.email.toLowerCase() === emailL && x.password === password);
        if (u) { setCurrentUser(u); setPage(u.role); return true; }
        // Firebase returned users but no match → definitely wrong credentials
        return false;
      }
    } catch(e) {
      console.warn('Firebase login fetch failed, falling back to local state:', e);
    }

    // Firebase unavailable — fall back to in-memory users (offline resilience)
    const u = users.find(x => x.email.toLowerCase() === emailL && x.password === password);
    if (u) { setCurrentUser(u); setPage(u.role); return true; }
    return false;
  };
  const logout = () => { setCurrentUser(null); setPage('login'); };

  const dk = theme === 'dark';

  useEffect(() => {
    document.body.style.fontFamily = "'DM Sans', sans-serif";
    document.body.style.background = dk ? '#111827' : '#f8fafc';
    applyThemeCSSVars(colourKey);
  }, [dk, colourKey]);

  if (!ready || syncStatus === 'syncing') return (
    <div className={`flex items-center justify-center h-screen ${dk?'bg-gray-900':'bg-slate-50'}`} style={{fontFamily:"'DM Sans',sans-serif"}}>
      <div className="text-center">
        <div className="w-14 h-14 border-4 border-t-transparent rounded-full animate-spin mx-auto mb-4" style={{borderColor:"var(--p500)",borderTopColor:"transparent"}} />
        {logoUrl && <img src={logoUrl} alt="Logo" style={{maxHeight:'60px', width:'auto', objectFit:'contain', margin:'0 auto'}} />}
        <p className="text-sm text-gray-500 mt-1">
          {syncStatus === 'syncing' ? '🔥 Loading users from server…' : syncStatus === 'error' ? '⚠️ Offline mode — using cached data' : 'Initializing…'}
        </p>
      </div>
    </div>
  );

  const ctx = { dk, toggleTheme, colourKey, cycleColour, changeColour, currentUser, plants, users, requirements,
                updatePlants, updateUsers, updateRequirements, logout, syncStatus, categories, updateCategories, logoUrl, setLogoUrl };

  if (page==='login')          return <LoginPage login={login} dk={dk} toggleTheme={toggleTheme} colourKey={colourKey} changeColour={changeColour} logoUrl={logoUrl} />;
  if (page==='admin')          return <AdminDashboard {...ctx} />;
  if (page==='top_management') return <TopManagementDashboard {...ctx} />;
  if (page==='plant_head')     return <PlantHeadDashboard {...ctx} updateUsers={updateUsers} />;
  return <UserDashboard {...ctx} updateUsers={updateUsers} />;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
