  const downloadTemplate = () => {
    const sample = [
      COLS.join(','),
      ...plants.slice(0,3).map((p,i) =>
        [
          `"${['Factory License Renewal','Pollution Control NOC','Fire Safety Certificate'][i]}"`,
          `"Ensure statutory compliance for ${p.name}"`,
          cats[i % cats.length],
          PRIORITIES[i % 4],
          'Pending',
          p.id,
          p.state,
          new Date(Date.now()+(i+1)*30*86400000).toISOString().split('T')[0],
          COMPLIANCE_FREQS[(i+1)%COMPLIANCE_FREQS.length].value,
          REM_FREQS[i%4],
          (i%3)+1,
          'ceo@legalcomp.com',
          '',
          `"${['Factories Act 1948 – Section 6','Environment Protection Act 1986 – Rule 5','Fire Services Act – Rule 12'][i]}"`,
          `"${['License to be obtained before operations; renewal within 30 days of expiry.','NOC mandatory from State Pollution Control Board.','Fire NOC required as per National Building Code.'][i]}"`,
        ].join(',')
      )
    ].join('\n');
    const blob = new Blob([sample], { type:'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'bulk_requirements_template.csv';
    a.click();
  };

  /* ── Download Excel (.xlsx) template ── */
  const downloadExcelTemplate = () => {
    if (!window.XLSX) {
      alert('SheetJS library not loaded yet — please wait a moment and try again.');
      return;
    }
    const XL = window.XLSX;

    /* ── Column definitions ── */
    const colDefs = [
      { key:'title',              label:'title *',              width:30, note:'Required. Short name of the compliance requirement.' },
      { key:'description',        label:'description',          width:40, note:'Optional. Detailed description or instructions.' },
      { key:'category',           label:'category',             width:20, note:`One of: ${cats.join(', ')}` },
      { key:'priority',           label:'priority',             width:14, note:`One of: ${PRIORITIES.join(', ')}` },
      { key:'status',             label:'status',               width:14, note:`One of: ${STATUSES.join(', ')}` },
      { key:'plant_id',           label:'plant_id',             width:22, note:'Plant ID from the directory below (e.g. P001). For MULTI-PLANT: comma-separate IDs, e.g. P001,P002,P003 — one requirement per plant will be created.' },
      { key:'state',              label:'state',                width:18, note:'State name (e.g. Maharashtra). Used if plant_id is blank.' },
      { key:'due_date',           label:'due_date *',           width:14, note:'Required. Format: YYYY-MM-DD (e.g. 2025-12-31).' },
      { key:'compliance_frequency',label:'compliance_frequency', width:22, note:`One of: ${COMPLIANCE_FREQS.map(f=>f.value).join(', ')} — controls how often the requirement recurs after completion.` },
      { key:'reminder_frequency', label:'reminder_frequency',   width:20, note:`One of: ${REM_FREQS.join(', ')}` },
      { key:'escalation_level',   label:'escalation_level',     width:18, note:'1, 2 or 3.' },
      { key:'escalation_email',   label:'escalation_email',     width:28, note:'Email address for escalation alerts.' },
      { key:'assigned_email',     label:'assigned_email',        width:36, note:'Email of the user to assign this to. For MULTI-PLANT: comma-separate emails matching plant_id order, e.g. ravi@co.com,suresh@co.com,anand@co.com — if fewer emails than plants, the last email repeats.' },
      { key:'applicable_rule',    label:'applicable_rule',      width:36, note:'Legal reference, e.g. Factories Act 1948 – Section 6.' },
      { key:'legal_clause',       label:'legal_clause',         width:44, note:'Specific clause text or obligation description.' },
    ];

    /* ── Build worksheet data ── */
    const wsData = [];

    // Row 1: Column headers
    wsData.push(colDefs.map(c => c.label));

    // Rows 2–4: Sample data using first 3 plants
    const sampleTitles = ['Factory License Renewal', 'Pollution Control NOC', 'Fire Safety Certificate'];
    const sampleRules  = ['Factories Act 1948 – Section 6', 'Environment Protection Act 1986 – Rule 5', 'Fire Services Act – Rule 12'];
    const sampleClauses= [
      'License to be obtained before operations; renewal within 30 days of expiry.',
      'NOC mandatory from State Pollution Control Board.',
      'Fire NOC required as per National Building Code.',
    ];
    plants.slice(0, 3).forEach((p, i) => {
      wsData.push([
        sampleTitles[i],
        `Ensure statutory compliance for ${p.name}`,
        cats[i % cats.length],
        PRIORITIES[i % 4],
        'Pending',
        p.id,
        p.state,
        new Date(Date.now() + (i + 1) * 30 * 86400000).toISOString().split('T')[0],
        COMPLIANCE_FREQS[(i + 1) % COMPLIANCE_FREQS.length].value,
        REM_FREQS[i % 4],
        (i % 3) + 1,
        'ceo@legalcomp.com',
        '',
        sampleRules[i],
        sampleClauses[i],
      ]);
    });

    // Row 5: Multi-plant sample (if 2+ plants exist)
    if (plants.length >= 2) {
      const mpIds    = plants.slice(0, Math.min(plants.length, 3)).map(p => p.id).join(',');
      const mpEmails = plants.slice(0, Math.min(plants.length, 3)).map(() => 'responsible@plant.com').join(',');
      wsData.push([
        'Annual Environment Compliance Audit',
        'Conduct mandatory annual environment audit as per EPA. Assign plant-wise responsible person.',
        cats[0] || 'Environment',
        'High',
        'Pending',
        mpIds,          // e.g.  P001,P002,P003
        '',             // state not needed when plant_id is given
        new Date(Date.now() + 90 * 86400000).toISOString().split('T')[0],
        'annual',
        'Monthly',
        1,
        'ceo@legalcomp.com',
        mpEmails,       // e.g.  ram@p1.com,shyam@p2.com,hari@p3.com
        'Environment Protection Act 1986 – Rule 5',
        'Annual audit mandatory for all manufacturing units.',
      ]);
    }

    // If no plants loaded yet, add one blank sample row
    if (!plants.length) {
      wsData.push(Array(colDefs.length).fill(''));
    }

    /* ── Create worksheet ── */
    const ws = XL.utils.aoa_to_sheet(wsData);

    /* ── Column widths ── */
    ws['!cols'] = colDefs.map(c => ({ wch: c.width }));

    /* ── Style header row (bold + background) using cell objects ── */
    const headerStyle = {
      font:      { bold: true, color: { rgb: 'FFFFFF' }, sz: 11 },
      fill:      { fgColor: { rgb: '4F46E5' } },   // indigo-600
      alignment: { horizontal: 'center', vertical: 'center', wrapText: true },
      border: {
        bottom: { style: 'medium', color: { rgb: 'FFFFFF' } },
      },
    };
    colDefs.forEach((_, ci) => {
      const cellAddr = XL.utils.encode_cell({ r: 0, c: ci });
      if (ws[cellAddr]) ws[cellAddr].s = headerStyle;
    });

    /* ── Style sample rows (alternating light fill) ── */
    const evenFill = { fgColor: { rgb: 'EEF2FF' } }; // indigo-50
    const oddFill  = { fgColor: { rgb: 'F9FAFB' } }; // gray-50
    for (let ri = 1; ri < wsData.length; ri++) {
      colDefs.forEach((_, ci) => {
        const cellAddr = XL.utils.encode_cell({ r: ri, c: ci });
        if (!ws[cellAddr]) ws[cellAddr] = { t: 's', v: '' };
        ws[cellAddr].s = {
          fill:      { fgColor: ri % 2 === 0 ? evenFill.fgColor : oddFill.fgColor },
          alignment: { vertical: 'top', wrapText: true },
          border: {
            bottom: { style: 'thin', color: { rgb: 'E5E7EB' } },
            right:  { style: 'thin', color: { rgb: 'E5E7EB' } },
          },
        };
      });
    }

    /* ── Data validation dropdowns ── */
    const colIdx = k => colDefs.findIndex(c => c.key === k);
    const dataValidations = [
      { col: colIdx('category'),           sqref: `C2:C500`, formula: cats.map(v=>`"${v}"`).join(','),       prompt: 'Select a category' },
      { col: colIdx('priority'),           sqref: `D2:D500`, formula: PRIORITIES.join(','),                  prompt: 'Select priority' },
      { col: colIdx('status'),             sqref: `E2:E500`, formula: STATUSES.join(','),                    prompt: 'Select status' },
      { col: colIdx('compliance_frequency'), sqref: `I2:I500`, formula: COMPLIANCE_FREQS.map(f=>f.value).join(','), prompt: 'Select compliance recurrence frequency' },
      { col: colIdx('reminder_frequency'), sqref: `J2:J500`, formula: REM_FREQS.join(','),                   prompt: 'Select reminder frequency' },
      { col: colIdx('escalation_level'),   sqref: `J2:J500`, formula: '1,2,3',                              prompt: '1, 2 or 3' },
    ];
    ws['!dataValidation'] = dataValidations.map(dv => ({
      sqref: dv.sqref,
      type: 'list',
      formula1: `"${dv.formula}"`,
      showDropDown: false,
      showInputMessage: true,
      promptTitle: dv.prompt,
      prompt: dv.prompt,
    }));

    /* ── Freeze header row ── */
    ws['!freeze'] = { xSplit: 0, ySplit: 1, topLeftCell: 'A2', activePane: 'bottomLeft' };

    /* ── Notes sheet — plant & user directory ── */
    const notesData = [
      ['📋 HOW TO USE THIS TEMPLATE', ''],
      ['', ''],
      ['1. Fill in rows below the header in the "Requirements" sheet.', ''],
      ['2. Columns marked with * are required (Title, Due Date).', ''],
      ['3. Use plant_id OR state to identify the plant — not both needed.', ''],
      ['4. assigned_email (or "Assigned User Email") → user EMAIL address.', ''],
      ['   e.g. shiksha@polyplasticsindia.com — must match a registered user.', ''],
      ['5. You can upload this .xlsx directly — no need to save as CSV.', ''],
      ['', ''],
      ['🏭 MULTI-PLANT UPLOAD (same requirement, different responsible persons)', ''],
      ['   Put comma-separated Plant IDs in plant_id column:', ''],
      ['   e.g.  P001,P002,P003', ''],
      ['   Put matching comma-separated emails in assigned_email column:', ''],
      ['   e.g.  ravi@p1.com,suresh@p2.com,anand@p3.com', ''],
      ['   The system will create one separate requirement per plant,', ''],
      ['   each assigned to the corresponding person.', ''],
      ['   If you supply fewer emails than plants, the last email is reused.', ''],
      ['', ''],
      ['── PLANT DIRECTORY ──────────────────────────────', ''],
      ['Plant ID', 'Plant Name', 'State'],
      ...plants.map(p => [p.id, p.name, p.state]),
      ['', ''],
      ['── VALID VALUES ─────────────────────────────────', ''],
      ['Field', 'Allowed Values'],
      ['category',           cats.join(' | ')],
      ['priority',           PRIORITIES.join(' | ')],
      ['status',             STATUSES.join(' | ')],
      ['compliance_frequency', COMPLIANCE_FREQS.map(f=>`${f.value} (${f.label})`).join(' | ')],
      ['reminder_frequency', REM_FREQS.join(' | ')],
      ['escalation_level',   '1 | 2 | 3'],
      ['due_date format',    'YYYY-MM-DD  (e.g. 2025-12-31)'],
    ];
    const wsNotes = XL.utils.aoa_to_sheet(notesData);
    wsNotes['!cols'] = [{ wch: 52 }, { wch: 30 }, { wch: 22 }];

    /* ── Workbook ── */
    const wb = XL.utils.book_new();
    XL.utils.book_append_sheet(wb, ws,     'Requirements');
    XL.utils.book_append_sheet(wb, wsNotes,'Guide & Directory');

    XL.writeFile(wb, 'bulk_requirements_template.xlsx');
  };

  /* ── Multi-plant row expander (shared by CSV + Excel parsers) ──────────
     One source row whose plant_id = "P001,P002,P003" and
     assigned_email = "a@x.com,b@x.com,c@x.com" is exploded into 3 rows,
     each tied to one plant and one responsible person.
     If fewer emails are supplied than plants, the last email is reused.
  ────────────────────────────────────────────────────────────────────── */
  const expandMultiPlantRow = (obj, li, errs, rows) => {
    const rawPids    = String(obj.plant_id || '').split(',').map(s => s.trim()).filter(Boolean);
    const rawEmails  = String(obj.assigned_email || obj.assigned_user_email || obj.assignee_email || obj.assigned_to || '').split(',').map(s => s.trim());
    const plantIds   = rawPids.length ? rawPids : [''];  // at least one iteration for state-based lookup
    const isMulti    = plantIds.length > 1;

    const category  = cats.includes(obj.category) ? obj.category : (cats[0] || 'Other');
    const priority  = PRIORITIES.includes(obj.priority) ? obj.priority : 'Medium';
    const status    = STATUSES.includes(obj.status) ? obj.status : 'Pending';
    const escLvl    = [1, 2, 3].includes(+obj.escalation_level) ? +obj.escalation_level : 1;
    const compFreq  = normalizeFrequency(obj.compliance_frequency);
    const remFreq   = normalizeReminderFreq(obj.reminder_frequency);

    plantIds.forEach((pid, idx) => {
      const rowErrs = [];
      if (!obj.title)    rowErrs.push('title missing');
      if (!obj.due_date) rowErrs.push('due_date missing');

      // Resolve plant — by ID first, then by state fallback
      let plant = null;
      if (pid) plant = plants.find(p => p.id === pid);
      if (!plant && obj.state) plant = plants.find(p => p.state.toLowerCase() === obj.state.toLowerCase());
      if (!plant) rowErrs.push(`plant not found (plant_id="${pid || obj.plant_id}", state="${obj.state}")`);

      // Resolve assigned user — pick email at matching index, fall back to last
      const emailForPlant = (rawEmails[idx] || rawEmails[rawEmails.length - 1] || '').trim();
      let assignedTo = null, assignedEmailRaw = emailForPlant;
      if (emailForPlant) {
        const u = users.find(u => u.email.toLowerCase() === emailForPlant.toLowerCase());
        if (u) { assignedTo = u.id; assignedEmailRaw = u.email; }
        // Unknown email — warning only, row stays valid; will import as unassigned
      }

      if (rowErrs.length) errs.push({ row: li + 2, errs: rowErrs, plantId: pid });

      rows.push({
        _rowNum:           li + 2,
        _valid:            rowErrs.length === 0,
        _plant:            plant,
        _assignedTo:       assignedTo,
        _assignedEmailRaw: assignedTo ? '' : assignedEmailRaw,
        _multiPlant:       isMulti,
        _multiIdx:         isMulti ? idx : null,
        _multiTotal:       isMulti ? plantIds.length : null,
        title:             obj.title,
        description:       obj.description || '',
        category,
        priority,
        status,
        plantId:           plant?.id || '',
        state:             plant?.state || obj.state,
        dueDate:           obj.due_date,
        complianceFrequency: compFreq,
        reminderFrequency: remFreq,
        escalationLevel:   escLvl,
        escalationEmail:   obj.escalation_email || '',
        assignedTo:        assignedTo ? [assignedTo] : [],
        applicableRule:    obj.applicable_rule || '',
        legalClause:       obj.legal_clause || '',
      });
    });
  };

  /* ── Parse CSV text ── */
  const parseCSV = (text) => {
    const lines = text.trim().split('\n').filter(Boolean);
    if (lines.length < 2) return { rows:[], errs:['CSV has no data rows.'] };
    const normHdr = h => h.trim().replace(/^"|"$/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
    const HDR_ALIAS = {
      assigned_user_email:'assigned_email', assignee_email:'assigned_email',
      assigned_to:'assigned_email', assign_to:'assigned_email',
      plant:'plant_id', plant_name:'plant_id',
      due:'due_date', deadline:'due_date',
      compliance_freq:'compliance_frequency', recurrence:'compliance_frequency',
      reminder:'reminder_frequency', reminder_freq:'reminder_frequency',
      escalation:'escalation_level', esc_level:'escalation_level',
      rule:'applicable_rule', regulation:'applicable_rule',
      clause:'legal_clause', provision:'legal_clause',
    };
    const headers = lines[0].split(',').map(h=>{ const k=normHdr(h); return HDR_ALIAS[k]||k; });
    const errs = [];
    const rows = [];
    lines.slice(1).forEach((line, li) => {
      // handle quoted commas
      const cols = [];
      let cur = '', inQ = false;
      for (let ch of line) {
        if (ch==='"') inQ=!inQ;
        else if (ch===',' && !inQ) { cols.push(cur.trim()); cur=''; }
        else cur+=ch;
      }
      cols.push(cur.trim());
      const obj = {};
      headers.forEach((h,i) => { obj[h] = (cols[i]||'').replace(/^"|"$/g,'').trim(); });
      expandMultiPlantRow(obj, li, errs, rows);
    });
    return { rows, errs };
  };

  /* ── Handle file ── */
  const parseExcel = (buffer) => {
    if (!window.XLSX) return { rows:[], errs:['SheetJS not loaded — please refresh.'] };
    const XL = window.XLSX;
    const wb = XL.read(buffer, { type:'array', cellDates:true });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const raw = XL.utils.sheet_to_json(ws, { defval:'' });
    if (!raw.length) return { rows:[], errs:['Excel sheet has no data rows.'] };
    const XL_ALIAS = {
      assigned_user_email:'assigned_email', assignee_email:'assigned_email',
      assigned_to:'assigned_email', assign_to:'assigned_email',
      plant:'plant_id', plant_name:'plant_id',
      due:'due_date', deadline:'due_date',
      compliance_freq:'compliance_frequency', recurrence:'compliance_frequency',
      reminder:'reminder_frequency', reminder_freq:'reminder_frequency',
      escalation:'escalation_level', esc_level:'escalation_level',
      rule:'applicable_rule', regulation:'applicable_rule',
      clause:'legal_clause', provision:'legal_clause',
    };
    const norm = k => { const base=String(k).trim().toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,''); return XL_ALIAS[base]||base; };
    const errs = [], rows = [];
    raw.forEach((rawRow, li) => {
      const obj = {};
      Object.keys(rawRow).forEach(k => {
        const v = rawRow[k];
        obj[norm(k)] = v instanceof Date ? v.toISOString().split('T')[0] : String(v ?? '').trim();
      });
      expandMultiPlantRow(obj, li, errs, rows);
    });
    return { rows, errs };
  };

  const handleFile = (file) => {
    if (!file) return;
    const name = file.name.toLowerCase();
    const isCSV = name.endsWith('.csv');
    const isXL  = name.endsWith('.xlsx') || name.endsWith('.xls');
    if (!isCSV && !isXL) { showToast('Upload a .csv, .xlsx or .xls file.','error'); return; }
    const done = (rows, errs) => {
      setRawRows(rows); setErrors(errs);
      setSelRows(new Set(rows.filter(r=>r._valid).map(r=>r._rowNum)));
      setTab('preview');
    };
    if (isCSV) {
      const reader = new FileReader();
      reader.onload = e => { const {rows,errs}=parseCSV(e.target.result); done(rows,errs); };
      reader.readAsText(file);
    } else {
      if (!window.XLSX) { showToast('SheetJS not loaded — please wait and retry.','error'); return; }
      const reader = new FileReader();
      reader.onload = e => { const {rows,errs}=parseExcel(e.target.result); done(rows,errs); };
      reader.readAsArrayBuffer(file);
    }
  };

  const onDrop = e => {
    e.preventDefault(); setDragOver(false);
    handleFile(e.dataTransfer.files[0]);
  };

  /* ── Filter preview rows ── */
  const visibleRows = rawRows.filter(r => {
    if (filterState && r.state !== filterState) return false;
    if (filterPlant && r.plantId !== filterPlant) return false;
    return true;
  });

  const uniqueStates = [...new Set(rawRows.map(r=>r.state).filter(Boolean))].sort();
  const uniquePlants = [...new Set(rawRows.map(r=>r.plantId).filter(Boolean))];

  /* ── Toggle row selection ── */
  const toggleRow  = rn => setSelRows(s => { const n=new Set(s); n.has(rn)?n.delete(rn):n.add(rn); return n; });
  const toggleAll  = () => {
    const validVisible = visibleRows.filter(r=>r._valid).map(r=>r._rowNum);
    const allSel = validVisible.every(rn=>selRows.has(rn));
    setSelRows(s => {
      const n=new Set(s);
      validVisible.forEach(rn => allSel ? n.delete(rn) : n.add(rn));
      return n;
    });
  };

  /* ── Import selected rows ── */
  const showToast = (msg, type='success') => {
    setToast({ msg, type });
    setTimeout(()=>setToast(null), 4000);
  };

  const importSelected = async () => {
    const toImport = rawRows.filter(r=>selRows.has(r._rowNum) && r._valid);
    if (!toImport.length) { showToast('No valid rows selected.','error'); return; }
    setImporting(true);
    setImportProgress(0);
    const newReqs = [];
    for (let i = 0; i < toImport.length; i++) {
      const r = toImport[i];
      newReqs.push({
        id: `r${Date.now()}_${Math.random().toString(36).slice(2,7)}`,
        title:             r.title,
        description:       r.description,
        category:          r.category,
        priority:          r.priority,
        status:            r.status,
        plantId:           r.plantId,
        assignedTo:        r._assignedTo,
        assignedEmailPending: r._assignedEmailRaw || '', // email that didn't match a user yet
        dueDate:           r.dueDate,
        reminderFrequency: r.reminderFrequency,
        escalationLevel:   r.escalationLevel,
        escalationEmail:   r.escalationEmail,
        complianceFrequency: r.complianceFrequency || 'annual',
        nextDueDate:       customNextDue[r._rowNum] || computeNextDueDate(r.dueDate, r.complianceFrequency||'annual') || '',
        applicableRule:    r.applicableRule || '',
        legalClause:       r.legalClause || '',
        createdAt:         new Date().toISOString(),
        evidence:          [],
        comments:          [],
      });
      setImportProgress(Math.round(((i + 1) / toImport.length) * 100));
      await new Promise(res => setTimeout(res, 18));
    }
    updateRequirements([...newReqs, ...requirements]);
    const entry = {
      id: `h${Date.now()}`,
      date: new Date().toLocaleString('en-IN'),
      total: rawRows.length,
      imported: toImport.length,
      skipped: rawRows.length - toImport.length,
      plants: [...new Set(toImport.map(r=>r._plant?.name).filter(Boolean))].join(', '),
      states: [...new Set(toImport.map(r=>r.state).filter(Boolean))].join(', '),
    };
    setHistory(h=>[entry,...h]);
    setImporting(false);
    setImportProgress(0);
    showToast(`✅ ${toImport.length} requirement${toImport.length!==1?'s':''} imported successfully across ${[...new Set(toImport.map(r=>r.state))].length} state(s)!`);
    setRawRows([]); setErrors([]); setSelRows(new Set()); setCustomNextDue({}); setEditingNextDue(null); setTab('upload');
  };

  const validCount      = rawRows.filter(r=>r._valid).length;
  const invalidCount    = rawRows.length - validCount;
  const selectedValid   = rawRows.filter(r=>selRows.has(r._rowNum) && r._valid).length;
  const multiPlantCount = rawRows.filter(r=>r._multiPlant).length;

  return (
    <div className="space-y-5">
      {/* Toast */}
      {toast && (
        <div className={`fixed top-5 right-5 z-[100] px-5 py-3.5 rounded-2xl shadow-2xl text-sm font-semibold flex items-center gap-2 transition-all
          ${toast.type==='error'?'bg-red-500 text-white':'bg-green-500 text-white'}`}>
          {toast.msg}
        </div>
      )}

      {/* Header */}
      <div className={`${card} p-5`}>
        <div className="flex flex-wrap items-center justify-between gap-4">
          <div>
            <h2 className="text-xl font-bold flex items-center gap-2" style={{fontFamily:"'Outfit',sans-serif"}}>
              <span>📤</span> Bulk Upload Requirements
            </h2>
            <p className={`text-sm mt-1 ${sub}`}>
              Upload a CSV or Excel file to create compliance requirements for multiple plants across different states in one go — Super Admin only.
            </p>
          </div>
          <div className="flex flex-wrap gap-2">
            <button onClick={downloadTemplate}
              className="px-4 py-2.5 rounded-xl border-2 text-sm font-semibold transition-colors flex items-center gap-2" style={{borderColor:"var(--p500)",color:"var(--p600)"}}>
              ⬇️ CSV Template
            </button>
            <button onClick={downloadExcelTemplate}
              className="px-4 py-2.5 rounded-xl border-2 text-sm font-semibold transition-colors flex items-center gap-2"
              style={{borderColor:'#16a34a',color:'#15803d'}}
              title="Download an Excel (.xlsx) template with dropdowns, sample data, and a plant directory sheet">
              📊 Excel Template
            </button>
          </div>
        </div>

        {/* Tabs */}
        <div className="flex gap-1 mt-5 p-1 rounded-xl bg-gray-100 dark:bg-gray-700 w-fit">
          {[['upload','📁 Upload'],['preview','🔍 Preview & Import'],['history','🕓 Import History']].map(([id,label])=>(
            <button key={id} onClick={()=>setTab(id)}
              className={`px-4 py-1.5 rounded-lg text-sm font-semibold transition-all ${tab===id?(dk?'bg-gray-600 text-white shadow':'bg-white text-[color:var(--p700)] shadow'):(dk?'text-gray-400':'text-gray-500')}`}>
              {label}{id==='preview' && rawRows.length>0 ? ` (${rawRows.length})` : ''}
            </button>
          ))}
        </div>
      </div>

      {/* ── TAB: UPLOAD ── */}
      {tab==='upload' && (
        <div className="space-y-5">
          {/* Drop zone */}
          <div
            onDragOver={e=>{e.preventDefault();setDragOver(true);}}
            onDragLeave={()=>setDragOver(false)}
            onDrop={onDrop}
            onClick={()=>fileRef.current.click()}
            className={`${card} p-12 text-center cursor-pointer transition-all border-2 border-dashed
              ${dragOver?'bg-gray-50 dark:bg-gray-700/20':'border-gray-300 dark:border-gray-600 hover:border-[color:var(--p400)]'}`}>
            <input ref={fileRef} type="file" accept=".csv,.xlsx,.xls" className="hidden"
              onChange={e=>{ if(e.target.files[0]) handleFile(e.target.files[0]); e.target.value=''; }} />
            <div className="text-5xl mb-4">{dragOver ? '📂' : '📁'}</div>
            <p className="text-lg font-bold text-gray-700 dark:text-gray-200 mb-1">
              {dragOver ? 'Drop file here!' : 'Drag & Drop your CSV or Excel file'}
            </p>
            <p className={`text-sm ${sub}`}>or click to browse · .csv, .xlsx or .xls</p>
          </div>

          {/* Format guide */}
          <div className={`${card} p-5`}>
            <h3 className="font-semibold mb-3 flex items-center gap-2" style={{fontFamily:"'Outfit',sans-serif"}}>
              <span>📋</span> CSV Column Reference
            </h3>
            <div className="overflow-x-auto">
              <table className="w-full text-xs">
                <thead>
                  <tr className={`${dk?'bg-gray-700 text-gray-300':'bg-gray-50 text-gray-500'}`}>
                    {['Column','Type','Required','Notes'].map(h=><th key={h} className="text-left px-3 py-2 font-semibold uppercase tracking-wide">{h}</th>)}
                  </tr>
                </thead>
                <tbody className={`divide-y ${dk?'divide-gray-700':'divide-gray-100'}`}>
                  {[
                    ['title','Text','✅ Yes','Requirement title'],
                    ['description','Text','No','Detailed description'],
                    ['category','Enum','No',cats.join(', ')],
                    ['priority','Enum','No','Critical / High / Medium / Low'],
                    ['status','Enum','No','Pending / In Progress / Completed / Overdue'],
                    ['plant_id','ID / CSV','⚡ Or state','Single plant ID (e.g. P001) OR comma-separated for multi-plant: P001,P002,P003'],
                    ['state','Text','⚡ Or plant_id','State name — auto-matches plant (single plant only)'],
                    ['due_date','YYYY-MM-DD','✅ Yes','e.g. 2025-09-30'],
                    ['compliance_frequency','Enum','No','monthly / quarterly / half_yearly / annual / one_time — also accepts: Monthly, Quarterly, Half-Yearly, Yearly, Bi-Annual etc.'],
                    ['reminder_frequency','Enum','No','Daily / Weekly / Fortnightly / Monthly — also accepts: daily, bi-weekly etc.'],
                    ['escalation_level','1/2/3','No','1=Plant Head, 2=Regional, 3=Top Mgmt'],
                    ['escalation_email','Email','No','Override escalation email'],
                    ['assigned_email','Email / CSV','No','Single email OR comma-separated per plant: ram@p1.com,shyam@p2.com — matches plant_id order; last email repeats if fewer'],
                    ['applicable_rule','Text','No','e.g. Factories Act 1948 – Section 6'],
                    ['legal_clause','Text','No','Specific clause or provision mandating compliance'],
                  ].map(([col,type,req,notes])=>(
                    <tr key={col} className={dk?'hover:bg-gray-700/50':'hover:bg-gray-50'}>
                      <td className="px-3 py-2 font-mono text-[color:var(--p500)] font-semibold">{col}</td>
                      <td className={`px-3 py-2 ${sub}`}>{type}</td>
                      <td className="px-3 py-2">{req}</td>
                      <td className={`px-3 py-2 ${sub}`}>{notes}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <div className={`mt-4 p-3 rounded-xl text-xs ${dk?'bg-blue-900/20 border border-blue-800 text-blue-300':'bg-blue-50 border border-blue-100 text-blue-700'}`}>
              💡 <strong>Tip:</strong> You can target a plant by <code>plant_id</code> OR by <code>state</code> name — the system will auto-match.<br/>
              🏭 <strong>Multi-Plant Upload:</strong> Put comma-separated plant IDs in <code>plant_id</code> and matching emails in <code>assigned_email</code>
              (e.g. <code>P001,P002,P003</code> and <code>ravi@p1.com,suresh@p2.com,anand@p3.com</code>) — one requirement per plant will be created automatically.
            </div>
          </div>

          {/* Plant directory */}
          <div className={`${card} p-5`}>
            <h3 className="font-semibold mb-3 flex items-center gap-2" style={{fontFamily:"'Outfit',sans-serif"}}>
              <span>🏭</span> Available Plants & States
            </h3>
            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 xl:grid-cols-5 gap-2">
              {plants.map(p=>(
                <div key={p.id} className={`p-2.5 rounded-xl border text-xs ${dk?'bg-gray-700/50 border-gray-600':'bg-gray-50 border-gray-200'}`}>
                  <p className="font-semibold text-[color:var(--p500)] mb-0.5">{p.id}</p>
                  <p className="font-medium">{p.name}</p>
                  <p className={sub}>{p.state}</p>
                </div>
              ))}
            </div>
          </div>

          {/* ── User Directory ── */}
          <div className={`${card} p-5`}>
            <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
              <h3 className="font-semibold flex items-center gap-2" style={{fontFamily:"'Outfit',sans-serif"}}>
                <span>👤</span> Registered Users
                <span className={`text-xs font-normal px-2 py-0.5 rounded-lg ml-1 ${dk?'bg-gray-700 text-gray-300':'bg-indigo-50 text-indigo-600'}`}>
                  paste email into <code>assigned_email</code> column
                </span>
              </h3>
              <span className={`text-xs px-2 py-1 rounded-lg font-medium ${dk?'bg-gray-700 text-gray-300':'bg-gray-100 text-gray-500'}`}>
                {users.filter(u=>u.id!=='__dev__'&&u.role!=='admin').length} user{users.filter(u=>u.id!=='__dev__'&&u.role!=='admin').length!==1?'s':''} available
              </span>
            </div>
            {users.filter(u=>u.id!=='__dev__'&&u.role!=='admin').length===0 ? (
              <p className={`text-sm italic ${sub}`}>No users found. Add users in the Team settings first.</p>
            ) : (
              <div className="overflow-x-auto">
                <table className="w-full text-xs">
                  <thead>
                    <tr className={`${dk?'bg-gray-700/60 text-gray-400':'bg-gray-50 text-gray-500'} text-xs uppercase tracking-wide font-semibold`}>
                      <th className="px-3 py-2 text-left">Name</th>
                      <th className="px-3 py-2 text-left">Email (copy → paste into assigned_email)</th>
                      <th className="px-3 py-2 text-left">Role</th>
                      <th className="px-3 py-2 text-left">Plant</th>
                    </tr>
                  </thead>
                  <tbody className={`divide-y ${dk?'divide-gray-700':'divide-gray-100'}`}>
                    {users
                      .filter(u=>u.id!=='__dev__'&&u.role!=='admin')
                      .sort((a,b)=>a.name.localeCompare(b.name))
                      .map(u=>{
                        const plant=plants.find(p=>p.id===u.plantId);
                        const roleLabel={plant_head:'Plant Head',user:'Team Member',top_management:'Top Mgmt'}[u.role]||u.role;
                        const roleBg={plant_head:dk?'bg-purple-900/40 text-purple-300':'bg-purple-100 text-purple-700',user:dk?'bg-blue-900/40 text-blue-300':'bg-blue-100 text-blue-700',top_management:dk?'bg-amber-900/40 text-amber-300':'bg-amber-100 text-amber-700'}[u.role]||'';
                        return (
                          <tr key={u.id} className={dk?'hover:bg-gray-700/40':'hover:bg-gray-50'}>
                            <td className="px-3 py-2.5">
                              <div className="flex items-center gap-2">
                                <div className="w-7 h-7 rounded-full flex items-center justify-center text-white text-xs font-bold flex-shrink-0" style={{background:'var(--p600)'}}>
                                  {u.name?.[0]?.toUpperCase()||'?'}
                                </div>
                                <span className="font-medium">{u.name}</span>
                              </div>
                            </td>
                            <td className="px-3 py-2.5">
                              <code
                                className="text-xs px-2 py-1 rounded cursor-pointer font-mono"
                                style={{background:'var(--p50,#eef2ff)',color:'var(--p700)',border:'1px solid var(--p200,#c7d2fe)'}}
                                title="Click to select, then Ctrl+C to copy"
                                onClick={e=>{const r=document.createRange();r.selectNode(e.currentTarget);window.getSelection().removeAllRanges();window.getSelection().addRange(r);}}
                              >
                                {u.email}
                              </code>
                            </td>
                            <td className="px-3 py-2.5">
                              <span className={`px-2 py-0.5 rounded-full text-xs font-semibold ${roleBg}`}>{roleLabel}</span>
                            </td>
                            <td className={`px-3 py-2.5 ${sub}`}>{plant?.name||'—'}</td>
                          </tr>
                        );
                      })
                    }
                  </tbody>
                </table>
              </div>
            )}
            <p className={`text-xs mt-3 pt-3 border-t ${dk?'border-gray-700 text-gray-400':'border-gray-100 text-gray-400'}`}>
              💡 <strong>Tip:</strong> Click any email to select it, then Ctrl+C to copy. Paste it directly into the <code>assigned_email</code> column. Email must match exactly — and the user must already exist in the system before importing.
            </p>
          </div>
        </div>
      )}

      {/* ── TAB: PREVIEW ── */}
      {tab==='preview' && (
        <div className="space-y-4">
          {/* Summary strip */}
          <div className="grid grid-cols-2 sm:grid-cols-5 gap-3">
            {[
              { label:'Total Rows',     value:rawRows.length,    color:'#6366f1', icon:'📄' },
              { label:'Valid',          value:validCount,         color:'#22c55e', icon:'✅' },
              { label:'Errors',         value:invalidCount,       color:'#ef4444', icon:'❌' },
              { label:'Multi-Plant',    value:multiPlantCount,    color:'#8b5cf6', icon:'🏭' },
              { label:'Selected',       value:selectedValid,      color:'#f59e0b', icon:'☑️' },
            ].map(s=>(
              <div key={s.label} className={`${card} p-4 flex items-center gap-3`}>
                <span className="text-2xl">{s.icon}</span>
                <div>
                  <p className="text-2xl font-bold" style={{color:s.color}}>{s.value}</p>
                  <p className={`text-xs ${sub}`}>{s.label}</p>
                </div>
              </div>
            ))}
          </div>

          {/* ── Unmatched email warnings (soft — rows still valid) ── */}
          {rawRows.some(r=>r._assignedEmailRaw) && (
            <div className={`${card} p-4`}>
              <h4 className="font-semibold text-amber-500 mb-2 flex items-center gap-2">
                ⚠️ Unrecognised Assigned Emails ({rawRows.filter(r=>r._assignedEmailRaw).length} row{rawRows.filter(r=>r._assignedEmailRaw).length!==1?'s':''})
              </h4>
              <p className={`text-xs mb-2 ${dk?'text-gray-400':'text-gray-500'}`}>
                These rows are still <strong>valid and will import</strong> — they will be left <em>Unassigned</em> because the email below was not found in the system. You can assign them manually after import, or add those users first and re-upload.
              </p>
              <div className="space-y-1.5 max-h-32 overflow-y-auto">
                {rawRows.filter(r=>r._assignedEmailRaw).map((r,i)=>(
                  <div key={i} className={`text-xs p-2 rounded-lg flex items-center gap-2 ${dk?'bg-amber-900/20 border border-amber-800 text-amber-300':'bg-amber-50 border border-amber-200 text-amber-700'}`}>
                    <span>Row {r._rowNum}:</span>
                    <strong>{r.title}</strong>
                    <span className="ml-auto font-mono">{r._assignedEmailRaw}</span>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Validation errors */}
          {errors.length > 0 && (
            <div className={`${card} p-4`}>
              <h4 className="font-semibold text-red-500 mb-2 flex items-center gap-2">❌ Validation Errors ({errors.length} rows)</h4>
              <div className="space-y-1.5 max-h-36 overflow-y-auto">
                {errors.map((e,i)=>(
                  <div key={i} className={`text-xs p-2 rounded-lg ${dk?'bg-red-900/20 border border-red-800 text-red-300':'bg-red-50 border border-red-200 text-red-600'}`}>
                    <strong>Row {e.row}:</strong> {e.errs.join(' · ')}
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Filters + actions */}
          <div className={`${card} p-4 flex flex-wrap items-center gap-3`}>
            <select value={filterState} onChange={e=>{setFilterState(e.target.value);setFilterPlant('');}} className={`${selectCls} max-w-[180px]`}>
              <option value="">All States ({uniqueStates.length})</option>
              {uniqueStates.map(s=><option key={s} value={s}>📍 {s}</option>)}
            </select>
            <select value={filterPlant} onChange={e=>setFilterPlant(e.target.value)} className={`${selectCls} max-w-[180px]`}>
              <option value="">All Plants</option>
              {uniquePlants.map(pid=>{ const p=plants.find(x=>x.id===pid); return p ? <option key={pid} value={pid}>🏭 {p.name}</option>:null; })}
            </select>
            <span className={`text-xs ${sub}`}>Showing {visibleRows.length} of {rawRows.length}</span>
            <div className="ml-auto flex gap-2">
              <button onClick={()=>{ setRawRows([]); setErrors([]); setSelRows(new Set()); setTab('upload'); }}
                className={`px-3 py-2 rounded-xl text-sm border font-medium transition-colors ${dk?'border-gray-600 hover:bg-gray-700 text-gray-300':'border-gray-200 hover:bg-gray-50 text-gray-700'}`}>
                ← Re-upload
              </button>
              <button onClick={importSelected} disabled={importing || selectedValid===0}
                className="px-5 py-2 text-white rounded-xl text-sm font-semibold disabled:opacity-50 transition-colors flex items-center gap-2" style={{background:"var(--p600)"}}>
                {importing ? `⏳ Importing… ${importProgress}%` : `⬆️ Import ${selectedValid} Requirement${selectedValid!==1?'s':''}`}
              </button>
            </div>
          </div>
          {importing && (
            <div className={`rounded-2xl border shadow-sm p-4 ${dk?'bg-gray-800 border-gray-700':'bg-white border-gray-200'}`}>
              <div className="flex items-center justify-between mb-2">
                <span className={`text-xs font-semibold ${dk?'text-gray-300':'text-gray-700'}`}>📤 Importing requirements…</span>
                <span className="text-xs font-bold" style={{color:'var(--p600)'}}>{importProgress}%</span>
              </div>
              <div className={`w-full h-3 rounded-full overflow-hidden ${dk?'bg-gray-700':'bg-gray-100'}`}>
                <div className="h-full rounded-full transition-all duration-200"
                  style={{width:`${importProgress}%`,background:'linear-gradient(90deg,var(--p500),var(--p400))'}} />
              </div>
              <p className={`text-xs mt-2 ${dk?'text-gray-400':'text-gray-500'}`}>
                Writing {selectedValid} record{selectedValid!==1?'s':''} to the database…
              </p>
            </div>
          )}

          {/* Preview table */}
          <div className={`${card} overflow-hidden`}>
            <div className="overflow-x-auto">
              <table className="w-full text-xs">
                <thead>
                  <tr className={`${dk?'bg-gray-700/60 text-gray-400':'bg-gray-50 text-gray-500'} text-xs uppercase tracking-wide font-semibold`}>
                    <th className="px-3 py-3 text-left">
                      <input type="checkbox"
                        checked={visibleRows.filter(r=>r._valid).length>0 && visibleRows.filter(r=>r._valid).every(r=>selRows.has(r._rowNum))}
                        onChange={toggleAll} className="rounded" />
                    </th>
                    {['Row','Title','Plant','State','Category','Priority','Status','Due Date','Compliance Freq','Next Due Date','Reminder','Assigned To','⚖️ Rule','🏭 Multi','Valid'].map(h=>(
                      <th key={h} className={`px-3 py-3 text-left whitespace-nowrap${h==='Next Due Date'?' text-blue-500':''}`}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody className={`divide-y ${dk?'divide-gray-700':'divide-gray-100'}`}>
                  {visibleRows.length === 0 && (
                    <tr><td colSpan={16} className="text-center py-10 text-gray-400">No rows match filters</td></tr>
                  )}
                  {visibleRows.map(row => {
                    const isSelected = selRows.has(row._rowNum);
                    const assignee   = users.find(u=>u.id===row._assignedTo);
                    return (
                      <tr key={row._rowNum}
                        className={`transition-colors ${isSelected&&row._valid?(dk?'bg-gray-700/30':'bg-gray-100/80'):''}
                          ${dk?'hover:bg-gray-700/50':'hover:bg-slate-50'} ${!row._valid?'opacity-60':''}`}>
                        <td className="px-3 py-2">
                          <input type="checkbox" checked={isSelected && row._valid} disabled={!row._valid}
                            onChange={()=>toggleRow(row._rowNum)} className="rounded" />
                        </td>
                        <td className={`px-3 py-2 font-mono ${sub}`}>{row._rowNum}</td>
                        <td className="px-3 py-2 font-medium max-w-[160px]">
                          <p className="truncate" title={row.title}>{row.title}</p>
                        </td>
                        <td className={`px-3 py-2 ${sub} whitespace-nowrap`}>{row._plant?.name || <span className="text-red-400">⚠️ Unknown</span>}</td>
                        <td className={`px-3 py-2 ${sub} whitespace-nowrap`}>
                          {row.state ? <span className="flex items-center gap-1">📍{row.state}</span> : <span className="text-red-400">—</span>}
                        </td>
                        <td className={`px-3 py-2 ${sub}`}>{row.category}</td>
                        <td className="px-3 py-2"><Badge label={row.priority} color={PRIORITY_CLR[row.priority]||'#6366f1'} /></td>
                        <td className="px-3 py-2"><Badge label={row.status}   color={STATUS_CLR[row.status]  ||'#6366f1'} /></td>
                        <td className={`px-3 py-2 ${sub} whitespace-nowrap`}>{row.dueDate||'—'}</td>
                        <td className="px-3 py-2 whitespace-nowrap">
                          <span className={`px-2 py-0.5 rounded-full text-xs font-semibold ${dk?'bg-indigo-900/40 text-indigo-300':'bg-indigo-50 text-indigo-700'}`}>
                            {(COMPLIANCE_FREQS.find(f=>f.value===row.complianceFrequency)||{label:row.complianceFrequency||'annual'}).label}
                          </span>
                        </td>
                        <td className="px-3 py-2 whitespace-nowrap">
                          {(() => {
                            const autoDate = computeNextDueDate(row.dueDate, row.complianceFrequency||'annual');
                            const customDate = customNextDue[row._rowNum];
                            const displayDate = customDate || autoDate;
                            const isOneTime = !row.complianceFrequency || row.complianceFrequency === 'one_time';
                            if (isOneTime) return <span className={`text-xs ${sub}`}>—</span>;
                            if (editingNextDue === row._rowNum) {
                              return (
                                <div style={{display:'flex',alignItems:'center',gap:4}}>
                                  <input type="date" defaultValue={displayDate||''}
                                    onBlur={e => {
                                      const val = e.target.value;
                                      setCustomNextDue(prev => ({ ...prev, [row._rowNum]: val || autoDate }));
                                      setEditingNextDue(null);
                                    }}
                                    onKeyDown={e => {
                                      if (e.key==='Enter') e.target.blur();
                                      if (e.key==='Escape') { setEditingNextDue(null); }
                                    }}
                                    autoFocus
                                    style={{fontSize:11,padding:'2px 6px',borderRadius:6,border:'1px solid var(--p400)',outline:'none',width:120,background:dk?'#1f2937':'#fff',color:dk?'#f3f4f6':'#111827'}} />
                                  <button onClick={()=>setEditingNextDue(null)}
                                    style={{fontSize:10,color:'#9ca3af',cursor:'pointer',background:'none',border:'none',padding:0}}>✕</button>
                                </div>
                              );
                            }
                            return (
                              <div style={{display:'flex',alignItems:'center',gap:4}}>
                                <span style={{fontSize:11,color:customDate?'var(--p600)':dk?'#60a5fa':'#2563eb',fontWeight:customDate?700:600}}>
                                  🔄 {displayDate ? new Date(displayDate+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}) : '—'}
                                </span>
                                {customDate && (
                                  <span style={{fontSize:9,background:'rgba(99,102,241,0.15)',color:'var(--p600)',borderRadius:4,padding:'1px 4px',fontWeight:700}}>custom</span>
                                )}
                                <button
                                  title={customDate ? 'Edit custom next due date' : `Auto from frequency: ${displayDate||'—'}. Click to customize.`}
                                  onClick={()=>setEditingNextDue(row._rowNum)}
                                  style={{fontSize:10,padding:'1px 5px',borderRadius:5,border:`1px solid ${dk?'#374151':'#e2e8f0'}`,background:dk?'#1f2937':'#f8fafc',color:dk?'#9ca3af':'#6b7280',cursor:'pointer',lineHeight:1.5}}>
                                  ✏️
                                </button>
                                {customDate && (
                                  <button
                                    title="Reset to auto-calculated date"
                                    onClick={()=>setCustomNextDue(prev=>{ const n={...prev}; delete n[row._rowNum]; return n; })}
                                    style={{fontSize:10,padding:'1px 5px',borderRadius:5,border:'1px solid rgba(239,68,68,0.3)',background:'rgba(239,68,68,0.07)',color:'#ef4444',cursor:'pointer',lineHeight:1.5}}>
                                    ↺
                                  </button>
                                )}
                              </div>
                            );
                          })()}
                        </td>
                        <td className={`px-3 py-2 ${sub} whitespace-nowrap`}>{row.reminderFrequency||'—'}</td>
                        <td className="px-3 py-2">
                          {assignee
                            ? <span className="text-[color:var(--p600)] font-medium text-xs">{assignee.name}</span>
                            : row._assignedEmailRaw
                              ? <span className="flex flex-col gap-0.5">
                                  <span className="text-amber-500 font-semibold text-xs">⚠️ {row._assignedEmailRaw}</span>
                                  <span className="text-gray-400" style={{fontSize:'10px'}}>not in system — imports unassigned</span>
                                </span>
                              : <span className={`text-xs ${sub}`}>Unassigned</span>
                          }
                        </td>
                        <td className="px-3 py-2 max-w-[160px]">
                          {row.applicableRule
                            ? <span className="text-[color:var(--p500)] text-xs truncate block" title={row.applicableRule}>⚖️ {row.applicableRule}</span>
                            : <span className={`text-xs ${sub}`}>—</span>}
                        </td>
                        <td className="px-3 py-2 text-center whitespace-nowrap">
                          {row._multiPlant
                            ? <span className={`inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold ${dk?'bg-purple-900/40 text-purple-300':'bg-purple-100 text-purple-700'}`}
                                title={`Expanded from multi-plant row — plant ${(row._multiIdx||0)+1} of ${row._multiTotal}`}>
                                🏭 {(row._multiIdx||0)+1}/{row._multiTotal}
                              </span>
                            : <span className={`text-[10px] ${dk?'text-gray-600':'text-gray-300'}`}>—</span>}
                        </td>
                        <td className="px-3 py-2 text-center">
                          {row._valid
                            ? <span className="text-green-500 font-bold text-sm">✓</span>
                            : <span className="text-red-500 font-bold text-sm" title={errors.find(e=>e.row===row._rowNum)?.errs?.join(', ')}>✗</span>}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      )}

      {/* ── TAB: HISTORY ── */}
      {tab==='history' && (
        <div className={`${card} overflow-hidden`}>
          {history.length === 0 ? (
            <div className="text-center py-16">
              <p className="text-4xl mb-3">🕓</p>
              <p className="font-semibold text-gray-500">No import history yet</p>
              <p className={`text-sm mt-1 ${sub}`}>Completed imports will appear here</p>
            </div>
          ) : (
            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead>
                  <tr className={`text-xs uppercase tracking-wide font-semibold ${dk?'bg-gray-700/60 text-gray-400':'bg-gray-50 text-gray-500'}`}>
                    {['Date / Time','Imported','Skipped','Plants Covered','States Covered','Total Rows'].map(h=>(
                      <th key={h} className="text-left px-4 py-3 whitespace-nowrap">{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody className={`divide-y ${dk?'divide-gray-700':'divide-gray-100'}`}>
                  {history.map(h=>(
                    <tr key={h.id} className={dk?'hover:bg-gray-700/50':'hover:bg-slate-50'}>
                      <td className={`px-4 py-3 text-xs ${sub} whitespace-nowrap`}>🕓 {h.date}</td>
                      <td className="px-4 py-3"><Badge label={`${h.imported} imported`} color="#22c55e" /></td>
                      <td className="px-4 py-3"><Badge label={`${h.skipped} skipped`}  color={h.skipped>0?'#ef4444':'#9ca3af'} /></td>
                      <td className={`px-4 py-3 text-xs ${sub} max-w-[180px] truncate`} title={h.plants}>{h.plants||'—'}</td>
                      <td className={`px-4 py-3 text-xs ${sub} max-w-[160px] truncate`} title={h.states}>{h.states||'—'}</td>
                      <td className={`px-4 py-3 text-xs font-semibold`}>{h.total}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

/* ═══════════════════════════════════════════
   ADMIN – CATEGORIES
═══════════════════════════════════════════ */
function AdminCategories({ dk, categories, updateCategories }) {
  const [cats,     setCats]     = useState(categories);
  const [newCat,   setNewCat]   = useState('');
  const [editIdx,  setEditIdx]  = useState(null);
  const [editVal,  setEditVal]  = useState('');
  const [delIdx,   setDelIdx]   = useState(null);
  const [toast,    setToast]    = useState(null);

  // Keep local state in sync if parent changes
  useEffect(()=>{ setCats(categories); }, [categories]);

  const showToast = (msg, type='success') => {
    setToast({msg, type});
    setTimeout(()=>setToast(null), 3000);
  };

  const save = (updated) => {
    setCats(updated);
    CATEGORIES = updated; // update global
    localStorage.setItem('categories', JSON.stringify(updated));
    updateCategories(updated);
  };

  const addCat = () => {
    const trimmed = newCat.trim();
    if (!trimmed) return;
    if (cats.map(c=>c.toLowerCase()).includes(trimmed.toLowerCase())) {
      showToast('Category already exists', 'error'); return;
    }
    save([...cats, trimmed]);
    setNewCat('');
    showToast(`"${trimmed}" added`);
  };

  const startEdit = (i) => { setEditIdx(i); setEditVal(cats[i]); };

  const saveEdit = () => {
    const trimmed = editVal.trim();
    if (!trimmed) return;
    if (cats.map((c,i)=>i!==editIdx?c.toLowerCase():null).filter(Boolean).includes(trimmed.toLowerCase())) {
      showToast('Category name already exists', 'error'); return;
    }
    const updated = cats.map((c,i)=>i===editIdx?trimmed:c);
    save(updated);
    setEditIdx(null);
    showToast(`Updated to "${trimmed}"`);
  };

  const confirmDel = () => {
    const removed = cats[delIdx];
    save(cats.filter((_,i)=>i!==delIdx));
    setDelIdx(null);
    showToast(`"${removed}" deleted`);
  };

  const moveUp = (i) => {
    if (i===0) return;
    const updated = [...cats];
    [updated[i-1],updated[i]]=[updated[i],updated[i-1]];
    save(updated);
  };
  const moveDown = (i) => {
    if (i===cats.length-1) return;
    const updated = [...cats];
    [updated[i+1],updated[i]]=[updated[i],updated[i+1]];
    save(updated);
  };

  const card = `rounded-2xl border shadow-sm ${dk?'bg-gray-800 border-gray-700':'bg-white border-gray-200'}`;
  const sub  = dk?'text-gray-400':'text-gray-500';
  const COLORS_POOL = ['#6366f1','#22c55e','#f59e0b','#ef4444','#8b5cf6','#06b6d4','#ec4899','#14b8a6','#f97316','#84cc16','#0ea5e9','#a855f7'];

  return (
    <div className="space-y-5">
      <ConfirmModal
        open={delIdx!==null}
        message={delIdx!==null ? `Delete category "${cats[delIdx]}"? Requirements using it will retain the label but it won't appear in new dropdowns.` : ''}
        onConfirm={confirmDel}
        onCancel={()=>setDelIdx(null)}
      />

      {/* Toast */}
      {toast && (
        <div className={`fixed top-5 right-5 z-[100] px-5 py-3 rounded-xl shadow-xl text-sm font-semibold flex items-center gap-2 transition-all
          ${toast.type==='error'?'bg-red-500 text-white':'bg-green-500 text-white'}`}>
          {toast.type==='error'?'❌':'✅'} {toast.msg}
        </div>
      )}

      {/* Info banner */}
      <div className={`p-4 rounded-2xl border flex items-start gap-3 ${dk?'border-gray-700':'border-gray-100'}`}>
        <span className="text-xl mt-0.5">🏷️</span>
        <div>
          <p className="text-sm font-semibold text-[color:var(--p600)] dark:text-[color:var(--p400)]">Compliance Categories</p>
          <p className={`text-xs mt-0.5 ${sub}`}>Categories are used to classify requirements across all plants. Changes apply immediately to all dropdowns. Existing requirements retain their category label.</p>
        </div>
      </div>

      {/* Add new category */}
      <div className={`${card} p-5`}>
        <h3 className="font-semibold text-sm mb-3" style={{fontFamily:"'Outfit',sans-serif"}}>Add New Category</h3>
        <div className="flex gap-3">
          <input
            value={newCat}
            onChange={e=>setNewCat(e.target.value)}
            onKeyDown={e=>e.key==='Enter'&&addCat()}
            placeholder="e.g. Water Management, ISO Compliance…"
            className={`${inputCls} flex-1`}
          />
          <button
            onClick={addCat}
            disabled={!newCat.trim()}
            className="px-5 py-2.5 text-white rounded-xl text-sm font-semibold disabled:opacity-40 transition-colors flex-shrink-0" style={{background:"var(--p600)"}}
          >
            + Add
          </button>
        </div>
      </div>

      {/* Categories list */}
      <div className={`${card} overflow-hidden`}>
        <div className="px-5 py-4 border-b border-gray-100 dark:border-gray-700 flex items-center justify-between">
          <div>
            <h3 className="font-semibold text-sm" style={{fontFamily:"'Outfit',sans-serif"}}>All Categories</h3>
            <p className={`text-xs mt-0.5 ${sub}`}>{cats.length} categor{cats.length===1?'y':'ies'} · drag order affects chart display</p>
          </div>
        </div>

        {cats.length === 0 ? (
          <div className="text-center py-16">
            <p className="text-4xl mb-3">📂</p>
            <p className="font-semibold text-gray-500">No categories yet</p>
            <p className={`text-sm mt-1 ${sub}`}>Add your first category above</p>
          </div>
        ) : (
          <div className="divide-y divide-gray-100 dark:divide-gray-700">
            {cats.map((cat, i) => (
              <div key={i} className={`flex items-center gap-3 px-5 py-3.5 transition-colors ${dk?'hover:bg-gray-700/40':'hover:bg-gray-50'}`}>
                {/* Color dot */}
                <div className="w-3 h-3 rounded-full flex-shrink-0" style={{background: COLORS_POOL[i % COLORS_POOL.length]}} />

                {/* Order controls */}
                <div className="flex flex-col gap-0.5">
                  <button onClick={()=>moveUp(i)} disabled={i===0}
                    className={`text-xs leading-none px-1 rounded transition-colors ${i===0?'opacity-20 cursor-not-allowed':dk?'hover:bg-gray-600 text-gray-300':'hover:bg-gray-200 text-gray-500'}`}>▲</button>
                  <button onClick={()=>moveDown(i)} disabled={i===cats.length-1}
                    className={`text-xs leading-none px-1 rounded transition-colors ${i===cats.length-1?'opacity-20 cursor-not-allowed':dk?'hover:bg-gray-600 text-gray-300':'hover:bg-gray-200 text-gray-500'}`}>▼</button>
                </div>

                {/* Index badge */}
                <span className={`text-xs w-5 text-center font-mono ${sub}`}>{i+1}</span>

                {/* Edit inline or display */}
                {editIdx === i ? (
                  <div className="flex items-center gap-2 flex-1">
                    <input
                      value={editVal}
                      onChange={e=>setEditVal(e.target.value)}
                      onKeyDown={e=>{ if(e.key==='Enter') saveEdit(); if(e.key==='Escape') setEditIdx(null); }}
                      autoFocus
                      className={`${inputCls} flex-1 py-1.5 text-sm`}
                    />
                    <button onClick={saveEdit} className="px-3 py-1.5 text-white rounded-lg text-xs font-semibold transition-colors" style={{background:"var(--p600)"}}>Save</button>
                    <button onClick={()=>setEditIdx(null)} className={`px-3 py-1.5 rounded-lg text-xs border transition-colors ${dk?'border-gray-600 text-gray-300 hover:bg-gray-700':'border-gray-200 text-gray-600 hover:bg-gray-50'}`}>Cancel</button>
                  </div>
                ) : (
                  <>
                    <span className="flex-1 text-sm font-medium">{cat}</span>
                    <div className="flex items-center gap-1 flex-shrink-0">
                      <button onClick={()=>startEdit(i)}
                        className={`p-1.5 rounded-lg text-xs transition-colors ${dk?'hover:bg-amber-900/30 text-amber-400':'hover:bg-amber-50 text-amber-600'}`} title="Edit">✏️</button>
                      <button onClick={()=>setDelIdx(i)}
                        className={`p-1.5 rounded-lg text-xs transition-colors ${dk?'hover:bg-red-900/30 text-red-400':'hover:bg-red-50 text-red-500'}`} title="Delete">🗑️</button>
                    </div>
                  </>
                )}
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════
   EMAIL LOG — Cloud Notification History
═══════════════════════════════════════════ */
function EmailLogPage({ dk }) {
  const EMAIL_TYPES = [
    { id: 'digest',    label: 'Daily Digest',     icon: '📋', color: '#4f46e5' },
    { id: 'reminders', label: 'Reminders',         icon: '⏰', color: '#f59e0b' },
    { id: 'overdue',   label: 'Overdue Alert',     icon: '🚨', color: '#ef4444' },
    { id: 'weekly',    label: 'Weekly Summary',    icon: '📊', color: '#10b981' },
    { id: 'monthly',   label: 'Monthly Report',    icon: '📅', color: '#8b5cf6' },
  ];

  const [logs,       setLogs]       = React.useState({});   // { digest: {lastSentDate, lastSentAt}, ... }
  const [loading,    setLoading]    = React.useState(true);
  const [refreshing, setRefreshing] = React.useState(false);
  const [manualLogs, setManualLogs] = React.useState([]);   // persisted in Firestore
  const [settings,   setSettingsLocal] = React.useState(null);

  // ── Read settings for cloud fn URL / schedule times ──
  React.useEffect(() => {
    try {
      const raw = localStorage.getItem('adminSettings');
      if (raw) setSettingsLocal(JSON.parse(raw));
    } catch(_) {}
  }, []);

  // ── Load sentLog docs from Firestore ──
  const loadLogs = React.useCallback(async (quiet = false) => {
    if (!quiet) setLoading(true);
    else        setRefreshing(true);
    try {
      const promises = EMAIL_TYPES.map(async ({ id }) => {
        try {
          const snap = await window.db.collection('legalcomp_settings').doc('sentLog_' + id).get();
          return [id, snap.exists ? snap.data() : null];
        } catch(_) { return [id, null]; }
      });
      const results = await Promise.all(promises);
      const map = {};
      results.forEach(([id, data]) => { map[id] = data; });
      setLogs(map);

      // Also load manual trigger log if it exists
      try {
        const mSnap = await window.db.collection('legalcomp_settings').doc('manualTriggerLog').get();
        if (mSnap.exists) setManualLogs(mSnap.data().entries || []);
      } catch(_) {}
    } catch(e) {
      console.warn('EmailLog: load error', e);
    }
    setLoading(false);
    setRefreshing(false);
  }, []);

  React.useEffect(() => { loadLogs(); }, [loadLogs]);

  // ── Trigger a type now (calls cloud function) ──
  const [trigStatus, setTrigStatus] = React.useState({});
  const triggerNow = async (type) => {
    const cfg = settings;
    if (!cfg?.cloudFnUrl || !cfg?.cloudFnSecret) {
      setTrigStatus(s => ({ ...s, [type]: { status: 'error', msg: 'Cloud Function URL / secret not configured in Settings.' } }));
      setTimeout(() => setTrigStatus(s => { const n = {...s}; delete n[type]; return n; }), 5000);
      return;
    }
    setTrigStatus(s => ({ ...s, [type]: { status: 'sending' } }));
    try {
      const endpoint = cfg.cloudFnUrl.replace(/\/$/, '');
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-internal-secret': cfg.cloudFnSecret },
        body: JSON.stringify({ type, force: true }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);

      // Log this manual trigger to Firestore
      const entry = {
        type,
        sentAt: Date.now(),
        sentBy: 'admin (manual)',
        sent: data.sent || 0,
        errors: (data.errors || []).length,
      };
      const prevSnap = await window.db.collection('legalcomp_settings').doc('manualTriggerLog').get();
      const prev = prevSnap.exists ? (prevSnap.data().entries || []) : [];
      const updated = [entry, ...prev].slice(0, 50); // keep last 50
      await window.db.collection('legalcomp_settings').doc('manualTriggerLog').set({ entries: updated }, { merge: true });
      setManualLogs(updated);

      setTrigStatus(s => ({ ...s, [type]: { status: 'success', msg: `✅ Sent ${data.sent || 0} email(s)` } }));
      setTimeout(() => loadLogs(true), 2000);
    } catch(e) {
      setTrigStatus(s => ({ ...s, [type]: { status: 'error', msg: '❌ ' + (e?.message || String(e)) } }));
    }
    setTimeout(() => setTrigStatus(s => { const n = {...s}; delete n[type]; return n; }), 8000);
  };

  // ── Helpers ──
  const fmtTs = (ts) => {
    if (!ts) return '—';
    const d = new Date(typeof ts === 'number' ? ts : Number(ts));
    if (isNaN(d)) return '—';
    return d.toLocaleString('en-IN', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
  };
  const todayIST = () => {
    return new Date(Date.now() + 5.5*60*60*1000).toISOString().slice(0,10);
  };

  const card  = `rounded-2xl border shadow-sm ${dk?'bg-gray-800 border-gray-700':'bg-white border-gray-200'}`;
  const sub   = dk ? 'text-gray-400' : 'text-gray-500';
  const today = todayIST();

  if (loading) {
    return (
      <div className="flex items-center justify-center py-20">
        <div className="text-center space-y-3">
          <div className="text-4xl animate-pulse">📨</div>
          <p className={`text-sm ${sub}`}>Loading email log…</p>
        </div>
      </div>
    );
  }

  const cloudConfigured = !!(settings?.cloudFnUrl && settings?.cloudFnSecret);
  const sentToday = EMAIL_TYPES.filter(t => logs[t.id]?.lastSentDate === today).length;
  const totalTypes = EMAIL_TYPES.length;

  return (
    <div className="space-y-6 max-w-4xl">

      {/* ── Header ── */}
      <div className="flex items-center justify-between gap-4 flex-wrap">
        <div>
          <h2 className="text-xl font-bold">📨 Cloud Email Notifications Log</h2>
          <p className={`text-sm mt-0.5 ${sub}`}>Track which emails were sent by the cloud function today and trigger them manually.</p>
        </div>
        <button onClick={() => loadLogs(true)} disabled={refreshing}
          className={`flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-semibold border transition-colors ${dk?'border-gray-600 hover:bg-gray-700':'border-gray-200 hover:bg-gray-50'} disabled:opacity-50`}>
          <span className={refreshing ? 'animate-spin' : ''}>🔄</span>
          {refreshing ? 'Refreshing…' : 'Refresh'}
        </button>
      </div>

      {/* ── Config warning ── */}
      {!cloudConfigured && (
        <div className={`flex gap-3 p-4 rounded-xl border text-sm ${dk?'bg-amber-900/20 border-amber-700/40 text-amber-300':'bg-amber-50 border-amber-200 text-amber-800'}`}>
          <span className="text-xl flex-shrink-0">⚠️</span>
          <div>
            <p className="font-semibold">Cloud Function not configured</p>
            <p className="text-xs mt-0.5 opacity-80">Go to <strong>Settings → Cloud Auto-Reminders</strong> to set your Cloud Function URL and secret. Once configured, this page will show live send status and allow manual triggers.</p>
          </div>
        </div>
      )}

      {/* ── Summary strip ── */}
      <div className={`${card} p-5`}>
        <div className="flex items-center gap-4 flex-wrap">
          <div className="text-center min-w-[60px]">
            <p className="text-3xl font-extrabold" style={{color:'#4f46e5'}}>{sentToday}</p>
            <p className={`text-xs uppercase tracking-wide mt-0.5 ${sub}`}>Sent Today</p>
          </div>
          <div className={`w-px h-10 ${dk?'bg-gray-600':'bg-gray-200'}`} />
          <div className="text-center min-w-[60px]">
            <p className="text-3xl font-extrabold" style={{color:'#10b981'}}>{totalTypes - sentToday}</p>
            <p className={`text-xs uppercase tracking-wide mt-0.5 ${sub}`}>Pending</p>
          </div>
          <div className={`w-px h-10 ${dk?'bg-gray-600':'bg-gray-200'}`} />
          <div className="text-center min-w-[60px]">
            <p className="text-3xl font-extrabold" style={{color:'#f59e0b'}}>{manualLogs.length}</p>
            <p className={`text-xs uppercase tracking-wide mt-0.5 ${sub}`}>Manual Triggers</p>
          </div>
          <div className="flex-1" />
          <span className={`text-xs px-3 py-1.5 rounded-full font-semibold ${cloudConfigured?'bg-green-100 text-green-700':'bg-gray-100 text-gray-500'}`}>
            {cloudConfigured ? '🟢 Cloud Connected' : '⚫ Not Connected'}
          </span>
        </div>
      </div>

      {/* ── Email type cards ── */}
      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        {EMAIL_TYPES.map(({ id, label, icon, color }) => {
          const log = logs[id];
          const sentTodayFlag = log?.lastSentDate === today;
          const ts = log?.lastSentAt ? fmtTs(log.lastSentAt) : null;
          const tstat = trigStatus[id];
          const schedKey = { digest:'legalDigestTime', reminders:'legalReminderTime', overdue:'legalOverdueTime', weekly:'legalWeeklyTime', monthly:'legalMonthlyTime' }[id];
          const schedTime = settings?.[schedKey] || '—';

          return (
            <div key={id} className={`${card} p-5 flex flex-col gap-3`}>
              {/* Card header */}
              <div className="flex items-center justify-between">
                <div className="flex items-center gap-2">
                  <span className="text-2xl">{icon}</span>
                  <div>
                    <p className="font-semibold text-sm">{label}</p>
                    <p className={`text-xs ${sub}`}>Sched: {schedTime} IST</p>
                  </div>
                </div>
                <span className={`text-xs font-bold px-2 py-0.5 rounded-full ${sentTodayFlag?'bg-green-100 text-green-700':'bg-gray-100 text-gray-500'}`}>
                  {sentTodayFlag ? '✅ Sent' : '⬜ Pending'}
                </span>
              </div>

              {/* Last sent info */}
              <div className={`rounded-lg p-3 text-xs space-y-1 ${dk?'bg-gray-700/60':'bg-gray-50'}`}>
                <div className="flex justify-between">
                  <span className={sub}>Last sent</span>
                  <span className="font-medium">{ts || 'Never'}</span>
                </div>
                <div className="flex justify-between">
                  <span className={sub}>Date (IST)</span>
                  <span className="font-medium">{log?.lastSentDate || '—'}</span>
                </div>
              </div>

              {/* Trigger button */}
              {tstat ? (
                <div className={`text-xs font-medium rounded-lg p-2 text-center ${tstat.status==='sending'?'text-blue-600':'tstat.status==="success"?text-green-600:text-red-500'}`}
                  style={{color: tstat.status==='sending'?'#2563eb':tstat.status==='success'?'#059669':'#ef4444'}}>
                  {tstat.status === 'sending' ? '⏳ Sending…' : tstat.msg}
                </div>
              ) : (
                <button onClick={() => triggerNow(id)} disabled={!cloudConfigured}
                  className="w-full py-2 rounded-xl text-xs font-semibold text-white transition-colors disabled:opacity-40"
                  style={{background: cloudConfigured ? color : '#9ca3af'}}>
                  ▶ Send Now (force)
                </button>
              )}
            </div>
          );
        })}
      </div>

      {/* ── Manual trigger history ── */}
      <div className={card}>
        <div className={`px-5 py-4 border-b flex items-center gap-3 ${dk?'border-gray-700':'border-gray-100'}`}>
          <span className="text-lg">🕘</span>
          <div>
            <p className="font-semibold text-sm">Manual Trigger History</p>
            <p className={`text-xs ${sub}`}>Last 50 manual sends from this admin panel</p>
          </div>
        </div>
        {manualLogs.length === 0 ? (
          <div className="p-8 text-center">
            <p className="text-3xl mb-2">📭</p>
            <p className={`text-sm ${sub}`}>No manual triggers yet. Use the "Send Now" buttons above to trigger emails on demand.</p>
          </div>
        ) : (
          <div className="overflow-x-auto">

              <thead>
                <tr className={`text-xs uppercase tracking-wide ${dk?'bg-gray-700/50 text-gray-400':'bg-gray-50 text-gray-500'}`}>
                  <th className="px-4 py-3 text-left font-semibold">Type</th>
                  <th className="px-4 py-3 text-left font-semibold">Triggered At</th>
                  <th className="px-4 py-3 text-left font-semibold">Triggered By</th>
                  <th className="px-4 py-3 text-center font-semibold">Emails Sent</th>
                  <th className="px-4 py-3 text-center font-semibold">Errors</th>
                </tr>
              </thead>
              <tbody>
                {manualLogs.map((entry, i) => {
                  const typeInfo = EMAIL_TYPES.find(t => t.id === entry.type) || { icon: '📧', label: entry.type, color: '#6b7280' };
                  return (
                    <tr key={i} className={`border-t ${dk?'border-gray-700 hover:bg-gray-700/30':'border-gray-100 hover:bg-gray-50'}`}>
                      <td className="px-4 py-3">
                        <span className="flex items-center gap-2">
                          <span>{typeInfo.icon}</span>
                          <span className="font-medium text-xs" style={{color: typeInfo.color}}>{typeInfo.label}</span>
                        </span>
                      </td>
                      <td className={`px-4 py-3 text-xs ${sub}`}>{fmtTs(entry.sentAt)}</td>
                      <td className={`px-4 py-3 text-xs ${sub}`}>{entry.sentBy || 'admin'}</td>
                      <td className="px-4 py-3 text-center">
                        <span className={`text-xs font-bold px-2 py-0.5 rounded-full ${entry.sent>0?'bg-green-100 text-green-700':'bg-gray-100 text-gray-500'}`}>
                          {entry.sent ?? '—'}
                        </span>
                      </td>
                      <td className="px-4 py-3 text-center">
                        <span className={`text-xs font-bold px-2 py-0.5 rounded-full ${entry.errors>0?'bg-red-100 text-red-600':'bg-gray-100 text-gray-500'}`}>
                          {entry.errors ?? 0}
                        </span>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </div>

      {/* ── Dedup status note ── */}
      <div className={`flex gap-3 p-4 rounded-xl border text-xs ${dk?'bg-gray-700/40 border-gray-600 text-gray-400':'bg-gray-50 border-gray-200 text-gray-500'}`}>
        <span className="flex-shrink-0">ℹ️</span>
        <span>
          The cloud function uses <strong>dedup logic</strong>: each email type is sent at most once per IST calendar day (stored as <code>sentLog_*</code> in Firestore).
          "Send Now (force)" bypasses dedup and always sends immediately. The status badges above update live from Firestore.
        </span>
      </div>
    </div>
  );
}
