/**
 * useDailyDigestScheduler – React hook (v35: Cloud-aware).
 *
 * PRIMARY path  → Firebase Cloud Function (Office 365 SMTP via Nodemailer).
 *   Reminders fire 24/7 from Firebase's servers regardless of whether the
 *   browser tab is open.  The SPA simply saves settings to Firestore; the
 *   Cloud Function scheduler reads them and sends at the configured times.
 *
 * FALLBACK path → browser-side MS Graph send (original v34 behaviour).
 *   Only fires when the app IS open, as a safety net in case the Cloud
 *   Function webhook URL is not yet configured.
 *
 * Cloud Function webhook endpoint (set in Admin → Settings → Cloud Reminders):
 *   POST  <cloudFnUrl>
 *   Header: x-internal-secret: <cloudFnSecret>
 *   Body:   { "type": "digest" | "reminders" | "overdue" | "weekly" | "monthly" }
 */

/* ── Cloud Function trigger helper ── */
async function triggerCloudReminder(type) {
  try {
    const raw = localStorage.getItem('adminSettings');
    if (!raw) return { ok: false, reason: 'no settings' };
    const cfg = JSON.parse(raw);
    const url    = (cfg.cloudFnUrl    || '').trim();
    const secret = (cfg.cloudFnSecret || '').trim();
    if (!url) return { ok: false, reason: 'cloudFnUrl not configured' };

    const cfg2 = JSON.parse(raw);
    const res = await fetch(url, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-internal-secret': secret,
      },
      body: JSON.stringify({ type, smtpProvider: cfg2.smtpProvider || 'gmail' }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    console.log(`✅ Cloud reminder triggered [${type}]:`, data);
    return { ok: true, data };
  } catch(e) {
    console.warn(`⚠️ Cloud reminder trigger failed [${type}]:`, e?.message || e);
    return { ok: false, reason: e?.message || String(e) };
  }
}

function useDailyDigestScheduler(requirements, plants, users) {
  // Store latest data in refs so the interval closure always sees fresh values
  // without needing to be recreated on every state change (which would reset
  // the 60-second clock and risk missing the send window entirely).
  const reqRef   = useRef(requirements);
  const plantRef = useRef(plants);
  const userRef  = useRef(users);
  useEffect(() => { reqRef.current   = requirements; }, [requirements]);
  useEffect(() => { plantRef.current = plants;       }, [plants]);
  useEffect(() => { userRef.current  = users;        }, [users]);

  // Browser-based scheduling removed — Cloud Scheduler handles all email types
  // at their exact configured times via dedicated per-type jobs.
  // Each job POSTs { type: 'digest'|'reminders'|'overdue'|'weekly'|'monthly' }
  // directly to the Cloud Run service — no app needs to be open.
  console.log('[LegalComp] Email scheduling is fully cloud-based. No browser tab required.');
}

/* ═══════════════════════════════════════════
   ESCALATION LEVEL PANEL (reusable)
   – one panel per level; own draft-email state
═══════════════════════════════════════════ */
const ESC_LEVEL_COLORS = { 1:'#22c55e', 2:'#f59e0b', 3:'#ef4444' };
const ESC_LEVEL_LABELS = { 1:'Level 1 – Plant Head', 2:'Level 2 – Regional Manager', 3:'Level 3 – Top Management' };

function EscalationLevelPanel({ level, allEmails, onUpdate, dk, compact, wrapCls }) {
  const [draft, setDraft] = useState('');
  const [err, setErr]     = useState('');
  const emails  = (allEmails && allEmails[level]) ? allEmails[level] : [];
  const color   = ESC_LEVEL_COLORS[level];
  const label   = ESC_LEVEL_LABELS[level];
  const roleLabel = label.split('–')[1]?.trim() || 'escalation';

  const addEmail = () => {
    const trimmed = draft.trim().toLowerCase();
    if (!trimmed) return;
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(trimmed)) { setErr('Invalid email address'); return; }
    if (emails.includes(trimmed)) { setErr('Email already added'); return; }
    onUpdate({ ...allEmails, [level]: [...emails, trimmed] });
    setDraft(''); setErr('');
  };

  const removeEmail = (email) => {
    onUpdate({ ...allEmails, [level]: emails.filter(e => e !== email) });
  };

  return (
    <div className={wrapCls !== undefined ? wrapCls : 'sm:col-span-2'}>
      <div className={`rounded-xl border ${compact?'px-2.5 py-2':'p-3'} transition-all ${dk ? 'bg-gray-800 border-gray-600' : 'bg-gray-50 border-gray-200'}`}
        style={{ borderLeftWidth: '3px', borderLeftColor: color }}>
        {/* Header */}
        <div className={`flex items-center gap-2 ${compact?'mb-1.5':'mb-2'}`}>
          <span className="w-5 h-5 rounded-full flex items-center justify-center text-white text-xs font-bold flex-shrink-0"
            style={{ background: color }}>{level}</span>
          <span className="text-xs font-semibold" style={{ color }}>{label}</span>
          {emails.length > 0 && (
            <span className="ml-auto text-xs px-1.5 py-0.5 rounded-full font-medium"
              style={{ background: color + '22', color }}>
              {emails.length} recipient{emails.length > 1 ? 's' : ''}
            </span>
          )}
        </div>
        {/* Email tags */}
        {emails.length > 0 && (
          <div className={`flex flex-wrap gap-1.5 ${compact?'mb-1.5 max-h-14 overflow-y-auto':'mb-2'}`}>
            {emails.map(email => (
              <span key={email}
                className={`inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium border ${dk ? 'bg-gray-700 border-gray-500 text-gray-200' : 'bg-white border-gray-300 text-gray-700'}`}>
                ✉️ {email}
                <button type="button" onClick={() => removeEmail(email)}
                  className="ml-0.5 text-gray-400 hover:text-red-500 transition-colors font-bold leading-none text-sm">×</button>
              </span>
            ))}
          </div>
        )}
        {/* Add row */}
        <div className="flex gap-2">
          <input
            type="email"
            value={draft}
            onChange={e => { setDraft(e.target.value); setErr(''); }}
            onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); addEmail(); } }}
            placeholder={`Add ${roleLabel} email…`}
            className={`flex-1 min-w-0 px-3 ${compact?'py-1':'py-1.5'} rounded-lg border text-xs focus:outline-none focus:ring-2 transition
              ${err ? 'border-red-400 focus:ring-red-300' : 'border-gray-200 focus:ring-purple-400 dark:border-gray-600'}
              ${dk ? 'bg-gray-700 border-gray-600 text-white placeholder-gray-400' : 'bg-white text-gray-900 placeholder-gray-400'}`}
          />
          <button type="button" onClick={addEmail}
            className="px-3 py-1.5 rounded-lg text-xs font-semibold text-white transition-colors flex-shrink-0 hover:opacity-90"
            style={{ background: color }}>
            + Add
          </button>
        </div>
        {err && <p className="text-xs text-red-500 mt-1">{err}</p>}
      </div>
    </div>
  );
}

function RequirementModal({ open, onClose, onSave, initial, plants, users, dk, categories: catsProp }) {
  const cats = catsProp || CATEGORIES;
  const blank = { title:'', description:'', category: (catsProp||CATEGORIES)[0]||'', priority:'High', plantId:'', plantIds:[], assignedTo:[], status:'Pending', dueDate:'', completionDate:'', nextDueDate:'', complianceFrequency:'annual', reminderFrequency:'Weekly', escalationLevel:1, escalationEmail:'', escalationEmails:{ 1:[], 2:[], 3:[] }, applicableRule:'', legalClause:'' };
  const [form, setForm] = useState(blank);
  const [saving, setSaving] = useState(false);
  useEffect(()=>{
    const init = initial ? {
      ...initial,
      assignedTo: Array.isArray(initial.assignedTo) ? initial.assignedTo : (initial.assignedTo ? [initial.assignedTo] : []),
      // Normalise legacy single escalationEmail → escalationEmails map
      escalationEmails: initial.escalationEmails && typeof initial.escalationEmails === 'object'
        ? { 1: initial.escalationEmails[1]||[], 2: initial.escalationEmails[2]||[], 3: initial.escalationEmails[3]||[] }
        : (initial.escalationEmail
            ? { 1:[initial.escalationEmail], 2:[], 3:[] }
            : { 1:[], 2:[], 3:[] })
    } : blank;
    setForm(init);
  }, [open]);

  const plantUsers = users.filter(u=>u.plantId===form.plantId && ['user','plant_head','plant_admin'].includes(u.role));

  // Smart setter: auto-fills nextDueDate when status→Completed or completionDate changes
  const set = (k, v) => setForm(f => {
    const next = { ...f, [k]: v };
    const freq = next.complianceFrequency || 'annual';
    const isRecurring = freq && freq !== 'one_time';
    // Auto-fill nextDueDate when:
    //   a) status just flipped to Completed
    //   b) completionDate changed while status is Completed
    //   c) complianceFrequency changed while status is Completed
    // Only auto-fill if the admin hasn't manually entered a different date
    const autoFillTrigger = (k === 'status' && v === 'Completed') ||
                            (k === 'completionDate' && next.status === 'Completed') ||
                            (k === 'complianceFrequency' && next.status === 'Completed');
    if (autoFillTrigger && isRecurring) {
      const base = next.completionDate || next.dueDate;
      const computed = base ? computeNextDueDate(base, freq) : null;
      // Only auto-fill if nextDueDate is blank or was previously auto-computed
      // (i.e. don't overwrite a manually entered date unless the trigger is a freq change)
      if (computed && (!next.nextDueDate || k === 'complianceFrequency')) {
        next.nextDueDate = computed;
      }
    }
    // When status moves away from Completed, leave nextDueDate as-is (keep the date)
    return next;
  });

  const toggleUserAssign = (uid) => {
    const arr = Array.isArray(form.assignedTo) ? form.assignedTo : (form.assignedTo ? [form.assignedTo] : []);
    const idx = arr.indexOf(uid);
    set('assignedTo', idx >= 0 ? arr.filter(x=>x!==uid) : [...arr, uid]);
  };

  const save = async () => {
    // Determine plants: use plantIds if set, fall back to single plantId
    const selectedPlantIds = (form.plantIds && form.plantIds.length > 0) ? form.plantIds : (form.plantId ? [form.plantId] : []);
    if (!form.title || selectedPlantIds.length === 0 || !form.dueDate) return;
    setSaving(true);
    await new Promise(r=>setTimeout(r,400));
    onSave({ ...form, plantIds: selectedPlantIds, plantId: selectedPlantIds[0] || form.plantId });
    setSaving(false);
    onClose();
  };

  // Compact field styles for the full-screen form
  const ic  = inputCls.replace('py-2.5','py-1.5');
  const sc  = ic + ' cursor-pointer';
  const freqLabel = (COMPLIANCE_FREQS.find(f=>f.value===form.complianceFrequency)||{label:form.complianceFrequency||''}).label;
  const isRecurring = form.complianceFrequency && form.complianceFrequency !== 'one_time';
  const dlv = form.dueDate ? daysLeft(form.dueDate) : null;
  const sectionHead = (icon, text, clr) => (
    <div className="flex items-center gap-2 mb-2">
      <span className={`text-[11px] font-bold uppercase tracking-widest ${clr}`}>{icon} {text}</span>
      <div className="flex-1 h-px bg-gray-200 dark:bg-gray-600" />
    </div>
  );

  const footer = (
    <div className="flex items-center gap-3">
      {/* Status summary moved into footer so it never costs vertical space */}
      <div className="flex-1 min-w-0">
        {form.dueDate && (
          <p className={`text-xs font-semibold truncate ${
            form.status==='Completed'?'text-green-600':dlv<0?'text-red-500':dlv<=7?'text-amber-600':dk?'text-gray-300':'text-gray-600'}`}>
            {form.status==='Completed'
              ? `✅ Completed${form.completionDate ? ' on ' + formatDate(form.completionDate) : ''}`
              : dlv<0
                ? `🔴 Overdue by ${Math.abs(dlv)} day${Math.abs(dlv)!==1?'s':''} — still open`
                : dlv===0
                  ? '⚠️ Due today — still open'
                  : `${dlv<=7?'⚠️':'🟡'} Open — ${dlv} day${dlv!==1?'s':''} remaining`}
            {form.nextDueDate && isRecurring && (
              <span className={`font-normal ml-2 ${dk?'text-gray-400':'text-gray-500'}`}>Next cycle: {formatDate(form.nextDueDate)}</span>
            )}
          </p>
        )}
      </div>
      <button onClick={onClose} className={`px-6 py-2 rounded-xl border text-sm font-medium transition-colors ${dk?'border-gray-600 text-gray-300 hover:bg-gray-700':'border-gray-200 text-gray-700 hover:bg-gray-50'}`}>Cancel</button>
      <button onClick={save} disabled={saving||!form.title||!form.plantId||!form.dueDate}
        className="px-8 py-2 rounded-xl text-white text-sm font-semibold disabled:opacity-50 transition-colors" style={{background:"var(--p600)"}}>
        {saving?'Saving…':initial?'Update':'Add Requirement'}
      </button>
    </div>
  );

  return (
    <Modal open={open} onClose={onClose} title={initial?'Edit Requirement':'Add New Requirement'} full dk={dk} footer={footer}>
      <div className="grid grid-cols-1 lg:grid-cols-12 gap-x-6 gap-y-3">

        {/* ═════ LEFT: core details ═════ */}
        <div className="lg:col-span-7 grid grid-cols-2 md:grid-cols-4 gap-x-3 gap-y-2.5 content-start">
          <FormField compact label="Title" required className="col-span-2 md:col-span-4">
            <input value={form.title} onChange={e=>set('title',e.target.value)} placeholder="e.g. Factory License Renewal" className={ic} />
          </FormField>
          <FormField compact label="Description" className="col-span-2 md:col-span-4">
            <textarea value={form.description} onChange={e=>set('description',e.target.value)} rows={2} placeholder="Detailed description..." className={ic + ' resize-none'} />
          </FormField>

          <FormField compact label="Plant(s)" required className="col-span-2">
            <div className={`flex flex-wrap gap-1 p-1.5 rounded-xl border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-700`}>
              {plants.map(p => {
                const selected = (form.plantIds||[]).includes(p.id) || (form.plantId===p.id && !(form.plantIds||[]).length);
                return (
                  <button key={p.id} type="button"
                    onClick={() => {
                      const ids = form.plantIds && form.plantIds.length > 0 ? [...form.plantIds] : (form.plantId ? [form.plantId] : []);
                      const idx = ids.indexOf(p.id);
                      if (idx >= 0) { ids.splice(idx,1); } else { ids.push(p.id); }
                      set('plantIds', ids);
                      set('plantId', ids[0]||'');
                      set('assignedTo',[]);
                    }}
                    className={`px-2 py-0.5 rounded-md text-xs font-medium transition-all border ${selected ? 't-tag-active' : 'bg-gray-50 dark:bg-gray-600 text-gray-600 dark:text-gray-300 border-gray-200 dark:border-gray-500 hover:border-[color:var(--p400)]'}`}>
                    {p.name}
                  </button>
                );
              })}
            </div>
            {(form.plantIds||[]).length > 1 && (
              <p className="text-[11px] text-[color:var(--p500)] font-medium mt-0.5">📢 Will be created for {(form.plantIds||[]).length} plants</p>
            )}
          </FormField>
          <FormField compact label="Assign To (User/s)" className="col-span-2">
            {!form.plantId ? (
              <p className={`text-xs text-gray-400 italic px-3 py-1.5 rounded-xl border border-dashed ${dk?'border-gray-600':'border-gray-200'}`}>Select a plant first</p>
            ) : plantUsers.length === 0 ? (
              <p className={`text-xs text-gray-400 italic px-3 py-1.5 rounded-xl border border-dashed ${dk?'border-gray-600':'border-gray-200'}`}>No users in this plant</p>
            ) : (
              <div className={`flex flex-wrap gap-1 p-1.5 rounded-xl border max-h-20 overflow-y-auto ${dk?'border-gray-600 bg-gray-700':'border-gray-200 bg-white'}`}>
                {plantUsers.map(u => {
                  const assigned = Array.isArray(form.assignedTo) ? form.assignedTo : (form.assignedTo ? [form.assignedTo] : []);
                  const sel = assigned.includes(u.id);
                  return (
                    <button key={u.id} type="button"
                      onClick={() => toggleUserAssign(u.id)}
                      className={`inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-xs font-medium border transition-all ${sel ? 't-tag-active shadow-sm' : dk?'bg-gray-600 text-gray-200 border-gray-500 hover:border-[color:var(--p400)]':'bg-gray-50 text-gray-600 border-gray-200 hover:border-[color:var(--p400)]'}`}>
                      <span className={`w-4 h-4 rounded-full flex items-center justify-center text-[9px] font-bold ${sel?'text-white':'bg-gray-300 text-gray-600'}`}>{initials(u.name)}</span>
                      {u.name}
                      {sel && <span className="text-[color:var(--p200)]">✓</span>}
                    </button>
                  );
                })}
              </div>
            )}
            {Array.isArray(form.assignedTo) && form.assignedTo.length > 0 && (
              <p className="text-[11px] text-[color:var(--p500)] font-medium mt-0.5">👥 {form.assignedTo.length} user{form.assignedTo.length>1?'s':''} assigned</p>
            )}
          </FormField>

          <FormField compact label="Category" required>
            <select value={form.category} onChange={e=>set('category',e.target.value)} className={sc}>
              {cats.map(c=><option key={c}>{c}</option>)}
            </select>
          </FormField>
          <FormField compact label="Priority" required>
            <select value={form.priority} onChange={e=>set('priority',e.target.value)} className={sc}>
              {PRIORITIES.map(p=><option key={p}>{p}</option>)}
            </select>
          </FormField>
          <FormField compact label="Status">
            <select value={form.status} onChange={e=>set('status',e.target.value)} className={sc}>
              {STATUSES.filter(s=>s!=='Overdue').map(s=><option key={s}>{s}</option>)}
            </select>
          </FormField>
          <FormField compact label="Frequency" required>
            <select value={form.complianceFrequency||'annual'} onChange={e=>set('complianceFrequency',e.target.value)} className={sc}>
              {COMPLIANCE_FREQS.map(f=><option key={f.value} value={f.value}>{f.label}</option>)}
            </select>
          </FormField>

          <FormField compact label="Due Date (Current Cycle)" required>
            <input type="date" value={form.dueDate} onChange={e=>set('dueDate',e.target.value)} className={ic} />
          </FormField>
          <FormField compact label="Completion Date">
            <input type="date" value={form.completionDate||''} onChange={e=>set('completionDate',e.target.value)} className={ic} title="Actual date this compliance was completed" />
          </FormField>
          {isRecurring ? (() => {
            const base = form.completionDate || form.dueDate;
            const suggested = base ? computeNextDueDate(base, form.complianceFrequency || 'annual') : null;
            return (
              <FormField compact className="col-span-2" label={
                <span className="flex items-center gap-1.5">
                  📅 Next Due Date
                  <span className={`normal-case tracking-normal text-[10px] font-medium px-1.5 py-px rounded-full ${dk?'bg-blue-900/40 text-blue-300':'bg-blue-100 text-blue-600'}`}>
                    {form.status === 'Completed' ? 'Next cycle' : 'After completion'}
                  </span>
                </span>
              }>
                <div className="flex items-center gap-2">
                  <input type="date" value={form.nextDueDate||''}
                    onChange={e=>set('nextDueDate', e.target.value)}
                    className={ic}
                    title={suggested ? `Auto-computed: ${formatDate(suggested)} (${freqLabel} from ${form.completionDate ? 'completion date' : 'due date'})${!form.nextDueDate?' — used if left blank':''}` : 'Leave blank to use auto-computed date based on frequency'} />
                  {suggested && form.nextDueDate !== suggested && (
                    <button type="button"
                      onClick={()=>set('nextDueDate', suggested)}
                      className={`flex-shrink-0 px-2.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-colors border ${dk?'bg-blue-900/30 border-blue-700 text-blue-300 hover:bg-blue-900/50':'bg-blue-50 border-blue-200 text-blue-700 hover:bg-blue-100'}`}
                      title={`Auto-fill: ${formatDate(suggested)}`}>
                      ↻ {formatDate(suggested)}
                    </button>
                  )}
                </div>
              </FormField>
            );
          })() : <div className="hidden md:block col-span-2" />}

          <FormField compact label="Reminder Frequency" className="col-span-1 md:col-span-2">
            <select value={form.reminderFrequency} onChange={e=>set('reminderFrequency',e.target.value)} className={sc}>
              {REM_FREQS.map(r=><option key={r}>{r}</option>)}
            </select>
          </FormField>
          <FormField compact label="Escalation Level" className="col-span-1 md:col-span-2">
            <select value={form.escalationLevel} onChange={e=>set('escalationLevel',+e.target.value)} className={sc}>
              {ESC_LABELS.map((l,i)=><option key={i} value={i+1}>{l}</option>)}
            </select>
          </FormField>
        </div>

        {/* ═════ RIGHT: escalation + legal ═════ */}
        <div className={`lg:col-span-5 flex flex-col gap-3 lg:pl-6 lg:border-l ${dk?'lg:border-gray-700':'lg:border-gray-100'}`}>
          <div>
            {sectionHead('📧','Escalation Email Notifications','text-purple-500')}
            <div className="space-y-2">
              {[1,2,3].map(level => (
                <EscalationLevelPanel
                  key={level}
                  level={level}
                  allEmails={form.escalationEmails || {1:[],2:[],3:[]}}
                  onUpdate={updated => set('escalationEmails', updated)}
                  dk={dk}
                  compact
                  wrapCls=""
                />
              ))}
            </div>
          </div>
          <div className="space-y-2.5">
            {sectionHead('⚖️','Legal & Regulatory','text-[color:var(--p500)]')}
            <FormField compact label="Applicable Rule / Regulation">
              <input value={form.applicableRule} onChange={e=>set('applicableRule',e.target.value)}
                placeholder="e.g. Factories Act, 1948 – Section 6 & 7" className={ic} />
            </FormField>
            <FormField compact label="Legal Clause / Provision">
              <textarea value={form.legalClause} onChange={e=>set('legalClause',e.target.value)} rows={2}
                placeholder="Describe the specific legal clause, section, or provision that mandates this compliance requirement…"
                className={ic + ' resize-none'} />
            </FormField>
          </div>
        </div>
      </div>
    </Modal>
  );
}

/* ═══════════════════════════════════════════
   ADMIN ON-BEHALF MODAL
   Admin can upload evidence & change status
   on behalf of any assigned user
═══════════════════════════════════════════ */
function AdminOnBehalfModal({ dk, req: initialReq, requirements, users, plants, updateRequirements, onClose }) {
  const [req,         setReq]         = React.useState(initialReq);
  const [selUserId,   setSelUserId]   = React.useState('');
  const [newStatus,   setNewStatus]   = React.useState(req.status);
  const [uploading,   setUploading]   = React.useState(false);
  const [uploadMsg,   setUploadMsg]   = React.useState(null); // { text, type }
  const [statusMsg,   setStatusMsg]   = React.useState(null);
  const [tab,         setTab]         = React.useState('status'); // 'status' | 'evidence'
  const fileRef = React.useRef();

  const plant = plants.find(p => p.id === req.plantId);
  const assignedIds = Array.isArray(req.assignedTo) ? req.assignedTo : (req.assignedTo ? [req.assignedTo] : []);
  const assignees = assignedIds.map(id => users.find(u => u.id === id)).filter(Boolean);
  // All users including plant-level + group-level (admin can act on behalf of anyone)
  const allUsers = users.filter(u => u.role !== 'admin' && u.id !== '__dev__');

  const showMsg = (setter, text, type = 'success') => {
    setter({ text, type });
    setTimeout(() => setter(null), 3000);
  };

  /* ── Change status on behalf ── */
  const handleStatusChange = () => {
    if (newStatus === req.status) { showMsg(setStatusMsg, 'Status is already set to ' + newStatus, 'error'); return; }
    // ── Mandatory attachment: admin must also attach evidence before closing ──
    if (newStatus === 'Completed' && !(req.evidence?.length > 0)) {
      showMsg(setStatusMsg, '\u26a0\ufe0f Cannot mark as Completed — please upload at least one evidence file in the Evidence tab first.', 'error');
      setTab('evidence');
      return;
    }
    const actingUser = selUserId ? users.find(u => u.id === selUserId) : null;
    const now = new Date().toISOString();
    const comment = {
      id: `c${Date.now()}`,
      text: `[Admin action${actingUser ? ' on behalf of ' + actingUser.name : ''}] Status changed from "${req.status}" to "${newStatus}".`,
      userId: selUserId || 'admin',
      createdAt: now,
      isAdminAction: true,
    };
    const completionDate = newStatus === 'Completed' ? now.split('T')[0] : req.completionDate || '';
    const freq = req.complianceFrequency || 'annual'; // default to annual if missing
    const computed = (newStatus === 'Completed' && freq !== 'one_time')
      ? computeNextDueDate(completionDate || req.dueDate, freq)
      : null;
    // Prefer already-set nextDueDate (admin may have set it via Edit), else use computed
    const nextDueDate = req.nextDueDate || computed || '';
    const updated = { ...req, status: newStatus, completionDate, nextDueDate, comments: [...(req.comments || []), comment] };
    updateRequirements(requirements.map(r => r.id === req.id ? updated : r));
    setReq(updated);
    sendComplianceMail({ trigger: 'status_change', req: updated, plant, assignee: actingUser || assignees[0] || null, oldStatus: req.status, changedBy: null, users });
    showMsg(setStatusMsg, `✅ Status changed to "${newStatus}" — logged as admin action.`);
  };

  /* ── Upload evidence on behalf ── */
  const handleEvidenceUpload = async (file) => {
    if (!file) return;
    setUploading(true);
    try {
      const evId = `ev${Date.now()}`;
      let storageUrl = null, dataUrl = null;

      if (window.fbStorage) {
        try {
          await fbEnsureAuth();
          const path = `evidence/${req.id}/${evId}_${file.name}`;
          const ref = window.fbStorage.ref(path);
          await ref.put(file);
          storageUrl = await ref.getDownloadURL();
        } catch(e) { console.warn('Firebase Storage upload failed, using base64:', e.message); }
      }
      if (!storageUrl) {
        dataUrl = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = e => resolve(e.target.result);
          reader.onerror = () => reject(new Error('Read failed'));
          reader.readAsDataURL(file);
        });
      }

      const actingUser = selUserId ? users.find(u => u.id === selUserId) : null;
      const ev = {
        id: evId,
        name: file.name,
        size: `${(file.size / 1024).toFixed(1)} KB`,
        uploadedAt: new Date().toISOString(),
        uploadedBy: selUserId || 'admin',
        uploadedByAdmin: true,
        onBehalfOf: selUserId || null,
        onBehalfOfName: actingUser?.name || 'Admin',
        mimeType: file.type,
        storageUrl,
        dataUrl,
      };

      const comment = {
        id: `c${Date.now() + 1}`,
        text: `[Admin action${actingUser ? ' on behalf of ' + actingUser.name : ''}] Evidence uploaded: "${file.name}".`,
        userId: selUserId || 'admin',
        createdAt: new Date().toISOString(),
        isAdminAction: true,
      };

      const updated = { ...req, evidence: [...(req.evidence || []), ev], comments: [...(req.comments || []), comment] };
      updateRequirements(requirements.map(r => r.id === req.id ? updated : r));
      setReq(updated);
      showMsg(setUploadMsg, `✅ "${file.name}" uploaded${actingUser ? ' on behalf of ' + actingUser.name : ''}.`);
    } catch (err) {
      showMsg(setUploadMsg, '❌ Upload failed: ' + err.message, 'error');
    }
    setUploading(false);
    if (fileRef.current) fileRef.current.value = '';
  };

  /* ── Delete evidence ── */
  const handleDeleteEvidence = async (evId) => {
    const ev = (req.evidence || []).find(e => e.id === evId);
    if (!ev) return;
    if (ev.storageUrl && window.fbStorage) {
      try {
        await fbEnsureAuth();
        await window.fbStorage.ref(`evidence/${req.id}/${evId}_${ev.name}`).delete();
      } catch(e) { console.warn('Storage delete warn:', e.message); }
    }
    const updated = { ...req, evidence: (req.evidence || []).filter(e => e.id !== evId) };
    updateRequirements(requirements.map(r => r.id === req.id ? updated : r));
    setReq(updated);
    showMsg(setUploadMsg, `🗑️ "${ev.name}" removed.`);
  };

  const card = `rounded-2xl border shadow-sm ${dk ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-200'}`;
  const sub  = dk ? 'text-gray-400' : 'text-gray-500';

  return (
    <div className="fixed inset-0 z-[65] flex items-center justify-center p-4" style={{ backdropFilter: 'blur(6px)', background: 'rgba(0,0,0,0.6)' }}>
      <div className={`rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col ${dk ? 'bg-gray-800' : 'bg-white'}`}>
        {/* Header */}
        <div className="flex items-center justify-between px-6 py-4 border-b" style={{ borderColor: dk ? '#374151' : '#f3f4f6' }}>
          <div className="flex items-center gap-3">
            <div className="w-9 h-9 rounded-xl flex items-center justify-center text-lg" style={{ background: 'var(--p100)' }}>🛡️</div>
            <div>
              <h2 className={`font-bold text-base ${dk ? 'text-white' : 'text-gray-900'}`}>Admin Action — On Behalf of User</h2>
              <p className={`text-xs ${sub} mt-0.5 max-w-sm truncate`} title={req.title}>{req.title}</p>
            </div>
          </div>
          <button onClick={onClose} className={`w-8 h-8 flex items-center justify-center rounded-full transition-colors ${dk ? 'hover:bg-gray-700 text-gray-400' : 'hover:bg-gray-100 text-gray-400'}`}>✕</button>
        </div>

        <div className="overflow-y-auto flex-1 px-6 py-5 space-y-5">

          {/* Requirement info strip */}
          <div className={`flex flex-wrap items-center gap-2 p-3 rounded-xl ${dk ? 'bg-gray-700/60' : 'bg-gray-50'}`}>
            <Badge label={getDisplayStatus(req)}   color={STATUS_CLR[getDisplayStatus(req)]} />
            <Badge label={req.priority} color={PRIORITY_CLR[req.priority]} />
            <Badge label={req.category} color="#6366f1" />
            <span className={`text-xs ml-auto ${sub}`}>🏭 {plant?.name || '—'} · 📅 {formatDate(req.dueDate)}</span>
          </div>

          {/* On behalf of — user selector */}
          <div>
            <label className="block text-xs font-bold uppercase tracking-wide mb-1.5" style={{ color: 'var(--p600)' }}>
              👤 Acting On Behalf Of
            </label>
            <select
              value={selUserId}
              onChange={e => setSelUserId(e.target.value)}
              className={selectCls}
            >
              <option value="">— Admin (no specific user) —</option>
              {assignees.length > 0 && (
                <optgroup label="Assigned Users">
                  {assignees.map(u => <option key={u.id} value={u.id}>{u.name} ({u.email}) — {u.role === 'plant_head' ? 'Plant Head' : 'Team Member'}</option>)}
                </optgroup>
              )}
              {allUsers.filter(u => !assignedIds.includes(u.id)).length > 0 && (
                <optgroup label="Other Users">
                  {allUsers.filter(u => !assignedIds.includes(u.id)).map(u => <option key={u.id} value={u.id}>{u.name} ({u.email})</option>)}
                </optgroup>
              )}
            </select>
            {selUserId && (
              <p className={`text-xs mt-1.5 flex items-center gap-1.5 ${sub}`}>
                <span className="inline-block w-4 h-4 rounded-full flex-shrink-0 text-white text-center leading-4 text-xs" style={{ background: 'var(--p600)', fontSize: '9px' }}>
                  {initials(users.find(u => u.id === selUserId)?.name || '?')}
                </span>
                Actions will be attributed to <strong className={dk ? 'text-gray-200' : 'text-gray-800'}>{users.find(u => u.id === selUserId)?.name}</strong> with an admin override note.
              </p>
            )}
          </div>

          {/* Tab strip */}
          <div className="flex gap-1 p-1 rounded-xl w-fit" style={{ background: dk ? '#374151' : '#f3f4f6' }}>
            {[['status', '⚡ Change Status'], ['evidence', '📎 Upload Evidence']].map(([id, label]) => (
              <button key={id} onClick={() => setTab(id)}
                className={`px-4 py-1.5 rounded-lg text-sm font-semibold transition-all ${tab === id ? (dk ? 'bg-gray-600 text-white shadow' : 'bg-white shadow') : (dk ? 'text-gray-400' : 'text-gray-500')}`}>
                {label}{id === 'evidence' && (req.evidence || []).length > 0 ? ` (${(req.evidence || []).length})` : ''}
              </button>
            ))}
          </div>

          {/* ── TAB: Change Status ── */}
          {tab === 'status' && (
            <div className="space-y-4">
              <div>
                <label className="block text-xs font-bold uppercase tracking-wide mb-2" style={{ color: 'var(--p600)' }}>New Status</label>
                <div className="grid grid-cols-2 gap-2">
                  {STATUSES.filter(s=>s!=='Overdue').map(s => (
                    <button key={s} onClick={() => setNewStatus(s)}
                      className={`flex items-center gap-3 px-4 py-3 rounded-xl border-2 transition-all text-sm font-semibold ${newStatus === s ? 'border-[color:var(--p500)] shadow-md' : dk ? 'border-gray-600 hover:border-gray-500' : 'border-gray-200 hover:border-gray-300'}`}
                      style={newStatus === s ? { background: STATUS_CLR[s] + '18' } : {}}>
                      <span className="w-3 h-3 rounded-full flex-shrink-0" style={{ background: STATUS_CLR[s] }} />
                      <span style={{ color: newStatus === s ? STATUS_CLR[s] : undefined }}>{s}</span>
                      {req.status === s && <span className={`ml-auto text-xs font-normal ${sub}`}>current</span>}
                    </button>
                  ))}
                </div>
                {isEffectivelyOverdue(req) && (
                  <p className="mt-2 text-xs font-medium flex items-center gap-1.5" style={{color:STATUS_CLR.Overdue}}>
                    🚨 Automatically marked Overdue — past due date ({formatDate(req.dueDate)}). Choose a status above to clear it.
                  </p>
                )}
              </div>
              {/* ── Mandatory-attachment warning in admin modal ── */}
              {newStatus === 'Completed' && !(req.evidence?.length > 0) && (
                <div className={`flex items-start gap-2 p-3 rounded-xl border ${dk?'bg-amber-900/20 border-amber-700/50 text-amber-300':'bg-amber-50 border-amber-200 text-amber-700'}`}>
                  <span className="text-base flex-shrink-0">🔒</span>
                  <p className="text-xs leading-relaxed">
                    <strong>Attachment required.</strong> Switch to the <strong>Evidence</strong> tab and upload at least one file before setting status to Completed.
                  </p>
                </div>
              )}
              {statusMsg && (
                <div className={`px-4 py-3 rounded-xl text-sm font-medium flex items-center gap-2 ${statusMsg.type === 'error' ? 'bg-red-50 text-red-600 dark:bg-red-900/30 dark:text-red-400' : 'bg-green-50 text-green-700 dark:bg-green-900/30 dark:text-green-400'}`}>
                  {statusMsg.text}
                </div>
              )}
              <button
                onClick={handleStatusChange}
                disabled={newStatus === req.status || (newStatus === 'Completed' && !(req.evidence?.length > 0))}
                className="w-full py-3 rounded-xl text-white font-semibold text-sm transition-colors disabled:opacity-40"
                style={{ background: 'var(--p600)' }}>
                {newStatus === 'Completed' && !(req.evidence?.length > 0) ? '🔒 Upload Evidence First' : `⚡ Apply Status Change${selUserId ? ` (as ${users.find(u => u.id === selUserId)?.name?.split(' ')[0]})` : ' (as Admin)'}`}
              </button>
              <p className={`text-xs ${sub}`}>
                This will update the status, add an audit comment, set a completion date (if Completed), and send a notification email.
              </p>
            </div>
          )}

          {/* ── TAB: Upload Evidence ── */}
          {tab === 'evidence' && (
            <div className="space-y-4">
              {/* Existing evidence */}
              {(req.evidence || []).length > 0 && (
                <div>
                  <p className={`text-xs font-bold uppercase tracking-wide mb-2 ${sub}`}>📎 Existing Evidence ({(req.evidence || []).length})</p>
                  {(req.evidence || []).map(ev => {
                    const fileUrl = ev.storageUrl || ev.dataUrl;
                    const isImage = (ev.mimeType || '').startsWith('image/');
                    const isPdf   = ev.name?.toLowerCase().endsWith('.pdf');
                    const fileIcon = isImage ? '🖼️' : isPdf ? '📑' : '📄';
                    const uploader = users.find(u => u.id === ev.uploadedBy);
                    return (
                      <div key={ev.id} className={`rounded-xl border mb-2 overflow-hidden ${dk ? 'border-gray-600 bg-gray-700/50' : 'border-gray-200 bg-gray-50'}`}>
                        <div className="flex items-center gap-3 p-3">
                          <span className="text-xl flex-shrink-0">{fileIcon}</span>
                          <div className="flex-1 min-w-0">
                            <p className={`text-sm font-medium truncate ${dk ? 'text-gray-100' : 'text-gray-800'}`}>{ev.name}</p>
                            <p className={`text-xs ${sub}`}>
                              {ev.size} · {formatDate(ev.uploadedAt)}
                              {ev.uploadedByAdmin && <span className="ml-1.5 px-1.5 py-0.5 rounded text-xs font-semibold" style={{ background: 'var(--p100)', color: 'var(--p700)' }}>Admin Upload</span>}
                              {ev.onBehalfOfName && <span className={`ml-1 text-xs ${sub}`}>· on behalf of {ev.onBehalfOfName}</span>}
                              {!ev.uploadedByAdmin && uploader && <span className={`ml-1 text-xs ${sub}`}>· by {uploader.name}</span>}
                            </p>
                          </div>
                          <div className="flex items-center gap-1.5 flex-shrink-0">
                            {fileUrl && (
                              <button onClick={() => window.open(fileUrl, '_blank')}
                                className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors ${dk ? 'bg-gray-600 hover:bg-gray-500 text-gray-100' : 'bg-gray-200 hover:bg-gray-300 text-gray-700'}`}>
                                👁️
                              </button>
                            )}
                            <button onClick={() => handleDeleteEvidence(ev.id)}
                              className={`px-2.5 py-1.5 rounded-lg text-xs font-semibold transition-colors ${dk ? 'bg-red-900/40 hover:bg-red-800/60 text-red-400' : 'bg-red-50 hover:bg-red-100 text-red-500'}`}>
                              🗑️
                            </button>
                          </div>
                        </div>
                        {isImage && fileUrl && (
                          <div className="px-3 pb-3">
                            <img src={fileUrl} alt={ev.name} className="w-full max-h-40 object-contain rounded-lg border" style={{ background: dk ? '#111827' : '#f9fafb' }} />
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}

              {/* Upload zone */}
              <div>
                <p className={`text-xs font-bold uppercase tracking-wide mb-2 ${sub}`}>⬆️ Upload New Evidence</p>
                <input type="file" ref={fileRef} className="hidden"
                  onChange={e => { if (e.target.files[0]) handleEvidenceUpload(e.target.files[0]); }} />
                <button
                  onClick={() => fileRef.current.click()}
                  disabled={uploading}
                  className={`w-full py-6 rounded-xl border-2 border-dashed text-sm font-medium transition-colors ${uploading ? 'opacity-60 cursor-not-allowed' : ''} ${dk ? 'border-gray-600 text-gray-300 hover:border-[color:var(--p400)] hover:text-[color:var(--p400)]' : 'border-gray-300 text-gray-500 hover:border-[color:var(--p400)] hover:text-[color:var(--p600)]'}`}>
                  {uploading ? (
                    <span className="flex items-center justify-center gap-2">
                      <span className="w-4 h-4 border-2 border-current border-t-transparent rounded-full animate-spin inline-block" />
                      Uploading…
                    </span>
                  ) : (
                    <span className="flex flex-col items-center gap-2">
                      <span className="text-3xl">📎</span>
                      <span>Click to attach evidence file</span>
                      <span className={`text-xs ${sub}`}>PDF, images, or any document</span>
                    </span>
                  )}
                </button>
              </div>

              {uploadMsg && (
                <div className={`px-4 py-3 rounded-xl text-sm font-medium flex items-center gap-2 ${uploadMsg.type === 'error' ? 'bg-red-50 text-red-600 dark:bg-red-900/30 dark:text-red-400' : 'bg-green-50 text-green-700 dark:bg-green-900/30 dark:text-green-400'}`}>
                  {uploadMsg.text}
                </div>
              )}
              <p className={`text-xs ${sub}`}>
                Evidence is uploaded to Firebase Storage for cross-device access. An audit comment is automatically added to the requirement.
              </p>
            </div>
          )}
        </div>

        {/* Footer */}
        <div className={`px-6 py-4 border-t flex justify-end gap-3 ${dk ? 'border-gray-700' : 'border-gray-100'}`}>
          <button onClick={onClose} className={`px-5 py-2.5 rounded-xl border text-sm font-medium transition-colors ${dk ? 'border-gray-600 text-gray-300 hover:bg-gray-700' : 'border-gray-200 text-gray-700 hover:bg-gray-50'}`}>
            Done
          </button>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════
   ADMIN – REQUIREMENTS
═══════════════════════════════════════════ */
function AdminRequirements({ dk, plants, users, requirements, updateRequirements, categories: catsProp, openReqId, editMode, onNotifReqOpened, plantFilter }) {
  const cats = catsProp || CATEGORIES;
  // If plantFilter is set (Plant Admin role), scope all data to that plant only
  const allReqs = plantFilter ? requirements.filter(r => r.plantId === plantFilter) : requirements;
  const [filters,      setFilters]      = useState({ plant: plantFilter||'', status:'', priority:'', search:'' });
  const [showAdd,      setShowAdd]      = useState(false);
  const [editReq,      setEditReq]      = useState(null);
  const [viewReq,      setViewReq]      = useState(null);
  const [delId,        setDelId]        = useState(null);
  /* ── Bulk selection state ── */
  const [selected,     setSelected]     = useState(new Set()); // Set of req IDs
  const [bulkConfirm,  setBulkConfirm]  = useState(false);
  const [onBehalfReq,  setOnBehalfReq]  = useState(null); // Admin on-behalf modal

  const set = (k,v) => { setFilters(f=>({...f,[k]:v})); setSelected(new Set()); };

  const downloadEvidence = (ev) => {
    const url = ev.storageUrl || ev.dataUrl;
    if (!url) {
      alert('File not available. Please ask the user to re-upload.');
      return;
    }
    if (ev.storageUrl) {
      window.open(ev.storageUrl, '_blank');
      return;
    }
    const a = document.createElement('a');
    a.href = ev.dataUrl;
    a.download = ev.name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  };

  // Auto-open requirement when triggered from notification bell or overview drill-down Edit
  React.useEffect(() => {
    if (openReqId) {
      const req = requirements.find(r => r.id === openReqId);
      if (req) {
        if (editMode) { setEditReq(req); }
        else          { setViewReq(req); }
        if (onNotifReqOpened) onNotifReqOpened();
      }
    }
  }, [openReqId]);

  const filtered = allReqs.filter(r => {
    if (filters.plant    && r.plantId  !== filters.plant)    return false;
    if (filters.status   && r.status   !== filters.status)   return false;
    if (filters.priority && r.priority !== filters.priority) return false;
    if (filters.search   && !r.title.toLowerCase().includes(filters.search.toLowerCase())) return false;
    return true;
  });

  /* ── Checkbox helpers ── */
  const filteredIds   = filtered.map(r => r.id);
  const allChecked    = filteredIds.length > 0 && filteredIds.every(id => selected.has(id));
  const someChecked   = filteredIds.some(id => selected.has(id)) && !allChecked;

  const toggleAll = () => {
    if (allChecked) {
      // Deselect all visible
      setSelected(prev => { const s = new Set(prev); filteredIds.forEach(id => s.delete(id)); return s; });
    } else {
      // Select all visible
      setSelected(prev => { const s = new Set(prev); filteredIds.forEach(id => s.add(id)); return s; });
    }
  };

  const toggleOne = (id) => {
    setSelected(prev => {
      const s = new Set(prev);
      s.has(id) ? s.delete(id) : s.add(id);
      return s;
    });
  };

  /* ── CRUD ── */
  const addReq = form => {
    const plantIdsList = (form.plantIds && form.plantIds.length > 0) ? form.plantIds : (form.plantId ? [form.plantId] : []);
    const now = new Date().toISOString();
    const newReqs = plantIdsList.map((pid, idx) => ({
      ...form,
      id: `r${Date.now()}${idx}`,
      plantId: pid,
      plantIds: plantIdsList,
      createdAt: now,
      evidence: [],
      comments: []
    }));
    updateRequirements([...newReqs, ...requirements]);
    // ── Email per plant ──
    newReqs.forEach(newR => {
      const plant    = plants.find(p => p.id === newR.plantId);
      const assignedIds = Array.isArray(newR.assignedTo) ? newR.assignedTo : (newR.assignedTo ? [newR.assignedTo] : []);
      const assignees = assignedIds.map(id=>users.find(u=>u.id===id)).filter(Boolean);
      sendComplianceMail({ trigger:'new_requirement', req:newR, plant, assignee:assignees[0]||null, changedBy:null, users });
      assignees.forEach(assignee => {
        sendComplianceMail({ trigger:'new_assignment', req:newR, plant, assignee, changedBy:null, users });
      });
    });
  };

  const saveEdit = form => {
    const old = requirements.find(r => r.id === editReq.id);
    let updated = { ...old, ...form };

    // ── Auto-advance: when status flips to Completed on a recurring requirement ──
    // If admin specified a nextDueDate in the form, use it.
    // If blank, auto-compute from completionDate (or dueDate) + frequency.
    // Default frequency is 'annual' if complianceFrequency is missing.
    const wasCompleted = old.status === 'Completed';
    const nowCompleted = updated.status === 'Completed';
    const freq = updated.complianceFrequency || 'annual';
    if (nowCompleted && freq !== 'one_time') {
      const baseDateForNext = updated.completionDate || updated.dueDate;
      const adminSpecified  = updated.nextDueDate && updated.nextDueDate.trim();
      const computed        = baseDateForNext ? computeNextDueDate(baseDateForNext, freq) : null;
      // Prefer admin-specified, fall back to computed, then keep existing
      updated = {
        ...updated,
        nextDueDate: adminSpecified || computed || updated.nextDueDate || '',
      };
    }

    updateRequirements(requirements.map(r => r.id === editReq.id ? updated : r));
    if (!old) return;
    const plant = plants.find(p => p.id === updated.plantId);
    const newIds = Array.isArray(updated.assignedTo) ? updated.assignedTo : (updated.assignedTo ? [updated.assignedTo] : []);
    const oldIds = Array.isArray(old.assignedTo) ? old.assignedTo : (old.assignedTo ? [old.assignedTo] : []);
    // ── Status changed ──
    if (old.status !== updated.status) {
      const primaryAssignee = users.find(u=>u.id===newIds[0]);
      sendComplianceMail({ trigger:'status_change', req:updated, plant, assignee:primaryAssignee||null, oldStatus:old.status, changedBy:null, users });
    }
    // ── Assignment changed ──
    const added   = newIds.filter(id=>!oldIds.includes(id));
    const removed = oldIds.filter(id=>!newIds.includes(id));
    added.forEach(id => {
      const assignee = users.find(u=>u.id===id);
      if (assignee) sendComplianceMail({ trigger:'new_assignment', req:updated, plant, assignee, changedBy:null, users });
    });
    removed.forEach(id => {
      const oldAssignee = users.find(u=>u.id===id);
      const primaryAssignee = users.find(u=>u.id===newIds[0]);
      if (oldAssignee) sendComplianceMail({ trigger:'reassignment', req:updated, plant, assignee:primaryAssignee||null, oldAssignee, changedBy:null, users });
    });
  };

  /* ── Delete evidence files from Firebase Storage for a requirement ── */
  /* ── Delete all Storage files for a requirement (called on req deletion) ── */
  const deleteReqStorageFiles = async (req) => {
    if (!window.fbStorage || !req) return;
    await fbEnsureAuth();
    const evidenceList = req.evidence || [];
    for (const ev of evidenceList) {
      if (!ev.storageUrl) continue; // base64-only, nothing in Storage
      try {
        const path = `evidence/${req.id}/${ev.id}_${ev.name}`;
        await window.fbStorage.ref(path).delete();
        console.log('🗑️ Deleted from Firebase Storage:', path);
      } catch(e) {
        console.warn('Storage delete failed (may already be gone):', e.message);
        // Try alternate path
        try { await window.fbStorage.ref(`evidence/${req.id}/${ev.id}`).delete(); } catch(_) {}
      }
    }
    // Note: Firestore document entry is removed by updateRequirements() caller
  };

  const confirmDel = () => {
    const req = requirements.find(r => r.id === delId);
    updateRequirements(requirements.filter(r => r.id !== delId));
    setDelId(null);
    // Delete associated Firebase Storage files asynchronously
    if (req) deleteReqStorageFiles(req);
  };

  /* ── Bulk delete ── */
  const [bulkDelProgress, setBulkDelProgress] = React.useState(0);
  const [bulkDeleting,    setBulkDeleting]    = React.useState(false);

  const confirmBulkDelete = async () => {
    const toDelete = requirements.filter(r => selected.has(r.id));
    setBulkDeleting(true);
    setBulkDelProgress(0);
    // Remove from state immediately so the UI feels instant
    updateRequirements(requirements.filter(r => !selected.has(r.id)));
    // Delete Storage files one-by-one, advancing the progress bar
    for (let i = 0; i < toDelete.length; i++) {
      await deleteReqStorageFiles(toDelete[i]);
      setBulkDelProgress(Math.round(((i + 1) / toDelete.length) * 100));
    }
    setBulkDeleting(false);
    setBulkDelProgress(0);
    setSelected(new Set());
    setBulkConfirm(false);
  };

  const card = `rounded-2xl border shadow-sm ${dk?'bg-gray-800 border-gray-700':'bg-white border-gray-200'}`;
  const sub  = dk?'text-gray-400':'text-gray-500';

  return (
    <div className="space-y-5">

      {/* Admin On-Behalf Modal */}
      {onBehalfReq && (
        <AdminOnBehalfModal
          dk={dk}
          req={onBehalfReq}
          requirements={requirements}
          users={users}
          plants={plants}
          updateRequirements={updateRequirements}
          onClose={()=>setOnBehalfReq(null)}
        />
      )}

      {/* Single delete confirm */}
      <ConfirmModal open={!!delId} message="Delete this requirement permanently?" onConfirm={confirmDel} onCancel={()=>setDelId(null)} />

      {/* Bulk delete confirm */}
      {bulkConfirm && (
        <div className="fixed inset-0 z-[60] flex items-center justify-center p-4"
          style={{backdropFilter:'blur(4px)',background:'rgba(0,0,0,0.6)'}}>
          <div className={`rounded-2xl shadow-2xl w-full max-w-sm p-6 ${dk?'bg-gray-800':'bg-white'}`}>
            <div className="text-center mb-5">
              <div className="w-14 h-14 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl">🗑️</div>
              <h3 className={`font-bold text-lg mb-1 ${dk?'text-white':'text-gray-900'}`}>Bulk Delete {selected.size} Requirement{selected.size>1?'s':''}</h3>
              <p className={`text-sm ${sub}`}>This will permanently delete <strong>{selected.size}</strong> selected requirement{selected.size>1?'s':''}. This action cannot be undone.</p>
            </div>
            {/* Preview list — max 5 shown */}
            <div className={`rounded-xl p-3 mb-5 max-h-36 overflow-y-auto text-xs space-y-1 ${dk?'bg-gray-700':'bg-red-50'}`}>
              {[...selected].slice(0,5).map(id => {
                const r = requirements.find(x=>x.id===id);
                return r ? (
                  <div key={id} className="flex items-center gap-2">
                    <span className="text-red-500">✕</span>
                    <span className={dk?'text-gray-200':'text-gray-700'}>{r.title}</span>
                    <span className={`ml-auto ${sub}`}>{plants.find(p=>p.id===r.plantId)?.name||'—'}</span>
                  </div>
                ) : null;
              })}
              {selected.size > 5 && <p className={`text-center ${sub} pt-1`}>…and {selected.size-5} more</p>}
            </div>
            {bulkDeleting && (
              <div className="mb-4">
                <div className="flex items-center justify-between mb-1.5">
                  <span className={`text-xs font-semibold ${dk?'text-gray-300':'text-gray-700'}`}>🗑️ Deleting files…</span>
                  <span className="text-xs font-bold text-red-500">{bulkDelProgress}%</span>
                </div>
                <div className={`w-full h-2.5 rounded-full overflow-hidden ${dk?'bg-gray-700':'bg-gray-100'}`}>
                  <div className="h-full rounded-full transition-all duration-200 bg-red-500"
                    style={{width:`${bulkDelProgress}%`}} />
                </div>
                <p className={`text-xs mt-1.5 ${dk?'text-gray-400':'text-gray-500'}`}>Removing storage files — please wait…</p>
              </div>
            )}
            <div className="flex gap-3">
              <button onClick={()=>{ if(!bulkDeleting) setBulkConfirm(false); }} disabled={bulkDeleting}
                className={`flex-1 py-2.5 rounded-xl border text-sm font-medium transition-colors disabled:opacity-40 ${dk?'border-gray-600 text-gray-300 hover:bg-gray-700':'border-gray-200 text-gray-700 hover:bg-gray-50'}`}>
                Cancel
              </button>
              <button onClick={confirmBulkDelete} disabled={bulkDeleting}
                className="flex-1 py-2.5 rounded-xl bg-red-600 text-white text-sm font-bold hover:bg-red-700 transition-colors disabled:opacity-60 flex items-center justify-center gap-2">
                {bulkDeleting ? `🗑️ Deleting… ${bulkDelProgress}%` : `Delete ${selected.size} Item${selected.size>1?'s':''}`}
              </button>
            </div>
          </div>
        </div>
      )}

      <RequirementModal open={showAdd} onClose={()=>setShowAdd(false)} onSave={addReq} plants={plants} users={users} dk={dk} categories={cats} />
      <RequirementModal open={!!editReq} onClose={()=>setEditReq(null)} onSave={saveEdit} initial={editReq} plants={plants} users={users} dk={dk} categories={cats} />

      <Modal open={!!viewReq} onClose={()=>setViewReq(null)} title="Requirement Details" wide dk={dk}>
        {viewReq && (() => {
          const plant    = plants.find(p=>p.id===viewReq.plantId);
          const assignedIds = Array.isArray(viewReq.assignedTo) ? viewReq.assignedTo : (viewReq.assignedTo ? [viewReq.assignedTo] : []);
          const assignees = assignedIds.map(id=>users.find(u=>u.id===id)).filter(Boolean);
          const assigneeStr = assignees.length > 0 ? assignees.map(a=>`${a.name} (${a.email})`).join(', ') : 'Unassigned';
          return (
            <div className="space-y-4 text-sm">
              <div className="flex flex-wrap gap-2">
                <Badge label={viewReq.status}   color={STATUS_CLR[viewReq.status]} />
                <Badge label={viewReq.priority} color={PRIORITY_CLR[viewReq.priority]} />
                <Badge label={viewReq.category} color="#6366f1" />
                <Badge label={`L${viewReq.escalationLevel} Escalation`} color="#8b5cf6" />
              </div>
              <p className={`leading-relaxed ${dk?'text-gray-300':'text-gray-700'}`}>{viewReq.description}</p>
              <div className="grid grid-cols-2 gap-4">
                {[['Plant',plant?.name],['State',plant?.state],['Assigned To',assigneeStr],['Due Date',formatDate(viewReq.dueDate)],['Completion Date',viewReq.completionDate?formatDate(viewReq.completionDate):'—'],['Reminder',viewReq.reminderFrequency]].map(([l,v])=>(
                  <div key={l} className={`p-3 rounded-xl ${dk?'bg-gray-700':'bg-gray-50'}`}>
                    <p className={`text-xs uppercase tracking-wide font-semibold mb-0.5 ${sub}`}>{l}</p>
                    <p className={`font-medium ${dk?'text-white':'text-gray-800'}`}>{v||'—'}</p>
                  </div>
                ))}
              </div>

              {/* ── Escalation Email Notifications ── */}
              {(() => {
                const escEmails = viewReq.escalationEmails && typeof viewReq.escalationEmails === 'object'
                  ? viewReq.escalationEmails
                  : (viewReq.escalationEmail ? { 1:[viewReq.escalationEmail], 2:[], 3:[] } : { 1:[], 2:[], 3:[] });
                const hasAny = [1,2,3].some(l => (escEmails[l]||[]).length > 0);
                const levelColors = { 1:'#22c55e', 2:'#f59e0b', 3:'#ef4444' };
                const levelLabels = { 1:'Level 1 – Plant Head', 2:'Level 2 – Regional Manager', 3:'Level 3 – Top Management' };
                if (!hasAny) return null;
                return (
                  <div className={`rounded-xl border p-4 space-y-3 ${dk?'bg-purple-900/20 border-purple-700/40':'bg-purple-50 border-purple-200'}`}>
                    <p className="text-xs font-bold uppercase tracking-widest text-purple-500 flex items-center gap-1.5">📧 Escalation Email Notifications</p>
                    {[1,2,3].map(level => {
                      const emails = escEmails[level] || [];
                      if (!emails.length) return null;
                      return (
                        <div key={level}>
                          <div className="flex items-center gap-1.5 mb-1">
                            <span className="w-4 h-4 rounded-full flex items-center justify-center text-white text-xs font-bold" style={{background:levelColors[level]}}>{level}</span>
                            <p className="text-xs font-semibold" style={{color:levelColors[level]}}>{levelLabels[level]}</p>
                          </div>
                          <div className="flex flex-wrap gap-1.5">
                            {emails.map(e=>(
                              <span key={e} className={`inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs border ${dk?'bg-gray-700 border-gray-600 text-gray-200':'bg-white border-gray-300 text-gray-700'}`}>✉️ {e}</span>
                            ))}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                );
              })()}

              {/* ── Legal & Regulatory Section ── */}
              {(viewReq.applicableRule || viewReq.legalClause) && (
                <div className={`rounded-xl border p-4 space-y-3 ${dk?'border-gray-700':'border-gray-200'}`}>
                  <p className="text-xs font-bold uppercase tracking-widest text-[color:var(--p500)] flex items-center gap-1.5">⚖️ Legal &amp; Regulatory</p>
                  {viewReq.applicableRule && (
                    <div>
                      <p className={`text-xs uppercase tracking-wide font-semibold mb-0.5 ${dk?'text-[color:var(--p300)]':'text-[color:var(--p600)]'}`}>Applicable Rule / Regulation</p>
                      <p className={`text-sm font-medium ${dk?'text-white':'text-gray-800'}`}>{viewReq.applicableRule}</p>
                    </div>
                  )}
                  {viewReq.legalClause && (
                    <div>
                      <p className={`text-xs uppercase tracking-wide font-semibold mb-0.5 ${dk?'text-[color:var(--p300)]':'text-[color:var(--p600)]'}`}>Legal Clause / Provision</p>
                      <p className={`text-sm leading-relaxed ${dk?'text-gray-200':'text-gray-700'}`}>{viewReq.legalClause}</p>
                    </div>
                  )}
                </div>
              )}
              {viewReq.evidence?.length > 0 && (
                <div>
                  <p className={`font-semibold mb-2 ${dk?'text-white':'text-gray-800'}`}>📎 Evidence</p>
                  {viewReq.evidence.map(e=>{
                    const fileUrl = e.storageUrl || e.dataUrl;
                    const isImage = fileUrl && (e.mimeType||'').startsWith('image/');
                    const isPdf   = fileUrl && (e.mimeType==='application/pdf' || e.name.toLowerCase().endsWith('.pdf'));
                    const canPreview = isImage || isPdf;
                    const fileIcon = isImage ? '🖼️' : isPdf ? '📑' : '📄';
                    return (
                      <div key={e.id} className={`mb-2 rounded-xl overflow-hidden border ${dk?'border-gray-600 bg-gray-700':'border-gray-200 bg-gray-50'}`}>
                        <div className="flex items-center gap-3 p-3">
                          <span className="text-xl flex-shrink-0">{fileIcon}</span>
                          <div className="flex-1 min-w-0">
                            <p className={`text-sm font-medium ${dk?'text-gray-100':'text-gray-800'}`}>{e.name}</p>
                            <p className={`text-xs ${dk?'text-gray-400':'text-gray-500'}`}>{e.size} · {formatDate(e.uploadedAt)}</p>
                          </div>
                          <div className="flex items-center gap-1.5 flex-shrink-0">
                            {canPreview && (
                              <button onClick={()=>{ window.open(fileUrl, '_blank'); }}
                                className={`flex items-center gap-1 px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors ${dk?'bg-gray-600 hover:bg-gray-500 text-gray-100':'bg-gray-200 hover:bg-gray-300 text-gray-700'}`}
                                title={`View ${e.name}`}>
                                👁️ View
                              </button>
                            )}
                            <button onClick={()=>downloadEvidence(e)}
                              className={`flex items-center gap-1 px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors ${dk?'text-white':'text-white'}`} style={{background:'var(--p600)'}}
                              title={`Download ${e.name}`}>
                              ⬇️ Download
                            </button>
                          </div>
                        </div>
                        {isImage && fileUrl && (
                          <div className="px-3 pb-3">
                            <img src={fileUrl} alt={e.name} className="w-full max-h-48 object-contain rounded-lg border" style={{background: dk?'#111827':'#f9fafb'}} />
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          );
        })()}
      </Modal>

      {/* ── Filter bar ── */}
      <div className={`${card} p-4`}>
        {plantFilter && (
          <div className={`mb-3 flex items-center gap-2 px-3 py-2 rounded-xl text-xs font-semibold ${dk?'bg-orange-900/20 border border-orange-700/40 text-orange-300':'bg-orange-50 border border-orange-200 text-orange-700'}`}>
            🏭 Showing requirements for <strong className="ml-1">{plants.find(p=>p.id===plantFilter)?.name||plantFilter}</strong> only
          </div>
        )}
        <div className="flex flex-wrap gap-3 items-center">
          <input value={filters.search} onChange={e=>set('search',e.target.value)} placeholder="🔍 Search requirements…"
            className={`${inputCls} max-w-xs`} />
          {!plantFilter && (
            <select value={filters.plant} onChange={e=>set('plant',e.target.value)} className={`${selectCls} w-44`}>
              <option value="">All Plants</option>
              {plants.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
            </select>
          )}
          <select value={filters.status} onChange={e=>set('status',e.target.value)} className={`${selectCls} w-36`}>
            <option value="">All Status</option>
            {STATUSES.map(s=><option key={s}>{s}</option>)}
          </select>
          <select value={filters.priority} onChange={e=>set('priority',e.target.value)} className={`${selectCls} w-36`}>
            <option value="">All Priority</option>
            {PRIORITIES.map(p=><option key={p}>{p}</option>)}
          </select>
          <button onClick={()=>setShowAdd(true)}
            className="ml-auto px-4 py-2.5 text-white rounded-xl text-sm font-semibold transition-colors flex items-center gap-2" style={{background:"var(--p600)"}}>
            <span>+</span> Add Requirement
          </button>
        </div>
        <div className="flex items-center justify-between mt-2">
          <p className={`text-xs ${sub}`}>Showing {filtered.length} of {allReqs.length} requirements</p>
          {selected.size > 0 && (
            <p className="text-xs font-semibold text-[color:var(--p500)]">{selected.size} selected</p>
          )}
        </div>
      </div>

      {/* ── Bulk action bar — appears when items are selected ── */}
      {selected.size > 0 && (
        <div className={`flex items-center justify-between px-4 py-3 rounded-2xl border ${dk?'bg-red-900/20 border-red-700/40':'bg-red-50 border-red-200'}`}>
          <div className="flex items-center gap-3">
            <div className="w-8 h-8 rounded-full bg-red-100 flex items-center justify-center text-red-600 font-bold text-sm">
              {selected.size}
            </div>
            <div>
              <p className={`text-sm font-semibold ${dk?'text-red-300':'text-red-700'}`}>
                {selected.size} requirement{selected.size>1?'s':''} selected
              </p>
              <p className={`text-xs ${sub}`}>
                {filteredIds.every(id=>selected.has(id)) && selected.size === filteredIds.length
                  ? 'All visible requirements selected'
                  : `${filteredIds.filter(id=>selected.has(id)).length} of ${filtered.length} visible`}
              </p>
            </div>
          </div>
          <div className="flex items-center gap-2">
            <button onClick={()=>setSelected(new Set())}
              className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors ${dk?'text-gray-300 hover:bg-gray-700':'text-gray-600 hover:bg-gray-100'}`}>
              Clear selection
            </button>
            <button onClick={()=>setBulkConfirm(true)}
              className="px-4 py-1.5 rounded-lg bg-red-600 text-white text-xs font-bold hover:bg-red-700 transition-colors flex items-center gap-1.5">
              🗑️ Delete {selected.size} Selected
            </button>
          </div>
        </div>
      )}

      {/* ── Table ── */}
      <div className={`${card} overflow-hidden`}>
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead>
              <tr className={`text-xs uppercase tracking-wide font-semibold ${dk?'bg-gray-700/60 text-gray-400':'bg-gray-50 text-gray-500'}`}>
                {/* Select-all checkbox column */}
                <th className="pl-3 pr-1 py-2 w-8">
                  <input
                    type="checkbox"
                    checked={allChecked}
                    ref={el => { if (el) el.indeterminate = someChecked; }}
                    onChange={toggleAll}
                    className="w-4 h-4 rounded cursor-pointer" style={{accentColor:"var(--p600)"}}
                    title={allChecked ? 'Deselect all' : 'Select all visible'}
                  />
                </th>
                {['Requirement','Plant','Category','Assigned To','Priority','Status','Due Date','Actions'].map(h=>(
                  <th key={h} className={`text-left px-2.5 py-2 whitespace-nowrap ${h==='Requirement'?'w-[34%]':''}`}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody className={`divide-y ${dk?'divide-gray-700':'divide-gray-100'}`}>
              {filtered.length === 0 && (
                <tr><td colSpan={9} className="text-center py-12 text-gray-400">No requirements found</td></tr>
              )}
              {filtered.map(req => {
                const plant    = plants.find(p=>p.id===req.plantId);
                const assignedIds = Array.isArray(req.assignedTo) ? req.assignedTo : (req.assignedTo ? [req.assignedTo] : []);
                const assignees = assignedIds.map(id=>users.find(u=>u.id===id)).filter(Boolean);
                const dl       = daysLeft(req.dueDate);
                const isSelected = selected.has(req.id);
                return (
                  <tr key={req.id}
                    className={`transition-colors ${isSelected
                      ? dk?'bg-red-900/20':'bg-red-50'
                      : dk?'hover:bg-gray-700/50':'hover:bg-slate-50'}`}>
                    {/* Row checkbox */}
                    <td className="pl-3 pr-1 py-1.5">
                      <input
                        type="checkbox"
                        checked={isSelected}
                        onChange={()=>toggleOne(req.id)}
                        className="w-4 h-4 rounded cursor-pointer" style={{accentColor:"var(--p600)"}}
                      />
                    </td>
                    <td className="px-2.5 py-1.5 max-w-0">
                      <div className="flex items-center gap-2 min-w-0">
                        <p className="font-medium truncate min-w-0" title={req.title}>{req.title}</p>
                        {req.evidence?.length>0 && <span className={`text-[11px] flex-shrink-0 whitespace-nowrap ${sub}`} title={`${req.evidence.length} file(s) attached`}>📎{req.evidence.length}</span>}
                        {req.applicableRule && <span className="text-[11px] flex-shrink-0 text-[color:var(--p500)] font-medium" title={req.applicableRule}>⚖️</span>}
                      </div>
                    </td>
                    <td className={`px-2.5 py-1.5 whitespace-nowrap ${sub}`}>{plant?.name}</td>
                    <td className={`px-2.5 py-1.5 whitespace-nowrap ${sub}`}>{req.category}</td>
                    <td className="px-2.5 py-1.5 whitespace-nowrap">
                      {assignees.length > 0 ? (
                        <div className="flex items-center gap-1" title={assignees.map(a=>a.name).join(', ')}>
                          {assignees.slice(0,3).map(a=>(
                            <div key={a.id} className="flex items-center gap-1" title={a.name}>
                              <div className="w-5 h-5 text-[10px] rounded-full flex items-center justify-center text-white text-xs flex-shrink-0" style={{background:"var(--p600)"}}>{initials(a.name)}</div>
                              {assignees.length === 1 && <span className={`text-xs ${sub} truncate max-w-[80px]`}>{a.name}</span>}
                            </div>
                          ))}
                          {assignees.length > 3 && <span className={`text-xs font-semibold ${sub}`}>+{assignees.length-3}</span>}
                          {assignees.length > 1 && <span className={`text-xs ${sub}`}>{assignees.length} users</span>}
                        </div>
                      ) : <span className="text-xs text-red-400">Unassigned</span>}
                    </td>
                    <td className="px-2.5 py-1.5"><Badge label={req.priority} color={PRIORITY_CLR[req.priority]} /></td>
                    <td className="px-2.5 py-1.5 whitespace-nowrap">
                      <div className="flex items-center gap-1.5">
                        <Badge label={getDisplayStatus(req)} color={STATUS_CLR[getDisplayStatus(req)]} />
                        {req.status==='Completed' && req.completionDate && (
                          <span className="text-[11px] text-green-500" title={`Completed on ${formatDate(req.completionDate)}`}>✓ {formatDate(req.completionDate)}</span>
                        )}
                        {req.status!=='Completed' && (dl<0
                          ? <span className="text-[11px] text-red-400">{Math.abs(dl)}d overdue</span>
                          : dl<=7
                            ? <span className="text-[11px] text-amber-500">{dl}d left</span>
                            : null
                        )}
                      </div>
                    </td>
                    <td className="px-2.5 py-1.5 whitespace-nowrap">
                      {(() => {
                        const fl = req.complianceFrequency && req.complianceFrequency!=='one_time'
                          ? (COMPLIANCE_FREQS.find(f=>f.value===req.complianceFrequency)||{label:req.complianceFrequency}).label.replace(/\s*\(.*\)\s*$/,'')
                          : null;
                        const freqTag = fl && <span className={`text-[10px] px-1.5 py-px rounded ${dk?'bg-gray-700 text-gray-400':'bg-gray-100 text-gray-500'}`}>{fl}</span>;
                        return (req.status === 'Completed' && req.nextDueDate && req.complianceFrequency !== 'one_time') ? (
                          <div className="flex items-center gap-1.5" title={`Previous due: ${formatDate(req.dueDate)}`}>
                            <span className="text-xs font-semibold text-blue-500">🔄 Next: {formatDate(req.nextDueDate)}</span>
                            {freqTag}
                          </div>
                        ) : (
                          <div className="flex items-center gap-1.5">
                            <span className={`text-xs ${dl<0?'text-red-500':dl<7?'text-amber-500':sub}`}>{formatDate(req.dueDate)}</span>
                            {freqTag}
                          </div>
                        );
                      })()}
                    </td>
                    <td className="px-2.5 py-1.5">
                      <div className="flex items-center gap-0.5">
                        <button onClick={()=>setViewReq(req)} className={`p-1.5 rounded-lg text-xs hover:bg-gray-100 hover:text-gray-600 transition-colors ${sub}`} title="View">👁️</button>
                        <button onClick={()=>setEditReq(req)} className={`p-1.5 rounded-lg text-xs hover:bg-amber-100 hover:text-amber-600 transition-colors ${sub}`} title="Edit">✏️</button>
                        <button onClick={()=>setOnBehalfReq(req)} className={`p-1.5 rounded-lg text-xs hover:bg-purple-100 hover:text-purple-600 transition-colors ${sub}`} title="Admin: Upload Evidence / Change Status on behalf of user">🛡️</button>
                        <button onClick={()=>setDelId(req.id)} className={`p-1.5 rounded-lg text-xs hover:bg-red-100 hover:text-red-600 transition-colors ${sub}`} title="Delete">🗑️</button>
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════
   ADMIN – USERS
═══════════════════════════════════════════ */
function AdminUsers({ dk, plants, users, updateUsers }) {
  const [showAdd, setShowAdd] = useState(false);
  const [editU,   setEditU]   = useState(null);
  const [delId,   setDelId]   = useState(null);
  const [search,  setSearch]  = useState('');

  const blank = { name:'', email:'', password:'', role:'user', plantId:'', dept:'', phone:'' };
  const [form, setForm] = useState(blank);
  const [saving, setSaving] = useState(false);

  const openAdd = () => { setForm(blank); setShowAdd(true); };
  const openEdit= u  => { setForm({...u}); setEditU(u); setShowAdd(true); };
  const set     = (k,v) => setForm(f=>({...f,[k]:v}));

  const save = async () => {
    const isTM = form.role === 'top_management';
    const needsPlant = form.role === 'plant_admin' || form.role === 'plant_head';
    if (!form.name || !form.email) return;
    if (!isTM && !form.password) return;
    if (needsPlant && !form.plantId) return; // plant required for plant roles
    setSaving(true);
    await new Promise(r=>setTimeout(r,400));
    const userData = isTM ? { ...form, password: null } : form;
    if (editU) { updateUsers(users.map(u=>u.id===editU.id?{...u,...userData}:u)); }
    else       { updateUsers([...users, {...userData, id:`u${Date.now()}`}]); }
    setSaving(false); setShowAdd(false); setEditU(null);
  };
  const confirmDel = () => { updateUsers(users.filter(u=>u.id!==delId)); setDelId(null); };

  const filtered = users.filter(u=>u.id!=='__dev__'&&(u.name.toLowerCase().includes(search.toLowerCase())||u.email.toLowerCase().includes(search.toLowerCase())));
  const card = `rounded-2xl border shadow-sm ${dk?'bg-gray-800 border-gray-700':'bg-white border-gray-200'}`;
  const sub  = dk?'text-gray-400':'text-gray-500';
  const roleBg = { admin:'t-badge-admin', top_management:'bg-purple-100 text-purple-700', plant_admin:'bg-orange-100 text-orange-700', plant_head:'bg-teal-100 text-teal-700', user:'bg-green-100 text-green-700' };

  return (
    <div className="space-y-5">
      <ConfirmModal open={!!delId} message="Delete this user account?" onConfirm={confirmDel} onCancel={()=>setDelId(null)} />

      <Modal open={showAdd} onClose={()=>{setShowAdd(false);setEditU(null);}} title={editU?'Edit User':'Add New User'}>
        <div className="space-y-4">
          <div className="grid grid-cols-2 gap-4">
            <FormField label="Full Name" required><input value={form.name} onChange={e=>set('name',e.target.value)} placeholder="Full name" className={inputCls} /></FormField>
            <FormField label="Email" required><input type="email" value={form.email} onChange={e=>set('email',e.target.value)} placeholder="email@company.com" className={inputCls} /></FormField>

            {/* Password — hidden for Top Management (they use magic link) */}
            {form.role !== 'top_management' ? (
              <FormField label="Password" required>
                <input type="password" value={form.password||''} onChange={e=>set('password',e.target.value)} placeholder="Min 8 characters" className={inputCls} />
