/* ═══════════════════════════════════════════
   CHANGE PASSWORD — shared by User & PlantHead
═══════════════════════════════════════════ */
function ChangePasswordPage({ dk, currentUser, users, updateUsers }) {
  const [cur,    setCur]    = useState('');
  const [np,     setNp]     = useState('');
  const [cp,     setCp]     = useState('');
  const [status, setStatus] = useState(null); // { type:'success'|'error', msg }
  const [saving, setSaving] = useState(false);
  const [showCur, setShowCur] = useState(false);
  const [showNp,  setShowNp]  = useState(false);

  const card   = `rounded-2xl border shadow-sm ${dk?'bg-gray-800 border-gray-700':'bg-white border-gray-200'}`;
  const inp    = `w-full border rounded-xl px-3 py-2.5 text-sm outline-none transition-colors ${dk?'bg-gray-700 border-gray-600 text-white placeholder-gray-400 focus:border-[color:var(--p400)]':'bg-white border-gray-300 text-gray-900 placeholder-gray-400 focus:border-[color:var(--p500)]'}`;
  const sub    = dk?'text-gray-400':'text-gray-500';

  const handleSave = async () => {
    setStatus(null);
    if (!cur)      { setStatus({type:'error', msg:'Enter your current password.'}); return; }
    if (np.length < 6) { setStatus({type:'error', msg:'New password must be at least 6 characters.'}); return; }
    if (np !== cp) { setStatus({type:'error', msg:'New passwords do not match.'}); return; }

    setSaving(true);
    try {
      // Verify current password
      const ok = await _verifyPw(currentUser.password, cur, currentUser.id);
      if (!ok) { setStatus({type:'error', msg:'Current password is incorrect.'}); setSaving(false); return; }

      // Hash new password
      const hashed = await _hashPw(np, currentUser.id);
      const updatedUser = { ...currentUser, password: hashed };
      const newUsers = users.map(u => u.id === currentUser.id ? updatedUser : u);
      updateUsers(newUsers);
      setCur(''); setNp(''); setCp('');
      setStatus({type:'success', msg:'✅ Password changed successfully!'});
    } catch(e) {
      setStatus({type:'error', msg:'Error: ' + e.message});
    }
    setSaving(false);
  };

  return (
    <div className="max-w-md space-y-5">
      <div>
        <h2 className="text-xl font-bold mb-1" style={{fontFamily:"'Outfit',sans-serif"}}>🔑 Change Password</h2>
        <p className={`text-sm ${sub}`}>Update your account password. Must be at least 6 characters.</p>
      </div>
      <div className={`${card} p-6 space-y-4`}>
        <div>
          <label className={`block text-xs font-semibold uppercase tracking-wide mb-1.5 ${sub}`}>Current Password</label>
          <div className="relative">
            <input type={showCur?'text':'password'} value={cur} onChange={e=>setCur(e.target.value)}
              placeholder="••••••••" className={inp} onKeyDown={e=>e.key==='Enter'&&document.getElementById('np-inp')?.focus()} />
            <button type="button" onClick={()=>setShowCur(s=>!s)}
              className={`absolute right-3 top-1/2 -translate-y-1/2 text-xs ${sub} hover:text-gray-700`}>{showCur?'Hide':'Show'}</button>
          </div>
        </div>
        <div>
          <label className={`block text-xs font-semibold uppercase tracking-wide mb-1.5 ${sub}`}>New Password</label>
          <div className="relative">
            <input id="np-inp" type={showNp?'text':'password'} value={np} onChange={e=>setNp(e.target.value)}
              placeholder="Min 6 characters" className={inp} onKeyDown={e=>e.key==='Enter'&&document.getElementById('cp-inp')?.focus()} />
            <button type="button" onClick={()=>setShowNp(s=>!s)}
              className={`absolute right-3 top-1/2 -translate-y-1/2 text-xs ${sub} hover:text-gray-700`}>{showNp?'Hide':'Show'}</button>
          </div>
        </div>
        <div>
          <label className={`block text-xs font-semibold uppercase tracking-wide mb-1.5 ${sub}`}>Confirm New Password</label>
          <input id="cp-inp" type="password" value={cp} onChange={e=>setCp(e.target.value)}
            placeholder="Repeat new password" className={inp} onKeyDown={e=>e.key==='Enter'&&handleSave()} />
        </div>
        {status && (
          <div className={`rounded-xl px-4 py-3 text-sm font-medium ${status.type==='success'?'bg-green-50 text-green-700 border border-green-200':'bg-red-50 text-red-700 border border-red-200'}`}>
            {status.msg}
          </div>
        )}
        <button onClick={handleSave} disabled={saving}
          className="w-full py-2.5 rounded-xl text-sm font-semibold text-white t-btn transition-all"
          style={{opacity:saving?0.6:1}}>
          {saving ? '⏳ Saving…' : '🔑 Update Password'}
        </button>
      </div>
      <div className={`rounded-xl border px-4 py-3 ${dk?'border-gray-700 bg-gray-800/50':'border-gray-200 bg-gray-50'}`}>
        <p className={`text-xs font-semibold uppercase tracking-wide mb-2 ${sub}`}>🔒 Security Tips</p>
        <ul className={`text-xs space-y-1 ${sub}`}>
          <li>• Use at least 8 characters with a mix of letters, numbers and symbols</li>
          <li>• Do not share your password with anyone</li>
          <li>• Change your password periodically for security</li>
        </ul>
      </div>

      {/* Biometric login — available on all roles from this page */}
      <BiometricSettings dk={dk} currentUser={currentUser} />
    </div>
  );
}

/** Upcoming Due Dates bar — 15 days / 1 month / 2 months */
function UpcomingDueDateBar({ requirements, dk, scopeLabel, onDrill }) {
  const buckets = [
    { key:'overdue', label:'Overdue',        color:'#b91c1c', bg:'rgba(185,28,28,0.12)',  border:'#b91c1c', icon:'🚨' },
    { key:'d15',     label:'Due in 15 Days', color:'#ef4444', bg:'rgba(239,68,68,0.12)', border:'#ef4444', icon:'⚠️' },
    { key:'d30',     label:'Due in 1 Month', color:'#f59e0b', bg:'rgba(245,158,11,0.12)',border:'#f59e0b', icon:'⏰' },
    { key:'d60',     label:'Due in 2 Months',color:'#3b82f6', bg:'rgba(59,130,246,0.12)',border:'#3b82f6', icon:'📅' },
  ];
  const active  = requirements.filter(r => r.status !== 'Completed' && r.dueDate);
  const overdue = active.filter(r => r.status === 'Overdue' || isEffectivelyOverdue(r));
  const d15     = active.filter(r => { const d = daysLeft(r.dueDate); return !isEffectivelyOverdue(r) && r.status !== 'Overdue' && d >= 0 && d <= 15; });
  const d30     = active.filter(r => { const d = daysLeft(r.dueDate); return !isEffectivelyOverdue(r) && r.status !== 'Overdue' && d > 15 && d <= 30; });
  const d60     = active.filter(r => { const d = daysLeft(r.dueDate); return !isEffectivelyOverdue(r) && r.status !== 'Overdue' && d > 30 && d <= 60; });
  const counts  = [overdue.length, d15.length, d30.length, d60.length];
  const lists   = [overdue, d15, d30, d60];
  const total   = counts.reduce((a,b)=>a+b,0) || 1;
  const card    = `rounded-2xl border shadow-sm p-5 ${dk?'bg-gray-800 border-gray-700':'bg-white border-gray-200'}`;
  const dkText  = dk?'#f9fafb':'#111827';
  const dkSub   = dk?'#9ca3af':'#6b7280';

  const handleDrill = (label, list) => {
    if (onDrill) onDrill(label, list);
  };

  const totalItems = counts.reduce((a,b)=>a+b,0);
  const overdueCount = counts[0];

  return (
    <div className={card}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'12px'}}>
        <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
          <span style={{fontSize:'16px'}}>📅</span>
          <h3 style={{margin:0,fontSize:'14px',fontWeight:700,fontFamily:"'Outfit',sans-serif",color:dkText}}>Due Dates Overview</h3>
          <span style={{fontSize:'11px',fontWeight:600,padding:'2px 8px',borderRadius:'999px',background:dk?'rgba(255,255,255,0.07)':'rgba(0,0,0,0.06)',color:dkSub}}>
            {totalItems} items
          </span>
          {overdueCount > 0 && (
            <span style={{fontSize:'11px',fontWeight:700,padding:'2px 8px',borderRadius:'999px',background:'rgba(185,28,28,0.12)',color:'#b91c1c',border:'1px solid rgba(185,28,28,0.3)'}}>
              🚨 {overdueCount} overdue
            </span>
          )}
        </div>
        {scopeLabel && <span style={{fontSize:'11px',color:dkSub}}>{scopeLabel}</span>}
      </div>
      {/* Stacked bar */}
      <div style={{display:'flex',height:'28px',borderRadius:'10px',overflow:'hidden',gap:'2px',background:dk?'#111827':'#f1f5f9'}}>
        {buckets.map((b,i)=>counts[i]>0?(
          <div key={b.key}
            onClick={()=>handleDrill(`${b.label}${scopeLabel?' – '+scopeLabel:''}`, lists[i])}
            title={`${counts[i]} requirement${counts[i]!==1?'s':''} – ${b.label}`}
            style={{flex:counts[i]/total,background:b.color,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'11px',fontWeight:700,color:'#fff',minWidth:'28px',transition:'opacity .15s'}}
            onMouseEnter={e=>e.currentTarget.style.opacity='.82'}
            onMouseLeave={e=>e.currentTarget.style.opacity='1'}>
            {counts[i]}
          </div>
        ):null)}
        {totalItems===0 && (
          <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'11px',color:dkSub}}>
            No upcoming or overdue items
          </div>
        )}
      </div>
      {/* Legend chips */}
      <div style={{display:'flex',gap:'8px',marginTop:'12px',flexWrap:'wrap'}}>
        {buckets.map((b,i)=>(
          <button key={b.key}
            onClick={()=>counts[i]>0&&handleDrill(`${b.label}${scopeLabel?' – '+scopeLabel:''}`, lists[i])}
            style={{display:'flex',alignItems:'center',gap:'6px',padding:'5px 10px',borderRadius:'8px',border:`1px solid ${b.border}`,background:b.bg,cursor:counts[i]>0?'pointer':'default',opacity:counts[i]>0?1:0.38,outline:'none',transition:'opacity .15s'}}>
            <span style={{width:'8px',height:'8px',borderRadius:'50%',background:b.color,flexShrink:0}}/>
            <span style={{fontSize:'11px',fontWeight:600,color:b.color}}>{b.label}</span>
            <span style={{fontSize:'12px',fontWeight:700,color:dkText}}>{counts[i]}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

/** Month-wise compliance trend — last 6 months */
function MonthTrendChart({ requirements, dk, title = 'Monthly Compliance Trend', className = '', chartHeight }) {
  const card = `rounded-2xl border shadow-sm p-5 ${dk?'bg-gray-800 border-gray-700':'bg-white border-gray-200'}`;
  const sub  = dk?'text-gray-400':'text-gray-500';
  const TT   = { contentStyle:{ background:dk?'#1f2937':'white', border:dk?'1px solid #374151':'1px solid #e5e7eb', borderRadius:10, fontSize:12, color:dk?'#f3f4f6':'#111827' }, itemStyle:{ color:dk?'#e5e7eb':'#374151' }, labelStyle:{ color:dk?'#f9fafb':'#111827', fontWeight:600 } };

  const trendData = React.useMemo(() => {
    const months = [];
    const now = new Date();
    for (let i = 5; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      const label = d.toLocaleDateString('en-IN', { month: 'short', year: '2-digit' });
      const yr = d.getFullYear(), mo = d.getMonth();
      const due  = requirements.filter(r => { if (!r.dueDate) return false; const dd = new Date(r.dueDate); return dd.getFullYear()===yr && dd.getMonth()===mo; });
      const done = due.filter(r => r.status === 'Completed');
      const over = due.filter(r => r.status !== 'Completed' && (r.status === 'Overdue' || isEffectivelyOverdue(r)));
      months.push({ m: d.toLocaleString('default', { month: 'short' }), Due: due.length, Completed: done.length, Overdue: over.length });
    }
    return months;
  }, [requirements]);

  return (
    <div className={`${card} ${className}`}>
      <div className="flex items-center justify-between mb-1">
        <h3 className="font-semibold text-sm" style={{fontFamily:"'Outfit',sans-serif"}}>{title}</h3>
        <span className={`text-xs ${sub}`}>last 6 months</span>
      </div>
      <p className={`text-xs mb-4 ${sub}`}>Number of requirements due each month, and how many were completed or are overdue</p>
      <ResponsiveContainer width="100%" height={chartHeight || 200}>
        <BarChart data={trendData} barSize={8} barGap={2}>
          <CartesianGrid strokeDasharray="3 3" stroke={dk?'#374151':'#f1f5f9'} vertical={false}/>
          <XAxis dataKey="m" tick={{fontSize:11,fill:dk?'#9ca3af':'#64748b'}} axisLine={false} tickLine={false}/>
          <YAxis allowDecimals={false} tick={{fontSize:11,fill:dk?'#9ca3af':'#64748b'}} axisLine={false} tickLine={false}/>
          <Tooltip {...TT} formatter={(v,n)=>[`${v} req`,n]}/>
          <Bar dataKey="Due"       fill="#94a3b8" radius={[3,3,0,0]}/>
          <Bar dataKey="Completed" fill="#22c55e" radius={[3,3,0,0]}/>
          <Bar dataKey="Overdue"   fill="#ef4444" radius={[3,3,0,0]}/>
          <Legend iconType="circle" iconSize={8} wrapperStyle={{fontSize:11}}/>
        </BarChart>
      </ResponsiveContainer>
    </div>
  );
}

/** Category-wise horizontal bar — status breakdown per category */
function CategoryHorizontalBar({ requirements, dk, onDrill, className = '', chartHeight }) {
  const card = `rounded-2xl border shadow-sm p-5 ${dk?'bg-gray-800 border-gray-700':'bg-white border-gray-200'}`;
  const sub  = dk?'text-gray-400':'text-gray-500';
  const TT   = { contentStyle:{ background:dk?'#1f2937':'white', border:dk?'1px solid #374151':'1px solid #e5e7eb', borderRadius:10, fontSize:12, color:dk?'#f3f4f6':'#111827' }, itemStyle:{ color:dk?'#e5e7eb':'#374151' }, labelStyle:{ color:dk?'#f9fafb':'#111827', fontWeight:600 } };

  const catData = React.useMemo(() => {
    const cats = [...new Set(requirements.map(r => r.category).filter(Boolean))];
    return cats.map(cat => {
      const reqs = requirements.filter(r => r.category === cat);
      return {
        cat: cat.length > 18 ? cat.slice(0,16)+'…' : cat,
        fullCat: cat,
        C: reqs.filter(r=>r.status==='Completed').length,
        I: reqs.filter(r=>r.status==='In Progress').length,
        P: reqs.filter(r=>r.status==='Pending').length,
        O: reqs.filter(r=>r.status==='Overdue').length,
        total: reqs.length,
      };
    }).sort((a,b)=>b.total-a.total).slice(0,8);
  }, [requirements]);

  return (
    <div className={`${card} ${className}`}>
      <h3 className="font-semibold text-sm mb-1" style={{fontFamily:"'Outfit',sans-serif"}}>Category-wise Status</h3>
      <p className={`text-xs mb-4 ${sub}`}>Click a bar to drill into that category</p>
      <ResponsiveContainer width="100%" height={chartHeight || Math.max(180, catData.length * 38)}>
        <BarChart data={catData} layout="vertical" barSize={10} barGap={2} margin={{left:4,right:8}}>
          <CartesianGrid strokeDasharray="3 3" stroke={dk?'#374151':'#f1f5f9'} horizontal={false}/>
          <XAxis type="number" tick={{fontSize:10,fill:dk?'#9ca3af':'#64748b'}} axisLine={false} tickLine={false}/>
          <YAxis type="category" dataKey="cat" tick={{fontSize:10,fill:dk?'#9ca3af':'#64748b'}} axisLine={false} tickLine={false} width={90}/>
          <Tooltip {...TT}/>
          <Legend iconType="circle" iconSize={7} wrapperStyle={{fontSize:10}}/>
          <Bar dataKey="C" name="Completed"   fill="#22c55e" radius={[0,3,3,0]} stackId="s" cursor="pointer" onClick={(d)=>onDrill&&onDrill(`Category: ${d.fullCat} – Completed`,   requirements.filter(r=>r.category===d.fullCat&&r.status==='Completed'))}/>
          <Bar dataKey="I" name="In Progress" fill="#6366f1" radius={[0,0,0,0]} stackId="s" cursor="pointer" onClick={(d)=>onDrill&&onDrill(`Category: ${d.fullCat} – In Progress`, requirements.filter(r=>r.category===d.fullCat&&r.status==='In Progress'))}/>
          <Bar dataKey="P" name="Pending"     fill="#f59e0b" radius={[0,0,0,0]} stackId="s" cursor="pointer" onClick={(d)=>onDrill&&onDrill(`Category: ${d.fullCat} – Pending`,     requirements.filter(r=>r.category===d.fullCat&&r.status==='Pending'))}/>
          <Bar dataKey="O" name="Overdue"     fill="#ef4444" radius={[0,3,3,0]} stackId="s" cursor="pointer" onClick={(d)=>onDrill&&onDrill(`Category: ${d.fullCat} – Overdue`,     requirements.filter(r=>r.category===d.fullCat&&r.status==='Overdue'))}/>
        </BarChart>
      </ResponsiveContainer>
    </div>
  );
}

  const completed = myReqs.filter(r => r.status === 'Completed').length;
  const overdue   = myReqs.filter(r => r.status === 'Overdue' || isEffectivelyOverdue(r)).length;
  const card      = `rounded-2xl border shadow-sm ${dk?'bg-gray-800 border-gray-700':'bg-white border-gray-200'}`;
  const sub       = dk?'text-gray-400':'text-gray-500';
  const TT        = { contentStyle:{ background:dk?'#1f2937':'white', border:dk?'1px solid #374151':'1px solid #e5e7eb', borderRadius:10, fontSize:12, color:dk?'#f3f4f6':'#111827' }, itemStyle:{ color:dk?'#e5e7eb':'#374151' }, labelStyle:{ color:dk?'#f9fafb':'#111827', fontWeight:600 } };
  const teamUsers = users.filter(u => u.plantId === currentUser.plantId && u.role === 'user');
  const statusPie = STATUSES.map(s => ({ name:s, value:myReqs.filter(r=>r.status===s).length }));

  const [drillModal, setDrillModal] = useState(null);

  const Overview = () => (
    <div className="space-y-5">
      {drillModal && (
        <Modal open={!!drillModal} onClose={()=>setDrillModal(null)} title={drillModal.title} wide dk={dk}>
          <div className="space-y-2">
            {drillModal.reqs.map(r=>(
              <div key={r.id} className={`p-3 rounded-xl border ${dk?'bg-gray-700 border-gray-600':'bg-gray-50 border-gray-200'}`}>

                  <p className="text-sm font-semibold">{r.title}</p>
                  <Badge label={r.status} color={STATUS_CLR[r.status]}/>
                </div>
                <p className={`text-xs mt-1 ${sub}`}>{r.category} · Due: {formatDate(r.dueDate)}</p>
              </div>
            ))}

      )}
      <div className={`p-4 rounded-2xl border ${dk?'bg-orange-900/20 border-orange-700/40':'bg-orange-50 border-orange-100'}`}>
        <p className="text-sm font-semibold" style={{color:'var(--p600)'}}>🏭 {myPlant?.name} — {myPlant?.state}</p>
        <p className={`text-xs mt-0.5 ${sub}`}>Plant Admin · Full management access for this plant · {new Date().toLocaleDateString('en-IN',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}</p>
      </div>
      <div className="grid grid-cols-2 xl:grid-cols-4 gap-4">
        <StatCard dk={dk} label="Total Requirements" value={total}     icon="📋" color="t-stat-icon"              accent="var(--p500)" sub={myPlant?.name} />
        <StatCard dk={dk} label="Compliance Rate"    value={total?`${Math.round(completed/total*100)}%`:'—'} icon="✅" color="bg-green-100 text-green-600" accent="#22c55e" sub={`${completed} complied`} />
        <StatCard dk={dk} label="Overdue"            value={overdue}   icon="🚨" color="bg-red-100 text-red-600"   accent="#ef4444" sub="Needs attention" />

      <UpcomingDueDateBar requirements={myReqs} dk={dk} scopeLabel={myPlant?.name} onDrill={(title,reqs)=>setDrillModal({title,reqs})} />

          <ResponsiveContainer width="100%" height={200}>
            <PieChart>
              <Pie data={statusPie} cx="50%" cy="50%" outerRadius={75} innerRadius={42} paddingAngle={3} dataKey="value" isAnimationActive={true}
                cursor="pointer" onClick={d=>d&&setDrillModal({title:d.name,reqs:myReqs.filter(r=>r.status===d.name)})}>

              <Tooltip {...TT}/>
              <Bar dataKey="Total" fill="#6366f130" radius={[4,4,0,0]}/>
              <Bar dataKey="Done"  fill="#22c55e"   radius={[4,4,0,0]}/>
              <Legend iconType="circle" iconSize={8} wrapperStyle={{fontSize:12}}/>
            </BarChart>
          </ResponsiveContainer>
        </div>
      </div>
      <MonthTrendChart requirements={myReqs} dk={dk} title="Monthly Due vs Completed — My Plant"/>
      <CategoryHorizontalBar requirements={myReqs} dk={dk} onDrill={(title,reqs)=>setDrillModal({title,reqs})}/>
    </div>
  );

  // Plant Admin gets full CRUD on their own plant's requirements
  // We reuse AdminRequirements but pass only their plant's data and lock the plant filter
  const PARequirements = () => (
    <AdminRequirements
      dk={dk}
      plants={plants.filter(p=>p.id===currentUser.plantId)}
      users={users}
      requirements={requirements}
      updateRequirements={updateRequirements}
      categories={categories||CATEGORIES}
      openReqId={notifReqId}
      onNotifReqOpened={()=>setNotifReqId(null)}
      plantFilter={currentUser.plantId}
    />
  );

  const Team = () => (
    <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
      {teamUsers.length===0 && <p className={`text-sm ${sub} col-span-3`}>No team members assigned to this plant yet.</p>}
      {teamUsers.map(u=>{
        const assigned = myReqs.filter(r=>(Array.isArray(r.assignedTo)?r.assignedTo:[r.assignedTo]).includes(u.id)).length;
        const done     = myReqs.filter(r=>(Array.isArray(r.assignedTo)?r.assignedTo:[r.assignedTo]).includes(u.id)&&r.status==='Completed').length;
        return (
          <div key={u.id} className={`${card} p-5`}>
            <div className="flex items-center gap-3 mb-4">
              <div className="w-11 h-11 rounded-xl flex items-center justify-center text-white font-bold" style={{background:"var(--p600)"}}>{initials(u.name)}</div>
              <div><p className="font-semibold text-sm">{u.name}</p><p className={`text-xs ${sub}`}>{u.dept}</p></div>
            </div>
            <div className="space-y-2 text-xs">
              <div className="flex justify-between"><span className={sub}>Assigned</span><span className="font-semibold">{assigned}</span></div>
              <div className="flex justify-between"><span className={sub}>Completed</span><span className="font-semibold text-green-500">{done}</span></div>
              <div className="flex justify-between"><span className={sub}>Compliance</span><span className="font-semibold">{assigned?Math.round(done/assigned*100):0}%</span></div>
              <div className={`h-1.5 rounded-full ${dk?'bg-gray-700':'bg-gray-100'} mt-2`}>
                <div className="h-full rounded-full" style={{background:'var(--p500)',width:`${assigned?Math.round(done/assigned*100):0}%`}}/>

            </div>
            <p className={`text-xs mt-3 ${sub}`}>📧 {u.email}</p>
          </div>
        );
      })}
    </div>
  );

  const pages = { overview:<AdminOverview dk={dk} plants={plants.filter(p=>p.id===currentUser.plantId)} users={users} requirements={myReqs} categories={categories} onGoToEdit={handleNotifClick} extraCharts={<div className="space-y-4 mt-4"><MonthTrendChart requirements={requirements.filter(r=>r.plantId===currentUser.plantId)} dk={dk} title="Monthly Due vs Completed — My Plant" /><CategoryHorizontalBar requirements={requirements.filter(r=>r.plantId===currentUser.plantId)} dk={dk} onDrill={()=>{}} /></div>} />, requirements:<PARequirements/>, team:<Team/>, changepassword:<ChangePasswordPage dk={dk} currentUser={currentUser} users={users} updateUsers={updateUsers}/> };

  return (
    <AppShell dk={dk} toggleTheme={toggleTheme} colourKey={colourKey} cycleColour={cycleColour} changeColour={changeColour}
      currentUser={currentUser} nav={nav} activePage={activePage} setActivePage={setActivePage}
      role="plant_admin" logout={logout} requirements={myReqs} onNotifClick={handleNotifClick} logoUrl={logoUrl} plants={plants}>
      {pages[activePage]}
    </AppShell>
  );
}

          <div className="flex flex-wrap gap-3 items-center">
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Search…" className={`${inputCls} max-w-[200px]`} />
            <select value={filter} onChange={e=>setFilter(e.target.value)} className={`${selectCls} w-36`}>
              <option value="">All Status</option>
              {STATUSES.map(s=><option key={s}>{s}</option>)}
            </select>
            <select value={catFilter} onChange={e=>setCatFilter(e.target.value)} className={`${selectCls} w-40`}>
              <option value="">All Categories</option>
              {cats.map(c=><option key={c}>{c}</option>)}
            </select>
            <span className={`text-xs ml-auto ${sub}`}>{filtered.length} requirement{filtered.length!==1?'s':''}</span>
          </div>
        </div>
        <div className={`${card} overflow-hidden`}>
          <table className="w-full text-sm">
            <thead className={`text-xs uppercase tracking-wide font-semibold ${dk?'bg-gray-700/60 text-gray-400':'bg-gray-50 text-gray-500'}`}>
              <tr>{['Title','Category','Assigned To','Priority','Status','Due Date','Next Due','Compliance'].map(h=><th key={h} className="text-left px-4 py-3 whitespace-nowrap">{h}</th>)}</tr>
            </thead>
            <tbody className={`divide-y ${dk?'divide-gray-700':'divide-gray-100'}`}>
              {filtered.length===0 && (
                <tr><td colSpan={8} className={`px-4 py-8 text-center text-sm ${sub}`}>No requirements match the filters.</td></tr>
              )}
              {filtered.map(r=>{
                const assignedIds = Array.isArray(r.assignedTo) ? r.assignedTo : (r.assignedTo ? [r.assignedTo] : []);
                const assignees   = assignedIds.map(id=>users.find(u=>u.id===id)).filter(Boolean);
                const dl = daysLeft(r.dueDate);
                const freq = (COMPLIANCE_FREQS.find(f=>f.value===r.complianceFrequency)||{label:'—'}).label;
                return (
                  <tr key={r.id} onClick={()=>setSelPHReq(r)}
                    className={`cursor-pointer ${dk?'hover:bg-gray-700/40':'hover:bg-gray-50/80'} transition-colors`}>
                    <td className="px-4 py-3 font-medium max-w-[200px]">
                      <p className="truncate">{r.title}</p>
                      {r.description && <p className={`text-xs truncate mt-0.5 ${sub}`}>{r.description}</p>}
                    </td>
                    <td className={`px-4 py-3 text-xs ${sub}`}>{r.category}</td>
                    <td className="px-4 py-3 text-xs">
                      {assignees.length>0
                        ? <div className="flex items-center gap-1 flex-wrap">
                            {assignees.slice(0,2).map(a=>(
                              <span key={a.id} className="flex items-center gap-1">
                                <div className="w-5 h-5 rounded-full flex items-center justify-center text-white text-xs flex-shrink-0" style={{background:"var(--p600)"}}>{initials(a.name)}</div>
                                {assignees.length===1&&<span className={sub}>{a.name}</span>}
                              </span>
                            ))}
                            {assignees.length>2&&<span className={sub}>+{assignees.length-2}</span>}
                          </div>
                        : <span className="text-red-400 text-xs">Unassigned</span>}
                    </td>
                    <td className="px-4 py-3"><Badge label={r.priority} color={PRIORITY_CLR[r.priority]} /></td>
                    <td className="px-4 py-3">
                      <Badge label={r.status} color={STATUS_CLR[r.status]} />
                      {r.status==='Completed' && r.completionDate && (
                        <p className="text-xs text-green-500 mt-0.5 whitespace-nowrap">✅ {formatDate(r.completionDate)}</p>
                      )}
                    </td>
                    <td className={`px-4 py-3 text-xs whitespace-nowrap ${dl<0?'text-red-500':dl<7?'text-amber-500':sub}`}>
                      {formatDate(r.dueDate)}
                      {dl>=0 && dl<=7 && <p className="text-amber-500">⚠ {dl}d left</p>}
                      {dl<0 && r.status!=='Completed' && <p className="text-red-500">🔴 {Math.abs(dl)}d over</p>}
                    </td>
                    <td className={`px-4 py-3 text-xs whitespace-nowrap`}>
                      {r.nextDueDate && r.complianceFrequency!=='one_time'
                        ? <span className="text-blue-500 font-medium">🔄 {formatDate(r.nextDueDate)}</span>
                        : <span className={sub}>—</span>}
                    </td>
                    <td className={`px-4 py-3 text-xs ${sub}`}>{freq}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
    );
  };

  const Team = () => (
    <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
      {teamUsers.length===0 && <p className={`text-sm ${sub} col-span-3`}>No team members assigned to this plant yet.</p>}
      {teamUsers.map(u=>{
        const assigned  = myReqs.filter(r=>(Array.isArray(r.assignedTo)?r.assignedTo:(r.assignedTo?[r.assignedTo]:[])).includes(u.id)).length;
        const done      = myReqs.filter(r=>(Array.isArray(r.assignedTo)?r.assignedTo:(r.assignedTo?[r.assignedTo]:[])).includes(u.id)&&r.status==='Completed').length;
        return (
          <div key={u.id} className={`${card} p-5`}>
            <div className="flex items-center gap-3 mb-4">
              <div className="w-11 h-11 rounded-xl flex items-center justify-center text-white font-bold" style={{background:"var(--p600)"}}>{initials(u.name)}</div>
              <div><p className="font-semibold text-sm">{u.name}</p><p className={`text-xs ${sub}`}>{u.dept}</p></div>
            </div>
            <div className="space-y-2 text-xs">
              <div className="flex justify-between"><span className={sub}>Assigned</span><span className="font-semibold">{assigned}</span></div>
              <div className="flex justify-between"><span className={sub}>Completed</span><span className="font-semibold text-green-500">{done}</span></div>
              <div className="flex justify-between"><span className={sub}>Compliance</span><span className="font-semibold">{assigned?Math.round(done/assigned*100):0}%</span></div>
              <div className={`h-1.5 rounded-full ${dk?'bg-gray-700':'bg-gray-100'} mt-2`}>
                <div className="h-full rounded-full" style={{background:'var(--p500)',width:`${assigned?Math.round(done/assigned*100):0}%`}}/>
              </div>
            </div>
            <p className={`text-xs mt-3 ${sub}`}>📧 {u.email}</p>
          </div>
        );
      })}
    </div>
  );

  const pages = { overview:<AdminOverview dk={dk} plants={plants.filter(p=>p.id===currentUser.plantId)} users={users} requirements={myReqs} categories={categories} onGoToEdit={handleNotifClick} extraCharts={<div className="space-y-4 mt-4"><MonthTrendChart requirements={requirements.filter(r=>r.plantId===currentUser.plantId)} dk={dk} title="Monthly Due vs Completed — My Plant" /><CategoryHorizontalBar requirements={requirements.filter(r=>r.plantId===currentUser.plantId)} dk={dk} onDrill={()=>{}} /></div>} />, requirements:<PHRequirements/>, team:<Team/>, changepassword:<ChangePasswordPage dk={dk} currentUser={currentUser} users={users} updateUsers={updateUsers}/> };

  // Requirement detail modal for Plant Head (view only)
  const PHModal = () => {
    if (!selPHReq) return null;
    const plant = plants.find(p=>p.id===selPHReq.plantId);
    const assignedIds = Array.isArray(selPHReq.assignedTo) ? selPHReq.assignedTo : (selPHReq.assignedTo ? [selPHReq.assignedTo] : []);
    const assignees = assignedIds.map(id=>users.find(u=>u.id===id)).filter(Boolean);
    const dl = daysLeft(selPHReq.dueDate);
    const sub2 = dk?'text-gray-400':'text-gray-500';
    return (
      <Modal open={!!selPHReq} onClose={()=>setSelPHReq(null)} title={selPHReq.title} wide dk={dk}>
        <div className="space-y-4 text-sm">
          <div className="flex flex-wrap gap-2">
            <Badge label={selPHReq.status}   color={STATUS_CLR[selPHReq.status]} />
            <Badge label={selPHReq.priority} color={PRIORITY_CLR[selPHReq.priority]} />
            <Badge label={selPHReq.category} color="#6366f1" />
            <Badge label={`L${selPHReq.escalationLevel} Escalation`} color="#8b5cf6" />
          </div>
          <p className={`leading-relaxed ${dk?'text-gray-200':'text-gray-700'}`}>{selPHReq.description}</p>
          <div className="grid grid-cols-2 gap-3">
            {[['📅 Due Date',formatDate(selPHReq.dueDate)],['⌛ Days Left',dl<0?`${Math.abs(dl)}d overdue`:dl===0?'Today':`${dl}d`],['🔔 Reminder',selPHReq.reminderFrequency],['🏭 Plant',plant?.name||'—'],['📍 State',plant?.state||'—'],['👤 Assigned To',assignees.length>0?assignees.map(a=>a.name).join(', '):'Unassigned']].map(([l,v])=>(
              <div key={l} className={`p-3 rounded-xl ${dk?'bg-gray-700':'bg-gray-50'}`}>
                <p className={`text-xs mb-0.5 ${sub2}`}>{l}</p>
                <p className={`font-medium text-xs ${dk?'text-gray-100':'text-gray-800'}`}>{v}</p>
              </div>
            ))}
          </div>
          {(selPHReq.applicableRule||selPHReq.legalClause) && (
            <div className={`rounded-xl border p-4 space-y-2 ${dk?'border-gray-700':'border-gray-200'}`}>
              <p className="text-xs font-bold uppercase tracking-widest text-[color:var(--p500)]">⚖️ Legal &amp; Regulatory</p>
              {selPHReq.applicableRule && <><p className={`text-xs font-semibold ${dk?'text-[color:var(--p300)]':'text-[color:var(--p600)]'}`}>Applicable Rule</p><p className={`text-sm ${dk?'text-white':'text-gray-800'}`}>{selPHReq.applicableRule}</p></>}
              {selPHReq.legalClause && <><p className={`text-xs font-semibold ${dk?'text-[color:var(--p300)]':'text-[color:var(--p600)]'}`}>Legal Clause</p><p className={`text-sm leading-relaxed ${dk?'text-gray-200':'text-gray-700'}`}>{selPHReq.legalClause}</p></>}
            </div>
          )}
          {selPHReq.evidence?.length > 0 && (
            <div>
              <p className={`font-semibold mb-2 text-xs uppercase tracking-wide ${sub2}`}>📎 Evidence ({selPHReq.evidence.length})</p>
              {selPHReq.evidence.map(e=>(
                <div key={e.id} className={`flex items-center gap-3 p-3 rounded-xl mb-2 ${dk?'bg-gray-700':'bg-gray-50'}`}>
                  <span className="text-xl">{(e.mimeType||'').startsWith('image/')?'🖼️':e.name?.toLowerCase().endsWith('.pdf')?'📑':'📄'}</span>
                  <div className="flex-1 min-w-0"><p className={`text-sm font-medium truncate ${dk?'text-gray-100':'text-gray-800'}`}>{e.name}</p><p className={`text-xs ${sub2}`}>{e.size} · {formatDate(e.uploadedAt)}</p></div>
                  <button onClick={()=>{ const url=e.storageUrl||e.dataUrl; if(url) window.open(url,'_blank'); }}
                    className="px-3 py-1.5 rounded-lg text-xs font-semibold text-white transition-colors flex-shrink-0" style={{background:"var(--p600)"}}>⬇️</button>
                </div>
              ))}
            </div>
          )}
          {selPHReq.comments?.length > 0 && (
            <div>
              <p className={`font-semibold mb-2 text-xs uppercase tracking-wide ${sub2}`}>💬 Comments ({selPHReq.comments.length})</p>
              {selPHReq.comments.map(c=>{ const u=users.find(x=>x.id===c.userId); return (
                <div key={c.id} className={`p-3 rounded-xl mb-2 ${dk?'bg-gray-700':'bg-gray-50'}`}>
                  <div className="flex items-center gap-2 mb-1">
                    <div className="w-5 h-5 rounded-full flex items-center justify-center text-white text-xs" style={{background:"var(--p600)"}}>{initials(u?.name||'?')}</div>
                    <span className="text-xs font-medium">{u?.name||'Unknown'}</span>
                    <span className={`text-xs ${sub2}`}>{formatDate(c.createdAt)}</span>
                  </div>
                  <p className={`text-xs ${sub2}`}>{c.text}</p>
                </div>
              );})}
            </div>
          )}
        </div>
      </Modal>
    );
  };

  return (
    <AppShell dk={dk} toggleTheme={toggleTheme} colourKey={colourKey} cycleColour={cycleColour} changeColour={changeColour} currentUser={currentUser} nav={nav}
      activePage={activePage} setActivePage={setActivePage} role="plant_head" logout={logout}
      requirements={requirements} onNotifClick={handleNotifClick} logoUrl={logoUrl} plants={plants}>
      <PHModal />
      {pages[activePage]}
    </AppShell>
  );
}

/* ═══════════════════════════════════════════
   USER DASHBOARD

/* ─── UserTaskModal: defined at module level so React never remounts it ─── */
function UserTaskModal({ selReq, setSelReq, dk, users, requirements, updateRequirements,
    currentUser, myPlant, uploading, evidenceSent, fileRef, uploadEvidence, deleteEvidence,
    downloadEvidence, updateStatus, sub, setPendingComment,
    setSendConfirmReqId, setShowSendModal }) {
  const [comment, setComment] = useState('');
  const [pendingCompletionDate, setPendingCompletionDate] = useState('');
  const [pendingNextDueDate, setPendingNextDueDate] = useState('');
  const commentRef = useRef();

  // Reset dates when a new requirement is opened
  React.useEffect(() => {
    if (selReq) {
      setPendingCompletionDate(selReq.completionDate || '');
      setPendingNextDueDate(selReq.nextDueDate || '');
    }
  }, [selReq?.id]);
  const addComment = (reqId) => {
    if (!comment.trim()) return;
    const c = { id:`c${Date.now()}`, text:comment, userId:currentUser.id, createdAt:new Date().toISOString() };
    const updated = requirements.map(r=>r.id===reqId?{...r,comments:[...(r.comments||[]),c]}:r);
    updateRequirements(updated);
    setSelReq(sr=>({...sr,comments:[...(sr.comments||[]),c]}));
    setComment('');
  };
  return (
    <Modal open={!!selReq} onClose={()=>setSelReq(null)} title={selReq?.title} task dk={dk}>
      {selReq && (() => {
        /* ── shared helpers ── */
        const bdr  = dk?'border-gray-700':'border-gray-100';
        const sec  = `text-[10px] font-bold uppercase tracking-widest mb-1.5 ${dk?'text-gray-400':'text-gray-400'}`;
        const card = (extra='') => `rounded-xl border p-2.5 ${dk?'bg-gray-700/40 border-gray-600':'bg-gray-50 border-gray-200'} ${extra}`;

        /* ── next-due helpers ── */
        const base      = pendingCompletionDate || selReq.dueDate;
        const freq      = selReq.complianceFrequency || 'annual';
        const autoDate  = (selReq.complianceFrequency && selReq.complianceFrequency !== 'one_time' && base)
                            ? computeNextDueDate(base, freq) : null;
        const freqLabel = (COMPLIANCE_FREQS.find(f=>f.value===freq)||{label:freq}).label;
        const isCustomND = pendingNextDueDate && autoDate && pendingNextDueDate !== autoDate;
        const displayND  = pendingNextDueDate || autoDate || '';
        const saveNextDue = (dateVal) => {
          const finalDate = dateVal || autoDate || '';
          setPendingNextDueDate(finalDate);
          const updatedReq = { ...selReq, nextDueDate: finalDate };
          updateRequirements(requirements.map(r => r.id === selReq.id ? updatedReq : r));
          setSelReq(sr => ({ ...sr, nextDueDate: finalDate }));
        };
        const hasEvidence = (selReq.evidence?.length > 0);

        /* ── style tokens ── */
        const bg0  = dk?'#1f2937':'#ffffff';
        const bg1  = dk?'rgba(255,255,255,0.05)':'#f8fafc';
        const bdr  = dk?'#374151':'#e5e7eb';
        const tx1  = dk?'#f3f4f6':'#111827';
        const tx2  = dk?'#9ca3af':'#6b7280';
        const tx3  = dk?'#6b7280':'#9ca3af';

        /* ── tiny reusable sub-label ── */
        const SL = ({children:c}) => <p style={{fontSize:9,fontWeight:700,color:tx3,textTransform:'uppercase',letterSpacing:'.5px',margin:'0 0 4px'}}>{c}</p>;

        /* ── info tile ── */
        const Tile = ({icon,label,value}) => (
          <div style={{padding:'7px 9px',borderRadius:8,background:bg1,border:`1px solid ${bdr}`}}>
            <p style={{fontSize:9,fontWeight:600,color:tx3,textTransform:'uppercase',letterSpacing:'.4px',margin:'0 0 2px'}}>{icon} {label}</p>
            <p style={{fontSize:11,fontWeight:600,color:tx1,margin:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={value}>{value}</p>
          </div>
        );

        return (
          /* ══ 2-column layout  left(40%) | right(60%)
               Left  : badges · info tiles · update-status · completion details
               Right : evidence list · attach button · comments · send bar
               Modal auto-sizes to content — no scroll anywhere
          ══ */
          <div style={{display:'grid',gridTemplateColumns:'40% 60%',gap:16}}>

            {/* ══ LEFT ══ */}
            <div style={{display:'flex',flexDirection:'column',gap:10,borderRight:`1px solid ${bdr}`,paddingRight:16}}>

              {/* Badges row */}
              <div style={{display:'flex',flexWrap:'wrap',gap:4}}>
                <Badge label={getDisplayStatus(selReq)} color={STATUS_CLR[getDisplayStatus(selReq)]} />
                <Badge label={selReq.priority}          color={PRIORITY_CLR[selReq.priority]} />
                <Badge label={selReq.category}          color="#6366f1" />
                <Badge label={`L${selReq.escalationLevel} Escalation`} color="#8b5cf6" />
              </div>

              {/* 2×3 info tiles */}
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:5}}>
                <Tile icon="📅" label="Due Date"        value={formatDate(selReq.dueDate)} />
                <Tile icon="🏭" label="Plant"           value={myPlant?.name||'—'} />
                <Tile icon="🔔" label="Reminder"        value={selReq.reminderFrequency||'—'} />
                <Tile icon="📍" label="State"           value={myPlant?.state||'—'} />
                <Tile icon="🔁" label="Frequency"       value={freqLabel} />
                <Tile icon="⚖️" label="Applicable Rule" value={selReq.applicableRule||'—'} />
              </div>

              {/* UPDATE STATUS */}
              <div style={{padding:'10px 12px',borderRadius:10,background:bg1,border:`1px solid ${bdr}`}}>
                <SL>Update Status</SL>
                {!hasEvidence && (
                  <div style={{display:'flex',alignItems:'center',gap:5,padding:'5px 8px',borderRadius:7,border:`1px solid ${dk?'rgba(245,158,11,.4)':'#fde68a'}`,background:dk?'rgba(245,158,11,.08)':'#fffbeb',marginBottom:6}}>
                    <span style={{fontSize:11}}>🔒</span>
                    <p style={{fontSize:10,color:dk?'#fbbf24':'#92400e',margin:0}}><strong>Upload evidence first</strong> to mark Completed.</p>
                  </div>
                )}
                <div style={{display:'flex',gap:5,flexWrap:'wrap',marginBottom:4}}>
                  {STATUSES.filter(s=>s!=='Overdue').map(s=>{
                    const locked = s==='Completed'&&!hasEvidence;
                    const active = selReq.status===s;
                    return (
                      <button key={s}
                        onClick={()=>{ if(!locked) updateStatus(selReq.id,s,s==='Completed'?pendingCompletionDate:undefined); }}
                        style={{padding:'5px 13px',borderRadius:8,fontSize:11,fontWeight:700,cursor:locked?'not-allowed':'pointer',
                          opacity:locked?.4:1,border:'2px solid',transition:'all .15s',
                          background:active?STATUS_CLR[s]:'transparent',
                          borderColor:active?STATUS_CLR[s]:(dk?'#374151':'#e5e7eb'),
                          color:active?'#fff':STATUS_CLR[s]}}>
                        {s==='Completed'&&locked?'🔒 Completed':s}
                      </button>
                    );
                  })}
                </div>
                {isEffectivelyOverdue(selReq) && (
                  <p style={{fontSize:10,fontWeight:600,color:'#ef4444',margin:0}}>🚨 Overdue since {formatDate(selReq.dueDate)} — pick a status above.</p>
                )}
              </div>

              {/* COMPLETION DETAILS */}
              <div style={{padding:'10px 12px',borderRadius:10,
                background: selReq.status==='Completed'?(dk?'rgba(34,197,94,.06)':'#f0fdf4'):(dk?'rgba(255,255,255,.02)':'#fafafa'),
                border:`1px solid ${selReq.status==='Completed'?(dk?'rgba(34,197,94,.3)':'#bbf7d0'):bdr}`,
                opacity:selReq.status==='Completed'?1:0.5,pointerEvents:selReq.status==='Completed'?'auto':'none'}}>
                <SL>✅ Completion Details {selReq.status!=='Completed'&&<span style={{fontWeight:400,textTransform:'none'}}>(mark Completed above)</span>}</SL>

                {/* Completion date */}
                <div style={{marginBottom:8}}>
                  <p style={{fontSize:10,fontWeight:600,color:dk?'#86efac':'#15803d',margin:'0 0 4px'}}>Completion Date <span style={{fontWeight:400,opacity:.7}}>(actual)</span></p>
                  <input type="date" value={pendingCompletionDate} max={new Date().toISOString().split('T')[0]}
                    onChange={e=>{
                      const d=e.target.value; setPendingCompletionDate(d);
                      const an=freq!=='one_time'?computeNextDueDate(d||selReq.dueDate,freq):null;
                      const pa=computeNextDueDate(pendingCompletionDate||selReq.dueDate,freq);
                      const ic=pendingNextDueDate&&an&&pendingNextDueDate!==pa;
                      if(!ic&&an) setPendingNextDueDate(an);
                      updateStatus(selReq.id,'Completed',d,ic?pendingNextDueDate:an);
                    }}
                    style={{width:'100%',padding:'6px 9px',borderRadius:7,border:`1px solid ${dk?'rgba(74,222,128,.4)':'#a7f3d0'}`,background:bg0,color:tx1,fontSize:12,outline:'none',boxSizing:'border-box'}}
                  />
                </div>

                {/* Next cycle due date */}
                {autoDate && (
                  <div>
                    <p style={{fontSize:10,fontWeight:600,color:dk?'#93c5fd':'#1d4ed8',margin:'0 0 4px',display:'flex',alignItems:'center',gap:5}}>
                      🔄 Next Cycle Due Date
                      {isCustomND&&<span style={{fontSize:8,fontWeight:700,padding:'1px 4px',borderRadius:3,background:'rgba(99,102,241,.15)',color:'var(--p600)'}}>CUSTOM</span>}
                    </p>
                    <div style={{display:'flex',gap:5}}>
                      <input type="date" value={displayND} onChange={e=>saveNextDue(e.target.value)}
                        title={`Auto: ${formatDate(autoDate)} (${freqLabel})`}
                        style={{flex:1,padding:'6px 9px',borderRadius:7,border:`1px solid ${dk?'rgba(147,197,253,.4)':'#bfdbfe'}`,background:bg0,color:tx1,fontSize:12,outline:'none',boxSizing:'border-box'}}
                      />
                      {isCustomND&&(
                        <button onClick={()=>saveNextDue(autoDate)}
                          style={{padding:'6px 9px',borderRadius:7,border:`1px solid ${bdr}`,background:bg1,color:tx2,fontSize:10,cursor:'pointer',flexShrink:0}}>↺</button>
                      )}
                    </div>
                    <p style={{fontSize:9,color:dk?'#60a5fa':'#3b82f6',margin:'3px 0 0'}}>
                      {freqLabel} · from {pendingCompletionDate?'completion':'due'} date
                      {isCustomND&&<span style={{color:tx3}}> · Auto: {formatDate(autoDate)}</span>}
                    </p>
                  </div>
                )}
              </div>

              {/* Evidence status pill */}
              {selReq.status==='Completed' && (
                hasEvidence
                  ? <div style={{display:'flex',alignItems:'center',gap:6,padding:'6px 10px',borderRadius:8,border:'1px solid #bbf7d0',background:dk?'rgba(34,197,94,.08)':'#f0fdf4'}}>
                      <span style={{fontSize:12}}>✅</span>
                      <p style={{fontSize:11,color:dk?'#4ade80':'#16a34a',margin:0,fontWeight:600}}>Evidence attached ({selReq.evidence.length} file{selReq.evidence.length!==1?'s':''})</p>
                    </div>
                  : <div style={{display:'flex',alignItems:'center',gap:6,padding:'6px 10px',borderRadius:8,border:'1px solid #fecaca',background:dk?'rgba(239,68,68,.08)':'#fef2f2'}}>
                      <span style={{fontSize:12}}>🔒</span>
                      <p style={{fontSize:11,color:dk?'#fca5a5':'#dc2626',margin:0,fontWeight:600}}>Attach at least one document →</p>
                    </div>
              )}
            </div>{/* end LEFT */}

            {/* ══ RIGHT ══ */}
            <div style={{display:'flex',flexDirection:'column',gap:10}}>

              {/* EVIDENCE section */}
              <div>
                <SL>📎 Evidence / Documents</SL>
                <div style={{display:'flex',flexDirection:'column',gap:5,marginBottom:6}}>
                  {(selReq.evidence||[]).length===0 && (
                    <p style={{fontSize:11,color:tx3,margin:0,padding:'4px 0'}}>No evidence attached yet.</p>
                  )}
                  {(selReq.evidence||[]).map(e=>{
                    const fu=e.storageUrl||e.dataUrl;
                    const isImg=fu&&(e.mimeType||'').startsWith('image/');
                    const isPdf=fu&&(e.mimeType==='application/pdf'||e.name.toLowerCase().endsWith('.pdf'));
                    const cv=isImg||isPdf;
                    return (
                      <div key={e.id} style={{display:'flex',alignItems:'center',gap:8,padding:'7px 10px',borderRadius:9,border:`1px solid ${bdr}`,background:bg1}}>
                        <span style={{fontSize:17,flexShrink:0}}>{isImg?'🖼️':isPdf?'📑':'📄'}</span>
                        <div style={{flex:1,minWidth:0}}>
                          <p style={{fontSize:12,fontWeight:600,color:tx1,margin:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{e.name}</p>
                          <p style={{fontSize:9,color:tx3,margin:0}}>{e.size} · {formatDate(e.uploadedAt)}</p>
                        </div>
                        <div style={{display:'flex',gap:4,flexShrink:0}}>
                          {cv&&<button onClick={()=>window.open(fu,'_blank')} style={{padding:'4px 8px',borderRadius:6,border:`1px solid ${bdr}`,background:bg0,color:tx2,fontSize:11,cursor:'pointer'}}>👁️ View</button>}
                          <button onClick={()=>downloadEvidence(e)} style={{padding:'4px 10px',borderRadius:6,border:'none',background:'var(--p600)',color:'#fff',fontSize:11,cursor:'pointer',fontWeight:600}}>⬇️ Download</button>
                          <button onClick={()=>deleteEvidence(selReq.id,e.id)} style={{padding:'4px 8px',borderRadius:6,border:'1px solid rgba(239,68,68,.3)',background:'rgba(239,68,68,.07)',color:'#ef4444',fontSize:11,cursor:'pointer'}}>🗑️</button>
                        </div>
                      </div>
                    );
                  })}
                </div>
                <input type="file" ref={fileRef} className="hidden" onChange={e=>{ if(e.target.files[0]) uploadEvidence(selReq.id,e.target.files[0]); e.target.value=''; }} />
                {evidenceSent
                  ? <div style={{padding:'7px 10px',borderRadius:8,background:'#22c55e',color:'#fff',fontSize:11,fontWeight:600,textAlign:'center'}}>✅ File attached! Add a comment and click Send.</div>
                  : <button onClick={()=>fileRef.current.click()} disabled={uploading}
                      style={{width:'100%',padding:'7px',borderRadius:8,border:`2px dashed ${bdr}`,background:'transparent',color:tx3,fontSize:11,cursor:'pointer',transition:'all .15s'}}
                      onMouseEnter={e=>{e.currentTarget.style.borderColor='var(--p400)';e.currentTarget.style.color='var(--p600)';}}
                      onMouseLeave={e=>{e.currentTarget.style.borderColor=bdr;e.currentTarget.style.color=tx3;}}>
                      {uploading?'⏳ Uploading…':'📎 Click to Attach Evidence'}
                    </button>
                }
              </div>

              {/* Divider */}
              <div style={{height:1,background:bdr}} />

              {/* COMMENTS */}
              <div>
                <SL>💬 Comments</SL>
                <div style={{display:'flex',flexDirection:'column',gap:5,marginBottom:8,maxHeight:180,overflowY:'auto'}}>
                  {(selReq.comments||[]).length===0&&<p style={{fontSize:11,color:tx3,margin:0}}>No comments yet.</p>}
                  {(selReq.comments||[]).map(c=>{
                    const u=users.find(x=>x.id===c.userId);
                    return (
                      <div key={c.id} style={{padding:'7px 10px',borderRadius:8,background:bg1,border:`1px solid ${bdr}`}}>
                        <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:3}}>
                          <div style={{width:20,height:20,borderRadius:'50%',background:'var(--p600)',display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontSize:9,fontWeight:700,flexShrink:0}}>{initials(u?.name||'?')}</div>
                          <span style={{fontSize:11,fontWeight:600,color:tx1}}>{u?.name||'Unknown'}</span>
                          <span style={{fontSize:10,color:tx3,marginLeft:'auto'}}>{formatDate(c.createdAt)}</span>
                        </div>
                        <p style={{fontSize:11,color:tx2,margin:0,lineHeight:1.5}}>{c.text}</p>
                      </div>
                    );
                  })}
                </div>
                <div style={{display:'flex',gap:6}}>
                  <textarea ref={commentRef} value={comment} onChange={e=>setComment(e.target.value)}
                    placeholder="Add a comment…" rows={2}
                    onKeyDown={e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();if(hasEvidence){setPendingComment(comment);setSendConfirmReqId(selReq.id);setShowSendModal(true);}else{addComment(selReq.id);}} }}
                    style={{flex:1,padding:'7px 10px',borderRadius:8,border:`1px solid ${bdr}`,background:bg0,color:tx1,fontSize:12,resize:'none',outline:'none',fontFamily:'inherit'}} />
                  <button onClick={()=>{ if(hasEvidence){setPendingComment(comment);setSendConfirmReqId(selReq.id);setShowSendModal(true);}else{addComment(selReq.id);setSelReq(null);} }}
                    style={{padding:'0 18px',borderRadius:8,border:'none',background:'var(--p600)',color:'#fff',fontSize:12,fontWeight:700,cursor:'pointer',flexShrink:0,alignSelf:'stretch'}}>
                    Send
                  </button>
                </div>
              </div>

            </div>{/* end RIGHT */}
          </div>/* end 2-col */
        );
      })()}
    </Modal>
  );
}

/* ─── UserSendConfirmModal: defined at module level ─── */
function UserSendConfirmModal({ showSendModal, sendConfirmReqId, requirements, dk, currentUser,
    updateRequirements, setSelReq, setPendingComment, setShowSendModal, setSendConfirmReqId,
    deleteEvidence, pendingComment, sub }) {
  // Hook must come BEFORE any early return (Rules of Hooks)
  const [delConfirmId, setDelConfirmId] = useState(null);
  const req = requirements ? requirements.find(r => r.id === sendConfirmReqId) : null;
  if (!showSendModal || !req) return null;
  const evList = req.evidence || [];
  const confirmSend = () => {
    if (pendingComment && pendingComment.trim()) {
      const c = { id:`c${Date.now()}`, text:pendingComment, userId:currentUser.id, createdAt:new Date().toISOString() };
      const updated = requirements.map(r=>r.id===sendConfirmReqId?{...r,comments:[...(r.comments||[]),c]}:r);
      updateRequirements(updated);
      setSelReq(sr=>sr?{...sr,comments:[...(sr.comments||[]),c]}:sr);
      setPendingComment('');
    }
    setShowSendModal(false);
    setSendConfirmReqId(null);
    setSelReq(null);
  };
  const cancelSend = () => { setShowSendModal(false); setSendConfirmReqId(null); };
  return (
      <div className="fixed inset-0 z-[70] flex items-center justify-center p-4" style={{backdropFilter:'blur(6px)',background:'rgba(0,0,0,0.6)'}}>
        <div className={`rounded-2xl shadow-2xl w-full max-w-md flex flex-col ${dk?'bg-gray-800':'bg-white'}`}>
          {/* Header */}
          <div className={`flex items-center justify-between px-6 py-4 border-b ${dk?'border-gray-700':'border-gray-100'}`}>
            <div className="flex items-center gap-2">
              <span className="text-xl">📤</span>
              <h2 className={`font-semibold text-base ${dk?'text-white':'text-gray-900'}`}>Confirm Submission</h2>
            </div>
            <button onClick={cancelSend} className={`w-8 h-8 flex items-center justify-center rounded-full transition-colors ${dk?'hover:bg-gray-700 text-gray-400':'hover:bg-gray-100 text-gray-400'}`}>✕</button>
          </div>

          <div className="px-6 py-5 space-y-4">
            {/* Evidence preview */}
            <div>
              <p className={`text-xs font-semibold uppercase tracking-wide mb-2 ${dk?'text-gray-400':'text-gray-500'}`}>📎 Attached Evidence ({evList.length})</p>
              {evList.length === 0 ? (
                <p className={`text-xs ${dk?'text-gray-500':'text-gray-400'}`}>No evidence attached.</p>
              ) : (
                <div className="space-y-2">
                  {evList.map(ev => {
                    const fileIcon = (ev.mimeType||'').startsWith('image/') ? '🖼️' : ev.name?.toLowerCase().endsWith('.pdf') ? '📑' : '📄';
                    return (
                      <div key={ev.id} className={`flex items-center gap-3 p-3 rounded-xl ${dk?'bg-gray-700':'bg-gray-50'}`}>
                        <span className="text-xl flex-shrink-0">{fileIcon}</span>
                        <div className="flex-1 min-w-0">
                          <p className={`text-sm font-medium truncate ${dk?'text-gray-100':'text-gray-800'}`}>{ev.name}</p>
                          <p className={`text-xs ${dk?'text-gray-400':'text-gray-500'}`}>{ev.size} · {formatDate(ev.uploadedAt)}</p>
                        </div>
                        {delConfirmId === ev.id ? (
                          <div className="flex items-center gap-1 flex-shrink-0">
                            <span className={`text-xs mr-1 ${dk?'text-gray-300':'text-gray-600'}`}>Remove?</span>
                            <button onClick={()=>{ deleteEvidence(sendConfirmReqId, ev.id); setDelConfirmId(null); }}
                              className="px-2 py-1 rounded-lg text-xs font-semibold bg-red-500 hover:bg-red-600 text-white transition-colors">Yes</button>
                            <button onClick={()=>setDelConfirmId(null)}
                              className={`px-2 py-1 rounded-lg text-xs font-medium border transition-colors ${dk?'border-gray-600 text-gray-300 hover:bg-gray-600':'border-gray-200 text-gray-600 hover:bg-gray-100'}`}>No</button>
                          </div>
                        ) : (
                          <button onClick={()=>setDelConfirmId(ev.id)}
                            className={`flex-shrink-0 px-2.5 py-1.5 rounded-lg text-xs font-semibold transition-colors ${dk?'bg-red-900/40 hover:bg-red-800/60 text-red-400':'bg-red-50 hover:bg-red-100 text-red-500'}`}
                            title="Remove this evidence">
                            🗑️ Remove
                          </button>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}
            </div>

            {/* Comment preview */}
            {pendingComment.trim() && (
              <div>
                <p className={`text-xs font-semibold uppercase tracking-wide mb-1.5 ${dk?'text-gray-400':'text-gray-500'}`}>💬 Comment</p>
                <div className={`p-3 rounded-xl text-sm ${dk?'bg-gray-700 text-gray-200':'bg-gray-50 text-gray-700'}`}>{pendingComment}</div>
              </div>
            )}

            <div className={`p-3 rounded-xl text-xs flex items-center gap-2 ${dk?'bg-gray-700/30 border border-gray-600/40 text-gray-300':'bg-gray-50 border border-gray-100 text-gray-600'}`}>
              <span>ℹ️</span>
              <span>Review your evidence above. Remove any wrong files before confirming.</span>
            </div>
          </div>

          {/* Footer */}
          <div className={`px-6 pb-5 flex gap-3`}>
            <button onClick={cancelSend}
              className={`flex-1 py-2.5 rounded-xl border text-sm font-medium transition-colors ${dk?'border-gray-600 text-gray-300 hover:bg-gray-700':'border-gray-200 text-gray-700 hover:bg-gray-50'}`}>
              ← Go Back
            </button>
            <button onClick={confirmSend}
              className="flex-1 py-2.5 rounded-xl text-white text-sm font-semibold transition-colors" style={{background:"var(--p600)"}}>
              ✅ Confirm & Send
            </button>
          </div>
        </div>
      </div>
    );
}

function UserDashboard({ dk, toggleTheme, colourKey, cycleColour, changeColour, currentUser, plants, users, requirements, updateRequirements, logout, logoUrl, updateUsers, categories }) {
  const [activePage, setActivePage] = useState('overview');
  const [notifReqId, setNotifReqId] = React.useState(null);
  const myReqs    = requirements.filter(r=>(Array.isArray(r.assignedTo)?r.assignedTo:(r.assignedTo?[r.assignedTo]:[])).includes(currentUser.id));
  const myPlant   = plants.find(p=>p.id===currentUser.plantId);
  const overdueCount = myReqs.filter(r=>r.status==='Overdue').length;

  // Notification click: switch to tasks tab and open the requirement modal
  const handleNotifClick = (reqId) => {
    setActivePage('tasks');
    setNotifReqId(reqId);
  };

  const nav = [
    { id:'overview',       icon:'📊', label:'Overview' },
    { id:'tasks',          icon:'📋', label:'My Tasks', badge:overdueCount },
    { id:'profile',        icon:'👤', label:'Profile' },
    { id:'changepassword', icon:'🔑', label:'Change Password' },
  ];

  const card = `rounded-2xl border shadow-sm ${dk?'bg-gray-800 border-gray-700':'bg-white border-gray-200'}`;
  const sub  = dk?'text-gray-400':'text-gray-500';

  const [selReq, setSelReq] = useState(null);
  const [pendingComment, setPendingComment] = useState('');

  const [uploading, setUploading] = useState(false);
  const [evidenceSent, setEvidenceSent] = useState(false);
  const [showSendModal, setShowSendModal] = useState(false);
  const [sendConfirmReqId, setSendConfirmReqId] = useState(null);
  const fileRef = useRef();

  // Auto-open requirement from notification bell
  React.useEffect(() => {
    if (notifReqId) {
      // Check own tasks first, then fall back to any requirement
      const req = myReqs.find(r => r.id === notifReqId) || requirements.find(r => r.id === notifReqId);
      if (req) { setSelReq(req); setNotifReqId(null); }
    }
  }, [notifReqId, activePage]);

  const updateStatus = (id, status, completionDateInput, overrideNextDueDate) => {
    const req = requirements.find(r => r.id === id);

    // ── Mandatory attachment: cannot mark Completed without at least one evidence file ──
    if (status === 'Completed' && !(req?.evidence?.length > 0)) {
      alert('\u26a0\ufe0f Attachment Required\n\nPlease attach at least one supporting document (certificate, report, or approval letter) before marking this requirement as Completed.\n\nUse the \u201cAttach Evidence\u201d button below to upload a file first.');
      return;
    }

    const today = new Date().toISOString().split('T')[0];
    // Use user-provided date, fall back to today for Completed, clear for others
    const completionDate = status === 'Completed'
      ? (completionDateInput || req?.completionDate || today)
      : (req?.completionDate || '');
    // Compute nextDueDate when marking Completed — respect any user override
    const freq = req?.complianceFrequency || 'annual';
    const nextDueDate = (status === 'Completed' && freq !== 'one_time')
      ? (overrideNextDueDate || computeNextDueDate(completionDate || req?.dueDate, freq) || req?.nextDueDate || '')
      : (req?.nextDueDate || '');

    const updatedReq = { ...req, status, completionDate, nextDueDate };
    updateRequirements(requirements.map(r => r.id===id ? updatedReq : r));
    if (selReq?.id===id) setSelReq(sr=>({...sr, status, completionDate, nextDueDate}));
    // ── Email: status change ──
    if (req && req.status !== status) {
      const plant       = plants.find(p => p.id === req.plantId);
      const assignedIds = Array.isArray(req.assignedTo) ? req.assignedTo : (req.assignedTo ? [req.assignedTo] : []);
      const assignee    = users.find(u => assignedIds.includes(u.id) && u.id === currentUser.id) || users.find(u=>assignedIds.includes(u.id));
      sendComplianceMail({ trigger:'status_change', req:updatedReq, plant, assignee, oldStatus:req.status, changedBy:currentUser, users });
    }
  };



  const uploadEvidence = async (reqId, file) => {
    setUploading(true);
    try {
      const evId = `ev${Date.now()}`;
      let storageUrl = null;
      let dataUrl = null;

      // Try Firebase Storage first (cross-device visibility)
      if (window.fbStorage) {
        try {
          await fbEnsureAuth();
          const path = `evidence/${reqId}/${evId}_${file.name}`;
          const ref = window.fbStorage.ref(path);
          await ref.put(file);
          storageUrl = await ref.getDownloadURL();
          console.log('✅ Uploaded to Firebase Storage:', storageUrl);
        } catch(storageErr) {
          console.warn('Firebase Storage upload failed, falling back to base64:', storageErr.message);
        }
      }

      // Fallback: base64 dataUrl (same-device only)
      if (!storageUrl) {
        dataUrl = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = e => resolve(e.target.result);
          reader.onerror = () => reject(new Error('Read failed'));
          reader.readAsDataURL(file);
        });
      }

      const ev = {
        id: evId,
        name: file.name,
        size: `${(file.size/1024).toFixed(1)} KB`,
        uploadedAt: new Date().toISOString(),
        uploadedBy: currentUser.id,
        mimeType: file.type,
        storageUrl,   // cross-device URL from Firebase Storage
        dataUrl,      // fallback base64 (null if storageUrl succeeded)
      };

      const updated = requirements.map(r => r.id===reqId ? {...r, evidence:[...(r.evidence||[]), ev]} : r);
      updateRequirements(updated);
      setSelReq(sr => ({...sr, evidence:[...(sr.evidence||[]), ev]}));
      // ── Show brief "attached" banner but keep modal open ──
      // Modal only closes when the user clicks Send
      setEvidenceSent(true);
      setTimeout(() => setEvidenceSent(false), 2200);
    } catch(err) {
      console.error('uploadEvidence failed:', err);
      alert('Upload failed: ' + err.message);
    }
    setUploading(false);
  };

  const deleteEvidence = async (reqId, evId) => {
    const req = requirements.find(r => r.id === reqId);
    const ev  = req?.evidence?.find(e => e.id === evId);
    if (!ev) return;

    // 1. Delete file from Firebase Storage (cross-device files)
    if (ev.storageUrl && window.fbStorage) {
      try {
        await fbEnsureAuth();
        const path = `evidence/${reqId}/${evId}_${ev.name}`;
        await window.fbStorage.ref(path).delete();
        console.log('🗑️ Deleted from Firebase Storage:', path);
      } catch(e) {
        // File may already be gone or path mismatch — log but continue
        console.warn('Storage delete failed (may already be removed):', e.message);
        // Try alternate path in case name was sanitised differently
        try {
          const altPath = `evidence/${reqId}/${evId}`;
          await window.fbStorage.ref(altPath).delete();
          console.log('🗑️ Deleted from Firebase Storage (alt path):', altPath);
        } catch(_) {}
      }
    } else if (!ev.storageUrl) {
      // base64-only file — lives only in Firestore document, no Storage entry to delete
      console.log('ℹ️ Evidence was base64-only, no Firebase Storage entry to delete.');
    }

    // 2. Remove evidence entry from Firestore (via updateRequirements → fbSave)
    const updated = requirements.map(r =>
      r.id === reqId ? { ...r, evidence: (r.evidence || []).filter(e => e.id !== evId) } : r
    );
    updateRequirements(updated);  // persists to localStorage + Firestore document
    setSelReq(sr => sr ? { ...sr, evidence: (sr.evidence || []).filter(e => e.id !== evId) } : sr);
    console.log('✅ Evidence entry removed from Firestore document (reqId:', reqId, ', evId:', evId, ')');
  };

  const downloadEvidence = (ev) => {
    const url = ev.storageUrl || ev.dataUrl;
    if (!url) {
      alert('File not available. Please re-upload.');
      return;
    }
    // storageUrl: open in new tab (cross-origin download)
    if (ev.storageUrl) {
      window.open(ev.storageUrl, '_blank');
      return;
    }
    // dataUrl fallback: direct download
    const a = document.createElement('a');
    a.href = ev.dataUrl;
    a.download = ev.name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  };

  const [userDrillModal, setUserDrillModal] = useState(null);

  // ── Overview: stats + due bar + charts (no task list) ──
  const UserOverview = () => {
    const total = myReqs.length;
    const done  = myReqs.filter(r=>r.status==='Completed').length;
    return (
      <div className="space-y-5">
        {userDrillModal && (
          <Modal open={!!userDrillModal} onClose={()=>setUserDrillModal(null)} title={userDrillModal.title} wide dk={dk}>
            <div className="space-y-2">
              {userDrillModal.reqs.length===0 && <p className={`text-sm ${sub}`}>No requirements in this group.</p>}
              {userDrillModal.reqs.map(r=>(
                <div key={r.id} className={`p-3 rounded-xl border cursor-pointer ${dk?'bg-gray-700 border-gray-600 hover:bg-gray-600':'bg-gray-50 border-gray-200 hover:bg-gray-100'}`}
                  onClick={()=>{setSelReq(r);setUserDrillModal(null);setActivePage('tasks');}}>
                  <div className="flex items-start justify-between gap-2">
                    <p className="text-sm font-semibold">{r.title}</p>
                    <Badge label={r.status} color={STATUS_CLR[r.status]}/>
                  </div>
                  <p className={`text-xs mt-1 ${sub}`}>{r.category} · Due: {formatDate(r.dueDate)}</p>
                </div>
              ))}
            </div>
          </Modal>
        )}
        <div className="grid grid-cols-2 xl:grid-cols-4 gap-4">
          <StatCard dk={dk} label="My Tasks"  value={total} icon="📋" color="t-stat-icon" accent="var(--p500)" sub={myPlant?.name} />
          <StatCard dk={dk} label="Completed" value={done}  icon="✅" color="bg-green-100 text-green-600" accent="#22c55e" sub={`${total?Math.round(done/total*100):0}% done`} />
          <StatCard dk={dk} label="Pending"   value={myReqs.filter(r=>r.status==='Pending').length}  icon="⏳" color="bg-amber-100 text-amber-600" accent="#f59e0b" />
          <StatCard dk={dk} label="Overdue"   value={myReqs.filter(r=>r.status==='Overdue').length}  icon="🚨" color="bg-red-100 text-red-600" accent="#ef4444" sub="Action needed" />
        </div>
        <UpcomingDueDateBar requirements={myReqs} dk={dk} scopeLabel="My Tasks" onDrill={(title,reqs)=>setUserDrillModal({title,reqs})} />
        {myReqs.length > 0 && <MonthTrendChart requirements={myReqs} dk={dk} title="My Monthly Compliance Trend" />}
        {myReqs.length > 0 && <CategoryHorizontalBar requirements={myReqs} dk={dk} onDrill={(title,reqs)=>setUserDrillModal({title,reqs})} />}
        {myReqs.filter(r=>r.status==='Overdue').length > 0 && (
          <div className={card}>
            <h3 className="font-semibold mb-3 text-red-500 text-sm">🚨 My Overdue Tasks</h3>
            <div className="space-y-2">
              {myReqs.filter(r=>r.status==='Overdue').map(r=>(
                <div key={r.id} className={`flex items-center justify-between p-3 rounded-xl cursor-pointer ${dk?'bg-red-900/20 border border-red-800/30 hover:bg-red-900/30':'bg-red-50 border border-red-100 hover:bg-red-100'}`}
                  onClick={()=>{setSelReq(r);setActivePage('tasks');}}>
                  <div className="flex-1 min-w-0">
                    <p className="text-sm font-medium text-red-600 truncate">{r.title}</p>
                    <p className={`text-xs ${sub}`}>{r.category} · Due: {formatDate(r.dueDate)}</p>
                  </div>
                  <span className="text-xs font-semibold text-red-500 ml-3 flex-shrink-0">{Math.abs(daysLeft(r.dueDate))}d over</span>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
    );
  };

  // ── Tasks: compact filterable list only (no charts) ──
  const Tasks = () => {
    const [filterStatus, setFilterStatus] = useState('');
    const [search, setSearch] = useState('');
    const filtered = myReqs.filter(r => {
      if (filterStatus && r.status !== filterStatus) return false;
      if (search && !r.title.toLowerCase().includes(search.toLowerCase())) return false;
      return true;
    });
    return (
      <div className="space-y-4">
        <div className={`${card} p-3 flex flex-wrap gap-3 items-center`}>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Search tasks…"
