              </FormField>
            ) : (
              <div className={`col-span-1 flex items-center gap-2.5 px-4 py-3 rounded-xl border ${dk?'bg-amber-900/20 border-amber-700/40':'bg-amber-50 border-amber-200'}`}>
                <span className="text-base flex-shrink-0">🔗</span>
                <div>
                  <p className={`text-xs font-semibold ${dk?'text-amber-300':'text-amber-700'}`}>No password required</p>
                  <p className={`text-xs mt-0.5 ${dk?'text-amber-400':'text-amber-600'}`}>Top Management accesses via magic link sent to their email</p>
                </div>
              </div>
            )}

            <FormField label="Phone"><input value={form.phone||''} onChange={e=>set('phone',e.target.value)} placeholder="+91-XXXXXXXXXX" className={inputCls} /></FormField>

            <FormField label="Role" required>
              <select value={form.role} onChange={e=>{
                set('role', e.target.value);
                // Clear plant for roles that don't belong to a plant
                if (e.target.value==='admin' || e.target.value==='top_management') set('plantId','');
              }} className={selectCls}>
                <option value="user">Team Member — view & update own assigned tasks</option>
                <option value="plant_head">Plant Head — view all plant requirements (read-only)</option>
                <option value="plant_admin">Plant Admin — define, edit & manage plant requirements</option>
                <option value="top_management">Top Management — group-level read-only via magic link</option>
                <option value="admin">Super Admin — full access, all plants, settings</option>
              </select>
            </FormField>

            <FormField label="Plant">
              <select value={form.plantId||''} onChange={e=>set('plantId',e.target.value)} className={selectCls}
                disabled={form.role==='admin' || form.role==='top_management'}>
                <option value="">— None —</option>
                {plants.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
              </select>
              {(form.role==='plant_admin'||form.role==='plant_head') && !form.plantId && (
                <p className="text-xs text-red-500 mt-1">⚠ Select a plant — required for this role</p>
              )}
            </FormField>

            <div className="col-span-2">
              <FormField label="Department"><input value={form.dept||''} onChange={e=>set('dept',e.target.value)} placeholder="EHS, Legal, Compliance, Executive Board…" className={inputCls} /></FormField>
            </div>

            {/* Magic link info for TM role */}
            {form.role === 'top_management' && (
              <div className={`col-span-2 rounded-xl border p-3.5 text-xs space-y-1.5 ${dk?'bg-blue-900/20 border-blue-700/40 text-blue-300':'bg-blue-50 border-blue-200 text-blue-700'}`}>
                <p className="font-semibold">🔗 Magic Link Access</p>
                <p>This user will access the dashboard via a secure link — no password needed. Share this URL with them:</p>
                <code className={`block px-3 py-2 rounded-lg text-xs font-mono break-all ${dk?'bg-gray-800':'bg-white border border-blue-200'}`}>
                  {window.location.href.split('?')[0]}?view=top_management&token=TM_OVERVIEW_2026
                </code>
                <p className={dk?'text-blue-400':'text-blue-500'}>They will see a read-only dashboard overview. Change the token in Settings for security.</p>
              </div>
            )}
          </div>

          <div className="flex gap-3 pt-4 border-t border-gray-100 dark:border-gray-700">
            <button onClick={()=>{setShowAdd(false);setEditU(null);}} className={`flex-1 py-2.5 rounded-xl border text-sm font-medium transition-colors ${dk?'border-gray-600 text-gray-300 hover:bg-gray-700':'border-gray-200 text-gray-700 hover:bg-gray-50'}`}>Cancel</button>
            <button onClick={save}
              disabled={saving || !form.name || !form.email || (form.role !== 'top_management' && !form.password) || ((form.role==='plant_admin'||form.role==='plant_head') && !form.plantId)}
              className="flex-1 py-2.5 rounded-xl text-white text-sm font-semibold disabled:opacity-50 transition-colors" style={{background:"var(--p600)"}}>
              {saving ? 'Saving…' : editU ? 'Update User' : 'Add User'}
            </button>
          </div>
        </div>
      </Modal>

      <div className={`${card} px-3 py-2 flex items-center gap-3`}>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Search users…" className={`${inputCls.replace('py-2.5','py-1.5')} max-w-xs`} />
        <span className={`text-xs ${sub}`}>{filtered.length} user{filtered.length!==1?'s':''}</span>
        <button onClick={openAdd} className="ml-auto px-4 py-1.5 text-white rounded-xl text-sm font-semibold transition-colors flex items-center gap-2" style={{background:"var(--p600)"}}>
          <span>+</span> Add User
        </button>
      </div>

      <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 gap-3">
        {filtered.map(u=>{
          const plant = plants.find(p=>p.id===u.plantId);
          const meta = [['🏭',plant?.name||'Group Level','Plant'],['🏢',u.dept,'Department'],['📱',u.phone,'Phone']].filter(([,v])=>v);
          return (
            <div key={u.id} className={`${card} px-3 py-2.5 flex items-center gap-3 group`}>
              <div className="w-9 h-9 rounded-lg flex-shrink-0 flex items-center justify-center text-white text-sm font-bold" style={{background:"var(--p600)"}}>{initials(u.name)}</div>
              <div className="flex-1 min-w-0">
                <div className="flex items-center gap-2 min-w-0">
                  <p className="font-semibold text-sm truncate">{u.name}</p>
                  <span className={`text-[10px] px-1.5 py-px rounded-full font-semibold whitespace-nowrap flex-shrink-0 ${roleBg[u.role]||''}`}>
                    {{admin:'Super Admin',top_management:'Top Mgmt',plant_admin:'Plant Admin',plant_head:'Plant Head',user:'Member'}[u.role]||u.role}
                  </span>
                  {u.role === 'top_management' && (
                    <span className={`text-[11px] flex-shrink-0 ${dk?'text-amber-400':'text-amber-600'}`} title="Access via magic link only">🔗</span>
                  )}
                </div>
                <p className={`text-xs truncate ${sub}`} title={u.email}>{u.email}</p>
                <div className={`flex items-center gap-3 text-[11px] mt-0.5 min-w-0 ${sub}`}>
                  {meta.map(([i,v,t])=>(
                    <span key={t} className="flex items-center gap-1 truncate min-w-0" title={`${t}: ${v}`}><span>{i}</span><span className="truncate">{v}</span></span>
                  ))}
                </div>
              </div>
              <div className="flex flex-col gap-1 flex-shrink-0">
                <button onClick={()=>openEdit(u)} title="Edit user" className={`w-7 h-7 flex items-center justify-center rounded-lg text-xs border transition-colors ${dk?'border-gray-600 hover:bg-gray-700':'border-gray-200 hover:bg-amber-50'}`}>✏️</button>
                <button onClick={()=>setDelId(u.id)} title="Delete user" className={`w-7 h-7 flex items-center justify-center rounded-lg text-xs border transition-colors ${dk?'border-red-900/60 hover:bg-red-900/30':'border-red-100 bg-red-50 hover:bg-red-100'}`}>🗑️</button>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════
   ADMIN – PLANTS  (Add / Edit / Delete + State Mgmt)
═══════════════════════════════════════════ */
function AdminPlants({ dk, plants, updatePlants, currentUser }) {
  const [editing,    setEditing]    = useState(null);
  const [form,       setForm]       = useState({});
  const [showAdd,    setShowAdd]    = useState(false);
  const [addForm,    setAddForm]    = useState({ name:'', state: ALL_IND_STATES[0] });
  const [delId,      setDelId]      = useState(null);
  /* ── State management ── */
  const [activeTab,  setActiveTab]  = useState('plants'); // 'plants' | 'states'
  const [customStates, setCustomStates] = useState(() => {
    try { const s = localStorage.getItem('customStates'); return s ? JSON.parse(s) : []; } catch(_) { return []; }
  });
  const [newState,   setNewState]   = useState('');
  const [editStateIdx, setEditStateIdx] = useState(null);
  const [editStateVal, setEditStateVal] = useState('');
  const [delStateIdx,  setDelStateIdx]  = useState(null);
  const [toast, setToast] = useState(null);

  const allStates = [...ALL_IND_STATES, ...customStates];

  const showToast = (msg, type='success') => { setToast({msg,type}); setTimeout(()=>setToast(null),3000); };

  const saveCustomStates = (arr) => {
    setCustomStates(arr);
    try { localStorage.setItem('customStates', JSON.stringify(arr)); } catch(_) {}
  };

  const startEdit = p => { setEditing(p.id); setForm({ name:p.name, state:p.state }); };
  const saveEdit  = id => {
    if (!form.name.trim()) return;
    const updatedPlant = { ...plants.find(p=>p.id===id), ...form };
    updatePlants(plants.map(p=>p.id===id?updatedPlant:p));
    setEditing(null);
    showToast('Plant updated');
    sendComplianceMail({ trigger:'plant_updated', plant:updatedPlant, req:null, assignee:null, changedBy:currentUser, users });
  };

  const addPlant = () => {
    if (!addForm.name.trim()) return;
    const newP = { id:`p${Date.now()}`, name:addForm.name.trim(), state:addForm.state, active:true };
    updatePlants([...plants, newP]);
    setAddForm({ name:'', state: ALL_IND_STATES[0] });
    setShowAdd(false);
    showToast(`"${newP.name}" added`);
    sendComplianceMail({ trigger:'plant_added', plant:newP, req:null, assignee:null, changedBy:currentUser, users });
  };

  const confirmDel = () => {
    const deletedPlant = plants.find(p=>p.id===delId);
    updatePlants(plants.filter(p=>p.id!==delId));
    setDelId(null);
    showToast('Plant deleted');
    if (deletedPlant) sendComplianceMail({ trigger:'plant_deleted', plant:deletedPlant, req:null, assignee:null, changedBy:currentUser, users });
  };

  /* ── State CRUD ── */
  const addState = () => {
    const t = newState.trim();
    if (!t) return;
    if (allStates.map(s=>s.toLowerCase()).includes(t.toLowerCase())) { showToast('State already exists','error'); return; }
    saveCustomStates([...customStates, t]);
    setNewState('');
    showToast(`"${t}" added`);
  };
  const startEditState = (i) => { setEditStateIdx(i); setEditStateVal(customStates[i]); };
  const saveEditState  = () => {
    const t = editStateVal.trim();
    if (!t) return;
    const updated = customStates.map((s,i)=>i===editStateIdx?t:s);
    saveCustomStates(updated);
    setEditStateIdx(null);
    showToast('State updated');
  };
  const confirmDelState = () => {
    const removed = customStates[delStateIdx];
    saveCustomStates(customStates.filter((_,i)=>i!==delStateIdx));
    setDelStateIdx(null);
    showToast(`"${removed}" deleted`);
  };

  const card = `rounded-2xl border shadow-sm ${dk?'bg-gray-800 border-gray-700':'bg-white border-gray-200'}`;
  const sub  = dk?'text-gray-400':'text-gray-500';

  return (
    <div className="space-y-5">
      <ConfirmModal open={!!delId}
        message={`Delete this plant? All associated requirements will lose their plant reference.`}
        onConfirm={confirmDel} onCancel={()=>setDelId(null)} />
      <ConfirmModal open={delStateIdx!==null}
        message={delStateIdx!==null ? `Delete state "${customStates[delStateIdx]}"? Plants using it will retain their state label.` : ''}
        onConfirm={confirmDelState} onCancel={()=>setDelStateIdx(null)} />

      {toast && (
        <div className={`fixed top-5 right-5 z-[100] px-5 py-3 rounded-xl shadow-xl text-sm font-semibold flex items-center gap-2 ${toast.type==='error'?'bg-red-500 text-white':'bg-green-500 text-white'}`}>
          {toast.type==='error'?'❌':'✅'} {toast.msg}
        </div>
      )}

      {/* Tab Switcher */}
      <div className={`${card} p-4`}>
        <div className="flex gap-2">
          {[['plants','🏭 Plants'],['states','📍 States']].map(([id,label])=>(
            <button key={id} onClick={()=>setActiveTab(id)}
              className={`px-5 py-2 rounded-xl text-sm font-semibold transition-all ${activeTab===id?'text-white shadow':'text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-700'}`} style={activeTab===id?{background:'var(--p600)'}:{}}>
              {label}
            </button>
          ))}
        </div>
      </div>

      {/* ── PLANTS TAB ── */}
      {activeTab==='plants' && (
        <>
          {/* Add Plant button */}
          <div className={`${card} p-4 flex items-center justify-between`}>
            <p className={`text-sm ${sub}`}>
              🏭 {plants.length} plant{plants.length!==1?'s':''} configured
            </p>
            <button onClick={()=>setShowAdd(v=>!v)}
              className="px-4 py-2.5 text-white rounded-xl text-sm font-semibold transition-colors flex items-center gap-2" style={{background:"var(--p600)"}}>
              {showAdd?'✕ Cancel':'+ Add Plant'}
            </button>
          </div>

          {/* Add Plant Form */}
          {showAdd && (
            <div className={`${card} p-5 space-y-4`}>
              <h3 className="font-semibold text-sm" style={{fontFamily:"'Outfit',sans-serif"}}>Add New Plant</h3>
              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className={`text-xs font-semibold ${sub} uppercase tracking-wide block mb-1`}>Plant Name *</label>
                  <input value={addForm.name} onChange={e=>setAddForm(f=>({...f,name:e.target.value}))}
                    placeholder="e.g. Plant D" className={inputCls} />
                </div>
                <div>
                  <label className={`text-xs font-semibold ${sub} uppercase tracking-wide block mb-1`}>State *</label>
                  <select value={addForm.state} onChange={e=>setAddForm(f=>({...f,state:e.target.value}))} className={selectCls}>
                    {allStates.map(s=><option key={s}>{s}</option>)}
                  </select>
                </div>
              </div>
              <div className="flex gap-3">
                <button onClick={()=>setShowAdd(false)}
                  className={`flex-1 py-2.5 rounded-xl border text-sm font-medium transition-colors ${dk?'border-gray-600 text-gray-300 hover:bg-gray-700':'border-gray-200 text-gray-700 hover:bg-gray-50'}`}>Cancel</button>
                <button onClick={addPlant} disabled={!addForm.name.trim()}
                  className="flex-1 py-2.5 rounded-xl text-white text-sm font-semibold disabled:opacity-50 transition-colors" style={{background:"var(--p600)"}}>
                  Add Plant
                </button>
              </div>
            </div>
          )}

          {/* Plants Grid */}
          <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
            {plants.map((plant, idx) => (
              <div key={plant.id} className={`${card} p-5`}>
                <div className="flex items-start justify-between mb-3">
                  <div className="flex items-center gap-3">
                    <div className="w-10 h-10 rounded-xl flex items-center justify-center text-white font-bold text-sm" style={{background:"linear-gradient(135deg,var(--p400),var(--p700))"}}>
                      {plant.name.charAt(plant.name.length-1) || String.fromCharCode(65+idx)}
                    </div>
                    <div>
                      <p className={`text-xs font-semibold ${sub} uppercase tracking-wide`}>{plant.id}</p>
                      <p className="font-semibold text-sm">{plant.name}</p>
                    </div>
                  </div>
                  <div className="flex gap-1">
                    <button onClick={()=>startEdit(plant)}
                      className={`p-1.5 rounded-lg text-xs transition-colors ${dk?'hover:bg-amber-900/30 text-amber-400':'hover:bg-amber-50 text-amber-600'}`} title="Edit">✏️</button>
                    <button onClick={()=>setDelId(plant.id)}
                      className={`p-1.5 rounded-lg text-xs transition-colors ${dk?'hover:bg-red-900/30 text-red-400':'hover:bg-red-50 text-red-500'}`} title="Delete">🗑️</button>
                  </div>
                </div>
                <p className={`text-xs flex items-center gap-1.5 mb-3 ${sub}`}><span>📍</span>{plant.state}</p>

                {editing === plant.id && (
                  <div className="mt-3 pt-3 border-t border-gray-100 dark:border-gray-700 space-y-3">
                    <div>
                      <label className={`text-xs font-semibold ${sub} uppercase tracking-wide block mb-1`}>Plant Name</label>
                      <input value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))} className={inputCls} placeholder="Plant name" />
                    </div>
                    <div>
                      <label className={`text-xs font-semibold ${sub} uppercase tracking-wide block mb-1`}>State</label>
                      <select value={form.state} onChange={e=>setForm(f=>({...f,state:e.target.value}))} className={selectCls}>
                        {allStates.map(s=><option key={s}>{s}</option>)}
                      </select>
                    </div>
                    <div className="flex gap-2">
                      <button onClick={()=>setEditing(null)} className={`flex-1 py-2 rounded-xl text-xs border transition-colors ${dk?'border-gray-600 hover:bg-gray-700 text-gray-300':'border-gray-200 hover:bg-gray-50 text-gray-700'}`}>Cancel</button>
                      <button onClick={()=>saveEdit(plant.id)} className="flex-1 py-2 rounded-xl text-xs text-white transition-colors font-medium" style={{background:"var(--p600)"}}>Save</button>
                    </div>
                  </div>
                )}
              </div>
            ))}
          </div>
        </>
      )}

      {/* ── STATES TAB ── */}
      {activeTab==='states' && (
        <div className="space-y-4">
          {/* Info */}
          <div className={`p-4 rounded-2xl border flex items-start gap-3 ${dk?'border-gray-700':'border-gray-100'}`}>
            <span className="text-xl mt-0.5">📍</span>
            <div>
              <p className="text-sm font-semibold text-[color:var(--p600)] dark:text-[color:var(--p400)]">State Management</p>
              <p className={`text-xs mt-0.5 ${sub}`}>
                Default Indian states are built-in. Add custom states below for international or union territory locations.
                Deleting a custom state won't affect plants already assigned to it.
              </p>
            </div>
          </div>

          {/* Add new state */}
          <div className={`${card} p-5`}>
            <h3 className="font-semibold text-sm mb-3" style={{fontFamily:"'Outfit',sans-serif"}}>Add Custom State / Region</h3>
            <div className="flex gap-3">
              <input value={newState} onChange={e=>setNewState(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addState()}
                placeholder="e.g. Goa, Pondicherry, Delhi NCT…" className={`${inputCls} flex-1`} />
              <button onClick={addState} disabled={!newState.trim()}
                className="px-5 py-2.5 text-white rounded-xl text-sm font-semibold disabled:opacity-40 transition-colors flex-shrink-0" style={{background:"var(--p600)"}}>
                + Add
              </button>
            </div>
          </div>

          {/* Built-in states */}
          <div className={`${card} overflow-hidden`}>
            <div className="px-5 py-4 border-b border-gray-100 dark:border-gray-700">
              <h3 className="font-semibold text-sm">Built-in States ({ALL_IND_STATES.length})</h3>
              <p className={`text-xs mt-0.5 ${sub}`}>These are pre-configured and cannot be deleted.</p>
            </div>
            <div className="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-2 p-4">
              {ALL_IND_STATES.map(s=>(
                <div key={s} className={`px-3 py-2 rounded-xl text-xs font-medium flex items-center gap-1.5 ${dk?'bg-gray-700 text-gray-300':'bg-gray-50 text-gray-600'}`}>
                  <span className="text-[color:var(--p400)]">📍</span>{s}
                </div>
              ))}
            </div>
          </div>

          {/* Custom states */}
          {customStates.length > 0 && (
            <div className={`${card} overflow-hidden`}>
              <div className="px-5 py-4 border-b border-gray-100 dark:border-gray-700">
                <h3 className="font-semibold text-sm">Custom States / Regions ({customStates.length})</h3>
              </div>
              <div className="divide-y divide-gray-100 dark:divide-gray-700">
                {customStates.map((st, i) => (
                  <div key={i} className={`flex items-center gap-3 px-5 py-3.5 transition-colors ${dk?'hover:bg-gray-700/40':'hover:bg-gray-50'}`}>
                    <span className="text-amber-500">📍</span>
                    {editStateIdx === i ? (
                      <div className="flex items-center gap-2 flex-1">
                        <input value={editStateVal} onChange={e=>setEditStateVal(e.target.value)}
                          onKeyDown={e=>{ if(e.key==='Enter') saveEditState(); if(e.key==='Escape') setEditStateIdx(null); }}
                          autoFocus className={`${inputCls} flex-1 py-1.5 text-sm`} />
                        <button onClick={saveEditState} className="px-3 py-1.5 text-white rounded-lg text-xs font-semibold transition-colors" style={{background:"var(--p600)"}}>Save</button>
                        <button onClick={()=>setEditStateIdx(null)} className={`px-3 py-1.5 rounded-lg text-xs border transition-colors ${dk?'border-gray-600 text-gray-300 hover:bg-gray-700':'border-gray-200 text-gray-600 hover:bg-gray-50'}`}>Cancel</button>
                      </div>
                    ) : (
                      <>
                        <span className="flex-1 text-sm font-medium">{st}</span>
                        <div className="flex items-center gap-1 flex-shrink-0">
                          <button onClick={()=>startEditState(i)}
                            className={`p-1.5 rounded-lg text-xs transition-colors ${dk?'hover:bg-amber-900/30 text-amber-400':'hover:bg-amber-50 text-amber-600'}`} title="Edit">✏️</button>
                          <button onClick={()=>setDelStateIdx(i)}
                            className={`p-1.5 rounded-lg text-xs transition-colors ${dk?'hover:bg-red-900/30 text-red-400':'hover:bg-red-50 text-red-500'}`} title="Delete">🗑️</button>
                        </div>
                      </>
                    )}
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

  // Upload logo: base64 → Firebase Storage → get download URL → persist URL to Firestore
  const handleUploadLogo = async (file) => {
    if (!file) return;
    setLogoSaving(true);
    setLogoStatus(null);
    try {
      // Read file to base64 — this is the ONLY logo storage path now.
      // (Previously also tried Firebase Storage, but that requires separate
      // Storage security rules + correct bucket/project match, which was a
      // recurring source of "logo not visible on other devices" bugs.
      // Firestore alone — same rule set already used for all other data —
      // is simpler and just as reliable for a small ~20-30KB logo file.)
      const dataUrl = await new Promise((res, rej) => {
        const reader = new FileReader();
        reader.onload = ev => res(ev.target.result);
        reader.onerror = () => rej(new Error('File read failed'));
        reader.readAsDataURL(file);
      });

      const raw = localStorage.getItem('adminSettings');
      const current = raw ? JSON.parse(raw) : {};

      // ── Immediately update App-level logoUrl (no Firebase round-trip needed for this device) ──
      if (onLogoSave) onLogoSave(dataUrl);

      const updated = { ...current, companyLogo: dataUrl, companyLogoUrl: '' };
      setSettings(s => ({ ...s, companyLogo: dataUrl, companyLogoUrl: '' }));
      localStorage.setItem('adminSettings', JSON.stringify(updated));
      storage.set('adminSettings', JSON.stringify(updated));
      await fbSave(FB_SETTINGS, [updated]);

      setLogoStatus('uploaded');
      setTimeout(() => setLogoStatus(null), 3000);
    } catch(e) {
      console.error('Logo upload failed:', e);
      setLogoStatus('error');
      setTimeout(() => setLogoStatus(null), 4000);
    }
    setLogoSaving(false);
  };

  const handleDeleteLogo = async () => {
    setLogoDeleting(true);
    setLogoStatus(null);
    try {
      // ── Immediately clear App-level logoUrl on this device ──
      if (onLogoRemove) onLogoRemove();

      // Clear from settings state
      setSettings(s => ({ ...s, companyLogo: '', companyLogoUrl: '' }));

      // Persist cleared logo to Firestore (single source of truth now — no Storage involved)
      const raw = localStorage.getItem('adminSettings');
      const current = raw ? JSON.parse(raw) : {};
      const updated = { ...current, companyLogo: '', companyLogoUrl: '' };
      localStorage.setItem('adminSettings', JSON.stringify(updated));
      storage.set('adminSettings', JSON.stringify(updated));
      await fbSave(FB_SETTINGS, [updated]);

      setLogoStatus('deleted');
      setTimeout(() => setLogoStatus(null), 3000);
    } catch(e) {

      setTimeout(() => setLogoStatus(null), 4000);

      // Only strip base64 from Firestore when a Storage URL is present (to stay under 1MB limit).
      // If Storage is unavailable, companyLogo holds the base64 fallback — keep it in Firestore.
      const toFirestore = toSave.companyLogoUrl
        ? (({ companyLogo: _b64, ...rest }) => rest)(toSave)
        : toSave;

      const accessToken = await getMSGraphToken({ msClientId: settings.msClientId, msTenantId: settings.msTenantId });
      const htmlBody = `<p>Hello,</p><p>This is a test email sent from <strong>Polyplastics</strong> via Microsoft Graph API on ${new Date().toLocaleString('en-IN')}.</p><p>Your Microsoft Graph email integration is working correctly.</p><p>— Polyplastics Compliance System</p>`;
      await sendGraphMail(accessToken, {
        toEmail: settings.msToEmail,
        subject: 'Polyplastics – Microsoft Graph Email Test',
        htmlBody,

      setEmailTestMsg(`Email delivered to ${settings.msToEmail}`);
    } catch (err) {
      setEmailTestStatus('error');
      setEmailTestMsg(`Failed: ${err?.message || String(err)}`);

/* ── Frequency normalizer: accepts values, labels, and common variants ──────
   Input examples that must all work:
     'monthly' | 'Monthly' | 'MONTHLY'
     'quarterly' | 'Quarterly' | 'Quarterly (3 months)'
     'half_yearly' | 'Half-Yearly' | 'Half Yearly' | 'half yearly' | 'bi-annual' | 'biannual' | '6 months'
     'annual' | 'Annual' | 'Yearly' | 'yearly' | 'Annual (Yearly)' | 'annually' | '1 year' | 'one_time'
     'one_time' | 'One Time' | 'one-time' | 'once'
   Falls back to 'annual' if nothing matches.
────────────────────────────────────────────────────────────────────────── */
function normalizeFrequency(raw) {
  if (!raw) return 'annual';
  const s = String(raw).trim().toLowerCase().replace(/[^a-z0-9]/g, '');
  // Exact value match first
  if (COMPLIANCE_FREQS.find(f => f.value === s)) return s;
  // Label match (strip special chars)
  const byLabel = COMPLIANCE_FREQS.find(f =>
    f.label.toLowerCase().replace(/[^a-z0-9]/g, '') === s
  );
  if (byLabel) return byLabel.value;
  // Alias table — covers everything a human might type
  const FREQ_ALIAS = {
    // monthly
    monthly: 'monthly', month: 'monthly',
    // quarterly
    quarterly: 'quarterly', quarter: 'quarterly', quarterly3months: 'quarterly',
    every3months: 'quarterly', threemonths: 'quarterly', '3months': 'quarterly',
    '3mo': 'quarterly', '3m': 'quarterly',
    // half-yearly / bi-annual / 6 months
    halfyearly: 'half_yearly', halfyear: 'half_yearly',
    halyyearly: 'half_yearly',  // common typo
    semiannual: 'half_yearly', semiannually: 'half_yearly',
    biannual: 'half_yearly', biyearly: 'half_yearly',
    every6months: 'half_yearly', sixmonths: 'half_yearly',
    '6months': 'half_yearly', '6mo': 'half_yearly', '6m': 'half_yearly',
    halfannual: 'half_yearly',
    // annual / yearly
    annual: 'annual', annually: 'annual', yearly: 'annual', year: 'annual',
    annualyearly: 'annual', every12months: 'annual', twelvemonths: 'annual',
    '12months': 'annual', '12mo': 'annual', '1year': 'annual', '1yr': 'annual',
    // one-time
    onetime: 'one_time', once: 'one_time', onetimeonly: 'one_time',
    singleuse: 'one_time', single: 'one_time', notrecurring: 'one_time',
  };
  if (FREQ_ALIAS[s]) return FREQ_ALIAS[s];
  // Partial substring match as last resort
  if (s.includes('half') || s.includes('6mo') || s.includes('6m') || s.includes('biannu') || s.includes('semi')) return 'half_yearly';
  if (s.includes('quarter') || s.includes('3mo') || s.includes('3m')) return 'quarterly';
  if (s.includes('month')) return 'monthly';
  if (s.includes('year') || s.includes('annual') || s.includes('12mo')) return 'annual';
  if (s.includes('once') || s.includes('one') || s.includes('single')) return 'one_time';
  return 'annual'; // safe fallback
}

/* ── Reminder frequency normalizer ─────────────────────────────────────── */
function normalizeReminderFreq(raw) {
  if (!raw) return 'Weekly';
  const s = String(raw).trim().toLowerCase().replace(/[^a-z0-9]/g, '');
  const REM_MAP = {
    daily: 'Daily', day: 'Daily', everyday: 'Daily',
    weekly: 'Weekly', week: 'Weekly', everyweek: 'Weekly',
    fortnightly: 'Fortnightly', biweekly: 'Fortnightly', twoweeks: 'Fortnightly', '2weeks': 'Fortnightly',
    monthly: 'Monthly', month: 'Monthly', everymonth: 'Monthly',
  };
  if (REM_MAP[s]) return REM_MAP[s];
  const found = REM_FREQS.find(r => r.toLowerCase().replace(/[^a-z0-9]/g,'') === s);
  if (found) return found;
  // Partial match
  if (s.includes('daily') || s.includes('day')) return 'Daily';
  if (s.includes('fort') || (s.includes('bi') && s.includes('week')) || s.includes('2week')) return 'Fortnightly';
  if (s.includes('month')) return 'Monthly';
  if (s.includes('week')) return 'Weekly';
  return 'Weekly';
}
