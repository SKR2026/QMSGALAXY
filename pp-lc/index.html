// Safe localStorage polyfill - falls back to in-memory if blocked
(function() {
  var _mem = {};
  var _real = null;
  try {
    localStorage.setItem('__test__', '1');
    localStorage.removeItem('__test__');
    _real = localStorage;
  } catch(e) {
    console.warn('localStorage blocked, using in-memory fallback');
  }
  if (!_real) {
    Object.defineProperty(window, 'localStorage', {
      value: {
        getItem: function(k) { return Object.prototype.hasOwnProperty.call(_mem, k) ? _mem[k] : null; },
        setItem: function(k, v) { _mem[k] = String(v); },
        removeItem: function(k) { delete _mem[k]; },
        clear: function() { _mem = {}; },
        key: function(i) { return Object.keys(_mem)[i] || null; },
        get length() { return Object.keys(_mem).length; }
      },
      writable: false, configurable: true
    });
  }
})();
</script>

/* ═══════════════════════════════════════════
   SECURITY — PBKDF2 password hashing + HMAC tamper-detection
   + brute-force lockout (5 attempts → 15-min lockout)
═══════════════════════════════════════════ */
async function _pbkdf2(password, salt) {
  const enc = new TextEncoder();
  const keyMat = await crypto.subtle.importKey('raw', enc.encode(password), { name:'PBKDF2' }, false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name:'PBKDF2', salt:enc.encode(salt), iterations:100000, hash:'SHA-256' }, keyMat, 256);
  return Array.from(new Uint8Array(bits)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function _hmac(data, key) {
  const enc = new TextEncoder();
  const k = await crypto.subtle.importKey('raw', enc.encode(key), { name:'HMAC', hash:'SHA-256' }, false, ['sign']);
  const sig = await crypto.subtle.sign('HMAC', k, enc.encode(data));
  return Array.from(new Uint8Array(sig)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function _ctEq(a, b) {
  if (!a||!b||a.length!==b.length) return false;
  let d=0; for(let i=0;i<a.length;i++) d|=a.charCodeAt(i)^b.charCodeAt(i);
  return d===0;
}
// Per-device secret key for HMAC tamper detection
const _SK = (()=>{
  const KEY='legalapp_sk'; let k=localStorage.getItem(KEY);
  if(!k){ const arr=new Uint8Array(32); crypto.getRandomValues(arr); k=Array.from(arr).map(b=>b.toString(16).padStart(2,'0')).join(''); try{localStorage.setItem(KEY,k);}catch(_){} }
  return k;
})();
async function _secSet(key, val) {
  const d = JSON.stringify(val), s = await _hmac(d, _SK);
  try { localStorage.setItem(key, JSON.stringify({d,s})); } catch(_) {}
}
async function _secGet(key) {
  try {
    const raw = localStorage.getItem(key); if(!raw) return null;
    const {d,s} = JSON.parse(raw), chk = await _hmac(d, _SK);
    if(!_ctEq(chk,s)) { localStorage.removeItem(key); return null; }
    return JSON.parse(d);
  } catch(_) { localStorage.removeItem(key); return null; }
}
const _SALT  = id => `legalapp_${id}_2025`;
async function _hashPw(pw, id)         { return _pbkdf2(pw, _SALT(id)); }
async function _verifyPw(stored, pw, id) {
  if(!stored) return false;
  if(/^[0-9a-f]{64}$/.test(stored)) { const h=await _pbkdf2(pw,_SALT(id)); return _ctEq(stored,h); }
  return stored === pw; // plain-text fallback for legacy passwords
}
// Seed passwords: hash __HASH__ sentinel values on first boot
const _SEED_PASSWORDS = {
  admin1:'Admin@123', tm1:'Admin@123', ph1:'Head@123', ph2:'Head@123', ph3:'Head@123',
  u1:'User@123', u2:'User@123', u3:'User@123', u4:'User@123', u5:'User@123',
};
async function _initSeedPasswords(users) {
  let changed = false;
  for (const u of users) {
    if (u.password === '__HASH__' || !/^[0-9a-f]{64}$/.test(u.password)) {
      const plain = _SEED_PASSWORDS[u.id] || u.password;
      if (plain && plain !== '__HASH__') { u.password = await _hashPw(plain, u.id); changed = true; }
    }
  }
  return changed;
}
// Brute-force lockout
const _BF = 'legalapp_bf';
const _BF_MAX = 5;
const _BF_TTL = 15 * 60 * 1000; // 15 minutes
async function _bfCheck(email) {
  const data = await _secGet(_BF) || {};
  const rec  = data[email];
  if (!rec) return { locked:false, attempts:0 };
  if (rec.lockedUntil && Date.now() < rec.lockedUntil) return { locked:true, remaining:Math.ceil((rec.lockedUntil-Date.now())/60000) };
  if (rec.lockedUntil && Date.now() >= rec.lockedUntil) { delete data[email]; await _secSet(_BF,data); return { locked:false, attempts:0 }; }
  return { locked:false, attempts: rec.attempts || 0 };
}
async function _bfRecord(email, success) {
  const data = await _secGet(_BF) || {};
  if (success) { delete data[email]; }
  else {
    const rec = data[email] || { attempts:0 };
    rec.attempts = (rec.attempts||0)+1;
    if (rec.attempts >= _BF_MAX) rec.lockedUntil = Date.now() + _BF_TTL;
    data[email] = rec;
  }
  await _secSet(_BF, data);
}

/* ─── FIREBASE STATUS BADGE ─── */
function FirebaseStatusBadge() {
  const [status, setStatus] = React.useState('checking'); // 'checking' | 'connected' | 'error'

  React.useEffect(() => {
    let cancelled = false;
    async function check() {
      try {
        await window.db.collection('_ping').limit(1).get();
        if (!cancelled) setStatus('connected');
      } catch (e) {
        if (!cancelled) setStatus('error');
      }
    }
    check();
    // Re-check every 60s
    const interval = setInterval(check, 60000);
    return () => { cancelled = true; clearInterval(interval); };
  }, []);

  const cfg = {
    checking:  { dot: 'bg-yellow-400 animate-pulse', text: 'text-yellow-600 dark:text-yellow-300', label: 'Firebase…',   title: 'Connecting to Firebase…' },
    connected: { dot: 'bg-green-500',                text: 'text-green-600 dark:text-green-400',   label: 'Firebase ✓',  title: 'Firebase connected — skr-task' },
    error:     { dot: 'bg-red-500',                  text: 'text-red-600 dark:text-red-400',        label: 'Firebase ✗',  title: 'Firebase connection failed — check Firestore rules' },
  }[status];

  return (
    <div className="flex items-center gap-1.5 text-xs font-semibold select-none cursor-default" title={cfg.title}>
      <span className={`w-2 h-2 rounded-full flex-shrink-0 ${cfg.dot}`} />
      <span className={cfg.text}>{cfg.label}</span>
    </div>
  );
}

/* ─── DOWNLOAD EVIDENCE HELPER ─── */
function downloadEvidence(ev) {
  const url = ev.storageUrl || ev.url || ev.dataUrl;
  if (!url) {
    alert('File not available. Please re-upload.');
    return;
  }
  // storageUrl / external URL: open in new tab
  if (ev.storageUrl || ev.url) {
    window.open(url, '_blank');
    return;
  }
  // base64 fallback
  const a = document.createElement('a');
  a.href = url;
  a.download = ev.name || 'evidence';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

/* ─── NOTIFICATION BELL ─── */
function NotificationBell({ dk, requirements, role, onNotifClick }) {
  const [open, setOpen] = React.useState(false);
  const [seen, setSeen] = React.useState(() => {
    try { return JSON.parse(localStorage.getItem('notif_seen') || '[]'); } catch { return []; }
  });
  const ref = React.useRef(null);

  // Build notifications: overdue + newly uploaded evidence
  const notifications = React.useMemo(() => {
    const list = [];
    requirements.forEach(r => {
      if (r.status === 'Overdue' || isEffectivelyOverdue(r)) {
        list.push({ id: `overdue-${r.id}`, type: 'overdue', reqId: r.id, title: r.title, plant: r.plantId, ts: r.dueDate, msg: `Overdue since ${(()=>{const _d=new Date(r.dueDate);const _p=n=>String(n).padStart(2,'0');return _p(_d.getDate())+'-'+_p(_d.getMonth()+1)+'-'+_d.getFullYear();})()}` });
      }
      (r.evidence || []).forEach(ev => {
        list.push({ id: `ev-${ev.id}`, type: 'evidence', reqId: r.id, title: r.title, plant: r.plantId, ts: ev.uploadedAt, msg: `📎 Evidence uploaded: ${ev.name}` });
      });
    });
    // Sort newest first
    list.sort((a, b) => new Date(b.ts) - new Date(a.ts));
    return list.slice(0, 30);
  }, [requirements]);

  const unreadIds = notifications.filter(n => !seen.includes(n.id)).map(n => n.id);
  const unreadCount = unreadIds.length;

  const markAllRead = () => {
    const allIds = notifications.map(n => n.id);
    localStorage.setItem('notif_seen', JSON.stringify(allIds));
    setSeen(allIds);
  };

  // Close on outside click
  React.useEffect(() => {
    const handler = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, []);

  const typeIcon = { overdue: '🚨', evidence: '📎' };
  const typeColor = { overdue: dk ? 'text-red-400' : 'text-red-600', evidence: dk ? 'text-[color:var(--p400)]' : 'text-[color:var(--p600)]' };

  return (
    <div ref={ref} className="relative">
      <button
        onClick={() => { setOpen(o => !o); }}
        className={`relative p-2 rounded-lg transition-colors ${dk ? 'text-gray-300 hover:bg-gray-700' : 'text-slate-600 hover:bg-gray-100'}`}
        title="Notifications"
      >
        <span className="text-lg">🔔</span>
        {unreadCount > 0 && (
          <span className="absolute -top-0.5 -right-0.5 min-w-[18px] h-[18px] bg-red-500 text-white text-[10px] font-bold rounded-full flex items-center justify-center px-1 shadow">
            {unreadCount > 99 ? '99+' : unreadCount}
          </span>
        )}
      </button>

      {open && (
        <div className={`absolute right-0 top-full mt-2 w-80 rounded-2xl shadow-2xl border z-50 ${dk ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-200'}`}
          style={{ maxHeight: '420px', overflowY: 'auto' }}>
          {/* Header */}
          <div className={`flex items-center justify-between px-4 py-3 border-b sticky top-0 ${dk ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-100'}`}>
            <p className={`font-semibold text-sm ${dk ? 'text-white' : 'text-gray-900'}`}>Notifications {unreadCount > 0 && <span className="ml-1 text-xs bg-red-500 text-white rounded-full px-1.5 py-0.5">{unreadCount}</span>}</p>
            {unreadCount > 0 && (
              <button onClick={markAllRead} className="text-xs text-[color:var(--p500)] hover:underline font-medium">Mark all read</button>
            )}
          </div>

          {/* List */}
          {notifications.length === 0 ? (
            <div className="px-4 py-8 text-center">
              <p className="text-2xl mb-2">🎉</p>
              <p className={`text-sm ${dk ? 'text-gray-400' : 'text-gray-500'}`}>No notifications yet</p>
            </div>
          ) : (
            <div className="divide-y divide-gray-100 dark:divide-gray-700">
              {notifications.map(n => {
                const isUnread = !seen.includes(n.id);
                return (
                  <div key={n.id}
                    onClick={() => {
                      // Mark this notification as read
                      if (isUnread) {
                        const updated = [...seen, n.id];
                        localStorage.setItem('notif_seen', JSON.stringify(updated));
                        setSeen(updated);
                      }
                      // Navigate to the requirement
                      if (onNotifClick && n.reqId) {
                        onNotifClick(n.reqId);
                        setOpen(false);
                      }
                    }}
                    className={`px-4 py-3 transition-colors ${onNotifClick ? 'cursor-pointer' : 'cursor-default'} ${isUnread ? (dk ? 'bg-gray-700/50' : 'bg-gray-50') : ''} ${dk ? 'hover:bg-gray-700/50' : 'hover:bg-gray-50'}`}>
                    <div className="flex items-start gap-2">
                      <span className="text-base mt-0.5 flex-shrink-0">{typeIcon[n.type]}</span>
                      <div className="flex-1 min-w-0">
                        <p className={`text-xs font-semibold truncate ${typeColor[n.type]}`}>{n.title}</p>
                        <p className={`text-xs mt-0.5 ${dk ? 'text-gray-300' : 'text-gray-600'}`}>{n.msg}</p>
                        <p className={`text-[10px] mt-0.5 ${dk ? 'text-gray-500' : 'text-gray-400'}`}>{n.ts ? new Date(n.ts).toLocaleString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : ''}</p>
                      </div>
                      <div className="flex items-center gap-1 flex-shrink-0 mt-0.5">
                        {isUnread && <span className="w-2 h-2 rounded-full t-notif-dot"></span>}
                        {onNotifClick && <span className="text-gray-300 dark:text-gray-600 text-xs">›</span>}
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function AdminOverview({ dk, plants, users, requirements, categories: catsProp, openReqId, onNotifReqOpened, onGoToEdit }) {
  const cats = catsProp || CATEGORIES;
  const [selPlant, setSelPlant] = useState('');
  const [drillModal, setDrillModal] = useState(null);
  const [exportLoading, setExportLoading] = useState('');

  const getExportData = () => {
    const scopeReqs = selPlant ? requirements.filter(r=>r.plantId===selPlant) : requirements;
    return scopeReqs.map(r => {
      const plant = plants.find(p=>p.id===r.plantId);
      const assignedIds = Array.isArray(r.assignedTo) ? r.assignedTo : (r.assignedTo ? [r.assignedTo] : []);
      const assignees = assignedIds.map(id=>users.find(u=>u.id===id)).filter(Boolean).map(u=>u.name).join('; ');
      return {
        'ID': r.id,
        'Title': r.title,
        'Category': r.category,
        'Priority': r.priority,
        'Status': r.status,
        'Plant': plant?.name || '—',
        'State': plant?.state || '—',
        'Assigned To': assignees || 'Unassigned',
        'Due Date': r.dueDate || '—',
        'Reminder Frequency': r.reminderFrequency || '—',
        'Escalation Level': r.escalationLevel ? `Level ${r.escalationLevel}` : '—',
        'Applicable Rule': r.applicableRule || '—',
        'Completion Date': r.completionDate || '—',
        'Created At': r.createdAt ? new Date(r.createdAt).toLocaleDateString('en-IN') : '—',
        'Description': r.description || '',
      };
    });
  };

  const exportCSV = () => {
    setExportLoading('csv');
    try {
      const rows = getExportData();
      if (!rows.length) { alert('No data to export.'); setExportLoading(''); return; }
      const headers = Object.keys(rows[0]);
      const escape = v => `"${String(v).replace(/"/g,'""')}"`;
      const csv = [headers.map(escape).join(','), ...rows.map(r => headers.map(h=>escape(r[h]||'')).join(','))].join('\r\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const scopeLabel = selPlant ? plants.find(p=>p.id===selPlant)?.name?.replace(/\s+/g,'_') : 'All_Plants';
      a.href = url;
      a.download = `Legal_Compliance_${scopeLabel}_${new Date().toISOString().split('T')[0]}.csv`;
      document.body.appendChild(a); a.click();
      document.body.removeChild(a); URL.revokeObjectURL(url);
    } catch(e) { console.error(e); }
    setTimeout(() => setExportLoading(''), 800);
  };

  const exportPDF = () => {
    setExportLoading('pdf');

        ${overdue > 0 ? `<div style="background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:10px 14px;margin-bottom:16px;color:#dc2626;font-size:11px;font-weight:600">🚨 ${overdue} Overdue item${overdue>1?'s':''} require immediate attention</div>` : ''}
        <table>
          <thead><tr><th>Requirement</th><th>Category</th><th>Priority</th><th>Status</th><th>Plant</th><th>Assigned To</th><th>Due Date</th><th>Escalation</th></tr></thead>
          <tbody>${tableRows}</tbody>

        <script>window.onload=()=>{window.print();}<\/script>

      const blob = new Blob([html], { type: 'text/html;charset=utf-8;' });

    setTimeout(() => setExportLoading(''), 800);

  // Auto-open requirement from notification bell

  const scopedReqs = selPlant ? requirements.filter(r=>r.plantId===selPlant) : requirements;

  const completed = scopedReqs.filter(r=>r.status==='Completed').length;
  const overdue   = scopedReqs.filter(r=>r.status==='Overdue' || isEffectivelyOverdue(r)).length;
  const pending   = scopedReqs.filter(r=>r.status==='Pending').length;
  const inProg    = scopedReqs.filter(r=>r.status==='In Progress').length;

      I:pr.filter(r=>r.status==='In Progress').length, O:pr.filter(r=>r.status==='Overdue'||isEffectivelyOverdue(r)).length };

  const statusPie = STATUSES.map(s=>({ name:s, value:scopedReqs.filter(r=>r.status===s).length }));
  const catPie    = cats.map(c=>({ name:c, value:scopedReqs.filter(r=>r.category===c).length })).filter(d=>d.value>0);
  // ── Compliance Trend: real data from last 6 months ──────────────────────
  // Strategy: for each month bucket, count requirements whose dueDate falls
  // in that month, then compute % completed (status==='Completed') among them.
  // If a month has no due requirements, fall back to cumulative snapshot so
  // the line never gaps.
  const trendData = (() => {
    const now = new Date();
    const buckets = [];
    for (let i = 5; i >= 0; i--) {
      const d   = new Date(now.getFullYear(), now.getMonth() - i, 1);
      const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      const lbl = d.toLocaleString('default', { month: 'short' });
      buckets.push({ key, m: lbl, total: 0, done: 0 });
    }
    // Bucket by dueDate month
    requirements.forEach(r => {
      if (!r.dueDate) return;
      const mk = r.dueDate.slice(0, 7);
      const b  = buckets.find(x => x.key === mk);
      if (!b) return;
      b.total++;
      if (r.status === 'Completed') b.done++;
    });
    // For months with no due reqs, carry forward the latest known % (or use
    // cumulative up-to-that-month snapshot so the trend is always meaningful)
    let lastPct = compliance; // fallback = current overall rate

      let pct;
      if (b.total > 0) {
        pct = Math.round((b.done / b.total) * 100);
        lastPct = pct;

        // No requirements due this month — use cumulative completed/total

/* ═══════════════════════════════════════════
   MICROSOFT GRAPH API HELPER
   – replaces EmailJS; uses Azure AD (MSAL)
     + Microsoft Graph /sendMail endpoint
═══════════════════════════════════════════ */

// ── MSAL singleton cache (one instance per clientId+tenantId) ──────────
// BUG FIX: creating new PublicClientApplication() on every call caused token-cache
// conflicts and "interaction_in_progress" errors because MSAL writes auth state to
// localStorage and multiple instances step on each other.
const _msalInstances = {};

/**
 * getMSGraphToken()
 * Acquires a delegated access token from Azure AD using MSAL popup/silent flow.
 * Requires adminSettings: { msClientId, msTenantId }
 */
async function getMSGraphToken(cfg) {
  if (typeof msal === 'undefined') {
    throw new Error(
      'MSAL library failed to load. Please check your internet connection and try refreshing the page. ' +
      'If the problem persists, ensure your network allows access to unpkg.com or cdn.jsdelivr.net.'
    );
  }
  if (!cfg.msClientId || !cfg.msTenantId) {
    throw new Error('Azure App (Client) ID and Tenant ID are required.');
  }

  // BUG FIX: redirectUri was window.location.origin which equals the string "null"
  // for file:// URLs, and may not match Azure AD registration for hosted pages.
  // Use the full page URL (no hash/query). Register THIS exact URL in Azure AD under:
  //   App registrations → Authentication → Redirect URIs (type: Single-page application)
  const redirectUri = window.location.href.split('?')[0].split('#')[0];

  const cacheKey = `${cfg.msClientId}::${cfg.msTenantId}`;
  if (!_msalInstances[cacheKey]) {
    const msalConfig = {
      auth: {
        clientId:    cfg.msClientId,
        authority:   `https://login.microsoftonline.com/${cfg.msTenantId}`,
        redirectUri,
      },
      cache: { cacheLocation: 'localStorage', storeAuthStateInCookie: false },
    };
    const inst = new msal.PublicClientApplication(msalConfig);
    await inst.initialize();
    _msalInstances[cacheKey] = inst;
    console.log(`🔑 MSAL instance created — redirectUri: ${redirectUri}`);
  }
  const msalInstance = _msalInstances[cacheKey];

  const request = { scopes: ['Mail.Send', 'User.Read'] };

  // Try silent first (uses cached token)
  const accounts = msalInstance.getAllAccounts();
  if (accounts.length > 0) {
    try {
      const silentResult = await msalInstance.acquireTokenSilent({ ...request, account: accounts[0] });
      return silentResult.accessToken;
    } catch (_) { /* fall through to popup */ }
  }
  // Interactive popup login
  const popupResult = await msalInstance.loginPopup(request);
  return popupResult.accessToken;
}

/**
 * sendGraphMail(accessToken, { toEmail, subject, htmlBody })
 * POST to Microsoft Graph /me/sendMail
 */
async function sendGraphMail(accessToken, { toEmail, subject, htmlBody }) {
  const body = {
    message: {
      subject,
      body: { contentType: 'HTML', content: htmlBody },
      toRecipients: [{ emailAddress: { address: toEmail } }],
    },
    saveToSentItems: true,
  };
  const res = await fetch('https://graph.microsoft.com/v1.0/me/sendMail', {
    method: 'POST',
    headers: {
      Authorization: `Bearer ${accessToken}`,
      'Content-Type': 'application/json',
    },
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    const errText = await res.text().catch(() => res.statusText);
    throw new Error(`Graph API error ${res.status}: ${errText}`);
  }
}

/**
 * buildComplianceHtml({ subject, greeting, openingLine, sectionTitle, triggerLabel,
 *                        rows, closingRemark, portalLink, sentDate })
 * Returns a styled HTML string for the email body.
 */
function buildComplianceHtml({ subject, greeting, openingLine, sectionTitle, triggerLabel,
                                rows, closingRemark, portalLink, sentDate }) {

  // ── Status badge colour map ───────────────────────────────────────────────
  const STATUS_STYLE = {
    'Pending':     { bg:'#e9ecef', border:'#adb5bd', text:'#495057', dot:'#868e96' },
    'In Progress': { bg:'#dbeafe', border:'#93c5fd', text:'#1e40af', dot:'#3b82f6' },
    'Completed':   { bg:'#dcfce7', border:'#86efac', text:'#166534', dot:'#22c55e' },
    'Overdue':     { bg:'#fee2e2', border:'#fca5a5', text:'#991b1b', dot:'#ef4444' },
  };

  // ── Row renderer: detects Status row and renders a colour badge ───────────
  const rowsHtml = rows.map(([icon, label, value]) => {
    if (!value) return '';
    if (label === 'Status') {
      const s = STATUS_STYLE[value] || STATUS_STYLE['Pending'];
      return `<tr>
        <td style="padding:10px 0;font-family:'Times New Roman',Times,serif;font-size:14px;color:#374151;line-height:1.8;border-bottom:1px solid #e8eaf0;">
          &nbsp;&nbsp;${icon} <span style="color:#374151;">${label}:</span>&nbsp;
          <span style="display:inline-flex;align-items:center;gap:6px;background:${s.bg};border:1.5px solid ${s.border};color:${s.text};padding:5px 18px 5px 14px;border-radius:50px;font-size:13px;font-weight:700;font-family:'Times New Roman',Times,serif;letter-spacing:0.3px;vertical-align:middle;">
            <span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${s.dot};flex-shrink:0;"></span>${value}
          </span>
        </td>

   EMAILJS HELPER
   – Alternative email provider using EmailJS
     No backend required; uses EmailJS SDK
═══════════════════════════════════════════ */

/**
 * sendEmailJsMail(cfg, { toEmail, subject, htmlBody, templateParams })
 * Sends an email via EmailJS using a template or raw params.
 * cfg: { ejsServiceId, ejsTemplateId, ejsPublicKey, msToEmail }
 */
async function sendEmailJsMail(cfg, { toEmail, subject, plainText, templateParams }) {
  if (typeof emailjs === 'undefined') {
    throw new Error('EmailJS library failed to load. Check your internet connection or ad-blockers.');
  }
  if (!cfg.ejsServiceId || !cfg.ejsTemplateId || !cfg.ejsPublicKey) {
    throw new Error('EmailJS Service ID, Template ID, and Public Key are all required.');
  }

  // Initialize EmailJS (idempotent)
  emailjs.init({ publicKey: cfg.ejsPublicKey });

  // Merge caller params with standard params
  const params = {
    to_email:    toEmail,
    to_name:     templateParams?.to_name     || 'Compliance Team',
    from_name:   templateParams?.from_name   || 'Polyplastics',
    subject:     subject,
    message:     plainText || templateParams?.message || subject,
    reply_to:    cfg.fromEmail || cfg.msToEmail || '',
    // extra fields callers may supply
    ...(templateParams || {}),
  };

  // BUG FIX: EmailJS v4 rejects (throws) on hard errors, but resolves with non-200
  // for soft failures (e.g. bad template variable). We must check both cases.
  // Also: the `to_email` param only reaches the recipient if your EmailJS template's
  // "To Email" field is set to {{to_email}} in the EmailJS dashboard. If it's
  // hardcoded in the template, every email goes to that address regardless of toEmail.
  let response;
  try {
    response = await emailjs.send(cfg.ejsServiceId, cfg.ejsTemplateId, params);
  } catch (sendErr) {
    // EmailJS throws an object {status, text} — normalise to Error
    const msg = sendErr?.text || sendErr?.message || String(sendErr);
    const code = sendErr?.status ? ` (status ${sendErr.status})` : '';
    throw new Error(`EmailJS send rejected${code}: ${msg}`);
  }
  if (!response || response.status !== 200) {
    throw new Error(`EmailJS responded with status ${response?.status}: ${response?.text}`);
  }
  return response;
}

/**
 * buildEmailJsPlainText({ greeting, openingLine, rows, closingRemark, portalLink, sentDate })
 * Returns a plain-text fallback string for EmailJS templates.
 */
function buildEmailJsPlainText({ greeting, openingLine, rows, closingRemark, portalLink, sentDate }) {
  const rowLines = rows
    .filter(([, , value]) => value)
    .map(([icon, label, value]) => `  ${icon} ${label}: ${value}`)
    .join('\n');
  return `${greeting}

${openingLine}

${rowLines}

${closingRemark}

Open Compliance Portal: ${portalLink}

Sent on ${sentDate} · Polyplastics`;
}

/**
 * sendComplianceMail({ trigger, req, plant, assignee, oldAssignee, oldStatus, changedBy })
 *
 * trigger: 'new_requirement' | 'status_change' | 'new_assignment' | 'reassignment'
 *          | 'plant_added' | 'plant_deleted' | 'plant_updated'
 *
 * Reads email provider settings from localStorage.
 * emailProvider: 'graph' (Microsoft Graph API) | 'emailjs' | 'both'
 */
async function sendComplianceMail({ trigger, req, plant, assignee, oldAssignee, oldStatus, changedBy }) {
  // Log every notification event for the daily digest
  logDigestActivity({ trigger, req, plant, assignee, oldStatus, changedBy });
  try {
    const raw = localStorage.getItem('adminSettings');
    if (!raw) return;
    const cfg = JSON.parse(raw);

    const provider = cfg.emailProvider || 'graph'; // 'graph' | 'emailjs' | 'both'
    // BUG FIX: previously `|| cfg.msEnabled` caused Graph to run even when provider='emailjs',
    // which triggered a popup that browsers block in automated flows, silently killing everything.
    const useGraph  = provider === 'graph'  || provider === 'both';
    const useEjs    = provider === 'emailjs' || provider === 'both';

    // Quick-exit if neither provider is configured
    const graphReady = useGraph  && cfg.msClientId && cfg.msTenantId && cfg.msToEmail;
    const ejsReady   = (useEjs || cfg.ejsEnabled) && cfg.ejsServiceId && cfg.ejsTemplateId && cfg.ejsPublicKey && cfg.msToEmail;
    if (!graphReady && !ejsReady) return;

    // ── Shared helpers ──────────────────────────────────────────────────
    const fmtDate  = d => d ? new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}) : '—';
    const calcDays = d => { const diff = Math.ceil((new Date(d) - Date.now()) / 86400000); return diff > 0 ? diff : 0; };
    const sentDate = new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
    const portalLink = window.location.href.split('?')[0];
    const byLabel    = changedBy ? changedBy.name : 'System';

    // ── Per-trigger subject, greeting, openingLine, rows, closing ───────
    let subject = '', greeting = 'Dear Compliance Team,', openingLine = '';
    let sectionTitle = 'REQUIREMENT DETAILS', triggerLabel = 'Notification', closingRemark = '';
    let baseRows = [];
    let extrasByRecipient = {};

    const reqRows = () => {
      const escEmails = req?.escalationEmails && typeof req.escalationEmails === 'object'
        ? req.escalationEmails
        : (req?.escalationEmail ? { 1:[req.escalationEmail], 2:[], 3:[] } : {});
      const currentLevel = req?.escalationLevel || 1;
      const escEmailList = [];
      for (let lv = 1; lv <= 3; lv++) {
        const emails = escEmails[lv] || [];
        if (emails.length) escEmailList.push(`L${lv}: ${emails.join(', ')}`);
      }
      return [
        ['📋','Title',        req?.title],
        ['🏷️','Category',    req?.category],
        ['⚡','Priority',     req?.priority],
        ['⏳','Status',       req?.status],
        ['📅','Due Date',     fmtDate(req?.dueDate)],
        ['✅','Completion Date', req?.completionDate ? fmtDate(req.completionDate) : null],
        ['⌛','Days Left',    req?.dueDate ? `${calcDays(req.dueDate)} days` : null],
        ['🔔','Reminder',     req?.reminderFrequency],
        ['🏭','Plant',        plant ? `${plant.name} (${plant.state})` : null],
        ['⬆️','Escalation',   req?.escalationLevel ? `Level ${req.escalationLevel}` : null],
        ['📧','Escalation Emails', escEmailList.length ? escEmailList.join(' | ') : null],
      ];
    };

    if (trigger === 'new_requirement') {
      subject       = `[LegalComp] New Requirement Added: ${req?.title}`;
      triggerLabel  = 'New Requirement';
      openingLine   = 'A new compliance requirement has been created in the system and is ready for action.';
      closingRemark = 'Please ensure the requirement is reviewed and assigned promptly.';
      baseRows = [
        ...reqRows(),
        ['👤','Assigned To', assignee ? `${assignee.name} (${assignee.dept || '—'})` : null],
        ['📝','Description', req?.description],
      ];

    } else if (trigger === 'new_assignment') {
      subject       = `[LegalComp] New Compliance Task Assigned to You: ${req?.title}`;
      sectionTitle  = 'ASSIGNED REQUIREMENT DETAILS';
      triggerLabel  = 'New Assignment';
      openingLine   = 'A compliance requirement has been assigned. Please review the details below and take the necessary action before the due date.';
      closingRemark = 'Please log in to the compliance portal to review the requirement, upload evidence and update the status once completed.';
      extrasByRecipient[cfg.msToEmail] = {
        greeting:    'Dear Compliance Team,',
        extraRows:   [['👤','Assigned To', assignee ? `${assignee.name} (${assignee.email})` : null]],
      };
      if (assignee?.email && assignee.email !== cfg.msToEmail) {
        extrasByRecipient[assignee.email] = {
          greeting:  `Dear ${assignee.name},`,
          extraRows: [],
        };
      }
      baseRows = [...reqRows(), ['📝','Description', req?.description]];

    } else if (trigger === 'status_change') {
      subject       = `[LegalComp] Status Updated → ${req?.status}: ${req?.title}`;
      sectionTitle  = 'UPDATED REQUIREMENT DETAILS';
      triggerLabel  = 'Status Updated';
      greeting      = assignee ? `Dear ${assignee.name},` : 'Dear Compliance Team,';
      openingLine   = `The status of a compliance requirement has been updated from "${oldStatus}" to "${req?.status}".`;
      closingRemark = 'Please review the updated status and ensure all compliance actions are on track.';
      baseRows = reqRows();

    } else if (trigger === 'reassignment') {
      const oldLabel = oldAssignee ? `${oldAssignee.name} (${oldAssignee.email})` : 'Unassigned';
      subject       = `[LegalComp] Requirement Reassigned: ${req?.title}`;
      sectionTitle  = 'REASSIGNMENT DETAILS';
      triggerLabel  = 'Reassigned';
      closingRemark = 'Please log in to the compliance portal to review and begin work on this requirement.';
      extrasByRecipient[cfg.msToEmail] = {
        greeting:    'Dear Compliance Team,',
        openingLine: `A compliance requirement has been reassigned from ${oldLabel} to ${assignee?.name || 'a new team member'}.`,
        extraRows:   [['👤','New Assignee', assignee ? `${assignee.name} (${assignee.email})` : null]],
      };
      if (assignee?.email && assignee.email !== cfg.msToEmail) {
        extrasByRecipient[assignee.email] = {
          greeting:    `Dear ${assignee.name},`,
          openingLine: 'A compliance requirement has been reassigned to you. Please review the details and take ownership immediately.',
          extraRows:   [],
        };
      }
      baseRows = reqRows();

    } else if (['plant_added','plant_deleted','plant_updated'].includes(trigger)) {
      const labels  = { plant_added:'Plant Added', plant_deleted:'Plant Removed', plant_updated:'Plant Updated' };
      const openings = {
        plant_added:   `A new plant location has been added to the LegalComp system by ${byLabel}.`,
        plant_deleted: `A plant location has been removed from the LegalComp system by ${byLabel}.`,
        plant_updated: `A plant location has been updated in the LegalComp system by ${byLabel}.`,
      };
      const closings = {
        plant_added:   'Please ensure compliance requirements are set up for this new plant.',
        plant_deleted: 'Please archive all related compliance records for this plant.',
        plant_updated: 'Please verify the updated plant details in the compliance portal.',
      };
      subject       = `[LegalComp] ${labels[trigger]}: ${plant?.name}`;
      sectionTitle  = 'PLANT DETAILS';
      triggerLabel  = labels[trigger];
      openingLine   = openings[trigger];
      closingRemark = closings[trigger];
      baseRows = [
        ['🏭','Plant Name',  plant?.name],
        ['📍','State',       plant?.state],
        ['👤','Changed By',  byLabel],
      ];
    } else {
      return;
    }

    // ── Acquire Graph token once (if needed) ────────────────────────────
    let accessToken = null;
    if (graphReady) {
      try {
        accessToken = await getMSGraphToken(cfg);
      } catch(e) {
        console.warn('⚠️ MS Graph token acquisition failed:', e?.message || e);
        if (!ejsReady) return; // nothing else to fall back to
      }
    }

    // ── Collect recipients ──────────────────────────────────────────────
    const recipients = new Set([cfg.msToEmail]);
    if (assignee?.email) recipients.add(assignee.email);
    if (oldAssignee?.email && trigger === 'reassignment') recipients.add(oldAssignee.email);
    // ── Add per-level escalation emails ──────────────────────────────────
    if (req) {
      // Per-requirement emails take precedence; fall back to global adminSettings map
      const perReqEmails = req.escalationEmails && typeof req.escalationEmails === 'object'
        ? req.escalationEmails
        : (req.escalationEmail ? { 1:[req.escalationEmail], 2:[], 3:[] } : null);
      const globalMap = cfg.escalationEmailsMap && typeof cfg.escalationEmailsMap === 'object'
        ? cfg.escalationEmailsMap
        : { 1: cfg.escalation1?[cfg.escalation1]:[], 2: cfg.escalation2?[cfg.escalation2]:[], 3: cfg.escalation3?[cfg.escalation3]:[] };
      const escEmails = perReqEmails || globalMap;
      const currentLevel = req.escalationLevel || 1;
      // Send to all levels up to and including current escalation level
      for (let lv = 1; lv <= currentLevel; lv++) {
        const lvEmails = escEmails[lv] || [];
        lvEmails.forEach(e => { if(e) recipients.add(e); });
      }
    }

    // ── Fire one send per recipient ─────────────────────────────────────
    for (const toEmail of recipients) {
      const overrides  = extrasByRecipient[toEmail] || {};
      const finalRows  = [...baseRows, ...(overrides.extraRows || [])];
      const finalGreeting    = overrides.greeting    || greeting;
      const finalOpeningLine = overrides.openingLine || openingLine;

      // ── Microsoft Graph send ──────────────────────────────────────────
      if (graphReady && accessToken) {
        try {
          const htmlBody = buildComplianceHtml({
            subject,
            greeting:    finalGreeting,
            openingLine: finalOpeningLine,
            sectionTitle,
            triggerLabel,
            rows:        finalRows,
            closingRemark,
            portalLink,
            sentDate,
          });
          await sendGraphMail(accessToken, { toEmail, subject, htmlBody });
          console.log(`✅ [MS Graph] ${trigger} → ${toEmail}`);
        } catch(e) {
          console.warn(`⚠️ MS Graph send failed for ${toEmail}:`, e?.message || e);
        }
      }

      // ── EmailJS send ──────────────────────────────────────────────────
      if (ejsReady) {
        try {
          const plainText = buildEmailJsPlainText({
            greeting:    finalGreeting,
            openingLine: finalOpeningLine,
            rows:        finalRows,
            closingRemark,
            portalLink,
            sentDate,
          });
          // Build a rich templateParams map for flexible EmailJS templates
          const reqObj = req || {};
          const plantObj = plant || {};
          await sendEmailJsMail(cfg, {
            toEmail,
            subject,
            plainText,
            templateParams: {
              to_name:         overrides.greeting ? overrides.greeting.replace(/^Dear\s+/i,'').replace(/,$/,'') : 'Compliance Team',
              from_name:       'Polyplastics',
              trigger_label:   triggerLabel,
              opening_line:    finalOpeningLine,
              closing_remark:  closingRemark,
              portal_link:     portalLink,
              sent_date:       sentDate,
              req_title:       reqObj.title        || '',
              req_category:    reqObj.category      || '',
              req_priority:    reqObj.priority      || '',
              req_status:      reqObj.status        || '',
              req_due_date:    reqObj.dueDate        ? new Date(reqObj.dueDate).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}) : '',
              req_description: reqObj.description   || '',
              plant_name:      plantObj.name         || '',
              plant_state:     plantObj.state        || '',
              assignee_name:   assignee?.name        || '',
              assignee_email:  assignee?.email       || '',
              changed_by:      changedBy?.name       || 'System',
              old_status:      oldStatus             || '',
            },
          });
          console.log(`✅ [EmailJS] ${trigger} → ${toEmail}`);
        } catch(e) {
          console.warn(`⚠️ EmailJS send failed for ${toEmail}:`, e?.message || e);
        }
      }
    }

  } catch (e) {
    console.warn('⚠️ sendComplianceMail error:', e?.message || e);
  }
}

/* ═══════════════════════════════════════════
   DAILY DIGEST — 24-HOUR CONSOLIDATED EMAIL
═══════════════════════════════════════════ */

/**
 * Appends an activity entry to the in-memory digest log (window.__digestLog).
 * Called from sendComplianceMail so every real notification is captured.
 */
function logDigestActivity({ trigger, req, plant, assignee, oldStatus, changedBy }) {
  if (!window.__digestLog) window.__digestLog = [];
  window.__digestLog.push({
    ts: new Date().toISOString(),
    trigger,
    title:       req?.title       || '',
    category:    req?.category    || '',
    priority:    req?.priority    || '',
    status:      req?.status      || '',
    oldStatus:   oldStatus        || '',
    dueDate:     req?.dueDate     || '',
    plant:       plant?.name      || '',
    state:       plant?.state     || '',
    assignee:    assignee?.name   || '',
    changedBy:   changedBy?.name  || 'System',
  });
}

/**
 * Sends a single consolidated "last 24 hours" digest email.
 * Clears the digest log after sending.
 */
async function sendDailyDigestMail(requirements, plants, users) {
  try {
    const raw = localStorage.getItem('adminSettings');
    if (!raw) return;
    const cfg = JSON.parse(raw);
    if (!cfg.dailyDigestEnabled) return;

    const provider  = cfg.emailProvider || 'graph';
    const useGraph  = provider === 'graph'  || provider === 'both';
    const useEjs    = provider === 'emailjs' || provider === 'both';
    const graphReady = useGraph  && cfg.msClientId && cfg.msTenantId && cfg.msToEmail;
    const ejsReady   = (useEjs || cfg.ejsEnabled) && cfg.ejsServiceId && cfg.ejsTemplateId && cfg.ejsPublicKey && cfg.msToEmail;
    if (!graphReady && !ejsReady) { console.warn('⚠️ Daily digest: no email provider configured.'); return; }

    const portalLink = window.location.href.split('?')[0];
    const sentDate   = new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
    const fmtDate    = d => d ? new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}) : '—';
    const daysLeft   = d => { const diff = Math.ceil((new Date(d) - Date.now()) / 86400000); return diff; };

    // ── Snapshot current state for the digest sections ───────────────────
    const now        = Date.now();
    const cutoff     = now - 24 * 60 * 60 * 1000;
    const overdue    = requirements.filter(r => r.status === 'Overdue');
    const dueSoon    = requirements.filter(r => r.status !== 'Completed' && r.status !== 'Overdue' && r.dueDate && daysLeft(r.dueDate) >= 0 && daysLeft(r.dueDate) <= 7);
    const completed24= requirements.filter(r => r.status === 'Completed' && r.completionDate && new Date(r.completionDate).getTime() >= cutoff);
    const created24  = requirements.filter(r => r.createdAt && new Date(r.createdAt).getTime() >= cutoff);
    // Activity log captured during the last 24h
    const actLog     = (window.__digestLog || []).filter(e => new Date(e.ts).getTime() >= cutoff);

    const total      = requirements.length;
    const completedAll = requirements.filter(r=>r.status==='Completed').length;
    const compliance = total ? Math.round(completedAll/total*100) : 0;

    const subject = `[LegalComp] Daily Digest — ${new Date().toLocaleDateString('en-IN',{weekday:'long',day:'2-digit',month:'short',year:'numeric'})}`;

    // ── Build rich HTML body ─────────────────────────────────────────────
    const buildDigestHtml = () => {
      const brandGreen = '#22c55e'; const brandRed = '#ef4444'; const brandAmber = '#f59e0b';
      const brandIndigo = '#6366f1'; const brandGray = '#6b7280';

      const statBox = (color, emoji, count, label) =>
        `<td style="width:25%;text-align:center;padding:12px 6px;">
           <div style="background:${color}18;border:1px solid ${color}44;border-radius:12px;padding:14px 8px;">
             <div style="font-size:22px;margin-bottom:4px;">${emoji}</div>
             <div style="font-size:24px;font-weight:800;color:${color};line-height:1;">${count}</div>
             <div style="font-size:11px;color:#6b7280;margin-top:3px;font-weight:600;">${label}</div>
           </div>
         </td>`;

      const sectionHdr = (emoji, title, color) =>
        `<tr><td style="padding:22px 0 10px;">
           <div style="display:flex;align-items:center;gap:8px;border-left:4px solid ${color};padding-left:12px;">
             <span style="font-size:16px;">${emoji}</span>
             <span style="font-size:14px;font-weight:700;color:#111827;text-transform:uppercase;letter-spacing:.05em;">${title}</span>
           </div>
         </td></tr>`;

      const emptyRow = (msg) =>
        `<tr><td style="padding:10px 16px;background:#f9fafb;border-radius:10px;color:#9ca3af;font-size:13px;text-align:center;">${msg}</td></tr>`;

/**
 * useDailyDigestScheduler – React hook (v35: Cloud-aware).
 *
 * PRIMARY path  → Firebase Cloud Function (Office 365 SMTP via Nodemailer).
 *   Reminders fire 24/7 from Firebase's servers regardless of whether the
 *   browser tab is open.  The SPA simply saves settings to Firestore; the
 *   Cloud Function scheduler reads them and sends at the configured times.
 *
 * FALLBACK path → browser-side MS Graph send (original v34 behaviour).
 *   Only fires when the app IS open, as a safety net in case the Cloud
 *   Function webhook URL is not yet configured.
 *
 * Cloud Function webhook endpoint (set in Admin → Settings → Cloud Reminders):
 *   POST  <cloudFnUrl>
 *   Header: x-internal-secret: <cloudFnSecret>
 *   Body:   { "type": "digest" | "reminders" | "overdue" | "weekly" | "monthly" }
 */

/* ── Cloud Function trigger helper ── */
async function triggerCloudReminder(type) {
  try {
    const raw = localStorage.getItem('adminSettings');
    if (!raw) return { ok: false, reason: 'no settings' };
    const cfg = JSON.parse(raw);
    const url    = (cfg.cloudFnUrl    || '').trim();
    const secret = (cfg.cloudFnSecret || '').trim();
    if (!url) return { ok: false, reason: 'cloudFnUrl not configured' };

    const cfg2 = JSON.parse(raw);
    const res = await fetch(url, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-internal-secret': secret,
      },
      body: JSON.stringify({ type, smtpProvider: cfg2.smtpProvider || 'gmail' }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    console.log(`✅ Cloud reminder triggered [${type}]:`, data);
    return { ok: true, data };
  } catch(e) {
    console.warn(`⚠️ Cloud reminder trigger failed [${type}]:`, e?.message || e);
    return { ok: false, reason: e?.message || String(e) };
  }
}

function useDailyDigestScheduler(requirements, plants, users) {
  // Store latest data in refs so the interval closure always sees fresh values
  // without needing to be recreated on every state change (which would reset
  // the 60-second clock and risk missing the send window entirely).
  const reqRef   = useRef(requirements);
  const plantRef = useRef(plants);
  const userRef  = useRef(users);
  useEffect(() => { reqRef.current   = requirements; }, [requirements]);
  useEffect(() => { plantRef.current = plants;       }, [plants]);
  useEffect(() => { userRef.current  = users;        }, [users]);

  useEffect(() => {
    const tick = async () => {
      try {
        const raw = localStorage.getItem('adminSettings');
        if (!raw) return;
        const cfg = JSON.parse(raw);
        if (!cfg.dailyDigestEnabled) return;

        const digestTime = cfg.dailyDigestTime || '08:00'; // HH:mm IST
        const [hh, mm]   = digestTime.split(':').map(Number);
        const now        = new Date();
        const todayKey   = now.toISOString().slice(0,10); // YYYY-MM-DD
        const lastSent   = localStorage.getItem('lastDailyDigestSent') || '';
        const lastSentDay= lastSent.slice(0,10);

        const nowMins = now.getHours() * 60 + now.getMinutes();
        const cfgMins = hh * 60 + mm;

        if (nowMins >= cfgMins && lastSentDay !== todayKey) {
          localStorage.setItem('lastDailyDigestSent', now.toISOString());

          // ── PRIMARY: call Cloud Function (Office 365 SMTP, server-side) ──
          const cloudResult = await triggerCloudReminder('digest');

          // ── FALLBACK: browser-side MS Graph (only if Cloud Fn not configured) ──
          if (!cloudResult.ok && (cfg.msClientId && cfg.msTenantId)) {
            console.log('↩ Cloud Fn not configured — falling back to browser MS Graph send');
            await sendDailyDigestMail(reqRef.current, plantRef.current, userRef.current);
          }
        }
      } catch(e) {
        console.warn('⚠️ Digest scheduler tick error:', e?.message||e);
      }
    };

    tick(); // run once on mount — catches up if configured time already passed today
    const id = setInterval(tick, 60000); // check every minute
    return () => clearInterval(id);
  }, []); // stable: interval created once, refs keep data current without resetting it
}

/* ═══════════════════════════════════════════
   ESCALATION LEVEL PANEL (reusable)
   – one panel per level; own draft-email state
═══════════════════════════════════════════ */
const ESC_LEVEL_COLORS = { 1:'#22c55e', 2:'#f59e0b', 3:'#ef4444' };
const ESC_LEVEL_LABELS = { 1:'Level 1 – Plant Head', 2:'Level 2 – Regional Manager', 3:'Level 3 – Top Management' };

function EscalationLevelPanel({ level, allEmails, onUpdate, dk }) {
  const [draft, setDraft] = useState('');
  const [err, setErr]     = useState('');
  const emails  = (allEmails && allEmails[level]) ? allEmails[level] : [];
  const color   = ESC_LEVEL_COLORS[level];
  const label   = ESC_LEVEL_LABELS[level];
  const roleLabel = label.split('–')[1]?.trim() || 'escalation';

  const addEmail = () => {
    const trimmed = draft.trim().toLowerCase();
    if (!trimmed) return;
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(trimmed)) { setErr('Invalid email address'); return; }
    if (emails.includes(trimmed)) { setErr('Email already added'); return; }
    onUpdate({ ...allEmails, [level]: [...emails, trimmed] });
    setDraft(''); setErr('');
  };

  const removeEmail = (email) => {
    onUpdate({ ...allEmails, [level]: emails.filter(e => e !== email) });
  };

  return (
    <div className="sm:col-span-2">
      <div className={`rounded-xl border p-3 transition-all ${dk ? 'bg-gray-800 border-gray-600' : 'bg-gray-50 border-gray-200'}`}
        style={{ borderLeftWidth: '3px', borderLeftColor: color }}>
        {/* Header */}
        <div className="flex items-center gap-2 mb-2">
          <span className="w-5 h-5 rounded-full flex items-center justify-center text-white text-xs font-bold flex-shrink-0"
            style={{ background: color }}>{level}</span>
          <span className="text-xs font-semibold" style={{ color }}>{label}</span>
          {emails.length > 0 && (
            <span className="ml-auto text-xs px-1.5 py-0.5 rounded-full font-medium"
              style={{ background: color + '22', color }}>
              {emails.length} recipient{emails.length > 1 ? 's' : ''}
            </span>
          )}
        </div>
        {/* Email tags */}
        {emails.length > 0 && (
          <div className="flex flex-wrap gap-1.5 mb-2">
            {emails.map(email => (
              <span key={email}
                className={`inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium border ${dk ? 'bg-gray-700 border-gray-500 text-gray-200' : 'bg-white border-gray-300 text-gray-700'}`}>
                ✉️ {email}
                <button type="button" onClick={() => removeEmail(email)}
                  className="ml-0.5 text-gray-400 hover:text-red-500 transition-colors font-bold leading-none text-sm">×</button>
              </span>
            ))}
          </div>
        )}
        {/* Add row */}
        <div className="flex gap-2">
          <input
            type="email"
            value={draft}
            onChange={e => { setDraft(e.target.value); setErr(''); }}
            onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); addEmail(); } }}
            placeholder={`Add ${roleLabel} email…`}
            className={`flex-1 px-3 py-1.5 rounded-lg border text-xs focus:outline-none focus:ring-2 transition
              ${err ? 'border-red-400 focus:ring-red-300' : 'border-gray-200 focus:ring-purple-400 dark:border-gray-600'}
              ${dk ? 'bg-gray-700 border-gray-600 text-white placeholder-gray-400' : 'bg-white text-gray-900 placeholder-gray-400'}`}
          />
          <button type="button" onClick={addEmail}
            className="px-3 py-1.5 rounded-lg text-xs font-semibold text-white transition-colors flex-shrink-0 hover:opacity-90"
            style={{ background: color }}>
            + Add
          </button>
        </div>
        {err && <p className="text-xs text-red-500 mt-1">{err}</p>}
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════
   REQUIREMENT MODAL (Add / Edit)
═══════════════════════════════════════════ */
function RequirementModal({ open, onClose, onSave, initial, plants, users, dk, categories: catsProp }) {
  const cats = catsProp || CATEGORIES;
  const blank = { title:'', description:'', category: (catsProp||CATEGORIES)[0]||'', priority:'High', plantId:'', plantIds:[], assignedTo:[], status:'Pending', dueDate:'', completionDate:'', reminderFrequency:'Weekly', escalationLevel:1, escalationEmail:'', escalationEmails:{ 1:[], 2:[], 3:[] }, applicableRule:'', legalClause:'' };
  const [form, setForm] = useState(blank);
  const [saving, setSaving] = useState(false);
  useEffect(()=>{
    const init = initial ? {
      ...initial,
      assignedTo: Array.isArray(initial.assignedTo) ? initial.assignedTo : (initial.assignedTo ? [initial.assignedTo] : []),
      // Normalise legacy single escalationEmail → escalationEmails map
      escalationEmails: initial.escalationEmails && typeof initial.escalationEmails === 'object'
        ? { 1: initial.escalationEmails[1]||[], 2: initial.escalationEmails[2]||[], 3: initial.escalationEmails[3]||[] }
        : (initial.escalationEmail
            ? { 1:[initial.escalationEmail], 2:[], 3:[] }
            : { 1:[], 2:[], 3:[] })
    } : blank;
    setForm(init);
  }, [open]);

  const plantUsers = users.filter(u=>u.plantId===form.plantId && ['user','plant_head'].includes(u.role));
  const set = (k,v) => setForm(f=>({...f,[k]:v}));

  const toggleUserAssign = (uid) => {
    const arr = Array.isArray(form.assignedTo) ? form.assignedTo : (form.assignedTo ? [form.assignedTo] : []);
    const idx = arr.indexOf(uid);
    set('assignedTo', idx >= 0 ? arr.filter(x=>x!==uid) : [...arr, uid]);
  };

  const save = async () => {
    // Determine plants: use plantIds if set, fall back to single plantId
    const selectedPlantIds = (form.plantIds && form.plantIds.length > 0) ? form.plantIds : (form.plantId ? [form.plantId] : []);
    if (!form.title || selectedPlantIds.length === 0 || !form.dueDate) return;
    setSaving(true);
    await new Promise(r=>setTimeout(r,400));
    onSave({ ...form, plantIds: selectedPlantIds, plantId: selectedPlantIds[0] || form.plantId });
    setSaving(false);
    onClose();
  };

  return (
    <Modal open={open} onClose={onClose} title={initial?'Edit Requirement':'Add New Requirement'} wide>
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div className="sm:col-span-2">
          <FormField label="Title" required>
            <input value={form.title} onChange={e=>set('title',e.target.value)} placeholder="e.g. Factory License Renewal" className={inputCls} />
          </FormField>
        </div>
        <div className="sm:col-span-2">
          <FormField label="Description">
            <textarea value={form.description} onChange={e=>set('description',e.target.value)} rows={2} placeholder="Detailed description..." className={inputCls + ' resize-none'} />
          </FormField>
        </div>
        <FormField label="Plant(s)" required>
          <div className="space-y-1.5">
            <div className={`flex flex-wrap gap-1.5 min-h-[40px] p-2 rounded-xl border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-700 cursor-pointer`}>
              {plants.map(p => {
                const selected = (form.plantIds||[]).includes(p.id) || (form.plantId===p.id && !(form.plantIds||[]).length);
                return (
                  <button key={p.id} type="button"
                    onClick={() => {
                      const ids = form.plantIds && form.plantIds.length > 0 ? [...form.plantIds] : (form.plantId ? [form.plantId] : []);
                      const idx = ids.indexOf(p.id);
                      if (idx >= 0) { ids.splice(idx,1); } else { ids.push(p.id); }
                      set('plantIds', ids);
                      set('plantId', ids[0]||'');
                      set('assignedTo',[]);
                    }}
                    className={`px-2.5 py-1 rounded-lg text-xs font-medium transition-all border ${selected ? 't-tag-active' : 'bg-gray-50 dark:bg-gray-600 text-gray-600 dark:text-gray-300 border-gray-200 dark:border-gray-500 hover:border-[color:var(--p400)]'}`}>
                    {p.name}
                  </button>
                );
              })}
            </div>
            {(form.plantIds||[]).length > 1 && (
              <p className="text-xs text-[color:var(--p500)] font-medium">📢 This requirement will be created for {(form.plantIds||[]).length} plants</p>
            )}
          </div>
        </FormField>
        <FormField label="Assign To (User/s)">
          {!form.plantId ? (
            <p className="text-xs text-gray-400 italic px-3 py-2.5">Select a plant first</p>
          ) : plantUsers.length === 0 ? (
            <p className="text-xs text-gray-400 italic px-3 py-2.5">No users in this plant</p>
          ) : (
            <div className={`flex flex-wrap gap-1.5 p-2 rounded-xl border ${dk?'border-gray-600 bg-gray-700':'border-gray-200 bg-white'}`}>
              {plantUsers.map(u => {
                const assigned = Array.isArray(form.assignedTo) ? form.assignedTo : (form.assignedTo ? [form.assignedTo] : []);
                const sel = assigned.includes(u.id);
                return (
                  <button key={u.id} type="button"
                    onClick={() => toggleUserAssign(u.id)}
                    className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs font-medium border transition-all ${sel ? 't-tag-active shadow-sm' : dk?'bg-gray-600 text-gray-200 border-gray-500 hover:border-[color:var(--p400)]':'bg-gray-50 text-gray-600 border-gray-200 hover:border-[color:var(--p400)]'}`}>
                    <span className={`w-5 h-5 rounded-full flex items-center justify-center text-xs font-bold ${sel?'text-white':'bg-gray-300 text-gray-600'}`}>{initials(u.name)}</span>
                    {u.name}
                    {sel && <span className="ml-0.5 text-[color:var(--p200)]">✓</span>}
                  </button>
                );
              })}
            </div>
          )}
          {Array.isArray(form.assignedTo) && form.assignedTo.length > 0 && (
            <p className="text-xs text-[color:var(--p500)] font-medium mt-1">👥 {form.assignedTo.length} user{form.assignedTo.length>1?'s':''} assigned</p>
          )}
        </FormField>
        <FormField label="Category" required>
          <select value={form.category} onChange={e=>set('category',e.target.value)} className={selectCls}>
            {cats.map(c=><option key={c}>{c}</option>)}
          </select>
        </FormField>
        <FormField label="Priority" required>
          <select value={form.priority} onChange={e=>set('priority',e.target.value)} className={selectCls}>
            {PRIORITIES.map(p=><option key={p}>{p}</option>)}
          </select>
        </FormField>
        <FormField label="Status">
          <select value={form.status} onChange={e=>set('status',e.target.value)} className={selectCls}>
            {STATUSES.map(s=><option key={s}>{s}</option>)}
          </select>
        </FormField>
        <FormField label="Due Date" required>
          <input type="date" value={form.dueDate} onChange={e=>set('dueDate',e.target.value)} className={inputCls} />
        </FormField>
        <FormField label="Completion Date">
          <input type="date" value={form.completionDate||''} onChange={e=>set('completionDate',e.target.value)} className={inputCls} title="Actual or target completion date" />
        </FormField>
        <FormField label="Reminder Frequency">
          <select value={form.reminderFrequency} onChange={e=>set('reminderFrequency',e.target.value)} className={selectCls}>
            {REM_FREQS.map(r=><option key={r}>{r}</option>)}
          </select>
        </FormField>
        <FormField label="Escalation Level">
          <select value={form.escalationLevel} onChange={e=>set('escalationLevel',+e.target.value)} className={selectCls}>
            {ESC_LABELS.map((l,i)=><option key={i} value={i+1}>{l}</option>)}
          </select>
        </FormField>
        {/* ── Escalation Email Notifications (per level) ── */}
        <div className="sm:col-span-2">
          <div className="flex items-center gap-2 my-1">
            <div className="flex-1 h-px bg-gray-200 dark:bg-gray-600" />
            <span className="text-xs font-bold uppercase tracking-widest text-purple-500 px-2">📧 Escalation Email Notifications</span>
            <div className="flex-1 h-px bg-gray-200 dark:bg-gray-600" />
          </div>
        </div>
        {[1,2,3].map(level => (
          <EscalationLevelPanel
            key={level}
            level={level}
            allEmails={form.escalationEmails || {1:[],2:[],3:[]}}
            onUpdate={updated => set('escalationEmails', updated)}
            dk={dk}
          />
        ))}

        {/* ── Legal & Regulatory Section ── */}
        <div className="sm:col-span-2">
          <div className="flex items-center gap-2 my-1">
            <div className="flex-1 h-px bg-gray-200 dark:bg-gray-600" />
            <span className="text-xs font-bold uppercase tracking-widest text-[color:var(--p500)] px-2">⚖️ Legal &amp; Regulatory</span>
            <div className="flex-1 h-px bg-gray-200 dark:bg-gray-600" />
          </div>
        </div>

        <div className="sm:col-span-2">
          <FormField label="Applicable Rule / Regulation">
            <input
              value={form.applicableRule}
              onChange={e=>set('applicableRule',e.target.value)}
              placeholder="e.g. Factories Act, 1948 – Section 6 & 7"
              className={inputCls}
            />
          </FormField>
        </div>
        <div className="sm:col-span-2">
          <FormField label="Legal Clause / Provision">
            <textarea
              value={form.legalClause}
              onChange={e=>set('legalClause',e.target.value)}
              rows={3}
              placeholder="Describe the specific legal clause, section, or provision that mandates this compliance requirement…"
              className={inputCls + ' resize-none'}
            />
          </FormField>
        </div>
      </div>
      <div className="flex gap-3 mt-6 pt-4 border-t border-gray-100 dark:border-gray-700">
        <button onClick={onClose} className={`flex-1 py-2.5 rounded-xl border text-sm font-medium transition-colors ${dk?'border-gray-600 text-gray-300 hover:bg-gray-700':'border-gray-200 text-gray-700 hover:bg-gray-50'}`}>Cancel</button>
        <button onClick={save} disabled={saving||!form.title||!form.plantId||!form.dueDate}
          className="flex-1 py-2.5 rounded-xl text-white text-sm font-semibold disabled:opacity-50 transition-colors" style={{background:"var(--p600)"}}>
          {saving?'Saving…':initial?'Update':'Add Requirement'}
        </button>
      </div>
    </Modal>
  );
}

/* ═══════════════════════════════════════════
   ADMIN ON-BEHALF MODAL
   Admin can upload evidence & change status
   on behalf of any assigned user
═══════════════════════════════════════════ */
function AdminOnBehalfModal({ dk, req: initialReq, requirements, users, plants, updateRequirements, onClose }) {
  const [req,         setReq]         = React.useState(initialReq);
  const [selUserId,   setSelUserId]   = React.useState('');
  const [newStatus,   setNewStatus]   = React.useState(req.status);
  const [uploading,   setUploading]   = React.useState(false);
  const [uploadMsg,   setUploadMsg]   = React.useState(null); // { text, type }
  const [statusMsg,   setStatusMsg]   = React.useState(null);
  const [tab,         setTab]         = React.useState('status'); // 'status' | 'evidence'
  const fileRef = React.useRef();

  const plant = plants.find(p => p.id === req.plantId);
  const assignedIds = Array.isArray(req.assignedTo) ? req.assignedTo : (req.assignedTo ? [req.assignedTo] : []);
  const assignees = assignedIds.map(id => users.find(u => u.id === id)).filter(Boolean);
  // All users including plant-level + group-level (admin can act on behalf of anyone)
  const allUsers = users.filter(u => u.role !== 'admin' && u.id !== '__dev__');

  const showMsg = (setter, text, type = 'success') => {
    setter({ text, type });
    setTimeout(() => setter(null), 3000);
  };

  /* ── Change status on behalf ── */
  const handleStatusChange = () => {
    if (newStatus === req.status) { showMsg(setStatusMsg, 'Status is already set to ' + newStatus, 'error'); return; }
    const actingUser = selUserId ? users.find(u => u.id === selUserId) : null;
    const now = new Date().toISOString();
    const comment = {
      id: `c${Date.now()}`,
      text: `[Admin action${actingUser ? ' on behalf of ' + actingUser.name : ''}] Status changed from "${req.status}" to "${newStatus}".`,
      userId: selUserId || 'admin',
      createdAt: now,
      isAdminAction: true,
    };
    const completionDate = newStatus === 'Completed' ? now.split('T')[0] : req.completionDate || '';
    const updated = { ...req, status: newStatus, completionDate, comments: [...(req.comments || []), comment] };
    updateRequirements(requirements.map(r => r.id === req.id ? updated : r));
    setReq(updated);
    sendComplianceMail({ trigger: 'status_change', req: updated, plant, assignee: actingUser || assignees[0] || null, oldStatus: req.status, changedBy: null });
    showMsg(setStatusMsg, `✅ Status changed to "${newStatus}" — logged as admin action.`);
  };

  /* ── Upload evidence on behalf ── */
  const handleEvidenceUpload = async (file) => {
    if (!file) return;
    setUploading(true);
    try {
      const evId = `ev${Date.now()}`;
      let storageUrl = null, dataUrl = null;

      if (window.fbStorage) {
        try {
          await fbEnsureAuth();
          const path = `evidence/${req.id}/${evId}_${file.name}`;
          const ref = window.fbStorage.ref(path);
          await ref.put(file);
          storageUrl = await ref.getDownloadURL();
        } catch(e) { console.warn('Firebase Storage upload failed, using base64:', e.message); }
      }
      if (!storageUrl) {
        dataUrl = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = e => resolve(e.target.result);
          reader.onerror = () => reject(new Error('Read failed'));
          reader.readAsDataURL(file);
        });
      }

      const actingUser = selUserId ? users.find(u => u.id === selUserId) : null;
      const ev = {
        id: evId,
        name: file.name,
        size: `${(file.size / 1024).toFixed(1)} KB`,
        uploadedAt: new Date().toISOString(),
        uploadedBy: selUserId || 'admin',
        uploadedByAdmin: true,
        onBehalfOf: selUserId || null,
        onBehalfOfName: actingUser?.name || 'Admin',
        mimeType: file.type,
        storageUrl,
        dataUrl,
      };

      const comment = {
        id: `c${Date.now() + 1}`,
        text: `[Admin action${actingUser ? ' on behalf of ' + actingUser.name : ''}] Evidence uploaded: "${file.name}".`,
        userId: selUserId || 'admin',
        createdAt: new Date().toISOString(),
        isAdminAction: true,
      };

      const updated = { ...req, evidence: [...(req.evidence || []), ev], comments: [...(req.comments || []), comment] };
      updateRequirements(requirements.map(r => r.id === req.id ? updated : r));
      setReq(updated);
      showMsg(setUploadMsg, `✅ "${file.name}" uploaded${actingUser ? ' on behalf of ' + actingUser.name : ''}.`);
    } catch (err) {
      showMsg(setUploadMsg, '❌ Upload failed: ' + err.message, 'error');
    }
    setUploading(false);
    if (fileRef.current) fileRef.current.value = '';
  };

  /* ── Delete evidence ── */
  const handleDeleteEvidence = async (evId) => {
    const ev = (req.evidence || []).find(e => e.id === evId);
    if (!ev) return;
    if (ev.storageUrl && window.fbStorage) {
      try {
        await fbEnsureAuth();
        await window.fbStorage.ref(`evidence/${req.id}/${evId}_${ev.name}`).delete();
      } catch(e) { console.warn('Storage delete warn:', e.message); }
    }
    const updated = { ...req, evidence: (req.evidence || []).filter(e => e.id !== evId) };
    updateRequirements(requirements.map(r => r.id === req.id ? updated : r));
    setReq(updated);
    showMsg(setUploadMsg, `🗑️ "${ev.name}" removed.`);
  };

  const card = `rounded-2xl border shadow-sm ${dk ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-200'}`;
  const sub  = dk ? 'text-gray-400' : 'text-gray-500';

  return (
    <div className="fixed inset-0 z-[65] flex items-center justify-center p-4" style={{ backdropFilter: 'blur(6px)', background: 'rgba(0,0,0,0.6)' }}>
      <div className={`rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col ${dk ? 'bg-gray-800' : 'bg-white'}`}>
        {/* Header */}
        <div className="flex items-center justify-between px-6 py-4 border-b" style={{ borderColor: dk ? '#374151' : '#f3f4f6' }}>
          <div className="flex items-center gap-3">
            <div className="w-9 h-9 rounded-xl flex items-center justify-center text-lg" style={{ background: 'var(--p100)' }}>🛡️</div>
            <div>
              <h2 className={`font-bold text-base ${dk ? 'text-white' : 'text-gray-900'}`}>Admin Action — On Behalf of User</h2>
              <p className={`text-xs ${sub} mt-0.5 max-w-sm truncate`} title={req.title}>{req.title}</p>
            </div>
          </div>
          <button onClick={onClose} className={`w-8 h-8 flex items-center justify-center rounded-full transition-colors ${dk ? 'hover:bg-gray-700 text-gray-400' : 'hover:bg-gray-100 text-gray-400'}`}>✕</button>
        </div>

        <div className="overflow-y-auto flex-1 px-6 py-5 space-y-5">

          {/* Requirement info strip */}
          <div className={`flex flex-wrap items-center gap-2 p-3 rounded-xl ${dk ? 'bg-gray-700/60' : 'bg-gray-50'}`}>
            <Badge label={req.status}   color={STATUS_CLR[req.status]} />
            <Badge label={req.priority} color={PRIORITY_CLR[req.priority]} />
            <Badge label={req.category} color="#6366f1" />
            <span className={`text-xs ml-auto ${sub}`}>🏭 {plant?.name || '—'} · 📅 {formatDate(req.dueDate)}</span>
          </div>

          {/* On behalf of — user selector */}
          <div>
            <label className="block text-xs font-bold uppercase tracking-wide mb-1.5" style={{ color: 'var(--p600)' }}>
              👤 Acting On Behalf Of
            </label>
            <select
              value={selUserId}
              onChange={e => setSelUserId(e.target.value)}
              className={selectCls}
            >
              <option value="">— Admin (no specific user) —</option>
              {assignees.length > 0 && (
                <optgroup label="Assigned Users">
                  {assignees.map(u => <option key={u.id} value={u.id}>{u.name} ({u.email}) — {u.role === 'plant_head' ? 'Plant Head' : 'Team Member'}</option>)}
                </optgroup>
              )}
              {allUsers.filter(u => !assignedIds.includes(u.id)).length > 0 && (
                <optgroup label="Other Users">
                  {allUsers.filter(u => !assignedIds.includes(u.id)).map(u => <option key={u.id} value={u.id}>{u.name} ({u.email})</option>)}
                </optgroup>
              )}
            </select>
            {selUserId && (
              <p className={`text-xs mt-1.5 flex items-center gap-1.5 ${sub}`}>
                <span className="inline-block w-4 h-4 rounded-full flex-shrink-0 text-white text-center leading-4 text-xs" style={{ background: 'var(--p600)', fontSize: '9px' }}>
                  {initials(users.find(u => u.id === selUserId)?.name || '?')}
                </span>
                Actions will be attributed to <strong className={dk ? 'text-gray-200' : 'text-gray-800'}>{users.find(u => u.id === selUserId)?.name}</strong> with an admin override note.
              </p>
            )}
          </div>

          {/* Tab strip */}
          <div className="flex gap-1 p-1 rounded-xl w-fit" style={{ background: dk ? '#374151' : '#f3f4f6' }}>
            {[['status', '⚡ Change Status'], ['evidence', '📎 Upload Evidence']].map(([id, label]) => (
              <button key={id} onClick={() => setTab(id)}
                className={`px-4 py-1.5 rounded-lg text-sm font-semibold transition-all ${tab === id ? (dk ? 'bg-gray-600 text-white shadow' : 'bg-white shadow') : (dk ? 'text-gray-400' : 'text-gray-500')}`}>
                {label}{id === 'evidence' && (req.evidence || []).length > 0 ? ` (${(req.evidence || []).length})` : ''}
              </button>
            ))}
          </div>

          {/* ── TAB: Change Status ── */}
          {tab === 'status' && (
            <div className="space-y-4">
              <div>
                <label className="block text-xs font-bold uppercase tracking-wide mb-2" style={{ color: 'var(--p600)' }}>New Status</label>
                <div className="grid grid-cols-2 gap-2">
                  {STATUSES.map(s => (
                    <button key={s} onClick={() => setNewStatus(s)}
                      className={`flex items-center gap-3 px-4 py-3 rounded-xl border-2 transition-all text-sm font-semibold ${newStatus === s ? 'border-[color:var(--p500)] shadow-md' : dk ? 'border-gray-600 hover:border-gray-500' : 'border-gray-200 hover:border-gray-300'}`}
                      style={newStatus === s ? { background: STATUS_CLR[s] + '18' } : {}}>
                      <span className="w-3 h-3 rounded-full flex-shrink-0" style={{ background: STATUS_CLR[s] }} />
                      <span style={{ color: newStatus === s ? STATUS_CLR[s] : undefined }}>{s}</span>
                      {req.status === s && <span className={`ml-auto text-xs font-normal ${sub}`}>current</span>}
                    </button>
                  ))}
                </div>
              </div>
              {statusMsg && (
                <div className={`px-4 py-3 rounded-xl text-sm font-medium flex items-center gap-2 ${statusMsg.type === 'error' ? 'bg-red-50 text-red-600 dark:bg-red-900/30 dark:text-red-400' : 'bg-green-50 text-green-700 dark:bg-green-900/30 dark:text-green-400'}`}>
                  {statusMsg.text}
                </div>
              )}
              <button
                onClick={handleStatusChange}
                disabled={newStatus === req.status}
                className="w-full py-3 rounded-xl text-white font-semibold text-sm transition-colors disabled:opacity-40"
                style={{ background: 'var(--p600)' }}>
                ⚡ Apply Status Change{selUserId ? ` (as ${users.find(u => u.id === selUserId)?.name?.split(' ')[0]})` : ' (as Admin)'}
              </button>
              <p className={`text-xs ${sub}`}>
                This will update the status, add an audit comment, set a completion date (if Completed), and send a notification email.
              </p>
            </div>
          )}

          {/* ── TAB: Upload Evidence ── */}
          {tab === 'evidence' && (
            <div className="space-y-4">
              {/* Existing evidence */}
              {(req.evidence || []).length > 0 && (
                <div>
                  <p className={`text-xs font-bold uppercase tracking-wide mb-2 ${sub}`}>📎 Existing Evidence ({(req.evidence || []).length})</p>
                  {(req.evidence || []).map(ev => {
                    const fileUrl = ev.storageUrl || ev.dataUrl;
                    const isImage = (ev.mimeType || '').startsWith('image/');
                    const isPdf   = ev.name?.toLowerCase().endsWith('.pdf');
                    const fileIcon = isImage ? '🖼️' : isPdf ? '📑' : '📄';
                    const uploader = users.find(u => u.id === ev.uploadedBy);
                    return (
                      <div key={ev.id} className={`rounded-xl border mb-2 overflow-hidden ${dk ? 'border-gray-600 bg-gray-700/50' : 'border-gray-200 bg-gray-50'}`}>
                        <div className="flex items-center gap-3 p-3">
                          <span className="text-xl flex-shrink-0">{fileIcon}</span>
                          <div className="flex-1 min-w-0">
                            <p className={`text-sm font-medium truncate ${dk ? 'text-gray-100' : 'text-gray-800'}`}>{ev.name}</p>
                            <p className={`text-xs ${sub}`}>
                              {ev.size} · {formatDate(ev.uploadedAt)}
                              {ev.uploadedByAdmin && <span className="ml-1.5 px-1.5 py-0.5 rounded text-xs font-semibold" style={{ background: 'var(--p100)', color: 'var(--p700)' }}>Admin Upload</span>}
                              {ev.onBehalfOfName && <span className={`ml-1 text-xs ${sub}`}>· on behalf of {ev.onBehalfOfName}</span>}
                              {!ev.uploadedByAdmin && uploader && <span className={`ml-1 text-xs ${sub}`}>· by {uploader.name}</span>}
                            </p>
                          </div>
                          <div className="flex items-center gap-1.5 flex-shrink-0">
                            {fileUrl && (
                              <button onClick={() => window.open(fileUrl, '_blank')}
                                className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors ${dk ? 'bg-gray-600 hover:bg-gray-500 text-gray-100' : 'bg-gray-200 hover:bg-gray-300 text-gray-700'}`}>
                                👁️
                              </button>
                            )}
                            <button onClick={() => handleDeleteEvidence(ev.id)}
                              className={`px-2.5 py-1.5 rounded-lg text-xs font-semibold transition-colors ${dk ? 'bg-red-900/40 hover:bg-red-800/60 text-red-400' : 'bg-red-50 hover:bg-red-100 text-red-500'}`}>
                              🗑️
                            </button>
                          </div>
                        </div>
                        {isImage && fileUrl && (
                          <div className="px-3 pb-3">
                            <img src={fileUrl} alt={ev.name} className="w-full max-h-40 object-contain rounded-lg border" style={{ background: dk ? '#111827' : '#f9fafb' }} />
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}

              {/* Upload zone */}
              <div>
                <p className={`text-xs font-bold uppercase tracking-wide mb-2 ${sub}`}>⬆️ Upload New Evidence</p>
                <input type="file" ref={fileRef} className="hidden"
                  onChange={e => { if (e.target.files[0]) handleEvidenceUpload(e.target.files[0]); }} />
                <button
                  onClick={() => fileRef.current.click()}
                  disabled={uploading}
                  className={`w-full py-6 rounded-xl border-2 border-dashed text-sm font-medium transition-colors ${uploading ? 'opacity-60 cursor-not-allowed' : ''} ${dk ? 'border-gray-600 text-gray-300 hover:border-[color:var(--p400)] hover:text-[color:var(--p400)]' : 'border-gray-300 text-gray-500 hover:border-[color:var(--p400)] hover:text-[color:var(--p600)]'}`}>
                  {uploading ? (
                    <span className="flex items-center justify-center gap-2">
                      <span className="w-4 h-4 border-2 border-current border-t-transparent rounded-full animate-spin inline-block" />
                      Uploading…
                    </span>
                  ) : (
