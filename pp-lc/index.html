                    <span className="flex flex-col items-center gap-2">
                      <span className="text-3xl">📎</span>
                      <span>Click to attach evidence file</span>
                      <span className={`text-xs ${sub}`}>PDF, images, or any document</span>
                    </span>
                  )}
                </button>
              </div>

              {uploadMsg && (
                <div className={`px-4 py-3 rounded-xl text-sm font-medium flex items-center gap-2 ${uploadMsg.type === 'error' ? 'bg-red-50 text-red-600 dark:bg-red-900/30 dark:text-red-400' : 'bg-green-50 text-green-700 dark:bg-green-900/30 dark:text-green-400'}`}>
                  {uploadMsg.text}
                </div>
              )}
              <p className={`text-xs ${sub}`}>
                Evidence is uploaded to Firebase Storage for cross-device access. An audit comment is automatically added to the requirement.
              </p>
            </div>
          )}
        </div>

        {/* Footer */}
        <div className={`px-6 py-4 border-t flex justify-end gap-3 ${dk ? 'border-gray-700' : 'border-gray-100'}`}>
          <button onClick={onClose} className={`px-5 py-2.5 rounded-xl border text-sm font-medium transition-colors ${dk ? 'border-gray-600 text-gray-300 hover:bg-gray-700' : 'border-gray-200 text-gray-700 hover:bg-gray-50'}`}>
            Done
          </button>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════
   ADMIN – REQUIREMENTS
═══════════════════════════════════════════ */
function AdminRequirements({ dk, plants, users, requirements, updateRequirements, categories: catsProp, openReqId, editMode, onNotifReqOpened }) {
  const cats = catsProp || CATEGORIES;
  const [filters,      setFilters]      = useState({ plant:'', status:'', priority:'', search:'' });
  const [showAdd,      setShowAdd]      = useState(false);
  const [editReq,      setEditReq]      = useState(null);
  const [viewReq,      setViewReq]      = useState(null);
  const [delId,        setDelId]        = useState(null);
  /* ── Bulk selection state ── */
  const [selected,     setSelected]     = useState(new Set()); // Set of req IDs
  const [bulkConfirm,  setBulkConfirm]  = useState(false);
  const [onBehalfReq,  setOnBehalfReq]  = useState(null); // Admin on-behalf modal

  const set = (k,v) => { setFilters(f=>({...f,[k]:v})); setSelected(new Set()); };

  const downloadEvidence = (ev) => {
    const url = ev.storageUrl || ev.dataUrl;
    if (!url) {
      alert('File not available. Please ask the user to re-upload.');
      return;
    }
    if (ev.storageUrl) {
      window.open(ev.storageUrl, '_blank');
      return;
    }
    const a = document.createElement('a');
    a.href = ev.dataUrl;
    a.download = ev.name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  };

  // Auto-open requirement when triggered from notification bell or overview drill-down Edit
  React.useEffect(() => {
    if (openReqId) {
      const req = requirements.find(r => r.id === openReqId);
      if (req) {
        if (editMode) { setEditReq(req); }
        else          { setViewReq(req); }
        if (onNotifReqOpened) onNotifReqOpened();
      }
    }
  }, [openReqId]);

  const filtered = requirements.filter(r => {
    if (filters.plant    && r.plantId  !== filters.plant)    return false;
    if (filters.status   && r.status   !== filters.status)   return false;
    if (filters.priority && r.priority !== filters.priority) return false;
    if (filters.search   && !r.title.toLowerCase().includes(filters.search.toLowerCase())) return false;
    return true;
  });

  /* ── Checkbox helpers ── */
  const filteredIds   = filtered.map(r => r.id);
  const allChecked    = filteredIds.length > 0 && filteredIds.every(id => selected.has(id));
  const someChecked   = filteredIds.some(id => selected.has(id)) && !allChecked;

  const toggleAll = () => {
    if (allChecked) {
      // Deselect all visible
      setSelected(prev => { const s = new Set(prev); filteredIds.forEach(id => s.delete(id)); return s; });
    } else {
      // Select all visible
      setSelected(prev => { const s = new Set(prev); filteredIds.forEach(id => s.add(id)); return s; });
    }
  };

  const toggleOne = (id) => {
    setSelected(prev => {
      const s = new Set(prev);
      s.has(id) ? s.delete(id) : s.add(id);
      return s;
    });
  };

  /* ── CRUD ── */
  const addReq = form => {
    const plantIdsList = (form.plantIds && form.plantIds.length > 0) ? form.plantIds : (form.plantId ? [form.plantId] : []);
    const now = new Date().toISOString();
    const newReqs = plantIdsList.map((pid, idx) => ({
      ...form,
      id: `r${Date.now()}${idx}`,
      plantId: pid,
      plantIds: plantIdsList,
      createdAt: now,
      evidence: [],
      comments: []
    }));
    updateRequirements([...newReqs, ...requirements]);
    // ── Email per plant ──
    newReqs.forEach(newR => {
      const plant    = plants.find(p => p.id === newR.plantId);
      const assignedIds = Array.isArray(newR.assignedTo) ? newR.assignedTo : (newR.assignedTo ? [newR.assignedTo] : []);
      const assignees = assignedIds.map(id=>users.find(u=>u.id===id)).filter(Boolean);
      sendComplianceMail({ trigger:'new_requirement', req:newR, plant, assignee:assignees[0]||null, changedBy:null });
      assignees.forEach(assignee => {
        sendComplianceMail({ trigger:'new_assignment', req:newR, plant, assignee, changedBy:null });
      });
    });
  };

  const saveEdit = form => {
    const old = requirements.find(r => r.id === editReq.id);
    const updated = { ...old, ...form };
    updateRequirements(requirements.map(r => r.id === editReq.id ? updated : r));
    if (!old) return;
    const plant = plants.find(p => p.id === updated.plantId);
    const newIds = Array.isArray(updated.assignedTo) ? updated.assignedTo : (updated.assignedTo ? [updated.assignedTo] : []);
    const oldIds = Array.isArray(old.assignedTo) ? old.assignedTo : (old.assignedTo ? [old.assignedTo] : []);
    // ── Status changed ──
    if (old.status !== updated.status) {
      const primaryAssignee = users.find(u=>u.id===newIds[0]);
      sendComplianceMail({ trigger:'status_change', req:updated, plant, assignee:primaryAssignee||null, oldStatus:old.status, changedBy:null });
    }
    // ── Assignment changed ──
    const added   = newIds.filter(id=>!oldIds.includes(id));
    const removed = oldIds.filter(id=>!newIds.includes(id));
    added.forEach(id => {
      const assignee = users.find(u=>u.id===id);
      if (assignee) sendComplianceMail({ trigger:'new_assignment', req:updated, plant, assignee, changedBy:null });
    });
    removed.forEach(id => {
      const oldAssignee = users.find(u=>u.id===id);
      const primaryAssignee = users.find(u=>u.id===newIds[0]);
      if (oldAssignee) sendComplianceMail({ trigger:'reassignment', req:updated, plant, assignee:primaryAssignee||null, oldAssignee, changedBy:null });
    });
  };

  /* ── Delete evidence files from Firebase Storage for a requirement ── */
  /* ── Delete all Storage files for a requirement (called on req deletion) ── */
  const deleteReqStorageFiles = async (req) => {
    if (!window.fbStorage || !req) return;
    await fbEnsureAuth();
    const evidenceList = req.evidence || [];
    for (const ev of evidenceList) {
      if (!ev.storageUrl) continue; // base64-only, nothing in Storage
      try {
        const path = `evidence/${req.id}/${ev.id}_${ev.name}`;
        await window.fbStorage.ref(path).delete();
        console.log('🗑️ Deleted from Firebase Storage:', path);
      } catch(e) {
        console.warn('Storage delete failed (may already be gone):', e.message);
        // Try alternate path
        try { await window.fbStorage.ref(`evidence/${req.id}/${ev.id}`).delete(); } catch(_) {}
      }
    }
    // Note: Firestore document entry is removed by updateRequirements() caller
  };

  const confirmDel = () => {
    const req = requirements.find(r => r.id === delId);
    updateRequirements(requirements.filter(r => r.id !== delId));
    setDelId(null);
    // Delete associated Firebase Storage files asynchronously
    if (req) deleteReqStorageFiles(req);
  };

  /* ── Bulk delete ── */
  const confirmBulkDelete = () => {
    const toDelete = requirements.filter(r => selected.has(r.id));
    updateRequirements(requirements.filter(r => !selected.has(r.id)));
    setSelected(new Set());
    setBulkConfirm(false);
    // Delete associated Firebase Storage files for each deleted requirement
    toDelete.forEach(req => deleteReqStorageFiles(req));
  };

  const card = `rounded-2xl border shadow-sm ${dk?'bg-gray-800 border-gray-700':'bg-white border-gray-200'}`;
  const sub  = dk?'text-gray-400':'text-gray-500';

  return (
    <div className="space-y-5">

      {/* Admin On-Behalf Modal */}
      {onBehalfReq && (
        <AdminOnBehalfModal
          dk={dk}
          req={onBehalfReq}
          requirements={requirements}
          users={users}
          plants={plants}
          updateRequirements={updateRequirements}
          onClose={()=>setOnBehalfReq(null)}
        />
      )}

      {/* Single delete confirm */}
      <ConfirmModal open={!!delId} message="Delete this requirement permanently?" onConfirm={confirmDel} onCancel={()=>setDelId(null)} />

      {/* Bulk delete confirm */}
      {bulkConfirm && (
        <div className="fixed inset-0 z-[60] flex items-center justify-center p-4"
          style={{backdropFilter:'blur(4px)',background:'rgba(0,0,0,0.6)'}}>
          <div className={`rounded-2xl shadow-2xl w-full max-w-sm p-6 ${dk?'bg-gray-800':'bg-white'}`}>
            <div className="text-center mb-5">
              <div className="w-14 h-14 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl">🗑️</div>
              <h3 className={`font-bold text-lg mb-1 ${dk?'text-white':'text-gray-900'}`}>Bulk Delete {selected.size} Requirement{selected.size>1?'s':''}</h3>
              <p className={`text-sm ${sub}`}>This will permanently delete <strong>{selected.size}</strong> selected requirement{selected.size>1?'s':''}. This action cannot be undone.</p>
            </div>
            {/* Preview list — max 5 shown */}
            <div className={`rounded-xl p-3 mb-5 max-h-36 overflow-y-auto text-xs space-y-1 ${dk?'bg-gray-700':'bg-red-50'}`}>
              {[...selected].slice(0,5).map(id => {
                const r = requirements.find(x=>x.id===id);
                return r ? (
                  <div key={id} className="flex items-center gap-2">
                    <span className="text-red-500">✕</span>
                    <span className={dk?'text-gray-200':'text-gray-700'}>{r.title}</span>
                    <span className={`ml-auto ${sub}`}>{plants.find(p=>p.id===r.plantId)?.name||'—'}</span>
                  </div>
                ) : null;
              })}
              {selected.size > 5 && <p className={`text-center ${sub} pt-1`}>…and {selected.size-5} more</p>}
            </div>
            <div className="flex gap-3">
              <button onClick={()=>setBulkConfirm(false)}
                className={`flex-1 py-2.5 rounded-xl border text-sm font-medium transition-colors ${dk?'border-gray-600 text-gray-300 hover:bg-gray-700':'border-gray-200 text-gray-700 hover:bg-gray-50'}`}>
                Cancel
              </button>
              <button onClick={confirmBulkDelete}
                className="flex-1 py-2.5 rounded-xl bg-red-600 text-white text-sm font-bold hover:bg-red-700 transition-colors">
                Delete {selected.size} Item{selected.size>1?'s':''}
              </button>
            </div>
          </div>
        </div>
      )}

      <RequirementModal open={showAdd} onClose={()=>setShowAdd(false)} onSave={addReq} plants={plants} users={users} dk={dk} categories={cats} />
      <RequirementModal open={!!editReq} onClose={()=>setEditReq(null)} onSave={saveEdit} initial={editReq} plants={plants} users={users} dk={dk} categories={cats} />

      <Modal open={!!viewReq} onClose={()=>setViewReq(null)} title="Requirement Details" wide dk={dk}>
        {viewReq && (() => {
          const plant    = plants.find(p=>p.id===viewReq.plantId);
          const assignedIds = Array.isArray(viewReq.assignedTo) ? viewReq.assignedTo : (viewReq.assignedTo ? [viewReq.assignedTo] : []);
          const assignees = assignedIds.map(id=>users.find(u=>u.id===id)).filter(Boolean);
          const assigneeStr = assignees.length > 0 ? assignees.map(a=>`${a.name} (${a.email})`).join(', ') : 'Unassigned';
          return (
            <div className="space-y-4 text-sm">
              <div className="flex flex-wrap gap-2">
                <Badge label={viewReq.status}   color={STATUS_CLR[viewReq.status]} />
                <Badge label={viewReq.priority} color={PRIORITY_CLR[viewReq.priority]} />
                <Badge label={viewReq.category} color="#6366f1" />
                <Badge label={`L${viewReq.escalationLevel} Escalation`} color="#8b5cf6" />
              </div>
              <p className={`leading-relaxed ${dk?'text-gray-300':'text-gray-700'}`}>{viewReq.description}</p>
              <div className="grid grid-cols-2 gap-4">
                {[['Plant',plant?.name],['State',plant?.state],['Assigned To',assigneeStr],['Due Date',formatDate(viewReq.dueDate)],['Completion Date',viewReq.completionDate?formatDate(viewReq.completionDate):'—'],['Reminder',viewReq.reminderFrequency]].map(([l,v])=>(
                  <div key={l} className={`p-3 rounded-xl ${dk?'bg-gray-700':'bg-gray-50'}`}>
                    <p className={`text-xs uppercase tracking-wide font-semibold mb-0.5 ${sub}`}>{l}</p>
                    <p className={`font-medium ${dk?'text-white':'text-gray-800'}`}>{v||'—'}</p>
                  </div>
                ))}
              </div>

              {/* ── Escalation Email Notifications ── */}
              {(() => {
                const escEmails = viewReq.escalationEmails && typeof viewReq.escalationEmails === 'object'
                  ? viewReq.escalationEmails
                  : (viewReq.escalationEmail ? { 1:[viewReq.escalationEmail], 2:[], 3:[] } : { 1:[], 2:[], 3:[] });
                const hasAny = [1,2,3].some(l => (escEmails[l]||[]).length > 0);
                const levelColors = { 1:'#22c55e', 2:'#f59e0b', 3:'#ef4444' };
                const levelLabels = { 1:'Level 1 – Plant Head', 2:'Level 2 – Regional Manager', 3:'Level 3 – Top Management' };
                if (!hasAny) return null;
                return (
                  <div className={`rounded-xl border p-4 space-y-3 ${dk?'bg-purple-900/20 border-purple-700/40':'bg-purple-50 border-purple-200'}`}>
                    <p className="text-xs font-bold uppercase tracking-widest text-purple-500 flex items-center gap-1.5">📧 Escalation Email Notifications</p>
                    {[1,2,3].map(level => {
                      const emails = escEmails[level] || [];
                      if (!emails.length) return null;
                      return (
                        <div key={level}>
                          <div className="flex items-center gap-1.5 mb-1">
                            <span className="w-4 h-4 rounded-full flex items-center justify-center text-white text-xs font-bold" style={{background:levelColors[level]}}>{level}</span>
                            <p className="text-xs font-semibold" style={{color:levelColors[level]}}>{levelLabels[level]}</p>
                          </div>
                          <div className="flex flex-wrap gap-1.5">
                            {emails.map(e=>(
                              <span key={e} className={`inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs border ${dk?'bg-gray-700 border-gray-600 text-gray-200':'bg-white border-gray-300 text-gray-700'}`}>✉️ {e}</span>
                            ))}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                );
              })()}

              {/* ── Legal & Regulatory Section ── */}
              {(viewReq.applicableRule || viewReq.legalClause) && (
                <div className={`rounded-xl border p-4 space-y-3 ${dk?'border-gray-700':'border-gray-200'}`}>
                  <p className="text-xs font-bold uppercase tracking-widest text-[color:var(--p500)] flex items-center gap-1.5">⚖️ Legal &amp; Regulatory</p>
                  {viewReq.applicableRule && (
                    <div>
                      <p className={`text-xs uppercase tracking-wide font-semibold mb-0.5 ${dk?'text-[color:var(--p300)]':'text-[color:var(--p600)]'}`}>Applicable Rule / Regulation</p>
                      <p className={`text-sm font-medium ${dk?'text-white':'text-gray-800'}`}>{viewReq.applicableRule}</p>
                    </div>
                  )}
                  {viewReq.legalClause && (
                    <div>
                      <p className={`text-xs uppercase tracking-wide font-semibold mb-0.5 ${dk?'text-[color:var(--p300)]':'text-[color:var(--p600)]'}`}>Legal Clause / Provision</p>
                      <p className={`text-sm leading-relaxed ${dk?'text-gray-200':'text-gray-700'}`}>{viewReq.legalClause}</p>
                    </div>
                  )}
                </div>
              )}
              {viewReq.evidence?.length > 0 && (
                <div>
                  <p className={`font-semibold mb-2 ${dk?'text-white':'text-gray-800'}`}>📎 Evidence</p>
                  {viewReq.evidence.map(e=>{
                    const fileUrl = e.storageUrl || e.dataUrl;
                    const isImage = fileUrl && (e.mimeType||'').startsWith('image/');
                    const isPdf   = fileUrl && (e.mimeType==='application/pdf' || e.name.toLowerCase().endsWith('.pdf'));
                    const canPreview = isImage || isPdf;
                    const fileIcon = isImage ? '🖼️' : isPdf ? '📑' : '📄';
                    return (
                      <div key={e.id} className={`mb-2 rounded-xl overflow-hidden border ${dk?'border-gray-600 bg-gray-700':'border-gray-200 bg-gray-50'}`}>
                        <div className="flex items-center gap-3 p-3">
                          <span className="text-xl flex-shrink-0">{fileIcon}</span>
                          <div className="flex-1 min-w-0">
                            <p className={`text-sm font-medium ${dk?'text-gray-100':'text-gray-800'}`}>{e.name}</p>
                            <p className={`text-xs ${dk?'text-gray-400':'text-gray-500'}`}>{e.size} · {formatDate(e.uploadedAt)}</p>
                          </div>
                          <div className="flex items-center gap-1.5 flex-shrink-0">
                            {canPreview && (
                              <button onClick={()=>{ window.open(fileUrl, '_blank'); }}
                                className={`flex items-center gap-1 px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors ${dk?'bg-gray-600 hover:bg-gray-500 text-gray-100':'bg-gray-200 hover:bg-gray-300 text-gray-700'}`}
                                title={`View ${e.name}`}>
                                👁️ View
                              </button>
                            )}
                            <button onClick={()=>downloadEvidence(e)}
                              className={`flex items-center gap-1 px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors ${dk?'text-white':'text-white'}`} style={{background:'var(--p600)'}}
                              title={`Download ${e.name}`}>
                              ⬇️ Download
                            </button>
                          </div>
                        </div>
                        {isImage && fileUrl && (
                          <div className="px-3 pb-3">
                            <img src={fileUrl} alt={e.name} className="w-full max-h-48 object-contain rounded-lg border" style={{background: dk?'#111827':'#f9fafb'}} />
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          );
        })()}
      </Modal>

      {/* ── Filter bar ── */}
      <div className={`${card} p-4`}>
        <div className="flex flex-wrap gap-3 items-center">
          <input value={filters.search} onChange={e=>set('search',e.target.value)} placeholder="🔍 Search requirements…"
            className={`${inputCls} max-w-xs`} />
          <select value={filters.plant} onChange={e=>set('plant',e.target.value)} className={`${selectCls} w-44`}>
            <option value="">All Plants</option>
            {plants.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
          </select>
          <select value={filters.status} onChange={e=>set('status',e.target.value)} className={`${selectCls} w-36`}>
            <option value="">All Status</option>
            {STATUSES.map(s=><option key={s}>{s}</option>)}
          </select>
          <select value={filters.priority} onChange={e=>set('priority',e.target.value)} className={`${selectCls} w-36`}>
            <option value="">All Priority</option>
            {PRIORITIES.map(p=><option key={p}>{p}</option>)}
          </select>
          <button onClick={()=>setShowAdd(true)}
            className="ml-auto px-4 py-2.5 text-white rounded-xl text-sm font-semibold transition-colors flex items-center gap-2" style={{background:"var(--p600)"}}>
            <span>+</span> Add Requirement
          </button>
        </div>
        <div className="flex items-center justify-between mt-2">
          <p className={`text-xs ${sub}`}>Showing {filtered.length} of {requirements.length} requirements</p>
          {selected.size > 0 && (
            <p className="text-xs font-semibold text-[color:var(--p500)]">{selected.size} selected</p>
          )}
        </div>
      </div>

      {/* ── Bulk action bar — appears when items are selected ── */}
      {selected.size > 0 && (
        <div className={`flex items-center justify-between px-4 py-3 rounded-2xl border ${dk?'bg-red-900/20 border-red-700/40':'bg-red-50 border-red-200'}`}>
          <div className="flex items-center gap-3">
            <div className="w-8 h-8 rounded-full bg-red-100 flex items-center justify-center text-red-600 font-bold text-sm">
              {selected.size}
            </div>
            <div>
              <p className={`text-sm font-semibold ${dk?'text-red-300':'text-red-700'}`}>
                {selected.size} requirement{selected.size>1?'s':''} selected
              </p>
              <p className={`text-xs ${sub}`}>
                {filteredIds.every(id=>selected.has(id)) && selected.size === filteredIds.length
                  ? 'All visible requirements selected'
                  : `${filteredIds.filter(id=>selected.has(id)).length} of ${filtered.length} visible`}
              </p>
            </div>
          </div>
          <div className="flex items-center gap-2">
            <button onClick={()=>setSelected(new Set())}
              className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors ${dk?'text-gray-300 hover:bg-gray-700':'text-gray-600 hover:bg-gray-100'}`}>
              Clear selection
            </button>
            <button onClick={()=>setBulkConfirm(true)}
              className="px-4 py-1.5 rounded-lg bg-red-600 text-white text-xs font-bold hover:bg-red-700 transition-colors flex items-center gap-1.5">
              🗑️ Delete {selected.size} Selected
            </button>
          </div>
        </div>
      )}

      {/* ── Table ── */}
      <div className={`${card} overflow-hidden`}>
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead>
              <tr className={`text-xs uppercase tracking-wide font-semibold ${dk?'bg-gray-700/60 text-gray-400':'bg-gray-50 text-gray-500'}`}>
                {/* Select-all checkbox column */}
                <th className="pl-4 pr-2 py-3 w-10">
                  <input
                    type="checkbox"
                    checked={allChecked}
                    ref={el => { if (el) el.indeterminate = someChecked; }}
                    onChange={toggleAll}
                    className="w-4 h-4 rounded cursor-pointer" style={{accentColor:"var(--p600)"}}
                    title={allChecked ? 'Deselect all' : 'Select all visible'}
                  />
                </th>
                {['Requirement','Plant','Category','Assigned To','Priority','Status','Due Date','Actions'].map(h=>(
                  <th key={h} className="text-left px-4 py-3 whitespace-nowrap">{h}</th>
                ))}
              </tr>
            </thead>
            <tbody className={`divide-y ${dk?'divide-gray-700':'divide-gray-100'}`}>
              {filtered.length === 0 && (
                <tr><td colSpan={9} className="text-center py-12 text-gray-400">No requirements found</td></tr>
              )}
              {filtered.map(req => {
                const plant    = plants.find(p=>p.id===req.plantId);
                const assignedIds = Array.isArray(req.assignedTo) ? req.assignedTo : (req.assignedTo ? [req.assignedTo] : []);
                const assignees = assignedIds.map(id=>users.find(u=>u.id===id)).filter(Boolean);
                const dl       = daysLeft(req.dueDate);
                const isSelected = selected.has(req.id);
                return (
                  <tr key={req.id}
                    className={`transition-colors ${isSelected
                      ? dk?'bg-red-900/20':'bg-red-50'
                      : dk?'hover:bg-gray-700/50':'hover:bg-slate-50'}`}>
                    {/* Row checkbox */}
                    <td className="pl-4 pr-2 py-3">
                      <input
                        type="checkbox"
                        checked={isSelected}
                        onChange={()=>toggleOne(req.id)}
                        className="w-4 h-4 rounded cursor-pointer" style={{accentColor:"var(--p600)"}}
                      />
                    </td>
                    <td className="px-4 py-3">
                      <p className="font-medium max-w-[200px] truncate" title={req.title}>{req.title}</p>
                      <div className="flex items-center gap-2 flex-wrap">
                        {req.evidence?.length>0 && <span className={`text-xs ${sub}`}>📎 {req.evidence.length} file(s)</span>}
                        {req.applicableRule && <span className="text-xs text-[color:var(--p500)] font-medium" title={req.applicableRule}>⚖️ Rule</span>}
                      </div>
                    </td>
                    <td className={`px-4 py-3 whitespace-nowrap ${sub}`}>{plant?.name}</td>
                    <td className={`px-4 py-3 whitespace-nowrap ${sub}`}>{req.category}</td>
                    <td className="px-4 py-3">
                      {assignees.length > 0 ? (
                        <div className="flex items-center gap-1 flex-wrap">
                          {assignees.slice(0,3).map(a=>(
                            <div key={a.id} className="flex items-center gap-1" title={a.name}>
                              <div className="w-6 h-6 rounded-full flex items-center justify-center text-white text-xs flex-shrink-0" style={{background:"var(--p600)"}}>{initials(a.name)}</div>
                              {assignees.length === 1 && <span className={`text-xs ${sub} truncate max-w-[80px]`}>{a.name}</span>}
                            </div>
                          ))}
                          {assignees.length > 3 && <span className={`text-xs font-semibold ${sub}`}>+{assignees.length-3}</span>}
                          {assignees.length > 1 && <span className={`text-xs ${sub}`}>{assignees.length} users</span>}
                        </div>
                      ) : <span className="text-xs text-red-400">Unassigned</span>}
                    </td>
                    <td className="px-4 py-3"><Badge label={req.priority} color={PRIORITY_CLR[req.priority]} /></td>
                    <td className="px-4 py-3"><Badge label={req.status}   color={STATUS_CLR[req.status]} /></td>
                    <td className="px-4 py-3 whitespace-nowrap">
                      <p className={`text-xs ${dl<0?'text-red-500':dl<7?'text-amber-500':sub}`}>{formatDate(req.dueDate)}</p>
                      {dl<0 && <p className="text-xs text-red-400">{Math.abs(dl)}d overdue</p>}
                    </td>
                    <td className="px-4 py-3">
                      <div className="flex items-center gap-1">
                        <button onClick={()=>setViewReq(req)} className={`p-1.5 rounded-lg text-xs hover:bg-gray-100 hover:text-gray-600 transition-colors ${sub}`} title="View">👁️</button>
                        <button onClick={()=>setEditReq(req)} className={`p-1.5 rounded-lg text-xs hover:bg-amber-100 hover:text-amber-600 transition-colors ${sub}`} title="Edit">✏️</button>
                        <button onClick={()=>setOnBehalfReq(req)} className={`p-1.5 rounded-lg text-xs hover:bg-purple-100 hover:text-purple-600 transition-colors ${sub}`} title="Admin: Upload Evidence / Change Status on behalf of user">🛡️</button>
                        <button onClick={()=>setDelId(req.id)} className={`p-1.5 rounded-lg text-xs hover:bg-red-100 hover:text-red-600 transition-colors ${sub}`} title="Delete">🗑️</button>
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════
   ADMIN – USERS
═══════════════════════════════════════════ */
function AdminUsers({ dk, plants, users, updateUsers }) {
  const [showAdd, setShowAdd] = useState(false);
  const [editU,   setEditU]   = useState(null);
  const [delId,   setDelId]   = useState(null);
  const [search,  setSearch]  = useState('');

  const blank = { name:'', email:'', password:'', role:'user', plantId:'', dept:'', phone:'' };
  const [form, setForm] = useState(blank);
  const [saving, setSaving] = useState(false);

  const openAdd = () => { setForm(blank); setShowAdd(true); };
  const openEdit= u  => { setForm({...u}); setEditU(u); setShowAdd(true); };
  const set     = (k,v) => setForm(f=>({...f,[k]:v}));

  const save = async () => {
    if (!form.name||!form.email||!form.password) return;
    setSaving(true);
    await new Promise(r=>setTimeout(r,400));
    if (editU) { updateUsers(users.map(u=>u.id===editU.id?{...u,...form}:u)); }
    else       { updateUsers([...users, {...form, id:`u${Date.now()}`}]); }
    setSaving(false); setShowAdd(false); setEditU(null);
  };
  const confirmDel = () => { updateUsers(users.filter(u=>u.id!==delId)); setDelId(null); };

  const filtered = users.filter(u=>u.id!=='__dev__'&&(u.name.toLowerCase().includes(search.toLowerCase())||u.email.toLowerCase().includes(search.toLowerCase())));
  const card = `rounded-2xl border shadow-sm ${dk?'bg-gray-800 border-gray-700':'bg-white border-gray-200'}`;
  const sub  = dk?'text-gray-400':'text-gray-500';
  const roleBg = { admin:'t-badge-admin', top_management:'bg-purple-100 text-purple-700', plant_head:'bg-teal-100 text-teal-700', user:'bg-green-100 text-green-700' };

  return (
    <div className="space-y-5">
      <ConfirmModal open={!!delId} message="Delete this user account?" onConfirm={confirmDel} onCancel={()=>setDelId(null)} />

      <Modal open={showAdd} onClose={()=>{setShowAdd(false);setEditU(null);}} title={editU?'Edit User':'Add New User'}>
        <div className="space-y-4">
          <div className="grid grid-cols-2 gap-4">
            <FormField label="Full Name" required><input value={form.name} onChange={e=>set('name',e.target.value)} placeholder="Full name" className={inputCls} /></FormField>
            <FormField label="Email" required><input type="email" value={form.email} onChange={e=>set('email',e.target.value)} placeholder="email@company.com" className={inputCls} /></FormField>
            <FormField label="Password" required><input type="password" value={form.password} onChange={e=>set('password',e.target.value)} placeholder="Min 8 characters" className={inputCls} /></FormField>
            <FormField label="Phone"><input value={form.phone} onChange={e=>set('phone',e.target.value)} placeholder="+91-XXXXXXXXXX" className={inputCls} /></FormField>
            <FormField label="Role" required>
              <select value={form.role} onChange={e=>set('role',e.target.value)} className={selectCls}>
                <option value="user">Team Member</option>
                <option value="plant_head">Plant Head</option>
                <option value="admin">Admin</option>
              </select>
            </FormField>
            <FormField label="Plant">
              <select value={form.plantId} onChange={e=>set('plantId',e.target.value)} className={selectCls} disabled={form.role==='admin'}>
                <option value="">— None —</option>
                {plants.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
              </select>
            </FormField>
            <div className="col-span-2">
              <FormField label="Department"><input value={form.dept} onChange={e=>set('dept',e.target.value)} placeholder="EHS, Legal, Compliance…" className={inputCls} /></FormField>
            </div>
          </div>
          <div className="flex gap-3 pt-4 border-t border-gray-100 dark:border-gray-700">
            <button onClick={()=>{setShowAdd(false);setEditU(null);}} className={`flex-1 py-2.5 rounded-xl border text-sm font-medium transition-colors ${dk?'border-gray-600 text-gray-300 hover:bg-gray-700':'border-gray-200 text-gray-700 hover:bg-gray-50'}`}>Cancel</button>
            <button onClick={save} disabled={saving||!form.name||!form.email||!form.password}
              className="flex-1 py-2.5 rounded-xl text-white text-sm font-semibold disabled:opacity-50 transition-colors" style={{background:"var(--p600)"}}>
              {saving?'Saving…':editU?'Update User':'Add User'}
            </button>
          </div>
        </div>
      </Modal>

      <div className={`${card} p-4 flex items-center gap-3`}>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Search users…" className={`${inputCls} max-w-xs`} />
        <button onClick={openAdd} className="ml-auto px-4 py-2.5 text-white rounded-xl text-sm font-semibold transition-colors flex items-center gap-2" style={{background:"var(--p600)"}}>
          <span>+</span> Add User
        </button>
      </div>

      <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
        {filtered.map(u=>{
          const plant = plants.find(p=>p.id===u.plantId);
          return (
            <div key={u.id} className={`${card} p-5`}>
              <div className="flex items-start justify-between mb-3">
                <div className="flex items-center gap-3">
                  <div className="w-11 h-11 rounded-xl flex items-center justify-center text-white font-bold" style={{background:"var(--p600)"}}>{initials(u.name)}</div>
                  <div>
                    <p className="font-semibold text-sm">{u.name}</p>
                    <p className={`text-xs ${sub}`}>{u.email}</p>
                  </div>
                </div>
                <span className={`text-xs px-2 py-0.5 rounded-full font-semibold ${roleBg[u.role]}`}>
                  {{admin:'Admin',top_management:'Top Mgmt',plant_head:'Head',user:'Member'}[u.role]}
                </span>
              </div>
              <div className="space-y-1.5 mb-4">
                {[['🏭',plant?.name||'Group Level'],['🏢',u.dept||'—'],['📱',u.phone||'—']].map(([i,v])=>(
                  <p key={i} className={`text-xs ${sub} flex items-center gap-2`}><span>{i}</span>{v}</p>
                ))}
              </div>
              <div className="flex gap-2">
                <button onClick={()=>openEdit(u)} className={`flex-1 py-2 rounded-xl text-xs font-medium border transition-colors ${dk?'border-gray-600 hover:bg-gray-700':'border-gray-200 hover:bg-gray-50'}`}>Edit</button>
                <button onClick={()=>setDelId(u.id)} className="flex-1 py-2 rounded-xl text-xs font-medium bg-red-50 text-red-600 border border-red-100 hover:bg-red-100 transition-colors">Delete</button>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════
   ADMIN – PLANTS  (Add / Edit / Delete + State Mgmt)
═══════════════════════════════════════════ */
function AdminPlants({ dk, plants, updatePlants, currentUser }) {
  const [editing,    setEditing]    = useState(null);
  const [form,       setForm]       = useState({});
  const [showAdd,    setShowAdd]    = useState(false);
  const [addForm,    setAddForm]    = useState({ name:'', state: ALL_IND_STATES[0] });
  const [delId,      setDelId]      = useState(null);
  /* ── State management ── */
  const [activeTab,  setActiveTab]  = useState('plants'); // 'plants' | 'states'
  const [customStates, setCustomStates] = useState(() => {
    try { const s = localStorage.getItem('customStates'); return s ? JSON.parse(s) : []; } catch(_) { return []; }
  });
  const [newState,   setNewState]   = useState('');
  const [editStateIdx, setEditStateIdx] = useState(null);
  const [editStateVal, setEditStateVal] = useState('');
  const [delStateIdx,  setDelStateIdx]  = useState(null);
  const [toast, setToast] = useState(null);

  const allStates = [...ALL_IND_STATES, ...customStates];

  const showToast = (msg, type='success') => { setToast({msg,type}); setTimeout(()=>setToast(null),3000); };

  const saveCustomStates = (arr) => {
    setCustomStates(arr);
    try { localStorage.setItem('customStates', JSON.stringify(arr)); } catch(_) {}
  };

  const startEdit = p => { setEditing(p.id); setForm({ name:p.name, state:p.state }); };
  const saveEdit  = id => {
    if (!form.name.trim()) return;
    const updatedPlant = { ...plants.find(p=>p.id===id), ...form };
    updatePlants(plants.map(p=>p.id===id?updatedPlant:p));
    setEditing(null);
    showToast('Plant updated');
    sendComplianceMail({ trigger:'plant_updated', plant:updatedPlant, req:null, assignee:null, changedBy:currentUser });
  };

  const addPlant = () => {
    if (!addForm.name.trim()) return;
    const newP = { id:`p${Date.now()}`, name:addForm.name.trim(), state:addForm.state, active:true };
    updatePlants([...plants, newP]);
    setAddForm({ name:'', state: ALL_IND_STATES[0] });
    setShowAdd(false);
    showToast(`"${newP.name}" added`);
    sendComplianceMail({ trigger:'plant_added', plant:newP, req:null, assignee:null, changedBy:currentUser });
  };

  const confirmDel = () => {
    const deletedPlant = plants.find(p=>p.id===delId);
    updatePlants(plants.filter(p=>p.id!==delId));
    setDelId(null);
    showToast('Plant deleted');
    if (deletedPlant) sendComplianceMail({ trigger:'plant_deleted', plant:deletedPlant, req:null, assignee:null, changedBy:currentUser });
  };

  /* ── State CRUD ── */
  const addState = () => {
    const t = newState.trim();
    if (!t) return;
    if (allStates.map(s=>s.toLowerCase()).includes(t.toLowerCase())) { showToast('State already exists','error'); return; }
    saveCustomStates([...customStates, t]);
    setNewState('');
    showToast(`"${t}" added`);
  };
  const startEditState = (i) => { setEditStateIdx(i); setEditStateVal(customStates[i]); };
  const saveEditState  = () => {
    const t = editStateVal.trim();
    if (!t) return;
    const updated = customStates.map((s,i)=>i===editStateIdx?t:s);
    saveCustomStates(updated);
    setEditStateIdx(null);
    showToast('State updated');
  };
  const confirmDelState = () => {
    const removed = customStates[delStateIdx];
    saveCustomStates(customStates.filter((_,i)=>i!==delStateIdx));
    setDelStateIdx(null);
    showToast(`"${removed}" deleted`);
  };

  const card = `rounded-2xl border shadow-sm ${dk?'bg-gray-800 border-gray-700':'bg-white border-gray-200'}`;
  const sub  = dk?'text-gray-400':'text-gray-500';

  return (
    <div className="space-y-5">
      <ConfirmModal open={!!delId}
        message={`Delete this plant? All associated requirements will lose their plant reference.`}
        onConfirm={confirmDel} onCancel={()=>setDelId(null)} />
      <ConfirmModal open={delStateIdx!==null}
        message={delStateIdx!==null ? `Delete state "${customStates[delStateIdx]}"? Plants using it will retain their state label.` : ''}
        onConfirm={confirmDelState} onCancel={()=>setDelStateIdx(null)} />

      {toast && (
        <div className={`fixed top-5 right-5 z-[100] px-5 py-3 rounded-xl shadow-xl text-sm font-semibold flex items-center gap-2 ${toast.type==='error'?'bg-red-500 text-white':'bg-green-500 text-white'}`}>
          {toast.type==='error'?'❌':'✅'} {toast.msg}
        </div>
      )}

      {/* Tab Switcher */}
      <div className={`${card} p-4`}>
        <div className="flex gap-2">
          {[['plants','🏭 Plants'],['states','📍 States']].map(([id,label])=>(
            <button key={id} onClick={()=>setActiveTab(id)}
              className={`px-5 py-2 rounded-xl text-sm font-semibold transition-all ${activeTab===id?'text-white shadow':'text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-700'}`} style={activeTab===id?{background:'var(--p600)'}:{}}>
              {label}
            </button>
          ))}
        </div>
      </div>

      {/* ── PLANTS TAB ── */}
      {activeTab==='plants' && (
        <>
          {/* Add Plant button */}
          <div className={`${card} p-4 flex items-center justify-between`}>
            <p className={`text-sm ${sub}`}>
              🏭 {plants.length} plant{plants.length!==1?'s':''} configured
            </p>
            <button onClick={()=>setShowAdd(v=>!v)}
              className="px-4 py-2.5 text-white rounded-xl text-sm font-semibold transition-colors flex items-center gap-2" style={{background:"var(--p600)"}}>
              {showAdd?'✕ Cancel':'+ Add Plant'}
            </button>
          </div>

          {/* Add Plant Form */}
          {showAdd && (
            <div className={`${card} p-5 space-y-4`}>
              <h3 className="font-semibold text-sm" style={{fontFamily:"'Outfit',sans-serif"}}>Add New Plant</h3>
              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className={`text-xs font-semibold ${sub} uppercase tracking-wide block mb-1`}>Plant Name *</label>
                  <input value={addForm.name} onChange={e=>setAddForm(f=>({...f,name:e.target.value}))}
                    placeholder="e.g. Plant D" className={inputCls} />
                </div>
                <div>
                  <label className={`text-xs font-semibold ${sub} uppercase tracking-wide block mb-1`}>State *</label>
                  <select value={addForm.state} onChange={e=>setAddForm(f=>({...f,state:e.target.value}))} className={selectCls}>
                    {allStates.map(s=><option key={s}>{s}</option>)}
                  </select>
                </div>
              </div>
              <div className="flex gap-3">
                <button onClick={()=>setShowAdd(false)}
                  className={`flex-1 py-2.5 rounded-xl border text-sm font-medium transition-colors ${dk?'border-gray-600 text-gray-300 hover:bg-gray-700':'border-gray-200 text-gray-700 hover:bg-gray-50'}`}>Cancel</button>
                <button onClick={addPlant} disabled={!addForm.name.trim()}
                  className="flex-1 py-2.5 rounded-xl text-white text-sm font-semibold disabled:opacity-50 transition-colors" style={{background:"var(--p600)"}}>
                  Add Plant
                </button>
              </div>
            </div>
          )}

          {/* Plants Grid */}
          <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
            {plants.map((plant, idx) => (
              <div key={plant.id} className={`${card} p-5`}>
                <div className="flex items-start justify-between mb-3">
                  <div className="flex items-center gap-3">
                    <div className="w-10 h-10 rounded-xl flex items-center justify-center text-white font-bold text-sm" style={{background:"linear-gradient(135deg,var(--p400),var(--p700))"}}>
                      {plant.name.charAt(plant.name.length-1) || String.fromCharCode(65+idx)}
                    </div>
                    <div>
                      <p className={`text-xs font-semibold ${sub} uppercase tracking-wide`}>{plant.id}</p>
                      <p className="font-semibold text-sm">{plant.name}</p>
                    </div>
                  </div>
                  <div className="flex gap-1">
                    <button onClick={()=>startEdit(plant)}
                      className={`p-1.5 rounded-lg text-xs transition-colors ${dk?'hover:bg-amber-900/30 text-amber-400':'hover:bg-amber-50 text-amber-600'}`} title="Edit">✏️</button>
                    <button onClick={()=>setDelId(plant.id)}
                      className={`p-1.5 rounded-lg text-xs transition-colors ${dk?'hover:bg-red-900/30 text-red-400':'hover:bg-red-50 text-red-500'}`} title="Delete">🗑️</button>
                  </div>
                </div>
                <p className={`text-xs flex items-center gap-1.5 mb-3 ${sub}`}><span>📍</span>{plant.state}</p>

                {editing === plant.id && (
                  <div className="mt-3 pt-3 border-t border-gray-100 dark:border-gray-700 space-y-3">
                    <div>
                      <label className={`text-xs font-semibold ${sub} uppercase tracking-wide block mb-1`}>Plant Name</label>
                      <input value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))} className={inputCls} placeholder="Plant name" />
                    </div>
                    <div>
                      <label className={`text-xs font-semibold ${sub} uppercase tracking-wide block mb-1`}>State</label>
                      <select value={form.state} onChange={e=>setForm(f=>({...f,state:e.target.value}))} className={selectCls}>
                        {allStates.map(s=><option key={s}>{s}</option>)}
                      </select>
                    </div>
                    <div className="flex gap-2">
                      <button onClick={()=>setEditing(null)} className={`flex-1 py-2 rounded-xl text-xs border transition-colors ${dk?'border-gray-600 hover:bg-gray-700 text-gray-300':'border-gray-200 hover:bg-gray-50 text-gray-700'}`}>Cancel</button>
                      <button onClick={()=>saveEdit(plant.id)} className="flex-1 py-2 rounded-xl text-xs text-white transition-colors font-medium" style={{background:"var(--p600)"}}>Save</button>
                    </div>
                  </div>
                )}
              </div>
            ))}
          </div>
        </>
      )}

      {/* ── STATES TAB ── */}
      {activeTab==='states' && (
        <div className="space-y-4">
          {/* Info */}

                        <button onClick={saveEditState} className="px-3 py-1.5 text-white rounded-lg text-xs font-semibold transition-colors" style={{background:"var(--p600)"}}>Save</button>

                      </>
                    )}
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      )}
    </div>
  );

        [
          `"${['Factory License Renewal','Pollution Control NOC','Fire Safety Certificate'][i]}"`,
          `"Ensure statutory compliance for ${p.name}"`,
          cats[i % cats.length],
          PRIORITIES[i % 4],
          'Pending',
          p.id,
          p.state,
          new Date(Date.now()+(i+1)*30*86400000).toISOString().split('T')[0],
          REM_FREQS[i%4],
          (i%3)+1,
          'ceo@legalcomp.com',
          '',
          `"${['Factories Act 1948 – Section 6','Environment Protection Act 1986 – Rule 5','Fire Services Act – Rule 12'][i]}"`,
          `"${['License to be obtained before operations; renewal within 30 days of expiry.','NOC mandatory from State Pollution Control Board.','Fire NOC required as per National Building Code.'][i]}"`,
        ].join(',')
      )
    ].join('\n');
    const blob = new Blob([sample], { type:'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'bulk_requirements_template.csv';
    a.click();
  };

  /* ── Parse CSV text ── */
  const parseCSV = (text) => {
    const lines = text.trim().split('\n').filter(Boolean);
    if (lines.length < 2) return { rows:[], errs:['CSV has no data rows.'] };
    const headers = lines[0].split(',').map(h=>h.trim().replace(/^"|"$/g,'').toLowerCase().replace(/ /g,'_'));
    const errs = [];
    const rows = [];
    lines.slice(1).forEach((line, li) => {
      // handle quoted commas
      const cols = [];
      let cur = '', inQ = false;
      for (let ch of line) {
        if (ch==='"') inQ=!inQ;
        else if (ch===',' && !inQ) { cols.push(cur.trim()); cur=''; }
        else cur+=ch;
      }
      cols.push(cur.trim());

      const obj = {};
      headers.forEach((h,i) => { obj[h] = (cols[i]||'').replace(/^"|"$/g,'').trim(); });

      const rowErrs = [];
      if (!obj.title)    rowErrs.push('title missing');
      if (!obj.due_date) rowErrs.push('due_date missing');

      // Resolve plant
      let plant = null;
      if (obj.plant_id) plant = plants.find(p=>p.id===obj.plant_id);
      if (!plant && obj.state) plant = plants.find(p=>p.state.toLowerCase()===obj.state.toLowerCase());
      if (!plant) rowErrs.push(`plant not found (plant_id="${obj.plant_id}", state="${obj.state}")`);

      // Resolve user
      let assignedTo = null;
      if (obj.assigned_email) {
        const u = users.find(u=>u.email.toLowerCase()===obj.assigned_email.toLowerCase());
        if (u) assignedTo = u.id;
        else rowErrs.push(`user email not found: ${obj.assigned_email}`);
      }

      const category = cats.includes(obj.category) ? obj.category : (cats[0]||'Other');
      const priority = PRIORITIES.includes(obj.priority) ? obj.priority : 'Medium';
      const status   = STATUSES.includes(obj.status)     ? obj.status   : 'Pending';
      const escLvl   = [1,2,3].includes(+obj.escalation_level) ? +obj.escalation_level : 1;

      if (rowErrs.length) errs.push({ row: li+2, errs: rowErrs });

      rows.push({
        _rowNum: li+2,
        _valid:  rowErrs.length === 0,
        _plant:  plant,
        _assignedTo: assignedTo,
        title:            obj.title,
        description:      obj.description || '',
        category,
        priority,
        status,
        plantId:          plant?.id || '',
        state:            plant?.state || obj.state,
        dueDate:          obj.due_date,
        reminderFrequency: REM_FREQS.includes(obj.reminder_frequency) ? obj.reminder_frequency : 'Weekly',
        escalationLevel:  escLvl,
        escalationEmail:  obj.escalation_email || '',
        assignedTo: assignedTo ? [assignedTo] : [],
        applicableRule:   obj.applicable_rule || '',
        legalClause:      obj.legal_clause || '',
      });
    });
    return { rows, errs };
  };

  /* ── Handle file ── */
  const handleFile = (file) => {
    if (!file || !file.name.endsWith('.csv')) {
      showToast('Please upload a valid .csv file.', 'error'); return;
    }
    const reader = new FileReader();
    reader.onload = e => {
      const { rows, errs } = parseCSV(e.target.result);
      setRawRows(rows);
      setErrors(errs);
      setSelRows(new Set(rows.filter(r=>r._valid).map(r=>r._rowNum)));
      setTab('preview');
    };
    reader.readAsText(file);
  };

  const onDrop = e => {
    e.preventDefault(); setDragOver(false);
    handleFile(e.dataTransfer.files[0]);
  };

  /* ── Filter preview rows ── */
  const visibleRows = rawRows.filter(r => {
    if (filterState && r.state !== filterState) return false;
    if (filterPlant && r.plantId !== filterPlant) return false;
    return true;
  });

  const uniqueStates = [...new Set(rawRows.map(r=>r.state).filter(Boolean))].sort();
  const uniquePlants = [...new Set(rawRows.map(r=>r.plantId).filter(Boolean))];

  /* ── Toggle row selection ── */
  const toggleRow  = rn => setSelRows(s => { const n=new Set(s); n.has(rn)?n.delete(rn):n.add(rn); return n; });
  const toggleAll  = () => {
    const validVisible = visibleRows.filter(r=>r._valid).map(r=>r._rowNum);
    const allSel = validVisible.every(rn=>selRows.has(rn));
    setSelRows(s => {
      const n=new Set(s);
      validVisible.forEach(rn => allSel ? n.delete(rn) : n.add(rn));
      return n;
    });
  };

  /* ── Import selected rows ── */
  const showToast = (msg, type='success') => {
    setToast({ msg, type });
    setTimeout(()=>setToast(null), 4000);
  };

  const importSelected = async () => {
    const toImport = rawRows.filter(r=>selRows.has(r._rowNum) && r._valid);
    if (!toImport.length) { showToast('No valid rows selected.','error'); return; }
    setImporting(true);
    await new Promise(r=>setTimeout(r,700));
    const newReqs = toImport.map(r => ({
      id: `r${Date.now()}_${Math.random().toString(36).slice(2,7)}`,
      title:            r.title,
      description:      r.description,
      category:         r.category,
      priority:         r.priority,
      status:           r.status,
      plantId:          r.plantId,
      assignedTo:       r._assignedTo,
      dueDate:          r.dueDate,
      reminderFrequency:r.reminderFrequency,
      escalationLevel:  r.escalationLevel,
      escalationEmail:  r.escalationEmail,
      applicableRule:   r.applicableRule || '',
      legalClause:      r.legalClause || '',
      createdAt:        new Date().toISOString(),
      evidence:         [],
      comments:         [],
    }));
    updateRequirements([...newReqs, ...requirements]);
    const entry = {
      id: `h${Date.now()}`,
      date: new Date().toLocaleString('en-IN'),
      total: rawRows.length,
      imported: toImport.length,
      skipped: rawRows.length - toImport.length,
      plants: [...new Set(toImport.map(r=>r._plant?.name).filter(Boolean))].join(', '),
      states: [...new Set(toImport.map(r=>r.state).filter(Boolean))].join(', '),
    };
    setHistory(h=>[entry,...h]);
    setImporting(false);
    showToast(`✅ ${toImport.length} requirement${toImport.length!==1?'s':''} imported successfully across ${[...new Set(toImport.map(r=>r.state))].length} state(s)!`);
    setRawRows([]); setErrors([]); setSelRows(new Set()); setTab('upload');
  };

  const validCount   = rawRows.filter(r=>r._valid).length;
  const invalidCount = rawRows.length - validCount;
  const selectedValid= rawRows.filter(r=>selRows.has(r._rowNum) && r._valid).length;

  return (
    <div className="space-y-5">
      {/* Toast */}
      {toast && (
        <div className={`fixed top-5 right-5 z-[100] px-5 py-3.5 rounded-2xl shadow-2xl text-sm font-semibold flex items-center gap-2 transition-all
          ${toast.type==='error'?'bg-red-500 text-white':'bg-green-500 text-white'}`}>
          {toast.msg}
        </div>
      )}

      {/* Header */}
      <div className={`${card} p-5`}>
        <div className="flex flex-wrap items-center justify-between gap-4">
          <div>
            <h2 className="text-xl font-bold flex items-center gap-2" style={{fontFamily:"'Outfit',sans-serif"}}>
              <span>📤</span> Bulk Upload Requirements
            </h2>
            <p className={`text-sm mt-1 ${sub}`}>
              Upload a CSV to create compliance requirements for multiple plants across different states in one go — Super Admin only.
            </p>
          </div>
          <button onClick={downloadTemplate}
            className="px-4 py-2.5 rounded-xl border-2 text-sm font-semibold transition-colors flex items-center gap-2" style={{borderColor:"var(--p500)",color:"var(--p600)"}}>
            ⬇️ Download CSV Template
          </button>
        </div>

        {/* Tabs */}
        <div className="flex gap-1 mt-5 p-1 rounded-xl bg-gray-100 dark:bg-gray-700 w-fit">
          {[['upload','📁 Upload'],['preview','🔍 Preview & Import'],['history','🕓 Import History']].map(([id,label])=>(
            <button key={id} onClick={()=>setTab(id)}
              className={`px-4 py-1.5 rounded-lg text-sm font-semibold transition-all ${tab===id?(dk?'bg-gray-600 text-white shadow':'bg-white text-[color:var(--p700)] shadow'):(dk?'text-gray-400':'text-gray-500')}`}>
              {label}{id==='preview' && rawRows.length>0 ? ` (${rawRows.length})` : ''}
            </button>
          ))}
        </div>
      </div>

      {/* ── TAB: UPLOAD ── */}
      {tab==='upload' && (
        <div className="space-y-5">
          {/* Drop zone */}
          <div
            onDragOver={e=>{e.preventDefault();setDragOver(true);}}
            onDragLeave={()=>setDragOver(false)}
            onDrop={onDrop}
            onClick={()=>fileRef.current.click()}
            className={`${card} p-12 text-center cursor-pointer transition-all border-2 border-dashed
              ${dragOver?'bg-gray-50 dark:bg-gray-700/20':'border-gray-300 dark:border-gray-600 hover:border-[color:var(--p400)]'}`}>
            <input ref={fileRef} type="file" accept=".csv" className="hidden"
              onChange={e=>{ if(e.target.files[0]) handleFile(e.target.files[0]); e.target.value=''; }} />
            <div className="text-5xl mb-4">{dragOver ? '📂' : '📁'}</div>
            <p className="text-lg font-bold text-gray-700 dark:text-gray-200 mb-1">
              {dragOver ? 'Drop CSV here!' : 'Drag & Drop your CSV file'}
            </p>
            <p className={`text-sm ${sub}`}>or click to browse · .csv files only</p>
          </div>

          {/* Format guide */}
          <div className={`${card} p-5`}>
            <h3 className="font-semibold mb-3 flex items-center gap-2" style={{fontFamily:"'Outfit',sans-serif"}}>
              <span>📋</span> CSV Column Reference
            </h3>
            <div className="overflow-x-auto">
              <table className="w-full text-xs">
                <thead>
                  <tr className={`${dk?'bg-gray-700 text-gray-300':'bg-gray-50 text-gray-500'}`}>
                    {['Column','Type','Required','Notes'].map(h=><th key={h} className="text-left px-3 py-2 font-semibold uppercase tracking-wide">{h}</th>)}
                  </tr>
                </thead>
                <tbody className={`divide-y ${dk?'divide-gray-700':'divide-gray-100'}`}>
                  {[
                    ['title','Text','✅ Yes','Requirement title'],
                    ['description','Text','No','Detailed description'],
                    ['category','Enum','No',cats.join(', ')],
                    ['priority','Enum','No','Critical / High / Medium / Low'],
                    ['status','Enum','No','Pending / In Progress / Completed / Overdue'],
                    ['plant_id','ID','⚡ Or state','Plant ID (e.g. p1, p2…)'],
                    ['state','Text','⚡ Or plant_id','State name — auto-matches plant'],
                    ['due_date','YYYY-MM-DD','✅ Yes','e.g. 2025-09-30'],
                    ['reminder_frequency','Enum','No','Daily / Weekly / Bi-Weekly / Monthly'],
                    ['escalation_level','1/2/3','No','1=Plant Head, 2=Regional, 3=Top Mgmt'],
                    ['escalation_email','Email','No','Override escalation email'],
                    ['assigned_email','Email','No','Must match an existing user email'],
                    ['applicable_rule','Text','No','e.g. Factories Act 1948 – Section 6'],
                    ['legal_clause','Text','No','Specific clause or provision mandating compliance'],
                  ].map(([col,type,req,notes])=>(
                    <tr key={col} className={dk?'hover:bg-gray-700/50':'hover:bg-gray-50'}>
                      <td className="px-3 py-2 font-mono text-[color:var(--p500)] font-semibold">{col}</td>
                      <td className={`px-3 py-2 ${sub}`}>{type}</td>
                      <td className="px-3 py-2">{req}</td>
                      <td className={`px-3 py-2 ${sub}`}>{notes}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <div className={`mt-4 p-3 rounded-xl text-xs ${dk?'bg-blue-900/20 border border-blue-800 text-blue-300':'bg-blue-50 border border-blue-100 text-blue-700'}`}>
              💡 <strong>Tip:</strong> You can target a plant by <code>plant_id</code> OR by <code>state</code> name — the system will auto-match. One row = one requirement.
            </div>
          </div>

          {/* Plant directory */}
          <div className={`${card} p-5`}>
            <h3 className="font-semibold mb-3 flex items-center gap-2" style={{fontFamily:"'Outfit',sans-serif"}}>
              <span>🏭</span> Available Plants & States
            </h3>
            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 xl:grid-cols-5 gap-2">
              {plants.map(p=>(
                <div key={p.id} className={`p-2.5 rounded-xl border text-xs ${dk?'bg-gray-700/50 border-gray-600':'bg-gray-50 border-gray-200'}`}>
                  <p className="font-semibold text-[color:var(--p500)] mb-0.5">{p.id}</p>
                  <p className="font-medium">{p.name}</p>
                  <p className={sub}>{p.state}</p>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      {/* ── TAB: PREVIEW ── */}
      {tab==='preview' && (
        <div className="space-y-4">
          {/* Summary strip */}
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
            {[
              { label:'Total Rows',   value:rawRows.length,   color:'#6366f1', icon:'📄' },
              { label:'Valid',        value:validCount,        color:'#22c55e', icon:'✅' },
              { label:'Errors',       value:invalidCount,      color:'#ef4444', icon:'❌' },
              { label:'Selected',     value:selectedValid,     color:'#f59e0b', icon:'☑️' },
            ].map(s=>(
              <div key={s.label} className={`${card} p-4 flex items-center gap-3`}>
                <span className="text-2xl">{s.icon}</span>
                <div>
                  <p className="text-2xl font-bold" style={{color:s.color}}>{s.value}</p>
                  <p className={`text-xs ${sub}`}>{s.label}</p>
                </div>
              </div>
            ))}
          </div>

          {/* Validation errors */}
          {errors.length > 0 && (
            <div className={`${card} p-4`}>
              <h4 className="font-semibold text-red-500 mb-2 flex items-center gap-2">❌ Validation Errors ({errors.length} rows)</h4>
              <div className="space-y-1.5 max-h-36 overflow-y-auto">
                {errors.map((e,i)=>(
                  <div key={i} className={`text-xs p-2 rounded-lg ${dk?'bg-red-900/20 border border-red-800 text-red-300':'bg-red-50 border border-red-200 text-red-600'}`}>
                    <strong>Row {e.row}:</strong> {e.errs.join(' · ')}
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Filters + actions */}
          <div className={`${card} p-4 flex flex-wrap items-center gap-3`}>
            <select value={filterState} onChange={e=>{setFilterState(e.target.value);setFilterPlant('');}} className={`${selectCls} max-w-[180px]`}>
              <option value="">All States ({uniqueStates.length})</option>
              {uniqueStates.map(s=><option key={s} value={s}>📍 {s}</option>)}
            </select>
            <select value={filterPlant} onChange={e=>setFilterPlant(e.target.value)} className={`${selectCls} max-w-[180px]`}>
              <option value="">All Plants</option>
              {uniquePlants.map(pid=>{ const p=plants.find(x=>x.id===pid); return p ? <option key={pid} value={pid}>🏭 {p.name}</option>:null; })}
            </select>
            <span className={`text-xs ${sub}`}>Showing {visibleRows.length} of {rawRows.length}</span>
            <div className="ml-auto flex gap-2">
              <button onClick={()=>{ setRawRows([]); setErrors([]); setSelRows(new Set()); setTab('upload'); }}
                className={`px-3 py-2 rounded-xl text-sm border font-medium transition-colors ${dk?'border-gray-600 hover:bg-gray-700 text-gray-300':'border-gray-200 hover:bg-gray-50 text-gray-700'}`}>
                ← Re-upload
              </button>
              <button onClick={importSelected} disabled={importing || selectedValid===0}
                className="px-5 py-2 text-white rounded-xl text-sm font-semibold disabled:opacity-50 transition-colors flex items-center gap-2" style={{background:"var(--p600)"}}>
                {importing ? '⏳ Importing…' : `⬆️ Import ${selectedValid} Requirement${selectedValid!==1?'s':''}`}
              </button>
            </div>
          </div>

          {/* Preview table */}
          <div className={`${card} overflow-hidden`}>
            <div className="overflow-x-auto">
              <table className="w-full text-xs">
                <thead>
                  <tr className={`${dk?'bg-gray-700/60 text-gray-400':'bg-gray-50 text-gray-500'} text-xs uppercase tracking-wide font-semibold`}>
                    <th className="px-3 py-3 text-left">
                      <input type="checkbox"
                        checked={visibleRows.filter(r=>r._valid).length>0 && visibleRows.filter(r=>r._valid).every(r=>selRows.has(r._rowNum))}
                        onChange={toggleAll} className="rounded" />
                    </th>
                    {['Row','Title','Plant','State','Category','Priority','Status','Due Date','Assigned To','⚖️ Rule','Valid'].map(h=>(
                      <th key={h} className="px-3 py-3 text-left whitespace-nowrap">{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody className={`divide-y ${dk?'divide-gray-700':'divide-gray-100'}`}>
                  {visibleRows.length === 0 && (
                    <tr><td colSpan={12} className="text-center py-10 text-gray-400">No rows match filters</td></tr>
                  )}
                  {visibleRows.map(row => {
                    const isSelected = selRows.has(row._rowNum);
                    const assignee   = users.find(u=>u.id===row._assignedTo);
                    return (
                      <tr key={row._rowNum}
                        className={`transition-colors ${isSelected&&row._valid?(dk?'bg-gray-700/30':'bg-gray-100/80'):''}
                          ${dk?'hover:bg-gray-700/50':'hover:bg-slate-50'} ${!row._valid?'opacity-60':''}`}>
                        <td className="px-3 py-2">
                          <input type="checkbox" checked={isSelected && row._valid} disabled={!row._valid}
                            onChange={()=>toggleRow(row._rowNum)} className="rounded" />
                        </td>
                        <td className={`px-3 py-2 font-mono ${sub}`}>{row._rowNum}</td>
                        <td className="px-3 py-2 font-medium max-w-[160px]">
                          <p className="truncate" title={row.title}>{row.title}</p>
                        </td>
                        <td className={`px-3 py-2 ${sub} whitespace-nowrap`}>{row._plant?.name || <span className="text-red-400">⚠️ Unknown</span>}</td>
                        <td className={`px-3 py-2 ${sub} whitespace-nowrap`}>
                          {row.state ? <span className="flex items-center gap-1">📍{row.state}</span> : <span className="text-red-400">—</span>}
                        </td>
                        <td className={`px-3 py-2 ${sub}`}>{row.category}</td>
                        <td className="px-3 py-2"><Badge label={row.priority} color={PRIORITY_CLR[row.priority]||'#6366f1'} /></td>
                        <td className="px-3 py-2"><Badge label={row.status}   color={STATUS_CLR[row.status]  ||'#6366f1'} /></td>
                        <td className={`px-3 py-2 ${sub} whitespace-nowrap`}>{row.dueDate||'—'}</td>
                        <td className={`px-3 py-2 ${sub}`}>{assignee?.name||<span className="text-amber-500">Unassigned</span>}</td>
                        <td className="px-3 py-2 max-w-[160px]">
                          {row.applicableRule
                            ? <span className="text-[color:var(--p500)] text-xs truncate block" title={row.applicableRule}>⚖️ {row.applicableRule}</span>
                            : <span className={`text-xs ${sub}`}>—</span>}
                        </td>
                        <td className="px-3 py-2 text-center">
                          {row._valid
                            ? <span className="text-green-500 font-bold text-sm">✓</span>
                            : <span className="text-red-500 font-bold text-sm" title={errors.find(e=>e.row===row._rowNum)?.errs?.join(', ')}>✗</span>}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      )}

      {/* ── TAB: HISTORY ── */}
      {tab==='history' && (
        <div className={`${card} overflow-hidden`}>
          {history.length === 0 ? (
            <div className="text-center py-16">
              <p className="text-4xl mb-3">🕓</p>
              <p className="font-semibold text-gray-500">No import history yet</p>
              <p className={`text-sm mt-1 ${sub}`}>Completed imports will appear here</p>
            </div>
          ) : (
            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead>
                  <tr className={`text-xs uppercase tracking-wide font-semibold ${dk?'bg-gray-700/60 text-gray-400':'bg-gray-50 text-gray-500'}`}>
                    {['Date / Time','Imported','Skipped','Plants Covered','States Covered','Total Rows'].map(h=>(
                      <th key={h} className="text-left px-4 py-3 whitespace-nowrap">{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody className={`divide-y ${dk?'divide-gray-700':'divide-gray-100'}`}>
                  {history.map(h=>(
                    <tr key={h.id} className={dk?'hover:bg-gray-700/50':'hover:bg-slate-50'}>
                      <td className={`px-4 py-3 text-xs ${sub} whitespace-nowrap`}>🕓 {h.date}</td>
                      <td className="px-4 py-3"><Badge label={`${h.imported} imported`} color="#22c55e" /></td>
                      <td className="px-4 py-3"><Badge label={`${h.skipped} skipped`}  color={h.skipped>0?'#ef4444':'#9ca3af'} /></td>
                      <td className={`px-4 py-3 text-xs ${sub} max-w-[180px] truncate`} title={h.plants}>{h.plants||'—'}</td>
                      <td className={`px-4 py-3 text-xs ${sub} max-w-[160px] truncate`} title={h.states}>{h.states||'—'}</td>
                      <td className={`px-4 py-3 text-xs font-semibold`}>{h.total}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

/* ═══════════════════════════════════════════
   ADMIN – CATEGORIES
═══════════════════════════════════════════ */
function AdminCategories({ dk, categories, updateCategories }) {
  const [cats,     setCats]     = useState(categories);
  const [newCat,   setNewCat]   = useState('');
  const [editIdx,  setEditIdx]  = useState(null);
  const [editVal,  setEditVal]  = useState('');
  const [delIdx,   setDelIdx]   = useState(null);
  const [toast,    setToast]    = useState(null);

  // Keep local state in sync if parent changes
  useEffect(()=>{ setCats(categories); }, [categories]);

  const showToast = (msg, type='success') => {
    setToast({msg, type});
    setTimeout(()=>setToast(null), 3000);
  };

  const save = (updated) => {
    setCats(updated);
    CATEGORIES = updated; // update global
    localStorage.setItem('categories', JSON.stringify(updated));
    updateCategories(updated);
  };

  const addCat = () => {
    const trimmed = newCat.trim();
    if (!trimmed) return;
    if (cats.map(c=>c.toLowerCase()).includes(trimmed.toLowerCase())) {
      showToast('Category already exists', 'error'); return;
    }
    save([...cats, trimmed]);
    setNewCat('');
    showToast(`"${trimmed}" added`);
  };

  const startEdit = (i) => { setEditIdx(i); setEditVal(cats[i]); };

  const saveEdit = () => {
    const trimmed = editVal.trim();
    if (!trimmed) return;
    if (cats.map((c,i)=>i!==editIdx?c.toLowerCase():null).filter(Boolean).includes(trimmed.toLowerCase())) {
      showToast('Category name already exists', 'error'); return;
    }
    const updated = cats.map((c,i)=>i===editIdx?trimmed:c);
    save(updated);
    setEditIdx(null);
    showToast(`Updated to "${trimmed}"`);
  };

  const confirmDel = () => {
    const removed = cats[delIdx];
    save(cats.filter((_,i)=>i!==delIdx));
    setDelIdx(null);
    showToast(`"${removed}" deleted`);
  };

  const moveUp = (i) => {
    if (i===0) return;
    const updated = [...cats];
    [updated[i-1],updated[i]]=[updated[i],updated[i-1]];
    save(updated);
  };
  const moveDown = (i) => {
    if (i===cats.length-1) return;
    const updated = [...cats];
    [updated[i+1],updated[i]]=[updated[i],updated[i+1]];
    save(updated);
  };

  const card = `rounded-2xl border shadow-sm ${dk?'bg-gray-800 border-gray-700':'bg-white border-gray-200'}`;
  const sub  = dk?'text-gray-400':'text-gray-500';
  const COLORS_POOL = ['#6366f1','#22c55e','#f59e0b','#ef4444','#8b5cf6','#06b6d4','#ec4899','#14b8a6','#f97316','#84cc16','#0ea5e9','#a855f7'];

  return (
    <div className="space-y-5">
      <ConfirmModal
        open={delIdx!==null}
        message={delIdx!==null ? `Delete category "${cats[delIdx]}"? Requirements using it will retain the label but it won't appear in new dropdowns.` : ''}
        onConfirm={confirmDel}
        onCancel={()=>setDelIdx(null)}
      />

      {/* Toast */}
      {toast && (
        <div className={`fixed top-5 right-5 z-[100] px-5 py-3 rounded-xl shadow-xl text-sm font-semibold flex items-center gap-2 transition-all
          ${toast.type==='error'?'bg-red-500 text-white':'bg-green-500 text-white'}`}>
          {toast.type==='error'?'❌':'✅'} {toast.msg}
        </div>
      )}

      {/* Info banner */}
      <div className={`p-4 rounded-2xl border flex items-start gap-3 ${dk?'border-gray-700':'border-gray-100'}`}>
        <span className="text-xl mt-0.5">🏷️</span>
        <div>
          <p className="text-sm font-semibold text-[color:var(--p600)] dark:text-[color:var(--p400)]">Compliance Categories</p>
          <p className={`text-xs mt-0.5 ${sub}`}>Categories are used to classify requirements across all plants. Changes apply immediately to all dropdowns. Existing requirements retain their category label.</p>
        </div>
      </div>

      {/* Add new category */}
      <div className={`${card} p-5`}>
        <h3 className="font-semibold text-sm mb-3" style={{fontFamily:"'Outfit',sans-serif"}}>Add New Category</h3>
        <div className="flex gap-3">
          <input
            value={newCat}
            onChange={e=>setNewCat(e.target.value)}
            onKeyDown={e=>e.key==='Enter'&&addCat()}
            placeholder="e.g. Water Management, ISO Compliance…"
            className={`${inputCls} flex-1`}
          />
          <button
            onClick={addCat}
            disabled={!newCat.trim()}
            className="px-5 py-2.5 text-white rounded-xl text-sm font-semibold disabled:opacity-40 transition-colors flex-shrink-0" style={{background:"var(--p600)"}}
          >
            + Add
          </button>
        </div>
      </div>

      {/* Categories list */}
      <div className={`${card} overflow-hidden`}>
        <div className="px-5 py-4 border-b border-gray-100 dark:border-gray-700 flex items-center justify-between">
          <div>
            <h3 className="font-semibold text-sm" style={{fontFamily:"'Outfit',sans-serif"}}>All Categories</h3>
            <p className={`text-xs mt-0.5 ${sub}`}>{cats.length} categor{cats.length===1?'y':'ies'} · drag order affects chart display</p>
          </div>
        </div>

        {cats.length === 0 ? (
          <div className="text-center py-16">
            <p className="text-4xl mb-3">📂</p>
            <p className="font-semibold text-gray-500">No categories yet</p>
            <p className={`text-sm mt-1 ${sub}`}>Add your first category above</p>
          </div>
        ) : (
          <div className="divide-y divide-gray-100 dark:divide-gray-700">
            {cats.map((cat, i) => (
              <div key={i} className={`flex items-center gap-3 px-5 py-3.5 transition-colors ${dk?'hover:bg-gray-700/40':'hover:bg-gray-50'}`}>
                {/* Color dot */}
                <div className="w-3 h-3 rounded-full flex-shrink-0" style={{background: COLORS_POOL[i % COLORS_POOL.length]}} />

                {/* Order controls */}
                <div className="flex flex-col gap-0.5">
                  <button onClick={()=>moveUp(i)} disabled={i===0}
                    className={`text-xs leading-none px-1 rounded transition-colors ${i===0?'opacity-20 cursor-not-allowed':dk?'hover:bg-gray-600 text-gray-300':'hover:bg-gray-200 text-gray-500'}`}>▲</button>
                  <button onClick={()=>moveDown(i)} disabled={i===cats.length-1}
                    className={`text-xs leading-none px-1 rounded transition-colors ${i===cats.length-1?'opacity-20 cursor-not-allowed':dk?'hover:bg-gray-600 text-gray-300':'hover:bg-gray-200 text-gray-500'}`}>▼</button>
                </div>

                {/* Index badge */}
                <span className={`text-xs w-5 text-center font-mono ${sub}`}>{i+1}</span>

                {/* Edit inline or display */}
                {editIdx === i ? (
                  <div className="flex items-center gap-2 flex-1">
                    <input
                      value={editVal}
                      onChange={e=>setEditVal(e.target.value)}
                      onKeyDown={e=>{ if(e.key==='Enter') saveEdit(); if(e.key==='Escape') setEditIdx(null); }}
                      autoFocus
                      className={`${inputCls} flex-1 py-1.5 text-sm`}
                    />
                    <button onClick={saveEdit} className="px-3 py-1.5 text-white rounded-lg text-xs font-semibold transition-colors" style={{background:"var(--p600)"}}>Save</button>
                    <button onClick={()=>setEditIdx(null)} className={`px-3 py-1.5 rounded-lg text-xs border transition-colors ${dk?'border-gray-600 text-gray-300 hover:bg-gray-700':'border-gray-200 text-gray-600 hover:bg-gray-50'}`}>Cancel</button>
                  </div>
                ) : (
                  <>
                    <span className="flex-1 text-sm font-medium">{cat}</span>
                    <div className="flex items-center gap-1 flex-shrink-0">
                      <button onClick={()=>startEdit(i)}
                        className={`p-1.5 rounded-lg text-xs transition-colors ${dk?'hover:bg-amber-900/30 text-amber-400':'hover:bg-amber-50 text-amber-600'}`} title="Edit">✏️</button>
                      <button onClick={()=>setDelIdx(i)}
                        className={`p-1.5 rounded-lg text-xs transition-colors ${dk?'hover:bg-red-900/30 text-red-400':'hover:bg-red-50 text-red-500'}`} title="Delete">🗑️</button>
                    </div>
                  </>
                )}
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}
