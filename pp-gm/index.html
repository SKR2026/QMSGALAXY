<!doctype html>

  <style>
    :root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#172033;background:#f4f6fa}
    *{box-sizing:border-box}body{margin:0}header{background:#142b4a;color:#fff;padding:18px 26px;display:flex;justify-content:space-between;align-items:center}
    header h1{font-size:20px;margin:0}header small{opacity:.8}.wrap{max-width:1200px;margin:26px auto;padding:0 18px}
    .panel{background:#fff;border:1px solid #e4e8ef;border-radius:12px;padding:20px;margin-bottom:18px;box-shadow:0 3px 14px #1c31500a}
    h2{font-size:18px;margin:0 0 16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    label{font-size:13px;font-weight:600;display:block;margin-bottom:6px;color:#46536a}
    input,select,textarea{width:100%;padding:11px;border:1px solid #ccd4df;border-radius:7px;font:inherit;background:#fff}
    textarea{min-height:80px}button{border:0;border-radius:7px;padding:11px 16px;background:#1769aa;color:white;font-weight:650;cursor:pointer}
    button.secondary{background:#e8eef5;color:#20344d}button.danger{background:#a83232}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
    .muted{color:#68758a;font-size:13px}.hidden{display:none!important}.status{padding:4px 8px;border-radius:20px;background:#edf2f8;font-size:12px}
    .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tabs button{background:#e8eef5;color:#263b55}.tabs button.active{background:#1769aa;color:#fff}
    table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid #edf0f4;vertical-align:top}th{color:#536178;background:#f8fafc}
    .notice{padding:11px 13px;border-radius:8px;background:#eef6ff;color:#244b72;margin-bottom:14px;font-size:13px}
    .error{background:#fff0f0;color:#8e2525}.success{background:#edfaef;color:#246b35}
    @media(max-width:700px){.grid{grid-template-columns:1fr}header{padding:15px}.wrap{margin:16px auto}}
    .seed-box{border:2px dashed #c5d2e0;border-radius:10px;padding:18px;margin-top:18px;background:#f8fafc}
    .seed-box h3{margin:0 0 6px;font-size:15px;color:#1769aa}.seed-box p{margin:0 0 12px;font-size:13px;color:#46536a}
    .seed-preview{font-size:12px;color:#46536a;margin-bottom:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
    .seed-preview div{background:#edf2f8;border-radius:7px;padding:9px 12px}
    .seed-preview strong{display:block;font-size:13px;color:#172033;margin-bottom:2px}
    #seedLog{font-size:12px;color:#46536a;margin-top:12px;max-height:160px;overflow:auto;background:#f0f4fa;border-radius:7px;padding:10px;white-space:pre-wrap;display:none}
    .wipe-box{border:1px solid #f0c5c5;border-radius:10px;padding:14px;margin-top:12px;background:#fff8f8}
    .wipe-box h4{margin:0 0 6px;font-size:14px;color:#8e2525}.wipe-box p{margin:0 0 10px;font-size:12px;color:#6b2222}
  </style>
</head>
<body>
<header><div><h1>Gift Management System</h1><small>Centralized multi-plant gift requests & distribution</small></div><div id="accountArea"></div></header>
<main class="wrap">
  <div id="message" class="notice hidden"></div>
  <section id="authPanel" class="panel">
    <div class="tabs"><button id="loginTab" class="active" type="button">Sign in</button><button id="registerTab" type="button">Create employee account</button></div>
    <form id="loginForm">
      <div class="grid"><div><label>Email</label><input id="loginEmail" type="email" required></div><div><label>Password</label><input id="loginPassword" type="password" required></div></div>
      <div class="actions"><button>Sign in</button></div>
    </form>
    <form id="registerForm" class="hidden">
      <div class="notice">New accounts are created as pending employees. A Plant Admin or Super Admin must activate the account.</div>
      <div class="grid">
        <div><label>Employee Code *</label><input id="regCode" required></div>
        <div><label>Employee Name *</label><input id="regName" required></div>
        <div><label>Designation *</label><input id="regDesignation" required></div>
        <div><label>Department *</label><select id="regDepartment" required><option value="">Select department</option></select></div>
        <div><label>Plant *</label><select id="regPlant" required><option value="">Select plant</option></select></div>
        <div><label>Email *</label><input id="regEmail" type="email" required></div>
        <div><label>Mobile Number</label><input id="regMobile" inputmode="tel"></div>
        <div><label>Password *</label><input id="regPassword" type="password" minlength="8" required></div>
      </div>
      <div class="actions"><button>Create account</button></div>
    </form>
  </section>

  <section id="appPanel" class="hidden">
    <div class="panel">
      <h2 id="welcome">Dashboard</h2>
      <div class="tabs" id="navTabs">
        <button data-view="dashboard" class="active">Dashboard</button>
        <button data-view="newRequest">New Gift Request</button>
        <button data-view="requests">Gift Requests</button>
        <button data-view="admin">Masters & User Admin</button>
      </div>
      <div id="dashboardView"></div>
      <div id="newRequestView" class="hidden">
        <h2>Submit Gift Requirement</h2>
        <form id="requestForm">
          <div class="grid">
            <div><label>Occasion / Purpose *</label><input id="occasion" required placeholder="Annual day, festival, employee event..."></div>
            <div><label>Required Distribution Date *</label><input id="distributionDate" type="date" required></div>
            <div><label>Gift Name / Description *</label><input id="giftName" required></div>
            <div><label>Gift Category</label><input id="giftCategory" placeholder="Employee welfare, festival, recognition..."></div>
            <div><label>Quantity Requested *</label><input id="quantity" type="number" min="1" required></div>
            <div><label>Estimated Unit Cost (₹)</label><input id="unitCost" type="number" min="0" step="0.01" value="0"></div>
          </div>
          <div style="margin-top:14px"><label>Remarks</label><textarea id="remarks"></textarea></div>
          <div class="actions"><button>Submit for Plant Admin review</button></div>
        </form>
      </div>
      <div id="requestsView" class="hidden"></div>
      <div id="adminView" class="hidden"></div>
    </div>
  </section>
</main>

const auth = firebase.auth(), db = firebase.firestore();
let currentUser = null, profile = null, activeView = "dashboard";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
/* Normalise role strings so Firestore values like "Super Admin", "Plant Admin",
   "Top Management" work alongside the code-style keys. */
function normaliseRole(r){
  const map={"super admin":"superadmin","superadmin":"superadmin","plant admin":"plant_admin","plant_admin":"plant_admin","top management":"top_management","top_management":"top_management","employee":"employee"};
  return map[(r||"").toLowerCase().trim()]||((r||"").toLowerCase().replace(/\s+/g,"_"));
}
function message(msg, type="notice"){ $("message").textContent=msg; $("message").className="notice "+type; }
function clearMessage(){ $("message").className="notice hidden"; }
function setAuthMode(mode){
  $("loginForm").classList.toggle("hidden",mode!=="login"); $("registerForm").classList.toggle("hidden",mode!=="register");
  $("loginTab").classList.toggle("active",mode==="login"); $("registerTab").classList.toggle("active",mode==="register");
}
$("loginTab").onclick=()=>setAuthMode("login"); $("registerTab").onclick=()=>setAuthMode("register");
async function loadMasters(){
  for (const [collection,selectId,labelField] of [["plants","regPlant","name"],["departments","regDepartment","name"]]){
    const sel=$(selectId); sel.innerHTML='<option value="">Select '+(collection==="plants"?"plant":"department")+'</option>';
    const snap=await db.collection(collection).orderBy(labelField).get();
    snap.forEach(d=>{const x=d.data();sel.insertAdjacentHTML("beforeend",`<option value="${esc(d.id)}">${esc(x[labelField]||d.id)}</option>`);});
  }
}
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();clearMessage();try{await auth.signInWithEmailAndPassword($("loginEmail").value.trim(),$("loginPassword").value);}catch(err){message(err.message,"error");}});
$("registerForm").addEventListener("submit",async e=>{
  e.preventDefault();clearMessage();
  try{
    const code=$("regCode").value.trim();
    const duplicate=await db.collection("users").where("employeeCode","==",code).limit(1).get();
    if(!duplicate.empty) throw new Error("This Employee Code is already registered.");
    const cred=await auth.createUserWithEmailAndPassword($("regEmail").value.trim(),$("regPassword").value);
    await db.collection("users").doc(cred.user.uid).set({
      employeeCode:code,name:$("regName").value.trim(),designation:$("regDesignation").value.trim(),
      departmentId:$("regDepartment").value,plantId:$("regPlant").value,email:$("regEmail").value.trim(),
      mobile:$("regMobile").value.trim(),role:"employee",status:"pending",createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });
    message("Account created. It will be available after administrator activation.","success");
    await auth.signOut();setAuthMode("login");
  }catch(err){message(err.message,"error");}
});
auth.onAuthStateChanged(async user=>{
  currentUser=user; profile=null;
  if(!user){$("authPanel").classList.remove("hidden");$("appPanel").classList.add("hidden");$("accountArea").textContent="";return;}
  try{
    const doc=await db.collection("users").doc(user.uid).get();
    if(!doc.exists){await auth.signOut();message("User profile not found. Contact the administrator.","error");return;}
    profile={...doc.data(), role: normaliseRole(doc.data().role)};
    if(profile.status!=="active"){await auth.signOut();message("Your account is pending activation. Please contact your Plant Admin.","error");return;}
    $("authPanel").classList.add("hidden");$("appPanel").classList.remove("hidden");
    $("accountArea").innerHTML=`${esc(profile.name)} · ${esc(profile.role)} <button class="secondary" id="logoutBtn">Sign out</button>`;
    $("logoutBtn").onclick=()=>auth.signOut();
    $("welcome").textContent=`Welcome, ${profile.name}`;
    await renderDashboard(); await loadRequests();
    configureNavigation();
  }catch(err){message(err.message,"error");}
});
function configureNavigation(){
  document.querySelectorAll("#navTabs button").forEach(b=>{
    const view=b.dataset.view;
    b.classList.toggle("hidden",view==="admin" && !["superadmin","plant_admin"].includes(profile.role));
    b.onclick=()=>showView(view);
  });
}
function showView(view){
  activeView=view;
  ["dashboard","newRequest","requests","admin"].forEach(v=>$(v+"View").classList.toggle("hidden",v!==view));
  document.querySelectorAll("#navTabs button").forEach(b=>b.classList.toggle("active",b.dataset.view===view));
  if(view==="requests")loadRequests(); if(view==="admin")renderAdmin();
}
async function renderDashboard(){
  const snap=await visibleRequests();
  const counts={total:snap.size,pending:0,approved:0,distributed:0};
  snap.forEach(d=>{const s=d.data().status;if(["pending_plant_review","pending_top_management","returned"].includes(s))counts.pending++;if(["approved","partially_approved"].includes(s))counts.approved++;if(s==="distributed")counts.distributed++;});
  $("dashboardView").innerHTML=`<div class="grid">
    <div class="panel"><div class="muted">Total Requests</div><h2>${counts.total}</h2></div>
    <div class="panel"><div class="muted">Pending / Returned</div><h2>${counts.pending}</h2></div>
    <div class="panel"><div class="muted">Approved</div><h2>${counts.approved}</h2></div>
    <div class="panel"><div class="muted">Distributed</div><h2>${counts.distributed}</h2></div></div>
    <p class="muted">Counts reflect requests visible to your account.</p>`;
}
function visibleRequests(){
  let q=db.collection("giftRequests");
  if(profile.role==="employee") q=q.where("requestedBy","==",currentUser.uid);
  else if(profile.role==="plant_admin") q=q.where("plantId","==",profile.plantId);
  return q.orderBy("createdAt","desc").limit(200).get();
}
$("requestForm").addEventListener("submit",async e=>{
  e.preventDefault();
  try{
    const qty=Number($("quantity").value),cost=Number($("unitCost").value||0);
    await db.collection("giftRequests").add({
      occasion:$("occasion").value.trim(),distributionDate:$("distributionDate").value,
      giftName:$("giftName").value.trim(),giftCategory:$("giftCategory").value.trim(),
      requestedQuantity:qty,estimatedUnitCost:cost,estimatedTotal:qty*cost,
      remarks:$("remarks").value.trim(),plantId:profile.plantId,departmentId:profile.departmentId,
      requestedBy:currentUser.uid,requesterName:profile.name,employeeCode:profile.employeeCode,
      status:"pending_plant_review",createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });
    e.target.reset();message("Gift request submitted for Plant Admin review.","success");await renderDashboard();showView("requests");
  }catch(err){message(err.message,"error");}
});
async function loadRequests(){
  try{
    const snap=await visibleRequests();let rows=[];
    snap.forEach(d=>{const x=d.data();rows.push(`<tr><td>${esc(x.giftName)}</td><td>${esc(x.occasion)}</td><td>${esc(x.requestedQuantity)}</td><td>₹${Number(x.estimatedTotal||0).toLocaleString("en-IN")}</td><td><span class="status">${esc(x.status)}</span></td><td>${esc(x.requesterName||"")}</td><td>${requestActions(d.id,x)}</td></tr>`);});
    $("requestsView").innerHTML=`<h2>Gift Requests</h2><div style="overflow:auto"><table><thead><tr><th>Gift</th><th>Occasion</th><th>Qty</th><th>Est. Total</th><th>Status</th><th>Requested By</th><th>Action</th></tr></thead><tbody>${rows.join("")||'<tr><td colspan="7">No requests found.</td></tr>'}</tbody></table></div>`;
    $("requestsView").querySelectorAll("[data-action]").forEach(b=>b.onclick=()=>processRequest(b.dataset.id,b.dataset.action));
  }catch(err){$("requestsView").textContent=err.message;}
}
function requestActions(id,x){
  if(profile.role==="plant_admin" && x.status==="pending_plant_review")return `<button data-id="${id}" data-action="forward">Forward to Top Management</button> <button class="secondary" data-id="${id}" data-action="return">Return</button>`;
  if(["top_management","superadmin"].includes(profile.role) && ["pending_top_management","returned"].includes(x.status))return `<button data-id="${id}" data-action="approve">Approve</button> <button class="secondary" data-id="${id}" data-action="partial">Partial approve</button> <button class="danger" data-id="${id}" data-action="reject">Reject</button>`;
  return "—";
}
async function processRequest(id,action){
  try{
    const ref=db.collection("giftRequests").doc(id),snap=await ref.get(),x=snap.data();let update={updatedAt:firebase.firestore.FieldValue.serverTimestamp(),lastActionBy:currentUser.uid};
    if(action==="forward")update.status="pending_top_management";
    if(action==="return") {update.status="returned";update.lastComment=prompt("Reason for return:")||"";}
    if(action==="approve"){update.status="approved";update.approvedQuantity=x.requestedQuantity;update.approvedBudget=x.estimatedTotal;}
    if(action==="partial"){
      const q=Number(prompt("Enter approved quantity:",x.requestedQuantity));if(!Number.isFinite(q)||q<1||q>x.requestedQuantity)return;
      update.status="partially_approved";update.approvedQuantity=q;update.approvedBudget=q*Number(x.estimatedUnitCost||0);
    }
    if(action==="reject"){update.status="rejected";update.lastComment=prompt("Reason for rejection:")||"";}
    await ref.update(update);await loadRequests();await renderDashboard();message("Request updated.","success");
  }catch(err){message(err.message,"error");}
}
async function renderAdmin(){
  if(profile.role!=="superadmin" && profile.role!=="plant_admin")return;
  const isSA=profile.role==="superadmin";
  $("adminView").innerHTML=`<h2>Administration</h2>
    <p class="muted">Plant Admins can activate employees for their own plant. Super Admin can manage all masters.</p>
    <h3>Pending employee accounts</h3><div id="pendingUsers">Loading...</div>`
    +(isSA?`
    <div class="seed-box">
      <h3>🌱 Demo / Dummy Data Seeder</h3>
      <p>Populates Plants, Departments, and Gift Requests with realistic sample data so you can explore the system without manual entry. Safe to run multiple times — existing records are skipped (checked by name). Remove all seeded data with the wipe button below.</p>
      <div class="seed-preview">

        <div><strong>15 Gift Requests</strong>Various occasions, statuses &amp; plants</div>
      </div>
      <div class="actions">
        <button id="seedBtn">Seed demo data</button>
        <button class="secondary" id="seedPreviewBtn">Preview only (console)</button>
      </div>
      <div id="seedLog"></div>
      <div class="wipe-box" style="margin-top:16px">
        <h4>⚠ Wipe seeded data</h4>
        <p>Deletes all plants, departments, and gift requests that were created by the seeder (tagged <code>_seeded:true</code>). Does not touch real users or manually added records.</p>
        <div class="actions"><button class="danger" id="wipeBtn">Wipe seeded data</button></div>
      </div>
    </div>`:"");
  let q=db.collection("users").where("status","==","pending");
  if(profile.role==="plant_admin")q=q.where("plantId","==",profile.plantId);
  const snap=await q.limit(100).get();let rows=[];
  snap.forEach(d=>{let u=d.data();rows.push(`<tr><td>${esc(u.employeeCode)}</td><td>${esc(u.name)}</td><td>${esc(u.designation)}</td><td>${esc(u.email)}</td><td><button data-uid="${d.id}">Activate</button></td></tr>`);});
  $("pendingUsers").innerHTML=`<div style="overflow:auto"><table><thead><tr><th>Code</th><th>Name</th><th>Designation</th><th>Email</th><th>Action</th></tr></thead><tbody>${rows.join("")||'<tr><td colspan="5">No pending accounts.</td></tr>'}</tbody></table></div>`;
  $("pendingUsers").querySelectorAll("button").forEach(b=>b.onclick=async()=>{await db.collection("users").doc(b.dataset.uid).update({status:"active",updatedAt:firebase.firestore.FieldValue.serverTimestamp()});renderAdmin();});
  if(isSA){
    $("seedBtn").onclick=()=>runSeeder(false);
    $("seedPreviewBtn").onclick=()=>runSeeder(true);
    $("wipeBtn").onclick=wipeSeededData;
  }
}

function seedLog(msg,el){el.style.display="block";el.textContent+=msg+"\n";}

async function runSeeder(previewOnly){
  const logEl=$("seedLog");logEl.textContent="";logEl.style.display="block";
  const label=previewOnly?"[PREVIEW]":"[SEED]";
  seedLog(`${label} Starting seeder — ${new Date().toLocaleTimeString()}`,logEl);

  /* Plants */
  for(const p of SEED_PLANTS){
    const ref=db.collection("plants").doc(p.id);
    const exists=(await ref.get()).exists;
    if(exists){seedLog(`  SKIP plant already exists: ${p.name}`,logEl);continue;}
    if(!previewOnly)await ref.set({...p,_seeded:true,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    seedLog(`  ${previewOnly?"WOULD ADD":"ADDED"} plant: ${p.name}`,logEl);
  }
  /* Departments */
  for(const d of SEED_DEPTS){
    const ref=db.collection("departments").doc(d.id);
    const exists=(await ref.get()).exists;
    if(exists){seedLog(`  SKIP dept already exists: ${d.name}`,logEl);continue;}
    if(!previewOnly)await ref.set({...d,_seeded:true,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    seedLog(`  ${previewOnly?"WOULD ADD":"ADDED"} dept: ${d.name}`,logEl);
  }
  /* Gift Requests */
  let added=0,skipped=0;
  for(const r of SEED_REQUESTS){
    const existing=await db.collection("giftRequests").where("giftName","==",r.giftName).where("occasion","==",r.occasion).where("plantId","==",r.plantId).limit(1).get();
    if(!existing.empty){skipped++;continue;}
    const payload={...r,estimatedTotal:r.requestedQuantity*(r.estimatedUnitCost||0),requestedBy:"seeder",_seeded:true,createdAt:firebase.firestore.FieldValue.serverTimestamp()};
    if(!previewOnly)await db.collection("giftRequests").add(payload);
    added++;
  }
  seedLog(`  ${previewOnly?"WOULD ADD":"ADDED"} ${added} gift requests, skipped ${skipped} existing.`,logEl);
  seedLog(`\n${label} Done.${previewOnly?" No data was written.":""}`,logEl);
  if(!previewOnly){await loadMasters();await renderDashboard();message("Demo data seeded successfully.","success");}
}

async function wipeSeededData(){
  if(!confirm("This will delete all records tagged as seeded (plants, departments, gift requests). Real user accounts are NOT touched. Continue?"))return;
  const logEl=$("seedLog");logEl.textContent="";logEl.style.display="block";
  seedLog("WIPE starting...",logEl);
  let total=0;
  for(const col of ["plants","departments","giftRequests"]){
    const snap=await db.collection(col).where("_seeded","==",true).get();
    for(const d of snap.docs){await d.ref.delete();total++;}
    seedLog(`  Deleted ${snap.size} from ${col}`,logEl);
  }
  seedLog(`\nWIPE done — ${total} records removed.`,logEl);
  await loadMasters();await renderDashboard();message("Seeded data wiped.","success");
}
loadMasters().catch(err=>message("Master data is not configured yet. Super Admin must add plants and departments in Firestore. "+err.message,"error"));
