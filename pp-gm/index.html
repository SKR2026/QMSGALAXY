<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gift Management System</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --primary:#2563eb;--primary-dark:#1d4ed8;--primary-light:#eff6ff;
    --success:#16a34a;--warn:#d97706;--danger:#dc2626;--info:#0891b2;
    --bg:#f1f5f9;--surface:#fff;--border:#e2e8f0;
    --text:#0f172a;--muted:#64748b;--radius:10px;
    --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 12px rgba(0,0,0,.04);
    --shadow-md:0 4px 16px rgba(0,0,0,.12);
  }
  body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
  a{color:var(--primary)}
  /* ── Layout ── */
  header{background:var(--primary);color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px rgba(37,99,235,.4)}
  header h1{font-size:18px;font-weight:700;letter-spacing:-.3px}
  header small{opacity:.8;font-size:12px;display:block;margin-top:1px}
  .wrap{max-width:1300px;margin:0 auto;padding:24px 16px}
  /* ── Notice ── */
  .notice{padding:10px 14px;border-radius:var(--radius);font-size:13px;margin-bottom:14px;border-left:4px solid var(--primary);background:var(--primary-light);color:var(--primary-dark)}
  .notice.error{background:#fef2f2;border-color:var(--danger);color:#991b1b}
  .notice.success{background:#f0fdf4;border-color:var(--success);color:#14532d}
  .notice.hidden{display:none}
  /* ── Panel / Card ── */
  .panel{background:var(--surface);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);margin-bottom:16px}
  /* ── Tabs ── */
  .tabs{display:flex;gap:4px;border-bottom:2px solid var(--border);margin-bottom:20px;padding-bottom:0}
  .tabs button{background:none;border:none;padding:9px 16px;cursor:pointer;font-size:13px;font-weight:500;color:var(--muted);border-radius:6px 6px 0 0;border-bottom:2px solid transparent;margin-bottom:-2px;transition:.15s}
  .tabs button:hover{background:var(--bg);color:var(--text)}
  .tabs button.active{color:var(--primary);border-bottom-color:var(--primary);background:var(--primary-light)}
  .tabs button.hidden{display:none}
  /* ── Forms ── */
  label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
  input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:6px;font-size:14px;font-family:inherit;background:var(--surface);color:var(--text);transition:.15s}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
  textarea{resize:vertical;min-height:70px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
  .actions{margin-top:18px;display:flex;gap:8px;flex-wrap:wrap}
  /* ── Buttons ── */
  button{padding:9px 16px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;border:none;transition:.15s;font-family:inherit}
  button:not(.secondary):not(.danger){background:var(--primary);color:#fff}
  button:not(.secondary):not(.danger):hover{background:var(--primary-dark)}
  button.secondary{background:var(--bg);color:var(--text);border:1px solid var(--border)}
  button.secondary:hover{background:var(--border)}
  button.danger{background:var(--danger);color:#fff}
  button.danger:hover{background:#b91c1c}
  /* ── Tables ── */
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;padding:10px 12px;background:var(--bg);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);border-bottom:2px solid var(--border)}
  td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:#fafbfc}
  /* ── Status badges ── */
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
  .badge-pending_plant_review{background:#fef3c7;color:#92400e}
  .badge-pending_top_management{background:#ede9fe;color:#4c1d95}
  .badge-approved{background:#d1fae5;color:#065f46}
  .badge-partially_approved{background:#e0f2fe;color:#0c4a6e}
  .badge-distributed{background:#f0fdf4;color:#14532d;border:1px solid #bbf7d0}
  .badge-returned{background:#fff7ed;color:#9a3412}
  .badge-rejected{background:#fee2e2;color:#991b1b}
  /* ── Account area ── */
  #accountArea{display:flex;align-items:center;gap:10px;font-size:13px}
  #accountArea .user-pill{background:rgba(255,255,255,.18);border-radius:20px;padding:4px 12px;font-weight:600}
  /* ── KPI Tiles ── */
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin-bottom:22px}
  .kpi-tile{background:var(--surface);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);border-left:4px solid var(--border);position:relative;overflow:hidden}
  .kpi-tile .kpi-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .kpi-tile .kpi-value{font-size:32px;font-weight:800;line-height:1.1;margin:6px 0 2px}
  .kpi-tile .kpi-sub{font-size:11px;color:var(--muted)}
  .kpi-tile .kpi-icon{position:absolute;right:14px;top:14px;font-size:28px;opacity:.18}
  .kpi-tile.blue{border-left-color:var(--primary)}.kpi-tile.blue .kpi-value{color:var(--primary)}
  .kpi-tile.amber{border-left-color:#f59e0b}.kpi-tile.amber .kpi-value{color:#b45309}
  .kpi-tile.green{border-left-color:var(--success)}.kpi-tile.green .kpi-value{color:var(--success)}
  .kpi-tile.teal{border-left-color:var(--info)}.kpi-tile.teal .kpi-value{color:var(--info)}
  .kpi-tile.purple{border-left-color:#7c3aed}.kpi-tile.purple .kpi-value{color:#7c3aed}
  /* ── Chart grid ── */
  .chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
  .chart-grid.three{grid-template-columns:1fr 1fr 1fr}
  @media(max-width:900px){.chart-grid,.chart-grid.three{grid-template-columns:1fr}}
  .chart-card{background:var(--surface);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
  .chart-card h3{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--border)}
  .chart-card.full{grid-column:1/-1}
  /* ── Seed / Wipe box ── */
  .seed-box{background:var(--bg);border:1px dashed var(--border);border-radius:var(--radius);padding:20px;margin-top:20px}
  .seed-box h3{margin-bottom:8px;font-size:15px}
  .seed-preview{display:flex;gap:16px;flex-wrap:wrap;margin:12px 0}
  .seed-preview div{background:var(--surface);border-radius:6px;padding:10px 14px;font-size:12px;border:1px solid var(--border);min-width:140px}
  .seed-preview div strong{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-bottom:3px}
  #seedLog{display:none;background:#0f172a;color:#94a3b8;border-radius:8px;padding:14px;font-size:12px;font-family:monospace;white-space:pre-wrap;margin-top:12px;max-height:220px;overflow-y:auto}
  .wipe-box{background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:14px;margin-top:14px}
  .wipe-box h4{margin:0 0 6px;font-size:13px;color:#991b1b}
  .wipe-box p{margin:0 0 10px;font-size:12px;color:#6b2222}
  /* ── Top gifts table ── */
  .top-gifts-wrap{overflow:auto}
  .empty-state{text-align:center;padding:40px 20px;color:var(--muted)}
  .empty-state .empty-icon{font-size:40px;margin-bottom:10px}
</style>
</head>
<body>
<header>
  <div>
    <h1>🎁 Gift Management System</h1>
    <small>Centralized multi-plant gift requests &amp; distribution</small>
  </div>
  <div id="accountArea"></div>
</header>
<main class="wrap">
  <div id="message" class="notice hidden"></div>

  <!-- AUTH -->
  <section id="authPanel" class="panel">
    <div class="tabs">
      <button id="loginTab" class="active" type="button">Sign in</button>
      <button id="registerTab" type="button">Create employee account</button>
    </div>
    <form id="loginForm">
      <div class="grid">
        <div><label>Email</label><input id="loginEmail" type="email" required placeholder="you@company.com"></div>
        <div><label>Password</label><input id="loginPassword" type="password" required></div>
      </div>
      <div class="actions"><button>Sign in</button></div>
    </form>
    <form id="registerForm" class="hidden">
      <div class="notice">New accounts are created as pending employees. A Plant Admin or Super Admin must activate the account.</div>
      <div class="grid">
        <div><label>Employee Code *</label><input id="regCode" required></div>
        <div><label>Employee Name *</label><input id="regName" required></div>
        <div><label>Designation *</label><input id="regDesignation" required></div>
        <div><label>Department *</label><select id="regDepartment" required><option value="">Select department</option></select></div>
        <div><label>Plant *</label><select id="regPlant" required><option value="">Select plant</option></select></div>
        <div><label>Email *</label><input id="regEmail" type="email" required></div>
        <div><label>Mobile Number</label><input id="regMobile" inputmode="tel"></div>
        <div><label>Password *</label><input id="regPassword" type="password" minlength="8" required></div>
      </div>
      <div class="actions"><button>Create account</button></div>
    </form>
  </section>

  <!-- APP -->
  <section id="appPanel" class="hidden">
    <div class="panel">
      <h2 id="welcome" style="margin-bottom:16px;font-size:20px"></h2>
      <div class="tabs" id="navTabs">
        <button data-view="dashboard" class="active">📊 Dashboard</button>
        <button data-view="newRequest">➕ New Request</button>
        <button data-view="requests">📋 Gift Requests</button>
        <button data-view="admin">⚙️ Administration</button>
      </div>

      <!-- DASHBOARD -->
      <div id="dashboardView"></div>

      <!-- NEW REQUEST -->
      <div id="newRequestView" class="hidden">
        <h2 style="margin-bottom:18px">Submit Gift Requirement</h2>
        <form id="requestForm">
          <div class="grid">
            <div><label>Occasion / Purpose *</label><input id="occasion" required placeholder="Annual day, festival, employee event…"></div>
            <div><label>Required Distribution Date *</label><input id="distributionDate" type="date" required></div>
            <div><label>Gift Name / Description *</label><input id="giftName" required></div>
            <div><label>Gift Category</label><input id="giftCategory" placeholder="Festival, Employee welfare, Recognition…"></div>
            <div><label>Quantity Requested *</label><input id="quantity" type="number" min="1" required></div>
            <div><label>Estimated Unit Cost (₹)</label><input id="unitCost" type="number" min="0" step="0.01" value="0"></div>
          </div>
          <div style="margin-top:14px"><label>Remarks</label><textarea id="remarks"></textarea></div>
          <div class="actions"><button>Submit for Plant Admin review</button></div>
        </form>
      </div>

      <!-- REQUESTS LIST -->
      <div id="requestsView" class="hidden"></div>

      <!-- ADMIN -->
      <div id="adminView" class="hidden"></div>
    </div>
  </section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
/* ═══════════════════════════════════════════════
   Firebase Config
═══════════════════════════════════════════════ */
const firebaseConfig={
  apiKey:"AIzaSyBryzulLu3jz3pmq_RNRQ3b_mF_QlbC4AU",
  authDomain:"skr-gm.firebaseapp.com",
  projectId:"skr-gm",
  storageBucket:"skr-gm.firebasestorage.app",
  messagingSenderId:"640823488079",
  appId:"1:640823488079:web:a6282b402301a10182843a",
  measurementId:"G-QSHMGXMXFD"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(), db=firebase.firestore();
let currentUser=null, profile=null, activeView="dashboard";
// Store chart instances for cleanup
const charts={};

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ── Role normalisation ── */
function normaliseRole(r){
  const map={"super admin":"superadmin","superadmin":"superadmin","plant admin":"plant_admin","plant_admin":"plant_admin","top management":"top_management","top_management":"top_management","employee":"employee"};
  return map[(r||"").toLowerCase().trim()]||((r||"").toLowerCase().replace(/\s+/g,"_"));
}
function message(msg,type="notice"){$("message").textContent=msg;$("message").className="notice "+type;}
function clearMessage(){$("message").className="notice hidden";}
function setAuthMode(mode){
  $("loginForm").classList.toggle("hidden",mode!=="login");
  $("registerForm").classList.toggle("hidden",mode!=="register");
  $("loginTab").classList.toggle("active",mode==="login");
  $("registerTab").classList.toggle("active",mode==="register");
}
$("loginTab").onclick=()=>setAuthMode("login");
$("registerTab").onclick=()=>setAuthMode("register");

/* ── Load masters into registration dropdowns ── */
async function loadMasters(){
  for(const [col,selId,label] of [["plants","regPlant","name"],["departments","regDepartment","name"]]){
    const sel=$(selId);
    sel.innerHTML=`<option value="">Select ${col==="plants"?"plant":"department"}</option>`;
    const snap=await db.collection(col).orderBy(label).get();
    snap.forEach(d=>{const x=d.data();sel.insertAdjacentHTML("beforeend",`<option value="${esc(d.id)}">${esc(x[label]||d.id)}</option>`);});
  }
}

/* ── Login ── */
$("loginForm").addEventListener("submit",async e=>{
  e.preventDefault();clearMessage();
  try{await auth.signInWithEmailAndPassword($("loginEmail").value.trim(),$("loginPassword").value);}
  catch(err){message(err.message,"error");}
});

/* ── Register with duplicate email guard ── */
$("registerForm").addEventListener("submit",async e=>{
  e.preventDefault();clearMessage();
  try{
    const code=$("regCode").value.trim();
    const email=$("regEmail").value.trim();

    // Check duplicate employee code
    const dupCode=await db.collection("users").where("employeeCode","==",code).limit(1).get();
    if(!dupCode.empty) throw new Error("This Employee Code is already registered. Please contact your administrator.");

    // ── NEW: Check duplicate email ──
    const dupEmail=await db.collection("users").where("email","==",email).limit(1).get();
    if(!dupEmail.empty) throw new Error("This email address is already registered. Please sign in or use a different email.");

    const cred=await auth.createUserWithEmailAndPassword(email,$("regPassword").value);
    await db.collection("users").doc(cred.user.uid).set({
      employeeCode:code,name:$("regName").value.trim(),
      designation:$("regDesignation").value.trim(),
      departmentId:$("regDepartment").value,plantId:$("regPlant").value,
      email,mobile:$("regMobile").value.trim(),
      role:"employee",status:"pending",
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });
    message("Account created. It will be available after administrator activation.","success");
    await auth.signOut();setAuthMode("login");
  }catch(err){message(err.message,"error");}
});

/* ── Auth state ── */
auth.onAuthStateChanged(async user=>{
  currentUser=user;profile=null;
  if(!user){
    $("authPanel").classList.remove("hidden");
    $("appPanel").classList.add("hidden");
    $("accountArea").innerHTML="";
    return;
  }
  try{
    const doc=await db.collection("users").doc(user.uid).get();
    if(!doc.exists){await auth.signOut();message("User profile not found. Contact the administrator.","error");return;}
    const raw=doc.data();
    profile={...raw,role:normaliseRole(raw.role),name:raw.name||raw.email||"User"};
    if(profile.status!=="active"){await auth.signOut();message("Your account is pending activation. Please contact your Plant Admin.","error");return;}
    $("authPanel").classList.add("hidden");
    $("appPanel").classList.remove("hidden");
    $("accountArea").innerHTML=`<span class="user-pill">👤 ${esc(profile.name)}</span><span style="opacity:.7;font-size:12px">${esc(profile.role)}</span><button class="secondary" id="logoutBtn" style="padding:5px 12px;font-size:12px">Sign out</button>`;
    $("logoutBtn").onclick=()=>auth.signOut();
    $("welcome").textContent=`Welcome, ${profile.name} 👋`;
    configureNavigation();
    await renderDashboard();
    await loadRequests();
  }catch(err){message(err.message,"error");}
});

function configureNavigation(){
  document.querySelectorAll("#navTabs button").forEach(b=>{
    const view=b.dataset.view;
    b.classList.toggle("hidden",view==="admin"&&!["superadmin","plant_admin"].includes(profile.role));
    b.onclick=()=>showView(view);
  });
}
function showView(view){
  activeView=view;
  ["dashboard","newRequest","requests","admin"].forEach(v=>$(v+"View").classList.toggle("hidden",v!==view));
  document.querySelectorAll("#navTabs button").forEach(b=>b.classList.toggle("active",b.dataset.view===view));
  if(view==="requests")loadRequests();
  if(view==="admin")renderAdmin();
}

/* ═══════════════════════════════════════════════
   DASHBOARD
═══════════════════════════════════════════════ */
function destroyChart(key){
  if(charts[key]){charts[key].destroy();delete charts[key];}
}

function mkChart(canvasId,key,type,data,options={}){
  destroyChart(key);
  const ctx=document.getElementById(canvasId);
  if(!ctx)return;
  charts[key]=new Chart(ctx,{type,data,options:{
    responsive:true,maintainAspectRatio:false,
    plugins:{legend:{labels:{font:{size:11},boxWidth:12}},tooltip:{mode:"index"}},
    ...options
  }});
}

const PALETTE=[
  "#2563eb","#16a34a","#d97706","#dc2626","#7c3aed","#0891b2","#db2777","#65a30d"
];
const STATUS_COLORS={
  pending_plant_review:"#f59e0b",
  pending_top_management:"#8b5cf6",
  approved:"#16a34a",
  partially_approved:"#0891b2",
  distributed:"#059669",
  returned:"#f97316",
  rejected:"#ef4444"
};
const STATUS_LABELS={
  pending_plant_review:"Pending (Plant)",
  pending_top_management:"Pending (Mgmt)",
  approved:"Approved",
  partially_approved:"Partial Approved",
  distributed:"Distributed",
  returned:"Returned",
  rejected:"Rejected"
};

async function renderDashboard(){
  const dv=$("dashboardView");
  dv.innerHTML=`<div style="text-align:center;padding:30px;color:var(--muted)">⏳ Loading dashboard data…</div>`;

  try{
    // Fetch data in parallel
    const [reqSnap,plantSnap,deptSnap]=await Promise.all([
      visibleRequests(),
      db.collection("plants").get(),
      db.collection("departments").get()
    ]);

    // Build lookup maps
    const plantMap={};
    plantSnap.forEach(d=>plantMap[d.id]=d.data().name||d.id);
    const deptMap={};
    deptSnap.forEach(d=>deptMap[d.id]=d.data().name||d.id);

    // Aggregate
    const all=[];
    reqSnap.forEach(d=>all.push({id:d.id,...d.data()}));

    const totalValue=all.reduce((s,r)=>s+(Number(r.estimatedTotal)||0),0);
    const countByStatus={};
    const plantCatMap={}; // {plantId: {category: qty}}
    const deptCatMap={};  // {deptId: {category: qty}}
    const monthMap={};    // {YYYY-MM: count}
    const giftMap={};     // {giftName: total qty}

    all.forEach(r=>{
      // Status counts
      countByStatus[r.status]=(countByStatus[r.status]||0)+1;
      // Plant × Category
      const pn=plantMap[r.plantId]||r.plantId||"Unknown";
      const cat=r.giftCategory||"Uncategorised";
      if(!plantCatMap[pn])plantCatMap[pn]={};
      plantCatMap[pn][cat]=(plantCatMap[pn][cat]||0)+(Number(r.requestedQuantity)||0);
      // Dept × Category
      const dn=deptMap[r.departmentId]||r.departmentId||"Unknown";
      if(!deptCatMap[dn])deptCatMap[dn]={};
      deptCatMap[dn][cat]=(deptCatMap[dn][cat]||0)+(Number(r.requestedQuantity)||0);
      // Monthly trend
      let mo="Unknown";
      if(r.createdAt&&r.createdAt.toDate){const d=r.createdAt.toDate();mo=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");}
      else if(r.distributionDate){mo=r.distributionDate.substring(0,7);}
      monthMap[mo]=(monthMap[mo]||0)+1;
      // Top gifts by qty
      const gn=r.giftName||"Unknown";
      giftMap[gn]=(giftMap[gn]||0)+(Number(r.requestedQuantity)||0);
    });

    // KPIs
    const pending=all.filter(r=>["pending_plant_review","pending_top_management","returned"].includes(r.status)).length;
    const approved=all.filter(r=>["approved","partially_approved"].includes(r.status)).length;
    const distributed=all.filter(r=>r.status==="distributed").length;

    // Render HTML structure
    dv.innerHTML=`
      <!-- KPI Tiles -->
      <div class="kpi-grid">
        <div class="kpi-tile blue"><div class="kpi-icon">📦</div><div class="kpi-label">Total Requests</div><div class="kpi-value">${all.length}</div><div class="kpi-sub">All gift requests</div></div>
        <div class="kpi-tile amber"><div class="kpi-icon">⏳</div><div class="kpi-label">Pending / Returned</div><div class="kpi-value">${pending}</div><div class="kpi-sub">Awaiting action</div></div>
        <div class="kpi-tile green"><div class="kpi-icon">✅</div><div class="kpi-label">Approved</div><div class="kpi-value">${approved}</div><div class="kpi-sub">Ready to procure</div></div>
        <div class="kpi-tile teal"><div class="kpi-icon">🚚</div><div class="kpi-label">Distributed</div><div class="kpi-value">${distributed}</div><div class="kpi-sub">Fulfilled requests</div></div>
        <div class="kpi-tile purple"><div class="kpi-icon">💰</div><div class="kpi-label">Est. Total Value</div><div class="kpi-value">₹${(totalValue/1000).toFixed(1)}K</div><div class="kpi-sub">Across all requests</div></div>
      </div>

      <!-- Row 1: Plant-wise + Status donut -->
      <div class="chart-grid">

/* ── Visible requests query (role-aware) ── */
function visibleRequests(){
  let q=db.collection("giftRequests");
  if(profile.role==="employee")q=q.where("requestedBy","==",currentUser.uid);
  else if(profile.role==="plant_admin")q=q.where("plantId","==",profile.plantId);
  return q.orderBy("createdAt","desc").limit(300).get();
}

$("requestForm").addEventListener("submit",async e=>{
  e.preventDefault();
  try{
    const qty=Number($("quantity").value),cost=Number($("unitCost").value||0);
    await db.collection("giftRequests").add({
      occasion:$("occasion").value.trim(),distributionDate:$("distributionDate").value,
      giftName:$("giftName").value.trim(),giftCategory:$("giftCategory").value.trim(),
      requestedQuantity:qty,estimatedUnitCost:cost,estimatedTotal:qty*cost,

});

async function loadRequests(){
  try{
    const snap=await visibleRequests();
    let rows=[];
    snap.forEach(d=>{
      const x=d.data();
      const statusClass=`badge badge-${x.status}`;
      rows.push(`<tr>
        <td><strong>${esc(x.giftName)}</strong><br><small style="color:var(--muted)">${esc(x.occasion)}</small></td>
        <td>${esc(x.giftCategory||"—")}</td>
        <td style="text-align:right">${esc(x.requestedQuantity)}</td>
        <td style="text-align:right">₹${Number(x.estimatedTotal||0).toLocaleString("en-IN")}</td>
        <td><span class="${statusClass}">${esc((x.status||"").replace(/_/g," "))}</span></td>
        <td>${esc(x.requesterName||"")}</td>
        <td>${requestActions(d.id,x)}</td>
      </tr>`);
    });
    $("requestsView").innerHTML=`
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <h2>Gift Requests</h2>
        <span style="font-size:12px;color:var(--muted)">${snap.size} requests</span>
      </div>
      <div style="overflow:auto">
        <table>
          <thead><tr><th>Gift / Occasion</th><th>Category</th><th style="text-align:right">Qty</th><th style="text-align:right">Est. Total</th><th>Status</th><th>Requested By</th><th>Action</th></tr></thead>
          <tbody>${rows.join("")||'<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:30px">No requests found.</td></tr>'}</tbody>
        </table>
      </div>`;
    $("requestsView").querySelectorAll("[data-action]").forEach(b=>b.onclick=()=>processRequest(b.dataset.id,b.dataset.action));
  }catch(err){$("requestsView").innerHTML=`<div class="notice error">${esc(err.message)}</div>`;}
}

function requestActions(id,x){
  if(profile.role==="plant_admin"&&x.status==="pending_plant_review")
    return `<button data-id="${id}" data-action="forward" style="font-size:12px;padding:5px 10px">Forward ➜</button> <button class="secondary" data-id="${id}" data-action="return" style="font-size:12px;padding:5px 10px">Return</button>`;
  if(["top_management","superadmin"].includes(profile.role)&&["pending_top_management","returned"].includes(x.status))
    return `<button data-id="${id}" data-action="approve" style="font-size:12px;padding:5px 10px">Approve</button> <button class="secondary" data-id="${id}" data-action="partial" style="font-size:12px;padding:5px 10px">Partial</button> <button class="danger" data-id="${id}" data-action="reject" style="font-size:12px;padding:5px 10px">Reject</button>`;
  return `<span style="color:var(--muted)">—</span>`;
}

async function processRequest(id,action){
  try{
    const ref=db.collection("giftRequests").doc(id);
    const snap=await ref.get();const x=snap.data();
    let update={updatedAt:firebase.firestore.FieldValue.serverTimestamp(),lastActionBy:currentUser.uid};
    if(action==="forward")update.status="pending_top_management";
    if(action==="return"){update.status="returned";update.lastComment=prompt("Reason for return:")||"";}
    if(action==="approve"){update.status="approved";update.approvedQuantity=x.requestedQuantity;update.approvedBudget=x.estimatedTotal;}
    if(action==="partial"){
      const q=Number(prompt("Enter approved quantity:",x.requestedQuantity));
      if(!Number.isFinite(q)||q<1||q>x.requestedQuantity)return;
      update.status="partially_approved";update.approvedQuantity=q;update.approvedBudget=q*Number(x.estimatedUnitCost||0);
    }
    if(action==="reject"){update.status="rejected";update.lastComment=prompt("Reason for rejection:")||"";}
    await ref.update(update);
    await loadRequests();await renderDashboard();
    message("Request updated successfully.","success");
  }catch(err){message(err.message,"error");}
}

function seedLog(msg,el){el.style.display="block";el.textContent+=msg+"\n";}

async function runSeeder(previewOnly){
  const logEl=$("seedLog");logEl.textContent="";logEl.style.display="block";
  const label=previewOnly?"[PREVIEW]":"[SEED]";
  seedLog(`${label} Starting seeder — ${new Date().toLocaleTimeString()}`,logEl);
  for(const p of SEED_PLANTS){
    const ref=db.collection("plants").doc(p.id);
    const exists=(await ref.get()).exists;
    if(exists){seedLog(`  SKIP plant already exists: ${p.name}`,logEl);continue;}
    if(!previewOnly)await ref.set({...p,_seeded:true,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    seedLog(`  ${previewOnly?"WOULD ADD":"ADDED"} plant: ${p.name}`,logEl);
  }
  for(const d of SEED_DEPTS){
    const ref=db.collection("departments").doc(d.id);
    const exists=(await ref.get()).exists;
    if(exists){seedLog(`  SKIP dept already exists: ${d.name}`,logEl);continue;}
    if(!previewOnly)await ref.set({...d,_seeded:true,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    seedLog(`  ${previewOnly?"WOULD ADD":"ADDED"} dept: ${d.name}`,logEl);
  }
  let added=0,skipped=0;
  for(const r of SEED_REQUESTS){
    const existing=await db.collection("giftRequests").where("giftName","==",r.giftName).where("occasion","==",r.occasion).where("plantId","==",r.plantId).limit(1).get();
    if(!existing.empty){skipped++;continue;}
    const payload={...r,estimatedTotal:r.requestedQuantity*(r.estimatedUnitCost||0),requestedBy:"seeder",_seeded:true,createdAt:firebase.firestore.FieldValue.serverTimestamp()};
    if(!previewOnly)await db.collection("giftRequests").add(payload);
    added++;
  }
  seedLog(`  ${previewOnly?"WOULD ADD":"ADDED"} ${added} gift requests, skipped ${skipped} existing.`,logEl);
  seedLog(`\n${label} Done.${previewOnly?" No data was written.":""}`,logEl);
  if(!previewOnly){await loadMasters();await renderDashboard();message("Demo data seeded successfully.","success");}
}

async function wipeSeededData(){
  if(!confirm("This will delete all records tagged as seeded (plants, departments, gift requests). Real user accounts are NOT touched. Continue?"))return;
  const logEl=$("seedLog");logEl.textContent="";logEl.style.display="block";
  seedLog("WIPE starting…",logEl);
  let total=0;
  for(const col of ["plants","departments","giftRequests"]){
    const snap=await db.collection(col).where("_seeded","==",true).get();
    for(const d of snap.docs){await d.ref.delete();total++;}
    seedLog(`  Deleted ${snap.size} from ${col}`,logEl);
  }
  seedLog(`\nWIPE done — ${total} records removed.`,logEl);
  await loadMasters();await renderDashboard();message("Seeded data wiped.","success");
}
