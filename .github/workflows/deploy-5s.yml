name: Deploy 5S to Firebase Hosting

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Create .env.local
        run: |
          cat > pp-5s/frontend/.env.local << 'ENVEOF'
          VITE_FIREBASE_API_KEY=AIzaSyDQT5qgQkqdm9LxfJERtuIzOPkzqtBp1KA
          VITE_FIREBASE_AUTH_DOMAIN=skr-5s.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID=skr-5s
          VITE_FIREBASE_STORAGE_BUCKET=skr-5s.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID=1011868934450
          VITE_FIREBASE_APP_ID=1:1011868934450:web:65e03ef61096058b25f72b
          VITE_FIREBASE_MEASUREMENT_ID=G-E3LK9SK5W9
          VITE_APP_URL=https://www.qmsgalaxy.com/pp-5s
          VITE_APP_NAME=5S Management System
          VITE_FUNCTIONS_REGION=asia-south1
          ENVEOF

      - name: Install and Build
        run: cd pp-5s/frontend && npm install && npx vite build

      - name: Deploy to Firebase Hosting
        run: cd pp-5s && npx firebase-tools deploy --only hosting --project skr-5s
