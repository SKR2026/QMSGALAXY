name: Deploy 5S to Firebase Hosting
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Create .env.local
        run: printf 'VITE_FIREBASE_API_KEY=AIzaSyDQT5qgQkqdm9LxfJERtuIzOPkzqtBp1KA\nVITE_FIREBASE_AUTH_DOMAIN=skr-5s.firebaseapp.com\nVITE_FIREBASE_PROJECT_ID=skr-5s\nVITE_FIREBASE_STORAGE_BUCKET=skr-5s.firebasestorage.app\nVITE_FIREBASE_MESSAGING_SENDER_ID=1011868934450\nVITE_FIREBASE_APP_ID=1:1011868934450:web:65e03ef61096058b25f72b\nVITE_FIREBASE_MEASUREMENT_ID=G-E3LK9SK5W9\nVITE_APP_URL=https://www.qmsgalaxy.com/pp-5s\nVITE_APP_NAME=5S Management System\nVITE_FUNCTIONS_REGION=asia-south1\n' > pp-5s/frontend/.env.local
      - name: Install and Build
        run: cd pp-5s/frontend && npm install && npx vite build
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.GCP_SA_KEY }}
          projectId: skr-5s
          entryPoint: ./pp-5s
          channelId: live
