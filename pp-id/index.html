function StarRating({ value, onChange, size=34 }) {
  const [hover, setHover] = useState(0);
  const labels = ["","Very Dissatisfied","Dissatisfied","Neutral","Satisfied","Very Satisfied"];
  return (
    <div>
      <div style={{display:"flex",gap:2}}>
        {[1,2,3,4,5].map((v)=>{
          const on = v<=(hover||value||0);
          return (
            <button key={v} type="button"
              onMouseEnter={()=>setHover(v)} onMouseLeave={()=>setHover(0)}
              onClick={()=>onChange(v)}
              style={{background:"none",border:"none",cursor:"pointer",padding:2,fontSize:size,lineHeight:1,
                color:on?"#F5B400":"#C9C4B6",transform:on?"scale(1.1)":"scale(1)",transition:"all 0.1s"}}
              aria-label={labels[v]}
            >★</button>
          );
        })}
      </div>
      <div style={{fontSize:11,color:"#8A8577",marginTop:3,minHeight:16}}>
        {hover?labels[hover]:value?labels[value]:"Click to rate"}
      </div>
    </div>
  );
}

function Gauge({ value, theme }) {
  // Layout
  const W=280, H=190, cx=W/2, cy=128, R=100, trackW=16;
  const cv = Math.min(5, Math.max(0, value||0));

  // Gauge runs from LEFT (angle=180deg = PI) to RIGHT (angle=0deg = 0)
  // value=1 → left end, value=5 → right end
  // needle angle: 1→PI, 5→0, so angle = PI - ((cv-1)/4)*PI
  const needleAngle = Math.PI - ((cv - 1) / 4) * Math.PI;

  // Convert polar angle (0=right, PI=left, measured CCW from positive-x) to SVG x,y
  // We use standard math: x = cx + r*cos(angle), y = cy - r*sin(angle)
  const pt = (angle, rad) => ({
    x: cx + rad * Math.cos(angle),
    y: cy  - rad * Math.sin(angle),
  });

  // Full background arc: from PI (left) sweeping clockwise to 0 (right)
  const arcPath = (startA, endA, rad) => {
    const s = pt(startA, rad), e = pt(endA, rad);
    // large-arc-flag: 1 if span > 180deg
    const span = startA - endA; // positive = sweeping right (clockwise in SVG)
    const large = span > Math.PI ? 1 : 0;
    // sweep-flag 0 = counter-clockwise in SVG coords (but our y is flipped so this draws correct arc)
    return `M ${s.x} ${s.y} A ${rad} ${rad} 0 ${large} 0 ${e.x} ${e.y}`;
  };

  // Colour arc end angle = needleAngle
  const sc = cv < 2 ? "#E8552D" : cv < 3.5 ? "#F5B400" : "#4C9A6A";
  const panelBg  = theme==="dark" ? "#161A22" : "#FFFFFF";
  const panelBdr = theme==="dark" ? "#252B38" : "#DCD7C9";
  const trackBg  = theme==="dark" ? "#252B38" : "#E0DDD8";
  const sub      = theme==="dark" ? "#5A6478" : "#8A8577";
  const needleC  = theme==="dark" ? "#E8E6F0" : "#1A1D2E";

  // Needle tip and base points
  const tipPt  = pt(needleAngle, R - trackW/2 - 6);
  const baseL  = pt(needleAngle + Math.PI/2, 7);
  const baseR  = pt(needleAngle - Math.PI/2, 7);
  const needle = `${tipPt.x},${tipPt.y} ${baseL.x},${baseL.y} ${baseR.x},${baseR.y}`;
  const shadow = `${tipPt.x+2},${tipPt.y+2} ${baseL.x+2},${baseL.y+2} ${baseR.x+2},${baseR.y+2}`;

  // Tick marks & labels: value 1 at PI, value 5 at 0
  const ticks = [1, 2, 3, 4, 5].map((v) => {
    const a = Math.PI - ((v - 1) / 4) * Math.PI;
    const inner = pt(a, R - trackW/2 - 1);
    const outer = pt(a, R + trackW/2 + 1);
    const label = pt(a, R - trackW/2 - 14);
    return { v, a, inner, outer, label };
  });

  return (
    <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`} style={{display:"block",margin:"0 auto"}}>
      <defs>
        {/* gradient left=red(1) → mid=yellow(3) → right=green(5) */}
        <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%"   stopColor="#E8552D"/>
          <stop offset="50%"  stopColor="#F5B400"/>
          <stop offset="100%" stopColor="#4C9A6A"/>
        </linearGradient>
        <filter id="gaugeShadow">
          <feDropShadow dx="0" dy="2" stdDeviation="2" floodOpacity="0.13"/>
        </filter>
      </defs>

      {/* Track background */}
      <path d={arcPath(Math.PI, 0, R)} stroke={trackBg} strokeWidth={trackW} fill="none" strokeLinecap="round"/>

      {/* Coloured fill from left up to needle position */}
      {cv > 0 && (
        <path d={arcPath(Math.PI, needleAngle, R)} stroke="url(#gaugeGrad)" strokeWidth={trackW} fill="none" strokeLinecap="round"/>
      )}

      {/* Tick marks */}
      {ticks.map(({v, inner, outer, label}) => (
        <g key={v}>
          <line x1={inner.x} y1={inner.y} x2={outer.x} y2={outer.y}
            stroke={theme==="dark"?"rgba(255,255,255,0.15)":"rgba(0,0,0,0.18)"} strokeWidth="1.5"/>
          {(v===1||v===3||v===5) && (
            <text x={label.x} y={label.y+4} textAnchor="middle"
              fontFamily="'IBM Plex Mono',monospace" fontSize="10" fontWeight="700" fill={sub}>{v}</text>
          )}
        </g>
      ))}

      {/* Score pill — drawn BEFORE needle so needle is always on top */}
      <rect x={cx-50} y={cy+16} width={100} height={52} rx={12}
        fill={panelBg} stroke={panelBdr} strokeWidth="1.5" filter="url(#gaugeShadow)"/>
      <text x={cx} y={cy+46} textAnchor="middle"
        fontFamily="'IBM Plex Mono',monospace" fontSize="28" fontWeight="700" fill={sc}>
        {fmt1(value)}
      </text>
      <text x={cx} y={cy+62} textAnchor="middle"
        fontFamily="Inter,sans-serif" fontSize="7.5" letterSpacing="1.8" fill={sub} fontWeight="600">
        OUT OF 5.0
      </text>

      {/* Needle shadow */}
      <polygon points={shadow} fill="rgba(0,0,0,0.12)"/>
      {/* Needle — rendered last so always visible on top */}
      <polygon points={needle} fill={needleC} strokeLinejoin="round"/>

      {/* Pivot outer ring — on top of needle base */}
      <circle cx={cx} cy={cy} r="12" fill={panelBg} stroke={panelBdr} strokeWidth="2"/>
      {/* Pivot dot */}
      <circle cx={cx} cy={cy} r="5"  fill={sc}/>
    </svg>
  );
}

    <div style={{

function StatCard({label,value,sub,accent}){
  const vs=String(value),fs=vs.length>12?18:vs.length>8?24:32;
  return (<div className="stat-card"><div className="stat-label">{label}</div><div className="stat-value" style={{fontSize:fs,...(accent?{color:accent}:{})}}>{value}</div>{sub&&<div className="stat-sub">{sub}</div>}</div>);
}

function SurveyForm({onSubmit,logoUrl,plants,departments,shifts,ratingGuidelines}){
  const [step,setStep]=useState(1);
  const [plant,setPlant]=useState(plants.length===1?plants[0]:"");
  const [myDept,setMyDept]=useState("");
  const [shift,setShift]=useState("");
  const [tenure,setTenure]=useState("");
  const [anonymous,setAnonymous]=useState(true);
  const [empName,setEmpName]=useState("");
  const [empCode,setEmpCode]=useState("");
  const [ratings,setRatings]=useState({});
  const [error,setError]=useState("");
  const [done,setDone]=useState(false);
  const [saving,setSaving]=useState(false);

  const ratableDepts=useMemo(()=>departments.filter((d)=>d!==myDept),[departments,myDept]);
  const setRating=(dept,v)=>setRatings((p)=>({...p,[dept]:{...(p[dept]||{}),rating:v}}));
  const setComment=(dept,v)=>setRatings((p)=>({...p,[dept]:{...(p[dept]||{}),comment:v}}));

  const handleNext=()=>{
    if((plants.length>1&&!plant)||!myDept||!shift||!tenure){setError("Please fill in all fields before continuing.");return;}
    setError("");setStep(2);window.scrollTo(0,0);
  };

  const handleSubmit=async()=>{
    const rated=ratableDepts.filter((d)=>ratings[d]&&ratings[d].rating);
    if(!rated.length){setError("Please rate at least one department before submitting.");return;}
    setError("");setSaving(true);
    const payload={
      id:`r-${Date.now()}-${Math.floor(Math.random()*10000)}`,
      ts:new Date().toISOString(),
      plant:plant||plants[0]||"",
      submitterDept:myDept,shift,tenure,anonymous,
      employeeCode:empCode.trim(),
      employeeName:anonymous?"":empName.trim(),
      deptRatings:Object.fromEntries(rated.map((d)=>[d,{rating:ratings[d].rating,comment:(ratings[d].comment||"").trim()}])),
    };
    try{await onSubmit(payload);setSaving(false);setDone(true);
      setPlant(plants.length===1?plants[0]:"");setMyDept("");setShift("");setTenure("");
      setEmpCode("");setEmpName("");setRatings({});setStep(1);
    }catch(e){setError((e&&(e.message||e.code))||String(e));setSaving(false);}
  };

  if(done)return(
    <div className="paper-card"><div className="paper-inner" style={{textAlign:"center",padding:"3rem 1.5rem"}}>
      <div style={{fontSize:48,marginBottom:8}}>✓</div>
      <h2 className="form-title" style={{marginBottom:8}}>Survey Submitted</h2>
      <p style={{color:"#5B5A52",marginBottom:24}}>Thank you! Your ratings are now reflected in the dashboard.</p>
      <button className="submit-btn" onClick={()=>setDone(false)}>Submit another response</button>
    </div></div>
  );

  return(
    <div className="paper-card">
      <div className="step-bar">
        <div className={"step-pip"+(step===1?" active":step>1?" done":"")}>{step>1?"✓":"1"}</div>
        <div className="step-line"/>
        <div className={"step-pip"+(step===2?" active":"")}>2</div>
        <div className="step-labels"><span>Your Info</span><span>Rate Departments</span></div>
      </div>
      <div className="paper-inner">
        {logoUrl&&<img src={logoUrl} alt="Logo" className="form-logo"/>}
        {step===1&&(<>
          <h2 className="form-title">Inter-Department Satisfaction</h2>
          <p className="form-sub">Step 1 of 2 — Enter your details. Your own department will be excluded from ratings.</p>
          <div className="field-row">
            <div className="field"><label>Employee Code (optional)</label><input className="name-input" placeholder="e.g. EMP1043" value={empCode} onChange={(e)=>setEmpCode(e.target.value)}/></div>
            <div className="field"><label>Employee Name (optional)</label><input className="name-input" placeholder="Your name" value={empName} onChange={(e)=>setEmpName(e.target.value)}/></div>
          </div>
          <div className="field-row">
            {plants.length>1&&<div className="field"><label>Plant</label><select value={plant} onChange={(e)=>setPlant(e.target.value)}><option value="">Select plant</option>{plants.map((p)=><option key={p} value={p}>{p}</option>)}</select></div>}
            <div className="field"><label>Your Department</label><select value={myDept} onChange={(e)=>{setMyDept(e.target.value);setRatings({});}}><option value="">Select your department</option>{departments.map((d)=><option key={d} value={d}>{d}</option>)}</select></div>
            <div className="field"><label>Shift</label><select value={shift} onChange={(e)=>setShift(e.target.value)}><option value="">Select shift</option>{shifts.map((s)=><option key={s} value={s}>{s}</option>)}</select></div>
            <div className="field"><label>Tenure</label><select value={tenure} onChange={(e)=>setTenure(e.target.value)}><option value="">Select tenure</option>{TENURE_OPTIONS.map((t)=><option key={t} value={t}>{t}</option>)}</select></div>
          </div>
          <div className="anon-row"><label className="check-label"><input type="checkbox" checked={anonymous} onChange={(e)=>setAnonymous(e.target.checked)}/>Submit anonymously</label></div>
          {error&&<div className="error-msg">{error}</div>}
          <button className="submit-btn" onClick={handleNext}>Continue to Rate Departments →</button>
        </>)}
        {step===2&&(<>
          <h2 className="form-title">Rate Other Departments</h2>
          <p className="form-sub">Step 2 of 2 — Rate each department you interact with. <strong>{myDept}</strong> is excluded.</p>
          {ratableDepts.length===0
            ?<div className="error-msg">No other departments found. Add more in Settings.</div>
            :<div className="dept-grid">
              {ratableDepts.map((dept)=>{
                const r=ratings[dept]||{};
                return(
                  <div key={dept} className={"dept-card"+(r.rating?" rated":"")}>
                    <div className="dept-card-name">{dept}</div>
                    <StarRating value={r.rating||0} onChange={(v)=>setRating(dept,v)}/>
                    <div className="field" style={{marginTop:10}}>
                      <label style={{fontSize:11,color:"#5B5A52"}}>Comment (optional)</label>
                      <textarea rows={2} placeholder="Any specific feedback..." value={r.comment||""} onChange={(e)=>setComment(dept,e.target.value)}/>
                    </div>
                  </div>
                );
              })}
            </div>
          }
          {error&&<div className="error-msg">{error}</div>}
          <div style={{display:"flex",gap:12,marginTop:16,flexWrap:"wrap"}}>
            <button className="submit-btn" style={{background:"#6C7A89"}} onClick={()=>{setStep(1);setError("");}}>← Back</button>
            <button className="submit-btn" onClick={handleSubmit} disabled={saving}>{saving?"Submitting…":"Submit Survey"}</button>
          </div>
        </>)}
      </div>
    </div>
  );
}

function Dashboard({responses,theme,plants,departments,shifts,companyName,logoUrl,onDeleteResponses}){
  const [pf,setPf]=useState(ALL_PLANTS_ID);
  const [rf,setRf]=useState("All");
  const [ff,setFf]=useState("All");
  const [selIds,setSelIds]=useState({});
  const [bulkBusy,setBulkBusy]=useState(false);
  const [bulkErr,setBulkErr]=useState("");
  const [expBusy,setExpBusy]=useState(false);
  const ct=CHART_THEME[theme]||CHART_THEME.dark;

  const flatRows=useMemo(()=>{
    const rows=[];
    responses.forEach((r)=>{Object.entries(r.deptRatings||{}).forEach(([dept,info])=>{rows.push({...r,ratedDept:dept,rating:info.rating||0,comment:info.comment||"",_fid:`${r.id}__${dept}`});});});
    return rows;
  },[responses]);

  const filtered=useMemo(()=>flatRows.filter((r)=>(pf===ALL_PLANTS_ID||r.plant===pf)&&(rf==="All"||r.ratedDept===rf)&&(ff==="All"||r.submitterDept===ff)),[flatRows,pf,rf,ff]);
  const overall=useMemo(()=>{const v=filtered.filter((r)=>r.rating>0);return v.length?v.reduce((s,r)=>s+r.rating,0)/v.length:0;},[filtered]);

  const deptData=useMemo(()=>{
    const m={};
    filtered.forEach((r)=>{if(!r.rating)return;if(!m[r.ratedDept])m[r.ratedDept]={total:0,count:0};m[r.ratedDept].total+=r.rating;m[r.ratedDept].count+=1;});
    return Object.entries(m).map(([name,d])=>({name,score:parseFloat((d.total/d.count).toFixed(2)),count:d.count})).sort((a,b)=>b.score-a.score);
  },[filtered]);

  const topDept=deptData[0],lowDept=deptData.length>1?deptData[deptData.length-1]:null;

  const trendData=useMemo(()=>{
    const wm={};
    filtered.forEach((r)=>{if(!r.rating)return;const d=new Date(r.ts),y=d.getFullYear(),wk=Math.ceil(((d-new Date(y,0,1))/86400000+1)/7),key=`${y}-W${String(wk).padStart(2,"0")}`;if(!wm[key])wm[key]={total:0,count:0};wm[key].total+=r.rating;wm[key].count+=1;});
    return Object.entries(wm).sort(([a],[b])=>a.localeCompare(b)).map(([week,d])=>({week,score:parseFloat((d.total/d.count).toFixed(2))}));
  },[filtered]);

  const tenureData=useMemo(()=>{
    const m={};
    responses.forEach((r)=>{if((pf===ALL_PLANTS_ID||r.plant===pf)&&(ff==="All"||r.submitterDept===ff)&&r.tenure)m[r.tenure]=(m[r.tenure]||0)+1;});
    const total=Object.values(m).reduce((s,v)=>s+v,0);
    return TENURE_OPTIONS.filter((k)=>m[k]).map((k)=>({key:k,name:k,count:m[k],pct:total?Math.round(m[k]/total*100):0,color:TENURE_COLORS[k]}));
  },[responses,pf,ff]);
  const tenureTotal=tenureData.reduce((s,d)=>s+d.count,0);

  const comments=useMemo(()=>filtered.filter((r)=>r.comment).slice(-10).reverse(),[filtered]);
  const ratedOpts=useMemo(()=>Array.from(new Set([...departments,...flatRows.map((r)=>r.ratedDept)])),[departments,flatRows]);
  const fromOpts=useMemo(()=>Array.from(new Set([...departments,...responses.map((r)=>r.submitterDept)])),[departments,responses]);

  const selCount=Object.values(selIds).filter(Boolean).length;
  const allSel=responses.length>0&&responses.every((r)=>selIds[r.id]);
  const toggleSel=(id)=>setSelIds((p)=>({...p,[id]:!p[id]}));
  const toggleAll=()=>{if(allSel)setSelIds({});else{const m={};responses.forEach((r)=>{m[r.id]=true;});setSelIds(m);}};

  const handleDel=async()=>{
    const ids=Object.keys(selIds).filter((id)=>selIds[id]);
    if(!ids.length)return;
    if(!window.confirm(`Delete ${ids.length} response${ids.length===1?"":"s"}? This can't be undone.`))return;
    setBulkBusy(true);setBulkErr("");
    try{await onDeleteResponses(ids);setSelIds({});}catch(e){setBulkErr((e&&(e.message||e.code))||String(e));}
    setBulkBusy(false);
  };

  const handleExportPdf=async()=>{
    setExpBusy(true);
    try{
      const {jsPDF}=window.jspdf;
      const doc=new jsPDF({unit:"mm",format:"a4"});
      const PW=doc.internal.pageSize.getWidth(), PH=doc.internal.pageSize.getHeight();
      const mg=14, cw=PW-mg*2;
      let y=mg;

      // ── helpers ──────────────────────────────────────────────────────────
      const newPage=()=>{doc.addPage();y=mg;};
      const checkY=(need)=>{if(y+need>PH-16)newPage();};
      const sectionHead=(title,color=[99,102,241])=>{
        checkY(16);
        doc.setFont("helvetica","bold");doc.setFontSize(10);doc.setTextColor(...color);
        doc.text(title,mg,y);y+=4;
        doc.setDrawColor(...color);doc.setLineWidth(0.4);doc.line(mg,y,PW-mg,y);y+=6;
        doc.setTextColor(30,34,41);
      };
      const kpiBox=(x,bw,label,val,accent)=>{
        doc.setFillColor(245,246,250);doc.roundedRect(x,y,bw,18,2,2,"F");
        doc.setFont("helvetica","normal");doc.setFontSize(7);doc.setTextColor(100,100,120);
        doc.text(label,x+bw/2,y+6,{align:"center"});
        doc.setFont("helvetica","bold");doc.setFontSize(11);
        doc.setTextColor(...(accent||[30,34,41]));
        doc.text(String(val),x+bw/2,y+14,{align:"center"});
      };

      // ── canvas-based gauge image ──────────────────────────────────────────
      const drawGaugeCanvas=(score)=>{
        const sz=320,cv2=document.createElement("canvas");cv2.width=sz;cv2.height=sz*0.62;
        const ctx=cv2.getContext("2d");const cx2=sz/2,cy2=sz*0.58,R2=sz*0.38,tw2=sz*0.065;
        ctx.clearRect(0,0,sz,sz);
        // track bg
        ctx.beginPath();ctx.arc(cx2,cy2,R2,Math.PI,0);
        ctx.strokeStyle="#E0DDD8";ctx.lineWidth=tw2;ctx.lineCap="round";ctx.stroke();
        // gradient fill
        if(score>0){
          const grad=ctx.createLinearGradient(cx2-R2,0,cx2+R2,0);
          grad.addColorStop(0,"#E8552D");grad.addColorStop(0.5,"#F5B400");grad.addColorStop(1,"#4C9A6A");
          const endA=Math.PI-((Math.min(score,5)-1)/4)*Math.PI;
          ctx.beginPath();ctx.arc(cx2,cy2,R2,Math.PI,endA,true);
          ctx.strokeStyle=grad;ctx.lineWidth=tw2;ctx.lineCap="round";ctx.stroke();
        }
        // ticks + labels
        [1,2,3,4,5].forEach((v)=>{
          const a=Math.PI-((v-1)/4)*Math.PI;
          const ix=cx2+(R2-tw2/2)*Math.cos(a),iy=cy2-( R2-tw2/2)*Math.sin(a);
          const ox=cx2+(R2+tw2/2+2)*Math.cos(a),oy=cy2-(R2+tw2/2+2)*Math.sin(a);
          ctx.beginPath();ctx.moveTo(ix,iy);ctx.lineTo(ox,oy);ctx.strokeStyle="rgba(0,0,0,0.2)";ctx.lineWidth=1.5;ctx.stroke();
          if(v===1||v===3||v===5){
            const lx=cx2+(R2-tw2/2-14)*Math.cos(a),ly=cy2-(R2-tw2/2-14)*Math.sin(a);
            ctx.font="bold 14px monospace";ctx.fillStyle="#888";ctx.textAlign="center";ctx.fillText(v,lx,ly+5);
          }
        });
        // needle
        const na=Math.PI-((Math.min(Math.max(score,1),5)-1)/4)*Math.PI;
        const tx=cx2+(R2-tw2/2-8)*Math.cos(na),ty=cy2-(R2-tw2/2-8)*Math.sin(na);
        const bl={x:cx2+8*Math.cos(na+Math.PI/2),y:cy2-8*Math.sin(na+Math.PI/2)};
        const br={x:cx2+8*Math.cos(na-Math.PI/2),y:cy2-8*Math.sin(na-Math.PI/2)};
        ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(bl.x,bl.y);ctx.lineTo(br.x,br.y);ctx.closePath();
        ctx.fillStyle="#333";ctx.fill();
        // pivot
        ctx.beginPath();ctx.arc(cx2,cy2,10,0,Math.PI*2);ctx.fillStyle="#fff";ctx.strokeStyle="#ddd";ctx.lineWidth=2;ctx.fill();ctx.stroke();
        ctx.beginPath();ctx.arc(cx2,cy2,5,0,Math.PI*2);
        const sc2=score<2?"#E8552D":score<3.5?"#F5B400":"#4C9A6A";
        ctx.fillStyle=sc2;ctx.fill();
        // score text
        ctx.font="bold 52px monospace";ctx.fillStyle=sc2;ctx.textAlign="center";ctx.fillText(fmt1(score),cx2,cy2+52);
        ctx.font="12px sans-serif";ctx.fillStyle="#aaa";ctx.fillText("OUT OF 5.0",cx2,cy2+70);
        return cv2.toDataURL("image/png");
      };

      // ── canvas bar chart ──────────────────────────────────────────────────
      const drawBarCanvas=(data,widthPx=560,heightPx=null)=>{
        const n=data.length,rowH=36,padT=10,padB=30,padL=170,padR=60;
        const h=heightPx||(n*rowH+padT+padB);
        const cv2=document.createElement("canvas");cv2.width=widthPx;cv2.height=h;
        const ctx=cv2.getContext("2d");
        ctx.fillStyle="#fff";ctx.fillRect(0,0,widthPx,h);
        const barW=widthPx-padL-padR, maxV=5;
        // grid lines
        [1,2,3,4,5].forEach((v)=>{
          const x=padL+(v/maxV)*barW;
          ctx.strokeStyle="#EEE";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,padT);ctx.lineTo(x,h-padB);ctx.stroke();
          ctx.font="11px sans-serif";ctx.fillStyle="#AAA";ctx.textAlign="center";ctx.fillText(v,x,h-padB+14);
        });
        data.forEach((d,i)=>{
          const by=padT+i*rowH+4,bh=rowH-8;
          // label
          ctx.font="13px sans-serif";ctx.fillStyle="#333";ctx.textAlign="right";
          const label=d.name.length>22?d.name.slice(0,21)+"…":d.name;
          ctx.fillText(label,padL-8,by+bh/2+5);
          // bar
          const fillW=(d.score/maxV)*barW;
          const color=d.score>=4?"#4C9A6A":d.score>=3?"#F5B400":"#E8552D";
          ctx.fillStyle="#F0F0F0";ctx.beginPath();ctx.roundRect(padL,by,barW,bh,4);ctx.fill();
          ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(padL,by,Math.max(fillW,4),bh,4);ctx.fill();
          // score label
          ctx.font="bold 13px monospace";ctx.fillStyle=color;ctx.textAlign="left";
          ctx.fillText(fmt1(d.score),padL+fillW+6,by+bh/2+5);
          // count badge
          ctx.font="11px sans-serif";ctx.fillStyle="#AAA";
          ctx.fillText(`n=${d.count}`,padL+fillW+46,by+bh/2+5);
        });
        return cv2.toDataURL("image/png");
      };

      // ── canvas trend line ─────────────────────────────────────────────────
      const drawTrendCanvas=(data,widthPx=560,heightPx=120)=>{
        const cv2=document.createElement("canvas");cv2.width=widthPx;cv2.height=heightPx;
        const ctx=cv2.getContext("2d");
        ctx.fillStyle="#fff";ctx.fillRect(0,0,widthPx,heightPx);
        if(data.length<2)return null;
        const padL=30,padR=20,padT=12,padB=28;
        const w2=widthPx-padL-padR,h2=heightPx-padT-padB;
        const scX=(i)=>padL+(i/(data.length-1))*w2;
        const scY=(v)=>padT+h2-(((v-1)/4)*h2);
        // grid
        [1,2,3,4,5].forEach((v)=>{
          const gy=scY(v);ctx.strokeStyle="#EEE";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(padL,gy);ctx.lineTo(widthPx-padR,gy);ctx.stroke();
          ctx.font="10px sans-serif";ctx.fillStyle="#BBB";ctx.textAlign="right";ctx.fillText(v,padL-4,gy+4);
        });
        // line
        ctx.beginPath();ctx.strokeStyle="#6366F1";ctx.lineWidth=2.5;ctx.lineJoin="round";
        data.forEach((d,i)=>{i===0?ctx.moveTo(scX(i),scY(d.score)):ctx.lineTo(scX(i),scY(d.score));});
        ctx.stroke();
        // dots + labels
        data.forEach((d,i)=>{
          ctx.beginPath();ctx.arc(scX(i),scY(d.score),3.5,0,Math.PI*2);ctx.fillStyle="#6366F1";ctx.fill();
          if(i%Math.max(1,Math.floor(data.length/6))===0){
            ctx.font="9px sans-serif";ctx.fillStyle="#AAA";ctx.textAlign="center";ctx.fillText(d.week,scX(i),heightPx-padB+14);
          }
        });
        return cv2.toDataURL("image/png");
      };

      // ── canvas donut ───────────────────────────────────────────────────────
      const drawDonutCanvas=(data,sz=200)=>{
        if(!data.length)return null;
        const cv2=document.createElement("canvas");cv2.width=sz*2;cv2.height=sz;
        const ctx=cv2.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,sz*2,sz);
        const cx2=sz/2,cy2=sz/2,R2=sz*0.44,ir=sz*0.26;
        let startA=-Math.PI/2;
        const total=data.reduce((s,d)=>s+d.count,0);
        data.forEach((d)=>{
          const span=(d.count/total)*Math.PI*2;
          ctx.beginPath();ctx.moveTo(cx2,cy2);ctx.arc(cx2,cy2,R2,startA,startA+span);
          ctx.closePath();ctx.fillStyle=d.color;ctx.fill();
          // inner hole
          ctx.beginPath();ctx.arc(cx2,cy2,ir,0,Math.PI*2);ctx.fillStyle="#fff";ctx.fill();
          startA+=span;
        });
        // center text
        ctx.font="bold 22px monospace";ctx.fillStyle="#333";ctx.textAlign="center";ctx.fillText(total,cx2,cy2+4);
        ctx.font="10px sans-serif";ctx.fillStyle="#AAA";ctx.fillText("responses",cx2,cy2+18);
        // legend
        const lx=sz+12,ly0=sz/2-(data.length*18)/2;
        data.forEach((d,i)=>{
          const ly=ly0+i*20;
          ctx.fillStyle=d.color;ctx.fillRect(lx,ly,12,12);
          ctx.font="11px sans-serif";ctx.fillStyle="#333";ctx.textAlign="left";
          ctx.fillText(`${d.name}  ${d.pct}%  (${d.count})`,lx+16,ly+10);
        });
        return cv2.toDataURL("image/png");
      };

      // ── PAGE 1: Cover + KPIs + Gauge ─────────────────────────────────────
      // Header band
      const hg=doc.context2d;
      doc.setFillColor(22,26,34);doc.rect(0,0,PW,24,"F");
      // Gradient accent bar (thin)
      const gradBar=document.createElement("canvas");gradBar.width=PW*4;gradBar.height=8;
      const gbc=gradBar.getContext("2d");
      const gb=gbc.createLinearGradient(0,0,PW*4,0);
      gb.addColorStop(0,"#9B6BD1");gb.addColorStop(0.3,"#3E8FB0");gb.addColorStop(0.55,"#4C9A6A");gb.addColorStop(0.78,"#F5B400");gb.addColorStop(1,"#E8552D");
      gbc.fillStyle=gb;gbc.fillRect(0,0,PW*4,8);
      doc.addImage(gradBar.toDataURL(),"PNG",0,24,PW,1.5);

      doc.setFont("helvetica","bold");doc.setFontSize(15);doc.setTextColor(255,255,255);
      doc.text("Inter-Department Satisfaction",mg,12);
      doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(140,147,168);
      doc.text(`${companyName}  ·  Generated ${new Date().toLocaleDateString()}`,PW-mg,16,{align:"right"});
      y=32;

      // KPI boxes
      const kw=(cw-6)/4;
      kpiBox(mg,kw,"Total Submissions",responses.length);
      kpiBox(mg+kw+2,kw,"Dept Ratings",filtered.length);
      kpiBox(mg+kw*2+4,kw,"Overall Avg",fmt1(overall),[76,154,106]);
      kpiBox(mg+kw*3+6,kw,"Highest Rated",topDept?topDept.name:"—",[99,102,241]);
      y+=22;

      // Gauge
      checkY(60);sectionHead("Overall Satisfaction Score");
      const gImg=drawGaugeCanvas(overall);
      const gW=70,gH=gW*0.62;
      doc.addImage(gImg,"PNG",PW/2-gW/2,y,gW,gH);
      y+=gH+8;

      // ── Dept bar chart ────────────────────────────────────────────────────
      if(deptData.length){
        checkY(20);sectionHead("Average Rating by Department");
        const rowsPx=deptData.length*36+40;
        const bImg=drawBarCanvas(deptData,560,rowsPx);
        const bW=cw,bH=cw*(rowsPx/560);
        checkY(bH+4);doc.addImage(bImg,"PNG",mg,y,bW,bH);y+=bH+8;
      }

      // ── Trend ─────────────────────────────────────────────────────────────
      if(trendData.length>1){
        checkY(20);sectionHead("Rating Trend (Weekly Average)",[76,154,106]);
        const tImg=drawTrendCanvas(trendData,560,120);
        if(tImg){const tW=cw,tH=cw*(120/560);checkY(tH+4);doc.addImage(tImg,"PNG",mg,y,tW,tH);y+=tH+8;}
      }

      // ── Tenure donut ──────────────────────────────────────────────────────
      if(tenureData.length){
        checkY(20);sectionHead("Responses by Tenure",[245,180,0]);
        const dImg=drawDonutCanvas(tenureData,200);
        if(dImg){const dW=cw*0.7,dH=dW*0.5;checkY(dH+4);doc.addImage(dImg,"PNG",mg,y,dW,dH);y+=dH+8;}
      }

      // ── Dept score table ──────────────────────────────────────────────────
      if(deptData.length){
        checkY(20);sectionHead("Department Score Summary",[99,102,241]);
        doc.autoTable({startY:y,
          head:[["Department","Avg Rating","★ Stars","Ratings Count"]],
          body:deptData.map((d)=>[d.name,fmt1(d.score),"★".repeat(Math.round(d.score)),d.count]),
          styles:{fontSize:8,cellPadding:3},
          headStyles:{fillColor:[99,102,241],textColor:255,fontStyle:"bold"},
          alternateRowStyles:{fillColor:[245,246,250]},
          margin:{left:mg,right:mg}});
        y=doc.lastAutoTable.finalY+8;
      }

      // ── All responses table ───────────────────────────────────────────────
      newPage();sectionHead("All Responses",[99,102,241]);
      doc.autoTable({startY:y,
        head:[["Date","Code","Name","From Dept","Rated Dept","Rating","Comment","Shift","Tenure"]],
        body:flatRows.map((r)=>[
          new Date(r.ts).toLocaleDateString(),
          r.employeeCode||"—",r.employeeName||"—",
          r.submitterDept,r.ratedDept,
          `${r.rating}★`||"—",r.comment||"",r.shift,r.tenure||"—"
        ]),
        styles:{fontSize:7,cellPadding:2,overflow:"linebreak"},
        headStyles:{fillColor:[99,102,241],textColor:255,fontStyle:"bold",fontSize:7},
        columnStyles:{6:{cellWidth:38}},
        alternateRowStyles:{fillColor:[245,246,250]},
        margin:{left:mg,right:mg}});

      // ── Footer on every page ──────────────────────────────────────────────
      const tp=doc.internal.getNumberOfPages();
      for(let p=1;p<=tp;p++){
        doc.setPage(p);
        // accent bar at bottom
        doc.addImage(gradBar.toDataURL(),"PNG",0,PH-1.5,PW,1.5);
        doc.setFont("helvetica","normal");doc.setFontSize(7);doc.setTextColor(154,161,168);
        doc.text(companyName,mg,PH-4);
        doc.text(`Page ${p} of ${tp}`,PW-mg,PH-4,{align:"right"});
      }

      doc.save(`inter-dept-satisfaction-${new Date().toISOString().slice(0,10)}.pdf`);
    }catch(e){console.error(e);setBulkErr((e&&e.message)||String(e));}
    setExpBusy(false);
  };

  return(
    <div>
      {plants.length>1&&<div className="plant-pill-bar">{<button className={"plant-pill"+(pf===ALL_PLANTS_ID?" active":"")} onClick={()=>setPf(ALL_PLANTS_ID)}>All Plants</button>}{plants.map((p)=><button key={p} className={"plant-pill"+(pf===p?" active":"")} onClick={()=>setPf(p)}>{p}</button>)}</div>}
      <div style={{display:"flex",justifyContent:"flex-end",marginBottom:12}}>
        <button className="submit-btn small-btn" style={{background:"#3E8FB0"}} onClick={handleExportPdf} disabled={expBusy||!flatRows.length}>{expBusy?"…":"Export PDF"}</button>
      </div>
      <div className="filter-bar">
        <div className="filter-field"><label>Rated Department</label><select value={rf} onChange={(e)=>setRf(e.target.value)}><option value="All">All departments</option>{ratedOpts.map((d)=><option key={d} value={d}>{d}</option>)}</select></div>
        <div className="filter-field"><label>Submitted By (Dept)</label><select value={ff} onChange={(e)=>setFf(e.target.value)}><option value="All">All submitters</option>{fromOpts.map((d)=><option key={d} value={d}>{d}</option>)}</select></div>
        <div className="filter-count">{filtered.length} rating{filtered.length===1?"":"s"}</div>
      </div>

      <div className="panel-row top-row">
        <div className="gauge-panel"><div className="panel-title">Overall Satisfaction</div><Gauge value={overall} theme={theme}/></div>
        <div className="kpi-grid">
          <StatCard label="Total Submissions" value={responses.length}/>
          <StatCard label="Total Ratings" value={filtered.length}/>
          <StatCard label="Highest Rated" value={topDept?topDept.name:"—"} sub={topDept?`${fmt1(topDept.score)} / 5.0`:""} accent="#4C9A6A"/>
          <StatCard label="Needs Attention" value={lowDept?lowDept.name:"—"} sub={lowDept?`${fmt1(lowDept.score)} / 5.0`:""} accent="#E8552D"/>
        </div>
      </div>

      <div className="panel">
        <div className="panel-title">Average Rating by Department</div>
        {deptData.length?(<ResponsiveContainer width="100%" height={Math.max(160,deptData.length*44)}>
          <BarChart data={deptData} layout="vertical" margin={{left:10,right:40,top:5,bottom:5}}>
            <CartesianGrid strokeDasharray="3 3" stroke={ct.grid} horizontal={false}/>
            <XAxis type="number" domain={[0,5]} stroke={ct.axis} fontSize={11} ticks={[1,2,3,4,5]}/>
            <YAxis type="category" dataKey="name" stroke={ct.axis} fontSize={11} width={160}/>
            <Tooltip contentStyle={{background:ct.tooltipBg,border:`1px solid ${ct.tooltipBorder}`,borderRadius:4}} labelStyle={{color:ct.tooltipLabel}} formatter={(v,n,p)=>[`${v} (${p.payload.count} rating${p.payload.count===1?"":"s"})`,"Avg"]}/>
            <Bar dataKey="score" radius={[0,3,3,0]}>
              {deptData.map((d,i)=><Cell key={i} fill={d.score>=4?"#4C9A6A":d.score>=3?"#F5B400":"#E8552D"}/>)}
            </Bar>
          </BarChart>
        </ResponsiveContainer>):<div className="empty-note">No ratings match the current filters.</div>}
      </div>

      <div className="panel">
        <div className="panel-title">Rating Trend (Weekly Average)</div>
        {trendData.length>1?(<ResponsiveContainer width="100%" height={220}>
          <LineChart data={trendData} margin={{left:0,right:20,top:10,bottom:5}}>
            <CartesianGrid strokeDasharray="3 3" stroke={ct.grid}/>
            <XAxis dataKey="week" stroke={ct.axis} fontSize={11}/>
            <YAxis domain={[1,5]} stroke={ct.axis} fontSize={11} ticks={[1,2,3,4,5]}/>
            <Tooltip contentStyle={{background:ct.tooltipBg,border:`1px solid ${ct.tooltipBorder}`,borderRadius:4}} labelStyle={{color:ct.tooltipLabel}}/>
            <Line type="monotone" dataKey="score" stroke="#F5B400" strokeWidth={2} dot={{r:3}}/>
          </LineChart>
        </ResponsiveContainer>):<div className="empty-note">Not enough data to show a trend yet.</div>}
      </div>

      <div className="panel">
        <div className="panel-title">Responses by Tenure</div>
        {tenureData.length?(<div className="tenure-donut-wrap">
          <div className="tenure-donut-chart">
            <ResponsiveContainer width="100%" height={240}>
              <PieChart><Pie data={tenureData} dataKey="count" nameKey="name" cx="50%" cy="50%" innerRadius={72} outerRadius={106} paddingAngle={3} stroke="none">
                {tenureData.map((e,i)=><Cell key={i} fill={e.color}/>)}
              </Pie><Tooltip contentStyle={{background:ct.tooltipBg,border:`1px solid ${ct.tooltipBorder}`,borderRadius:4}} formatter={(v,n,p)=>[`${v} (${p.payload.pct}%)`,n]}/></PieChart>
            </ResponsiveContainer>
            <div className="tenure-donut-center"><div className="tenure-donut-total">{tenureTotal}</div><div className="tenure-donut-total-label">responses</div></div>
          </div>
          <div className="tenure-stats-list">{tenureData.map((d)=>(<div className="tenure-stat-row" key={d.key}><div className="tenure-stat-top"><span className="tenure-stat-dot" style={{background:d.color}}/><span className="tenure-stat-name">{d.name}</span><span className="tenure-stat-pct">{d.pct}%</span><span className="tenure-stat-count">{d.count}</span></div><div className="tenure-stat-bar-track"><div className="tenure-stat-bar-fill" style={{width:`${d.pct}%`,background:d.color}}/></div></div>))}</div>
        </div>):<div className="empty-note">No responses yet.</div>}
      </div>

      <div className="panel">
        <div className="panel-title">Recent Comments</div>
        {comments.length?(<div className="comment-feed">{comments.map((r)=>(<div className="comment-item" key={r._fid}><div className="comment-meta"><span style={{color:"#3E8FB0",fontWeight:600}}>{r.submitterDept}</span><span>→</span><span style={{color:"#E8552D",fontWeight:600}}>{r.ratedDept}</span><span>·</span><span>{"★".repeat(r.rating)} ({r.rating}/5)</span><span>·</span><span>{new Date(r.ts).toLocaleDateString()}</span></div><p className="comment-text">{r.comment}</p></div>))}</div>):<div className="empty-note">No comments yet.</div>}
      </div>

      <div className="panel">
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:12,marginBottom:14}}>
          <div className="panel-title" style={{marginBottom:0}}>All Responses</div>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            <button className="submit-btn small-btn" style={{background:"#3E8FB0"}} onClick={handleExportPdf} disabled={expBusy||!flatRows.length}>{expBusy?"…":"Export PDF"}</button>
            <button className="submit-btn small-btn" style={{background:"#E8552D"}} onClick={handleDel} disabled={bulkBusy||!selCount}>{bulkBusy?"…":`Delete Selected (${selCount})`}</button>
          </div>
        </div>
        {bulkErr&&<div className="error-msg" style={{marginBottom:12}}>{bulkErr}</div>}
        {responses.length?(<div className="responses-table-wrap"><table className="responses-table">
          <thead><tr><th><input type="checkbox" checked={allSel} onChange={toggleAll}/></th><th>Date</th><th>Code</th><th>Name</th><th>From Dept</th><th>Dept Ratings</th><th>Shift</th><th>Tenure</th></tr></thead>
          <tbody>{responses.map((r)=>{const parts=Object.entries(r.deptRatings||{}).map(([d,i])=>`${d}: ${i.rating}★`);return(<tr key={r.id}><td><input type="checkbox" checked={!!selIds[r.id]} onChange={()=>toggleSel(r.id)}/></td><td>{new Date(r.ts).toLocaleDateString()}</td><td>{r.employeeCode||"—"}</td><td>{r.employeeName||"—"}</td><td>{r.submitterDept}</td><td className="responses-table-comment">{parts.join(" | ")||"—"}</td><td>{r.shift}</td><td>{r.tenure||"—"}</td></tr>);})}</tbody>
        </table></div>):<div className="empty-note">No responses yet.</div>}
      </div>
    </div>
  );
}

function QRPoster({surveyUrl,logoUrl,companyName,onGoSettings}){
  const qrSrc=surveyUrl?`https://api.qrserver.com/v1/create-qr-code/?size=320x320&margin=8&data=${encodeURIComponent(surveyUrl)}`:null;
  return(<div>
    <div className="panel poster-card">
      {logoUrl&&<img src={logoUrl} alt="Logo" className="poster-logo"/>}
      <div className="poster-company">{companyName}</div>
      <h2 className="poster-title">Scan to Share Your Feedback</h2>
      <p className="poster-sub">Inter-Department Satisfaction Survey — anonymous, takes 2 minutes.</p>
      <div className="qr-box">{qrSrc?<img src={qrSrc} alt="QR" width={260} height={260}/>:<div className="qr-placeholder">Add a survey link in Settings to generate a QR code.</div>}</div>
      <p className="poster-hint">Open your phone camera and point it at the code.</p>
      {surveyUrl&&<div style={{marginTop:14,padding:"10px 16px",background:"var(--bg-tab)",borderRadius:8,textAlign:"center"}}><div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.6px",color:"var(--text-secondary)",marginBottom:6}}>Survey Link</div><a href={surveyUrl} target="_blank" rel="noopener noreferrer" style={{fontSize:13,color:"#3E8FB0",fontWeight:600,wordBreak:"break-all",textDecoration:"none"}}>{surveyUrl}</a></div>}
    </div>
    <div className="panel no-print" style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:12}}>
      <span className="empty-note" style={{padding:0}}>Manage the survey link and logo in Settings.</span>
      <div style={{display:"flex",gap:8}}><button className="submit-btn small-btn" onClick={onGoSettings}>Go to Settings</button><button className="submit-btn small-btn" style={{background:"#3E8FB0"}} onClick={()=>window.print()} disabled={!surveyUrl}>Print Poster</button></div>
    </div>
  </div>);
}

function ListManager({title,desc,items,onAdd,onDelete,placeholder}){
  const [draft,setDraft]=useState("");const [error,setError]=useState("");const [busyId,setBusyId]=useState("");
  const handleAdd=async()=>{const n=draft.trim();if(!n)return;setError("");try{await onAdd(n);setDraft("");}catch(e){setError((e&&(e.message||e.code))||String(e));}};
  const handleDel=async(item)=>{setError("");setBusyId(item.id);try{await onDelete(item.id);}catch(e){setError((e&&(e.message||e.code))||String(e));}setBusyId("");};
  return(<div className="panel"><div className="panel-title">{title}</div><p className="empty-note" style={{padding:"0 0 12px",textAlign:"left"}}>{desc}</p>
    <div className="list-manager-items">{items.map((item)=>(<span className="list-chip" key={item.id}>{item.name}<button type="button" className="list-chip-remove" onClick={()=>handleDel(item)} disabled={busyId===item.id}>×</button></span>))}</div>
    {error&&<div className="error-msg" style={{marginTop:12}}>{error}</div>}
    <div className="field-row" style={{marginTop:12,marginBottom:0}}><input className="name-input" style={{flex:1}} placeholder={placeholder} value={draft} onChange={(e)=>setDraft(e.target.value)} onKeyDown={(e)=>{if(e.key==="Enter")handleAdd();}}/><button className="submit-btn small-btn" onClick={handleAdd}>Add</button></div>
  </div>);
}

function SettingsPanel({surveyUrl,onSaveUrl,logoUrl,onSaveLogo,onRemoveLogo,companyName,onSaveCompanyName,ratingGuidelines,onSaveGuidelines,plants,onAddPlant,onDeletePlant,departments,onAddDepartment,onDeleteDepartment,shifts,onAddShift,onDeleteShift}){
  const [urlD,setUrlD]=useState(surveyUrl);const [urlSaved,setUrlSaved]=useState(false);const [urlErr,setUrlErr]=useState("");
  const [nameD,setNameD]=useState(companyName);const [nameSaved,setNameSaved]=useState(false);const [nameErr,setNameErr]=useState("");
  const [guideD,setGuideD]=useState(ratingGuidelines);const [guideSaved,setGuideSaved]=useState(false);const [guideErr,setGuideErr]=useState("");
  const [logoBusy,setLogoBusy]=useState(false);const [logoErr,setLogoErr]=useState("");
  useEffect(()=>setUrlD(surveyUrl),[surveyUrl]);
  useEffect(()=>setNameD(companyName),[companyName]);
  useEffect(()=>setGuideD(ratingGuidelines),[ratingGuidelines]);
  const saveWith=(fn,setSaved,setErr)=>async(val)=>{setErr("");try{await fn(val);setSaved(true);setTimeout(()=>setSaved(false),2000);}catch(e){setErr((e&&(e.message||e.code))||String(e));}};
  const handleLogoFile=(e)=>{const file=e.target.files&&e.target.files[0];e.target.value="";if(!file)return;setLogoErr("");setLogoBusy(true);const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const max=200;let{width:w,height:h}=img;if(w>h){if(w>max){h=Math.round(h*max/w);w=max;}}else{if(h>max){w=Math.round(w*max/h);h=max;}}const cv=document.createElement("canvas");cv.width=w;cv.height=h;cv.getContext("2d").drawImage(img,0,0,w,h);onSaveLogo(cv.toDataURL("image/png")).catch((err)=>setLogoErr((err&&(err.message||err.code))||String(err))).finally(()=>setLogoBusy(false));};img.onerror=()=>setLogoBusy(false);img.src=reader.result;};reader.onerror=()=>setLogoBusy(false);reader.readAsDataURL(file);};
  return(<div>
    <div className="panel"><div className="panel-title">Company Name</div><p className="empty-note" style={{padding:"0 0 12px",textAlign:"left"}}>Appears in the header and on the printable poster.</p><div className="field-row" style={{marginBottom:4,alignItems:"center"}}><input className="name-input" style={{flex:1}} value={nameD} onChange={(e)=>setNameD(e.target.value)} placeholder={DEFAULT_COMPANY_NAME}/><button className="submit-btn small-btn" onClick={()=>saveWith(onSaveCompanyName,setNameSaved,setNameErr)(nameD.trim()||DEFAULT_COMPANY_NAME)}>{nameSaved?"Saved ✓":"Save"}</button></div>{nameErr&&<div className="error-msg">{nameErr}</div>}</div>
    <div className="panel"><div className="panel-title">Company Logo</div><p className="empty-note" style={{padding:"0 0 12px",textAlign:"left"}}>Appears in the header and on the printable poster.</p><div style={{display:"flex",alignItems:"center",gap:16,flexWrap:"wrap"}}><div className="logo-preview-box">{logoUrl?<img src={logoUrl} alt="Logo" className="logo-preview-img"/>:<span className="logo-preview-empty">No logo</span>}</div><div style={{display:"flex",gap:8,flexWrap:"wrap"}}><label className="submit-btn small-btn" style={{background:"#3E8FB0",cursor:"pointer"}}>{logoBusy?"...":"Upload logo"}<input type="file" accept="image/*" onChange={handleLogoFile} style={{display:"none"}} disabled={logoBusy}/></label>{logoUrl&&<button className="submit-btn small-btn" style={{background:"#6C7A89"}} onClick={onRemoveLogo}>Remove logo</button>}</div></div>{logoErr&&<div className="error-msg" style={{marginTop:12}}>{logoErr}</div>}</div>

    <div className="panel" style={{border:"2px solid #3E8FB0"}}>
      <div className="panel-title" style={{color:"#3E8FB0"}}>📋 Rating Guidelines</div>
      <p className="empty-note" style={{padding:"0 0 12px",textAlign:"left"}}>These guidelines appear <strong>above the survey form</strong> so employees know how to rate departments before they start.</p>
      <textarea rows={7} style={{width:"100%",resize:"vertical",fontFamily:"Inter,sans-serif",fontSize:14,padding:"10px",background:"var(--bg-page)",color:"var(--text-primary)",border:"1px solid var(--panel-border)",borderRadius:4}} placeholder={DEFAULT_GUIDELINES} value={guideD} onChange={(e)=>setGuideD(e.target.value)}/>
      <div style={{marginTop:8}}><button className="submit-btn small-btn" style={{background:"#4C9A6A"}} onClick={()=>saveWith(onSaveGuidelines,setGuideSaved,setGuideErr)(guideD.trim())}>{guideSaved?"Saved ✓":"Save Guidelines"}</button></div>
      {guideErr&&<div className="error-msg">{guideErr}</div>}
    </div>

    <div className="panel"><div className="panel-title">Survey Link</div><p className="empty-note" style={{padding:"0 0 12px",textAlign:"left"}}>Public URL for this survey — used to generate the QR code.</p><div className="field-row" style={{marginBottom:4,alignItems:"center"}}><input className="name-input" style={{flex:1}} placeholder="https://your-survey-link.example.com" value={urlD} onChange={(e)=>setUrlD(e.target.value)}/><button className="submit-btn small-btn" onClick={()=>saveWith(onSaveUrl,setUrlSaved,setUrlErr)(urlD.trim())}>{urlSaved?"Saved ✓":"Save link"}</button></div>{urlErr&&<div className="error-msg">{urlErr}</div>}</div>

    <ListManager title="Plants" desc="Manage plant locations." items={plants} onAdd={onAddPlant} onDelete={onDeletePlant} placeholder="Add a plant"/>
    <ListManager title="Departments" desc="Employees rate all departments except their own." items={departments} onAdd={onAddDepartment} onDelete={onDeleteDepartment} placeholder="Add a department"/>
    <ListManager title="Shifts" desc="Shift options for employees." items={shifts} onAdd={onAddShift} onDelete={onDeleteShift} placeholder="Add a shift"/>
  </div>);
}

function AdminLogin({onCancel}){
  const [email,setEmail]=useState("");const [pw,setPw]=useState("");const [err,setErr]=useState("");const [busy,setBusy]=useState(false);
  const go=async()=>{setErr("");setBusy(true);try{await firebase.auth().signInWithEmailAndPassword(email,pw);}catch(e){setErr("Couldn't sign in. Check email and password.");}setBusy(false);};
  return(<div className="panel" style={{maxWidth:340,marginLeft:"auto"}}><div className="field-row" style={{marginBottom:8}}><input className="name-input" style={{flex:1}} type="email" placeholder="Email" value={email} onChange={(e)=>setEmail(e.target.value)}/></div><div className="field-row" style={{marginBottom:8}}><input className="name-input" style={{flex:1}} type="password" placeholder="Password" value={pw} onChange={(e)=>setPw(e.target.value)} onKeyDown={(e)=>{if(e.key==="Enter")go();}}/></div>{err&&<div className="error-msg">{err}</div>}<div style={{display:"flex",gap:8}}><button className="submit-btn small-btn" onClick={go} disabled={busy}>Log in</button><button className="submit-btn small-btn" style={{background:"#6C7A89"}} onClick={onCancel}>×</button></div></div>);
}

function App(){
  const [tab,setTab]=useState("survey");
  const [theme,setTheme]=useState("dark");
  const [responses,setResponses]=useState([]);
  const [surveyUrl,setSurveyUrl]=useState("");
  const [logoUrl,setLogoUrl]=useState("");
  const [companyName,setCompanyName]=useState(DEFAULT_COMPANY_NAME);
  const [ratingGuidelines,setRatingGuidelines]=useState(DEFAULT_GUIDELINES);
  const [departments,setDepartments]=useState(DEFAULT_DEPTS.map((n)=>({id:n,name:n})));
  const [shifts,setShifts]=useState(DEFAULT_SHIFTS.map((n)=>({id:n,name:n})));
  const [plants,setPlants]=useState(DEFAULT_PLANTS.map((n)=>({id:n,name:n})));
  const [user,setUser]=useState(null);
  const [showLogin,setShowLogin]=useState(false);
  const isAdmin=!!user;

  useEffect(()=>{const u=firebase.auth().onAuthStateChanged((u)=>{setUser(u);if(u)setShowLogin(false);else setTab("survey");});return u;},[]);
  useEffect(()=>{try{const s=localStorage.getItem(THEME_KEY);if(s)setTheme(s);}catch(e){};},[]);

  // Public reads
  const dbListen=(path,setter)=>useEffect(()=>{const ref=firebase.database().ref(path);const h=(s)=>setter(s.val()||"");ref.on("value",h);return()=>ref.off("value",h);},[]);
  useEffect(()=>{const ref=firebase.database().ref(SETTINGS_SURVEY_URL_PATH);const h=(s)=>setSurveyUrl(s.val()||"");ref.on("value",h);return()=>ref.off("value",h);},[]);
  useEffect(()=>{const ref=firebase.database().ref(SETTINGS_LOGO_PATH);const h=(s)=>setLogoUrl(s.val()||"");ref.on("value",h);return()=>ref.off("value",h);},[]);
  useEffect(()=>{const ref=firebase.database().ref(SETTINGS_COMPANY_NAME_PATH);const h=(s)=>setCompanyName(s.val()||DEFAULT_COMPANY_NAME);ref.on("value",h);return()=>ref.off("value",h);},[]);
  useEffect(()=>{const ref=firebase.database().ref(SETTINGS_GUIDELINES_PATH);const h=(s)=>setRatingGuidelines(s.val()||DEFAULT_GUIDELINES);ref.on("value",h);return()=>ref.off("value",h);},[]);
  useEffect(()=>{const ref=firebase.database().ref(CONFIG_DEPARTMENTS_PATH);const h=(s)=>{const v=s.val();if(v)setDepartments(Object.entries(v).map(([id,x])=>({id,name:x.name})));};ref.on("value",h);return()=>ref.off("value",h);},[]);
  useEffect(()=>{const ref=firebase.database().ref(CONFIG_SHIFTS_PATH);const h=(s)=>{const v=s.val();if(v)setShifts(Object.entries(v).map(([id,x])=>({id,name:x.name})));};ref.on("value",h);return()=>ref.off("value",h);},[]);
  useEffect(()=>{const ref=firebase.database().ref(CONFIG_PLANTS_PATH);const h=(s)=>{const v=s.val();if(v)setPlants(Object.entries(v).map(([id,x])=>({id,name:x.name})));};ref.on("value",h);return()=>ref.off("value",h);},[]);

  // Auth-only: read responses
  useEffect(()=>{if(!user){setResponses([]);return;}const ref=firebase.database().ref(RESPONSES_PATH);const h=(s)=>{const v=s.val();setResponses(v?Object.entries(v).map(([k,x])=>({...x,id:k})):[]);};ref.on("value",h);return()=>ref.off("value",h);},[user]);

  // Seed defaults when admin first logs in
  useEffect(()=>{
    if(!user)return;
    [[CONFIG_DEPARTMENTS_PATH,DEFAULT_DEPTS],[CONFIG_SHIFTS_PATH,DEFAULT_SHIFTS],[CONFIG_PLANTS_PATH,DEFAULT_PLANTS]].forEach(([path,defaults])=>{
      const ref=firebase.database().ref(path);
      ref.once("value").then((s)=>{if(!s.exists()){const u={};defaults.forEach((n)=>{u[ref.push().key]={name:n};});ref.update(u).catch(()=>{});}});
    });
  },[user]);

  // PUBLIC write — no auth needed; Firebase rules must allow write to interdept2/responses
  const handleSubmit=useCallback(async(payload)=>{
    await firebase.database().ref(RESPONSES_PATH+"/"+payload.id).set(payload);
  },[]);

  const toggleTheme=()=>{const n=theme==="dark"?"light":"dark";setTheme(n);try{localStorage.setItem(THEME_KEY,n);}catch(e){};};

  const saveSurveyUrl       =async(v)=>await firebase.database().ref(SETTINGS_SURVEY_URL_PATH).set(v);
  const saveCompanyName     =async(v)=>await firebase.database().ref(SETTINGS_COMPANY_NAME_PATH).set(v);
  const saveLogo            =async(v)=>await firebase.database().ref(SETTINGS_LOGO_PATH).set(v);
  const removeLogo          =async()=>await firebase.database().ref(SETTINGS_LOGO_PATH).remove();
  const saveGuidelines      =async(v)=>await firebase.database().ref(SETTINGS_GUIDELINES_PATH).set(v);
  const addDepartment       =async(n)=>await firebase.database().ref(CONFIG_DEPARTMENTS_PATH).push({name:n});
  const deleteDepartment    =async(id)=>await firebase.database().ref(CONFIG_DEPARTMENTS_PATH+"/"+id).remove();
  const addShift            =async(n)=>await firebase.database().ref(CONFIG_SHIFTS_PATH).push({name:n});
  const deleteShift         =async(id)=>await firebase.database().ref(CONFIG_SHIFTS_PATH+"/"+id).remove();
  const addPlant            =async(n)=>await firebase.database().ref(CONFIG_PLANTS_PATH).push({name:n});
  const deletePlant         =async(id)=>await firebase.database().ref(CONFIG_PLANTS_PATH+"/"+id).remove();
  const deleteResponses     =async(ids)=>{const u={};ids.forEach((id)=>{u[`${RESPONSES_PATH}/${id}`]=null;});await firebase.database().ref().update(u);};
  const handleLogout        =()=>{firebase.auth().signOut();setTab("survey");};

  const deptNames=departments.map((d)=>d.name);
  const shiftNames=shifts.map((s)=>s.name);
  const plantNames=plants.map((p)=>p.name);

  return(<div className="app-root" data-theme={theme}>
    <style>{`
      @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');
      .app-root[data-theme="dark"]{--bg-page:#0F1117;--bg-header:#161A22;--bg-tab:#1E2330;--tab-border:#2A3040;--bg-panel:#161A22;--panel-border:#252B38;--text-primary:#E8E6F0;--text-secondary:#8A93A8;--text-tertiary:#5A6478;--comment-bg:#0F1117;--header-glow:rgba(99,102,241,0.08);}

      .header-bar::before{content:"";position:absolute;inset:0;background:linear-gradient(105deg,rgba(99,102,241,0.06) 0%,rgba(62,143,176,0.04) 40%,rgba(76,154,106,0.03) 70%,transparent 100%);pointer-events:none;}

      .plant-pill:hover{border-color:#6366F1;color:#6366F1;}
      .plant-pill.active{background:linear-gradient(135deg,#6366F1,#3E8FB0);border-color:transparent;color:#fff;font-weight:700;}
      .filter-bar{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:20px;}
      .filter-field{display:flex;flex-direction:column;gap:4px;min-width:160px;}
      .filter-field label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-secondary);}
      .filter-field select{background:var(--bg-panel);color:var(--text-primary);border:1px solid var(--panel-border);border-radius:4px;padding:7px 10px;font-size:13px;cursor:pointer;font-family:inherit;}
      .filter-count{font-size:13px;color:var(--text-secondary);padding:7px 0;align-self:flex-end;}
      .panel{background:var(--bg-panel);border:1px solid var(--panel-border);border-radius:12px;padding:20px 24px;margin-bottom:20px;}
      .panel-title{font-family:'Oswald',sans-serif;font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-secondary);margin-bottom:16px;}
      .panel-row{display:flex;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
      .gauge-panel{background:var(--bg-panel);border:1px solid var(--panel-border);border-radius:8px;padding:20px;flex:1;min-width:260px;}
      .kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:2;min-width:260px;}
      .top-row{align-items:stretch;}
      .stat-card{background:var(--bg-panel);border:1px solid var(--panel-border);border-radius:8px;padding:16px 20px;display:flex;flex-direction:column;gap:4px;}
      .stat-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.8px;color:var(--text-secondary);}
      .stat-value{font-family:'IBM Plex Mono',monospace;font-weight:700;line-height:1.1;}
      .stat-sub{font-size:12px;color:var(--text-tertiary);}
      .comment-feed{display:flex;flex-direction:column;gap:12px;}
      .comment-item{background:var(--comment-bg);border-radius:6px;padding:14px 16px;}
      .comment-meta{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--text-secondary);margin-bottom:6px;flex-wrap:wrap;}
      .comment-text{margin:0;font-size:14px;color:var(--text-primary);line-height:1.55;}
      .empty-note{color:var(--text-tertiary);font-size:13px;padding:16px;text-align:center;}
      .responses-table-wrap{overflow-x:auto;}
      .responses-table{width:100%;border-collapse:collapse;font-size:13px;}
      .responses-table th{text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-secondary);padding:8px 10px;border-bottom:2px solid var(--panel-border);}
      .responses-table td{padding:9px 10px;border-bottom:1px solid var(--panel-border);color:var(--text-primary);vertical-align:top;}
      .responses-table tr:last-child td{border-bottom:none;}
      .responses-table-comment{max-width:260px;white-space:pre-wrap;word-break:break-word;}
      .tenure-donut-wrap{display:flex;gap:32px;align-items:center;flex-wrap:wrap;}
      .tenure-donut-chart{position:relative;flex:1;min-width:220px;max-width:300px;}
      .tenure-donut-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;}
      .tenure-donut-total{font-family:'IBM Plex Mono',monospace;font-size:28px;font-weight:700;color:var(--text-primary);}
      .tenure-donut-total-label{font-size:11px;color:var(--text-secondary);white-space:nowrap;}
      .tenure-stats-list{flex:1;min-width:200px;display:flex;flex-direction:column;gap:12px;}
      .tenure-stat-row{display:flex;flex-direction:column;gap:4px;}
      .tenure-stat-top{display:flex;align-items:center;gap:8px;}
      .tenure-stat-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
      .tenure-stat-name{font-size:13px;color:var(--text-primary);flex:1;}
      .tenure-stat-pct{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;color:var(--text-primary);}
      .tenure-stat-count{font-size:12px;color:var(--text-secondary);min-width:24px;text-align:right;}
      .tenure-stat-bar-track{height:4px;background:var(--panel-border);border-radius:2px;}
      .tenure-stat-bar-fill{height:4px;border-radius:2px;transition:width 0.4s ease;}
      .logo-preview-box{width:80px;height:60px;background:var(--bg-tab);border:1px solid var(--panel-border);border-radius:4px;display:flex;align-items:center;justify-content:center;overflow:hidden;}
      .logo-preview-img{max-width:100%;max-height:100%;object-fit:contain;}
      .logo-preview-empty{font-size:10px;color:var(--text-tertiary);text-align:center;padding:4px;}
      .list-manager-items{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;min-height:20px;}
      .list-chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg-tab);border:1px solid var(--panel-border);border-radius:999px;padding:5px 12px 5px 14px;font-size:13px;color:var(--text-primary);}
      .list-chip-remove{background:none;border:none;cursor:pointer;font-size:16px;line-height:1;color:var(--text-tertiary);padding:0;display:flex;align-items:center;}
      .list-chip-remove:hover{color:#E8552D;}
      .poster-card{text-align:center;padding:40px 32px;}
      .poster-logo{max-height:60px;max-width:200px;object-fit:contain;margin:0 auto 16px;display:block;}
      .poster-company{font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--text-secondary);margin-bottom:8px;}
      .poster-title{font-family:'Oswald',sans-serif;font-size:28px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text-primary);margin:0 0 8px;}
      .poster-sub{color:var(--text-secondary);font-size:15px;margin:0 0 24px;}
      .qr-box{display:inline-block;padding:16px;background:#fff;border-radius:8px;margin-bottom:16px;}
      .qr-placeholder{width:260px;height:260px;display:flex;align-items:center;justify-content:center;color:#888;font-size:14px;border:2px dashed #ccc;border-radius:4px;padding:16px;text-align:center;}
      .poster-hint{font-size:13px;color:var(--text-tertiary);}
      @media print{.no-print{display:none!important;}.poster-title,.poster-sub,.poster-hint,.poster-company{color:#000!important;}}
      @media(max-width:600px){.field-row{flex-direction:column;}.dept-grid{grid-template-columns:1fr;}.kpi-grid{grid-template-columns:1fr 1fr;}}
      @media(prefers-reduced-motion:reduce){*{transition:none!important;}}
    `}</style>

    <div className="no-print">
      <HazardBar/>
      <div className="header-bar">
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          {logoUrl&&<img src={logoUrl} alt="Logo" style={{maxHeight:40,maxWidth:120,objectFit:"contain"}}/>}
          <div><div className="brand">{companyName}</div><div className="brand-sub">Inter-Dept Satisfaction</div></div>
        </div>
        <div className="tabs">
          {isAdmin&&(<>
            <button className={"tab-btn"+(tab==="survey"?" active":"")} onClick={()=>setTab("survey")}>Take Survey</button>
            <button className={"tab-btn"+(tab==="dashboard"?" active":"")} onClick={()=>setTab("dashboard")}>Dashboard</button>
            <button className={"tab-btn"+(tab==="poster"?" active":"")} onClick={()=>setTab("poster")}>QR Poster</button>
            <button className={"tab-btn"+(tab==="settings"?" active":"")} onClick={()=>setTab("settings")}>Settings</button>
          </>)}
          <button className="theme-toggle" onClick={toggleTheme}>{theme==="dark"?"Light mode":"Dark mode"}</button>
          {isAdmin?<button className="theme-toggle" onClick={handleLogout}>Log out</button>
            :<button className="admin-gear-btn" onClick={()=>setShowLogin((v)=>!v)} title="Admin login" aria-label="Admin login">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
              </svg>
            </button>
          }
        </div>
      </div>
      {!isAdmin&&showLogin&&<div style={{padding:"0 1.5rem 1rem"}}><AdminLogin onCancel={()=>setShowLogin(false)}/></div>}
      <HazardBar/>
    </div>

    <div className="content">
      {(tab==="survey"||!isAdmin)&&(<>
        {ratingGuidelines&&(
          <div className="guidelines-banner">
            <div className="guidelines-banner-label">📋 Rating Guidelines</div>
            <div className="guidelines-banner-text">{ratingGuidelines}</div>
          </div>
        )}
        <SurveyForm onSubmit={handleSubmit} logoUrl={logoUrl} plants={plantNames} departments={deptNames} shifts={shiftNames} ratingGuidelines={ratingGuidelines}/>
      </>)}
      {tab==="dashboard"&&isAdmin&&<Dashboard responses={responses} theme={theme} plants={plantNames} departments={deptNames} shifts={shiftNames} companyName={companyName} logoUrl={logoUrl} onDeleteResponses={deleteResponses}/>}
      {tab==="poster"&&isAdmin&&<QRPoster surveyUrl={surveyUrl} logoUrl={logoUrl} companyName={companyName} onGoSettings={()=>setTab("settings")}/>}
      {tab==="settings"&&isAdmin&&<SettingsPanel surveyUrl={surveyUrl} onSaveUrl={saveSurveyUrl} logoUrl={logoUrl} onSaveLogo={saveLogo} onRemoveLogo={removeLogo} companyName={companyName} onSaveCompanyName={saveCompanyName} ratingGuidelines={ratingGuidelines} onSaveGuidelines={saveGuidelines} plants={plants} onAddPlant={addPlant} onDeletePlant={deletePlant} departments={departments} onAddDepartment={addDepartment} onDeleteDepartment={deleteDepartment} shifts={shifts} onAddShift={addShift} onDeleteShift={deleteShift}/>}
    </div>
  </div>);
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
<script>
  (function(){
    var src=document.getElementById("app-source").textContent;
    var out=Babel.transform(src,{presets:[["react",{runtime:"classic"}]]}).code;
    var s=document.createElement("script");s.text=out;document.body.appendChild(s);
  })();
</script>
</body>
</html>
