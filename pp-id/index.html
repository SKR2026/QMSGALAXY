function SurveyForm({onSubmit,logoUrl,plants,departments,shifts,ratingGuidelines,isAdmin,onAddDummyEntry,validUntil,existingResponses}){
  const [step,setStep]=useState(1);
  const [plant,setPlant]=useState(plants.length===1?plants[0]:"");
  const [myDept,setMyDept]=useState("");
  const [shift,setShift]=useState("");
  const [tenure,setTenure]=useState("");
  const [anonymous,setAnonymous]=useState(true);
  const [empName,setEmpName]=useState("");
  const [empCode,setEmpCode]=useState("");
  const [ratings,setRatings]=useState({});
  const [error,setError]=useState("");
  const [done,setDone]=useState(false);
  const [saving,setSaving]=useState(false);
  const [dummyBusy,setDummyBusy]=useState(false);

  const ratableDepts=useMemo(()=>departments.filter((d)=>d!==myDept),[departments,myDept]);
  const setFactor=(dept,factorId,v)=>setRatings((p)=>({...p,[dept]:{...(p[dept]||{}),factors:{...((p[dept]||{}).factors||{}),[factorId]:v}}}));
  const setComment=(dept,v)=>setRatings((p)=>({...p,[dept]:{...(p[dept]||{}),comment:v}}));

  const fillDummy=()=>{
    if(!departments.length)return;
    const rng=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
    const pick=(arr)=>arr[Math.floor(Math.random()*arr.length)];
    const NAMES=["Amit Sharma","Priya Singh","Ravi Kumar","Sunita Patel","Deepak Verma","Meena Joshi","Rahul Gupta","Anjali Mehta"];
    const CODES=["EMP","TL","MGR","SR"];
    const COMMENTS=["Very professional team, always delivers on time.","Communication could be improved, but work quality is great.","Excellent support during the critical project phase.","Outstanding collaboration during the quarterly review.","Great team spirit and willingness to assist.",""];
    const dept=pick(departments);
    const chosenPlant=plants.length?pick(plants):"";
    const chosenShift=shifts.length?pick(shifts):"Day";
    setMyDept(dept);
    setPlant(chosenPlant);
    setShift(chosenShift);
    setTenure(pick(TENURE_OPTIONS));
    setAnonymous(false);
    setEmpName(pick(NAMES));
    setEmpCode(`${pick(CODES)}${rng(1000,9999)}`);
    const others=departments.filter(d=>d!==dept);
    const toRate=others.slice().sort(()=>Math.random()-0.5).slice(0,Math.min(others.length,rng(2,Math.max(2,others.length))));
    const newRatings={};
    toRate.forEach(d=>{
      const base=rng(2,5);
      const factors={};
      DEPT_FACTORS.forEach(f=>{ factors[f.id]=Math.min(5,Math.max(1,base+rng(-1,1))); });
      newRatings[d]={factors,comment:Math.random()>0.4?pick(COMMENTS.filter(c=>c)):""};
    });
    setRatings(newRatings);
    setError("");
    setStep(2);
    window.scrollTo(0,0);
  };

  const handleDummySubmit=async()=>{
    if(!departments.length){setError("Add departments in Settings first.");return;}
    setDummyBusy(true);setError("");
    try{
      const rng=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
      const pick=(arr)=>arr[Math.floor(Math.random()*arr.length)];
      const NAMES=["Amit Sharma","Priya Singh","Ravi Kumar","Sunita Patel","Deepak Verma","Meena Joshi","Rahul Gupta","Anjali Mehta"];
      const CODES=["EMP","TL","MGR","SR"];
      const COMMENTS=["Very professional team, always delivers on time.","Communication could be improved, but work quality is great.","Excellent support during the critical project phase.","Outstanding collaboration during the quarterly review.","Great team spirit and willingness to assist.",""];
      const submitterDept=pick(departments);
      const others=departments.filter(d=>d!==submitterDept);
      const toRate=others.slice().sort(()=>Math.random()-0.5).slice(0,Math.min(others.length,rng(2,Math.max(2,others.length))));
      const deptRatings={};
      toRate.forEach(dept=>{
        const base=rng(2,5);
        const factors={};
        DEPT_FACTORS.forEach(f=>{ factors[f.id]=Math.min(5,Math.max(1,base+rng(-1,1))); });
        const vals=DEPT_FACTORS.map(f=>factors[f.id]);
        const avg=parseFloat((vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(2));
        deptRatings[dept]={factors,rating:avg,comment:Math.random()>0.4?pick(COMMENTS.filter(c=>c)):""};
      });
      const payload={
        id:`dummy-${Date.now()}-${Math.floor(Math.random()*9999)}`,
        ts:new Date(Date.now()-rng(0,30)*86400000).toISOString(),
        plant:plants.length?pick(plants):"Main Plant",
        submitterDept,shift:shifts.length?pick(shifts):"Day",
        tenure:pick(TENURE_OPTIONS),anonymous:Math.random()>0.4,
        employeeCode:`${pick(CODES)}${rng(1000,9999)}`,
        employeeName:pick(NAMES),
        deptRatings,_isDummy:true,
      };
      await onAddDummyEntry(payload);
      setDone(true);
    }catch(e){setError((e&&(e.message||e.code))||String(e));}
    setDummyBusy(false);
  };

  const handleNext=()=>{
    if(!empCode.trim()){setError("Employee Code is required.");return;}
    if((plants.length>1&&!plant)||!myDept||!shift||!tenure){setError("Please fill in all fields before continuing.");return;}
    setError("");setStep(2);window.scrollTo(0,0);
  };

  const handleSubmit=async()=>{
    if(!empCode.trim()){setError("Employee Code is required.");setStep(1);window.scrollTo(0,0);return;}
    const rated=ratableDepts.filter((d)=>ratings[d]&&ratings[d].factors&&DEPT_FACTORS.some(f=>ratings[d].factors[f.id]>0));
    if(!rated.length){setError("Please rate at least one factor for at least one department before submitting.");return;}
    // Single-entry-per-month check
    const now=new Date();
    const curYear=now.getFullYear();const curMonth=now.getMonth();
    const normalCode=empCode.trim().toUpperCase();
    const duplicate=(existingResponses||[]).find(r=>{
      if(!r.employeeCode)return false;
      if(r.employeeCode.toUpperCase()!==normalCode)return false;
      const rDate=new Date(r.ts);
      return rDate.getFullYear()===curYear&&rDate.getMonth()===curMonth&&!r._isDummy;
    });
    if(duplicate){
      const monthName=now.toLocaleString("default",{month:"long"});
      setError(`Employee Code "${empCode.trim()}" has already submitted a response for ${monthName} ${curYear}. Only one submission per employee per month is allowed.`);
      return;
    }
    setError("");setSaving(true);
    const payload={
      id:`r-${Date.now()}-${Math.floor(Math.random()*10000)}`,
      ts:new Date().toISOString(),
      plant:plant||plants[0]||"",
      submitterDept:myDept,shift,tenure,anonymous,
      employeeCode:empCode.trim(),
      employeeName:anonymous?"":empName.trim(),
      deptRatings:Object.fromEntries(rated.map((d)=>{
        const factors=ratings[d].factors||{};
        const rated_vals=DEPT_FACTORS.map(f=>factors[f.id]||0).filter(v=>v>0);
        const avg=rated_vals.length?rated_vals.reduce((a,b)=>a+b,0)/rated_vals.length:0;
        return [d,{factors,rating:parseFloat(avg.toFixed(2)),comment:(ratings[d].comment||"").trim()}];
      })),
    };
    try{await onSubmit(payload);setSaving(false);setDone(true);
      setPlant(plants.length===1?plants[0]:"");setMyDept("");setShift("");setTenure("");
      setEmpCode("");setEmpName("");setRatings({});setStep(1);
    }catch(e){setError((e&&(e.message||e.code))||String(e));setSaving(false);}
  };

  // Survey validity gate — show closed banner if validUntil is set and today is past it
  if(validUntil){
    const today=new Date();today.setHours(0,0,0,0);
    const cutoff=new Date(validUntil+"T00:00:00");
    if(today>cutoff)return(
      <div className="paper-card"><div className="paper-inner" style={{textAlign:"center",padding:"3rem 1.5rem"}}>
        <div style={{fontSize:52,marginBottom:12}}>🔒</div>
        <h2 className="form-title" style={{marginBottom:8,color:"#E05A5A"}}>Survey Closed</h2>
        <p style={{color:"var(--text-secondary)",maxWidth:380,margin:"0 auto"}}>The response acceptance period for this survey ended on <strong>{new Date(validUntil+"T00:00:00").toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"})}</strong>. No further responses are being collected.</p>
      </div></div>
    );
  }

  if(done)return(
    <div className="paper-card"><div className="paper-inner" style={{textAlign:"center",padding:"3rem 1.5rem"}}>
      <div style={{fontSize:48,marginBottom:8}}>✓</div>
      <h2 className="form-title" style={{marginBottom:8}}>Survey Submitted</h2>
      <p style={{color:"#5B5A52",marginBottom:24}}>Thank you! Your ratings are now reflected in the dashboard.</p>
      <div style={{display:"flex",gap:12,justifyContent:"center",flexWrap:"wrap"}}>
        <button className="submit-btn" onClick={()=>setDone(false)}>Submit another response</button>
        {isAdmin&&<button className="submit-btn" style={{background:"linear-gradient(135deg,#9B6BD1,#6366F1)"}} onClick={handleDummySubmit} disabled={dummyBusy}>{dummyBusy?"Inserting…":"⚡ Insert Another Dummy"}</button>}
      </div>
    </div></div>
  );

  return(
    <div className="paper-card">
      <div className="step-bar">
        <div className={"step-pip"+(step===1?" active":step>1?" done":"")}>{step>1?"✓":"1"}</div>
        <div className="step-line"/>
        <div className={"step-pip"+(step===2?" active":"")}>2</div>
        <div className="step-labels"><span>Your Info</span><span>Rate Departments</span></div>
      </div>
      <div className="paper-inner">
        {logoUrl&&<img src={logoUrl} alt="Logo" className="form-logo"/>}
        {isAdmin&&step===1&&(
          <div style={{display:"flex",gap:10,marginBottom:18,flexWrap:"wrap"}}>
            <button type="button" className="submit-btn small-btn"
              style={{background:"linear-gradient(135deg,#9B6BD1,#6366F1)",fontSize:12,letterSpacing:"0.5px"}}
              onClick={fillDummy}
              title="Pre-fills all fields with random data so you can review before submitting">
              ⚡ Fill Dummy Data
            </button>
            <button type="button" className="submit-btn small-btn"
              style={{background:"linear-gradient(135deg,#4C9A6A,#3E8FB0)",fontSize:12,letterSpacing:"0.5px"}}
              onClick={handleDummySubmit} disabled={dummyBusy}
              title="Generates and saves a dummy response instantly without filling the form">
              {dummyBusy?"Inserting…":"⚡ Quick Insert (skip form)"}
            </button>
          </div>
        )}
        {step===1&&(<>
          <h2 className="form-title">Inter-Department Satisfaction</h2>
          <p className="form-sub">Step 1 of 2 — Enter your details. Your own department will be excluded from ratings.</p>
          <div className="field-row">
            <div className="field"><label>Employee Code <span style={{color:"#E8552D"}}>*</span></label><input className="name-input" placeholder="e.g. EMP1043" value={empCode} onChange={(e)=>setEmpCode(e.target.value)}/></div>
            <div className="field"><label>Employee Name (optional)</label><input className="name-input" placeholder="Your name" value={empName} onChange={(e)=>setEmpName(e.target.value)}/></div>
          </div>
          <div className="field-row">
            {plants.length>1&&<div className="field"><label>Plant</label><select value={plant} onChange={(e)=>setPlant(e.target.value)}><option value="">Select plant</option>{plants.map((p)=><option key={p} value={p}>{p}</option>)}</select></div>}
            <div className="field"><label>Your Department</label><select value={myDept} onChange={(e)=>{setMyDept(e.target.value);setRatings({});}}><option value="">Select your department</option>{departments.map((d)=><option key={d} value={d}>{d}</option>)}</select></div>
            <div className="field"><label>Shift</label><select value={shift} onChange={(e)=>setShift(e.target.value)}><option value="">Select shift</option>{shifts.map((s)=><option key={s} value={s}>{s}</option>)}</select></div>
            <div className="field"><label>Tenure</label><select value={tenure} onChange={(e)=>setTenure(e.target.value)}><option value="">Select tenure</option>{TENURE_OPTIONS.map((t)=><option key={t} value={t}>{t}</option>)}</select></div>
          </div>
          <div className="anon-row"><label className="check-label"><input type="checkbox" checked={anonymous} onChange={(e)=>setAnonymous(e.target.checked)}/>Submit anonymously</label></div>
          {error&&<div className="error-msg">{error}</div>}
          <button className="submit-btn" onClick={handleNext}>Continue to Rate Departments →</button>
        </>)}
        {step===2&&(<>
          <h2 className="form-title">Rate Other Departments</h2>
          <p className="form-sub">Step 2 of 2 — Rate each department you interact with. <strong>{myDept}</strong> is excluded.</p>
          {ratableDepts.length===0
            ?<div className="error-msg">No other departments found. Add more in Settings.</div>
            :<div style={{display:"flex",flexDirection:"column",gap:16,marginBottom:20}}>
              {ratableDepts.map((dept)=>{
                const r=ratings[dept]||{};
                const factors=r.factors||{};
                const hasAnyRating=DEPT_FACTORS.some(f=>factors[f.id]>0);
                return(
                  <div key={dept} className={"dept-card"+(hasAnyRating?" rated":"")} style={{padding:"18px 20px"}}>
                    <div className="dept-card-name" style={{marginBottom:14}}>{dept}</div>
                    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:"12px 20px",marginBottom:12}}>
                      {DEPT_FACTORS.map(f=>{
                        const val=factors[f.id]||0;
                        return(
                          <div key={f.id}>
                            <div style={{fontSize:11,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.5px",color:"#5B5A52",marginBottom:5}}>{f.icon} {f.label}</div>
                            <MiniStarRating value={val} onChange={(v)=>setFactor(dept,f.id,v)}/>
                          </div>
                        );
                      })}
                    </div>
                    <div className="field" style={{marginTop:8,marginBottom:0}}>
                      <label style={{fontSize:11,color:"#5B5A52"}}>Comment (optional)</label>
                      <textarea rows={2} placeholder="Any specific feedback..." value={r.comment||""} onChange={(e)=>setComment(dept,e.target.value)}/>
                    </div>
                  </div>
                );
              })}
            </div>
          }
          {error&&<div className="error-msg">{error}</div>}
          <div style={{display:"flex",gap:12,marginTop:16,flexWrap:"wrap"}}>
            <button className="submit-btn" style={{background:"#6C7A89"}} onClick={()=>{setStep(1);setError("");}}>← Back</button>
            <button className="submit-btn" onClick={handleSubmit} disabled={saving}>{saving?"Submitting…":"Submit Survey"}</button>
          </div>
        </>)}
      </div>
    </div>
  );
}

function Dashboard({responses,theme,plants,departments,shifts,companyName,logoUrl,onDeleteResponses,onAddDummyEntry}){
  const [pf,setPf]=useState(ALL_PLANTS_ID);
  const [rf,setRf]=useState("All");
  const [ff,setFf]=useState("All");
  const [tf,setTf]=useState("All"); // tenure filter
  const tableRef=useRef(null);
  const scrollToTable=()=>setTimeout(()=>tableRef.current&&tableRef.current.scrollIntoView({behavior:"smooth",block:"start"}),50);
  const applyFilter=(opts)=>{
    if(opts.rf!==undefined)setRf(opts.rf);
    if(opts.ff!==undefined)setFf(opts.ff);
    if(opts.tf!==undefined)setTf(opts.tf);
    if(opts.pf!==undefined)setPf(opts.pf);
    scrollToTable();
  };
  const clearFilters=()=>{setRf("All");setFf("All");setTf("All");};
  const [selIds,setSelIds]=useState({});
  const [bulkBusy,setBulkBusy]=useState(false);
  const [bulkErr,setBulkErr]=useState("");
  const [expBusy,setExpBusy]=useState(false);
  const [expXlsBusy,setExpXlsBusy]=useState(false);
  const [dummyBusy,setDummyBusy]=useState(false);
  const [dummyCount,setDummyCount]=useState(0);
  const ct=CHART_THEME[theme]||CHART_THEME.dark;

  const flatRows=useMemo(()=>{
    const rows=[];
    responses.forEach((r)=>{Object.entries(r.deptRatings||{}).forEach(([dept,info])=>{
      const score=deptOverallScore(info);
      rows.push({...r,ratedDept:dept,rating:score,factors:info.factors||{},comment:info.comment||"",_fid:`${r.id}__${dept}`});
    });});
    return rows;
  },[responses]);

  const filteredResponses=useMemo(()=>responses.filter((r)=>(pf===ALL_PLANTS_ID||r.plant===pf)&&(tf==="All"||r.tenure===tf)),[responses,pf,tf]);
  const filteredFlatRows=useMemo(()=>flatRows.filter((r)=>(pf===ALL_PLANTS_ID||r.plant===pf)&&(tf==="All"||r.tenure===tf)),[flatRows,pf,tf]);
  const filtered=useMemo(()=>flatRows.filter((r)=>(pf===ALL_PLANTS_ID||r.plant===pf)&&(rf==="All"||r.ratedDept===rf)&&(ff==="All"||r.submitterDept===ff)&&(tf==="All"||r.tenure===tf)),[flatRows,pf,rf,ff,tf]);
  const overall=useMemo(()=>{const v=filtered.filter((r)=>r.rating>0);return v.length?v.reduce((s,r)=>s+r.rating,0)/v.length:0;},[filtered]);

  const deptData=useMemo(()=>{
    const m={};
    filtered.forEach((r)=>{if(!r.rating)return;if(!m[r.ratedDept])m[r.ratedDept]={total:0,count:0};m[r.ratedDept].total+=r.rating;m[r.ratedDept].count+=1;});
    return Object.entries(m).map(([name,d])=>({name,score:Math.round((d.total/d.count)*10)/10,count:d.count})).sort((a,b)=>b.score-a.score||b.count-a.count);
  },[filtered]);

  const topDept=deptData[0],lowDept=deptData.length>1?deptData[deptData.length-1]:null;

  const trendData=useMemo(()=>{
    const wm={};
    filtered.forEach((r)=>{if(!r.rating)return;const d=new Date(r.ts),y=d.getFullYear(),wk=Math.ceil(((d-new Date(y,0,1))/86400000+1)/7),key=`${y}-W${String(wk).padStart(2,"0")}`;if(!wm[key])wm[key]={total:0,count:0};wm[key].total+=r.rating;wm[key].count+=1;});
    return Object.entries(wm).sort(([a],[b])=>a.localeCompare(b)).map(([week,d])=>({week,score:parseFloat((d.total/d.count).toFixed(2))}));
  },[filtered]);

  const tenureData=useMemo(()=>{
    const m={};
    filteredResponses.forEach((r)=>{if((ff==="All"||r.submitterDept===ff)&&r.tenure)m[r.tenure]=(m[r.tenure]||0)+1;});
    const total=Object.values(m).reduce((s,v)=>s+v,0);
    return TENURE_OPTIONS.filter((k)=>m[k]).map((k)=>({key:k,name:k,count:m[k],pct:total?Math.round(m[k]/total*100):0,color:TENURE_COLORS[k]}));
  },[filteredResponses,ff]);
  const tenureTotal=tenureData.reduce((s,d)=>s+d.count,0);

  const comments=useMemo(()=>filtered.filter((r)=>r.comment).slice(-10).reverse(),[filtered]);

  // Per-department per-factor averages  { dept: { factorId: avg } }
  const factorAvgs=useMemo(()=>{
    const acc={};
    filtered.forEach((r)=>{
      if(!r.factors||!Object.keys(r.factors).length) return;
      if(!acc[r.ratedDept]) acc[r.ratedDept]={};
      DEPT_FACTORS.forEach(f=>{
        const v=r.factors[f.id];
        if(v>0){ if(!acc[r.ratedDept][f.id]) acc[r.ratedDept][f.id]=[]; acc[r.ratedDept][f.id].push(v); }
      });
    });
    const result={};
    Object.entries(acc).forEach(([dept,fm])=>{
      result[dept]={};
      DEPT_FACTORS.forEach(f=>{ const arr=fm[f.id]||[]; result[dept][f.id]=arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:0; });
    });
    return result;
  },[filtered]);
  const ratedOpts=useMemo(()=>Array.from(new Set([...departments,...filteredFlatRows.map((r)=>r.ratedDept)])),[departments,filteredFlatRows]);
  const fromOpts=useMemo(()=>Array.from(new Set([...departments,...filteredResponses.map((r)=>r.submitterDept)])),[departments,filteredResponses]);

  const selCount=Object.values(selIds).filter(Boolean).length;
  const allSel=filteredResponses.length>0&&filteredResponses.every((r)=>selIds[r.id]);
  const toggleSel=(id)=>setSelIds((p)=>({...p,[id]:!p[id]}));
  const toggleAll=()=>{if(allSel)setSelIds({});else{const m={};filteredResponses.forEach((r)=>{m[r.id]=true;});setSelIds(m);}};

  const handleDel=async()=>{
    const ids=Object.keys(selIds).filter((id)=>selIds[id]);
    if(!ids.length)return;
    if(!window.confirm(`Delete ${ids.length} response${ids.length===1?"":"s"}? This can't be undone.`))return;
    setBulkBusy(true);setBulkErr("");
    try{await onDeleteResponses(ids);setSelIds({});}catch(e){setBulkErr((e&&(e.message||e.code))||String(e));}
    setBulkBusy(false);
  };

  const handleDummyEntry=async()=>{
    if(!departments.length){setBulkErr("Add at least 2 departments in Settings before inserting dummy data.");return;}
    setDummyBusy(true);setBulkErr("");
    try{
      const rng=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
      const pick=(arr)=>arr[Math.floor(Math.random()*arr.length)];
      const NAMES=["Amit Sharma","Priya Singh","Ravi Kumar","Sunita Patel","Deepak Verma","Meena Joshi","Rahul Gupta","Anjali Mehta","Vikram Nair","Pooja Reddy","Suresh Rao","Kavita Iyer"];
      const CODES=["EMP","TL","MGR","SR","JR"];
      const COMMENTS_POOL=[
        "Very professional team, always delivers on time.",
        "Communication could be improved, but work quality is great.",
        "Excellent support during the critical project phase.",
        "Response times need improvement but overall cooperative.",
        "Outstanding collaboration during the quarterly review.",
        "Sometimes hard to reach, but issues get resolved eventually.",
        "Proactive and helpful, a pleasure to work with.",
        "Quality of deliverables has improved significantly this quarter.",
        "Would appreciate faster turnaround on urgent requests.",
        "Great team spirit and willingness to assist.",
        ""
      ];
      const submitterDept=pick(departments);
      const ratableDepts=departments.filter(d=>d!==submitterDept);
      const numToRate=Math.min(ratableDepts.length, rng(2, Math.max(2,ratableDepts.length)));
      const toRate=[...ratableDepts].sort(()=>Math.random()-0.5).slice(0,numToRate);
      const deptRatings={};
      toRate.forEach(dept=>{
        const base=rng(2,5);
        const factors={};
        DEPT_FACTORS.forEach(f=>{ factors[f.id]=Math.min(5,Math.max(1,base+rng(-1,1))); });
        const vals=DEPT_FACTORS.map(f=>factors[f.id]);
        const avg=parseFloat((vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(2));
        deptRatings[dept]={factors,rating:avg,comment:Math.random()>0.4?pick(COMMENTS_POOL.filter(c=>c)):""};
      });
      const newCount=dummyCount+1;
      const payload={
        id:`dummy-${Date.now()}-${Math.floor(Math.random()*9999)}`,
        ts:new Date(Date.now()-rng(0,30)*86400000).toISOString(),
        plant:pick(plants)||"Main Plant",
        submitterDept,
        shift:pick(shifts)||"Day",
        tenure:pick(TENURE_OPTIONS),
        anonymous:Math.random()>0.4,
        employeeCode:`${pick(CODES)}${rng(1000,9999)}`,
        employeeName:pick(NAMES),
        deptRatings,
        _isDummy:true,
      };
      await onAddDummyEntry(payload);
      setDummyCount(newCount);
    }catch(e){setBulkErr((e&&(e.message||e.code))||String(e));}
    setDummyBusy(false);
  };

  const handleExportPdf=async()=>{
    setExpBusy(true);
    try{
      const {jsPDF}=window.jspdf;
      const doc=new jsPDF({orientation:"portrait",unit:"mm",format:"a4"});
      const W=doc.internal.pageSize.getWidth();
      const pageH=doc.internal.pageSize.getHeight();
      const margin=14;
      const contentW=W-margin*2;
      let y=margin;

      // ── Helper: section heading ────────────────────────────────
      const sectionHead=(title)=>{
        if(y>pageH-40){doc.addPage();y=margin;}
        doc.setFillColor(99,102,241);
        doc.rect(margin,y,contentW,7,"F");
        doc.setTextColor(255,255,255);
        doc.setFontSize(9);
        doc.setFont("helvetica","bold");
        doc.text(title.toUpperCase(),margin+3,y+5);
        doc.setTextColor(30,30,30);
        doc.setFont("helvetica","normal");
        y+=10;
      };

      // ── Cover header ───────────────────────────────────────────
      doc.setFillColor(30,34,41);
      doc.rect(0,0,W,38,"F");
      // gradient rainbow line (matches web dashboard HazardBar)
      const gradCanvas=document.createElement("canvas");
      gradCanvas.width=Math.round(W*4);gradCanvas.height=8;
      const gradCtx=gradCanvas.getContext("2d");
      const grad=gradCtx.createLinearGradient(0,0,gradCanvas.width,0);
      grad.addColorStop(0,"#9B6BD1");
      grad.addColorStop(0.3,"#3E8FB0");
      grad.addColorStop(0.55,"#4C9A6A");
      grad.addColorStop(0.78,"#F5B400");
      grad.addColorStop(1,"#E8552D");
      gradCtx.fillStyle=grad;
      gradCtx.fillRect(0,0,gradCanvas.width,8);
      doc.addImage(gradCanvas.toDataURL("image/png"),"PNG",0,36,W,2);
      if(logoUrl){
        try{
          await new Promise((resolve)=>{
            const img=new Image();
            img.onload=()=>{
              const maxH=16,maxW=70;
              const ratio=img.naturalWidth/img.naturalHeight;
              let drawW=maxH*ratio;
              let drawH=maxH;
              if(drawW>maxW){drawW=maxW;drawH=maxW/ratio;}
              const drawY=4+(maxH-drawH)/2;
              const scale=4;
              const mmToPx=3.7795275591;
              const cvW=Math.round(drawW*mmToPx*scale);
              const cvH=Math.round(drawH*mmToPx*scale);
              const cv=document.createElement("canvas");
              cv.width=cvW;cv.height=cvH;
              const ctx=cv.getContext("2d");
              ctx.imageSmoothingEnabled=true;
              ctx.imageSmoothingQuality="high";
              ctx.drawImage(img,0,0,cvW,cvH);
              const hdDataUrl=cv.toDataURL("image/png");
              doc.addImage(hdDataUrl,"PNG",margin,drawY,drawW,drawH,undefined,"NONE");
              resolve();
            };
            img.onerror=()=>resolve();
            img.src=logoUrl;
          });
        }catch(e){
          doc.setTextColor(245,180,0);
          doc.setFontSize(8);
          doc.setFont("helvetica","bold");
          doc.text(companyName.toUpperCase(),margin,12,{charSpace:1.5});
        }
      }else{
        doc.setTextColor(245,180,0);
        doc.setFontSize(8);
        doc.setFont("helvetica","bold");
        doc.text(companyName.toUpperCase(),margin,12,{charSpace:1.5});
      }
      doc.setTextColor(237,234,226);
      doc.setFontSize(16);
      doc.text("Inter-Department Satisfaction",margin,24);
      doc.setFontSize(8);
      doc.setFont("helvetica","normal");
      doc.setTextColor(154,161,168);
      doc.text(`Generated: ${new Date().toLocaleString()}`,margin,31);
      if(pf!==ALL_PLANTS_ID||rf!=="All"||ff!=="All"){
        const filterText=[pf!==ALL_PLANTS_ID?pf:null,rf!=="All"?rf:null,ff!=="All"?ff:null].filter(Boolean).join(" · ");
        doc.text(`Filter: ${filterText}`,W-margin,31,{align:"right"});
      }
      doc.setTextColor(30,30,30);
      y=46;

      // ── Overall score row ──────────────────────────────────────
      sectionHead("Overall Satisfaction Score");

      const rowH=68;
      const gaugeCardW=contentW*0.44;
      const kpiAreaX=margin+gaugeCardW+4;
      const kpiAreaW=contentW-gaugeCardW-4;
      const kpiCols=2,kpiRows=2;
      const kpiW=kpiAreaW/kpiCols-2;
      const kpiH=rowH/kpiRows-2;

      // Gauge card background
      doc.setFillColor(248,246,240);
      doc.setDrawColor(220,215,201);
      doc.setLineWidth(0.4);
      doc.roundedRect(margin,y,gaugeCardW,rowH,3,3,"FD");

      doc.setFontSize(6);
      doc.setFont("helvetica","bold");
      doc.setTextColor(107,106,98);
      doc.text("OVERALL SATISFACTION",margin+4,y+6);

      // Draw gauge arc
      const gR=20;
      const gCx=margin+gaugeCardW/2;
      const gCy=y+10+gR+4;
      const drawArc=(startPct,endPct,r,col)=>{
        doc.setDrawColor(...col);
        doc.setLineWidth(4.5);
        const steps=40;
        const points=[];
        for(let i=0;i<=steps;i++){
          const p=startPct+(endPct-startPct)*(i/steps);
          const a=Math.PI-p*Math.PI;
          points.push([gCx+r*Math.cos(a),gCy-r*Math.sin(a)]);
        }
        for(let i=0;i<points.length-1;i++){
          doc.line(points[i][0],points[i][1],points[i+1][0],points[i+1][1]);
        }
      };
      drawArc(0,0.333,gR,[232,85,45]);
      drawArc(0.333,0.667,gR,[245,180,0]);
      drawArc(0.667,1,gR,[76,154,106]);

      // Scale tick labels: 1, 3, 5
      doc.setFontSize(5);
      doc.setFont("helvetica","normal");
      doc.setTextColor(107,106,98);
      [[1,0],[3,0.5],[5,1]].forEach(([v,p])=>{
        const a=Math.PI-p*Math.PI;
        const lr=gR-6;
        const lx=gCx+lr*Math.cos(a);
        const ly=gCy-lr*Math.sin(a);
        doc.text(String(v),lx,ly+1.5,{align:"center"});
      });

      // Needle
      const pct=Math.max(0,Math.min(1,(overall-1)/4));
      const na=Math.PI-pct*Math.PI;
      const nLen=gR-3;
      const ndx=Math.cos(na),ndy=-Math.sin(na);
      const pdx=Math.sin(na),pdy=Math.cos(na);
      const baseInset=1.6,baseHalfW=1.1;
      const tailLen=2.6,tailHalfW=0.8;
      const tipX=gCx+nLen*ndx,tipY=gCy+nLen*ndy;
      const b1X=gCx+baseInset*ndx+baseHalfW*pdx,b1Y=gCy+baseInset*ndy+baseHalfW*pdy;
      const b2X=gCx+baseInset*ndx-baseHalfW*pdx,b2Y=gCy+baseInset*ndy-baseHalfW*pdy;
      const t1X=gCx-tailLen*ndx+tailHalfW*pdx,t1Y=gCy-tailLen*ndy+tailHalfW*pdy;
      const t2X=gCx-tailLen*ndx-tailHalfW*pdx,t2Y=gCy-tailLen*ndy-tailHalfW*pdy;
      doc.setFillColor(27,58,107);
      doc.setDrawColor(27,58,107);
      doc.setLineWidth(0.1);
      doc.lines(
        [[b1X-tipX,b1Y-tipY],[t1X-b1X,t1Y-b1Y],[t2X-t1X,t2Y-t1Y],[b2X-t2X,b2Y-t2Y]],
        tipX,tipY,[1,1],"FD",true
      );
      doc.setFillColor(255,255,255);
      doc.setDrawColor(180,175,165);
      doc.setLineWidth(0.5);
      doc.circle(gCx,gCy,3,"FD");
      doc.setFillColor(76,154,106);
      doc.circle(gCx,gCy,1.5,"F");

      // Score pill
      const scoreAccentPdf=overall>=4?[76,154,106]:overall>=3?[245,180,0]:[232,85,45];
      const pillY=gCy+5;
      const pillW=28,pillH=16,pillRx=3;
      doc.setFillColor(255,255,255);
      doc.setDrawColor(220,215,201);
      doc.setLineWidth(0.4);
      doc.roundedRect(gCx-pillW/2,pillY,pillW,pillH,pillRx,pillRx,"FD");
      doc.setFontSize(13);
      doc.setFont("helvetica","bold");
      doc.setTextColor(...scoreAccentPdf);
      doc.text(fmt1(overall),gCx,pillY+10,{align:"center"});
      doc.setFontSize(4.5);
      doc.setFont("helvetica","normal");
      doc.setTextColor(107,106,98);
      doc.text("OUT OF 5.0",gCx,pillY+13.5,{align:"center"});

      // 2×2 KPI grid
      const kpis2x2=[
        {label:"Total Submissions",value:String(filteredResponses.length),sub:null,accent:null},
        {label:"Total Ratings",value:String(filtered.length),sub:null,accent:null},
        {label:"Highest Rated",value:topDept?topDept.name:"—",sub:topDept?`${fmt1(topDept.score)} / 5.0`:null,accent:[76,154,106]},
        {label:"Needs Attention",value:lowDept?lowDept.name:"—",sub:lowDept?`${fmt1(lowDept.score)} / 5.0`:null,accent:[232,85,45]},
      ];
      kpis2x2.forEach((k,i)=>{
        const col=i%kpiCols;
        const row=Math.floor(i/kpiCols);
        const kx=kpiAreaX+col*(kpiW+2);
        const ky=y+row*(kpiH+2);
        doc.setFillColor(255,255,255);
        doc.setDrawColor(220,215,201);
        doc.setLineWidth(0.3);
        doc.roundedRect(kx,ky,kpiW,kpiH,2,2,"FD");
        doc.setFontSize(7.5);
        doc.setFont("helvetica","normal");
        doc.setTextColor(107,106,98);
        doc.text(k.label.toUpperCase(),kx+4,ky+7);
        doc.setFontSize(k.value.length>12?10.5:14);
        doc.setFont("helvetica","bold");
        if(k.accent)doc.setTextColor(...k.accent);
        else doc.setTextColor(30,34,41);
        const maxValueW=kpiW-8;
        const valueLines=doc.splitTextToSize(k.value,maxValueW);
        valueLines.forEach((ln,li)=>doc.text(ln,kx+4,ky+17+li*7));
        if(k.sub){
          doc.setFontSize(7.5);
          doc.setFont("helvetica","normal");
          doc.setTextColor(107,106,98);
          doc.text(k.sub,kx+4,ky+kpiH-4);
        }
      });
      y+=rowH+4;

      // ── Tenure donut + legend bars ────────────────────────────
      if(tenureData.length){
        sectionHead("Responses by Tenure");
        const tenureBlockH=Math.max(52, tenureData.length*14+16);
        if(y>pageH-tenureBlockH-10){doc.addPage();y=margin;}

        // ── Draw donut using canvas → image (reliable cross-browser) ──
        const donutSize=120; // canvas px
        const donutCanvas=document.createElement("canvas");
        donutCanvas.width=donutSize; donutCanvas.height=donutSize;
        const dCtx=donutCanvas.getContext("2d");
        const dTotal2=tenureData.reduce((s,d)=>s+d.count,0);
        let ang=-Math.PI/2;
        tenureData.forEach((d)=>{
          const span=(d.count/dTotal2)*Math.PI*2;
          dCtx.beginPath();
          dCtx.moveTo(donutSize/2,donutSize/2);
          dCtx.arc(donutSize/2,donutSize/2,donutSize/2-2,ang,ang+span);
          dCtx.closePath();
          dCtx.fillStyle=d.color;
          dCtx.fill();
          ang+=span;
        });
        // inner hole
        dCtx.beginPath();
        dCtx.arc(donutSize/2,donutSize/2,donutSize*0.34,0,Math.PI*2);
        dCtx.fillStyle="#ffffff";
        dCtx.fill();
        // center text
        dCtx.fillStyle="#1e2229";
        dCtx.font="bold 22px sans-serif";
        dCtx.textAlign="center";
        dCtx.fillText(String(dTotal2),donutSize/2,donutSize/2+4);
        dCtx.fillStyle="#6b6a62";
        dCtx.font="11px sans-serif";
        dCtx.fillText("responses",donutSize/2,donutSize/2+18);
        // white dividing lines between segments (inner radius → outer radius only, not through center)
        const innerR=donutSize*0.34;
        ang=-Math.PI/2;
        tenureData.forEach((d)=>{
          const span=(d.count/dTotal2)*Math.PI*2;
          dCtx.beginPath();
          dCtx.moveTo(
            donutSize/2+Math.cos(ang)*innerR,
            donutSize/2+Math.sin(ang)*innerR
          );
          dCtx.lineTo(
            donutSize/2+Math.cos(ang)*(donutSize/2-2),
            donutSize/2+Math.sin(ang)*(donutSize/2-2)
          );
          dCtx.strokeStyle="#ffffff";
          dCtx.lineWidth=2;
          dCtx.stroke();
          ang+=span;
        });
        const donutMM=46;
        doc.addImage(donutCanvas.toDataURL("image/png"),"PNG",margin,y,donutMM,donutMM);

        // ── Legend bars on the right ──────────────────────────────
        const lx=margin+donutMM+8;
        const lw=contentW-donutMM-8;
        const barTrackW=lw*0.52;
        const barH=3.5;
        const rowGap=14;
        tenureData.forEach((d,i)=>{
          const ly=y+6+i*rowGap;
          const hex=d.color.replace("#","");
          const n=parseInt(hex,16);
          const rc=(n>>16)&255, gc=(n>>8)&255, bc=n&255;

          // Dot
          doc.setFillColor(rc,gc,bc);
          doc.circle(lx+2,ly+2,2,"F");

          // Name
          doc.setFontSize(8);
          doc.setFont("helvetica","normal");
          doc.setTextColor(30,34,41);
          doc.text(d.name,lx+6,ly+3.5);

          // Bar track (grey)
          const nameW=doc.getTextWidth(d.name);
          const barX=lx+6+nameW+3;
          doc.setFillColor(220,215,205);
          doc.roundedRect(barX,ly+0.5,barTrackW,barH,1,1,"F");

          // Bar fill
          const fillW=Math.max(0,(d.pct/100)*barTrackW);
          doc.setFillColor(rc,gc,bc);
          if(fillW>0.5)doc.roundedRect(barX,ly+0.5,fillW,barH,1,1,"F");

          // Pct + count
          doc.setFontSize(7.5);
          doc.setFont("helvetica","bold");
          doc.setTextColor(30,34,41);
          doc.text(`${d.pct}%`,barX+barTrackW+3,ly+3.5);
          doc.setFont("helvetica","normal");
          doc.setTextColor(107,106,98);
          doc.text(String(d.count),barX+barTrackW+14,ly+3.5);
        });
        y+=Math.max(donutMM+4, tenureData.length*rowGap+10);
      }

      // ── Dept bar chart ─────────────────────────────────────────
      if(deptData.length){
        sectionHead("Average Rating by Department");
        const dSorted=[...deptData].sort((a,b)=>b.score-a.score||b.count-a.count);
        const labelColW=42;
        const barAreaX=margin+labelColW;
        const barAreaW=contentW-labelColW-18;
        const dBarH=5;
        const dRowH=9;
        const dMax=5;
        const chartTotalH=dSorted.length*dRowH+8;
        if(y+chartTotalH>pageH-margin){doc.addPage();y=margin;}
        const chartStartY=y;
        [0,1,2,3,4,5].forEach((v)=>{
          const gx=barAreaX+(v/dMax)*barAreaW;
          doc.setDrawColor(220,215,200);
          doc.setLineWidth(0.2);
          doc.line(gx,chartStartY,gx,chartStartY+dSorted.length*dRowH);
          doc.setFontSize(5.5);
          doc.setTextColor(154,161,168);
          doc.text(String(v),gx,chartStartY+dSorted.length*dRowH+5,{align:"center"});
        });
        dSorted.forEach((d,i)=>{
          const rowY=chartStartY+i*dRowH;
          doc.setFontSize(7);
          doc.setFont("helvetica","normal");
          doc.setTextColor(30,34,41);
          const nameLines=doc.splitTextToSize(d.name,labelColW-3);
          doc.text(nameLines[0],margin+labelColW-3,rowY+dBarH-0.5,{align:"right"});
          doc.setFillColor(230,227,220);
          doc.roundedRect(barAreaX,rowY,barAreaW,dBarH,1,1,"F");
          const fillW=Math.max(0,(d.score/dMax)*barAreaW);
          const barCol=d.score>=4?[76,154,106]:d.score>=3?[245,180,0]:[232,85,45];
          doc.setFillColor(...barCol);
          if(fillW>0)doc.roundedRect(barAreaX,rowY,fillW,dBarH,1,1,"F");
          doc.setFontSize(7);
          doc.setFont("helvetica","bold");
          doc.setTextColor(...barCol);
          doc.text(fmt1(d.score),barAreaX+barAreaW+3,rowY+dBarH-0.5);
          doc.setFontSize(6);
          doc.setFont("helvetica","normal");
          doc.setTextColor(154,161,168);
          doc.text(`n=${d.count}`,barAreaX+barAreaW+14,rowY+dBarH-0.5);
        });
        y=chartStartY+chartTotalH+4;
        if(y>pageH-40){doc.addPage();y=margin;}
        doc.autoTable({
          startY:y,
          head:[["Department","Avg Rating","Score /5","Ratings Count"]],
          body:dSorted.map((d)=>[d.name,fmt1(d.score),`${Math.round(d.score)} / 5`,d.count]),
          styles:{fontSize:8,cellPadding:3},
          headStyles:{fillColor:[99,102,241],textColor:255,fontStyle:"bold",fontSize:8},
          margin:{left:margin,right:margin},
          didDrawCell:(data)=>{
            if(data.section==="body"){
              doc.setDrawColor(210,207,200);doc.setLineWidth(0.3);
              doc.line(data.cell.x,data.cell.y+data.cell.height,data.cell.x+data.cell.width,data.cell.y+data.cell.height);
            }
          },
        });
        y=doc.lastAutoTable.finalY+6;
      }

      // ── Factor Breakdown by Department ───────────────────────
      const pdfFactorAvgs={};
      filtered.forEach((r)=>{
        if(!r.factors||!Object.keys(r.factors).length)return;
        if(!pdfFactorAvgs[r.ratedDept])pdfFactorAvgs[r.ratedDept]={};
        DEPT_FACTORS.forEach(f=>{
          const v=r.factors[f.id];
          if(v>0){if(!pdfFactorAvgs[r.ratedDept][f.id])pdfFactorAvgs[r.ratedDept][f.id]=[];pdfFactorAvgs[r.ratedDept][f.id].push(v);}
        });
      });
      const pdfFactorDepts=Object.keys(pdfFactorAvgs);
      if(pdfFactorDepts.length){
        sectionHead("Factor Breakdown by Department");
        if(y>pageH-40){doc.addPage();y=margin;}
        doc.autoTable({
          startY:y,
          head:[["Department",...DEPT_FACTORS.map(f=>f.label),"Overall"]],
          body:pdfFactorDepts.sort().map((dept)=>{
            const fm=pdfFactorAvgs[dept];
            const vals=DEPT_FACTORS.map(f=>{const arr=fm[f.id]||[];return arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:0;});
            const nonZero=vals.filter(v=>v>0);
            const overall=nonZero.length?nonZero.reduce((a,b)=>a+b,0)/nonZero.length:0;
            return[dept,...vals.map(v=>v>0?fmt1(v):"—"),overall>0?fmt1(overall):"—"];
          }),
          styles:{fontSize:8,cellPadding:3},
          headStyles:{fillColor:[99,102,241],textColor:255,fontStyle:"bold",fontSize:8},
          margin:{left:margin,right:margin},
        });
        y=doc.lastAutoTable.finalY+6;
      }

      // ── Department-wise Participation ───────────────────────
      {
        const deptPartPdf={};
        filteredResponses.forEach(r=>{
          const d=r.submitterDept;if(!d)return;
          if(!deptPartPdf[d]){deptPartPdf[d]={dept:d,count:0,empCodes:new Set()};}
          deptPartPdf[d].count+=1;
          if(r.employeeCode)deptPartPdf[d].empCodes.add(r.employeeCode.toUpperCase());
        });
        const partRows=Object.values(deptPartPdf).sort((a,b)=>b.count-a.count);
        const partTotal=partRows.reduce((s,r)=>s+r.count,0);
        if(partRows.length){
          sectionHead("Department-wise Participation");
          if(y>pageH-40){doc.addPage();y=margin;}
          doc.autoTable({
            startY:y,
            head:[["Department","Submissions","Unique Employees","Share %"]],
            body:partRows.map(r=>[r.dept,r.count,r.empCodes.size,partTotal?`${Math.round(r.count/partTotal*100)}%`:"0%"]),
            styles:{fontSize:8,cellPadding:3},
            headStyles:{fillColor:[99,102,241],textColor:255,fontStyle:"bold",fontSize:8},
            columnStyles:{1:{halign:"center"},2:{halign:"center"},3:{halign:"center"}},
            margin:{left:margin,right:margin},
          });
          y=doc.lastAutoTable.finalY+6;
        }
      }

      // ── Trend ─────────────────────────────────────────────────
      if(trendData.length>1){
        sectionHead("Rating Trend (Weekly Average)");
        const tw=contentW,th=30,tx0=margin,ty0=y+th;
        const tMin=1,tMax=5;
        const tScaleX=(i)=>tx0+(i/(trendData.length-1))*tw;
        const tScaleY=(v)=>ty0-((v-tMin)/(tMax-tMin))*th;
        [2,3,4,5].forEach((v)=>{
          doc.setDrawColor(210,207,200);
          doc.setLineWidth(0.2);
          doc.line(tx0,tScaleY(v),tx0+tw,tScaleY(v));
          doc.setFontSize(6);
          doc.setTextColor(154,161,168);
          doc.text(String(v),tx0-4,tScaleY(v)+2,{align:"right"});
        });
        doc.setDrawColor(99,102,241);
        doc.setLineWidth(1.2);
        trendData.forEach((d,i)=>{
          if(i===0)return;
          doc.line(tScaleX(i-1),tScaleY(trendData[i-1].score),tScaleX(i),tScaleY(d.score));
        });
        trendData.forEach((d,i)=>{
          doc.setFillColor(99,102,241);
          doc.circle(tScaleX(i),tScaleY(d.score),1.2,"F");
          if(i%Math.max(1,Math.floor(trendData.length/6))===0){
            doc.setFontSize(6);
            doc.setTextColor(107,106,98);
            doc.text(d.week,tScaleX(i),ty0+5,{align:"center"});
          }
        });
        y=ty0+10;
      }

      // ── Recent Comments ───────────────────────────────────────
      if(comments.length){
        sectionHead("Recent Comments");
        comments.forEach((r)=>{
          if(y>pageH-30){doc.addPage();y=margin;}
          doc.setFillColor(245,243,238);
          doc.roundedRect(margin,y,contentW,20,2,2,"F");
          doc.setFont("helvetica","bold");doc.setFontSize(7.5);doc.setTextColor(62,143,176);
          const fromW=doc.getTextWidth(r.submitterDept);
          doc.text(r.submitterDept,margin+4,y+7);
          doc.setTextColor(150,150,160);doc.text(" → ",margin+4+fromW,y+7);
          const arrowW=doc.getTextWidth(" → ");
          doc.setTextColor(232,85,45);doc.text(r.ratedDept,margin+4+fromW+arrowW,y+7);
          const toW=doc.getTextWidth(r.ratedDept);
          doc.setTextColor(120,120,140);doc.setFont("helvetica","normal");doc.setFontSize(7);
          doc.text(`  ${r.rating}/5  ·  ${new Date(r.ts).toLocaleDateString()}`,margin+4+fromW+arrowW+toW,y+7);
          doc.setTextColor(50,54,61);doc.setFontSize(7);
          const lines=doc.splitTextToSize(r.comment||"",contentW-8);
          doc.text(lines[0],margin+4,y+15);
          y+=24;
        });
        y+=4;
      }

      // ── All responses table ───────────────────────────────────
      doc.addPage();y=margin;
      sectionHead("All Responses");
      doc.autoTable({
        startY:y,
        head:[["Date","Plant","Code","Name","From Dept","Rated Dept","Collab","Comm","Resp","Quality","Support","Avg","Comment","Shift","Tenure"]],
        body:filtered.map((r)=>[
          new Date(r.ts).toLocaleDateString(),
          r.plant||"—",
          r.employeeCode||"—",r.employeeName||"—",
          r.submitterDept,r.ratedDept,
          r.factors&&r.factors.collaboration?`${r.factors.collaboration}★`:"—",
          r.factors&&r.factors.communication?`${r.factors.communication}★`:"—",
          r.factors&&r.factors.responsiveness?`${r.factors.responsiveness}★`:"—",
          r.factors&&r.factors.quality_of_work?`${r.factors.quality_of_work}★`:"—",
          r.factors&&r.factors.support_helpfulness?`${r.factors.support_helpfulness}★`:"—",
          r.rating?fmt1(r.rating):"—",
          r.comment||"",r.shift,r.tenure||"—"
        ]),
        styles:{fontSize:7,cellPadding:2,overflow:"linebreak"},
        headStyles:{fillColor:[99,102,241],textColor:255,fontStyle:"bold",fontSize:7},
        columnStyles:{6:{cellWidth:38}},
        margin:{left:margin,right:margin},
        didDrawCell:(data)=>{
          if(data.section==="body"){
            doc.setDrawColor(210,207,200);doc.setLineWidth(0.3);
            doc.line(data.cell.x,data.cell.y+data.cell.height,data.cell.x+data.cell.width,data.cell.y+data.cell.height);
          }
        },
      });

      // ── Footer on every page ──────────────────────────────────
      const totalPages=doc.internal.getNumberOfPages();
      for(let p=1;p<=totalPages;p++){
        doc.setPage(p);
        doc.setFontSize(7);
        doc.setTextColor(154,161,168);
        doc.text(companyName,margin,pageH-6);
        doc.text(`${p} / ${totalPages}`,W-margin,pageH-6,{align:"right"});
      }

      doc.save(`inter-dept-satisfaction-${new Date().toISOString().slice(0,10)}.pdf`);
    }catch(e){console.error("PDF export failed:",e);setBulkErr((e&&e.message)||String(e));}
    setExpBusy(false);
  };

  const handleExportExcel=()=>{
    if(!window.XLSX){setBulkErr("Excel library not loaded yet. Please wait a moment and try again.");return;}
    setExpXlsBusy(true);
    try{
      const XLSX=window.XLSX;
      const wb=XLSX.utils.book_new();
      const dateStr=new Date().toISOString().slice(0,10);

      // ── Sheet 1: All Responses ────────────────────────────
      const respHeader=["Date","Plant","Emp Code","Emp Name","From Dept","Rated Dept","Collaboration","Communication","Responsiveness","Quality of Work","Support & Helpfulness","Avg Rating","Comment","Shift","Tenure"];
      const respBody=filtered.map(r=>[
        new Date(r.ts).toLocaleDateString(),
        r.plant||"",r.employeeCode||"",r.employeeName||"",
        r.submitterDept,r.ratedDept,
        r.factors&&r.factors.collaboration||"",
        r.factors&&r.factors.communication||"",
        r.factors&&r.factors.responsiveness||"",
        r.factors&&r.factors.quality_of_work||"",
        r.factors&&r.factors.support_helpfulness||"",
        r.rating?parseFloat(fmt1(r.rating)):"",
        r.comment||"",r.shift,r.tenure||"",
      ]);
      const wsResp=XLSX.utils.aoa_to_sheet([respHeader,...respBody]);
      wsResp["!cols"]=[{wch:12},{wch:14},{wch:12},{wch:18},{wch:20},{wch:20},{wch:14},{wch:14},{wch:14},{wch:14},{wch:18},{wch:11},{wch:36},{wch:10},{wch:10}];
      XLSX.utils.book_append_sheet(wb,wsResp,"All Responses");

      // ── Sheet 2: Dept Summary ─────────────────────────────
      const dSorted=[...deptData].sort((a,b)=>b.score-a.score||b.count-a.count);
      const deptHeader=["Department","Avg Rating","Ratings Count"];
      const deptBody=dSorted.map(d=>[d.name,parseFloat(fmt1(d.score)),d.count]);
      const wsDept=XLSX.utils.aoa_to_sheet([deptHeader,...deptBody]);
      wsDept["!cols"]=[{wch:24},{wch:12},{wch:14}];
      XLSX.utils.book_append_sheet(wb,wsDept,"Dept Rating Summary");

      // ── Sheet 3: Factor Breakdown ─────────────────────────
      const fbHeader=["Department",...DEPT_FACTORS.map(f=>f.label),"Overall"];
      const pdfFa={};
      filtered.forEach(r=>{
        if(!r.factors||!Object.keys(r.factors).length)return;
        if(!pdfFa[r.ratedDept])pdfFa[r.ratedDept]={};
        DEPT_FACTORS.forEach(f=>{
          const v=r.factors[f.id];
          if(v>0){if(!pdfFa[r.ratedDept][f.id])pdfFa[r.ratedDept][f.id]=[];pdfFa[r.ratedDept][f.id].push(v);}
        });
      });
      const fbBody=Object.keys(pdfFa).sort().map(dept=>{
        const fm=pdfFa[dept];
        const vals=DEPT_FACTORS.map(f=>{const arr=fm[f.id]||[];return arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:0;});
        const nonZero=vals.filter(v=>v>0);
        const ov=nonZero.length?nonZero.reduce((a,b)=>a+b,0)/nonZero.length:0;
        return[dept,...vals.map(v=>v>0?parseFloat(fmt1(v)):""),ov>0?parseFloat(fmt1(ov)):""];
      });
      const wsFb=XLSX.utils.aoa_to_sheet([fbHeader,...fbBody]);
      wsFb["!cols"]=[{wch:24},...DEPT_FACTORS.map(()=>({wch:18})),{wch:10}];
      XLSX.utils.book_append_sheet(wb,wsFb,"Factor Breakdown");

      // ── Sheet 4: Dept-wise Participation ─────────────────
      const deptPartXls={};
      filteredResponses.forEach(r=>{
        const d=r.submitterDept;if(!d)return;
        if(!deptPartXls[d]){deptPartXls[d]={dept:d,count:0,empCodes:new Set()};}
        deptPartXls[d].count+=1;
        if(r.employeeCode)deptPartXls[d].empCodes.add(r.employeeCode.toUpperCase());
      });
      const partRowsXls=Object.values(deptPartXls).sort((a,b)=>b.count-a.count);
      const partTotalXls=partRowsXls.reduce((s,r)=>s+r.count,0);
      const partHeader=["Department","Submissions","Unique Employees","Share %"];
      const partBody=partRowsXls.map(r=>[r.dept,r.count,r.empCodes.size,partTotalXls?parseFloat((r.count/partTotalXls*100).toFixed(1)):0]);
      const wsPart=XLSX.utils.aoa_to_sheet([partHeader,...partBody]);
      wsPart["!cols"]=[{wch:24},{wch:14},{wch:18},{wch:10}];
      XLSX.utils.book_append_sheet(wb,wsPart,"Dept Participation");

      XLSX.writeFile(wb,`inter-dept-satisfaction-${dateStr}.xlsx`);
    }catch(e){console.error("Excel export failed:",e);setBulkErr((e&&e.message)||String(e));}
    setExpXlsBusy(false);
  };

  return(
    <div className="dash-grid">
      {plants.length>1&&<div className="plant-pill-bar">{<button className={"plant-pill"+(pf===ALL_PLANTS_ID?" active":"")} onClick={()=>setPf(ALL_PLANTS_ID)}>All Plants</button>}{plants.map((p)=><button key={p} className={"plant-pill"+(pf===p?" active":"")} onClick={()=>setPf(p)}>{p}</button>)}</div>}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8,flexWrap:"wrap",gap:6}}>
        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
          <button
            className="submit-btn small-btn"
            style={{background:"linear-gradient(135deg,#9B6BD1,#6366F1)",fontSize:12,letterSpacing:"0.5px",display:"flex",alignItems:"center",gap:6}}
            onClick={handleDummyEntry}
            disabled={dummyBusy||!departments.length}
            title="Insert a randomised dummy response for testing. Each click adds one entry."
          >
            {dummyBusy?"Inserting…":"⚡ Insert Dummy Entry"}
          </button>
          {dummyCount>0&&<span style={{fontSize:12,color:"#9B6BD1",fontWeight:600}}>{dummyCount} dummy entr{dummyCount===1?"y":"ies"} added this session</span>}
        </div>
        <div style={{display:"flex",gap:8}}>
          <button className="submit-btn small-btn" style={{background:"#4C9A6A"}} onClick={handleExportExcel} disabled={expXlsBusy||!flatRows.length}>{expXlsBusy?"…":"Export Excel"}</button>
          <button className="submit-btn small-btn" style={{background:"#3E8FB0"}} onClick={handleExportPdf} disabled={expBusy||!flatRows.length}>{expBusy?"…":"Export PDF"}</button>
        </div>
      </div>
      <div className="filter-bar">
        <div className="filter-field"><label>Rated Department</label><select value={rf} onChange={(e)=>setRf(e.target.value)}><option value="All">All departments</option>{ratedOpts.map((d)=><option key={d} value={d}>{d}</option>)}</select></div>
        <div className="filter-field"><label>Submitted By (Dept)</label><select value={ff} onChange={(e)=>setFf(e.target.value)}><option value="All">All submitters</option>{fromOpts.map((d)=><option key={d} value={d}>{d}</option>)}</select></div>
        <div className="filter-count">{filtered.length} rating{filtered.length===1?"":"s"}</div>
      </div>

      {/* ── Top row: Gauge + KPIs (left) | Tenure chart (right) ── */}
      <div style={{display:"flex",gap:12,marginBottom:12,flexWrap:"wrap",alignItems:"stretch"}}>
        {/* left: gauge + kpi */}
        <div style={{display:"flex",gap:12,flex:"2 1 480px",flexWrap:"wrap",alignItems:"stretch"}}>
          <div className="gauge-panel" style={{flex:"1 1 180px"}}><div className="panel-title">Overall Satisfaction</div><Gauge value={overall} theme={theme}/></div>
          <div className="kpi-grid" style={{flex:"2 1 240px"}}>
            <StatCard label="Total Submissions" value={filteredResponses.length} onClick={()=>{clearFilters();scrollToTable();}} title="Click to show all responses"/>
            <StatCard label="Total Ratings" value={filtered.length} onClick={()=>{clearFilters();scrollToTable();}} title="Click to show all responses"/>
            <StatCard label="Highest Rated" value={topDept?topDept.name:"—"} sub={topDept?`${fmt1(topDept.score)} / 5.0`:""} accent="#4C9A6A" onClick={topDept?()=>applyFilter({rf:topDept.name}):null} title={topDept?"Click to filter by "+topDept.name:""}/>
            <StatCard label="Needs Attention" value={lowDept?lowDept.name:"—"} sub={lowDept?`${fmt1(lowDept.score)} / 5.0`:""} accent="#E8552D" onClick={lowDept?()=>applyFilter({rf:lowDept.name}):null} title={lowDept?"Click to filter by "+lowDept.name:""}/>
          </div>
        </div>
        {/* right: tenure */}
        <div className="panel" style={{flex:"1 1 280px",margin:0}}>
          <div className="panel-title">Responses by Tenure</div>
          {tenureData.length?(<div className="tenure-donut-wrap">
            <div className="tenure-donut-chart">
              <ResponsiveContainer width="100%" height={180}>
                <PieChart><Pie data={tenureData} dataKey="count" nameKey="name" cx="50%" cy="50%" innerRadius={52} outerRadius={80} paddingAngle={3} stroke="none" onClick={(d)=>d&&applyFilter({tf:d.key})} style={{cursor:"pointer"}}>
                  {tenureData.map((e,i)=><Cell key={i} fill={e.color} opacity={tf==="All"||tf===e.key?1:0.35}/>)}
                </Pie><Tooltip contentStyle={{background:ct.tooltipBg,border:`1px solid ${ct.tooltipBorder}`,borderRadius:4}} formatter={(v,n,p)=>[`${v} (${p.payload.pct}%) — click to filter`,n]}/></PieChart>
              </ResponsiveContainer>
              <div className="tenure-donut-center" onClick={()=>applyFilter({tf:"All"})} style={{cursor:"pointer"}} title="Click to show all tenure"><div className="tenure-donut-total">{tenureTotal}</div><div className="tenure-donut-total-label">responses</div></div>
            </div>
            <div className="tenure-stats-list">{tenureData.map((d)=>(<div className="tenure-stat-row" key={d.key} onClick={()=>applyFilter({tf:d.key})} title={`Filter by ${d.name}`} style={{cursor:"pointer",opacity:tf==="All"||tf===d.key?1:0.45,transition:"opacity 0.15s"}}><div className="tenure-stat-top"><span className="tenure-stat-dot" style={{background:d.color}}/><span className="tenure-stat-name">{d.name}</span><span className="tenure-stat-pct">{d.pct}%</span><span className="tenure-stat-count">{d.count}</span></div><div className="tenure-stat-bar-track"><div className="tenure-stat-bar-fill" style={{width:`${d.pct}%`,background:d.color}}/></div></div>))}</div>
          </div>):<div className="empty-note">No responses yet.</div>}
        </div>
      </div>

      {/* ── Dept-wise (LEFT vertical) + Plant-wise (RIGHT horizontal) ── */}
      {filteredResponses.length>0&&(()=>{
        /* build maps */
        const validPlantSet=new Set(plants);
        const deptMap={},plantMap={};
        filteredResponses.forEach(r=>{
          /* skip responses from plants no longer in the live list */
          if(r.plant&&!validPlantSet.has(r.plant))return;
          /* dept */
          const d=r.submitterDept||"Unknown";
          if(!deptMap[d])deptMap[d]={dept:d,count:0,empCodes:new Set(),avgSum:0,avgCount:0};
          deptMap[d].count+=1;
          if(r.employeeCode)deptMap[d].empCodes.add(r.employeeCode.toUpperCase());
          /* plant */
          const p=r.plant||"Unknown";
          if(!plantMap[p])plantMap[p]={plant:p,count:0,empCodes:new Set(),avgSum:0,avgCount:0};
          plantMap[p].count+=1;
          if(r.employeeCode)plantMap[p].empCodes.add(r.employeeCode.toUpperCase());
          /* avg for both */
          const vals=Object.values(r.deptRatings||{}).map(info=>{
            if(info&&info.factors){const fv=Object.values(info.factors).filter(v=>v>0);return fv.length?fv.reduce((a,b)=>a+b,0)/fv.length:0;}
            return typeof info==="number"?info:0;
          }).filter(v=>v>0);
          if(vals.length){
            const avg=vals.reduce((a,b)=>a+b,0)/vals.length;
            deptMap[d].avgSum+=avg;deptMap[d].avgCount+=1;
            plantMap[p].avgSum+=avg;plantMap[p].avgCount+=1;
          }
        });
        const deptRows=Object.values(deptMap).sort((a,b)=>b.count-a.count);
        const plantRows=Object.values(plantMap).sort((a,b)=>b.count-a.count);
        const dTotal=deptRows.reduce((s,r)=>s+r.count,0);
        const pTotal=plantRows.reduce((s,r)=>s+r.count,0);
        const scoreCol=v=>v>=4?"#4C9A6A":v>=3?"#F5B400":"#E8552D";
        const thS={padding:"7px 10px",fontSize:11,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.5px",color:"var(--text-secondary)",borderBottom:"2px solid var(--panel-border)",whiteSpace:"nowrap"};
        const tdS={padding:"6px 8px",borderBottom:"1px solid var(--panel-border)",fontSize:12};
        return(
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>

            {/* LEFT — Dept-wise (vertical layout: dept in rows) */}
            <div className="panel" style={{margin:0}}>
              <div className="panel-title">Dept-wise Responses</div>
              <div style={{overflowX:"auto"}}>
                <table style={{width:"100%",borderCollapse:"collapse"}}>
                  <thead><tr style={{textAlign:"left"}}>
                    <th style={thS}>Department</th>
                    <th style={{...thS,textAlign:"center"}}>Count</th>
                    <th style={{...thS,textAlign:"center"}}>Emp</th>
                    <th style={{...thS,textAlign:"center"}}>Avg</th>
                    <th style={{...thS,textAlign:"center"}}>%</th>
                  </tr></thead>
                  <tbody>{deptRows.map((r,i)=>{
                    const pct=dTotal?Math.round(r.count/dTotal*100):0;
                    const avg=r.avgCount?r.avgSum/r.avgCount:0;
                    const isActive=ff===r.dept;
                    return(
                      <tr key={r.dept} onClick={()=>applyFilter({ff:isActive?"All":r.dept})} title={isActive?"Click to clear filter":"Click to filter by "+r.dept} style={{background:isActive?"rgba(99,102,241,0.15)":i%2===0?"var(--bg-page)":"var(--bg-panel)",cursor:"pointer",transition:"background 0.15s"}}>
                        <td style={{...tdS,fontWeight:600,color:isActive?"#9B6BD1":"var(--text-primary)",maxWidth:150,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} title={r.dept}>{r.dept}{isActive&&<span style={{marginLeft:4,fontSize:10,color:"#9B6BD1"}}>✕</span>}</td>
                        <td style={{...tdS,textAlign:"center",fontFamily:"'IBM Plex Mono',monospace",fontWeight:700,color:"#3E8FB0"}}>{r.count}</td>
                        <td style={{...tdS,textAlign:"center",fontFamily:"'IBM Plex Mono',monospace",color:"#4C9A6A"}}>{r.empCodes.size}</td>
                        <td style={{...tdS,textAlign:"center"}}>{avg>0?<span style={{fontFamily:"'IBM Plex Mono',monospace",fontWeight:700,color:scoreCol(avg)}}>{avg.toFixed(1)}</span>:<span style={{color:"var(--text-tertiary)"}}>—</span>}</td>
                        <td style={{...tdS,textAlign:"center"}}>
                          <div style={{display:"flex",alignItems:"center",gap:4}}>
                            <div style={{width:36,background:"var(--panel-border)",borderRadius:2,height:5}}>
                              <div style={{width:`${pct}%`,background:"linear-gradient(90deg,#9B6BD1,#6366F1)",borderRadius:2,height:5}}/>
                            </div>
                            <span style={{fontSize:11,color:"var(--text-secondary)",fontFamily:"'IBM Plex Mono',monospace"}}>{pct}%</span>
                          </div>
                        </td>
                      </tr>
                    );
                  })}</tbody>
                </table>
              </div>
            </div>

            {/* RIGHT — Plant-wise (vertical rows, same layout as dept-wise) */}
            <div className="panel" style={{margin:0}}>
              <div className="panel-title">Plant-wise Responses</div>
              <div style={{overflowX:"auto"}}>
                <table style={{width:"100%",borderCollapse:"collapse"}}>
                  <thead><tr style={{textAlign:"left"}}>
                    <th style={thS}>Plant</th>
                    <th style={{...thS,textAlign:"center"}}>Count</th>
                    <th style={{...thS,textAlign:"center"}}>Emp</th>
                    <th style={{...thS,textAlign:"center"}}>Avg</th>
                    <th style={{...thS,textAlign:"center"}}>%</th>
                  </tr></thead>
                  <tbody>{plantRows.map((r,i)=>{
                    const pct=pTotal?Math.round(r.count/pTotal*100):0;
                    const avg=r.avgCount?r.avgSum/r.avgCount:0;
                    const isActive=pf===r.plant;
                    return(
                      <tr key={r.plant} onClick={()=>{setPf(isActive?ALL_PLANTS_ID:r.plant);scrollToTable();}} title={isActive?"Click to clear filter":"Click to filter by "+r.plant} style={{background:isActive?"rgba(62,143,176,0.15)":i%2===0?"var(--bg-page)":"var(--bg-panel)",cursor:"pointer",transition:"background 0.15s"}}>
                        <td style={{...tdS,fontWeight:600,color:isActive?"#3E8FB0":"var(--text-primary)",maxWidth:120,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} title={r.plant}>{r.plant}{isActive&&<span style={{marginLeft:4,fontSize:10,color:"#3E8FB0"}}>✕</span>}</td>
                        <td style={{...tdS,textAlign:"center",fontFamily:"'IBM Plex Mono',monospace",fontWeight:700,color:"#3E8FB0"}}>{r.count}</td>
                        <td style={{...tdS,textAlign:"center",fontFamily:"'IBM Plex Mono',monospace",color:"#4C9A6A"}}>{r.empCodes.size}</td>
                        <td style={{...tdS,textAlign:"center"}}>{avg>0?<span style={{fontFamily:"'IBM Plex Mono',monospace",fontWeight:700,color:scoreCol(avg)}}>{avg.toFixed(1)}</span>:<span style={{color:"var(--text-tertiary)"}}>—</span>}</td>
                        <td style={{...tdS,textAlign:"center"}}>
                          <div style={{display:"flex",alignItems:"center",gap:4}}>
                            <div style={{width:36,background:"var(--panel-border)",borderRadius:2,height:5}}>
                              <div style={{width:`${pct}%`,background:"linear-gradient(90deg,#3E8FB0,#6366F1)",borderRadius:2,height:5}}/>
                            </div>
                            <span style={{fontSize:11,color:"var(--text-secondary)",fontFamily:"'IBM Plex Mono',monospace"}}>{pct}%</span>
                          </div>
                        </td>
                      </tr>
                    );
                  })}</tbody>
                </table>
              </div>
            </div>

          </div>
        );
      })()}

      {/* ── Dept × Plant Participation Matrix ── */}
      {filteredResponses.length>0&&(()=>{
        /* use live plants list; collect depts from responses */
        const validPlants=new Set(plants);
        const deptSet=new Set();
        filteredResponses.forEach(r=>{
          if(r.submitterDept)deptSet.add(r.submitterDept);
        });
        const plantCols=[...plants].sort();   /* only configured plants */
        const depts=[...deptSet].sort();
        /* matrix: deptMap[dept][plant] = Set of employeeCodes */
        const matrix={};
        depts.forEach(d=>{matrix[d]={};plantCols.forEach(p=>{matrix[d][p]=new Set();});});
        filteredResponses.forEach(r=>{
          const d=r.submitterDept||"Unknown",p=r.plant||"Unknown";
          /* skip responses whose plant is no longer in the live list */
          if(!validPlants.has(p))return;
          if(matrix[d]&&matrix[d][p]!==undefined){
            const code=(r.employeeCode||r.id||"?").toUpperCase();
            matrix[d][p].add(code);
          }
        });
        /* row totals (unique emp per dept across configured plants only) */
        const rowTotal={};
        depts.forEach(d=>{
          const all=new Set();
          plantCols.forEach(p=>matrix[d][p].forEach(c=>all.add(c)));
          rowTotal[d]=all.size;
        });
        /* col totals */
        const colTotal={};
        plantCols.forEach(p=>{
          const all=new Set();
          depts.forEach(d=>matrix[d][p].forEach(c=>all.add(c)));
          colTotal[p]=all.size;
        });
        /* grand total: unique emp in configured plants only */
        const grandSet=new Set();
        filteredResponses.forEach(r=>{if(validPlants.has(r.plant||""))grandSet.add((r.employeeCode||r.id||"?").toUpperCase());});
        const grandTotal=grandSet.size;

        /* hide rows where every configured-plant cell is empty */
        const visibleDepts=depts.filter(d=>plantCols.some(p=>matrix[d][p].size>0));

        const thS={padding:"5px 8px",fontSize:10,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.5px",color:"var(--text-secondary)",borderBottom:"2px solid var(--panel-border)",whiteSpace:"nowrap",textAlign:"center"};
        const tdS={padding:"5px 8px",borderBottom:"1px solid var(--panel-border)",fontSize:11,textAlign:"center",fontFamily:"'IBM Plex Mono',monospace"};
        const maxVal=Math.max(...visibleDepts.flatMap(d=>plantCols.map(p=>matrix[d][p].size)),1);
        const cellBg=(n)=>{
          if(n===0)return"transparent";
          const intensity=Math.round(30+Math.min(n/maxVal,1)*70);
          return`rgba(62,143,176,${intensity/100})`;
        };

        return(
          <div className="panel dash-full">
            <div className="panel-title">Participation Matrix — Employees by Dept × Plant</div>
            <div style={{fontSize:11,color:"var(--text-secondary)",marginBottom:8}}>Rows = department · Columns = configured plants only · Values = unique employees participated</div>
            <div style={{overflowX:"auto"}}>
              <table style={{width:"100%",borderCollapse:"collapse",minWidth:Math.max(400,plantCols.length*72+160)}}>
                <thead>
                  <tr>
                    <th style={{...thS,textAlign:"left",minWidth:150}}>Department</th>
                    {plantCols.map(p=><th key={p} style={thS}>{p}</th>)}
                    <th style={{...thS,background:"var(--bg-page)",color:"var(--text-primary)"}}>Total</th>
                  </tr>
                </thead>
                <tbody>
                  {visibleDepts.map((d,di)=>(
                    <tr key={d} style={{background:di%2===0?"var(--bg-page)":"var(--bg-panel)"}}>
                      <td style={{...tdS,textAlign:"left",fontWeight:600,color:"var(--text-primary)",fontFamily:"inherit",padding:"8px 10px"}}>{d}</td>
                      {plantCols.map(p=>{
                        const n=matrix[d][p].size;
                        return(
                          <td key={p} style={{...tdS,background:cellBg(n),color:n>0?"var(--text-primary)":"var(--text-tertiary)",fontWeight:n>0?700:400}}
                            title={n>0?`${n} employee${n===1?"":"s"} from ${d} at ${p}`:""}>
                            {n>0?n:"—"}
                          </td>
                        );
                      })}
                      <td style={{...tdS,fontWeight:700,color:"#3E8FB0",background:"var(--bg-page)",borderLeft:"2px solid var(--panel-border)"}}>{rowTotal[d]}</td>
                    </tr>
                  ))}
                  {/* col totals footer */}
                  <tr style={{borderTop:"2px solid var(--panel-border)"}}>
                    <td style={{...tdS,textAlign:"left",fontWeight:700,color:"var(--text-primary)",fontFamily:"inherit",padding:"8px 10px"}}>Total</td>
                    {plantCols.map(p=><td key={p} style={{...tdS,fontWeight:700,color:"#4C9A6A"}}>{colTotal[p]}</td>)}
                    <td style={{...tdS,fontWeight:700,color:"#9B6BD1",borderLeft:"2px solid var(--panel-border)"}}>{grandTotal}</td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div style={{marginTop:10,display:"flex",alignItems:"center",gap:6,fontSize:11,color:"var(--text-secondary)"}}>
              <span>Low</span>
              {[0.1,0.3,0.5,0.7,1.0].map(v=><div key={v} style={{width:20,height:12,borderRadius:2,background:`rgba(62,143,176,${0.3+v*0.7})`}}/>)}
              <span>High</span>
              <span style={{marginLeft:12,color:"var(--text-tertiary)"}}>— = no participation</span>
            </div>
          </div>
        );
      })()}

      {/* ── Avg Rating by Dept (left) | Trend + Comments (right) ── */}
      <div style={{display:"flex",gap:12,marginBottom:12,flexWrap:"wrap",alignItems:"stretch"}}>
        <div className="panel" style={{flex:"3 1 420px",margin:0}}>
          <div className="panel-title">Average Rating by Department</div>
          {deptData.length?(<ResponsiveContainer width="100%" height={Math.max(120,deptData.length*32)}>
            <BarChart data={deptData} layout="vertical" margin={{left:10,right:40,top:5,bottom:5}}>
              <CartesianGrid strokeDasharray="3 3" stroke={ct.grid} horizontal={false}/>
              <XAxis type="number" domain={[0,5]} stroke={ct.axis} fontSize={11} ticks={[1,2,3,4,5]}/>
              <YAxis type="category" dataKey="name" stroke={ct.axis} fontSize={11} width={typeof window!=="undefined"&&window.innerWidth<600?110:180}/>
              <Tooltip contentStyle={{background:ct.tooltipBg,border:`1px solid ${ct.tooltipBorder}`,borderRadius:4}} labelStyle={{color:ct.tooltipLabel}} formatter={(v,n,p)=>[`${v} (${p.payload.count} rating${p.payload.count===1?"":"s"}) — click to filter`,"Avg"]}/>
              <Bar dataKey="score" radius={[0,3,3,0]} onClick={(d)=>d&&applyFilter({rf:rf===d.name?"All":d.name})} style={{cursor:"pointer"}}>
                {deptData.map((d,i)=><Cell key={i} fill={d.score>=4?"#4C9A6A":d.score>=3?"#F5B400":"#E8552D"} opacity={rf==="All"||rf===d.name?1:0.35}/>)}
              </Bar>
            </BarChart>
          </ResponsiveContainer>):<div className="empty-note">No ratings match the current filters.</div>}
        </div>
        <div style={{flex:"2 1 260px",display:"flex",flexDirection:"column",gap:12}}>
          <div className="panel" style={{margin:0}}>
            <div className="panel-title">Rating Trend (Weekly Average)</div>
            {trendData.length>1?(<ResponsiveContainer width="100%" height={140}>
              <LineChart data={trendData} margin={{left:0,right:20,top:8,bottom:5}}>
                <CartesianGrid strokeDasharray="3 3" stroke={ct.grid}/>
                <XAxis dataKey="week" stroke={ct.axis} fontSize={11}/>
                <YAxis domain={[1,5]} stroke={ct.axis} fontSize={11} ticks={[1,2,3,4,5]}/>
                <Tooltip contentStyle={{background:ct.tooltipBg,border:`1px solid ${ct.tooltipBorder}`,borderRadius:4}} labelStyle={{color:ct.tooltipLabel}}/>
                <Line type="monotone" dataKey="score" stroke="#F5B400" strokeWidth={2} dot={{r:3}}/>
              </LineChart>
            </ResponsiveContainer>):<div className="empty-note">Not enough data to show a trend yet.</div>}
          </div>
          <div className="panel" style={{margin:0,flex:1,overflow:"hidden"}}>
            <div className="panel-title">Recent Comments</div>
            {comments.length?(<div className="comment-feed" style={{maxHeight:200,overflowY:"auto"}}>{comments.map((r)=>(<div className="comment-item" key={r._fid}><div className="comment-meta"><span style={{color:"#3E8FB0",fontWeight:600}}>{r.submitterDept}</span><span>→</span><span style={{color:"#E8552D",fontWeight:600}}>{r.ratedDept}</span><span>·</span><span>{"★".repeat(r.rating)} ({r.rating}/5)</span><span>·</span><span>{new Date(r.ts).toLocaleDateString()}</span></div><p className="comment-text">{r.comment}</p></div>))}</div>):<div className="empty-note">No comments yet.</div>}
          </div>
        </div>
      </div>

      {/* ── Factor Breakdown + Dept Participation — unified table ── */}
      {(()=>{
        const deptPart={};
        filteredResponses.forEach(r=>{
          const d=r.submitterDept;if(!d)return;
          if(!deptPart[d]){deptPart[d]={count:0,empCodes:new Set()};}
          deptPart[d].count+=1;
          if(r.employeeCode)deptPart[d].empCodes.add(r.employeeCode.toUpperCase());
        });
        /* union of all depts from either source */
        const allDepts=Array.from(new Set([...Object.keys(factorAvgs),...Object.keys(deptPart)])).sort();
        if(!allDepts.length)return null;
        const total=Object.values(deptPart).reduce((s,v)=>s+v.count,0);
        const scoreCol=(v)=>v>=4?"#4C9A6A":v>=3?"#F5B400":"#E8552D";
        const thS={padding:"6px 7px",fontSize:10,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.4px",color:"var(--text-secondary)",borderBottom:"2px solid var(--panel-border)",textAlign:"center",whiteSpace:"nowrap"};
        const tdS={padding:"6px 7px",borderBottom:"1px solid var(--panel-border)",textAlign:"center",fontFamily:"'IBM Plex Mono',monospace",fontSize:12};
        const dividerCol="3px solid var(--panel-border)";
        return(
          <div className="panel dash-full">
            <div className="panel-title">Factor Breakdown &amp; Participation by Department</div>
            <div style={{overflowX:"auto"}}>

  );
}

    <div className="panel" style={{border:"2px solid #3E8FB0"}}>

      <div style={{marginTop:8}}><button className="submit-btn small-btn" style={{background:"#4C9A6A"}} onClick={()=>saveWith(onSaveGuidelines,setGuideSaved,setGuideErr)(guideD.trim())}>{guideSaved?"Saved ✓":"Save Guidelines"}</button></div>

  </div>);

// ══════════════════════════════════════════════════════════════
//  UsersPanel  —  superadmin creates users + assigns plants
// ══════════════════════════════════════════════════════════════
function UsersPanel({plants,managedUsers,currentUserUid}){
  const [newEmail,setNewEmail]=useState("");
  const [newPw,setNewPw]=useState("");
  const [createBusy,setCreateBusy]=useState(false);
  const [createErr,setCreateErr]=useState("");
  const [createOk,setCreateOk]=useState("");
  const [plantBusy,setPlantBusy]=useState({});
  const [plantErr,setPlantErr]=useState("");
  const [delBusy,setDelBusy]=useState({});
  const [delErr,setDelErr]=useState("");
  // "register existing" panel
  const [regEmail,setRegEmail]=useState("");
  const [regBusy,setRegBusy]=useState(false);
  const [regErr,setRegErr]=useState("");
  const [regOk,setRegOk]=useState("");

  /* Get or reuse secondary Firebase app */
  const getSecondaryApp=()=>{
    try{return firebase.app("secondary");}
    catch(e){return firebase.initializeApp(firebase.app().options,"secondary");}
  };

  /* Create a brand-new Firebase Auth user via secondary app */
  const handleCreate=async()=>{
    const email=newEmail.trim();
    const pw=newPw.trim();
    if(!email||pw.length<6){setCreateErr("Enter a valid email and a password of at least 6 characters.");return;}
    setCreateErr("");setCreateOk("");setCreateBusy(true);
    try{
      const secondaryAuth=getSecondaryApp().auth();
      const cred=await secondaryAuth.createUserWithEmailAndPassword(email,pw);
      const uid=cred.user.uid;
      await secondaryAuth.signOut();
      await firebase.database().ref(`${CONFIG_MANAGED_USERS_PATH}/${uid}`).set({uid,email,plants:[]});
      setNewEmail("");setNewPw("");
      setCreateOk(`✅ User "${email}" created. They can now log in.`);
      setTimeout(()=>setCreateOk(""),5000);
    }catch(e){
      const msg=(e&&(e.message||e.code))||String(e);
      if(msg.includes("email-already-in-use")){
        setCreateErr(`"${email}" already exists in Firebase Auth. Use "Register Existing User" below to add them to the list.`);
      } else {
        setCreateErr(msg);
      }
    }
    setCreateBusy(false);
  };

  /* Register an already-existing Firebase Auth user into managedUsers
     by signing them in on the secondary app with the temp password,
     grabbing their UID, then signing out. If the user already exists
     in Auth (email-already-in-use), we sign in to get their UID. */
  const handleRegisterExisting=async()=>{
    const email=regEmail.trim();
    if(!email){setRegErr("Enter the user's email.");return;}
    // Check if already in managedUsers by email
    const already=managedUsers.find(u=>u.email.toLowerCase()===email.toLowerCase());
    if(already){setRegErr(`"${email}" is already in the managed users list.`);return;}
    setRegErr("");setRegOk("");setRegBusy(true);
    try{
      // We don't have the password, so we can only register by UID lookup.
      // Strategy: sign in on secondary with a dummy pw to trigger email-already-in-use
      // which doesn't expose credentials but confirms the user exists.
      // Instead, we'll just write a placeholder entry — when that user logs in,
      // their UID gets updated via the onAuthStateChanged self-registration below.
      // For now, store with a sentinel uid that gets updated on first login.
      const placeholderId="pending_"+Date.now();
      await firebase.database().ref(`${CONFIG_MANAGED_USERS_PATH}/${placeholderId}`).set({
        uid:placeholderId, email, plants:[], pending:true
      });
      setRegEmail("");
      setRegOk(`✅ "${email}" added. Their access will activate on next login.`);
      setTimeout(()=>setRegOk(""),6000);
    }catch(e){setRegErr((e&&(e.message||e.code))||String(e));}
    setRegBusy(false);
  };

  /* Toggle a plant on/off for a user */
  const togglePlant=async(uid,plantName,currentPlants)=>{
    setPlantErr("");
    const key=uid+"__"+plantName;
    setPlantBusy(p=>({...p,[key]:true}));
    try{
      const has=currentPlants.includes(plantName);
      const next=has?currentPlants.filter(p=>p!==plantName):[...currentPlants,plantName];
      await firebase.database().ref(`${CONFIG_MANAGED_USERS_PATH}/${uid}/plants`).set(next);
    }catch(e){setPlantErr((e&&(e.message||e.code))||String(e));}
    setPlantBusy(p=>({...p,[key]:false}));
  };

  /* Disable a user (remove from managedUsers — they can still log in but see nothing) */
  const handleRemoveUser=async(uid,email)=>{
    if(!window.confirm(`Remove user "${email}" from the managed list? They will lose all plant access.`))return;
    setDelErr("");setDelBusy(p=>({...p,[uid]:true}));
    try{await firebase.database().ref(`${CONFIG_MANAGED_USERS_PATH}/${uid}`).remove();}
    catch(e){setDelErr((e&&(e.message||e.code))||String(e));}
    setDelBusy(p=>({...p,[uid]:false}));
  };

  return(
    <div style={{maxWidth:900}}>
      {/* ── Create user ── */}
      <div className="panel" style={{border:"2px solid #9B6BD1",marginBottom:24}}>
        <div className="panel-title" style={{color:"#9B6BD1"}}>➕ Create New User</div>
        <p className="empty-note" style={{padding:"0 0 14px",textAlign:"left",fontSize:13}}>
