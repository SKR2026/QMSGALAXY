const DEPT_FACTORS = [

  { id: "responsiveness",      label: "Responsiveness",       icon: "⚡" },

];

// Compute the overall score for a deptRatings entry (avg of all rated factors)
function deptOverallScore(info) {
  if (!info) return 0;
  // Legacy: single rating field
  if (typeof info.rating === "number" && !info.factors) return info.rating;
  if (!info.factors) return 0;
  const vals = DEPT_FACTORS.map(f => info.factors[f.id]).filter(v => v > 0);
  return vals.length ? vals.reduce((a,b) => a+b, 0) / vals.length : 0;
}

function StarRating({ value, onChange, size=34 }) {
  const [hover, setHover] = useState(0);
  const labels = ["","Very Dissatisfied","Dissatisfied","Neutral","Satisfied","Very Satisfied"];
  return (
    <div>
      <div style={{display:"flex",gap:2}}>
        {[1,2,3,4,5].map((v)=>{
          const on = v<=(hover||value||0);
          return (
            <button key={v} type="button"
              onMouseEnter={()=>setHover(v)} onMouseLeave={()=>setHover(0)}
              onClick={()=>onChange(v)}
              style={{background:"none",border:"none",cursor:"pointer",padding:2,fontSize:size,lineHeight:1,
                color:on?"#F5B400":"#C9C4B6",transform:on?"scale(1.1)":"scale(1)",transition:"all 0.1s"}}
              aria-label={labels[v]}
            >★</button>
          );
        })}
      </div>
      <div style={{fontSize:11,color:"#8A8577",marginTop:3,minHeight:16}}>
        {hover?labels[hover]:value?labels[value]:"Click to rate"}
      </div>
    </div>
  );
}

function Gauge({ value, theme }) {
  const pct = Math.min(1, Math.max(0, (value - 1) / 4));
  const angle = -180 + pct * 180;           // -180° (left) → 0° (right)
  const cx = 130, cy = 120, r = 100;
  const trackWidth = 22;
  const needleLen = 82;

  const needleColor   = theme === "light" ? "#1B3A6B" : "#7FA8E0";
  const subtitleColor = theme === "light" ? "#6B6A62" : "#9AA1A8";

  // Arc helper — angles measured from positive-x axis; arc runs left-to-right along the top half
  const arc = (startPct, endPct, color) => {
    const a1 = Math.PI - startPct * Math.PI;
    const a2 = Math.PI - endPct   * Math.PI;
    const x1 = cx + r * Math.cos(a1);
    const y1 = cy + r * Math.sin(a1);
    const x2 = cx + r * Math.cos(a2);
    const y2 = cy + r * Math.sin(a2);
    return (
      <path
        d={`M ${x1} ${-y1 + 2 * cy} A ${r} ${r} 0 0 1 ${x2} ${-y2 + 2 * cy}`}
        stroke={color}
        strokeWidth={trackWidth}
        fill="none"
        strokeLinecap="butt"
      />
    );
  };

  // Needle tip coords
  const needleRad = (angle * Math.PI) / 180;
  const nx = cx + needleLen * Math.cos(needleRad);
  const ny = cy + needleLen * Math.sin(needleRad);

  // Tapered needle polygon
  const perpRad = needleRad + Math.PI / 2;
  const baseHalfWidth = 5;
  const baseInset = 6;
  const bx1 = cx + baseInset * Math.cos(needleRad) + baseHalfWidth * Math.cos(perpRad);
  const by1 = cy + baseInset * Math.sin(needleRad) + baseHalfWidth * Math.sin(perpRad);
  const bx2 = cx + baseInset * Math.cos(needleRad) - baseHalfWidth * Math.cos(perpRad);
  const by2 = cy + baseInset * Math.sin(needleRad) - baseHalfWidth * Math.sin(perpRad);
  const tailLen = 12, tailHalfWidth = 3.5;
  const tx1 = cx - tailLen * Math.cos(needleRad) + tailHalfWidth * Math.cos(perpRad);
  const ty1 = cy - tailLen * Math.sin(needleRad) + tailHalfWidth * Math.sin(perpRad);
  const tx2 = cx - tailLen * Math.cos(needleRad) - tailHalfWidth * Math.cos(perpRad);
  const ty2 = cy - tailLen * Math.sin(needleRad) - tailHalfWidth * Math.sin(perpRad);
  const needlePoints = `${nx},${ny} ${bx1},${by1} ${tx1},${ty1} ${tx2},${ty2} ${bx2},${by2}`;
  const needleShadowPoints = `${nx+1.5},${ny+2} ${bx1+1.5},${by1+2} ${tx1+1.5},${ty1+2} ${tx2+1.5},${ty2+2} ${bx2+1.5},${by2+2}`;

  const scoreY = cy + 44;
  const labelY = cy + 62;
  const scoreAccent = value >= 4 ? "#4C9A6A" : value >= 3 ? "#F5B400" : "#E8552D";

  return (
    <svg
      viewBox={`0 0 260 ${cy + 84}`}
      style={{ width: "100%", maxWidth: 300, display: "block", margin: "0 auto" }}
    >
      <defs>
        <filter id="score-shadow" x="-20%" y="-20%" width="140%" height="160%">
          <feDropShadow dx="0" dy="2" stdDeviation="3" floodColor="rgba(0,0,0,0.18)"/>
        </filter>
        {/* Gradient left=red, centre=yellow, right=green — matches arc left→right sweep */}
        <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%"   stopColor="#E8552D" />
          <stop offset="50%"  stopColor="#F5B400" />
          <stop offset="100%" stopColor="#4C9A6A" />
        </linearGradient>
      </defs>

      {/* Background track ring */}
      <path
        d={(() => {
          const x1b = cx + r * Math.cos(Math.PI);
          const y1b = cy - r * Math.sin(Math.PI);
          const x2b = cx + r * Math.cos(0);
          const y2b = cy - r * Math.sin(0);
          return `M ${x1b} ${y1b} A ${r} ${r} 0 0 1 ${x2b} ${y2b}`;
        })()}
        stroke={theme === "dark" ? "#2A2F38" : "#E0DBD0"}
        strokeWidth={trackWidth + 4}
        fill="none"
        strokeLinecap="butt"
        opacity="0.8"
      />

      {/* Smooth gradient arc — full sweep, red → yellow → green */}
      {arc(0, 1, "url(#arcGrad)")}

      {/* Scale tick marks */}
      {[1, 2, 3, 4, 5].map((v) => {
        const p = (v - 1) / 4;
        const a = Math.PI - p * Math.PI;
        const inner = r - trackWidth / 2 + 3;
        const outer = r + trackWidth / 2 - 3;
        const x1t = cx + inner * Math.cos(a);
        const y1t = cy - inner * Math.sin(a);
        const x2t = cx + outer * Math.cos(a);
        const y2t = cy - outer * Math.sin(a);
        const labelR = r - trackWidth / 2 - 14;
        const lx = cx + labelR * Math.cos(a);
        const ly = cy - labelR * Math.sin(a);
        return (
          <g key={v}>
            <line x1={x1t} y1={y1t} x2={x2t} y2={y2t}
              stroke={theme === "dark" ? "rgba(0,0,0,0.45)" : "rgba(255,255,255,0.6)"} strokeWidth="2" />
            {(v === 1 || v === 3 || v === 5) && (
              <text x={lx} y={ly + 4} textAnchor="middle"
                fontFamily="'IBM Plex Mono',monospace" fontSize="9"
                fill={subtitleColor} fontWeight="700">
                {v}
              </text>
            )}
          </g>
        );
      })}

      {/* Needle shadow */}
      <polygon points={needleShadowPoints} fill="rgba(0,0,0,0.15)" />
      {/* Needle */}
      <polygon points={needlePoints} fill={needleColor} stroke={needleColor} strokeWidth="0.5" strokeLinejoin="round" />

      {/* Needle base circle */}
      <circle cx={cx} cy={cy} r="11" fill={theme === "dark" ? "#1E2229" : "#FFFFFF"}
        stroke={theme === "dark" ? "#3A4050" : "#D0CBBD"} strokeWidth="2" />
      <circle cx={cx} cy={cy} r="5" fill={scoreAccent} />

      {/* Score pill */}
      <rect x={cx - 48} y={scoreY - 24} width={96} height={62} rx={12}
        fill={theme === "dark" ? "#1E2229" : "#FFFFFF"}
        stroke={theme === "dark" ? "#333A42" : "#DCD7C9"}
        strokeWidth="1.5"
        filter="url(#score-shadow)"
      />
      <text x={cx} y={scoreY + 2} textAnchor="middle"
        fontFamily="'IBM Plex Mono',monospace" fontSize="30" fontWeight="700"
        fill={scoreAccent}>
        {fmt1(value)}
      </text>
      <text x={cx} y={labelY} textAnchor="middle"
        fontFamily="'Inter',sans-serif" fontSize="8" letterSpacing="1.8"
        fill={subtitleColor} fontWeight="600">
        OUT OF 5.0
      </text>
    </svg>
  );
}

    <div style={{
      height:4,

function StatCard({label,value,sub,accent}){
  const vs=String(value),fs=vs.length>12?18:vs.length>8?24:32;
  return (<div className="stat-card"><div className="stat-label">{label}</div><div className="stat-value" style={{fontSize:fs,...(accent?{color:accent}:{})}}>{value}</div>{sub&&<div className="stat-sub">{sub}</div>}</div>);
}

function MiniStarRating({ value, onChange }) {
  const [hover, setHover] = useState(0);
  const labels = ["","Very Dissatisfied","Dissatisfied","Neutral","Satisfied","Very Satisfied"];
  const active = hover || value || 0;
  return (
    <div>
      <div style={{display:"flex",gap:1}}>
        {[1,2,3,4,5].map((v) => (
          <button key={v} type="button"
            onMouseEnter={()=>setHover(v)} onMouseLeave={()=>setHover(0)}

            style={{background:"none",border:"none",cursor:"pointer",padding:"1px 2px",fontSize:22,lineHeight:1,
              color:v<=active?"#F5B400":"#C9C4B6",
              transform:v<=active?"scale(1.08)":"scale(1)",transition:"all 0.1s"}}
          >★</button>
        ))}
      </div>
      <div style={{fontSize:10,color:"#8A8577",marginTop:2,minHeight:14}}>
        {active ? labels[active] : "Click to rate"}
      </div>
    </div>
  );
}

function SurveyForm({onSubmit,logoUrl,plants,departments,shifts,ratingGuidelines,isAdmin,onAddDummyEntry}){
  const [step,setStep]=useState(1);
  const [plant,setPlant]=useState(plants.length===1?plants[0]:"");
  const [myDept,setMyDept]=useState("");
  const [shift,setShift]=useState("");
  const [tenure,setTenure]=useState("");
  const [anonymous,setAnonymous]=useState(true);
  const [empName,setEmpName]=useState("");
  const [empCode,setEmpCode]=useState("");
  const [ratings,setRatings]=useState({});
  const [error,setError]=useState("");
  const [done,setDone]=useState(false);
  const [saving,setSaving]=useState(false);
  const [dummyBusy,setDummyBusy]=useState(false);

  const ratableDepts=useMemo(()=>departments.filter((d)=>d!==myDept),[departments,myDept]);
  const setFactor=(dept,factorId,v)=>setRatings((p)=>({...p,[dept]:{...(p[dept]||{}),factors:{...((p[dept]||{}).factors||{}),[factorId]:v}}}));
  const setComment=(dept,v)=>setRatings((p)=>({...p,[dept]:{...(p[dept]||{}),comment:v}}));

  const fillDummy=()=>{
    if(!departments.length)return;
    const rng=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
    const pick=(arr)=>arr[Math.floor(Math.random()*arr.length)];
    const NAMES=["Amit Sharma","Priya Singh","Ravi Kumar","Sunita Patel","Deepak Verma","Meena Joshi","Rahul Gupta","Anjali Mehta"];
    const CODES=["EMP","TL","MGR","SR"];
    const COMMENTS=["Very professional team, always delivers on time.","Communication could be improved, but work quality is great.","Excellent support during the critical project phase.","Outstanding collaboration during the quarterly review.","Great team spirit and willingness to assist.",""];
    const dept=pick(departments);
    const chosenPlant=plants.length?pick(plants):"";
    const chosenShift=shifts.length?pick(shifts):"Day";
    setMyDept(dept);
    setPlant(chosenPlant);
    setShift(chosenShift);
    setTenure(pick(TENURE_OPTIONS));
    setAnonymous(false);
    setEmpName(pick(NAMES));
    setEmpCode(`${pick(CODES)}${rng(1000,9999)}`);
    const others=departments.filter(d=>d!==dept);
    const toRate=others.slice().sort(()=>Math.random()-0.5).slice(0,Math.min(others.length,rng(2,Math.max(2,others.length))));
    const newRatings={};
    toRate.forEach(d=>{
      const base=rng(2,5);
      const factors={};
      DEPT_FACTORS.forEach(f=>{ factors[f.id]=Math.min(5,Math.max(1,base+rng(-1,1))); });
      newRatings[d]={factors,comment:Math.random()>0.4?pick(COMMENTS.filter(c=>c)):""};
    });
    setRatings(newRatings);
    setError("");
    setStep(2);
    window.scrollTo(0,0);
  };

  const handleDummySubmit=async()=>{
    if(!departments.length){setError("Add departments in Settings first.");return;}
    setDummyBusy(true);setError("");
    try{
      const rng=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
      const pick=(arr)=>arr[Math.floor(Math.random()*arr.length)];
      const NAMES=["Amit Sharma","Priya Singh","Ravi Kumar","Sunita Patel","Deepak Verma","Meena Joshi","Rahul Gupta","Anjali Mehta"];
      const CODES=["EMP","TL","MGR","SR"];
      const COMMENTS=["Very professional team, always delivers on time.","Communication could be improved, but work quality is great.","Excellent support during the critical project phase.","Outstanding collaboration during the quarterly review.","Great team spirit and willingness to assist.",""];
      const submitterDept=pick(departments);
      const others=departments.filter(d=>d!==submitterDept);
      const toRate=others.slice().sort(()=>Math.random()-0.5).slice(0,Math.min(others.length,rng(2,Math.max(2,others.length))));
      const deptRatings={};
      toRate.forEach(dept=>{
        const base=rng(2,5);
        const factors={};
        DEPT_FACTORS.forEach(f=>{ factors[f.id]=Math.min(5,Math.max(1,base+rng(-1,1))); });
        const vals=DEPT_FACTORS.map(f=>factors[f.id]);
        const avg=parseFloat((vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(2));
        deptRatings[dept]={factors,rating:avg,comment:Math.random()>0.4?pick(COMMENTS.filter(c=>c)):""};
      });
      const payload={
        id:`dummy-${Date.now()}-${Math.floor(Math.random()*9999)}`,
        ts:new Date(Date.now()-rng(0,30)*86400000).toISOString(),
        plant:plants.length?pick(plants):"Main Plant",
        submitterDept,shift:shifts.length?pick(shifts):"Day",
        tenure:pick(TENURE_OPTIONS),anonymous:Math.random()>0.4,
        employeeCode:`${pick(CODES)}${rng(1000,9999)}`,
        employeeName:pick(NAMES),
        deptRatings,_isDummy:true,
      };
      await onAddDummyEntry(payload);
      setDone(true);
    }catch(e){setError((e&&(e.message||e.code))||String(e));}
    setDummyBusy(false);
  };

  const handleNext=()=>{
    if((plants.length>1&&!plant)||!myDept||!shift||!tenure){setError("Please fill in all fields before continuing.");return;}
    setError("");setStep(2);window.scrollTo(0,0);
  };

  const handleSubmit=async()=>{
    const rated=ratableDepts.filter((d)=>ratings[d]&&ratings[d].factors&&DEPT_FACTORS.some(f=>ratings[d].factors[f.id]>0));
    if(!rated.length){setError("Please rate at least one factor for at least one department before submitting.");return;}
    setError("");setSaving(true);
    const payload={
      id:`r-${Date.now()}-${Math.floor(Math.random()*10000)}`,
      ts:new Date().toISOString(),
      plant:plant||plants[0]||"",
      submitterDept:myDept,shift,tenure,anonymous,
      employeeCode:empCode.trim(),
      employeeName:anonymous?"":empName.trim(),
      deptRatings:Object.fromEntries(rated.map((d)=>{
        const factors=ratings[d].factors||{};
        const rated_vals=DEPT_FACTORS.map(f=>factors[f.id]||0).filter(v=>v>0);
        const avg=rated_vals.length?rated_vals.reduce((a,b)=>a+b,0)/rated_vals.length:0;
        return [d,{factors,rating:parseFloat(avg.toFixed(2)),comment:(ratings[d].comment||"").trim()}];
      })),
    };
    try{await onSubmit(payload);setSaving(false);setDone(true);
      setPlant(plants.length===1?plants[0]:"");setMyDept("");setShift("");setTenure("");
      setEmpCode("");setEmpName("");setRatings({});setStep(1);
    }catch(e){setError((e&&(e.message||e.code))||String(e));setSaving(false);}
  };

  if(done)return(
    <div className="paper-card"><div className="paper-inner" style={{textAlign:"center",padding:"3rem 1.5rem"}}>
      <div style={{fontSize:48,marginBottom:8}}>✓</div>
      <h2 className="form-title" style={{marginBottom:8}}>Survey Submitted</h2>
      <p style={{color:"#5B5A52",marginBottom:24}}>Thank you! Your ratings are now reflected in the dashboard.</p>
      <div style={{display:"flex",gap:12,justifyContent:"center",flexWrap:"wrap"}}>
        <button className="submit-btn" onClick={()=>setDone(false)}>Submit another response</button>
        {isAdmin&&<button className="submit-btn" style={{background:"linear-gradient(135deg,#9B6BD1,#6366F1)"}} onClick={handleDummySubmit} disabled={dummyBusy}>{dummyBusy?"Inserting…":"⚡ Insert Another Dummy"}</button>}
      </div>
    </div></div>
  );

  return(
    <div className="paper-card">
      <div className="step-bar">
        <div className={"step-pip"+(step===1?" active":step>1?" done":"")}>{step>1?"✓":"1"}</div>
        <div className="step-line"/>
        <div className={"step-pip"+(step===2?" active":"")}>2</div>
        <div className="step-labels"><span>Your Info</span><span>Rate Departments</span></div>
      </div>
      <div className="paper-inner">
        {logoUrl&&<img src={logoUrl} alt="Logo" className="form-logo"/>}
        {isAdmin&&step===1&&(
          <div style={{display:"flex",gap:10,marginBottom:18,flexWrap:"wrap"}}>
            <button type="button" className="submit-btn small-btn"
              style={{background:"linear-gradient(135deg,#9B6BD1,#6366F1)",fontSize:12,letterSpacing:"0.5px"}}
              onClick={fillDummy}
              title="Pre-fills all fields with random data so you can review before submitting">
              ⚡ Fill Dummy Data
            </button>
            <button type="button" className="submit-btn small-btn"
              style={{background:"linear-gradient(135deg,#4C9A6A,#3E8FB0)",fontSize:12,letterSpacing:"0.5px"}}
              onClick={handleDummySubmit} disabled={dummyBusy}
              title="Generates and saves a dummy response instantly without filling the form">
              {dummyBusy?"Inserting…":"⚡ Quick Insert (skip form)"}
            </button>
          </div>
        )}
        {step===1&&(<>
          <h2 className="form-title">Inter-Department Satisfaction</h2>
          <p className="form-sub">Step 1 of 2 — Enter your details. Your own department will be excluded from ratings.</p>
          <div className="field-row">
            <div className="field"><label>Employee Code (optional)</label><input className="name-input" placeholder="e.g. EMP1043" value={empCode} onChange={(e)=>setEmpCode(e.target.value)}/></div>
            <div className="field"><label>Employee Name (optional)</label><input className="name-input" placeholder="Your name" value={empName} onChange={(e)=>setEmpName(e.target.value)}/></div>
          </div>
          <div className="field-row">
            {plants.length>1&&<div className="field"><label>Plant</label><select value={plant} onChange={(e)=>setPlant(e.target.value)}><option value="">Select plant</option>{plants.map((p)=><option key={p} value={p}>{p}</option>)}</select></div>}
            <div className="field"><label>Your Department</label><select value={myDept} onChange={(e)=>{setMyDept(e.target.value);setRatings({});}}><option value="">Select your department</option>{departments.map((d)=><option key={d} value={d}>{d}</option>)}</select></div>
            <div className="field"><label>Shift</label><select value={shift} onChange={(e)=>setShift(e.target.value)}><option value="">Select shift</option>{shifts.map((s)=><option key={s} value={s}>{s}</option>)}</select></div>
            <div className="field"><label>Tenure</label><select value={tenure} onChange={(e)=>setTenure(e.target.value)}><option value="">Select tenure</option>{TENURE_OPTIONS.map((t)=><option key={t} value={t}>{t}</option>)}</select></div>
          </div>
          <div className="anon-row"><label className="check-label"><input type="checkbox" checked={anonymous} onChange={(e)=>setAnonymous(e.target.checked)}/>Submit anonymously</label></div>
          {error&&<div className="error-msg">{error}</div>}
          <button className="submit-btn" onClick={handleNext}>Continue to Rate Departments →</button>
        </>)}
        {step===2&&(<>
          <h2 className="form-title">Rate Other Departments</h2>
          <p className="form-sub">Step 2 of 2 — Rate each department you interact with. <strong>{myDept}</strong> is excluded.</p>
          {ratableDepts.length===0
            ?<div className="error-msg">No other departments found. Add more in Settings.</div>
            :<div style={{display:"flex",flexDirection:"column",gap:16,marginBottom:20}}>
              {ratableDepts.map((dept)=>{
                const r=ratings[dept]||{};
                const factors=r.factors||{};
                const hasAnyRating=DEPT_FACTORS.some(f=>factors[f.id]>0);
                return(
                  <div key={dept} className={"dept-card"+(hasAnyRating?" rated":"")} style={{padding:"18px 20px"}}>
                    <div className="dept-card-name" style={{marginBottom:14}}>{dept}</div>
                    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:"12px 20px",marginBottom:12}}>
                      {DEPT_FACTORS.map(f=>{
                        const val=factors[f.id]||0;
                        return(
                          <div key={f.id}>
                            <div style={{fontSize:11,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.5px",color:"#5B5A52",marginBottom:5}}>{f.icon} {f.label}</div>
                            <MiniStarRating value={val} onChange={(v)=>setFactor(dept,f.id,v)}/>
                          </div>
                        );
                      })}
                    </div>
                    <div className="field" style={{marginTop:8,marginBottom:0}}>
                      <label style={{fontSize:11,color:"#5B5A52"}}>Comment (optional)</label>
                      <textarea rows={2} placeholder="Any specific feedback..." value={r.comment||""} onChange={(e)=>setComment(dept,e.target.value)}/>
                    </div>
                  </div>
                );
              })}
            </div>
          }
          {error&&<div className="error-msg">{error}</div>}
          <div style={{display:"flex",gap:12,marginTop:16,flexWrap:"wrap"}}>
            <button className="submit-btn" style={{background:"#6C7A89"}} onClick={()=>{setStep(1);setError("");}}>← Back</button>
            <button className="submit-btn" onClick={handleSubmit} disabled={saving}>{saving?"Submitting…":"Submit Survey"}</button>
          </div>
        </>)}
      </div>
    </div>
  );
}

function Dashboard({responses,theme,plants,departments,shifts,companyName,logoUrl,onDeleteResponses,onAddDummyEntry}){
  const [pf,setPf]=useState(ALL_PLANTS_ID);
  const [rf,setRf]=useState("All");
  const [ff,setFf]=useState("All");
  const [selIds,setSelIds]=useState({});
  const [bulkBusy,setBulkBusy]=useState(false);
  const [bulkErr,setBulkErr]=useState("");
  const [expBusy,setExpBusy]=useState(false);
  const [dummyBusy,setDummyBusy]=useState(false);
  const [dummyCount,setDummyCount]=useState(0);
  const ct=CHART_THEME[theme]||CHART_THEME.dark;

  const flatRows=useMemo(()=>{
    const rows=[];
    responses.forEach((r)=>{Object.entries(r.deptRatings||{}).forEach(([dept,info])=>{
      const score=deptOverallScore(info);
      rows.push({...r,ratedDept:dept,rating:score,factors:info.factors||{},comment:info.comment||"",_fid:`${r.id}__${dept}`});
    });});
    return rows;
  },[responses]);

  const filteredResponses=useMemo(()=>responses.filter((r)=>pf===ALL_PLANTS_ID||r.plant===pf),[responses,pf]);
  const filteredFlatRows=useMemo(()=>flatRows.filter((r)=>pf===ALL_PLANTS_ID||r.plant===pf),[flatRows,pf]);
  const filtered=useMemo(()=>flatRows.filter((r)=>(pf===ALL_PLANTS_ID||r.plant===pf)&&(rf==="All"||r.ratedDept===rf)&&(ff==="All"||r.submitterDept===ff)),[flatRows,pf,rf,ff]);
  const overall=useMemo(()=>{const v=filtered.filter((r)=>r.rating>0);return v.length?v.reduce((s,r)=>s+r.rating,0)/v.length:0;},[filtered]);

  const deptData=useMemo(()=>{
    const m={};
    filtered.forEach((r)=>{if(!r.rating)return;if(!m[r.ratedDept])m[r.ratedDept]={total:0,count:0};m[r.ratedDept].total+=r.rating;m[r.ratedDept].count+=1;});
    return Object.entries(m).map(([name,d])=>({name,score:parseFloat((d.total/d.count).toFixed(2)),count:d.count})).sort((a,b)=>b.score-a.score);
  },[filtered]);

  const topDept=deptData[0],lowDept=deptData.length>1?deptData[deptData.length-1]:null;

  const trendData=useMemo(()=>{
    const wm={};
    filtered.forEach((r)=>{if(!r.rating)return;const d=new Date(r.ts),y=d.getFullYear(),wk=Math.ceil(((d-new Date(y,0,1))/86400000+1)/7),key=`${y}-W${String(wk).padStart(2,"0")}`;if(!wm[key])wm[key]={total:0,count:0};wm[key].total+=r.rating;wm[key].count+=1;});
    return Object.entries(wm).sort(([a],[b])=>a.localeCompare(b)).map(([week,d])=>({week,score:parseFloat((d.total/d.count).toFixed(2))}));
  },[filtered]);

  const tenureData=useMemo(()=>{
    const m={};
    filteredResponses.forEach((r)=>{if((ff==="All"||r.submitterDept===ff)&&r.tenure)m[r.tenure]=(m[r.tenure]||0)+1;});
    const total=Object.values(m).reduce((s,v)=>s+v,0);
    return TENURE_OPTIONS.filter((k)=>m[k]).map((k)=>({key:k,name:k,count:m[k],pct:total?Math.round(m[k]/total*100):0,color:TENURE_COLORS[k]}));
  },[filteredResponses,ff]);
  const tenureTotal=tenureData.reduce((s,d)=>s+d.count,0);

  const comments=useMemo(()=>filtered.filter((r)=>r.comment).slice(-10).reverse(),[filtered]);

  // Per-department per-factor averages  { dept: { factorId: avg } }
  const factorAvgs=useMemo(()=>{
    const acc={};
    filtered.forEach((r)=>{
      if(!r.factors||!Object.keys(r.factors).length) return;
      if(!acc[r.ratedDept]) acc[r.ratedDept]={};
      DEPT_FACTORS.forEach(f=>{
        const v=r.factors[f.id];
        if(v>0){ if(!acc[r.ratedDept][f.id]) acc[r.ratedDept][f.id]=[]; acc[r.ratedDept][f.id].push(v); }
      });
    });
    const result={};
    Object.entries(acc).forEach(([dept,fm])=>{
      result[dept]={};
      DEPT_FACTORS.forEach(f=>{ const arr=fm[f.id]||[]; result[dept][f.id]=arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:0; });
    });
    return result;
  },[filtered]);
  const ratedOpts=useMemo(()=>Array.from(new Set([...departments,...filteredFlatRows.map((r)=>r.ratedDept)])),[departments,filteredFlatRows]);
  const fromOpts=useMemo(()=>Array.from(new Set([...departments,...filteredResponses.map((r)=>r.submitterDept)])),[departments,filteredResponses]);

  const selCount=Object.values(selIds).filter(Boolean).length;
  const allSel=filteredResponses.length>0&&filteredResponses.every((r)=>selIds[r.id]);
  const toggleSel=(id)=>setSelIds((p)=>({...p,[id]:!p[id]}));
  const toggleAll=()=>{if(allSel)setSelIds({});else{const m={};filteredResponses.forEach((r)=>{m[r.id]=true;});setSelIds(m);}};

  const handleDel=async()=>{
    const ids=Object.keys(selIds).filter((id)=>selIds[id]);
    if(!ids.length)return;
    if(!window.confirm(`Delete ${ids.length} response${ids.length===1?"":"s"}? This can't be undone.`))return;
    setBulkBusy(true);setBulkErr("");
    try{await onDeleteResponses(ids);setSelIds({});}catch(e){setBulkErr((e&&(e.message||e.code))||String(e));}
    setBulkBusy(false);
  };

  const handleDummyEntry=async()=>{
    if(!departments.length){setBulkErr("Add at least 2 departments in Settings before inserting dummy data.");return;}
    setDummyBusy(true);setBulkErr("");
    try{
      const rng=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
      const pick=(arr)=>arr[Math.floor(Math.random()*arr.length)];
      const NAMES=["Amit Sharma","Priya Singh","Ravi Kumar","Sunita Patel","Deepak Verma","Meena Joshi","Rahul Gupta","Anjali Mehta","Vikram Nair","Pooja Reddy","Suresh Rao","Kavita Iyer"];
      const CODES=["EMP","TL","MGR","SR","JR"];
      const COMMENTS_POOL=[
        "Very professional team, always delivers on time.",
        "Communication could be improved, but work quality is great.",
        "Excellent support during the critical project phase.",
        "Response times need improvement but overall cooperative.",
        "Outstanding collaboration during the quarterly review.",
        "Sometimes hard to reach, but issues get resolved eventually.",
        "Proactive and helpful, a pleasure to work with.",
        "Quality of deliverables has improved significantly this quarter.",
        "Would appreciate faster turnaround on urgent requests.",
        "Great team spirit and willingness to assist.",
        ""
      ];
      const submitterDept=pick(departments);
      const ratableDepts=departments.filter(d=>d!==submitterDept);
      const numToRate=Math.min(ratableDepts.length, rng(2, Math.max(2,ratableDepts.length)));
      const toRate=[...ratableDepts].sort(()=>Math.random()-0.5).slice(0,numToRate);
      const deptRatings={};
      toRate.forEach(dept=>{
        const base=rng(2,5);
        const factors={};
        DEPT_FACTORS.forEach(f=>{ factors[f.id]=Math.min(5,Math.max(1,base+rng(-1,1))); });
        const vals=DEPT_FACTORS.map(f=>factors[f.id]);
        const avg=parseFloat((vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(2));
        deptRatings[dept]={factors,rating:avg,comment:Math.random()>0.4?pick(COMMENTS_POOL.filter(c=>c)):""};
      });
      const newCount=dummyCount+1;
      const payload={
        id:`dummy-${Date.now()}-${Math.floor(Math.random()*9999)}`,
        ts:new Date(Date.now()-rng(0,30)*86400000).toISOString(),
        plant:pick(plants)||"Main Plant",
        submitterDept,
        shift:pick(shifts)||"Day",
        tenure:pick(TENURE_OPTIONS),
        anonymous:Math.random()>0.4,
        employeeCode:`${pick(CODES)}${rng(1000,9999)}`,
        employeeName:pick(NAMES),
        deptRatings,
        _isDummy:true,
      };
      await onAddDummyEntry(payload);
      setDummyCount(newCount);
    }catch(e){setBulkErr((e&&(e.message||e.code))||String(e));}
    setDummyBusy(false);
  };

  const handleExportPdf=async()=>{
    setExpBusy(true);
    try{
      const {jsPDF}=window.jspdf;
      const doc=new jsPDF({orientation:"portrait",unit:"mm",format:"a4"});
      const W=doc.internal.pageSize.getWidth();
      const pageH=doc.internal.pageSize.getHeight();
      const margin=14;
      const contentW=W-margin*2;
      let y=margin;

      // ── Helper: section heading ────────────────────────────────
      const sectionHead=(title)=>{
        if(y>pageH-40){doc.addPage();y=margin;}
        doc.setFillColor(99,102,241);
        doc.rect(margin,y,contentW,7,"F");
        doc.setTextColor(255,255,255);
        doc.setFontSize(9);
        doc.setFont("helvetica","bold");
        doc.text(title.toUpperCase(),margin+3,y+5);
        doc.setTextColor(30,30,30);
        doc.setFont("helvetica","normal");
        y+=10;
      };

      // ── Cover header ───────────────────────────────────────────
      doc.setFillColor(30,34,41);
      doc.rect(0,0,W,38,"F");
      // gradient rainbow line (matches web dashboard HazardBar)
      const gradCanvas=document.createElement("canvas");
      gradCanvas.width=Math.round(W*4);gradCanvas.height=8;
      const gradCtx=gradCanvas.getContext("2d");
      const grad=gradCtx.createLinearGradient(0,0,gradCanvas.width,0);
      grad.addColorStop(0,"#9B6BD1");
      grad.addColorStop(0.3,"#3E8FB0");
      grad.addColorStop(0.55,"#4C9A6A");
      grad.addColorStop(0.78,"#F5B400");
      grad.addColorStop(1,"#E8552D");
      gradCtx.fillStyle=grad;
      gradCtx.fillRect(0,0,gradCanvas.width,8);
      doc.addImage(gradCanvas.toDataURL("image/png"),"PNG",0,36,W,2);
      if(logoUrl){
        try{
          await new Promise((resolve)=>{
            const img=new Image();
            img.onload=()=>{
              const maxH=16,maxW=70;
              const ratio=img.naturalWidth/img.naturalHeight;
              let drawW=maxH*ratio;
              let drawH=maxH;
              if(drawW>maxW){drawW=maxW;drawH=maxW/ratio;}
              const drawY=4+(maxH-drawH)/2;
              const scale=4;
              const mmToPx=3.7795275591;
              const cvW=Math.round(drawW*mmToPx*scale);
              const cvH=Math.round(drawH*mmToPx*scale);
              const cv=document.createElement("canvas");
              cv.width=cvW;cv.height=cvH;
              const ctx=cv.getContext("2d");
              ctx.imageSmoothingEnabled=true;
              ctx.imageSmoothingQuality="high";
              ctx.drawImage(img,0,0,cvW,cvH);
              const hdDataUrl=cv.toDataURL("image/png");
              doc.addImage(hdDataUrl,"PNG",margin,drawY,drawW,drawH,undefined,"NONE");
              resolve();
            };
            img.onerror=()=>resolve();
            img.src=logoUrl;
          });
        }catch(e){
          doc.setTextColor(245,180,0);
          doc.setFontSize(8);
          doc.setFont("helvetica","bold");
          doc.text(companyName.toUpperCase(),margin,12,{charSpace:1.5});
        }
      }else{
        doc.setTextColor(245,180,0);
        doc.setFontSize(8);
        doc.setFont("helvetica","bold");
        doc.text(companyName.toUpperCase(),margin,12,{charSpace:1.5});
      }
      doc.setTextColor(237,234,226);
      doc.setFontSize(16);
      doc.text("Inter-Department Satisfaction",margin,24);
      doc.setFontSize(8);
      doc.setFont("helvetica","normal");
      doc.setTextColor(154,161,168);
      doc.text(`Generated: ${new Date().toLocaleString()}`,margin,31);
      if(pf!==ALL_PLANTS_ID||rf!=="All"||ff!=="All"){
        const filterText=[pf!==ALL_PLANTS_ID?pf:null,rf!=="All"?rf:null,ff!=="All"?ff:null].filter(Boolean).join(" · ");
        doc.text(`Filter: ${filterText}`,W-margin,31,{align:"right"});
      }
      doc.setTextColor(30,30,30);
      y=46;

      // ── Overall score row ──────────────────────────────────────
      sectionHead("Overall Satisfaction Score");

      const rowH=68;
      const gaugeCardW=contentW*0.44;
      const kpiAreaX=margin+gaugeCardW+4;
      const kpiAreaW=contentW-gaugeCardW-4;
      const kpiCols=2,kpiRows=2;
      const kpiW=kpiAreaW/kpiCols-2;
      const kpiH=rowH/kpiRows-2;

      // Gauge card background
      doc.setFillColor(248,246,240);
      doc.setDrawColor(220,215,201);
      doc.setLineWidth(0.4);
      doc.roundedRect(margin,y,gaugeCardW,rowH,3,3,"FD");

      doc.setFontSize(6);
      doc.setFont("helvetica","bold");
      doc.setTextColor(107,106,98);
      doc.text("OVERALL SATISFACTION",margin+4,y+6);

      // Draw gauge arc
      const gR=20;
      const gCx=margin+gaugeCardW/2;
      const gCy=y+10+gR+4;
      const drawArc=(startPct,endPct,r,col)=>{
        doc.setDrawColor(...col);
        doc.setLineWidth(4.5);
        const steps=40;
        const points=[];
        for(let i=0;i<=steps;i++){
          const p=startPct+(endPct-startPct)*(i/steps);
          const a=Math.PI-p*Math.PI;
          points.push([gCx+r*Math.cos(a),gCy-r*Math.sin(a)]);
        }
        for(let i=0;i<points.length-1;i++){
          doc.line(points[i][0],points[i][1],points[i+1][0],points[i+1][1]);
        }
      };
      drawArc(0,0.333,gR,[232,85,45]);
      drawArc(0.333,0.667,gR,[245,180,0]);
      drawArc(0.667,1,gR,[76,154,106]);

      // Scale tick labels: 1, 3, 5
      doc.setFontSize(5);
      doc.setFont("helvetica","normal");
      doc.setTextColor(107,106,98);
      [[1,0],[3,0.5],[5,1]].forEach(([v,p])=>{
        const a=Math.PI-p*Math.PI;
        const lr=gR-6;
        const lx=gCx+lr*Math.cos(a);
        const ly=gCy-lr*Math.sin(a);
        doc.text(String(v),lx,ly+1.5,{align:"center"});
      });

      // Needle
      const pct=Math.max(0,Math.min(1,(overall-1)/4));
      const na=Math.PI-pct*Math.PI;
      const nLen=gR-3;
      const ndx=Math.cos(na),ndy=-Math.sin(na);
      const pdx=Math.sin(na),pdy=Math.cos(na);
      const baseInset=1.6,baseHalfW=1.1;
      const tailLen=2.6,tailHalfW=0.8;
      const tipX=gCx+nLen*ndx,tipY=gCy+nLen*ndy;
      const b1X=gCx+baseInset*ndx+baseHalfW*pdx,b1Y=gCy+baseInset*ndy+baseHalfW*pdy;
      const b2X=gCx+baseInset*ndx-baseHalfW*pdx,b2Y=gCy+baseInset*ndy-baseHalfW*pdy;
      const t1X=gCx-tailLen*ndx+tailHalfW*pdx,t1Y=gCy-tailLen*ndy+tailHalfW*pdy;
      const t2X=gCx-tailLen*ndx-tailHalfW*pdx,t2Y=gCy-tailLen*ndy-tailHalfW*pdy;
      doc.setFillColor(27,58,107);
      doc.setDrawColor(27,58,107);
      doc.setLineWidth(0.1);
      doc.lines(
        [[b1X-tipX,b1Y-tipY],[t1X-b1X,t1Y-b1Y],[t2X-t1X,t2Y-t1Y],[b2X-t2X,b2Y-t2Y]],
        tipX,tipY,[1,1],"FD",true
      );
      doc.setFillColor(255,255,255);
      doc.setDrawColor(180,175,165);
      doc.setLineWidth(0.5);
      doc.circle(gCx,gCy,3,"FD");
      doc.setFillColor(76,154,106);
      doc.circle(gCx,gCy,1.5,"F");

      // Score pill
      const scoreAccentPdf=overall>=4?[76,154,106]:overall>=3?[245,180,0]:[232,85,45];
      const pillY=gCy+5;
      const pillW=28,pillH=16,pillRx=3;
      doc.setFillColor(255,255,255);
      doc.setDrawColor(220,215,201);
      doc.setLineWidth(0.4);
      doc.roundedRect(gCx-pillW/2,pillY,pillW,pillH,pillRx,pillRx,"FD");
      doc.setFontSize(13);
      doc.setFont("helvetica","bold");
      doc.setTextColor(...scoreAccentPdf);
      doc.text(fmt1(overall),gCx,pillY+10,{align:"center"});
      doc.setFontSize(4.5);
      doc.setFont("helvetica","normal");
      doc.setTextColor(107,106,98);
      doc.text("OUT OF 5.0",gCx,pillY+13.5,{align:"center"});

      // 2×2 KPI grid
      const kpis2x2=[
        {label:"Total Submissions",value:String(filteredResponses.length),sub:null,accent:null},
        {label:"Total Ratings",value:String(filtered.length),sub:null,accent:null},
        {label:"Highest Rated",value:topDept?topDept.name:"—",sub:topDept?`${fmt1(topDept.score)} / 5.0`:null,accent:[76,154,106]},
        {label:"Needs Attention",value:lowDept?lowDept.name:"—",sub:lowDept?`${fmt1(lowDept.score)} / 5.0`:null,accent:[232,85,45]},
      ];
      kpis2x2.forEach((k,i)=>{
        const col=i%kpiCols;
        const row=Math.floor(i/kpiCols);
        const kx=kpiAreaX+col*(kpiW+2);
        const ky=y+row*(kpiH+2);
        doc.setFillColor(255,255,255);
        doc.setDrawColor(220,215,201);
        doc.setLineWidth(0.3);
        doc.roundedRect(kx,ky,kpiW,kpiH,2,2,"FD");
        doc.setFontSize(7.5);
        doc.setFont("helvetica","normal");
        doc.setTextColor(107,106,98);
        doc.text(k.label.toUpperCase(),kx+4,ky+7);
        doc.setFontSize(k.value.length>12?10.5:14);
        doc.setFont("helvetica","bold");
        if(k.accent)doc.setTextColor(...k.accent);
        else doc.setTextColor(30,34,41);
        const maxValueW=kpiW-8;
        const valueLines=doc.splitTextToSize(k.value,maxValueW);
        valueLines.forEach((ln,li)=>doc.text(ln,kx+4,ky+17+li*7));
        if(k.sub){
          doc.setFontSize(7.5);
          doc.setFont("helvetica","normal");
          doc.setTextColor(107,106,98);
          doc.text(k.sub,kx+4,ky+kpiH-4);
        }
      });
      y+=rowH+4;

      // ── Tenure donut + legend bars ────────────────────────────
      if(tenureData.length){
        sectionHead("Responses by Tenure");
        const tenureBlockH=Math.max(52, tenureData.length*14+16);
        if(y>pageH-tenureBlockH-10){doc.addPage();y=margin;}

        // ── Draw donut using canvas → image (reliable cross-browser) ──
        const donutSize=120; // canvas px
        const donutCanvas=document.createElement("canvas");
        donutCanvas.width=donutSize; donutCanvas.height=donutSize;
        const dCtx=donutCanvas.getContext("2d");
        const dTotal2=tenureData.reduce((s,d)=>s+d.count,0);
        let ang=-Math.PI/2;
        tenureData.forEach((d)=>{
          const span=(d.count/dTotal2)*Math.PI*2;
          dCtx.beginPath();
          dCtx.moveTo(donutSize/2,donutSize/2);
          dCtx.arc(donutSize/2,donutSize/2,donutSize/2-2,ang,ang+span);
          dCtx.closePath();
          dCtx.fillStyle=d.color;
          dCtx.fill();
          ang+=span;
        });
        // inner hole
        dCtx.beginPath();
        dCtx.arc(donutSize/2,donutSize/2,donutSize*0.34,0,Math.PI*2);
        dCtx.fillStyle="#ffffff";
        dCtx.fill();
        // center text
        dCtx.fillStyle="#1e2229";
        dCtx.font="bold 22px sans-serif";
        dCtx.textAlign="center";
        dCtx.fillText(String(dTotal2),donutSize/2,donutSize/2+4);
        dCtx.fillStyle="#6b6a62";
        dCtx.font="11px sans-serif";
        dCtx.fillText("responses",donutSize/2,donutSize/2+18);
        // white dividing lines between segments (inner radius → outer radius only, not through center)
        const innerR=donutSize*0.34;
        ang=-Math.PI/2;
        tenureData.forEach((d)=>{
          const span=(d.count/dTotal2)*Math.PI*2;
          dCtx.beginPath();
          dCtx.moveTo(
            donutSize/2+Math.cos(ang)*innerR,
            donutSize/2+Math.sin(ang)*innerR
          );
          dCtx.lineTo(
            donutSize/2+Math.cos(ang)*(donutSize/2-2),
            donutSize/2+Math.sin(ang)*(donutSize/2-2)
          );
          dCtx.strokeStyle="#ffffff";
          dCtx.lineWidth=2;
          dCtx.stroke();
          ang+=span;
        });
        const donutMM=46;
        doc.addImage(donutCanvas.toDataURL("image/png"),"PNG",margin,y,donutMM,donutMM);

        // ── Legend bars on the right ──────────────────────────────
        const lx=margin+donutMM+8;
        const lw=contentW-donutMM-8;
        const barTrackW=lw*0.52;
        const barH=3.5;
        const rowGap=14;
        tenureData.forEach((d,i)=>{
          const ly=y+6+i*rowGap;
          const hex=d.color.replace("#","");
          const n=parseInt(hex,16);
          const rc=(n>>16)&255, gc=(n>>8)&255, bc=n&255;

          // Dot
          doc.setFillColor(rc,gc,bc);
          doc.circle(lx+2,ly+2,2,"F");

          // Name
          doc.setFontSize(8);
          doc.setFont("helvetica","normal");
          doc.setTextColor(30,34,41);
          doc.text(d.name,lx+6,ly+3.5);

          // Bar track (grey)
          const nameW=doc.getTextWidth(d.name);
          const barX=lx+6+nameW+3;
          doc.setFillColor(220,215,205);
          doc.roundedRect(barX,ly+0.5,barTrackW,barH,1,1,"F");

          // Bar fill
          const fillW=Math.max(0,(d.pct/100)*barTrackW);
          doc.setFillColor(rc,gc,bc);
          if(fillW>0.5)doc.roundedRect(barX,ly+0.5,fillW,barH,1,1,"F");

          // Pct + count
          doc.setFontSize(7.5);
          doc.setFont("helvetica","bold");
          doc.setTextColor(30,34,41);
          doc.text(`${d.pct}%`,barX+barTrackW+3,ly+3.5);
          doc.setFont("helvetica","normal");
          doc.setTextColor(107,106,98);
          doc.text(String(d.count),barX+barTrackW+14,ly+3.5);
        });
        y+=Math.max(donutMM+4, tenureData.length*rowGap+10);
      }

      // ── Dept bar chart ─────────────────────────────────────────
      if(deptData.length){
        sectionHead("Average Rating by Department");
        const dSorted=[...deptData].sort((a,b)=>b.score-a.score);
        const labelColW=42;
        const barAreaX=margin+labelColW;
        const barAreaW=contentW-labelColW-18;
        const dBarH=5;
        const dRowH=9;
        const dMax=5;
        const chartTotalH=dSorted.length*dRowH+8;
        if(y+chartTotalH>pageH-margin){doc.addPage();y=margin;}
        const chartStartY=y;
        [0,1,2,3,4,5].forEach((v)=>{
          const gx=barAreaX+(v/dMax)*barAreaW;
          doc.setDrawColor(220,215,200);
          doc.setLineWidth(0.2);
          doc.line(gx,chartStartY,gx,chartStartY+dSorted.length*dRowH);
          doc.setFontSize(5.5);
          doc.setTextColor(154,161,168);
          doc.text(String(v),gx,chartStartY+dSorted.length*dRowH+5,{align:"center"});
        });
        dSorted.forEach((d,i)=>{
          const rowY=chartStartY+i*dRowH;
          doc.setFontSize(7);
          doc.setFont("helvetica","normal");
          doc.setTextColor(30,34,41);
          const nameLines=doc.splitTextToSize(d.name,labelColW-3);
          doc.text(nameLines[0],margin+labelColW-3,rowY+dBarH-0.5,{align:"right"});
          doc.setFillColor(230,227,220);
          doc.roundedRect(barAreaX,rowY,barAreaW,dBarH,1,1,"F");
          const fillW=Math.max(0,(d.score/dMax)*barAreaW);
          const barCol=d.score>=4?[76,154,106]:d.score>=3?[245,180,0]:[232,85,45];
          doc.setFillColor(...barCol);
          if(fillW>0)doc.roundedRect(barAreaX,rowY,fillW,dBarH,1,1,"F");
          doc.setFontSize(7);
          doc.setFont("helvetica","bold");
          doc.setTextColor(...barCol);
          doc.text(fmt1(d.score),barAreaX+barAreaW+3,rowY+dBarH-0.5);
          doc.setFontSize(6);
          doc.setFont("helvetica","normal");
          doc.setTextColor(154,161,168);
          doc.text(`n=${d.count}`,barAreaX+barAreaW+14,rowY+dBarH-0.5);
        });
        y=chartStartY+chartTotalH+4;
        if(y>pageH-40){doc.addPage();y=margin;}
        doc.autoTable({
          startY:y,
          head:[["Department","Avg Rating","Score /5","Ratings Count"]],
          body:dSorted.map((d)=>[d.name,fmt1(d.score),`${Math.round(d.score)} / 5`,d.count]),
          styles:{fontSize:8,cellPadding:3},
          headStyles:{fillColor:[99,102,241],textColor:255,fontStyle:"bold",fontSize:8},
          margin:{left:margin,right:margin},
          didDrawCell:(data)=>{
            if(data.section==="body"){
              doc.setDrawColor(210,207,200);doc.setLineWidth(0.3);
              doc.line(data.cell.x,data.cell.y+data.cell.height,data.cell.x+data.cell.width,data.cell.y+data.cell.height);
            }
          },
        });
        y=doc.lastAutoTable.finalY+6;
      }

      // ── Factor Breakdown by Department ───────────────────────
      const pdfFactorAvgs={};
      filtered.forEach((r)=>{
        if(!r.factors||!Object.keys(r.factors).length)return;
        if(!pdfFactorAvgs[r.ratedDept])pdfFactorAvgs[r.ratedDept]={};
        DEPT_FACTORS.forEach(f=>{
          const v=r.factors[f.id];
          if(v>0){if(!pdfFactorAvgs[r.ratedDept][f.id])pdfFactorAvgs[r.ratedDept][f.id]=[];pdfFactorAvgs[r.ratedDept][f.id].push(v);}
        });
      });
      const pdfFactorDepts=Object.keys(pdfFactorAvgs);
      if(pdfFactorDepts.length){
        sectionHead("Factor Breakdown by Department");
        if(y>pageH-40){doc.addPage();y=margin;}
        doc.autoTable({
          startY:y,
          head:[["Department",...DEPT_FACTORS.map(f=>f.label),"Overall"]],
          body:pdfFactorDepts.sort().map((dept)=>{
            const fm=pdfFactorAvgs[dept];
            const vals=DEPT_FACTORS.map(f=>{const arr=fm[f.id]||[];return arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:0;});
            const nonZero=vals.filter(v=>v>0);
            const overall=nonZero.length?nonZero.reduce((a,b)=>a+b,0)/nonZero.length:0;
            return[dept,...vals.map(v=>v>0?fmt1(v):"—"),overall>0?fmt1(overall):"—"];
          }),
          styles:{fontSize:8,cellPadding:3},
          headStyles:{fillColor:[99,102,241],textColor:255,fontStyle:"bold",fontSize:8},
          margin:{left:margin,right:margin},
        });
        y=doc.lastAutoTable.finalY+6;
      }

      // ── Trend ─────────────────────────────────────────────────
      if(trendData.length>1){
        sectionHead("Rating Trend (Weekly Average)");
        const tw=contentW,th=30,tx0=margin,ty0=y+th;
        const tMin=1,tMax=5;
        const tScaleX=(i)=>tx0+(i/(trendData.length-1))*tw;
        const tScaleY=(v)=>ty0-((v-tMin)/(tMax-tMin))*th;
        [2,3,4,5].forEach((v)=>{
          doc.setDrawColor(210,207,200);
          doc.setLineWidth(0.2);
          doc.line(tx0,tScaleY(v),tx0+tw,tScaleY(v));
          doc.setFontSize(6);
          doc.setTextColor(154,161,168);
          doc.text(String(v),tx0-4,tScaleY(v)+2,{align:"right"});
        });
        doc.setDrawColor(99,102,241);
        doc.setLineWidth(1.2);
        trendData.forEach((d,i)=>{
          if(i===0)return;
          doc.line(tScaleX(i-1),tScaleY(trendData[i-1].score),tScaleX(i),tScaleY(d.score));
        });
        trendData.forEach((d,i)=>{
          doc.setFillColor(99,102,241);
          doc.circle(tScaleX(i),tScaleY(d.score),1.2,"F");
          if(i%Math.max(1,Math.floor(trendData.length/6))===0){
            doc.setFontSize(6);
            doc.setTextColor(107,106,98);
            doc.text(d.week,tScaleX(i),ty0+5,{align:"center"});
          }
        });
        y=ty0+10;
      }

      // ── Recent Comments ───────────────────────────────────────
      if(comments.length){
        sectionHead("Recent Comments");
        comments.forEach((r)=>{
          if(y>pageH-30){doc.addPage();y=margin;}
          doc.setFillColor(245,243,238);
          doc.roundedRect(margin,y,contentW,20,2,2,"F");
          doc.setFont("helvetica","bold");doc.setFontSize(7.5);doc.setTextColor(62,143,176);
          const fromW=doc.getTextWidth(r.submitterDept);
          doc.text(r.submitterDept,margin+4,y+7);
          doc.setTextColor(150,150,160);doc.text(" → ",margin+4+fromW,y+7);
          const arrowW=doc.getTextWidth(" → ");
          doc.setTextColor(232,85,45);doc.text(r.ratedDept,margin+4+fromW+arrowW,y+7);
          const toW=doc.getTextWidth(r.ratedDept);
          doc.setTextColor(120,120,140);doc.setFont("helvetica","normal");doc.setFontSize(7);
          doc.text(`  ${r.rating}/5  ·  ${new Date(r.ts).toLocaleDateString()}`,margin+4+fromW+arrowW+toW,y+7);
          doc.setTextColor(50,54,61);doc.setFontSize(7);
          const lines=doc.splitTextToSize(r.comment||"",contentW-8);
          doc.text(lines[0],margin+4,y+15);
          y+=24;
        });
        y+=4;
      }

      // ── All responses table ───────────────────────────────────
      doc.addPage();y=margin;
      sectionHead("All Responses");
      doc.autoTable({
        startY:y,
        head:[["Date","Plant","Code","Name","From Dept","Rated Dept","Collab","Comm","Resp","Quality","Support","Avg","Comment","Shift","Tenure"]],
        body:filtered.map((r)=>[
          new Date(r.ts).toLocaleDateString(),
          r.plant||"—",
          r.employeeCode||"—",r.employeeName||"—",
          r.submitterDept,r.ratedDept,
          r.factors&&r.factors.collaboration?`${r.factors.collaboration}★`:"—",
          r.factors&&r.factors.communication?`${r.factors.communication}★`:"—",
          r.factors&&r.factors.responsiveness?`${r.factors.responsiveness}★`:"—",
          r.factors&&r.factors.quality_of_work?`${r.factors.quality_of_work}★`:"—",
          r.factors&&r.factors.support_helpfulness?`${r.factors.support_helpfulness}★`:"—",
          r.rating?fmt1(r.rating):"—",
          r.comment||"",r.shift,r.tenure||"—"
        ]),
        styles:{fontSize:7,cellPadding:2,overflow:"linebreak"},
        headStyles:{fillColor:[99,102,241],textColor:255,fontStyle:"bold",fontSize:7},
        columnStyles:{6:{cellWidth:38}},
        margin:{left:margin,right:margin},
        didDrawCell:(data)=>{
          if(data.section==="body"){
            doc.setDrawColor(210,207,200);doc.setLineWidth(0.3);
            doc.line(data.cell.x,data.cell.y+data.cell.height,data.cell.x+data.cell.width,data.cell.y+data.cell.height);
          }
        },
      });

      // ── Footer on every page ──────────────────────────────────
      const totalPages=doc.internal.getNumberOfPages();
      for(let p=1;p<=totalPages;p++){
        doc.setPage(p);
        doc.setFontSize(7);
        doc.setTextColor(154,161,168);
        doc.text(companyName,margin,pageH-6);
        doc.text(`${p} / ${totalPages}`,W-margin,pageH-6,{align:"right"});
      }

      doc.save(`inter-dept-satisfaction-${new Date().toISOString().slice(0,10)}.pdf`);
    }catch(e){console.error("PDF export failed:",e);setBulkErr((e&&e.message)||String(e));}
    setExpBusy(false);
  };

  return(
    <div>
      {plants.length>1&&<div className="plant-pill-bar">{<button className={"plant-pill"+(pf===ALL_PLANTS_ID?" active":"")} onClick={()=>setPf(ALL_PLANTS_ID)}>All Plants</button>}{plants.map((p)=><button key={p} className={"plant-pill"+(pf===p?" active":"")} onClick={()=>setPf(p)}>{p}</button>)}</div>}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12,flexWrap:"wrap",gap:8}}>
        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
          <button
            className="submit-btn small-btn"
            style={{background:"linear-gradient(135deg,#9B6BD1,#6366F1)",fontSize:12,letterSpacing:"0.5px",display:"flex",alignItems:"center",gap:6}}
            onClick={handleDummyEntry}
            disabled={dummyBusy||!departments.length}
            title="Insert a randomised dummy response for testing. Each click adds one entry."
          >
            {dummyBusy?"Inserting…":"⚡ Insert Dummy Entry"}
          </button>
          {dummyCount>0&&<span style={{fontSize:12,color:"#9B6BD1",fontWeight:600}}>{dummyCount} dummy entr{dummyCount===1?"y":"ies"} added this session</span>}
        </div>
        <button className="submit-btn small-btn" style={{background:"#3E8FB0"}} onClick={handleExportPdf} disabled={expBusy||!flatRows.length}>{expBusy?"…":"Export PDF"}</button>
      </div>
      <div className="filter-bar">
        <div className="filter-field"><label>Rated Department</label><select value={rf} onChange={(e)=>setRf(e.target.value)}><option value="All">All departments</option>{ratedOpts.map((d)=><option key={d} value={d}>{d}</option>)}</select></div>
        <div className="filter-field"><label>Submitted By (Dept)</label><select value={ff} onChange={(e)=>setFf(e.target.value)}><option value="All">All submitters</option>{fromOpts.map((d)=><option key={d} value={d}>{d}</option>)}</select></div>
        <div className="filter-count">{filtered.length} rating{filtered.length===1?"":"s"}</div>
      </div>

      <div className="panel-row top-row">
        <div className="gauge-panel"><div className="panel-title">Overall Satisfaction</div><Gauge value={overall} theme={theme}/></div>
        <div className="kpi-grid">
          <StatCard label="Total Submissions" value={filteredResponses.length}/>
          <StatCard label="Total Ratings" value={filtered.length}/>
          <StatCard label="Highest Rated" value={topDept?topDept.name:"—"} sub={topDept?`${fmt1(topDept.score)} / 5.0`:""} accent="#4C9A6A"/>
          <StatCard label="Needs Attention" value={lowDept?lowDept.name:"—"} sub={lowDept?`${fmt1(lowDept.score)} / 5.0`:""} accent="#E8552D"/>
        </div>
      </div>

      <div className="panel">
        <div className="panel-title">Responses by Tenure</div>
        {tenureData.length?(<div className="tenure-donut-wrap">
          <div className="tenure-donut-chart">
            <ResponsiveContainer width="100%" height={240}>
              <PieChart><Pie data={tenureData} dataKey="count" nameKey="name" cx="50%" cy="50%" innerRadius={72} outerRadius={106} paddingAngle={3} stroke="none">
                {tenureData.map((e,i)=><Cell key={i} fill={e.color}/>)}
              </Pie><Tooltip contentStyle={{background:ct.tooltipBg,border:`1px solid ${ct.tooltipBorder}`,borderRadius:4}} formatter={(v,n,p)=>[`${v} (${p.payload.pct}%)`,n]}/></PieChart>
            </ResponsiveContainer>
            <div className="tenure-donut-center"><div className="tenure-donut-total">{tenureTotal}</div><div className="tenure-donut-total-label">responses</div></div>
          </div>
          <div className="tenure-stats-list">{tenureData.map((d)=>(<div className="tenure-stat-row" key={d.key}><div className="tenure-stat-top"><span className="tenure-stat-dot" style={{background:d.color}}/><span className="tenure-stat-name">{d.name}</span><span className="tenure-stat-pct">{d.pct}%</span><span className="tenure-stat-count">{d.count}</span></div><div className="tenure-stat-bar-track"><div className="tenure-stat-bar-fill" style={{width:`${d.pct}%`,background:d.color}}/></div></div>))}</div>
        </div>):<div className="empty-note">No responses yet.</div>}
      </div>

      <div className="panel">
        <div className="panel-title">Average Rating by Department</div>
        {deptData.length?(<ResponsiveContainer width="100%" height={Math.max(160,deptData.length*44)}>
          <BarChart data={deptData} layout="vertical" margin={{left:10,right:40,top:5,bottom:5}}>
            <CartesianGrid strokeDasharray="3 3" stroke={ct.grid} horizontal={false}/>
            <XAxis type="number" domain={[0,5]} stroke={ct.axis} fontSize={11} ticks={[1,2,3,4,5]}/>
            <YAxis type="category" dataKey="name" stroke={ct.axis} fontSize={11} width={160}/>
            <Tooltip contentStyle={{background:ct.tooltipBg,border:`1px solid ${ct.tooltipBorder}`,borderRadius:4}} labelStyle={{color:ct.tooltipLabel}} formatter={(v,n,p)=>[`${v} (${p.payload.count} rating${p.payload.count===1?"":"s"})`,"Avg"]}/>
            <Bar dataKey="score" radius={[0,3,3,0]}>
              {deptData.map((d,i)=><Cell key={i} fill={d.score>=4?"#4C9A6A":d.score>=3?"#F5B400":"#E8552D"}/>)}
            </Bar>
          </BarChart>
        </ResponsiveContainer>):<div className="empty-note">No ratings match the current filters.</div>}
      </div>

      {Object.keys(factorAvgs).length>0&&(
        <div className="panel">
          <div className="panel-title">Factor Breakdown by Department</div>
          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:13,minWidth:520}}>
              <thead>
                <tr>
                  <th style={{textAlign:"left",padding:"8px 12px",fontSize:11,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.5px",color:"var(--text-secondary)",borderBottom:"2px solid var(--panel-border)",minWidth:160}}>Department</th>
                  {DEPT_FACTORS.map(f=>(
                    <th key={f.id} style={{textAlign:"center",padding:"8px 8px",fontSize:11,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.4px",color:"var(--text-secondary)",borderBottom:"2px solid var(--panel-border)",minWidth:110}}>
                      <span style={{display:"block"}}>{f.icon}</span>{f.label}
                    </th>
                  ))}
                  <th style={{textAlign:"center",padding:"8px 8px",fontSize:11,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.4px",color:"var(--text-secondary)",borderBottom:"2px solid var(--panel-border)",minWidth:80}}>Overall</th>
                </tr>
              </thead>
              <tbody>
                {Object.entries(factorAvgs).sort(([a],[b])=>a.localeCompare(b)).map(([dept,fm],di)=>{
                  const overallVals=DEPT_FACTORS.map(f=>fm[f.id]).filter(v=>v>0);
                  const overallAvgDept=overallVals.length?overallVals.reduce((a,b)=>a+b,0)/overallVals.length:0;
                  const scoreCol=(v)=>v>=4?"#4C9A6A":v>=3?"#F5B400":"#E8552D";
                  return(
                    <tr key={dept} style={{background:di%2===0?"var(--bg-page)":"var(--bg-panel)"}}>
                      <td style={{padding:"10px 12px",fontWeight:600,color:"var(--text-primary)",borderBottom:"1px solid var(--panel-border)"}}>{dept}</td>
                      {DEPT_FACTORS.map(f=>{
                        const v=fm[f.id]||0;
                        return(
                          <td key={f.id} style={{textAlign:"center",padding:"10px 8px",borderBottom:"1px solid var(--panel-border)"}}>
                            {v>0?(
                              <div>
                                <div style={{fontFamily:"'IBM Plex Mono',monospace",fontWeight:700,fontSize:15,color:scoreCol(v)}}>{fmt1(v)}</div>
                                <div style={{fontSize:10,color:"var(--text-tertiary)"}}>/5</div>
                              </div>
                            ):<span style={{color:"var(--text-tertiary)"}}>—</span>}
                          </td>
                        );
                      })}
                      <td style={{textAlign:"center",padding:"10px 8px",borderBottom:"1px solid var(--panel-border)"}}>
                        {overallAvgDept>0?(
                          <div>
                            <div style={{fontFamily:"'IBM Plex Mono',monospace",fontWeight:700,fontSize:15,color:scoreCol(overallAvgDept)}}>{fmt1(overallAvgDept)}</div>
                            <div style={{fontSize:10,color:"var(--text-tertiary)"}}>/5</div>
                          </div>
                        ):<span style={{color:"var(--text-tertiary)"}}>—</span>}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      )}

      <div className="panel">
        <div className="panel-title">Rating Trend (Weekly Average)</div>
        {trendData.length>1?(<ResponsiveContainer width="100%" height={220}>
          <LineChart data={trendData} margin={{left:0,right:20,top:10,bottom:5}}>
            <CartesianGrid strokeDasharray="3 3" stroke={ct.grid}/>
            <XAxis dataKey="week" stroke={ct.axis} fontSize={11}/>
            <YAxis domain={[1,5]} stroke={ct.axis} fontSize={11} ticks={[1,2,3,4,5]}/>
            <Tooltip contentStyle={{background:ct.tooltipBg,border:`1px solid ${ct.tooltipBorder}`,borderRadius:4}} labelStyle={{color:ct.tooltipLabel}}/>
            <Line type="monotone" dataKey="score" stroke="#F5B400" strokeWidth={2} dot={{r:3}}/>
          </LineChart>
        </ResponsiveContainer>):<div className="empty-note">Not enough data to show a trend yet.</div>}
      </div>

      <div className="panel">
        <div className="panel-title">Recent Comments</div>
        {comments.length?(<div className="comment-feed">{comments.map((r)=>(<div className="comment-item" key={r._fid}><div className="comment-meta"><span style={{color:"#3E8FB0",fontWeight:600}}>{r.submitterDept}</span><span>→</span><span style={{color:"#E8552D",fontWeight:600}}>{r.ratedDept}</span><span>·</span><span>{"★".repeat(r.rating)} ({r.rating}/5)</span><span>·</span><span>{new Date(r.ts).toLocaleDateString()}</span></div><p className="comment-text">{r.comment}</p></div>))}</div>):<div className="empty-note">No comments yet.</div>}
      </div>

      <div className="panel">
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:12,marginBottom:14}}>
          <div className="panel-title" style={{marginBottom:0}}>All Responses</div>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            <button className="submit-btn small-btn" style={{background:"#3E8FB0"}} onClick={handleExportPdf} disabled={expBusy||!flatRows.length}>{expBusy?"…":"Export PDF"}</button>
            <button className="submit-btn small-btn" style={{background:"#E8552D"}} onClick={handleDel} disabled={bulkBusy||!selCount}>{bulkBusy?"…":`Delete Selected (${selCount})`}</button>
          </div>
        </div>
        {bulkErr&&<div className="error-msg" style={{marginBottom:12}}>{bulkErr}</div>}
        {filteredResponses.length?(<div className="responses-table-wrap"><table className="responses-table">
          <thead><tr><th><input type="checkbox" checked={allSel} onChange={toggleAll}/></th><th>Date</th><th>Code</th><th>Name</th><th>Plant</th><th>From Dept</th><th>Dept Ratings (Factor Breakdown)</th><th>Shift</th><th>Tenure</th></tr></thead>
          <tbody>{filteredResponses.map((r)=>{
            const parts=Object.entries(r.deptRatings||{}).map(([d,info])=>{
              const overall=deptOverallScore(info);
              if(info.factors&&Object.keys(info.factors).length){
                const fStr=DEPT_FACTORS.filter(f=>info.factors[f.id]>0).map(f=>`${f.label}:${info.factors[f.id]}★`).join(", ");
                return `${d} [${fStr}] (avg ${fmt1(overall)})`;
              }
              return `${d}: ${fmt1(overall)}★`;
            });
            return(<tr key={r.id}><td><input type="checkbox" checked={!!selIds[r.id]} onChange={()=>toggleSel(r.id)}/></td><td>{new Date(r.ts).toLocaleDateString()}</td><td>{r.employeeCode||"—"}</td><td>{r.employeeName||"—"}</td><td>{r.plant||"—"}</td><td>{r.submitterDept}</td><td className="responses-table-comment">{parts.join(" | ")||"—"}</td><td>{r.shift}</td><td>{r.tenure||"—"}</td></tr>);
          })}</tbody>
        </table></div>):<div className="empty-note">No responses yet.</div>}
      </div>
    </div>
  );
}

function ListManager({title,desc,items,onAdd,onDelete,placeholder}){
  const [draft,setDraft]=useState("");const [error,setError]=useState("");const [busyId,setBusyId]=useState("");
  const handleAdd=async()=>{const n=draft.trim();if(!n)return;setError("");try{await onAdd(n);setDraft("");}catch(e){setError((e&&(e.message||e.code))||String(e));}};
  const handleDel=async(item)=>{setError("");setBusyId(item.id);try{await onDelete(item.id);}catch(e){setError((e&&(e.message||e.code))||String(e));}setBusyId("");};
  return(<div className="panel"><div className="panel-title">{title}</div><p className="empty-note" style={{padding:"0 0 12px",textAlign:"left"}}>{desc}</p>
    <div className="list-manager-items">{items.map((item)=>(<span className="list-chip" key={item.id}>{item.name}<button type="button" className="list-chip-remove" onClick={()=>handleDel(item)} disabled={busyId===item.id}>×</button></span>))}</div>
    {error&&<div className="error-msg" style={{marginTop:12}}>{error}</div>}
    <div className="field-row" style={{marginTop:12,marginBottom:0}}><input className="name-input" style={{flex:1}} placeholder={placeholder} value={draft} onChange={(e)=>setDraft(e.target.value)} onKeyDown={(e)=>{if(e.key==="Enter")handleAdd();}}/><button className="submit-btn small-btn" onClick={handleAdd}>Add</button></div>
  </div>);
}

function SettingsPanel({surveyUrl,onSaveUrl,logoUrl,onSaveLogo,onRemoveLogo,companyName,onSaveCompanyName,ratingGuidelines,onSaveGuidelines,plants,onAddPlant,onDeletePlant,departments,onAddDepartment,onDeleteDepartment,shifts,onAddShift,onDeleteShift}){
  const [urlD,setUrlD]=useState(surveyUrl);const [urlSaved,setUrlSaved]=useState(false);const [urlErr,setUrlErr]=useState("");
  const [nameD,setNameD]=useState(companyName);const [nameSaved,setNameSaved]=useState(false);const [nameErr,setNameErr]=useState("");
  const [guideD,setGuideD]=useState(ratingGuidelines);const [guideSaved,setGuideSaved]=useState(false);const [guideErr,setGuideErr]=useState("");
  const [logoBusy,setLogoBusy]=useState(false);const [logoErr,setLogoErr]=useState("");
  useEffect(()=>setUrlD(surveyUrl),[surveyUrl]);
  useEffect(()=>setNameD(companyName),[companyName]);
  useEffect(()=>setGuideD(ratingGuidelines),[ratingGuidelines]);
  const saveWith=(fn,setSaved,setErr)=>async(val)=>{setErr("");try{await fn(val);setSaved(true);setTimeout(()=>setSaved(false),2000);}catch(e){setErr((e&&(e.message||e.code))||String(e));}};
  const handleLogoFile=(e)=>{const file=e.target.files&&e.target.files[0];e.target.value="";if(!file)return;setLogoErr("");setLogoBusy(true);const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const max=200;let{width:w,height:h}=img;if(w>h){if(w>max){h=Math.round(h*max/w);w=max;}}else{if(h>max){w=Math.round(w*max/h);h=max;}}const cv=document.createElement("canvas");cv.width=w;cv.height=h;cv.getContext("2d").drawImage(img,0,0,w,h);onSaveLogo(cv.toDataURL("image/png")).catch((err)=>setLogoErr((err&&(err.message||err.code))||String(err))).finally(()=>setLogoBusy(false));};img.onerror=()=>setLogoBusy(false);img.src=reader.result;};reader.onerror=()=>setLogoBusy(false);reader.readAsDataURL(file);};
  return(<div>
    <div className="panel"><div className="panel-title">Company Name</div><p className="empty-note" style={{padding:"0 0 12px",textAlign:"left"}}>Appears in the header and on the printable poster.</p><div className="field-row" style={{marginBottom:4,alignItems:"center"}}><input className="name-input" style={{flex:1}} value={nameD} onChange={(e)=>setNameD(e.target.value)} placeholder={DEFAULT_COMPANY_NAME}/><button className="submit-btn small-btn" onClick={()=>saveWith(onSaveCompanyName,setNameSaved,setNameErr)(nameD.trim())}>{nameSaved?"Saved ✓":"Save"}</button></div>{nameErr&&<div className="error-msg">{nameErr}</div>}</div>
    <div className="panel"><div className="panel-title">Company Logo</div><p className="empty-note" style={{padding:"0 0 12px",textAlign:"left"}}>Appears in the header and on the printable poster.</p><div style={{display:"flex",alignItems:"center",gap:16,flexWrap:"wrap"}}><div className="logo-preview-box">{logoUrl?<img src={logoUrl} alt="Logo" className="logo-preview-img"/>:<span className="logo-preview-empty">No logo</span>}</div><div style={{display:"flex",gap:8,flexWrap:"wrap"}}><label className="submit-btn small-btn" style={{background:"#3E8FB0",cursor:"pointer"}}>{logoBusy?"...":"Upload logo"}<input type="file" accept="image/*" onChange={handleLogoFile} style={{display:"none"}} disabled={logoBusy}/></label>{logoUrl&&<button className="submit-btn small-btn" style={{background:"#6C7A89"}} onClick={onRemoveLogo}>Remove logo</button>}</div></div>{logoErr&&<div className="error-msg" style={{marginTop:12}}>{logoErr}</div>}</div>

    <div className="panel" style={{border:"2px solid #3E8FB0"}}>
      <div className="panel-title" style={{color:"#3E8FB0"}}>📋 Rating Guidelines</div>
      <p className="empty-note" style={{padding:"0 0 12px",textAlign:"left"}}>These guidelines appear <strong>above the survey form</strong> so employees know how to rate departments before they start.</p>
      <textarea rows={7} style={{width:"100%",resize:"vertical",fontFamily:"Inter,sans-serif",fontSize:14,padding:"10px",background:"var(--bg-page)",color:"var(--text-primary)",border:"1px solid var(--panel-border)",borderRadius:4}} placeholder={DEFAULT_GUIDELINES} value={guideD} onChange={(e)=>setGuideD(e.target.value)}/>
      <div style={{marginTop:8}}><button className="submit-btn small-btn" style={{background:"#4C9A6A"}} onClick={()=>saveWith(onSaveGuidelines,setGuideSaved,setGuideErr)(guideD.trim())}>{guideSaved?"Saved ✓":"Save Guidelines"}</button></div>
      {guideErr&&<div className="error-msg">{guideErr}</div>}
    </div>

    <div className="panel"><div className="panel-title">Survey Link</div><p className="empty-note" style={{padding:"0 0 12px",textAlign:"left"}}>Public URL for this survey — used to generate the QR code.</p><div className="field-row" style={{marginBottom:4,alignItems:"center"}}><input className="name-input" style={{flex:1}} placeholder="https://your-survey-link.example.com" value={urlD} onChange={(e)=>setUrlD(e.target.value)}/><button className="submit-btn small-btn" onClick={()=>saveWith(onSaveUrl,setUrlSaved,setUrlErr)(urlD.trim())}>{urlSaved?"Saved ✓":"Save link"}</button></div>{urlErr&&<div className="error-msg">{urlErr}</div>}</div>

    <ListManager title="Plants" desc="Manage plant locations." items={plants} onAdd={onAddPlant} onDelete={onDeletePlant} placeholder="Add a plant"/>
    <ListManager title="Departments" desc="Employees rate all departments except their own." items={departments} onAdd={onAddDepartment} onDelete={onDeleteDepartment} placeholder="Add a department"/>
    <ListManager title="Shifts" desc="Shift options for employees." items={shifts} onAdd={onAddShift} onDelete={onDeleteShift} placeholder="Add a shift"/>
  </div>);
}

function AdminLogin({onCancel}){
  const [email,setEmail]=useState("");const [pw,setPw]=useState("");const [err,setErr]=useState("");const [busy,setBusy]=useState(false);
  const go=async()=>{setErr("");setBusy(true);try{await firebase.auth().signInWithEmailAndPassword(email,pw);}catch(e){setErr("Couldn't sign in. Check email and password.");}setBusy(false);};
  return(<div className="panel" style={{maxWidth:340,marginLeft:"auto"}}><div className="field-row" style={{marginBottom:8}}><input className="name-input" style={{flex:1}} type="email" placeholder="Email" value={email} onChange={(e)=>setEmail(e.target.value)}/></div><div className="field-row" style={{marginBottom:8}}><input className="name-input" style={{flex:1}} type="password" placeholder="Password" value={pw} onChange={(e)=>setPw(e.target.value)} onKeyDown={(e)=>{if(e.key==="Enter")go();}}/></div>{err&&<div className="error-msg">{err}</div>}<div style={{display:"flex",gap:8}}><button className="submit-btn small-btn" onClick={go} disabled={busy}>Log in</button><button className="submit-btn small-btn" style={{background:"#6C7A89"}} onClick={onCancel}>×</button></div></div>);
}

    [[CONFIG_DEPARTMENTS_PATH,DEFAULT_DEPTS],[CONFIG_SHIFTS_PATH,DEFAULT_SHIFTS],[CONFIG_PLANTS_PATH,DEFAULT_PLANTS]].forEach(([path,defaults])=>{
