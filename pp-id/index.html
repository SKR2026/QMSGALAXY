// ── Gauge ───────────────────────────────────────────────────────────────────
function Gauge({ value, theme, outOf5Label }) {
  const W = 260, H = 155;
  const cx = W / 2, cy = 130;
  const r = 95, trackWidth = 18;
  const START_ANGLE = Math.PI, END_ANGLE = 0;
  const clampedValue = Math.min(5, Math.max(0, value || 0));
  const fraction = clampedValue / 5;
  const arcAngle = START_ANGLE - fraction * Math.PI;
  const stops = [
    { offset: "0%",   color: "#E8552D" },
    { offset: "50%",  color: "#F5B400" },
    { offset: "100%", color: "#4C9A6A" },
  ];
  const polarToXY = (angle, radius) => ({
    x: cx + radius * Math.cos(Math.PI - angle),
    y: cy - radius * Math.sin(angle),
  });
  const describeArc = (startA, endA, radius) => {
    const s = polarToXY(startA, radius);
    const e = polarToXY(endA, radius);
    const large = (startA - endA) > Math.PI ? 1 : 0;
    return `M ${s.x} ${s.y} A ${radius} ${radius} 0 ${large} 0 ${e.x} ${e.y}`;
  };
  const needleTip = polarToXY(arcAngle, r - trackWidth / 2 - 4);
  const baseL = polarToXY(arcAngle - Math.PI / 2, 8);
  const baseR = polarToXY(arcAngle + Math.PI / 2, 8);
  const needlePoints = `${needleTip.x},${needleTip.y} ${baseL.x},${baseL.y} ${baseR.x},${baseR.y}`;
  const shadowTip = { x: needleTip.x + 2, y: needleTip.y + 2 };
  const shadowL  = { x: baseL.x + 2, y: baseL.y + 2 };
  const shadowR  = { x: baseR.x + 2, y: baseR.y + 2 };
  const needleShadowPoints = `${shadowTip.x},${shadowTip.y} ${shadowL.x},${shadowL.y} ${shadowR.x},${shadowR.y}`;
  const scoreY = cy + 18, labelY = scoreY + 28;
  const scoreAccent = clampedValue < 2 ? "#E8552D" : clampedValue < 3.5 ? "#F5B400" : "#4C9A6A";
  const needleColor = theme === "dark" ? "#EDEAE2" : "#24231F";
  const subtitleColor = theme === "dark" ? "#6C7A89" : "#8A8577";
  return (
    <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`} style={{ display: "block", margin: "0 auto" }}>
      <defs>
        <linearGradient id="gauge-grad" x1="0%" y1="0%" x2="100%" y2="0%">
          {stops.map((s) => <stop key={s.offset} offset={s.offset} stopColor={s.color} />)}
        </linearGradient>
        <filter id="score-shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="2" stdDeviation="2" floodOpacity="0.12" />
        </filter>
      </defs>
      <path d={describeArc(START_ANGLE, END_ANGLE, r)} stroke={theme === "dark" ? "#2A2F38" : "#DCD7C9"} strokeWidth={trackWidth} fill="none" strokeLinecap="round" />
      {clampedValue > 0 && (
        <path d={describeArc(START_ANGLE, arcAngle, r)} stroke="url(#gauge-grad)" strokeWidth={trackWidth} fill="none" strokeLinecap="round" />
      )}
      {[1,2,3,4,5].map((v) => {
        const a = Math.PI - ((v - 1) / 4) * Math.PI;
        const x1t = cx + (r - trackWidth / 2 - 2) * Math.cos(Math.PI - a);
        const y1t = cy - (r - trackWidth / 2 - 2) * Math.sin(a);
        const x2t = cx + (r + trackWidth / 2 + 2) * Math.cos(Math.PI - a);
        const y2t = cy - (r + trackWidth / 2 + 2) * Math.sin(a);
        const labelR = r - trackWidth / 2 - 14;
        const lx = cx + labelR * Math.cos(Math.PI - a);
        const ly = cy - labelR * Math.sin(a);
        return (
          <g key={v}>
            <line x1={x1t} y1={y1t} x2={x2t} y2={y2t} stroke={theme === "dark" ? "rgba(0,0,0,0.45)" : "rgba(255,255,255,0.6)"} strokeWidth="2" />
            {(v === 1 || v === 3 || v === 5) && (
              <text x={lx} y={ly + 4} textAnchor="middle" fontFamily="'IBM Plex Mono',monospace" fontSize="9" fill={subtitleColor} fontWeight="700">{v}</text>
            )}
          </g>
        );
      })}
      <polygon points={needleShadowPoints} fill="rgba(0,0,0,0.15)" />
      <polygon points={needlePoints} fill={needleColor} stroke={needleColor} strokeWidth="0.5" strokeLinejoin="round" />
      <circle cx={cx} cy={cy} r="11" fill={theme === "dark" ? "#1E2229" : "#FFFFFF"} stroke={theme === "dark" ? "#3A4050" : "#D0CBBD"} strokeWidth="2" />
      <circle cx={cx} cy={cy} r="5" fill={scoreAccent} />
      <rect x={cx - 48} y={scoreY - 24} width={96} height={62} rx={12} fill={theme === "dark" ? "#1E2229" : "#FFFFFF"} stroke={theme === "dark" ? "#333A42" : "#DCD7C9"} strokeWidth="1.5" filter="url(#score-shadow)" />
      <text x={cx} y={scoreY + 2} textAnchor="middle" fontFamily="'IBM Plex Mono',monospace" fontSize="30" fontWeight="700" fill={scoreAccent}>{fmt1(value)}</text>
      <text x={cx} y={labelY} textAnchor="middle" fontFamily="'Inter',sans-serif" fontSize="8" letterSpacing="1.8" fill={subtitleColor} fontWeight="600">{outOf5Label}</text>
    </svg>
  );
}

function HazardBar({ height = 8 }) {
  return (
    <div style={{ height, width: "100%", backgroundImage: "repeating-linear-gradient(135deg, #F5B400 0, #F5B400 14px, #15181C 14px, #15181C 28px)" }} />
  );
}

function StatCard({ label, value, sub, accent }) {
  const valueStr = String(value);
  const valueFontSize = valueStr.length > 12 ? 18 : valueStr.length > 8 ? 24 : 32;
  const style = { ...(accent ? { color: accent } : null), fontSize: valueFontSize };
  return (
    <div className="stat-card">
      <div className="stat-label">{label}</div>
      <div className="stat-value" style={style}>{value}</div>
      {sub && <div className="stat-sub">{sub}</div>}
    </div>
  );
}

function questionText(q) {
  if (q.text) return q.text;
  return DEFAULT_QUESTIONS_TEXT[q.id] || q.id;
}

function LikertRow({ question, value, onChange }) {
  const scale = ["Strongly disagree", "Disagree", "Neutral", "Agree", "Strongly agree"];
  return (
    <div className="likert-row">
      <p className="likert-text">{questionText(question)}</p>
      <div className="likert-scale">
        {[1, 2, 3, 4, 5].map((v) => (
          <button type="button" key={v}
            className={"likert-btn" + (value === v ? " selected" : "")}
            onClick={() => onChange(question.id, v)}
            aria-pressed={value === v}
            title={scale[v - 1]}
          >
            {v}
          </button>
        ))}
      </div>
      <div className="likert-caps">
        <span>Strongly disagree</span>
        <span>Strongly agree</span>
      </div>
    </div>
  );
}

// ── Multi-step survey: Step 1 = Basic Info, Step 2 = Rate departments ──────
function SurveyForm({ onSubmit, logoUrl, plants, departments, shifts, questions, categories, ratingInstructions }) {
  const [step, setStep] = useState(1); // 1 = basic info, 2 = rate departments

  // Step 1 fields
  const [plant, setPlant] = useState(plants && plants.length === 1 ? plants[0] : "");
  const [myDept, setMyDept] = useState("");
  const [shift, setShift] = useState("");
  const [tenure, setTenure] = useState("");
  const [anonymous, setAnonymous] = useState(true);
  const [employeeName, setEmployeeName] = useState("");
  const [employeeCode, setEmployeeCode] = useState("");

  // Step 2 fields: { deptName: { questionId: rating } }
  const [deptAnswers, setDeptAnswers] = useState({});
  const [deptComments, setDeptComments] = useState({});

  const [error, setError] = useState("");
  const [done, setDone] = useState(false);
  const [saving, setSaving] = useState(false);

  // Departments to rate = all except own
  const ratableDepts = useMemo(
    () => departments.filter((d) => d !== myDept),
    [departments, myDept]
  );

  const visibleQuestions = useMemo(
    () => questions.filter((q) => categories.some((c) => c.id === q.category)),
    [questions, categories]
  );

  const setDeptAnswer = useCallback((dept, qId, v) => {
    setDeptAnswers((prev) => ({
      ...prev,
      [dept]: { ...(prev[dept] || {}), [qId]: v },
    }));
  }, []);

  const handleStep1Next = () => {
    if (!plant || !myDept || !shift || !tenure) {
      setError("Please select a plant, your department, shift, and tenure before continuing.");
      return;
    }
    setError("");
    setStep(2);
    window.scrollTo(0, 0);
  };

  const handleSubmit = async () => {
    // At least one department must be rated
    const ratedDepts = ratableDepts.filter((d) => {
      const ans = deptAnswers[d] || {};
      return Object.keys(ans).length === visibleQuestions.length;
    });
    if (ratedDepts.length === 0) {
      setError(`Please fully rate at least one department (all ${visibleQuestions.length} questions).`);
      return;
    }
    setError("");
    setSaving(true);

    // Build one response record per rated department
    const ts = new Date().toISOString();
    const baseId = `r-${Date.now()}-${Math.floor(Math.random() * 10000)}`;

    try {
      await onSubmit({
        id: baseId,
        ts,
        plant,
        submitterDept: myDept,
        shift,
        tenure,
        anonymous,
        employeeCode: employeeCode.trim(),
        employeeName: anonymous ? "" : employeeName.trim(),
        // store ratings per department
        deptRatings: Object.fromEntries(
          ratedDepts.map((d) => [
            d,
            {
              answers: deptAnswers[d] || {},
              comment: (deptComments[d] || "").trim(),
            },
          ])
        ),
      });
    } catch (e) {
      setError((e && (e.message || e.code)) || String(e));
      setSaving(false);
      return;
    }
    setSaving(false);
    setDone(true);
    // reset
    setPlant(plants && plants.length === 1 ? plants[0] : "");
    setMyDept(""); setShift(""); setTenure("");
    setEmployeeCode(""); setEmployeeName("");
    setDeptAnswers({}); setDeptComments({});
    setStep(1);
  };

  if (done) {
    return (
      <div className="paper-card">
        <div className="paper-inner" style={{ textAlign: "center", padding: "3rem 1.5rem" }}>
          <div style={{ fontSize: 40, marginBottom: 8 }}>✓</div>
          <h2 className="form-title" style={{ marginBottom: 8 }}>Survey Submitted</h2>
          <p style={{ color: "#5B5A52", marginBottom: 24 }}>Thanks for your feedback. Your ratings are now live on the dashboard.</p>
          <button className="submit-btn" onClick={() => setDone(false)}>Submit another response</button>
        </div>
      </div>
    );
  }

  return (
    <div className="paper-card">
      {/* Step indicator */}
      <div className="step-indicator">
        <div className={"step-dot" + (step === 1 ? " active" : step > 1 ? " done" : "")}>
          {step > 1 ? "✓" : "1"}
        </div>
        <div className="step-line" />
        <div className={"step-dot" + (step === 2 ? " active" : "")}>2</div>
        <div style={{ display: "flex", justifyContent: "space-between", width: "100%", position: "absolute", top: 42, left: 0, padding: "0 1.75rem", boxSizing: "border-box", pointerEvents: "none" }}>
          <span className="step-label">Your Info</span>
          <span className="step-label">Rate Departments</span>
        </div>
      </div>

      <div className="paper-inner">
        {logoUrl && <img src={logoUrl} alt="Company logo" className="form-logo" />}

        {step === 1 && (
          <>
            <h2 className="form-title">Inter-Department Satisfaction Survey</h2>
            <p className="form-sub">Step 1 of 2 — Tell us about yourself. Your department will be excluded from your ratings.</p>

            <div className="field-row">
              <div className="field">
                <label>Employee Code (optional)</label>
                <input className="name-input" placeholder="e.g. EMP1043" value={employeeCode} onChange={(e) => setEmployeeCode(e.target.value)} />
              </div>
              <div className="field">
                <label>Employee Name (optional)</label>
                <input className="name-input" placeholder="Your name" value={employeeName} onChange={(e) => setEmployeeName(e.target.value)} />
              </div>
            </div>

            <div className="field-row">
              {plants && plants.length > 1 && (
                <div className="field">
                  <label>Plant</label>
                  <select value={plant} onChange={(e) => setPlant(e.target.value)}>
                    <option value="">Select plant</option>
                    {plants.map((p) => <option key={p} value={p}>{p}</option>)}
                  </select>
                </div>
              )}
              <div className="field">
                <label>Your Department</label>
                <select value={myDept} onChange={(e) => { setMyDept(e.target.value); setDeptAnswers({}); setDeptComments({}); }}>
                  <option value="">Select your department</option>
                  {departments.map((d) => <option key={d} value={d}>{d}</option>)}
                </select>
              </div>
              <div className="field">
                <label>Shift</label>
                <select value={shift} onChange={(e) => setShift(e.target.value)}>
                  <option value="">Select shift</option>
                  {shifts.map((s) => <option key={s} value={s}>{s}</option>)}
                </select>
              </div>
              <div className="field">
                <label>Tenure</label>
                <select value={tenure} onChange={(e) => setTenure(e.target.value)}>
                  <option value="">Select tenure</option>
                  {TENURE_OPTIONS.map((tn) => <option key={tn} value={tn}>{tn}</option>)}
                </select>
              </div>
            </div>

            <div className="anon-row">
              <label className="check-label">
                <input type="checkbox" checked={anonymous} onChange={(e) => setAnonymous(e.target.checked)} />
                Submit anonymously
              </label>
            </div>

            {error && <div className="error-msg">{error}</div>}

            <button className="submit-btn" onClick={handleStep1Next}>Continue to Rate Departments →</button>
          </>
        )}

        {step === 2 && (
          <>
            <h2 className="form-title">Rate Other Departments</h2>
            <p className="form-sub">Step 2 of 2 — Rate each department you interact with. Your department (<strong>{myDept}</strong>) is not shown.</p>

            {ratingInstructions && (
              <div className="instructions-box">
                <div className="instructions-label">📋 Rating Instructions</div>
                <div className="instructions-text">{ratingInstructions}</div>
              </div>
            )}

            {ratableDepts.length === 0 ? (
              <div className="error-msg">No other departments to rate. Please add more departments in Settings.</div>
            ) : (
              ratableDepts.map((dept) => {
                const deptAns = deptAnswers[dept] || {};
                const answered = Object.keys(deptAns).length;
                const total = visibleQuestions.length;
                const pct = total > 0 ? Math.round((answered / total) * 100) : 0;
                return (
                  <div key={dept} className="dept-rating-block">
                    <div className="dept-rating-header">
                      <h3 className="dept-name">{dept}</h3>
                      <span className="dept-progress-badge" style={{ background: pct === 100 ? "#4C9A6A" : "#F5B400", color: pct === 100 ? "#fff" : "#24231F" }}>
                        {pct === 100 ? "✓ Complete" : `${answered} / ${total}`}
                      </span>
                    </div>
                    <HazardBar height={3} />
                    {categories.map((cat) => {
                      const catQs = visibleQuestions.filter((q) => q.category === cat.id);
                      if (!catQs.length) return null;
                      return (
                        <div key={cat.id} className="cat-block">
                          <h4 className="cat-heading" style={{ borderColor: cat.color }}>{cat.label}</h4>
                          {catQs.map((q) => (
                            <LikertRow
                              key={q.id}
                              question={q}
                              value={deptAns[q.id]}
                              onChange={(qId, v) => setDeptAnswer(dept, qId, v)}
                            />
                          ))}
                        </div>
                      );
                    })}
                    <div className="field" style={{ marginTop: 8 }}>
                      <label>Comments about {dept} (optional)</label>
                      <textarea rows={2} placeholder="Share a specific example or suggestion..."
                        value={deptComments[dept] || ""}
                        onChange={(e) => setDeptComments((prev) => ({ ...prev, [dept]: e.target.value }))}
                      />
                    </div>
                  </div>
                );
              })
            )}

            {error && <div className="error-msg">{error}</div>}

            <div style={{ display: "flex", gap: 12, marginTop: 8, flexWrap: "wrap" }}>
              <button className="submit-btn" style={{ background: "#6C7A89" }} onClick={() => { setStep(1); setError(""); }}>
                ← Back
              </button>
              <button className="submit-btn" onClick={handleSubmit} disabled={saving}>
                {saving ? "Submitting..." : "Submit Survey"}
              </button>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

// ── Dashboard ──────────────────────────────────────────────────────────────
// Each stored response has deptRatings: { deptName: { answers, comment } }
// We flatten into "flatRows" = one row per (response × rated department) for charts
function Dashboard({ responses, theme, plants, departments, shifts, questions, categories, companyName, logoUrl, onDeleteResponses }) {
  const [plantFilter, setPlantFilter] = useState(ALL_PLANTS_ID);
  const [ratedDeptFilter, setRatedDeptFilter] = useState("All");
  const [submitterDeptFilter, setSubmitterDeptFilter] = useState("All");
  const [selectedIds, setSelectedIds] = useState({});
  const [bulkBusy, setBulkBusy] = useState(false);
  const [bulkError, setBulkError] = useState("");
  const [exportBusy, setExportBusy] = useState(false);
  const ct = CHART_THEME[theme] || CHART_THEME.dark;

  // Flatten responses into per-department-rated rows
  const flatRows = useMemo(() => {
    const rows = [];
    responses.forEach((r) => {
      const ratings = r.deptRatings || {};
      Object.entries(ratings).forEach(([ratedDept, info]) => {
        rows.push({
          ...r,
          ratedDept,
          answers: info.answers || {},
          comment: info.comment || "",
          _flatId: `${r.id}__${ratedDept}`,
        });
      });
    });
    return rows;
  }, [responses]);

  const filtered = useMemo(() => {
    return flatRows.filter((r) =>
      (plantFilter === ALL_PLANTS_ID || r.plant === plantFilter) &&
      (ratedDeptFilter === "All" || r.ratedDept === ratedDeptFilter) &&
      (submitterDeptFilter === "All" || r.submitterDept === submitterDeptFilter)
    );
  }, [flatRows, plantFilter, ratedDeptFilter, submitterDeptFilter]);

  const allRows = responses; // for table (show full responses)

  const overall = useMemo(() => {
    if (!filtered.length) return 0;
    const scores = filtered.map(overallAverage).filter((v) => v > 0);
    return scores.length ? scores.reduce((s, v) => s + v, 0) / scores.length : 0;
  }, [filtered]);

  const visibleQuestions = useMemo(
    () => questions.filter((q) => categories.some((c) => c.id === q.category)),
    [questions, categories]
  );

  const categoryData = useMemo(() => {
    return categories.map((cat) => {
      const catQs = visibleQuestions.filter((q) => q.category === cat.id);
      const scores = [];
      filtered.forEach((r) => {
        catQs.forEach((q) => {
          const v = r.answers[q.id];
          if (typeof v === "number") scores.push(v);
        });
      });
      const avg = scores.length ? scores.reduce((s, v) => s + v, 0) / scores.length : 0;
      return { name: cat.label, score: parseFloat(avg.toFixed(2)), color: cat.color };
    });
  }, [categories, visibleQuestions, filtered]);

  const topCat = categoryData.filter((c) => c.score > 0).sort((a, b) => b.score - a.score)[0];
  const lowCat = categoryData.filter((c) => c.score > 0).sort((a, b) => a.score - b.score)[0];
  const flagged = categoryData.filter((c) => c.score > 0 && c.score < 3).length;

  // Average score per rated department
  const deptData = useMemo(() => {
    const map = {};
    filtered.forEach((r) => {
      const score = overallAverage(r);
      if (!score) return;
      if (!map[r.ratedDept]) map[r.ratedDept] = { total: 0, count: 0 };
      map[r.ratedDept].total += score;
      map[r.ratedDept].count += 1;
    });
    return Object.entries(map).map(([name, d]) => ({
      name,
      score: parseFloat((d.total / d.count).toFixed(2)),
      count: d.count,
    }));
  }, [filtered]);

  // Trend (weekly)
  const trendData = useMemo(() => {
    const weekMap = {};
    filtered.forEach((r) => {
      const d = new Date(r.ts);
      const y = d.getFullYear();
      const wk = Math.ceil(((d - new Date(y, 0, 1)) / 86400000 + 1) / 7);
      const key = `${y}-W${String(wk).padStart(2, "0")}`;
      if (!weekMap[key]) weekMap[key] = { total: 0, count: 0 };
      weekMap[key].total += overallAverage(r);
      weekMap[key].count += 1;
    });
    return Object.entries(weekMap)
      .sort(([a], [b]) => a.localeCompare(b))
      .map(([week, d]) => ({ week, score: parseFloat((d.total / d.count).toFixed(2)) }));
  }, [filtered]);

  // Tenure donut
  const tenureData = useMemo(() => {
    const map = {};
    responses.forEach((r) => {
      if ((plantFilter === ALL_PLANTS_ID || r.plant === plantFilter) &&
          (submitterDeptFilter === "All" || r.submitterDept === submitterDeptFilter)) {
        if (r.tenure) map[r.tenure] = (map[r.tenure] || 0) + 1;
      }
    });
    const total = Object.values(map).reduce((s, v) => s + v, 0);
    return TENURE_OPTIONS
      .filter((k) => map[k])
      .map((k) => ({
        key: k, name: k,
        count: map[k],
        pct: total ? Math.round((map[k] / total) * 100) : 0,
        color: TENURE_COLORS[k],
      }));
  }, [responses, plantFilter, submitterDeptFilter]);
  const tenureTotal = tenureData.reduce((s, d) => s + d.count, 0);

  // Comments
  const comments = useMemo(
    () => filtered.filter((r) => r.comment).slice(-10).reverse(),
    [filtered]
  );

  const selectedCount = Object.values(selectedIds).filter(Boolean).length;
  const allSelected = allRows.length > 0 && allRows.every((r) => selectedIds[r.id]);
  const toggleSelect = (id) => setSelectedIds((p) => ({ ...p, [id]: !p[id] }));
  const toggleSelectAll = () => {
    if (allSelected) setSelectedIds({});
    else { const m = {}; allRows.forEach((r) => { m[r.id] = true; }); setSelectedIds(m); }
  };

  const handleDeleteSelected = async () => {
    const ids = Object.keys(selectedIds).filter((id) => selectedIds[id]);
    if (!ids.length) return;
    if (!window.confirm(`Delete ${ids.length} selected response${ids.length === 1 ? "" : "s"}? This can't be undone.`)) return;
    setBulkBusy(true); setBulkError("");
    try { await onDeleteResponses(ids); setSelectedIds({}); }
    catch (e) { setBulkError((e && (e.message || e.code)) || String(e)); }
    setBulkBusy(false);
  };

  const handleExportPdf = async () => {
    setExportBusy(true);
    try {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: "mm", format: "a4" });
      const W = doc.internal.pageSize.getWidth();
      const pageH = doc.internal.pageSize.getHeight();
      const margin = 14;
      const contentW = W - margin * 2;
      let y = margin;

      const sectionHead = (title) => {
        if (y > pageH - 30) { doc.addPage(); y = margin; }
        doc.setFontSize(11); doc.setFont("helvetica", "bold");
        doc.setTextColor(30, 34, 41);
        doc.text(title, margin, y); y += 7;
        doc.setDrawColor(62, 143, 176); doc.setLineWidth(0.5);
        doc.line(margin, y, W - margin, y); y += 5;
      };

      // Header
      doc.setFillColor(30, 34, 41); doc.rect(0, 0, W, 22, "F");
      doc.setFontSize(14); doc.setFont("helvetica", "bold"); doc.setTextColor(245, 180, 0);
      doc.text("Inter-Department Satisfaction Report", margin, 14);
      doc.setFontSize(8); doc.setTextColor(154, 161, 168);
      doc.text(`Generated: ${new Date().toLocaleDateString()} | ${companyName}`, W - margin, 14, { align: "right" });
      y = 30;

      // KPIs
      sectionHead("Overview");
      doc.autoTable({
        startY: y,
        head: [["Total Responses", "Ratings Submitted", "Overall Avg Score", "Strongest Dept", "Needs Attention"]],
        body: [[
          allRows.length,
          filtered.length,
          fmt1(overall),
          topCat ? `${topCat.name} (${fmt1(topCat.score)})` : "—",
          lowCat ? `${lowCat.name} (${fmt1(lowCat.score)})` : "—",
        ]],
        styles: { fontSize: 8, cellPadding: 3 },
        headStyles: { fillColor: [62, 143, 176], textColor: 255, fontStyle: "bold", fontSize: 8 },
        margin: { left: margin, right: margin },
      });
      y = doc.lastAutoTable.finalY + 8;

      // Category scores
      if (categoryData.length) {
        sectionHead("Category Scores");
        doc.autoTable({
          startY: y,
          head: [["Category", "Avg Score"]],
          body: categoryData.map((c) => [c.name, fmt1(c.score)]),
          styles: { fontSize: 8, cellPadding: 3 },
          headStyles: { fillColor: [62, 143, 176], textColor: 255, fontStyle: "bold", fontSize: 8 },
          alternateRowStyles: { fillColor: [245, 243, 238] },
          margin: { left: margin, right: margin },
        });
        y = doc.lastAutoTable.finalY + 8;
      }

      // Dept scores
      if (deptData.length) {
        sectionHead("Average Score by Rated Department");
        doc.autoTable({
          startY: y,
          head: [["Department (Rated)", "Avg Score", "n"]],
          body: [...deptData].sort((a, b) => b.score - a.score).map((d) => [d.name, fmt1(d.score), d.count]),
          styles: { fontSize: 8, cellPadding: 3 },
          headStyles: { fillColor: [62, 143, 176], textColor: 255, fontStyle: "bold", fontSize: 8 },
          alternateRowStyles: { fillColor: [245, 243, 238] },
          margin: { left: margin, right: margin },
        });
        y = doc.lastAutoTable.finalY + 8;
      }

      // Responses table
      doc.addPage(); y = margin;
      sectionHead("All Responses");
      doc.autoTable({
        startY: y,
        head: [["Date", "Code", "Name", "Submitter Dept", "Rated Dept", "Shift", "Tenure", "Score"]],
        body: flatRows.map((r) => [
          new Date(r.ts).toLocaleDateString(),
          r.employeeCode || "—",
          r.employeeName || "—",
          r.submitterDept,
          r.ratedDept,
          r.shift,
          r.tenure || "—",
          fmt1(overallAverage(r)),
        ]),
        styles: { fontSize: 7, cellPadding: 2 },
        headStyles: { fillColor: [62, 143, 176], textColor: 255, fontStyle: "bold", fontSize: 7 },
        alternateRowStyles: { fillColor: [245, 243, 238] },
        margin: { left: margin, right: margin },
      });

      const totalPages = doc.internal.getNumberOfPages();
      for (let p = 1; p <= totalPages; p++) {
        doc.setPage(p);
        doc.setFontSize(7); doc.setTextColor(154, 161, 168);
        doc.text(companyName, margin, pageH - 6);
        doc.text(`${p} / ${totalPages}`, W - margin, pageH - 6, { align: "right" });
      }
      doc.save(`inter-dept-satisfaction-${new Date().toISOString().slice(0, 10)}.pdf`);
    } catch (e) {
      console.error("PDF export failed:", e);
      setBulkError((e && e.message) || String(e));
    }
    setExportBusy(false);
  };

  const ratedDeptOptions = useMemo(() => Array.from(new Set([...departments, ...flatRows.map((r) => r.ratedDept)])), [departments, flatRows]);
  const submitterDeptOptions = useMemo(() => Array.from(new Set([...departments, ...responses.map((r) => r.submitterDept)])), [departments, responses]);

  return (
    <div>
      {plants && plants.length > 1 ? (
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 12 }}>
          <div className="plant-pill-bar" style={{ padding: 0, marginBottom: 0 }}>
            <button className={"plant-pill" + (plantFilter === ALL_PLANTS_ID ? " active" : "")} onClick={() => setPlantFilter(ALL_PLANTS_ID)}>All Plants</button>
            {plants.map((p) => (
              <button key={p} className={"plant-pill" + (plantFilter === p ? " active" : "")} onClick={() => setPlantFilter(p)}>{p}</button>
            ))}
          </div>
          <button className="submit-btn small-btn" style={{ background: "#3E8FB0", marginBottom: 16 }} onClick={handleExportPdf} disabled={exportBusy || !flatRows.length}>
            {exportBusy ? "…" : "Export PDF"}
          </button>
        </div>
      ) : (
        <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 16 }}>
          <button className="submit-btn small-btn" style={{ background: "#3E8FB0" }} onClick={handleExportPdf} disabled={exportBusy || !flatRows.length}>
            {exportBusy ? "…" : "Export PDF"}
          </button>
        </div>
      )}

      <div className="filter-bar">
        <div className="filter-field">
          <label>Rated Department</label>
          <select value={ratedDeptFilter} onChange={(e) => setRatedDeptFilter(e.target.value)}>
            <option value="All">All rated departments</option>
            {ratedDeptOptions.map((d) => <option key={d} value={d}>{d}</option>)}
          </select>
        </div>
        <div className="filter-field">
          <label>Submitter's Department</label>
          <select value={submitterDeptFilter} onChange={(e) => setSubmitterDeptFilter(e.target.value)}>
            <option value="All">All submitters</option>
            {submitterDeptOptions.map((d) => <option key={d} value={d}>{d}</option>)}
          </select>
        </div>
        <div className="filter-count">{filtered.length} rating{filtered.length === 1 ? "" : "s"}</div>
      </div>

      <div className="panel-row top-row">
        <div className="gauge-panel">
          <div className="panel-title">Overall Satisfaction</div>
          <Gauge value={overall} theme={theme} outOf5Label="OUT OF 5.0" />
        </div>
        <div className="kpi-grid">
          <StatCard label="Total Responses" value={allRows.length} />
          <StatCard label="Strongest Area" value={topCat ? topCat.name : "—"} sub={topCat ? `${fmt1(topCat.score)} / 5.0` : ""} accent="#4C9A6A" />
          <StatCard label="Needs Attention" value={lowCat ? lowCat.name : "—"} sub={lowCat ? `${fmt1(lowCat.score)} / 5.0` : ""} accent="#E8552D" />
          <StatCard label="Categories below 3.0" value={flagged} sub={flagged > 0 ? `out of ${categories.length} categories` : "none flagged"} accent={flagged > 0 ? "#F5B400" : undefined} />
        </div>
      </div>

      <div className="panel">
        <div className="panel-title">Category Scores</div>
        <ResponsiveContainer width="100%" height={280}>
          <BarChart data={categoryData} layout="vertical" margin={{ left: 10, right: 20, top: 5, bottom: 5 }}>
            <CartesianGrid strokeDasharray="3 3" stroke={ct.grid} horizontal={false} />
            <XAxis type="number" domain={[0, 5]} stroke={ct.axis} fontSize={11} />
            <YAxis type="category" dataKey="name" stroke={ct.axis} fontSize={11} width={160} />
            <Tooltip contentStyle={{ background: ct.tooltipBg, border: `1px solid ${ct.tooltipBorder}`, borderRadius: 4 }} labelStyle={{ color: ct.tooltipLabel }} formatter={(v) => [v, "Avg score"]} />
            <Bar dataKey="score" radius={[0, 3, 3, 0]}>
              {categoryData.map((entry, idx) => <Cell key={idx} fill={entry.color} />)}
            </Bar>
          </BarChart>
        </ResponsiveContainer>
      </div>

      <div className="panel">
        <div className="panel-title">Satisfaction Trend (Weekly Average)</div>
        {trendData.length > 1 ? (
          <ResponsiveContainer width="100%" height={240}>
            <LineChart data={trendData} margin={{ left: 0, right: 20, top: 10, bottom: 5 }}>
              <CartesianGrid strokeDasharray="3 3" stroke={ct.grid} />
              <XAxis dataKey="week" stroke={ct.axis} fontSize={11} />
              <YAxis domain={[1, 5]} stroke={ct.axis} fontSize={11} />
              <Tooltip contentStyle={{ background: ct.tooltipBg, border: `1px solid ${ct.tooltipBorder}`, borderRadius: 4 }} labelStyle={{ color: ct.tooltipLabel }} />
              <Line type="monotone" dataKey="score" stroke="#F5B400" strokeWidth={2} dot={{ r: 3 }} />
            </LineChart>
          </ResponsiveContainer>
        ) : (
          <div className="empty-note">Not enough spread of submission dates yet to chart a trend.</div>
        )}
      </div>

      <div className="panel">
        <div className="panel-title">Average Score by Rated Department</div>
        {deptData.length ? (
          <ResponsiveContainer width="100%" height={Math.max(180, deptData.length * 40)}>
            <BarChart data={deptData} layout="vertical" margin={{ left: 10, right: 30, top: 5, bottom: 5 }}>
              <CartesianGrid strokeDasharray="3 3" stroke={ct.grid} horizontal={false} />
              <XAxis type="number" domain={[0, 5]} stroke={ct.axis} fontSize={11} />
              <YAxis type="category" dataKey="name" stroke={ct.axis} fontSize={11} width={160} />
              <Tooltip contentStyle={{ background: ct.tooltipBg, border: `1px solid ${ct.tooltipBorder}`, borderRadius: 4 }} labelStyle={{ color: ct.tooltipLabel }} formatter={(v, n, p) => [`${v} (n=${p.payload.count})`, "Avg score"]} />
              <Bar dataKey="score" radius={[0, 3, 3, 0]} fill="#3E8FB0" />
            </BarChart>
          </ResponsiveContainer>
        ) : (
          <div className="empty-note">No ratings match the current filters.</div>
        )}
      </div>

      {/* Tenure donut */}
      <div className="panel">
        <div className="panel-title">Responses by Experience (Tenure)</div>
        {tenureData.length ? (
          <div className="tenure-donut-wrap">
            <div className="tenure-donut-chart">
              <ResponsiveContainer width="100%" height={260}>
                <PieChart>
                  <Pie data={tenureData} dataKey="count" nameKey="name" cx="50%" cy="50%" innerRadius={78} outerRadius={112} paddingAngle={3} stroke="none">
                    {tenureData.map((entry, idx) => <Cell key={idx} fill={entry.color} />)}
                  </Pie>
                  <Tooltip contentStyle={{ background: ct.tooltipBg, border: `1px solid ${ct.tooltipBorder}`, borderRadius: 4 }} labelStyle={{ color: ct.tooltipLabel }} formatter={(v, n, p) => [`${v} (${p.payload.pct}%)`, n]} />
                </PieChart>
              </ResponsiveContainer>
              <div className="tenure-donut-center">
                <div className="tenure-donut-total">{tenureTotal}</div>
                <div className="tenure-donut-total-label">{tenureTotal} response{tenureTotal === 1 ? "" : "s"}</div>
              </div>
            </div>
            <div className="tenure-stats-list">
              {tenureData.map((d) => (
                <div className="tenure-stat-row" key={d.key}>
                  <div className="tenure-stat-top">
                    <span className="tenure-stat-dot" style={{ background: d.color }} />
                    <span className="tenure-stat-name">{d.name}</span>
                    <span className="tenure-stat-pct">{d.pct}%</span>
                    <span className="tenure-stat-count">{d.count}</span>
                  </div>
                  <div className="tenure-stat-bar-track">
                    <div className="tenure-stat-bar-fill" style={{ width: `${d.pct}%`, background: d.color }} />
                  </div>
                </div>
              ))}
            </div>
          </div>
        ) : (
          <div className="empty-note">No responses yet.</div>
        )}
      </div>

      <div className="panel">
        <div className="panel-title">Recent Comments</div>
        {comments.length ? (
          <div className="comment-feed">
            {comments.map((r) => (
              <div className="comment-item" key={r._flatId}>
                <div className="comment-meta">
                  <span style={{ color: "#3E8FB0", fontWeight: 600 }}>{r.submitterDept}</span>
                  <span>→</span>
                  <span style={{ color: "#E8552D", fontWeight: 600 }}>{r.ratedDept}</span>
                  <span>·</span>
                  <span>{new Date(r.ts).toLocaleDateString()}</span>
                </div>
                <p className="comment-text">{r.comment}</p>
              </div>
            ))}
          </div>
        ) : (
          <div className="empty-note">No comments for the current filters yet.</div>
        )}
      </div>

      {/* Table */}
      <div className="panel" style={{ marginBottom: 16 }}>
        <div className="panel-title">Department Scores Table</div>
        {deptData.length ? (
          <div className="responses-table-wrap">
            <table className="responses-table">
              <thead><tr><th>Rated Department</th><th>Avg Score</th><th>n</th></tr></thead>
              <tbody>
                {[...deptData].sort((a, b) => b.score - a.score).map((d, i) => (
                  <tr key={i}><td>{d.name}</td><td><strong>{d.score.toFixed(1)}</strong></td><td>{d.count}</td></tr>
                ))}
              </tbody>
            </table>
          </div>
        ) : (
          <div className="empty-note">No ratings match the current filters.</div>
        )}
      </div>

      <div className="panel">
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 12, marginBottom: 14 }}>
          <div className="panel-title" style={{ marginBottom: 0 }}>All Responses</div>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            <button className="submit-btn small-btn" style={{ background: "#3E8FB0" }} onClick={handleExportPdf} disabled={exportBusy || !allRows.length}>
              {exportBusy ? "…" : "Export PDF"}
            </button>
            <button className="submit-btn small-btn" style={{ background: "#E8552D" }} onClick={handleDeleteSelected} disabled={bulkBusy || !selectedCount}>
              {bulkBusy ? "…" : `Delete Selected (${selectedCount})`}
            </button>
          </div>
        </div>
        {bulkError && <div className="error-msg" style={{ marginBottom: 12 }}>{bulkError}</div>}
        {allRows.length ? (
          <div className="responses-table-wrap">
            <table className="responses-table">
              <thead>
                <tr>
                  <th><input type="checkbox" checked={allSelected} onChange={toggleSelectAll} /></th>
                  <th>Date</th>
                  <th>Code</th>
                  <th>Name</th>
                  <th>Submitter Dept</th>
                  <th>Rated Departments</th>
                  <th>Shift</th>
                  <th>Tenure</th>
                  <th>Avg Score</th>
                </tr>
              </thead>
              <tbody>
                {allRows.map((r) => {
                  const ratings = r.deptRatings || {};
                  const avgScores = Object.entries(ratings).map(([dept, info]) => {
                    const vals = Object.values(info.answers || {}).filter((v) => typeof v === "number");
                    const avg = vals.length ? vals.reduce((s, v) => s + v, 0) / vals.length : 0;
                    return `${dept}: ${fmt1(avg)}`;
                  });
                  return (
                    <tr key={r.id}>
                      <td><input type="checkbox" checked={!!selectedIds[r.id]} onChange={() => toggleSelect(r.id)} /></td>
                      <td>{new Date(r.ts).toLocaleDateString()}</td>
                      <td>{r.employeeCode || "—"}</td>
                      <td>{r.employeeName || "—"}</td>
                      <td>{r.submitterDept}</td>
                      <td className="responses-table-comment">{avgScores.join(" | ") || "—"}</td>
                      <td>{r.shift}</td>
                      <td>{r.tenure || "—"}</td>
                      <td>{fmt1(overallAverage({ answers: Object.values(ratings).reduce((acc, info) => ({ ...acc, ...info.answers }), {}) }))}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        ) : (
          <div className="empty-note">No responses yet.</div>
        )}
      </div>
    </div>
  );
}

// ── QR Poster ──────────────────────────────────────────────────────────────
function QRPoster({ surveyUrl, logoUrl, companyName, onGoSettings }) {
  const qrSrc = surveyUrl
    ? `https://api.qrserver.com/v1/create-qr-code/?size=320x320&margin=8&data=${encodeURIComponent(surveyUrl)}`
    : null;
  return (
    <div>
      <div className="panel poster-card">
        {logoUrl && <img src={logoUrl} alt="Company logo" className="poster-logo" />}
        <div className="poster-company">{companyName}</div>
        <h2 className="poster-title">Scan to Share Your Feedback</h2>
        <p className="poster-sub">Inter-Department Satisfaction Survey — anonymous, takes about 5 minutes.</p>
        <div className="qr-box">
          {qrSrc ? (
            <img src={qrSrc} alt="QR code" width={260} height={260} />
          ) : (
            <div className="qr-placeholder">Add a survey link in Settings to generate a QR code.</div>
          )}
        </div>
        <p className="poster-hint">Open your phone camera and point it at the code.</p>
        {surveyUrl && (
          <div style={{ marginTop: 14, padding: "10px 16px", background: "var(--bg-tab,#f5f3ee)", borderRadius: 8, textAlign: "center" }}>
            <div style={{ fontSize: 11, fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.6px", color: "var(--text-secondary,#888)", marginBottom: 6 }}>Survey Link</div>
            <a href={surveyUrl} target="_blank" rel="noopener noreferrer" style={{ fontSize: 13, color: "#3E8FB0", fontWeight: 600, wordBreak: "break-all", textDecoration: "none" }}>{surveyUrl}</a>
          </div>
        )}
      </div>
      <div className="panel no-print" style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 12 }}>
        <span className="empty-note" style={{ padding: 0 }}>Manage the survey link and logo in Settings.</span>
        <div style={{ display: "flex", gap: 8 }}>
          <button className="submit-btn small-btn" onClick={onGoSettings}>Go to Settings</button>
          <button className="submit-btn small-btn" style={{ background: "#3E8FB0" }} onClick={() => window.print()} disabled={!surveyUrl}>Print Poster</button>
        </div>
      </div>
    </div>
  );
}

// ── ListManager ────────────────────────────────────────────────────────────
function ListManager({ title, desc, items, onAdd, onDelete, placeholder }) {
  const [draft, setDraft] = useState("");
  const [error, setError] = useState("");
  const [busyId, setBusyId] = useState("");
  const handleAdd = async () => {
    const name = draft.trim();
    if (!name) return;
    setError("");
    try { await onAdd(name); setDraft(""); }
    catch (e) { setError((e && (e.message || e.code)) || String(e)); }
  };
  const handleDelete = async (item) => {
    setError(""); setBusyId(item.id);
    try { await onDelete(item.id); }
    catch (e) { setError((e && (e.message || e.code)) || String(e)); }
    setBusyId("");
  };
  return (
    <div className="panel">
      <div className="panel-title">{title}</div>
      <p className="empty-note" style={{ padding: "0 0 12px", textAlign: "left" }}>{desc}</p>
      <div className="list-manager-items">
        {items.map((item) => (
          <span className="list-chip" key={item.id}>
            {item.name}
            <button type="button" className="list-chip-remove" onClick={() => handleDelete(item)} disabled={busyId === item.id} aria-label={`Delete: ${item.name}`}>×</button>
          </span>
        ))}
      </div>
      {error && <div className="error-msg" style={{ marginTop: 12 }}>{error}</div>}
      <div className="field-row" style={{ marginTop: 12, marginBottom: 0 }}>
        <input className="name-input" style={{ flex: 1 }} placeholder={placeholder} value={draft} onChange={(e) => setDraft(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") handleAdd(); }} />
        <button className="submit-btn small-btn" onClick={handleAdd}>Add</button>
      </div>
    </div>
  );
}

// ── QuestionsManager ───────────────────────────────────────────────────────
function QuestionsManager({ questions, onAdd, onEdit, onDelete, categories, onAddCategory, onEditCategory, onDeleteCategory }) {
  const [qDrafts, setQDrafts] = useState({});
  const [newCatId, setNewCatId] = useState("");
  const [newQText, setNewQText] = useState("");
  const [catDrafts, setCatDrafts] = useState({});
  const [catColorDrafts, setCatColorDrafts] = useState({});
  const [editingCatId, setEditingCatId] = useState(null);
  const [newCatLabel, setNewCatLabel] = useState("");
  const [newCatColor, setNewCatColor] = useState(CATEGORY_PALETTE[0]);
  const [busy, setBusy] = useState("");
  const [error, setError] = useState("");

  useEffect(() => { if (!newCatId && categories.length) setNewCatId(categories[0].id); }, [categories, newCatId]);

  const qTextFor = (q) => (q.id in qDrafts ? qDrafts[q.id] : questionText(q));

  const handleEditQuestion = async (q) => {
    const val = (qDrafts[q.id] || "").trim();
    if (!val || val === questionText(q)) return;
    setError(""); setBusy(q.id);
    try { await onEdit(q.id, val); }
    catch (e) { setError((e && (e.message || e.code)) || String(e)); }
    setBusy("");
  };

  const handleDeleteQuestion = async (q) => {
    setError(""); setBusy(q.id);
    try { await onDelete(q.id); }
    catch (e) { setError((e && (e.message || e.code)) || String(e)); }
    setBusy("");
  };

  const handleAddQuestion = async () => {
    const text = newQText.trim();
    if (!text || !newCatId) return;
    setError("");
    try { await onAdd(newCatId, text); setNewQText(""); }
    catch (e) { setError((e && (e.message || e.code)) || String(e)); }
  };

  const startEditCat = (cat) => {
    setEditingCatId(cat.id);
    setCatDrafts((p) => ({ ...p, [cat.id]: cat.label }));
    setCatColorDrafts((p) => ({ ...p, [cat.id]: cat.color }));
  };

  const handleEditCategory = async (cat) => {
    const label = (catDrafts[cat.id] || "").trim();
    const color = catColorDrafts[cat.id] || cat.color;
    if (!label) return;
    setError(""); setBusy("cat_" + cat.id);
    try { await onEditCategory(cat.id, label, color); setEditingCatId(null); }
    catch (e) { setError((e && (e.message || e.code)) || String(e)); }
    setBusy("");
  };

  const handleDeleteCategory = async (cat) => {
    if (!window.confirm(`Delete section "${cat.label}" and all its questions? This can't be undone.`)) return;
    setError(""); setBusy("cat_" + cat.id);
    try {
      const qs = questions.filter((q) => q.category === cat.id);
      await Promise.all(qs.map((q) => onDelete(q.id)));
      await onDeleteCategory(cat.id);
      if (editingCatId === cat.id) setEditingCatId(null);
    }
    catch (e) { setError((e && (e.message || e.code)) || String(e)); }
    setBusy("");
  };

  const handleAddCategory = async () => {
    const label = newCatLabel.trim();
    if (!label) return;
    setError("");
    try { await onAddCategory(label, newCatColor); setNewCatLabel(""); setNewCatColor(CATEGORY_PALETTE[0]); }
    catch (e) { setError((e && (e.message || e.code)) || String(e)); }
  };

  return (
    <div className="panel">
      <div className="panel-title">Survey Questions</div>
      <p className="empty-note" style={{ padding: "0 0 12px", textAlign: "left" }}>Edit, remove, or add questions to any category.</p>

      {categories.map((cat) => {
        const catQs = questions.filter((q) => q.category === cat.id);
        const isBusyCat = busy === "cat_" + cat.id;
        const isEditing = editingCatId === cat.id;
        return (
          <div key={cat.id} className="cat-manager-block" style={{ borderLeft: `4px solid ${cat.color}` }}>
            {isEditing ? (
              <div className="cat-edit-row">
                <input type="color" className="cat-color-picker" value={catColorDrafts[cat.id] || cat.color} onChange={(e) => setCatColorDrafts((p) => ({ ...p, [cat.id]: e.target.value }))} />
                <input className="name-input cat-label-input" value={catDrafts[cat.id] ?? cat.label} onChange={(e) => setCatDrafts((p) => ({ ...p, [cat.id]: e.target.value }))} onKeyDown={(e) => { if (e.key === "Enter") handleEditCategory(cat); }} autoFocus />
                <button className="submit-btn small-btn" style={{ background: "#3E8FB0" }} onClick={() => handleEditCategory(cat)} disabled={isBusyCat}>Save</button>
                <button className="submit-btn small-btn" style={{ background: "#6C7A89" }} onClick={() => setEditingCatId(null)} disabled={isBusyCat}>✕</button>
              </div>
            ) : (
              <div className="cat-edit-row">
                <span className="cat-color-dot" style={{ background: cat.color }} />
                <h3 className="cat-heading-inline">{cat.label}</h3>
                <button className="cat-action-btn" onClick={() => startEditCat(cat)} title="Edit this section">✏️</button>
                <button className="cat-action-btn cat-action-btn-delete" onClick={() => handleDeleteCategory(cat)} disabled={isBusyCat} title="Delete this section">🗑</button>
              </div>
            )}
            {catQs.map((q) => (
              <div key={q.id} className="question-edit-row">
                <textarea rows={2} value={qTextFor(q)} onChange={(e) => setQDrafts((p) => ({ ...p, [q.id]: e.target.value }))} />
                <div className="question-edit-actions">
                  <button className="submit-btn small-btn" style={{ background: "#3E8FB0" }} onClick={() => handleEditQuestion(q)} disabled={busy === q.id}>Save</button>
                  <button className="submit-btn small-btn" style={{ background: "#E8552D" }} onClick={() => handleDeleteQuestion(q)} disabled={busy === q.id}>Delete</button>
                </div>
              </div>
            ))}
            {catQs.length === 0 && <p className="empty-note" style={{ padding: "8px 0", margin: 0 }}>No questions in this section yet — add one below.</p>}
          </div>
        );
      })}

      {error && <div className="error-msg" style={{ marginTop: 12 }}>{error}</div>}

      <div className="section-divider">Add a question</div>
      <div className="field-row" style={{ marginTop: 8, marginBottom: 0, alignItems: "flex-start" }}>
        <div className="field" style={{ maxWidth: 220, marginBottom: 0 }}>
          <select value={newCatId} onChange={(e) => setNewCatId(e.target.value)}>
            {categories.map((cat) => <option key={cat.id} value={cat.id}>{cat.label}</option>)}
          </select>
        </div>
        <input className="name-input" style={{ flex: 1 }} placeholder="Add a question..." value={newQText} onChange={(e) => setNewQText(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") handleAddQuestion(); }} />
        <button className="submit-btn small-btn" onClick={handleAddQuestion}>Add</button>
      </div>

      <div className="section-divider">Add a new section</div>
      <div className="field-row" style={{ marginTop: 8, marginBottom: 0, alignItems: "center" }}>
        <input type="color" className="cat-color-picker" value={newCatColor} onChange={(e) => setNewCatColor(e.target.value)} title="Pick section colour" />
        <input className="name-input" style={{ flex: 1 }} placeholder="Section heading (e.g. Professionalism)" value={newCatLabel} onChange={(e) => setNewCatLabel(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") handleAddCategory(); }} />
        <button className="submit-btn small-btn" style={{ background: "#4C9A6A" }} onClick={handleAddCategory}>Add</button>
      </div>
    </div>
  );
}

// ── Settings Panel ─────────────────────────────────────────────────────────
function SettingsPanel({
  surveyUrl, onSaveUrl, logoUrl, onSaveLogo, onRemoveLogo,
  companyName, onSaveCompanyName,
  ratingInstructions, onSaveRatingInstructions,
  plants, onAddPlant, onDeletePlant,
  departments, onAddDepartment, onDeleteDepartment,
  shifts, onAddShift, onDeleteShift,
  questions, onAddQuestion, onEditQuestion, onDeleteQuestion,
  categories, onAddCategory, onEditCategory, onDeleteCategory,
}) {
  const [draft, setDraft] = useState(surveyUrl);
  const [saved, setSaved] = useState(false);
  const [logoBusy, setLogoBusy] = useState(false);
  const [linkError, setLinkError] = useState("");
  const [logoError, setLogoError] = useState("");
  const [nameDraft, setNameDraft] = useState(companyName);
  const [nameSaved, setNameSaved] = useState(false);
  const [nameError, setNameError] = useState("");
  const [instrDraft, setInstrDraft] = useState(ratingInstructions);
  const [instrSaved, setInstrSaved] = useState(false);
  const [instrError, setInstrError] = useState("");

  useEffect(() => { setDraft(surveyUrl); }, [surveyUrl]);
  useEffect(() => { setNameDraft(companyName); }, [companyName]);
  useEffect(() => { setInstrDraft(ratingInstructions); }, [ratingInstructions]);

  const handleSaveName = async () => {
    setNameError("");
    try { await onSaveCompanyName(nameDraft.trim() || DEFAULT_COMPANY_NAME); setNameSaved(true); setTimeout(() => setNameSaved(false), 2000); }
    catch (e) { setNameError((e && (e.message || e.code)) || String(e)); }
  };

  const handleSave = async () => {
    setLinkError("");
    try { await onSaveUrl(draft.trim()); setSaved(true); setTimeout(() => setSaved(false), 2000); }
    catch (e) { setLinkError((e && (e.message || e.code)) || String(e)); }
  };

  const handleSaveInstructions = async () => {
    setInstrError("");
    try { await onSaveRatingInstructions(instrDraft.trim()); setInstrSaved(true); setTimeout(() => setInstrSaved(false), 2000); }
    catch (e) { setInstrError((e && (e.message || e.code)) || String(e)); }
  };

  const handleLogoFile = (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setLogoError(""); setLogoBusy(true);
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const maxDim = 200;
        let { width, height } = img;
        if (width > height) { if (width > maxDim) { height = Math.round((height * maxDim) / width); width = maxDim; } }
        else { if (height > maxDim) { width = Math.round((width * maxDim) / height); height = maxDim; } }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        const dataUrl = canvas.toDataURL("image/png");
        onSaveLogo(dataUrl).catch((err) => setLogoError((err && (err.message || err.code)) || String(err))).finally(() => setLogoBusy(false));
      };
      img.onerror = () => setLogoBusy(false);
      img.src = reader.result;
    };
    reader.onerror = () => setLogoBusy(false);
    reader.readAsDataURL(file);
  };

  const handleRemoveLogo = async () => {
    setLogoError("");
    try { await onRemoveLogo(); }
    catch (e) { setLogoError((e && (e.message || e.code)) || String(e)); }
  };

  return (
    <div>
      <div className="panel">
        <div className="panel-title">Company Name</div>
        <p className="empty-note" style={{ padding: "0 0 12px", textAlign: "left" }}>This name appears in the header and on the printable poster.</p>
        <div className="field-row" style={{ marginBottom: 4, alignItems: "center" }}>
          <input className="name-input" style={{ flex: 1 }} placeholder={DEFAULT_COMPANY_NAME} value={nameDraft} onChange={(e) => setNameDraft(e.target.value)} />
          <button className="submit-btn small-btn" onClick={handleSaveName}>{nameSaved ? "Saved" : "Save"}</button>
        </div>
        {nameError && <div className="error-msg">{nameError}</div>}
      </div>

      <div className="panel">
        <div className="panel-title">Company Logo</div>
        <p className="empty-note" style={{ padding: "0 0 12px", textAlign: "left" }}>Upload your company logo. It appears in the header and on the printable poster.</p>
        <div style={{ display: "flex", alignItems: "center", gap: 16, flexWrap: "wrap" }}>
          <div className="logo-preview-box">
            {logoUrl ? <img src={logoUrl} alt="Company logo" className="logo-preview-img" /> : <span className="logo-preview-empty">Company logo</span>}
          </div>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            <label className="submit-btn small-btn" style={{ background: "#3E8FB0", cursor: "pointer" }}>
              {logoBusy ? "..." : "Upload logo"}
              <input type="file" accept="image/*" onChange={handleLogoFile} style={{ display: "none" }} disabled={logoBusy} />
            </label>
            {logoUrl && <button className="submit-btn small-btn" style={{ background: "#6C7A89" }} onClick={handleRemoveLogo}>Remove logo</button>}
          </div>
        </div>
        {logoError && <div className="error-msg" style={{ marginTop: 12 }}>{logoError}</div>}
      </div>

      {/* ── NEW: Rating Instructions ── */}
      <div className="panel">
        <div className="panel-title">Rating Instructions</div>
        <p className="empty-note" style={{ padding: "0 0 12px", textAlign: "left" }}>
          These instructions appear at the top of Step 2 (the rating screen) to guide employees on how to rate other departments.
        </p>
        <textarea
          rows={4}
          style={{ width: "100%", resize: "vertical", fontFamily: "Inter, sans-serif", fontSize: 14 }}
          placeholder={DEFAULT_RATING_INSTRUCTIONS}
          value={instrDraft}
          onChange={(e) => setInstrDraft(e.target.value)}
        />
        <div style={{ marginTop: 8 }}>
          <button className="submit-btn small-btn" style={{ background: "#4C9A6A" }} onClick={handleSaveInstructions}>{instrSaved ? "Saved ✓" : "Save Instructions"}</button>
        </div>
        {instrError && <div className="error-msg">{instrError}</div>}
      </div>

      <div className="panel">
        <div className="panel-title">Survey Link</div>
        <p className="empty-note" style={{ padding: "0 0 12px", textAlign: "left" }}>Paste the public link where this survey is hosted. It's used to generate the QR code.</p>
        <div className="field-row" style={{ marginBottom: 4, alignItems: "center" }}>
          <input className="name-input" style={{ flex: 1 }} placeholder="https://your-survey-link.example.com" value={draft} onChange={(e) => setDraft(e.target.value)} />
          <button className="submit-btn small-btn" onClick={handleSave}>{saved ? "Saved" : "Save link"}</button>
        </div>
        {linkError && <div className="error-msg">{linkError}</div>}
      </div>

      <ListManager title="Plants" desc="Manage the plant locations available in this app." items={plants} onAdd={onAddPlant} onDelete={onDeletePlant} placeholder="Add a plant" />
      <ListManager title="Departments" desc="Manage the department options employees choose from. Each employee rates all other departments except their own." items={departments} onAdd={onAddDepartment} onDelete={onDeleteDepartment} placeholder="Add a department" />
      <ListManager title="Shifts" desc="Manage the shift options employees choose from." items={shifts} onAdd={onAddShift} onDelete={onDeleteShift} placeholder="Add a shift" />
      <QuestionsManager
        questions={questions} onAdd={onAddQuestion} onEdit={onEditQuestion} onDelete={onDeleteQuestion}
        categories={categories} onAddCategory={onAddCategory} onEditCategory={onEditCategory} onDeleteCategory={onDeleteCategory}
      />
    </div>
  );
}

// ── Admin Login ────────────────────────────────────────────────────────────
function AdminLogin({ onCancel }) {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);

  const handleSubmit = async () => {
    setError(""); setBusy(true);
    try { await firebase.auth().signInWithEmailAndPassword(email, password); }
    catch (e) { setError("Couldn't sign in. Check the email and password and try again."); }
    setBusy(false);
  };

  return (
    <div className="panel" style={{ maxWidth: 340, marginLeft: "auto" }}>
      <div className="field-row" style={{ marginBottom: 8 }}>
        <input className="name-input" style={{ flex: 1 }} type="email" placeholder="Email" value={email} onChange={(e) => setEmail(e.target.value)} />
      </div>
      <div className="field-row" style={{ marginBottom: 8 }}>
        <input className="name-input" style={{ flex: 1 }} type="password" placeholder="Password" value={password} onChange={(e) => setPassword(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") handleSubmit(); }} />
      </div>
      {error && <div className="error-msg">{error}</div>}
      <div style={{ display: "flex", gap: 8 }}>
        <button className="submit-btn small-btn" onClick={handleSubmit} disabled={busy}>Log in</button>
        <button className="submit-btn small-btn" style={{ background: "#6C7A89" }} onClick={onCancel}>×</button>
      </div>
    </div>
  );
}

// ── App Root ───────────────────────────────────────────────────────────────
function App() {
  const [tab, setTab] = useState("survey");
  const [theme, setTheme] = useState("dark");
  const [responses, setResponses] = useState([]);
  const [surveyUrl, setSurveyUrl] = useState("");
  const [logoUrl, setLogoUrl] = useState("");
  const [companyName, setCompanyName] = useState(DEFAULT_COMPANY_NAME);
  const [ratingInstructions, setRatingInstructions] = useState(DEFAULT_RATING_INSTRUCTIONS);
  const [departments, setDepartments] = useState(DEFAULT_DEPARTMENTS.map((name) => ({ id: name, name })));
  const [shifts, setShifts] = useState(DEFAULT_SHIFTS.map((name) => ({ id: name, name })));
  const [plants, setPlants] = useState(DEFAULT_PLANTS.map((name) => ({ id: name, name })));
  const [questions, setQuestions] = useState(DEFAULT_QUESTIONS.map((q) => ({ id: q.id, category: q.cat, text: DEFAULT_QUESTIONS_TEXT[q.id], customized: false })));
  const [categories, setCategories] = useState([...DEFAULT_CATEGORIES]);
  const [user, setUser] = useState(null);
  const [showLogin, setShowLogin] = useState(false);
  const [storageOk, setStorageOk] = useState(true);
  const isAdmin = !!user;

  useEffect(() => {
    const unsub = firebase.auth().onAuthStateChanged((u) => {
      setUser(u);
      if (u) setShowLogin(false);
      else setTab("survey");
    });
    return unsub;
  }, []);

  useEffect(() => {
    const ref = firebase.database().ref(CONFIG_QUESTIONS_PATH);
    const handler = (snap) => {
      const val = snap.val();
      if (val) setQuestions(Object.entries(val).map(([id, v]) => ({ id, category: v.category, text: v.text, customized: !!v.customized })));
    };
    ref.on("value", handler);
    return () => ref.off("value", handler);
  }, []);

  useEffect(() => {
    if (!user) return;
    const qRef = firebase.database().ref(CONFIG_QUESTIONS_PATH);
    qRef.once("value").then((snap) => {
      if (!snap.exists()) {
        const updates = {};
        DEFAULT_QUESTIONS.forEach((q) => { updates[q.id] = { category: q.cat, text: DEFAULT_QUESTIONS_TEXT[q.id], customized: false }; });
        qRef.update(updates).catch(() => {});
      }
    });
  }, [user]);

  useEffect(() => {
    const ref = firebase.database().ref(CONFIG_CATEGORIES_PATH);
    const handler = (snap) => {
      const val = snap.val();
      if (val) {
        const loaded = Object.entries(val).map(([id, v]) => ({ id, label: v.label, color: v.color || "#6C7A89", order: v.order != null ? v.order : 999 }));
        loaded.sort((a, b) => a.order - b.order);
        setCategories(loaded);
      }
    };
    ref.on("value", handler);
    return () => ref.off("value", handler);
  }, []);

  useEffect(() => {
    if (!user) return;
    const catRef = firebase.database().ref(CONFIG_CATEGORIES_PATH);
    catRef.once("value").then((snap) => {
      if (!snap.exists()) {
        const updates = {};
        DEFAULT_CATEGORIES.forEach((cat, i) => { updates[cat.id] = { label: cat.label, color: cat.color, order: i }; });
        catRef.update(updates).catch(() => {});
      }
    });
  }, [user]);

  useEffect(() => {
    const ref = firebase.database().ref(CONFIG_DEPARTMENTS_PATH);
    const handler = (snap) => { const val = snap.val(); if (val) setDepartments(Object.entries(val).map(([id, v]) => ({ id, name: v.name }))); };
    ref.on("value", handler);
    return () => ref.off("value", handler);
  }, []);

  useEffect(() => {
    const ref = firebase.database().ref(CONFIG_SHIFTS_PATH);
    const handler = (snap) => { const val = snap.val(); if (val) setShifts(Object.entries(val).map(([id, v]) => ({ id, name: v.name }))); };
    ref.on("value", handler);
    return () => ref.off("value", handler);
  }, []);

  useEffect(() => {
    const ref = firebase.database().ref(CONFIG_PLANTS_PATH);
    const handler = (snap) => { const val = snap.val(); if (val) setPlants(Object.entries(val).map(([id, v]) => ({ id, name: v.name }))); };
    ref.on("value", handler);
    return () => ref.off("value", handler);
  }, []);

  useEffect(() => {
    if (!user) return;
    const deptRef = firebase.database().ref(CONFIG_DEPARTMENTS_PATH);
    deptRef.once("value").then((snap) => {
      if (!snap.exists()) {
        const updates = {};
        DEFAULT_DEPARTMENTS.forEach((name) => { updates[deptRef.push().key] = { name }; });
        deptRef.update(updates).catch(() => {});
      }

        const updates = {};
        DEFAULT_SHIFTS.forEach((name) => { updates[shiftRef.push().key] = { name }; });
        shiftRef.update(updates).catch(() => {});
      }
    });

        const updates = {};
        DEFAULT_PLANTS.forEach((name) => { updates[plantRef.push().key] = { name }; });
        plantRef.update(updates).catch(() => {});
      }
    });
  }, [user]);

  useEffect(() => {
    if (!user) { setResponses([]); return; }
    const ref = firebase.database().ref(RESPONSES_PATH);
    const handler = (snapshot) => {
      const val = snapshot.val();
      setResponses(val ? Object.entries(val).map(([key, v]) => ({ ...v, id: key })) : []);

    const errHandler = () => setStorageOk(false);
    ref.on("value", handler, errHandler);
    return () => ref.off("value", handler);
  }, [user]);

          .field-row { flex-direction: column; }
          .likert-scale { gap: 6px; }
          .likert-btn { width: 34px; height: 34px; font-size: 12px; }
          .kpi-grid { grid-template-columns: 1fr 1fr; }
        }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
      `}</style>

      <div className="no-print">
        <HazardBar />
        <div className="header-bar">
          <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
            {logoUrl && <img src={logoUrl} alt="Company logo" style={{ maxHeight: 40, maxWidth: 120, objectFit: "contain" }} />}
            <div>
              <div className="brand">{companyName}</div>
              <div className="brand-sub">Inter-Dept Satisfaction</div>
            </div>
          </div>
          <div className="tabs">
            {isAdmin && (
              <>
                <button className={"tab-btn" + (tab === "survey" ? " active" : "")} onClick={() => setTab("survey")}>Take Survey</button>
                <button className={"tab-btn" + (tab === "dashboard" ? " active" : "")} onClick={() => setTab("dashboard")}>Dashboard</button>
                <button className={"tab-btn" + (tab === "poster" ? " active" : "")} onClick={() => setTab("poster")}>QR Poster</button>
                <button className={"tab-btn" + (tab === "settings" ? " active" : "")} onClick={() => setTab("settings")}>Settings</button>
              </>
            )}
            <button className="theme-toggle" onClick={toggleTheme}>{theme === "dark" ? "Light mode" : "Dark mode"}</button>
            {isAdmin ? (
              <button className="theme-toggle" onClick={handleLogout}>Log out</button>
            ) : (
              <button className="admin-gear-btn" onClick={() => setShowLogin((v) => !v)} title="Admin login" aria-label="Admin login">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <circle cx="12" cy="12" r="3"></circle>
                  <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
              </button>
            )}
          </div>
        </div>
        {!isAdmin && showLogin && (
          <div style={{ padding: "0 1.5rem 1rem" }}>
            <AdminLogin onCancel={() => setShowLogin(false)} />
          </div>
        )}
        <HazardBar />
      </div>

      <div className="content">
        {(tab === "survey" || !isAdmin) && (
          <>
            <p className="storage-note">
              Responses are stored for everyone using this app and power the shared dashboard.
              {!storageOk && " (Storage unavailable right now — your response will only be reflected in this session.)"}
            </p>
            <SurveyForm
              onSubmit={handleSubmit}
              logoUrl={logoUrl}
              plants={plants.map((p) => p.name)}
              departments={departments.map((d) => d.name)}
              shifts={shifts.map((s) => s.name)}
              questions={questions}
              categories={categories}
              ratingInstructions={ratingInstructions}
            />
          </>
        )}
        {tab === "dashboard" && isAdmin && (
          <Dashboard
            responses={responses}
            theme={theme}
            plants={plants.map((p) => p.name)}
            departments={departments.map((d) => d.name)}
            shifts={shifts.map((s) => s.name)}
            questions={questions}
            categories={categories}
            companyName={companyName}
            logoUrl={logoUrl}
            onDeleteResponses={deleteResponses}
          />
        )}
        {tab === "poster" && isAdmin && (
          <QRPoster
            surveyUrl={surveyUrl}
            logoUrl={logoUrl}
            companyName={companyName}
            onGoSettings={() => setTab("settings")}
          />
        )}
        {tab === "settings" && isAdmin && (
          <SettingsPanel
            surveyUrl={surveyUrl} onSaveUrl={saveSurveyUrl}
            logoUrl={logoUrl} onSaveLogo={saveLogo} onRemoveLogo={removeLogo}
            companyName={companyName} onSaveCompanyName={saveCompanyName}
            ratingInstructions={ratingInstructions} onSaveRatingInstructions={saveRatingInstructions}
            plants={plants} onAddPlant={addPlant} onDeletePlant={deletePlant}
            departments={departments} onAddDepartment={addDepartment} onDeleteDepartment={deleteDepartment}
            shifts={shifts} onAddShift={addShift} onDeleteShift={deleteShift}
            questions={questions} onAddQuestion={addQuestion} onEditQuestion={editQuestion} onDeleteQuestion={deleteQuestion}
            categories={categories} onAddCategory={addCategory} onEditCategory={editCategory} onDeleteCategory={deleteCategory}
          />
        )}
      </div>
    </div>
  );
}

const rootEl = document.getElementById("root");
const root = ReactDOM.createRoot(rootEl);
root.render(<App />);
</script>

</body>
