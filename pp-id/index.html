      .form-title{font-family:'Oswald',sans-serif;font-size:24px;font-weight:600;margin:0 0 4px;text-transform:uppercase;letter-spacing:0.5px;color:#24231F;}
      .form-sub{color:#5B5A52;font-size:14px;margin:0 0 20px;}
      .field-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
      .field{flex:1;min-width:160px;display:flex;flex-direction:column;gap:4px;margin-bottom:14px;}
      .field label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:#5B5A52;}
      select,textarea,.name-input{font-family:'Inter',sans-serif;background:#FFFDF8;border:1px solid #C9C4B6;border-radius:3px;padding:9px 10px;font-size:14px;color:#24231F;}
      textarea{resize:vertical;width:100%;}
      select:focus,textarea:focus,.name-input:focus{outline:2px solid #F5B400;outline-offset:1px;}
      .anon-row{display:flex;align-items:center;gap:16px;margin-bottom:18px;flex-wrap:wrap;}
      .check-label{display:flex;align-items:center;gap:8px;font-size:14px;}
      .name-input{flex:1;min-width:180px;}
      .dept-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;margin-bottom:20px;}
      .dept-card{background:#E8E3D8;border-radius:8px;padding:18px;border:2px solid transparent;transition:border-color 0.2s;}
      .dept-card.rated{border-color:#6366F1;box-shadow:0 0 0 3px rgba(99,102,241,0.15);}
      .dept-card-name{font-family:'Oswald',sans-serif;font-size:15px;text-transform:uppercase;letter-spacing:1px;color:#24231F;margin-bottom:10px;}
      .error-msg{background:#FBE3DA;color:#A3411E;border:1px solid #E8552D;padding:10px 12px;border-radius:3px;font-size:13px;margin:16px 0;}
      .submit-btn{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;background:linear-gradient(135deg,#6366F1,#3E8FB0);color:#fff;border:none;padding:13px 28px;font-size:14px;font-weight:600;border-radius:8px;cursor:pointer;margin-top:12px;box-shadow:0 2px 10px rgba(99,102,241,0.25);}
      .submit-btn.small-btn{padding:10px 20px;font-size:13px;margin-top:0;}
      .submit-btn:disabled{opacity:0.6;cursor:default;}
      .submit-btn:hover:not(:disabled){background:linear-gradient(135deg,#4F52D9,#2E7A96);box-shadow:0 4px 16px rgba(99,102,241,0.4);}
      .plant-pill-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:0 0 16px;}
      .plant-pill{display:inline-flex;align-items:center;padding:7px 20px;border-radius:999px;border:1.5px solid var(--tab-border);background:var(--bg-tab);color:var(--text-secondary);font-size:12px;font-weight:600;cursor:pointer;transition:all 0.15s;white-space:nowrap;font-family:inherit;}
      .plant-pill:hover{border-color:#6366F1;color:#6366F1;}
      .plant-pill.active{background:linear-gradient(135deg,#6366F1,#3E8FB0);border-color:transparent;color:#fff;font-weight:700;}
      .filter-bar{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:20px;}
      .filter-field{display:flex;flex-direction:column;gap:4px;min-width:160px;}
      .filter-field label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-secondary);}
      .filter-field select{background:var(--bg-panel);color:var(--text-primary);border:1px solid var(--panel-border);border-radius:4px;padding:7px 10px;font-size:13px;cursor:pointer;font-family:inherit;}
      .filter-count{font-size:13px;color:var(--text-secondary);padding:7px 0;align-self:flex-end;}
      .panel{background:var(--bg-panel);border:1px solid var(--panel-border);border-radius:12px;padding:20px 24px;margin-bottom:20px;}
      .panel-title{font-family:'Oswald',sans-serif;font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-secondary);margin-bottom:16px;}
      .panel-row{display:flex;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
      .gauge-panel{background:var(--bg-panel);border:1px solid var(--panel-border);border-radius:12px;padding:16px 12px 10px;flex:1;min-width:240px;overflow:visible;}
      .kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:2;min-width:260px;}
      .top-row{align-items:stretch;}
      .stat-card{background:var(--bg-panel);border:1px solid var(--panel-border);border-radius:8px;padding:16px 20px;display:flex;flex-direction:column;gap:4px;}
      .stat-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.8px;color:var(--text-secondary);}
      .stat-value{font-family:'IBM Plex Mono',monospace;font-weight:700;line-height:1.1;}
      .stat-sub{font-size:12px;color:var(--text-tertiary);}
      .comment-feed{display:flex;flex-direction:column;gap:12px;}
      .comment-item{background:var(--comment-bg);border-radius:6px;padding:14px 16px;}
      .comment-meta{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--text-secondary);margin-bottom:6px;flex-wrap:wrap;}
      .comment-text{margin:0;font-size:14px;color:var(--text-primary);line-height:1.55;}
      .empty-note{color:var(--text-tertiary);font-size:13px;padding:16px;text-align:center;}
      .responses-table-wrap{overflow-x:auto;}
      .responses-table{width:100%;border-collapse:collapse;font-size:13px;}
      .responses-table th{text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-secondary);padding:8px 10px;border-bottom:2px solid var(--panel-border);}
      .responses-table td{padding:9px 10px;border-bottom:1px solid var(--panel-border);color:var(--text-primary);vertical-align:top;}
      .responses-table tr:last-child td{border-bottom:none;}
      .responses-table-comment{max-width:260px;white-space:pre-wrap;word-break:break-word;}
      .tenure-donut-wrap{display:flex;gap:32px;align-items:center;flex-wrap:wrap;}
      .tenure-donut-chart{position:relative;flex:1;min-width:220px;max-width:300px;}
      .tenure-donut-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;}
      .tenure-donut-total{font-family:'IBM Plex Mono',monospace;font-size:28px;font-weight:700;color:var(--text-primary);}
      .tenure-donut-total-label{font-size:11px;color:var(--text-secondary);white-space:nowrap;}
      .tenure-stats-list{flex:1;min-width:200px;display:flex;flex-direction:column;gap:12px;}
      .tenure-stat-row{display:flex;flex-direction:column;gap:4px;}
      .tenure-stat-top{display:flex;align-items:center;gap:8px;}
      .tenure-stat-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
      .tenure-stat-name{font-size:13px;color:var(--text-primary);flex:1;}
      .tenure-stat-pct{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;color:var(--text-primary);}
      .tenure-stat-count{font-size:12px;color:var(--text-secondary);min-width:24px;text-align:right;}
      .tenure-stat-bar-track{height:4px;background:var(--panel-border);border-radius:2px;}
      .tenure-stat-bar-fill{height:4px;border-radius:2px;transition:width 0.4s ease;}
      .logo-preview-box{width:80px;height:60px;background:var(--bg-tab);border:1px solid var(--panel-border);border-radius:4px;display:flex;align-items:center;justify-content:center;overflow:hidden;}
      .logo-preview-img{max-width:100%;max-height:100%;object-fit:contain;}
      .logo-preview-empty{font-size:10px;color:var(--text-tertiary);text-align:center;padding:4px;}
      .list-manager-items{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;min-height:20px;}
      .list-chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg-tab);border:1px solid var(--panel-border);border-radius:999px;padding:5px 12px 5px 14px;font-size:13px;color:var(--text-primary);}
      .list-chip-remove{background:none;border:none;cursor:pointer;font-size:16px;line-height:1;color:var(--text-tertiary);padding:0;display:flex;align-items:center;}
      .list-chip-remove:hover{color:#E8552D;}
      .poster-card{text-align:center;padding:40px 32px;}
      .poster-logo{max-height:60px;max-width:200px;object-fit:contain;margin:0 auto 16px;display:block;}
      .poster-company{font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--text-secondary);margin-bottom:8px;}
      .poster-title{font-family:'Oswald',sans-serif;font-size:28px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text-primary);margin:0 0 8px;}
      .poster-sub{color:var(--text-secondary);font-size:15px;margin:0 0 24px;}
      .qr-box{display:inline-block;padding:16px;background:#fff;border-radius:8px;margin-bottom:16px;}
      .qr-placeholder{width:260px;height:260px;display:flex;align-items:center;justify-content:center;color:#888;font-size:14px;border:2px dashed #ccc;border-radius:4px;padding:16px;text-align:center;}
      .poster-hint{font-size:13px;color:var(--text-tertiary);}
      @media print{.no-print{display:none!important;}.poster-title,.poster-sub,.poster-hint,.poster-company{color:#000!important;}}
      @media(max-width:600px){.field-row{flex-direction:column;}.dept-grid{grid-template-columns:1fr;}.kpi-grid{grid-template-columns:1fr 1fr;}}
      @media(prefers-reduced-motion:reduce){*{transition:none!important;}}
    `}</style>

    <div className="no-print">
      <HazardBar/>
      <div className="header-bar">
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          {logoUrl&&<img src={logoUrl} alt="Logo" style={{maxHeight:52,maxWidth:156,objectFit:"contain"}}/>}
          <div><div className="brand">{companyName}</div><div className="brand-sub">Inter-Dept Satisfaction</div></div>
        </div>
        <div className="tabs">
          {isAdmin&&(<>
            <button className={"tab-btn"+(tab==="survey"?" active":"")} onClick={()=>setTab("survey")}>Take Survey</button>
            <button className={"tab-btn"+(tab==="dashboard"?" active":"")} onClick={()=>setTab("dashboard")}>Dashboard</button>
            <button className={"tab-btn"+(tab==="poster"?" active":"")} onClick={()=>setTab("poster")}>QR Poster</button>
            <button className={"tab-btn"+(tab==="settings"?" active":"")} onClick={()=>setTab("settings")}>Settings</button>
          </>)}
          <button className="theme-toggle" onClick={toggleTheme}>{theme==="dark"?"Light mode":"Dark mode"}</button>
          {isAdmin?<button className="theme-toggle" onClick={handleLogout}>Log out</button>
            :<button className="admin-gear-btn" onClick={()=>setShowLogin((v)=>!v)} title="Admin login" aria-label="Admin login">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
              </svg>
            </button>
          }
        </div>
      </div>
      {!isAdmin&&showLogin&&<div style={{padding:"0 1.5rem 1rem"}}><AdminLogin onCancel={()=>setShowLogin(false)}/></div>}
      <HazardBar/>
    </div>

    <div className="content">
      {(tab==="survey"||!isAdmin)&&(<>
        {ratingGuidelines&&(
          <div className="guidelines-banner">
            <div className="guidelines-banner-label">📋 Rating Guidelines</div>
            <div className="guidelines-banner-text">{ratingGuidelines}</div>
          </div>
        )}
        <SurveyForm onSubmit={handleSubmit} logoUrl={logoUrl} plants={plantNames} departments={deptNames} shifts={shiftNames} ratingGuidelines={ratingGuidelines} isAdmin={isAdmin} onAddDummyEntry={addDummyEntry}/>
      </>)}
      {tab==="dashboard"&&isAdmin&&<Dashboard responses={responses} theme={theme} plants={plantNames} departments={deptNames} shifts={shiftNames} companyName={companyName} logoUrl={logoUrl} onDeleteResponses={deleteResponses} onAddDummyEntry={addDummyEntry}/>}
      {tab==="poster"&&isAdmin&&<QRPoster surveyUrl={surveyUrl} logoUrl={logoUrl} companyName={companyName} onGoSettings={()=>setTab("settings")}/>}
      {tab==="settings"&&isAdmin&&<SettingsPanel surveyUrl={surveyUrl} onSaveUrl={saveSurveyUrl} logoUrl={logoUrl} onSaveLogo={saveLogo} onRemoveLogo={removeLogo} companyName={companyName} onSaveCompanyName={saveCompanyName} ratingGuidelines={ratingGuidelines} onSaveGuidelines={saveGuidelines} plants={plants} onAddPlant={addPlant} onDeletePlant={deletePlant} departments={departments} onAddDepartment={addDepartment} onDeleteDepartment={deleteDepartment} shifts={shifts} onAddShift={addShift} onDeleteShift={deleteShift}/>}
    </div>
  </div>);
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
<script>
  (function(){
    var src=document.getElementById("app-source").textContent;
    var out=Babel.transform(src,{presets:[["react",{runtime:"classic"}]]}).code;
    var s=document.createElement("script");s.text=out;document.body.appendChild(s);
  })();
</script>
</body>
</html>
