          {logoUrl&&<img src={logoUrl} alt="Logo" style={{maxHeight:52,maxWidth:156,objectFit:"contain"}}/>}
          <div><div className="brand">{companyName}</div><div className="brand-sub">Inter-Dept Satisfaction</div></div>
        </div>
        <div className="tabs">
          {isLoggedIn&&(<>
            <button className={"tab-btn"+(tab==="survey"?" active":"")} onClick={()=>setTab("survey")}>Take Survey</button>
            <button className={"tab-btn"+(tab==="dashboard"?" active":"")} onClick={()=>setTab("dashboard")}>Dashboard</button>
            <button className={"tab-btn"+(tab==="poster"?" active":"")} onClick={()=>setTab("poster")}>QR Poster</button>
            {/* Users tab — superadmin sees full mgmt, regular user sees their plant access */}
            <button className={"tab-btn"+(tab==="users"?" active":"")} onClick={()=>setTab("users")}>
              {isSuperAdmin?"Users":"My Access"}
            </button>
            {/* Settings — superadmin only */}
            {isSuperAdmin&&<button className={"tab-btn"+(tab==="ai"?" active":"")} onClick={()=>setTab("ai")} style={tab==="ai"?{}:{background:"linear-gradient(135deg,rgba(155,107,209,0.12),rgba(99,102,241,0.12))",border:"1px solid rgba(155,107,209,0.4)",color:"#9B6BD1"}}>🤖 AI Analysis</button>}
            {isSuperAdmin&&<button className={"tab-btn"+(tab==="settings"?" active":"")} onClick={()=>setTab("settings")}>Settings</button>}
          </>)}
          <button className="theme-toggle" onClick={toggleTheme}>{theme==="dark"?"Light mode":"Dark mode"}</button>
          {roleBadge}
          {isLoggedIn
            ?<button className="theme-toggle" onClick={handleLogout}>Log out</button>
            :<button className="admin-gear-btn" onClick={()=>setShowLogin((v)=>!v)} title="Login" aria-label="Login">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
              </svg>
            </button>
          }
        </div>
      </div>
      {!isLoggedIn&&showLogin&&<div style={{padding:"0 1.5rem 1rem"}}><AdminLogin onCancel={()=>setShowLogin(false)}/></div>}
      <HazardBar/>
    </div>

    <div className="content">
      {(tab==="survey"||!isLoggedIn)&&(<>
        {ratingGuidelines&&(
          <div className="guidelines-banner">
            <div className="guidelines-banner-label">📋 Rating Guidelines</div>
            <div className="guidelines-banner-text">{ratingGuidelines}</div>
          </div>
        )}
        <SurveyForm onSubmit={handleSubmit} logoUrl={logoUrl} plants={plantNames} departments={deptNames} shifts={shiftNames} ratingGuidelines={ratingGuidelines} isAdmin={isSuperAdmin} onAddDummyEntry={addDummyEntry} validUntil={validUntil} existingResponses={responses}/>
      </>)}
      {tab==="dashboard"&&isLoggedIn&&(
        <Dashboard
          responses={dashResponses}
          theme={theme}
          plants={dashPlantNames}
          departments={deptNames}
          shifts={shiftNames}
          companyName={companyName}
          logoUrl={logoUrl}
          onDeleteResponses={isSuperAdmin?deleteResponses:null}
          onAddDummyEntry={isSuperAdmin?addDummyEntry:null}
        />
      )}
      {tab==="poster"&&isLoggedIn&&<QRPoster surveyUrl={surveyUrl} logoUrl={logoUrl} companyName={companyName} onGoSettings={isSuperAdmin?()=>setTab("settings"):null}/>}
      {tab==="users"&&isLoggedIn&&(
        isSuperAdmin
          ?<UsersPanel plants={plants} managedUsers={managedUsers} currentUserUid={user.uid}/>
          :<div className="panel" style={{maxWidth:560}}>
            <div className="panel-title">My Plant Access</div>
            <p style={{color:"var(--text-secondary)",fontSize:14,marginBottom:16,lineHeight:1.6}}>
              You are logged in as <strong style={{color:"var(--text-primary)"}}>{user.email}</strong>.
            </p>
            {myAllowedPlants
              ?<>
                <p style={{color:"var(--text-secondary)",fontSize:13,marginBottom:12}}>You have access to the following plant(s):</p>
                <div style={{display:"flex",flexWrap:"wrap",gap:10}}>
                  {myAllowedPlants.map(p=>(
                    <span key={p} style={{background:"linear-gradient(135deg,#6366F1,#3E8FB0)",color:"#fff",padding:"8px 20px",borderRadius:999,fontWeight:700,fontSize:14}}>{p}</span>
                  ))}
                </div>
              </>
              :<p style={{color:"var(--text-secondary)",fontSize:14}}>You have access to <strong style={{color:"var(--text-primary)"}}>all plants</strong>.</p>
            }
            <p style={{color:"var(--text-tertiary)",fontSize:12,marginTop:16}}>Contact a Superadmin to change your plant access.</p>
          </div>
      )}
      {tab==="ai"&&isLoggedIn&&isSuperAdmin&&(
        <AIAnalysisPanel
          responses={dashResponses}
          departments={deptNames}
          plants={dashPlantNames}
          shifts={shiftNames}
          theme={theme}
        />
      )}
      {tab==="settings"&&isLoggedIn&&isSuperAdmin&&(
        <SettingsPanel surveyUrl={surveyUrl} onSaveUrl={saveSurveyUrl} logoUrl={logoUrl} onSaveLogo={saveLogo} onRemoveLogo={removeLogo} companyName={companyName} onSaveCompanyName={saveCompanyName} ratingGuidelines={ratingGuidelines} onSaveGuidelines={saveGuidelines} validUntil={validUntil} onSaveValidUntil={saveValidUntil} plants={plants} onAddPlant={addPlant} onDeletePlant={deletePlant} departments={departments} onAddDepartment={addDepartment} onDeleteDepartment={deleteDepartment} shifts={shifts} onAddShift={addShift} onDeleteShift={deleteShift}/>
      )}
    </div>
  </div>);
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
<script>
  (function(){
    var src=document.getElementById("app-source").textContent;
    var out=Babel.transform(src,{presets:[["react",{runtime:"classic"}]]}).code;
    var s=document.createElement("script");s.text=out;document.body.appendChild(s);
  })();
</script>
</body>
</html>
