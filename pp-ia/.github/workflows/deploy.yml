name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main          # deploy automatically on every push to main
  workflow_dispatch:  # allow manual deploy from GitHub Actions tab

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Node 20 (matches Cloud Functions runtime)
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      # 3. Install Cloud Functions dependencies
      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      # 4. Deploy to Firebase (Hosting + Functions + Firestore rules + Indexes)
      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SKR_IA }}'
          projectId: skr-ia
          channelId: live
