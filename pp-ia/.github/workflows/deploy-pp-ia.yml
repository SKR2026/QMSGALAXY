name: Deploy pp-ia to Firebase Hosting
on:
  push:
    branches: [main]
    paths:
      - 'pp-ia/**'
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pp-ia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Functions dependencies
        working-directory: pp-ia/functions
        run: npm install
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SKR_IA }}'
          projectId: skr-ia
          channelId: live
          entryPoint: pp-ia
