// Sticky horizontal scrollbar that mirrors the chart container's sideways scroll
function attachStickyHScroll(canvasId){
  const canvas=document.getElementById(canvasId);
  if(!canvas) return;
  const wrap=canvas.parentElement;
  if(!wrap) return;
  let bar=wrap.nextElementSibling;
  if(!bar||!bar.classList.contains('hscroll-proxy')){
    bar=document.createElement('div');
    bar.className='hscroll-proxy';
    bar.innerHTML='<div></div>';
    wrap.after(bar);
  }
  const inner=bar.firstElementChild;
  const size=()=>{
    const over=wrap.scrollWidth>wrap.clientWidth+1;
    bar.style.display=over?'block':'none';
    wrap.classList.toggle('has-hproxy',over);
    inner.style.width=(wrap.scrollWidth-wrap.clientWidth+bar.clientWidth)+'px';
    if(Math.abs(bar.scrollLeft-wrap.scrollLeft)>1) bar.scrollLeft=wrap.scrollLeft;
  };
  size();
  requestAnimationFrame(size);
  if(wrap._hproxyBound) { wrap._hproxySize=size; return; }
  wrap._hproxyBound=true; wrap._hproxySize=size;
  let lock=false;
  bar.addEventListener('scroll',()=>{ if(lock){lock=false;return;} lock=true; wrap.scrollLeft=bar.scrollLeft; },{passive:true});
  wrap.addEventListener('scroll',()=>{ if(Math.abs(bar.scrollLeft-wrap.scrollLeft)<1) return; lock=true; bar.scrollLeft=wrap.scrollLeft; },{passive:true});
  if(window.ResizeObserver){ new ResizeObserver(()=>wrap._hproxySize&&wrap._hproxySize()).observe(wrap); }
}
window.addEventListener('resize',()=>document.querySelectorAll('.org-wrap,#pub-canvas').forEach(el=>{ const w=el.id==='pub-canvas'?el.parentElement:el; w&&w._hproxySize&&w._hproxySize(); }));

function _renderNode(node, isRoot){
  const showPh = S.showPhoto;

  // ── Virtual root wrapper ──────────────────────────────────────
  // Plant labels are now self-rendered by each node via _plantBranchLabel annotation.
  // Virtual root just lays out branches side by side.
  if(node._isVirtualRoot){
    const parts = (node.children||[]).map(c=>`<div style="display:flex;flex-direction:column;align-items:center">${_renderNode(c,true)}</div>`);
    return `<div style="display:flex;flex-direction:column;align-items:center">
  <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">${parts.join('')}</div>
</div>`;
  }

  // Iterative DFS to build HTML bottom-up.
  // Stack entries: { node, isRoot, phase }
  //   phase=0  → push children first, then come back with phase=1 to build HTML
  //   phase=1  → children already resolved; build this node's HTML
  const stack = [{ node, isRoot, phase: 0 }];
  const results = new Map(); // nodeId → rendered HTML string

  while(stack.length){
    const top = stack[stack.length-1];
    const n = top.node;
    const col = S.collapsed.has(n.id);
    const children = n.children||[];
    const has = children.length > 0;

    if(top.phase === 0){
      top.phase = 1;
      // If not collapsed, push children so they resolve before we come back
      if(has && !col){
        for(let i = children.length-1; i >= 0; i--){
          stack.push({ node: children[i], isRoot: false, phase: 0 });
        }
      }
      continue;
    }

    // phase === 1: all children (if any) are now in results
    stack.pop();
    const html = _buildNodeHTML(n, top.isRoot, showPh, results, col);
    results.set(n.id, html);
  }

  return results.get(node.id) || '';
}

function _buildNodeHTML(node, isRoot, showPh, results, col){
  const children = node.children||[];
  const has = children.length > 0;

  // ── Plant label pill (shared across all node types) ───────────
  const _plantPill = node._plantBranchLabel
    ? (() => {
        const plantObj = S.plants.find(p=>p.id===node._plantBranchLabel);
        const pname = plantObj?.name || 'Plant';
        return `<div style="background:linear-gradient(135deg,var(--navy),var(--steel));color:#fff;font-size:9px;font-weight:800;padding:3px 10px;border-radius:20px;margin-bottom:6px;display:inline-flex;align-items:center;gap:4px;box-shadow:0 2px 6px rgba(15,31,61,.2);letter-spacing:.03em;white-space:nowrap">🏭 ${pname}</div>`;
      })()
    : '';

  // ── Dept header ───────────────────────────────────────────────
  if(node._isDeptHeader){
    let childrenHTML = '';
    if(has && !col){
      const inner = children.map((c,ci)=>{
        const dropH = c._plantBranchLabel ? '28px' : '16px';
        return `<div class="ochild-wrap" data-first="${ci===0}" data-last="${ci===children.length-1}" data-only="${children.length===1}">
          <div class="ldrop" style="height:${dropH}"></div>${results.get(c.id)||''}
        </div>`;
      }).join('');
      childrenHTML = `<div class="conn-v" style="height:12px"></div><div class="ochildren">${inner}</div>`;
    }
    return `<div class="onode" style="align-items:center">
  ${_plantPill}
  <div style="background:linear-gradient(135deg,var(--steel),var(--navy));border-radius:10px;padding:8px 12px;min-width:100px;text-align:center;box-shadow:var(--shadow);border:2px solid var(--gold);position:relative">
    <div style="font-size:16px;margin-bottom:3px">🏢</div>
    <div style="color:var(--gold);font-size:11px;font-weight:800;line-height:1.3">${node.name}</div>
    <div style="color:rgba(255,255,255,.5);font-size:9px;font-weight:600;margin-top:2px;text-transform:uppercase;letter-spacing:.08em">Department</div>
    <div style="color:rgba(255,255,255,.35);font-size:9px;margin-top:2px">${children.length} member${children.length!==1?'s':''}</div>
    ${has?`<button class="ocol" data-colid="${node.id}" style="border-color:rgba(255,255,255,.2);color:rgba(255,255,255,.6)">${col?'▾':'▴'}</button>`:''}
  </div>
  ${childrenHTML}
</div>`;
  }

  // ── Context (greyed ancestor) node ────────────────────────────
  if(node._isContext){
    let childrenHTML = '';
    if(has && !col){
      const inner = children.map((c,ci)=>{
        const dropH = c._plantBranchLabel ? '28px' : '16px';
        return `<div class="ochild-wrap" data-first="${ci===0}" data-last="${ci===children.length-1}" data-only="${children.length===1}">
          <div class="ldrop" style="height:${dropH}"></div>${results.get(c.id)||''}
        </div>`;
      }).join('');
      childrenHTML = `<div class="conn-v" style="height:12px"></div><div class="ochildren">${inner}</div>`;
    }
    return `<div class="onode" style="align-items:center">
  ${_plantPill}
  <div class="ocard" data-pid="${node.id}" data-lvl="${node._lvlEff??''}" style="width:86px;padding:5px 6px 7px;border-style:dashed;opacity:0.6;cursor:default">
    <div style="font-size:8.5px;font-weight:700;color:var(--navy);line-height:1.3;text-align:center;word-break:break-word">${node.name}</div>
    <div style="font-size:7.5px;color:var(--g400);margin-top:1px;text-align:center;font-weight:500">${node.designation}</div>
    ${node.dept?`<div style="font-size:7px;color:var(--steel);margin-top:2px;text-align:center;font-weight:600;opacity:.8">${node.dept}</div>`:''}
    ${has?`<button class="ocol" data-colid="${node.id}" style="bottom:-8px;width:15px;height:15px;font-size:7px">${col?'▾':'▴'}</button>`:''}
  </div>
  ${childrenHTML}
</div>`;
  }

  // ── Regular employee node ─────────────────────────────────────
  const vacant = isVacantPosition(node);
  const avSize = isRoot?(showPh?'36px':'0'):(showPh?'26px':'0');
  const avFontSize = isRoot?'13px':'10px';
  const av = showPh
    ?(node.photoURL && !vacant
      // loading="lazy" defers off-screen image decoding — critical for 250-node charts
      ?`<img src="${node.photoURL}" loading="lazy" style="width:${avSize};height:${avSize};border-radius:50%;object-fit:cover;margin:0 auto 4px;display:block;border:1.5px solid ${genderBorderColor(node.gender)}" onerror="this.style.display='none'">`
      :vacant
        ?`<div style="width:${avSize};height:${avSize};border-radius:50%;background:linear-gradient(135deg,#FF4444,#CC0000);margin:0 auto 4px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:${avFontSize};font-weight:700">!</div>`
        :`<div style="width:${avSize};height:${avSize};border-radius:50%;background:${genderAvBg(node.gender)};margin:0 auto 4px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:${avFontSize};font-weight:700">${ini(node.name)}</div>`)
    :'';

  // Children rendering — uniform; plant labels are now self-rendered by each node
  // via _plantBranchLabel annotation (annotateTreeLabels), not by the parent
  let childrenHTML = '';
  if(has && !col){
    const inner = children.map((c,ci)=>{
      // Give extra vertical space when child will render a plant label above its card
      const dropH = c._plantBranchLabel ? '28px' : '16px';
      return `<div class="ochild-wrap" data-first="${ci===0}" data-last="${ci===children.length-1}" data-only="${children.length===1}">
        <div class="ldrop" style="height:${dropH}"></div>${results.get(c.id)||''}
      </div>`;
    }).join('');
    childrenHTML = `<div class="conn-v" style="height:12px"></div><div class="ochildren">${inner}</div>`;
  }

  // Dept branch label — shown above the card when this node starts a new dept
  const deptLabel = (!isRoot && node._deptBranchLabel)
    ? `<div style="background:linear-gradient(135deg,var(--steel),#1a5ca8);color:#fff;font-size:9px;font-weight:800;padding:3px 9px;border-radius:20px;margin-bottom:6px;display:inline-flex;align-items:center;gap:4px;box-shadow:0 1px 4px rgba(30,64,128,.22);letter-spacing:.03em;white-space:nowrap">🏢 ${node._deptBranchLabel}</div>`
    : '';

  // Admin reporting badge
  const adminTypeLabel = node.adminReportingType ? {administrative:'ADM',functional:'FNC','dotted-line':'DL',matrix:'MTX'}[node.adminReportingType]||'ADM' : 'ADM';
  const adminBadge = node.adminParentId
    ? `<span class="admin-badge" title="Also reports administratively to another manager (${node.adminReportingType||'administrative'})">${adminTypeLabel}</span>`
    : '';

  // Vacant position: urgent attention badge in top-right
  const vacantBadge = vacant
    ? `<span style="position:absolute;top:3px;left:3px;background:#FF4444;color:#fff;font-size:6.5px;font-weight:800;padding:1px 4px;border-radius:4px;letter-spacing:.04em;line-height:1.4;white-space:nowrap;z-index:2">⚠ VACANT</span>`
    : '';

  // Card class string
  const cardClasses = isRoot ? 'root-card' : vacant ? 'vacant-card' : node._highlight ? 'highlight-card' : '';

  // Name and designation text colors — adjust for vacant & root
  const nameColor = isRoot ? '#fff' : vacant ? '#CC0000' : 'var(--navy)';
  const desigColor = isRoot ? 'rgba(255,255,255,.6)' : vacant ? '#FF6B6B' : 'var(--g400)';

  return `<div class="onode" style="align-items:center">
  ${_plantPill}
  ${deptLabel}
  <div class="ocard ${cardClasses}" data-pid="${node.id}" data-lvl="${node._lvlEff??''}" style="width:${isRoot?'100px':'86px'};padding:${showPh?'7px 6px 9px':'5px 6px 7px'};position:relative${vacant?';border-style:dashed':''}">
    ${adminBadge}
    ${vacantBadge}
    ${av}
    <div style="font-size:${isRoot?'9px':'8.5px'};font-weight:700;color:${nameColor};line-height:1.3;text-align:center;word-break:break-word${vacant?';font-style:italic':''}">
      ${vacant&&node.designation?node.designation:node.name}
    </div>
    ${vacant?`<div class="vacant-badge" style="margin:3px auto 0;display:flex;justify-content:center">⚠ Needs Hiring</div>`
      :`<div style="font-size:7.5px;color:${desigColor};margin-top:1px;text-align:center;font-weight:500;line-height:1.2">${node.designation}</div>`}
    ${has?`<button class="ocol" data-colid="${node.id}" style="bottom:-8px;width:15px;height:15px;font-size:7px">${col?'▾':'▴'}</button>`:''}
  </div>
  ${childrenHTML}
</div>`;
}

// ── Plant Admin helpers ──────────────────────────────────────────
// Returns all plant IDs assigned to the current plant admin (multi-plant support)
function getMyPlantIds(){
  const p=S.profile;
  if(!p||p.role!=='plant-admin') return [];
  if(Array.isArray(p.plantIds)&&p.plantIds.length) return p.plantIds;
  return p.plantId?[p.plantId]:[];
}
// Returns all employees belonging to ANY of the admin's assigned plants
function getMyPlantEmps(empsArr){
  const ids=getMyPlantIds();
  if(!ids.length) return [];
  const idSet=new Set(ids);
  return (empsArr||S.employees).filter(e=>idSet.has(e.plantId));
}

// ── Plant Admin ──────────────────────────────────────────────────
function plantAdminHTML(){
  const nav=[{label:null,items:[
    {id:'pa-chart',icon:'⬡',label:'Org Charts'},
    {id:'pa-employees',icon:'👥',label:'My Employees'},
    {id:'abbrev-doc',icon:'🔤',label:'Abbreviation Document'}
  ]}];
  // Primary plant for display purposes (topbar title, etc.)
  const pid=S.profile?.plantId;
  const plant=S.plants.find(p=>p.id===pid);
  const myPids=getMyPlantIds();
  const isChart=S.tab==='pa-chart'||S.tab==='dashboard';
  // All employees across all assigned plants
  const content=S.tab==='abbrev-doc'
    ?abbrevDocHTML()
    :isChart
      ?paChartTabsHTML(pid,plant)
      :paEmployeesHTML(getMyPlantEmps(S.employees),pid);

  // Plant-scoped stats — include ALL assigned plants
  const myEmps=getMyPlantEmps(S.employees);
  const myFemale=myEmps.filter(e=>e.gender==='female').length;
  const myOtherLoc=myEmps.filter(e=>e.workingLocation&&e.workingLocation.trim()!=='').length;
  const myDepts=[...new Set(myEmps.map(e=>e.dept).filter(Boolean))].length;
  const myTopLevel=myEmps.filter(e=>!e.parentId).length;
  const myPhotos=myEmps.filter(e=>e.photoURL).length;

  // Topbar subtitle: list all assigned plant names
  const myPlantNames=myPids.map(id=>S.plants.find(p=>p.id===id)?.name).filter(Boolean);
  const topbarSub='Plant Admin'+(myPlantNames.length?' · '+myPlantNames.join(', '):'');

  return `<div class="layout">
  ${sidebarHTML(nav)}
  <div class="main">${topbarHTML(plant?.name||'Your Plant',topbarSub,'🏭 Plant Admin',legendInlineHTML())}
  <div class="page">${content}</div></div>
</div>${modalHTML()}${S.detailPerson?detailOverlayHTML():''}`;
}

// Plant admin — 3-tab chart view (Group / Plant-wise / Dept-wise)
// Default: Plant-wise with own plant pre-selected
// Dept tab: toggle between Plant-level and Group-level
function paChartTabsHTML(myPid, myPlant){
  const {plants,employees}=S;
  // Default tab is 'plt' (plant view); auto-set own plant if not set
  const paTab=S._paTab||'plt';
  if(!S._paPltId && (paTab==='plt')) S._paPltId=myPid||'';
  const pid=S._paPltId||myPid||'';
  const did=S._paDept||'';
  const deptScope=S._paDeptScope||'plant'; // 'plant' | 'group'
  const sc=S.chartScale;
  const allDepts=sortedDepts(employees);
  // Depts visible across ALL assigned plants (multi-plant support)
  const myPlantEmps=getMyPlantEmps(employees);
  const myPlantDepts=sortedDepts(myPlantEmps);

  // Build tree based on active tab
  let tree=null, chartTitle='My Plant', activeEmps=[];
  if(paTab==='grp'){
    // Group view: show ALL employees (full org)
    tree=buildTree(employees);
    chartTitle='Group';
    activeEmps=employees;
  } else if(paTab==='plt'){
    // Plant view: own plant pre-selected, can switch to others
    if(pid){
      activeEmps=employees.filter(e=>e.plantId===pid);
      tree=buildTreeWithAncestors(activeEmps,employees);
      const p=plants.find(x=>x.id===pid);
      chartTitle=p?.name||(pid===myPid?myPlant?.name:'Plant');
    }
  } else if(paTab==='dpt'){
    if(did){
      if(deptScope==='plant'){
        activeEmps=myPlantEmps.filter(e=>(e.dept||'').toLowerCase()===did.toLowerCase());
        tree=activeEmps.length?buildTreeWithAncestors(activeEmps,employees):null;
        chartTitle=did+' · '+( myPlant?.name||'My Plant');
      } else {
        activeEmps=employees.filter(e=>(e.dept||'').toLowerCase()===did.toLowerCase());
        tree=buildTreeWithAncestors(activeEmps,employees);
        chartTitle=did+' · All Plants';
      }
    }
  }

  // (no per-plant split — plant labels injected inline in the tree renderer)

  const search=(S._paSearch||'').toLowerCase().trim();
  if(search&&tree) highlightSearch(tree,search);

  const tabBtn=(id,icon,label)=>`<button id="pa-tab-${id}" style="
    display:inline-flex;align-items:center;gap:6px;padding:9px 18px;
    border:none;border-bottom:3px solid ${paTab===id?'var(--gold)':'transparent'};
    background:none;font-size:13px;font-weight:${paTab===id?'700':'500'};
    color:${paTab===id?'var(--navy)':'var(--g400)'};cursor:pointer;
    transition:all .15s;font-family:inherit;white-space:nowrap"
    onmouseover="if('${id}'!=='${paTab}')this.style.color='var(--navy)'"
    onmouseout="if('${id}'!=='${paTab}')this.style.color='var(--g400)'"
  >${icon} ${label}</button>`;

  // Pill helpers for PA tab filters
  const paPillsPlant=plants.map(p=>{
    const active=(pid||myPid)===p.id;
    const pEmps=employees.filter(e=>e.plantId===p.id);
    const cnt=pEmps.length;
    const pFemale=pEmps.filter(e=>e.gender==='female').length;
    const pDepts=[...new Set(pEmps.map(e=>e.dept).filter(Boolean))].length;
    const pAway=pEmps.filter(e=>e.workingLocation&&e.workingLocation.trim()!=='').length;
    return `<div style="display:inline-flex;flex-direction:column;gap:3px;cursor:pointer" id="pa-plant-pill-${p.id}" onclick="S._paPltId='${p.id.replace(/'/g,"\'")}';render()">
      <button style="
        display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;
        border:1.5px solid ${active?'var(--steel)':'var(--g200)'};
        background:${active?'var(--navy)':'#fff'};color:${active?'#fff':'var(--g600)'};
        font-size:11px;font-weight:${active?'700':'500'};cursor:pointer;transition:all .15s;white-space:nowrap;font-family:inherit;width:100%">
        🏭 ${p.name}${p.id===myPid?' ★':''} <span style="background:${active?'rgba(255,255,255,.2)':'var(--g100)'};border-radius:10px;padding:1px 5px;font-size:10px;font-weight:700">${cnt}</span>
      </button>
      <div style="display:flex;flex-wrap:nowrap;gap:3px;padding:0 4px;overflow:hidden;max-width:100%">
        <span onclick="openPlantModal('paDeptList','${p.id}',event)" style="display:inline-flex;align-items:center;gap:2px;background:rgba(30,64,128,.07);border:1px solid rgba(30,64,128,.12);border-radius:20px;padding:1px 6px;font-size:9px;font-weight:700;white-space:nowrap;cursor:pointer" title="Click to view departments">
          🏢 <span style="color:var(--steel)">${pDepts}</span><span style="color:var(--g400);font-weight:500"> dept${pDepts!==1?'s':''}</span>
        </span>
        ${pFemale>0?`<span onclick="openPlantModal('paFemale','${p.id}',event)" style="display:inline-flex;align-items:center;gap:2px;background:rgba(190,24,93,.07);border:1px solid rgba(190,24,93,.15);border-radius:20px;padding:1px 6px;font-size:9px;font-weight:700;white-space:nowrap;cursor:pointer" title="Click to view female employees">
          ♀ <span style="color:#BE185D">${pFemale}</span><span style="color:var(--g400);font-weight:500"> ♀</span>
        </span>`:''}
        ${pAway>0?`<span onclick="openPlantModal('paOtherLoc','${p.id}',event)" style="display:inline-flex;align-items:center;gap:2px;background:rgba(245,166,35,.1);border:1px solid rgba(245,166,35,.2);border-radius:20px;padding:1px 6px;font-size:9px;font-weight:700;white-space:nowrap;cursor:pointer" title="Click to view away employees">
          📍 <span style="color:#B7791F">${pAway}</span><span style="color:var(--g400);font-weight:500"> away</span>
        </span>`:''}
      </div>
    </div>`;
  }).join('');
  const paPillsDept=allDepts.map(d=>{
    const grpCnt=employees.filter(e=>(e.dept||'').toLowerCase()===d.toLowerCase()).length;
    const pltCnt=myPlantEmps.filter(e=>(e.dept||'').toLowerCase()===d.toLowerCase()).length;
    const active=(did||'').toLowerCase()===d.toLowerCase();
    return `<button onclick="S._paDept='${d.replace(/'/g,"\'")}';render()" style="
      display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;
      border:1.5px solid ${active?'var(--gold)':pltCnt>0?'var(--g200)':'var(--g100)'};
      background:${active?'var(--navy)':'#fff'};color:${active?'#fff':pltCnt>0?'var(--g600)':'var(--g400)'};
      font-size:11px;font-weight:${active?'700':pltCnt>0?'500':'400'};cursor:pointer;transition:all .15s;white-space:nowrap;font-family:inherit">
      🏢 ${d}
      <span style="background:${active?'rgba(255,255,255,.25)':'rgba(30,64,128,.1)'};color:${active?'#fff':'var(--steel)'};border-radius:10px;padding:1px 6px;font-size:10px;font-weight:700" title="${pltCnt} in your plant">${pltCnt}</span>
      ${grpCnt!==pltCnt?`<span style="background:${active?'rgba(255,255,255,.12)':'var(--g100)'};color:${active?'rgba(255,255,255,.7)':'var(--g400)'};border-radius:10px;padding:1px 5px;font-size:9px;font-weight:600" title="Total: ${grpCnt}">/${grpCnt}</span>`:''}
    </button>`;
  }).join('');
  // Toggle switch HTML for dept scope
  const deptScopeToggle=`<label style="display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none;flex-shrink:0">
    <span style="font-size:10px;font-weight:700;color:${deptScope==='plant'?'var(--steel)':'var(--g400)'};text-transform:uppercase;letter-spacing:.05em;transition:color .15s">🏭 Plant</span>
    <div id="dept-scope-track" style="position:relative;width:42px;height:22px;border-radius:11px;background:${deptScope==='group'?'var(--navy)':'var(--steel)'};cursor:pointer;transition:background .2s;flex-shrink:0;box-shadow:inset 0 1px 3px rgba(0,0,0,.2)" onclick="event.stopPropagation();S._paDeptScope=S._paDeptScope==='plant'?'group':'plant';render()">
      <div style="position:absolute;top:3px;left:${deptScope==='group'?'23px':'3px'};width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:left .2s"></div>
    </div>
    <span style="font-size:10px;font-weight:700;color:${deptScope==='group'?'var(--navy)':'var(--g400)'};text-transform:uppercase;letter-spacing:.05em;transition:color .15s">🌐 Group</span>
  </label>`;

  const filterBar=paTab==='plt'
    ?`<div style="display:flex;gap:5px;flex-wrap:wrap;align-items:center"><span style="font-size:10px;font-weight:700;color:var(--g400);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap">Plant:</span>${paPillsPlant||'<span style="font-size:12px;color:var(--g400)">None</span>'}</div>`
    :paTab==='dpt'
    ?`<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;width:100%">
        <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
          <span style="font-size:10px;font-weight:700;color:var(--g400);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap">Dept:</span>
          ${deptScopeToggle}
          <span style="font-size:10px;color:var(--g400);white-space:nowrap">${deptScope==='plant'?`Showing <strong style="color:var(--steel)">${myPlant?.name||'your plant'}</strong> employees only`:'Showing <strong style="color:var(--navy)">all plants</strong> employees'}</span>
        </div>
        <div style="width:100%;display:flex;gap:5px;flex-wrap:wrap;align-items:flex-start;margin-top:2px">${paPillsDept||'<span style="font-size:12px;color:var(--g400)">No departments found</span>'}</div>
      </div>`
    :'';

  const contextNote=(paTab==='plt'&&pid)||(paTab==='dpt'&&did)
    ?`<div style="background:rgba(245,166,35,.08);border:1px solid rgba(245,166,35,.25);border-radius:8px;padding:8px 14px;font-size:11px;color:#92610a;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <span>🔗</span>
        <span>Greyed cards = ancestor chain shown for reporting context only (not in this ${paTab==='plt'?'plant':deptScope==='plant'?'plant dept':'department'}).</span>
        <span style="margin-left:auto;background:rgba(34,197,94,.1);color:#16a34a;padding:2px 8px;border-radius:12px;font-weight:700">✏ Edit: <strong>${myPlant?.name||'your plant'}</strong> employees only</span>
      </div>`:'';

  // PA inline stats — contextual
  const paInlineStatsBar=[
    ...(paTab==='plt'?[{icon:'🏭',value:plants.length,label:'Plants'},{icon:'👥',value:employees.length,label:'Total'},{icon:'🧑',value:activeEmps.length,label:'In Plant'}]:[]),
    ...(paTab==='grp'?[{icon:'🏭',value:plants.length,label:'Plants'},{icon:'👥',value:employees.length,label:'Employees'},{icon:'🏢',value:allDepts.length,label:'Depts'}]:[]),
    ...(paTab==='dpt'&&did?[
      {icon:'👤',value:activeEmps.length,label:deptScope==='plant'?'In Plant Dept':'In Group Dept'},
      {icon:'🏢',value:allDepts.length,label:'Depts'},
    ]:[]),
    ...(paTab==='dpt'&&!did?[{icon:'🏢',value:allDepts.length,label:'Depts'},{icon:'🏭',value:myPlantDepts.length,label:'In My Plant'}]:[]),
  ];

  // PA stat pills rendered inside orgPanelHTML via role check — skip separate bar
  return `<!-- PA Toolbar: tabs + search + inline context stats + zoom/controls ALL LEFT -->
<div style="background:#fff;border-radius:var(--rl) var(--rl) 0 0;border:1px solid var(--g100);border-bottom:none;display:flex;align-items:center;flex-wrap:wrap;gap:5px;padding:7px 12px;justify-content:flex-start">
  ${tabBtn('grp','⬡','Group View')}
  ${tabBtn('plt','🏭','Plant-wise')}
  ${tabBtn('dpt','🏢','Dept-wise')}
  <div style="width:1px;height:20px;background:var(--g200);flex-shrink:0"></div>

<!-- Row 2: Plant/Dept pill filter strip -->
${filterBar?`<div style="background:#fff;border:1px solid var(--g100);border-top:none;padding:6px 14px;display:flex;align-items:flex-start;gap:5px;flex-wrap:wrap;min-height:36px">${filterBar}</div>`:''}

${contextNote?contextNote+'<div style="height:10px"></div>':''}

<!-- Chart area -->
${employees.length===0
  ?`<div class="empty" style="margin-top:40px"><div class="ei">🌳</div><h3>No employees yet</h3></div>`
  : paTab==='plt'&&!(pid||myPid)
    ?`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px">

          return `<div class="card" style="padding:8px 10px;cursor:pointer;transition:all .2s;${isOwn?'border-color:var(--gold);':''}" onmouseover="this.style.boxShadow='var(--shadow)';this.style.transform='translateY(-2px)'" onmouseout="this.style.boxShadow='';this.style.transform=''" onclick="S._paPltId='${p.id}';render()">
            <div style="display:flex;align-items:center;gap:5px;margin-bottom:3px">
              <span style="font-size:13px">🏭</span>
              <div style="font-size:11px;font-weight:800;color:var(--navy);line-height:1.2">${p.name}${isOwn?` <span style="font-size:8px;background:rgba(245,166,35,.15);color:#B7791F;padding:1px 4px;border-radius:8px;font-weight:700">MY</span>`:''}</div>
            </div>
            ${p.location?`<div style="font-size:9px;color:var(--g400);margin-bottom:3px">📍 ${p.location}</div>`:''}
            <span class="badge bb" style="font-size:9px;padding:1px 6px">${cnt} emp${cnt!==1?'s':''}</span>
          </div>`;
        }).join('')}
      </div>`
    : paTab==='dpt'&&!did
      ?`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px">
          ${allDepts.length===0
            ?`<div class="empty" style="grid-column:1/-1"><div class="ei">🏢</div><h3>No departments found</h3></div>`
            :allDepts.map(d=>{
                const grpCnt=employees.filter(e=>(e.dept||'').toLowerCase()===d.toLowerCase()).length;
                const pltCnt=myPlantEmps.filter(e=>(e.dept||'').toLowerCase()===d.toLowerCase()).length;
                const dplants=[...new Set(employees.filter(e=>(e.dept||'').toLowerCase()===d.toLowerCase()).map(e=>e.plant).filter(Boolean))];
                const isInMyPlant=pltCnt>0;
                return `<div class="card" style="padding:14px 16px;cursor:pointer;transition:all .2s;${isInMyPlant?'border-left:3px solid var(--steel);':''}" onmouseover="this.style.boxShadow='var(--shadow)';this.style.transform='translateY(-2px)'" onmouseout="this.style.boxShadow='';this.style.transform=''" onclick="S._paDept='${d.replace(/'/g,"'")}';render()">
                  <div style="display:flex;align-items:center;gap:5px;margin-bottom:5px">
                    <span style="font-size:13px">🏢</span>
                    <div style="font-size:11px;font-weight:800;color:var(--navy);line-height:1.2;flex:1">${d}</div>
                    ${isInMyPlant?`<span class="badge" style="background:rgba(30,64,128,.1);color:var(--steel);font-size:8px;padding:1px 5px">MY</span>`:''}
                  </div>
                  <div style="display:flex;align-items:center;gap:3px;flex-wrap:wrap">
                    <span style="display:inline-flex;align-items:center;gap:2px;background:rgba(30,64,128,.08);border:1px solid rgba(30,64,128,.15);border-radius:20px;padding:1px 6px;font-size:9px;font-weight:700" title="In your plant">🏭 <span style="color:var(--steel)">${pltCnt}</span></span>
                    ${grpCnt!==pltCnt?`<span style="display:inline-flex;align-items:center;gap:2px;background:var(--g50);border:1px solid var(--g100);border-radius:20px;padding:1px 6px;font-size:9px;font-weight:600;color:var(--g400)" title="Total all plants">🌐 ${grpCnt}</span>`:''}
                  </div>
                  ${dplants.length>1?`<div style="display:flex;flex-wrap:wrap;gap:2px;margin-top:4px">${dplants.slice(0,3).map(pl=>`<span class="badge bg" style="font-size:8px;padding:1px 5px">${pl}</span>`).join('')}${dplants.length>3?`<span class="badge bb" style="font-size:8px;padding:1px 5px">+${dplants.length-3}</span>`:''}</div>`:''}
                </div>`;
              }).join('')}
        </div>`
      : tree
        ?(()=>{
            const paInlineStats=[
              {icon:'👥',value:activeEmps.length,label:paTab==='plt'?'In Plant':'In Dept'},
              {icon:'🏭',value:plants.length,label:'Plants'},
              {icon:'🏢',value:allDepts.length,label:'Depts'},
            ];
            return orgPanelHTML(tree,chartTitle,'pa',paInlineStats,paTab==='dpt');
          })()
        :`<div class="empty" style="margin-top:40px"><div class="ei">${paTab==='plt'?'🏭':'🏢'}</div><h3>Select a ${paTab==='plt'?'plant':'department'} to view its chart</h3></div>`
}`;
}

// ── Public View (no login) ───────────────────────────────────────
function publicViewHTML(){
  const {plants,employees}=S;
  // Tabs: 'grp' | 'plt' | 'dpt'
  const pubTab=S._pubTab||'grp';
  const pid=S.plantChartId||'';
  const did=S._pubDept||'';
  const sc=S.chartScale;

  // Collect all unique departments
  const allDepts=sortedDepts(employees);

  // Plant-view sub-mode: 'grp' | 'plt' | 'dpt'
  const plantView = S._pubPlantView||'grp'; // active only when pid is set
  const deptScope = S._pubDeptScope||'grp'; // kept for compat, not used in new flow

  let tree=null, chartTitle='Group', activeEmps=[];
  if(pubTab==='grp'){
    // If dept selected, show dept structure (scoped to plant if plant also selected)
    if(did){
      const grpPlant=plants.find(p=>p.id===pid);
      if(pid){
        activeEmps=employees.filter(e=>e.plantId===pid&&(e.dept||'').toLowerCase()===did.toLowerCase());
        chartTitle=`${did} · ${grpPlant?.name||'Plant'}`;
      } else {
        activeEmps=employees.filter(e=>(e.dept||'').toLowerCase()===did.toLowerCase());
        chartTitle=did+' · Group';
      }
      tree=buildTreeWithAncestors(activeEmps,employees);
    } else if(pid){
      // Plant selected but no dept — show plant structure
      const grpPlant=plants.find(p=>p.id===pid);
      activeEmps=employees.filter(e=>e.plantId===pid);
      chartTitle=grpPlant?.name||'Plant';
      tree=buildTreeWithAncestors(activeEmps,employees);
    } else {
      tree=buildTree(employees);
      chartTitle='Group';
      activeEmps=employees;
    }
  } else if(pubTab==='plt'){
    if(pid){
      const plant=plants.find(p=>p.id===pid);
      if(did){
        // Dept selected — always show dept structure scoped to plant (or group if grp view)
        if(plantView==='grp'){
          activeEmps=employees.filter(e=>(e.dept||'').toLowerCase()===did.toLowerCase());
          chartTitle=`${did} · Group`;
        } else {
          activeEmps=employees.filter(e=>e.plantId===pid&&(e.dept||'').toLowerCase()===did.toLowerCase());
          chartTitle=`${did} · ${plant?.name||'Plant'}`;
        }
      } else if(plantView==='grp'){
        // Full group tree, plant pill just highlights selection
        tree=buildTree(employees);
        chartTitle='Group';
        activeEmps=employees;
      } else {
        // Plant view
        activeEmps=employees.filter(e=>e.plantId===pid);
        chartTitle=plant?.name||'Plant';
      }
      if(!tree) tree=buildTreeWithAncestors(activeEmps,employees);
    }
  } else if(pubTab==='dpt'){
    if(did){
      const deptScope2=S._pubDeptScope||'grp';
      if(deptScope2==='plt'&&pid){
        activeEmps=employees.filter(e=>(e.dept||'').toLowerCase()===did.toLowerCase()&&e.plantId===pid);
        const plant=plants.find(p=>p.id===pid);
        chartTitle=`${did} · ${plant?.name||'Plant'}`;
      } else {
        activeEmps=employees.filter(e=>(e.dept||'').toLowerCase()===did.toLowerCase());
        chartTitle=did;
      }
      tree=buildTreeWithAncestors(activeEmps,employees);
    }
  }

  // Apply search highlighting
  const search=(S._pubSearch||'').toLowerCase().trim();
  if(search&&tree) highlightSearch(tree,search);

  // Tab button helper
  const tabBtn=(id,icon,label)=>`<button id="pub-tab-${id}" style="
    display:inline-flex;align-items:center;gap:6px;padding:9px 18px;
    border:none;border-bottom:3px solid ${pubTab===id?'var(--gold)':'transparent'};
    background:none;font-size:13px;font-weight:${pubTab===id?'700':'500'};
    color:${pubTab===id?'var(--navy)':'var(--g400)'};cursor:pointer;
    transition:all .15s;font-family:inherit;white-space:nowrap"
    onmouseover="if('${id}'!=='${pubTab}')this.style.color='var(--navy)'"
    onmouseout="if('${id}'!=='${pubTab}')this.style.color='var(--g400)'"
  >${icon} ${label}</button>`;

  // Pill filters for public view — always visible, all tabs, with wired sub-pills
  const pubPlantPills=plants.map(p=>{
    const active=p.id===pid&&pubTab==='plt';
    const pEmps=employees.filter(e=>e.plantId===p.id);
    const cnt=pEmps.length;
    const pDepts=[...new Set(pEmps.map(e=>e.dept).filter(Boolean))].length;
    const pFemale=pEmps.filter(e=>e.gender==='female').length;
    const pAway=pEmps.filter(e=>e.workingLocation&&e.workingLocation.trim()!=='').length;
    return `<div style="display:inline-flex;flex-direction:column;gap:3px;flex-shrink:0" onclick="S.plantChartId='${p.id.replace(/'/g,"\'")}';S._pubTab='plt';S._pubPlantView='plt';S._pubDept='';S.collapsed=new Set();render()">
      <button style="
        display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:20px;
        border:1.5px solid ${active?'var(--steel)':'var(--g200)'};
        background:${active?'var(--navy)':'#fff'};color:${active?'#fff':'var(--g600)'};
        font-size:11px;font-weight:${active?'700':'500'};cursor:pointer;transition:all .15s;white-space:nowrap;font-family:inherit">
        🏭 ${p.name} <span style="background:${active?'rgba(255,255,255,.2)':'var(--g100)'};border-radius:10px;padding:1px 6px;font-size:10px;font-weight:700">${cnt}</span>
      </button>
      <div style="display:flex;flex-wrap:nowrap;gap:3px;padding:0 4px">
        <span onclick="openPlantModal('plantDeptList','${p.id}',event)" style="display:inline-flex;align-items:center;gap:2px;background:rgba(30,64,128,.07);border:1px solid rgba(30,64,128,.12);border-radius:20px;padding:1px 6px;font-size:9px;font-weight:700;cursor:pointer;white-space:nowrap" title="${pDepts} Departments — click to view">🏢 <span style="color:var(--steel)">${pDepts}</span></span>
        ${pFemale>0?`<span onclick="openPlantModal('plantFemaleList','${p.id}',event)" style="display:inline-flex;align-items:center;gap:2px;background:rgba(190,24,93,.07);border:1px solid rgba(190,24,93,.15);border-radius:20px;padding:1px 6px;font-size:9px;font-weight:700;cursor:pointer;white-space:nowrap" title="${pFemale} Female — click to view">♀ <span style="color:#BE185D">${pFemale}</span></span>`:''}
        ${pAway>0?`<span onclick="openPlantModal('plantAwayList','${p.id}',event)" style="display:inline-flex;align-items:center;gap:2px;background:rgba(245,166,35,.1);border:1px solid rgba(245,166,35,.2);border-radius:20px;padding:1px 6px;font-size:9px;font-weight:700;cursor:pointer;white-space:nowrap" title="${pAway} Away — click to view">📍 <span style="color:#B7791F">${pAway}</span></span>`:''}
      </div>
    </div>`;
  }).join('');
  const pubDeptPills=allDepts.map(d=>{
    const cnt=employees.filter(e=>(e.dept||'').toLowerCase()===d.toLowerCase()).length;
    const active=(did||'').toLowerCase()===d.toLowerCase();
    return `<button onclick="S._pubDept='${d.replace(/'/g,"\'")}';S._pubDeptScope='grp';S.plantChartId='';S.collapsed=new Set();render()" style="
      display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;
      border:1.5px solid ${active?'var(--gold)':'var(--g200)'};
      background:${active?'var(--navy)':'#fff'};color:${active?'#fff':'var(--g600)'};
      font-size:11px;font-weight:${active?'700':'500'};cursor:pointer;transition:all .15s;white-space:nowrap;font-family:inherit">
      🏢 ${d} <span style="background:${active?'rgba(255,255,255,.2)':'var(--g100)'};border-radius:10px;padding:1px 5px;font-size:10px;font-weight:700">${cnt}</span>
    </button>`;
  }).join('');
  const filterBar=pubTab==='plt'
    ?`<div style="display:flex;gap:5px;flex-wrap:wrap;align-items:center;flex:1"><span style="font-size:10px;font-weight:700;color:var(--g400);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap">Plant:</span>${pubPlantPills||'<span style="font-size:12px;color:var(--g400)">No plants</span>'}</div>`
    :pubTab==='dpt'
    ?`<div style="display:flex;gap:5px;flex-wrap:wrap;align-items:center;flex:1"><span style="font-size:10px;font-weight:700;color:var(--g400);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap">Dept:</span>${pubDeptPills||'<span style="font-size:12px;color:var(--g400)">No departments</span>'}</div>`
    :'';

  // Context note — shown when using ancestor chain
  const contextNote=((pubTab==='plt'&&pid&&plantView!=='grp')||(pubTab==='dpt'&&did))
    ?`<div style="background:rgba(245,166,35,.08);border:1px solid rgba(245,166,35,.25);border-radius:8px;padding:8px 14px;font-size:11px;color:#92610a;display:flex;align-items:center;gap:7px">
        <span>🔗</span><span>Greyed cards show the complete reporting chain up to MD/Top level (outside this ${
          pubTab==='plt'&&plantView==='dpt'&&did?`${did} department in ${plants.find(p=>p.id===pid)?.name||'this plant'}`
          :pubTab==='plt'?'plant':'department'
        }, shown for context).</span>
      </div>`:'';

  return `<div style="min-height:100vh;display:flex;flex-direction:column;background:var(--off)">

    <!-- Public topbar -->
    <div style="background:var(--navy);padding:0 16px;height:auto;min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2);flex-wrap:wrap;padding-top:8px;padding-bottom:8px">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        ${S.companyLogo?`<div style="background:#fff;border-radius:8px;padding:4px 7px;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.2)"><img src="${S.companyLogo}" style="height:28px;max-width:90px;object-fit:contain;display:block" alt="Logo"/></div>`:''}
        <span style="color:#fff;font-size:16px;font-weight:800;white-space:nowrap">Organisation <span style="color:var(--gold)">Structure</span></span>
        <span style="color:rgba(255,255,255,.45);font-size:12px;white-space:nowrap">${S.companyName||'Organisation'}</span>
      </div>

function renderNoChart(){
  return `<div class="empty" style="margin-top:60px"><div class="ei">🏭</div><h3>Select a plant to view its chart</h3></div>`;
}

function highlightSearch(node, search){
  // mark nodes matching search; return true if this node or any descendant matches
  const matches=v=>v&&v.toLowerCase().includes(search);
  const selfMatch=matches(node.name)||matches(node.designation)||matches(node.dept)||matches(node.empCode);
  let childMatch=false;
  (node.children||[]).forEach(c=>{ if(highlightSearch(c,search)) childMatch=true; });
  node._highlight=selfMatch;
  // Auto-expand any collapsed node whose subtree contains a match
  if(childMatch) S.collapsed.delete(node.id);
  return selfMatch||childMatch;
}

function bindPublicView(){
  updateHamburger(); // public view has no sidebar, hide hamburger
  // Bind modal close buttons (for dept/female/away drilldown modals)
  bindModal();
  // Draw admin reporting lines on public canvas
  try{ applyLevelLayout('pub-canvas'); }catch(err){ console.warn('[levels] pub layout',err); }
  try{ attachStickyHScroll('pub-canvas'); }catch(err){ console.warn('[hscroll] pub',err); }
  requestAnimationFrame(()=>{ drawAdminLines('pub'); });
  // detail overlay close
  $('det-overlay')?.addEventListener('click',e=>{ if(e.target.id==='det-overlay'){ S.detailPerson=null; render(); }});
  $('det-close')?.addEventListener('click',()=>{ S.detailPerson=null; render(); });
  $('det-close-btn')?.addEventListener('click',()=>{ S.detailPerson=null; render(); });

  // Tab switching
  ['grp','plt','dpt'].forEach(id=>{
    document.getElementById(`pub-tab-${id}`)?.addEventListener('click',()=>{
      S._pubTab=id;
      // reset sub-filters on tab change
      if(id==='grp'){ S._pubPlantView='grp'; }
      else if(id==='plt'){ S._pubPlantView='plt'; }
      else if(id==='dpt'){ S._pubDeptScope='grp'; }
      S._pubSearch='';
      S.collapsed=new Set();
      render();
    });
  });

  // org card clicks
  document.querySelectorAll('[data-pid]').forEach(card=>{
    card.addEventListener('click',e=>{
      if(e.target.classList.contains('ocol')||e.target.closest?.('.ocol')) return;
      S.detailPerson=S.employees.find(x=>x.id===card.dataset.pid)||null;
      render();
    });
  });
  // collapse individual
  document.querySelectorAll('[data-colid]').forEach(btn=>{
    btn.addEventListener('click',e=>{
      e.stopPropagation();
      const id=btn.dataset.colid;
      S.collapsed.has(id)?S.collapsed.delete(id):S.collapsed.add(id);
      renderDeferred();
    });
  });

  // pub-plant-filter / pub-dept-filter removed — now pill buttons

  // search — only fire on Enter; clear on Escape
  $('pub-search')?.addEventListener('keydown',e=>{
    if(e.key==='Enter'){
      const val=e.target.value;
      S._pubSearch=val;
      render();
      requestAnimationFrame(()=>{ const inp=$('pub-search'); if(inp){ inp.focus(); inp.value=val; } });
    } else if(e.key==='Escape'){
      e.target.value=''; S._pubSearch=''; render();
    }
  });
  $('pub-search-btn')?.addEventListener('click',()=>{
    const inp=$('pub-search'); if(!inp) return;
    S._pubSearch=inp.value; render();
    requestAnimationFrame(()=>{ inp.focus(); });
  });

  // zoom
  $('pub-zi')?.addEventListener('click',()=>{ S.chartScale=Math.min(S.chartScale+0.1,2.5); render(); });
  $('pub-zo')?.addEventListener('click',()=>{ S.chartScale=Math.max(S.chartScale-0.1,0.3); render(); });
  $('pub-zr')?.addEventListener('click',()=>{ S.chartScale=1; render(); });
  $('pub-expand-all')?.addEventListener('click',()=>{ S.collapsed.clear(); render(); });
  $('pub-collapse-all')?.addEventListener('click',()=>{ document.querySelectorAll('[data-colid]').forEach(btn=>S.collapsed.add(btn.dataset.colid)); render(); });
  $('pub-toggle-photo')?.addEventListener('click',()=>{ S.showPhoto=!S.showPhoto; render(); });

  // Dept pill delegated handler (data-setdept)
  document.querySelectorAll('.pub-dept-pill').forEach(btn=>{
    btn.addEventListener('click',()=>{ S._pubDept=btn.dataset.setdept||''; S.collapsed=new Set(); render(); });
  });

  // PDF export
  $('pub-pdf')?.addEventListener('click',async()=>{
    const canvas=$('pub-canvas'); if(!canvas) return;
    const btn=$('pub-pdf'); btn.textContent='Exporting…'; btn.disabled=true;
    try{
      const pubTab=S._pubTab||'grp';
      let subtitle='Group Organisation Chart';
      if(pubTab==='plt'&&S.plantChartId){
        const plant=S.plants.find(p=>p.id===S.plantChartId);
        subtitle=(plant?.name||'Plant')+' — Organisation Chart';
      } else if(pubTab==='dpt'&&S._pubDept){
        subtitle=S._pubDept+' — Department Chart';
      }
      const companyName=S.companyName||'OrgChart';
      const fname=`${companyName.replace(/\s+/g,'_')}_${subtitle.replace(/[^a-zA-Z0-9]/g,'_')}_${new Date().toLocaleDateString('en-IN').replace(/\//g,'-')}.pdf`;
      await buildPDF(canvas, fname, subtitle);
      toast('PDF exported','ok');
    } catch(e){ toast('Export failed','er'); }
    btn.textContent='⬇ PDF'; btn.disabled=false;
  });

  // Excel export — routes to correct export key based on active tab
  $('pub-xlsx')?.addEventListener('click',()=>{
    const pubTab=S._pubTab||'grp';
    if(pubTab==='plt') exportXLSX('plt');
    else if(pubTab==='dpt') exportXLSX('dpt');
    else exportXLSX('grp');
  });
}

// ── Modals ───────────────────────────────────────────────────────
function modalHTML(){
  const m=S.modal; if(!m) return '';
  if(m.type==='plant') return plantModalHTML(m.data);
  if(m.type==='employee') return employeeModalHTML(m.data);
  if(m.type==='admin') return adminModalHTML(null);
  if(m.type==='admin-edit') return adminModalHTML(m.data);
  if(m.type==='bulk') return bulkModalHTML();
  if(m.type==='changePassword') return changePasswordModalHTML();
  if(m.type==='otherLocations') return otherLocationsModalHTML();
  if(m.type==='femaleEmployees') return femaleEmployeesModalHTML();
  if(m.type==='paStaffList') return paStaffListModalHTML(m.data);
  if(m.type==='paDeptList') return paDeptListModalHTML(m.data);
  if(m.type==='paOtherLoc') return paOtherLocModalHTML(m.data);
  if(m.type==='paFemale') return paFemaleModalHTML(m.data);
  if(m.type==='paTopLevel') return paTopLevelModalHTML(m.data);
  if(m.type==='paPhotos') return paPhotosModalHTML(m.data);
  if(m.type==='saPlants') return saPlantsModalHTML();
  if(m.type==='saEmployees') return saEmployeesModalHTML();
  if(m.type==='saAdmins') return saAdminsModalHTML();
  if(m.type==='saActivePlants') return saActivePlantsModalHTML();
  if(m.type==='vacantPositions') return vacantPositionsModalHTML();
  if(m.type==='dualReporters') return dualReportersModalHTML();
  if(m.type==='plantDeptList') return plantDeptListModalHTML(m.data);
  if(m.type==='plantFemaleList') return plantFemaleListModalHTML(m.data);
  if(m.type==='plantAwayList') return plantAwayListModalHTML(m.data);
  return '';
}

function plantDeptListModalHTML(pid){
  const plant=S.plants.find(p=>p.id===pid);
  const emps=S.employees.filter(e=>e.plantId===pid);
  const depts=[...new Set(emps.map(e=>e.dept).filter(Boolean))].sort();
  const body=depts.length===0
    ?`<div class="empty" style="padding:30px"><div class="ei">🏢</div><h3>No departments found</h3></div>`
    :depts.map(d=>{
        const grp=emps.filter(e=>(e.dept||'').toLowerCase()===d.toLowerCase());
        return `<div style="margin-bottom:16px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--g100)">
          <span style="font-size:15px">🏢</span>
          <span style="font-size:13px;font-weight:800;color:var(--navy)">${d}</span>
          <span class="badge bb" style="font-size:10px">${grp.length} emp${grp.length!==1?'s':''}</span>
        </div>${_empTableRows(grp)}</div>`;
      }).join('');
  return _paModalShell(`🏢 Departments — ${plant?.name||'Plant'}`,`${depts.length} department${depts.length!==1?'s':''} · ${emps.length} employees total`,body);
}
function plantFemaleListModalHTML(pid){
  const plant=S.plants.find(p=>p.id===pid);
  const emps=S.employees.filter(e=>e.plantId===pid&&e.gender==='female').sort((a,b)=>a.name.localeCompare(b.name));
  return _paModalShell(`♀ Female Employees — ${plant?.name||'Plant'}`,`${emps.length} female employee${emps.length!==1?'s':''}`,_empTableRows(emps,'Contact'));
}
function plantAwayListModalHTML(pid){
  const plant=S.plants.find(p=>p.id===pid);
  const emps=S.employees.filter(e=>e.plantId===pid&&e.workingLocation&&e.workingLocation.trim()!=='');
  const groups={};
  emps.forEach(e=>{ const l=(e.workingLocation||'').trim(); if(!groups[l]) groups[l]=[]; groups[l].push(e); });
  const body=emps.length===0
    ?`<div class="empty" style="padding:30px"><div class="ei">📍</div><h3>No employees at other locations</h3></div>`
    :Object.keys(groups).sort().map(loc=>`<div style="margin-bottom:16px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--g100)">
        <span style="font-size:15px">📍</span>
        <span style="font-size:13px;font-weight:800;color:var(--navy)">${loc}</span>
        <span class="badge" style="background:rgba(245,166,35,.12);color:#B7791F;font-size:10px">${groups[loc].length} emp</span>
      </div>${_empTableRows(groups[loc],'Working At')}</div>`).join('');
  return _paModalShell(`📍 Away — ${plant?.name||'Plant'}`,`${emps.length} employee${emps.length!==1?'s':''} working outside home plant`,body);
}

function vacantPositionsModalHTML(){
  const emps=S.employees.filter(e=>isVacantPosition(e)).sort((a,b)=>{
    const pa=S.plants.find(p=>p.id===a.plantId)?.name||a.plant||'';
    const pb=S.plants.find(p=>p.id===b.plantId)?.name||b.plant||'';
    return pa.localeCompare(pb)||((a.dept||'').localeCompare(b.dept||'')||((a.designation||'').localeCompare(b.designation||'')));
  });
  // Group by plant
  const plantIds=[...new Set(emps.map(e=>e.plantId||'__none__'))];
  const body=emps.length===0
    ?`<div style="padding:40px 20px;text-align:center"><div style="font-size:36px;margin-bottom:10px">✅</div><h3 style="color:var(--navy);margin-bottom:6px">All Positions Filled</h3><p style="font-size:12px;color:var(--g400)">No vacant positions found in the system.</p></div>`
    :plantIds.map(pid=>{
        const plant=S.plants.find(p=>p.id===pid);
        const plantName=plant?.name||(pid==='__none__'?'Unassigned':'Unknown Plant');
        const grp=emps.filter(e=>(e.plantId||'__none__')===pid);
        return `<div style="margin-bottom:20px">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;padding:8px 12px;background:rgba(255,68,68,.06);border:1px solid rgba(255,68,68,.2);border-radius:8px">
            <span style="font-size:15px">🏭</span>
            <span style="font-size:13px;font-weight:800;color:var(--navy)">${plantName}</span>
            <span style="background:rgba(255,68,68,.15);color:#CC0000;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px">${grp.length} vacant</span>
          </div>
          <table style="width:100%;border-collapse:collapse">
            <thead><tr>
              <th style="background:var(--g50);font-size:10px;font-weight:700;color:var(--g600);text-transform:uppercase;letter-spacing:.06em;padding:7px 12px;text-align:left">#</th>
              <th style="background:var(--g50);font-size:10px;font-weight:700;color:var(--g600);text-transform:uppercase;letter-spacing:.06em;padding:7px 12px;text-align:left">Designation</th>
              <th style="background:var(--g50);font-size:10px;font-weight:700;color:var(--g600);text-transform:uppercase;letter-spacing:.06em;padding:7px 12px;text-align:left">Department</th>
              <th style="background:var(--g50);font-size:10px;font-weight:700;color:var(--g600);text-transform:uppercase;letter-spacing:.06em;padding:7px 12px;text-align:left">Plant</th>
              <th style="background:var(--g50);font-size:10px;font-weight:700;color:var(--g600);text-transform:uppercase;letter-spacing:.06em;padding:7px 12px;text-align:left">Reports To</th>
            </tr></thead>
            <tbody>${grp.map((e,i)=>{
              const boss=S.employees.find(x=>x.id===e.parentId);
              return `<tr class="sa-stat-emp-row" style="cursor:pointer" data-id="${e.id}" title="Click to view profile">
                <td style="padding:8px 12px;border-bottom:1px solid var(--g100);font-size:11px;color:var(--g400);font-weight:600">${i+1}</td>
                <td style="padding:8px 12px;border-bottom:1px solid var(--g100)">
                  <div style="display:flex;align-items:center;gap:7px">
                    <div style="width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#FF4444,#CC0000);display:flex;align-items:center;justify-content:center;color:#fff;font-size:9px;font-weight:800;flex-shrink:0">⚠</div>
                    <div>
                      <div style="font-weight:700;font-size:12px;color:#CC0000;font-style:italic">${e.designation||e.name||'—'}</div>
                      ${e.empCode?`<div style="font-size:10px;color:var(--g400)">${e.empCode}</div>`:''}
                    </div>
                  </div>
                </td>
                <td style="padding:8px 12px;border-bottom:1px solid var(--g100);font-size:12px;color:var(--g600)">${e.dept||'—'}</td>
                <td style="padding:8px 12px;border-bottom:1px solid var(--g100)"><span style="background:rgba(245,166,35,.12);color:#B7791F;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px">${plantName}</span></td>
                <td style="padding:8px 12px;border-bottom:1px solid var(--g100);font-size:12px">
                  ${boss?`<div style="font-weight:600;color:var(--navy)">${boss.name}</div><div style="font-size:10px;color:var(--g400)">${boss.designation||''}</div>`:'<span style="color:var(--g400)">—</span>'}
                </td>
              </tr>`;
            }).join('')}</tbody>
          </table>
        </div>`;
      }).join('');
  return `<div class="overlay" id="m-overlay">
  <div class="modal" style="max-width:720px">
    <div class="mh" style="background:linear-gradient(135deg,#fff5f5,#fff);border-bottom:1px solid rgba(255,68,68,.2)">
      <div>
        <h3 style="color:#CC0000">🔴 Vacant Positions</h3>
        <div style="font-size:12px;color:var(--g400);margin-top:2px">${emps.length} position${emps.length!==1?'s':''} requiring immediate hiring attention</div>
      </div>
      <button class="btn bo bic" id="m-close">✕</button>
    </div>
    <div class="mb" style="padding:16px 22px;max-height:65vh;overflow-y:auto">${body}</div>
    <div class="mf"><button class="btn bo" id="m-cancel">Close</button></div>
  </div>
</div>`;
}

function dualReportersModalHTML(){
  const emps=S.employees.filter(e=>e.adminParentId).sort((a,b)=>a.name.localeCompare(b.name));
  const adminTypeMap={administrative:'Administrative',functional:'Functional','dotted-line':'Dotted-line',matrix:'Matrix'};
  return `<div class="overlay" id="m-overlay">
  <div class="modal" style="max-width:660px">
    <div class="mh">
      <div>
        <h3>🔶 Dual Reporting Employees</h3>
        <div style="font-size:12px;color:var(--g400);margin-top:2px">${emps.length} employee${emps.length!==1?'s':''} with administrative / dotted-line reporting</div>
      </div>
      <button class="btn bo bic" id="m-close">✕</button>
    </div>
    <div class="mb" style="padding:16px 22px">
      ${emps.length===0
        ?`<div class="empty" style="padding:40px 20px"><div class="ei">🔶</div><h3>No dual reporting configured</h3><p style="font-size:12px;color:var(--g400)">Edit any employee and set an "Admin Reports To" to configure dual reporting.</p></div>`
        :`<table style="width:100%;border-collapse:collapse">
          <thead><tr>
            <th style="background:var(--g50);font-size:10px;font-weight:700;color:var(--g600);text-transform:uppercase;letter-spacing:.06em;padding:7px 12px;text-align:left">Employee</th>
            <th style="background:var(--g50);font-size:10px;font-weight:700;color:var(--g600);text-transform:uppercase;letter-spacing:.06em;padding:7px 12px;text-align:left">Functional Boss</th>
            <th style="background:var(--g50);font-size:10px;font-weight:700;color:var(--g600);text-transform:uppercase;letter-spacing:.06em;padding:7px 12px;text-align:left">Admin / Dotted-line Boss</th>
            <th style="background:var(--g50);font-size:10px;font-weight:700;color:var(--g600);text-transform:uppercase;letter-spacing:.06em;padding:7px 12px;text-align:left">Type</th>
          </tr></thead>
          <tbody>${emps.map(e=>{
            const functionalBoss = S.employees.find(x=>x.id===e.parentId);
            const adminBoss = S.employees.find(x=>x.id===e.adminParentId);
            const typeLabel = adminTypeMap[e.adminReportingType]||'Administrative';
            const typeColor = e.adminReportingType==='functional'?'var(--steel)':e.adminReportingType==='matrix'?'var(--err)':'#B7791F';
            return `<tr class="sa-stat-emp-row" style="cursor:pointer" data-id="${e.id}">
              <td style="padding:9px 12px;border-bottom:1px solid var(--g100)">
                <div style="display:flex;align-items:center;gap:8px">
                  ${avatarThumb(e)}
                  <div>
                    <div style="font-weight:600;font-size:13px;color:var(--navy)">${e.name}</div>
                    <div style="font-size:10px;color:var(--g400)">${e.designation}${e.plant?' · '+e.plant:''}</div>
                  </div>
                </div>
              </td>
              <td style="padding:9px 12px;border-bottom:1px solid var(--g100);font-size:12px">
                ${functionalBoss
                  ?`<div style="font-weight:600;color:var(--navy)">${functionalBoss.name}</div><div style="font-size:10px;color:var(--g400)">${functionalBoss.designation}</div>`
                  :'<span style="color:var(--g400)">—</span>'}
              </td>
              <td style="padding:9px 12px;border-bottom:1px solid var(--g100);font-size:12px">
                ${adminBoss
                  ?`<div style="font-weight:600;color:var(--navy)">${adminBoss.name}</div><div style="font-size:10px;color:var(--g400)">${adminBoss.designation}${adminBoss.plant?' · '+adminBoss.plant:''}</div>`
                  :'<span style="color:var(--g400)">—</span>'}
              </td>
              <td style="padding:9px 12px;border-bottom:1px solid var(--g100)">
                <span style="background:rgba(245,166,35,.12);color:${typeColor};font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap">${typeLabel}</span>
              </td>
            </tr>`;
          }).join('')}</tbody>
        </table>`}
    </div>
    <div class="mf"><button class="btn bo" id="m-cancel">Close</button></div>
  </div>
</div>`;
}

function otherLocationsModalHTML(){
  const emps=S.employees.filter(e=>e.workingLocation&&e.workingLocation.trim()!=='');
  // Group by working location
  const groups={};
  emps.forEach(e=>{
    const loc=(e.workingLocation||'').trim();
    if(!groups[loc]) groups[loc]=[];
    groups[loc].push(e);
  });
  const locKeys=Object.keys(groups).sort();
  return `<div class="overlay" id="m-overlay">
  <div class="modal" style="max-width:600px">
    <div class="mh">
      <div>
        <h3>📍 Employees at Other Locations</h3>
        <div style="font-size:12px;color:var(--g400);margin-top:2px">${emps.length} employee${emps.length!==1?'s':''} currently working outside their home plant</div>
      </div>
      <button class="btn bo bic" id="m-close">✕</button>
    </div>
    <div class="mb" style="padding:16px 22px">
      ${emps.length===0
        ?`<div class="empty" style="padding:40px 20px"><div class="ei">📍</div><h3>No employees at other locations</h3><p style="font-size:12px;color:var(--g400)">Employees with a "Working Location" set will appear here.</p></div>`
        :locKeys.map(loc=>`
          <div style="margin-bottom:20px">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--g100)">
              <span style="font-size:16px">📍</span>
              <span style="font-size:14px;font-weight:800;color:var(--navy)">${loc}</span>
              <span class="badge" style="background:rgba(245,166,35,.12);color:#B7791F;font-size:11px">${groups[loc].length} employee${groups[loc].length!==1?'s':''}</span>
            </div>
            <table style="width:100%;border-collapse:collapse">
              <thead><tr>
                <th style="background:var(--g50);font-size:10px;font-weight:700;color:var(--g600);text-transform:uppercase;letter-spacing:.06em;padding:7px 12px;text-align:left">Employee</th>
                <th style="background:var(--g50);font-size:10px;font-weight:700;color:var(--g600);text-transform:uppercase;letter-spacing:.06em;padding:7px 12px;text-align:left">Designation</th>
                <th style="background:var(--g50);font-size:10px;font-weight:700;color:var(--g600);text-transform:uppercase;letter-spacing:.06em;padding:7px 12px;text-align:left">Home Plant</th>
                <th style="background:var(--g50);font-size:10px;font-weight:700;color:var(--g600);text-transform:uppercase;letter-spacing:.06em;padding:7px 12px;text-align:left">Dept</th>
              </tr></thead>
              <tbody>
                ${groups[loc].map(e=>`<tr style="cursor:pointer" class="otherloc-emp-row" data-id="${e.id}" title="Click to view profile">
                  <td style="padding:9px 12px;border-bottom:1px solid var(--g100)">
                    <div style="display:flex;align-items:center;gap:8px">
                      ${e.photoURL
                        ?`<img src="${e.photoURL}" style="width:28px;height:28px;border-radius:50%;object-fit:cover;flex-shrink:0"/>`
                        :`<div style="width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--steel),var(--navy));display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:700;flex-shrink:0">${(e.name||'?').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2)}</div>`}
                      <span style="font-weight:600;font-size:13px;color:var(--navy)">${e.name}</span>
                      ${e.empCode?`<span style="font-size:10px;color:var(--g400)">${e.empCode}</span>`:''}
                    </div>
                  </td>
                  <td style="padding:9px 12px;border-bottom:1px solid var(--g100);font-size:12px;color:var(--g600)">${e.designation||'—'}</td>
                  <td style="padding:9px 12px;border-bottom:1px solid var(--g100)"><span class="badge bg" style="font-size:10px">${e.plant||'—'}</span></td>
                  <td style="padding:9px 12px;border-bottom:1px solid var(--g100);font-size:12px;color:var(--g400)">${e.dept||'—'}</td>
                </tr>`).join('')}
              </tbody>
            </table>
          </div>`).join('')}
    </div>
    <div class="mf">
      <button class="btn bo" id="m-cancel">Close</button>
    </div>
  </div>
</div>`;
}

// ── SA dashboard stat modals ────────────────────────────────────
function saPlantsModalHTML(){
  const plants=S.plants;
  return `<div class="overlay" id="m-overlay">
  <div class="modal" style="max-width:620px">

function _adminPlantCbToggle(cb){
  // Called when a plant checkbox is toggled — updates label border/bg
  var lbl=cb.closest('.plant-cb-label');
  if(!lbl) return;
  lbl.style.borderColor = cb.checked ? '#1E4080' : '#CDD5E0';
  lbl.style.background  = cb.checked ? 'rgba(30,64,128,.05)' : '#fff';
}
function adminModalHTML(editUser){
  // editUser = existing user object when editing, null when creating
  const isEdit = !!editUser;
  const existingIds = isEdit
    ? (Array.isArray(editUser.plantIds)&&editUser.plantIds.length ? editUser.plantIds : (editUser.plantId?[editUser.plantId]:[]))
    : [];
  const plantCheckboxes = S.plants.map(p=>{
    const checked = existingIds.includes(p.id);
    const borderCol = checked ? '#1E4080' : '#CDD5E0';
    const bgCol = checked ? 'rgba(30,64,128,.05)' : '#fff';
    const locHtml = p.location ? '<span style="font-size:11px;color:#8494AA;margin-left:auto">&#128205; '+p.location+'</span>' : '';

      +'<input type="checkbox" id="cb-plant-'+p.id+'" value="'+p.id+'" '+(checked?'checked':'')+' onchange="_adminPlantCbToggle(this)" style="width:15px;height:15px;accent-color:#1E4080;cursor:pointer"/>'
      +'<span style="font-size:13px;font-weight:600;color:#0F1F3D">'+p.name+'</span>'

      +'</label>';
  }).join('');
  const emailField = isEdit
    ? '<div class="fg"><label class="lbl">Email</label><input class="inp" id="m-email" type="email" value="'+(editUser.email||'')+'" disabled style="background:#F0F4FA;color:#8494AA"/><div style="font-size:11px;color:#8494AA;margin-top:4px">&#9888; Email cannot be changed after creation.</div></div>'
    : '<div class="fg"><label class="lbl">Email *</label><input class="inp" id="m-email" type="email" placeholder="admin@company.com"/></div><div class="fg"><label class="lbl">Password *</label><input class="inp" id="m-pass" type="password" placeholder="Min. 6 characters"/></div>';
  return '<div class="overlay" id="m-overlay">'
    +'<div class="modal" style="max-width:460px">'
    +'<div class="mh"><h3>'+(isEdit?'&#9998; Edit Plant Admin':'Create Plant Admin')+'</h3><button class="btn bo bic" id="m-close">&#x2715;</button></div>'
    +'<div class="mb">'
    +'<div class="fg"><label class="lbl">Full Name *</label><input class="inp" id="m-name" placeholder="Admin Name" value="'+(isEdit?(editUser.name||''):'')+'"/></div>'
    +emailField
    +'<input type="hidden" id="m-edit-uid" value="'+(isEdit?(editUser.id||''):'')+'" />'
    +'<div class="fg"><label class="lbl">Assign to Plants * <span style="font-weight:400;text-transform:none;letter-spacing:0;color:#8494AA">(select one or more)</span></label>'
    +'<div style="max-height:220px;overflow-y:auto;padding-right:4px">'+(S.plants.length?plantCheckboxes:'<div style="color:#8494AA;font-size:12px;padding:10px">No plants found — add plants first.</div>')+'</div></div>'
    +'<div id="m-err" style="display:none;color:#EF4444;font-size:12px;margin-top:4px"></div>'
    +'</div>'
    +'<div class="mf"><button class="btn bo" id="m-cancel">Cancel</button><button class="btn bp" id="m-save">'+(isEdit?'Save Changes':'Create Admin')+'</button></div>'
    +'</div></div>';
}

function detailOverlayHTML(){
  const p=S.detailPerson;
  // Gender-based colours for the header
  const gHdr = p.gender==='female' ? 'linear-gradient(135deg,#9D174D,#BE185D)'
             : p.gender==='other'  ? 'linear-gradient(135deg,#4C1D95,#7C3AED)'
             : p.gender==='male'   ? 'linear-gradient(135deg,#0F1F3D,#1E4080)'
             :                       'linear-gradient(135deg,var(--navy),var(--steel))';
  const gAvBg = p.gender==='female' ? 'linear-gradient(135deg,#BE185D,#9D174D)'
              : p.gender==='other'  ? 'linear-gradient(135deg,#7C3AED,#4C1D95)'
              : p.gender==='male'   ? 'linear-gradient(135deg,#1E4080,#0F1F3D)'
              :                       'linear-gradient(135deg,var(--steel),var(--navy))';
  const av=p.photoURL
    ?`<img src="${p.photoURL}" style="width:64px;height:64px;border-radius:50%;object-fit:cover;border:3px solid rgba(255,255,255,.3);display:block;margin:0 auto 10px">`
    :`<div style="width:64px;height:64px;border-radius:50%;background:${gAvBg};display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;font-weight:800;margin:0 auto 10px;border:3px solid rgba(255,255,255,.25)">${ini(p.name)}</div>`;
  // Find who this person reports to (functional)
  const reportsTo=S.employees.find(e=>e.id===p.parentId);
  // Find admin/dotted-line boss
  const adminReportsTo=p.adminParentId?S.employees.find(e=>e.id===p.adminParentId):null;
  // Find direct reports (functional)
  const reports=S.employees.filter(e=>e.parentId===p.id);
  // Find admin direct reports (people who list this person as their admin boss)
  const adminDirectReports=S.employees.filter(e=>e.adminParentId===p.id);
  // Admin type label
  const adminTypeMap={administrative:'Administrative',functional:'Functional','dotted-line':'Dotted-line',matrix:'Matrix'};
  const adminTypeLabel=adminTypeMap[p.adminReportingType]||'Administrative';
  // Super-admin can edit anyone; plant-admin can only edit employees in their own plant
  const canEdit=S.profile&&(
    S.profile.role==='super-admin'||

function genderAvBg(gender){
  if(gender==='female') return 'linear-gradient(135deg,#BE185D,#9D174D)';
  if(gender==='male')   return 'linear-gradient(135deg,#1E4080,#0F1F3D)';
  if(gender==='other')  return 'linear-gradient(135deg,#6D28D9,#4C1D95)';
  return 'linear-gradient(135deg,#475569,#1E293B)'; // no gender set
}
function genderBorderColor(gender){
  if(gender==='female') return '#FBCFE8'; // pink-200
  if(gender==='male')   return '#BFDBFE'; // blue-200
  if(gender==='other')  return '#DDD6FE'; // violet-200
  return 'var(--g100)';
}

// ── Vacant checkbox in Employee modal ─────────────────────────────
// Checking "Vacant position" auto-fills Full Name with "Vacant"
// (remembering whatever was typed); unchecking restores it.
function onVacantToggle(checked){
  const w=document.getElementById('m-vacant-wrap');
  const t=document.getElementById('m-vacant-title');
  const n=document.getElementById('m-name');
  if(w){ w.style.borderColor=checked?'rgba(255,68,68,.5)':'var(--g200)'; w.style.background=checked?'rgba(255,68,68,.05)':'#fff'; }
  if(t) t.style.color=checked?'#CC0000':'var(--navy)';
  if(!n) return;
  if(checked){
    const cur=n.value.trim();
    if(cur.toLowerCase()!=='vacant'){ n.dataset.prevName=n.value; n.value='Vacant'; }
  }else if(n.value.trim().toLowerCase()==='vacant'){
    n.value=n.dataset.prevName||'';
    delete n.dataset.prevName;
    n.focus();
  }
  n.dispatchEvent(new Event('input',{bubbles:true}));
}

// ── Vacant Position Detection ─────────────────────────────────────
// A position is considered vacant when:
//   1. Employee has isVacant===true flag (explicit), OR
//   2. Name contains keywords like 'vacant', 'open', 'tbd', 'vacancy'
function isVacantPosition(emp){
  if(!emp) return false;
  if(emp.isVacant===true) return true;
  const n=(emp.name||'').toLowerCase().trim();
  return n==='vacant'||n.startsWith('vacant ')||n.endsWith(' vacant')
    ||n==='open position'||n==='vacancy'||n==='tbd'||n==='to be decided'
    ||n.includes('(vacant)')||n.includes('[vacant]')
    ||emp.status==='vacant'||emp.status==='open';
}

// ── Administrative Reporting Lines (SVG dashed overlay) ──────────
// Draws dashed orange lines from each employee card to their admin boss card.
// Called after every render so coordinates are always fresh.
function drawAdminLines(chartKey){
  const svg = document.getElementById('admin-lines-svg-'+chartKey);
  if(!svg) return;
  svg.innerHTML = '';

  const dualReporters = S.employees.filter(e=>e.adminParentId);
  if(!dualReporters.length) return;

  // Public view uses id="pub-canvas"; all admin panels use id="oc-{key}"
  const canvas = document.getElementById(chartKey === 'pub' ? 'pub-canvas' : 'oc-'+chartKey);
  if(!canvas) return;
  const canvasRect = canvas.getBoundingClientRect();
  const scale = parseFloat(((canvas.style.transform||'scale(1)').replace('scale(','').replace(')','')))||1;
  const PAD = 5;

  // ── All node boxes in canvas-space ───────────────────────────────
  const allCards = Array.from(canvas.querySelectorAll('.ocard'));
  const boxes = allCards.map(el=>{
    const r = el.getBoundingClientRect();
    return {
      l:(r.left  -canvasRect.left)/scale - PAD,
      r:(r.right -canvasRect.left)/scale + PAD,
      t:(r.top   -canvasRect.top )/scale - PAD,
      b:(r.bottom-canvasRect.top )/scale + PAD,
    };
  });

  function hBlocked(y, xa, xb, excl){
    const x0=Math.min(xa,xb), x1=Math.max(xa,xb);
    return boxes.some((b,i)=> !excl.has(i) && y>b.t && y<b.b && x1>b.l && x0<b.r);
  }
  function vBlocked(x, ya, yb, excl){
    const y0=Math.min(ya,yb), y1=Math.max(ya,yb);
    return boxes.some((b,i)=> !excl.has(i) && x>b.l && x<b.r && y1>b.t && y0<b.b);
  }
  function findHLane(seedY, xa, xb, excl, dir){
    const STEP=5, MAX=400;
    for(let d=0; d<=MAX; d+=STEP){
      if(!hBlocked(seedY+dir*d, xa, xb, excl)) return seedY+dir*d;
      if(d>0 && !hBlocked(seedY-dir*d, xa, xb, excl)) return seedY-dir*d;
    }
    return seedY;
  }

  // ── Route FROM→TO ─────────────────────────────────────────────────
  //
  // RULE: if source (employee) is to the RIGHT of target (admin parent)
  //         → exit LEFT of source, enter RIGHT of target
  //       if source is to the LEFT of target
  //         → exit RIGHT of source, enter LEFT of target
  //
  // PREFERRED path (direct, 1 turn):
  //   If fY and tY are close enough AND the direct horizontal is clear
  //   → single elbow: source-edge → horizontal → target-edge  (3 points, 1 turn)
  //
  // FALLBACK (2 turns, avoid obstacles):
  //   source-edge → short vertical to gap lane hy → horizontal to target-edge → short vertical to tY

  function route(fL, fR, fCX, fTop, fBot, fY,
                 tL, tR, tCX, tTop, tBot, tY,
                 excl, laneIdx){
    const nudge = laneIdx * 10;

    // Source is RIGHT of target → exit left, enter right; else exit right, enter left
    const srcIsRight = fCX > tCX;
    const x1 = srcIsRight ? fL : fR;   // exit edge of source
    const x2 = srcIsRight ? tR : tL;   // entry edge of target (facing source)

    // ── Option 1: direct single-bend path ────────────────────────────
    // Try connecting at fY directly — horizontal stub from x1 to x2 at fY,
    // then vertical stub from fY to tY at x2.
    // Both segments must be obstacle-free.
    const directHClear = !hBlocked(fY, x1, x2, excl);
    const directVClear = !vBlocked(x2, fY, tY, excl);
    if(directHClear && directVClear){
      // Perfect direct L-path
      const pts = [[x1,fY],[x2,fY],[x2,tY]];
      const clean = pts.filter((p,i)=> i===0 || p[0]!==pts[i-1][0] || p[1]!==pts[i-1][1]);
      return {d:'M'+clean.map(p=>p[0]+','+p[1]).join(' L'), ox:x1, oy:fY};
    }

    // Also try direct path at tY
    const directHTY = !hBlocked(tY, x1, x2, excl);
    const directVTY = !vBlocked(x1, fY, tY, excl);
    if(directHTY && directVTY){
      const pts = [[x1,fY],[x1,tY],[x2,tY]];
      const clean = pts.filter((p,i)=> i===0 || p[0]!==pts[i-1][0] || p[1]!==pts[i-1][1]);
      return {d:'M'+clean.map(p=>p[0]+','+p[1]).join(' L'), ox:x1, oy:fY};
    }

    // ── Option 2: find a clear horizontal lane between the two nodes ──
    // Scan for a Y between/outside the node rows where the full horizontal
    // x1→x2 is clear, then use short verticals to reach it from each node.
    const midY = (fY + tY) / 2;
    // Prefer scanning in the gap between the nodes
    const gapDir = fTop < tTop ? 1 : -1; // toward gap
    const STEP=5, MAX=400;
    for(let d=0; d<=MAX; d+=STEP){
      for(const hy of [midY+gapDir*d, midY-gapDir*d]){
        if(hBlocked(hy, x1, x2, excl)) continue;
        if(vBlocked(x1, fY, hy, excl)) continue;
        if(vBlocked(x2, hy, tY, excl)) continue;
        // Valid 2-turn path
        const pts = [[x1,fY],[x1,hy],[x2,hy],[x2,tY]];
        const clean = pts.filter((p,i)=> i===0 || p[0]!==pts[i-1][0] || p[1]!==pts[i-1][1]);
        return {d:'M'+clean.map(p=>p[0]+','+p[1]).join(' L'), ox:x1, oy:fY};
      }
    }

    // ── Hard fallback ─────────────────────────────────────────────────
    const hy = srcIsRight ? Math.min(fTop,tTop)-20-nudge : Math.max(fBot,tBot)+20+nudge;
    const pts = [[x1,fY],[x1,hy],[x2,hy],[x2,tY]];
    const clean = pts.filter((p,i)=> i===0 || p[0]!==pts[i-1][0] || p[1]!==pts[i-1][1]);
    return {d:'M'+clean.map(p=>p[0]+','+p[1]).join(' L'), ox:x1, oy:fY};
  }

  // ── Arrow markers ─────────────────────────────────────────────────
  const typeColors = {administrative:'#F5A623',functional:'#1E4080','dotted-line':'#F5A623',matrix:'#EF4444'};
  const typeDashes = {administrative:'8 5',functional:'12 4','dotted-line':'4 6',matrix:'6 3 2 3'};
  const defs = document.createElementNS('http://www.w3.org/2000/svg','defs');
  Object.entries(typeColors).forEach(([type,color])=>{
    const st=type.replace(/[^a-z]/g,'-');
    defs.innerHTML+=`<marker id="admin-arrow-${chartKey}-${st}" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 z" fill="${color}" opacity="0.9"/>
    </marker>`;
  });
  svg.appendChild(defs);

  dualReporters.forEach((emp, idx)=>{
    const fromCard = canvas.querySelector(`[data-pid="${emp.id}"]`);
    const toCard   = canvas.querySelector(`[data-pid="${emp.adminParentId}"]`);
    if(!fromCard||!toCard) return;

    const fi = allCards.indexOf(fromCard);
    const ti = allCards.indexOf(toCard);
    const excl = new Set([fi, ti]);

    const fRect = fromCard.getBoundingClientRect();
    const tRect = toCard.getBoundingClientRect();

    const fL=(fRect.left-canvasRect.left)/scale, fR=(fRect.right-canvasRect.left)/scale;
    const fCX=(fL+fR)/2;
    const fTop=(fRect.top-canvasRect.top)/scale, fBot=(fRect.bottom-canvasRect.top)/scale;
    const fY=(fTop+fBot)/2;
    const tL=(tRect.left-canvasRect.left)/scale, tR=(tRect.right-canvasRect.left)/scale;
    const tCX=(tL+tR)/2;
    const tTop=(tRect.top-canvasRect.top)/scale, tBot=(tRect.bottom-canvasRect.top)/scale;
    const tY=(tTop+tBot)/2;

    const {d, ox, oy} = route(fL, fR, fCX, fTop, fBot, fY,
                               tL, tR, tCX, tTop, tBot, tY, excl, idx);

    const color=(typeColors[emp.adminReportingType]||'#F5A623');
    const dash=(typeDashes[emp.adminReportingType]||'8 5');
    const st=(emp.adminReportingType||'administrative').replace(/[^a-z]/g,'-');

    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d',d);
    path.setAttribute('stroke',color);
    path.setAttribute('stroke-width','1.8');
    path.setAttribute('stroke-dasharray',dash);
    path.setAttribute('fill','none');
    path.setAttribute('opacity','0.85');
    path.setAttribute('stroke-linejoin','miter');
    path.setAttribute('stroke-linecap','square');
    path.setAttribute('marker-end',`url(#admin-arrow-${chartKey}-${st})`);
    svg.appendChild(path);

    const dot=document.createElementNS('http://www.w3.org/2000/svg','circle');
    dot.setAttribute('cx',ox); dot.setAttribute('cy',oy);
    dot.setAttribute('r','3.5'); dot.setAttribute('fill',color); dot.setAttribute('opacity','0.9');
    svg.appendChild(dot);
  });
}
// Draw admin lines for all active chart panels after DOM settles
function drawAllAdminLines(){

  requestAnimationFrame(()=>{

      const svg = document.getElementById('admin-lines-svg-'+key);
      if(svg) drawAdminLines(key);
    });
  });
}

// ── Reorder Plants ───────────────────────────────────────────────
async function reorderPlants(id, dir){
  const arr=[...S.plants];
  const idx=arr.findIndex(p=>p.id===id);
  if(idx<0) return;
  const swapIdx=idx+dir;
  if(swapIdx<0||swapIdx>=arr.length) return;
  // Normalise all sortOrders first (0,1,2,…) then swap the two
  const updates=arr.map((p,i)=>({id:p.id, order:i}));
  updates[idx].order=swapIdx;
  updates[swapIdx].order=idx;
  try{
    await Promise.all(updates.map(u=>col('plants').doc(u.id).set({sortOrder:u.order},{merge:true})));
    toast('Order saved','ok');
  } catch(e){ toast('Reorder failed: '+e.message,'er'); }
}

// ── Reorder Departments ───────────────────────────────────────────
async function reorderDepts(id, dir){
  const arr=[...S.departments];
  const idx=arr.findIndex(d=>d.id===id);
  if(idx<0) return;
  const swapIdx=idx+dir;
  if(swapIdx<0||swapIdx>=arr.length) return;
  // Normalise sortOrders 0,1,2,… then swap the two positions
  const newArr=arr.map((d,i)=>({...d, sortOrder:i}));
  const tmpOrd=newArr[idx].sortOrder;
  newArr[idx].sortOrder=newArr[swapIdx].sortOrder;
  newArr[swapIdx].sortOrder=tmpOrd;
  newArr.sort((a,b)=>a.sortOrder-b.sortOrder);
  try{
    await structSettingsDoc('departments').set({list:newArr},{merge:true});
    toast('Order saved','ok');
  } catch(e){ toast('Reorder failed: '+e.message,'er'); }
}
