<style>
:root{
  --navy:#0F1F3D;--navy-l:#1E3A6E;--steel:#1E4080;
  --gold:#F5A623;--gold-l:#FBBF45;
  --white:#fff;--off:#F7F9FC;
  --g50:#F0F4FA;--g100:#E8ECF2;--g200:#CDD5E0;--g400:#8494AA;--g600:#4A5568;--g800:#1A2535;
  --ok:#22C55E;--err:#EF4444;
  --shadow:0 4px 16px rgba(15,31,61,.12);--r:10px;--rl:16px;
  font-family:'Inter',-apple-system,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--off);color:var(--g800);font-size:14px;line-height:1.6;min-height:100vh}
#app{min-height:100vh}

/* Layout */
.layout{display:flex;min-height:100vh}
.sidebar{width:230px;height:100vh;background:var(--navy);display:flex;flex-direction:column;position:fixed;top:0;left:0;z-index:100;overflow:hidden}
.main{margin-left:230px;flex:1;display:flex;flex-direction:column;min-height:100vh;min-width:0} /* min-width:0 → wide charts scroll inside .org-wrap instead of stretching the whole page */
.topbar{height:60px;background:var(--white);border-bottom:1px solid var(--g100);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:50;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.page{padding:24px;flex:1}

/* Sidebar */
.s-logo{padding:14px 16px 12px;border-bottom:1px solid rgba(255,255,255,.08)}
.s-logo h1{color:#fff;font-size:17px;font-weight:800;line-height:1.2}
.s-logo span{color:var(--gold)}
.s-logo p{color:rgba(255,255,255,.35);font-size:11px;margin-top:2px}
.s-logo-img{width:auto;max-width:100%;max-height:40px;object-fit:contain;display:block;}
.s-logo-img-wrap{max-width:calc(100% - 30px)!important;background:#ffffff;border-radius:10px;padding:6px 10px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:8px;box-shadow:0 1px 6px rgba(0,0,0,.18);max-width:100%;}
.logo-upload-area{border:2px dashed rgba(255,255,255,.2);border-radius:10px;padding:14px;text-align:center;cursor:pointer;transition:all .15s;background:rgba(255,255,255,.04);margin-top:10px}
.logo-upload-area:hover{border-color:var(--gold);background:rgba(245,166,35,.06)}
.s-nav{padding:8px 10px;flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.3) transparent}
.s-nav::-webkit-scrollbar{width:6px}
.s-nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.3);border-radius:2px}
.s-sec{color:rgba(255,255,255,.3);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;padding:10px 10px 4px}
.nav-btn{display:flex;align-items:center;gap:9px;padding:7px 11px;border-radius:8px;color:rgba(255,255,255,.6);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;border:none;background:none;width:100%;text-align:left;margin-bottom:2px;font-family:inherit}
.nav-btn:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-btn.active{background:var(--gold);color:var(--navy);font-weight:700}
.s-foot{padding:10px 10px;border-top:1px solid rgba(255,255,255,.08)}
.u-pill{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:8px;background:rgba(255,255,255,.06)}
.u-av{width:30px;height:30px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:var(--navy);flex-shrink:0}
.u-nm{color:#fff;font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.u-rl{color:rgba(255,255,255,.35);font-size:11px}
.lo-btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:7px 8px;border-radius:8px;color:rgba(255,255,255,.4);font-size:11.5px;cursor:pointer;border:none;background:none;flex:1;min-width:0;white-space:nowrap;transition:all .15s;font-family:inherit}
.lo-btn:hover{background:rgba(239,68,68,.15);color:var(--err)}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border:none;border-radius:var(--r);font-size:13px;font-weight:600;cursor:pointer;transition:all .17s;white-space:nowrap;font-family:inherit}
.bp{background:var(--gold);color:var(--navy)}.bp:hover{background:var(--gold-l);transform:translateY(-1px);box-shadow:var(--shadow)}
.bs{background:var(--navy);color:#fff}.bs:hover{background:var(--navy-l);transform:translateY(-1px)}
.bo{background:transparent;border:1.5px solid var(--g200);color:var(--g600)}.bo:hover{border-color:var(--steel);color:var(--steel);background:var(--g50)}
.bd{background:var(--err);color:#fff}.bd:hover{background:#dc2626}
.bsm{padding:5px 11px;font-size:12px}.bic{padding:6px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}

/* Forms */
.fg{margin-bottom:14px}
.lbl{display:block;font-size:11px;font-weight:700;color:var(--g600);margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em}
.inp{width:100%;padding:9px 13px;border:1.5px solid var(--g200);border-radius:var(--r);font-size:14px;color:var(--g800);background:#fff;transition:border-color .15s;font-family:inherit;outline:none}
.inp:focus{border-color:var(--steel);box-shadow:0 0 0 3px rgba(30,64,128,.08)}
.inp::placeholder{color:var(--g400)}
select.inp{cursor:pointer}
textarea.inp{resize:vertical;min-height:70px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* Cards/stats */
.card{background:#fff;border-radius:var(--rl);border:1px solid var(--g100);box-shadow:0 1px 3px rgba(15,31,61,.07)}
.card-h{padding:16px 20px;border-bottom:1px solid var(--g100);display:flex;align-items:center;justify-content:space-between}
.card-h h3{font-size:14px;font-weight:700;color:var(--navy)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:24px}
.stat{background:#fff;border-radius:var(--rl);padding:18px;border:1px solid var(--g100);box-shadow:0 1px 3px rgba(15,31,61,.07)}
.sv{font-size:30px;font-weight:800;color:var(--navy);line-height:1}
.sl{font-size:12px;color:var(--g400);margin-top:3px;font-weight:500}
.si{font-size:22px;margin-bottom:8px}

/* Table */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{background:var(--g50);color:var(--g600);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:11px 14px;text-align:left}
td{padding:12px 14px;border-bottom:1px solid var(--g100);font-size:13px}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--g50)}
/* Compact table variant */
.table-compact th{padding:6px 8px;font-size:10px}
.table-compact td{padding:4px 8px;border-bottom:1px solid var(--g100);font-size:12px}
.table-compact tr:hover td{background:var(--g50)}

/* Badge */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
.bg{background:rgba(245,166,35,.12);color:#B7791F}
.bb{background:rgba(30,64,128,.1);color:var(--steel)}
.bk{background:rgba(34,197,94,.1);color:#16a34a}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(10,20,40,.55);display:flex;align-items:center;justify-content:center;z-index:999;backdrop-filter:blur(4px);padding:20px}
.modal{background:#fff;border-radius:var(--rl);width:100%;max-width:500px;max-height:90vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.25);animation:su .2s ease}
.mh{padding:20px 22px 16px;border-bottom:1px solid var(--g100);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:1}
.mh h3{font-size:16px;font-weight:800;color:var(--navy)}
.mb{padding:22px}
.mf{padding:14px 22px;border-top:1px solid var(--g100);display:flex;gap:10px;justify-content:flex-end}
@keyframes su{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

/* Toasts */
#toasts{position:fixed;bottom:22px;right:22px;z-index:9999;display:flex;flex-direction:column;gap:7px}
.toast{display:flex;align-items:center;gap:9px;padding:11px 16px;border-radius:var(--r);background:var(--navy);color:#fff;font-size:13px;font-weight:500;box-shadow:var(--shadow);animation:si .2s ease;min-width:220px}
.tok{border-left:4px solid var(--ok)}.ter{border-left:4px solid var(--err)}.tin{border-left:4px solid var(--gold)}
@keyframes si{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

/* Biometric button */
.bio-btn{display:none;flex-direction:column;align-items:center;gap:6px;width:100%;margin-top:14px;padding:12px;border-radius:var(--r);background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.18);color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s}
.bio-btn:hover{background:rgba(255,255,255,.15);border-color:var(--gold)}
.bio-btn.show{display:flex}
.bio-icon{font-size:28px;line-height:1}
.bio-label{font-size:11px;color:rgba(255,255,255,.55);font-weight:400}
</style>
<style id="lc-login-base">
/* ══════════════════════════════════════════════
   BIOMETRIC LOGIN — light theme
══════════════════════════════════════════════ */
#loginOverlay{position:fixed;inset:0;z-index:9999}

.bio-screen{
  position:fixed;inset:0;
  background:linear-gradient(160deg,#eef4fb 0%,#f4f7ff 55%,#eaf1f9 100%);
  display:flex;flex-direction:column;
  align-items:center;justify-content:flex-end;
  padding-bottom:env(safe-area-inset-bottom,0px);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  overflow:hidden;
}

/* Subtle radial glow behind sensor */
.bio-glow{
  position:absolute;
  top:38%;left:50%;
  transform:translate(-50%,-50%);
  width:420px;height:420px;
  background:radial-gradient(circle,rgba(24,95,165,0.10) 0%,transparent 70%);
  pointer-events:none;
}

/* Brand area */
.bio-brand{
  position:absolute;top:0;left:0;right:0;
  display:flex;flex-direction:column;align-items:center;
  padding-top:calc(52px + env(safe-area-inset-top,0px));
}
.bio-brand-logo{
  width:52px;height:52px;border-radius:14px;
  background:#ffffff;
  border:0.5px solid rgba(24,95,165,0.20);
  box-shadow:0 4px 16px rgba(24,95,165,0.12);
  display:flex;align-items:center;justify-content:center;
  margin-bottom:14px;
}
.bio-brand-logo svg{width:26px;height:26px;stroke:#185FA5;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.bio-brand-name{font-size:16px;font-weight:600;color:#1a2a3a;letter-spacing:-0.01em}
.bio-brand-sub{font-size:12px;color:#6b84a0;margin-top:3px;letter-spacing:0.01em}

/* Fingerprint sensor */
.bio-sensor-wrap{
  position:absolute;
  top:36%;left:50%;
  transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;gap:20px;
}
.bio-sensor{
  position:relative;
  width:96px;height:96px;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
/* Outer ring pulse */
.bio-sensor::before{
  content:'';position:absolute;inset:-12px;border-radius:50%;
  border:1.5px solid rgba(24,95,165,0.28);
  animation:bio-ring 2.8s ease-in-out infinite;
}
.bio-sensor::after{
  content:'';position:absolute;inset:-24px;border-radius:50%;
  border:1px solid rgba(24,95,165,0.12);
  animation:bio-ring 2.8s ease-in-out infinite 0.4s;
}
@keyframes bio-ring{
  0%,100%{transform:scale(1);opacity:.6}
  50%{transform:scale(1.07);opacity:1}
}
.bio-sensor-bg{
  width:96px;height:96px;border-radius:50%;
  background:#ffffff;
  border:1.5px solid rgba(24,95,165,0.22);
  box-shadow:0 4px 20px rgba(24,95,165,0.14);
  display:flex;align-items:center;justify-content:center;
  transition:background 0.25s,border-color 0.25s,box-shadow 0.25s;
  position:relative;z-index:1;
}
.bio-sensor.scanning .bio-sensor-bg{
  background:rgba(24,95,165,0.06);
  border-color:rgba(55,138,221,0.65);
  box-shadow:0 0 32px rgba(24,95,165,0.20);
}
.bio-sensor.success .bio-sensor-bg{
  background:rgba(59,109,17,0.07);
  border-color:rgba(99,153,34,0.65);
  box-shadow:0 0 32px rgba(59,109,17,0.18);
}
.bio-sensor.error .bio-sensor-bg{
  background:rgba(163,45,45,0.07);
  border-color:rgba(226,75,74,0.65);
  box-shadow:0 0 28px rgba(163,45,45,0.18);
}

/* Fingerprint SVG icon */
.bio-fp-icon{width:44px;height:44px;stroke:#185FA5;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transition:stroke 0.25s}
.bio-sensor.scanning .bio-fp-icon{stroke:#378ADD;animation:bio-fp-pulse 0.9s ease-in-out infinite}
.bio-sensor.success .bio-fp-icon{stroke:#3B6D11}
.bio-sensor.error .bio-fp-icon{stroke:#E24B4A}
@keyframes bio-fp-pulse{0%,100%{opacity:.7}50%{opacity:1}}

/* Scan sweep line */
.bio-sweep{
  position:absolute;inset:0;border-radius:50%;
  overflow:hidden;pointer-events:none;z-index:2;
  opacity:0;
}
.bio-sensor.scanning .bio-sweep{opacity:1}
.bio-sweep::after{
  content:'';position:absolute;
  left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,rgba(24,95,165,0.70),transparent);
  animation:bio-scan 1.2s linear infinite;
}
@keyframes bio-scan{
  0%{top:-2px}100%{top:100%}
}

/* Sensor label */
.bio-sensor-label{font-size:13px;color:#6b84a0;text-align:center;line-height:1.5;letter-spacing:0.01em;transition:color 0.25s}
.bio-sensor.scanning .bio-sensor-label + .bio-sensor-label,
.bio-sensor-label.scanning{color:#185FA5}

/* Pill sheet at bottom — solid white */
.bio-sheet{
  width:100%;
  background:#ffffff;
  border-top:0.5px solid rgba(24,95,165,0.12);
  border-radius:24px 24px 0 0;
  box-shadow:0 -4px 28px rgba(24,95,165,0.10);
  padding:28px 24px 32px;
  display:flex;flex-direction:column;gap:0;
  max-width:480px;
  margin:0 auto;
  width:100%;
}

/* Face ID row */
.bio-alts{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:24px}
.bio-faceid-btn{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
  padding:12px 18px;border-radius:14px;
  border:0.5px solid rgba(24,95,165,0.18);
  background:rgba(24,95,165,0.05);
  transition:background 0.18s;
}
.bio-faceid-btn:active{background:rgba(24,95,165,0.12)}
.bio-faceid-btn svg{width:28px;height:28px;stroke:#185FA5;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.bio-faceid-btn span{font-size:10px;color:#6b84a0;font-weight:600;letter-spacing:0.04em;text-transform:uppercase}

.bio-divider{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.bio-divider-line{flex:1;height:0.5px;background:#dde5ef}
.bio-divider-text{font-size:11px;color:#9aaec4;white-space:nowrap;letter-spacing:0.06em;text-transform:uppercase;font-weight:500}

/* Credential form */
.bio-fields{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.bio-field-wrap{position:relative}
.bio-field-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:#9aaec4;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.bio-input{
  width:100%;
  padding:13px 14px 13px 40px;
  background:#f4f8fc;
  border:0.5px solid #c8d9eb;
  border-radius:12px;
  font-size:14px;color:#1a2a3a;
  font-family:'Inter',-apple-system,sans-serif;
  -webkit-appearance:none;
  transition:border-color 0.18s,background 0.18s,box-shadow 0.18s;
  outline:none;
}
.bio-input::placeholder{color:#9aaec4}
.bio-input:focus{border-color:#378ADD;background:#eef4fb;box-shadow:0 0 0 3px rgba(55,138,221,0.12)}
.bio-input:-webkit-autofill{
  -webkit-box-shadow:0 0 0 40px #f4f8fc inset !important;
  -webkit-text-fill-color:#1a2a3a !important;
}
.bio-pw-toggle{position:absolute;right:14px;top:50%;transform:translateY(-50%);cursor:pointer;color:#9aaec4;background:none;border:none;padding:4px;display:flex;align-items:center;-webkit-tap-highlight-color:transparent}
.bio-pw-toggle svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* Sign in button */
.bio-signin-btn{
  width:100%;padding:15px;
  background:linear-gradient(135deg,#2472cc,#185FA5);
  color:#fff;border:none;border-radius:14px;
  font-size:15px;font-weight:600;
  font-family:'Inter',-apple-system,sans-serif;
  cursor:pointer;letter-spacing:-0.01em;
  box-shadow:0 4px 20px rgba(24,95,165,0.30);
  transition:opacity 0.18s,transform 0.15s;
  -webkit-tap-highlight-color:transparent;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.bio-signin-btn:active{transform:scale(0.98);opacity:0.88}
.bio-signin-btn:disabled{opacity:0.5;cursor:not-allowed}

/* Error */
.bio-error{
  font-size:12px;color:#A32D2D;
  background:#FCEBEB;
  border:0.5px solid rgba(226,75,74,0.30);
  border-radius:8px;padding:10px 12px;
  display:none;margin-top:-4px;line-height:1.5;
}

/* Status text below sensor */
.bio-status{
  font-size:13px;
  color:#6b84a0;
  text-align:center;
  min-height:20px;
  transition:color 0.25s;
  letter-spacing:0.01em;
}
.bio-status.scanning{color:#185FA5}
.bio-status.success{color:#3B6D11}
.bio-status.error{color:#A32D2D}

/* Toggle: show/hide password form */
.bio-toggle-form{
  text-align:center;margin-top:14px;
  font-size:12px;color:#9aaec4;
  cursor:pointer;letter-spacing:0.01em;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}
.bio-toggle-form span{color:#185FA5;font-weight:500}

/* Password form collapse */
.bio-pw-section{
  overflow:hidden;
  max-height:0;
  transition:max-height 0.35s cubic-bezier(0.4,0,0.2,1),opacity 0.3s;
  opacity:0;
}
.bio-pw-section.open{max-height:300px;opacity:1}

/* Home indicator bar */
.bio-home-bar{
  width:134px;height:5px;border-radius:3px;
  background:#dde5ef;
  margin:20px auto 0;
}
@media(min-width:600px){
  .bio-sheet{border-radius:24px 24px 0 0}
  .bio-sensor-wrap{top:34%}
}
</style>
<style id="approved-login-layout-fix">
/* =============================================================
   SPLIT-VIEW LOGIN WINDOW — matches the reference design
   One rounded window: 42% illustrated brand panel / 58% form
   ============================================================= */
#loginOverlay{position:fixed;inset:0;z-index:9999;background:#eef4fa;}
#loginOverlay .bio-screen{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  overflow:auto;padding:3vh 4vw;box-sizing:border-box;
  background:
    radial-gradient(ellipse at 0% 0%,rgba(120,178,230,.22),transparent 40%),
    radial-gradient(ellipse at 100% 100%,rgba(120,178,230,.16),transparent 40%),
    #eef4fa;
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  color:#16324f;
}
#loginOverlay .bio-glow,#loginOverlay .bio-sensor-wrap{display:none!important;}

#loginOverlay .login-window{
  position:relative;
  /* half the screen width, never smaller than a comfortable 720px */
  width:min(max(720px,50vw),94vw);

/* Chrome/Edge: hide the chart's own bottom scrollbar (the proxy replaces it); keep the vertical one */
.has-hproxy::-webkit-scrollbar{width:10px;height:0}
.has-hproxy::-webkit-scrollbar-thumb{background:#c1c7d0;border-radius:6px}
.has-hproxy::-webkit-scrollbar-thumb:hover{background:#9aa6b8}
.has-hproxy::-webkit-scrollbar-track{background:transparent}

/* Progress bar — bottom toast style, no background dim */
.progress-overlay{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:9998;width:380px;max-width:calc(100vw - 32px)}
.progress-box{background:var(--navy);border-radius:var(--rl);padding:16px 20px;box-shadow:0 8px 32px rgba(0,0,0,.35);animation:si .2s ease}
.progress-title{font-size:13px;font-weight:700;color:#fff;margin-bottom:2px}
.progress-sub{font-size:11px;color:rgba(255,255,255,.5);margin-bottom:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progress-track{height:6px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden;margin-bottom:6px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--steel),var(--gold));border-radius:3px;transition:width .2s ease;width:0%}
.progress-label{font-size:11px;color:rgba(255,255,255,.45);text-align:right;font-weight:600}

/* Photo upload */
.photo-area{border:2px dashed var(--g200);border-radius:var(--r);padding:18px;text-align:center;cursor:pointer;transition:all .15s;background:var(--g50);margin-bottom:14px}
.photo-area:hover{border-color:var(--steel);background:rgba(30,64,128,.03)}
.photo-prev{width:72px;height:72px;border-radius:50%;object-fit:cover;margin:0 auto 6px;display:block}


/* ── Add / Edit Employee: full-screen single view ── */
.overlay.emp-fs-ov{padding:14px}
.modal.emp-fs{max-width:none;width:100%;height:calc(100vh - 28px);max-height:none;display:flex;flex-direction:column;overflow:hidden}
.emp-fs .mh{padding:10px 20px;position:static}
.emp-fs .mb.emp-grid{flex:1;min-height:0;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) minmax(0,1.15fr);padding:0}
.emp-col{display:flex;flex-direction:column;min-height:0;padding:14px 18px;border-right:1px solid var(--g100);overflow:hidden}
.emp-col:last-child{border-right:none}
.emp-col-rep{background:var(--off)}
.emp-sec{font-size:12px;font-weight:800;color:var(--steel);margin:0 0 10px;display:flex;align-items:center;gap:6px}
.emp-fs .fg{margin-bottom:10px}
.emp-fs .lbl{margin-bottom:4px;font-size:10.5px}
.emp-fs .inp{padding:7px 11px;font-size:13px}
.emp-fs .g2{gap:10px}
.emp-top{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.emp-fs .photo-area{display:flex;align-items:center;gap:10px;padding:8px 10px;margin:0;text-align:left;min-height:62px}
.emp-fs .photo-prev{width:46px;height:46px;margin:0;flex-shrink:0}
.emp-fill{display:flex;flex-direction:column;min-height:0}
.emp-fill select[size]{flex:1;min-height:64px;height:auto}
.emp-admin{background:rgba(245,166,35,.06);border:1.5px solid rgba(245,166,35,.25);border-radius:10px;padding:10px 12px}
.emp-fs .mf{padding:10px 20px;align-items:center}
@media(max-width:1000px){
  .emp-fs .mb.emp-grid{grid-template-columns:1fr 1fr;overflow:auto}
  .emp-col{overflow:visible}
  .emp-col-rep{grid-column:1/-1;min-height:440px}
}
@media(max-width:680px){
  .overlay.emp-fs-ov{padding:0;align-items:stretch}
  .modal.emp-fs{height:100vh;max-height:100vh;border-radius:0;position:static}
  .emp-fs .mb.emp-grid{grid-template-columns:1fr}
  .emp-col{border-right:none;border-bottom:1px solid var(--g100)}
}
/* Empty */

.ei{font-size:42px;margin-bottom:10px}

/* ── Vacant Position Styling ── */
:root{

}
.ocard.vacant-card{

<script>
// ╔══════════════════════════════════════════════════════════════╗
// ║  🔥 FIREBASE CONFIG — replace with YOUR values              ║

const FIREBASE_CONFIG = {
  apiKey:            "AIzaSyCsd_IOB8DPRNbT8TrBsltQksZ6yD7nlqQ",
  authDomain:        "skr-mom.firebaseapp.com",
  databaseURL:       "https://skr-mom-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:         "skr-mom",
  storageBucket:     "skr-mom.firebasestorage.app",
  messagingSenderId: "993069516449",
  appId:             "1:993069516449:web:a0329628740748a913d2e0",
  measurementId:     "G-2ZL4JR2V9R"
};

// ── Init Firebase ───────────────────────────────────────────────
const app    = firebase.initializeApp(FIREBASE_CONFIG);
const auth   = firebase.auth();
const db     = firebase.firestore();
const stor   = firebase.storage();

// ── Biometric Auth (Mobile Only) ────────────────────────────────
// Uses WebAuthn (passkeys/fingerprint/face ID) to re-authenticate
// returning users without typing credentials.
// Credentials are stored in sessionStorage as a token reference only —
// never the actual password. Firebase custom tokens are not used here;
// instead we store the Firebase user's refreshToken via IndexedDB (handled
// by Firebase SDK) and use WebAuthn as a local unlock gate.

const BIO_KEY = 'bio_session'; // sessionStorage key for quick biometric check

function isMobileDevice(){
  return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
}

async function isBiometricAvailable(){
  if(!isMobileDevice()) return false;
  if(!window.PublicKeyCredential) return false;
  try{
    return await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
  }catch(e){ return false; }
}

function storeBiometricSession(user){
  // Store minimal info so biometric can re-identify the user
  // after they've authenticated at least once with password
  if(!isMobileDevice()) return;
  if(!user || !user.uid) return; // guard: no user
  try{
    const emailVal = user.email || '';
    sessionStorage.setItem(BIO_KEY, JSON.stringify({
      email: emailVal,
      uid: user.uid,
      ts: Date.now()
    }));
    // Also persist to localStorage for next app open (7-day window)
    const existing = JSON.parse(localStorage.getItem(BIO_KEY)||'null');
    if(!existing || existing.email !== emailVal){
      localStorage.setItem(BIO_KEY, JSON.stringify({
        email: emailVal,
        uid: user.uid,
        registered: true,
        ts: Date.now()
      }));
    }
  }catch(e){}
}

function getBiometricSession(){
  try{
    const stored = JSON.parse(localStorage.getItem(BIO_KEY)||'null');
    if(!stored || !stored.registered) return null;
    // Only valid within 7 days
    if(Date.now() - stored.ts > 7*24*60*60*1000){
      localStorage.removeItem(BIO_KEY);
      return null;
    }
    return stored;
  }catch(e){ return null; }
}

async function triggerBiometricAuth(){
  const session = getBiometricSession();
  if(!session) return;
  try{
    // Create a challenge (random bytes)
    const challenge = new Uint8Array(32);
    crypto.getRandomValues(challenge);

    const credential = await navigator.credentials.get({
      publicKey:{
        challenge,
        timeout:60000,
        userVerification:'required',
        rpId: location.hostname
      }
    });

    if(credential){
      // Biometric verified — now sign in via Firebase using stored token
      // Since Firebase SDK keeps the session alive via IndexedDB/persistence,
      // we just need to trigger a currentUser reload
      const currentUser = auth.currentUser;
      if(currentUser){
        await currentUser.reload();
        // Already signed in — auth state change will fire
        return;
      }
      // If no current user, we need the email to sign in
      // Show a message asking them to sign in once to enable biometrics
      toast('Biometric verified! Please sign in once to link your account.','in');
    }
  }catch(e){
    if(e.name === 'NotAllowedError'){
      toast('Biometric cancelled','in');
    } else {
      console.error('[Bio] Error:',e);
      toast('Biometric failed — please use password','er');
    }
  }
}

async function registerBiometric(){
  const session = getBiometricSession();
  if(!session || !auth.currentUser) return;
  try{
    const challenge = new Uint8Array(32);
    crypto.getRandomValues(challenge);
    const userId = new TextEncoder().encode(session.uid);

    await navigator.credentials.create({
      publicKey:{
        challenge,
        rp:{ name: document.title || 'OrgChart', id: location.hostname },
        user:{ id: userId, name: session.email, displayName: session.email },
        pubKeyCredParams:[{alg:-7,type:'public-key'},{alg:-257,type:'public-key'}],
        authenticatorSelection:{
          authenticatorAttachment:'platform',
          userVerification:'required',
          residentKey:'preferred'
        },
        timeout:60000
      }
    });
    localStorage.setItem(BIO_KEY, JSON.stringify({...session, credRegistered:true, ts:Date.now()}));
    toast('Biometrics enabled for future sign-ins ✓','ok');
  }catch(e){
    if(e.name!=='NotAllowedError') console.warn('[Bio] Register error:',e.message);
  }
}

// Collapses/search on 250-node charts can fire render() many times per second.

function toast(msg, type='in'){

  t.className=`toast t${type}`;

// Count total nodes in a tree (iterative, safe for 250+)
function countNodes(node){
  if(!node) return 0;
  let count=0;
  const stack=[node];
  while(stack.length){ const n=stack.pop(); count++; (n.children||[]).forEach(c=>stack.push(c)); }
  return count;
}

function buildTree(emps){
  if(!emps||!emps.length) return null;
  const map={};
  emps.forEach(e=>{ map[e.id]={...e,children:[]} });
  const roots=[];
  emps.forEach(e=>{
    if(!e.parentId||!map[e.parentId]) roots.push(map[e.id]);
    else map[e.parentId].children.push(map[e.id]);
  });
  if(roots.length===0) return null;
  if(roots.length===1) return roots[0];
  // Multiple roots — wrap in a virtual group node
  return {id:'__virtual_root__',name:'Organisation',designation:'',_isVirtualRoot:true,children:roots};
}


// ── Hierarchy levels (defined by super-admin only) ───────────────
// An employee's level is resolved in this order:
//   1. employee.level holds a level id               (set in Add/Edit Employee)
//   2. employee.level text/number matches a level code or name (legacy 1–12 values, bulk import)
//   3. employee.designation matches one of the level's mapped designations (auto)
function _lvlNorm(v){ return String(v==null?'':v).trim().toLowerCase().replace(/\s+/g,' '); }
function getEmpLevel(e){
  if(!e||!S.levels||!S.levels.length) return null;
  const raw=e.level;
  if(raw!==null&&raw!==undefined&&raw!==''){
    const byId=S.levels.find(l=>l.id===raw);
    if(byId) return byId;
    const r=_lvlNorm(raw);
    const byTxt=S.levels.find(l=>{
      const c=_lvlNorm(l.code), n=_lvlNorm(l.name);
      return (c&&c===r)||(n&&n===r)||(/^\d+$/.test(r)&&(c==='l'+r||c==='level '+r));
    });
    if(byTxt) return byTxt;
  }
  const d=_lvlNorm(e.designation);
  if(!d) return null;
  return S.levels.find(l=>(l.designations||[]).some(x=>_lvlNorm(x)===d))||null;
}
function getLevelRank(e){ const l=getEmpLevel(e); return l?S.levels.indexOf(l):-1; }
function levelText(l){ return l?(l.code?(l.code+(l.name&&l.name!==l.code?' – '+l.name:'')):l.name):''; }
function empLevelText(e){
  const l=getEmpLevel(e);
  if(l) return levelText(l);
  return (e&&e.level!=null&&e.level!=='')?String(e.level):'';
}
// Bulk import / free text → level id when it matches a defined level, else keep the raw text
function resolveLevelInput(raw){
  const r=_lvlNorm(raw);
  if(!r) return null;
  const hit=(S.levels||[]).find(l=>{
    const c=_lvlNorm(l.code), n=_lvlNorm(l.name);
    return l.id===raw||(c&&c===r)||(n&&n===r)||(/^\d+$/.test(r)&&(c==='l'+r||c==='level '+r));
  });
  return hit?hit.id:String(raw).trim();
}

auth.onAuthStateChanged(async user=>{

  }
  S.user=user;

    storeBiometricSession(user);

    const profileData=await fetchUserProfile(user);
    if(profileData){
      const raw=(profileData.role||'').toString().trim().toLowerCase();
      const roleMap={
        'super-admin':'super-admin','superadmin':'super-admin','super_admin':'super-admin',
        'plant-admin':'plant-admin','plantadmin':'plant-admin','plant_admin':'plant-admin',
        'viewer':'viewer','view':'viewer',
        'assignee':'viewer','member':'viewer','user':'viewer','employee':'viewer'
      };
      profileData.role=roleMap[raw]||raw;
      S.profile=profileData;
    } else {
      // Profile not found — this is the "Account not found" bug.
      // It often happens due to a race condition during first login.
      // Wait 2s and try once more before showing the error screen.
      console.warn('[OrgChart] Profile not found on first attempt — waiting 2s and retrying…');
      await new Promise(r=>setTimeout(r,2000));
      // IMPORTANT: re-fetch auth.currentUser after the wait — the closure `user`
      // may have a stale/partially-hydrated object after async suspension.
      const freshUser = auth.currentUser || user;
      if(!freshUser || !freshUser.uid){
        console.warn('[OrgChart] No authenticated user after retry wait — aborting.');
        S.profile=null;
      } else {
        const retryData=await fetchUserProfile(freshUser);
        if(retryData){
          const raw=(retryData.role||'').toString().trim().toLowerCase();
          const roleMap={
            'super-admin':'super-admin','superadmin':'super-admin','super_admin':'super-admin',
            'plant-admin':'plant-admin','plantadmin':'plant-admin','plant_admin':'plant-admin',
            'viewer':'viewer','view':'viewer',
            'assignee':'viewer','member':'viewer','user':'viewer','employee':'viewer'
          };
          retryData.role=roleMap[raw]||raw;
          S.profile=retryData;
          console.log('[OrgChart] Profile found on retry.');
        } else {
          S.profile=null;
          console.warn('[OrgChart] Profile still not found after retry — uid:',freshUser.uid,'email:',freshUser.email||'(none)');
        }
      }
    }
    console.log('[OrgChart] Profile:',S.profile?.email,'| Role:',S.profile?.role);
    if(!S.tab||S.tab==='dashboard') S.tab=S.profile?.role==='plant-admin'?'pa-chart':'dashboard';

      S.loading=false;

      return;
    }
  } else {
    S.profile=null; S.plants=[]; S.employees=[]; S.users=[];
    _unsubs.forEach(u=>u()); _unsubs=[];
  }
  S.loading=false; render();
});

// Fetch user profile with retry + multiple lookup strategies
// This function permanently fixes the "Account not found" bug by:
// 1. Trying 4 lookup strategies (email, uid field, doc ID, case-insensitive)
// 2. Retrying up to MAX times with exponential backoff
// 3. Auto-healing: if still not found, checks if it's a first-time login
//    and creates a minimal profile so the user is never permanently stuck
async function fetchUserProfile(user, attempt=1){
  const MAX=4;

  // Guard: user object or required fields missing — cannot look up profile
  if(!user || !user.uid || typeof user.uid !== 'string' || !user.uid.trim()){
    console.error('[OrgChart] fetchUserProfile called with invalid user object — uid:',user?.uid);
    return null;
  }
  const userEmail = (user.email || '').trim(); // email may be null for phone/anonymous auth
  const userUid   = user.uid.trim();

  try{
    // Strategy 1: query by email (most common — works when Firestore index exists)
    if(userEmail){
      const byEmail=await db.collection('mompro_users').where('email','==',userEmail).get();
      if(!byEmail.empty){
        const rolePriority=r=>{ const rr=(r||'').trim().toLowerCase(); if(rr.includes('super')) return 3; if(rr.includes('plant')||rr.includes('admin')) return 2; return 1; };
        const docs=byEmail.docs.map(d=>({...d.data(),_docId:d.id})).sort((a,b)=>rolePriority(b.role)-rolePriority(a.role));
        console.log('[OrgChart] Found',docs.length,'doc(s) by email. Role:',docs[0].role);
        // Heal: write uid into doc if missing (prevents future mismatches)
        if(!docs[0].uid){
          db.collection('mompro_users').doc(docs[0]._docId).set({uid:userUid},{merge:true}).catch(()=>{});
        }
        return docs[0];
      }
    }

    // Strategy 2: query by uid field (some setups store uid separately)
    const byUid=await db.collection('mompro_users').where('uid','==',userUid).get();
    if(!byUid.empty){
      console.log('[OrgChart] Found by uid field');
      return {_docId:byUid.docs[0].id,...byUid.docs[0].data()};
    }

    // Strategy 3: direct doc lookup by UID as doc ID (Firebase Auth UID = doc ID pattern)
    const byDocId=await db.collection('mompro_users').doc(userUid).get();
    if(byDocId.exists){
      console.log('[OrgChart] Found by doc ID = UID');
      return {_docId:userUid,...byDocId.data()};
    }

    // Strategy 4: case-insensitive email scan (handles email casing mismatch)
    if(userEmail){
      const emailLower=userEmail.toLowerCase();
      const allDocs=await db.collection('mompro_users').limit(500).get();
      const match=allDocs.docs.find(d=>(d.data().email||'').toLowerCase()===emailLower);
      if(match){
        console.log('[OrgChart] Found by case-insensitive email scan');
        // Heal: normalise email casing in Firestore
        db.collection('mompro_users').doc(match.id).set({email:userEmail,uid:userUid},{merge:true}).catch(()=>{});
        return {_docId:match.id,...match.data()};
      }
    }

    console.warn('[OrgChart] No profile found for uid:',user.uid,'email:',userEmail||'(none)','(attempt',attempt+')');
    return null;

  }catch(e){
    console.error('[OrgChart] Profile fetch error (attempt '+attempt+'):',e.message);
    if(attempt<MAX){
      // Exponential backoff: 1s, 2s, 3s
      await new Promise(r=>setTimeout(r, attempt*1000));
      return fetchUserProfile(user, attempt+1);
    }
    return null;
  }
}

// Scroll the first highlighted card into view after a search
function scrollToHighlighted(){
  // Triple rAF: ensures DOM is fully painted and laid out before reading positions
  requestAnimationFrame(()=>requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const el=document.querySelector('.highlight-card');
    if(!el) return;

    // ── Step 1: scroll the org-wrap container (horizontal + vertical) ──
    const container=el.closest('.org-wrap, [id*="pub-chart"]');
    if(container){
      const canvas=container.querySelector('.org-canvas, #pub-canvas');
      let scale=1;
      if(canvas){
        const m=(canvas.style.transform||'').match(/scale\(([\d.]+)\)/);
        scale=m?parseFloat(m[1]):1;
        if(!scale||isNaN(scale)) scale=1;
      }
      // offsetTop/offsetLeft are unscaled layout positions — correct for CSS scale
      // Walk up to get position relative to canvas
      let offX=0, offY=0, node=el;
      while(node && node!==canvas){ offX+=node.offsetLeft; offY+=node.offsetTop; node=node.offsetParent; }
      const scaledX=offX*scale;
      const scaledY=offY*scale;
      const cardW=el.offsetWidth*scale;
      const cardH=el.offsetHeight*scale;
      const targetLeft=scaledX - (container.clientWidth-cardW)/2;
      const targetTop =scaledY - (container.clientHeight-cardH)/2;
      container.scrollTo({left:Math.max(0,targetLeft), top:Math.max(0,targetTop), behavior:'smooth'});
    }

    // ── Step 2: also scroll the page so the org-wrap itself is visible ──
    el.scrollIntoView({behavior:'smooth', block:'center', inline:'center'});

    // ── Step 3: flash the card so user's eye is drawn to it ──
    el.style.transition='box-shadow .15s, transform .15s';
    el.style.transform='scale(1.12)';
    el.style.boxShadow='0 0 0 5px rgba(245,166,35,.55), 0 4px 20px rgba(245,166,35,.35)';
    el.style.zIndex='99';
    setTimeout(()=>{
      el.style.transform='';
      el.style.boxShadow='';
      el.style.zIndex='';
    }, 900);
  })));
}

/* ══════════════════════════════════════════════════════════
   LICENSE SYSTEM
   - licenseKey is set ONLY by super-admin in Plants & Settings
   - Stored in Firestore settings/company.licenseKey
   - Expiry fetched from org_licenses/{key} (written by license panel)
   - Badge shown to ALL roles in topbar
   - App blocks with lock screen when expired/revoked
══════════════════════════════════════════════════════════ */

async function fetchLicenseExpiry(key) {
  if (!key) return;
  try {
    const doc = await db.collection('org_licenses').doc(key).get();
    if (!doc.exists) {
      S.licenseExpiry = null; S.licenseStatus = 'invalid';
      console.warn('[OrgChart] License key not found in org_licenses:', key);
    } else {
      const data = doc.data();
      let expiresAt = data.expiresAt;
      if (expiresAt && typeof expiresAt.toMillis === 'function') expiresAt = expiresAt.toMillis();
      else if (expiresAt instanceof Date) expiresAt = expiresAt.getTime();
      else expiresAt = Number(expiresAt) || null;
      S.licenseExpiry = expiresAt;
      if (data.status === 'revoked') {
        S.licenseStatus = 'revoked';
      } else if (!expiresAt) {
        S.licenseStatus = 'active';
      } else {
        const days = Math.ceil((expiresAt - Date.now()) / 86400000);
        S.licenseStatus = days < 0 ? 'expired' : days <= 30 ? 'expiring' : 'active';
      }
      console.log('[OrgChart] License:', key, '| status:', S.licenseStatus, '| expiresAt:', expiresAt ? new Date(expiresAt).toLocaleDateString() : 'none');
    }
  } catch(e) {
    console.warn('[OrgChart] License fetch failed:', e);
    S.licenseStatus = ''; // fail-open on network error
  }
  // Always re-render after fetch so badge + gate reflect real data
  if (!_importing) render();
}

function isLicenseExpired() {
  if (!S.licenseKey) return false;               // no key = open mode
  if (!S.licenseExpiry && S.licenseStatus === '') return false; // still loading
  if (S.licenseStatus === 'revoked')  return true;
  if (S.licenseStatus === 'invalid')  return true;
  if (S.licenseStatus === 'expired')  return true;
  if (S.licenseExpiry && S.licenseExpiry < Date.now()) return true;
  return false;
}

function licenseBadgeHTML() {
  // Shown in topbar for ALL roles — badge only, no action
  if (!S.licenseKey) return '';
  // Show loading state while fetch is pending
  if (!S.licenseExpiry && !S.licenseStatus) {
    return '<span style="display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;background:rgba(148,163,184,.1);border:1px solid rgba(148,163,184,.25);font-size:11.5px;font-weight:600;color:#8494AA;white-space:nowrap">&#128273; License&hellip;</span>';
  }
  if (!S.licenseExpiry) return '';
  const days = Math.ceil((S.licenseExpiry - Date.now()) / 86400000);
  const M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const d = new Date(S.licenseExpiry);
  const dateStr = d.getDate() + ' ' + M[d.getMonth()] + ' ' + d.getFullYear();
  const isRevoked = S.licenseStatus === 'revoked';
  const isExpired = isRevoked || days < 0;
  const isWarning = !isExpired && days <= 30;

  const bg    = isExpired ? 'rgba(239,68,68,.10)'   : isWarning ? 'rgba(245,166,35,.10)'   : 'rgba(34,197,94,.09)';
  const bdr   = isExpired ? 'rgba(239,68,68,.28)'   : isWarning ? 'rgba(245,166,35,.30)'   : 'rgba(34,197,94,.25)';
  const clr   = isExpired ? '#dc2626'               : isWarning ? '#b45309'                : '#15803d';
  const dot   = isExpired ? '#ef4444'               : isWarning ? '#f59e0b'                : '#22c55e';
  const label = isRevoked ? 'Revoked'
              : isExpired ? 'Expired ' + dateStr
              : isWarning ? 'Expires ' + dateStr + ' (' + days + 'd)'
              :             'License · ' + dateStr;

  return `<span style="display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;background:${bg};border:1px solid ${bdr};font-size:11.5px;font-weight:600;color:${clr};white-space:nowrap;letter-spacing:.01em">
    <span style="width:6px;height:6px;border-radius:50%;background:${dot};flex-shrink:0"></span>
    🔑 ${label}
  </span>`;
}

function licenseExpiredScreenHTML() {
  const M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function _styleTabActive(id){

  el.style.background='#185FA5'; el.style.color='#fff';
  el.style.boxShadow='0 2px 8px rgba(24,95,165,.25)';
}
function _styleTabInactive(id){
  const el=$(id); if(!el) return;
  el.style.background='transparent'; el.style.color='#6b84a0';
  el.style.boxShadow='none';
}

function _openLoginForm(){
  // Switch to Admin tab in the split-view login
  window._ocLoginTab='admin';
  const adminPanel=$('oc-panel-admin'), pubPanel=$('oc-panel-public');
  if(adminPanel) adminPanel.style.display='block';
  if(pubPanel)   pubPanel.style.display='none';
  _styleTabActive('oc-tab-admin');
  _styleTabInactive('oc-tab-public');
  setTimeout(()=>$('li-email')?.focus(),200);
}
function goToLogin(e){
  if(e) e.preventDefault();
  // Strip public-view markers from the URL so a refresh doesn't bounce back
  try{
    const u=new URL(location.href);
    u.searchParams.delete('view');
    if(u.hash==='#public'||u.hash==='#login') u.hash='';
    history.replaceState(null,'',u.pathname+u.search+u.hash);
  }catch(_){}
  const pathIsPublic=/\/public\/?$/.test(location.pathname);
  if(auth.currentUser || pathIsPublic){
    // Already signed in (needs full profile/listener start-up) or the /public
    // path would re-trigger public view — reload through the normal auth flow.
    try{ sessionStorage.setItem('oc_force_login','1'); if(!auth.currentUser) sessionStorage.setItem('oc_open_login','1'); }catch(_){}
    location.reload();
    return;
  }
  // Not signed in: switch to the login screen instantly, form already open
  S.publicView=false;
  S.user=null;
  S.loading=false;
  render();
  _openLoginForm();
}

function render(){
  const app=$('app');
  if(S.loading){ app.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:var(--g400);font-size:15px">Loading…</div>'; return; }
  if(S.publicView){
    if(!S.publicViewEnabled){
      S.publicView=false;
      app.innerHTML=loginHTML(); bindLogin(); return;
    }
    app.innerHTML=publicViewHTML(); bindPublicView(); scrollToHighlighted(); return;
  }
  if(!S.user){ app.innerHTML=loginHTML(); bindLogin(); return; }
  // ── LICENSE GATE ────────────────────────────────────────────────────────
  // If a key is configured but expiry hasn't loaded yet, show a brief
  // loading screen so we never let the app through before we know the status.
  if (S.licenseKey && S.licenseStatus === '' && S.licenseExpiry === null) {
    app.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:var(--g400);font-size:15px;gap:10px"><span style="font-size:20px">&#128273;</span> Verifying license…</div>';
    return;
  }
  if (isLicenseExpired()) {
    const role = S.profile?.role;
    if (role !== 'super-admin') {
      // Block plant-admin, viewers, all other roles
      app.innerHTML = licenseExpiredScreenHTML();
      return;
    }
    // Super-admin: redirect to Plants & Settings to renew key
    if (S.tab !== 'plants') S.tab = 'plants';
  }
  if(!S.profile){
    // Auto-retry: reload once automatically after 5s, giving Firebase more time
    if(!window._profileRetryScheduled){
      window._profileRetryScheduled=true;
      let countdown=5;
      app.innerHTML=`<div style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:16px;padding:24px;text-align:center">
        <div style="font-size:40px">🔍</div>
        <div style="color:var(--err);font-size:16px;font-weight:700">Profile Loading…</div>
        <div style="color:var(--g400);font-size:13px;max-width:360px;line-height:1.6">
          Signed in as <strong style="color:var(--navy)">${S.user?.email||''}</strong><br>
          Connecting to your account profile…<br>
          <span id="retry-countdown">Retrying in ${countdown}s…</span>
        </div>
        <div style="display:flex;gap:10px;margin-top:8px">
          <button class="btn bp" onclick="window._profileRetryScheduled=false;location.reload()">↺ Retry Now</button>
          <button class="btn bo" onclick="auth.signOut()">Sign Out</button>
        </div>
        <div style="font-size:11px;color:var(--g400);margin-top:4px">If the problem persists, contact your Super Admin to verify your account.</div>
      </div>`;
      const interval=setInterval(()=>{
        countdown--;
        const el=document.getElementById('retry-countdown');
        if(el) el.textContent=countdown>0?`Retrying in ${countdown}s…`:'Retrying…';
        if(countdown<=0){
          clearInterval(interval);
          window._profileRetryScheduled=false;
          location.reload();
        }
      },1000);
    }
    return;
  }
  window._profileRetryScheduled=false;
  const role=S.profile.role;
  console.log('[OrgChart] Rendering for role:',role);
  if(role==='super-admin') app.innerHTML=superAdminHTML();
  else if(role==='plant-admin') app.innerHTML=plantAdminHTML();
  else app.innerHTML=viewerHTML();
  bindAll();
  scrollToHighlighted();
}

function bindLogin(){
  updateHamburger(); // login page has no layout, hide hamburger

  // ── Inject plant photo + left panel HTML ──
  const leftInner = document.getElementById('kpi-left-inner');
  if(leftInner && window.OC_LOGIN_LEFT_HTML){
    leftInner.innerHTML = window.OC_LOGIN_LEFT_HTML;
  }

  // Public view button in split-login
  $('oc-guest-btn')?.addEventListener('click',()=>{
    S.publicView=true;
    S.loading=false;
    startPublicListeners();
    render();
  });

  // Arrived here from the public-view Login button → switch to admin tab
  try{
    if(sessionStorage.getItem('oc_open_login')){
      sessionStorage.removeItem('oc_open_login');
      window._ocLoginTab='admin';
      const adminPanel=$('oc-panel-admin'), pubPanel=$('oc-panel-public');
      if(adminPanel) adminPanel.style.display='block';
      if(pubPanel)   pubPanel.style.display='none';
      _styleTabActive('oc-tab-admin'); _styleTabInactive('oc-tab-public');
      setTimeout(()=>$('li-email')?.focus(),150);
    }
  }catch(_){}

  // Password show/hide toggle
  const pwToggle=$('oc-pw-toggle');
  pwToggle?.addEventListener('click',()=>{
    const inp=$('li-pass');
    if(!inp) return;
    inp.type = inp.type==='password'?'text':'password';
  });

  // Face ID button in admin panel
  $('bio-faceid-btn')?.addEventListener('click', async ()=>{
    const statusEl=$('oc-bio-status');
    if(statusEl) statusEl.textContent='Verifying…';
    try{
      if(window.triggerBiometricAuth) await triggerBiometricAuth();
    }catch(e){ if(statusEl) statusEl.textContent='Biometric not available on this device.'; }
  });

  // ── Biometric setup ──
  (async()=>{
    if(!isMobileDevice()) return;
    const bioAvailable = await isBiometricAvailable();
    if(!bioAvailable) return;
    const bioSession = getBiometricSession();
    const bioBtn = $('bio-btn');
    const bioDivider = $('bio-divider');
    const bioIcon = $('bio-icon');
    const bioText = $('bio-text');
    if(bioSession && bioSession.credRegistered && bioBtn){
      bioBtn.classList.add('show');
      if(bioDivider) bioDivider.style.display='flex';
      const isIOS=/iPhone|iPad|iPod/i.test(navigator.userAgent);
      if(bioIcon) bioIcon.textContent = isIOS ? '🔒' : '👆';
      if(bioText) bioText.textContent = isIOS ? 'Sign in with Face ID / Touch ID' : 'Sign in with Fingerprint';
      bioBtn.addEventListener('click', triggerBiometricAuth);
      setTimeout(()=> triggerBiometricAuth(), 400);
    } else if(bioSession && !bioSession.credRegistered && bioBtn){
      bioBtn.classList.add('show');
      if(bioDivider) bioDivider.style.display='flex';
      if(bioIcon) bioIcon.textContent='🔐';
      if(bioText) bioText.textContent='Enable Biometric Sign-In';
      bioBtn.addEventListener('click', registerBiometric);
    }
  })();

  const showErr=(msg)=>{
    const el=$('li-err');
    if(!el) return;
    el.textContent=msg;
    el.style.display='block';
  };
  const hideErr=()=>{ const el=$('li-err'); if(el){ el.style.display='none'; el.textContent=''; } };

  const doLogin=async()=>{
    const email=$('li-email')?.value.trim(), pass=$('li-pass')?.value;
    if(!email||!pass) return;
    const btn=$('li-btn');
    if(btn){ btn.innerHTML='<svg style="width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;animation:spin .8s linear infinite" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z" opacity=".25"/><path d="M21 12a9 9 0 0 0-9-9"/></svg> Signing in…'; btn.disabled=true; }
    hideErr();
    try{
      await auth.signInWithEmailAndPassword(email,pass);
      if(isMobileDevice()){
        const bioAvailable = await isBiometricAvailable();
        if(bioAvailable){
          const bioSession = getBiometricSession();
          if(bioSession && !bioSession.credRegistered){
            setTimeout(()=> registerBiometric(), 2500);
          }
        }
      }
    }
    catch(e){
      showErr('Invalid email or password. Please try again.');
      if(btn){ btn.innerHTML='<svg style="width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg> Sign In'; btn.disabled=false; }
    }
  };
  $('li-btn')?.addEventListener('click', doLogin);
  $('li-pass')?.addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
  $('li-email')?.addEventListener('keydown', e=>{ if(e.key==='Enter') $('li-pass')?.focus(); });
}

function licenseCardHTML(){
  const st = S.licenseStatus;
  const borderClr = (st==='expired'||st==='revoked') ? '#ef4444' : st==='expiring' ? '#f59e0b' : '#22c55e';
  const keyVal = S.licenseKey || '';

  let statusBadge = '';
  if (!keyVal) {
    statusBadge = '<span style="display:inline-flex;align-items:center;padding:5px 14px;border-radius:999px;background:rgba(148,163,184,.1);border:1px solid rgba(148,163,184,.25);font-size:12px;font-weight:600;color:#8494AA">&#9898; No License</span>';
  } else if (st==='revoked') {
    statusBadge = '<span style="display:inline-flex;align-items:center;padding:5px 14px;border-radius:999px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);font-size:12px;font-weight:600;color:#dc2626">&#128308; Revoked</span>';
  } else if (st==='expired') {
    statusBadge = '<span style="display:inline-flex;align-items:center;padding:5px 14px;border-radius:999px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);font-size:12px;font-weight:600;color:#dc2626">&#128308; Expired</span>';
  } else if (st==='expiring') {
    statusBadge = '<span style="display:inline-flex;align-items:center;padding:5px 14px;border-radius:999px;background:rgba(245,166,35,.1);border:1px solid rgba(245,166,35,.25);font-size:12px;font-weight:600;color:#b45309">&#9888; Expiring Soon</span>';
  } else if (st==='active') {
    statusBadge = '<span style="display:inline-flex;align-items:center;padding:5px 14px;border-radius:999px;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.25);font-size:12px;font-weight:600;color:#15803d">&#10003; Active</span>';
  } else {
    statusBadge = '<span style="display:inline-flex;align-items:center;padding:5px 14px;border-radius:999px;background:rgba(148,163,184,.1);border:1px solid rgba(148,163,184,.25);font-size:12px;font-weight:600;color:#8494AA">&mdash; Checking&hellip;</span>';
  }

  const expiryLine = S.licenseExpiry
    ? '<div style="font-size:11px;color:var(--g400);margin-top:4px">Expires: ' + new Date(S.licenseExpiry).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}) + '</div>'
    : '';

  const clearBtn = keyVal
    ? '<button class="btn bd bsm" id="license-key-clear-btn">&#x2715; Clear</button>'
    : '';

  const blockedWarning = (st==='expired'||st==='revoked')
    ? '<div style="margin-top:12px;padding:12px 16px;background:rgba(239,68,68,.07);border:1px solid rgba(239,68,68,.18);border-radius:9px;font-size:13px;color:#dc2626;font-weight:500">&#9888; All non-admin users are currently blocked. Enter a valid key to restore access.</div>'
    : '';

  return (
    '<div class="card" style="margin-bottom:20px;border-left:3px solid ' + borderClr + '">' +
    '<div class="card-h"><h3>&#128273; License Key</h3>' +
    '<span style="font-size:11px;color:var(--g400)">Set by super-admin &middot; Applied to all users &middot; Expiry badge visible to everyone</span></div>' +
    '<div style="padding:20px 24px">' +
    '<div style="display:flex;align-items:center;gap:14px;margin-bottom:18px;padding:14px 16px;background:var(--g50);border-radius:10px;border:1.5px solid var(--g100);flex-wrap:wrap">' +
    '<div style="flex:1;min-width:180px">' +
    '<div style="font-size:12px;font-weight:700;color:var(--g600);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px">Active Key</div>' +
    '<div style="font-family:monospace;font-size:14px;font-weight:700;color:var(--navy);letter-spacing:.04em">' + (keyVal || '&mdash; Not configured &mdash;') + '</div>' +
    '</div>' +
    '<div>' + statusBadge + expiryLine + '</div>' +
    '</div>' +
    '<div style="display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap">' +
    '<div style="flex:1;min-width:220px">' +
    '<label class="lbl">Enter / Update License Key</label>' +
    '<input class="inp" id="license-key-inp" placeholder="ORG-XXXX-XXXX-XXXX" value="' + keyVal + '" style="font-family:monospace;letter-spacing:.04em"/>' +
    '<div style="font-size:11px;color:var(--g400);margin-top:4px">Paste the key issued by your developer. Leave blank to clear.</div>' +
    '</div>' +
    '<div style="display:flex;gap:8px;padding-bottom:1px">' +
    '<button class="btn bp bsm" id="license-key-save-btn">&#128190; Save Key</button>' +
    clearBtn +
    '</div>' +
    '</div>' +
    '<div id="license-key-status" style="font-size:12px;color:var(--g400);margin-top:8px"></div>' +
    blockedWarning +
    '</div></div>'
  );
}

const EMP_PAGE_SIZE = 50; // rows rendered per page — keep browser fast for 250+ employees

function levelCellHTML(e){
  const l=getEmpLevel(e);
  if(!l){
    const raw=(e.level!=null&&e.level!=='')?String(e.level):'';
    return raw?`<span title="Not a defined level" style="color:var(--g400)">${esc(raw)}</span>`:'<span style="color:var(--g400)">—</span>';
  }
  const explicit=e.level===l.id||(e.level!=null&&e.level!==''&&resolveLevelInput(e.level)===l.id);
  return `<span title="${esc(levelText(l))}${explicit?'':' (auto from designation)'}" style="display:inline-block;background:${explicit?'var(--navy)':'rgba(30,64,128,.1)'};color:${explicit?'#fff':'var(--steel)'};border-radius:6px;padding:2px 7px;font-size:10.5px;font-weight:800;white-space:nowrap">${esc(l.code||l.name)}</span>`;

// Returns dept names sorted by S.departments order; unregistered depts appended after
function sortedDepts(empSubset){
  const empArr=empSubset||S.employees;
  const present=new Set(empArr.map(e=>e.dept||'').filter(Boolean));
  // Registered depts in defined order (only those that exist in employees)
  const ordered=S.departments.map(d=>d.name).filter(n=>present.has(n));

  const unregistered=[...present].filter(n=>!S.departments.some(d=>d.name===n)).sort();
  return [...ordered,...unregistered];
}

// ── Cached allMap ────────────────────────────────────────────────
// Rebuilt only when S.employees reference changes (avoids O(n) rebuild per render).
let _cachedAllMap = null;
let _cachedEmpsRef = null;
function getAllMap(){
  if(_cachedEmpsRef !== S.employees){
    _cachedAllMap = {};
    S.employees.forEach(e=>{ _cachedAllMap[e.id]=e; });
    _cachedEmpsRef = S.employees;
  }
  return _cachedAllMap;
}

// Build a tree for a subset of employees (plantEmps or deptEmps)
// but include their full ancestor chain up to the root (from allEmps).
// Ancestors outside the subset are flagged _isContext=true (greyed in card).
function buildTreeWithAncestors(subEmps, allEmps){
  if(!subEmps||!subEmps.length) return null;
  // Use cached map when allEmps is the global S.employees array (common case)
  const allMap = (allEmps === S.employees) ? getAllMap() : (() => {
    const m={}; allEmps.forEach(e=>{ m[e.id]=e; }); return m;
  })();

  // Collect all ancestors of each sub-employee (iterative, not recursive)
  const needed=new Set(subEmps.map(e=>e.id));
  subEmps.forEach(e=>{
    let cur=e;
    while(cur&&cur.parentId&&allMap[cur.parentId]&&!needed.has(cur.parentId)){
      needed.add(cur.parentId);
      cur=allMap[cur.parentId];
    }
  });

  // Build tree from the needed set
  const subIds=new Set(subEmps.map(e=>e.id));
  const map={};
  needed.forEach(id=>{
    const e=allMap[id];
    if(e) map[id]={...e, children:[], _isContext:!subIds.has(id)};
  });

  const roots=[];
  needed.forEach(id=>{
    const node=map[id];
    if(!node) return;
    if(node.parentId&&map[node.parentId]){
      map[node.parentId].children.push(node);
    } else {
      roots.push(node);
    }
  });

  if(roots.length===0) return null;
  if(roots.length===1) return roots[0];
  return {id:'__virtual_root__',name:'Organisation',designation:'',_isVirtualRoot:true,children:roots};
}

// ── Department Chart ─────────────────────────────────────────────
// Builds a virtual tree where the root is the dept header node
// and children are employees in that dept (preserving parent→child links within dept)
function buildDeptTree(deptEmps, allEmps){
  if(!deptEmps||!deptEmps.length) return null;

  // Map by id for quick lookup (only within dept)
  const deptIds=new Set(deptEmps.map(e=>e.id));
  const map={};
  deptEmps.forEach(e=>{ map[e.id]={...e,children:[]}; });

  // Link parent→child only if parent is also in this dept
  deptEmps.forEach(e=>{
    if(e.parentId&&deptIds.has(e.parentId)){
      map[e.parentId].children.push(map[e.id]);
    }
  });

  // Nodes whose parent is outside this dept (or has no parent) are dept-level roots
  const roots=deptEmps
    .filter(e=>!e.parentId||!deptIds.has(e.parentId))
    .map(e=>map[e.id]);

  // Synthesise a virtual dept header node
  const deptName=deptEmps[0]?.dept||'Unknown';
  return {
    id:'__dept__'+deptName,
    name:deptName,
    designation:'Department',
    dept:'',
    _isDeptHeader:true,
    children:roots
  };
}

function getAllNodeIds(node){
  if(!node) return [];
  const ids=[node.id];
  (node.children||[]).forEach(c=>getAllNodeIds(c).forEach(id=>ids.push(id)));
  return ids;
}

// ── Optimised org-node renderer ──────────────────────────────────
// Uses an iterative stack instead of deep recursion so 250-node trees
// don't blow the call stack or produce one giant synchronous frame.
// Collapsed subtrees generate ZERO inner HTML — only the card itself.
// Annotate tree nodes with _plantLabel and _deptLabel before rendering
// Called from orgNodeHTML for group-level charts
// annotateTreeLabels: walks the tree and stamps _plantBranchLabel on nodes.
// isDeptChart=true: show plant label on a node when:
//   (a) its plantId differs from its parent's plantId  (plant changes mid-tree)
//   (b) it is the very first node of a subtree (isBranchTop=true) AND has a plantId
//       → this ensures the top of every branch always shows its plant name
function annotateTreeLabels(node, parentPlantId, parentDept, isDeptChart, isBranchTop){
  if(!node||node._isVirtualRoot) {
    if(node) (node.children||[]).forEach(c=>annotateTreeLabels(c,'','',isDeptChart,true)); 
    return;
  }
  const myPlant = node.plantId||'';
  const myDept  = node.dept||'';
  node._deptBranchLabel = (myDept && myDept !== parentDept) ? myDept : '';
  if(isDeptChart && myPlant){
    // Show label if plant changes from parent, OR this is the top of its branch
    const plantChanged = myPlant !== parentPlantId;
    node._plantBranchLabel = (plantChanged || isBranchTop) ? myPlant : '';
  } else {
    node._plantBranchLabel = '';
  }
  // Children: only the first child of a new-plant group is a branch top
  // Pass isBranchTop=false for children — they get label only if plant changes
  (node.children||[]).forEach(c=>annotateTreeLabels(c, myPlant, myDept, isDeptChart, false));
}

function orgNodeHTML(node, isRoot=false, isDeptChart=false){
  if(node&&node._isVirtualRoot){
    // Each direct child of virtual root IS the top of its own branch
    (node.children||[]).forEach(c=>annotateTreeLabels(c, '', '', isDeptChart, true));
  } else if(node){
    // Single root: it IS the branch top
    annotateTreeLabels(node, '', '', isDeptChart, true);
  }
  annotateLevels(node);
  return _renderNode(node, isRoot);
}

// annotateLevels: stamps _lvlEff (row index) on every employee node.
// A node can never sit on or above its manager's row, so the effective row is
// max(own level, manager row + 1). Unlevelled staff take the row below their manager.
// If no node in the tree resolves to a defined level, nothing is stamped and the
// chart keeps its compact original layout.
function annotateLevels(root){
  if(!root) return;
  const active=!!(S.levels&&S.levels.length);
  const seen=[]; let any=false;
  const stack=[[root,-1]];
  while(stack.length){
    const [n,pEff]=stack.pop();
    if(!n) continue;
    seen.push(n);
    let eff=pEff;
    if(!active||n._isVirtualRoot||n._isDeptHeader){ n._lvlEff=null; }
    else{
      const own=getLevelRank(n);
      if(own>=0) any=true;
      eff=Math.max(own,pEff+1);
      n._lvlEff=eff;
    }
    (n.children||[]).forEach(c=>stack.push([c,eff]));
  }
  if(!any) seen.forEach(n=>{ n._lvlEff=null; });
}

// ── Level row layout ─────────────────────────────────────────────
// After the tree is in the DOM, cards of the same level are pushed down so they
// share one horizontal row (e.g. AM, DM and Engineer all reporting straight to a
// Manager land on three separate rows instead of one line). A level rail is then
// pinned to the left edge of the scroll area so labels stay visible while the
// chart is scrolled sideways.
function _lvlPush(card,d){
  const node=card.closest('.onode'); if(!node) return;
  const wrap=node.parentElement;
  if(wrap&&wrap.classList.contains('ochild-wrap')&&wrap.firstElementChild&&wrap.firstElementChild.classList.contains('ldrop')){
    const drop=wrap.firstElementChild;
    drop.style.height=((parseFloat(drop.style.height)||0)+d)+'px';
    const cur=parseFloat(wrap.style.getPropertyValue('--drop'))||16;
    wrap.style.setProperty('--drop',(cur+d)+'px');
  } else {
    node.style.marginTop=((parseFloat(node.style.marginTop)||0)+d)+'px';
  }
}
function applyLevelLayout(canvasId){
  const canvas=document.getElementById(canvasId);
  if(!canvas) return;
  const wrap=canvas.parentElement;
  if(!wrap) return;
  [...wrap.children].forEach(el=>{ if(el.classList.contains('lvl-rail')) el.remove(); });
  [...canvas.children].forEach(el=>{ if(el.classList.contains('lvl-bands')) el.remove(); });
  const cards=[...canvas.querySelectorAll('.ocard[data-lvl]')].filter(c=>c.dataset.lvl!=='');
  if(!cards.length||!(S.levels&&S.levels.length)){ canvas.classList.remove('has-levels'); return; }
  canvas.classList.add('has-levels');
  const m=(canvas.style.transform||'').match(/scale\(([\d.]+)\)/);
  const sc=(m&&parseFloat(m[1]))||1;
  const byRank=new Map();
  cards.forEach(c=>{ const r=+c.dataset.lvl; if(!byRank.has(r)) byRank.set(r,[]); byRank.get(r).push(c); });
  const ranks=[...byRank.keys()].sort((a,b)=>a-b);
  const GAP=26; // minimum clear space between the bottom of one row and the next row's cards
  const rows=[]; let prevBottom=-Infinity;
  for(const r of ranks){
    const group=byRank.get(r);
    const cTop=canvas.getBoundingClientRect().top;
    const tops=group.map(c=>(c.getBoundingClientRect().top-cTop)/sc);
    let target=prevBottom+GAP;
    tops.forEach(t=>{ if(t>target) target=t; });
    group.forEach((c,i)=>{ const d=target-tops[i]; if(d>0.5) _lvlPush(c,d); });
    const cTop2=canvas.getBoundingClientRect().top;
    let bottom=target;
    group.forEach(c=>{ const b=(c.getBoundingClientRect().bottom-cTop2)/sc; if(b>bottom) bottom=b; });
    rows.push({rank:r,top:target,bottom});
    prevBottom=bottom;
  }
  // Row bands inside the canvas (also captured by PDF export)
  const bands=document.createElement('div');
  bands.className='lvl-bands';
  rows.forEach((row,i)=>{
    const lv=S.levels[row.rank];
    const b=document.createElement('div');
    b.className='lvl-band'+(i%2?' alt':'');
    // Bands meet halfway between rows, so there is never an empty strip between two levels
    // (rows can sit further apart when the lower cards carry a plant / dept tag above them)
    const prev=rows[i-1], next=rows[i+1];
    const bTop=prev?(prev.bottom+row.top)/2:row.top-14;
    const bBot=next?(row.bottom+next.top)/2:row.bottom+14;
    b.style.top=bTop+'px';
    b.style.height=(bBot-bTop)+'px';
    b.innerHTML=`<span class="lvl-band-lbl">${esc(lv?levelText(lv):'Below '+(levelText(S.levels[S.levels.length-1])||'last level'))}</span>`;
    bands.appendChild(b);
  });
  canvas.insertBefore(bands,canvas.firstChild);
  // Sticky level rail on the scroll container
  if(getComputedStyle(wrap).position==='static') wrap.style.position='relative';
  const wRect=wrap.getBoundingClientRect(), cRect=canvas.getBoundingClientRect();
  const offY=cRect.top-wRect.top-wrap.clientTop+wrap.scrollTop;
  const rail=document.createElement('div');
  rail.className='lvl-rail';
  rows.forEach(row=>{
    const lv=S.levels[row.rank];
    const el=document.createElement('div');
    el.className='lvl-tag'+(lv?'':' extra');
    el.style.top=(offY+((row.top+row.bottom)/2)*sc)+'px';
    if(lv){
      el.innerHTML=`<b>${esc(lv.code||('Level '+(row.rank+1)))}</b><span>${esc(lv.name||'')}</span>`;
      el.title=levelText(lv)+(lv.designations&&lv.designations.length?'\n'+lv.designations.join(', '):'');
    } else {
      el.innerHTML=`<b>+${row.rank-S.levels.length+1}</b><span>below ${esc(S.levels[S.levels.length-1].code||'last level')}</span>`;
      el.title='Staff reporting below the last defined level';
    }
    rail.appendChild(el);
  });
  rail.style.transform=`translateX(${wrap.scrollLeft}px)`;
  wrap.insertBefore(rail,wrap.firstChild);
  if(!wrap._lvlScrollBound){
    wrap._lvlScrollBound=true;
    wrap.addEventListener('scroll',()=>{
      const r=[...wrap.children].find(el=>el.classList.contains('lvl-rail'));
      if(r) r.style.transform=`translateX(${wrap.scrollLeft}px)`;
    },{passive:true});
  }
}
function applyAllLevelLayouts(){
  ['oc-grp','oc-plt','oc-dpt','oc-pa','pub-canvas'].forEach(id=>{
    try{ applyLevelLayout(id); }catch(err){ console.warn('[levels] layout',id,err); }
    try{ attachStickyHScroll(id); }catch(err){ console.warn('[hscroll]',id,err); }
