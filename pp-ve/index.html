<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#1a56a0;--primary-light:#e8f0fb;--primary-dark:#0f3460;
  --accent:#0ea5e9;--success:#16a34a;--warning:#d97706;--danger:#dc2626;--purple:#7c3aed;
  --gray-50:#f9fafb;--gray-100:#f3f4f6;--gray-200:#e5e7eb;--gray-300:#d1d5db;
  --gray-400:#9ca3af;--gray-500:#6b7280;--gray-600:#4b5563;--gray-700:#374151;
  --gray-800:#1f2937;--gray-900:#111827;
  --sidebar-w:248px;--radius:8px;--radius-lg:12px;
  --shadow:0 1px 3px rgba(0,0,0,.1);--shadow-md:0 4px 12px rgba(0,0,0,.08);
  font-family:'Inter',-apple-system,sans-serif;
}
body{background:var(--gray-50);color:var(--gray-900);line-height:1.5;font-size:14px}

/* LOGIN */
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f1724 0%,#1a56a0 100%);padding:20px}
.login-card{background:#fff;border-radius:20px;padding:44px;width:100%;max-width:420px;box-shadow:0 24px 64px rgba(0,0,0,.3)}
.login-logo{text-align:center;margin-bottom:32px}
.login-logo .logo-icon{font-size:52px;margin-bottom:10px}
.login-logo h1{font-size:30px;font-weight:800;color:#0f1724;letter-spacing:-.5px}
.login-logo p{font-size:12px;color:var(--gray-400);margin-top:4px;letter-spacing:.5px;text-transform:uppercase}
.login-footer{text-align:center;font-size:12px;color:var(--gray-400);margin-top:20px}

/* LAYOUT */
.app-layout{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);background:#0f1724;color:#e2e8f0;display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;overflow-y:auto;z-index:100;transition:transform .25s}
.sidebar-logo{padding:14px 12px 12px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;align-items:stretch;gap:0}
.sidebar-logo-img-wrap{background:#fff;border-radius:10px;padding:4px 8px;display:flex;align-items:center;justify-content:center;width:100%;min-height:44px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.sidebar-logo-img-wrap img{max-height:36px;max-width:100%;object-fit:contain;display:block}
.sidebar-logo-emoji{font-size:28px;display:flex;align-items:center;justify-content:center;width:100%;background:#fff;border-radius:10px;padding:8px;min-height:56px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.sidebar-logo-label{display:flex;align-items:center;justify-content:space-between;padding:0 2px}
.logo-text{font-size:15px;font-weight:700;color:#fff;letter-spacing:-.2px}
.logo-sub{font-size:10px;color:#64748b;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
.sidebar-user{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:10px}
.user-avatar{width:34px;height:34px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;flex-shrink:0}
.user-name{font-size:13px;font-weight:600;color:#e2e8f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-role{font-size:11px;color:#64748b}
.sidebar-section{padding:10px 12px 4px}
.sidebar-section-label{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:#475569;padding:0 8px;margin-bottom:4px}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:6px;font-size:13px;color:#94a3b8;cursor:pointer;transition:all .15s;margin-bottom:1px;border:none;background:none;width:100%;text-align:left}
.nav-item:hover{background:rgba(255,255,255,.06);color:#e2e8f0}
.nav-item.active{background:rgba(26,86,160,.4);color:#60a5fa}
.nav-badge{margin-left:auto;background:var(--danger);color:#fff;font-size:10px;font-weight:600;padding:1px 6px;border-radius:10px}
.sidebar-footer{margin-top:auto;padding:12px}
.main-content{margin-left:var(--sidebar-w);flex:1;min-width:0}

/* PAGE */
.page{padding:24px;max-width:1400px}
.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.page-title{font-size:22px;font-weight:700;color:var(--gray-900);letter-spacing:-.3px}
.page-subtitle{font-size:13px;color:var(--gray-500);margin-top:2px}
.page-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:12px;margin-bottom:20px}
.kpi-card{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-lg);padding:14px 16px;position:relative;overflow:hidden}
.kpi-card::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:var(--kpi-color,var(--primary))}
.kpi-label{font-size:11px;color:var(--gray-500);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.kpi-value{font-size:22px;font-weight:700;color:var(--gray-900);line-height:1.2;margin:4px 0}
.kpi-sub{font-size:11px;color:var(--gray-400)}
.kpi-icon{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:40px;opacity:.35;pointer-events:none;line-height:1;filter:saturate(1.2)}

/* CARD */
.card{background:#fff;border-radius:var(--radius-lg);border:1px solid var(--gray-200);padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.card-title{font-size:14px;font-weight:600;color:var(--gray-800);margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.chart-wrap{position:relative;height:180px;width:100%}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* TABLE */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;font-weight:600;color:var(--gray-500);padding:10px 12px;border-bottom:2px solid var(--gray-200);white-space:nowrap;background:var(--gray-50)}
td{padding:10px 12px;border-bottom:1px solid var(--gray-100);font-size:13px;color:var(--gray-700);vertical-align:middle}
tr:hover td{background:#fafbff}
.text-right{text-align:right}
.font-semibold{font-weight:600}

/* FORMS */
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:13px;font-weight:500;color:var(--gray-700);margin-bottom:6px}
.form-label .req{color:var(--danger)}
.form-input,.form-select,.form-textarea{width:100%;padding:9px 12px;border:1px solid var(--gray-300);border-radius:var(--radius);font-size:14px;font-family:inherit;outline:none;transition:border .15s,box-shadow .15s;background:#fff;color:var(--gray-900)}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
.form-textarea{resize:vertical;min-height:80px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.form-full{grid-column:1/-1}

/* FILE UPLOAD */
.file-upload-area{border:2px dashed var(--gray-300);border-radius:var(--radius-lg);padding:24px;text-align:center;cursor:pointer;transition:all .15s;background:var(--gray-50)}
.file-upload-area:hover,.file-upload-area.dragover{border-color:var(--primary);background:var(--primary-light)}
.file-upload-area input{display:none}
.file-preview{display:flex;align-items:center;gap:10px;padding:10px;background:var(--gray-50);border-radius:var(--radius);border:1px solid var(--gray-200);margin-top:8px}
.file-preview img{width:48px;height:48px;object-fit:cover;border-radius:4px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius);font-size:13.5px;font-weight:500;cursor:pointer;border:none;transition:all .15s;font-family:inherit;text-decoration:none}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:#154a8a}
.btn-secondary{background:var(--gray-100);color:var(--gray-700);border:1px solid var(--gray-200)}.btn-secondary:hover{background:var(--gray-200)}
.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{background:#b91c1c}
.btn-success{background:var(--success);color:#fff}.btn-success:hover{background:#15803d}
.btn-warning{background:var(--warning);color:#fff}.btn-warning:hover{background:#b45309}
.btn-ghost{background:none;color:var(--gray-500);padding:4px 8px}.btn-ghost:hover{background:var(--gray-100);color:var(--gray-700)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-xs{padding:3px 8px;font-size:11px}
.w-full{width:100%;justify-content:center}

/* BADGE */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;gap:4px}
.badge-success{background:#dcfce7;color:#16a34a}
.badge-danger{background:#fee2e2;color:#dc2626}
.badge-warning{background:#fef3c7;color:#d97706}
.badge-info{background:#dbeafe;color:#1d4ed8}
.badge-purple{background:#ede9fe;color:#7c3aed}
.badge-gray{background:var(--gray-100);color:var(--gray-600)}

/* ALERT */
.alert{display:flex;align-items:flex-start;gap:10px;padding:12px 16px;border-radius:var(--radius);font-size:13.5px;margin-bottom:12px}
.alert-danger{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
.alert-warning{background:#fffbeb;color:#92400e;border:1px solid #fde68a}
.alert-info{background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe}
.alert-success{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:999;padding:20px;overflow-y:auto}
.modal{background:#fff;border-radius:16px;width:100%;max-width:600px;box-shadow:0 24px 64px rgba(0,0,0,.25);max-height:90vh;display:flex;flex-direction:column}
.modal-lg{max-width:800px}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--gray-200);flex-shrink:0}
.modal-header h2{font-size:17px;font-weight:600}
.modal-header button{background:none;border:none;font-size:20px;cursor:pointer;color:var(--gray-400);line-height:1;padding:4px}
.modal-body{padding:24px;overflow-y:auto;flex:1}
.modal-footer{padding:16px 24px;border-top:1px solid var(--gray-200);display:flex;justify-content:flex-end;gap:8px;flex-shrink:0}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:var(--radius);font-size:13.5px;font-weight:500;z-index:9999;box-shadow:var(--shadow-md);animation:slideup .2s ease;max-width:360px}
.toast-success{background:#16a34a;color:#fff}
.toast-error{background:#dc2626;color:#fff}
.toast-warning{background:#d97706;color:#fff}
.toast-info{background:#1a56a0;color:#fff}
@keyframes slideup{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}

/* VEHICLE CARD */
.vehicle-card{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-lg);padding:20px;position:relative;overflow:hidden;transition:box-shadow .15s}
.vehicle-card:hover{box-shadow:var(--shadow-md)}
.vehicle-card-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px}
.vehicle-reg{font-size:18px;font-weight:700;color:var(--gray-900)}
.vehicle-make{font-size:12px;color:var(--gray-500);margin-top:2px}
.vehicle-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.vehicle-stat{background:var(--gray-50);border-radius:var(--radius);padding:8px 10px}
.vehicle-stat-label{font-size:10px;color:var(--gray-500);text-transform:uppercase;letter-spacing:.4px}
.vehicle-stat-value{font-size:14px;font-weight:600;color:var(--gray-900);margin-top:2px}
.vehicle-actions{display:flex;gap:6px;flex-wrap:wrap}

/* TABS */
.tabs{display:flex;border-bottom:2px solid var(--gray-200);margin-bottom:20px;gap:0;overflow-x:auto}
.tab{padding:10px 16px;font-size:13px;font-weight:500;color:var(--gray-500);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;background:none;border-top:none;border-left:none;border-right:none;transition:all .15s}
.tab:hover{color:var(--gray-700)}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}

/* REPORT BAR */
.report-row{display:flex;align-items:center;gap:12px;margin-bottom:10px;font-size:13px}
.report-row>span:first-child{width:160px;flex-shrink:0;color:var(--gray-600);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.report-bar-wrap{flex:1;background:var(--gray-100);border-radius:4px;height:8px;overflow:hidden}
.report-bar{height:100%;border-radius:4px;transition:width .5s ease}

/* TIMELINE */
.timeline{position:relative;padding-left:24px}
.timeline::before{content:'';position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--gray-200)}
.timeline-item{position:relative;margin-bottom:20px}
.timeline-dot{position:absolute;left:-20px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--primary);border:2px solid #fff;box-shadow:0 0 0 2px var(--primary)}
.timeline-date{font-size:11px;color:var(--gray-400);margin-bottom:4px}
.timeline-content{background:var(--gray-50);border-radius:var(--radius);padding:10px 14px;border:1px solid var(--gray-200)}

/* EMISSION FACTOR */
.emission-factor-row{display:flex;align-items:center;gap:12px;padding:10px;border-radius:var(--radius);background:var(--gray-50);margin-bottom:8px;border:1px solid var(--gray-200)}
.emission-factor-fuel{font-size:13px;font-weight:600;flex:1}
.emission-factor-val{font-size:13px;color:var(--gray-600)}
.emission-factor-unit{font-size:11px;color:var(--gray-400)}

/* AUDIT */
.audit-row{padding:10px 0;border-bottom:1px solid var(--gray-100);font-size:12px}
.audit-action{font-weight:600;color:var(--gray-800)}
.audit-meta{color:var(--gray-400);margin-top:2px}

/* STATS MINI */
.stat-mini{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--gray-100)}
.stat-mini-label{font-size:12px;color:var(--gray-500);flex:1}
.stat-mini-val{font-size:13px;font-weight:600;color:var(--gray-800)}

/* CO2 */
.co2-badge{display:inline-flex;align-items:center;gap:4px;background:#ecfdf5;color:#059669;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}

/* NOTIFICATION DOT */
.notif-dot{width:8px;height:8px;border-radius:50%;background:var(--danger);display:inline-block;margin-left:4px}

/* MOBILE */
.mobile-toggle{display:none;position:fixed;top:12px;left:12px;z-index:200;background:#0f1724;color:#fff;border:none;border-radius:8px;padding:8px 10px;font-size:18px;cursor:pointer}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99}

@media(max-width:900px){
  .mobile-toggle{display:block}
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .sidebar-overlay.open{display:block}
  .main-content{margin-left:0}
  .chart-grid,.grid-2{grid-template-columns:1fr}
  .form-grid,.form-grid-3{grid-template-columns:1fr}
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:480px){.kpi-grid{grid-template-columns:1fr}}

.mb-4{margin-bottom:16px}
.mt-4{margin-top:16px}
.mt-2{margin-top:8px}
.text-center{text-align:center}
.text-muted{color:var(--gray-400)}
.text-danger{color:var(--danger)}
.text-success{color:var(--success)}
.text-warning{color:var(--warning)}
.flex{display:flex}.items-center{align-items:center}.gap-2{gap:8px}.gap-3{gap:12px}
.justify-between{justify-content:space-between}
.divider{border:none;border-top:1px solid var(--gray-200);margin:16px 0}

/* ── PILL FILTER BAR ─────────────────────────────────────────── */
/* filter pills now inline in page headers */
.pill{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1.5px solid var(--gray-200);background:#fff;color:var(--gray-600);white-space:nowrap;transition:all .15s;user-select:none;flex-shrink:0}
.pill:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-light)}
.pill.active{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:600}
.pill.active-year{background:#0f3460;color:#fff;border-color:#0f3460}
.pill.active-plant{background:#0ca678;color:#fff;border-color:#0ca678}
@media(max-width:900px){
}
</style>

function genSampleExpenses() {
  const exps = [];
  let id = 1;
  const months = ['2026-01','2026-02','2026-03','2026-04','2026-05','2026-06','2026-07','2026-08'];
  SAMPLE_VEHICLES.forEach(v => {
    let prevOdo = v.odometer - 8000;
    months.forEach((m, mi) => {
      const fuelQty = v.type==='HCV'?200:v.type==='Bus'?140:55;
      const rate = v.fuel==='Diesel'?93:107;
      const dist = fuelQty * 8.5;
      const ef = EMISSION_FACTORS_DEFAULT[v.fuel]||2.68;
      const co2 = parseFloat((fuelQty * ef).toFixed(2));
      const currOdo = prevOdo + dist;
      exps.push({ id:`exp-${id++}`, vehicleId:v.id, plantId:v.plantId, date:`${m}-10`, category:'Fuel', amount:Math.round(fuelQty*rate), fuelQty, fuelRate:rate, vendor:'HP Petroleum', invoiceNo:`INV-${id}`, odometer:Math.round(currOdo), prevOdometer:Math.round(prevOdo), distanceTravelled:Math.round(dist), co2Emission:co2, emissionFactor:ef, hasBill:true, billUrl:'', enteredBy:'System', createdAt:new Date().toISOString() });
      prevOdo = currOdo;
      if (mi%2===0) exps.push({ id:`exp-${id++}`, vehicleId:v.id, plantId:v.plantId, date:`${m}-20`, category:'Maintenance', amount:Math.round(3000+Math.random()*5000), fuelQty:0, vendor:'Speed Motors', invoiceNo:`INV-${id}`, odometer:Math.round(currOdo+500), prevOdometer:Math.round(currOdo), distanceTravelled:500, co2Emission:0, emissionFactor:0, hasBill:true, billUrl:'', enteredBy:'System', createdAt:new Date().toISOString() });
    });
  });
  return exps;
}

const fmt = n => Number(n||0).toLocaleString('en-IN');
const fmtR = n => '₹' + fmt(n);
const fmtDate = d => d ? new Date(d).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}) : '—';
const daysLeft = d => { if(!d) return 9999; return Math.ceil((new Date(d)-new Date())/86400000); };
const severity = dl => dl<0?'expired':dl<=15?'critical':dl<=30?'warning':dl<=60?'notice':'ok';
const sevColor = s => ({expired:'#dc2626',critical:'#ea580c',warning:'#d97706',notice:'#0ea5e9',ok:'#16a34a'})[s]||'#6b7280';
const sevBadge = s => ({expired:'badge-danger',critical:'badge-danger',warning:'badge-warning',notice:'badge-info',ok:'badge-success'})[s]||'badge-gray';
const uid = () => 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2,7);
const isSA = () => S.isSuperAdmin;
const myPlantId = () => S.userProfile?.plantId || '';

function myPlants() {
  return (isSA() || S.isTopMgmt) ? S.plants : S.plants.filter(p => p.id === myPlantId());
}
function myVehicles() {
  return (isSA() || S.isTopMgmt) ? S.vehicles : S.vehicles.filter(v => v.plantId === myPlantId());
}
function myExpenses() {
  return (isSA() || S.isTopMgmt) ? S.expenses : S.expenses.filter(e => e.plantId === myPlantId());
}
function filteredExpenses() {
  const search = (S.expVehicleSearch||'').toLowerCase().trim();
  return myExpenses().filter(e => {
    if (S.filterPlant && e.plantId !== S.filterPlant) return false;
    if (S.filterYear && !e.date.startsWith(S.filterYear)) return false;
    if (S.filterMonth && !e.date.startsWith(S.filterYear + '-' + S.filterMonth)) return false;
    if (S.filterVehicle && e.vehicleId !== S.filterVehicle) return false;
    if (S.filterCat && e.category !== S.filterCat) return false;
    if (search) {
      const v = S.vehicles.find(x=>x.id===e.vehicleId);
      const reg = (v?.regNo||'').toLowerCase();
      const make = ((v?.make||'')+(v?.model||'')).toLowerCase();
      if (!reg.includes(search) && !make.includes(search)) return false;
    }
    return true;
  });
}

function getAlerts(days=90) {
  const alerts = [];
  myVehicles().forEach(v => {
    [['insuranceExpiry','Insurance'],['pucExpiry','PUC Certificate']].forEach(([f,label]) => {
      const dl = daysLeft(v[f]);
      if (dl<=days) alerts.push({ vehicleId:v.id, regNo:v.regNo, docType:label, expiryDate:v[f], daysLeft:dl, severity:severity(dl), plantId:v.plantId });
    });
  });
  return alerts.sort((a,b)=>a.daysLeft-b.daysLeft);
}

function getCO2Total(vehicleId) {
  return myExpenses().filter(e=>e.vehicleId===vehicleId).reduce((s,e)=>s+(e.co2Emission||0),0);
}
function getTotalDistance(vehicleId) {
  return myExpenses().filter(e=>e.vehicleId===vehicleId&&e.category==='Fuel').reduce((s,e)=>s+(e.distanceTravelled||0),0);
}
function getAvgMileage(vehicleId) {
  const fuelExps = myExpenses().filter(e=>e.vehicleId===vehicleId&&e.category==='Fuel');
  const totalFuel = fuelExps.reduce((s,e)=>s+(e.fuelQty||0),0);
  const totalDist = fuelExps.reduce((s,e)=>s+(e.distanceTravelled||0),0);
  return totalFuel>0 ? (totalDist/totalFuel).toFixed(1) : 0;
}
function getVehicleExpenses(vehicleId) {
  return myExpenses().filter(e=>e.vehicleId===vehicleId).reduce((s,e)=>s+e.amount,0);
}
function plantName(id) { return S.plants.find(p=>p.id===id)?.name || id; }
function vehicleReg(id) { return S.vehicles.find(v=>v.id===id)?.regNo || id; }

function addAudit(action, oldVal='', newVal='', extra='') {

      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    </div>`;

    // Load plants from VEMS-specific collection
    const plantsSnap = await getDocs(collection(db, 'vems_plants'));
    S.plants = plantsSnap.docs.map(d => ({ id: d.id, ...d.data() }));

    // Load vehicles (all for SA, plant-filtered for admin)
    const vehiclesSnap = await getDocs(
      isSA() ? collection(db, 'vems_vehicles')
             : query(collection(db, 'vems_vehicles'), where('plantId', '==', myPlantId()))
    );
    S.vehicles = vehiclesSnap.docs.map(d => ({ id: d.id, ...d.data() }));

    // Load expenses for current + previous year
    const yearStart = `${parseInt(S.filterYear)-1}-01-01`;
    const yearEnd   = `${S.filterYear}-12-31`;
    const expSnap = await getDocs(
      isSA()
        ? query(collection(db,'vems_expenses'), where('date','>=',yearStart), where('date','<=',yearEnd), orderBy('date','desc'))
        : query(collection(db,'vems_expenses'), where('plantId','==',myPlantId()), where('date','>=',yearStart), where('date','<=',yearEnd), orderBy('date','desc'))
    );
    S.expenses = expSnap.docs.map(d => ({ id: d.id, ...d.data() }));

    // Load emission factors
    try {
      const efDoc = await getDoc(doc(db, 'vems_settings', 'emissionFactors'));
      if (efDoc.exists()) S.emissionFactors = { ...EMISSION_FACTORS_DEFAULT, ...efDoc.data() };
    } catch {}

    // Load users list (superadmin only)
    if (isSA()) await fsLoadUsers();

    S.dataLoaded = true;
    S.loading = false;

    // If no data exists yet, seed with sample data for first-time setup
    if (S.plants.length === 0 && isSA()) await seedSampleData();

    render();
  } catch(e) {
    console.error('Firestore load error:', e);
    S.loading = false; S.dataLoaded = true;
    showToast('Error loading data: ' + e.message, 'error');
    render();
  }
}

// Creates a user via Firebase Auth REST API (doesn't require Email/Password provider enabled
// in the client SDK — uses the project's Web API key directly) then saves to Firestore.
async function fsInviteUser(email, displayName, plantId, password) {
  const apiKey = firebaseConfig.apiKey;
  // Step 1: Create Firebase Auth user via REST API (port 443, no CORS issue)
  const signUpRes = await fetch(
    `https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${apiKey}`,
    {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password, returnSecureToken: false }),
    }
  );
  const signUpData = await signUpRes.json();
  if (!signUpRes.ok) {
    const errCode = signUpData?.error?.message || 'UNKNOWN_ERROR';
    if (errCode === 'EMAIL_EXISTS') throw new Error('This email is already registered.');
    if (errCode === 'WEAK_PASSWORD : Password should be at least 6 characters') throw new Error('Password must be at least 6 characters.');
    throw new Error(errCode.replace(/_/g,' ').toLowerCase());
  }
  const newUid = signUpData.localId;

  // Step 2: Write Firestore profile
  const profile = {
    email, displayName, plantId,
    role: 'plant_admin', status: 'Active',
    createdAt: serverTimestamp(), createdBy: S.user?.email,
  };
  await setDoc(doc(db,'users', newUid), profile);
  S.users.push({ uid: newUid, ...profile, createdAt: new Date() });

  // Step 3: Send password-reset email so the user can set their own password
  // (works even if Email/Password provider is restricted — uses Admin action code)
  try {
    await sendPasswordResetEmail(auth, email);
  } catch(e) {
    console.warn('[fsInviteUser] Could not send password reset email:', e.message);
    // Non-fatal — user record still created
  }

  addAudit('User Created','', `${displayName} (${email}) → ${plantName(plantId)}`);
}

      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" id="usr-submit-btn" onclick="saveUser('${uid}')">
          ${isEdit ? '💾 Save Changes' : 'Create User'}
        </button>
      </div>

window.saveUser = async function(uid='') {
  const isEdit = !!uid;
  const displayName = document.getElementById('usr-name')?.value.trim();
  const email = document.getElementById('usr-email')?.value.trim();
  const plantId = document.getElementById('usr-plant')?.value;
  const status = document.getElementById('usr-status')?.value || 'Active';

  if (!displayName) return showToast('Name is required', 'error');
  if (!email) return showToast('Email is required', 'error');
  if (!plantId) return showToast('Please select an assigned plant', 'error');

  if (!isEdit) {
    const pass = document.getElementById('usr-pass')?.value;
    if (!pass || pass.length < 6) return showToast('Password must be at least 6 characters', 'error');

    const btn = document.getElementById('usr-submit-btn');
    if (btn) { btn.textContent = '⏳ Creating…'; btn.disabled = true; }
    try {
      await fsInviteUser(email, displayName, plantId, pass);
      showToast(`✅ User ${displayName} created! Setup email sent to ${email}.`, 'success');
      closeModal(); render();
    } catch(e) {
      if (btn) { btn.textContent = 'Create User'; btn.disabled = false; }
      const msg = e.message.replace('Firebase: ','').replace(/\(auth\/([^)]+)\)/,'').trim();
      showToast('Error: ' + msg, 'error');
    }
  } else {
    const btn = document.getElementById('usr-submit-btn');
    if (btn) { btn.textContent = '⏳ Saving…'; btn.disabled = true; }
    try {
      await fsUpdateUser(uid, { displayName, plantId, status });
      showToast('User updated!', 'success');
      closeModal(); render();
    } catch(e) {
      if (btn) { btn.textContent = '💾 Save Changes'; btn.disabled = false; }
      showToast('Error: '+e.message, 'error');
    }
  }
};

// ── MAGIC LINK DETECTION ──────────────────────────────────────────
async function handleMagicLink() {
  if (!isSignInWithEmailLink(auth, window.location.href)) return false;
  let email = localStorage.getItem('vems_magic_email');
  if (!email) {
    email = window.prompt('Please enter your email to confirm sign-in:');
    if (!email) return false;
  }
  try {
    await signInWithEmailLink(auth, email, window.location.href);
    localStorage.removeItem('vems_magic_email');
    window.history.replaceState({}, document.title, window.location.pathname);
    return true;
  } catch(e) {
    showToast('Magic link expired or invalid. Please request a new one.', 'error');
    return false;
  }
}

onAuthStateChanged(auth, async user => {
  S.user = user;
  if (user) {
    S.isSuperAdmin = user.email === SUPERADMIN_EMAIL;
    S.isTopMgmt = TOP_MGMT_EMAILS.includes(user.email) && !S.isSuperAdmin;
    if (!S.isSuperAdmin && !S.isTopMgmt) {
      try {
        const snap = await getDoc(doc(db,'users', user.uid));
        S.userProfile = snap.exists() ? snap.data() : { plantId:'', role:'plant_admin' };
      } catch { S.userProfile = { plantId:'', role:'plant_admin' }; }
    }
    S.page = S.isTopMgmt ? 'topmgmt' : 'dashboard';
    S.dataLoaded = false;
    await loadFirestoreData(); // Load real data from Firestore
  } else {
    const handled = await handleMagicLink();
    if (!handled) { S.page = 'login'; render(); }
    return;
  }
});

async function doLogin(email, pw) {
  try {
    await signInWithEmailAndPassword(auth, email, pw);
  } catch(e) {
    showToast(e.message.replace('Firebase: ','').replace(/\(.*\)/,''), 'error');
  }
}
async function doLogout() {
  if (S.isTopMgmt) {
    S.user = null; S.isTopMgmt = false; S.page = 'login'; render(); return;
  }
  await signOut(auth); S.page='login'; render();
}

window.handleLogoUpload = function(input) {
  const file = input.files[0];
  if (!file) return;
  if (file.size > 512000) return showToast('Logo must be under 500KB', 'error');
  const reader = new FileReader();
  reader.onload = e => {
    S.companyLogo = e.target.result;
    localStorage.setItem('vems_logo', e.target.result);
    // Update preview immediately
    const wrap = document.getElementById('logo-preview-wrap');
    if (wrap) wrap.innerHTML = `<img src="${e.target.result}" id="logo-preview-img" style="max-width:76px;max-height:76px;object-fit:contain"/>`;
    showToast('Logo uploaded! Save settings to apply everywhere.', 'success');
    render();
  };
  reader.readAsDataURL(file);
};

  localStorage.removeItem('vems_logo');

};

window.updateCronPreview = function(type, istTime) {
  const isWeekly = type === 'weekly';
  const cron = cronFromTime(istTime, isWeekly ? 'weekly' : 'daily');
  const el = document.getElementById(`cron-preview-${type}`);
  if (el) {
    el.textContent = cron;
    el.nextElementSibling.textContent = `= ${istTime} IST ${isWeekly ? 'every Monday' : 'daily'}`;
  }
};

function initCharts() {
  const exps = filteredExpenses();
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const monthKeys = MONTHS.map(m=>`${S.filterYear}-${m.val}`);
  const commonOpts = { responsive:true, maintainAspectRatio:false };

  const mc = document.getElementById('chart-monthly');
  if (mc && !S.charts.monthly) S.charts.monthly = new Chart(mc,{type:'bar',data:{labels:months,datasets:[{label:'Expenses (₹)',data:monthKeys.map(m=>exps.filter(e=>e.date.startsWith(m)).reduce((s,e)=>s+e.amount,0)),backgroundColor:'#1a56a0',borderRadius:3,borderSkipped:false}]},options:{...commonOpts,plugins:{legend:{display:false}},scales:{y:{ticks:{callback:v=>'₹'+(v/1000).toFixed(0)+'k'},grid:{color:'#f3f4f6'}},x:{grid:{display:false}}}}});

  const cats = EXPENSE_CATEGORIES.slice(0,6);
  const cc = document.getElementById('chart-category');
  if (cc && !S.charts.category) S.charts.category = new Chart(cc,{type:'doughnut',data:{labels:cats,datasets:[{data:cats.map(cat=>exps.filter(e=>e.category===cat).reduce((s,e)=>s+e.amount,0)),backgroundColor:['#1a56a0','#0ea5e9','#16a34a','#d97706','#dc2626','#7c3aed'],borderWidth:2,borderColor:'#fff'}]},options:{...commonOpts,cutout:'65%',plugins:{legend:{position:'right',labels:{font:{size:10},boxWidth:10,padding:6}}}}});

  if (isSA()) {
    const pc = document.getElementById('chart-plant');
    if (pc && !S.charts.plant) S.charts.plant = new Chart(pc,{type:'bar',data:{labels:S.plants.map(p=>p.code),datasets:[{label:'Expenses',data:S.plants.map(p=>exps.filter(e=>e.plantId===p.id).reduce((s,e)=>s+e.amount,0)),backgroundColor:['#1a56a0','#0ea5e9','#16a34a','#d97706'],borderRadius:4}]},options:{...commonOpts,plugins:{legend:{display:false}},scales:{y:{ticks:{callback:v=>'₹'+(v/1000).toFixed(0)+'k'},grid:{color:'#f3f4f6'}},x:{grid:{display:false}}}}});
    const co2c = document.getElementById('chart-co2');
    if (co2c && !S.charts.co2) S.charts.co2 = new Chart(co2c,{type:'line',data:{labels:months,datasets:[{label:'CO₂ (kg)',data:monthKeys.map(m=>exps.filter(e=>e.date.startsWith(m)).reduce((s,e)=>s+(e.co2Emission||0),0).toFixed(1)),borderColor:'#16a34a',backgroundColor:'rgba(22,163,74,.08)',fill:true,tension:.4,pointRadius:3,pointBackgroundColor:'#16a34a'}]},options:{...commonOpts,plugins:{legend:{display:false}},scales:{y:{grid:{color:'#f3f4f6'}},x:{grid:{display:false}}}}});
  }
}

// ── CO2 ───────────────────────────────────────────────────────────
function co2HTML() {
  const exps = myExpenses();
  const fuelExps = exps.filter(e=>e.category==='Fuel');
  const totalCO2 = exps.reduce((s,e)=>s+(e.co2Emission||0),0);
  const totalDist = fuelExps.reduce((s,e)=>s+(e.distanceTravelled||0),0);
  const co2perKm = totalDist>0?(totalCO2/totalDist).toFixed(3):0;
  const co2Tonnes = (totalCO2/1000).toFixed(2);

  const byPlant = myPlants().map(p=>({...p, co2:exps.filter(e=>e.plantId===p.id).reduce((s,e)=>s+(e.co2Emission||0),0)}));
  const byFuel = FUEL_TYPES.map(f=>({fuel:f, co2:exps.filter(e=>{ const v=S.vehicles.find(x=>x.id===e.vehicleId); return v?.fuel===f; }).reduce((s,e)=>s+(e.co2Emission||0),0)})).filter(f=>f.co2>0);
  const byVehicle = myVehicles().map(v=>({...v, co2:getCO2Total(v.id), dist:getTotalDistance(v.id)})).sort((a,b)=>b.co2-a.co2).slice(0,10);

  return `<div class="page">
    <div class="page-header">
      <div><h1 class="page-title">🌱 CO₂ Emissions Dashboard</h1><p class="page-subtitle">Carbon footprint tracking & analysis</p></div>
      <div class="page-actions">
        <button class="btn btn-secondary" onclick="exportCO2CSV()">⬇ CO₂ Report CSV</button>
        <button class="btn btn-secondary" onclick="exportCO2PDF()">⬇ CO₂ PDF</button>
      </div>
    </div>
    <div class="kpi-grid">
      ${kpi('Total CO₂',totalCO2.toFixed(0)+' kg','All vehicles','#dc2626','🌱')}
      ${kpi('CO₂ (Tonnes)',co2Tonnes+' t CO₂e','Equivalent','#d97706','🌍')}
      ${kpi('CO₂ per KM',co2perKm+' kg/km','Fleet average','#7c3aed','📊')}
      ${kpi('Total Distance',fmt(totalDist.toFixed(0))+' km','Covered','#0ea5e9','🛣️')}
    </div>
    <div class="chart-grid">
      <div class="card"><div class="card-title">Monthly CO₂ Trend</div><div class="chart-wrap"><canvas id="co2-monthly"></canvas></div></div>
      <div class="card"><div class="card-title">Fuel-wise CO₂</div><div class="chart-wrap"><canvas id="co2-fuel"></canvas></div></div>
    </div>
    ${isSA()?`<div class="card mb-4">
      <div class="card-title">Plant-wise CO₂ Emissions</div>
      ${byPlant.map(p=>`<div class="report-row">
        <span>${p.name}</span>
        <div class="report-bar-wrap"><div class="report-bar" style="width:${totalCO2?Math.round(p.co2/totalCO2*100):0}%;background:#dc2626"></div></div>
        <span class="font-semibold">${p.co2.toFixed(1)} kg</span>
      </div>`).join('')}
    </div>`:''}
    <div class="card mb-4">
      <div class="card-title">Fuel-wise Emission Breakdown</div>
      ${byFuel.map(f=>`<div class="report-row">
        <span>${f.fuel}</span>
        <div class="report-bar-wrap"><div class="report-bar" style="width:${totalCO2?Math.round(f.co2/totalCO2*100):0}%;background:#d97706"></div></div>
        <span class="font-semibold">${f.co2.toFixed(1)} kg · Factor: ${S.emissionFactors[f.fuel]||'—'} kg/L</span>
      </div>`).join('')}
    </div>
    <div class="card">
      <div class="card-title">Top 10 High-Emission Vehicles</div>
      <div class="table-wrap"><table>
        <thead><tr><th>Vehicle</th><th>Plant</th><th>Fuel</th><th>Distance</th><th>CO₂ (kg)</th><th>CO₂/km</th></tr></thead>
        <tbody>${byVehicle.map(v=>`<tr>
          <td><b>${v.regNo}</b><br><span style="font-size:11px;color:var(--gray-400)">${v.make} ${v.model}</span></td>
          <td>${S.plants.find(p=>p.id===v.plantId)?.code||'—'}</td>
          <td>${v.fuel}</td>
          <td>${fmt(v.dist.toFixed(0))} km</td>
          <td class="font-semibold text-danger">${v.co2.toFixed(1)}</td>
          <td>${v.dist>0?(v.co2/v.dist).toFixed(3):0} kg/km</td>
        </tr>`).join('')}</tbody>
      </table></div>
    </div>
    <div class="card">
      <div class="card-title">Emission Factors Used</div>
      ${Object.entries(S.emissionFactors).map(([f,ef])=>`
        <div class="emission-factor-row">
          <span class="emission-factor-fuel">${f}</span>

    if(pc&&!S.charts.repPlant) S.charts.repPlant = new Chart(pc,{type:'bar',data:{labels:byPlant.map(p=>p.code),datasets:[{label:'Expenses',data:byPlant.map(p=>p.total),backgroundColor:['#1a56a0','#0ea5e9','#16a34a','#d97706'],borderRadius:4}]},options:{...commonOpts,plugins:{legend:{display:false}},scales:{y:{ticks:{callback:v=>'₹'+(v/1000).toFixed(0)+'k'},grid:{color:'#f3f4f6'}},x:{grid:{display:false}}}}});

    if(cc&&!S.charts.repCat) S.charts.repCat = new Chart(cc,{type:'doughnut',data:{labels:byCat.map(c=>c.cat),datasets:[{data:byCat.map(c=>c.total),backgroundColor:['#1a56a0','#0ea5e9','#16a34a','#d97706','#dc2626','#7c3aed'],borderWidth:2,borderColor:'#fff'}]},options:{...commonOpts,cutout:'60%',plugins:{legend:{position:'right',labels:{font:{size:10},boxWidth:10}}}}});
  }
  if (tab==='maintenance') {
    const maintCats = ['Maintenance','Repair','Tyres','Battery','Spare Parts','Breakdown','Washing'];
    const maintExps = exps.filter(e=>maintCats.includes(e.category));
    const catData = maintCats.map(c=>maintExps.filter(e=>e.category===c).reduce((s,e)=>s+e.amount,0)).filter((_,i)=>maintExps.some(e=>e.category===maintCats[i]));

    const mc = document.getElementById('maint-chart');
    if(mc&&!S.charts.maintChart) S.charts.maintChart = new Chart(mc,{type:'doughnut',data:{labels:catLabels,datasets:[{data:catData,backgroundColor:['#d97706','#dc2626','#0ea5e9','#7c3aed','#16a34a','#ea580c','#0891b2'],borderWidth:2,borderColor:'#fff'}]},options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{position:'bottom',labels:{font:{size:10},boxWidth:10}}}}});
  }
}

window.saveEmissionFactors = async function() {
  FUEL_TYPES.forEach(f=>{ const el=document.getElementById(`ef-${f}`); if(el) S.emissionFactors[f]=parseFloat(el.value)||0; });
  try {
    await fsSaveEmissionFactors(S.emissionFactors);
    addAudit('Updated Emission Factors');
    showToast('Emission factors saved to Firestore!');
  } catch(e) { showToast('Error: '+e.message,'error'); }
};

function cronFromTime(timeStr, type) {
  // Since Cloud Scheduler timezone is set to Asia/Kolkata,
  // we use IST time directly in cron — NO UTC conversion needed
  const [h, m] = (timeStr||'08:00').split(':').map(Number);
  return type === 'weekly' ? `${m} ${h} * * 1` : `${m} ${h} * * *`;
}

function istFromCron(cronStr) {
  // Parse cron → display as IST (direct since TZ=Asia/Kolkata)
  if (!cronStr) return '08:00';
  const parts = cronStr.trim().split(/\s+/);
  if (parts.length < 2) return '08:00';
  const m = parseInt(parts[0]);
  const h = parseInt(parts[1]);
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}

window.saveAndSyncSchedules = async function() {
  const statusEl = document.getElementById('sync-status');
  if (statusEl) statusEl.innerHTML = `<span style="color:#d97706">⏳ Syncing schedules with Cloud Scheduler...</span>`;

  // Read current form values
  const dailyTime   = document.getElementById('sa-daily-time')?.value   || '08:00';
  const weeklyTime  = document.getElementById('sa-weekly-time')?.value  || '08:00';
  const invoiceTime = document.getElementById('sa-invoice-time')?.value || '09:00';
  const dailyEnabled   = document.getElementById('sa-daily-enabled')?.checked ?? true;
  const weeklyEnabled  = document.getElementById('sa-weekly-enabled')?.checked ?? true;
  const invoiceEnabled = document.getElementById('sa-invoice-enabled')?.checked ?? true;

  const jobs = [
    { name:'dailyCriticalAlerts',    schedule:cronFromTime(dailyTime,'daily'),   enabled:dailyEnabled },
    { name:'weeklySummaryReport',    schedule:cronFromTime(weeklyTime,'weekly'),  enabled:weeklyEnabled },
    { name:'missingInvoiceReminder', schedule:cronFromTime(invoiceTime,'daily'),  enabled:invoiceEnabled },
  ];

  // Get Firebase ID token for auth
  let idToken = '';
  try {
    const { getAuth } = await import('https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js');
    // auth is already initialized globally
    idToken = await window._auth?.currentUser?.getIdToken() || '';
  } catch(e) { console.warn('Could not get ID token:', e); }

  const FUNCTION_URL = 'https://updateschedule-pzzfbon7lq-el.a.run.app';
  let successCount = 0;
  let errors = [];

  for (const job of jobs) {
    try {
      const res = await fetch(FUNCTION_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ jobName: job.name, schedule: job.schedule, enabled: job.enabled, idToken }),
      });
      const data = await res.json();
      if (data.success) successCount++;
      else errors.push(`${job.name}: ${data.error}`);
    } catch(e) {
      errors.push(`${job.name}: ${e.message}`);
    }
  }

  if (statusEl) {
    if (errors.length === 0) {
      statusEl.innerHTML = `<span style="color:#16a34a">✅ All ${successCount} schedules updated successfully in Cloud Scheduler!</span>`;
      showToast('Scheduler synced successfully!', 'success');
    } else {
      statusEl.innerHTML = `<span style="color:#d97706">⚠️ ${successCount} updated · ${errors.length} failed: ${errors.join(', ')}<br/>Use the fallback commands below.</span>`;
      showToast('Some schedules failed — use manual commands', 'warning');
    }
  }
  addAudit('Scheduler Synced', '', jobs.map(j=>`${j.name}:${j.schedule}`).join(' · '));
};

window.testNotification = async function(type) {
  const labelMap = { daily:'Daily Alert', weekly:'Weekly Summary', invoice:'Invoice Reminder' };
  const el = document.getElementById('test-result');
  const btn = document.getElementById(`test-btn-${type}`);

  if (el) el.innerHTML = `<div class="alert alert-info">⏳ Sending ${labelMap[type]} email… please wait a moment.</div>`;
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Sending…'; }

  const cfg = S.notifConfig || {};
  const toEmail = cfg.superadminEmail || SUPERADMIN_EMAIL;

  // The VEMS notification Cloud Function URL — saved in Superadmin Settings
  // Falls back to the scheduler sync URL if a dedicated function URL isn't configured.
  const notifUrl = (cfg.notifFunctionUrl || '').trim();

  try {
    if (!notifUrl) {
      // No dedicated notification function URL configured — show setup instructions
      throw new Error('NO_URL');
    }

    const idToken = await window._auth?.currentUser?.getIdToken() || '';
    const res = await fetch(notifUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'trigger', type, to: toEmail, idToken }),
    });

    // Handle non-JSON responses (e.g. HTML error page)
    const contentType = res.headers.get('content-type') || '';
    const data = contentType.includes('json') ? await res.json() : { ok: false, error: `HTTP ${res.status}` };

    if (res.ok && (data.success || data.ok || data.action === 'triggered')) {
      if (el) el.innerHTML = `<div class="alert alert-success">✅ ${labelMap[type]} email sent! Check <b>${toEmail}</b> inbox in 1–2 minutes.</div>`;
      showToast(`${labelMap[type]} email sent!`, 'success');
      addAudit(`Test ${labelMap[type]} Email Sent`,'',toEmail);
    } else {
      throw new Error(data.error || `HTTP ${res.status}`);
    }

  } catch(e) {
    const isCors = e.message === 'Failed to fetch' || e.message.includes('CORS') || e.message.includes('NetworkError');
    const isNoUrl = e.message === 'NO_URL';

    if (isCors || isNoUrl) {
      // CORS or missing URL — show the gcloud trigger command as the reliable alternative
      const jobMap = {
        daily:   'firebase-schedule-dailyCriticalAlerts-asia-south1',
        weekly:  'firebase-schedule-weeklySummaryReport-asia-south1',
        invoice: 'firebase-schedule-missingInvoiceReminder-asia-south1',
      };
      const cmd = `gcloud scheduler jobs run ${jobMap[type]} --location=asia-south1 --project=skr-mom`;
      if (el) el.innerHTML = `
        <div class="alert alert-warning">
          <div style="font-weight:600;margin-bottom:8px">
            ${isNoUrl ? '⚙️ Notification Function URL not configured.' : '🔒 CORS blocked — browser cannot directly call the Cloud Function.'}
          </div>
          <div style="font-size:12px;margin-bottom:10px">
            ${isNoUrl
              ? 'Enter your VEMS Notification Cloud Function URL in the field below, then try again.'
              : 'The Cloud Scheduler can trigger it directly. Run this command in <a href="https://console.cloud.google.com/cloudshell" target="_blank" style="color:inherit">Cloud Shell</a>:'}
          </div>
          ${!isNoUrl ? `
          <div style="background:#0f1724;border-radius:6px;padding:10px 14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:8px">
            <code style="color:#60a5fa;font-size:11px;word-break:break-all">${cmd}</code>
            <button onclick="navigator.clipboard.writeText('${cmd}');showToast('Copied!')" style="flex-shrink:0;background:#1a56a0;color:#fff;border:none;border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer">📋 Copy</button>
          </div>` : ''}
          <div style="margin-top:10px">
            <label style="font-size:12px;font-weight:500;display:block;margin-bottom:4px">VEMS Notification Function URL (optional):</label>
            <div style="display:flex;gap:6px">
              <input id="notif-fn-url" type="url" class="form-input" style="font-size:12px" placeholder="https://your-function.run.app" value="${notifUrl}"/>
              <button onclick="saveNotifUrl()" style="flex-shrink:0;background:var(--primary);color:#fff;border:none;border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;white-space:nowrap">Save & Retry</button>
            </div>
          </div>
        </div>`;
    } else {
      if (el) el.innerHTML = `<div class="alert alert-danger">❌ ${labelMap[type]} failed: ${e.message}</div>`;
    }
    showToast('Email trigger failed', 'error');
  } finally {
    if (btn) {
      btn.disabled = false;
      const icons = { daily:'🔔 Send Daily Alert Now', weekly:'📊 Send Weekly Summary Now', invoice:'📎 Send Invoice Reminder Now' };
      btn.textContent = icons[type];
    }
  }
};

window.sendMagicLink = async function(email) {
  if (!email) return showToast('Enter email address','error');
  try {
    await sendSignInLinkToEmail(auth, email, ACTION_CODE_SETTINGS);
    localStorage.setItem('vems_magic_email', email);
    showToast(`Magic link sent to ${email}! Valid for 1 hour.`, 'success');
    addAudit('Magic Link Sent', '', email);
  } catch(e) {
    showToast(e.message.replace('Firebase: ','').replace(/\(.*\)/,''), 'error');
  }
};

window.sendMagicLinkToAll = async function() {
  const emails = JSON.parse(localStorage.getItem('vems_topmgmt')||'[]');
  if (!emails.length) return showToast('No top management emails configured','error');
  let sent = 0;
  for (const email of emails) {
    try {
      await sendSignInLinkToEmail(auth, email, ACTION_CODE_SETTINGS);
      sent++;
    } catch(e) { console.error('Failed for', email, e); }
  }
  showToast(`Magic links sent to ${sent} recipient(s)!`, 'success');
  addAudit('Magic Links Sent to All', '', emails.join(', '));
};

window.saveTopMgmtEmails = function() {
  const raw = document.getElementById('topmgmt-emails')?.value || '';
  const emails = raw.split('\n').map(e=>e.trim()).filter(e=>e.includes('@'));
  localStorage.setItem('vems_topmgmt', JSON.stringify(emails));
  TOP_MGMT_EMAILS.length = 0;
  emails.forEach(e=>TOP_MGMT_EMAILS.push(e));
  showToast(`${emails.length} top management email(s) saved!`, 'success');
  addAudit('Top Management Emails Updated', '', emails.join(', '));
};

window.saveVehicle = async function(vehicleId='') {
  const regNo = document.getElementById('v-reg').value.trim();
  const ins = document.getElementById('v-ins').value;
  const puc = document.getElementById('v-puc').value;
  if(!regNo) return showToast('Registration number is required','error');
  if(!ins) return showToast('Insurance expiry date is required','error');
  if(!puc) return showToast('PUC expiry date is required','error');
  const data = {
    regNo, type:document.getElementById('v-type').value,
    make:document.getElementById('v-make').value, model:document.getElementById('v-model').value,
    year:document.getElementById('v-year').value, fuel:document.getElementById('v-fuel').value,
    ownerType:document.getElementById('v-owner').value, plantId:document.getElementById('v-plant').value,
    driverName:document.getElementById('v-driver').value, driverContact:document.getElementById('v-contact').value,
    status:document.getElementById('v-status').value, odometer:parseInt(document.getElementById('v-odo').value)||0,
    insuranceExpiry:ins, pucExpiry:puc,
  };
  try {

};

window.updateExpPlant = function() {
  const sel = document.getElementById('exp-vehicle');
  if(!sel) return;
  const v = S.vehicles.find(x=>x.id===sel.value);
  const el = document.getElementById('exp-plant-show');
  if(el) el.value = v ? plantName(v.plantId) : '';
};
window.toggleFuelFields = function() {
  const cat = document.getElementById('exp-cat')?.value;
  const ff = document.getElementById('fuel-fields');
  if(ff) ff.style.display = cat==='Fuel'?'contents':'none';
};
window.calcTotal = function() {
  const a = parseFloat(document.getElementById('exp-amount')?.value)||0;
  const g = parseFloat(document.getElementById('exp-gst')?.value)||0;
  const el = document.getElementById('exp-total');
  if(el) el.value = '₹' + (a+g).toFixed(2);
};
window.calcDist = function() {
  const odo = parseFloat(document.getElementById('exp-odo')?.value)||0;
  const prev = parseFloat(document.getElementById('exp-prevodo')?.value)||0;
  const dist = odo>prev?odo-prev:0;
  const el = document.getElementById('exp-dist');
  if(el) el.value = dist > 0 ? dist + ' km' : '';
  calcCO2();
};
window.calcCO2 = function() {
  const vehicleId = document.getElementById('exp-vehicle')?.value;
  const v = S.vehicles.find(x=>x.id===vehicleId);
  const fuel = v?.fuel||'Diesel';
  const ef = S.emissionFactors[fuel]||2.68;
  const qty = parseFloat(document.getElementById('exp-fuelqty')?.value)||0;
  const co2 = (qty*ef).toFixed(2);
  const el = document.getElementById('exp-co2');
  if(el) el.value = qty > 0 ? co2 + ' kg CO₂' : '';
};

let pendingBillFile = null;
window.handleBillUpload = function(input) {
  const file = input.files[0];
  if(!file) return;
  pendingBillFile = file;
  const preview = document.getElementById('bill-preview');
  if(!preview) return;

window.saveExpense = async function() {
  const vehicleId = document.getElementById('exp-vehicle')?.value;
  const amount = parseFloat(document.getElementById('exp-amount')?.value);
  const noInv = document.getElementById('exp-no-invoice')?.checked;
  const hasBill = !!pendingBillFile || noInv;
  if(!vehicleId) return showToast('Select a vehicle','error');
  if(!amount) return showToast('Enter a valid amount','error');
  if(!hasBill && !noInv) return showToast('Invoice upload is mandatory. Please upload a bill or check "No Invoice Available".','error');
  const vehicle = S.vehicles.find(v=>v.id===vehicleId);
  const cat = document.getElementById('exp-cat')?.value||'Other';
  const fuelQty = parseFloat(document.getElementById('exp-fuelqty')?.value)||0;
  const fuelRate = parseFloat(document.getElementById('exp-fuelrate')?.value)||0;
  const odo = parseInt(document.getElementById('exp-odo')?.value)||0;
  const prevOdo = parseInt(document.getElementById('exp-prevodo')?.value)||0;
  const dist = odo>prevOdo?odo-prevOdo:0;
  const ef = S.emissionFactors[vehicle?.fuel||'Diesel']||2.68;
  const co2 = cat==='Fuel'&&fuelQty>0?parseFloat((fuelQty*ef).toFixed(2)):0;
  const exp = {
    vehicleId, plantId:vehicle?.plantId||'',
    date:document.getElementById('exp-date')?.value||new Date().toISOString().slice(0,10),
    category:cat, vendor:document.getElementById('exp-vendor')?.value||'',
    invoiceNo:document.getElementById('exp-invno')?.value||'',
    invoiceDate:document.getElementById('exp-invdate')?.value||'',
    amount, gst:parseFloat(document.getElementById('exp-gst')?.value)||0,
    odometer:odo, prevOdometer:prevOdo, distanceTravelled:dist,
    fuelQty, fuelRate, co2Emission:co2, emissionFactor:ef,
    remarks:document.getElementById('exp-remarks')?.value||'',
    hasBill, invoiceException:noInv, billUrl:'',
    enteredBy:S.user?.email||'',
  };
  try {
    await fsAddExpense(exp);
    pendingBillFile = null;
    closeModal(); showToast('Expense saved!'); render();
  } catch(e) { showToast('Error saving expense: '+e.message,'error'); }
};

let bulkPendingData = [];
window.processBulkCSV = function(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const lines = e.target.result.split('\n').filter(l=>l.trim());
    const headers = lines[0].split(',').map(h=>h.trim().toLowerCase());
    const rows = lines.slice(1).map(line => {
      const vals = line.split(',').map(v=>v.trim().replace(/^"|"$/g,''));
      const obj = {};
      headers.forEach((h,i)=>obj[h]=vals[i]||'');
      return obj;
    }).filter(r=>r.date&&r.vehicleregno&&r.amount);

    bulkPendingData = rows.map(r => {
      const vehicle = S.vehicles.find(v=>v.regNo.toLowerCase()===r.vehicleregno?.toLowerCase());
      const fuelQty = parseFloat(r.fuelqty)||0;
      const ef = S.emissionFactors[vehicle?.fuel||'Diesel']||2.68;
      const co2 = r.category==='Fuel'&&fuelQty>0?parseFloat((fuelQty*ef).toFixed(2)):0;
      const dist = (parseInt(r.odometer)||0)-(parseInt(r.prevOdometer||r.prevodometer)||0);
      return {
        id: uid(), vehicleId: vehicle?.id||'', plantId: vehicle?.plantId||myPlantId(),
        date: r.date, category: r.category||'Other',
        amount: parseFloat(r.amount)||0, gst: parseFloat(r.gst)||0,
        vendor: r.vendor||'', invoiceNo: r.invoiceno||r.invoiceno||'',
        odometer: parseInt(r.odometer)||0, prevOdometer: parseInt(r.prevOdometer||r.prevodometer)||0,
        distanceTravelled: dist>0?dist:0,
        fuelQty, fuelRate: parseFloat(r.fuelrate)||0, co2Emission: co2, emissionFactor: ef,
        remarks: r.remarks||'', hasBill: false, enteredBy: S.user?.email||'Bulk Import',
        createdAt: new Date().toISOString(), _vehicleReg: r.vehicleregno,
        _valid: !!vehicle,
      };
    });

    const valid = bulkPendingData.filter(r=>r._valid).length;
    const invalid = bulkPendingData.filter(r=>!r._valid);
    const preview = document.getElementById('bulk-preview');
    const importBtn = document.getElementById('bulk-import-btn');
    if (preview) preview.innerHTML = `
      <div class="alert ${valid>0?'alert-success':'alert-danger'} mb-4">
        ✅ <b>${valid}</b> valid rows ready to import · ❌ <b>${invalid.length}</b> rows with unknown vehicle reg nos
      </div>
      ${invalid.length?`<div style="font-size:12px;color:var(--danger);margin-bottom:8px">Unknown vehicles: ${invalid.map(r=>r._vehicleReg).join(', ')}</div>`:''}
      <div class="table-wrap" style="max-height:240px;overflow-y:auto"><table>
        <thead><tr><th>Date</th><th>Vehicle</th><th>Category</th><th>Amount</th><th>Vendor</th><th>Status</th></tr></thead>
        <tbody>${bulkPendingData.map(r=>`<tr style="${r._valid?'':'background:#fef2f2'}">
          <td>${r.date}</td><td>${r._vehicleReg}</td><td>${r.category}</td>
          <td>${fmtR(r.amount)}</td><td>${r.vendor||'—'}</td>
          <td>${r._valid?'<span class="badge badge-success">✅ Ready</span>':'<span class="badge badge-danger">❌ Vehicle not found</span>'}</td>
        </tr>`).join('')}</tbody>
      </table></div>`;
    if (importBtn) importBtn.style.display = valid>0?'block':'none';
  };
  reader.readAsText(file);
};

window.importBulkExpenses = async function() {
  const valid = bulkPendingData.filter(r=>r._valid);
  if (!valid.length) return;
  const btn = document.getElementById('bulk-import-btn');
  if (btn) { btn.textContent='Importing…'; btn.disabled=true; }
  try {
    const cleaned = valid.map(({_valid,_vehicleReg,...exp})=>exp);
    const count = await fsBulkAddExpenses(cleaned);
    bulkPendingData = [];
    closeModal();
    showToast(`✅ ${count} expenses imported to Firestore!`, 'success');
    render();
  } catch(e) { showToast('Import error: '+e.message,'error'); }
};

};

// ── EXPORT ALL REPORTS PDF ────────────────────────────────────────
window.exportAllReportsPDF = function() {
  try {
    const {jsPDF} = window.jspdf;
    const doc = new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
    const exps = filteredExpenses();
    const maintCats = ['Maintenance','Repair','Tyres','Battery','Spare Parts','Breakdown','Washing'];
    const pageW = doc.internal.pageSize.getWidth();
    let y = 0;

    function addPage(title, subtitle='') {
      doc.addPage();
      y = 18;
      doc.setFillColor(15,23,36);
      doc.rect(0,0,pageW,28,'F');
      // Logo in header
      if (S.companyLogo) {
        try { doc.addImage(S.companyLogo,'PNG', pageW-30, 2, 24, 24); } catch(e) {}
      }
      doc.setTextColor(255,255,255);
      doc.setFontSize(14); doc.setFont(undefined,'bold');
      doc.text('VEMS — ' + title, 14, 12);
      doc.setFontSize(9); doc.setFont(undefined,'normal');
      doc.text(subtitle || ('Generated: ' + new Date().toLocaleDateString('en-IN') + ' · Year: ' + S.filterYear + (S.filterMonth?' · Month: '+MONTHS.find(m=>m.val===S.filterMonth)?.label:'')), 14, 20);
      doc.setTextColor(0,0,0);
      y = 34;
    }

    function sectionTitle(text) {
      if (y > 260) { doc.addPage(); y = 20; }
      doc.setFontSize(11); doc.setFont(undefined,'bold');
      doc.setTextColor(26,86,160);
      doc.text(text, 14, y); y += 6;
      doc.setDrawColor(26,86,160); doc.setLineWidth(0.3);
      doc.line(14, y, pageW-14, y); y += 5;
      doc.setTextColor(0,0,0); doc.setFont(undefined,'normal');
    }

    function tableRow(cols, widths, bold=false, bg=null) {
      if (y > 270) { doc.addPage(); y = 20; }
      if (bg) { doc.setFillColor(...bg); doc.rect(14,y-4,pageW-28,7,'F'); }
      doc.setFontSize(8);
      doc.setFont(undefined, bold?'bold':'normal');
      let x = 14;
      cols.forEach((c,i)=>{ doc.text(String(c).slice(0,30), x, y); x += widths[i]; });
      y += 6;
    }

    // ── Cover page ──
    doc.setFillColor(15,23,36);
    doc.rect(0,0,pageW,297,'F');
    // Add logo if available
    if (S.companyLogo) {
      try { doc.addImage(S.companyLogo, 'PNG', pageW/2-20, 30, 40, 40); } catch(e) {}
    }
    doc.setTextColor(255,255,255);
    doc.setFontSize(32); doc.setFont(undefined,'bold');
    doc.text('VEMS', pageW/2, S.companyLogo?82:80, {align:'center'});
    doc.setFontSize(18); doc.setFont(undefined,'normal');
    doc.text('Vehicle Expense Management', pageW/2, S.companyLogo?94:96, {align:'center'});
    doc.text('Complete Fleet Report', pageW/2, S.companyLogo?104:106, {align:'center'});
    doc.setFontSize(12);
    doc.text(S.orgName, pageW/2, S.companyLogo?120:125, {align:'center'});
    doc.setFontSize(10); doc.setTextColor(150,150,180);
    doc.text('Year: ' + S.filterYear + (S.filterMonth?' | Month: '+MONTHS.find(m=>m.val===S.filterMonth)?.label:'') + (S.filterPlant?' | Plant: '+plantName(S.filterPlant):'| All Plants'), pageW/2, 140, {align:'center'});
    doc.text('Generated: ' + new Date().toLocaleString('en-IN'), pageW/2, 150, {align:'center'});

    // ── Page 1: Summary ──
    addPage('Expense Summary', 'All categories · ' + S.filterYear);
    const total = exps.reduce((s,e)=>s+e.amount,0);
    const co2T = exps.reduce((s,e)=>s+(e.co2Emission||0),0);
    const withBill = exps.filter(e=>e.hasBill).length;

    sectionTitle('Key Metrics');
    [['Total Expenses', fmtR(total)],['Total Records',exps.length],['CO₂ Emissions',co2T.toFixed(0)+' kg'],['Invoice Compliance',exps.length?Math.round(withBill/exps.length*100)+'%':'0%'],['Missing Bills',exps.length-withBill]].forEach(([l,v])=>{
      doc.setFontSize(9); doc.text(l+':', 14, y); doc.setFont(undefined,'bold'); doc.text(String(v), 80, y); doc.setFont(undefined,'normal'); y += 6;
    });
    y += 4;

    sectionTitle('Plant-wise Breakdown');
    tableRow(['Plant','Code','Expenses','CO₂ (kg)'],[70,25,50,30], true, [240,244,248]);
    myPlants().forEach(p=>{
      const pTotal = exps.filter(e=>e.plantId===p.id).reduce((s,e)=>s+e.amount,0);
      const pCO2 = exps.filter(e=>e.plantId===p.id).reduce((s,e)=>s+(e.co2Emission||0),0);
      tableRow([p.name.slice(0,30), p.code, fmtR(pTotal), pCO2.toFixed(0)+' kg'],[70,25,50,30]);
    });
    y += 4;

    sectionTitle('Category-wise Breakdown');
    tableRow(['Category','Amount','% of Total'],[80,50,40], true, [240,244,248]);
    EXPENSE_CATEGORIES.forEach(c=>{
      const ct=exps.filter(e=>e.category===c).reduce((s,e)=>s+e.amount,0);
      if(ct>0) tableRow([c, fmtR(ct), total?Math.round(ct/total*100)+'%':'0%'],[80,50,40]);
    });

    // ── Page 2: Maintenance & Repair ──
    addPage('Maintenance & Repair Report');
    const maintExps = exps.filter(e=>maintCats.includes(e.category));
    const maintTotal = maintExps.reduce((s,e)=>s+e.amount,0);

    sectionTitle('M&R Summary');
    doc.setFontSize(9);
    doc.text(`Total M&R Cost: ${fmtR(maintTotal)}  |  Records: ${maintExps.length}  |  % of Total: ${total?Math.round(maintTotal/total*100)+'%':'0%'}`, 14, y); y+=8;

    sectionTitle('Category-wise M&R');
    tableRow(['Category','Amount','Count'],[80,50,40], true, [240,244,248]);
    maintCats.forEach(c=>{
      const cE=maintExps.filter(e=>e.category===c);
      if(cE.length) tableRow([c, fmtR(cE.reduce((s,e)=>s+e.amount,0)), cE.length],[80,50,40]);
    });
    y += 4;

    sectionTitle('Vehicle-wise M&R');
    tableRow(['Vehicle','Plant','M&R Cost','Count','Last Service'],[45,20,40,20,40], true, [240,244,248]);
    myVehicles().forEach(v=>{
      const vM=maintExps.filter(e=>e.vehicleId===v.id);
      if(!vM.length) return;
      const last=vM.sort((a,b)=>b.date.localeCompare(a.date))[0]?.date;
      tableRow([v.regNo, S.plants.find(p=>p.id===v.plantId)?.code||'—', fmtR(vM.reduce((s,e)=>s+e.amount,0)), vM.length, fmtDate(last)],[45,20,40,20,40]);
    });

    // ── Page 3: Vehicle-wise Full Report ──
    addPage('Vehicle-wise Full Report');
    sectionTitle('All Vehicles');
    tableRow(['Vehicle','Reg No','Total','Fuel','M&R','CO₂','Mileage'],[30,28,28,28,28,20,22], true, [240,244,248]);
    myVehicles().forEach(v=>{
      const vE=exps.filter(e=>e.vehicleId===v.id);
      const tot=vE.reduce((s,e)=>s+e.amount,0);
      const fuel=vE.filter(e=>e.category==='Fuel').reduce((s,e)=>s+e.amount,0);
      const maint=vE.filter(e=>maintCats.includes(e.category)).reduce((s,e)=>s+e.amount,0);
      tableRow([v.make+' '+v.model.slice(0,8), v.regNo, fmtR(tot), fmtR(fuel), fmtR(maint), getCO2Total(v.id).toFixed(0)+' kg', getAvgMileage(v.id)+' km/L'],[30,28,28,28,28,20,22]);
    });

    // ── Page 4: CO₂ Report ──
    addPage('CO₂ Emissions Report');
    const totalCO2 = exps.reduce((s,e)=>s+(e.co2Emission||0),0);
    const totalDist = exps.filter(e=>e.category==='Fuel').reduce((s,e)=>s+(e.distanceTravelled||0),0);
    sectionTitle('CO₂ Summary');
    [['Total CO₂',totalCO2.toFixed(2)+' kg'],['CO₂ in Tonnes',(totalCO2/1000).toFixed(4)+' t CO₂e'],['Total Distance',fmt(totalDist.toFixed(0))+' km'],['CO₂ per KM',totalDist>0?(totalCO2/totalDist).toFixed(4)+' kg/km':'—']].forEach(([l,v])=>{
      doc.setFontSize(9); doc.text(l+':', 14, y); doc.setFont(undefined,'bold'); doc.text(String(v), 80, y); doc.setFont(undefined,'normal'); y+=6;
    });
    y+=4;
    sectionTitle('Vehicle-wise CO₂');
    tableRow(['Vehicle','Fuel','CO₂ (kg)','Distance','CO₂/km'],[40,25,35,35,35], true, [240,244,248]);
    myVehicles().map(v=>({...v,co2:getCO2Total(v.id),dist:getTotalDistance(v.id)})).sort((a,b)=>b.co2-a.co2).forEach(v=>{
      tableRow([v.regNo, v.fuel, v.co2.toFixed(1), fmt(v.dist.toFixed(0))+' km', v.dist>0?(v.co2/v.dist).toFixed(3):0],[40,25,35,35,35]);
    });

    // ── Page 5: Invoice Compliance ──
    addPage('Invoice Compliance Report');
    sectionTitle('Compliance by Category');
    tableRow(['Category','Total','With Bill','Without','Compliance'],[50,25,25,25,30], true, [240,244,248]);
    EXPENSE_CATEGORIES.forEach(cat=>{
      const cE=exps.filter(e=>e.category===cat);
      if(!cE.length) return;
      const wb=cE.filter(e=>e.hasBill).length;
      tableRow([cat, cE.length, wb, cE.length-wb, Math.round(wb/cE.length*100)+'%'],[50,25,25,25,30]);
    });

    doc.save(`VEMS_Complete_Report_${S.filterYear}${S.filterMonth?'_'+S.filterMonth:''}.pdf`);
    showToast('Complete PDF report exported!');
  } catch(e) {
    console.error(e);
    showToast('PDF export failed: '+e.message, 'error');
  }
};

function downloadCSV(rows, filename) {
  const csv = rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,\uFEFF'+encodeURIComponent(csv);
  a.download = filename; a.click();
  showToast('CSV exported!');
}

  window.navigate = navigate;
  window.doLogout = doLogout;
  window.S = S;
  window.render = render;
}

// Expose globally at load time too (for inline onclick before first bindAll)

  const sb = document.getElementById('sidebar');
  const ov = document.getElementById('sidebar-overlay');
  if(sb) sb.classList.toggle('open');
  if(ov) ov.classList.toggle('open');
