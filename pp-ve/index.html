// Generate sample expenses
function genExpenses() {
  const exps = [];
  let id = 1;
  const months = ['2026-01','2026-02','2026-03','2026-04','2026-05','2026-06','2026-07','2026-08'];
  VEHICLES.forEach(v => {
    months.forEach((m, mi) => {
      const fuelQty = v.type==='HCV' ? 200 : v.type==='Bus' ? 140 : 55;
      const rate = v.fuel==='Diesel' ? 93 : 107;
      exps.push({ id:`exp-${id++}`, vehicleId:v.id, plantId:v.plantId, date:`${m}-10`, category:'Fuel', amount:Math.round(fuelQty*rate), fuelQty, vendor:'HP Petroleum', hasBill:true });
      if (mi%2===0) exps.push({ id:`exp-${id++}`, vehicleId:v.id, plantId:v.plantId, date:`${m}-20`, category:'Maintenance', amount:Math.round(3000+Math.random()*5000), fuelQty:0, vendor:'Speed Motors', hasBill:true });
    });
  });
  return exps;
}
const EXPENSES = genExpenses();

const SUPERADMIN_EMAILS = ['superadmin@skr.com', 'admin@qmsgalaxy.com'];

// ── STATE ─────────────────────────────────────────────────────────

};

function checkSuperAdmin(user) {
  return user && SUPERADMIN_EMAILS.includes(user.email);
}

// ── HELPERS ───────────────────────────────────────────────────────
const fmt = n => Number(n||0).toLocaleString('en-IN');
const fmtRupee = n => '₹' + fmt(n);
const fmtDate = d => d ? new Date(d).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}) : '—';
const daysLeft = d => { if(!d) return 9999; return Math.ceil((new Date(d)-new Date())/86400000); };
const severity = dl => dl<0?'expired':dl<=15?'critical':dl<=30?'warning':dl<=60?'notice':'ok';
const sevColor = s => ({expired:'#dc2626',critical:'#ea580c',warning:'#d97706',notice:'#0ea5e9',ok:'#16a34a'}[s]||'#6b7280');

function getAlerts(days=60) {
  const alerts = [];
  state.vehicles.forEach(v => {
    [['insuranceExpiry','Insurance'],['pollutionExpiry','Pollution Certificate'],['fitnessExpiry','Fitness Certificate']].forEach(([field,label]) => {
      const dl = daysLeft(v[field]);
      if (dl<=days) alerts.push({ regNo:v.regNo, docType:label, expiryDate:v[field], daysLeft:dl, severity:severity(dl), plantId:v.plantId });
    });
  });
  return alerts.sort((a,b)=>a.daysLeft-b.daysLeft);
}

function getStats() {
  const exps = filteredExpenses();
  const total = exps.reduce((s,e)=>s+e.amount,0);
  const fuel = exps.filter(e=>e.category==='Fuel').reduce((s,e)=>s+e.amount,0);
  const fuelL = exps.filter(e=>e.category==='Fuel').reduce((s,e)=>s+(e.fuelQty||0),0);
  return { totalExpenses:total, totalFuel:fuelL, totalVehicles:state.vehicles.length, activeVehicles:state.vehicles.filter(v=>v.status==='active').length, totalPlants:state.plants.length, avgMileage:fuelL>0?(exps.reduce((s,e)=>s+(e.fuelQty||0)*8.5,0)/fuelL).toFixed(1):0, co2:Math.round(fuelL*2.68), costPerKm:fuelL>0?(total/(fuelL*8.5)).toFixed(1):0 };
}

function filteredExpenses() {
  return state.expenses.filter(e => {
    if (state.filterPlant && e.plantId!==state.filterPlant) return false;
    if (state.filterMonth && !e.date.startsWith(state.filterMonth)) return false;
    return true;
  });
}

function showToast(msg, type='success') {
  state.toast = {msg, type};
  render();
  setTimeout(()=>{ state.toast=null; render(); }, 3000);
}

// ── AUTH ──────────────────────────────────────────────────────────
onAuthStateChanged(auth, user => {
  state.user = user;
  state.isSuperAdmin = checkSuperAdmin(user);
  if (user) { state.page='dashboard'; render(); }
  else { state.page='login'; render(); }
});

async function doLogin(email, password) {
  try {
    await signInWithEmailAndPassword(auth, email, password);
  } catch(e) {
    showToast(e.message.replace('Firebase: ','').replace(/\(.*\)/,''), 'error');
  }
}

async function doLogout() {
  await signOut(auth);
}

// ── ROUTER ────────────────────────────────────────────────────────
function navigate(page) {
  state.page = page;
  // destroy old charts
  Object.values(state.charts).forEach(c => c.destroy && c.destroy());
  state.charts = {};
  render();
}

// ── RENDER ────────────────────────────────────────────────────────
function render() {
  const root = document.getElementById('root');
  if (!root) return;

  if (!state.user) { root.innerHTML = loginHTML(); bindLogin(); return; }

  root.innerHTML = `
    <div class="app-layout">
      ${sidebarHTML()}
      <div class="main-content">
        ${pageHTML()}
      </div>
    </div>
    ${state.toast ? `<div class="toast toast-${state.toast.type}">${state.toast.msg}</div>` : ''}
  `;
  bindAll();
  if (state.page==='dashboard') initCharts();
}

function bindLogin() {
  document.getElementById('login-btn')?.addEventListener('click', async () => {
    const email = document.getElementById('login-email').value;
    const pw = document.getElementById('login-password').value;
    if (!email||!pw) return showToast('Enter email and password','error');
    document.getElementById('login-btn').textContent = 'Signing in…';
    await doLogin(email, pw);
    document.getElementById('login-btn').textContent = 'Sign In';
  });
  document.getElementById('login-email')?.addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('login-btn').click(); });
  document.getElementById('login-password')?.addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('login-btn').click(); });
}

function pageHTML() {
  switch(state.page) {
    case 'dashboard':   return dashboardHTML();
    case 'vehicles':    return vehiclesHTML();
    case 'expenses':    return expensesHTML();
    case 'alerts':      return alertsHTML();
    case 'reports':     return reportsHTML();
    case 'plants':      return plantsHTML();
    case 'users':       return usersHTML();
    case 'superadmin':  return state.isSuperAdmin ? superadminHTML() : dashboardHTML();
    default:            return dashboardHTML();
  }
}

function kpi(label, value, sub, color) {
  return `<div class="kpi-card" style="--kpi-color:${color}">
    <div class="kpi-label">${label}</div>
    <div class="kpi-value">${value}</div>
    <div class="kpi-sub">${sub}</div>
  </div>`;
}

function initCharts() {
  const exps = filteredExpenses();
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug'];
  const monthKeys = ['2026-01','2026-02','2026-03','2026-04','2026-05','2026-06','2026-07','2026-08'];

  // Monthly chart
  const mc = document.getElementById('chart-monthly');
  if (mc) {
    state.charts.monthly = new Chart(mc, {
      type:'bar',
      data:{
        labels:months,
        datasets:[{
          label:'Expenses (₹)',
          data:monthKeys.map(m=>exps.filter(e=>e.date.startsWith(m)).reduce((s,e)=>s+e.amount,0)),
          backgroundColor:'#1a56a0',borderRadius:4
        }]
      },
      options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{ticks:{callback:v=>'₹'+(v/1000).toFixed(0)+'k'}}}}
    });
  }

  // Category pie
  const cats = EXPENSE_CATEGORIES.slice(0,6);
  const cc = document.getElementById('chart-category');
  if (cc) {
    state.charts.category = new Chart(cc, {
      type:'doughnut',
      data:{
        labels:cats,
        datasets:[{
          data:cats.map(cat=>exps.filter(e=>e.category===cat).reduce((s,e)=>s+e.amount,0)),
          backgroundColor:['#1a56a0','#0ea5e9','#16a34a','#d97706','#dc2626','#7c3aed']
        }]
      },
      options:{responsive:true,plugins:{legend:{position:'right',labels:{font:{size:11}}}}}
    });
  }
}

    <div class="page-header">
      <div><h1 class="page-title">Document Alerts</h1><p class="page-subtitle">${alerts.length} documents expiring within 90 days</p></div>
    </div>
    ${['expired','critical','warning','notice'].map(sev=>{
      const group = alerts.filter(a=>a.severity===sev);
      if (!group.length) return '';
      return `
      <div class="card mb-4">
        <div class="card-title" style="color:${sevColor(sev)}">
          ${sev==='expired'?'❌ Expired':sev==='critical'?'🔴 Critical (≤15 days)':sev==='warning'?'🟡 Warning (≤30 days)':'🔵 Notice (≤60 days)'}
          <span class="badge" style="background:${sevColor(sev)}20;color:${sevColor(sev)}">${group.length}</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Vehicle</th><th>Document</th><th>Expiry Date</th><th>Days Left</th><th>Plant</th></tr></thead>
            <tbody>
              ${group.map(a=>`
              <tr>
                <td><b>${a.regNo}</b></td>
                <td>${a.docType}</td>
                <td>${fmtDate(a.expiryDate)}</td>
                <td style="color:${sevColor(a.severity)};font-weight:700">${a.daysLeft<0?'EXPIRED ('+Math.abs(a.daysLeft)+'d ago)':a.daysLeft+' days'}</td>
                <td>${state.plants.find(p=>p.id===a.plantId)?.code||'—'}</td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

// REPORTS
function reportsHTML() {
  const exps = filteredExpenses();
  const byPlant = state.plants.map(p=>({ name:p.name, total:exps.filter(e=>e.plantId===p.id).reduce((s,e)=>s+e.amount,0) }));
  const byCat = EXPENSE_CATEGORIES.map(cat=>({ cat, total:exps.filter(e=>e.category===cat).reduce((s,e)=>s+e.amount,0) })).filter(c=>c.total>0).sort((a,b)=>b.total-a.total);
  const grandTotal = exps.reduce((s,e)=>s+e.amount,0);
  return `
  <div class="page">
    <div class="page-header">
      <div><h1 class="page-title">Reports</h1><p class="page-subtitle">Grand Total: ${fmtRupee(grandTotal)}</p></div>
      <div class="page-actions">
        <select class="form-select" onchange="state.filterPlant=this.value;render()">
          <option value="">All Plants</option>
          ${state.plants.map(p=>`<option value="${p.id}" ${state.filterPlant===p.id?'selected':''}>${p.code}</option>`).join('')}
        </select>
        <select class="form-select" onchange="state.filterMonth=this.value;render()">
          <option value="">All Months</option>
          ${['2026-01','2026-02','2026-03','2026-04','2026-05','2026-06','2026-07','2026-08'].map(m=>`<option value="${m}" ${state.filterMonth===m?'selected':''}>${m}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="chart-grid">
      <div class="card">
        <div class="card-title">Plant-wise Expenses</div>
        ${byPlant.map(p=>`
        <div class="report-row">
          <span>${p.name}</span>
          <div class="report-bar-wrap"><div class="report-bar" style="width:${grandTotal?Math.round(p.total/grandTotal*100):0}%;background:#1a56a0"></div></div>
          <span class="font-semibold">${fmtRupee(p.total)}</span>
        </div>`).join('')}
      </div>
      <div class="card">
        <div class="card-title">Category-wise Expenses</div>
        ${byCat.slice(0,8).map((c,i)=>`
        <div class="report-row">
          <span>${c.cat}</span>
          <div class="report-bar-wrap"><div class="report-bar" style="width:${grandTotal?Math.round(c.total/grandTotal*100):0}%;background:${['#1a56a0','#0ea5e9','#16a34a','#d97706','#dc2626','#7c3aed','#0891b2','#ea580c'][i]}"></div></div>
          <span class="font-semibold">${fmtRupee(c.total)}</span>
        </div>`).join('')}
      </div>
    </div>
  </div>`;
}

window.saveSuperadminSettings = function() {
  showToast('Settings saved successfully!', 'success');
};

window.deletePlant = function(plantId) {
  const plant = state.plants.find(p=>p.id===plantId);
  const vehicleCount = state.vehicles.filter(v=>v.plantId===plantId).length;
  if (vehicleCount > 0) return showToast(`Cannot delete: ${vehicleCount} vehicles assigned to this plant`, 'error');
  if (!confirm(`Delete plant "${plant?.name}"? This cannot be undone.`)) return;
  state.plants = state.plants.filter(p=>p.id!==plantId);
  showToast('Plant deleted successfully!');
  render();
};

function showAddPlantModal() {
  document.getElementById('modal-root').innerHTML = `
  <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-header"><h2>Add New Plant</h2><button onclick="closeModal()">✕</button></div>

        <div class="form-group"><label class="form-label">Location</label><input id="p-loc" type="text" class="form-input" placeholder="Gurugram, Haryana" /></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="savePlant()">Add Plant</button>
      </div>
    </div>
  </div>`;
}

window.savePlant = function() {
  const name = document.getElementById('p-name').value.trim();
  const code = document.getElementById('p-code').value.trim().toUpperCase();
  const location = document.getElementById('p-loc').value.trim();
  if (!name || !code || !location) return showToast('Fill all fields','error');
  state.plants.push({ id:'plant-'+Date.now(), name, code, location });
  closeModal();
  showToast('Plant added successfully!');
  render();
};

function showAddExpenseModal() {
  document.getElementById('modal-root').innerHTML = `
  <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-header"><h2>Add Expense</h2><button onclick="closeModal()">✕</button></div>
      <div class="modal-body">

        <div class="form-group"><label class="form-label">Date</label><input id="exp-date" type="date" class="form-input" value="${new Date().toISOString().slice(0,10)}" /></div>
        <div class="form-group"><label class="form-label">Category</label>
          <select id="exp-cat" class="form-select">
            ${EXPENSE_CATEGORIES.map(c=>`<option>${c}</option>`).join('')}
          </select></div>
        <div class="form-group"><label class="form-label">Amount (₹)</label><input id="exp-amount" type="number" class="form-input" placeholder="5000" /></div>
        <div class="form-group"><label class="form-label">Vendor</label><input id="exp-vendor" type="text" class="form-input" placeholder="HP Petroleum" /></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveExpense()">Save Expense</button>
      </div>
    </div>
  </div>`;
}

window.saveExpense = function() {
  const vehicleId = document.getElementById('exp-vehicle').value;
  const vehicle = state.vehicles.find(v=>v.id===vehicleId);
  const amount = parseFloat(document.getElementById('exp-amount').value);
  if (!amount) return showToast('Enter a valid amount','error');
  const exp = {
    id:`exp-${Date.now()}`, vehicleId,
    plantId: vehicle?.plantId||'',
    date: document.getElementById('exp-date').value,
    category: document.getElementById('exp-cat').value,
    vendor: document.getElementById('exp-vendor').value,
    amount, fuelQty:0, hasBill:false,
    createdAt: new Date().toISOString(),
  };
  state.expenses.unshift(exp);
  closeModal();
  showToast('Expense added successfully!');
  render();
};

function showAddVehicleModal() {
  document.getElementById('modal-root').innerHTML = `
  <div class="modal-overlay" onclick="if(event.target===this)closeModal()">

        <div class="form-group"><label class="form-label">Plant</label>

      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveVehicle()">Save Vehicle</button>
      </div>

  </div>`;
}

window.saveVehicle = function() {
  const regNo = document.getElementById('v-reg').value.trim();
  if (!regNo) return showToast('Enter registration number','error');
  state.vehicles.push({
    id:`v-${Date.now()}`, regNo,
    make: document.getElementById('v-make').value,
    model: document.getElementById('v-model').value,
    plantId: document.getElementById('v-plant').value,
    insuranceExpiry: document.getElementById('v-ins').value,
    status:'active', odometer:0, fuel:'Diesel', type:'LCV',
  });
  closeModal();
  showToast('Vehicle added successfully!');
  render();
};

window.closeModal = function() {
  const mr = document.getElementById('modal-root');

};

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#1a56a0;--primary-light:#e8f0fb;--accent:#0ea5e9;
  --success:#16a34a;--warning:#d97706;--danger:#dc2626;
  --gray-50:#f9fafb;--gray-100:#f3f4f6;--gray-200:#e5e7eb;
  --gray-300:#d1d5db;--gray-400:#9ca3af;--gray-500:#6b7280;
  --gray-600:#4b5563;--gray-700:#374151;--gray-800:#1f2937;--gray-900:#111827;
  --sidebar-w:240px;--radius:8px;--radius-lg:12px;

}
body{background:var(--gray-50);color:var(--gray-900);line-height:1.5;font-size:14px}

/* LOGIN */

.login-footer{text-align:center;font-size:12px;color:var(--gray-400);margin-top:20px}

/* LAYOUT */
.app-layout{display:flex;min-height:100vh}

.user-name{font-size:13px;font-weight:600;color:#e2e8f0}
.user-role{font-size:11px;color:#64748b}

.sidebar-section-label{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:#475569;padding:0 8px;margin-bottom:6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:6px;font-size:13.5px;color:#94a3b8;cursor:pointer;transition:all .15s;margin-bottom:1px;border:none;background:none;width:100%;text-align:left}

.sidebar-footer{margin-top:auto;padding:12px}
.main-content{margin-left:var(--sidebar-w);flex:1}

/* PAGE */
.page{padding:24px;max-width:1400px}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}

.card{background:#fff;border-radius:var(--radius-lg);border:1px solid var(--gray-200);padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
.card-title{font-size:15px;font-weight:600;color:var(--gray-800);margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;font-weight:600;color:var(--gray-500);padding:10px 12px;border-bottom:1px solid var(--gray-200);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--gray-100);font-size:13px;color:var(--gray-700)}
tr:hover td{background:var(--gray-50)}
.text-right{text-align:right}
.font-semibold{font-weight:600}

/* FORMS */
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:13px;font-weight:500;color:var(--gray-700);margin-bottom:6px}
.form-input,.form-select{width:100%;padding:9px 12px;border:1px solid var(--gray-300);border-radius:var(--radius);font-size:14px;font-family:inherit;outline:none;transition:border .15s;background:#fff;color:var(--gray-900)}
.form-input:focus,.form-select:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius);font-size:13.5px;font-weight:500;cursor:pointer;border:none;transition:all .15s;font-family:inherit}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:#154a8a}
.btn-secondary{background:var(--gray-100);color:var(--gray-700);border:1px solid var(--gray-200)}.btn-secondary:hover{background:var(--gray-200)}
.btn-ghost{background:none;color:var(--gray-500);padding:4px 8px}.btn-ghost:hover{background:var(--gray-100);color:var(--gray-700)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-link{background:none;border:none;color:inherit;text-decoration:underline;cursor:pointer;font-weight:600;padding:0}
.w-full{width:100%;justify-content:center}

/* BADGE */
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}

/* ALERT */
.alert{display:flex;align-items:center;gap:8px;padding:12px 16px;border-radius:var(--radius);font-size:13.5px;margin-bottom:12px}
.alert-danger{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
.alert-warning{background:#fffbeb;color:#92400e;border:1px solid #fde68a}
.mb-4{margin-bottom:16px}
.mt-4{margin-top:16px}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:999;padding:20px}
.modal{background:#fff;border-radius:16px;width:100%;max-width:500px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--gray-200)}
.modal-header h2{font-size:17px;font-weight:600}
.modal-header button{background:none;border:none;font-size:18px;cursor:pointer;color:var(--gray-400);line-height:1}
.modal-body{padding:24px}
.modal-footer{padding:16px 24px;border-top:1px solid var(--gray-200);display:flex;justify-content:flex-end;gap:8px}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:var(--radius);font-size:13.5px;font-weight:500;z-index:9999;box-shadow:var(--shadow-md);animation:slideup .2s ease}
.toast-success{background:#16a34a;color:#fff}
.toast-error{background:#dc2626;color:#fff}
.toast-warning{background:#d97706;color:#fff}
@keyframes slideup{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}

/* REPORTS */
.report-row{display:flex;align-items:center;gap:12px;margin-bottom:12px;font-size:13px}
.report-row>span:first-child{width:180px;flex-shrink:0;color:var(--gray-600);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.report-bar-wrap{flex:1;background:var(--gray-100);border-radius:4px;height:8px;overflow:hidden}
.report-bar{height:100%;border-radius:4px;transition:width .5s ease}
.report-row .font-semibold{width:100px;text-align:right;flex-shrink:0}

/* KPI mini */
.kpi-mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi-value-sm{font-size:18px;font-weight:700;color:var(--gray-900);margin-top:2px}

@media(max-width:768px){
  .sidebar{transform:translateX(-100%)}
  .main-content{margin-left:0}
  .chart-grid{grid-template-columns:1fr}
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div id="root"><div style="display:flex;height:100vh;align-items:center;justify-content:center;font-size:18px;color:#6b7280">Loading VEMS…</div></div>
</body>
</html>
